os": [], "meio_ambiente": [{"id": 143789, "titulo": "Reino Unido vai investir R$ 2,7 bi em proteção de florestas no Brasil", "url": "https://www.cnnbrasil.com.br/nacional/brasil/reino-unido-vai-investir-r-27-bi-em-protecao-de-florestas-no-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-03T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo britânico planeja investir 2,7 bilhões de reais em um mecanismo financeiro internacional proposto pelo governo brasileiro para incentivar a preservação das florestas tropicais em países em desenvolvimento.", "titulo_pt": "Reino Unido vai investir R$ 2,7 bi em proteção de florestas no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 143967, "titulo": "Organizaciones exigen reactivar normas ambientales al Gobierno y advierten sus efectos en la salud", "url": "https://www.latercera.com/sustentabilidad/noticia/organizaciones-exigen-reactivar-normas-ambientales-al-gobierno-y-advierten-sus-efectos-en-la-salud/", "fonte_id": "la_tercera", "data_pub": "2026-09-03T20:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de 50 organizações, sociedades científicas e profissionais de saúde pediram ao Ministério do Meio Ambiente que reingrassem duas normas ambientais retiradas há cinco meses. Eles alertam que a postergação dessas normas mantém os padrões atrasados e retarda benefícios sanitários, como a redução de doenças, hospitalizações e mortes prematuras.", "titulo_pt": "Organizações exigem reativação de normas ambientais ao governo e advertem sobre efeitos na saúde", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 143054, "titulo": "BoM forecasts strongest El Niño on record as research points to ‘alarming’ climate change influence", "url": "https://www.theguardian.com/australia-news/2026/sep/04/bom-forecasts-strongest-el-nino-on-record-as-research-points-to-alarming-climate-change-influence", "fonte_id": "guardian_world", "data_pub": "2026-09-03T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Bureau of Meteorology prevê que o fenômeno El Niño será o mais forte já registrado, com a temperatura do Pacífico superando 2°C em seis meses. Pesquisas sugerem que o aquecimento global reduziu as chances de o El Niño atingir novos recordes de temperatura.", "titulo_pt": "Bom prevê El Niño mais forte na história com forte influência do aquecimento global", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 143249, "titulo": "Chilean penguins fitted with vests to protect healing wounds", "url": "http://www.euronews.com/video/2026/09/03/chilean-penguins-fitted-with-vests-to-protect-healing-wounds", "fonte_id": "euronews", "data_pub": "2026-09-03T14:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pinguins de Humboldt feridos no Chile estão sendo equipados com coletes de recuperação projetados para proteger feridas e prevenir o dano a suturas em processo de cura.", "titulo_pt": "Pinguins de humboldt no chile recebem coletes para proteger feridas em cura", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 143212, "titulo": "France recorded 'hottest summer ever,' says environment minister", "url": "https://www.lemonde.fr/en/france/article/2026/09/03/france-recorded-hottest-summer-ever-says-environment-minister_6757121_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-03T13:14:00Z", "idioma": "en", "provavel_duplicata_de": 143210, "texto_pt": "A França registrou o verão mais quente da história, juntamente com Bélgica e Grã-Bretanha, após uma estação que assustou a Europa, a continente que está aquecendo mais rapidamente no globo.", "titulo_pt": "França registrou 'verão mais quente da história', diz ministro do meio ambiente", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 141945, "titulo": "Indonésia: incêndios florestais ameaçam liberar \"bombas\" de carbono", "url": "https://www.metropoles.com/mundo/indonesia-incendios-florestais-ameacam-liberar-bombas-de-carbono", "fonte_id": "metropoles", "data_pub": "2026-09-03T09:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais na Indonésia levantam preocupações sobre a liberação de grandes quantidades de carbono, lembrando a crise de 2015 durante o último 'super El Niño'.", "titulo_pt": "Indonésia: incêndios florestais ameaçam liberar 'bombas' de carbono", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 142263, "titulo": "Alaska seeks oil revival while grappling with a warming future", "url": "https://www.axios.com/2026/09/03/alaska-oil-revival-warming-future", "fonte_id": "axios", "data_pub": "2026-09-03T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alaska está buscando revitalizar sua indústria do petróleo, que está em declínio há décadas, enquanto enfrenta os efeitos da aquecimento global, como a derivação rápida de geleiras. O estado serve como um exemplo vivo da dependência de combustíveis fósseis à medida que os impactos climáticos se intensificam.", "titulo_pt": "Alaska busca revitalizar a indústria do petróleo enquanto enfrenta o futuro aquecido", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 141948, "titulo": "Clima: frente fria se afasta, mas nova instabilidade ameaça a Região Sul", "url": "https://www.metropoles.com/brasil/clima-frente-fria-se-afasta-mas-nova-instabilidade-ameaca-a-regiao-sul", "fonte_id": "metropoles", "data_pub": "2026-09-03T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A frente fria que atingiu a Região Sul está se afastando, mas uma nova instabilidade atmosférica está prevista para trazer chuva moderada a forte à região.", "titulo_pt": "Clima: alívio temporário, nova chuva ameaça o Sul", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 142565, "titulo": "In Chile, injured penguins sport copper vests to help them heal", "url": "https://phys.org/news/2026-09-chile-penguins-sport-copper-vests.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T08:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores chilenos desenvolveram um novo tipo de roupa para pinguins feridos—casacos vermelhos apertados comcondutos de cobre e zinco, com a esperança de que isso acelere a recuperação dos pássaros aquáticos.", "titulo_pt": "Em Chile, pinguins feridos usam coletes vermelhos com condutores metálicos para auxiliar na recuperação", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 142344, "titulo": "Floodwaters sweep cars away in eastern China", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/3/floodwaters-sweep-cars-away-in-eastern-china?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-03T05:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças de enxurrada causadas por chuvas torrenciais atingiram áreas leste da China, inundando ruas e levando embora veículos.", "titulo_pt": "Inundações arrastam carros pelas ruas no leste da China", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 142459, "titulo": "Unstable Tibetan Plateau risks cascading disasters as glacier losses mount in Nepal, China", "url": "https://www.scmp.com/news/china/article/3366180/unstable-tibetan-plateau-risks-cascading-disasters-glacier-losses-mount-nepal-china?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-03T03:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O responsável pelo Centro Nacional de Clima da China alerta que os gelos da Plataforma Tibetana podem se tornar mais instáveis, levando a mais colapsos e desastres secundários. No último mês, a área dos gelos na Plataforma Tibetana diminuiu cerca de 24% nas últimas 60 anos, com cerca de 7.000 pequenos gelos desaparecendo completamente.", "titulo_pt": "Plataforma tibetana instável em risco de desastres em cadeia devido à perda de geleiras", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 142581, "titulo": "New Mexico’s largest reservoir plunges to just 1.4% full", "url": "https://www.sciencedaily.com/releases/2026/09/260902234454.htm", "fonte_id": "science_daily", "data_pub": "2026-09-03T03:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O maior reservatório de Novo México, o Reservatório Elefante Masoquista, atingiu apenas 1,4% da sua capacidade em julho de 2026 devido a anos de seca extrema e derretimento de neve recorde no outono anterior. A queda dramática expôs detritos submersos há muito tempo e enfatizou a crescente pressão sobre as reservas de água do Rio Grande, utilizadas por fazendas em Novo México e Texas.", "titulo_pt": "Reservatório mais grande de novo México cai para apenas 1,4% da capacidade", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 144075, "titulo": "US charges ICE agent with lying about shooting of Venezuelan immigrant", "url": "https://www.ft.com/content/1fed215c-49a6-4ac2-91ee-221972e0a10a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-03T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um agente do ICE foi acusado de fornecer declarações falsas sobre as circunstâncias de um disparo que contribuiu para uma rebelião em Minnesota no início deste ano.", "titulo_pt": "EUA acusam agente do ICE de mentir sobre tiroteio envolvendo imigrante venezuelano", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 142948, "titulo": "Agravaron la acusación contra una mujer por haber abusado sexualmente de su hija de 15 años junto a su pareja", "url": "https://www.lanacion.com.ar/seguridad/agravaron-la-acusacion-contra-una-mujer-por-haber-abusado-sexualmente-de-su-hija-de-15-anos-junto-a-nid03092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-03T17:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "text function toggleDrill(id) {

  const aberta = el.classList.toggle("aberta");

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>

    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
