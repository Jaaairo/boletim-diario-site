<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

evolvendo o dinheiro aos clientes do Ueno Bank após a sua liquidação, beneficiando cerca de 3 milhões de clientes afetados. O senador Jay Rockefeller, que contribuiu significativamente para a expansão do sistema de saúde nos Estados Unidos, faleceu aos 89 anos. O Papa Francisco iniciou uma viagem pela América do Sul, visitando o Uruguai, a Argentina e o Peru, durante a qual declarou estar orgulhoso de ser americano e ter exercido seu direito ao voto. Além disso, o governo irlandês suspeita que uma série de ameaças de bomba seja parte de uma campanha coordenada de perturbação, após várias empresas de mídia e companhias aéreas serem alvo de mensagens atribuídas a um grupo extremista russo.\n\nA geopolítica global está em um momento crucial, com diversos eventos e decisões que podem moldar o futuro das relações internacionais. A China enfrenta desafios em sua relação com os Estados Unidos, que advertiram que a China deve cumprir os termos do acordo comercial de Busan, especialmente em relação à entrega de minérios de rara-earth. Por outro lado, a Coreia do Sul realizou um transporte de cargas pela rota do Ártico, com apoio da Rússia, reduzindo significativamente o tempo de viagem até a Europa, o que pode afetar os esforços de isolar Moscou. Em Israel, partidos árabes apoiaram Gadi Eisenkot, rival de Netanyahu, para formar o governo, refletindo tensões crescentes no país. Além disso, a China enfrenta pressões sobre como regular as plataformas de e-commerce chinesas sem fechar seu mercado, enquanto a Índia luta com os custos e desafios de implementar suas ambições em hidrogênio verde. Estes eventos demonstram a complexidade e a interconexão das políticas internacionais atuais, com implicações significativas para diversos países e regiões do mundo.", "economia": "As reservas de moeda estrangeira da Taiwan caíram abaixo dos US$600 bilhões, atingindo o nível mais baixo desde 2016. No Brasil, o Ibovespa subiu mais de 1% nesta sexta-feira, indicando uma recuperação no mercado. O Bradesco e a XP pioraram suas projeções para inflação e atividade econômica em 2027, prevendo uma inflação mais alta e uma atividade praticamente estagnada. O Brasil registrou um superávit comercial recorde em outubro, com US$ 9,318 bilhões, impulsionado pelas exportações de petróleo, combustíveis, cereais e soja. O Banco Central do Paraguai iniciou pagamentos a correntistas do Ueno Bank após a intervenção no banco digital, que tinha quase 3 milhões de clientes e bloqueou saques, causando turbulência política. O Ibovespa subiu 1,39% após a turbulência em Wall Street, mas fechou a semana praticamente estável. O dólar avançou 1,18% na semana, influenciado pelo payroll acima do esperado que reforçou as apostas de alta de juros nos EUA. A confiança das grandes empresas do comércio em São Paulo atingiu o menor nível em dez anos, devido a juros elevados, vendas fracas e incertezas econômicas. O Google foi processado por pais de menina que planejou um possível suicídio usando a tecnologia de inteligência artificial da empresa em um computador da escola. A cibersegurança do indivíduo é um desafio que vai além dos ativos digitais e é crucial que os consumidores não dependam apenas de sua capacidade de reconhecer golpes. A transição para o quarto mandato do presidente Lula está enfrentando dificuldades econômicas, com destaque para a pressão por adiamento da reforma tributária e ajustes nas contas públicas. A Unidade de Fomento (UF) aumentará em R$206,48, atingindo um novo recorde máximo de R$41.501,94 em 9 de dezembro. O mercado ilegal de cigarros tem crescido após o aumento dos impostos sobre o produto, acendendo alertas sobre uma proposta do governo Lula que pode intensificar essa situação.", "tecnologia": "A Anthropic planeja avançar com sua oferta inicial de ações (IPO) com uma avaliação alvo de US$ 1,5 trilhão, apesar da forte queda no setor de tecnologia. Esta notícia destaca o interesse continuado da empresa em expandir sua presença no mercado de alta capitalização, mesmo diante de desafios econômicos. Em outra notícia, a Tesla anunciou que vai encerrar gradualmente a produção da Cybertruck em sua fábrica no Texas por volta de meados de 2027, após anos de vendas fracas, indicando que o modelo não atingiu as expectativas iniciais de vendas. Além disso, a Administração Federal de Aviação (FAA) nos Estados Unidos está concluindo a substituição dos discos flexíveis (disquetes) em seus sistemas de exibição de informações em 435 locais até o final de 2028, considerando-se um 'momento histórico' na tecnologia, refletindo a rápida evolução das tecnologias de armazenamento de dados.", "ciencia": "Um novo estudo, liderado pelo pesquisador Philipp Aglas-Leitner da Freie Universität Berlin e publicado na Nature Communications, sugere que futuros eventos de calor extremo podem durar mais tempo, afetar áreas maiores e ser mais severos do que os eventos recentes. Além disso, um método baseado em luz foi desenvolvido por pesquisadores, incluindo um da Florida State University, que pode revitalizar compostos químicos que não avançaram no processo de desenvolvimento de medicamentos, permitindo a exploração de novas possibilidades terapêuticas. Outros avanços incluem a criação de um sistema de Hubbard com três componentes e interações ajustáveis no laboratório, visualizado usando um microscópio de gás quântico, e a descoberta de que a menopausa tardia está associada a menos danos nos vasos sanguíneos do cérebro, conforme um estudo com 352 mulheres. Por fim, a Agência Europeia de Meteorologia (EUMETSAT) divulgou as primeiras imagens do Meteosat Third Generation Imager 2 (MTG-I2), que fornecerá observações de alta resolução da Europa a cada 2,5 minutos, permitindo um monitoramento mais preciso de eventos climáticos.", "cultura": "A indústria criativa enfrenta desafios significativos para iniciantes, conforme mostram pesquisas com 27 profissionais. O artigo 'Começar uma carreira criativa nunca foi tão difícil – 27 vozes da indústria sobre o que vem a seguir' destaca que criar novos caminhos para a carreira criativa é urgente. Pablo Helguera, nomeado para liderar o Vera List Center da New School, enfatiza a importância de interpretar eventos em evolução rápida e questionar narrativas dominantes. A designer Caterina Bianchini recebeu um prêmio por suas contribuições como educadora no exterior, enquanto um artista reformulou monumentos existentes, ganhando um prêmio por sua instalação. Em outro contexto, o Papa Francisco iniciou uma viagem pastoral pela América do Sul após passar por uma cirurgia para remover um tumor canceroso no pulmão. O cineasta chileno Sebastián Lelio, conhecido por filmes como 'A Fantástica Mulher' e 'Gloria', faleceu aos 52 anos, deixando um legado significativo para o cinema nacional.", "sociedade": "Um turista negro relatou uma abordagem policial suspeita em Minas Gerais, onde moradores enviaram fotos dele e de sua mãe à polícia, acusando-os de movimentação suspeita. O pai de Meghan Markle, duquesa de Sussex, foi preso nos Estados Unidos por suspeita de abuso infantil, com a possibilidade de uma pena de até 20 anos de prisão. O presidente Lula sancionou uma lei que cria um órgão regulador para a medicina, similar à OAB, e estabelece a necessidade de médicos terem uma nota mínima para se registrar profissionalmente. O caso de Euler Santerbanes, conhecido como 'Ken Paraense', que faleceu aos 24 anos, causou comoção nas redes sociais. Um imigrante pernambucano, naturalizado americano após 17 anos nos EUA, criticou a atuação do ICE sob a presidência de Donald Trump, destacando sua experiência de vida e trabalho legislativo.", "meio_ambiente": "Em outubro de 2026, foi registrado o mês mais quente já observado, conforme informado pelo serviço climático da União Europeia, com um El Niño excepcionalmente forte agravando o aquecimento global. O Ministério está planejando testar a eficácia das propostas de captura de carbono para avaliar seu impacto ambiental. Em São Paulo, o outubro de 2026 foi o segundo mais chuvoso desde 1995, com 220,3 mm de precipitação. O serviço Copernicus de Mudanças Climáticas prevê que o 'super El Niño' atingirá seu pico em dezembro, potencialmente afetando significativamente as temperaturas globais. A Indonésia aumentou suas metas climáticas, apesar das intensas queimadas que contradizem essa estratégia. A Agência das Nações Unidas para Refugiados alertou para o risco enfrentado por 90 milhões de pessoas devido às mudanças climáticas, solicitando financiamento para auxiliar as comunidades vulneráveis. A ACNUR informou que quase 90 milhões de deslocados vivem em países altamente expostos à crise climática, com mais de 255 milhões de deslocamentos internos durante a última década. O governo aprovou um plano para reverter o desmatamento até 2030, englobando quatro frentes de atuação e medidas para aumentar o financiamento, a assistência técnica e o acesso a mercados. O Wallis Annenberg Wildlife Crossing, a maior ponte para animais do mundo, está sendo finalizado na Califórnia para conectar habitats e proteger pumas isolados. Mais de 40 baleias-piloto encalharam e morreram na costa da Nova Zelândia, com grande parte dos animais já estando mortos quando foram descobertos.", "direitos_humanos": "Um líder religioso foi preso pela Polícia Civil do Paraná (PCPR) por acusações de abuso sexual contra um adolescente e ameaças às famílias envolvidas, usando a fé e supostos 'chamados espirituais' para cometer o abuso. Em Hong Kong, o ativista oposicionista Joshua Wong foi condenado a mais 10 anos de prisão, somando 20 anos no total, em seu segundo julgamento recente. A Organização das Nações Unidas alerta que milhões de pessoas refugiadas da guerra no Sudão estão em risco de perder o abrigo, pois os fundos estão se esgotando, deixando menos de um milhão dos 15,4 milhões de pessoas necessitando de assistência para abrigo emergencial sem ajuda. Além disso, a Polícia Federal deflagrou uma operação em Pernambuco para investigar o tráfico humano envolvendo brasileiras que seriam enviadas para a Suíça, com a Justiça autorizando o bloqueio de R$ 1 milhão nas contas dos investigados."}, "resumo_do_dia": {"politica_nacional": [{"id": 249002, "titulo": "Coronelismo em tempos de extrema-direita", "url": "https://www.cartacapital.com.br/artigo/coronelismo-em-tempos-de-extrema-direita/", "fonte_id": "cartacapital", "data_pub": "2026-11-06T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A liberdade do voto depende não apenas da proteção contra a dispensa discriminatória, mas também da regulação das plataformas. O coronelismo, um sistema político local, continua relevante mesmo em contextos de extrema-direita.", "titulo_pt": "Coronelismo em tempos de extrema-direita", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 249118, "titulo": "Imposto do pecado: Governo alivia para indústrias e adia proteção popular, alma da reforma", "url": "https://apublica.org/2026/11/imposto-do-pecado-governo-alivia-para-industria-e-adia-reforma/", "fonte_id": "agencia_publica", "data_pub": "2026-11-06T21:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indústria de refrigerantes e a mineração terão seus impostos reduzidos ou zerados até 2027, independentemente dos impactos na saúde e no meio ambiente. O governo facilitou a situação fiscal dessas indústrias em detrimento de medidas que beneficiariam a população.", "titulo_pt": "Imposto do pecado: governo alivia para indústrias e adia proteção popular, essência da reforma", "veiculo": "Agência Pública", "pais": "Brasil", "classe": "B"}, {"id": 249030, "titulo": "Entidades entram em campo por adiamento de implementação da reforma tributária para 2028", "url": "https://veja.abril.com.br/politica/entidades-entram-em-campo-por-adiamento-de-implementacao-da-reforma-tributaria-para-2028/", "fonte_id": "veja", "data_pub": "2026-11-06T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Advogados especializados em recuperação tributária enviaram uma carta ao Congresso brasileiro alertando sobre os riscos para a segurança jurídica das empresas em relação ao adiamento da implementação da reforma tributária para 2028.", "titulo_pt": "Advogados pedem adiamento da reforma tributária para 2028", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 249020, "titulo": "Flávio diz que aliados duvidam da eleição, mas temem represálias", "url": "https://www.poder360.com.br/poder-congresso/flavio-diz-que-aliados-duvidam-da-eleicao-mas-temem-represalias/", "fonte_id": "poder360", "data_pub": "2026-11-06T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro afirmou que aliados duvidam do resultado da eleição, mas temem represálias por parte do novo governo. Dirigentes do PL e aliados reconheceram a vitória do presidente Lula.", "titulo_pt": "Flávio diz que aliados duvidam da eleição, mas temem represálias", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 249076, "titulo": "Governo suspende registros de imóveis de Willer Tomaz em Angra dos Reis", "url": "https://www.metropoles.com/brasil/governo-suspende-registros-de-imoveis-de-willer-tomaz-em-angra-dos-reis", "fonte_id": "metropoles", "data_pub": "2026-11-06T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo suspendeu os registros de imóveis de Willer Tomaz em Angra dos Reis. Um dos imóveis suspenso está em disputa entre Willer Tomaz e o jogador do Tottenham, Richarlison.", "titulo_pt": "Governo suspende registros de imóveis de Willer Tomaz em Angra dos Reis", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 249023, "titulo": "Aos 81 anos, Lula diz que não pensa em se aposentar", "url": "https://www.poder360.com.br/poder-governo/aos-81-anos-lula-diz-que-nao-pensa-em-se-aposentar/", "fonte_id": "poder360", "data_pub": "2026-11-06T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula, com 81 anos, afirma que não tem intenção de se aposentar. Em janeiro, ele tomará posse para seu último mandato presidencial, tornando-se o presidente mais velho a assumir o cargo no Brasil.", "titulo_pt": "Lula, com 81 anos, diz não pensar em se aposentar", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 249025, "titulo": "Governo discutirá uso de recursos de petróleo na Margem Equatorial", "url": "https://www.poder360.com.br/poder-energia/governo-discutira-uso-de-recursos-de-petroleo-na-margem-equatorial/", "fonte_id": "poder360", "data_pub": "2026-11-06T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo discutirá o uso dos recursos de petróleo encontrados no 1º bloco da Margem Equatorial, localizado no litoral do Amapá, nos próximos dias. O ministro de Minas e Energia confirmou a realização desse debate.", "titulo_pt": "Governo discutirá uso de recursos de petróleo na Margem Equatorial", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 249094, "titulo": "Mais de 6 mil mulheres procuram Defensoria Pública no DF; violência continua após fim de relacionamentos", "url": "https://www.brasildefato.com.br/2026/11/06/mais-de-6-mil-mulheres-procuram-defensoria-publica-no-df-violencia-continua-apos-fim-de-relacionamentos/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-06T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 6 mil mulheres procuraram a Defensoria Pública do Distrito Federal, relatando violência doméstica mesmo após o término de relacionamentos. Os principais problemas mencionados incluem disputas pela guarda dos filhos, falta de pagamento de pensão alimentícia e retenção de patrimônio.", "titulo_pt": "Mais de 6 mil mulheres buscam Defensoria Pública no DF; violência persiste após fim de relacionamentos", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 249004, "titulo": "STF vai julgar recurso de Zambelli contra condenação por usar música ‘Milla’ em vídeo pró-Bolsonaro", "url": "https://www.cartacapital.com.br/politica/stf-vai-julgar-recurso-de-zambelli-contra-condenacao-por-usar-musica-milla-em-video-pro-bolsonaro/", "fonte_id": "cartacapital", "data_pub": "2026-11-06T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) vai julgar um recurso apresentado por Carla Zambelli contra sua condenação por uso indevido da música 'Milla' em um vídeo a favor do presidente Bolsonaro. O julgamento ocorrerá no plenário virtual e terminará em 23 de novembro.", "titulo_pt": "STF julgará recurso de carla Zambelli contra condenação por uso de música 'Milla' em vídeo pró-bolsonaro", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 249095, "titulo": "Indígenas denunciam corte de água que abastece comunidade no Parque do Mate, em Campo Largo", "url": "https://www.brasildefato.com.br/2026/11/06/indigenas-denunciam-corte-de-agua-que-abastece-comunidade-no-parque-do-mate-em-campo-largo/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-06T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A comunidade indígena do Parque do Mate, em Campo Largo (PR), denuncia que o curso de água que abastece a região está seco há cinco meses. As famílias kaingang ocupantes do local desde 2022 relatam irregularidades no abastecimento hídrico.", "titulo_pt": "Indígenas denunciam corte de água que abastece comunidade no Parque do Mate, em Campo Largo", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 249096, "titulo": "‘As plataformas digitais são dos bilionários, mas temos que disputá-las’, diz Sandra Bitencourt", "url": "https://www.brasildefato.com.br/2026/11/06/as-plataformas-digitais-sao-dos-bilionarios-mas-temos-que-disputa-las-diz-sandra-bitencourt/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-06T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O livro 'Redes e rumos: jornalismo e sociedade transformada na era dos distúrbios informacionais', de Sandra Bitencourt, explora as mudanças nas relações entre jornalismo, plataformas digitais e democracia no Brasil. O autor discute como essas plataformas transformaram a disputa política e o jornalismo no país.", "titulo_pt": "As plataformas digitais são dos bilionários, mas temos que disputá-las", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 249080, "titulo": "Após sair do país, Flávio consta em novo documento de Bolsonaro a Moraes", "url": "https://www.metropoles.com/colunas/manoela-alcantara/apos-sair-do-pais-flavio-consta-em-novo-documento-de-bolsonaro-a-moraes", "fonte_id": "metropoles", "data_pub": "2026-11-06T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro continua sendo incluído na equipe jurídica do pai em um documento apresentado ao STF. Após ter saído do país, o nome do senador permanece listado.", "titulo_pt": "Flávio consta em novo documento de Bolsonaro a Moraes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 248975, "titulo": "Flávio admite não ter prova de fraude, critica volta de Jair ao Brasil e diz querer 2030 assim como Tarcísio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/flavio-admite-nao-ter-prova-de-fraude-critica-volta-de-jair-ao-brasil-e-diz-querer-2030-assim-como-tarcisio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-06T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro admitiu em entrevista à Folha que não tem provas de fraudes nas eleições, mas considera o assunto proibido de ser investigado no Brasil. Ele também criticou a volta de Jair Bolsonaro ao país e expressou interesse em concorrer em 2030, assim como Tarcísio Meira.", "titulo_pt": "Flávio admite não ter prova de fraude, critica retorno de Jair e quer 2030 como Tarcísio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 249037, "titulo": "Como Jair Bolsonaro tenta se envolver na disputa do Senado de dentro da prisão domiciliar", "url": "https://veja.abril.com.br/politica/como-jair-bolsonaro-tenta-se-envolver-na-disputa-do-senado-de-dentro-da-prisao-domiciliar/", "fonte_id": "veja", "data_pub": "2026-11-06T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz federal Sergio Morais está analisando um pedido enviado pela defesa do ex-presidente Jair Bolsonaro para se envolver na disputa do Senado de dentro da prisão domiciliar.", "titulo_pt": "Como Jair Bolsonaro tenta se envolver na disputa do Senado de dentro da prisão domiciliar", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 248976, "titulo": "Marqueteiros de Lula e Flávio trocam elogios em grupo de WhatsApp", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/marqueteiros-de-lula-e-flavio-trocam-elogios-em-grupo-de-whatsapp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-06T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marqueteiros que atuaram nas campanhas do presidente Lula e do candidato Flávio Bolsonaro trocaram elogios em um grupo de WhatsApp dez dias após o segundo turno das eleições.", "titulo_pt": "Marqueteiros de Lula e Flávio trocam elogios em grupo de WhatsApp", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 249039, "titulo": "O plano de Lula para renovar até 70% do ministério e mudar os rumos do quarto mandato", "url": "https://veja.abril.com.br/politica/o-plano-de-lula-para-renovar-ate-70-do-ministerio-e-mudar-os-rumos-do-quarto-mandato/", "fonte_id": "veja", "data_pub": "2026-11-06T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula planeja renovar até 70% do ministério e mudar os rumos do quarto mandato. A indefinição na economia preocupa os aliados do presidente.", "titulo_pt": "Plano de Lula para renovar ministério e mud lasse": "B"}, {"id": 249268, "titulo": "Como a crise do Ueno Bank afeta os brasileiros que se mudaram para o Paraguai", "url": "https://www.jota.info/internacional/como-a-crise-do-ueno-bank-afeta-os-brasileiros-que-se-mudaram-para-o-paraguai", "fonte_id": "jota", "data_pub": "2026-11-06T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A exposição do Ueno Bank à moeda brasileira aumentou mais do que o dobro entre dezembro de 2025 e março de 2026, o que pode afetar pagamentos e negócios na fronteira com o Brasil.", "titulo_pt": "Como a crise do Ueno Bank afeta os brasileiros que se mudaram para o Paraguai", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 249121, "titulo": "Petróleo fecha em alta, mas recua 13% na semana após eleição nos EUA", "url": "https://www.infomoney.com.br/mercados/petroleo-fecha-em-alta-mas-recua-13-na-semana-apos-eleicao-nos-eua/", "fonte_id": "infomoney", "data_pub": "2026-11-06T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O petróleo fechou em alta, mas registrou uma recuperação de 13% na semana após a eleição nos Estados Unidos, em virtude do debate sobre como a vitória dos democratas nas eleições de meio de mandato pode afetar a relação entre os EUA e o Irã.", "titulo_pt": "Petróleo fecha em alta, mas recua 13% na semana após eleição nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 248961, "titulo": "Bradesco e XP pioram significativamente projeções para inflação e atividade econômica em 2027", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/bradesco-e-xp-pioram-significativamente-projecoes-para-inflacao-e-atividade-economica-em-2027.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Bradesco e a XP ajustaram suas projeções econômicas para 2027, prevendo uma inflação mais alta e uma atividade econômica praticam id": "veja", "data_pub": "2026-11-06T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa subiu mais de 1% nesta sexta-feira, sinalizando uma recuperação no mercado. Os mercados também monitoram a taxa de juros no Brasil e os payroll nos Estados Unidos.", "titulo_pt": "Ibovespa valoriza mais de 1% em movimento de recuperação nesta sexta-feira", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 248962, "titulo": "Veja quem são os indicados por Espanha e Holanda para suceder Lagarde no BCE", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/veja-quem-sao-os-indicados-por-espanha-e-holanda-para-suceder-lagarde-no-bce.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os países da zona do euro indicaram dois veteranos experientes em gestão de crises para suceder Christine Lagarde à frente do BCE. A indicação foi feita nesta sexta-feira (6) de junho de 2026.", "titulo_pt": "Veja quem são os indicados por países da zona do euro para suceder Lagarde no BCE", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 249392, "titulo": "Investors brace for lower Anthropic valuation, calling $1.5 trillion a 'stretch'", "url": "https://www.cnbc.com/2026/11/06/investors-brace-for-anthropic-valuation-1point5-trillion-a-stretch.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-06T21:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores se preparam para uma avaliação menor para a Anthropic, com alguns chamando a avaliação de $1,5 trilhão de 'exagerada'. A expectativa é que a empresa possa se listar com uma avaliação abaixo de $1,5 trilhão, devido ao enfraquecimento do interesse em IA na Wall Street.", "titulo_pt": "Investidores se preparam para uma avaliação menor para a Anthropic, chamando $1,5 trilhão de 'exagerado'", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 248963, "titulo": "Investir em ações por mais tempo reduz o risco de perder dinheiro?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/11/investir-em-acoes-por-mais-tempo-reduz-o-risco-de-perder-dinheiro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investir ações por um período mais longo diminui o risco de perder dinheiro em comparação com investimentos de baixo risco, como o CDI. Um exemplo mostra que investir R$ 100 mil na Bolsa por dez anos resultou em R$ 180 mil, enquanto o CDI teria gerado R$ 250 mil, deixando de acumular R$ 70 mil.", "titulo_pt": "Investir em ações por mais tempo reduz o risco de perder dinheiro?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 249151, "titulo": "Preço da cerveja não deve aumentar em 2027", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/preco-da-cerveja-nao-deve-aumentar-em-2027/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T20:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A medida provisória garante uma carga tributária neutra para bebidas alcoólicas no primeiro ano; a partir de 2028, pode ocorrer um aumento no preço da cerveja.", "titulo_pt": "Preço da cerveja não deve aumentar em 2027", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 249000, "titulo": "Brasil tem maior juro real do mundo, seguido por Turquia e Argentina", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/brasil-tem-maior-juro-real-do-mundo-seguido-por-turquia-e-argentina", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-06T19:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil mantém o título de maior juro real do mundo, com 9,05%, seguido por Turquia e Argentina. Essa informação foi publicada em um ranking da consultoria de mercado Moneyou, que analisou 40 países.", "titulo_pt": "Brasil lidera ranking de juros reais, seguido por Turquia e Argentina", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 249270, "titulo": "Antes de abrir as portas, o pequeno negócio precisa de energia", "url": "https://www.jota.info/coberturas-especiais/energia-e-inclusao/antes-de-abrir-as-portas-o-pequeno-negocio-precisa-de-energia", "fonte_id": "jota", "data_pub": "2026-11-06T19:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que os brasileiros associam o gás liquefeito de petróleo (GLP) ao funcionamento de pequenos negócios e aos empregos que eles criam.", "titulo_pt": "Antes de abrir as portas, o pequeno negócio precisa de glp", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 249001, "titulo": "Balança comercial tem maior superávit para outubro desde 1989", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/balanca-comercial-tem-maior-superavit-para-outubro-desde-1989", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-06T19:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A balança comercial brasileira apresentou o maior superávit para outubro em 37 anos, com um saldo positivo de US$ 9,32 bilhões. Este resultado foi impulsionado por exportações de petróleo, combustíveis, cereais e soja, superando as importações.", "titulo_pt": "Balança comercial tem maior superávit para outubro desde 1989", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 249380, "titulo": "Economist Olivier Blanchard: 'Reducing France's deficit requires taking unpopular measures, which no one dares to announce'", "url": "https://www.lemonde.fr/en/french-economy/article/2026/11/06/economist-olivier-blanchard-reducing-france-s-deficit-requires-taking-unpopular-measures-which-no-one-dares-to-announce_6773725_21.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-06T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O economista Olivier Blanchard, ex-chefe da economia do Fundo Monetário Internacional, afirmou que o programa do partido de extrema-direita Rassemblement National é incoerente e que o plano do partido de extrema-esquerda La France Insoumise assusta os investidores.", "titulo_pt": "Economista Olivier Blanchard: 'pacote econômico do rassemblement national é incoerente e plano do la France insoumise assusta os investidores'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 248970, "titulo": "Brasil tem superávit comercial de US$ 9,3 bilhões em outubro, recorde para o mês", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/brasil-tem-superavit-comercial-de-us-93-bilhoes-em-outubro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T18:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil registrou um superávit comercial de US$ 9,318 bilhões em outubro, um recorde para o mês desde o início da série histórica em 1989. O resultado foi impulsionado pelas exportações, especialmente de petróleo, conforme informou o MDIC.", "titulo_pt": "Brasil registra superávit comercial recorde de US$ 9,3 bilhões em outubro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 248745, "titulo": "Police arrest man over AI data theft in Kaohsiung", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/07/2003867317", "fonte_id": "taipei_times", "data_pub": "2026-11-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia de Kaohsiung prendeu um homem suspeito de roubar dados relacionados à inteligência artificial.", "titulo_pt": "Polícia prende homem por suposto roubo de dados de IA em Kaohsiung", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 249468, "titulo": "The Duo apps are coming, says Apple", "url": "https://techcrunch.com/2026/11/06/the-duo-apps-are-coming-says-apple/", "fonte_id": "techcrunch", "data_pub": "2026-11-06T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apple anunciou que há 100 mil apps Duo-optimizados na loja e que milhares de novos apps chegam diariamente.", "titulo_pt": "Apple anuncia apps duo-optimizados", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 249198, "titulo": "La particular forma que un hombre encontró para que no lo obliguen a usar IA en el trabajo", "url": "https://www.lanacion.com.ar/tecnologia/la-particular-forma-que-un-hombre-encontro-para-que-no-lo-obliguen-a-usar-ia-en-el-trabajo-nid06112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-06T21:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Com ajuda de sua advogada, ele transformou sua decisão pessoal em uma crença religiosa para evitar o uso de IA no trabalho. A ação foi tomada para se proteger de políticas que exigem o uso de tecnologias de inteligência artificial.", "titulo_pt": "A forma particular que um homem encontrou para não ser obrigado a usar IA no trabalho", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 249471, "titulo": "How Stephen Miller Schemed His Way to the Top", "url": "https://www.wired.com/story/how-stephen-miller-schemed-his-way-to-the-top/", "fonte_id": "wired", "data_pub": "2026-11-06T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Stephen Miller, responsável pela dura repressão imigratória e contra a oposição durante a administração Trump, já era conhecido como 'o primeiro-ministro'. Agora, ele assume o cargo de chefe de staff.", "titulo_pt": "Como Stephen Miller conquistou o poder na administração trump", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 249422, "titulo": "Anthropic to press ahead with IPO targeting $1.5tn valuation", "url": "https://www.ft.com/content/314e17df-e7af-4814-b208-70a0557cb452?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-06T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic planeja avançar com sua oferta inicial de ações (IPO) com uma avaliação alvo de US$ 1,5 trilhão, apesar da forte baixa no setor de tecnologia. A empresa planeja realizar a lista antes do feriado de Thanksgiving.", "titulo_pt": "Anthropic vai avançar com IPO com alvo de avaliação de us$ 1,5 trilhão, mesmo com baixa no setor tecnológico", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 249456, "titulo": "Chainalysis says hackers stole credentials and tokens for all of its customers", "url": "https://arstechnica.com/security/2026/11/chainalysis-says-hackers-stole-credentials-and-tokens-for-all-of-its-customers/", "fonte_id": "ars_technica", "data_pub": "2026-11-06T20:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Chainalysis relata que hackers roubaram credenciais e tokens de todos os seus clientes. O ataque cibernético multifronte incluiu agências de inteligência artificial e a interceptação de dados em trânsito.", "titulo_pt": "Hackers roubaram credenciais e tokens de todos os clientes da chainalysis", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 249425, "titulo": "Ex-OpenAI employee accused of spying pleads not guilty", "url": "https://www.ft.com/content/daee9cd2-3477-4fcc-859f-46acb9fdfbd9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-06T20:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Abdulrahman Alfozan, um nacional saudita, foi preso após a descoberta de um bug no escritório da AI lab. Ele negou a acusação de espionagem.", "titulo_pt": "Ex-funcionário da openai acusado de espionagem nega-se", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 249457, "titulo": "Earth's churning mantle may have created the Great Unconformity", "url": "https://arstechnica.com/science/2026/11/earths-churning-mantle-may-have-created-the-great-unconformity/", "fonte_id": "ars_technica", "data_pub": "2026-11-06T20:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A camada de rochas cambrianas repousa sobre rochas mais antigas, criando uma grande descontinuidade geológica conhecida como Great Unconformity. Esta descontinuidade é explicada pela atividade do manto terrestre, que pode ter contribuído para a formação de rochas mais novas sobrepostas a rochas mais antigas.", "titulo_pt": "A rotação do manto terrestre pode ter criado a grande descontinuidade", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 248966, "titulo": "Tesla vai encerrar produção da Cybertruck após anos de vendas fracas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/tesla-vai-encerrar-gradualmente-producao-do-cybertruck-na-fabrica-do-texas-diz-musk.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T20:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Tesla anunciou que vai encerrar gradualmente a produção da Cybertruck em sua fábrica no Texas por volta de meados de 2027, após anos de vendas fracas. O modelo, apresentado como concorrente das picapes tradicionais, não atingiu as expectativas de vendas.", "titulo_pt": "Tesla vai encerrar produção da Cybertruck após anos de vendas fracas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 249458, "titulo": "Nvidia hardware worth $11.4M vanished between Oakland and Texas", "url": "https://arstechnica.com/gadgets/2026/11/nvidia-hardware-worth-11-4m-vanished-between-oakland-and-texas/", "fonte_id": "ars_technica", "data_pub": "2026-11-06T20:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seis pallets de hardware desapareceram durante o transporte de Oakland para Texas, e até duas meses depois, não haviam sido feitas prisões.", "titulo_pt": "Hardware avaliado em $11,4M desaparece entre Oakland e Texas", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 249459, "titulo": "Developer ends lucrative screensaver deal with Roku because Fox bought it", "url": "https://arstechnica.com/gadgets/2026/11/artist-pulls-popular-screensaver-from-roku-os-because-of-fox-acquisition/", "fonte_id": "ars_technica", "data_pub": "2026-11-06T19:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um desenvolvedor encerrou um acordo lucrativo de screensaver com a Roku porque a Fox adquiriu a empresa. O desenvolvedor declarou: 'Não posso estar no mundo da Fox.'", "titulo_pt": "Desenvolvedor encerra acordo de screensaver com Roku após aquisição pela Fox", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 249271, "titulo": "Proteção digital de crianças e adolescentes: novos paradigmas para o Direito brasileiro", "url": "https://www.jota.info/opiniao-e-analise/artigos/protecao-digital-de-criancas-e-adolescentes-novos-paradigmas-para-o-direito-brasileiro", "fonte_id": "jota", "data_pub": "2026-11-06T19:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto destaca a necessidade de garantir a dignidade, a liberdade, a segurança e a proteção integral das crianças e adolescentes no ambiente digital.", "titulo_pt": "Proteção digital de crianças e adolescentes: novos paradigmas para o Direito brasileiro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 249460, "titulo": "FAA to finally ditch floppy disks in what it calls \"historic\" tech upgrade", "url": "https://arstechnica.com/tech-policy/2026/11/faa-to-finally-ditch-floppy-disks-in-what-it-calls-historic-tech-upgrade/", "fonte_id": "ars_technica", "data_pub": "2026-11-06T19:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Administração Federal de Aviação (FAA) nos Estados Unidos está concluindo a substituição dos discos flexíveis (disquetes) em seus sistemas de exibição de informações em 435 locais até o final de 2028, em um que considera um 'momento histórico' na tecnologia.", "titulo_pt": "FAA finalmente se livra dos discos flexíveis em atualização tecnológica 'histórica'", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 249469, "titulo": "Hundreds of Artex AI hacking tools found publicly exposed to the web", "url": "https://techcrunch.com/2026/11/06/hundreds-of-artex-ai-hacking-tools-found-publicly-exposed-to-the-web/", "fonte_id": "techcrunch", "data_pub": "2026-11-06T18:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores de segurança encontraram centenas de servidores hospedando o ferramental de teste de penetração Artex expostos à internet, permitindo que qualquer pessoa tivesse acesso ao ferramental de hacking.", "titulo_pt": "Centenas de ferramentas de hacking Artex encontradas expostas à internet", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 249470, "titulo": "Meta introduces Spaces, a new way to collaborate with your Muse agent", "url": "https://techcrunch.com/2026/11/06/meta-introduces-spaces-a-new-way-to-collaborate-with-your-muse-agent/", "fonte_id": "techcrunch", "data_pub": "2026-11-06T18:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta introduziu um novo recurso chamado Spaces, que promete ser uma nova forma de interagir com os agentes de IA assistentes chamados Muse. Os agentes Muse continuam a receber novas funcionalidades e integrações.", "titulo_pt": "Meta apresenta Spaces, uma nova maneira de colaborar com os agentes Muse de IA", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 249474, "titulo": "Free Chinese AI Models Are Getting Scary Good at Hacking", "url": "https://www.wired.com/story/free-chinese-ai-models-are-getting-scary-good-at-hacking/", "fonte_id": "wired", "data_pub": "2026-11-06T18:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um experimento mostrou que os modelos de IA DeepSeek e GLM são capazes de hackear redes simuladas com habilidades não muito diferentes das do modelo cyber mais avançado do OpenAI, que não é público.", "titulo_pt": "Modelos de IA chineses estão se tornando muito boas em hackear", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 249490, "titulo": "Air holes turn silicon wafers into flat ultraviolet focusing mirrors for compact optics", "url": "https://phys.org/news/2026-11-air-holes-silicon-wafers-flat.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Silício com buracos de ar transforma wafers em espelhos planos que focam luz no ultravioleta, permitindo óptica compacta. No entanto, a absorção de luz ultravioleta por muitos materiais usados em metasuperfícies representa um problema fundamental para a implementação dessas tecnologias.", "titulo_pt": "Buracos de ar transformam wafers de silício em espelhos planos para focagem de luz no ultravioleta", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 249487, "titulo": "STAT+: MAHA leader Calley Means castigates White House officials as bending to industry", "url": "https://www.statnews.com/2026/11/06/calley-means-joe-rogan-trump-maha-agenda-derailed-by-corporate-influence/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-06T21:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Calley Means, líder da MAHA que acabou de se demitir do governo Trump, acusa oficiais da Casa Branca de cederem aos interesses da indústria. Ela afirma que os americanos estão sendo enganados.", "titulo_pt": "Líder da MAHA critica oficiais da casa branca por cederem aos interesses da indústria", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 249491, "titulo": "How a metabolite protects the enzyme that consumes it", "url": "https://phys.org/news/2026-11-metabolite-enzyme-consumes.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os metabolitos são consumidos por enzimas para produzir outras moléculas vitais e controlar os níveis de metabolitos. No entanto, como as células evitam consumir excessivamente? Pesquisadores do MPI de Bioquímica, da Universidade de Nevada, Las Vegas, e do Instituto de Bioquímica de Duve em Bruxelas, descobriram tal regulagem molecular na metabolização da triptofano. A aminoácida essencial triptofano se liga a um segundo site na enzima TDO2, diferente do local onde é consumida, sequestrando uma região necessária para dois efeitos, a quinase CK2 e a ligase de ubiqüína CUL1–β-TrCP, que agem sequencialmente para sinalizar a TDO2.", "titulo_pt": "Como um metabólito protege a enzima que o consome", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 249199, "titulo": "Conrado Estol, médico neurólogo: “Usar hilo dental una vez por semana se asocia con menos riesgo de ACV”", "url": "https://www.lanacion.com.ar/salud/conrado-estol-medico-neurologo-usar-hilo-dental-una-vez-por-semana-se-asocia-con-menos-riesgo-de-acv-nid26102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-06T21:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Conrado Estol, um médico neurólogo, afirma que usar hilo dental uma vez por semana está associado a um menor risco de AVC. O médico também destaca a importância de caminhar, exercitar-se e manter o músculo para o bem-estar e alerta contra soluções mágicas para problemas de saúde, sugerindo que cuidar da saúde é uma investimento.", "titulo_pt": "Conrado Estol, médico neurólogo: ‘usar hilo dental uma vez por semana se associa a menos risco de avc’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 249492, "titulo": "New method measures microplastics in the air using an uncrewed aerial system", "url": "https://phys.org/news/2026-11-method-microplastics-air-uncrewed-aerial.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa liderada pelo CIRES apresenta um método para amostrar microplásticos na atmosfera usando um sistema aéreo não tripulado. O estudo, publicado na revista Scientific Reports, visa melhorar o entendimento sobre como os microplásticos se movimentam pelo ar.", "titulo_pt": "Novo método mede microplásticos no ar usando sistema aéreo não tripulado", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 249493, "titulo": "Future warming events will outdo the extreme heat waves of the recent past, new study finds", "url": "https://phys.org/news/2026-11-future-events-outdo-extreme.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo, liderado pelo pesquisador Philipp Aglas-Leitner da Freie Universität Berlin, publicado na Nature Communications, indica que os futuros eventos de calor extremo podem durar mais tempo, afetar áreas maiores e serem muito mais severos do que os eventos de calor extremo recentes observados.", "titulo_pt": "Eventos de calor extremo futuros ultrapassarão os recentes, sugere novo estudo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 249526, "titulo": "What's that bright 'star' in the early morning sky? It's not a star at all!", "url": "https://www.space.com/stargazing/whats-that-bright-star-in-the-early-morning-sky-its-not-a-star-at-all", "fonte_id": "space_com", "data_pub": "2026-11-06T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Obranha uma luz brilhante no céu leste antes do amanhecer? Trata-se de Vênus, e o planeta ficará ainda mais brilhante à medida que se aproxima de seu ponto máximo no final deste mês.", "titulo_pt": "O que é essa luz brilhante no céu leste antes do amanhecer? É vênus.", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 249494, "titulo": "Light-powered method resurrects 'dead-end' compounds for drug discovery", "url": "https://phys.org/news/2026-11-powered-method-resurrects-dead-compounds.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um método baseado em luz foi descoberto por pesquisadores, incluindo um da Florida State University, que pode revitalizar compostos químicos que não avançaram no processo de desenvolvimento de medicamentos. Esses compostos, anteriormente considerados inúteis, podem agora ser explorados como possíveis bases para novos medicamentos de grande sucesso.", "titulo_pt": "Método de luz renova 'compounds mortos' para descoberta de novos medicamentos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 249235, "titulo": "Cochilos de idosos à tarde podem ser indício de risco de demência", "url": "https://www.dw.com/pt-br/cochilos-de-idosos-à-tarde-podem-ser-indício-de-risco-de-demência/a-79879439?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-06T20:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas acompanharam quase mil idosos por até dez anos e notaram um padrão em seus cochilos à tarde que pode indicar riscos para a saúde, incluindo o risco de demência.", "titulo_pt": "Sono de idosos à tarde pode ser sinal de risco de demência", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 249495, "titulo": "Quantum gas microscope reveals individual atoms in first tunable three-component Hubbard system", "url": "https://phys.org/news/2026-11-quantum-gas-microscope-reveals-individual.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo internacional de pesquisadores, proveniente de países como Alemanha, Tailândia, Índia, China e Estados Unidos, criou um sistema de Hubbard com três componentes e interações ajustáveis no laboratório. Eles utilizaram um microscópio de gás quântico para visualizar os átomos individuais, proporcionando uma base importante para futuros simulados quânticos em física nuclear e ciência de materiais.", "titulo_pt": "Microscópio quântico revela átomos individuais em primeiro sistema de Hubbard com três componentes ajustáveis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 249496, "titulo": "European forests need to solve two crises—but not necessarily in one place", "url": "https://phys.org/news/2026-11-european-forests-crises-necessarily.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Áreas florestais podem funcionar como absorvedoras de carbono e habitats vitais para milhares de espécies, mas não necessariamente simultaneamente. Esta situação tem implicações importantes para a maneira como a Europa deve gerir suas florestas, de acordo com um pesquisador da Universidade de Copenhague.", "titulo_pt": "Florestas europeias precisam resolver duas crises, mas não necessariamente no mesmo local", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 249527, "titulo": "I finally got my hands on the Unistellar Envision smart binoculars with augmented reality and I can’t wait to stargaze with them", "url": "https://www.space.com/stargazing/skywatching-kit/i-finally-got-my-hands-on-the-unistellar-envision-smart-binoculars-with-augmented-reality-for-the-night-sky-heres-what-theyre-like", "fonte_id": "space_com", "data_pub": "2026-11-06T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As lentes de telescópio Unistellar Envision possuem realidade aumentada que adiciona funcionalidades inteligentes a binóculos de 10x50, permitindo a identificação do céu noturno e dos pontos turísticos durante observações estelares.", "titulo_pt": "Por fim, peguei as lentes de telescópio Unistellar Envision com realidade aumentada nas mãos e estou ansioso para observar as estrelas com elas", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 249497, "titulo": "MTG-I2 satellite delivers remarkable first images, capturing a weather view of Europe every 2.5 minutes", "url": "https://phys.org/news/2026-11-mtg-i2-satellite-remarkable-images.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Agência Europeia de Meteorologia (EUMETSAT) divulgou as primeiras imagens do Flexible Combined Imager (FCI) a bordo do Meteosat Third Generation Imager 2 (MTG-I2), dois meses após o lançamento do satélite em 27 de agosto de 2026. O satélite fornecerá observações de alta resolução da Europa a cada 2,5 minutos, permitindo que os previsores meteorológicos monitorem eventos climáticos que se desenvolvem rapidamente com maior precisão.", "titulo_pt": "Satélite MTG-I2 entrega primeiras imagens impressionantes, capturando uma visão do tempo da Europa a cada 2,5 minutos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 249498, "titulo": "High-precision timeline helps clarify an ancient magma surge in the North Cascades", "url": "https://phys.org/news/2026-11-high-precision-timeline-ancient-magma.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Beltas de vulcões conhecidas como arcos continentais podem experimentar surtos episódicos de magma, onde o fluxo de magma para a crosta continental aumenta em até 20 vezes. No entanto, o que desencadeia esses surtos extremos, que podem durar décadas a milhões de anos, nem sempre está claro.", "titulo_pt": "Prazo preciso ajuda a esclarecer surto de magma antigo no norte das cascatas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 249499, "titulo": "AI won't ever make a historically accurate film—but it could help archaeology create better stories", "url": "https://phys.org/news/2026-11-ai-wont-historically-accurate-archaeology.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T19:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Elon Musk criticou recentemente a adaptação cinematográfica de 'Odisseia' de Homero, dirigida por Christopher Nolan, por sua atuação diversificada e falta de historicidade. Musk usou inteligência artificial para tentar criar uma versão mais fiel à história original, argumentando que isso seria mais barato e eficiente do que trabalhar com estúdios tradicionais.", "titulo_pt": "IA não fará filmes históricos precisos, mas pode auxiliar a arqueologia a contar histórias melhores", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 249500, "titulo": "AI points researchers toward new disease targets hidden in mitochondria", "url": "https://phys.org/news/2026-11-ai-disease-hidden-mitochondria.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T19:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial está auxiliando cientistas da Texas A&M AgriLife Research a acelerar a busca por respostas sobre a função de centenas de proteínas desconhecidas localizadas no mitocôndrio humano. O objetivo é esclarecer o papel dessas proteínas mistério no biologia humana.", "titulo_pt": "IA aponta para novos alvos de doença escondidos no mitocôndrio", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 246472, "titulo": "Cat How", "url": "https://www.itsnicethat.com/career-predictions/cat-how", "fonte_id": "its_nice_that", "data_pub": "2026-11-09T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A história se concentra na vida de um gato, retratando seus hábitos e sentimentos cotidianos. O filme explora a perspectiva do gato em um ambiente doméstico.", "titulo_pt": "Como é ser um gato", "veiculo": "It's Nice That", "pais": "Reino Unido", "classe": "B"}, {"id": 247352, "titulo": "Starting a creative career has never felt harder – 27 industry voices on what comes next", "url": "https://www.itsnicethat.com/features/starting-a-creative-career-has-never-felt-harder-27-industry-voices-on-what-comes-next", "fonte_id": "its_nice_that", "data_pub": "2026-11-09T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitas vozes da indústria expressaram suas preocupações sobre a dificuldade de iniciar uma carreira criativa. Eles discutem as próximas etapas possíveis para superar esses desafios.", "titulo_pt": "Começar uma carreira criativa nunca pareceu tão difícil – 27 vozes da indústria sobre o que vem a seguir", "veiculo": "It's Nice That", "pais": "Reino Unido", "classe": "B"}, {"id": 247353, "titulo": "Jay Anderson: if you remove the first rung, who is going to climb the ladder?", "url": "https://www.itsnicethat.com/career-predictions/jay-anderson", "fonte_id": "its_nice_that", "data_pub": "2026-11-09T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute o cenário atualmente desafiador para quem começa uma carreira no setor criativo. Uma pesquisa realizada junto com Creative Lives in Progress ouviu 27 pessoas sobre as expectativas para o início de carreiras criativas nos próximos três anos.", "titulo_pt": "Jay Anderson: se você remover a primeira marcha, quem subirá a escada?", "veiculo": "It's Nice That", "pais": "Reino Unido", "classe": "B"}, {"id": 247354, "titulo": "A New Direction’s Oliver Benjamin: be kind, make stuff, learn the tools", "url": "https://www.itsnicethat.com/career-predictions/a-new-directions-oliver-benjamin-be-kind-make-stuff-learn-the-tools", "fonte_id": "its_nice_that", "data_pub": "2026-11-09T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria criativa está passando por tempos difíceis para quem está começando. Uma pesquisa realizada em parceria com Creative Lives in Progress ouviu 27 pessoas sobre como será iniciar uma carreira criativa nos próximos três anos.", "titulo_pt": "Uma nova direção para Oliver Benjamin: seja gentil, crie coisas  faltante.", "titulo_pt": "Mulher se feriu ao cair em calçada com baldosa faltante e receberá indenização milionária", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 248179, "titulo": "Mulher compra apartamento e acha ossada de moradora morta há um ano em MG", "url": "https://www.metropoles.com/minas-gerais/mulher-compra-apartamento-e-acha-ossada-de-moradora-morta-ha-um-ano-em-mg", "fonte_id": "metropoles", "data_pub": "2026-11-06T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A nova proprietária de um apartamento em Patos de Minas encontrou uma ossada no imóvel. A polícia está investigando a possibilidade de uma morte por intoxicação de remédios há um ano.", "titulo_pt": "Mulher encontra ossada em apartamento após compra em MG", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 248192, "titulo": "PM mata adolescente de 17 anos com tiros no rosto e no peito em abordagem", "url": "https://www.metropoles.com/colunas/alfredo-henrique/pm-mata-adolescente-de-17-anos-com-tiros-no-rosto-e-peito-em-abordagem", "fonte_id": "metropoles", "data_pub": "2026-11-06T17:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma adolescente de 17 anos foi morta durante uma abordagem policial em uma rodovia na região de São Bernardo do Campo, Grande SP. Ana Beatriz Correia de Souza foi atingida com tiros no rosto e no peito.", "titulo_pt": "PM mata adolescente de 17 anos com tiros no rosto e no peito durante abordagem", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 248275, "titulo": "Fome oculta causa 50 mil mortes por ano na Alemanha", "url": "https://www.dw.com/pt-br/fome-oculta-causa-50-mil-mortes-por-ano-na-alemanha/a-79868982?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-06T14:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A fome oculta, que se manifesta por carência de nutrientes, causa cerca de 50 mil mortes por ano na
