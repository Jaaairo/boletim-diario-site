<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<header>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

vel negligência'. Em outro incidente, o líder da oposição zambiana, Brian Mundubile, e seu vice-líder, Makebi Zulu, foram acusados de traição. Além disso, os icelândicos rejeitaram por 52,5% a 47,5% a proposta do governo de retomar negociações para aderir à União Europeia, em um referendo disputado. A Google alterou o nome do Lago Ontario para Lago América nos Estados Unidos, em resposta a um pedido do presidente Trump, mas manteve o nome original para os usuários canadenses e em outros países.\n\nO Oriente Médio continua sendo um ponto fraco para os Estados Unidos, conforme avaliou Alexandre Coelho, professor, após seis meses de guerra contra o Irã. O presidente dos Estados Unidos, Donald Trump, anunciou que o petróleo da Venezuela será usado para reabastecer as reservas norte-americanas. Em um desenvolvimento geopolítico significativo, dois grupos rivais da Líbia assinaram um acordo para realizar eleições nacionais dentro de dois anos, um passo crucial para a estabilidade do país. O Irã negou que suas embarcações tenham sido destruídas, com o comandante da marinha iraniana, Shahram Irani, afirmando que a força naval permanece 'viva e bem'.", "economia": "O Ministério relaxou as regras do subsídio de investimento, facilitando o processo de obtenção de subsídios para investimentos. Por outro lado, o presidente do Federal Reserve indicou que aumentos de taxas de juros podem ser necessários devido à alta inflação nos Estados Unidos. No Brasil, a Receita Federal pagará o último lote do Imposto de Renda amanhã, e o juro médio do rotativo do cartão de crédito caiu para 436,2% ao ano em julho, conforme informado pelo Banco Central. As ações de farmacêuticas nos Estados Unidos registraram um ano recorde, atingindo novas máximas em agosto, com investidores buscando diversificar suas carteiras e impulsionados por resultados positivos de ensaios clínicos. O petróleo venezuelano será usado para reabastecer as reservas de emergência dos EUA, anunciou o presidente Donald Trump, enquanto a China investirá 20 bilhões de dólares para se tornar líder na inovação robótica industrial. Além disso, a Meta enfrenta um julgamento em tribunal federal por cerca de 47 estados que acusam a empresa de promover produtos viciantes e prejudiciais para jovens, similar ao enfrentado pela indústria do tabaco.", "tecnologia": "O Google Maps atualizou suas mapas para refletir a renomeação do Lago Ontario para Lago América, em resposta a uma ordem executiva do presidente Trump. Este movimento faz parte de uma série de mudanças geográficas em mapas digitais, enquanto Apple Maps mantém o nome original. Além disso, o Telescópio Espacial Nancy Grace Roman, após enfrentar problemas de financiamento e mudanças de nome, está prestes a iniciar uma pesquisa sem precedentes do universo. Na indústria de tecnologia, várias empresas estão oferecendo produtos em promoção, incluindo smart speakers, câmeras de segurança, headsets gamer e memórias RAM DDR5. A indústria de jogos também está em movimento, com vários títulos importantes sendo lançados em setembro de 2026, incluindo Marvel’s Wolverine para a PlayStation. Por fim, a Anthropic enfrenta acusações de plágio de Sony Music Publishing e Warner, em uma ação judicial que adiciona pressão ao setor de inteligência artificial.", "ciencia": "A NASA lançou o telescópio Roman, avaliado em 4,3 bilhões de dólares, em um foguete Falcon Heavy da SpaceX. Seu objetivo é explorar o universo em busca de informações sobre energia e matéria escuras. Este novo equipamento terá um campo de visão 100 vezes maior que o Hubble e será usado para investigar mistérios do universo, como a matéria escura e a energia escura, descobrir exoplanetas e estudar estrelas. O telescópio será fundamental para mapear alguns dos maiores mistérios do universo, incluindo a compreensão da natureza da energia e da matéria escuras. Além disso, a NASA está preparando o lançamento de seu novo telescópio espacial flagship, o Roman, no próximo domingo, em uma missão multi-anos para criar um mapa cosmológico sem precedentes e iluminar algumas das maiores mistérias da física.", "cultura": "O festival Daisy Chain Fields, organizado pela cantora Olivia Rodrigo, arrecadou US$ 20 milhões, graças a uma doação de Melinda French Gates, conforme informou o Variety. Durante seu show de abertura, Olivia agradeceu ao público. Além disso, a cantora Kacey Musgraves teve seu palco literalmente pegando fogo durante um show no TD Garden Arena em Boston, brincando que havia usado muito aerosol para cabelos, informou o Consequence. O grupo Dinosaur Jr. anunciou uma turnê para 2027, que incluirá apresentações na América do Norte, com Starcrawler como artista convidado, segundo o Pitchfork. No Reino Unido, apesar do mau tempo, o festival Creamfields reuniu uma multidão de várias idades que dançou até a madrugada, destacando a paixão pela cultura festivaleira inglesa, conforme relatou o Clarín.", "sociedade": "Um estudante da UFRJ foi investigado após ser agredido e negou acusações, afirmando não ser nazista. A Unicamp implementou um procedimento inédito para a defesa póstuma de uma aluna e sua orientadora falecidas, permitindo a conclusão do trabalho acadêmico. Em São Paulo, Malévola Alves foi detida após uma briga em uma festa, mas foi liberada após pagar fiança. Adriana Silva dos Santos, de 48 anos, foi morta a tiros em um bar em Pindamonhangaba, e seu filho foi baleado ao tentar confrontar o suspeito. No Nepal, esforços intensificados foram feitos para resgatar trabalhadores presos em túneis após inundações, enquanto em Santa Catarina e Rio Grande do Sul, temporais causaram emergências e feridos. A Enel dobrou seu investimento socioambiental no Brasil, enquanto um diretor de escola no Nepal salvou 900 estudantes durante inundações. Em São Paulo, a segurança alimentar inspirada na França está sendo experimentada em canteens comunitários, e em Hong Kong, a sociedade está reavaliando a abordagem para a esquizofrenia, focando em reintegração social.", "meio_ambiente": "O Nepal enfrenta uma crise sem precedentes devido a inundações e deslizamentos de terra causados por fortes chuvas no Himalaia. Até o momento, 700 pessoas foram confirmadas como mortas, e mais de 3.000 estão desaparecidas. O colapso de um gelo na região também levou a cerca de 800 mortes. As autoridades locais intensificaram os esforços de resgate, mas enfrentam dificuldades devido ao aumento do nível da água nos rios. Na região sul, fortes chuvas inundaram estradas e isolaram caminhantes. Em outras partes do país, a escassez de água e as mudanças climáticas levaram as comunidades a restaurar sistemas hídricos antigos, que haviam sido abandonados há centenas de anos.", "direitos_humanos": "Em setembro, o Supremo Tribunal Federal (STF) julgará questões relacionadas a licença para mães adotivas, recusa de transfusão sanguínea, planos de saúde de idosos, gratuidade na Justiça do Trabalho e recusa de tratamento médico. No entanto, o cenário internacional apresenta vários desafios significativos para os direitos humanos. Na Cisjordânia, 235 crianças e adolescentes palestinos foram mortos pelas forças israelenses em 16 meses após outubro de 2023, conforme relatório do The Japan Times. Em Gaza, a Comissão Internacional da Cruz Vermelha transferiu 13 detidos palestinos libertados para o Hospital Nasser, denunciando o acesso negado às instalações de detenção israelenses desde outubro de 2023. No Paquistão, o governo suspendeu oito funcionários após um incêndio em uma unidade materna resultar na morte de 14 bebês, refletindo preocupações sobre a segurança e os direitos dos mais vulneráveis. Além disso, a retórica anti-muçulmana online na África do Sul colide com a realidade mais complexa no solo, enquanto a ascensão do partido anti-imigrante AfD na Alemanha preocupa com o aumento do extremismo de direita."}, "resumo_do_dia": {"politica_nacional": [{"id": 133597, "titulo": "TRF-4 propõe perda de cargo a Eduardo Appio, ex-juiz da Lava Jato suspeito de furtar champanhe", "url": "https://www.cartacapital.com.br/justica/trf-4-propoe-perda-de-cargo-a-eduardo-appio-ex-juiz-da-lava-jato-suspeito-de-furtar-champanhe/", "fonte_id": "cartacapital", "data_pub": "2026-08-30T17:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Regional Federal da 4ª Região (TRF-4) propôs a perda do cargo para Eduardo Appio, ex-juiz da Lava Jato suspeito de furtar champanhe. Appio classificou a decisão como injusta e desproporcional em nota.", "titulo_pt": "TRF-4 propõe perda de cargo a Eduardo Appio, ex-juiz suspeito de furtar champanhe", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 133614, "titulo": "Split payment entre empresas deve ser obrigatório só em 2028", "url": "https://www.poder360.com.br/poder-economia/split-payment-entre-empresas-deve-ser-obrigatorio-so-em-2028/", "fonte_id": "poder360", "data_pub": "2026-08-30T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A split payment entre empresas será obrigatória apenas em 2028, conforme informado pela Secretaria da Receita Federal. A implementação envolve a complexidade de integrar mais de 200 instituições financeiras.", "titulo_pt": "Split payment entre empresas será obrigatório em 2028", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 133653, "titulo": "Caiado vai à Paulista em meio a ato do fim da 6x1 e mostra apoio restrito", "url": "https://www.metropoles.com/sao-paulo/caiado-paulista-6x1", "fonte_id": "metropoles", "data_pub": "2026-08-30T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidenciável Ronaldo Caiado e a candidata à Alesp Mara Gabrilli realizaram um ato na Avenida Paulista neste domingo (30/8).", "titulo_pt": "Caiado participa de ato na Paulista após derrota eleitoral", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 133585, "titulo": "Nervosismo e generalidades marcam entrevistas de presidenciáveis na Globo", "url": "https://redir.folha.com. m precisa parar os 'tech bros', magnatas tecnológicos omnipotentes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 133655, "titulo": "Petista cobra divisão de recursos justa e ameaça abandonar campanha em MG", "url": "https://www.metropoles.com/minas-gerais/petista-cobra-divisao-de-recursos-justa-e-ameaca-abandonar-campanha-em-mg", "fonte_id": "metropoles", "data_pub": "2026-08-30T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Candidatos a deputados petistas em Minas Gerais expressaram insatisfação com a distribuição desigual de recursos para a campanha. Eles ameaçam abandonar a campanha se a situação não for corrigida.", "titulo_pt": "Petista em MG reclama de divisão desigual de recursos e ameaça abandonar campanha", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 133615, "titulo": "Flávio se reúne com ministro da Justiça de Bukele e se diz inspirado", "url": "https://www.poder360.com.br/poder-eleicoes-2026/flavio-se-reune-com-ministro-da-justica-de-bukele-e-se-diz-inspirado/", "fonte_id": "poder360", "data_pub": "2026-08-30T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro se reuniu com o ministro da Justiça de El Salvador, Gustavo Portillo, e afirmou estar inspirado por suas ideias. Durante a conversa, Flávio criticou o presidente Lula, afirmando que ele 'defende bandidos'. Flávio também mencionou a possibilidade de criar um Ministério da Segurança Pública se for eleito.", "titulo_pt": "Flávio se reúne com ministro da Justiça de Bukele e se diz inspirado", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 133624, "titulo": "Toffoli aponta ilicitudes e trava análise de registro de candidatura de Renan Santos", "url": "https://veja.abril.com.br/politica/toffoli-aponta-ilicitudes-e-trava-analise-de-registro-de-candidatura-renan-santos/", "fonte_id": "veja", "data_pub": "2026-08-30T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do TSE, Toffoli, identificou ilicitudes e está impedindo a análise do registro de candidatura do presidenciável Renan Santos. Há expectativa de que o procedimento para atestar a legalidade da candidatura comece a ser apreciado em plenário virtual naquele dia.", "titulo_pt": "Toffoli aponta ilicitudes e trava análise de registro de candidatura de Renan Santos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 133660, "titulo": "Igape: Michelle Bolsonaro lidera disputa ao Senado no Distrito Federal", "url": "https://www.metropoles.com/colunas/grande-angular/igape-michelle-bolsonaro-lidera-disputa-ao-senado-no-distrito-federal", "fonte_id": "metropoles", "data_pub": "2026-08-30T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michelle Bolsonaro lidera as intenções de votos para a disputa ao Senado no Distrito Federal, aparecendo como favorita tanto para o primeiro quanto para o segundo turno, com 27,1% e 14,8% das intenções, respectivamente.", "titulo_pt": "Michelle Bolsonaro lidera disputa ao Senado no Distrito Federal", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 133661, "titulo": "No RS, Zema defende ampliação do Seguro Agrícola: \"Estado precisa acordar\"", "url": "https://www.metropoles.com/brasil/no-rs-zema-critica-ministerio-e-seguro-agricola-estado-precisa-acordar", "fonte_id": "metropoles", "data_pub": "2026-08-30T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Zema, candidato à Presidência, criticou a cobertura do Seguro Agrícola e acusou o Ministério do Desenvolvimento Agrário de financiar invasões no Rio Grande do Sul.", "titulo_pt": "Zema critica Seguro Agrícola e acusa ministério de financiar invasões no RS", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 133616, "titulo": "Jingle na Bahia é adaptado contra Flávio Bolsonaro", "url": "https://www.poder360.com.br/poder-eleicoes-2026/jingle-na-bahia-e-adaptado-contra-flavio-bolsonaro/", "fonte_id": "poder360", "data_pub": "2026-08-30T17:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma música adaptada com o mote 'Jingle na Bahia' está sendo compartilhada nas redes sociais, chamando o senador Flávio Bolsonaro, candidato do PL à Presidência, de 'Bolsomaster'.", "titulo_pt": "Música adaptada nas redes sociais chama Flávio Bolsonaro de bolsomaster", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 133617, "titulo": "Jingles viram arsenal contra ACM Neto e Jerônimo na Bahia", "url": "https://www.poder360.com.br/poder-eleicoes-2026/jingles-viram-arsenal-contra-acm-neto-e-jeronimo-na-bahia/", "fonte_id": "poder360", "data_pub": "2026-08-30T17:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha eleitoral na Bahia inclui a utilização de jingles musicais como ferramenta de ataque político, criticando tanto ACM Neto quanto Jerônimo. Um dos jingles ironiza Flávio Bolsonaro e utiliza uma expressão regional para zombar de alguém.", "titulo_pt": "Jingles se tornam armas na campanha contra ACM Neto e Jerônimo na Bahia", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 133717, "titulo": "Governo prevê aporte de R$ 6 bilhões do Orçamento de 2027 aos Correios", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/governo-preve-aporte-de-r-6-bilhoes-do-orcamento-de-2027-aos-correios/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T17:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo planeja injetar R$ 6 bilhões do Orçamento de 2027 na estatal Correios como parte de um plano de reestruturação que visa reduzir despesas e melhorar o perfil da dívida.", "titulo_pt": "Governo prevê aporte de R$ 6 bilhões do Orçamento de 2027 aos Correios", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133591, "titulo": "Comércio, serviços e turismo lançam campanha contra votação da escala 6x1 antes das eleições", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/comercio-servicos-e-turismo-lancam-campanha-contra-votacao-da-escala-6x1-antes-das-eleicoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-30T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CNC lançou uma campanha contra a votação e possível extinção da escala de trabalho 6x1, pedindo que a proposta não seja votada antes das eleições. A entidade destaca a proximidade das eleições como um fator de alarme para os associados.", "titulo_pt": "Comércio, serviços e turismo lançam campanha contra votação da escala 6x1 antes das eleições", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 133644, "titulo": "Em SP, ato reúne milhares de pessoas pelo fim da escala 6×1; PEC vai à CCJ nesta semana", "url": "https://www.brasildefato.com.br/2026/08/30/em-sp-ato-reune-milhares-de-pessoas-pelo-fim-da-escala-6x1-pec-vai-a-ccj-nesta-semana/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-30T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O domingo (30) viu a realização de atos em várias capitais brasileiras contra a escala 6×1, com o objetivo de pressionar pela aprovação da PEC que reduz a carga horária de trabalho para 40 horas. Estes atos reuniram milhares de pessoas em diversas cidades, incluindo Brasília, Salvador e Rio de Janeiro.", "titulo_pt": "Em SP, ato reúne milhares de pessoas pelo fim da escala 6×1; PEC vai à CCJ nesta semana", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 134073, "titulo": "Beware of China’s long-arm acts: MAC", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/31/2003863405", "fonte_id": "taipei_times", "data_pub": "2026-08-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O título sugere um aviso sobre as ações de longo alcance da China. A frase indica que uma organização chamada MAC está alertando sobre esse assunto.", "titulo_pt": "Atenção às ações de longo alcance da China: MAC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 133810, "titulo": "Hunt Underway After Deadly Shooting at Swiss Rave", "url": "https://www.nytimes.com/2026/08/30/world/europe/switzerland-rave-shooting.html", "fonte_id": "nyt_world", "data_pub": "2026-08-30T17:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um participante de uma festa noturna morreu e cinco ficaram feridos no início do domingo em uma festa de dança em um hipódromo na região norte da Suíça.", "titulo_pt": "Busca em andamento após tiroteio letal em Rave na Suíça", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 133848, "titulo": "Captain and crew arrested after at least seven die in Northern Cyprus ferry disaster – latest updates", "url": "https://www.theguardian.com/world/live/2026/aug/30/northern-cyprus-ferry-capsizes-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-08-30T17:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 23 pessoas morreram e 23 estão desaparecidas após um ferry com aproximadamente 270 passageiros se capotar perto da costa do Chipre do Norte. Cerca de 237 pessoas foram resgatadas.", "titulo_pt": "Capitão e tripulação detidos após pelo menos sete mortes em desastre de ferry no chipre do norte – atualizações", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 134017, "titulo": "Israeli forces shoot two Palestinians during settler attacks near Ramallah", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-forces-shoot-two-palestinians-during-settler-attacks-near", "fonte_id": "middle_east_eye", "data_pub": "2026-08-30T17:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois palestinos foram feridos quando forças israelenses dispararam balas reais durante ataques de setleres perto do vilarejo de al-Mughayyir, na Cisjordânia Ocidental. As forças israelenses estavam permitindo os ataques restringindo o acesso ao vilarejo e à área circundante apenas para os setleres.", "titulo_pt": "Forças israelenses disparam contra palestinos durante ataques de setleres perto de Ramallah", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 133808, "titulo": "Iceland Votes to Steer Clear of European Union Talks", "url": "https://www.nytimes.com/2026/08/30/world/europe/iceland-eu-referendum-talks.html", "fonte_id": "nyt_world", "data_pub": "2026-08-30T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os icelândicos rejeitaram uma proposta para retomar as negociações de adesão à União Europeia, após uma discussão dividida. O referendo registrou o maior número de votos em quase vinte anos.", "titulo_pt": "Icelandos rejeitam proposta de reatar negociações com a união europeia", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 133657, "titulo": "Trump diz que petróleo da Venezuela será usado para reabastecer reservas", "url": "https://www.metropoles.com/brasil/trump-diz-que-petroleo-da-venezuela-sera-usado-para-reabastecer-reservas", "fonte_id": "metropoles", "data_pub": "2026-08-30T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, declarou que o petróleo da Venezuela será utilizado para reabastecer as reservas dos Estados Unidos.", "titulo_pt": "Trump diz que petróleo da Venezuela será usado para reabastecer reservas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 134038, "titulo": "La Russa, mai chiesto sostituzione Ranucci, che Dio ce lo conservi", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/30/la-russa-mai-chiesto-sostituzione-ranucci-che-dio-ce-lo-conservi_486bba55-0135-403d-b744-fbc2aa85afc1.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-30T17:33:00Z", "idioma": "it", "provavel nque-misr", "fonte_id": "middle_east_eye", "data_pub": "2026-08-30T17:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades monetárias dos Emirados Árabes Unidos e do Egito estão coordenando em relação à Banque Misr, após o Tesouro dos Estados Unidos cortar as transações em dólares com todas as filiais da banca no Emirados Árabes Unidos devido às relações da banca com a Irã. A Banque Misr afirmou que tomará todas as medidas necessárias para manter suas operações normais.", "titulo_pt": "Bancos centrais dos emirados árabes unidos e do egito coordenam em relação à Banque Misr", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 133951, "titulo": "Trump says NBC journalist to be reported to FCC for ‘punishment’ over endorsement coverage", "url": "https://www.france24.com/en/americas/20260830-trump-says-nbc-journalist-to-be-reported-to-fcc-for-punishment-over-endorsement-coverage", "fonte_id": "france24", "data_pub": "2026-08-30T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Donald Trump afirmou que vai denunciar a jornalista Kristin Welker, da NBC, ao Federal Communications Commission (FCC) por 'repreensão ou punição' após ela relatar que o presidente teve resultados mistos em sua endossos para as eleições de outubro.", "titulo_pt": "Trump ameaça denunciar jornalista à FCC por cobertura de endossos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 134020, "titulo": "Tanker struck by projectile in Hormuz, UKMTO says", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/tanker-struck-projectile-hormuz-ukmto-says", "fonte_id": "middle_east_eye", "data_pub": "2026-08-30T17:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um navio-tanque foi atingido por um projétil desconhecido enquanto transitava para oeste pelo Estreito de Ormuz, de acordo com a United Kingdom Maritime Trade Operations. O incidente ocorreu a 12 milhas náuticas ao norte da cidade de Khasab, Omã, sem causar vítimas ou impacto ambiental, conforme informado pelas autoridades.", "titulo_pt": "Navio-tanque atingido por projétil no estreito de Ormuz, diz UKMTO", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 134148, "titulo": "Venezuela vowed not to ‘hand over’ its oil. Trump aims to grab a windfall.", "url": "https://www.washingtonpost.com/world/2026/08/30/venezuela-vowed-not-hand-over-its-oil-trump-aims-grab-windfall/", "fonte_id": "washington_post_world", "data_pub": "2026-08-30T16:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O acordo reafirma o domínio dos Estados Unidos sobre a Venezuela, que se tornou uma neo-colônia após o capturamento do ex-presidente Nicolás Maduro por tropas americanas em janeiro. O governo venezuelano se comprometeu a não 'entregar' suas reservas de petróleo, enquanto o presidente Trump buscava explorar esses recursos para obter lucros.", "titulo_pt": "Venezuela se nega a 'entregar' seu petróleo. Trump busca lucros com os recursos venezuelanos.", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 134080, "titulo": "Ministry relaxes investment subsidy regulations", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/31/2003863419", "fonte_id": "taipei_times", "data_pub": "2026-08-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério relaxou as regulamentações do subsídio de investimento. Essa mudança visa facilitar o processo de obtenção de subsídios para investimentos.", "titulo_pt": "Ministério relaxa regulamentações de subsídio de investimento", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 134096, "titulo": "Fed chair signals rate hikes might be needed with US inflation still elevated", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/31/2003863395", "fonte_id": "taipei_times", "data_pub": "2026-08-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do Federal Reserve sinalizou que aumentos de taxas de juros podem ser necessários, uma vez que a inflação nos Estados Unidos ainda está elevada.", "titulo_pt": "Fed chair sinaliza possíveis aumentos de taxas de juros devido à inflação elevada nos EUA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 133747, "titulo": "Os milhões de argentinos com dívidas em atraso e o que isso indica sobre a economia do país: 'Não tentamos mais refinanciar porque é impagável'", "url": "https://www.bbc.com/portuguese/articles/cdr7jn02g13o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-30T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um em cada três argentinos tem dificuldades para quitar dívidas contraídas com bancos, fintechs e usos não formais de crédito. Isso indica problemas significativos no sistema financeiro e na economia do país.", "titulo_pt": "Argentinos com dívidas em atraso: indicativo de problemas na economia", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 133703, "titulo": "Naufrágio no norte de Chipre deixa 7 mortos e vários desaparecidos", "url": "https://www.infomoney.com.br/mundo/naufragio-no-norte-de-chipre-deixa-7-mortos-e-varios-desaparecidos/", "fonte_id": "infomoney", "data_pub": "2026-08-30T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um barco de propriedade privada naufragou no norte de Chipre, deixando 7 mortos e vários desaparecidos. O incidente ocorreu por volta das 12h30 (horário local) após a embarcação começar a encher de água por motivo desconhecido.", "titulo_pt": "Naufrágio no norte de Chipre deixa 7 mortos e vários desaparecidos", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 133590, "titulo": "Ações de farmacêuticas disparam nos EUA com investidores buscando alternativas a 'boom' de IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/acoes-de-farmaceuticas-disparam-nos-eua-com-investidores-buscando-alternativas-a-boom-de-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-30T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações das empresas farmacêuticas registraram um ano recorde, atingindo novas máximas em agosto, com investidores buscando diversificar suas carteiras e impulsionados por resultados positivos de ensaios clínicos.", "titulo_pt": "Ações de farmacêuticas registram ano recorde com busca por alternativas à 'boom' de IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 133704, "titulo": "Receita paga último lote do Imposto de Renda amanhã; veja se você tem direito", "url": "https://www.infomoney.com.br/minhas-financas/receita-paga-ultimo-lote-do-imposto-de-renda-amanha-veja-se-voce-tem-direito/", "fonte_id": "infomoney", "data_pub": "2026-08-30T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O pagamento do último lote de restituição do Imposto de Renda será feito amanhã, na conta correspondente à chave Pix do tipo CPF informada na declaração. Os contribuintes devem verificar se têm direito à restituição.", "titulo_pt": "Receita paga último lote do Imposto de Renda amanhã; veja se você tem direito", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 133705, "titulo": "Juro médio do rotativo do cartão de crédito cai a 436,2% ao ano em julho, afirma BC", "url": "https://www.infomoney.com.br/economia/juro-medio-do-rotativo-do-cartao-de-credito-cai-a-4362-ao-ano-em-julho-afirma-bc/", "fonte_id": "infomoney", "data_pub": "2026-08-30T16:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juro médio do rotativo do cartão de crédito caiu para 436,2% ao ano em julho, conforme informado pelo Banco Central. A lei estabeleceu que os juros do rotativo e do parcelado não devem ultrapassar 100% do princip money", "data_pub": "2026-08-30T16:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A expectativa é que os efeitos do El Niño comecem a ser percebidos com mais força a partir de outubro, levando a desligamentos mais longos de energia, segundo o diretor da Abradee.", "titulo_pt": "Sem luz? El Niño vai provocar desligamentos mais longos, afirma diretor da Abradee", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 133710, "titulo": "População brasileira ainda cresce, porém cada vez mais devagar; entenda impactos", "url": "https://www.infomoney.com.br/economia/populacao-brasileira-ainda-cresce-porem-cada-vez-mais-devagar-entenda-impactos/", "fonte_id": "infomoney", "data_pub": "2026-08-30T16:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O crescimento da população brasileira está diminuindo gradualmente, acelerando o envelhecimento da população e reduzindo a proporção de pessoas em idade ativa, o que pode ameaçar a sustentabilidade da previdência social.", "titulo_pt": "População brasileira continua a crescer, mas com ritmo mais lento; entenda os impactos", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 133725, "titulo": "Alta do diesel desafia logística e empresas buscam saídas", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/alta-do-diesel-desafia-logistica-e-empresas-buscam-saidas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-30T16:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O aumento do diesel representa um desafio logístico significativo, especialmente para o transporte de longa distância, onde o combustível pode compor até 40% do custo do frete.", "titulo_pt": "Aumento do diesel desafia logística", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 133711, "titulo": "Dias de folga, período de transição e jornada semanal: como seria fim da escala 6×1?", "url": "https://www.infomoney.com.br/economia/dias-de-folga-periodo-de-trans
