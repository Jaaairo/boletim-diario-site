<html lang="pt-BR">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

chment do presidente Santiago Peña, revelou o que era conhecido como o 'paraíso liberal bolsonarista'. O Paraguai, um exemplo para a extrema direita, agora enfrenta a destituição de seu líder após a falência de um banco digital que desencadeou uma crise bancária significativa, deixando mais de 60% da população sem acesso aos seus depósitos. Em contraste, o Papa Francisco visitou um dos bairros mais pobres de Montevidéu, no Uruguai, para doar casas e aliviar a situação de moradias precárias. No Brasil, Luiz Inácio Lula da Silva foi reeleito para um segundo mandato, enquanto nos Estados Unidos, os Democratas conquistaram vitórias nas eleições de meio de mandato, fortalecendo a oposição ao governo republicano. Esses eventos refletem as mudanças políticas e econômicas em curso no continente americano, com implicações significativas para as relações internacionais e o futuro das democracias na região.\n\nOs Estados Unidos enfrentam uma série de desafios geopolíticos, incluindo a captura de um suspeito com armas perto da Casa Branca e a ameaça de ataques a navios comerciais no Estreito de Ormuz. A guerra entre Israel e o Irã continua afetando a região, com o Irã rejeitando a reconstrução de bases americanas e as forças militares iranianas em maior alerta. O presidente dos Estados Unidos, Donald Trump, confirmou ataques menores ao Irã e reiterou que isso não constitui uma guerra. As tensões também se intensificaram no Mar Negro, onde ataques russos transformaram a área em um perigo maior para os marinheiros. Além disso, a Ucrânia relatou feridos em ataques russos, enquanto Israel realizou operações na Cisjordânia ocupada. O Japão considera fazer um pagamento antecipado à Corte Penal Internacional devido a possíveis sanções dos Estados Unidos, enquanto Taiwan ativa um fundo de estabilização de mercado de ações em resposta a uma queda significativa nos mercados de ações.", "economia": "O dólar encerrou o dia em alta, cotado a R$ 5,51, influenciado pela divulgação de dados do mercado de trabalho americano e pelas expectativas sobre a política econômica do governo Lula, conforme informado pela Agência Brasil Economia. As ações de Wall Street recuperaram-se parcialmente após uma queda de US$ 3,2 trilhões nos papéis relacionados à inteligência artificial, devido a preocupações com o setor, conforme relatado pelo Folha Mercado. A Meta suspendeu as atualizações dos termos comerciais da empresa, inicialmente programadas para 20 de novembro, após críticas da mídia global e um revés judicial no Brasil, conforme informado pelo Folha Mercado. O petróleo fechou em alta, mas recuou 13% na semana após a eleição nos Estados Unidos, em virtude das incertezas sobre como a vitória dos democratas nas eleições de meio de mandato pode afetar a relação entre os EUA e o Irã, conforme relatado pelo Infomoney. A China está expandindo seus mercados internacionais de e-bicicletas devido ao aumento contínuo dos preços do combustível, enquanto a Índia selecionou 28 itens prioritários para investimentos no valor de 370 trilhões de ienes, incluindo semicondutores e inteligência artificial, conforme informado pelo Japan Times. A agricultura familiar no Brasil enfrenta dificuldades para acessar os recursos necessários para aumentar sua produtividade e renda, enquanto o governo prevê investir R$ 12 bilhões no transporte público gratuito nos fins de semana, mas o setor estima que a quantia pode não ser suficiente, conforme relatado pelo Folha Mercado. Além disso, a Meta oferece uma recompensa de até 20 milhões de dólares para informações sobre o programa nuclear iraniano, enquanto a China tem reservas de moeda estrangeira que caíram abaixo dos US$ 600 bilhões, conforme informado pelo SCMP e pelo Taipei Times, respectivamente.", "tecnologia": "A inteligência artificial (IA) continua sendo um tema central na tecnologia, com várias notícias importantes recentemente. A empresa Anthropic, especializada em IA, planeja realizar uma oferta inicial de ações (IPO) com uma avaliação alvo de 1,5 trilhão de dólares, apesar da forte queda no setor de tecnologia. A OpenAI, por sua vez, foi avaliada em 1,25 trilhões de dólares em uma nova rodada de financiamento que arrecadou 11 bilhões de dólares, conforme informou a Bloomberg. Além disso, a Mirae Asset Securities Co. relatou brechas de segurança que expuseram informações de clientes e funcionários. Em outro desenvolvimento, a polícia de Kaohsiung prendeu um homem suspeito de roubar dados relacionados à IA. Sobre a IA, a FDA está investigando um risco potencial de formação de tumores, incluindo câncer, associado à terapia genética Zolgensma da Novartis. Por fim, a Tesla anunciou que vai encerrar gradualmente a produção da Cybertruck em sua fábrica no Texas por volta de meados de 2027, após anos de baixas vendas.", "ciencia": "O COP31, embora não seja esperado para salvar o mundo da catástrofe climática, ainda pode oferecer uma pequena amostra do potencial de reuniões internacionais para alcançar progressos significativos. Por outro lado, um novo estudo liderado pelo pesquisador Philipp Aglas-Leitner da Freie Universität Berlin, publicado na Nature Communications, indica que futuros eventos de calor extremo podem durar mais tempo, afetar áreas maiores e serem muito mais severos do que os eventos recentes observados. Este aviso climático segue a devolução do crânio de um indivíduo da Revolta dos Malês, um momento histórico significativo para o Brasil, após quatro anos de negociações com a Universidade Harvard. Outros desenvolvimentos científicos incluem a utilização de silício com buracos de ar para criar espelhos planos que focam luz no ultravioleta, permitindo óptica compacta, e a descoberta de um método baseado em luz para revitalizar compostos químicos que não avançaram no processo de desenvolvimento de medicamentos, oferecendo novas perspectivas para a pesquisa farmacêutica.", "cultura": "A indústria criativa enfrenta desafios significativos para iniciantes, conforme mostrado em diversos artigos. Uma pesquisa realizada com 27 pessoas pela Creative Lives in Progress, em parceria com organizações como D&AD e Craft, revela que a situação inicial na indústria é particularmente difícil. Os participantes expressaram preocupações sobre a dificuldade de iniciar uma carreira criativa, com a possibilidade de o primeiro emprego ser um contrato temporário, como apontado por Nik Gunn. No entanto, a esperança persiste, com propostas como a hospedagem de iniciantes por estúdios, sugerida por Hilary Chittenden, oferecendo uma luz no fim do túnel. Além disso, a cultura criativa também se destaca com o lançamento de novos projetos artísticos, como o espetáculo 'GinGama', que mistura capoeira, poesia e música para contar a história de Luiz Gama, e a volta de Klara Castanho às novelas da Globo, marcando a estreia de sua próxima trama, 'Elas Que Lutem'.", "sociedade": "Um suspeito foi preso pela polícia suspeito de matar sua companheira a facadas em São Vicente, no litoral de São Paulo, e a criança de 4 anos que encontrou o corpo da mãe, vítima de feminicídio, foi levada à delegacia. Em São Paulo, um prédio de quatro andares desabou no Brás, causando feridos e mobilizando policiais militares e bombeiros para o resgate. Em Minas Gerais, uma nova proprietária de um apartamento encontrou uma ossada no imóvel, levando a uma investigação sobre uma possível morte por intoxicação de remédios há um ano. No Rio de Janeiro, uma médica foi acusada de causar a morte de uma paciente durante uma lipoescultura, após a cirurgia ter perfurado o intestino da vítima. Em São Bernardo do Campo, Grande SP, uma adolescente de 17 anos foi morta durante uma abordagem policial, sendo atingida com tiros no rosto e no peito. Outros assuntos abordados incluem a fome oculta na Alemanha, que causa cerca de 50 mil mortes por ano, e a criação de um novo órgão regulador para a medicina no Brasil, similar à OAB, sancionado pelo presidente Lula. Além disso, a Fundação Todas revelou que 78% das mulheres postergaram cuidados de saúde necessários no último ano, e o pai de Meghan Markle foi preso nos EUA por suspeita de abuso infantil, com possibilidade de uma pena de até 20 anos de prisão.", "meio_ambiente": "No mês de outubro de 2026, foi registrado a temperatura mais alta já medida, conforme informado pelo serviço climático da União Europeia. Um El Niño excepcionalmente forte contribuiu para o aquecimento global. Diante dessas mudanças climáticas, a Agência das Nações Unidas para Refugiados alertou que 90 milhões de pessoas estão em risco devido às mudanças climáticas, solicitando financiamento para auxiliar comunidades vulneráveis em países afetados por secas, inundações e calor extremo. No Brasil, o governo aprovou um plano para reduzir o desmatamento até 2030, englobando quatro frentes de atuação e incluindo medidas para aumentar o financiamento, a assistência técnica e o acesso a mercados. Além disso, nos Estados Unidos, foi registrado o maior número de casos de sarampo em 30 anos, com 5.182 casos desde o início de 2026, após a erradicação da doença em 2000. Na Nova Zelândia, mais de 40 baleias-piloto morreram após encalhar na costa, enquanto em São Paulo, outubro de 2026 foi o segundo mais chuvoso desde 1995, com 220,3 mm de precipitação.", "direitos_humanos": "Um líder de seita no Quênia foi condenado a 200 anos de prisão por ser responsável pela morte de 190 crianças. A sentença resultou de uma investigação que mostrou que ele incentivava os seguidores a deixarem seus filhos morrerem de fome, sob a alegação de que isso aconteceria antes do fim do mundo. Em Hong Kong, Joshua Wong, um ativista oposicionista, foi condenado a mais 10 anos de prisão, totalizando 15 anos, em um segundo julgamento recente. O governo de Hong Kong rebateu críticas de 10 países, incluindo aliados da 'Five Eyes', sobre a sentença de Wong, acusando-os de distorcerem os fatos e difamar a lei de segurança nacional da cidade. A Organização das Nações Unidas alertou que milhões de refugiados no Sudão estão em risco de perderem o abrigo devido à escassez de fundos, enquanto a Polícia Federal investiga o tráfico humano envolvendo brasileiras que seriam enviadas para a Suíça."}, "resumo_do_dia": {"politica_nacional": [{"id": 249636, "titulo": "Proposta assegura exame periódico no SUS para pessoas com diabetes", "url": "https://www.poder360.com.br/poder-congresso/proposta-assegura-exame-periodico-no-sus-para-pessoas-com-diabetes/", "fonte_id": "poder360", "data_pub": "2026-11-07T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proposta estabelece uma periodicidade mínima para exames de pessoas com diabetes no SUS, conforme a orientação médica. O texto precisa ser aprovado pela Câmara dos Deputados e pelo Senado.", "titulo_pt": "Proposta assegura exame periódico no SUS para pessoas com diabetes", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 249637, "titulo": "Morar perto de áreas verdes está ligado a menor risco de diabetes", "url": "https://www.poder360.com.br/poder-saude/morar-perto-de-areas-verdes-esta-ligado-a-menor-risco-de-diabetes/", "fonte_id": "poder360", "data_pub": "2026-11-07T09:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo com mais de 400 mil pessoas mostrou que há uma menor incidência de diabetes tipo 2 entre os moradores de áreas com maior presença de jardins e parques.", "titulo_pt": "Morar próximos a áreas verdes está associado a menor risco de diabetes", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 249769, "titulo": "Debate sobre juros tem tudo a ver com mobilização juvenil e popular que levou Lula à vitória, diz André Singer", "url": "https://www.bbc.com/portuguese/articles/cr62yv4gjd97o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-07T09:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "André Singer afirma que a vitória de Lula foi resultado da mobilização juvenil e popular, do pacote para o bolso do eleitor e do apoio de Janones. O cientista político também destaca que o avanço da direita radical representa uma ameaça que não foi superada com o resultado da eleição.", "titulo_pt": "Debate sobre juros tem tudo a ver com mobilização juvenil e popular que levou Lula à vitória, diz André Singer", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 249638, "titulo": "Software de IA mapeia genes de vírus de bactérias com 98% de precisão", "url": "https://www.poder360.com.br/poder-tech/software-de-ia-mapeia-genes-de-virus-de-bacterias-com-98-de-precisao/", "fonte_id": "poder360", "data_pub": "2026-11-07T09:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um software de inteligência artificial mapeou os genes de vírus bacterianos com 98% de precisão. A ferramenta Pelican, testada no Cepid B3, superou outros programas e pode contribuir para o desenvolvimento da fagoterapia.", "titulo_pt": "Software de IA mapeia genes de vírus bacterianos com 98% de precisão", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 249639, "titulo": "Como prevenir e comunicar emergências em ambientes escolares", "url": "https://www.poder360.com.br/poder-educacao/como-prevenir-e-comunicar-emergencias-em-ambientes-escolares/", "fonte_id": "poder360", "data_pub": "2026-11-07T09:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Planos de emergência nas escolas devem incluir treinamento, comunicação clara e orientações específicas para cada situação. Esses planos visam garantir a segurança dos alunos e funcionários durante eventos imprevistos.", "titulo_pt": "Como prevenir e comunicar emergências em ambientes escolares", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 249640, "titulo": "Unitree tem alta de 69,9% na receita e queda no lucro no 3º trimestre", "url": "https://www.poder360.com.br/poder-china/unitree-tem-alta-de-699-na-receita-e-queda-no-lucro-no-3o-trimestre/", "fonte_id": "poder360", "data_pub": "2026-11-07T09:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A receita da Unitree, fabricante de robôs, aumentou 69,9% no terceiro trimestre, mas houve uma diminuição no lucro. Após o anúncio do balanço, as ações da empresa caíram.", "titulo_pt": "Unitree registra alta de 69,9% na receita e queda no lucro no 3º trimestre", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 249619, "titulo": "Edgar & Os Fita costuram rap e eletrônica com propriedade", "url": "https://www.cartacapital.com.br/blogs/augusto-diniz/edgar-os-fita-costuram-rap-e-eletronica-com-propriedade/", "fonte_id": "cartacapital", "data_pub": "2026-11-07T09:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O álbum 'Faz Frio mas É Verão' apresenta uma combinação inovadora de rap e eletrônica. A dupla Edgar & Os Fita demonstra competência na criação de uma música urbana original.", "titulo_pt": "Edgar & Os Fita costuram rap e eletrônica com propriedade", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 249641, "titulo": "Mercado pressiona Lula e crise no Paraguai: Por Que Isso Importa?", "url": "https://www.poder360.com.br/poder-videos/mercado-pressiona-lula-e-crise-no-paraguai-por-que-isso-importa/", "fonte_id": "poder360", "data_pub": "2026-11-07T09:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O podcast do Poder360 discute os temas políticos da semana encerrada e os principais eventos da semana seguinte. O mercado pressiona Lula e há uma crise no Paraguai.", "titulo_pt": "Mercado pressiona Lula e crise no Paraguai: Isso Importa?", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 249642, "titulo": "Vale-refeição passa a ser aceito em maquininhas de diferentes operadoras", "url": "https://www.poder360.com.br/poder-economia/vale-refeicao-passa-a-ser-aceito-em-maquininhas-de-diferentes-operadoras/", "fonte_id": "poder360", "data_pub": "2026-11-07T09:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir deste sábado (7 de novembro), a regra que aceita o vale-refeição nas maquininhas de diferentes operadoras entra em vigor, ampliando as opções de uso dos benefícios. No entanto, o setor destaca dificuldades na integração dos sistemas.", "titulo_pt": "Vale-refeição passa a ser aceito em maquininhas de diferentes operadoras", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 249575, "titulo": "Possível nomeação de Salles por Tarcísio contraria Nunes", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/possivel-nomeacao-de-salles-por-tarcisio-contraria-nunes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-07T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Ricardo Salles (Novo-SP) poderia ser nomeado secretário de Justiça e Cidadania pelo governador Tarcísio de Freitas (Republicanos), o que deixou o prefeito Ricardo Nunes (MDB) contrariado.", "titulo_pt": "Nomeação de Salles como secretário contraria Nunes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 249671, "titulo": "Damares tenta levar outras senadoras para Republicanos, além de Michelle", "url": "https://www.metropoles.com/colunas/igor-gadelha/damares-tenta-levar-outras-senadoras-para-republicanos-alem-de-michelle", "fonte_id": "metropoles", "data_pub": "2026-11-07T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Damares Alves busca filiar outras senadoras e deputadas ao Republicanos, seguindo o mesmo caminho que pretende adotar com Michelle Bolsonaro.", "titulo_pt": "Damares tenta levar outras senadoras para Republicanos, além de Michelle", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 249731, "titulo": "Enem 2026: relaxar ou estudar no dia da prova?", "url": "https://www.cnnbrasil.com.br/educacao/enem-2026-relaxar-ou-estudar-no-dia-da-prova/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-07T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Enem de 2026 pode ser preparado com atividades leves como ouvir música e conversar, que ajudam a controlar a ansiedade antes das provas.", "titulo_pt": "Enem 2026: atividades leves ou estudar no dia da prova?", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 249673, "titulo": "Parlamentares de saída podem indicar R$ 11,6 bilhões em emendas de 2027", "url": "https://www.metropoles.com/brasil/parlamentares-de-saida-podem-indicar-r-116-bilhoes-em-emendas-de-2027", "fonte_id": "metropoles", "data_pub": "2026-11-07T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um grupo formado por 235 deputados e senadores pode indicar emendas no valor de R$ 11,6 bilhões para o orçamento de 2027. Esses parlamentares representam cerca de 41% dos recursos destinados às emendas individuais.", "titulo_pt": "Parlamentares de saída podem indicar R$ 11,6 bilhões em emendas de 2027", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 249675, "titulo": "Quebra de banco derruba presidente e cala discurso antipatriota", "url": "https://www.metropoles.com/blog-do-noblat/quebra-de-banco-derruba-presidente-e-cala-discurso-antipatriota", "fonte_id": "metropoles", "data_pub": "2026-11-07T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Santiago Peña foi deposto e o evento causou um impacto nas pessoas que torcem contra a seleção brasileira de futebol.", "titulo_pt": "Colapso do banco interrompe presidente e silencia críticos do Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 249677, "titulo": "Candidatos que prestarão Enem terão serviços de segurança e mobilidade", "url": "https://www.metropoles.com/distrito-federal/candidatos-que-prestarao-enem-terao-servicos-de-seguranca-e-mobilidade", "fonte_id": "metropoles", "data_pub": "2026-11-07T07:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nos dias dos exames, os portões abrem a partir de 12h e fecham às 13h, com início previsto para às 13h30. Os candidatos que participarão do Enem terão serviços de segurança e mobilidade durante os exames.", "titulo_pt": "Candidatos que farão Enem terão serviços de segurança e mobilidade", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 249734, "titulo": "Bolsonaro deve ser julgado no STM sob presidência de ministro que indicou", "url": "https://www.cnnbrasil.com.br/politica/bolsonaro-deve-ser-julgado-no-stm-sob-presidencia-de-ministro-que-indicou/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-07T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Leonardo Puntel será eleito em dezembro para presidir o STM, deixando de votar nas ações sobre o julgamento de Bolsonaro. A presidente atual, Maria Elizabeth Rocha, já criticou atos antidemocráticos e terá seu voto contado nesse processo.", "titulo_pt": "Bolsonaro deve ser julgado no STM sob presidência de ministro que indicou", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 249838, "titulo": "Crise do Ueno Bank no Paraguai desmonta farsa do paraíso liberal bolsonarista", "url": "https://www.intercept.com.br/2026/11/07/crise-paraguai-desmonta-paraiso-bolsonarista/", "fonte_id": "intercept_brasil", "data_pub": "2026-11-07T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Paraguai, visto como modelo pela extrema direita, enfrenta uma crise após o colapso do Ueno Bank, um banco digital que levou ao impeachment do presidente Santiago Peña. Este evento desmascara o que foi chamado de 'paraíso liberal bolsonarista'.", "titulo_pt": "Crise do Ueno Bank no Paraguai desmonta farsa do paraíso liberal bolsonarista", "veiculo": "The Intercept Brasil", "pais": "Brasil", "classe": "B"}, {"id": 250087, "titulo": "Il Papa in Uruguay, oggi visita uno dei quartieri più poveri del mondo", "url": "https://  "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fabricantes de e-bicicletas na China estão agora buscando expandir seus mercados internacionais devido ao aumento contínuo dos preços do combustível.", "titulo_pt": "A expansão das e-bicicletas chinesas no mercado internacional devido aos altos preços do combustível", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 250143, "titulo": "POSCO union votes down tentative wage deal", "url": "https://en.yna.co.kr/view/AEN20261107002500315", "fonte_id": "yonhap_news", "data_pub": "2026-11-07T09:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores sindicalizados da siderúrgica sul-coreana POSCO rejeitaram um acordo provisório sobre salários. A votação ocorreu em 7 de novembro em Seul.", "titulo_pt": "Trabalhadores da POSCO rejeitam acordo salarial provisório", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 249753, "titulo": "Trenó do Papai Noel vai chegar nos EUA novamente sobrecarregado por tarifas", "url": "https://www.infomoney.com.br/economia/treno-do-papai-noel-vai-chegar-nos-eua-novamente-sobrecarregado-por-tarifas/", "fonte_id": "infomoney", "data_pub": "2026-11-07T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Itens comuns no Natal, como instrumentos musicais, equipamentos esportivos, tintas, lápis e giz de cera, estão mais caros devido a tarifas elevadas. O trenó do Papai Noel que chegará aos EUA novamente estará sobrecarregado com essas tarifas.", "titulo_pt": "Trenó do Papai Noel vai chegar nos EUA novamente sobrecarregado por tarifas", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 249773, "titulo": "A natureza informativa do Sistema de Informações de Créditos", "url": "https://www.jota.info/opiniao-e-analise/colunas/regulacao-e-novas-tecnologias/a-natureza-informativa-do-sistema-de-informacoes-de-creditos", "fonte_id": "jota", "data_pub": "2026-11-07T08:00:00Z", "idioma": , "classe": "B"}, {"id": 249700, "titulo": "Média gerência sob pressão: por que esse nível virou o centro da corrida por requalificação", "url": "https://exame.com/carreira/media-gerencia-sob-pressao-por-que-esse-nivel-virou-o-centro-da-corrida-por-requalificacao/", "fonte_id": "exame", "data_pub": "2026-11-07T05:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Gerentes precisam desenvolver competências em inteligência artificial e preparar suas equipes para novas formas de trabalho. Pesquisas indicam que essa é uma das prioridades na atual corrida por requalificação.", "titulo_pt": "Média gerência sob pressão: por que esse nível virou o centro da corrida por requalificação", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 250125, "titulo": "‘There could be anarchy’: Bangladesh’s garment sector unrest threatens economic disaster", "url": "https://www.scmp.com/week-asia/economics/article/3373569/there-could-be-anarchy-bangladeshs-garment-unrest-threatens-economic-disaster", "fonte_id": "scmp", "data_pub": "2026-11-07T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores da indústria têxtil de Bangladesh, o segundo maior exportador mundial de roupas após a China, estão exigindo que seus salários aumentem mais do que o dobro. As manifestações têm paralisado fábricas que fornecem marcas globais como H&M, Zara e Walmart, em regiões industriais importantes do país.", "titulo_pt": "Aqui poderia haver anarquia: protestos na indústria têxtil de bangladesh ameaçam desastre econômico", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 249990, "titulo": "US offers $20 million reward for info on 'Iran's nuclear program'", "url": "https://www.lemonde.fr/en/international/article/2026/11/07/us-offers-20-million-reward-for-info-on-iran-s-nuclear-program_6774089_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-07T04:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Estado dos EUA, através do programa Rewards for Justice, oferece uma recompensa de até 20 milhões de dólares e possivelmente relocação para informações sobre o programa nuclear iraniano. Esta oferta foi feita pelo Comando Central dos EUA em uma postagem no X.", "titulo_pt": "EUA oferecem recompensa de até 20 milhões de dólares por informações sobre programa nuclear iraniano", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 250099, "titulo": "Japan picks 28 priority items for ¥370 trillion in investments", "url": "https://www.japantimes.co.jp/business/2026/11/07/economy/japan-priority-items-investments/", "fonte_id": "japan_times", "data_pub": "2026-11-07T03:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Japão selecionou 28 itens prioritários para investimentos no valor de 370 trilhões de ienes, escolhidos entre 62 produtos e tecnologias, incluindo semicondutores e inteligência artificial.", "titulo_pt": "Japão escolhe 28 itens prioritários para investimentos de 370 trilhões de ienes", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 249597, "titulo": "Agricultura familiar precisa de apoio que vá além do discurso", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/laura-machado/2026/11/agricultura-familiar-precisa-de-apoio-que-va-alem-do-discurso.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-07T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A agricultura familiar é valorizada na sociedade brasileira por sua importância na produção de alimentos e na redução da pobreza, mas os agricultores enfrentam dificuldades para acessar os recursos necessários para aumentar sua produtividade e renda.", "titulo_pt": "Agricultura familiar precisa de apoio que vá além do discurso", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 249599, "titulo": "Governo prevê R$ 12 bi para passe livre nos fins de semana, mas setor estima custo maior", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/governo-preve-r-12-bi-para-passe-livre-nos-fins-de-semana-mas-setor-estima-custo-maior.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-07T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula prevê investir cerca de R$ 12 bilhões no transporte público gratuito nos fins de semana, mas o setor estima que a quantia pode não ser suficiente. Enquanto o Ministério das Cidades acredita que o valor cobre os custos, empresas de ônibus e representantes financeiros consideram necessário um investimento maior.", "titulo_pt": "Governo prevê R$ 12 bi para passe livre nos fins de semana, mas setor estima custo maior", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 249600, "titulo": "Empreender no Brasil é ruim, mas é bom", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/sergio-zimerman/2026/11/empreender-no-brasil-e-ruim-mas-e-bom.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-07T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O autor observou que há um paradoxo entre viver no Brasil e nos Estados Unidos, tanto para a vida pessoal quanto para o empreendedorismo. Para os brasileiros que vivem em Miami, a vida nos EUA é boa, mas ruim, enquanto o Brasil é ruim, mas bom. O autor percebeu que esse paradoxo também se aplica aos negócios.", "titulo_pt": "Empreender no Brasil é ruim, mas é bom", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 249603, "titulo": "Raízen aprova aumento de capital bilionário para viabilizar recuperação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/raizen-aprova-aumento-de-capital-bilionario-para-viabilizar-recuperacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-07T01:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O conselho de administração da Raízen aprovou um aumento de capital entre R$ 3,5 bilhões e R$ 39,8 bilhões, parte do plano de recuperação extrajudicial da empresa. A operação inclui dinheiro novo da Shell e a conversão de dívidas em participação acionária.", "titulo_pt": "Raízen aprova aumento de capital bilionário para viabilizar recuperação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 249604, "titulo": "Meta suspende novos termos comerciais após críticas da imprensa global e revés judicial no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/meta-suspende-novos-termos-comerciais-apos-criticas-da-imprensa-global-e-reves-judicial-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-07T01:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meta suspendeu as atualizações dos termos comerciais da empresa, inicialmente previstas para 20 de novembro, após críticas da imprensa global e um revés judicial no Brasil. As novas regras já haviam sido adiadas uma vez devido a críticas de entidades de mídia de todo o mundo.", "titulo_pt": "Meta suspende novos termos comerciais após críticas da imprensa global e revés judicial no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 249860, "titulo": "¿Cacería de brujas? La inteligencia artificial pone a prueba al mundo literario", "url": "https://www.latercera.com/culto/noticia/la-inteligencia-artificial-pone-a-prueba-al-mundo-literario/", "fonte_id": "la_tercera", "data_pub": "2026-11-07T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As editoras estão aprendendo a lidar com a nova realidade impulsionada pela inteligência artificial, enquanto alguns autores já perderam contratos e prêmios importantes devido a suspeitas sobre a autenticidade de seus trabalhos.", "titulo_pt": "Caza das bruxas? Inteligência artificial desafia o mundo literário", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 250116, "titulo": "US and China must join hands to measure rising AI tide", "url": "https://www.scmp.com/opinion/china-opinion/article/3373279/us-and-china-must-join-hands-measure-rising-ai-tide", "fonte_id": "scmp", "data_pub": "2026-11-07T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A próxima conversa entre os Estados Unidos e China sobre inteligência artificial deve começar com a pergunta: os governos realmente compreendem o quão rápido as capacidades da IA estão melhorando? Antes de decidirem sobre a tecnologia, Washington e Beijing precisam de um método comum para medir seu progresso.", "titulo_pt": "Estados unidos e China devem unir forças para medir a onda crescente da IA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 249593, "titulo": "Cartões de VR e VA devem ser aceitos em mais restaurantes a partir deste sábado (7); entenda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/cartoes-de-vr-e-va-devem-ser-aceitos-em-mais-restaurantes-a-partir-deste-sabado-7-entenda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-07T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir deste sábado (7), cartões de vale-refeição (VR) e vale-alimentação (VA) de diferentes operadoras passarão a ser aceitos nas mesmas maquininhas habilitadas para benefícios. Essa mudança remove a exclusividade entre empresas de benefícios e estabelecimentos comerciais.", "titulo_pt": "Cartões de VR e VA de diferentes operadoras devem ser aceitos em mais restaurantes a partir deste sábado; entenda", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 249595, "titulo": "A bolha das ações de inteligência artificial está prestes a estourar?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/a-bolha-das-acoes-de-inteligencia-artificial-esta-prestes-a-estourar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-07T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações de tecnologia sofreram fortes perdas nesta semana, com três ondas recentes de turbulência. A estabilização modesta observada nesta sexta-feira parece ser mais preocupante do que os episódios anteriores.", "titulo_pt": "A bolha das ações de tecnologia está prestes a estourar?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 249596, "titulo": "Anthropic avança com IPO mirando avaliação de US$ 1,5 trilhão", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/anthropic-avanca-com-ipo-mirando-avaliacao-de-us-15-trilhao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-07T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic está avançando com seu IPO, mesmo em um momento de forte declínio no setor de tecnologia. A empresa está disposta a aceitar uma avaliação inferior aos US$ 2 trilhões esperados por investidores mais otimistas.", "titulo_pt": "Anthropic avança com IPO mirando avaliação de US$ 1,5 trilhão", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 250149, "titulo": "(LEAD) Personal info of some 39,000 leaked from Mirae Asset Securities", "url": "https://en.yna.co.kr/view/AEN20261107000451315", "fonte_id": "yonhap_news", "data_pub": "2026-11-07T05:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A informação pessoal de aproximadamente 39.000 clientes foi vazada da Mirae Asset Securities. O incidente ocorreu em Seul, Coreia do Sul, no dia 7 de novembro.", "titulo_pt": "Informações pessoais de cerca de 39.000 clientes vazadas da Mirae Asset Securities", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 250160, "titulo": "Sequoia shutting down its Scouts program marks the end of an era", "url": "https://techcrunch.com/2026/11/06/sequoia-shutting-down-its-scouts-program-marks-the-end-of-an-era/", "fonte_id": "techcrunch", "data_pub": "2026-11-07T05:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Sequoia está encerrando seu programa Scouts, marcando o fim de uma era. O modelo de scouts foi pioneiro pela Sequoia e foi adotado por muitas outras empresas de venture capital, mas agora parece haver um consenso de que o modelo atingiu limites em sua forma atual.", "titulo_pt": "Sequoia encerra seu programa Scouts, marcando o fim de uma era", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 250084, "titulo": "How Wall Street’s all-in bet on AI blew up", "url": "https://www.ft.com/content/5a6806f0-e82e-4b34-b761-f9877e2b511c?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-07T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A eleição intermediária nos Estados Unidos levou a uma saída de hedge funds e investidores de varejo de uma aposta que dominava os mercados de ações.", "titulo_pt": "Como a aposta total de Wall Street no AI explodiu", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 250161, "titulo": "From the front row to the hot seat — what the midterms mean for Big Tech", "url": "https://techcrunch.com/2026/11/06/from-the-front-row-to-the-hot-seat-what-the-midterms-mean-for-big-tech/", "fonte_id": "techcrunch", "data_pub": "2026-11-07T04:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois de passar dois anos se aproximando da Casa Branca, as grandes empresas de tecnologia estão agora tentando se aproximar dos democratas, e o desafio é saber se essa mudança de imagem será suficiente para enfrentar as ações iminentes dos estados, das comunidades locais e dos mercados.", "titulo_pt": "Do palco central para o banco dos réus — o que as eleições médias significam para a grande tecnologia", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 250129, "titulo": "US regulator investigates tumour risk in children given Novartis gene therapy", "url": "https://www.scmp.com/news/world/united-states-canada/article/3373631/us-regulator-investigates-tumour-risk-children-given-novartis-gene-therapy", "fonte_id": "scmp", "data_pub": "2026-11-07T03:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Agência Americana de Medicamentos e Alimentos (FDA) está investigando um risco potencial de formação de tumores, incluindo câncer, associado à terapia genética Zolgensma da Novartis. A empresa suíça relatou dois casos em crianças em que tumores mostraram evidências de serem ligados à sua droga de terapia genética usada para tratar pacientes com menos de dois anos de idade que têm esclerose muscular espinal.", "titulo_pt": "Fda investiga risco de tumores em crianças com terapia genética da Novartis", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 249601, "titulo": "Livro questiona discurso de liberdade e privacidade do Telegram", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/11/livro-questiona-discurso-de-liberdade-e-privacidade-do-telegram.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-07T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O livro questiona o discurso de liberdade e privacidade do Telegram, liderado por Pavel Durov. Durov é considerado um dos excêntricos da tecnologia que buscam comandar o futuro digital.", "titulo_pt": "Livro questiona discurso de liberdade e privacidade do Telegram", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 250134, "titulo": "AI-generated cats showcasing rural life, Chinese cuisine land major brand sponsorships", "url": "https://www.scmp.com/news/people-culture/china-personalities/article/3373622/ai-generated-cats-showcasing-rural-life-chinese-cuisine-land-major-brand-sponsorships", "fonte_id": "scmp", "data_pub": "2026-11-07T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um perfil de mídia social com três gatos gerados por inteligência artificial (IA) tem exibido a vida rústica chinesa e pratos tradicionais chineses, atraiu mais de 1,76 milhões de seguidores e mais de 500 milhões de visualizações desde abril. O perfil tem paralelos com a influenciadora cultural Li Ziqi, que já conquistou mais de 56 milhões de fãs ao redigir cenas cinematográficas de vida rural chinesa.", "titulo_pt": "Gatos gerados por IA exibem vida rural e culinária chinesa e conquistam patrocinadores de marcas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 250162, "titulo": "Crusoe sells troubled Wyoming data center project to Google", "url": "https://techcrunch.com/2026/11/06/crusoe-sells-troubled-wyoming-data-center-project-to-google/", "fonte_id": "techcrunch", "data_pub": "2026-11-07T01:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cruso vendeu um projeto de data center problemático em Wyoming para a Google. O negócio ilustra os desafios de desenvolver enormes data centers para inteligência artificial.", "titulo_pt": "Cruso vende projeto de data center problemático em Wyoming para a Google", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 248745, "titulo": "Police arrest man over AI data theft in Kaohsiung", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/07/2003867317", "fonte_id": "taipei_times", "data_pub": "2026-11-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia de Kaohsiung prendeu um homem suspeito de roubar dados relacionados à inteligência artificial.", "titulo_pt": "Polícia prende homem por suposto roubo de dados de IA em Kaohsiung", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 250157, "titulo": "OpenAI valued at $1.25 trillion, as rival Anthropic nears its IPO", "url": "https://www.theverge.com/ai-artificial-intelligence/1029380/openai-1-25-trillion-investment-valuation", "fonte_id": "the_verge", "data_pub": "2026-11-06T23:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI foi avaliado em 1,25 trilhões de dólares em uma nova rodada de financiamento que arrecadou 11 bilhões de dólares, de acordo com a Bloomberg. A empresa agora vale mais que 852 bilhões de dólares, desde sua avaliação anterior em março deste ano.", "titulo_pt": "Openai avaliada em 1,25 trilhões de dólares, enquanto rival Anthropic se aproxima de sua IPO", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 250156, "titulo": "Mirae Asset says data breaches exposed customer, employee information", "url": "https://en.yna.co.kr/view/AEN20261107000400315", "fonte_id": "yonhap_news", "data_pub": "2026-11-06T23:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mirae Asset Securities Co. informou que sofreu brechas de segurança que expuseram informações de clientes e funcionários. O incidente ocorreu em 7 de novembro.", "titulo_pt": "Mirae Asset revela que brechas de segurança expuseram dados de clientes e funcionários", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 250206, "titulo": "COP climate summits might yet have a useful future – here’s how", "url": "https://www.newscientist.com/article/2596962-cop-climate-summits-might-yet-have-a-useful-future-heres-how/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-07T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O COP31 não está previsto para salvar o mundo da catástrofe climática, mas pode oferecer uma pequena amostra do potencial de reuniões internacionais para alcançar progressos significativos.", "titulo_pt": "Cops de clima podem ainda ter um futuro útil – aqui está como", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 249849, "titulo": "Rodrigo Quian Quiroga, neurocientífico: “Ningún modelo de lenguaje de IA es consciente de su propia existencia”", "url": "https://www.latercera.com/tendencias/noticia/rodrigo-quian-quiroga-neurocientifico-ningun-modelo-de-lenguaje-de-ia-es-consciente-de-su-propia-existencia/", "fonte_id": "la_tercera", "data_pub": "2026-11-07T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Rodrigo Quian Quiroga, conhecido por descobrir as neuronas de conceito, ou 'neuronas de Jennifer Aniston', resumiu décadas de pesquisa sobre os mecanismos de memória humana em seu livro mais recente, 'A Máquina do Esquecimento', destacando as características únicas do cérebro do homo sapiens.", "titulo_pt": "Rodrigo Quian Quiroga, neurocientífico: 'nenhum modelo de linguagem de IA é consciente de sua própria existência'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 249855, "titulo": "El mayor despliegue científico antártico zarpa desde Chile", "url": "https://www.latercera.com/nacional/noticia/el-mayor-despliegue-cientifico-antartico-zarpa-desde-chile/", "fonte_id": "la_tercera", "data_pub": "2026-11-07T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A expedição partiu de Punta Arenas com o primeiro grupo da 63ª Expedição Científica Antártica, marcando o início da temporada de investigações no Continente Blanco.", "titulo_pt": "O maior despliegue científico antártico zarpa desde Chile", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 249582, "titulo": "Harvard devolverá ao Brasil crânio de suposto rebelde malê após 4 anos de negociações", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/harvard-devolvera-ao-brasil-cranio-de-suposto-rebelde-male-apos-4-anos-de-negociacoes.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-07T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Universidade Harvard devolverá ao Brasil um crânio de um indivíduo da Revolta dos Malês, que ocorreu em Salvador em 1835, após quatro anos de negociações.", "titulo_pt": "Harvard devolverá ao Brasil crânio de suposto rebelde malê após 4 anos de negociações", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 250189, "titulo": "APOD: 2026 November 7 – De Gerlache-Kocher Massif", "url": "https://science.nasa.gov/image-article/apod-2026-november-7-de-gerlache-kocher-massif/", "fonte_id": "nasa_news", "data_pub": "2026-11-07T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da NASA, publicada em 7 de novembro de 2026, apresenta o De Gerlache-Kocher Massif. Este é um dos tópicos do Astronomy Picture of the Day que explora a beleza e a complexidade do cosmos diariamente.", "titulo_pt": "Astronomy picture of the day: 7 De novembro De 2026 – De Gerlache-Kocher Massif", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 250188, "titulo": "Math Puzzle: Secret formula", "url": "https://www.scientificamerican.com/article/math-puzzle-secret-formula/", "fonte_id": "scientific_american", "data_pub": "2026-11-07T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor do puzzle está desafiando os leitores a adivinhar sua fórmula secreta.", "titulo_pt": "Puzzle matemático: fórmula secreta", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 250132, "titulo": "HKUST president Nancy Ip wins Unesco prize for Alzheimer’s research", "url": "https://www.scmp.com/news/hong-kong/education/article/3373626/hkust-president-nancy-ip-wins-unesco-prize-alzheimers-research", "fonte_id": "scmp", "data_pub": "2026-11-07T02:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nancy Ip Yuk-yu, presidente da Universidade de Tecnologia de Hong Kong (HKUST), recebeu um prêmio da UNESCO por suas contribuições notáveis em neurociência, que permitiram diagnósticos mais precoces e monitoramento melhorado da doença de Alzheimer. O prêmio foi concedido na França.", "titulo_pt": "Nancy Ip, presidente da HKUST, ganha prêmio da Unesco por pesquisa sobre Alzheimer", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 250184, "titulo": "Disasters and debt. Escaping the 'climate-debt doom loop'", "url": "https://phys.org/news/2026-11-disasters-debt-climate-doom-loop.html", "fonte_id": "phys_org", "data_pub": "2026-11-07T02:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2025, após o furacão Melissa atingir a Jamaica, satélites da ONU relataram que cerca de 480.000 caminhões foram necessários para remover 4,8 milhões de toneladas de escombros no oeste da Jamaica. O furacão causou danos significativos à infraestrutura local.", "titulo_pt": "Desastres e dívida. Evadindo o 'ciclo destrutivo clima-dívida'", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 250209, "titulo": "SpaceX launches mystery mission for US Space Force in gorgeous sunset liftoff from California (photos)", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-launches-classified-mission-space-force-ussf-432", "fonte_id": "space_com", "data_pub": "2026-11-07T01:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SpaceX realizou uma missão classificada para o Exército Espacial dos Estados Unidos em um lançamento à noite do estado da Califórnia. Foi o 125º lançamento da empresa em 2026.", "titulo_pt": "Spacex realiza missão secreta para força espacial dos EUA em pousada noturna na califórnia (fotos)", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 250185, "titulo": "Untangling the patterns of the cosmic microwave background to better understand the early universe", "url": "https://phys.org/news/2026-11-untangling-patterns-cosmic-microwave-background.html", "fonte_id": "phys_org", "data_pub": "2026-11-07T00:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A figura vermelha caminha sobre uma camada branca de neve. O cientista caminha pela neve seca sob o sol que se encontra no horizonte, sem ocultar por trás de nuvens. O destino do cientista é marcado por uma linha de bandeiras e alguns edifícios grandes, em um cenário semelhante a uma paisagem lunar.", "titulo_pt": "Desvendando os padrões do fundo de microondas cósmico para entender melhor o universo inicial", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 250186, "titulo": "Spot a baby bird on the ground? Don't be tempted to bird‑nap it", "url": "https://phys.org/news/2026-11-baby-bird-ground-dont-birdnap.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T23:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No verão, é comum encontrar ninhos de pássaros e aves jovens. Não se deve tentar adotar um bebe de pássaro encontrado no chão, pois geralmente os pais continuam cuidando dele.", "titulo_pt": "Encontrou um bebe de pássaro no chão? Não se arrisque a adotá-lo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 250187, "titulo": "The wasps that horrified Darwin reveal evolution's one-way streets", "url": "https://phys.org/news/2026-11-wasps-horrified-darwin-reveal-evolution.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T22:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vespa-darwinianas têm um estilo de vida particularmente perturbador, pois parasitam outros animais, depositando seus ovos em ou dentro deles, como lagartas, caracóis e aranhas, com as larvas se alimentando gradualmente até o hospedeiro morrer.", "titulo_pt": "As vespa que assustaram Darwin revelam vias de mão única na evolução", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 250210, "titulo": "On this day in space! Nov. 6, 1572: A German astronomer discovers the Tycho supernova with the naked eye, but everyone thought the cosmic explosion was a 'new star'", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-6-2026", "fonte_id": "space_com", "data_pub": "2026-11-06T22:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 6 de novembro de 1572, o astrônomo alemão Wolfgang Schuler observou uma supernova com o olho nu. Essa supernova mais tarde foi chamada de supernova de Tycho.", "titulo_pt": "6 De novembro de 1572: um astrônomo alemão observa uma supernova com o olho nu", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 249490, "titulo": "Air holes turn silicon wafers into flat ultraviolet focusing mirrors for compact optics", "url": "https://phys.org/news/2026-11-air-holes-silicon-wafers-flat.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Silício com buracos de ar transforma wafers em espelhos planos que focam luz no ultravioleta, permitindo óptica compacta. No entanto, a absorção de luz ultravioleta por muitos materiais usados em metasuperfícies representa um problema fundamental para a implementação dessas tecnologias.", "titulo_pt": "Buracos de ar transformam wafers de silício em espelhos planos para focagem de luz no ultravioleta", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 250211, "titulo": "AST SpaceMobile announces new 'Blacklift' rocket, targets 2028 launch debut", "url": "https://www.space.com/space-exploration/launches-spacecraft/ast-spacemobile-announces-new-blacklift-rocket-targets-2028-launch-debut", "fonte_id": "space_com", "data_pub": "2026-11-06T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "AST SpaceMobile planeja lançar seus satélites de banda larga em um novo foguete chamado Blacklift, que a empresa planeja construir por si mesm
