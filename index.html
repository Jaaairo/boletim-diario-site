<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

<script>
const D = {"gerado_em": "02/09/2026 07:22", "stats": {"noticias_novas": 870, "resumos_gerados": 252}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Senado brasileiro enfrenta uma série de desafios políticos e legislativos nesta quarta-feira (2/9). Está sendo votado o projeto de lei dos minerais críticos, que estabelece um conselho com novos poderes sobre o setor mineral, sob críticas do setor privado. Em um contexto de crise no Supremo Tribunal Federal (STF), o ministro Alexandre de Moraes decidiu retirar o sigilo de um relatório da Polícia Federal que contém mensagens entre ele e o banqueiro Daniel Vorcaro, exposto em 67 pedidos de impeachment no Senado. O caso pode beneficiar candidatos da oposição, como Renan, Zema e Flávio Bolsonaro, no cenário eleitoral. Além disso, o Senado também aprovou a indicação de Rodrigo Pacheco para ministro do Tribunal de Contas da União (TCU) e votará a proposta que reduz a jornada de trabalho de 44 horas para 40 horas semanais, após ser destravada pelo presidente da CCJ do Senado, Davi Alcolumbre.", "mundo": "O presidente ucraniano Zelensky aumentou a pressão sobre as companhias aéreas para evitar o espaço aéreo russo, diante das intensificadas operações de drones ucranianas. A Rússia, por sua vez, anunciou que intensificará seus ataques contra a Ucrânia. Em outro desenvolvimento, o ativista pró-democracia de Hong Kong, Joshua Wong, admitiu culpa em um segundo caso de segurança nacional, o que provavelmente resultará em uma nova pena de prisão. Na região do Oriente Médio, o Irã atacou interesses dos Estados Unidos, prometendo 'consequências severas' em resposta a novas operações americanas. Além disso, ataques no Mar Negro ameaçam a oferta global de grãos. No que diz respeito à América do Sul, o secretário de Energia dos Estados Unidos, Chris Wright, visitou a Venezuela para assinar um acordo de petróleo, buscando atrair investimentos de empresas de energia dos EUA, apesar dos desafios.\n\nA União Europeia está avaliando uma resposta após um drone carregado com explosivos ser encontrado no aeroporto de Leipzig, na Alemanha, o que oficiais atribuem à Rússia. Este incidente aumentou as preocupações sobre uma campanha de sabotagem atribuída à Rússia pela União Europeia e pela OTAN, que acusam a Rússia de tentar desestabilizar os aliados da Ucrânia. Em resposta, a União Europeia convocou o embaixador russo e anunciou uma série de medidas. Paralelamente, o presidente chinês Xi Jinping está em uma intensa viagem internacional, que culminará com uma reunião na Casa Branca. O presidente dos Estados Unidos pode se encontrar com o líder da Coreia do Norte em Pyongyang, uma possibilidade que tem levantado preocupações sobre o foco político do encontro em detrimento de questões nucleares. Além disso, os Estados Unidos realizaram novos ataques contra o Irã, com sete pessoas mortas em ataques de mísseis em Khuzestan, e o Irã respondeu alegando que dois navios-tanque colidiram com minas navais no Estreito de Ormuz em retaliação aos ataques dos Estados Unidos.", "economia": "A economia global enfrenta diversos desafios e oportunidades, com destaque para a reforma tributária que pode transformar o cenário empresarial, especialmente em relação à guerra fiscal entre estados. No Brasil, há discussões sobre o fim da escala 6x1, com impactos esperados nos salários e na jornada de trabalho. A Índia registrou um crescimento econômico superior às expectativas, mantendo-se como a economia de maior crescimento entre as maiores economias do mundo. A reforma tributária prevista para 2027 está projetada para aumentar a arrecadação do governo em 19%, refletindo mudanças na tributação. No mercado financeiro, a bolsa de valores brasileira subiu 1,3% e atingiu seu maior nível em quase quatro meses, impulsionada pelo aumento do petróleo e conflitos internacionais. O petróleo e o gás também estão em foco, com preços do gás na Europa atingindo um nível não visto há três anos devido às tensões entre Estados Unidos e Irã. Além disso, a Swarovski está implementando uma estratégia para dobrar seu tamanho no mercado latino-americano, enquanto a Embrapa desenvolve uma variedade transgênica de trigo para aumentar a produção no cerrado. O Banco do Japão sinalizou a possibilidade de uma elevação das taxas de juros em setembro, enquanto a Austrália registrou um crescimento econômico superior às expectativas no segundo trimestre, superando as expectativas.", "tecnologia": "A China está intensificando a repressão ao conteúdo artificialmente gerado de baixa qualidade em plataformas de mídia social, como WeChat, RedNote e Douyin, como parte de uma campanha mais ampla contra o abuso da tecnologia de inteligência artificial. De acordo com o Cyberspace Administration of China (CAC), mais de 5,61 milhões de itens prejudiciais ou ilegais foram removidos e cerca de 49.000 contas foram desativadas. Paralelamente, a OpenAI e Anthropic estão buscando equilibrar a apresentação de suas empresas como sólidas e em rápido crescimento para Wall Street, com a garantia de que suas tecnologias não representem riscos insuportáveis para governos e sociedade. As duas companhias visam IPOs potencialmente recordes próximos, com OpenAI planejando lançar seu modelo Astra, mas limitando algumas de suas capacidades mais avançadas a testadores de confiança devido a preocupações de segurança cibernética. Além disso, a China está utilizando seu poder de escala e construção de cadeias de suprimentos para desafiar a indústria global de robótica, focando em outras aplicações de robótica além de humanoides, enquanto empresas como SK hynix e Samsung competem por soluções de armazenamento de estado sólido de alta capacidade para centros de dados de inteligência artificial.", "ciencia": "A ONU reconheceu que o planeta não pode evitar alguns dos piores efeitos do aquecimento global, admitindo que a temperatura global ultrapassará o limite de 1,5 ºC antes do final da década, conforme um relatório. Este avanço no reconhecimento das consequências do aquecimento global tem implicações significativas para a necessidade de ações imediatas para reduzir as temperaturas globais abaixo do nível perigoso e retornar à segurança. Paralelamente, pesquisadores da University of California San Diego descobriram que uma enzima pode ler e transcrever um alfabeto genético expandido com oito letras, sugerindo que células podem processar informações genéticas sintéticas usando sua própria maquinaria molecular. Esta descoberta é um avanço importante na biologia sintética e tem potencial para expandir a língua do DNA, permitindo a criação de novos organismos com características únicas.", "cultura": "O ponto mais importante dos artigos é a aprovação do Plano Nacional de Cultura pela Câmara dos Deputados, que prevê um financiamento descentralizado para os próximos dez anos. Este projeto, que ainda precisa ser analisado pelo Senado, visa estruturar uma abordagem mais equilibrada e regionalizada para a promoção e financiamento da cultura no Brasil. Outro destaque é a Bienal do Livro, que ocorrerá de 4 a 13 de setembro, com a presença de autores renomados como Conceição Evaristo e Lynn Painter. Além disso, a Bienal de Veneza apresentará performances inusitadas, incluindo atrizes pornôs e bebês recriados, em locais inusitados, como um jet ski acelerado e um aquário alimentado por esgoto. Também haverá outros eventos culturais notáveis, como o Festival de Cinema de Busan, que começará a vender ingressos em 17 de setembro, e a Bienal de Veneza, que apresentará a novela 'The Bridge' de Colm Tóibín, explorando a mistura de tristeza profunda e desejo ilegítimo.", "sociedade": "Um tenente da Polícia Militar de São Paulo foi preso por ser flagrado em um ônibus deixando o trabalho durante o horário de serviço, recebendo um salário de R$ 27 mil mensais. O caso gerou debates sobre ética e disciplina na corporação. Em outro fato, a desigualdade de renda entre servidores públicos brasileiros é maior do que a média do país, conforme um estudo do auditor Sergio Guedes-Reis, baseado em dados da Rais. Além disso, a Coreia do Sul registrou mais de 600 mil relatos de conteúdo online que podem incentivar ou facilitar suicídios, mas apenas 70% desses conteúdos foram removidos ao final do ano, levantando preocupações sobre a responsabilidade das plataformas digitais.", "meio_ambiente": "O Nepal enfrenta uma grave crise climática, com mais de 1.100 mortes e 3.900 desaparecidos devido a inundações e deslizamentos de terra, conforme informado pelas autoridades. O Reino Unido registrou seu verão mais quente desde o início dos registros meteorológicos, com uma temperatura média de 16,5 graus Celsius. A ONU prevê um aquecimento global superior a 1,5°C, o que aumenta os riscos de eventos climáticos extremos e tem um impacto negativo na produtividade agrícola e na utilização de recursos naturais. Além disso, um estudo revelou que quase metade dos agricultores do mundo são expostos a pesticidas a cada ano, com a Índia sendo responsável por quase 60% dos óbitos relacionados a intoxicações por pesticidas. A Organização Mundial da Saúde alerta que a qualidade da água na Gaza já é ruim e a cheia poderá agravar as ameaças à saúde.", "direitos_humanos": "O número de execuções capital nas prisões dos Estados Unidos aumentou após a pandemia de COVID-19. Em 2021, a Flórida realizou a 14ª execução de um preso no ano, apesar de haver menos sentenças de morte e suspensões temporárias da pena capital em mais de metade dos estados. Em Hong Kong, o ativista pró-democracia Joshua Wong admitiu culpa em um segundo caso relacionado à Lei de Segurança Nacional de Pequim, o que pode levar a uma extensão mínima de três anos de sua sentença ou até mesmo a uma prisão perpétua. A Organização Mundial da Saúde expressou preocupações sobre a qualidade da água deteriorada e a contaminação na Faixa de Gaza, o que aumenta o risco de doenças. Por fim, a fotógrafa jornalista Elise Blanchard exibiu suas fotografias na festa Visa pour l'Image em Perpignan, retratando garotas jovens que foram vendidas por seus pais no Afeganistão, sob o governo do Talibã, destacando a urgência de proteger os direitos humanos em situações extremas."}, "resumo_do_dia": {"politica_nacional": [{"id": 139479, "titulo": "Moraes versus Mendonça: os bastidores da 'guerra civil' dentro do STF", "url": "https://www.bbc.com/portuguese/articles/c305mmn2318o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-02T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mendonça decidiu retirar o sigilo de um relatório da PF sobre mensagens de um banqueiro a Moraes, o que expôs uma rivalidade entre os ministros dentro do STF que antes era percebida de forma silenciosa.", "titulo_pt": "Moraes versus Mendonça: os bastidores da 'guerra civil' dentro do STF", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 139417, "titulo": "Confira a agenda dos candidatos ao GDF nesta quarta-feira (2/9)", "url": "https://www.metropoles.com/distrito-federal/confira-a-agenda-dos-candidatos-ao-gdf-nesta-quarta-feira-2-9", "fonte_id": "metropoles", "data_pub": "2026-09-02T09:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos ao governo do Distrito Federal têm agenda ocupada nesta quarta-feira (2/9), com atividades como sabatinas, panfletagens e bandeiraços.", "titulo_pt": "Confira a agenda dos candidatos ao GDF nesta quarta-feira (2/9)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 139246, "titulo": "Suplente de Pacheco no Senado apoiou Bolsonaro em 2018", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/suplente-de-pacheco-no-senado-apoiou-bolsonaro-em-2018.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-02T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renzo Braz, suplente do senador Rodrigo Pacheco, apoiou Jair Bolsonaro em 2018 e pode influenciar o resultado de votações contra o governo Lula até o fim da legislatura atual.", "titulo_pt": "Suplente de Pacheco no Senado apoiou Bolsonaro em 2018", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 139376, "titulo": "Senado vota PL dos minerais críticos nesta quarta (2) sob críticas do setor", "url": "https://www.cnnbrasil.com.br/infra/senado-vota-pl-dos-minerais-criticos-nesta-quarta-2-sob-criticas-do-setor/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado votará o Projeto de Lei dos minerais críticos nesta quarta-feira. O texto estabelece um conselho com novos poderes sobre o setor mineral, gerando críticas de mineradoras que se preocupam com a 'insegurança jurídica', enquanto o governo defende a adoção de controles para agregar valor no país.", "titulo_pt": "Senado vota PL dos minerais críticos nesta quarta sob críticas do setor", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 139277, "titulo": "'Bomba atômica' e 'terremoto político': o que imprensa internacional disse sobre mensagens entre Vorcaro e Moraes", "url": "https://g1.globo.com/mundo/noticia/2026/09/02/bomba-atomica-e-terremoto-politico-o-que-imprensa-internacional-disse-sobre-mensagens-entre-vorcaro-e-moraes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T08:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A imprensa internacional comentou sobre as trocas de mensagens entre o banqueiro Daniel Vorcaro e um número atribuído ao ministro Alexandre de Moraes, do Supremo Tribunal Federal (STF). As mensagens sugerem possíveis interações entre Vorcaro e Moraes, além de pessoas ligadas à família do ministro.", "titulo_pt": "‘Bomba atômica’ e ‘terremoto político’: imprensa internacional se pronuncia sobre mensagens entre Vorcaro e Moraes", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 139462, "titulo": "Cortes de vídeo nas redes: campanha eleitoral e imunidade parlamentar", "url": "https://www.jota.info/opiniao-e-analise/colunas/defensor-legis/cortes-de-video-nas-redes-campanha-eleitoral-e-imunidade-parlamentar", "fonte_id": "jota", "data_pub": "2026-09-02T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha eleitoral e a imunidade parlamentar são temas abordados, com foco no tratamento jurídico da fraude comunicacional.", "titulo_pt": "Cortes de vídeo nas redes: campanha eleitoral e imunidade parlamentar", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 139389, "titulo": "Caiado abre hoje série de entrevistas da CNN Brasil com presidenciáveis", "url": "https://www.cnnbrasil.com.br/eleicoes/caiado-abre-hoje-serie-de-entrevistas-da-cnn-brasil-com-presidenciaveis/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador de Goiás, Ronaldo Caiado, participará de uma série de entrevistas com candidatos presidenciais na CNN Brasil. A sabatina será transmitida ao vivo na quarta-feira (2), às 21h.", "titulo_pt": "Caiado inicia série de entrevistas com presidenciáveis na CNN Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 139480, "titulo": "Como é o projeto de trabalho flexível apoiado por Flávio Bolsonaro que vai na contramão da PEC do fim da 6x1", "url": "https://www.bbc.com/portuguese/articles/c36l0k403wzo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-02T07:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de trabalho flexível apoiado por Flávio Bolsonaro prevê uma jornada de trabalho mais flexível, em contraste com a Proposta de Emenda à Constituição (PEC) que visa extinguir o sistema 6x1. Críticos chamam a proposta de 'PEC da Escravidão', enquanto defensores a apresentam como uma liberdade para o trabalhador definir sua jornada de trabalho.", "titulo_pt": "Como é o projeto de trabalho flexível apoiado por Flávio Bolsonaro que vai na contramão da PEC do fim da 6x1", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 139278, "titulo": "Candidatura de Aécio Neves faz rearranjo na disputa pelo Senado em Minas Gerais", "url": "https://g1.globo.com/mg/minas-gerais/eleicoes/2026/noticia/2026/09/02/candidatura-de-aecio-neves-faz-rearranjo-na-disputa-pelo-senado-em-minas-gerais.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A entrada de Aécio Neves no cenário das eleições para o Senado em Minas Gerais reconfigura o quadro político. O deputado federal e ex-senador e ex-governador do estado, do PSDB, registrou sua candidatura no Tribunal Superior Eleitoral.", "titulo_pt": "Aécio Neves entra na disputa pelo Senado em Minas Gerais, reconfigurando o cenário eleitoral", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 139279, "titulo": "As mensagens de Vorcaro a Moraes e o futuro do Caso Master no Supremo - O Assunto #1796", "url": "https://g1.globo.com/podcast/o-assunto/noticia/2026/09/02/as-mensagens-de-vorcaro-a-moraes-e-o-futuro-do-caso-master-no-supremo-o-assunto-1796.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T04:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça, relator do Caso Master no Supremo Tribunal Federal, retirou o sigilo de um relatório da Polícia Federal que contém mensagens entre Alexandre de Moraes e Daniel Vorcaro, além de indicações de que Moraes editou um contrato de sua esposa com o banqueiro. O documento também menciona o procurador-geral da República, Paulo Gonet.", "titulo_pt": "Mensagens entre Moraes e Vorcaro são desclassificadas no Caso Master", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 139280, "titulo": "6x1, 5x2, 4x3 e 12x36: entenda como funcionam as escalas de trabalho", "url": "https://g1.globo.com/trabalho-e-carreira/noticia/2026/09/02/entenda-como-funcionam-as-escalas-de-trabalho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T03:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proposta que prevê o fim da escala de trabalho 6x1, após ser destravada pelo presidente da CCJ do Senado, Davi Alcolumbre, está para ser votada. Se aprovada, a proposta reduz a jornada semanal e garante dois dias de descanso remunerado.", "titulo_pt": "6X1, 5x2, 4x3 e 12x36: entenda como funcionam as escalas de trabalho", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 139281, "titulo": "Vorcaro e Moraes: veja PRINTS de conversas reveladas em relatório da PF e entenda contexto", "url": "https://g1.globo.com/politica/noticia/2026/09/02/vorcaro-e-moraes-veja-prints-de-conversas-reveladas-em-relatorio-da-pf.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça do STF removeu o sigilo sobre um relatório da Polícia Federal que revela conversas entre Daniel Vorcaro, fundador do banco Master, e o ministro Alexandre de Moraes. O relatório expõe um esquema de inflação artificial do valor do Banco Master, visando atrair investidores e realizar operações sem garantias reais.", "titulo_pt": "Vorcaro e Moraes: veja PRINTS de conversas reveladas em relatório da PF e entenda o contexto", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 139282, "titulo": "Contratos milionários, experiências de luxo e viagem a Londres: o que Vorcaro ofereceu a Moraes e sua família, segundo a PF", "url": "https://g1.globo.com/politica/noticia/2026/09/02/que-vorcaro-ofereceu-a-moraes-e-sua-familia-segundo-a-pf.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal identificou 52 notas de honorários advocatícios milionários, além de propostas de transferência de cotas de jato e helicóptero, e ofertas de viagem internacional e experiências de luxo feitas por Daniel Vorcaro ao ministro Alexandre de Moraes e sua família. Esses episódios são detalhados em um documento da investigação sobre o Banco Master.", "titulo_pt": "Contratos milionários, experiências de luxo e viagem a Londres: o que Vorcaro ofereceu a Moraes e sua família, segundo a PF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 139283, "titulo": "Quaest divulga nesta quarta (2) nova pesquisa da eleição presidencial", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/02/quaest-divulga-nesta-quarta-nova-pesquisa-da-eleicao-presidencial.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Quaest, em parceria com a Globo e O Globo, divulgou nesta quarta-feira (2) uma nova pesquisa sobre as intenções de voto para a eleição presidencial, incluindo 12 ou 13 candidatos, com dois cenários de 1º turno.", "titulo_pt": "Quaest divulga pesquisa sobre eleição presidencial com 12 ou 13 candidatos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 139284, "titulo": "VÍDEO: O que faz o senador? Entenda as funções do cargo", "url": "https://g1.globo.com/politica/eleicoes/2026/videos/noticia/2026/09/02/video-o-que-faz-o-senador-entenda-as-funcoes-do-cargo.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Senadores são representantes do Poder Legislativo nacional, com responsabilidades como criar, alterar ou revogar leis, fiscalizar o Poder Executivo e analisar o orçamento federal. Eles podem também criar Comissões Parlamentares de Inquérito (CPI).", "titulo_pt": "O que faz um senador? Entenda as funções do cargo", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 139285, "titulo": "Fim da 6x1: CCJ do Senado pode votar nesta quarta proposta que reduz jornada de trabalho", "url": "https://g1.globo.com/politica/noticia/2026/09/02/fim-da-6x1-ccj-do-senado-pode-votar-nesta-quarta-proposta-que-reduz-jornada-de-trabalho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-02T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Constituição e Justiça (CCJ) do Senado pode votar nesta quarta-feira (2) uma proposta que reduz a jornada de trabalho de 44 horas para 40 horas por semana, após ser destravada pelo presidente Davi Alcolumbre. O relator da proposta, senador Omar Aziz, afirmou que não vai alterar o texto aprovado pela Câmara dos Deputados.", "titulo_pt": "CCJ do Senado pode votar proposta que acaba com a 6x1 nesta quarta", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 139645, "titulo": "EU considers response to Leipzig drone attack after Germany formally blames Moscow – Europe live", "url": "https://www.theguardian.com/world/live/2026/sep/02/europe-eu-germany-leipzig-drone-attack-russia-ukraine-macron-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-09-02T09:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia está considerando uma resposta após o Leipzig drone ataque, enquanto a Alemanha oficialmente culpa Moscou. A polícia de Brandenburg investiga uma tentativa de interromper a operação de uma subestação de energia, suspeitando de atentado terrorista e formação de organização terrorista.", "titulo_pt": "Ue considera resposta após ataque com drone em Leipzig, com culpa oficial de moscou", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 139260, "titulo": "Famílias organizam funerais sem corpos no Nepal", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/familias-organizam-funerais-sem-corpos-no-nepal.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-02T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Famílias nepalesas realizaram cerimônias fúnebres simbólicas para os parentes desaparecidos após uma avalanche que atingiu vilarejos no Himalaia, há uma semana. Essas cerimônias visam libertar as almas dos desaparecidos.", "titulo_pt": "Famílias nepalesas realizam funerais simbólicos para parentes desaparecidos após avalanche", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 139731, "titulo": "Daniel Ortega suspends this year’s elections and extends his mandate until 2028", "url": "https://english.elpais.com/international/2026-09-02/daniel-ortega-suspends-this-years-elections-and-extends-his-mandate-until-2028.html", "fonte_id": "elpais_en", "data_pub": "2026-09-02T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente nicaraguense Daniel Ortega suspendeu as eleições deste ano e estendeu seu mandato até 2028. A aprovação de uma reforma constitucional excluiu a oposição e buscou contornar a pressão dos Estados Unidos.", "titulo_pt": "Daniel Ortega suspende eleições deste ano e estende mandato até 2028", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 139732, "titulo": "Conservative US gays drop the T for trans people: ‘We are an LGB organization’", "url": "https://english.elpais.com/usa/2026-09-02/conservative-us-gays-drop-the-t-for-trans-people-we-are-an-lgb-organization.html", "fonte_id": "elpais_en", "data_pub": "2026-09-02T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A organização Log Cabin Republicans, que representa gays conservadores nos Estados Unidos, exclui os direitos transsexuais de seu campo de ação. Eles afirmam ser uma organização LGB e não incluem o 'T' (trans) em suas siglas.", "titulo_pt": "Gays conservadores americanos rejeitam direitos trans: 'somos uma organização LGB'", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 139814, "titulo": "Onu, 'riscaldamento globale sopra 1,5°C nei prossimi anni'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/02/onu-riscaldamento-globale-sopra-15c-nei-prossimi-anni_e47d7209-8203-4b62-8447-7e442d2b7c5f.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-02T09:37:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "É possível limitar a duração do superaquecimento global acima de 1,5°C nos próximos anos, mas isso requer ações de mitigação e adaptação.", "titulo_pt": "ONU: superaquecimento global acima de 1,5°C provável nos próximos anos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 139705, "titulo": "‘The sky is for drones’: Zelensky warns Russian skies unsafe for airlines", "url": "https://www.france24.com/en/video/20260902-the-sky-is-for-drones-zelensky-warns-russian-skies-unsafe-for-airlines", "fonte_id": "france24", "data_pub": "2026-09-02T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente ucraniano Volodymyr Zelensky advertiu as companhias aéreas e seguradoras que os céus russos estavam se tornando perigosos devido à presença de drones ucranianos e que esses céus estavam, na prática, sendo fechados. Ele alertou que o uso dos aeroportos russos principais também era arriscado.", "titulo_pt": "Céus russos são perigosos para voos, avisa zelensky", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 139577, "titulo": "Bus Crash in Egypt Kills at Least 16", "url": "https://www.nytimes.com/2026/09/02/world/africa/bus-crash-egypt-sinai.html", "fonte_id": "nyt_world", "data_pub": "2026-09-02T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ônibus se acidentou na Península do Sinaí, resultando em pelo menos 16 mortes. Outras 28 pessoas ficaram feridas no acidente.", "titulo_pt": "Acidente de ônibus na península do sinaí mata pelo menos 16", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 139584, "titulo": "U.S.S. Abraham Lincoln Docks in Thailand, Giving Weary Crew a Break", "url": "https://www.nytimes.com/2026/09/02/world/asia/uss-lincoln-arrives-thailand.html", "fonte_id": "nyt_world", "data_pub": "2026-09-02T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O U.S.S. Abraham Lincoln, com milhares de marinheiros e marines a bordo, atracou na Tailândia, oferecendo um descanso para a tripulação após uma missão difícil no Irã.", "titulo_pt": "U.S.S. Abraham Lincoln chega à tailândia, proporcionando descanso para a tripulação", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 139371, "titulo": "UE convoca embaixador russo após acusação de ataque na Alemanha", "url": "https://www.cnnbrasil.com.br/internacional/ue-convoca-embaixador-russo-apos-acusacao-de-ataque-na-alemanha/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Alemanha acusou a Rússia de ter tentado realizar um ataque em Leipzig e a União Europeia convocou o embaixador russo em resposta. Em conjunto, os países europeus anunciaram uma série de medidas.", "titulo_pt": "UE convoca embaixador russo após acusação de ataque na Alemanha", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 139833, "titulo": "Israel is prepared to respond to Iranian attacks, says defence minister", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israel-prepared-respond-iranian-attacks-says-defence-minister", "fonte_id": "middle_east_eye", "data_pub": "2026-09-02T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro da Defesa de Israel afirmou que o país está preparado para responder a possíveis ataques iranianos durante o período das festas judaicas, que começam no meio de setembro. Segundo ele, embora os iranianos estejam atacando outras regiões, existe a possibilidade de uma ação contra Israel.", "titulo_pt": "Israel se prepara para responder a ataques iranianos, diz ministro da defesa", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 139706, "titulo": "Hong Kong activist Joshua Wong pleads guilty in second national security case", "url": "https://www.france24.com/en/video/20260902-hong-kong-activist-joshua-wong-pleads-guilty-in-second-national-security-case", "fonte_id": "france24", "data_pub": "2026-09-02T09:26:00Z", "idioma": "en", "provavel_duplicata_de": 139639, "texto_pt": "O ativista pró-democracia de Hong Kong, Joshua Wong, admitiu culpa em um segundo caso de segurança nacional sob uma lei impuesta pelo governo chinês, o que provavelmente levará a uma pena adicional de prisão. Wong já está cumprindo uma pena de quatro anos e oito meses por um caso separado de segurança nacional relacionado a uma primária política não-oficial.", "titulo_pt": "Ativista pró-democracia de hong Kong Joshua Wong se entrega em segundo caso de segurança nacional", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 139891, "titulo": "Xi makes world tour ahead of White House summit", "url": "https://www.scmp.com/plus/news/china/diplomacy/article/3366111/xi-makes-world-tour-ahead-white-house-summit?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-02T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente chinês Xi Jinping chegou à Egito, o segundo destino de uma possível viagem intensa que culminará com uma reunião no Palácio Branco. Xi afirmou que, uma vez que bebeu das águas do Nilo, está destinado a retornar.", "titulo_pt": "Xi inicia viagem internacional antes da cúpula do White House", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 139707, "titulo": "Nepal floods: Families gather at overwhelmed morgues in desperate search for loved ones", "url": "https://www.france24.com/en/video/20260902-nepal-floods-families-gather-at-overwhelmed-morgues-in-desperate-search-for-loved-ones", "fonte_id": "france24", "data_pub": "2026-09-02T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No Nepal, a esperança de encontrar sobreviventes está se esgotando diariamente. Famílias estão buscando corpos em morgues sobrecarregadas, enquanto autoridades começam a enterrar os restos mortais após coletar amostras de DNA e atribuir números de identificação.", "titulo_pt": "Nepal: famílias procuram corpos em morgues sobrecarregadas após inundações", "veiculo": "France 24", "pais": "França", "classe": "A"}], "mundo__eventos": [{"titulo": "Zelensky pede a companhias aéreas para evitar o espaço aéreo russo em meio a operações de drones", "sumario": "O presidente ucraniano Zelensky pediu às companhias aéreas que evitem o espaço aéreo russo, enquanto as operações de drones ucranianas intensificam. Zelenskyy pediu às companhias aéreas que evitassem o espaço aéreo russo, alertando que as operações de drones ucranianas estão aumentando a segurança aérea nos céus. O presidente ucraniano Zelenski pediu às companhias aéreas que evitem o espaço aéreo russo devido ao aumento dos ataques com drones.", "artigos": [{"id": 139688, "titulo": "Zelensky says airlines should avoid Russian airspace as Ukraine escalates drone operations", "url": "https://www.bbc.co.uk/news/articles/c9v9yydy2wvo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-02T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente ucraniano Zelensky pediu às companhias aéreas que evitem o espaço aéreo russo, enquanto as operações de drones ucranianas intensificam. Algumas companhias aéreas, incluindo chinesas e de estados do Golfo, continuam a usar o espaço aéreo russo. Por outro lado, a Rússia anunciou que intensificará seus ataques contra a Ucrânia.", "titulo_pt": "Zelensky pede a companhias aéreas para evitar o espaço aéreo russo em meio a operações de drones", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 139760, "titulo": "Zelenskyy says airlines should avoid Russian airspace as Ukraine expands drone operations", "url": "https://www.cnbc.com/2026/09/02/ukraine-zelenskyy-airlines-russia-drone-war.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-02T09:56:00Z", "idioma": "en", "provavel_duplicata_de": 139688, "texto_pt": "Zelenskyy pediu às companhias aéreas que evitassem o espaço aéreo russo, alertando que as operações de drones ucranianas estão aumentando a segurança aérea nos céus.", "titulo_pt": "Zelenskyy pede às companhias aéreas para evitar o espaço aéreo russo", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 139589, "titulo": "Zelenski pide a las aerolíneas evitar el espacio aéreo de Rusia por el aumento de ataques con drones", "url": "https://www.latercera.com/mundo/noticia/zelenski-pide-a-las-aerolineas-evitar-el-espacio-aereo-de-rusia-por-el-aumento-de-ataques-con-drones/", "fonte_id": "la_tercera", "data_pub": "2026-09-02T09:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente ucraniano Zelenski pediu às companhias aéreas que evitem o espaço aéreo russo devido ao aumento dos ataques com drones. Segundo ele, há uma escalada significativa de drones voando no céu russo.", "titulo_pt": "Zelenski pede a aerolíneas evitar espaço aéreo russo por aumento de ataques com drones", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}]}], "economia": [{"id": 139460, "titulo": "A coerência na interpretação dos incentivos fiscais da Zona Franca de Manaus", "url": "https://www.jota.info/coberturas-especiais/jurisprudente/a-coerencia-na-interpretacao-dos-incentivos-fiscais-da-zona-franca-de-manaus", "fonte_id": "jota", "data_pub": "2026-09-02T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto destaca que o Superior Tribunal de Justiça (STJ) não deve interpretar de forma extensiva a saída da Zona Franca de Manaus e de forma literal a entrada nela.", "titulo_pt": "Coerência na interpretação dos incentivos fiscais da Zona Franca de Manaus", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 139395, "titulo": "Reforma Tributária: o fim da guerra fiscal e uma nova geografia empresarial", "url": "https://www.infomoney.com.br/business/reforma-tributaria-o-fim-da-guerra-fiscal-e-uma-nova-geografia-empresarial/", "fonte_id": "infomoney", "data_pub": "2026-09-02T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma tributária pode causar mudanças profundas e geográficas para as empresas. O novo sistema pode terminar com a guerra fiscal entre estados.", "titulo_pt": "Reforma Tributária: o fim da guerra fiscal e uma nova geografia empresarial", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 139461, "titulo": "STJ permite creditamento de PIS/Cofins sobre gasolina e diesel", "url": "https://www.jota.info/tributos/stj-permite-creditamento-de-pis-cofins-sobre-gasolina-e-diesel", "fonte_id": "jota", "data_pub": "2026-09-02T09:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A distribuidora pode creditar PIS/Cofins sobre a gasolina C e o óleo diesel BX a B30. O Superior Tribunal de Justiça (STJ) permitiu o creditamento desses impostos sobre esses produtos.", "titulo_pt": "STJ permite creditamento de PIS/Cofins sobre gasolina e diesel", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 139887, "titulo": "India defies Iran war oil shock to keep 8% growth on track", "url": "https://www.scmp.com/week-asia/economics/article/3366115/india-defies-iran-war-oil-shock-keep-8-growth-track?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-02T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Índia registrou crescimento econômico superior às expectativas no primeiro trimestre, expandindo 7,8% em comparação com a previsão do Banco Reserve de 7%. Mesmo com a instabilidade de preços do petróleo causada pelo conflito entre Estados Unidos e Irã, os analistas mantêm a confiança de que a economia indiana pode manter seu ritmo de crescimento no restante do ano e permanecer como a economia de maior crescimento do mundo entre as maiores economias.", "titulo_pt": "Índia mantém crescimento acima das expectativas, mesmo com impacto do conflito entre EUA e Irã", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 139761, "titulo": "Meta settlement could clear the way for new AI product launches, Morgan Stanley says", "url": "https://www.cnbc.com/2026/09/02/meta-18-billion-settlement-ai-products.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-02T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Analistas da Morgan Stanley sugerem que a resolução legal do caso Meta poderia permitir a lançamento de novos produtos de inteligência artificial. Eles notam que há sinais de que o pipeline de produtos da Meta pode começar a fluir após este evento.", "titulo_pt": "Acordo meta pode facilitar lançamento de novos produtos de IA, diz Morgan Stanley", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 139400, "titulo": "KPMG: fusões no consumo caem 51% — razões incluem os juros e um outlier", "url": "https://www.infomoney.com.br/business/kpmg-fusoes-no-consumo-caem-51-razoes-incluem-os-juros-e-um-outlier/", "fonte_id": "infomoney", "data_pub": "2026-09-02T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de fusões no setor de consumo diminuiu em 51%, de acordo com um levantamento da KPMG. As razões incluem juros altos e a presença de um outlier.", "titulo_pt": "KPMG: fusões no consumo caem 51% — juros e outlier são fatores", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 139647, "titulo": "Ryanair warns air fares in Europe will jump next year if oil price stays high", "url": "https://www.theguardian.com/business/2026/sep/02/ryanair-warns-air-fares-europe-jump-next-year-oil-price-stays-high", "fonte_id": "guardian_world", "data_pub": "2026-09-02T08:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ryanair avisou que os preços das passagens aéreas na Europa podem aumentar no próximo ano se o preço do petróleo permanecer alto. A companhia aérea reduziu suas metas de passageiros para o ano, esperando reduzir sua exposição ao combustível de jato não-hedgeado durante a temporada off-peak invernal.", "titulo_pt": "Ryanair alerta: preços das passagens aéreas na Europa podem subir se o preço do petróleo permanecer alto", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 139786, "titulo": "European gas prices hit three-year high", "url": "https://www.ft.com/content/f73c2c95-5c73-4b2f-9f00-9fa8c12c10c9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-02T08:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços do gás na Europa atingiram um nível não visto há três anos. O ressurgimento das tensões entre Estados Unidos e Irã aumenta as preocupações com um retorno a um conflito completo.", "titulo_pt": "Preços do gás na Europa atingem nível não visto há três anos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 140028, "titulo": "STAT+: How Trump’s latest pharma deals may undermine efforts to rein in drug costs", "url": "https://www.statnews.com/2026/09/02/trump-most-favored-nation-drug-pricing-industry-analysts-skeptical/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-02T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Análistas afirmam que os acordos privados envolvem farmacêuticas concordando em reduzir preços no Medicaid, onde os preços são baixos, em troca de não haver cortes de preços no Medicare.", "titulo_pt": "Como os últimos acordos de Trump na farmacêutica podem enfraquecer esforços para controlar os custos dos medicamentos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 139861, "titulo": "Nearly 1,000 business manager visa holders left Japan in first half of 2026", "url": "https://www.japantimes.co.jp/news/2026/09/02/japan/japan-immigration-business-manager-visa/", "fonte_id": "japan_times", "data_pub": "2026-09-02T08:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nas primeiras seis meses de 2026, cerca de 1.000 portadores de vistos de gerenciamento de negócios deixaram o Japão. Os requisitos mais rígidos, implementados desde outubro, exigem agora um capital mínimo de 30 milhões de ienes, dobrando o valor anterior.", "titulo_pt": "Quase 1.000 portadores de vistos de gerenciamento de negócios deixaram o Japão no primeiro semestre de 2026", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 139463, "titulo": "A Margem Equatorial, o petróleo e o desenvolvimento nacional", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-margem-equatorial-o-petroleo-e-o-desenvolvimento-nacional", "fonte_id": "jota", "data_pub": "2026-09-02T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto destaca a necessidade de combinar a segurança energética com a transição para fontes de energia limpa.", "titulo_pt": "A Margem Equatorial, o petróleo e o desenvolvimento nacional", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 139464, "titulo": "Mercados preditivos e a sina dos modelos de negócios inovadores no Brasil", "url": "https://www.jota.info/opiniao-e-analise/colunas/fronteiras-regulacao-financeira/mercados-preditivos-e-a-sina-dos-modelos-de-negocios-inovadores-no-brasil", "fonte_id": "jota", "data_pub": "2026-09-02T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute como a reação regulatória no Brasil tende a repetir padrões conhecidos, afetando negócios inovadores. Os mercados preditivos são mencionados como exemplo desse padrão.", "titulo_pt": "Mercados preditivos e o padrão regulatório no Brasil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 139465, "titulo": "IBS/CBS: um só litígio, duas Justiças", "url": "https://www.jota.info/opiniao-e-analise/artigos/ibs-cbs-um-so-litigio-duas-justicas", "fonte_id": "jota", "data_pub": "2026-09-02T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Constituição unificou a tributação de consumo para assegurar a uniformidade. IBS/CBS trata de um único litígio que envolve duas instâncias judiciais.", "titulo_pt": "IBS/CBS: um só litígio, duas Justiças", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 139466, "titulo": "A necessária construção do dicionário do SUS Digital", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-necessaria-construcao-do-dicionario-do-sus-digital", "fonte_id": "jota", "data_pub": "2026-09-02T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei 5.875/2013 visa definir como a linguagem do SUS Digital será estabelecida, contestada e corrigida.", "titulo_pt": "A necessária construção do dicionário do SUS Digital", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 139467, "titulo": "Free flow não é passe livre", "url": "https://www.jota.info/opiniao-e-analise/colunas/controle-publico/free-flow-nao-e-passe-livre", "fonte_id": "jota", "data_pub": "2026-09-02T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TCU emitiu alertas sobre os riscos, custos e benefícios associados ao projeto Rota Agro Central. O Free flow, que não é o mesmo que passe livre, foi mencionado como parte desse projeto.", "titulo_pt": "Free flow não é passe livre", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 139948, "titulo": "U.S. restaurant chain Chipotle opens 1st Asian outlet in Seoul", "url": "https://en.yna.co.kr/view/AEN20260902008900320", "fonte_id": "yonhap_news", "data_pub": "2026-09-02T07:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cadeia de restaurantes americanos Chipotle Mexican Grill inaugurou sua primeira unidade asiática em Seul, Coreia do Sul.", "titulo_pt": "Chipotle abre primeiro restaurante asiático em seul", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 139941, "titulo": "Court approves Homeplus' rehabilitation plan", "url": "https://en.yna.co.kr/view/AEN20260902010200315", "fonte_id": "yonhap_news", "data_pub": "2026-09-02T09:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal de Seul aprovou um plano de recuperação proposto pela empresa Homeplus.", "titulo_pt": "Tribunal de seul aprova plano de recuperação da Homeplus", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 139991, "titulo": "A Prop 65 Crash Course: What You Need to Know (2026)", "url": "https://www.wired.com/story/why-does-everything-have-a-prop-65-warning/", "fonte_id": "wired", "data_pub": "2026-09-02T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Se você encontrar uma advertência da Prop 65, não se preocupe. Este texto explica o que você precisa saber sobre essas advertências.", "titulo_pt": "A Prop 65 em resumo: o que você precisa saber", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 139888, "titulo": "China’s No 2 foundry Hua Hong invests US$2b in new fab to meet surging AI-driven demand", "url": "https://www.scmp.com/tech/big-tech/article/3366104/chinas-no-2-foundry-hua-hong-invests-us2b-new-fab-meet-surging-ai-driven-demand?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-02T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A segunda maior fabricante de chips da China, Hua Hong Grace Semiconductor, investiu US$ 2 bilhões em uma expansão de capacidade em Wuhan, para atender à demanda crescente de infraestrutura de inteligência artificial e evitar restrições tecnológicas dos Estados Unidos. O novo investimento inclui a construção de uma nova linha de 12 polegadas especializada, sendo a terceira fábrica na cidade chinesa.", "titulo_pt": "Hua Hong, segunda maior fabricante de chips da china, investe US$ 2 bi em nova fábrica para atender demanda de IA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 139892, "titulo": "BYD, Leapmotor buck EV market slowdown as pressure piles up on small rivals", "url": "https://www.scmp.com/business/china-business/article/3366048/byd-leapmotor-buck-ev-market-slowdown-pressure-piles-small-rivals?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-02T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "BYD e Leapmotor registraram vendas mais altas em agosto, mesmo com o mercado de veículos elétricos da China em recessão devido a uma demanda mais fraca dos consumidores. Analistas esperam que as empresas menores enfrentem vendas decrescentes e maiores perdas no restante do ano devido à concorrência mais intensa.", "titulo_pt": "BYD e Leapmotor se destacam no mercado de veículos elétricos chines ao encolhimento do mercado devido à menor demanda", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 139893, "titulo": "China cracks down on AI ‘slop’, clearing out clutter from WeChat, RedNote, Douyin", "url": "https://www.scmp.com/tech/article/3366096/china-cracks-down-ai-deepfakes-and-clickbait-cluttering-wechat-rednote-douyin?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-02T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China está intensificando a repressão ao conteúdo artificialmente gerado de baixa qualidade em plataformas de mídia social, como WeChat, RedNote e Douyin, como parte de uma campanha mais ampla contra o abuso da tecnologia de inteligência artificial. O órgão de supervisão da internet chinesa, o Cyberspace Administration of China (CAC), relatou a remoção de mais de 5,61 milhões de itens prejudiciais ou ilegais e cerca de 49.000 contas.", "titulo_pt": "China combate conteúdo de IA de baixa qualidade em plataformas de mídia social", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 139669, "titulo": "OpenAI, Anthropic aim to balance safety, progress as IPOs near", "url": "https://www.axios.com/2026/09/02/openai-anthropic-fable-astra-ipo", "fonte_id": "axios", "data_pub": "2026-09-02T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI e Anthropic estão buscando equilibrar a apresentação de suas empresas como sólidas e em rápido crescimento para Wall Street, com a garantia de que suas tecnologias não representam riscos insuportáveis para governos e sociedade. As duas companhias visam IPOs potencialmente recordes próximos, com OpenAI planejando lançar seu modelo Astra, mas limitando algumas de suas capacidades mais avançadas a testadores de confiança devido a preocupações de segurança cibernética.", "titulo_pt": "Openai e Anthropic buscam equilibrar segurança e crescimento antes de IPOs", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 139894, "titulo": "US universities curb international student internships following federal warning", "url": "https://www.scmp.com/news/china/diplomacy/article/3366105/us-universities-curb-international-student-internships-following-federal-warning?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-02T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias universidades americanas suspenderam ou limitaram o Curricular Practical Training (CPT) para estudantes internacionais após duas diretrizes do Programa de Estudantes e Visitantes Exchanges (SEVP), em agosto. O CPT permite que estudantes estrangeiros realizem estágios relacionados ao seu curso fora do campus.", "titulo_pt": "Universidades americanas limitam estágios de estudantes internacionais após aviso federal", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 139228, "titulo": "Tim Cook receberá US$ 47 milhões em cargo criado para ele na Apple", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/tim-cook-recebera-us-47-milhoes-em-cargo-criado-para-ele-na-apple.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-02T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Apple concedeu a Tim Cook um pacote de remuneração de cerca de 47 milhões de dólares em sua nova função de presidente executivo do conselho. Este pacote é semelhante ao recebido por John Ternus, seu sucessor como CEO.", "titulo_pt": "Tim Cook receberá cerca de 47 milhões em novo cargo na Apple", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 139997, "titulo": "Microsoft is enabling a Windows 11 security feature that can hurt gaming performance", "url": "https://www.theverge.com/news/988056/microsoft-windows-11-memory-integrity-rollout-october-2026", "fonte_id": "the_verge", "data_pub": "2026-09-02T08:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft está prestes a lançar a função de integridade de memória do Windows 11 em mais dispositivos no próximo mês. A função de proteção no nível do núcleo visa impedir o funcionamento de código ou drivers maliciosos, mas a empresa advertiu anteriormente que pode afetar o desempenho do gaming em PCs.", "titulo_pt": "Microsoft habilitará uma função de segurança do Windows 11 que pode prejudicar o desempenho do jogo", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 139386, "titulo": "OpenAI afirma que nova IA será tão poderosa que precisa de mais segurança", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/openai-afirma-que-nova-ia-sera-tao-poderosa-que-precisa-de-mais-seguranca/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OpenAI declarou que a nova IA será extremamente poderosa e necessitará de maior segurança. O modelo consegue identificar vulnerabilidades desconhecidas em sistemas bem protegidos sem orientação humana.", "titulo_pt": "Openai diz que nova IA será tão poderosa que precisa de mais segurança", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 139951, "titulo": "Voice phishing crimes drop 40 pct thanks to tougher measures", "url": "https://en.yna.co.kr/view/AEN20260902008400315", "fonte_id": "yonhap_news", "data_pub": "2026-09-02T07:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de casos de phishing por voz caiu cerca de 40% devido a medidas mais rigorosas.", "titulo_pt": "Redução de 40% nos casos de phishing por voz graças a medidas mais rígidas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 139836, "titulo": "The world banned landmines and cluster munitions. Can it stop killer AI before it is too late?", "url": "https://www.middleeasteye.net/news/world-banned-landmines-and-cluster-munitions-can-it-stop-killer-ai-it-too-late", "fonte_id": "middle_east_eye", "data_pub": "2026-09-02T07:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mundo proibiu minas terrestres e bombas de cluster. Agora, ativistas correm contra o desenvolvimento de armas autônomas que podem aumentar o risco de guerra e o dano civiliano.", "titulo_pt": "O mundo proibiu minas terrestres e bombas de cluster. Pode deter as armas autônomas antes que seja tarde demais?", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 139952, "titulo": "Defense chief stresses push for AI technology application in military", "url": "https://en.yna.co.kr/view/AEN20260902007600315", "fonte_id": "yonhap_news", "data_pub": "2026-09-02T07:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro da Defesa, Ahn Gyu-back, enfatizou a importância do uso de tecnologia de inteligência artificial no exército durante uma declaração recente em Seul.", "titulo_pt": "Ministro da defesa enfatiza aplicação de tecnologia de IA no exército", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 139954, "titulo": "Alteogen signs deal with Novartis worth up to 4.4 tln won for subcutaneous formulations", "url": "https://en.yna.co.kr/view/AEN20260902007500320", "fonte_id": "yonhap_news", "data_pub": "2026-09-02T06:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa sul-coreana de biotecnologia Alteogen assinou um acordo com a Novartis com valor potencial de até 4,4 trilhões de wones para formularações subcutâneas.", "titulo_pt": "Alteogen firma acordo com a Novartis por até 4,4 trilhões de wones para formularações subcutâneas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 139932, "titulo": "China's Galactic Energy puts PALLAS-1 in orbit, raising stakes in reusable rocket race", "url": "https://www.digitimes.com/news/a20260902VL210/launch-recovery-commercial.html", "fonte_id": "digitimes", "data_pub": "2026-09-02T06:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa chinesa privada de lançamentos Galactic Energy Space Technology lançou com sucesso o PALLAS-1, seu foguete reutilizável a base de líquido de médio a grande porte, expandindo sua oferta para incluir both solid and liquid fuels.", "titulo_pt": "China's Galactic Energy coloca PALLAS-1 em órbita, aumentando a concorrência na corrida dos foguetes reutilizáveis", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 139975, "titulo": "SK chief’s Kioxia overture raises stakes in NAND race", "url": "https://www.koreaherald.com/article/10860491", "fonte_id": "korea_herald", "data_pub": "2026-09-02T06:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do grupo SK, Chey Tae-won, está considerando a construção de uma fábrica de chips no Japão, possivelmente em parceria com a fabricante de flash NAND Kioxia, visando uma cooperação mais estreita com a rival japonesa. A proposta inclui joint production, coordenação da cadeia de suprimentos e pesquisa e desenvolvimento em comum.", "titulo_pt": "Chefe do SK considera parceria com a Kioxia para fábrica de chips no Japão", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 139275, "titulo": "Datação de sítio que mudou ideia sobre presença de humanos nas Américas volta ao debate", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/datacao-de-sitio-que-mudou-ideia-sobre-presenca-de-humanos-nas-americas-volta-ao-debate.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-02T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores voltaram a debater a datação do sítio arqueológico de Monte Verde, que sugere a presença de humanos nas Américas há cerca de 14.500 anos. Um estudo recente havia sugerido uma ocupação mais recente do local.", "titulo_pt": "Datação de sítio que mudou ideia sobre presença de humanos nas Américas volta ao debate", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 140008, "titulo": "Bovine stem cells offer new approach to future cultivated steak research", "url": "https://phys.org/news/2026-08-bovine-stem-cells-approach-future.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa busca usar células estaminais bovinas para desenvolver carne cultivada, uma alternativa potencialmente mais sustentável à produção tradicional de carne, mas que ainda enfrenta desafios significativos, especialmente na criação de cortes complexos como o steak.", "titulo_pt": "Células estaminais bovinas oferecem nova abordagem para pesquisas futuras de carne cultivada", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 140009, "titulo": "Eight-letter DNA alphabet is accurately transcribed by a natural enzyme", "url": "https://phys.org/news/2026-08-letter-dna-alphabet-accurately-natural.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da University of California San Diego demonstraram que uma enzima essencial da biologia pode ler e transcrever um alfabeto genético expandido com oito letras. Essa descoberta sugere que células podem processar informações genéticas sintéticas usando sua própria maquinaria molecular, avançando um objetivo importante na biologia sintética de expandir a língua do DNA.", "titulo_pt": "Oito letras do alfabeto DNA são transcritas com precisão por uma enzima natural", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 140030, "titulo": "Opinion: The next DSM should address the algorithm’s role in eating disorders", "url": "https://www.statnews.com/2026/09/02/dsm-6-eating-disorders-algorithms-social-media-influence-screening/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-02T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O próximo DSM, previsto para 2030, deveria abordar os ambientes digitais dos pacientes com transtornos alimentares, segundo especialistas.", "titulo_pt": "Opinião: o próximo DSM deve tratar do papel dos algoritmos nos transtornos alimentares", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 140010, "titulo": "Global warming will exceed limit, UN says in a report that maps path to get back below danger zone", "url": "https://phys.org/news/2026-09-global-exceed-limit-path-danger.html", "fonte_id": "phys_org", "data_pub": "2026-09-02T07:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ONU reconheceu que o planeta não pode evitar alguns dos piores efeitos do aquecimento global. Agora, o mundo precisa encontrar maneiras de reduzir as temperaturas abaixo do nível perigoso e retornar à segurança.", "titulo_pt": "Aquecimento global ultrapassará limite, diz relatório da ONU", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 139905, "titulo": "Chinese research team may have cracked secret to crossbreeding Asian and African rice", "url": "https://www.scmp.com/news/china/science/article/3366073/chinese-research-team-may-have-cracked-secret-crossbreeding-asian-and-african-rice?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-02T06:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas chineses identificaram três genes que representam um obstáculo à cruzamento entre variedades de arroz asiático e africano, mas também possivelmente uma solução para o problema. Esta descoberta poderia ser fundamental para a criação de híbridos de arroz com alta produtividade.", "titulo_pt": "Equipe chinesa pode ter descoberto a chave para cruzar variedades de arroz asiático e africano", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 139981, "titulo": "KAIST, Caltech to jointly select, mentor postdoctoral researchers", "url": "https://www.koreaherald.com/article/10860443", "fonte_id": "korea_herald", "data_pub": "2026-09-02T05:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A KAIST (Korea Advanced Institute of Science and Technology) e o Caltech (California Institute of Techno
