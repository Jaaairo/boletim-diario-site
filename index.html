<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<div class="modal-overlay" id="modal-flag">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

</div>

const D = {"gerado_em": "27/11/2026 19:18", "stats": {"noticias_novas": 497, "resumos_gerados": 237}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva (Lula) manteve alguns ministros em seus cargos, como Bruno Moretti no Ministério do Planejamento. Ele também buscou nomes para preencher uma vaga no Supremo Tribunal Federal (STF), consultando Lewandowski, Zanin e Cármen Lúcia. O PSB, partido do vice-presidente Geraldo Alckmin, busca indicar nomes para ministérios. O ex-presidente Jair Bolsonaro, internado, teve uma melhora no funcionamento intestinal, mas ainda não há previsão de alta. Lula anunciou a criação de espaços de convivência para idosos, enquanto a maioria dos brasileiros espera mudanças nas políticas do próximo governo, com 49% de aprovação e 47% de desaprovação. O procurador-geral da República, Paulo Gonet, enviou um parecer ao STF contrário ao pedido do governo para avaliar um empréstimo ao BRB. O ministro Flávio Dino suspendeu emendas parlamentares de Flávio Bolsonaro ao PLOA de 2027, totalizando R$ 79,3 milhões, e solicitou explicações ao Senado.", "mundo": "As eleições espanholas estão em destaque com movimentações intensas de partidos de esquerda e direita. O primeiro-ministro Pedro Sánchez tenta manter a maioria progressista, enquanto o candidato do Partido Popular, Alberto Núñez Feijóo, busca mobilizar os votos conservadores. As eleições, marcadas para este domingo, podem resultar em um governo de direita ou na reeleição de Sánchez. Em outro destaque, a Ucrânia apresentou uma proposta de cessar-fogo no Mar Negro para facilitar as exportações de alimentos, uma medida que aguarda uma resposta de Moscou. Além disso, o governo brasileiro planeja aproveitar a 69ª Cúpula do Mercosul para aproximar o bloco comercial dos mercados do Caribe e da América Central, com a transferência da presidência do Mercosul do Uruguai para a Argentina.\n\nOs líderes da União Europeia discutiram sobre os gastos do orçamento e uma proposta de empréstimo de 49 bilhões de dólares para a Ucrânia, mas não chegaram a um consenso. Em outro desenvolvimento, a China realizou exercícios militares para testar táticas de pouso. A Taiwan planejou enviar 15 aviões AT-3 aposentados para o Paraguai, em um acordo de cooperação militar. Um relatório do IISS alertou que a campanha de sabotagem russa pode causar mortes em massa na Europa, com a Alemanha e a Polônia sendo identificados como os principais alvos potenciais. O presidente dos Estados Unidos, Donald Trump, concluiu o maior acordo comercial já realizado entre os EUA e as Filipinas, fortalecendo a aliança entre os dois países. Além disso, hackers invadiram uma plataforma em nuvem da Força Aérea dos EUA, comprometendo informações sigilosas. A Ucrânia afirmou ter usado um sistema laser pela primeira vez para abater um dron russo, e o relatório destaca o aumento do risco de um 'evento com vítimas em massa' devido às agressões russas na Europa. O Kremlin planejou expandir sua frota naval com cinco novos submarinos nucleares equipados com armas hipersônicas até 2030. O comandante da Força Aeroespacial da Guarda Revolucionária Islâmica do Irã afirmou que os inimigos do país podem esperar ação no ar e na mar. A Estônia planejou fechar sua fronteira com a Rússia em 1º de dezembro, fortalecendo suas relações estratégicas com o Cáucaso do Sul. A Unidade de Emergências Militares de Espanha foi enviada para atender migrantes que chegaram à ilha de El Hierro, nas Ilhas Canárias. O governo Merz aprovou um orçamento para 2027 com investimentos recordes em defesa e infraestrutura, mas congela benefícios sociais e reduz repasses à previdência para financiar os novos gastos. O governo dos Estados Unidos tentou persuadir o Irã e a Venezuela a saírem da Organização dos Países Exportadores de Petróleo (Opep), levando à intervenção dos sauditas. O presidente Zelenskyy criticou a 'amizade' de Trump com Putin, enquanto Kiev propôs um cessar-fogo no Mar Negro para proteger as exportações de grãos. Além disso, Israel matou quatro pessoas em Gaza, e o filho do líder do Hamas sobreviveu a um ataque de assassinato israelense. Finalmente, Elon Musk obteve a aprovação dos EUA para lançar um milhão de satélites, planejando mover os centros de dados de inteligência artificial para o espaço.", "economia": "A economia brasileira e internacional enfrenta diversos desafios, com destaque para a recessão da França, que entrou em sua segunda recessão consecutiva, refletindo pressões para controlar gastos e sanear as contas públicas. O Tesouro Direto registrou o melhor outubro da história, com vendas de R$ 10,57 bilhões, refletindo a atratividade dos títulos públicos. As ações da Petrobras recuaram até 3%, influenciadas pela desvalorização do petróleo Brent e pelo câmbio. A Axia Energia vendeu R$ 2,1 bilhões em ações da ISA Energia em um block trade, aproveitando o movimento do mercado. A B3 firmou um acordo com seis grandes bancos para desenvolver uma stablecoin em reais, visando inovar no setor financeiro. Em meio a esses eventos, a perspectiva de rating da França foi cortada para negativa pela S&P devido à instabilidade política, enquanto a companhia aérea norueguesa Norse Atlantic entrou em falência devido ao aumento dos preços do combustível. A demanda privada por dólares permaneceu alta em outubro, com compras superando US$ 3 bilhões, mas o saldo positivo da conta corrente cambial não foi afetado. A Binance formou uma parceria com a IWF para ajudar a identificar pessoas que usam a plataforma para comprar e vender imagens e vídeos de abuso sexual de crianças, demonstrando a crescente preocupação com a segurança digital.", "tecnologia": "A OpenAI está processando a Apple por supostas violações de segredos comerciais, aprofundando a concorrência entre as duas empresas na corrida por produtos de inteligência artificial (IA). Segundo relatos, a OpenAI acusa a Apple de ter roubado seus segredos comerciais, em resposta ao processo da Apple contra a OpenAI e dois ex-funcionários. Além disso, empresas de IA na China enfrentam dificuldades para obter chips de alta qualidade devido às restrições impostas pelos Estados Unidos, mas estão recorrendo a data centers no Sudeste Asiático, o que Washington também tenta impedir. Em outro desenvolvimento, os preços da memória DDR4 começam a cair, aliviando a crise de RAM para 2027, enquanto a Tesla está desenvolvendo um assistente virtual com IA para ajudar na realização de tarefas repetitivas e na organização do trabalho.", "ciencia": "Um estudo publicado no jornal Nature revelou a descoberta de duas linhagens humanas antediluvianas em cavernas da China do Sul, liderado por Song Xing do Centro Nacional de Investigação sobre a Evolução Humana. As pesquisas, que analisaram quatro dentes fósseis, identificaram uma linhagem com afinidades com os Denisovanos e outra mais primitiva cuja identidade evolutiva permanece incerta. Paralelamente, a Organização Mundial da Saúde alertou sobre o retorno do sarampo, devido à estagnação das campanhas de eliminação, influenciada por informações falsas e desinformação. As autoridades ugandenses iniciaram ensaios clínicos de uma vacina mRNA desenvolvida pela Moderna para tratar a cepa Bundibugyo do Ebola, que está causando uma epidemia na República Democrática do Congo. Além disso, cientistas do Instituto de Informação Aeroespacial da Academia Chinesa de Ciências e colaboradores desenvolveram um modelo matemático que utiliza parâmetros morfométricos para estimar rapidamente o estado de degradação e a idade de crateras lunares, aplicando-o a 140 crateras na área de pouso da missão Chang'e-6.", "cultura": "O evento mais importante na cultura deste relatório é a inauguração da Árvore de Natal da Lagoa, no Rio de Janeiro, que incluirá fogos de artifício e um show com a Orquestra Petrobras Sinfônica, marcado para o sábado (28) às 20h. Em seguida, a curadora Hoor Al Qasimi foi nomeada para a Biennale de Veneza em 2028. Durante a viagem da tapeçaria de Bayeux ao Museu Britânico, ela sofreu pequenos danos, mas permanece em boa condição geral. Na literatura, Daniel Mecca, organizador do festival BorgesPalooza, sugere que quebrar preconceitos pode ajudar a atrair mais leitores para a obra de Jorge Luis Borges. No cinema, a sequência de 'Era Uma Vez em Hollywood' decepcionou, mesmo com a presença de Brad Pitt, enquanto a curta-metragem 'A Morte de Gandji', de 1965, foi destacada na mostra de animação africana em Recife. A música também está presente com a nova canção de Natal de Olivia Rodrigo, 'Miss This Christmas', e com uma noite de nostalgia inspirada em Peter Pan promovida por DJ Tink no Club NVRLND.", "sociedade": "A expectativa de vida das mulheres no Brasil atingiu pela primeira vez os 80 anos, de acordo com dados do Instituto Brasileiro de Geografia e Estatística, refletindo avanços na saúde e bem-estar. Em Fortaleza, as escolas reduziram o horário das aulas devido ao calor extremo, uma decisão aprovada pelo Conselho Municipal de Educação local. A jogadora brasileira de futebol de areia Letícia 'Lelê' Villar, que está presa na Rússia há 1 ano e 4 meses, enviou uma carta ao presidente Luiz Inácio Lula da Silva pedindo ajuda do governo brasileiro. O Ministério da Saúde registrou 1.695 infecções confirmadas e um óbito por mpox no Brasil em novembro, com mais casos nesse mês do que em todos os outros meses do ano juntos. O artigo discute a Sala Cuna, que evoluiu de uma promessa a uma medida implementada, mas não fornece detalhes adicionais sobre o conteúdo do texto.", "meio_ambiente": "Inundações letais afetaram várias regiões do Equador, submergindo casas, negócios e estradas, conforme relatos do Al Jazeera. No Pantanal, apesar das chuvas intensas causadas pelo El Niño, o cenário é preocupante devido aos anos de seca extremos e incêndios na região, informa a DW Brasil. Em Roraima, a seca severa afeta 95% do estado e está isolando comunidades ribeirinhas, destacando a vulnerabilidade da Amazônia às mudanças climáticas, relata o Exame. Além disso, a elevação do nível do mar e o subsolo de cidades costeiras africanas podem expor mais de sete milhões de pessoas a inundações até 2050, segundo a Carbon Brief. Um professor uzbeque desenvolveu um projeto de educação ambiental que envolveu 25.000 pessoas em 25 escolas, vencendo uma competição internacional, relatado pela EuroNews. No Brasil, a Associação dos Municípios de Minas Gerais (AMM) criticou o corte de 30% no repasse federal para o piso salarial da enfermagem, considerando a medida inaceitável, informa o Exame. O AquaRio inaugurou um laboratório para a reprodução de corais ameaçados, visando preservar a diversidade genética de espécies ameaçadas, informa o Exame.", "direitos_humanos": "Um líder de seita no Quênia que incentivava jejuns extremos até a morte foi condenado a 123 homicídios, com uma sentença de 200 anos de prisão. Em um contexto mais amplo, famílias no norte do Iêmen enfrentam dificuldades para acessar alimentos, mesmo com a disponibilidade de farinha e óleo no mercado, devido a altos custos e à falta de trabalho e assistência humanitária. Além disso, ativistas na Macedônia do Norte intensificaram suas demandas por responsabilização e mudanças legislativas após uma série de femicídios e violência contra mulheres, enquanto a Coreia do Sul repatriou seis marinheiros norte-coreanos após 24 dias e manteve um em seu território para proteção."}, "resumo_do_dia": {"politica_nacional": [{"id": 292015, "titulo": "Além de Cármen, Lula consultou Lewandowski e Zanin sobre vaga no STF", "url": "https://www.metropoles.com/colunas/milena-teixeira/alem-de-carmen-lula-consultou-lewandowski-e-zanin-sobre-vaga-no-stf", "fonte_id": "metropoles", "data_pub": "2026-11-27T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula conversou com Lewandowski, Zanin e Cármen Lúcia sobre a possibilidade de preencher uma vaga no STF. O presidente também recebeu sugestões para essa vaga.", "titulo_pt": "Além de Cármen, Lula consultou Lewandowski e Zanin sobre vaga no STF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 291989, "titulo": "Reginaldo diz que Camilo na Casa Civil “terá papel fundamental” no Lula 4", "url": "https://www.cnnbrasil.com.br/politica/reginaldo-diz-que-camilo-na-casa-civil-tera-papel-fundamental-no-lula-4/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-27T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Reginaldo afirmou que Camilo terá um papel importante na Casa Civil do governo Lula. Ele destacou a atuação do ex-ministro na Educação e previu que Camilo poderá contribuir para a organização e condução do próximo governo.", "titulo_pt": "Reginaldo afirma que Camilo na Casa Civil terá papel fundamental no governo Lula", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 291860, "titulo": "Quando Boulos confrontou o Mercado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/demetriomagnoli/2026/11/quando-boulos-confrontou-o-mercado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-27T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um vídeo supostamente mostra um encontro secreto, na madrugada, entre o ministro Guilherme Boulos e o Mercado. Boulos estava com um boné vermelho e barba bem aparada, enquanto o Mercado aparece de costas nas imagens. A veracidade do documento não foi confirmada.", "titulo_pt": "Quando Boulos se encontrou com o Mercado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 291997, "titulo": "PSB quer emplacar João Campos e Márcio França na Esplanada dos Ministérios", "url": "https://www.cnnbrasil.com.br/politica/psb-quer-emplacar-joao-campos-e-marcio-franca-na-esplanada-dos-ministerios/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-27T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PSB, partido do vice-presidente Geraldo Alckmin, apresentou novas demandas ao governo Lula e está buscando o Ministério da Ciência e Tecnologia. O partido também quer emplacar João Campos e Márcio França na Esplanada dos Ministérios.", "titulo_pt": "PSB busca emplacar João Campos e Márcio França na Esplanada dos Ministérios", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 292025, "titulo": "Vereador aciona MPSP para investigar decoração de Natal em SP após críticas", "url": "https://www.metropoles.com/sao-paulo/vereador-aciona-mpsp-para-investigar-decoracao-de-natal-em-sp-apos-criticas", "fonte_id": "metropoles", "data_pub": "2026-11-27T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vereador Toninho Vespoli (PSol) solicitou uma investigação à MPSP (Polícia Militar do Estado de São Paulo) sobre a capacidade do Instituto Girassol de executar o projeto 'Natal Iluminado Paulista 2026', após críticas à decoração de Natal em São Paulo.", "titulo_pt": "Vereador solicita investigação à MPSP sobre decoração de Natal em SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 291848, "titulo": "PGR opina contra obrigar governo Lula a avalizar empréstimo para salvar BRB", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/pgr-opina-contra-obrigar-governo-lula-a-avalizar-emprestimo-para-salvar-brb.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O procurador-geral da República, Paulo Gonet, enviou um parecer ao STF contrário ao pedido do Governo do Distrito Federal para que a União avalizasse um empréstimo destinado a socorrer o BRB. O parecer foi enviado na quinta-feira (26).", "titulo_pt": "PGR opina contra obrigar governo Lula a avaliar empréstimo para BRB", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 291901, "titulo": "A indicação ao STF que o Centrão vê como possível cartada de Lula", "url": "https://veja.abril.com.br/politica/a-indicacao-ao-stf-que-o-centrao-ve-como-possivel-cartada-de-lula/", "fonte_id": "veja", "data_pub": "2026-11-27T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Interlocutores avaliam que a indicação de um nome pelo presidente Lula poderia reduzir resistências no Senado e facilitar a aprovação do candidato antes do recesso parlamentar. A indicação é vista pelo Centrão como uma possível estratégia de Lula para avançar no processo de nomeação.", "titulo_pt": "A indicação ao STF que o Centrão vê como possível cartada de Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 291861, "titulo": "Bolsonaro melhora e tem 'funcionamento intestinal espontâneo', diz DF Star", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/11/bolsonaro-melhora-e-tem-funcionamento-intestinal-espontaneo-diz-df-star.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-27T20:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro, de 71 anos, que está internado em Brasília, teve mais um dia de melhora e voltou a ter funcionamento intestinal espontâneo, conforme informou o hospital DF Star em boletim médico. No entanto, não há previsão para a alta do hospital.", "titulo_pt": "Bolsonaro melhora e tem funcionamento intestinal espontâneo, diz hospital", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 291845, "titulo": "Lula quer espaço de lazer e atenção para idosos", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/lula-quer-espaco-de-lazer-e-atencao-para-idosos", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-27T19:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva anunciou a criação de espaços de convivência para idosos, onde eles poderiam praticar atividades físicas, se entreter e ter acesso a atendimento médico. A ideia é que esses locais sejam construídos com o apoio das prefeituras e não sejam considerados asilos, mas sim locais onde os idosos possam ir quando quiserem.", "titulo_pt": "Lula propõe espaços de convivência e lazer para idosos", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 291854, "titulo": "Qual será a política fiscal de Lula 4?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/marcos-mendes/2026/11/qual-sera-a-politica-fiscal-de-lula-4.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T19:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há expectativa sobre a política fiscal do governo Lula 4, já que o partido esteve no poder em 17 dos últimos 24 anos, proporcionando dados suficientes para definir seu perfil fiscal.", "titulo_pt": "Qual será a política fiscal do governo Lula 4?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 291915, "titulo": "Dino suspende emendas de Flávio Bolsonaro e cobra explicações do Senado", "url": "https://veja.abril.com.br/brasil/dino-suspende-emendas-de-flavio-bolsonaro-e-cobra-explicacoes-do-senado/", "fonte_id": "veja", "data_pub": "2026-11-27T19:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF (Supremo Tribunal Federal) afirmou que a saída do país de Flávio Bolsonaro pode ter configurado quebra de decoro. O ministro suspendeu emendas do senador e solicitou explicações ao Senado.", "titulo_pt": "Diniz suspende emendas de Flávio Bolsonaro e cobra explicações do Senado", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 292100, "titulo": "Gilmar diz que consenso pelo fim da escala 6×1 não deve ser minimizado, mas alerta para transição no fim de ano", "url": "https://www.jota.info/trabalho/gilmar-diz-que-consenso-pelo-fim-da-escala-6x1-nao-deve-ser-minimizado-mas-alerta-para-transicao-no-fim-de-ano", "fonte_id": "jota", "data_pub": "2026-11-27T19:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes falou sobre diversos temas em abertura de um congresso trabalhista, incluindo o consenso pelo fim da escala 6×1, o protagonismo do Supremo Tribunal Federal na pacificação social e outros assuntos como pejotização e uberização.", "titulo_pt": "Gilmar afirma que consenso pelo fim da escala 6×1 não deve ser minimizado, mas alerta para transição no fim do ano", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 292101, "titulo": "Nexus/Seta: Lula chega ao fim do mandato com 49% de aprovação e 47% de desaprovação", "url": "https://www.jota.info/executivo/nexus-seta-lula-chega-ao-fim-do-mandato-com-49-de-aprovacao-e-47-de-desaprovacao", "fonte_id": "jota", "data_pub": "2026-11-27T19:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A maioria dos brasileiros espera mudanças nas políticas do governo Lula e resultados rápidos. As principais preocupações dos cidadãos são saúde e segurança.", "titulo_pt": "Lula encerra mandato com 49% de aprovação e 47% de desaprovação; maioria busca mudanças e resultados rápidos", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [{"titulo": "STF: dino suspende emendas parlamentares de Flávio Bolsonaro", "sumario": "O ministro Flávio Dino, do Supremo Tribunal Federal (STF), suspendeu a execução de 14 emendas parlamentares de Flávio Bolsonaro ao Projeto de Lei Orçamentária Anual (PLOA) de 2027, que totalizam R$ 79,3 milhões. O ministro Dino pediu explicações ao Senado sobre a situação do parlamentar Flávio Bolsonaro, que tem emendas orçamentárias no valor total de R$ 79 milhões. O ministro Flávio Dino, do STF, determinou a suspensão imediata das emendas individuais do senador Flávio Bolsonaro ao PLOA de 2027.", "artigos": [{"id": 291844, "titulo": "STF: Dino suspende emendas parlamentares de Flávio Bolsonaro", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/stf-dino-suspende-emendas-parlamentares-de-flavio-bolsonaro", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-27T20:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino, do Supremo Tribunal Federal (STF), suspendeu a execução de 14 emendas parlamentares de Flávio Bolsonaro ao Projeto de Lei Orçamentária Anual (PLOA) de 2027, que totalizam R$ 79,3 milhões. A medida foi tomada para preservar a integridade do processo orçamentário.", "titulo_pt": "STF: dino suspende emendas parlamentares de Flávio Bolsonaro", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 292099, "titulo": "Dino suspende tramitação de emendas de autoria de Flávio Bolsonaro", "url": "https://www.jota.info/stf/do-supremo/dino-suspende-tramitacao-de-emendas-de-autoria-de-flavio-bolsonaro", "fonte_id": "jota", "data_pub": "2026-11-27T20:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Dino pediu explicações ao Senado sobre a situação do parlamentar Flávio Bolsonaro, que tem emendas orçamentárias no valor total de R$ 79 milhões.", "titulo_pt": "Dino suspende tramitação de emendas de autoria de Flávio Bolsonaro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 291862, "titulo": "Dino determina suspensão imediata das emendas individuais de Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/dino-determina-suspensao-imediata-das-emendas-individuais-de-flavio-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-27T19:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino, do STF, determinou a suspensão imediata das emendas individuais do senador Flávio Bolsonaro ao PLOA de 2027. A decisão foi tomada nesta sexta-feira (27).", "titulo_pt": "Flávio dino determina suspensão das emendas individuais de Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}]}], "mundo": [{"id": 291645, "titulo": "EU leaders split over budget spending and a US$49bn loan to Ukraine", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/28/2003868530", "fonte_id": "taipei_times", "data_pub": "2026-11-28T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os líderes da União Europeia discutiram sobre gastos do orçamento e sobre uma proposta de empréstimo de 49 bilhões de dólares para a Ucrânia, mas não chegaram a um consenso sobre essas questões.", "titulo_pt": "Líderes da ue divididos sobre gastos orçamentários e empréstimo de 49 bilhões de dólares para a Ucrânia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 291646, "titulo": "China tests landing tactics in drills", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/28/2003868536", "fonte_id": "taipei_times", "data_pub": "2026-11-28T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China realizou exercícios militares para testar táticas de pouso. Os detalhes específicos dos exercícios não foram fornecidos na fonte.", "titulo_pt": "China testa táticas de pouso em exercícios", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 291648, "titulo": "Taiwan to send 15 retired AT-3 jets to Paraguay", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/28/2003868538", "fonte_id": "taipei_times", "data_pub": "2026-11-28T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Taiwan planeja enviar 15 aviões AT-3 aposentados para Paraguai. Este é um acordo de cooperação militar entre as duas partes.", "titulo_pt": "Taiwan enviará 15 aviões AT-3 aposentados para paraguai", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 291649, "titulo": "Taiwan rules out office name change amid Lithuanian warning", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/28/2003868539", "fonte_id": "taipei_times", "data_pub": "2026-11-28T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Taiwan descartou a possibilidade de mudar o nome das suas delegações em protesto contra a pressão da China. A Lituânia alertou Taiwan sobre as consequências potenciais de tal mudança de nome.", "titulo_pt": "Taiwan descarta mudança de nome das suas delegações diante do alerta da lituânia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 292215, "titulo": "Spanish PM and rivals rally supporters in final pitch for votes", "url": "https://www.bbc.co.uk/news/articles/c8wy5p4gdnwvo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-27T21:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro espanhol Pedro Sánchez tenta desafiar as pesquisas de opinião, enquanto seus principais rivais acusam-no de não ser honesto e de traição.", "titulo_pt": "PM espanhol e rivais mobilizam apoio antes da votação", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 291990, "titulo": "EUA dizem que atingiram navio no Golfo de Omã que tentou furar bloqueio", "url": "https://www.cnnbrasil.com.br/internacional/eua-dizem-que-atingiram-navio-no-golfo-de-oma-que-tentou-furar-bloqueio/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-27T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Exército dos Estados Unidos afirmou que atingiu um navio no Golfo de Omã que não obedeceu às ordens da Marinha americana, que impede a passagem de navios que viajam para ou partem de portos iranianos na região.", "titulo_pt": "EUA dizem ter atingido navio no Golfo de Omã que desobedeceu ordens", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 292159, "titulo": "Russia’s Big Ambitions for A.I. Are Undercut by Constraints of War", "url": "https://www.nytimes.com/2026/11/27/world/europe/russia-ai-journey-conference.html", "fonte_id": "nyt_world", "data_pub": "2026-11-27T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades russas consideram a inteligência artificial uma solução para os problemas do país, mas o desenvolvimento tecnológico do país tem sido limitado.", "titulo_pt": "Grandes ambições da Rússia em inteligência artificial sófre restrições de guerra", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 292063, "titulo": "Sabotagem russa pode causar mortes em massa na Europa, diz relatório", "url": "https://www.dw.com/pt-br/sabotagem-russa-pode-causar-mortes-em-massa-na-europa-diz-relatório/a-80082606?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-27T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório do IISS afirma que a campanha de sabotagem russa não diminuiu o apoio à Ucrânia, mas alerta que um único ataque letal pode acarretar retaliações e testar a unidade europeia. Alemanha e Polônia são identificados como os principais alvos potenciais.", "titulo_pt": "Sobrada de sabotagem russa pode causar mortes em massa na Europa, diz relatório", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 292265, "titulo": "Philippines could be key player in US-China AI competition", "url": "https://www.scmp.com/opinion/asia-opinion/article/3375746/philippines-could-be-key-player-us-china-ai-competition", "fonte_id": "scmp", "data_pub": "2026-11-27T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, declarou que acaba de concluir o maior acordo comercial já realizado entre os dois países, que é justo para ambos. Ele também afirmou que está fortalecendo a aliança entre os Estados Unidos e as Filipinas, especialmente com o fechamento desse acordo.", "titulo_pt": "Filipinas poderiam ser jogador-chave na disputa de IA entre EUA e china", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 292154, "titulo": "Frente Amplio evoca el espíritu de 2023 para “volver a ganar” las generales", "url": "https://elpais.com/espana/elecciones-generales/2026-11-27/frente-amplio-evoca-el-espiritu-de-2023-para-volver-a-ganar-las-generales.html", "fonte_id": "elpais_america", "data_pub": "2026-11-27T21:27:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A coalizão de esquerda realiza uma festa para encerrar a campanha em Villaverde (Madrid), empurrada pelo impacto do debate de quinta-feira. O Frente Amplio busca reavivar o espírito de 2023 para 'vencer' nas eleições gerais.", "titulo_pt": "Frente Amplio evoca o espírito de 2023 para 'vencer' as gerais", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 292185, "titulo": "‘Abusive and insulting to Canadians’: campaign to oust US ambassador presented to parliament", "url": "https://www.theguardian.com/world/2026/nov/27/pete-hoekstra-canada-us-ambassador-petition", "fonte_id": "guardian_world", "data_pub": "2026-11-27T21:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um petição assinada por quase 290.000 canadenses solicitou que o governo de Mark Carney destitua Pete Hoekstra do cargo de embaixador dos Estados Unidos no Canadá. O pedido foi formalmente apresentado ao Parlamento canadense, refletindo as tensas relações entre os dois países.", "titulo_pt": "Abusivo e insultuoso para canadenses: campanha para destituir embaixador americano apresentada ao parlamento", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 291920, "titulo": "Hackers invadem plataforma em nuvem da Força Aérea dos EUA", "url": "https://www.poder360.com.br/poder-internacional/hackers-invadem-plataforma-em-nuvem-da-forca-aerea-dos-eua/", "fonte_id": "poder360", "data_pub": "2026-11-27T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Hackers invadiram uma plataforma em nuvem da Força Aérea dos Estados Unidos, o que pode comprometer informações sigilosas sobre operações táticas, efetivo e logística militar.", "titulo_pt": "Hackers invadem plataforma em nuvem da Força Aérea dos EUA", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 292155, "titulo": "Abascal cierra su campaña con una traca de insultos y descalificaciones contra Pedro Sánchez", "url": "https://elpais.com/espana/elecciones-generales/2026-11-27/abascal-cierra-su-campana-con-una-traca-de-insultos-y-descalificaciones-contra-pedro-sanchez.html", "fonte_id": "elpais_america", "data_pub": "2026-11-27T21:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Abascal encerrou sua campanha com insultos e desqualificações contra Pedro Sánchez em um evento lotado de 12.000 seguidores na Plaza de Toros de Valencia, comparando-se a Feijóo.", "titulo_pt": "Abascal encerra campanha com insultos e desqualificações contra Sánchez", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 292221, "titulo": "Ukraine submits Black Sea ceasefire offer, awaits Russian response", "url": "https://www.france24.com/en/europe/20261127-ukraine-submits-black-sea-ceasefire-offer-awaits-russian-response", "fonte_id": "france24", "data_pub": "2026-11-27T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ucrânia fez uma proposta de cessar-fogo no Mar Negro para facilitar as exportações de alimentos e passou os detalhes para aliados internacionais, segundo um oficial ucraniano sênior. A Ucrânia espera uma resposta de Moscou após ataques russos a dois navios estrangeiros de grãos perto do porto ucraniano de Odessa.", "titulo_pt": "Ucrânia apresenta proposta de cessar-fogo no mar negro para exportações de alimentos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 292266, "titulo": "Ukraine says it used laser weapon to shoot down Russian drone for first time", "url": "https://www.scmp.com/news/world/russia-central-asia/article/3376104/ukraine-says-it-used-laser-weapon-shoot-down-russian-drone-first-time", "fonte_id": "scmp", "data_pub": "2026-11-27T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ucrânia afirmou ter usado um sistema laser pela primeira vez para abater um dron jet-potenciado russo. Segundo informações divulgadas por um grupo de defesa estatal, um dron Geran russo foi interceptado e derrubado por um sistema laser.", "titulo_pt": "Ucrânia diz ter usado arma laser pela primeira vez para abater dron russo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 291900, "titulo": "Cresce risco de ‘evento com vítimas em massa’ por agressões russas na Europa, diz estudo", "url": "https://veja.abril.com.br/mundo/cresce-chance-de-evento-com-vitimas-em-massa-por-agressoes-russas-na-europa-diz-estudo/", "fonte_id": "veja", "data_pub": "2026-11-27T21:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo destaca o aumento do risco de um 'evento com vítimas em massa' devido às agressões russas na Europa. Países europeus relatam incursões de drones, ciberataques e incêndios, com o objetivo de enfraquecer o apoio da União Europeia à Ucrânia.", "titulo_pt": "Cresce risco de ‘evento com vítimas em massa’ por agressões russas na Europa, diz estudo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 291987, "titulo": "Petróleo registra primeiro ganho semanal no mês por temores sobre oferta", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/petroleo-registra-primeiro-ganho-semanal-no-mes-por-temores-sobre-oferta/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-27T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O petróleo Brent registrou uma baixa de 1,2% na sessão, mas conseguiu um aumento semanal de 3% devido a preocupações sobre a oferta no Oriente Médio.", "titulo_pt": "Petróleo registra primeiro ganho semanal no mês por temores sobre oferta no oriente médio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 292263, "titulo": "S&P cuts France outlook to negative", "url": "https://www.ft.com/content/4e16110a-9604-4455-8557-4edece5df01a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-27T21:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência de rating S&P cortou a perspectiva da França para negativa, afirmando que a instabilidade política dificultará o país em lidar com seu déficit público.", "titulo_pt": "S&P corta perspectiva da França para negativa", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 291847, "titulo": "Ações da Petrobras caem até 3% e pressionam Bolsa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/25/6568-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post468080", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações da Petrobras recuaram até 3% nesta sexta-feira, influenciadas pela queda do dólar e pela desvalorização do petróleo Brent no mercado internacional.", "titulo_pt": "Ações da Petrobras caem até 3% e pressionam Bolsa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 292005, "titulo": "EcoRodo "titulo_pt": "Vendas do Tesouro Direto registram melhor outubro da história", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 291849, "titulo": "Quem tem mais dinheiro consegue investir melhor?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/11/quem-tem-mais-dinheiro-consegue-investir-melhor.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Existe uma crença de que investidores com patrimônios elevados conseguem obter rentabilidades superiores às dos pequenos investidores. No entanto, a matéria questiona se ter mais dinheiro realmente significa conseguir fazer o dinheiro render mais.", "titulo_pt": "Quem tem mais dinheiro realmente investe melhor?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 292146, "titulo": "Siguió elevada la demanda privada de dólares en octubre y crecieron los envíos al exterior", "url": "https://www.lanacion.com.ar/economia/siguio-elevada-en-octubre-la-demanda-privada-de-dolares-y-crecieron-los-envios-al-exterior-nid27112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-27T20:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A demanda privada por dólares permaneceu alta em outubro, com compras superando US$3000 milhões. No entanto, o saldo positivo da conta corrente cambial, de US$2200 milhões, não foi afetado por essas compras.", "titulo_pt": "Manutenção alta da demanda privada por dólares em outubro e crescimento nos envios ao exterior", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 292066, "titulo": "Companhia aérea norueguesa vai à falência em meio à alta de combustíveis", "url": "https://www.dw.com/pt-br/companhia-aérea-norueguesa-vai-à-falência-em-meio-à-alta-de-combustíveis/a-80080661?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2 n) para ajudar a identificar pessoas que usam a plataforma para comprar e vender imagens e vídeos de abuso sexual de crianças.", "titulo_pt": "Binance faz parceria com IWF para identificar pagamentos de material de abuso infantil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 292084, "titulo": "El dólar se toma un respiro tras anotar su segundo mayor nivel de la historia y la Bolsa de Santiago cierra al alza", "url": "https://www.latercera.com/pulso/noticia/el-dolar-se-toma-un-respiro-tras-anotar-su-segundo-mayor-nivel-de-la-historia/", "fonte_id": "la_tercera", "data_pub": "2026-11-27T19:27:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O dólar registrou uma pequena queda, caindo para R$ 1,034, após três sessões consecutivas de aumento. A Bolsa de Santiago encerrou o dia em alta.", "titulo_pt": "Dólar respira após novo recorde e Bolsa de Santiago fecha em alta", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 291857, "titulo": "Famílias chinesas pagam dívidas e reduzem gastos com consumo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/familias-chinesas-pagam-dividas-e-reduzem-gastos-com-consumo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T18:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As famílias chinesas estão reduzindo suas dívidas no ritmo mais acelerado em décadas, o que reforça as preocupações com as pressões deflacionárias e a confiança dos consumidores na segunda maior economia do mundo.", "titulo_pt": "Famílias chinesas reduzem dívidas e pressionam a confiança do consumidor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 291370, "titulo": "Puma cierra una fábrica en La Rioja y concentra su producción en la Argentina", "url": "https://www.lanacion.com.ar/economia/negocios/puma-cierra-una-fabrica-en-la-rioja-y-concentra-su-produccion-en-la-argentina-nid27112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-27T17:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A empresa alemã Puma encerrará sua fábrica em Chamical e concentrará sua produção na planta do Parque Industrial de La Rioja, Argentina.", "titulo_pt": "Puma fecha fábrica em La Rioja e concentra produção na Argentina", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 290992, "titulo": "PIB da França recua pelo segundo trimestre seguido e país entra em recessão", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/pib-da-franca-recua-pelo-segundo-trimestre-seguido-e-pais-entra-em-recessao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A França entrou em recessão após o PIB recuar pelo segundo trimestre consecutivo, conforme informou o instituto Insee. O país enfrenta pressões para controlar os gastos e sanear as contas públicas.", "titulo_pt": "França entra em recessão após dois trimestres seguidos de recuo do PIB", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 291299, "titulo": "Axia vende R$ 2,1 bilhões de ISA Energia, surfando o rali Trabuco", "url": "https://braziljournal.com/axia-vende-r-2-1-bilhoes-de-isa-energia-surfando-o-rali-trabuco", "fonte_id": "brazil_journal", "data_pub": "2026-11-27T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Axia Energia vendeu R$ 2,1 bilhões em ações da ISA Energia em um block trade que envolveu 77 milhões de ações, a R$ 26,65 cada. A venda foi coordenada pela corretora do BTG Pactual e representou cerca de 10% do capital da companhia de transmissão.", "titulo_pt": "Axia vende R$ 2,1 bilhões de ações da ISA Energia em block trade", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 291647, "titulo":
