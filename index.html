": "2026-10-30T05:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Três décadas após a aprovação da lei de planejamento familiar, as escolhas reprodutivas continuam sendo influenciadas pela renda e pelo acesso à saúde.", "titulo_pt": "Planejamento familiar ainda é um direito desigual", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 234759, "titulo": "Electrocutions, disease and no pay: how workers risk exploitation in Europe’s datacentres", "url": "https://www.theguardian.com/global-development/2026/oct/30/electrocutions-disease-and-no-pay-how-workers-risk-exploitation-in-europes-datacentres", "fonte_id": "guardian_world", "data_pub": "2026-10-30T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores em centrais de dados na Europa enfrentam condições perigosas e temem ser demitidos se denunciarem problemas. Sandu*, um testeiro elétrico de 34 anos, relatou que era comum receber trabalhos extras no final do turno.", "titulo_pt": "Eletrocussões, doenças e sem pagamento: como trabalhadores correm riscos em centrais de dados na Europa", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 234850, "titulo": "On Europe's data center construction sites, workers are exploited amid climate of 'terror'", "url": "https://www.lemonde.fr/en/les-decodeurs/article/2026/10/30/on-europe-s-data-center-construction-sites-workers-are-exploited-amid-climate-of-terror_6767158_8.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-30T04:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma investigação de cinco meses, realizada pela Investigate Europe com parceiros em 9 países, incluindo 'Le Monde', revelou a multiplicação de práticas perigosas nos canteiros de construção de centrais de dados em vários países europeus.", "titulo_pt": "Nos canteiros de construção de centrais de dados da Europa, trabalhadores são explorados em clima de 'terror'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 235001, "titulo": "‘Why did it take 11 months?’: apology too late for some Tai Po fire survivors", "url": "https://www.scmp.com/news/hong-kong/society/article/3372622/why-did-it-take-11-months-apology-too-late-some-tai-po-fire-survivors", "fonte_id": "scmp", "data_pub": "2026-10-30T04:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Residentes da área afetada pelo incêndio em Tai Po criticaram a demora da compensação e apontaram a necessidade de reformas a longo prazo. Eles também questionaram se a renúncia da ministra de habitação Winnie Ho Wing-yin resolveria os problemas de falhas interdepartamentais.", "titulo_pt": "Por que levou 11 meses? Desculpas para sobreviventes do incêndio em Tai Po chegam tarde", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 233627, "titulo": "El sistema de salud argentino está muriendo. ¿Quiénes son los responsables? ¿Y las reformas estructurales?", "url": "https://www.lanacion.com.ar/opinion/el-sistema-de-salud-argentino-esta-muriendo-quienes-son-los-responsables-y-las-reformas-nid30102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T03:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O sistema de saúde argentino está em crise, com milhões de cidadãos precisando de respostas urgentes. Enquanto a política se concentra em ganhar eleições, a situação dos serviços de saúde continua a deteriorar-se.", "titulo_pt": "O sistema de saúde argentino está morrendo. Quem são os responsáveis? E as reformas estruturais?", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 233629, "titulo": "La desesperación de un productor que perdió casi todas sus ovejas por un ataque de perros", "url": "https://www.lanacion.com.ar/economia/campo/llore-grite-y-me-frustre-los-perros-atacaron-su-campo-y-perdio-casi-todas-sus-ovejas-nid29102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T03:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Marcelo Fraymuth registrou 22 ovelhas mortas em ataques de cães em San José, Misiones. Productores da região relatam que o problema se repete e pedem soluções.", "titulo_pt": "A desesperança de um produtor que perdeu quase todas suas ovelhas por ataques de cães", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 233631, "titulo": "Peronismo: los mismos de siempre", "url": "https://www.lanacion.com.ar/editoriales/peronismo-los-mismos-de-siempre-nid30102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T03:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Dirigentes do Partido Justicialista (PJ) confirmaram sua intenção de unidade, mas continuam resistindo a abandonar hábitos antigos da política e apresentam apenas um passado negativo como perspectiva.", "titulo_pt": "Peronismo: os mesmos de sempre", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 233461, "titulo": "Ex-funcionário de creche é acusado de cometer mais de 200 abusos em Sydney", "url": "https://www.metropoles.com/mundo/ex-funcionario-de-creche-e-acusado-de-cometer-mais-de-200-abusos-em-sydney", "fonte_id": "metropoles", "data_pub": "2026-10-30T02:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ex-funcionário de creche em Sydney é acusado de mais de 200 abusos cometidos entre 2014 e 2017.", "titulo_pt": "Ex-funcionário de creche é acusado de cometer mais de 200 abusos em Sydney", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 233641, "titulo": "Con cambios de último momento, el Senado debate la reforma a la ley de salud mental", "url": "https://www.lanacion.com.ar/politica/con-cambios-de-ultimo-momento-el-senado-debate-la-reforma-a-la-ley-de-salud-mental-nid29102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T02:46:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto da reforma à lei de saúde mental sofreu alterações aceitas pelo governo para poder ser aprovado; a proibição de criação de manicomios e a internação como medida excepcional foram mantidas.", "titulo_pt": "Com mudanças de última hora, Senado debate reforma na lei de saúde mental", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 233402, "titulo": "Brincadeiras desafiadoras preparam crianças para situações de estresse", "url": "https://www.cnnbrasil.com.br/saude/brincadeiras-desafiadoras-preparam-criancas-para-situacoes-de-estresse/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T01:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que a exposição a desafios durante a infância fortalece o físico e o emocional das crianças, preparando-as para lidar com situações estressantes na vida adulta.", "titulo_pt": "Brincadeiras desafiadoras preparam crianças para situações de estresse", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 233469, "titulo": "Influencer “Barbeiro Mirim”, de 14 anos, é morto a tiros ao lado de amigo", "url": "https://www.metropoles.com/brasil/influencer-barbeiro-mirim-de-14-anos-e-morto-a-tiros-ao-lado-de-amigo", "fonte_id": "metropoles", "data_pub": "2026-10-30T01:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um influenciador conhecido como 'barbeiro mirim', de 14 anos, foi morto a tiros ao lado de um amigo. A Polícia Civil está investigando o caso.", "titulo_pt": "Influenciador 'Barbeiro Mirim', de 14 anos, é morto a tiros ao lado de amigo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 233471, "titulo": "Três torcedores do Santos são condenados a 21 anos por morte de palmeirense", "url": "https://www.metropoles.com/sao-paulo/tres-torcedores-do-santos-sao-condenados-a-21-anos-por-morte-de-palmeirense", "fonte_id": "metropoles", "data_pub": "2026-10-30T01:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Três torcedores do Santos Futebol Clube foram condenados a 21 anos de prisão pela morte de um torcedor do Palmeiras. Outros dois torcedores santistas já haviam sido condenados em 2025. A defesa lamenta a decisão e afirma que o processo está cheio de nulidades.", "titulo_pt": "Três torcedores do Santos são condenados a 21 anos por morte de palmeirense", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 233531, "titulo": "'Não há palavras pra descrever a dor': a mobilização de um vilarejo para ajudar vítimas de acidente de trem na Espanha", "url": "https://www.bbc.com/portuguese/articles/cmdxwpr40zjzo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-30T00:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um acidente de trem na Espanha resultou em pelo menos 74 mortos e dezenas de feridos. Moradores de Urda, um pequeno vilarejo com cerca de 2.500 habitantes, se mobilizaram para auxiliar as vítimas.", "titulo_pt": "Não há palavras para descrever a dor: mobilização de um vilarejo para ajudar vítimas de acidente de trem na Espanha", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 233477, "titulo": "FPF proíbe ida de torcida organizada do Corinthians a estádios até 2027", "url": "https://www.metropoles.com/sao-paulo/fpf-proibe-ida-de-torcida-organizada-do-corinthians-a-estadios-ate-2027", "fonte_id": "metropoles", "data_pub": "2026-10-30T00:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Federação Paulista de Futebol (FPF) proibiu a Torcida Jovem Camisa 12 do Corinthians de entrar em estádios até o fim de 2026. A medida foi acatada em resposta a um pedido do Ministério Público de São Paulo (MPSP).", "titulo_pt": "FPF proíbe ida de torcida organizada do Corinthians a estádios até 2027", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 234598, "titulo": "Novo foco de doença em aves em SC. O risco agora são os vizinhos", "url": "https://braziljournal.com/novo-foco-de-doenca-em-aves-em-sc-o-risco-agora-sao-os-vizinhos", "fonte_id": "brazil_journal", "data_pub": "2026-10-30T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A produção de aves no Brasil está em alerta máximo após a confirmação do terceiro foco da doença de Newcastle em uma granja comercial de perus em Nova Erechim, Santa Catarina, na terça-feira.", "titulo_pt": "Novo foco de doença em aves em santa catarina aumenta risco", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 234942, "titulo": "How drought and oil expansion are eroding livelihoods in Iraq's Hawizeh Marshes", "url": "https://www.middleeasteye.net/news/how-drought-and-oil-expansion-are-eroding-livelihoods-iraqs-hawizeh-marshes", "fonte_id": "middle_east_eye", "data_pub": "2026-10-30T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A seca e a expansão da extração de óleo estão destruindo o meio ambiente nos pântanos de Hawizeh, no Iraque, afetando a vida dos moradores que dependem daquele ecossistema frágil. A Unesco protege oficialmente os pântanos, mas a situação dos residentes está se deteriorando.", "titulo_pt": "Como a seca e a expansão do óleo estão destruindo a vida nos pântanos de Hawizeh, no iraque", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 234637, "titulo": "Clima: sexta-feira tem alertas de temporais e calorão pelo Brasil", "url": "https://www.metropoles.com/brasil/clima-sexta-feira-tem-alertas-de-temporais-e-calorao-pelo-brasil", "fonte_id": "metropoles", "data_pub": "2026-10-30T08:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O avanço de uma frente fria sobre o centro-sul do Brasil favorece a formação de nuvens carregadas, resultando em pancadas de chuvas volumosas. Alertas de temporais e calorão serão emitidos para esta sexta-feira.", "titulo_pt": "Clima: sexta-feira terá alertas de temporais e calorão pelo Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 234896, "titulo": "Smoke from wildfires killed 3,500 people in Indonesia in September: Report", "url": "https://www.aljazeera.com/news/2026/10/30/smoke-from-wildfires-killed-3500-people-in-indonesia-in-september-report?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-30T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatório indica que 3.500 pessoas morreram devido a fumaça proveniente de incêndios florestais em setembro na Indonésia. As chamas, causadas por secas prolongadas, cobriram a região com fuligem.", "titulo_pt": "Fumaça de incêndios florestais matou 3.500 pessoas na indonésia em setembro, relatório aponta", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 234879, "titulo": "DR Congo: MSF celebrates Ebola patient discharges in Ituri province", "url": "https://www.euronews.com/video/2026/10/30/dr-congo-msf-celebrates-ebola-patient-discharges-in-ituri-province", "fonte_id": "euronews", "data_pub": "2026-10-30T07:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Danzas e cantos eclodiram em um centro de tratamento de Ebola na República Democrática do Congo quando os últimos pacientes foram liberados. É a primeira vez desde maio que o centro administrado pela MSF não tem casos confirmados em tratamento, apesar da epidemia continuar em escala maior.", "titulo_pt": "República democrática do Congo: MSF comemora saídas de pacientes de Ebola na província de Ituri", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 234581, "titulo": "Cinco regiões de corais no Brasil estão em estado crítico e correm risco de colapso", "url": "https://www.cnnbrasil.com.br/ciencia/cinco-regioes-de-corais-no-brasil-estao-em-estado-critico-e-correm-risco-de-colapso/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T06:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cinco regiões de corais no Brasil estão em estado crítico e correm risco de colapso devido a poluição marinha, atividades de navegação e mudanças climáticas. A exploração de petróleo e gás também contribuem para o branqueamento dos corais.", "titulo_pt": "Cinco regiões de corais no Brasil estão em estado crítico e correm risco de colapso", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 234963, "titulo": "Fire pollution killed 3,560 people in Indonesia in September, report says", "url": "https://www.japantimes.co.jp/news/2026/10/30/asia-pacific/science-health/indonesia-wildfire-toll/", "fonte_id": "japan_times", "data_pub": "2026-10-30T06:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório indica que 3.560 pessoas morreram devido à poluição de fumaça em setembro na Indonésia. Cerca de 57,8 milhões de pessoas nesse mesmo mês estavam expostas a ar considerado inadequado ou perigoso.", "titulo_pt": "Incêndios causaram a morte de 3.560 pessoas na indonésia em setembro, relatório diz", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 234995, "titulo": "Indonesia’s wildfire smoke crisis claims over 3,500 lives in September", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3372692/indonesias-wildfire-smoke-crisis-claims-over-3500-lives-september", "fonte_id": "scmp", "data_pub": "2026-10-30T06:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo indica que cerca de 3.560 mortes no arquipélago indonésio em setembro foram causadas pela poluição resultante de fumos emitidos por incêndios florestais que duraram meses. Cerca de 57,8 milhões de pessoas na Indonésia estavam expostas a ar nocivo ou perigoso no mesmo mês, de acordo com a CREA, um think tank baseado em Helsinhigi.", "titulo_pt": "Crise de fumaça de incêndios florestais na indonésia causa mais de 3.500 mortes em setembro", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 233628, "titulo": "Informe oficial: ya se evacuaron 147.500 vacunos y búfalos de las zonas inundadas del Litoral", "url": "https://www.lanacion.com.ar/economia/campo/informe-oficial-ya-se-evacuaron-147500-bovinos-y-bufalos-de-las-zonas-inundadas-del-litoral-nid29102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T03:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Serviço Nacional de Sanidade e Qualidade Agroalimentar (Senasa) informa que 147.500 animais de rebanho já foram evacuados das áreas afetadas pela inundação no Litoral. A quantidade de animais transferidos desde agosto aumentou 102% em comparação com o mesmo período de 2025.", "titulo_pt": "Relatório oficial: 147.500 animais foram evacuados das áreas inundadas no Litoral", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 234026, "titulo": "Indonesia rain set to ease toxic haze in Singapore and Malaysia", "url": "https://www.japantimes.co.jp/news/2026/10/30/asia-pacific/science-health/indonesia-haze-rain/", "fonte_id": "japan_times", "data_pub": "2026-10-30T02:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A neblina tóxica causada pelas chamas da pior temporada de incêndios na história da Indonésia tem coberto cidades locais e se espalhado para países vizinhos durante semanas. A chuva prevista deve aliviar essa situação.", "titulo_pt": "Chuva deve amenizar neblina tóxica causada por incêndios na indonésia em singapura e malásia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 233708, "titulo": "El Niño-driven drought in Papua New Guinea a ‘national crisis’ as rivers dry up and local farms fail", "url": "https://www.theguardian.com/world/2026/oct/30/png-el-nino-drought-papua-new-guinea", "fonte_id": "guardian_world", "data_pub": "2026-10-30T01:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um histórico fenômeno El Niño está causando uma severa escassez de alimentos, água e energia elétrica, afetando até 8 milhões de pessoas em Papua Nova Guiné. O país está enfrentando uma crise nacional devido à seca extrema, com encerramentos de clínicas de saúde e interrupções no ensino.", "titulo_pt": "Seca provocada pelo el niño em Papua nova Guiné se torna uma ‘crise nacional’", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 233408, "titulo": "Equipe bate recorde ao capturar mais de 300 peixes-leão em Noronha", "url": "https://www.cnnbrasil.com.br/nacional/nordeste/pe/equipe-bate-recorde-ao-capturar-mais-de-300-peixes-leao-em-noronha/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T01:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma equipe capturou mais de 300 peixes-leão em Fernando de Noronha durante uma operação para conter a espécie invasora que ameaça o ecossistema local.", "titulo_pt": "Equipe bate recorde ao capturar mais de 300 peixes-leão em Noronha", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 234360, "titulo": "Experts: What China wants from the COP31 climate talks", "url": "https://www.carbonbrief.org/experts-what-china-wants-from-the-cop31-climate-talks", "fonte_id": "carbon_brief", "data_pub": "2026-10-29T14:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A COP31, uma conferência climática que está prestes a ocorrer na Turquia, está recebendo atenção especial da China, que está sendo observada para saber quais são suas prioridades nessa discussão climática.", "titulo_pt": "Expertos: o que a China deseja alcançar nas negociações climáticas da COP31", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 233968, "titulo": "Spain: cranes clear twisted train wreckage as rescuers work through the night", "url": "https://www.euronews.com/video/2026/10/29/spain-cranes-clear-twisted-train-wreckage-as-rescuers-work-through-the-night", "fonte_id": "euronews", "data_pub": "2026-10-29T10:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Equipes de resgate trabalharam durante a noite no local de um acidente ferroviário perto de Toledo, onde 68 pessoas morreram. Grues continuaram removendo os destroços enquanto autoridades estabeleceram um necrotério temporário para identificar as vítimas.", "titulo_pt": "Espanha: gruas removem destroços de trens enquanto equipes de resgate trabalham à noite", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 232615, "titulo": "Clima: temporais atingem Centro-Oeste e Sudeste nesta quinta (29/10)", "url": "https://www.metropoles.com/brasil/clima-temporais-atingem-centro-oeste-e-sudeste-nesta-quinta-29-10", "fonte_id": "metropoles", "data_pub": "2026-10-29T09:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Temporais atingem o Centro-Oeste e o Sudeste, com pancadas fortes e trovoadas previstas para Goiás, Mato Grosso, São Paulo e Minas Gerais. No interior do Nordeste, as temperaturas podem chegar a 39ºC.", "titulo_pt": "Clima: temporais atingem Centro-Oeste e Sudeste nesta quinta (29/10)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 232761, "titulo": "Guías para un clima que ya cambió", "url": "https://www.latercera.com/opinion/noticia/guias-para-un-clima-que-ya-cambio/", "fonte_id": "la_tercera", "data_pub": "2026-10-29T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute orientações para lidar com um clima que já se transformou. Aborda medidas e estratégias adaptativas já que as condições climáticas mudaram.", "titulo_pt": "Guias para um clima que já mudou", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 234776, "titulo": "Por qué la cifra de muertos en el terremoto de Venezuela podría ser mayor de la que declara su gobierno", "url": "https://www.latercera.com/tendencias/noticia/por-que-la-cifra-de-muertos-en-el-terremoto-de-venezuela-podria-ser-mayor-de-la-que-declara-su-gobierno/", "fonte_id": "la_tercera", "data_pub": "2026-10-30T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo do Serviço Geológico dos Estados Unidos, uma análise de prédios derrubados e registros não oficiais de desaparecidos indicam que o número de mortos relatado pelo governo venezuelano pode ser inferior ao real.", "titulo_pt": "Por que o número de mortos no terremoto da Venezuela poderia ser maior do que o declarado pelo governo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 234895, "titulo": "Sudan investigation maps commanders linked to wartime rape", "url": "https://www.aljazeera.com/features/2026/10/30/sudan-investigation-maps-commanders-linked-wartime-rape?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-30T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um departamento de investigação identificou 25 comandantes presentes em cinco locais durante períodos relatados de violência sexual.", "titulo_pt": "Investigação identifica comandantes ligados a estupro durante guerra no sudão", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 234899, "titulo": "‘My life is buried here’: Iranian man whose 12 family members were killed", "url": "https://www.aljazeera.com/news/2026/10/30/my-life-is-buried-here-iranian-man-whose-12-family-members-were-killed?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-30T07:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hamed Mirzaei perdeu sua esposa, pais e outros 10 membros da família em um ataque devastador realizado por Estados Unidos e Israel em Teerã.", "titulo_pt": "Minha vida está enterrada aqui: homem iraniano que perdeu 12 parentes em ataque dos EUA e israel", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 234948, "titulo": "Palestinians call out ‘engineered famine’ in Gaza", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/palestinians-call-out-engineered-famine-gaza", "fonte_id": "middle_east_eye", "data_pub": "2026-10-30T05:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Palestinos em Gaza acusam forças de ocupação israelenses e comerciantes de causar uma 'fome engenhosamente criada' ao permitirem apenas o ingresso e a venda de produtos insalubres como doces e refrigerantes, em detrimento de alimentos saudáveis como vegetais, frango e farinha. Segundo relatos, isso resulta em uma política de fome, similar à primeira fome, com o objetivo de fazer com que os habitantes se confrontem entre si.", "titulo_pt": "Palestinos denunciam 'fome engenhosamente criada' em Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 234802, "titulo": "Rights Groups Links Cambodian Security Companies to Scam Compounds", "url": "https://thediplomat.com/2026/10/rights-groups-links-cambodian-security-companies-to-scam-compounds/", "fonte_id": "the_diplomat", "data_pub": "2026-10-30T04:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova relatório da Amnesty Internacional afirma que muitos facilitadores cambodianos da indústria de golpes ainda estão livres. Esses facilitadores estão ligados à indústria de compêndios de golpes no país.", "titulo_pt": "Grupos de direitos ligam empresas de segurança cambojanas a compêndios de golpes", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 234123, "titulo": "Anti-transnational repression law debated amid alleged forced apology", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/30/2003866868", "fonte_id": "taipei_times", "data_pub": "2026-10-30T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A lei antirrepresão transnacional está sendo debatida, e há relatos de supostas forçadas a se desculpar.", "titulo_pt": "Lei antirrepresão transnacional debatida em meio a relatos de forçadas a se desculpar", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 234069, "titulo": "Anti-Muslim provocation could deter community from US midterm elections, advocacy group says", "url": "https://www.middleeasteye.net/news/anti-muslim-provocation-could-deter-community-us-midterm-elections-advocacy-group", "fonte_id": "middle_east_eye", "data_pub": "2026-10-29T21:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Muslim Public Affairs Council expressa preocupação com a escalada de provocações antimusulmanas, que poderiam dissuadir a comunidade muçulmana de votar nas eleições médias dos Estados Unidos. A organização também menciona as afirmações infundadas de Trump e seus aliados sobre possíveis fraudes nas estações de votação.", "titulo_pt": "Provações antimusulmanas podem dissuadir comunidade muçulmana nas eleições médias americanas, diz grupo de advocacy", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 233454, "titulo": "Jafar Panahi, indicado ao Oscar, é condenado a cinco anos de prisão no Irã", "url": "https://exame.com/pop/jafar-panahi-indicado-ao-oscar-e-condenado-a-cinco-anos-de-prisao-no-ira/", "fonte_id": "exame", "data_pub": "2026-10-29T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cineasta iraniano Jafar Panahi foi condenado a cinco anos de prisão e proibido de viajar e usar redes sociais por dois anos. Sua defesa afirma que ele não foi informado sobre as audiências do processo.", "titulo_pt": "Jafar Panahi, indicado ao Oscar, é condenado a cinco anos de prisão no Irã", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 234347, "titulo": "'A trip to the market should never cost a child their life'", "url": "https://www.unicef.org/press-releases/trip-market-should-never-cost-child-their-life", "fonte_id": "unicef", "data_pub": "2026-10-29T13:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Etleva Kadilli, diretora regional do UNICEF para a África Oriental e Austral, fez uma declaração sobre a segurança dos crianças durante as compras no mercado. Ela enfatizou que as viagens ao mercado não devem custar a vida de uma criança.", "titulo_pt": "Viagem ao mercado não deve custar a vida de uma criança", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 232931, "titulo": "North Koreans being recruited into forced labour in Russia, report says", "url": "https://www.aljazeera.com/economy/2026/10/29/north-koreans-being-recruited-into-forced-labour-in-russia-report-says?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-29T08:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Global Rights Compliance afirma que uma rede de broqueiros russos está recrutando trabalhadores norte-coreanos usando vistos de estudante. Os norte-coreanos seriam empregados em trabalho forçado na Rússia.", "titulo_pt": "Norte-coreanos estariam sendo recrutados para trabalho forçado na Rússia, relata", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 232626, "titulo": "Ativista canadense que resgatava animais morre em bombardeio na Ucrânia", "url": "https://www.metropoles.com/mundo/ativista-canadense-que-resgatava-animais-morre-em-bombardeio-na-ucrania", "fonte_id": "metropoles", "data_pub": "2026-10-29T08:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jesse Adams, um ativista canadense que trabalhava voluntariamente resgatando animais nas zonas de conflito na Ucrânia, morreu em um bombardeio.", "titulo_pt": "Ativista canadense que resgatava animais morre em bombardeio na Ucrânia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 232973, "titulo": "Politician ordered to pay ¥1.1 million for outing author as transgender", "url": "https://www.japantimes.co.jp/news/2026/10/29/japan/crime-legal/transgender-outing-rulinig/", "fonte_id": "japan_times", "data_pub": "2026-10-29T08:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal de Tóquio determinou que o político deve pagar 1,1 milhão de ienes por revelar sem consentimento o gênero atribuído ao nascimento da autora, considerando que isso foi uma invasão ilegal da privacidade.", "titulo_pt": "Político ordenado a pagar 1,1 milhão de ienes por revelar gênero da autora sem consentimento", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 233071, "titulo": "(LEAD) Seoul mulling co-sponsoring U.N. resolution on N. Korean human rights", "url": "https://en.yna.co.kr/view/AEN20261029007251315", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T07:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Unificação está em conversas com entidades relevantes sobre a possibilidade de cosancionar uma resolução da ONU sobre os direitos humanos na Coreia do Norte.", "titulo_pt": "Seul considera cosancionar resolução da ONU sobre direitos humanos na Coreia do norte", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 232814, "titulo": "Cambodian police and soldiers helped guard abusive scam compounds, Amnesty alleges", "url": "https://www.theguardian.com/world/2026/oct/29/cambodian-police-scam-compounds-amnesty-international", "fonte_id": "guardian_world", "data_pub": "2026-10-29T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Segundo um relatório da Amnesty Internacional, sobreviventes relataram que policiais e soldados servidores trabalharam como guardas em compêndios de estelionato onde milhares eram forçados a trabalhar na indústria de fraudes online. Os guardas teriam usado choques elétricos e espancamentos para manter as pessoas presas.", "titulo_pt": "Polícias e militares ajudaram a proteger compêndios de estelionato abusivos, acusa Amnesty", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 233059, "titulo": "Hong Kong teen jailed for 8 years for acid attack on Singaporean tourist", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3372525/hong-kong-teen-jailed-8-years-acid-attack-singaporean-tourist", "fonte_id": "scmp", "data_pub": "2026-10-29T04:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um adolescente com ligações a trios foi condenado a 8 anos de prisão por atacar uma turista de Singapura com líquido corrosivo em Hong Kong, em junho de 2025. A vítima, uma mulher de 36 anos, sofreu queimaduras de segundo grau e o ataque teve um impacto permanente em sua vida.", "titulo_pt": "Jovem de hong Kong condenado a 8 anos por ataque ácido a turista de singapura", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 232893, "titulo": "Ten years after the Calais 'jungle' was dismantled, migrants still wait in makeshift camps hoping to reach Britain", "url": "https://www.lemonde.fr/en/france/article/2026/10/29/ten-years-after-the-calais-jungle-was-dismantled-migrants-still-wait-in-makeshift-camps-in-hopes-of-reaching-britain_6766564_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-29T02:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde o desmantelamento, em 2016, da 'jungle' de Calais, que era então a maior área de acampamentos precários da Europa, pequenos acampamentos improvisados surgiram ao longo da costa norte da França, onde as organizações de ajuda relatam condições de vida insalubres. Migrantes continuam a esperar nestes acampamentos, esperando chegar ao Reino Unido.", "titulo_pt": "Dez anos após a 'jungle' de Calais ser desmantelada, migrantes ainda aguardam em acampamentos improvisados na costa francesa, esperando chegar ao reino unido", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 234981, "fonte_id": "scmp", "titulo": "What’s the true worth behind Chinese phrase ‘carrying 10,000 strings of cash around the waist’", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3372732/whats-true-worth-behind-chinese-phrase-carrying-10000-strings-ca let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);

              }).join("")}
            </div>

        }).join("")}
      </div>`

           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')

    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));

    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

  return "8h";
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {

  _fUrl = btn.dataset.url;

  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
