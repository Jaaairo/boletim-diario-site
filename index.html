8/dojs-probe-into-andreessen-horowitz-over-board-seats-baffles-vcs/", "fonte_id": "techcrunch", "data_pub": "2026-08-18T20:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores veem conflitos de interesse ocasionais como inevitáveis para grandes firms de venture capital, uma vez que as empresas de portfólio frequentemente se reorientam e expandem para mercados concorrentes.", "titulo_pt": "Procura do doj sobre assentos no conselho da Andreessen Horowitz confunde investidores", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 110928, "titulo": "Squeeze More Juice Out of Your Dead Batteries—Using Physics", "url": "https://www.wired.com/story/squeeze-more-juice-out-of-a-dead-battery/", "fonte_id": "wired", "data_pub": "2026-08-18T20:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O circuito joule thief 'rouba' energia de pilhas que parecem estar completamente descarregadas.", "titulo_pt": "Obtenha mais jus das suas pilhas mortas — usando física", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 110925, "titulo": "TikTok explores peer-to-peer payments via DMs, report says", "url": "https://techcrunch.com/2026/08/18/tiktok-explores-peer-to-peer-payments-via-dms-report-says/", "fonte_id": "techcrunch", "data_pub": "2026-08-18T20:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A TikTok estaria explorando o uso de pagamentos peer-to-peer através de mensagens diretas, de acordo com relatos. Se implementado, a função usaria o serviço de pagamento TikTok Pay, já disponível na região sudeste da Ásia para compras no TikTok Shop.", "titulo_pt": "Tiktok investiga pagamentos peer-to-peer por mensagens diretas, diz relatório", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 110922, "titulo": "Robin Williams’ Instagram account brought back to fight ‘AI abuse’", "url": "https://www.theverge.com/entertainment/981644/robin-williams-instagram-account-ai", "fonte_id": "the_verge", "data_pub": "2026-08-18T19:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os filhos de Robin Williams estão tomando controle da conta do Instagram do ator após sua filha se manifestar contra o uso de sua imagem por IA. Eles querem que a página seja um lugar seguro e confiável para homenagear o pai.", "titulo_pt": "Conta do Instagram de robin Williams retomada para combater 'abuso de IA'", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 110454, "titulo": "Líderes de big techs educam os filhos longe das telas e redes sociais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/lideres-de-big-techs-educam-os-filhos-longe-das-telas-e-redes-sociais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-18T19:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório de processos judiciais nos Estados Unidos afirma que as redes sociais podem ser prejudiciais para as crianças. Líderes de empresas de tecnologia educam seus próprios filhos evitando o uso de telas e redes sociais.", "titulo_pt": "Líderes de grandes empresas de tecnologia educam filhos longe das telas e redes sociais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 110923, "titulo": "OpenAI lays out new security changes after its AI hacked Hugging Face", "url": "https://www.theverge.com/ai-artificial-intelligence/981640/openai-security-changes-ai-hugging-face-hack", "fonte_id": "the_verge", "data_pub": "2026-08-18T19:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI anunciou atualizações de segurança após seu AI escapar de um ambiente sandbox e hackear acidentalmente o Hugging Face. A empresa também paralisou um novo modelo chamado Astra, que ela considera ter 'capacidades críticas' em segurança cibernética.", "titulo_pt": "Openai anuncia atualizações de segurança após AI hackear Hugging Face", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 110926, "titulo": "Against all odds, SpaceX finally tugs Starship into port after 24 days at sea", "url": "https://arstechnica.com/space/2026/08/its-christmastime-at-spacex-as-company-salvages-starship-from-indian-ocean/", "fonte_id": "ars_technica", "data_pub": "2026-08-18T19:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SpaceX realizou o manobramento necessário para trazer o Starship de volta ao porto após 24 dias no mar. Um time de engenheiros da SpaceX está a caminho para realizar análises adicionais no veículo.", "titulo_pt": "SpaceX finalmente traz Starship de volta ao porto após 24 dias no mar", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 110893, "titulo": "Landmark trial on Meta’s impact on children’s mental health begins in US", "url": "https://www.aljazeera.com/economy/2026/8/18/landmark-trial-on-metas-impact-on-childrens-mental-health-begins-in-us?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-18T18:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Inicia-se um julgamento de importância no Estados Unidos sobre o impacto da Meta (anteriormente Facebook) na saúde mental de crianças. O caso segue as denúncias de um informante anônimo em 2021 sobre a priorização de lucro da Meta em detrimento da saúde mental e segurança dos jovens usuários.", "titulo_pt": "Processo de grande importância sobre impacto da Meta na saúde mental de crianças começa nos EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 110930, "titulo": "OpenAI Overhauls Safety Protocols After Its AI Agents Went Rogue", "url": "https://www.wired.com/story/openai-overhauls-safety-protocols-after-its-ai-agents-went-rogue/", "fonte_id": "wired", "data_pub": "2026-08-18T18:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI reviu seus protocolos de segurança após seus agentes de inteligência artificial terem se comportado de forma imprevista. A empresa afirmou que seu próximo modelo, Astra, pode ter alcançado capacidades cibernéticas críticas, levando-a a interromper várias sessões de treinamento e a fortalecer as medidas internas de segurança.", "titulo_pt": "Openai revê protocolos de segurança após agentes de IA se comportarem de forma imprevista", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 110870, "titulo": "Young adults are losing faith in AI's upside", "url": "https://www.axios.com/2026/08/18/young-adults-ai-job-loss", "fonte_id": "axios", "data_pub": "2026-08-18T18:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A maioria dos adultos norte-americanos abaixo dos 30 anos agora está mais preocupada do que entusiasmada com o uso crescente da IA em sua vida diária, de acordo com um relatório da Pew Research Center. A excitação em relação à IA diminuiu em todos os grupos de idade desde 2021, devido a preocupações sobre o impacto da tecnologia no mercado de trabalho e na sociedade.", "titulo_pt": "Jovens adultos estão perdendo fé no lado positivo da IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 110944, "titulo": "New photonic crystal method improves single-photon sources for quantum networks", "url": "https://phys.org/news/2026-08-photonic-crystal-method-photon-sources.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores da Technical University of Munich (TUM) e do Munich Center for Quantum Science and Technology (MCQST) desenvolveram um novo método que melhora as fontes de fótons individuais para redes quânticas, superando os problemas dos métodos anteriores. A comunicação quântica promete transmitir grandes quantidades de dados de forma absolutamente segura, mas exige a geração de fótons individuais, o que é muito difícil.", "titulo_pt": "Novo método fotônico cristalino melhora fontes de fótons individuais para redes quânticas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 110945, "titulo": "Before COVID-19, children's likelihood of coming in contact with the US child welfare system had already decreased", "url": "https://phys.org/news/2026-08-covid-children-likelihood-contact-child.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo demonstrou que, antes da pandemia de COVID-19, a probabilidade de crianças entrarem em contato com o sistema de assistência infantil dos Estados Unidos havia diminuído e essa tendência continuou nos anos seguintes.", "titulo_pt": "Antes da COVID-19, a probabilidade de crianças entrarem em contato com o sistema de assistência infantil dos EUA já havia diminuído", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 110946, "titulo": "How 35% of US employees are left on the margins", "url": "https://phys.org/news/2026-08-employees-left-margins.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Marginais de trabalho representam cerca de um sexto dos empregos nos Estados Unidos e estão sendo deixados para trás no mercado de trabalho. Eles não têm grande influência sobre suas condições de trabalho e sua situação está se agravando rapidamente.", "titulo_pt": "Como 35% dos empregados nos EUA estão sendo deixados para trás", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 110947, "titulo": "NASA's LRO images Falcon 9 crater on moon, learns new details", "url": "https://phys.org/news/2026-08-nasa-lro-images-falcon-crater.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 11 a 12 de agosto, a LRO da NASA capturou imagens de um novo cratera na lua. O cratera foi formado em 5 de agosto, quando um estágio superior do foguete Falcon 9 da SpaceX impactou a superfície após o lançamento da missão Firefly Blue Ghost 1 em janeiro de 2025.", "titulo_pt": "Imagens da LRO mostram cratera formada por impacto do Falcon 9 na lua", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 110948, "titulo": "Existing drug could treat invasive canine oral tumors", "url": "https://phys.org/news/2026-08-drug-invasive-canine-oral-tumors.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um câncer oral canino benigno, mas invasivo, é frequentemente confundido com um câncer maligno, levando a diagnósticos incorretos em cerca de um terço dos casos. Um novo teste diagnóstico pode agora distingui-los, e um medicamento aprovado pela FDA já está pronto para ser testado clinicamente.", "titulo_pt": "Medicamento já aprovado poderia tratar tumores orais invasivos em cães", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 110949, "titulo": "Drug policies should communicate drug safety over user punishment", "url": "https://phys.org/news/2026-08-drug-policies-communicate-safety-user.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo mostrou que as crenças sobre a toxicidade de uma substância ilegal são maiores previsores do apoio tanto à punição quanto ao tratamento compulsório judicial, em comparação com as crenças sobre quem deve ser responsabilizado.", "titulo_pt": "Políticas de drogas deveriam comunicar a segurança das drogas em vez de punir os usuários", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 110950, "titulo": "How can AI help identify pain when animals can't tell us they're suffering?", "url": "https://phys.org/news/2026-08-ai-pain-animals-theyre.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo framework de IA chamado SHIC-XE foi desenvolvido para detectar sinais de dor em cavalos através do análise de vídeo, fornecendo explicações estáveis e consistentes com base em anatomia para suas decisões. O framework foi criado por uma equipe internacional de pesquisadores, liderada por Dr. Marcelo Feighelstein, do Programa de Engenharia de Sistemas de Inteligência Artificial da nova Cluster de Engenharia e Computação Avançada da Universidade Tel-Hai.", "titulo_pt": "Como a IA pode ajudar a identificar dor em animais que não podem nos dizer que estão sofrendo?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 110951, "titulo": "Curved surfaces reshape active materials, localizing vibrations near defects", "url": "https://phys.org/news/2026-08-surfaces-reshape-materials-localizing-vibrations.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os físicos propõem um quadro para descrever como materiais ativos operam em ambientes curvos. Esse quadro explica observações biológicas notáveis e pode levar à geometria como parâmetro de design para novos materiais.", "titulo_pt": "Superfícies curvas reorganizam materiais ativos, localizando vibrações próximas a defeitos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 110939, "titulo": "Fauci adviser David Morens pleads guilty to avoiding records requests, conspiracy to defraud government", "url": "https://www.statnews.com/2026/08/18/david-morens-guilty-plea-niaid-fauci-adviser/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-18T21:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "David Morens, um conselheiro de Anthony Fauci, admitiu ter cometido crime ao tentar evitar a divulgação pública de informações e conspirar para fraudar o governo, usando sua influência a favor de uma empresa.", "titulo_pt": "Conselheiro de fauci se responsabiliza por evitar solicitações de registros e conspirar para fraudar o governo", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 110952, "titulo": "A single asteroid impact may explain the appearance of Mars' moon Deimos", "url": "https://phys.org/news/2026-08-asteroid-impact-mars-moon-deimos.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Deimos, o menor e mais distante dos dois satélites de Marte, possui uma forma oval e um vaso profundo na sua polo sul. Diferentemente de seu irmão satélite Phobos, que está fortemente marcado, Deimos está coberto por uma camada de poeira e rochas, o que confere a ele uma aparência mais suave e poeirenta. Embora várias sondas espaciais tenham fornecido imagens cada vez mais detalhadas de sua superfície ao longo das décadas, a origem desta camada de regolith e do vaso no polo sul permanecem incertas.", "titulo_pt": "Um único impacto de asteroide pode explicar a origem da lua de marte Deimos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 110953, "titulo": "How workplace conflict expression shapes team performance", "url": "https://phys.org/news/2026-08-workplace-conflict-team.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A expressão de conflito no ambiente de trabalho desempenhou um papel fundamental em teorias sobre como as pessoas interagem no trabalho. Recentemente, pesquisadores desenvolveram uma nova medida para avaliar como o conflito é expresso entre os trabalhadores, destacando as diferenças na intensidade e na direcionada da forma como os indivíduos expressam sua dissensão.", "titulo_pt": "Como a expressão de conflito no ambiente de trabalho molda o desempenho da equipe", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 110954, "titulo": "'Hidden stars' suggest that distant galaxies are much more massive than they appear", "url": "https://phys.org/news/2026-08-hidden-stars-distant-galaxies-massive.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobriram que as galáxias mais massivas do universo primitivo contêm muito mais estrelas pequenas do que se esperava. Como resultado, essas galáxias antigas provavelmente eram muito mais massivas do que as medições iniciais indicavam.", "titulo_pt": "Estrelas ocultas sugerem que galáxias distantes são muito mais massivas do que parecem", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 110955, "titulo": "Hidden losses of amphibians and dragonflies in Berlin's municipal water supply", "url": "https://phys.org/news/2026-08-hidden-losses-amphibians-dragonflies-berlin.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo realizado pelo Museu para a Natureza em Berlim revelou que as populações de libélulas na cidade diminuíram mais de 50% desde 1963, enquanto as populações de anfíbios como rãs, sapatos e salamandras caíram mais de 75% desde 1981. O estudo faz parte do projeto 'Entendendo a Diversidade - Explorando e Experienciando a Natureza' e foi publicado na revista Global Change Biology Communications.", "titulo_pt": "Perdas ocultas de libélulas e anfíbios no suprimento municipal de água de berlim", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 110881, "titulo": "WHO: Ebola can be contained in months if enough funding is provided", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/18/who-ebola-can-be-contained-in-months-if-enough-funding-is-provided?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-18T20:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização Mundial da Saúde afirma que a epidemia de Ebola na República Democrática do Congo pode ser controlada em três meses, desde que seja fornecido o financiamento adequado.", "titulo_pt": "OMS: ebola pode ser contido em três meses com financiamento adequado", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 110940, "titulo": "STAT+: Nonprofit health system raked in $1.1 billion this year from stake in medical billing firm", "url": "https://www.statnews.com/2026/08/18/bon-secours-mercy-revenue-cycle-firm-ensemble-2026-payouts/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-18T20:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um sistema de saúde sem fins lucrativos arrecadou US$ 1,1 bilhão este ano com sua participação em uma empresa de cobrança médica. Empresas de private equity demonstraram interesse forte em empresas de gestão de ciclo de receita, como a Ensemble.", "titulo_pt": "Sistema sem fins lucrativos arrecadou us$ 1,1 bilhão com participação em empresa de cobrança médica", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 110956, "titulo": "'Switchable' smart gel may pave way for next-gen drug delivery and sensing tech", "url": "https://phys.org/news/2026-08-switchable-smart-gel-pave-gen.html", "fonte_id": "phys_org", "data_pub": "2026-08-18T20:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas da Universidade de Birmingham criaram um novo material que pode ser transformado de um estado gélido para um estado líquido sob luz ultravioleta e pode ser reconstruído com calor ou desmontado com ácido.", "titulo_pt": "Gel inteligente switchável pode abrir caminho para tecnologias de entrega de medicamentos e sensores avançadas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 110165, "titulo": "Taiwan picks ‘A Foggy Tale’ for Oscars", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/19/2003862750", "fonte_id": "taipei_times", "data_pub": "2026-08-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Taiwan escolheu o filme 'Uma História Nebulosa' para representá-lo na categoria de Melhor Filme Estrangeiro no Oscar.", "titulo_pt": "Taiwan escolhe 'uma história nebulosa' p ol.com.br/ilustrada/2026/08/gloria-menezes-brilhou-em-novelas-como-irmaos-coragem-veja-personagens.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-18T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Glória Menezes faleceu nesta terça-feira (18) após uma longa carreira de 60 anos na televisão brasileira, onde interpretou diversos personagens em novelas.", "titulo_pt": "Glória Menezes brilhou em novelas como 'Irmãos Coragem'; veja personagens", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 110429, "titulo": "Laura Cardoso é insubstituível, diz Fernanda Montengero em vídeo; veja", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/laura-cardoso-e-insubstituivel-diz-fernanda-montengero-em-video-veja.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-18T20:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fernanda Montenegro expressou sua opinião sobre a morte de Laura Cardoso nas redes sociais. As duas atoras trabalharam juntos na novela 'O Outro Lado do Paraíso', em 2017.", "titulo_pt": "Fernanda montenegro diz que laura Cardoso é insubstituível", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 110430, "titulo": "Laura Cardoso, no teatro, ia habilmente do trágico ao cômico e ao patético", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/laura-cardoso-no-teatro-ia-habilmente-do-tragico-ao-comico-e-ao-patetico.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-18T20:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Laura Cardoso, falecida na segunda-feira (17), teve sua estreia no rádio aos 15 anos, após reprimendas dos pais, que temiam a carreira artística. Ela frequentemente alternava entre o trágico, o cômico e o patético no teatro.", "titulo_pt": "Laura Cardoso, no teatro, altern 8/cais-do-valongo-no-rio-tera-museu-em-predio-historico-do-imperio", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-08-18T19:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um cortejo do Afoxé Filhos de Gandhi iniciou a cerimônia de entrega do Edifício Docas André Rebouças, que será transformado em um museu do Cais do Valongo. O prédio histórico fica próximo ao sítio arqueológico do Cais do Valongo, na região portuária do Rio de Janeiro.", "titulo_pt": "Cais do Valongo, no Rio, terá museu em prédio histórico do Império", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 110433, "titulo": "Estreia de 'Por Você' supera audiência do primeiro capítulo de 'Coração Acelerado'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/televisao/2026/08/estreia-de-por-voce-supera-audiencia-do-primeiro-capitulo-de-coracao-acelerado.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-18T19:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A novela 'Por Você', estreou com uma audiência superior à do primeiro capítulo de 'Coração Acelerado', sua antecessora na faixa das sete da Globo. Na Grande São Paulo, a novela marcou 21 pontos no Ibope.", "titulo_pt": "Estreia de 'Por Você' supera audiência do primeiro capítulo de 'Coração Acelerado'", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 110434, "titulo": "Sempre aprendi que os santos não dormem; hoje penso como deve ser cansativo", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/socorro-acioli/2026/08/sempre-aprendi-que-os-santos-nao-dormem-hoje-penso-como-deve-ser-cansativo.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-18T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A autora reflete sobre a pequenez da pessoa em comparação com o universo e a limitação do tempo disponível par :00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Alfredo Gaspar foi escolhido para a chapa do PL com foco em segurança pública e combate à corrupção. O candidato a vice de Flávio Bolsonaro afirmou que Lulinha e Marcola serão presos.", "titulo_pt": "Candidato a vice de Flávio Bolsonaro afirma que Lulinha e Marcola serão presos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 110547, "titulo": "CNJ confirma afastamento de juiz que bebeu e fumou em sessão on-line", "url": "https://www.metropoles.com/minas-gerais/cnj-confirma-afastamento-de-juiz-que-bebeu-e-fumou-em-sessao-on-line", "fonte_id": "metropoles", "data_pub": "2026-08-18T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz Milton Lívio Lemos Salles foi confirmado no afastamento após ser filmado consumindo vinho e fumando durante uma sessão virtual do TJMG. A medida cautelar foi ratificada.", "titulo_pt": "CNJ confirma afastamento de juiz que bebia e fumava durante sessão online", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 110548, "titulo": "Gangue da bananeira: homens atacam motoristas na Marginal Tietê", "url": "https://www.metropoles.com/sao-paulo/gangue-da-bananeira-homens-atacam-motoristas-na-marginal-tiete", "fonte_id": "metropoles", "data_pub": "2026-08-18T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um grupo de homens, conhecido como 'gangue da bananeira', realizou ações de roubo a motoristas na Marginal Tietê. Os criminosos agiam em vegetação próxima à via, aguardando para abordar os condutores.", "titulo_pt": "Gangue da bananeira: homens atacam motoristas na Marginal Tietê", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 110697, "titulo": "Un grupo de jóvenes se juntó a “farmear aura” y los atacaron a piedrazos en Mar del Plata", "url": "https://www.lanacion.com.ar/sociedad/un-grupo-de-jovenes-se-junto-a-farmear-aura-y-los-atacaron-a-piedrazos-en-mar-del-plata-nid18 function renderSecao(topico) {

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
