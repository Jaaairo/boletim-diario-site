<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "07/09/2026 15:28", "stats": {"noticias_novas": 804, "resumos_gerados": 244}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "As manifestações marcadas para o dia 7 de setembro estão impactando o cenário político brasileiro, com protestos contra o ministro Alexandre de Moraes, do STF, em diversas capitais. O presidente Lula se reuniu com ministros do STF e do Senado, focando em temas como a soberania nacional, enquanto tenta atrair o apoio do psicólogo Augusto Cury para o segundo turno das eleições. O senador Flávio Bolsonaro, do PL, participou de cultos e atos religiosos, pedindo a prisão de ministros do STF. O advogado Modesto Carvalhosa criticou a narrativa que enfoca um suposto embate entre ministros do STF, afirmando que isso tem desviado o foco de possíveis atos ilícitos praticados por Alexandre de Moraes. Além disso, a campanha de Flávio Bolsonaro investiu em canais de mídia com programação 24 horas, enquanto o presidente Lula planeja intensificar sua campanha com foco na saúde e no diálogo com o eleitorado idoso.", "mundo": "A vitória histórica da extrema-direita AfD nas eleições do estado de Saxe-Anhalt na Alemanha está causando uma crise política no país. O partido, liderado por Alice Weidel, obteve 44% dos votos, o que representa a maior vitória da extrema-direita em uma eleição de estado desde a era nazista. O chanceler alemão, Friedrich Merz, expressou preocupação com o resultado, mas rejeitou a ideia de sair do governo, apesar da pressão do partido rival. Esta vitória reflete uma tendência mais ampla na Europa, impulsionada por falhas nas políticas centrais e pelo gradual normalizado de ideias do extremismo da direita. Em outros eventos internacionais, Israel realizou ataques mortíferos no Líbano, enquanto a União Europeia prometeu investimentos na Groenlândia após pressões de Donald Trump. O Irã ameaçou retaliar possíveis ataques dos EUA, enquanto a Coreia do Sul planeja uma parceria com a França para alavancar o conteúdo local globalmente.\n\nA situação geopolítica global continua marcada por tensões significativas. Em primeiro lugar, a Coreia do Norte e a Rússia inauguraram sua primeira ponte viária, simbolizando um fortalecimento de suas relações estratégicas. Por outro lado, a China e a Rússia realizaram seu primeiro levantamento conjunto de gelo marinho no Ártico, refletindo a crescente competição na região. Em um contexto mais imediato, a Coreia do Norte criticou fortemente as manobras militares conjuntas dos Estados Unidos, ameaçando medidas retaliatórias. A China, por sua vez, advertiu contra a interferência de terceiros em suas relações com o México. Na região do Oriente Médio, Israel intensificou suas ameaças de guerra contra a Autoridade Palestina, enquanto a guerra no Iêmen continua, com mais de 300 mortos. A Alemanha pediu ao Tribunal Internacional de Justiça para descartar um caso apresentado pela Nicarágua sobre o suposto genocídio em Gaza, argumentando que a Nicarágua não demonstrou a existência de um conflito jurídico antes de apresentar o caso em março de 2024. A Coreia do Norte também denunciou os exercícios militares conjuntos da Coreia do Sul, dos Estados Unidos e do Japão, ameaçando retaliar. Em um cenário mais local, a Letônia planeja tarifas de 300% sobre grãos da Rússia e Bielorrússia, enquanto a guerra em Gaza atingiu 73.658 mortos desde outubro de 2023. A guerra entre Estados Unidos e Irã também continua, com relatos de novos ataques a instalações de petróleo da Aramco.", "economia": "Os preços do petróleo subiram novamente, chegando a US$ 100 por barril, após novas tensões entre Irã e Estados Unidos e ataques a navios petroleiros e a uma refinaria no Oriente Médio. Essa elevação afetou o Brasil, com o dólar blue valendo R$ 1.540 e o governo prevendo um aumento de R$ 30 nos preços dos combustíveis. Por outro lado, a varejista de moda rápida Shein perdeu cerca de US$ 5 bilhões em valor de mercado desde sua oferta pública inicial (IPO) em Hong Kong, refletindo preocupações dos investidores sobre o crescimento da empresa. A Jaguar Land Rover anunciou a redução de 4.000 postos de trabalho nos próximos dois anos para reduzir custos e aumentar a competitividade. Além disso, a China anunciou um investimento de 54 bilhões de dólares em bancos e seguradoras, mas as ações dessas empresas ainda caíram, apesar do aumento do capital. A Coreia do Sul manteve diálogos com a comunidade internacional sobre a segurança do Estreito de Ormuz, mantendo um canal aberto com o Irã. Por fim, a Whirpool, dona da Brastemp e Consul, lançou uma super geladeira no mercado indiano após vender parte de sua subsidiária no país para reduzir o endividamento.", "tecnologia": "A Apple está prestes a lançar seu primeiro iPhone dobrável, com um preço superior a US$ 2.000, durante um evento agendado para o dia 9 de setembro, conforme anunciado pelo CEO Tim Cook. A empresa também apresentará novos modelos de AirPods e HomePods. Este evento ocorre em um momento de aumento dos custos de produção, que reflete na preparação de um novo dispositivo de alto valor. Em outro desenvolvimento, a Xiaomi lançou um telefone dobrável com chip próprio, competindo diretamente com a Apple e outras gigantes como a Huawei. As regras chinesas sobre a utilização de inteligência artificial também foram endurecidas, proibindo o uso de tecnologias de deepfakes e clonagem de voz sem consentimento. Além disso, a inteligência artificial pode agregar US$ 600 bilhões por ano à economia do clima até 2028, de acordo com uma pesquisa da BCG em colaboração com a Temasek.", "ciencia": "Um importante estudo sugere que a Terra pode ser usada como um detector de alta precisão para sinais de matéria escura, indicando que o planeta pode atuar como um detector gigante para essa substância misteriosa. Em outro desenvolvimento, a Colaboração BESIII utilizou uma técnica não explorada há 35 anos para reavaliar um teste antigo da ideia mais importante do Modelo Padrão, validando um dos conceitos fundamentais do Modelo Padrão. Além disso, os cientistas descobriram que a interação entre diferentes órgãos pode influenciar a função cerebral e a tomada de decisões, enquanto um estudo comprovou que certos hábitos alimentares podem aumentar o risco de câncer de próstata em até 30%. Outros trabalhos exploram a possibilidade de os morcegos se auto-medicarem, a regeneração cerebral após um acidente vascular cerebral, e a relação entre o clima e a qualidade do ar. Além disso, a descoberta de incêndios florestais no Polo Sul durante o Cretáceo tardio e a expansão das escavações na Gruta Prado Vargas, que revelaram um acampamento neandertal de cerca de 46.000 anos, também merecem destaque. Por fim, a Lua se aproxima de Júpiter em um fenômeno raro no dia 8 de setembro, enquanto a NASA lança o maior mapa bidimensional do universo já criado, com mais de um milhão de galáxias e quasares mapeados.", "cultura": "O evento mais importante dos artigos é a declaração conjunta de investimento de 1 bilhão de euros entre a França e a Coreia do Sul, anunciada durante a Summit Lumière, para apoiar o setor audiovisual. O anúncio, feito pelo presidente francês Emmanuel Macron e pelo presidente sul-coreano Yoon Suk Yeol, marcou o início da Lumière Partnership, uma iniciativa de cooperação de investimento na indústria cinematográfica global, planejada para começar em 2027. O projeto visa fortalecer as indústrias cinematográfica e audiovisual dos dois países, destacando a importância do setor para a economia e a cultura de ambos os países. Além disso, o historiador e ensaísta argentino Norberto Galasso, falecido aos 90 anos, merece destaque, com sua obra sendo celebrada no Rio de Janeiro. O documentarista Eric Goode discute o impacto de sua série 'Monsters of God' na indústria, criticando a influência negativa do 'Tiger King' em seu projeto de paixão. A cantora Céline Dion se prepara para uma série de shows em Paris, com fãs aguardando ansiosamente para vê-la, enquanto a obra de Liz Larner, uma escultora americana, explora a respiração como meio de criação artística. Em relação aos vinhedos franceses, a seca severa e o calor extremo tiveram um impacto significativo na colheita, com os viticultores enfrentando desafios significativos. Por fim, a banda britânica Radiohead anunciou shows em Sydney, na Austrália, e em Tóquio, no Japão, gerando grande expectativa entre os fãs.", "sociedade": "O Brasil enfrenta diversos desafios sociais. Um exemplo é o caso de uma adolescente que pulou de um carro em movimento no Rio de Janeiro para escapar de um sequestro, resultando em ferimentos leves. Em São Paulo, um bebê sofreu tortura, levantando questões sobre a natureza da violência. A sociedade chilena se prepara para o envelhecimento da população, o que tem implicações para a economia e a estrutura social. No Chile, a CUT entregou uma carta ao governo pedindo a suspensão de um projeto de Sala Cuna Universal e a formação de uma mesa de trabalho. Além disso, a Fundação Amparo e Justícia denunciou a morte de 276 crianças sem causa determinada em três anos, incentivando medidas para melhorar a segurança infantil. A Encuesta de Bienestar de la Juventud 2026, realizada pela Universidade Andrés Bello, revelou que 55% dos jovens chilenos expressaram desejo por mais apoio emocional e mental. No exterior, a Coreia do Sul reduziu o gap salarial entre homens e mulheres em instituições públicas, mas a disparidade persiste nas empresas privadas. No Brasil, a cidade de Lagoa Santa adquiriu livros didáticos de Augusto Cury, enquanto a prefeitura de Seul planeja abrir um centro de suporte à educação multicultural devido ao aumento do número de estudantes migrantes.", "meio_ambiente": "Em 2026, a Itália registrará o ano mais quente dos últimos 75 anos, conforme dados do Instituto Italiano de Meteorologia. A erupção do vulcão Anak Krakatoa na Indonésia interrompeu voos e afetou cerca de 270.000 passageiros, com diversos aeroportos locais fechados. Um El Niño extremamente forte pode levar a preços mais altos dos alimentos na Austrália nos próximos 12 meses, devido às condições climáticas quentes e secas. A China está investindo em energia renovável e mudanças na indústria para reduzir as emissões em suas cidades. Uma enchente relâmpago na fronteira entre Nepal e China deixou quase 1.400 mortos, com 13 mil pessoas resgatadas. O Nepal está em estado de luto após cheias que resultaram na morte de 1.300 pessoas, com operações de resgate concentradas em 12 projetos hidrelétricos. O relatório da ONU indica que combater a poluição do ar e as mudanças climáticas pode elevar o PIB global em 2,8% até 2035, mas a maior parte da população mundial ainda está exposta a níveis de poluição acima dos padrões globais.", "direitos_humanos": "Novos relatos de violações de direitos humanos surgiram em vários países. No Egito, a apresentadora de TV Sarah Khalifa, junto com 11 outros indivíduos, foi condenada à morte por tráfico de drogas sintéticas, levando a uma batalhada legal. Em desenvolvimento alarmante, documentos e evidências revelaram o uso de bombas de cloro pelo exército sudanês contra opositores paramilitares, sugerindo o uso de armas químicas. Em Hong Kong, uma lei contra assédio está sendo proposta após um homem ser absolvido de acusações de seguir uma garota adolescente para a escola, evidenciando a necessidade de proteção legal contra esse tipo de crime. Além disso, uma coalizão de organizações cívicas pediu à UNESCO que incluísse documentos relacionados às 'mulheres de conforto' em sua lista de bens da memória humana, enquanto um grupo de seguidores da médium Maira Rocha atacou e ameaçou críticos na internet, denotando a presença de milícias digitais em ação. Por fim, um ataque israelense resultou na morte de uma menina de oito anos e seu pai no primeiro dia da escola, reforçando a violência em conflitos armados. Estes eventos sublinham a urgência de proteger os direitos humanos em diferentes contextos globais."}, "resumo_do_dia": {"politica_nacional": [{"id": 150633, "titulo": "Manifestações podem dar o tom da guerra no STF nesta semana", "url": "https://www.metropoles.com/colunas/matheus-leitao/manifestacoes-podem-dar-o-tom-da-guerra-no-stf-nesta-semana", "fonte_id": "metropoles", "data_pub": "2026-09-07T17:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As manifestações marcadas para o dia 7 de setembro podem influenciar os movimentos do cenário político para as eleições de 2026.", "titulo_pt": "Manifestações podem definir o rumo das eleições de 2026 no STF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 150635, "titulo": "Renan Santos diz que números de Augusto Cury são \"ascensão da covardia\"", "url": "https://www.metropoles.com/sao-paulo/renan-santos-diz-que-numeros-de-augusto-cury-sao-ascensao-da-covardia", "fonte_id": "metropoles", "data_pub": "2026-09-07T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renan Santos criticou os candidatos mais bem colocados nas pesquisas eleitorais e exigiu a prisão do ministro do STF, Alexandre de Moraes.", "titulo_pt": "Renan Santos critica números de Augusto Cury e pede prisão de alexandre de moraes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 150636, "titulo": "Ato da direita na Av. Paulista une Flávio, Tarcísio e lideranças religiosas", "url": "https://www.metropoles.com/sao-paulo/ato-paulista-flavio-bolsonaro-tarcisio-direita", "fonte_id": "metropoles", "data_pub": "2026-09-07T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma manifestação de direita ocorreu na Avenida Paulista, com a presença de políticos e lideranças religiosas. A concentração começou antes das 15h.", "titulo_pt": "Ato da direita na Av. Paulista reúne Flávio, Tarcísio e lideranças religiosas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 150558, "titulo": "Crime organizado e bancada da bala se abrigam nos mesmos partidos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/voto-a-voto/2026/09/crime-organizado-e-bancada-da-bala-se-abrigam-nos-mesmos-partidos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-07T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em áreas controladas por milícias no Rio de Janeiro, candidatos ligados a essas organizações receberam votos significativamente maiores do que candidatos eleitos. Um policial envolvido em extorsão obteve 13,36% dos votos para deputado estadual em seu território, enquanto o candidato médio recebeu apenas 0,26%.", "titulo_pt": "Crimes organizados e bancada da bala se abrigam nos mesmos partidos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 150638, "titulo": "Campanha de Flávio pagou R$ 3,7 milhões em canal online com programação 24h", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/campanha-de-flavio-pagou-r-37-milhoes-em-canal-online-com-programacao-24h", "fonte_id": "metropoles", "data_pub": "2026-09-07T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro lançou um canal no YouTube com programação 24 horas. Eduardo Bolsonaro participou do lançamento dos Estados Unidos.", "titulo_pt": "Campanha de Flávio pagou R$ 3,7 milhões em canal online com programação 24h", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 150639, "titulo": "Governo Lula acredita que pode atrair Augusto Cury", "url": "https://www.metropoles.com/colunas/matheus-leitao/governo-lula-acredita-que-pode-atrair-augusto-cury", "fonte_id": "metropoles", "data_pub": "2026-09-07T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ministros do governo Lula esperam contar com o apoio de Augusto Cury em um eventual segundo turno das eleições.", "titulo_pt": "Governo Lula acredita em apoio de Augusto Cury", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 150586, "titulo": "Doze capitais registram protestos contra Moraes neste 7 de setembro", "url": "https://veja.abril.com.br/brasil/doze-capitais-registram-protestos-contra-moraes-neste-7-de-setembro/", "fonte_id": "veja", "data_pub": "2026-09-07T17:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Doze capitais brasileiras registraram protestos contra o ministro do STF, André Mendonça, em 7 de setembro. As manifestações, promovidas pela direita, incluíram apoio à candidatura de Flávio Bolsonaro e aprovação da atuação de Mendonça.", "titulo_pt": "Doze capitais registram protestos contra Moraes neste 7 de setembro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 150559, "titulo": "Paulinho da Força declara voto a Cury: 'não aguento mais essa polarização'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/paulinho-da-forca-declara-voto-a-cury-nao-aguento-mais-essa-polarizacao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-07T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Paulinho da Força declarou seu voto em Augusto Cury, do Avante, criticando a polarização política no país. Em um vídeo publicado, ele afirma não aguentar mais a divisão existente.", "titulo_pt": "Paulinho da Força vota em Cury e critica polarização", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 150589, "titulo": "O recado do 7 de Setembro que pode virar munição para Lula no segundo turno", "url": "https://veja.abril.com.br/economia/o-recado-do-7-de-setembro-que-pode-virar-municao-para-lula-no-segundo-turno/", "fonte_id": "veja", "data_pub": "2026-09-07T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Gritos pela mudança na escala de trabalho 6×1 fortalecem uma pauta que pode ser levada ao plenário do Congresso, possivelmente no período decisivo do segundo turno das eleições presidenciais. O senador Alcolumbre pode apresentar esse projeto justamente nesse momento crucial da campanha.", "titulo_pt": "Mensagem do 7 de Setembro que pode beneficiar Lula no segundo turno", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 150744, "titulo": "Quem são os candidatos a governador de Sergipe (SE) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-a-governador-de-sergipe-se-nas-eleicoes-2026-7-setembro", "fonte_id": "jota", "data_pub": "2026-09-07T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O atual governador de Sergipe será candidato à reeleição e enfrentará cinco outros políticos na disputa pelo cargo de governador nas eleições de 2026.", "titulo_pt": "Quem são os candidatos a governador de Sergipe (SE) nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 150682, "titulo": "Eleição será 50% construção e 50% destruição do adversário, prevê marqueteiro", "url": "https://www.infomoney.com.br/politica/eleicao-sera-50-construcao-e-50-destruicao-do-adversario-preve-marqueteiro/", "fonte_id": "infomoney", "data_pub": "2026-09-07T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha presidencial deve se concentrar metade em promover o próprio candidato e a outra metade em diminuir a popularidade do adversário, segundo um especialista em marketing político.", "titulo_pt": "Eleição será 50% construção e 50% destruição do adversário, prevê marqueteiro", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 150560, "titulo": "Renan Santos lança manifesto em ato no Ibirapuera e pede prisão de Moraes e Toffoli", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/renan-santos-lanca-manifesto-em-ato-no-ibirapuera-e-pede-prisao-de-moraes-toffoli-e-chefe-da-pf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-07T16:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na manhã de segunda-feira (7), Renan Santos e seus apoiadores realizaram um protesto no Obelisco do Ibirapuera, em São Paulo, exigindo a prisão dos ministros Alexandre de Moraes e Dias Toffoli, do STF, e o afastamento do diretor-geral da Polícia Federal, Andrei Rodrigues.", "titulo_pt": "Renan Santos lança manifesto em ato no Ibirapuera e pede prisão de Moraes e Toffoli", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 150745, "titulo": "Lula reúne Fachin, Alcolumbre e Motta em 7 de Setembro com soberania em destaque", "url": "https://www.jota.info/executivo/lula-reune-fachin-alcolumbre-e-motta-em-7-de-setembro-com-soberania-em-destaque", "fonte_id": "jota", "data_pub": "2026-09-07T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, Ministro Fachin, participou de uma cerimônia conjunta com o presidente do Senado, Alcolumbre, e o ministro das Relações Exteriores, Motta, no dia 7 de Setembro. A soberania foi um tema destacado durante o encontro, ocorrido após uma crise inédita na Corte judicial relacionada ao caso Master.", "titulo_pt": "Lula reúne Fachin, Alcolumbre e Motta em 7 de Setembro com soberania em destaque", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 150561, "titulo": "Flávio visita igreja com Tarcísio, ora pela 'nação' e o tiça na Praça dos 3 Poderes’, em culto com pedido de benção a Mendonça", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 151143, "titulo": "China security laws spell travel risks", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/08/2003863863", "fonte_id": "taipei_times", "data_pub": "2026-09-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As leis de segurança da China estabelecem riscos para viajantes. Isso inclui restrições e possíveis penalidades para atividades consideradas potencialmente prejudiciais à segurança nacional.", "titulo_pt": "Leis de segurança da china significam riscos para viajantes", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 150634, "titulo": "Guerra no Iêmen: mais de 300 mortos em conflito com rebeldes houthis", "url": "https://www.metropoles.com/mundo/guerra-no-iemen-mais-de-300-mortos-em-conflito-com-rebeldes-houthis", "fonte_id": "metropoles", "data_pub": "2026-09-07T17:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O conflito no Iêmen, envolvendo forças governamentais e rebeldes houthis, resultou em mais de 300 mortos, marcando o fim de um cessar-fogo estabelecido em 2022. Mais de 1.790 famílias foram desabrigadas na região afetada pela guerra.", "titulo_pt": "Guerra no Iêmen: mais de 300 mortos em conflito com rebeldes houthis", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 150851, "titulo": "La histórica victoria de la extrema derecha abre una crisis en el Gobierno alemán", "url": "https://elpais.com/internacional/2026-09-07/la-victoria-de-la-extrema-derecha-en-sajonia-anhalt-sacude-a-la-coalicion-de-gobierno-en-alemania.html", "fonte_id": "elpais_america", "data_pub": "2026-09-07T17:56:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O líder da extrema-direita AfD, Christian Lindner, reconhece que não há retorno à normalidade após a vitória histórica na Sajônia-Anhalt. Os resultados servem de alerta para a Europa, considerando as eleições cruciais de 2027.", "titulo_pt": "A histórica vitória da extrema-direita abre uma crise no governo alemão", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 151077, "titulo": "Board of Peace touts progress as Palestinians’ situation worsens", "url": "https://www.aljazeera.com/video/the-bottom-line/2026/9/7/board-of-peace-touts-progress-as-palestinians-situation-worsens?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-07T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma oficial humanitária chamada Athena Rayburn analisou as táticas israelenses que tornam a vida 'inviável' para milhões de palestinos. O Board of Peace destaca o progresso enquanto a situação dos palestinos se deteriora.", "titulo_pt": "Boa vizinhança destaca progressos enquanto situação dos palestinos piora", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 150909, "titulo": "German chancellor vows to stay in office despite AfD triumph in state election", "url": "https://www.theguardian.com/world/2026/sep/07/german-chancellor-friedrich-merz-cdu-afd-saxony-anhalt", "fonte_id": "guardian_world", "data_pub": "2026-09-07T17:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Friedrich Merz, líder do partido conservador CDU, afirmou que a vitória esmagadora do partido extremamente direitista AfD na eleição do estado de Saxe-Anhalt abalou profundamente seu partido. Merz declarou que continuará a desempenhar seu papel, apesar desse choque.", "titulo_pt": "Chanceler alemão se compromete a permanecer em cargo apesar da vitória do AfD na eleição estadual", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 151058, "titulo": "Report: US official says Hormuz fully open, under US control", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/report-us-official-says-hormuz-fully-open-under-us-control", "fonte_id": "middle_east_eye", "data_pub": "2026-09-07T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um oficial dos Estados Unidos informou à Al Jazeera que o Estreito de Ormuz está totalmente aberto e sob controle da Marinha dos EUA. A avaliação segue uma operação de desminagem oculta realizada pela Marinha dos EUA no estreito desde abril, e a expectativa é de um aumento no tráfego marítimo.", "titulo_pt": "Relatório: oficial dos EUA afirma que Ormuz está totalmente aberto e sob controle americano", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 151059, "titulo": "US presence in Gulf 'not enough' for security, Qatari official says", "url": "https://www.middleeasteye.net/news/us-presence-gulf-region-not-enough-security-qatari-official-says", "fonte_id": "middle_east_eye", "data_pub": "2026-09-07T17:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O porta-voz do Ministério dos Assuntos Exteriores do Qatar, Majed al-Ansari, sugeriu que a presença dos Estados Unidos no Golfo não é suficiente para a segurança. Al-Ansari participou de uma sessão no Fórum Hili 2026 em Abu Dhabi, Emirados Árabes Unidos, em 7 de setembro de 2026.", "titulo_pt": "Presença dos EUA no golfo 'insuficiente' para a segurança, afirma oficial Qatari", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 150537, "titulo": "'Profundamente chocado' com vitória da AfD, Merz diz que não sai", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/profundamente-chocado-com-vitoria-da-afd-merz-diz-que-nao-sai.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-07T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Friedrich Merz, primeiro-ministro da Alemanha, expressou preocupação com a sólida vitória da AfD nas eleições de Saxônia-Anhalt, mas rejeitou a ideia de desistir do governo. Ele afirmou que isso terá consequências.", "titulo_pt": "Merz profissionalmente chocado com vitória da AfD, mas não desistirá", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 150832, "titulo": "Nazi-Looted Painting in Real Estate Listing Must Be Returned", "url": "https://www.nytimes.com/2026/09/07/world/americas/looted-painting-nazis-argentina.html", "fonte_id": "nyt_world", "data_pub": "2026-09-07T17:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pintura do século XVIII, chamada 'Portreto de uma Senhora', roubada por um alto oficial nazi durante a década de 1940, reapareceu recentemente em uma lista imobiliária na Argentina.", "titulo_pt": "Pintura roubada pelos nazis em lista imobiliária na argentina deve ser devolvida", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 150827, "titulo": "Israel Launches Deadly Strikes in Lebanon as Military Campaign Intensifies", "url": "https://www.nytimes.com/2026/09/07/world/middleeast/israel-lebanon-strikes-hezbollah.html", "fonte_id": "nyt_world", "data_pub": "2026-09-07T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel realizou ataques mortíferos no Líbano, que resultaram na morte de 11 pessoas, de acordo com autoridades locais. As operações militares israelenses intensificaram-se, levando a preocupações de que o país esteja buscando avançar para dentro do território libanês.", "titulo_pt": "Israel realiza ataques mortíferos no líbano ao intensificar campanha militar", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 150829, "titulo": "Philippines Lawmaker, Cousin of Marcos, Charged With Taking Kickbacks", "url": "https://www.nytimes.com/2026/09/07/world/asia/philippines-romualdez-arrest-kickbacks.html", "fonte_id": "nyt_world", "data_pub": "2026-09-07T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um parente do presidente Filipinas, primo de Ferdinand Marcos Jr., foi acusado de desviar fundos públicos destinados ao controle de enchentes no país. Ele nega as acusações.", "titulo_pt": "Parlamentar filipino, primo de Marcos, é acusado de desviar fundos públicos", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 150904, "titulo": "Alleged killers of Australian surfers and American friend go on trial in Mexico", "url": "https://www.theguardian.com/world/2026/sep/07/alleged-killers-of-australian-surfers-and-american-friend-go-on-trial-in-mexico", "fonte_id": "guardian_world", "data_pub": "2026-09-07T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três homens estão sendo julgados por supostamente matar dois surfistas australianos, Jake e Callum Robinson, de 30 e 33 anos, e seu amigo americano, Jack Carter Rhoad, de 30 anos, em Baja California em 2024. Os três foram mortos após serem roubados em um local de surfe na fronteira mexicana, onde ocorreu o crime.", "titulo_pt": "Suspeitos do assassinato de surfistas australianos e amigo americano vão a julgamento em baja california", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 150538, "titulo": "Trump cogita rebatizar Novo México de Nova América e provoca reação", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/trump-cogita-rebatizar-novo-mexico-de-nova-america-e-provoca-reacao.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-07T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, sugeriu que o Novo México deveria ser rebatizado como 'Nova América', gerando reações dos líderes democratas do estado. A proposta foi feita no domingo, 6 de julho de 2026.", "titulo_pt": "Trump sugere rebatizar Novo México como Nova América e causa reação", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 150830, "titulo": "Thousands of Serbs Gather to Mourn Ratko Mladic, the ‘Butcher of Bosnia’", "url": "https://www.nytimes.com/2026/09/07/world/europe/ratko-mladic-funeral-serbia.html", "fonte_id": "nyt_world", "data_pub": "2026-09-07T17:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de sérvios compareceram para o funeral de Ratko Mladić, conhecido como o 'Boucher de Bosnia', mesmo com a insistência do governo de que era um evento privado. Ministros do governo estiveram presentes e os meios de comunicação estatais elogiaram o criminoso de guerra condenado.", "titulo_pt": "Milhares de sérvios se reúnem para o funeral de Ratko mladić, o 'boucher de Bosnia'", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 151081, "titulo": "Gaza: Genocide in Real Time?", "url": "https://www.aljazeera.com/video/aljazeerauntangles/2026/9/7/gaza-genocide-in-real-time?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-07T17:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O B'Tselem, uma organização israelense que monitora violações dos direitos humanos, publicou um relatório sobre possíveis violações de direitos humanos em Gaza. O título original sugere que o relatório aborda o genocídio em tempo real, mas o texto não confirma isso explicitamente.", "titulo_pt": "Gaza: genocídio em tempo Real?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 150856, "titulo": "Irán afirma que la “era de las respuestas proporcionales” a Estados Unidos ha terminado", "url": "https://elpais.com/internacional/2026-09-07/iran-afirma-que-la-era-de-las-respuestas-proporcionales-a-estados-unidos-ha-terminado.html", "fonte_id": "elpais_america", "data_pub": "2026-09-07T17:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Teerã afirma que qualquer agressão dos Estados Unidos receberá uma resposta 'mais dolorosa' e que a passagem marítima por uma nova área do Estreito de Ormuz será proibida.", "titulo_pt": "Irã afirma que a 'era de respostas proporcionais' aos Estados Unidos terminou", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 151164, "titulo": "Property market cooling continues, 591.com says", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/08/2003863848", "fonte_id": "taipei_times", "data_pub": "2026-09-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado imobiliário está continuando a esfriar, de acordo com a 591.com. A empresa relata que há sinais de desaceleração no setor imobiliário.", "titulo_pt": "Mercado imobiliário continua a esfriar, diz 591.Com", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 151167, "titulo": "AIDC, Bombardier sign 20-year deal", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/08/2003863851", "fonte_id": "taipei_times", "data_pub": "2026-09-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A AIDC (Indústria Aeronáutica e Defesa de Taiwan) e a Bombardier assinaram um acordo de 20 anos para colaboração em projetos aeronáuticos.", "titulo_pt": "AIDC e Bombardier firmam acordo de 20 anos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 150916, "titulo": "Biministro Mas confirma alza de las bencinas y el diésel para esta semana", "url": "https://www.latercera.com/pulso/noticia/biministro-mas-confirma-alza-de-las-bencinas-y-el-diesel-para-esta-semana/", "fonte_id": "la_tercera", "data_pub": "2026-09-07T17:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ministro de Economia e Minas, Daniel Mas, confirmou que haverá aumento nas gasolina e diesel na semana atual, mas ainda não foram definidas as variações exatas.", "titulo_pt": "Biministro Mas confirma aumento da gasolina e diesel para esta semana", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 150917, "titulo": "El cobre sube y registra su tercer mayor valor en la historia", "url": "https://www.latercera.com/pulso/noticia/el-cobre-sube-y-registra-su-tercer-mayor-valor-en-la-historia/", "fonte_id": "la_tercera", "data_pub": "2026-09-07T17:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O preço do cobre subiu em 1,18%, atingindo US$6,595 na Bolsa de Metais de Londres. Este valor é o terceiro maior da história do metal.", "titulo_pt": "O cobre registra seu terceiro maior valor histórico", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 150809, "titulo": "Dólar hoy y dólar blue, EN VIVO: a cuánto cotiza el oficial y cuál es el precio del paralelo este lunes 7 de septiembre, minuto a minuto", "url": "https://www.lanacion.com.ar/economia/dolar/dolar-hoy-y-dolar-blue-en-vivo-a-cuanto-cotiza-el-oficial-y-cual-es-el-precio-del-paralelo-este-nid07092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-07T17:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O dólar oficial está cotado a R$1530 para venda no Banco Nación, enquanto o dólar blue está valendo R$1540. O texto também menciona o MEP e o CCL, mas não fornece detalhes específicos sobre essas taxas neste trecho.", "titulo_pt": "Dólar hoje e dólar blue, ao VIVO: qual é a cotação do oficial e qual o preço do paralelo nesta segunda-feira, 7 de setembro", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 150547, "titulo": "Produção de vinho na França deve ser uma das menores em 30 anos após ondas de calor", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/producao-de-vinho-na-franca-deve-ser-uma-das-menores-em-30-anos-apos-ondas-de-calor.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-07T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A França deve registrar uma das menores produções de vinho nas últimas três décadas, com a produção de champanhe prevista para cair pela metade, devido ao calor intenso e à seca que danificaram as videiras e as uvas. O Ministério da Agricultura anunciou essa previsão nesta segunda-feira (7).", "titulo_pt": "Produção de vinho na França deve ser uma das menores em 30 anos após ondas de calor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 150921, "titulo": "El petróleo trepa a su nivel más alto en seis semanas y el barril se acerca otra vez a los US$ 100", "url": "https://www.latercera.com/pulso/noticia/el-petroleo-trepa-a-su-nivel-mas-alto-en-seis-semanas-y-el-barril-se-acerca-otra-vez-a-los-us-100/", "fonte_id": "la_tercera", "data_pub": "2026-09-07T17:43:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O petróleo atingiu seu nível mais alto em seis semanas, com o barril se aproximando novamente dos US$ 100. Em Chile, o governo espera um aumento de R$ 30 no preço dos combustíveis devido a tensões entre Irã e Estados Unidos no Oriente Médio.", "titulo_pt": "O petróleo atinge seu nível mais alto em seis semanas e se aproxima dos r$ 100", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 150700, "titulo": "Índia enfrenta congestionamento em portos por excesso de óleo vegetal", "url": "https://www.cnnbrasil.com.br/agro/importacoes-de-oleo-vegetal/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Índia enfrenta congestionamento em seus portos devido ao excesso de óleo vegetal, resultante de compras agressivas e tanques cheios que atrasam o descarregamento de navios em até dez dias.", "titulo_pt": "Índia enfrenta congestionamento em portos por excesso de óleo vegetal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 151031, "titulo": "Oil prices rise to 6-week high after Iran and U.S. trade blows, Saudi Aramco facilities reportedly hit", "url": "https://www.cnbc.com/2026/09/07/oil-prices-rise-to-6-week-high-after-iran-and-us-trade-blows-saudi-aramco-facilities-reportedly-hit.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-07T16:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços do petróleo subiram para um nível não visto há seis semanas após novas tensões entre Irã e Estados Unidos. Instalações da Aramco, empresa de petróleo saudita, seriam alvo de ataques.", "titulo_pt": "Preços do petróleo atingem nível não visto há seis semanas após tensões entre Irã e EUA e supostos ataques à Aramco", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 150597, "titulo": "Os recordes negativos que acendem o alerta para a economia brasileira", "url": "https://veja.abril.com.br/economia/os-recordes-negativos-que-acendem-o-alerta-para-a-economia-brasileira/", "fonte_id": "veja", "data_pub": "2026-09-07T16:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O crédito está caro, pressionando as famílias e as empresas. Além disso, o déficit das estatais e o aumento da dívida pública evidenciam a fragilidade das contas públicas.", "titulo_pt": "Os recordes negativos que acendem o alerta para a economia brasileira", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 151122, "titulo": "Oil closes in on $100 as renewed supply crunch looms", "url": "https://www.ft.com/content/c8167dc7-f472-4846-8005-ee18b23736a8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-07T15:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O preço do petróleo está próximo dos US$ 100 por barril devido a uma possível escassez de suprimento, devido a ataques a navios e a redução das reservas. Comerciantes alertam que 'algo precisa quebrar' nessa situação.", "titulo_pt": "Óleo fecha perto de us$ 100 com risco de escassez de suprimento", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 150549, "titulo": "Shein perde US$ 5 bi em valor de mercado e tem uma das piores semanas após IPO em Hong Kong", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/shein endedores, conforme estudo encomendado pela Natura e conduzido pelo economista Fernando Blumenschein.", "titulo_pt": "Brasil tem pelo menos 19 milhões de nanoempreendedores, diz estudo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 150660, "titulo": "Estudo prevê 20 milhões de viagens a menos por ano com reforma tributária", "url": "https://exame.com/invest/minhas-financas/estudo-preve-20-milhoes-de-viagens-a-menos-por-ano-com-reforma-tributaria/", "fonte_id": "exame", "data_pub": "2026-09-07T12:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da ALTA prevê uma redução de 21,1% na procura por voos domésticos com a reforma tributária. O relatório também indica um risco de menor expansão da malha aérea no Brasil.", "titulo_pt": "Estudo prevê 20 milhões de viagens a menos por ano com reforma tributária", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 151032, "titulo": "SpaceX rival launches rocket in historic first, says industry is 'desperate' for more", "url": "https://www.cnbc.com/2026/09/07/isar-aerospace-spacex-rival-rocket-launch.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-07T12:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Isar Aerospace, uma startup alemã de foguetes, atingiu a órbita em sua segunda viagem de teste, enquanto busca aumentar a produção diante da alta demanda por lançamentos de satélites.", "titulo_pt": "Start-up alemã lança foguete com sucesso em primeira missão histórica, diz que setor está 'desesperado' por mais lançamentos", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 151165, "titulo": "No shortcut to excellence in chips: TSMC executive", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/08/2003863849", "fonte_id": "taipei_times", "data_pub": "2026-09-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa TSMC, um
