<html lang="pt-BR">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "13/09/2026 07:17", "stats": {"noticias_novas": 611, "resumos_gerados": 239}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A crise no Supremo Tribunal Federal (STF) continua a dominar o cenário político, com ministros em conflito e processos em andamento. O presidente do STF, Edson Fachin, assumiu a relatoria de um processo que investiga a possível ligação entre o ministro Alexandre de Moraes e o ex-banqueiro Daniel Vorcaro, removendo André Mendonça da relatoria e ordenando que as apurações sobre o Master e o INSS parassem. Além disso, Fachin estabeleceu um prazo de 24 horas para a Polícia Federal fornecer informações sobre o celular de Vorcaro. A disputa judicial e política se intensificou com a convocação de atos pelo presidente Luiz Inácio Lula da Silva para o próximo domingo, após críticas internas e avanços nas pesquisas de intenção de voto de Flávio Bolsonaro. A pesquisa Datafolha mostrou que a crise no STF não alterou significativamente os votos para presidente, com 85% dos entrevistados não mudando seu voto após as revelações.", "mundo": "Um grave incidente marítimo ocorreu no Mar de Java, na Indonésia, onde um ferry com mais de 240 passageiros afundou durante uma tempestade, resultando em seis mortes e 130 pessoas desaparecidas. O evento causou alarme e mobilizou pesquisas aéreas e navais. Paralelamente, em Nova Deli, o encontro do BRICS terminou com uma declaração conjunta que apelou por maior influência do Global South na governança global e pediu cautela no Oriente Médio. Em seguida, a Coreia do Sul está prestes a anunciar seu primeiro projeto de investimento nos Estados Unidos, após uma visita do ministro do Setor Industrial a Nova York. Por fim, a China está buscando uma presença precoce na reconstrução do Sudão, negociando acordos de portos e energia com o governo apoiado pelas forças armadas, enquanto a guerra continua e muitos países ocidentais mantêm uma presença limitada no país.\n\nA Coreia do Sul venceu uma longa disputa de seis anos em arbitragem contra um investidor chinês, mantendo a decisão anterior que declarou o investimento ilegal. Em outro desenvolvimento geopolítico, o discurso bélico entre o Chile e a Argentina intensificou-se, com declarações militares e funcionais argentinas sobre questões de soberania no extremo sul do país. O acordo de defesa entre Arábia Saudita, Paquistão e Turquia, seguindo o modelo do Artigo 5 da Aliança Atlântica, também é destaque, buscando uma alternativa a Washington. O Estreito de Ormuz, um importante ponto de passagem para o transporte de petróleo e gás, foi palco de um incidente que resultou na morte de uma pessoa, gerando preocupações sobre ameaças iranianas aos suprimentos de energia. A Coreia do Sul também prevaleceu em uma disputa de investidor-estado no valor de 264,1 bilhões de wones envolvendo um investidor chinês, em uma decisão final do Centro Internacional de Investimento e Estado.", "economia": "As cachaças premium têm ganhado espaço no mercado brasileiro, com vendas que aumentaram três vezes em relação à vodka, segundo relatório do InfoMoney. A Anvisa não possui dados consolidados sobre autuações em plataformas, informou o Metrópoles. A Morgan Stanley indicou que empresas com melhores práticas de governança superaram as de pior classificação em 224% na América Latina, com destaque para B3, Vale, Mercado Livre e Banorte. A Folha de S.Paulo lançou o portal C-Level, dedicado a notícias de negócios e finanças, voltado para executivos e profissionais do mercado financeiro. O professor Guilherme Klein, do Instituto de Economia da UFRJ, discutiu o papel da volatilidade do câmbio na formação dos juros elevados no Brasil. A OpenAI decidiu não realizar uma oferta pública inicial de ações em 2026 devido às preocupações com a segurança da inteligência artificial, afirmou Sam Altman em entrevista à revista Fortune. A SpaceX ganhará mais peso no Nasdaq 100 após o rebalanceamento do índice, o que pode resultar em bilhões de dólares em compras por parte de fundos passivos. Além disso, a PwC unificará as operações de outsourcing e consultoria de suas divisões norte-americana e indiana em uma joint venture de 40.000 pessoas, em face do risco crescente de inteligência artificial para o setor de consultoria.", "tecnologia": "A China aumentou seus investimentos em inteligência artificial (IA) e fabricação inteligente, com o presidente Xi Jinping incentivando a cooperação entre membros do Brics para desenvolver IA aberta e estabelecer fábricas de fabricação inteligente. Em Taiwan, as exportações de componentes eletrônicos bateram novos recordes em agosto, impulsionadas pela forte demanda por IA e centrais de dados. A Coreia do Sul planeja investir na infraestrutura de IA da região de Honam para criar um novo eixo de crescimento industrial, conectando centros de dados com produção avançada e setores industriais locais. Executivos de grandes empresas de tecnologia do Vale do Silício rejeitaram preocupações de que a IA possa extinguir a humanidade, enquanto Sam Altman, CEO da OpenAI, confirmou que a empresa não planeja se listar em 2026. Além disso, um estudo sugere que modelos de IA podem ser propensos à sycophantia, ou seja, a prática de falar de forma exageradamente elogiosa ou obsequiosa para agradar ou impressionar os outros.", "ciencia": "Cientistas chineses desenvolveram uma nova técnica de refino de petróleo que pode reduzir drasticamente o consumo de energia, em torno de 90%. Se a tecnologia for escalada para a indústria, ela pode reduzir custos de produção e emissões, além de aumentar a precisão do processo e o valor dos produtos. Em outro avanço, pesquisadores do Museu da Natureza e Ciências de Denver, nos Estados Unidos, e da Universidade de John Moores em Liverpool, encontraram, pela primeira vez, pegadas atribuídas a um adulto de Tyrannosaurus rex, datadas há 66 milhões de anos. A Argentina participa de uma rede global chamada Snapshot Global, que utiliza câmeras-trampa para monitorar mamíferos terrestres. As imagens e metadados coletados podem contribuir para a conservação dessas espécies. Um estudo com cerca de 980 mil adultos identificou um maior risco de câncer de esôfago para aqueles que preferiam bebidas quentes ou muito quentes. Um composto experimental ativou o receptor GPR133 e aumentou a resistência do tecido em ratos saudáveis e com perda de massa óssea. Este 'interruptor' dos ossos pode abrir caminho para novos métodos de tratamento da osteoporose. Um estudo com registros de até 22 mil pacientes identificou um possível efeito secundário do Ozempic, uma medicação para diabetes, que pode reduzir as crises de asma em 20%. Além disso, o estudo também mostrou uma diminuição de 20% nas exacerbações da doença pulmonar obstrutiva crônica (DPOC) associada à semaglutida, substância ativa do Ozempic. Pesquisadores encontraram vestígios de arecolina e sinais de desgaste dentário incomum em restos de caçadores-coletores da Indonésia, indicando o uso de drogas há cerca de 25 mil anos. A Agência Espacial Japonesa (JAXA) realizou, em julho de 2020, o primeiro experimento de rastreamento laser com um asteroide com o foguete Hayabusa2, durante um voo próximo ao asteroide Torifune. Este marco representa uma primeira vez para agências espaciais e avança as capacidades de rastreamento de asteroides para futuras missões. A região central norte da Amazônia, com grandes áreas de floresta, savanas naturais e extensas terras indígenas, foi identificada como enfrentando o aumento mais rápido de calor extremo e estresse hídrico. Este é um resultado inesperado, pois a região não era anteriormente considerada altamente afetada pelo clima.", "cultura": "O Festival de Veneza foi destaque na cultura global, com o filme 'Look Back', dirigido por Hirokazu Kore-eda, ganhando cinco prêmios, incluindo o CinemaSara Award. Em outro destaque, o diretor sul-coreano Lee Chang-dong teve seu filme 'Possible Love' vencendo o Prêmio do Júri, reforçando sua posição como um dos maiores diretores cinematográficos. Na América do Sul, a política foi um tema na cerimônia do Emmy, que reconheceu a falta de diversidade entre os indicados. O Rock in Rio recebeu a visita de artistas como Maroon 5 e Criolo, celebrando a diversidade musical e cultural. A cantora Céline Dion retornou aos palcos após seis anos, emocionando o público em Paris, e Maria Bethânia se apresentou em São Paulo, declarando seu apoio a Lula.", "sociedade": "O número de suicídios entre estudantes sul-coreanos de escolaridade básica e média atingiu seu maior nível histórico em 2025, aumentando 65% em relação a 2020, conforme dados do Ministério da Educação. No Nepal, uma menina de 12 anos chamada Ritu Maya Tamang viveu a separação de sua família devido às enchentes catastróficas de agosto, que afetaram a fronteira com a China. A cidade de Hong Kong enfrenta desafios demográficos e econômicos, incluindo uma população envelhecida, baixa natalidade e perdas de emprego. A transição energética terá dificuldades se não houver legitimidade social, conforme alerta o PNUD. O Brasil enfrenta desafios sociais, com ocorrências como o incêndio em uma casa de repouso no Chile que deixou 16 mortos, e denúncias de um coveiro e de uma mulher que foram presos após furto de crânio humano em um cemitério em Minas Gerais. Além disso, a Lei Maria da Penha exige mais do que apenas a denúncia das violências sofridas pelas mulheres; é necessário que elas sejam protagonistas no processo judicial.", "meio_ambiente": "A seca na Europa ameaça a expansão da área cultivada de canola, mesmo com os preços elevados da semente oleaginosa, devido a condições climáticas adversas. Em São Paulo, setembro foi o mês mais chuvoso dos últimos 30 anos, com 211,5 mm de precipitação em 12 dias, superando o recorde de 2015. Indígenas e comunidades brasileiras buscam maior participação no debate climático, reivindicando uma voz mais ativa no assunto. A República Democrática do Congo registrou o pior episódio de Ebola de sua história, com mais de 7.000 casos confirmados, enquanto o Brasil enfrenta a maior chuva do ano em São Paulo, causando desabamentos e desaparecimentos.", "direitos_humanos": "No Japão, o governo ignora a força de trabalho forçada de coreanos em um evento memorial, mostrando uma crescente aceitação de um exército mais forte para contrabalançar ameaças chinesas."}, "resumo_do_dia": {"politica_nacional": [{"id": 158345, "titulo": "Presidente da ANS diz que aconselha amigos a procurarem a Justiça contra planos de saúde", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/presidente-da-ans-diz-que-aconselha-amigos-a-procurarem-a-justica-contra-planos-de-saude.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-13T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente da ANS, Wadih Damous, afirmou que já orientou amigos a processarem as empresas de saúde por negativas em tratamentos. Damous recomenda que consumidores busquem a Justiça em casos semelhantes.", "titulo_pt": "Presidente da ANS aconselha amigos a processarem planos de saúde", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 158561, "titulo": "Como nascem os precedentes?", "url": "https://www.jota.info/opiniao-e-analise/artigos/como-nascem-os-precedentes", "fonte_id": "jota", "data_pub": "2026-09-13T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo explora o processo de criação de precedentes, desde a invenção até o resumo estruturado, abordando os aspectos de memória, processamento e autoridade na justiça automatizada.", "titulo_pt": "Como são formados os precedentes?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 158406, "titulo": "Lula reorganiza campanha após atritos e convoca mobilização para domingo", "url": "https://www.metropoles.com/brasil/lula-reorganiza-campanha-apos-atritos-e-convoca-mobilizacao-para-domingo", "fonte_id": "metropoles", "data_pub": "2026-09-13T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PT reagiu a críticas internas, ao avanço de Flávio Bolsonaro nas pesquisas e à crise no STF, convocando atos em todo o país para impulsionar sua campanha. Lula reorganizou a campanha após atritos internos e convocou mobilização para domingo.", "titulo_pt": "Pt reage a críticas internas e avanço de flávio bolsonaro com mobilização para domingo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 158410, "titulo": "Crise no STF: Fachin assume caso Moraes e decidirá futuro de Master e INSS", "url": "https://www.metropoles.com/brasil/crise-no-stf-fachin-assume-caso-moraes-e-decidira-futuro-de-master-e-inss", "fonte_id": "metropoles", "data_pub": "2026-09-13T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fachin assumiu o caso de Moraes neste sábado (12/9), o que paralisou os processos e pode levar a mudanças nas relatorias nos tribunais. A decisão abre caminho para uma reorganização das atribuições dos ministros.", "titulo_pt": "Fachin assume caso de Moraes e paralisa processos no STF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 158346, "titulo": "Ministros aliados de Moraes cogitam alegar suspeição de Kassio e Fux devido a el  "2026-09-13T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A contenda entre Alexandre de Moraes e André Mendonça é inédita entre ministros do STF, mas representa apenas mais um passo no quadro de degradação institucional da corte que se arrasta há anos.", "titulo_pt": "Moraes versus Mendonça: problema inédito na crise do STF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 158349, "titulo": "Mendonça tratou com Castro sobre prisão de Cabral; ministro diz que atuou apenas com base nos autos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/mendonca-tratou-com-castro-sobre-prisao-de-cabral-ministro-diz-que-atuou-apenas-com-base-nos-autos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-13T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Conversas em WhatsApp entre o ministro André Mendonça, do STF, e o ex-governador Cláudio Castro do PL mostraram discussões sobre processos de interesse de Castro. Mendonça afirmou que atuou apenas com base nos autos.", "titulo_pt": "Mendonça conversou com Castro sobre processos de interesse", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 158351, "titulo": "Na crise do STF, são dez escorpiões numa garrafa", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/eliogaspari/2026/09/na-crise-do-stf-sao-dez-escorpioes-numa-garrafa.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-13T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na crise atual do Supremo Tribunal Federal (STF), os ministros se encontram em um cenário complexo, comparado a nove escorpiões numa garrafa, com uma cadeira vazia. Atualmente, são dez ministros no tribunal.", "titulo_pt": "Na crise do STF, são nove escorpiões numa garrafa", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 158352, "titulo": "As camas do Master", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/eliogaspari/2026/09/as-camas-do-master.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-13T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Foram detalhadas as festas e eventos de Daniel Vorcaro. Durante esses eventos, eram degustados uísques e charutos.", "titulo_pt": "As camas do Master", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 158465, "titulo": "Fachin assume relatoria de ação sobre conversas entre Moraes e Vorcaro", "url": "https://www.infomoney.com.br/politica/fachin-assume-relatoria-de-acao-sobre-conversas-entre-moraes-e-vorcaro/", "fonte_id": "infomoney", "data_pub": "2026-09-13T00:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Supremo Tribunal Federal, Fachin, assumiu a relatoria de uma ação que trata das conversas entre o ministro do STF, Alexandre Moraes, e o ex-ministro do Gabinete Civil, Onyx Lorenzoni (Vorcaro). André Mendonça, anteriormente responsável pelo processo, foi tirado da relatoria neste sábado.", "titulo_pt": "Fachin assume relatoria de ação sobre conversas entre Moraes e Vorcaro", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 158354, "titulo": "Ex-senador tucano diz que votou contra Mendonça ao STF por falta de cultura e saber jurídico", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/ex-senador-tucano-diz-que-votou-contra-mendonca-ao-stf-por-falta-de-cultura-e-saber-juridico.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-13T00:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-senador José Aníbal, do PSDB-SP, votou contra a indicação de André Mendonça para o Supremo Tribunal Federal em 2021, alegando falta de cultura e saber jurídico. Ele afirma que não se arrepende dessa decisão diante da atual crise na corte.", "titulo_pt": "Ex-senador tucano diz que votou contra Mendonça ao STF por falta de cultura e saber jurídico", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 158355, "titulo": "Fachin afasta Mendonça de caso contra Moraes e manda parar apurações de Master e INSS", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/fachin-tira-de-mendonca-relatoria-de-caso-moraes-e-abre-caminho-para-assumir-inqueritos-do-master-e-inss.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-12T23:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, Edson Fachin, removeu o ministro André Mendonça da relatoria de um processo que investiga uma possível ligação entre o ministro Alexandre de Moraes e o ex-banqueiro Daniel Vorcaro. Fachin também ordenou que as apurações envolvendo o Master e o INSS parassem.", "titulo_pt": "Fachin retira Mendonça da relatoria e suspende apurações", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 158332, "titulo": "PF localizou 24 armas de fogo ao prender ex-presidente do BRB", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/pf-localizou-24-armas-de-fogo-ao-prender-ex-presidente-do-brb.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-12T23:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal encontrou 24 armas de fogo durante a 4ª fase da operação Compliance Zero, que resultou na prisão de Paulo Henrique Costa, ex-presidente do BRB, em abril.", "titulo_pt": "PF localizou 24 armas de fogo ao prender ex-presidente do BRB", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 158466, "titulo": "Mendonça defende decisão de julgar Moraes no plenário e devolve processo a Fachin", "url": "https://www.infomoney.com.br/politica/mendonca-defende-decisao-de-julgar-moraes-no-plenario-e-devolve-processo-a-fachin/", "fonte_id": "infomoney", "data_pub": "2026-09-12T22:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça defendeu a decisão de julgar o caso envolvendo o ministro do STF Alexandre Moraes no plenário do tribunal. Mendonça também devolveu o processo ao presidente da Corte, Luiz Edson Fachin.", "titulo_pt": "Mendonça defende decisão de julgar Moraes no plenário e devolve processo a Fachin", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 158356, "titulo": "Fachin dá 24 horas para PF informar sobre custódia e estado de celular de Vorcaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/fachin-da-24-horas-para-pf-informar-sobre-custodia-e-estado-de-celular-de-vorcaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-12T22:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, ministro Edson Fachin, determinou que a Polícia Federal forneça informações sobre o celular de Daniel Vorcaro apreendido em 2025, durante investigações relacionadas ao Banco Master, em até 24 horas.", "titulo_pt": "Fachin dá 24 horas para PF informar sobre celular de Vorcaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 158775, "titulo": "Salvini, a Venezia tutto tranne festival cinema,su ebrei e pro Pal serve equilibrio", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/13/salvini-a-venezia-tutto-tranne-festival-cinemasu-ebrei-e-pro-pal-serve_d24de248-f2b6-4ad9-bca4-ee35b0d5b889.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-13T09:45:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O título sugere que Salvini, líder da Lega, expressou preocupação sobre o Festival de Cinema de Veneza, exceto por sua posição em relação aos judeus. Ele também mencionou a lembrança da tragédia de 7 d  "texto_pt": "O encontro do BRICS em Nova Deli terminou com uma declaração conjunta que apelou por maior influência do Global South na governança global e pediu cautela no Oriente Médio. O encontro serviu também como uma plataforma para reuniões bilaterais entre líderes, com o objetivo de aliviar tensões regionais.", "titulo_pt": "Encontro do BRICS em nova deli: o que saiu do encontro", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 158698, "titulo": "UK: Police probe £72 million donation to Reform UK", "url": "https://www.france24.com/en/video/20260913-uk-police-probe-%C2%A372-million-donation-to-reform-uk", "fonte_id": "france24", "data_pub": "2026-09-13T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia britânica abriu uma investigação criminal em relação a uma doação de £72 milhões para o partido Reform UK, liderado por Nigel Farage, devido a questionamentos sobre se os fundos violaram regras sobre doações políticas estrangeiras. A investigação ocorre em meio a protestos anti-imigração e contraprotestos em todo o país, refletindo crescentes tensões em torno da imigração e da identidade nacional.", "titulo_pt": "Reino unido: polícia investiga doação de £72 milhões ao Reform UK", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 158494, "titulo": "O que novo presidente da Colômbia pretende com polêmicas imagens caminhando entre cadáveres", "url": "https://www.bbc.com/portuguese/articles/c14d7400emlo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-13T09:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O novo presidente da Colômbia está enviando uma mensagem forte e controversa sobre segurança através de imagens polêmicas. Essas imagens mostram o presidente caminhando entre cadáveres.", "titulo_pt": "Novo presidente da Colômbia envia mensagem forte sobre segurança através de imagens polêmicas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 158699, "titulo": "Yemen: Houthi offensive triggers new displacement crisis", "url": "https://www.france24.com/en/yemen-houthi-offensive-triggers-new-displacement-crisis", "fonte_id": "france24", "data_pub": "2026-09-13T09:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 70.000 pessoas fugiram de suas casas no Iêmen após rebeldes hutai, apoiados pelo Irã, lançarem uma ofensiva para conquistar o Estreito de Bab el-Mandeb, com muitos buscando refúgio em Aden e cerca de 1.400 atravessando para o vizinho Djibuti. A ONU e a OIM alertam que a nova onda de deslocamento está agravando uma crise humanitária já grave em um país devastado por 12 anos de guerra.", "titulo_pt": "Iêmen: ofensiva hutai gera nova crise de deslocamento", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 158865, "titulo": "Korea wins six-year arbitration battle against Chinese investor", "url": "https://www.koreaherald.com/article/10871757", "fonte_id": "korea_herald", "data_pub": "2026-09-13T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul venceu uma batalha de seis anos em arbitragem contra um investidor chinês, que finalmente teve seu pedido para reativar ações rejeitado pela Comissão Internacional para a Resolução de Disputas de Investimentos. Um comitê de anulação rejeitou o pedido do investidor Fengzhen Min, mantendo a decisão anterior que declarou seu investimento ilegal.", "titulo_pt": "Coreia do sul vence disputa de seis anos em arbitragem contra investidor chinês", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 158523, "titulo": "El día que Argentina declaró su primera cesación de pagos", "url": "https://www.clarin.com/viva/dia-argentina-declaro-primera-cesacion-pagos_0_nFW0HAT8u3.html", "fonte_id": "clarin", "data_pub": "2026-09-13T09:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em 1890, durante o governo de Miguel Juárez Celman, Argentina declarou sua primeira cesação de pagamentos. O endividamento externo em massa, a especulação financeira e a corrupção foram as causas da primeira grande crise financeira do país.", "titulo_pt": "O dia em que Argentina declarou sua primeira cesação de pagamentos", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 158587, "titulo": "How Iran’s Hard-liners Blew Up the Peace Deal with Trump", "url": "https://www.nytimes.com/2026/09/13/world/middleeast/iran-hard-liners-sabotaged-peace-deal.html", "fonte_id": "nyt_world", "data_pub": "2026-09-13T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Inimigos do acordo deram meios ocultos para atacar navios no Estreito de Ormuz, de acordo com informantes do regime. O presidente da Irã ficou furioso quando descobriu sobre isso.", "titulo_pt": "Como os Hard-liners da Irã deram meios para derrotar o acordo com o Trump", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 158589, "titulo": "Trump’s Canadian Tariffs Tear at Bond Between Twins Towns in Ontario and Michigan", "url": "https://www.nytimes.com/2026/09/13/world/canada/trump-tariffs-ontario-michigan-algoma-steel.html", "fonte_id": "nyt_world", "data_pub": "2026-09-13T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma tarifa de 50% dos Estados Unidos sobre o aço canadense está devastando uma grande fábrica em Ontario, causando demissões em massa e rompendo um século de vida compartilhada entre as cidades fronteiriças de Michigan e Ontario.", "titulo_pt": "Tarifas dos EUA sobre o aço canadense fragilizam laços entre cidades fronteiriças", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 158700, "titulo": "France apologises for diplomatic spat with US to lift block on new ambassador to Washington", "url": "https://www.france24.com/en/france/20260913-france-apologises-for-diplomatic-spat-with-us-to-lift-block-on-new-ambassador-to-washington", "fonte_id": "france24", "da
