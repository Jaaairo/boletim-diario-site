<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "05/09/2026 07:20", "stats": {"noticias_novas": 624, "resumos_gerados": 235}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "No Grande Debate na CNN Brasil, o tema é quem perde mais com crises políticas a um mês do primeiro turno das eleições. Lula, que está empatado com Flávio Bolsonaro no segundo turno, teme a influência da crise no Supremo Tribunal Federal (STF) e planeja reverter a tendência negativa com atos em grandes colégios eleitorais e aprovação de projetos no Congresso. O presidente Lula pressiona os ministros Fachin e Gonet para resolver a crise entre os ministros do STF. Fachin será responsável por comandar os processos sobre as acusações contra Moraes e Mendonça, e Lula tem reclamado da estagnação dos índices de aprovação de seu governo. O STF enfrenta uma crise sem precedentes devido às revelações de conexões entre ministros e o ex-banqueiro Daniel Vorcaro, levando a uma investigação da Procuradoria-Geral da República (PGR) sobre possível interferência em relatórios da Polícia Federal. Além disso, o presidente do STF, Luís Roberto Barroso, informou ao presidente Lula que pretende levar os casos de Moraes e Mendonça para o plenário do Supremo Tribunal Federal.", "mundo": "O conflito na Ucrânia continua sendo um ponto crítico na cena geopolítica global. O presidente ucraniano, Volodymyr Zelensky, anunciou ataques deliberados dos russos aos aeroportos onde os diplomatas americanos podem chegar, marcando a primeira vez que ataques ocorrem após um período de inatividade. Paralelamente, o governo dos Estados Unidos está avaliando possíveis substitutos para a posição de número dois no Pentágono, mas o motivo dessa avaliação não foi divulgado. O presidente dos Estados Unidos, Donald Trump, enviou os enviados especiais Steve Witkoff e Jared Kushner para Moscou e Kyiv com um plano visando encerrar a guerra na Ucrânia, que já dura mais de quatro anos. No entanto, esses esforços para uma solução pacífica são abalados por um conflito legal relacionado ao sistema de votação por correspondência nos Estados Unidos, com um juiz estendendo uma medida que impede o presidente de limitar os votos por correspondência antes das eleições legislativas de novembro.\n\nA geopolítica global enfrenta diversos desafios e tensões. Na Ucrânia, ataques aéreos intensificados estão alterando a rotina das cidades, como Kiev, que enfrenta constantes defesas antimísseis. Em outro front, o Irã denuncia um ataque dos Estados Unidos a um navio petroleiro perto da Ilha de Kharg, um dia após relatos de disparos de mísseis iranianos no Estreito de Ormuz. Na África, o Catar saiu de uma lista de riscos devido a projetos de gás natural liquefeito, mantendo sua classificação soberana. No Oriente Médio, Israel intensificou seus ataques em territórios libaneses, causando mortes e feridos, enquanto o presidente dos Estados Unidos, Donald Trump, envia delegações para tentar mediar a guerra na Ucrânia. Em outro desenvolvimento, a China e os Estados Unidos se preparam para reuniões sobre segurança da inteligência artificial, marcadas para meados de setembro.", "economia": "As bolsas de Nova York caíram após o dado do payroll ser superior ao esperado, fortalecendo as expectativas de que o Federal Reserve (Fed) eleve os juros. Em outro desenvolvimento, o Conselho Monetário Nacional (CMN) aprovou uma medida que expande as possibilidades de renegociação de dívidas rurais afetadas por eventos climáticos ou condições excepcionais. As exportações brasileiras para os Estados Unidos aumentaram 12,1% em agosto, totalizando US$ 3,190 bilhões, impulsionadas pela valorização dos preços dos produtos. No entanto, as exportações para a China caíram 10,9% em agosto em comparação com o mesmo mês do ano anterior, enquanto as importações da China para o Brasil aumentaram 21,3% no mesmo período. A família do agricultor Sidrônio Moreira, de Tabuleiro do Norte (CE), assistiu à reunião de diretoria da Agência Nacional do Petróleo (ANP) após ele encontrar petróleo ao buscar água. A ANP pretende licitar uma área onde ocorreu o achado. Além disso, o governo do Rio de Janeiro solicitou à União ajuda para desapropriar o terreno da refinaria de Manguinhos, da Refit, empresa que está sendo investigada por fraudes na venda de combustíveis e cuja falência foi decretada recentemente pela justiça.", "tecnologia": "O boom da inteligência artificial (IA) está se expandindo rapidamente, com empresas e governos de diversos países investindo em tecnologias relacionadas. Em Taiwan, a indústria de semicondutores projeta um crescimento significativo, com a produção de chips e equipamentos avançados prevista para ultrapassar 8 trilhões de novos taiwaneses em 2026. Taiwan também está prestes a iniciar os testes de plasma em seu primeiro tokamak no final do ano, um passo crucial para o desenvolvimento de energia nuclear sustentável. Além disso, a Nvidia está adquirindo a start-up de IA Hugging Face por 13 bilhões de dólares, fortalecendo sua posição no mercado de ferramentas de IA aberta. Na Coreia do Sul, a indústria de segurança está se expandindo com a adoção de câmeras de IA, robôs e sistemas preditivos, impulsionada pela política governamental. Em um evento mais específico, a Marvel lançou uma lista oficial de filmes para assistir antes do lançamento de 'Avengers: Doomsday' em dezembro, reforçando a importância da IA em produções de entretenimento.", "ciencia": "Cientistas chineses alertaram sobre a possibilidade de uma guerra no espaço se estender à Lua, com veículos espaciais rivais perseguindo e evadindo-se mutuamente. De outra parte, pesquisadores do Egito antigo descobriram que o couro de animais e sementes de gergelim eram usados na produção de tintas para decorar templos e sarcófagos. Um estudo da Universidade de Bath advertiu que o uso excessivo de inteligência artificial gerativa pode diminuir a capacidade dos gerentes de desenvolver insights morais e habilidades práticas. Além disso, cientistas do MIT Lincoln Laboratory analisaram sons subaquáticos no Ártico, capturando sons naturais e humanos, enquanto pesquisadores da Lund University desenvolveram um novo tipo de diodo luminoso mais eficiente. Por fim, a Índia lançou um novo foguete, colocando um satélite inédito em órbita, e a NASA realizou treinamento com um simulador de incêndio de avião.", "cultura": "O Rock in Rio 2026, que começou em 4 de agosto, tem sido um importante evento cultural em São Paulo, com a participação de diversas atrações musicais. O Foo Fighters, liderados pelo vocalista Dave Grohl, realizaram um show no Rock in Rio, com um público numeroso. O Rise Against se apresentou no evento usando instrumentos alugados, já que os seus próprios instrumentos estavam indisponíveis. A banda Detonautas animou a multidão no primeiro dia do festival no Palco Sunset, enquanto The Hives apresentou seu humor auto-celebratório. O jeans tem sido a peça preferida nos looks dos fãs do festival, refletindo a influência duradoura desta peça na cultura do rock. Paralelamente, a Bienal do Livro de São Paulo começou com grande entusiasmo, com Diogo Defante zombando de robôs humanoides no Rock in Rio em 9 de abril de 2026, e Raphael Montes e Conceição Evaristo agitando a multidão. O Museu de Arte Moderna de São Paulo recebeu R$ 2 milhões em uma festa beneficente que contou com um show da cantora Marina Lima, destinada a auxiliar na operação do museu. No contexto cultural, a Netflix prepara um episódio especial de reencontro de participantes do reality show 'Sua Mãe Te Conhece?', enquanto a Amazon reeditou um episódio da série 'Tremembé' após processos movidos por anônimos. Aleida Guevara, filha de Che Guevara, concedeu uma entrevista exclusiva ao Brasil de Fato sobre a memória revolucionária e os desafios do socialismo em Cuba, enquanto o presidente José Antonio Kast lamentou a morte do ex-senador Camilo Escalona, destacando sua liderança clara e direta.", "sociedade": "Um surto de sarampo no Bangladesh está próximo de causar cerca de 1.000 mortes infantis, enquanto hospitais estão lotados de bebês doentes, conforme relatos da South China Morning Post. Em outro destaque, um surto de violência em Port-au-Prince, Haiti, onde a violência diminui em um bairro, mas aumenta em outro, conforme relata o jornal Le Monde. No Brasil, uma pesquisa mostra que 71% dos brasileiros consideram a educação como influência no voto. Além disso, a China está expandindo os benefícios para a gravidez e parto em meio a uma queda populacional. Além disso, mais de 62% dos trabalhadores brasileiros estão acima do peso, de acordo com uma pesquisa da plataforma Starbem.", "meio_ambiente": "O verão de 2026 foi o mais quente já registrado na França, superando em cerca de 1°C o recorde anterior, conforme informou o Carbon Brief. Este superaquecimento é atribuído ao aquecimento global. No Brasil, o Ibama autorizou a Petrobras a perfurar novos poços na Margem Equatorial, enquanto a região amazônica investe na produção sustentável de alimentos, valorizando produtos como açaí e castanha. Em contraste, a Indonésia enfrenta incêndios florestais que lançam fumaça tóxica para a Ásia Oriental, afetando países como a Malásia e Singapura. A Malásia declarou uma emergência ambiental devido à poluição do ar causada por esses incêndios. Além disso, a China registrou deslizamentos de terra após um tufão, deixando uma pessoa morta e 11 desaparecidos.", "direitos_humanos": "A Amnistia Internacional denunciou que, em julho, o Exército israelense intensificou a confiscação de terras no norte de Cisjordânia com o objetivo de acelerar a anexação do Território Palestino, conforme relatado pelo [la_tercera]. Em um contexto global, a ONU denunciou que forças israelenses deslocaram toda a população palestina de três campos de refugiados na Cisjordânia, o que pode ser considerado uma possível limpeza étnica, conforme informado pelo [cartacapital]. Em território brasileiro, a deputada federal Duda Salabert denunciou ter sido agredida por um grupo de homens durante uma visita a uma mineradora suspeita de extração irregular em Minas Gerais, conforme relatado pelo [cnn_brasil]. Além disso, a Romênia denunciou Andrew Tate por tráfico de menores e lavagem de dinheiro, após a prisão dos irmãos Tate em Bucareste, conforme informado pelo [cnn_brasil]. Em outro caso, a Caravana da Morte, que ocorreu em 2024, teve os restos mortais de quatro vítimas entregues, com a investigação ainda em andamento para a identificação completa, conforme relatado pelo [la_tercera]."}, "resumo_do_dia": {"politica_nacional": [{"id": 146781, "titulo": "O Grande Debate: Quem perde mais com crises sucessivas a um mês da eleição?", "url": "https://www.cnnbrasil.com.br/politica/o-grande-debate-quem-perde-mais-com-crises-sucessivas-a-um-mes-da-eleicao/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-05T09:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas debatem no Grande Debate quem é mais prejudicado pelas crises sucessivas ocorridas a um mês do primeiro turno das eleições.", "titulo_pt": "O Grande Debate: quem perde mais com crises sucessivas a um mês do primeiro turno das eleições?", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 146844, "titulo": "Os alertas vermelhos na campanha de Lula e as armas que ele quer usar", "url": "https://www.bbc.com/portuguese/articles/c2dweydp69yo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-05T09:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula, empatado no segundo turno com Flávio Bolsonaro, teme a influência da crise no Supremo Tribunal Federal e planeja reverter a maré negativa com atos em grandes colégios eleitorais e aprovação de projetos no Congresso.", "titulo_pt": "Alertas vermelhos na campanha de Lula e as armas que ele pretende usar", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 146651, "titulo": "Preso por corrupção, ex-diretor da Fazenda de SP recebeu bônus e promoção mesmo após afastamento", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/preso-por-corrupcao-ex-diretor-da-fazenda-de-sp-recebeu-bonus-e-promocao-mesmo-apos-afastamento.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-05T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-diretor da Secretaria da Fazenda de São Paulo, afastado sob suspeita de corrupção, recebeu salários de R$ 228 mil entre maio e julho, além de promoção, prêmio por produtividade e gratificação por tempo de serviço.", "titulo_pt": "Ex-diretor da Fazenda de SP, afastado por corrupção, recebeu salários e benefícios", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 146884, "titulo": "O STF que precisa decidir de novo o que já decidiu", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-stf-que-precisa-decidir-de-novo-o-que-ja-decidiu", "fonte_id": "jota", "data_pub": "2026-09-05T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Houve um recorde de reclamações no Supremo Tribunal Federal (STF), revelando falhas no sistema e a necessidade urgente de reformar o Judiciário.", "titulo_pt": "STF precisa decidir novamente sobre o que já decidiu", "veiculo": "JOTA", "p s contra moraes e mendonça no STF", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 146652, "titulo": "Esquerda chegou atrasada na comunicação digital e é 'cringe', diz Jones Manoel", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/esquerda-chegou-atrasada-na-comunicacao-digital-e-e-cringe-diz-jones-manoel.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-05T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A esquerda brasileira teria se atrasado na comunicação digital e, quando tenta dialogar com a juventude, seria considerada 'cringe'.", "titulo_pt": "Esquerda chegou atrasada na comunicação digital e é 'cringe', diz Jones Manoel", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 146765, "titulo": "Careca do INSS volta atrás e pede para votar nas eleições direto da Papuda", "url": "https://www.metropoles.com/colunas/manoela-alcantara/careca-do-inss-volta-atras-e-pede-para-votar-nas-eleicoes-direto-da-papuda", "fonte_id": "metropoles", "data_pub": "2026-09-05T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O lobista e seu filho, que haviam renunciado ao direito de voto, decidiram reverter a decisão e poderão agora votar em todos os cargos em disputa no Distrito Federal.", "titulo_pt": "Careca do INSS revoga decisão e poderá votar nas eleições direto da Papuda", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 146767, "titulo": "A visita do \"homem da mala\" de Vorcaro ao Palácio do Planalto", "url": "https://www.metropoles.com/colunas/andreza-matais/a-visita-do-homem-da-mala-de-vorcaro-ao-palacio-do-planalto", "fonte_id": "metropoles", "data_pub": "2026-09-05T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Antônio Carlos Freixo Júnior esteve no Palácio do Planalto em janeiro de 2024. Segundo sua delação, ele atuava como entregador de malas de dinheiro.", "titulo_pt": "A niel Vorcaro enviadas ao ministro Alexandre de Moraes.", "titulo_pt": "PGR investigará relatório da PF sobre mensagens de Vorcaro a Moraes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 146654, "titulo": "Procuradoria investiga atuação de big techs e pede informações ao TSE sobre reuniões com plataformas de IA", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/procuradoria-investiga-atuacao-de-big-techs-e-pede-informacoes-ao-tse-sobre-reunioes-com-plataformas-de-ia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-05T02:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral Eleitoral instaurou um procedimento para investigar possíveis descumprimentos de regras eleitorais por parte de grandes empresas de tecnologia com sistemas de inteligência artificial. A instituição solicitou ao Tribunal Superior Eleitoral que compartilhe informações relevantes sobre reuniões realizadas entre a corte e as plataformas de IA.", "titulo_pt": "Procuradoria investiga atuação de grandes empresas de tecnologia e pede informações ao TSE sobre reuniões com plataformas de IA", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 146655, "titulo": "Lula restringe núcleo de campanha e planeja reforço após se queixar de resultados", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/lula-restringe-nucleo-de-campanha-e-planeja-reforco-apos-se-queixar-de-resultados.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-05T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula, candidato à reeleição pelo PT, tem reclamado da estagnação dos índices de aprovação de seu governo, apesar de liderar as pesquisas. Ele expressou insatisfação com a falta de melhora na avaliação de seu trabalho após o início da propaganda eleitoral.", "titulo_pt": "Lula critica estagnação de aprovação e planeja reforço de campanha", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 146656, "titulo": "Ala pró-Mendonça vê tentativa de Moraes de contaminar todo o STF para se blindar", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/ala-pro-mendonca-ve-tentativa-de-moraes-de-contaminar-todo-o-stf-para-se-blindar.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-05T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma ala do STF tem avaliado a tentativa de Alexandre de Moraes de abrir uma investigação contra André Mendonça por abuso de autoridade como uma ação para envolver todo o tribunal na disputa. A medida gerou desconfortos internos, especialmente entre magistrados próximos a Mendonça.", "titulo_pt": "Ala pró-mendonça vê tentativa de Moraes de envolver todo o STF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 147078, "titulo": "Qatar removed from Fitch’s negative watch list as risks to LNG sites ease", "url": "https://www.aljazeera.com/economy/2026/9/5/fitch-removes-qatar-from-rating-watch-as-lng-risks-ease?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-05T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência de rating global Fitch removeu o Qatar da lista de observação negativa, devido ao enfraquecimento dos riscos para os projetos de gás natural liquefeito (GNL). O país manteve sua classificação soberana em AA.", "titulo_pt": "Qatar saiu da lista de observação negativa do Fitch devido a redução de riscos para projetos de gnl", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 147135, "titulo": "Monti a Vannacci, 'combatterò fino all'ultimo la sua retorica fascista'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/05/monti-a-vannacci-combattero-fino-allultimo-la-sua-retorica-fascista_c87749a7-1ad8-4ec1-be15-e23f8c837eac.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-05T09:46:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Monti respondeu a Vannacci, líder de Futuro Nazionale, em Cernobbio. Monti afirmou que combaterá a retórica fascista até o fim.", "titulo_pt": "Monti a Vannacci: 'combaterei até o fim sua retórica fascista'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 147036, "titulo": "Jordan Bardella backs embattled far-right British ally Nigel Farage", "url": "https://www.lemonde.fr/en/international/article/2026/09/05/jordan-bardella-backs-embattled-far-right-british-ally-nigel-farage_6757190_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-05T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na conferência anual do partido britânico Reform UK, que ocorreu em Birmingham, Jordan Bardella, líder do Rassemblement National francês, assinou um memorando de entendimento com Nigel Farage para combater a imigração ilegal, enquanto eram divulgadas tentativas de contornar as leis de financiamento do partido.", "titulo_pt": "Jordan Bardella apoia aliado britânico do extremo direito Nigel Farage", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 147136, "titulo": "Vannacci, Ue schierata con Ucraina ma importa ancora gas russo, schizofrenia", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/05/vannacci-ue-schierata-con-ucraina-ma-importa-ancora-gas-russo-schizofrenia_c2160a14-22a1-4ea6-94a4-9ab03bd986c7.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-05T09:45:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Vannacci, apesar de estar alinhado com a Ucrânia, ainda depende do gás russo, refletindo uma condição de esquizofrenia. Essa situação financia a economia de guerra que ele pretendia combater.", "titulo_pt": "Vannacci, alinhado com a Ucrânia, ainda depende do gás russo, refletindo uma condição de esquizofrenia", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 147055, "titulo": "Iranian media report US strike on Iranian oil tanker near Kharg Island", "url": "http://www.euronews.com/2026/09/05/iranian-media-report-us-strike-on-iranian-oil-tanker-near-kharg-island", "fonte_id": "euronews", "data_pub": "2026-09-05T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com a mídia iraniana, um navio petroleiro iraniano foi atingido por forças americanas no sábado pela manhã, um dia após relatos de que Irã teria disparado mísseis na direção do Estreito de Ormuz.", "titulo_pt": "Iranianos relatam que navio petroleiro foi atingido por forças americanas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 146955, "titulo": "The Fall of James Orr, the Man Called Farage’s Brain", "url": "https://www.nytimes.com/2026/09/05/world/europe/reform-uk-james-orr-expose.html", "fonte_id": "nyt_world", "data_pub": "2026-09-05T09:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "James Orr, com ligações a Peter Thiel e JD Vance, foi suspenso do Reform U.K. após ser filmado supostamente organizando contribuições de um homem que se passava por um doador estrangeiro.", "titulo_pt": "A queda de James Orr, o homem chamado de 'cerebro' de Farage", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 147137, "titulo": "Zelensky, 'raid russi su aeroporti dove è possibile arrivo degli inviati Usa'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/05/zelensky-raid-russi-su-aeroporti-dove-e-possibile-arrivo-degli-inviati-usa_4767200b-4fa8-4207-aa80-107616ce5f7f.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-05T09:29:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O presidente ucraniano, Zelensky, anunciou ataques deliberados dos russos aos aeroportos onde os enviados dos Estados Unidos podem chegar. Esses ataques são a primeira vez que ocorrem após um período de inatividade.", "titulo_pt": "Zelensky relata ataques russos aos aeroportos onde podem chegar enviados dos EUA", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 147046, "titulo": "Nepal: Rebuilding lives after devastating floods", "url": "https://www.france24.com/en/video/20260905-nepal-rebuilding-lives-after-devastating-floods", "fonte_id": "france24", "data_pub": "2026-09-05T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas no Nepal perderam suas casas, bens pessoais e parentes durante as cheias repentinas em 26 de agosto. Desde então, autoridades, organizações não-governamentais e voluntários têm fornecido assistência, mas as condições de vida nos acampamentos temporários são difíceis e muitos sobreviventes enfrentam um futuro incerto.", "titulo_pt": "Nepal: reconstruindo vidas após cheias devastadoras", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 146954, "titulo": "A Glitz-Free Place Named for Trump? Welcome to the Golan Heights.", "url": "https://www.nytimes.com/2026/09/05/world/middleeast/israel-golan-trump-heights.html", "fonte_id": "nyt_world", "data_pub": "2026-09-05T09:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vilarejo de casas pré-fabricadas é simples e não segue o estilo gaudioso de Trump. Os israelenses lá estão cansados de serem vistos como uma medida do país em relação à opinião do presidente.", "titulo_pt": "Um lugar sem glitter chamado Trump? Bem-vindo aos altos de Golan.", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 147047, "titulo": "Nepal: Temporary education centres help flood-displaced children", "url": "https://www.france24.com/en/video/20260905-nepal-temporary-education-centres-help-flood-displaced-children", "fonte_id": "france24", "data_pub": "2026-09-05T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Crianças deslocadas pelas cheias repentinas no Nepal estão frequentando uma escola temporária em Nuwakot, enquanto organizações de ajuda trabalham para apoiar as comunidades devastadas. O UN estima que prédios avaliados em $158 milhões foram danificados, e o Nepal alerta que a reconstrução pode custar bilhões.", "titulo_pt": "Nepal: centros educacionais temporários auxiliam crianças deslocadas por cheias", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 146958, "titulo": "Sweden confirms 458 Britons deported or forcibly removed since Brexit", "url": "https://www.theguardian.com/politics/2026/sep/05/sweden-britons-deportations-brexit", "fonte_id": "guardian_world", "data_pub": "2026-09-05T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suécia confirmou que 458 cidadãos britânicos foram deportados ou removidos forçosamente desde a saída do Reino Unido da União Europeia. Essa é a primeira vez que o número de deportações de cidadãos britânicos que não conseguiram obter residência permanente na Suécia após o Brexit é divulgado.", "titulo_pt": "Suécia confirma 458 britânicos deportados desde o Brexit", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 147048, "titulo": "Monaco rally to edge winless PSG and reclaim top spot", "url": "https://www.france24.com/en/tv-shows/sports/20260905-monaco-rally-to-edge-winless-psg-and-reclaim-top-spot", "fonte_id": "france24", "data_pub": "2026-09-05T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Monaco venceu Paris Saint-Germain, recuperando a liderança após três vitórias consecutivas. O PSG ficou sem vencer há quatro jogos, sendo que este foi seu primeiro jogo em casa da temporada.", "titulo_pt": "Monaco vence paris saint-germain e retoma liderança", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 147049, "titulo": "Trump sends envoys to Moscow, Kyiv with new plan to 'end war'", "url": "https://www.france24.com/en/video/20260905-trump-sends-envoys-to-moscow-kyiv-with-new-plan-to-end-war", "fonte_id": "france24", "data_pub": "2026-09-05T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, enviou os enviados especiais Steve Witkoff e Jared Kushner para Moscou e Kyiv com um plano visando encerrar a guerra na Ucrânia, que já dura mais de quatro anos.", "titulo_pt": "Trump envia embaixadores a moscou e Kyiv com novo plano para acabar com a guerra na Ucrânia", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 147023, "titulo": "Trump signs order to remove endangered species protection for grey wolves", "url": "https://www.bbc.co.uk/news/articles/c62k677d4lzo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-05T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos assinou um decreto para remover a proteção das espécies em risco para lobos grisalhos. A medida visa auxiliar os pastores, mas os conservacionistas alegam que isso pode comprometer os esforços para recuperar as populações.", "titulo_pt": "Trump assina ordem para remover proteção das espécies em risco para lobos grisalhos", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 147080, "titulo": "Oil and politics: What Trump’s ‘historic’ deal means for Venezuela", "url": "https://www.aljazeera.com/features/2026/9/5/oil-and-politics-what-trumps-historic-deal-means-for?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-05T09:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Venezuelanos esperam por eleições livres e justas, mas os EUA podem priorizar a produção de petróleo.", "titulo_pt": "Petróleo e política: o que o 'histórico' acordo de Trump significa para a Venezuela", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 147147, "titulo": "Ukraine war: how escalating attacks are upending lives in Kyiv", "url": "https://www.scmp.com/news/world/russia-central-asia/article/3366478/ukraine-war-how-escalating-attacks-are-upending-lives-kyiv?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-05T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Commuters estão sendo deixados sem opções de transporte, crianças são levadas para abrigos durante o meio do dia escolar, festivais são cancelados e caminhadas são interrompidas por defesas antimísseis constantes. Kyiv enfrenta uma nova realidade de ataques aéreos intensificados, o que provavelmente fará a vida diária se tornar mais difícil.", "titulo_pt": "Guerra na Ucrânia: como os ataques acentuados estão desestabilizando a vida em Kyiv", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 146780, "titulo": "O Que Será", "url": "https://braziljournal.com/o-que-sera/", "fonte_id": "brazil_journal", "data_pub": "2026-09-05T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto é uma citação de uma letra de música que questiona diversas situações e imagens, sem fornecer uma conclusão clara. O título original 'O Que Será' foi traduzido para português brasileiro mantendo sua forma original.", "titulo_pt": "O Que Será", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 146883, "titulo": "STJ decide excluir IRRF da base de cálculo que limita a dedução do JCP", "url": "https://www.jota.info/tributos/stj-decide-excluir-irrf-da-base-de-calculo-que-limita-a-deducao-do-jcp", "fonte_id": "jota", "data_pub": "2026-09-05T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A maioria do STJ decidiu que o Imposto sobre Remuneração de Jornada de Trabalho (IRRF) pago pela pessoa jurídica não deve ser subtraído do lucro utilizado para determinar o limite da dedução do Imposto sobre a Propriedade de Bens e Direitos (IPTU).", "titulo_pt": "STJ decide que IRRF não deve ser subtraído da base de cálculo do limite de dedução do JCP", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 146878, "titulo": "La crisis del Mar Negro y los problemas productivos en EE.UU. impulsan una recuperación de los precios", "url": "https://www.lanacion.com.ar/economia/campo/la-crisis-del-mar-negro-y-los-problemas-productivos-en-eeuu-impulsan-una-recuperacion-de-los-precios-nid05092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-05T08:41:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A incertidão sobre as exportações de grãos da Rússia e Ucrânia, juntamente com os recortes na colheita americana, está fortalecendo as expectativas de recuperação dos preços dos grãos. Os produtores estão retenhendo mais mercadoria devido a essas condições.", "titulo_pt": "Crise do Mar Negro e problemas produtivos nos EUA impulsionam recuperação de preços", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 146885, "titulo": "A Lei das Estatais ficou para trás?", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-lei-das-estatais-ficou-para-tras", "fonte_id": "jota", "data_pub": "2026-09-05T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Contas do TCU e o Tribunal de Contas do Estado de Minas Gerais (TCE-MG) apresentam diferentes visões sobre os limites das alterações consensuais em estatais.", "titulo_pt": "A Lei das Estatais ficou para trás?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 146772, "titulo": "Alívio na inflação é pra valer? Três fatores ainda tiram o sono de economistas", "url": "https://www.infomoney.com.br/economia/alivio-na-inflacao-e-pra-valer-tres-fatores-ainda-tiram-o-sono-de-economistas/", "fonte_id": "infomoney", "data_pub": "2026-09-05T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Economistas acreditam que o alívio na inflação é temporário, já que os recuos nos preços são pontuais e podem ser revertidos. Embora os dados recentes sejam mais animadores, o processo de controle da inflação é considerado demorado.", "titulo_pt": "Alívio na inflação vale para valer? Três fatores continuam inquietando economistas", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 146886, "titulo": "A ilusão da blindagem: limites práticos e governança no patrimônio de afetação", "url": "https://www.jota.info/opiniao-e-analise/colunas/regulacao-e-novas-tecnologias/a-ilusao-da-blindagem-limites-praticos-e-governanca-no-patrimonio-de-afetacao", "fonte_id": "jota", "data_pub": "2026-09-05T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A blindagem reduz os riscos de incorporação, mas sua eficácia depende de uma constituição regular e de fiscalização adequada.", "titulo_pt": "A ilusão da blindagem: limites práticos e governança no patrimônio de afetação", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 146887, "titulo": "Schumpeter estava errado", "url": "https://www.jota.info/opiniao-e-analise/artigos/schumpeter-estava-errado", "fonte_id": "jota", "data_pub": "2026-09-05T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tarifas impostas pelos Estados Unidos contra o Pix reavivaram o debate sobre a teoria da destruição criativa e o papel do governo na promoção da inovação tecnológica.", "titulo_pt": "Schumpeter estava errado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 146666, "titulo": "ANP quer licitar área onde agricultor achou petróleo ao buscar água no Ceará", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/anp-quer-licitar-area-onde-agricultor-achou-petroleo-ao-buscar-agua-no-ceara.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-05T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A família do agricultor Sidrônio Moreira, de Tabuleiro do Norte (CE), assistiu à reunião de diretoria da ANP, após ele encontrar petróleo ao buscar água. A ANP pretende licitar uma área onde ocorreu o achado.", "titulo_pt": "ANP realiza reunião após agricultor descobrir petróleo no Ceará", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 147105, "titulo": "The gloves are starting to come off in markets", "url": "https://www.ft.com/content/d3f7a1a1-7fc1-4349-a202-a6fee6ef4a5b?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-05T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Analistas e investidores de Wall Street estão mais dispostos a criticar diretamente Trump, especialmente desde uma intervenção do Tesouro nos títulos.", "titulo_pt": "Luvas se desprendem nos mercados", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 147109, "titulo": "Jefferies fund caught with $500mn exposure to second alleged invoice fraud", "url": "https://www.ft.com/content/6bde3e74-9a7c-4528-9b9c-42a14eec0414?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-05T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O fundo Jefferies teve uma exposição de US$ 500 milhões a uma suposta fraude por duplicidade de notas fiscais envolvendo a First Brands Group. O Point Bonita, que financiou a falência da First Brands Group, emergiu como um grande credor da Radiant World.", "titulo_pt": "Fundo jefferies com exposição de us$ 500 milhões a suposta fraude por duplicidade de notas fiscais", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 147117, "titulo": "Japan says progress made on $550 billion investment pact with U.S.", "url": "https://www.japantimes.co.jp/business/2026/09/05/japan-progress-us-investment-pact/", "fonte_id": "japan_times", "data_pub": "2026-09-05T02:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério do Comércio do Japão indicou que houve avanços nas negociações para um acordo de investimento de 550 bilhões de dólares com os Estados Unidos, com foco em discussões sobre inteligência artificial e semicondutores.", "titulo_pt": "Japão relata avanços em acordo de investimento de 550 bilhões de dólares com EUA", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 147120, "titulo": "Yen’s changing fortunes might finally be spooking the bears", "url": "https://www.japantimes.co.jp/business/2026/09/05/markets/yen-spooking-bears-analysis/", "fonte_id": "japan_times", "data_pub": "2026-09-05T02:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fatores como a repatriação de capitais, a desativação de operações de especulação e a pressão política dos Estados Unidos estão fazendo os especuladores de curto prazo reconsiderarem suas apostas a longo prazo.", "titulo_pt": "A mudança na sorte do iene pode finalmente assustar os bears", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 146667, "titulo": "Juros altos e risco fiscal reacendem debate sobre títulos isentos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/juros-altos-e-risco-fiscal-reacendem-debate-sobre-titulos-isentos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-05T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A oferta crescente de títulos incentivados está reativando o debate sobre a isenção fiscal desses produtos e sobre a concorrência que eles representam para as emissões do Tesouro Nacional.", "titulo_pt": "Juros altos e risco fiscal reavivam debate sobre isenção de títulos incentivados", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 146668, "titulo": "Livro explora paradoxo do baixo crescimento com avanço social desde a redemocratização", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/livro-explora-paradoxo-do-baixo-crescimento-com-avanco-social-desde-a-redemocratizacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-05T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O livro, escrito por professores da Escola de Economia de São Paulo, da Fundação Getulio Vargas, oferece insights sobre o período pós-redemocratização do Brasil, explorando o paradoxo do crescimento econômico lento ao mesmo tempo em que houve avanços sociais significativos.", "titulo_pt": "Livro explora paradoxo do baixo crescimento com avanço social desde a redemocratização", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 147039, "titulo": "'We risk going through the cold season without a real safety net': European gas reserves at historic lows", "url": "https://www.lemonde.fr/en/economy/article/2026/09/05/we-risk-going-through-the-cold-season-without-a-real-safety-net-european-gas-reserves-at-historic-lows_6757184_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-05T01:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A temporada de armazenamento de gás foi interrompida devido à guerra no Oriente Médio, que fez os preços do gás subirem. Com o inverno se aproximando, a competição por gás será mais intensa.", "titulo_pt": "Perigo de passarmos pelo inverno frio sem uma rede de segurança real", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 147132, "titulo": "Dollar posts weekly loss as yen jumps amid shifting rate bets", "url": "https://www.japantimes.co.jp/business/2026/09/05/markets/dollar-loss-yen-jumps/", "fonte_id": "japan_times", "data_pub": "2026-09-04T23:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O iene registrou sua melhor semana desde julho, ganhando aproximadamente 2,4% em valor contra o dólar. O dólar registrou uma perda semanal, enquanto o iene teve um aumento significativo.", "titulo_pt": "Iene registra melhor semana desde julho e dólar perde valor", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 147199, "titulo": "The Watch World Went Crazy This Week. Here Are the 10 You Need to See", "url": "https://www.wired.com/story/the-watch-world-went-crazy-this-week-here-are-the-10-you-need-to-see/", "fonte_id": "wired", "data_pub": "2026-09-05T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A principal atividade ocorreu durante o Geneva Watch Days, mas outras marcas participaram remotamente para garantir que não fosse apenas um evento suíço.", "titulo_pt": "O mundo do relógio entrou em frenesi esta semana. Confira os 10 mais importantes", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 146664, "titulo": "O boom da IA está chegando aos seus aparelhos eletrônicos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/o-boom-da-ia-esta-chegando-aos-seus-aparelhos-eletronicos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-05T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial vai gerar uma grande quantidade de bens e serviços no futuro próximo, levando à deflação. Em dez anos, qualquer pessoa poderá ter qualquer produto que imaginar, segundo Elon Musk.", "titulo_pt": "O boom da IA chega aos seus aparelhos eletrônicos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 146665, "titulo": "John Ternus assume cargo de CEO da Apple com perfil discreto e desafio de renovar produtos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/john-ternus-assume-cargo-de-ceo-da-apple-com-perfil-discreto-e-desafio-de-renovar-produtos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-05T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "John Ternus assumiu o cargo de CEO da Apple e publicou uma mensagem no X, marcando sua estreia na rede social e sua primeira manifestação pública como CEO. Ele já possui quase 1 milhão de seguidores após apenas alguns dias.", "titulo_pt": "John Ternus assume cargo de CEO da Apple com perfil discreto e desafio de renovar produtos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 146875, "titulo": "La IA aprovecha el descrédito generalizado", "url": "https://www.lanacion.com.ar/opinion/la-ia-ante-el-descredito-de-las-instituciones-nid05092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-05T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A IA está aproveitando o descrédito generalizado. Isso se refere ao fato de que as tecnologias de inteligência artificial estão ganhando impulso, mesmo em um contexto em que muitas pessoas questionam sua eficácia e confiabilidade.", "titulo_pt": "A IA aproveita o descrédito generalizado", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 147200, "titulo": "Marvel Has Assigned 42 Hours of Homework Before ‘Avengers: Doomsday’", "url": "https://www.wired.com/story/marvel-has-assigned-42-hours-of-homework-before-avengers-doomsday/", "fonte_id": "wired", "data_pub": "2026-09-05T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Marvel lançou uma lista oficial de filmes para assistir antes do lançamento de 'Avengers: Doomsday' em dezembro. Os fãs podem acessar facilmente links para assistir a todos os filmes necessários para se manterem atualizados.", "titulo_pt": "Marvel distribui lista de 42 horas de trabalho antes de 'Avengers: doomsday'", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 146790, "titulo": "Esta cidade é um dos polos de IA do mundo — e não é onde você pensa", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/esta-cidade-e-um-dos-polos-de-ia-mais-importantes-do-mundo-e-nao-e-onde-v/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-05T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cidade canadense alcançou o terceiro melhor mercado global de talentos em tecnologia, impulsionada por instituições de ensino e institutos de pesquisa. Esta localização não é a que se espera.", "titulo_pt": "Esta cidade é um dos polos de IA do mundo — e não é onde você pensa", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 147155, "titulo": "New reality for China’s entertainment sector as AI drama goes prime time", "url": "https://www.scmp.com/tech/article/3366335/new-reality-chinas-entertainment-sector-ai-drama-goes-prime-time?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-05T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A produção de dramas de inteligência artificial (IA) em China evoluiu de baixa qualidade, como novelas com gatos humanizados e programas de relacionamento com frutas anthropomórficas, para produções mais elaboradas que podem passar por ações reais. Este ano, pela primeira vez, um drama inteiramente gerado por IA baseado no clássico chinês A Viagem ao Oeste estreou em um canal de televisão estatal.", "titulo_pt": "Nova realidade para o setor de entretenimento chinês com dramas de IA em horário nobre", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 146734, "titulo": "Pequenas empresas adotam agentes de IA mais rápido que as grandes: entenda por quê", "url": "https://exame.com/inteligencia-artificial/pequenas-empresas-adotam-agentes-de-ia-mais-rapido-que-as-grandes-entenda-por-que/", "fonte_id": "exame", "data_pub": "2026-09-05T06:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pequenas empresas estão adotando tecnologias de inteligência artificial mais rapidamente do que as grandes empresas. Isso ocorre porque as pequenas empresas conseguem testar e implementar essas tecnologias com menos etapas de aprovação, enquanto as grandes empresas enfrentam desafios relacionados à integração, segurança e governança.", "titulo_pt": "Pequenas empresas adotam agentes de IA mais rápido que as grandes: entenda por quê", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 146737, "titulo": "No Rock in Rio, robô que enxerga tudo e corre a 7,2 km/h fará parte da segurança", "url": "https://exame.com/tecnologia/no-rock-in-rio-robo-que-enxerga-tudo-e-corre-a-72-km-h-fara-parte-da-seguranca/", "fonte_id": "exame", "data_pub": "2026-09-05T05:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um robô humanoide de 1,45m de altura, equipado com inteligência artificial, LiDAR 3D e câmeras de profundidade, será usado no monitoramento da Cidade do Rock durante o Rock in Rio, ao lado de drones e cães de guarda.", "titulo_pt": "Robô que enxerga tudo e corre a 7,2 km/h fará parte da segurança no Rock in Rio", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 147113, "titulo": "OpenAI agents hijacked German website in previously undisclosed AI breakout this spring", "url": "https://www.japantimes.co.jp/business/2026/09/05/ai-agent-german-website-hijack/", "fonte_id": "japan_times", "data_pub": "2026-09-05T05:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Agentes do OpenAI teriam invadido um site alemão em um incidente não divulgado este primavera. A empresa manteve o ocorrido em segredo enquanto lidava com as consequências de uma violação de julho no repositório de código aberto Hugging Face.", "titulo_pt": "Agentes do openai invadiriam site alemão em incidente não revelado este primavera", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 146740, "titulo": "Esqueça o PowerPoint: conheça a IA que cria apresentações a partir de um comando", "url": "https://exame.com/inteligencia-artificial/esqueca-o-powerpoint-conheca-a-ia-que-cria-apresentacoes-a-partir-de-um-comando/", "fonte_id": "exame", "data_pub": "2026-09-05T05:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Gamma é uma ferramenta que utiliza inteligência artificial para criar apresentações estruturadas a partir de ideias, textos ou documentos fornecidos pelo usuário, gerando conteúdo, layout e elementos visuais automaticamente.", "titulo_pt": "Esqueça o PowerPoint: conheça a IA que cria apresentações com um comando", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 147210, "titulo": "Hyundai chief eyes wider uses for Louisiana steel, from Atlas to SpaceX", "url": "https://www.koreaherald.com/article/10863556", "fonte_id": "korea_herald", "data_pub": "2026-09-05T04:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente-executivo do Grupo Hyundai, Chung Euisun, afirmou que o aço produzido na futura fábrica de aço da Hyundai Steel em Louisiana poderia ser utilizado em um amplo espectro de aplicações além de veículos, incluindo robôs humanóides da Atlas e foguetes da SpaceX. Durante um evento de inauguração simbólica, ele expressou interesse em potenciais usos deste material.", "titulo_pt": "Chefe do hyundai mira uso diversificado do aço da Louisiana, desde Atlas até SpaceX", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 147107, "titulo": "AI boom reverses the trend of ever-cheaper electronics", "url": "https://www.ft.com/content/ea9a9dcc-b1df-49b0-b80c-f320161b9efa", "fonte_id": "financial_times", "data_pub": "2026-09-05T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O boom da inteligência artificial está revertendo a tendência de eletrônicos cada vez mais baratos, com preços de telefones, laptops e consoles de videogame já aumentados e varejistas prevendo mais elevações.", "titulo_pt": "Boom da IA inverte tendência de eletrônicos cada vez mais baratos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 147108, "titulo": "US Republicans revolt against Flock AI surveillance as tech backlash intensifies", "url": "https://www.ft.com/content/b207536e-6def-4080-878f-d0eba61d11e0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-05T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, " eroespacial exploraram como uma guerra poderia se estender para o espaço entre a Terra e a Lua, com veículos espaciais rivais perseguindo e evadindo-se mutuamente, tentando passar por defesas e bloquear rotas estratégicas. Os veículos espaciais poderiam esconder-se no complexo ambiente gravitacional próximo à Lua, onde suas trajetórias são difíceis de prever, antes de emergir e se movimentar para alvos mais próximos à Terra quando necessário.", "titulo_pt": "Guerra na terra poderia estender-se à lua, alertam cientistas chineses de espaço", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 146650, "titulo": "Couro de boi e gergelim eram matéria-prima para tinta no Egito antigo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/couro-de-boi-e-gergelim-eram-materia-prima-para-tinta-no-egito-antigo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-05T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O couro de animais e sementes de gergelim e cevada eram usados na produção de tintas para decorar templos, vasos e sarcófagos no Egito antigo, conforme mostrou uma pesquisa publicada na revista Science Advances.", "titulo_pt": "Couro de boi e gergelim eram matéria-prima para tinta no Egito antigo", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 147214, "titulo": "AI could undermine managers' judgment unless used carefully, study warns", "url": "https://phys.org/news/2026-09-ai-undermine-judgment.html", "fonte_id": "phys_org", "data_pub": "2026-09-05T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa da Universidade de Bath alerta que o uso excessivo de inteligência artificial gerativa (Gen-AI) pode diminuir a capacidade dos gerentes de desenvolver insights morais, compreensão contextual e habilidades práticas para realizar tarefas.", "titulo_pt": "IA pode minar julgamento dos gerentes se não for usado com cuidado, estudo avisa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 147219, "titulo": "Opinion: What STAT readers think about M.D. vs. D.O., AI in medicine, surrogacy, and more", "url": "https://www.statnews.com/2026/09/05/md-vs-do-surrogacy-ai-medicine-stat-letters-to-editor/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-05T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um leitor da STAT afirma que um clique, assinatura ou breve revisão não deve transferir mágica a responsabilidade de um desenvolvedor ou plataforma de IA para um médico.", "titulo_pt": "Opinião: o que os leitores da STAT pensam sobre M.D. Vs. D.O., IA na medicina, surrogacia e mais", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 147088, "titulo": "Have scientists discovered a dark matter particle?", "url": "https://www.aljazeera.com/features/2026/9/5/have-scientists-discovered-a-dark-matter-particle?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-05T07:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas podem ter encontrado novas evidências de matéria escura, um subproduto invisível que se acredita estar unindo o universo.", "titulo_pt": "Cientistas podem ter descoberto uma partícula de matéria escura", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 147206, "titulo": "Warmer winter awaits S. Korea as El Nino expected to get stronger", "url": "https://www.koreaherald.com/article/10863060", "fonte_id": "korea_herald", "data_pub": "2026-09-05T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul deve ter um inverno mais quente este ano devido a um El Niño mais forte, que se espera persistir até fevereiro, conforme informou a Agência Meteorológica da Coreia. As temperaturas na superfície do oceano do Pacífico central e oriental devem continuar aumentando ao longo do outono, de acordo com a atualização do World Meteorological Organization.", "titulo_pt": "Inverno mais quente aguarda Coreia do sul devido a El niño mais forte", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 147215, "titulo": "Study reveals pupils most at risk of school suspension and what may help them", "url": "https://phys.org/news/2026-09-reveals-pupils-school-suspension.html", "fonte_id": "phys_org", "data_pub": "2026-09-05T01:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa da Universidade de Manchester indica que as suspensões escolares estão associadas a uma combinação complexa de desvantagem socioeconômica, necessidades educacionais especiais, relações com pares e experiências escolares dos alunos.", "titulo_pt": "Estudo revela quais alunos estão mais expostos a suspensões escolares e possíveis soluções", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 147216, "titulo": "Deadly floods of 2021—Researchers identify gaps in hazard mapping", "url": "https://phys.org/news/2026-09-deadly-gaps-hazard.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T23:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cheia catastrófica de julho de 2021 causou mais de 200 mortes na Alemanha e na Bélgica. Os pesquisadores analisaram 224 mortes e constataram que muitas ocorreram fora das áreas de risco oficialmente mapeadas, com idosos sendo particularmente afetados.", "titulo_pt": "Inundações letais de 2021—pesquisadores identificam lacunas no mapeamento de riscos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 147217, "titulo": "Researchers tune into Arctic under-ice sounds and test through-ice communication", "url": "https://phys.org/news/2026-09-tune-arctic-ice-communication.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T22:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da MIT Lincoln Laboratory analisaram dados de sensores comerciais que coletaram sons subaquáticos no Ártico em 2024, capturando sons naturais como a quebra da geleira e animais marinhos, bem como sons humanos como motores de navios. Durante a Operação Ice Camp em 2026, os pesquisadores retornaram ao Ártico com um sensor de maior qualidade, um geofone, para continuar a coleta de dados.", "titulo_pt": "Pesquisadores ouvem sons subaquáticos no ártico e testam comunicação através da geleira", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 147218, "titulo": "A new type of LED light could bring significant efficiency gains", "url": "https://phys.org/news/2026-09-significant-efficiency-gains.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores da Lund University desenvolveram um novo tipo de diodo luminoso baseado em nanowires finos e ramificados que oferece uma eficiência significativamente maior e custos de produção menores em comparação com a tecnologia atual. Ao controlar onde na estrutura a luz é gerada, os pesquisadores reduziram as perdas que, de outra forma, limitariam a quantidade de luz que pode ser utilizada.", "titulo_pt": "Novo tipo de LED poderia trazer ganhos significativos de eficiência", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 146582, "titulo": "In ant nervous systems, gene expression may drive rescue behavior", "url": "https://phys.org/news/2026-09-ant-nervous-gene-behavior.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo realizado por uma equipe de Johannes Gutenberg University Mainz e Tel Aviv University examinou o comportamento de resgate em formigas trabalhadoras da espécie Cataglyphis niger, sugerindo que a diferença chave reside na atividade genética no sistema nervoso, e não na tamanho do corpo, morfologia ou reservas de energia dos animais.", "titulo_pt": "No sistema nervoso das formigas, a expressão genética pode determinar o comportamento de resgate", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 146267, "titulo": "Índia lança novo foguete e consegue colocar satélite inédito em órbita", "url": "https://www.cnnbrasil.com.br/ciencia/india-lanca-novo-foguete-e-consegue-colocar-satelite-inedito-em-orbita/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Índia lançou um novo foguete e colocou um satélite inédito em órbita. A missão foi o 19º voo do veículo indiano e o país espera mais seis lançamentos até 2026.", "titulo_pt": "Índia lança novo foguete e coloca satélite inédito em órbita", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 146560, "titulo": "What Sputnik couldn’t do to American science, Beijing has", "url": "https://www.scmp.com/opinion/world-opinion/article/3366099/what-sputnik-couldnt-do-american-science-beijing-has?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-04T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos detém participações em várias empresas tecnológicas e mineras, incluindo 9,9% da Intel, além de outras empresas como US Steel e MP Materials. Em 2025, Nvidia e AMD cederam 15% das vendas de chips para o mercado chinês em troca de licenças de exportação.", "titulo_pt": "O que Sputnik não conseguiu fazer com a ciência americana, Beijing conseguiu", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 146583, "titulo": "Magic-angle graphene provides evidence for unconventional superconductivity", "url": "https://phys.org/news/2026-09-magic-angle-graphene-evidence-unconventional.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas suprimiram completamente a supercondutividade no grafeno de ângulo mágico ao filtrar as interações entre elétrons, ajudando a resolver
