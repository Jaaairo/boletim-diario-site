<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

<script>
const D = {"gerado_em": "15/09/2026 07:23", "stats": {"noticias_novas": 878, "resumos_gerados": 240}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Supremo Tribunal Federal (STF) realizará uma sessão histórica nesta terça-feira (15) para decidir se o ministro Alexandre de Moraes pode ser investigado por supostas relações com Daniel Vorcaro, dono do Banco Master. A sessão, marcada para as 10h, é inédita e pode influenciar o futuro do ministro, intensificando as divisões internas na cúpula do Judiciário. O ministro Fachin será o primeiro a votar, apresentando seu relatório e voto antes dos demais. Além disso, o STF limitou a quantidade de assessores que cada ministro pode levar para o plenário, permitindo apenas três assessores por ministro. A sessão pode ser usada como plataforma pela oposição contra Moraes, enquanto a campanha de Flávio Bolsonaro vê uma situação de 'ganha-ganha'. O evento tem sido acompanhado de perto por diversos atores políticos e jurídicos, com repercussões potenciais para o futuro do Judiciário e das eleições de 2026.", "mundo": "A economia do Cazaquistão cresceu 11% no ano passado, em parte devido à sua função de principal via de transito para mercadorias direcionadas à Rússia, devido à guerra na Ucrânia. Em contraste, a Holanda enfrentou atrasos e cancelamentos significativos de trens após a descoberta de objetos nos trilhos, o que causou grande insatisfação entre os passageiros. Na América Latina, a artista Gisela Martínez de Tres Arroyos, da Argentina, transforma seda em joias, destacando a potencialidade da atividade, que requer maior articulação para se consolidar. No contexto político, o senador Mitch McConnell retornou ao Senado dos EUA após três meses de ausência, e Marine Le Pen lançou sua quarta campanha presidencial, cercada por familiares e aliados. Além disso, um quarto drone dos Estados Unidos foi abatido no Estreito de Ormuz, e investidores internacionais investiram mais em ações americanas do que em títulos do governo pela primeira vez neste século, fora da pandemia e da crise global financeira.\n\nA tensão geopolítica na Europa e no Oriente Médio continua a crescer, com incidentes envolvendo a Rússia e a Otan. Um navio de guerra russo disparou farolagens contra um helicóptero da Dinamarca no Mar Báltico, enquanto jatos da Otan deram meia-volta a um dron sobre Lituânia. A Lituânia informou seus aliados da União Europeia sobre esses incidentes, que intensificaram as discussões sobre como fortalecer o flanco leste da aliança. O Departamento de Defesa dos Estados Unidos confirmou a colocação de armamentos no espaço, uma medida que visa proteger o país contra ações inimigas no ambiente orbital. Além disso, a China enfrenta um período mais desafiador na indústria de GPUs, com a necessidade de combinar processadores competitivos com interconexões, pilhas de software e clusters para treinar modelos de inteligência artificial. O Japão está considerando aumentar seus gastos em defesa para 3,5% do PIB, após pressão dos Estados Unidos.", "economia": "O rendimento das notas do Tesouro dos EUA a 10 anos atingiu o nível mais alto desde a crise financeira global, chegando a 5,04%, devido às preocupações com a inflação e a elevação das taxas de juros, conforme informou o Financial Times. O Banco Internacional de Desenvolvimento (BIS) observou sinais de vulnerabilidade no atual impulso do mercado global de inteligência artificial (IA), de acordo com o Taipei Times. No Brasil, o Conselho Monetário Nacional (CMN) atualizou as regras para linhas de crédito destinadas a taxistas e motoristas de aplicativos para a compra de veículos novos, permitindo a continuidade do programa Move Brasil sem alterar as condições financeiras dos financiamentos, conforme a Agência Brasil Econômica. Além disso, o governo brasileiro planeja se encontrar com o representante comercial dos Estados Unidos durante o G20 para discutir tarifas. O Conselho Administrativo de Defesa Econômica (Cade) aprovou a compra da Nova AVB S.A. pela Globe Investimentos S.A., empresa controlada pelos irmãos Wesley e Joesley Batista, informou o Jota.", "tecnologia": "A tecnologia da inteligência artificial (IA) continua sendo um tema de debate global. Executivos das empresas Anthropic, OpenAI, SpaceX e Google DeepMind concordaram informalmente em retardar o desenvolvimento da IA. No entanto, o presidente dos Estados Unidos, Donald Trump, não expressa preocupações com a IA. O CEO da Nvidia, Jensen Huang, declarou publicamente que não permitirá um atraso no desenvolvimento da IA, contrariando a posição de alguns líderes tecnológicos. Em outro desenvolvimento, a Waymo planeja iniciar um serviço de táxi autônomo em Tóquio no próximo ano, expandindo suas operações para o mercado asiático. Por outro lado, a China avança na produção em massa de robôs humanóides, mas enfrenta desafios de custo e confiabilidade. A Diageo, proprietária de marcas como Johnnie Walker, desenvolveu uma tecnologia com IA para combater a falsificação de garrafas de destilados. A IA também está sendo utilizada para melhorar o perfil de profissionais em plataformas como LinkedIn, e em serviços de auditoria, como nas empresas KPMG e EY.", "ciencia": "Um estudo recente, publicado no Nature News, destaca a importância de diversificar os fundos de pesquisa global, alertando para a necessidade de não depender exclusivamente de métricas quantitativas para avaliar a qualidade científica. Paralelamente, pesquisadores da China estão desenvolvendo uma técnica inovadora para extrair metais raros a partir de resíduos de lítio, uma invenção que pode revolucionar a indústria de baterias. Um estudo publicado no Phys.org aborda a questão do tsunami de 1946, com uma equipe da Michigan State University iniciando um projeto para investigar o sistema de falhas submarinas que originou o evento, com o objetivo de prevenir futuros desastres. Além disso, cientistas da Universidade de Toronto desenvolveram nanopartículas luminosas que podem detectar compostos químicos em concentrações muito baixas, um avanço que pode ser aplicado em diversas áreas da ciência, incluindo a monitoração ambiental e a detecção de doenças.", "cultura": "Na 78ª cerimônia dos Emmy, 'The Pitt' e 'O Segredo de Widow's Bay' foram as principais vencedoras. 'The Pitt' levou o prêmio na categoria de melhor série de drama, enquanto 'O Segredo de Widow's Bay' ganhou na categoria de melhor comédia. Jean Smart manteve sua sequência perfeita, vencendo novamente no papel principal em série cômica. Andrew Scott entregou uma das melhores atuações da noite como Ian Charleson, um ator que, nos últimos meses de vida, interpreta Hamlet na peça 'Elsinore', ambientada em Elsinore e tratando de um drama sobre AIDS. O evento ocorreu na noite de segunda-feira (14) e marcou um momento importante na indústria cinematográfica e televisiva, destacando as performances e produções que se destacaram nos últimos anos.", "sociedade": "A diminuição da natalidade e a consequente queda na matrícula em escolas privadas em Buenos Aires levaram a fusões entre instituições, como o San Tarsicio e Misericórdia, e o Colégio Los Robles e a Escola Argentina Modelo. Em outro contexto, a Universidade de Buenos Aires (UBA) planeja oferecer serviços de saúde gratuitos nas Praças de Mayo para chamar a atenção sobre seu pedido de cumprimento da lei de financiamento universitário. No Japão, o governo está intensificando medidas contra o tráfico de pessoas, incluindo exploração laboral e sexual, em resposta ao aumento no número de vítimas identificadas. No Nepal, mais de 17.000 crianças afetadas pela cheia precisam de assistência psicológica e suporte psicossocial urgente, conforme informado pelo UNICEF. Além disso, o Ministério Público do Rio Grande do Sul (MP-RS) denunciou os tios de Samylle Valentina, uma menina de 4 anos, por tortura e feminicídio, após a morte da menina, que vivia com os tios há apenas dois meses.", "meio_ambiente": "Os oceanos do mundo continuam registrando temperaturas acima da média, batendo um novo recorde, e este fenômeno dura 100 dias, agravado pelo El Niño atual, conforme alerta o Greenpeace. Em Eldorado, no interior de São Paulo, fortes chuvas causaram a cheia do Rio Ribeira de Iguape, submergindo a cidade. No exterior, a Albânia enfrentou incêndios florestais que destruíram milhares de hectares, revelando a incapacidade do estado de lidar com a situação de forma eficiente. Em Singapura, a qualidade do ar foi afetada por fumaça proveniente de incêndios florestais na Indonésia, levando a níveis de poluição considerados prejudiciais à saúde. Além disso, a plataforma gratuita da Allianz está disponível no Brasil e evalua os riscos de alagamentos, vendavais e granizo baseados no CEP do imóvel, sendo o primeiro país da América Latina a ter acesso a essa ferramenta. O calor extremo pode acabar com o último refúgio barato de Paris, pois os cômodos de até 15 m² sob os telhados em Paris são a opção mais barata para moradia no centro da cidade, mas o aumento das ondas de calor pode colocar em risco essa escolha.", "direitos_humanos": "Um antigo operador de um parlour em Tóquio foi condenado a cinco anos de prisão por contratar uma garota tailandesa de 12 anos para trabalhar no estabelecimento e obrigá-la a prestar serviços sexuais, violando direitos humanos e explorando uma criança. Em outro incidente, um barco transportando imigrantes afundou parcialmente na Grécia, deixando 25 pessoas desaparecidas, refletindo a situação crítica dos migrantes. A situação humanitária em Djibouti agravou-se com a chegada de refugiados yemenitas, agravando as dificuldades enfrentadas por esses grupos. Além disso, a ONU questionou o Brasil pela falta de auditores durante uma reunião do Conselho de Direitos Humanos, questionando o motivo pelo qual a escravidão e o tráfico de pessoas ainda existem após décadas de compromissos."}, "resumo_do_dia": {"politica_nacional": [{"id": 162369, "titulo": "Como cada um dos ministros do STF deve votar sobre investigação contra Moraes", "url": "https://veja.abril.com.br/brasil/como-cada-um-dos-ministros-do-stf-deve-votar-sobre-investigacao-contra-moraes/", "fonte_id": "veja", "data_pub": "2026-09-15T09:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) realizará uma sessão histórica para decidir se o ministro Alexandre de Moraes deve ser investigado por supostas relações com Daniel Vorcaro. A sessão será marcada como um momento significativo na história do tribunal.", "titulo_pt": "Como cada um dos ministros do STF deve votar sobre investigação contra Moraes", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 162422, "titulo": "Julgamento de Moraes: STF limita até assessores de ministros no plenário", "url": "https://www.metropoles.com/colunas/igor-gadelha/julgamento-de-moraes-stf-limita-ate-assessores-de-ministros-no-plenario", "fonte_id": "metropoles", "data_pub": "2026-09-15T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O STF limitou a quantidade de assessores que cada ministro pode levar para o plenário durante o julgamento de Moraes, permitindo apenas três assessores por ministro. A Presidência do STF informou esta medida aos gabinetes.", "titulo_pt": "STF limita número de assessores em plenário durante julgamento de Moraes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 162423, "titulo": "Cármen Lúcia vence prêmio de intelectual do ano no ‘Dia D’ do STF", "url": "https://www.metropoles.com/colunas/matheus-leitao/carmen-lucia-vence-premio-de-intelectual-do-ano-no-dia-d-do-stf", "fonte_id": "metropoles", "data_pub": "2026-09-15T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cármen Lúcia, ministra do Supremo Tribunal Federal, venceu o Troféu Juca Pato e será homenageada pelo presidente do Conselho Federal da Ordem dos Advogados do Brasil, Sueli Carneiro, durante o 'Dia D' do STF.", "titulo_pt": "Cármen Lúcia ganha prêmio de intelectual do ano no 'Dia D' do STF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 162436, "titulo": "Fachin será o primeiro a votar em sessão histórica do STF; entenda rito", "url": "https://www.cnnbrasil.com.br/politica/fachin-sera-o-primeiro-a-votar-em-sessao-historica-do-stf-entenda-rito/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Fachin será o primeiro a votar em uma sessão histórica do STF, apresentando seu relatório e voto antes dos demais ministros. O plenário também pode discutir a validade da apuração e a possibilidade de investigar o ministro Moraes.", "titulo_pt": "Fachin será o primeiro a votar em sessão histórica do STF; entenda rito", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 162376, "titulo": "STF ‘sairá fortalecido’ e ‘manterá defesa da democracia’ se arquivar provas da PF, diz Moraes", "url": "https://veja.abril.com.br/brasil/stf-saira-fortalecido-e-mantera-defesa-da-democracia-se-arquivar-provas-da-pf-diz-moraes/", "fonte_id": "veja", "data_pub": "2026-09-15T08:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF (Supremo Tribunal Federal) Carlos Moraes afirmou que o tribunal sairá fortalecido e manterá a defesa da democracia se arquivar as provas da Polícia Federal. Ele também destacou que o ministro Kassio Mendonça atuou como juiz e investigador, tentando evitar uma apuração sobre suas relações com o dono do Banco Master.", "titulo_pt": "STF sairá fortalecido e manterá defesa da democracia se arquivar provas da PF, diz Moraes", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 162613, "titulo": "LC 236/26 e a dosimetria da penalidade", "url": "https://www.jota.info/opiniao-e-analise/artigos/lc-236-26-e-a-dosimetria-da-penalidade", "fonte_id": "jota", "data_pub": "2026-09-15T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto fixou um teto nacional para as multas, mas a graduação da penalidade é definida por cada legislador, incluindo o federal.", "titulo_pt": "LC 236/26 e a graduação da penalidade", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 162486, "titulo": "BBAS3 sofre nas eleições? O que seis disputas mostram — e o alerta de 2026", "url": "https://www.infomoney.com.br/mercados/bbas3-eleicoes-historico-banco-do-brasil-2026/", "fonte_id": "infomoney", "data_pub": "2026-09-15T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ação do Banco do Brasil terminou em alta em cinco dos últimos seis anos eleitorais, apesar da volatilidade. Para 2026, espera-se uma recuperação, mas com fundamentos mais pressionados.", "titulo_pt": "BBAS3 sofre nas eleições? O que seis disputas mostram — e o alerta de 2026", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 162512, "titulo": "Como o PCC aparece nas investigações sobre a produtora de Dark Horse, filme sobre a vida de Jair Bolsonaro", "url": "https://www.bbc.com/portuguese/articles/cq8r63m878y1o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-15T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investigações sobre um feminicídio na Polícia Civil de São Paulo e no Ministério Público apontam uma suposta ligação entre o PCC (Primeiro Comando da Capital) e um empresário ligado à produtora do filme 'Dark Horse', que aborda a vida de Jair Bolsonaro.", "titulo_pt": "Como o PCC aparece nas investigações sobre a produtora do filme sobre Jair Bolsonaro", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 162322, "titulo": "Comitê Gestor: ápice do federalismo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/09/comite-gestor-apice-do-federalismo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Federação é uma cláusula pétrea do Brasil desde 1891, antes do voto e da separação dos Poderes. A escolha foi feita para blindar a forma federativa contra o Congresso, reconhecendo a fragilidade inicial da Federação através da petrificação.", "titulo_pt": "Apice do federalismo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 162324, "titulo": "Mesários voluntários podem pedir até seis folgas nas Eleições de 2026", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/mesarios-voluntarios-podem-pedir-ate-seis-folgas-nas-eleicoes-de-2026.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os mesários voluntários nas Eleições de 2026 podem solicitar até seis folgas por dia de treinamento ou trabalho, de acordo com a resolução do TSE. Para usufruir do benefício, é necessário ter vínculo de trabalho e emitir uma DTE na Justiça Eleitoral.", "titulo_pt": "Mesários voluntários podem pedir até seis folgas nas Eleições de 2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 162348, "titulo": "Eleição no Pará tem aceno ao agro, impacto por suposto vídeo íntimo e Lula e Flávio Bolsonaro em segundo plano", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/eleicao-no-para-tem-aceno-ao-agro-impacto-por-suposto-video-intimo-e-lula-e-flavio-bolsonaro-em-segundo-plano.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-15T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos Hana Ghassan (MDB) e Dr. Daniel (Podemos) estão empatados tecnicamente na última pesquisa de intenção de voto para o Governo do Pará. Ambos focam sua campanha em questões locais, com a disputa nacional entre Lula (PT) e Flávio Bolsonaro (PL) ocupando um papel secundário.", "titulo_pt": "Eleição no Pará tem foco local, com Lula e Bolsonaro em segundo plano", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 162349, "titulo": "Moraes chama relatório apresentado por Mendonça de farsa e diz que é vingança após condenações na trama golpista", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/moraes-diz-que-relatorio-apresentado-por-mendonca-e-farsa-e-vinganca-de-aliados-de-condenados-pela-trama-golpista.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-15T03:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do STF, afirmou que o relatório apresentado por André Mendonça não oferece indícios para a apuração de crimes. Moraes também indicou que o documento é uma vingança após suas condenações na trama golpista.", "titulo_pt": "Moraes chama relatório de Mendonça de farsa e vingança", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 162332, "titulo": "Porto do Açu prepara produção de combustível sustentável para navio; veja como será", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/09/porto-do-acu-prepara-producao-de-combustivel-sustentavel-para-navio-veja-como-sera.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T03:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A administração do Porto do Açu, no norte do Rio de Janeiro, iniciou um projeto para produzir combustível sintético no complexo portuário, utilizando a captura de carbono do ar, com o objetivo de suprir o transporte marítimo. O projeto visa desenvolver combustível sustentável para navios.", "titulo_pt": "Porto do Açu inicia produção de combustível sustentável para navios; saiba como será", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 162616, "titulo": "Quem são os candidatos a deputado federal pelo Amapá (AP) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-a-deputado-federal-pelo-amapa-ap-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-09-15T02:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os mais de 500 mil eleitores do Amapá vão eleger 8 candidatos a deputado federal. Os nomes dos candidatos ainda não foram divulgados.", "titulo_pt": "Quem são os candidatos a deputado federal pelo Amapá nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 162380, "titulo": "Crise do STF: as consequências da omissão do Senado nas eleições, segundo Alessandro Vieira", "url": "https://veja.abril.com.br/politica/as-consequencias-da-omissao-do-senado-nas-eleicoes-segundo-alessandro-vieira/", "fonte_id": "veja", "data_pub": "2026-09-15T02:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Alessandro Vieira, do MDB, afirmou que a inação do Senado frente a situações envolvendo o STF pode ter impacto nas eleições.", "titulo_pt": "Crise do STF: inação do Senado pode afetar eleições, diz senador", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 162339, "titulo": "Crise no STF está 'virando monstro a nos engolir', diz Horácio Lafer Piva", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/crise-no-stf-esta-virando-monstro-a-nos-engolir-diz-horacio-lafer-piva.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Horácio Lafer Piva, que tem preocupações com a crise no STF, afirma que o problema 'está virando um monstro a nos engolir'. Ele é presidente do conselho deliberativo da Ibá e ex-comandou a Fiesp.", "titulo_pt": "Crise no STF está 'virando monstro a nos engolir', alerta empresário", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 162794, "titulo": "Suspected sabotage causes major Netherlands rail disruption", "url": "https://www.bbc.co.uk/news/articles/c8ly49w9g1edo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-15T09:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foi constatada atrasos e cancelamentos generalizados de trens na Holanda após a descoberta de objetos nos trilhos em vários locais.", "titulo_pt": "Suspeita de sabotagem causa grande interrupção ferroviária nos países baixos", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 162610, "titulo": "Carf mantém maior parte de cobrança bilionária de IRPJ/CSLL contra Marfrig", "url": "https://www.jota.info/tributos/carf-mantem-maior-parte-de-cobranca-bilionaria-de-irpj-csll-contra-marfrig", "fonte_id": "jota", "data_pub": "2026-09-15T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A decisão do Carf manteve a maior parte de uma cobrança bilionária de IRPJ e CSLL contra a Marfrig, relacionada a irregularidades supostas em uma controlada localizada em um paraíso fiscal.", "titulo_pt": "Carf mantém cobrança bilionária de IRPJ/CSLL contra Marfrig", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 162688, "titulo": "Russian warship fires flares at Danish helicopter as Nato jets shoot down drone over Lithuania", "url": "https://www.theguardian.com/world/2026/sep/15/nato-jets-shoot-down-drone-violating-lithuania-airspace-kaunas", "fonte_id": "guardian_world", "data_pub": "2026-09-15T09:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um navio de guerra russo disparou duas sinalizadoras de emergência contra um helicóptero da Dinamarca no Mar Báltico, enquanto jatos da Otan deram meia-volta a um dron sobre Lituânia. Polônia também mobilizou jatos após recuperar um supostamente russo dron em suas águas.", "titulo_pt": "Navio de guerra russo dispara sinalizadoras em helicóptero da dinamarca e Otan derroga dron sobre lituânia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 162508, "titulo": "EUA confirmam ter colocado pela primeira vez armamentos no espaço", "url": "https://www.bbc.com/portuguese/articles/cm750xnveq4yo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-15T09:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Defesa dos Estados Unidos confirmou que colocou pela primeira vez armamentos no espaço. Essa medida visa proteger o país contra ações inimigas no ambiente orbital.", "titulo_pt": "EUA confirmam ter colocado pela primeira vez armamentos no espaço", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 162689, "titulo": "Lithuania briefs EU allies after drone shot down by Nato jets overnight – Europe live", "url": "https://www.theguardian.com/world/live/2026/sep/15/denmark-ukraine-russia-warship-frigate-security-lithuania-poland--sweden-election-eu-europe-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-09-15T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Lituânia informou seus aliados da União Europeia sobre o incidente de um dron que foi abatido por jatos do Norte Atlântico. As discussões sobre como fortalecer o flanco leste da aliança estão Itália)", "pais": "Itália", "classe": "A"}, {"id": 162721, "titulo": "NATO jets down drone in Lithuanian airspace", "url": "https://www.npr.org/2026/09/15/g-s1-143284/nato-jets-down-drone-in-lithuanian-airspace", "fonte_id": "npr_news", "data_pub": "2026-09-15T09:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "NATO aviões interceptaram e destruíram um drone em espaço aéreo lituano. O incidente ocorreu menos de um dia após líderes da NATO prometerem aumentar o apoio à Ucrânia em caso de ataques próximos à aliança.", "titulo_pt": "Jatos da NATO interceptam e destróem drone no espaço aéreo lituano", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 162877, "titulo": "Israeli settlers protest UK sanctions outside consulate in East Jerusalem", "url": "https://www.middleeasteye.net/news/israeli-settlers-protest-uk-sanctions-outside-consulate-occupied-east-jerusalem", "fonte_id": "middle_east_eye", "data_pub": "2026-09-15T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israeli settlers e ativistas da extrema direita protestaram fora do consulado britânico em Jerusalém Oriental, ocupado, após o Reino Unido impôs sanções amplas a comércios ligados a assentamentos israelenses ilegais. O ministro das Relações Exteriores israelense, Gideon Saar, comentou a situação.", "titulo_pt": "Setentristas israelenses protestam contra sanções britânicas em jerusalém oriental", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 162676, "titulo": "Carney Pitches Canada as a Haven of Investment Stability in a Chaotic World", "url": "https://www.nytimes.com/2026/09/15/world/canada/carney-pitches-canada-as-a-stable-investment-in-a-chaotic-world.html", "fonte_id": "nyt_world", "data_pub": "2026-09-15T09:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro Canadá reuniu cerca de 100 gestores de investimentos em Toronto para promover o país como o local ideal para investimentos.", "titulo_pt": "Carney promove canadá como refúgio de estabilidade de investimentos em um mundo caótico", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 162538, "titulo": "Los científicos coinciden: el ejercicio clave de 3 minutos que equivale a una hora y media de cardio", "url": "https://www.lanacion.com.ar/lifestyle/los-cientificos-coinciden-el-ejercicio-clave-de-3-minutos-que-equivale-a-una-hora-y-media-de-cardio-nid15092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-15T09:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo mostrou que um exercício de três minutos provocou mudanças imediatas significativas em proteínas da sangue, equivalente a 90 minutos de atividade moderada cardíaca.", "titulo_pt": "Cientistas concordam: exercício de 3 minutos equivale a 90 minutos de cardio", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 162321, "titulo": "Falta de reformas em suas regras pode custar 5% do PIB global até 2050, diz OMC", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/falta-de-reformas-em-suas-regras-pode-custar-5-do-pib-global-ate-2050-diz-omc.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sem reformas nas regras da OMC, o PIB global pode cair cerca de 5% e as exportações reduzirem quase 20% até 2050. A entidade corre o risco de perder a capacidade de conter a fragmentação comercial global.", "titulo_pt": "Sem reformas, regras da OMC podem custar 5% do PIB global até 2050", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 162905, "titulo": "Ten-year Treasury yield hits highest since global financial crisis", "url": "https://www.ft.com/content/5e2327aa-dbd0-4a79-8c99-622a893876d7?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-15T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rendimento da dívida do Tesouro dos EUA a 10 anos atingiu o nível mais alto desde a crise financeira global, chegando a 5,04%. As ações caíram devido às preocupações sobre a inflação e a elevação das taxas de juros.", "titulo_pt": "Rendimento do tesouro dos EUA a 10 anos atinge nível mais alto desde a crise financeira global", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 162417, "titulo": "Agências do trabalhador oferecem 1.379 vagas com salários de até R$ 5 mil", "url": "https://www.metropoles.com/distrito-federal/agencias-do-trabalhador-oferecem-1-379-vagas-com-salarios-de-ate-r-5-mil", "fonte_id": "metropoles", "data_pub": "2026-09-15T09:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Existem 1.379 vagas de emprego disponíveis por meio de agências do trabalhador, com salários que podem chegar até R$ 5 mil. As oportunidades abrangem diferentes níveis de escolaridade e são adequadas tanto para candidatos com experiência quanto para quem busca o primeiro emprego.", "titulo_pt": "Agências do trabalhador oferecem 1.379 vagas com salários de até R$ 5 mil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 162612, "titulo": "O mapa de soluções para o futuro da energia, do agronegócio e dos resíduos no Brasil", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-mapa-de-solucoes-para-o-futuro-da-energia-do-agronegocio-e-dos-residuos-no-brasil", "fonte_id": "jota", "data_pub": "2026-09-15T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Resíduos orgânicos podem ser utilizados para integrar cadeias de infraestrutura e promover a produção de biocombustíveis no Brasil.", "titulo_pt": "Mapa de soluções para o futuro da energia, do agronegócio e dos resíduos no Brasil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 162487, "titulo": "Day trade em eleição: mais volatilidade, mais risco? Veja como se following Houthi strikes on Saudi Arabia", "url": "https://www.cnbc.com/2026/09/15/oil-extends-gains-following-houthi-strikes-on-saudi-arabia.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-15T07:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O preço do petróleo continuou a subir devido a relatos de novos ataques dos hutis contra a Arábia Saudita e ações de Irã contra navios no Golfo.", "titulo_pt": "Petróleo mantém ganhos após novos ataques hutis na arábia saudita e ações do Irã no golfo", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 162466, "titulo": "Copom inicia reunião com expectativa de corte da Selic para 13,75%", "url": "https://exame.com/economia/copom-inicia-reuniao-com-expectativa-de-corte-da-selic-para-1375/", "fonte_id": "exame", "data_pub": "2026-09-15T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As instituições financeiras Boletim Focus, Itaú BBA, C6 Bank, Suno Research e Daycoval esperam que o Copom realize um novo corte de 0,25 ponto percentual na taxa Selic nesta semana.", "titulo_pt": "Copom inicia reunião com expectativa de corte da Selic para 13,75%", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 162948, "titulo": "SoftBank-backed SB Energy aims to raise $500 million from Japan for U.S. IPO", "url": "https://www.japantimes.co.jp/business/2026/09/15/companies/japan-sb-energy-ipo/", "fonte_id": "japan_times", "data_pub": "2026-09-15T05:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SB Energy, apoiada pela SoftBank, planeja levantar US$ 500 milhões no Japão para uma oferta inicial de ações nos Estados Unidos. Os recursos serão utilizados para desenvolver e construir infraestrutura, incluindo centros de dados e usinas de energia.", "titulo_pt": "SB Energy, apoiada pela softbank, busca us$ 500 milhões no Japão para IPO nos EUA", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 162475, "titulo": "Split Payment pode reduzir lucro de Magalu, Pague Menos e Centauro, diz Safra", "url": "https://exame.com/invest/mercados/split-payment-pode-reduzir-lucro-de-magalu-pague-menos-e-centauro-diz-safra/", "fonte_id": "exame", "data_pub": "2026-09-15T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O novo sistema de recolhimento de impostos, split payment, pode reduzir o caixa disponível das empresas e aumentar a necessidade de capital de giro. Este sistema pode reduzir o lucro de empresas como Magalu, Pague Menos e Centauro.", "titulo_pt": "Split Payment pode reduzir lucro de Magalu, Pague Menos e Centauro, diz Safra", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 162991, "titulo": "Citigroup hires veteran banker Sophia Wang to lead China institutional sales", "url": "https://www.scmp.com/business/banking-finance/article/3367535/citigroup-hires-veteran-banker-sophia-wang-lead-china-institutional-sales?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-15T04:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Citigroup nomeou a experiente bancária Sophia Wang como diretora gerente e chefe das vendas institucionais financeiras e gerenciamento de relacionamentos sênior para a China. Ela será responsável pela cobertura de vendas institucionais em várias áreas, incluindo taxas, produtos de spread, câmbio e commodities, com sede em Shanghai.", "titulo_pt": "Citigroup contrata experiente bancária Sophia Wang para liderar vendas institucionais chinesas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 162903, "titulo": "China’s economy shows signs of weakness as investment slumps", "url": "https://www.ft.com/content/d9158802-5836-441a-9969-47409044c503?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-15T04:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os indicadores internos da economia chinesa estão se deteriorando, aumentando a pressão sobre positivo produzido pela Flow Neuroscience foi aprovado pela FDA e pode auxiliar pessoas a reduzir a dependência de antidepressivos, mas custa US$ 2.200.", "titulo_pt": "Novo earloop pode auxiliar na depressão, mas custa US$ 2.200", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 162550, "titulo": "Revolución en la construcción: así son las casas que se pueden levantar gracias a las impresoras 3D", "url": "https://www.lanacion.com.ar/propiedades/revolucion-en-la-construccion-asi-son-las-casas-que-se-pueden-levantar-gracias-a-las-impresoras-3d-nid15092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-15T09:27:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A tecnologia de impressão 3D evoluiu de um experimento para se tornar uma inovação que está transformando a maneira como se projetam, produzem e habitam as casas.", "titulo_pt": "Revolução na construção: assim são as casas que se podem levantar graças às impressoras 3D", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 162551, "titulo": "Alex Sakkal, desarrollador: “Las empresas ya no buscan más metros cuadrados sino espacios más pequeños, mejor ubicados y tecnológicamente preparados”", "url": "https://www.lanacion.com.ar/propiedades/alex-sakkal-desarrollador-las-empresas-ya-no-buscan-mas-metros-cuadrados-sino-espacios-mas-pequenos-nid15092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-15T09:27:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O desenvolvedor Alex Sakkal afirma que as empresas estão buscando espaços mais compactos, melhor localizados e tecnologicamente avançados. Além disso, 96% das empresas com menos de 500 funcionários na América prevê manter ou expandir seus espaços físicos nos próximos anos.", "titulo_pt": "Alex Sakkal, desenvolvedor: ‘as empresas buscam agora espaços menores, melhor localizados e tecnologicamente preparados’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 162754, "titulo": "Why a swift AI pause is unlikely: no one trusts AI companies", "url": "https://www.axios.com/2026/09/15/ai-trust-safety-anthropic-openai", "fonte_id": "axios", "data_pub": "2026-09-15T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A maioria concorda que a indústria de IA precisa de supervisão, mas há pouca confiança nas empresas de IA e nos defensores da segurança que vêm de dentro dessas empresas. Isso impede a adoção de novos regulamentos que poderiam dar poder excessivo a empresas de IA de vanguarda.", "titulo_pt": "Por que uma pausa rápida na IA é improvável: ninguém confia nas empresas de IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 162755, "titulo": "\"I am the Hoax Buster\": Trump's war on AI doomers gets personal", "url": "https://www.axios.com/2026/09/15/trump-ai-doom-safety-regulation-hoax", "fonte_id": "axios", "data_pub": "2026-09-15T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump declarou guerra à preocupação apocalíptica sobre a segurança da IA, desconsiderando as advertências da indústria como parte de uma 'conspiração doentia' para sabotar os Estados Unidos e sua herança. Ele acusa os democratas de alimentar o pânico e argumenta que a única 'controle' que a IA precisa é um presidente forte e inteligente.", "titulo_pt": "Eu sou o desmentidor da farsa: trump declara guerra à paranoia sobre a IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 163001, "titulo": "Microsoft issues emergency Windows 11 update to fix its record-breaking patch", "url": "https://www.theverge.com/news/995302/microsoft-out-of-band-windows-11-update-fix-issues", "fonte_id": "the_verge", "data_pub": "2026-09-15T08:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft está lançando uma atualização de emergência fora do horário programado para corrigir problemas com sua atualização de setembro, que contava com quase 1.000 correções de bugs e foi a maior atualização da empresa até o momento. No entanto, a atualização trouxe alguns erros que afetaram negócios, desenvolvedores e jogadores.", "titulo_pt": "Microsoft libera atualização de emergência para corrigir problemas na maior atualização de setembro", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 163052, "titulo": "China's humanoid robot race, Part 1: Mass production outruns proven demand", "url": "https://www.digitimes.com/news/a20260915VL209/robot-production-demand-industrial-shipments.html", "fonte_id": "digitimes", "data_pub": "2026-09-15T07:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria de robôs humanóides na China está evoluindo da fase de protótipos para a produção em massa. O próximo desafio não é mais se os robôs podem ser produzidos em larga escala, mas sim se eles podem funcionar de forma confiável e com custos baixos o suficiente para tornar essa produção econômica.", "titulo_pt": "Corrida chinesa de robôs humanóides, parte 1: produção em massa ultrapassa a demanda provada", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 162940, "titulo": "China’s new tech, national security exit rules take effect", "url": "https://www.japantimes.co.jp/news/2026/09/15/asia-pacific/politics/china-tech-national-security-rules/", "fonte_id": "japan_times", "data_pub": "2026-09-15T07:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As novas regras de segurança nacional entram em vigor, proibindo cidadãos considerados uma ameaça potencial à segurança tecnológica do país de sair do país.", "titulo_pt": "Novas regras de segurança nacional e tecnologia entram em vigor no china", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 163054, "titulo": "China elevates HBM and HBF in five-year plan, opening a new front in AI memory", "url": "https://www.digitimes.com/news/a20260915PD228/hbm-policy-it-miit-industrial.html", "fonte_id": "digitimes", "data_pub": "2026-09-15T06:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério de Indústria e Tecnologia da Informação e a Comissão Nacional de Desenvolvimento e Reforma do China lançaram o Plano Quinquenal de Desenvolvimento da Indústria de Fabricação de Informação Eletrônica. O plano destaca a memória de alta largura de banda e a memória de alta largura de banda flash como áreas prioritárias para a pesquisa de memória de geração próxima.", "titulo_pt": "China eleva HBM e HBF no plano quinquenal, abrindo um novo fronte na memória de IA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 162460, "titulo": "Sua caixa de entrada está consumindo seu dia? Saiba como utilizar IA para organizar seus e-mails", "url": "https://exame.com/inteligencia-artificial/sua-caixa-de-entrada-esta-consumindo-seu-dia-saiba-como-utilizar-ia-para-organizar-seus-e-mails/", "fonte_id": "exame", "data_pub": "2026-09-15T06:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo explica como utilizar inteligência artificial para classificar e resumir e-mails, além de priorizar tarefas, sem deixar a caixa de entrada sobrecarregada com uma lista extensa de pendências.", "titulo_pt": "Sua caixa de entrada está consumindo seu dia? Saiba como utilizar IA para organizar seus e-mails", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 163060, "titulo": "China's space-computing race moves beyond single satellites: Shanghai's gigawatt-scale AI ambition lands in orbit", "url": "https://www.digitimes.com/news/a20260915VL201/shanghai-infrastructure-data-spacex.html", "fonte_id": "digitimes", "data_pub": "2026-09-15T06:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China está avançando em sua corrida espacial computacional, focando em infraestrutura orbital integrada e totalmente interconectada, enquanto a Estados Unidos mantém sua liderança com a dominância crescente da SpaceX em conectividade por satélite. Este esforço chinês visa ultrapassar lançamentos de satélites individuais, embora aconteça de forma mais discreta.", "titulo_pt": "Corrida espacial computacional da china avança para infraestrutura orbital integrada", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 162461, "titulo": "Stray Kids faz 5G da Tim registrar pico de conexões no Rock in Rio 2026", "url": "https://exame.com/tecnologia/stray-kids-faz-5g-da-tim-registrar-pico-de-conexoes-no-rock-in-rio-2026/", "fonte_id": "exame", "data_pub": "2026-09-15T06:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A rede 5G da Tim registrou um pico significativo de conexões durante o Rock in Rio 2026, movimentando quase 200 TB de dados. Esse volume é equivalente a 60 anos de vídeos em alta definição.", "titulo_pt": "Stray Kids faz 5G da Tim registrar pico de conexões no Rock in Rio 2026", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 162470, "titulo": "O que fazer quando a IA parece conhecer você melhor do que você mesmo?", "url": "https://exame.com/carreira/o-que-fazer-quando-a-ia-parece-conhecer-voce-melhor-do-que-voce-mesmo/", "fonte_id": "exame", "data_pub": "2026-09-15T05:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A tecnologia é capaz de identificar padrões com precisão, mas as decisões de carreira ainda dependem da reflexão pessoal.", "titulo_pt": "O que fazer quando a IA parece conhecer você melhor do que você mesmo?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 162471, "titulo": "O dado mais repetido sobre currículo e IA no recrutamento não tem fonte nenhuma", "url": "https://exame.com/carreira/o-dado-mais-repetido-sobre-curriculo-e-ia-no-recrutamento-nao-tem-fonte-nenhuma/", "fonte_id": "exame", "data_pub": "2026-09-15T05:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A estatística de que 75% dos currículos são descartados por robôs nunca foi comprovada por estudo. O dado mais repetido sobre currículos e inteligência artificial no recrutamento não tem base em pesquisas.", "titulo_pt": "O dado mais repetido sobre currículo e IA no recrutamento não tem fonte nenhuma", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 162473, "titulo": "Oito habilidades que podem revelar inteligência emocional acima da média no trabalho", "url": "https://exame.com/carreira/oito-habilidades-que-podem-revelar-inteligencia-emocional-acima-da-media-no-trabalho/", "fonte_id": "exame", "data_pub": "2026-09-15T05:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Habilidades como autoconsciência, capacidade de manter a calma sob pressão e a capacidade de ouvir são importantes para o sucesso na carreira. Estas competências podem ser mais relevantes para o desenvolvimento de inteligência emocional do que se pensa.", "titulo_pt": "Oito habilidades que podem revelar inteligência emocional acima da média no trabalho", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 162474, "titulo": "Seu perfil do LinkedIn pode estar afastando oportunidades. Veja como usar IA para melhorá-lo", "url": "https://exame.com/inteligencia-artificial/seu-perfil-do-linkedin-pode-estar-afastando-oportunidades-veja-como-usar-ia-para-melhora-lo/", "fonte_id": "exame", "data_pub": "2026-09-15T05:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo explica como utilizar inteligência artificial para melhorar o perfil do LinkedIn, incluindo revisões do título, resumo, experiências e competências. O objetivo é tornar o perfil mais claro e atraente para recrutadores e profissionais da mesma área.", "titulo_pt": "Seu perfil do LinkedIn pode estar afastando oportunidades. Veja como usar IA para melhorá-lo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 163069, "titulo": "Just add fish: Scientists pursue more rice, less disease in Senegal paddies", "url": "https://phys.org/news/2026-09-fish-scientists-pursue-rice-disease.html", "fonte_id": "phys_org", "data_pub": "2026-09-15T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Moussa Ndiaye, usando um tunico longo e um chapéu-de-coco, observava uma colheitadeira trabalhando em sua plantação de arroz no norte do Senegal, esperando um bom colheita não apenas de grãos, mas também de benefícios para a saúde.", "titulo_pt": "Adicione peixes: cientistas buscam mais arroz e menos doenças nos campos de arroz do Senegal", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 162589, "titulo": "Los diagnósticos de cáncer podrían aumentar en un 67% para 2050: cuáles son los cánceres más comunes", "url": "https://www.latercera.com/tendencias/noticia/los-diagnosticos-de-cancer-podrian-aumentar-en-un-67-para-2050-cuales-son-los-canceres-mas-comunes/", "fonte_id": "la_tercera", "data_pub": "2026-09-15T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O relatório da Sociedade Americana contra o Cáncer indica que cerca de 20% das pessoas no mundo podem desenvolver câncer ao longo da vida. É estimado que quase metade das mortes por câncer poderiam ser evitadas através do enfrentamento de fatores de risco potencialmente modificáveis.", "titulo_pt": "Diagnósticos de câncer poderiam aumentar em 67% para 2050: quais são os cânceres mais comuns", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 162320, "titulo": "Cientistas encontram mais de 1.000 variantes genéticas ligadas à personalidade", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/cientistas-encontram-mais-de-1000-variantes-geneticas-ligadas-a-personalidade.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-15T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas identificaram mais de 1.000 variantes genéticas relacionadas com características de personalidade. O estudo pode ajudar a entender a base genética das ter First Fleet's arrival", "url": "https://phys.org/news/2026-09-indigenous-australian-population-larger-previously.html", "fonte_id": "phys_org", "data_pub": "2026-09-15T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A população indígena australiana era maior do que se pensava antes do advento dos europeus, de acordo com novas pesquisas. Estima-se que cerca de 93% da população pré-europeia tenha sido perdida em menos de 80 anos após a chegada do Primeiro Escadão em 1788.", "titulo_pt": "População indígena australiana era maior e sofreu perdas mais significativas após a chegada do primeiro escadão", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 163101, "titulo": "A new biography of Stephen Hawking gets to grips with a complicated man", "url": "https://www.newscientist.com/article/2589245-a-new-biography-of-stephen-hawking-gets-to-grips-with-a-complicated-man/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-15T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Graham Farmelo escreveu a primeira biografia autorizada do famoso físico Stephen Hawking. O autor abordou diversas controvérsias, mas poderia ter investigado mais profundamente, according to Jacob Aron.", "titulo_pt": "Nova biografia autorizada de Stephen Hawking aborda controvérsias", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 163067, "titulo": "STAT+: Medicare’s AI prior authorization pilot was rushed and full of problems, new documents reveal", "url": "https://www.statnews.com/2026/09/15/medicare-wiser-ai-prior-authorization-pilot-rushed-launch-delayed-care/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-15T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um piloto do Medicare que utilizava inteligência artificial para autorização prévia foi lançado de forma apressada, levando a atrasos no tratamento em mber of centenarians in Japan top 100,000 for first time", "url": "https://www.japantimes.co.jp/news/2026/09/15/japan/japan-centenarians-top-100000/", "fonte_id": "japan_times", "data_pub": "2026-09-15T04:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de centenários no Japão atingiu 107.677 neste ano, um aumento de 7.914 em comparação com o ano anterior. Quase todos os centenários japoneses são mulheres, com 94.298 sendo femininas.", "titulo_pt": "Número de centenários no Japão ultrapassa 100.000 pela primeira vez", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 163092, "titulo": "APOD: 2026 September 15 – A Daytime Eclipse: Moon Occults Venus", "url": "https://science.nasa.gov/image-article/apod-2026-september-15-a-daytime-eclipse-moon-occults-venus/", "fonte_id": "nasa_news", "data_pub": "2026-09-15T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 15 de setembro de 2026, a Lua passará diante do planeta Vênus durante o dia, ocultando-o temporariamente do céu. Este fenômeno será o tema da Imagem do Dia da NASA para essa data.", "titulo_pt": "Imagem do dia: 15 de setembro de 2026 – um Eclipse diurno: lua oculta vênus", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 162992, "titulo": "Chinese plant extracts critical rare metals from lithium waste in world first", "url": "https://www.scmp.com/news/china/science/article/3367490/chinese-plant-extracts-critical-rare-metals-lithium-waste-world-first?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-15T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China iniciou uma linha de produção de 500 toneladas para extração de rubidio e cesio a partir de resíduos de lítio. Esta é a primeira linha mundial com capacidade anual de 500 toneladas para a extração contínua e separação de rubidio e cesio de baixa qualidade, segundo o Instituto de Engenharia de Processos da Academia Chinesa de Ciências. nte_id": "dezeen", "data_pub": "2026-09-15T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A marca suíça Vitra lançou uma coleção de azulejos de porcelana que imitam a aparência de concreto resina. Inspirada na textura porosa e mineral rica do concreto natural, a coleção Resincode apresenta uma beleza crua devido às superfícies minerais.", "titulo_pt": "Coleção de azulejos resincode pela Vitra", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 163165, "titulo": "The Ultimate Fall 2026 Reading List", "url": "https://lithub.com/the-ultimate-fall-2026-reading-list/", "fonte_id": "lithub", "data_pub": "2026-09-15T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Literary Hub lançou sua lista anual de livros para ler no outono de 2026. O autor anunciou que leu todos os títulos selecionados.", "titulo_pt": "A lista literária de outono de 2026", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 163166, "titulo": "Emily St. John Mandel on Writing a Novel of Dystopian Counterlives", "url": "https://lithub.com/emily-st-john-mandel-on-writing-a-novel-of-dystopian-counterlives/", "fonte_id": "lithub", "data_pub": "2026-09-15T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As dystopias pós-pandêmicas são o centro das obras mais celebradas de Emily St. John Mandel, incluindo Station Eleven (2014).", "titulo_pt": "Emily St. John Mandel sobre a escrita de uma dystopia de vidas contrárias", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 163167, "titulo": "How Madeleine Thien Organizes Her Bookshelves, Among Other Things", "url": "https://lithub.com/how-madeleine-thien-organizes-her-bookshelves-among-other-things/", "fonte_id": "lithub", "data_pub": "2026-09-15T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Madeleine Thien lançou uma nova coleção de contos chamada 'Simple Recipes', publicada pela W.W. Norton. Desde os 50 anos, ela escreve principalmente à mão.", "titulo_pt": "Como Madeleine Thien organiza seus livros e outras coisas", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 163168, "titulo": "On Falling Out of Love With Moscow", "url": "https://lithub.com/on-falling-out-of-love-with-moscow/", "fonte_id": "lithub", "data_pub": "2026-09-15T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor cresceu em Moscou no final da era soviética. Para a sua família, a cidade não oferecia muita atração, sendo marcada pela escassez, monotonia e falta de charme.", "titulo_pt": "Sobre perder o encanto por moscou", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 163169, "titulo": "On the Orientalism and Imperial Gaze of Western Horror Films", "url": "https://lithub.com/on-the-orientalism-and-imperial-gaze-of-western-horror-films/", "fonte_id": "lithub", "data_pub": "2026-09-15T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor não gosta do diretor Lee Cronin, conhecido por repetir clichês do gênero horror, e assistiu recentemente a um de seus filmes. Não há menção a detalhes específicos sobre o filme assistido.", "titulo_pt": "O orientalismo e o olhar Imperial nos filmes de Horror ocidentais", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 163170, "titulo": "Looking in the Mirror of My Past as a Korean Adoptee in the United States", "url": "https://lithub.com/trying-to-look-into-the-mirror-of-my-past-as-a-korean-adoptee-in-the-united-states/", "fonte_id": "lithub", "data_pub": "2026-09-15T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A segunda espelhagem, conhecida como espelho padrão ou regular, causa um efeito de duplicação. Pessoas deslocadas viviam em duas zonas temporais, presente e passado, aqui e ali.", "titulo_pt": "Olhando no espelho do passado como adotado coreano nos estados unidos", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 163171, "titulo": "The Conveniences I Used to Write a Book About Inconvenience (Definitely Not AI)", "url": "https://lithub.com/the-conveniences-i-used-to-write-a-book-about-inconvenience-definitely-not-ai/", "fonte_id": "lithub", "data_pub": "2026-09-15T09:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor se adaptou à ironia após alguns meses e notou que, quando contava a amigos sobre seu livro intitulado Contra a Conveniência, eles perguntavam se ele pretendia escrever à mão, usar corretor de ortografia ou se", "titulo_pt": "As ironias que utilizei para escrever um livro sobre inconveniências (definitivamente não é AI)", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 162311, "titulo": "'Criador' de Márcia Goldschmidt na TV processa SBT e pede indenização por reprises", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/09/criador-de-marcia-goldschmidt-na-tv-processa-sbt-e-pede-indenizacao-por-reprises.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-15T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Albert Lewitinn, criador do formato do programa que lançou Márcia Goldschmidt na televisão em 1997, processou o SBT por reprises não autorizadas do programa em TV aberta e streaming.", "titulo_pt": "Criador de programa com Márcia Goldschmidt processa SBT", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 163121, "titulo": "London has \"the best architecture and interior design community in Europe\" says Duncan Riches", "url": "https://www.dezeen.com/2026/09/15/shoreditch-design-week-ldf-duncan-riches-interview/", "fonte_id": "dezeen", "data_pub": "2026-09-15T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Duncan Riches, diretor criativo do Shoreditch Design Week, afirmou que Londres tem a melhor comunidade de arquitetura e design de interiores na Europa. O ev
