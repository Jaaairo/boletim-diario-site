<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "15/09/2026 15:22", "stats": {"noticias_novas": 1033, "resumos_gerados": 240}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Supremo Tribunal Federal (STF) tem enfrentado uma série de desafios e controvérsias em recentes sessões. Em um julgamento sobre a investigação do ministro Alexandre de Moraes, a presença de delegados da Polícia Federal em gabinetes de ministros foi questionada. Isso levou a debates sobre o papel da Polícia Federal no sistema judiciário. O ministro Luiz Fux afirmou que a Polícia Federal não deve trabalhar contra o sistema judiciário, enquanto Fachin rejeitou a possibilidade de ver um vídeo de Porchat, justificando que estava ocupado com documentos. No mesmo contexto, a sessão do STF sobre Moraes está sendo acompanhada por manifestações políticas, com a oposição realizando protestos na Esplanada dos Ministérios. A sessão está dividida em duas alas, com divergências entre ministros e acusações de vingança e uso político-eleitoral. Além disso, o STF está julgando se Moraes deve ser investigado por supostas relações com Daniel Vorcaro, com ministros como Toffoli se declarando suspeitos e Fachin enfatizando a importância de manter o funcionamento do tribunal.", "mundo": "Os Estados Unidos confirmaram a implantação de uma arma espacial em órbita terrestre, o que marca a primeira vez que admitiram ter capacidades ofensivas espaciais, gerando preocupações sobre um possível 'corrida armada' no espaço. Em outro desenvolvimento, o Canadá está sediando uma grande conferência de investimentos internacionais com o objetivo de atrair investimentos estrangeiros durante um conflito comercial com os Estados Unidos. Além disso, um juiz bloqueou o plano de retornar o nome de Trump ao Kennedy Center, afirmando que tal mudança requer aprovação do Congresso. No Brasil, Kassio Nunes Marques se declarou impedido de analisar o futuro de Sérgio Moraes devido à sua posição como presidente do Tribunal Superior Eleitoral, enquanto Jason Miller, ex-estrategista de Trump, publicou uma imagem de Alexandre de Moraes usando uma tornozeleira eletrônica, provocando nas redes sociais com uma referência a uma contagem regressiva.\n\nA Rússia enfrenta críticas internacionais, especialmente da França, por seu plano nuclear, que foi considerado 'irresponsável' por muitos. Em outro front geopolítico, a Dinamarca acusa a Rússia de ter disparado foguetes em direção a um de seus helicópteros, um incidente ocorrido no Mar Báltico. Por outro lado, a China se posiciona como uma potência emergente, buscando influência no Golfo sem recorrer a uma expansão militar excessiva. A tensão no Oriente Médio continua, com Israel enfrentando críticas internacionais após um ataque ao WCK em Gaza, enquanto o Irã prepara-se para uma visita do ministro das Relações Exteriores à China, após o Pentágono revelar os custos financeiros do conflito com o país.", "economia": "A economia brasileira e internacional enfrenta diversos desafios e movimentações. Destaque-se a guerra no Irã e as tarifas que elevam os custos da indústria nos Estados Unidos. No Brasil, o Banco Central injetou US$ 1 bilhão no mercado de câmbio, enquanto a Conab elevou a previsão da safra total de grãos para um novo recorde. As exportações de café do Brasil aumentaram mais de 50% em setembro. No cenário internacional, os preços do petróleo podem subir significativamente devido a uma linha de transmissão no Oriente Médio que permanece fechada, enquanto a França enfrenta pressões na arrecadação devido a altas taxas de juros. A indústria de data centers nos EUA enfrentará investimentos de 110 bilhões de dólares para a construção de novas usinas de energia até 2030, e o Brasil deve dobrar os investimentos em infraestrutura para reduzir o déficit histórico do setor. A bolsa de valores subiu nesta terça-feira, impulsionada pelo aumento do preço do petróleo e influenciada pelo cenário político, enquanto a corretora de criptoativos CoinEx anunciou o encerramento de suas operações devido a uma prolongada queda dos ativos digitais.", "tecnologia": "A preocupação com a inteligência artificial (IA) e suas implicações para a sociedade e a segurança nacional tem sido um tema central nos últimos meses. De acordo com um ex-funcionário do Google DeepMind, a IA pode 'destruir todos os seres humanos', destacando a urgência de medidas preventivas. O governo chinês, por sua vez, enfatizou a importância de avanços em IA e semicondutores em seu novo plano quinquenal, visando desafiar a dominância tecnológica dos Estados Unidos. Em um desenvolvimento relacionado, a TSMC, uma das maiores fabricantes de chips do mundo, expressou cautela na utilização de IA em pesquisas sensíveis, mostrando que a indústria está atenta aos riscos associados à tecnologia. Além disso, empresas de segurança e fabricantes de tecnologia de defesa estão unindo forças para ampliar a integração tecnológica, elevando os padrões do setor. Na área de saúde, a ideia de usar dados de empresas biotecnológicas falidas para acelerar os sistemas de IA médicos foi proposta, apontando para novas fronteiras na aplicação da tecnologia.", "ciencia": "Os Estados Unidos anunciaram o deslocamento de armas para a órbita para contrabalançar ameaças vindas da Rússia e da China, conforme informou um alto funcionário. Paralelamente, a NASA comemorou o International Observe the Moon Night, com eventos espalhados pelo país, incluindo o Goddard Space Flight Center, após a missão Artemis II, que levou quatro astronautas de volta à órbita lunar após 50 anos. A NASA também revelou uma panorâmica estelar da região de formação estelar IC 348, capturada pelo Telescópio Espacial James Webb, que ajudou os astrônomos a descobrir brown dwarfs com duas vezes a massa de Júpiter. Outros assuntos abordados incluem a expansão do programa Medicare que remunerará a tecnologia para gerenciar condições crônicas, a expansão de um programa piloto da FDA para acelerar a aprovação de medicamentos, e novos esforços para entender os componentes mais básicos do universo e a possibilidade de que a consciência possa não ser real. Além disso, a descoberta de uma árvore de maçã antiga no Senegal pode ter ajudado a reescrever a história das cultivares de maçãs nos Estados Unidos, enquanto a ciência continua a explorar questões fundamentais sobre a origem da vida e o futuro da longevidade humana.", "cultura": "A morte de Amelinha Teles, ativista e ex-prisioneira política que lutou contra a ditadura militar, aos 81 anos, representa um momento cultural importante. A artista Lucy Bull, representada pela galeria Hauser & Wirth, marca o início de uma nova fase na sua carreira. Outro destaque é a peça 'Meu Filho é um Musical', em cartaz no Teatro Renault, que transforma a biografia de Paulo Gustavo em um painel sobre cultura popular, afeto familiar e memória pública, consolidando a maturidade do teatro musical brasileiro. Além disso, a obra 'Chico 2.0' de Chico Buarque, que reinterpreta dez de seus clássicos em estilos como funk, rap, trap e soul, apresenta uma nova visão de seu legado artístico.", "sociedade": "A região do Jardim Pantanal, localizada na várzea do Rio Tietê, está alagada há quatro dias, desde que choveu intensamente em São Paulo a partir do sábado, 12 de setembro. A comunidade está se mobilizando para distribuir água e alimentos. Em Porto Seguro e região, um grupo foi denunciado por crimes violentos relacionados ao tráfico e lavagem de dinheiro. Policiais militares envolvidos na morte do sargento em um quartel em 2023, após uma discussão por escala de serviço, serão julgados hoje em São Paulo. O sistema de saúde brasileiro desperdiça entre R$ 240 bilhões e R$ 360 bilhões por ano, de acordo com um estudo elaborado pela Fesaúde e pelo SindHosp. A Caixa Econômica Federal e os bancários retomaram as negociações nesta quarta-feira (16) com o objetivo de encerrar a greve nacional, que começou no dia 10. A confiança na Polícia Federal é majoritária tanto entre apoiadores de Lula quanto entre apoiadores de Bolsonaro, com 70% dos brasileiros confiando na instituição. Em Seul, Coreia do Sul, 88,1% dos residentes na meia-idade cuidam de um parente ou de um filho, enquanto 49,9% cuidam de ambos simultaneamente. Um novo livro sugere que argumentos não são sobre vencer, mas parecem se concentrar nisso de qualquer maneira. A família e os amigos mais próximos de Federico Martin Aramburu testemunharam no tribunal parisiense, descrevendo-o como calmo e respeitoso. O contraste foi evidente com os réus da extrema-direita Loïk Le Priol e Romain Bouvier, que passaram por problemas relacionados à violência no passado. A diminuição da natalidade está resultando em uma menor matrícula em escolas privadas, levando a fusões entre instituições em Buenos Aires. O cuidado integrado e a perspectiva familiar são considerados importantes para a inclusão de pessoas com Transtorno do Espectro Autista. O Japão está intensificando as medidas contra o tráfico de pessoas, incluindo exploração laboral e sexual, em meio ao aumento no número de vítimas identificadas. Em Hong Kong, dois irmãos de meia-idade foram encontrados mortos em seu apartamento, mantidos financeiramente pelos pais. O número de reclamações para que suicídios sejam reconhecidos como mortes ocupacionais aumentou significativamente, mas o número de casos reconhecidos diminuiu. Mais de 17.000 crianças afetadas pela cheia no Nepal precisam de assistência psicológica e suporte psicossocial urgente. A viúva Li, de 38 anos, ainda aguarda a realização de uma inquérito sobre a morte do marido, dois anos após o incidente em Hong Kong. Trabalhadores da Kuai Kuai estiveram em protesto contra a venda de terrenos e exigiram compensação. Os salários médios estão aumentando, mas os salários medíados permanecem baixos, indicando uma possível desigualdade na distribuição de renda.", "meio_ambiente": "O padrão El Niño atingiu seu nível mais forte na história, trazendo mudanças climáticas intensas para regiões afetadas, incluindo chuvas abundantes e secas severas, além de calor extremo. Em Singapura, a qualidade do ar atingiu níveis prejudiciais à saúde devido à fumaça proveniente de incêndios florestais na Indonésia. No Brasil, as chuvas atrasaram a moagem de cana-de-açúcar, aumentando os preços do etanol. Em outro desenvolvimento, incêndios florestais na Albânia revelam a incapacidade do governo em lidar com a situação de forma eficaz.", "direitos_humanos": "A terceira Guerra Mundial foi identificada como o maior risco global para os próximos dois anos, conforme relatório da ONU. Em um desenvolvimento relacionado a direitos humanos, pelo menos 150 manifestantes pró-LGBTQ foram detidos pela polícia turca em Istambul em 15 de setembro, durante uma demonstração contra a repressão nacional à comunidade LGBTQ. As crianças na Ucrânia enfrentam o quinto ano sem acesso à educação, de acordo com relatório do UNICEF. Em um caso de violações de direitos humanos, um centro de detenção de imigrantes na Flórida foi descoberto não cumprindo normas básicas de higiene, atendimento médico, alimentação e segurança. Além disso, um antigo operador de um parlor em Tóquio foi condenado a cinco anos de prisão por contratar uma garota tailandesa de 12 anos para trabalhar no estabelecimento e obrigá-la a prestar serviços sexuais. O serviço de dados móveis e broadband foi suspenso no território do Paquistão-administrado Caxemira desde junho, quando protestos exigiam reformas eleitorais, resultando em uma interrupção da internet que cruzou os 100 dias. Uma organização de direitos humanos israelense, B’Tselem, afirma que a violência de colonos israelenses visa eliminar a existência dos palestinos."}, "resumo_do_dia": {"politica_nacional": [{"id": 163215, "titulo": "Presença de delegado da PF em gabinete de Moraes foi questionada em julgamento de golpe", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/presenca-de-delegado-da-pf-em-gabinete-de-moraes-foi-questionada-em-julgamento-de-golpe.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-15T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A presença de delegados da Polícia Federal em gabinetes de ministros do Supremo Tribunal Federal foi questionada durante um julgamento sobre uma tentativa de golpe por bolsonaristas. O tema gerou polêmica durante a sessão da corte na manhã de 15 de setembro de 2026.", "titulo_pt": "Presença de delegados da PF em gabinetes de ministros do stf foi questionada em julgamento sobre golpe", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 163298, "titulo": "Julgamento no STF: somos um país desgraçado", "url": "https://www.metropoles.com/colunas/mario-sabino/julgamento-no-stf-somos-um-pais-desgracado", "fonte_id": "metropoles", "data_pub": "2026-09-15T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O julgamento no STF sobre a investigação de Alexandre de Moraes levou à reflexão sobre a situação política do país. O texto faz referência a uma passagem de Os Donos do Poder, sugestivamente relacionando o caso com temas de poder e corrupção.", "titulo_pt": "Julgamento no STF: somos um país desgraçado", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 163299, "titulo": "MP cobra R$ 33 milhões de gestores que desviaram recursos de UTIs em 2003", "url": "https://www.metropoles.com/distrito-federal/mp-cobra-r-33-milhoes-de-gestores-que-desviaram-recursos-de-utis-em-2003", "fonte_id": "metropoles", "data_pub": "2026-09-15T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público do Distrito Federal e Territórios (MPDFT) está pedindo que cinco pessoas devolvam R$ 33 milhões que teriam sido desviados para equipamentos de Unidades de Terapia Intensiva (UTIs) em 2003.", "titulo_pt": "Mpdft cobra R$ 33 milhões de gestores que desviaram recursos de UTIs em 2003", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 163300, "titulo": "Veja principais momentos da 1ª parte do julgamento de ação contra Moraes", "url": "https://www.metropoles.com/brasil/veja-principais-momentos-da-1a-parte-do-julgamento-de-acao-contra-moraes", "fonte_id": "metropoles", "data_pub": "2026-09-15T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A primeira parte da sessão extraordinária no Supremo Tribunal Federal (STF) encerrou por volta das 13h e a próxima sessão está programada para às 15h.", "titulo_pt": "Veja principais momentos da 1ª parte do julgamento de ação contra Moraes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 163359, "titulo": "Luiz fux diz que PF não pode trabalhar contra o sistema judiciário", "url": "https://www.cnnbrasil.com.br/politica/luiz-fux-diz-que-pf-nao-pode-trabalhar-contra-o-sistema-judiciario/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Luiz Fux, durante uma sessão plenária no STF, afirmou que a Polícia Federal não deve trabalhar em oposição ao sistema judiciário.", "titulo_pt": "Luiz fux diz que PF não pode trabalhar contra o sistema judiciário", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 163368, "titulo": "“Não tive tempo”, diz Fachin a Dino ao responder se viu vídeo de Porchat", "url": "https://www.cnnbrasil.com.br/politica/nao-tive-tempo-diz-fachin-a-dino-ao-responder-se-viu-video-de-porchat/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fachin afirmou a Dino que não viu um vídeo de Porchat, pois estava ocupado lendo documentos relacionados a eventos envolvendo o STF.", "titulo_pt": "Fachin diz que não teve tempo para assistir ao vídeo de Porchat", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 163487, "titulo": "‘Pixuleco eleitoral’: Gilmar e Moraes acusam Mendonça de interferência nas eleições", "url": "https://www.jota.info/stf/do-supremo/pixuleco-eleitoral-gilmar-e-moraes-acusam-mendonca-de-interferencia-nas-eleicoes", "fonte_id": "jota", "data_pub": "2026-09-15T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Gilmar Mendes acusa Fachin de interferência nas eleições por meio do tema em questão. Moraes também acusa Mendonça de viés político eleitoral no tratamento do assunto.", "titulo_pt": "‘Pixuleco eleitoral’: gilmar e Moraes acusam Mendonça de interferência nas eleições", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 163370, "titulo": "Flávio reúne aliados no CE e liga Lula a Moraes em dia de sessão do STF", "url": "https://www.cnnbrasil.com.br/eleicoes/flavio-reune-aliados-no-ce-e-liga-lula-a-moraes-em-dia-de-sessao-do-stf/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T16:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro se reúne com aliados no Ceará, intensificando críticas ao Supremo Tribunal Federal e ao governo de Lula. O candidato também faz ligações entre o presidente Lula e o ministro do STF, Alexandre Moraes, em dia de sessão importante do tribunal.", "titulo_pt": "Flávio reúne aliados no CE e critica Lula e Moraes em dia de sessão do STF", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 163380, "titulo": "Entenda o que acontece se a sessão do STF sobre Moraes resultar em empate", "url": "https://www.cnnbrasil.com.br/politica/entenda-o-que-acontece-se-a-sessao-do-stf-sobre-moraes-resultar-em-empate/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T16:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Com Nunes Marques impedido e Toffoli suspeito, restam oito ministros para votar. Um empate na sessão do STF sobre Moraes depende do possível voto deste último.", "titulo_pt": "Entenda o que acontece se a sessão do STF sobre Moraes resultar em empate", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 163383, "titulo": "Oposição faz manifestação na Esplanada durante sessão no STF sobre Moraes", "url": "https://www.cnnbrasil.com.br/politica/oposicao-faz-manifestacao-na-esplanada-durante-sessao-no-stf-sobre-moraes/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T16:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A oposição realiza uma manifestação na Esplanada dos Ministérios enquanto o Plenário do Supremo Tribunal Federal (STF) se reúne para analisar um relatório da Polícia Federal que sugere uma relação próxima entre o ministro Alexandre de Moraes e o ex-banqueiro Daniel Vorcaro.", "titulo_pt": "Oposição realiza manifestação na Esplanada durante sessão no STF sobre Moraes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 163284, "titulo": "Caso Lito: esposa de Lito Sousa diz que ele recebeu substância experimental e está estável", "url": "https://veja.abril.com.br/saude/caso-lito-esposa-de-lito-sousa-diz-que-ele-recebeu-substancia-experimental-e-esta-estavel/", "fonte_id": "veja", "data_pub": "2026-09-15T15:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mila Seidl, esposa de Lito Sousa, informou que ele segue internado na UTI e está estável. A resposta ao tratamento será avaliada nas próximas semanas.", "titulo_pt": "Caso Lito: esposa diz que ele recebeu substância experimental e está estável", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 163488, "titulo": "Dino e Gilmar se unem para contestar atuação de Fachin e pedir adiamento de caso Moraes", "url": "https://www.jota.info/stf/do-supremo/dino-e-gilmar-se-unem-para-contestar-atuacao-de-fachin-e-pedir-adiamento-de-caso-moraes", "fonte_id": "jota", "data_pub": "2026-09-15T15:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dino e Gilmar se uniram para contestar a atuação de Fachin e pediram o adiamento do caso Moraes. O ministro Dino afirmou que retirar ministros da relatoria poderia levar ao desastre.", "titulo_pt": "Dino e Gilmar unem-se para contestar Fachin e pedir adiamento do caso Moraes", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 163189, "titulo": "Lula sanciona incentivo fiscal de R$ 5 bi para data centers e veta jabuti de emendas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/lula-sanciona-incentivo-fiscal-de-r-5-bilhoes-para-data-centers.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T15:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva sancionou as leis que estabelecem incentivos fiscais de R$ 5 bilhões para o setor de data centers no Brasil. Ele também vetou o jabuti de emendas relacionado a essas leis.", "titulo_pt": "Lula sanciona incentivo fiscal de R$ 5 bi para data centers e veta jabuti de emendas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 163190, "titulo": "Empresários dizem esperar que STF solucione crise", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/empresarios-dizem-esperar-que-stf-solucione-crise.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T15:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresários esperam que o STF encontre uma solução para a crise, mas consideram que os critérios de seleção dos ministros precisam ser revistos.", "titulo_pt": "Empresários esperam que STF resolva crise e revise critérios de seleção", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 163489, "titulo": "Lula recua no 1º turno e perde vantagem sobre Flávio no 2º, mostra Indexa Broadcast", "url": "https://www.jota.info/eleicoes/eleicoes-2026/lula-recua-no-1o-turno-e-perde-vantagem-sobre-flavio-no-2o-mostra-indexa-broadcast", "fonte_id": "jota", "data_pub": "2026-09-15T15:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No primeiro turno, Lula obteve 38% dos votos, contra 34% de Flávio. No segundo turno, a vantagem de Lula sobre Flávio é menor, com 43% a 42%.", "titulo_pt": "Lula reduz vantagem sobre Flávio no segundo turno, mostra pesquisa", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 163490, "titulo": "Dino e Fachin discutem em julgamento tenso no STF sobre Alexandre de Moraes", "url": "https://www.jota.info/stf/do-supremo/dino-e-fachin-discutem-em-julgamento-tenso-no-stf-sobre-alexandre-de-moraes", "fonte_id": "jota", "data_pub": "2026-09-15T15:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Fachin pediu que todos pedissem a palavra ao presidente durante a sessão no STF, em julgamento envolvendo Alexandre de Moraes. O vídeo do julgamento está disponível para visualização.", "titulo_pt": "Fachin e Alexandre de Moraes discutem em julgamento tenso no STF", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 163290, "titulo": "Rússia é acusada de atacar helicóptero da Dinamarca", "url": "https://www.metropoles.com/mundo/russia-e-acusada-de-atacar-helicoptero-da-dinamarca", "fonte_id": "metropoles", "data_pub": "2026-09-15T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Dinamarca acusa a Rússia de ter atacado um helicóptero da sua frota. O incidente levou à convocação do embaixador russo na Dinamarca para esclarecimentos.", "titulo_pt": "Rússia é acusada de atacar helicóptero da Dinamarca", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 163722, "titulo": "Canada is a 'safe harbour' for global finance, Carney says", "url": "https://www.bbc.co.uk/news/articles/cmq8jdgel128o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-15T17:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Canadá está sediando uma grande conferência de investimentos internacionais com o objetivo de atrair investimentos estrangeiros durante um conflito comercial com os Estados Unidos.", "titulo_pt": "Canadá é um 'porto seguro' para finanças globais, diz Carney", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 163311, "titulo": "Rússia amplia presença no Sahel em meio à reação anticolonial na África", "url": "https://www.brasildefato.com.br/2026/09/15/russia-amplia-presenca-no-sahel-em-meio-a-reacao-anticolonial-na-africa/", "fonte_id": "brasil_de_fato", "data_pub": "2026-09-15T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Rússia tem aumentado sua diplomacia com os países africanos, destacando o fortalecimento das relações e preparando-se para a próxima Cúpula Rússia-África em Moscou. Essa movimentação ocorre em meio à reação anticolonial na região do Sahel.", "titulo_pt": "Rússia amplia presença no Sahel em meio à reação anticolonial na África", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 163657, "titulo": "Judge blocks plan to return Trump's name to the Kennedy Center", "url": "https://www.npr.org/2026/09/15/nx-s1-5969905/kennedy-center-trump-name", "fonte_id": "npr_news", "data_pub": "2026-09-15T17:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz bloqueou o plano de retornar o nome de Trump ao Kennedy Center, afirmando que tal mudança requer aprovação do Congresso.", "titulo_pt": "Juiz proíbe retorno do nome de Trump ao Kennedy Center", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 163635, "titulo": "Are Chinese Firms Handing the United States Data?", "url": "https://foreignpolicy.com/2026/09/15/china-us-ai-artificial-intelligence-data-summit-anthropic/", "fonte_id": "foreign_policy", "data_pub": "2026-09-15T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas chinesas podem estar fornecendo dados ao Estados Unidos sem perceber. A competição em inteligência artificial pode ser uma fraqueza inadvertida para Pequim.", "titulo_pt": "As empresas chinesas estão entregando dados para os estados unidos?", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 163835, "titulo": "Tajani, 'Italia difende la sua sicurezza, da Madrid reazione fuori luogo e aggressiva'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/15/tajani-italia-difende-la-sua-sicurezza-da-madrid-reazione-fuori-luogo-e-aggressiva_0f46eb0c-d119-4807-a703-218aaef98705.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-15T17:45:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O ministro italiano do Trabalho, Giorgio Tajani, afirmou que a Itália defende sua segurança. A reação de Madrid foi considerada fora do lugar e agressiva.", "titulo_pt": "Tajani: Italia defende sua segurança, reação de Madrid foi fora do lugar e agressiva", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 163725, "titulo": "British woman abducted in Malawi, police say", "url": "https://www.bbc.co.uk/news/articles/c60qx40xnkedo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-15T17:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher britânica, mãe de dois filhos, foi sequestrada durante o dia na cidade principal de Blantyre, na Malawi.", "titulo_pt": "Britânica sequestrada no principal centro da Malawi, diz polícia", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 163658, "titulo": "Prosecutors won't seek the death penalty for Nick Reiner", "url": "https://www.npr.org/2026/09/15/nx-s1-5969890/nick-reiner-rob-reiner-murder-charges-death-penalty", "fonte_id": "npr_news", "data_pub": "2026-09-15T17:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O procurador Nathan Hochman, da Promotoria do Condado de Los Angeles, declarou que sua equipe conversou com os irmãos de Nick Reiner e levou suas preferências em consideração na decisão de não pedir a pena de morte.", "titulo_pt": "Procuradores não solicitarão pena de morte para Nick Reiner", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 163659, "titulo": "Republican Rep. Massie moves to impeach Defense Secretary Hegseth over Iran war", "url": "https://www.npr.org/2026/09/15/g-s1-143407/massie-impeach-hegseth-iran", "fonte_id": "npr_news", "data_pub": "2026-09-15T17:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O republicano Thomas Massie, de Kentucky, apresentou artigos de impeachment contra o Secretário de Defesa Pete Hegseth em relação à guerra no Irã.", "titulo_pt": "Repúblico thomas massie move impeachment contra secretário de defesa pete Hegseth por guerra no Irã", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 163729, "titulo": "Warning of space arms race as US confirms weapons in Earth's orbit", "url": "https://www.bbc.co.uk/news/videos/cmn07yjqg5rwo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-15T17:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos confirmaram a implantação de uma arma espacial em órbita terrestre, sendo a primeira vez que admitiram ter capacidades ofensivas espaciais.", "titulo_pt": "Aviso de corrida armamentista no espaço após confirmação dos EUA de armas em órbita terrestre", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 163604, "titulo": "Harry and Meghan Change Children’s School After Talks With Security Team", "url": "https://www.nytimes.com/2026/09/15/world/europe/prince-harry-meghan-children-schools-security.html", "fonte_id": "nyt_world", "data_pub": "2026-09-15T17:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Harry e Meghan mudaram a escola dos filhos após conversas com a equipe de segurança privada. Os seguranças expressaram preocupações sobre a dificuldade de garantir a segurança do trajeto escolar em trânsito.", "titulo_pt": "Harry e Meghan alteram escola dos filhos após conversas com equipe de segurança", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 163836, "titulo": "++ Ex Ilva, possibile offerta della cordata italiana a ottobre ++", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/15/-ex-ilva-possibile-offerta-della-cordata-italiana-a-ottobre-_14bda76c-c8b1-4a80-9859-7ab23ca1a5d7.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-15T17:09:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Há possibilidade de uma oferta da 'cordata italiana' (a empresa que administra os ativos da ex-Ilva) para participar na empresa até outubro, mas ainda não há informações sobre a participação do estado.", "titulo_pt": "Ex-ilva, possibilidade de oferta da 'cordata italiana' até outubro", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 164006, "titulo": "Trump’s planned sale of controversial bombs to Israel is largest in years", "url": "https://www.washingtonpost.com/national-security/2026/09/15/trump-preparing-send-massive-shipment-2000-pound-bombs-israel/", "fonte_id": "washington_post_world", "data_pub": "2026-09-15T17:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump está planejando vender bombas controversas de 2.000 libras para Israel, o maior negócio desse tipo em anos. Essa transferência, envolvida em várias situações que resultaram em vítimas civis, pode servir como um teste potencial para os democratas.", "titulo_pt": "Plano de trump vender bombas controversas de 2.000 libras para Israel é o maior em anos", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 163733, "titulo": "OpenAI, Anthropic and Google in talks to create a standards body as AI fears rise", "url": "http://www.france24.com/en/technology/20260915-openai-anthropic-and-google-in-talks-to-create-a-standards-body-as-ai-fears-rise", "fonte_id": "france24", "data_pub": "2026-09-15T17:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grandes empresas de IA como OpenAI, Anthropic e Google estão em negociações para criar uma nova entidade de padrões da indústria. Essa iniciativa surge em meio a crescentes preocupações sobre os riscos associados à inteligência artificial, que estão aumentando a necessidade de maior supervisão e desenvolvimento mais seguro da tecnologia.", "titulo_pt": "Openai, Anthropic e Google em negociações para criar uma entidade de padrões da indústria de IA", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 163746, "titulo": "How the French presidential battle will play out in Parliament", "url": "https://www.lemonde.fr/en/politics/article/2026/09/15/how-the-french-presidential-battle-will-play-out-in-parliament_6757561_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-15T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oito meses antes das eleições presidenciais, a sessão final do parlamento oferece a deputados ambiciosos a chance de afirmar sua identidade política, o que pode complicar o processo orçamentário.", "titulo_pt": "Como a batalha presidencial francesa vai se desenhar no parlamento", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 163748, "titulo": "French tourists travel less while record number of internationals visit France", "url": "https://www.lemonde.fr/en/france/article/2026/09/15/french-tourists-travel-less-while-record-number-of-internationals-visit-france_6757560_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-15T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de visitantes internacionais e os recebimentos aumentaram durante o verão, mas o número de turistas franceses diminuiu em julho e agosto. Os franceses reduziram as férias e diminuíram o gasto devido ao aumento do custo de vida e às recentes ondas de calor.", "titulo_pt": "Turistas franceses viajam menos enquanto número recorde de estrangeiros visitam a França", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 163182, "titulo": "Área técnica do TCU sugere alertar governo sobre previsão de receitas com taxação de dividendos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/area-tecnica-do-tcu-sugere-alertar-governo-sobre-previsao-de-receitas-com-taxacao-de-dividendos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A área técnica do TCU sugeriu que a corte emita um alerta ao governo Lula sobre o risco de manter a previsão integral de arrecadação com a tributação de dividendos no Orçamento, considerando que o recolhimento no primeiro semestre foi apenas 5% do total estimado para o ano.", "titulo_pt": "Área técnica do TCU sugere alertar governo sobre previsão de receitas com taxação de dividendos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 163758, "titulo": "Saudi pipeline closure is a brief interruption that will last days, U.S. Energy Secretary tells CNBC", "url": "https://www.cnbc.com/2026/09/15/saud-arabia-east-west-pipeline-iran-war-chris-wright.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-15T17:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Iêmen fez um ataque com drones que danificou a linha de pipeline do Oriente para Ocidente na Arábia Saudita, fechando-a temporariamente por alguns dias, conforme informou o Secretário de Energia dos Estados Unidos à CNBC.", "titulo_pt": "Fechamento da linha de pipeline na arábia saudita é interrupção temporária de alguns dias, diz secretário de energia dos EUA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 163185, "titulo": "Banco Central injeta US$ 1 bilhão no mercado à vista em meio a saída de dólares", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/banco-central-injeta-us-1-bilhao-no-mercado-a-vista-em-meio-a-saida-de-dolares.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T16:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central injetou US$ 1 bilhão no mercado de câmbio através de duas operações simultâneas de compra e venda de dólares na manhã de terça-feira (15).", "titulo_pt": "Banco Central injeta US$ 1 bilhão no mercado de câmbio em meio à saída de dólares", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 163285, "titulo": "Sancionado regime especial para incentivar instalação de datacenters", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/sancionado-regime-especial-para-incentivar-instalacao-de-datacenters", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-15T16:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Foi sancionada uma lei que cria o Regime Especial de Tributação para Serviços de Datacenter (Redata), com o objetivo de estimular a instalação e a ampliação de centros de processamento de dados no Brasil. A nova legislação visa fortalecer o setor de tecnologia da informação e tornar o país mais atrativo para projetos de computação em nuvem.", "titulo_pt": "Sancionado regime especial para incentivar instalação de datacenters", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 163186, "titulo": "Justiça multa fabricante de jogo do aviãozinho e suspende fornecimento a bets ilegais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/justica-multa-fabricante-de-jogo-do-aviaozinho-e-suspende-fornecimento-a-bets-ilegais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T15:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça do Distrito Federal determinou que a Spribe, fabricante do jogo Aviator, também conhecido como aviãozinho, suspenda a oferta de jogos para sites clandestinos. A medida visa restringir o fornecimento a sites que não possuem a licença obrigatória do Ministério da Fazenda.", "titulo_pt": "Justiça determina suspensão do fornecimento de jogos de aviãozinho a sites ilegais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 163187, "titulo": "Guerra no Irã, tarifas e IA elevam custos da indústria dos EUA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/guerra-no-ira-tarifas-e-ia-elevam-custos-da-industria-dos-eua.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T15:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indústria dos Estados Unidos enfrenta uma nova onda de inflação na cadeia de suprimentos devido a uma guerra com o Irã, aumento de tarifas e expansão da inteligência artificial.", "titulo_pt": "Guerra no Irã, tarifas e IA elevam custos da indústria dos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 163286, "titulo": "Tesouro honra R$ 79,95 m em dívidas de estados e municípios em agosto", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/tesouro-honra-r-7995-m-em-dividas-de-estados-e-municipios-em-agosto", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-15T15:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em agosto, o Tesouro Nacional pagou R$ 79,95 milhões em dívidas de estados e municípios. No acumulado de 2026, o valor desembolsado pela União para cobrir parcelas não quitadas pelos devedores chegou a R$ 3,13 bilhões.", "titulo_pt": "Tesouro honra R$ 79,95 milhões em dívidas de estados e municípios em agosto", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 163793, "titulo": "US manufacturers hit by fresh burst of supply chain cost inflation", "url": "https://www.ft.com/content/e14542d9-2bc5-49c8-8e7e-c9656b0a2d36?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-15T15:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A guerra do Irã e as tarifas de Donald Trump aumentaram os preços de entrada, enquanto o boom da IA reduziu a disponibilidade de alguns componentes, levando a uma nova onda de inflação nos custos da cadeia de suprimentos industriais nos Estados Unidos.", "titulo_pt": "Industriais norte-americanos enfrentam nova onda de inflação de custos da cadeia de suprimentos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 163192, "titulo": "LVMH é ultrapassada pela L'Oreal e deixa de ser top 10 entre empresas europeias após 9 anos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/09/01/6558-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466837", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T15:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O conglomerado LVMH, proprietário de marcas como Louis Vuitton e Dior, deixou de figurar entre as dez maiores empresas de capital aberto da Europa após liderar o mercado durante o boom pós-pandemia. A L'Oreal superou o LVMH, causando uma reviravolta simbólica para a empresa que havia ocupado o topo por nove anos consecutivos.", "titulo_pt": "LVMH deixa de ser uma das dez maiores empresas de capital aberto da Europa após 9 anos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 163194, "titulo": "Boom de data centers de IA nos EUA exige US$ 110 bi em novas usinas de energia, diz Moody's", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/boom-de-data-centers-de-ia-nos-eua-exige-us-110-bi-em-novas-usinas-de-energia-diz-moodys.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os dados centers de inteligência artificial nos Estados Unidos exigirão investimentos de 110 bilhões de dólares para a construção de 45 gigawatts de nova capacidade de geração de energia até 2030, conforme análise da Moody's Ratings.", "titulo_pt": "Boom de data centers de IA nos EUA exigirá investimentos de 110 bi em novas usinas de energia, diz Moody's", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 163195, "titulo": "Conab eleva previsão de safra total de grãos em 2025/2026 no Brasil e estima novo recorde", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/09/conab-eleva-previsao-de-safra-total-de-graos-em-20252026-no-brasil-e-estima-novo-recorde.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T14:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Conab (Companhia Nacional de Abastecimento) elevou a previsão da safra total de grãos e oleaginosas para 361,7 milhões de toneladas em 2025/2026, um novo recorde. Isso representa uma leve alta em comparação com a previsão anterior de 360,75 milhões de toneladas.", "titulo_pt": "Conab eleva previsão de safra total de grãos e oleaginosas para novo recorde em 2025/2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 163196, "titulo": "Vendas no varejo do Brasil recuam mais do que o esperado em julho", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/vendas-no-varejo-do-brasil-recuam-mais-do-que-o-esperado-em-julho.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T14:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As vendas varejistas no Brasil registraram uma queda maior do que o esperado em julho, indicando uma fraqueza no início do segundo semestre e sendo o pior desempenho em três meses.", "titulo_pt": "Vendas no varejo do Brasil recuam mais do que o esperado em julho", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 163197, "titulo": "Alta do frete para a China pressiona pequenas mineradoras brasileiras", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/09/alta-do-frete-para-a-china-pressiona-pequenas-mineradoras-brasileiras.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T13:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pequenas mineradoras brasileiras enfrentam dificuldades com a elevação dos custos de transporte para a China, principal destino dos minérios, o que reduz as margens de lucro e leva a cortes na produção.", "titulo_pt": "Aumento do frete para a China pressiona mineradoras brasileiras", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 163498, "titulo": "Começou a corrida pela tokenização de ações e digitalização do mercado de capitais", "url": "https://www.jota.info/opiniao-e-analise/colunas/deixe-dados-falarem/comecou-a-corrida-pela-tokenizacao-de-acoes-e-digitalizacao-do-mercado-de-capitais", "fonte_id": "jota", "data_pub": "2026-09-15T13:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Começou a corrida pela tokenização de ações e digitalização do mercado de capitais, com foco em emissão, negociação, liquidação e direitos das ações token
