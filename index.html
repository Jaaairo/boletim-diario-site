<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

</div>

const D = {"gerado_em": "28/08/2026 19:18", "stats": {"noticias_novas": 487, "resumos_gerados": 234}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "As eleições presidenciais de 2026 no Brasil têm 13 candidatos registrados, com o primeiro turno marcado para 4 de outubro e o segundo turno, se necessário, para 25 de outubro. Durante sua primeira aparição na televisão, Lula abordou o caso da rachadinha e acusou Flávio Bolsonaro de ter ligação com milicianos. O ministro André Mendonça, do STF, suspendeu o julgamento virtual sobre os impostos da Vale no exterior. Lula visitará cidades de São Paulo com o objetivo de fortalecer a presença do PT em regiões que já foram governadas pelo partido. Aécio Neves confirmou sua candidatura ao Senado pelo estado de Minas Gerais, mesmo após o prazo para registro de candidaturas ter expirado. O governo planeja incluir um superávit de R$ 18 a R$ 20 bilhões na proposta de Orçamento para 2027.", "mundo": "Um colapso de geleira no Nepal causou alagamentos e deixou centenas de mortos e desaparecidos, conforme mostram vídeos do The New York Times. Em Berlim, o prefeito Kai Wegner está negociando com hackers após um ataque cibernético. Na Espanha, mais de 70.000 migrantes atravessaram para Ceuta, levando a protestos locais e pedindo ajuda da Frontex. O presidente russo Vladimir Putin realizou um teste nuclear intercontinental, em meio a tensões com a OTAN. No Equador, o ex-presidente Lenin Moreno foi condenado por corrupção, enquanto o presidente da República Democrática do Congo, Félix Tshisekedi, convoca um diálogo nacional, excluindo os rebeldes M23. O governo do Iraque do Kurdistão teme que o corte de assistência militar dos EUA o deixe mais vulnerável a ataques iranianos.\n\nNo cenário geopolítico atual, o Irã e a Rússia enfrentam desafios significativos. O Irã, após reuniões com o Catar, planeja reabrir o Estreito de Ormuz sob certas condições, enquanto a Rússia pode tomar medidas contra a Otan devido às dificuldades na guerra na Ucrânia. A Rússia está enfrentando uma perda significativa de soldados no conflito ucraniano, com a perda de aproximadamente 6.000 soldados por mês, o que pode levar Moscou a considerar ações contra a Otan. Paralelamente, o presidente americano Donald Trump assinou um Decreto Executivo para criar a primeira Academia Espacial dos Estados Unidos, visando fortalecer a força de trabalho espacial e desenvolver líderes do futuro. Em outro front, Israel realizou novos ataques em Gaza, resultando na morte de cinco pessoas, incluindo três membros de uma mesma família, exacerbando a grave insegurança alimentar na faixa de Gaza. Além disso, a economia canadense recuperou-se fortemente no segundo trimestre, mas persiste a sombra das tarifas americanas. Outros eventos notáveis incluem a rejeição do acordo entre Líbano e Israel pelo chefe do Hezbollah, a propagação da Ebola para duas novas regiões na República Democrática do Congo, e a série de ataques a drones israelenses no sul do Líbano e na Ucrânia.", "economia": "O Ibovespa encerrou a semana em recuperação, refletindo um aumento do apetite ao risco, após o discurso do presidente do Federal Reserve, Kevin Warsh, que enfatizou a persistência da inflação e a determinação do Fed em atingir a meta de 2% de inflação. O dólar encerrou próximo a R$5,20, influenciado pelas declarações de Warsh e pela postura cautelosa dos investidores. A eleição no Brasil, que terminará em outubro, continua gerando incerteza no mercado, mas após o segundo turno, a atenção se voltará para como o vencedor implementará seu plano de governo. No campo agrícola, a colheita de milho avançou para 88,4% da área total, enquanto o trigo atingiu níveis não vistos em três anos devido a restrições no Mar Negro. O governo sancionou uma lei que permite a redução de alíquotas de tributos sobre combustíveis, aliviando os impactos econômicos do conflito no Oriente Médio. Em meio a esses eventos, a indústria manufatureira dos Estados Unidos está em expansão, mas isso não é devido às tarifas impostas pelo ex-presidente Trump. Além disso, a Venezuela está avaliando a possibilidade de deixar a Opep, o que amplia as dúvidas sobre o futuro do grupo.", "tecnologia": "Um robô chinês realizou uma cirurgia de remoção total da próstata a 3 mil quilômetros de distância em Goiás, utilizando o sistema cirúrgico robótico Toumai, demonstrando o avanço tecnológico chinês na área de robótica médica. Em Pequim, a China consolidou seu domínio no setor de robótica, com as empresas chinesas responsáveis por mais de 97% dos robôs humanoides fabricados no primeiro semestre de 2026. A inteligência artificial (IA) também ganhou destaque, com a substituição de atores chineses por personagens gerados por IA em produções de drama. Além disso, em resposta à rivalidade com a China, os Estados Unidos criaram a 'Academia Espacial' para formar futuros recrutas civis e militares em um campo estratégico. A Neocloud Lambda levantou $1 bilhão em dívida para adquirir chips de inteligência artificial da Nvidia e alugá-los para a Microsoft, refletindo o alto custo da expansão da IA.", "ciencia": "A NASA anunciou a vitória do MIT na fase 2 do desafio LunaRecycle, oferecendo um prêmio de $775.000 para soluções de reciclagem de materiais comuns em missões espaciais. Em outro avanço tecnológico, cientistas da DGIST desenvolveram um sensor vestível de gás que pode monitorar condições respiratórias e detectar gases perigosos em tempo real. A NASA também premiou os astronautas da missão Artemis II com a medalha do Congresso honorária espacial. Por outro lado, a Alemanha corre o risco de não atingir seu objetivo de combate ao clima em 2026, a menos que as reduções nas emissões de gases de efeito estufa aumentem significativamente, alertou um think tank. Além disso, o Telescópio Espacial Roman da NASA está previsto para revelar 10 importantes descobertas científicas, abrindo uma nova janela para o cosmos.", "cultura": "A Festa Literária das Periferias (Flup), que acontecerá em setembro no Rio de Janeiro, será uma importante celebração do pensamento negro internacional. O evento Rock in Rio 2026 contará com mais de 7.600 agentes de segurança, incluindo policiais e bombeiros, além do uso de drones, para garantir a segurança de um público estimado em mais de 700 mil pessoas. No mundo da arte, Ryoji Ikeda foi premiado com o Prêmio Nam June Paik 2026, recebendo KRW 50 milhões durante uma cerimônia no Centro de Arte Nam June Paik em Yongin, Coreia do Sul. Além disso, a Riverside Art Museum de California anunciou que Vivian Zavataro será sua nova diretora executiva a partir de 1º de outubro, sucedendo Drew Oberjuerge, que ocupou o cargo por mais de 13 anos.", "sociedade": "A população de Taipei está prevista para diminuir, conforme alerta do conselho local, o que levanta preocupações sobre o futuro demográfico. Em Goiás, um zelador agredido na Asa Norte sofreu um traumatismo craniano e está internado em estado grave, o que levou a uma nova onda de preocupações sobre a segurança no local. Um homem foi preso em Planaltina de Goiás após importunar sexualmente mulheres na rodoviária, destacando o problema de abuso sexual em espaços públicos. O ministro Gilmar Mendes defendeu a necessidade de mais mulheres no Supremo Tribunal Federal (STF), reforçando a discussão sobre a representatividade feminina na magistratura. Um menino de 10 anos acionou a patrulha Maria da Penha usando emojis após o ex-companheiro da mãe invadir a casa, salientando a importância do uso de tecnologia na proteção de mulheres em situação de risco. Além disso, a viúva do apresentador Silvio Santos, Íris Abravanel, está entre os maiores bilionários do Brasil, refletindo a fortuna do SBT. Um homem foi detido no Espírito Santo após filmar uma dança antes de incendiar um veículo da Polícia Militar e explodir uma viatura, evidenciando a crescente preocupação com a segurança pública.", "meio_ambiente": "Um novo lago formado na fronteira entre Nepal e China está causando preocupações devido ao risco de inundações adicionais, levando as autoridades a alertarem para a possibilidade de novos desastres. A Federação da Cruz Vermelha e do Crescente Vermelho Internacional informou que pelo menos 93.000 pessoas foram afetadas pelas cheias na região, com 600 mortos e 1.900 desaparecidos. Enquanto isso, equipes de resgate enfrentam dificuldades devido ao risco de novos alagamentos. Em Águas Claras, Distrito Federal, um incêndio próximo ao trilho do Metrô não danificou estruturas e não interrompeu a circulação dos trens. No Sul do Brasil, o Inmet emitiu alertas para chuva e ventos intensos, com previsão de ventos de até 100 km/h e precipitação de 50 a 100 mm/dia. Em Rondônia, a Polícia Federal realizou uma operação contra a extração ilegal de madeira em uma área indígena, resultando em duas prisões em flagrante por posse ilegal de armas de fogo e munições. A estiagem severa na Europa está causando a seca de rios e campos, prejudicando a agricultura e os recursos hídricos.", "direitos_humanos": "Um tribunal holandês condenou um homem de 66 anos a prisão perpétua por seu papel no genocídio ruandês de 1994, reforçando a gravidade dos crimes contra os direitos humanos. Em outra notícia, quatro crianças morreram em ataques separados que destruíram suprimentos humanitários e danificaram a infraestrutura de água em Gaza, evidenciando a vulnerabilidade das populações civis em conflitos. Além disso, a ONU relatou que 160 mil mulheres e meninas foram afetadas por uma enchente no Nepal, enfrentando riscos maiores de violência e empobrecimento. Em Hong Kong, um advogado alertou contra a divulgação de informações pessoais de outras pessoas nas redes sociais, chamando a atenção para o crime de doxxing. Estes eventos refletem a complexidade e a urgência da situação dos direitos humanos em diferentes partes do mundo."}, "resumo_do_dia": {"politica_nacional": [{"id": 130957, "titulo": "Eleições 2026: veja todos os candidatos à Presidência da República", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/28/eleicoes-2026-veja-todos-os-candidatos-a-presidencia-da-republica.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-28T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil tem 13 candidatos registrados para disputar a Presidência da República nas eleições de 2026. O 1º turno será realizado em 4 de outubro, com o 2º turno agendado para 25 de outubro, se necessário.", "titulo_pt": "Eleições 2026: confira todos os candidatos à Presidência da República", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 130984, "titulo": "Na primeira inserção eleitoral na TV, Lula vai para cima de Flávio Bolsonaro", "url": "https://veja.abril.com.br/brasil/na-primeira-insercao-eleitoral-na-tv-lula-vai-para-cima-de-flavio-bolsonaro/", "fonte_id": "veja", "data_pub": "2026-08-28T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula, em sua primeira inserção eleitoral na TV, abordou o caso da rachadinha, a suspeita de envolvimento com milicianos e um áudio onde Flávio Bolsonaro pede dinheiro a Daniel Vorcaro.", "titulo_pt": "Na primeira inserção eleitoral na TV, Lula ataca Flávio Bolsonaro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 131112, "titulo": "Mendonça leva tributação de empresas no exterior ao plenário físico do STF", "url": "https://www.metropoles.com/colunas/manoela-alcantara/mendonca-leva-tributacao-de-empresas-no-exterior-ao-plenario-fisico-do-stf", "fonte_id": "metropoles", "data_pub": "2026-08-28T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O caso foi levado ao plenário físico do Supremo Tribunal Federal (STF) por meio de um recurso da União contra uma decisão do Superior Tribunal de Justiça (STJ) que favorecia a empresa Vale. O tema em questão é a tributação de empresas no exterior.", "titulo_pt": "Mendonça leva tributação de empresas no exterior ao plenário do STF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 130958, "titulo": "Arruda se defende no TRE após impugnações e diz que está elegível ao governo do DF", "url": "https://g1.globo.com/df/distrito-federal/eleicoes/2026/noticia/2026/08/28/arruda-se-defende-no-tre-apos-impugnacoes-e-diz-que-esta-elegivel-ao-governo-do-df.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-28T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "José Roberto Arruda apresentou sua defesa ao Tribunal Regional Eleitoral (TRE) contra impugnações à sua candidatura ao governo do Distrito Federal. Arruda argumenta que o cálculo do prazo de inelegibilidade deve considerar a data da primeira condenação colegiada.", "titulo_pt": "Arruda se defende no TRE após impugnações e afirma estar elegível ao governo do DF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 130946, "titulo": "Mendonça suspende julgamento no STF sobre tributação da Vale no exterior", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/mendonca-suspende-julgamento-no-stf-sobre-tributacao-da-vale-no-exterior.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça, do Supremo Tribunal Federal, pediu destaque e suspendeu o julgamento virtual sobre a cobrança de Imposto sobre a Renda da Pessoa Jurídica e Contribuição Social sobre o Lucro Líquido sobre lucros auferidos por controladas da Vale no exterior.", "titulo_pt": "Mendonça suspende julgamento no STF sobre tributação da Vale no exterior", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 130959, "titulo": "Quaest em SE: veja intenção de voto para governador por sexo, raça, idade, escolaridade, religião, renda e identificação política", "url": "https://g1.globo.com/se/sergipe/eleicoes/2026/noticia/2026/08/28/quaest-em-se-veja-intencao-de-voto-para-governador-por-sexo-raca-idade-escolaridade-religiao-renda-e-identificacao-politica.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-28T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest revela que o atual governador de Sergipe, Fábio Mitidieri, lidera a disputa pelo governo em diversos grupos demográficos e socioculturais, com Valmir de Francisquinho em segundo lugar. O levantamento foi encomendado pela TV Sergipe e divulgado nesta quinta-feira (27).", "titulo_pt": "Veja intenção de voto para governador por sexo, raça, idade, escolaridade, religião, renda e identificação política em sergipe", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 131143, "titulo": "Nunes Marques promove workshop com plataformas e juízes para discutir deepfakes", "url": "https://www.jota.info/eleicoes/eleicoes-2026/nunes-marques-promove-workshop-com-plataformas-e-juizes-para-discutir-deepfakes", "fonte_id": "jota", "data_pub": "2026-08-28T20:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do TSE, Nunes Marques, realizou um workshop na terça-feira envolvendo plataformas digitais, juízes e partidos políticos com o objetivo de discutir a problemática das deepfakes. O evento visava combater o uso dessas tecnologias fraudulentas.", "titulo_pt": "Nunes Marques promove workshop para discutir deepfakes", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 131047, "titulo": "Haddad critica situação da educação especial em SP: “Em frangalhos”", "url": "https://www.cnnbrasil.com.br/eleicoes/haddad-critica-situacao-da-educacao-especial-em-sp-em-frangalhos/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato do PT, Haddad, ouviu reclamações de mães sobre a situação da educação especial em São Paulo, que ele descreveu como 'em frangalhos'. As queixas serão levadas a órgãos de controle.", "titulo_pt": "Haddad critica situação da educação especial em SP: 'em frangalhos'", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 131048, "titulo": "Lula reforça agenda em regiões de São Paulo que tiveram gestões petistas", "url": "https://www.cnnbrasil.com.br/eleicoes/lula-reforca-agenda-em-regioes-de-sao-paulo-que-tiveram-gestoes-petistas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula está programado para visitar várias cidades de São Paulo, incluindo Santos, Ribeirão Preto e Araraquara, com o objetivo de fortalecer a presença do PT no estado. As visitas visam reforçar a agenda do partido em regiões que tiveram gestões petistas.", "titulo_pt": "Lula visitará cidades de São Paulo para fortalecer presença do pt", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 130960, "titulo": "Veja o que é #FATO e o que é #FAKE na sabatina de Augusto Cury a 'O Globo', 'Valor' e CBN", "url": "https://g1.globo.com/fato-ou-fake/eleicoes/noticia/2026/08/28/veja-o-que-e-fato-e-o-que-e-fake-na-sabatina-de-augusto-cury-a-o-globo-valor-e-cbn.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-28T20:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury, candidato à Presidência pelo Avante, participou de uma sabatina com jornalistas de 'O Globo', 'Valor' e CBN. A entrevista durou 1h30 e foi conduzida por Milton Jung, Lauro Jardim, Malu Gaspar e Maria Cristina Fernandes.", "titulo_pt": "Veja O que é #FATO e O que é #FAKE na sabatina de Augusto Cury a 'O Globo', 'Valor' e CBN", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 130935, "titulo": "Michelle Bolsonaro diz que é voluntária da igreja e vendeu laranjas no semáforo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/08/michelle-bolsonaro-diz-que-e-voluntaria-da-igreja-e-vendeu-laranjas-no-semaforo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-28T19:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michelle Bolsonaro, ex-primeira-dama e candidata ao Senado Federal, destaca em seu jingle de campanha que vendeu laranjas no semáforo quando criança e que é voluntária da igreja e empresária. Ela menciona ter trabalhado vendendo laranjas aos 10 anos em um semáforo na Ceilândia, região administrativa de Brasília.", "titulo_pt": "Michelle Bolsonaro diz que vendeu laranjas no semáforo e é voluntária da igreja", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 130936, "titulo": "Lula ganha destaque em programas estaduais de aliados; Flávio é exibido no RJ e no PR", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/lula-ganha-destaque-em-programas-estaduais-de-aliados-flavio-e-exibido-no-rj-e-no-pr.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-28T19:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula apareceu mais em programas eleitorais de TV dos principais estados brasileiros do que o senador Flávio Bolsonaro. Esses programas começaram a ser exibidos nesta sexta-feira (28).", "titulo_pt": "Lula ganha destaque em programas estaduais de aliados; Flávio é exibido no RJ e no PR", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 130937, "titulo": "Aécio Neves volta atrás e confirma candidatura ao Senado por Minas Gerais", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/aecio-neves-volta-atras-e-confirma-candidatura-ao-senado-por-minas-gerais.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-28T19:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Aécio Neves, presidente nacional do PSDB, confirmou sua candidatura ao Senado pelo estado de Minas Gerais. A decisão foi anunciada durante uma conversa com jornalistas na sede do partido em Belo Horizonte.", "titulo_pt": "Aécio Neves confirma candidatura ao Senado por Minas Gerais", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 131145, "titulo": "Lula na Globo não dá motivos para mitigar desconfiança fiscal", "url": "https://www.jota.info/eleicoes/eleicoes-2026/lula-na-globo-nao-da-motivos-para-mitigar-desconfianca-fiscal", "fonte_id": "jota", "data_pub": "2026-08-28T18:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente apresenta um passo regressivo em relação ao que havia proposto em seu plano de governo, expressando desejo de ver o país crescer.", "titulo_pt": "Lula na Globo não dá motivos para mitigar desconfiança fiscal", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 131146, "titulo": "Líder nas pesquisas, Cleitinho tem menos da metade do tempo de TV de Simões em MG", "url": "https://www.jota.info/eleicoes/eleicoes-2026/lider-nas-pesquisas-cleitinho-tem-menos-da-metade-do-tempo-de-tv-de-simoes-em-mg", "fonte_id": "jota", "data_pub": "2026-08-28T18:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento exclusivo do JOTA revelou a distribuição do horário eleitoral entre os candidatos. Cleitinho, líder nas pesquisas, tem menos da metade do tempo de TV disponível p "See Moments After a Glacier Collapsed, Launching Deadly Flash Floods in Nepal", "url": "https://www.nytimes.com/2026/08/28/world/asia/himalayan-glacier-collapse-flood.html", "fonte_id": "nyt_world", "data_pub": "2026-08-28T21:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vídeos exclusivos verificados pelo The New York Times mostram momentos após um colapso de geleira que causou alagamentos mortais de água e lama em regiões próximas ao Tibete, no norte do Nepal.", "titulo_pt": "Veja momentos após colapso de geleira que lançou alagamentos mortais no Nepal", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 131316, "titulo": "Ebola spreads to two new zones in DRC; 60 areas now affected", "url": "https://www.aljazeera.com/news/2026/8/28/ebola-spreads-to-two-new-zones-in-drc-60-areas-now-affected?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-28T21:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Ebola se espalhou para duas novas regiões na República Democrática do Congo, totalizando 60 áreas afetadas. É a maior e mais rápida propagação de uma epidemia de Ebola na história do país, com 5.794 casos confirmados e 2.786 mortes.", "titulo_pt": "Ebola se espalha para duas novas zonas na rdc; 60 áreas agora afetadas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 131305, "titulo": "US arrests right-wing provocateur Milo Yiannopoulos", "url": "https://www.dw.com/en/us-arrests-right-wing-provocateur-milo-yiannopoulos/a-78553559?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-28T21:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milo Yiannopoulos, um comentarista de extrema direita, era um apoiador inicial do presidente Trump e de seu endurecimento na imigração, mas eles se separaram posteriormente. O DHS afirmou que Yiannopoulos era um 'alienado ilegal' que excedeu o prazo de sua visita aos EUA.", "titulo_pt": "EUA prende comentarista de extrema direita Milo Yiannopoulos", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 131301, "titulo": "Hezbollah chief again rejects Lebanon-Israel deal, refuses 'surrender'", "url": "https://www.lemonde.fr/en/international/article/2026/08/28/hezbollah-chief-again-rejects-lebanon-israel-deal-refuses-surrender_6756948_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-28T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe do Hezbollah rejeitou novamente o acordo entre Líbano e Israel, considerando-o ilegítimo, ilegal, humilhante e destrutivo para a soberania libanesa. Um acordo foi assinado em junho, que prevê o desarmamento do Hezbollah, a retirada gradual das forças israelenses do sul do Líbano e a implantação das forças armadas libanesas na região.", "titulo_pt": "Chefe do hezbollah rejeita acordo entre líbano e israel", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 131291, "titulo": "Berlin is being blackmailed by hackers, mayor says", "url": "https://www.bbc.co.uk/news/articles/cm2q7gv3l5qo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-28T21:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O prefeito de Berlim, Kai Wegner, afirmou que a cidade não cederá a um pedido de resgate relacionado a dados roubados em um ataque cibernético.", "titulo_pt": "Berlim é ameaçada por hackers, diz prefeito", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 131318, "titulo": "Before and after images show catastrophic impact of Nepal flash floods", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/28/08-28-26-nepal-b4-and-after-sv-mp4?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-28T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imagens satelitais antes e depois mostram o impacto devastador das cheias catastróficas na Nepal.", "titulo_pt": "Imagens antes e depois revelam o impacto catastrófico das cheias na Nepal", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 131319, "titulo": "RSS chief’s US visit faces protests over Hindu nationalism", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/28/28-08-sv-hr-groups-against-the-rss-fm?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-28T21:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder hindu indiano Mohan Bhagwat está programado para falar em Nova York, enquanto grupos de direitos humanos protestam contra sua visita.", "titulo_pt": "Líder Hindu indiano mohan bhagwat visita EUA enfrenta protestos sobre nacionalismo Hindu", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 131306, "titulo": "Spain asks EU's Frontex for help in processing Ceuta migrants", "url": "https://www.dw.com/en/spain-asks-eu-s-frontex-for-help-in-processing-ceuta-migrants/a-78553545?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-28T21:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 70.000 migrantes cruzaram ilegalmente para Ceuta, um exclave espanhol, a partir do Marrocos no final de julho. Ainda restam cerca de 5.000 migrantes na região, o que tem causado protestos de moradores locais.", "titulo_pt": "Espanha solicita ajuda da Frontex para processar migrantes em Ceuta", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 131217, "titulo": "Why Putin Is Fighting On, Even as His Problems Multiply", "url": "https://www.nytimes.com/2026/08/28/world/europe/russia-ukraine-war-putin.html", "fonte_id": "nyt_world", "data_pub": "2026-08-28T21:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Não há indícios de que a fadiga pública, as dificuldades econômicas ou os ataques ucranianos aumentados estejam mudando a visão do líder russo de que ele eventualmente alcançará a vitória.", "titulo_pt": "Por que Putin continua lutando, mesmo com seus problemas se acumulando", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 131236, "titulo": "Xi Jinping culmina la purga del que fuera su principal asesor en el Ejército chino expulsándolo del Parlamento", "url": "https://www.latercera.com/mundo/noticia/xi-jinping-culmina-la-purga-del-que-fuera-su-principal-asesor-en-el-ejercito-chino-expulsandolo-del-parlamento/", "fonte_id": "la_tercera", "data_pub": "2026-08-28T21:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Zhang Youxia, ex vice-presidente da Comissão Militar Central, está sendo investigado por graves violações de disciplina e lei, o que indica possíveis casos de corrupção. Xi Jinping concluiu a purga de seu ex-assessor principal do parlamento chinês.", "titulo_pt": "Xi Jinping conclui purga de seu ex-assessor principal do exército, expulsando-o do Parlamento", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 131294, "titulo": "97-year-old woman rescued after Nepali floods looked like 'a warrior'", "url": "https://www.bbc.co.uk/news/videos/cj64kgrpgjdo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-28T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher de 97 anos, Guna Maya Bohara, sobreviveu às cheias repentinas e foi resgatada usando um escavadeira.", "titulo_pt": "Idosa de 97 anos sobrevive e é resgatada em cheias no nepal", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 130953, "titulo": "Os mapas e gráficos que mostram a magnitude da destruição de avalanche no Nepal e Tibete", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/os-mapas-e-graficos-que-mostram-a-magnitude-da-destruicao-de-avalanche-no-nepal-e-tibete.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-28T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Centenas de pessoas morreram e 1,4 mil estão desaparecidas após uma avalanche devastadora atingir a fronteira entre o Nepal e o Tibete na quarta-feira (26).", "titulo_pt": "Mapas e gráficos mostram a magnitude da destruição da avalanche no Nepal e Tibete", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 131220, "titulo": "Iceland’s EU Ambitions", "url": "https://foreignpolicy.com/2026/08/28/iceland-referendum-eu-membership-trump-greenland-arctic-critical-minerals/", "fonte_id": "foreign_policy", "data_pub": "2026-08-28T21:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ameaças dos Estados Unidos no Ártico, Reykjavik planeja realizar um referendo para retomar as negociações de adesão à União Europeia.", "titulo_pt": "Icelandas ambições para a união europeia", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 130954, "titulo": "Especialistas explicam por que era tão difícil prever as enchentes devastadoras no Nepal", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/especialistas-explicam-por-que-era-tao-dificil-prever-as-enchentes-devastadoras-no-nepal.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-28T21:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Foi uma muralha de água e lama que avançou rapidamente, engolindo prédios em segundos. Após as enchentes devastadoras no Nepal, surgiram questionamentos sobre a possibilidade de prever ou detectar a torrente mortal, permitindo mais tempo para que as comunidades fossem esvaziadas.", "titulo_pt": "Especialistas explicam por que era tão difícil prever as enchentes devastadoras no Nepal", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 131218, "titulo": "A Melting Glacier in Nepal Was a Time Bomb. There Are More to Come.", "url": "https://www.nytimes.com/2026/08/28/climate/climate-forward-nepal-disaster.html", "fonte_id": "nyt_world", "data_pub": "2026-08-28T21:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um geólogo reflete sobre o desastre causado pela geleira derretida na Nepal e explica que o rápido aquecimento global fará inundações glaciares letais se tornarem mais frequentes.", "titulo_pt": "Geleira derretida na Nepal era uma bomba-relógio. Haverão mais a vir.", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 131314, "titulo": "Guggenheim affiliate buys up debt linked to its asset management arm", "url": "https://www.ft.com/content/809cbbe8-c151-448b-91fb-e74d908f73d1?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-28T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um afiliado do Guggenheim adquiriu dívidas relacionadas à sua unidade de gerenciamento de ativos. Essa dívida tem sido monitorada como indicador para a firma de investimentos privada de Mark Walter.", "titulo_pt": "Afiliado do guggenheim adquire dívida ligada à unidade de gerenciamento de ativos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 131317, "titulo": "With the US and Canada locked in a trade war, fears of a recession lurk", "url": "https://www.aljazeera.com/economy/2026/8/28/with-the-us-and-canada-locked-in-a-trade-war-fears-of-a-recession-lurk?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-28T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Análistas afirmam que o Canadá pode perder 100.000 empregos devido às atuais tarifas e entrar em recessão se o Acordo México-Canadá-EUA (USMCA) terminar.", "titulo_pt": "Com EUA e canadá em guerra comercial, temem recessão", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 130944, "titulo": "Carga de energia no Brasil deve crescer 5,9% em setembro, estima ONS", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466779", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A carga de energia elétrica no Brasil deve aumentar 5,9% em setembro em comparação com o mesmo mês do ano anterior, atingindo 85.118 MW médios, de acordo com a estimativa do ONS. A informação foi divulgada em 28 de setembro de 2026, às 18h22.", "titulo_pt": "Carga de energia no Brasil deve crescer 5,9% em setembro, estima ONS", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 130945, "titulo": "Veja lista dos novos carros disponíveis no Move Brasil com financiamento de até R$ 200 mil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/veja-lista-dos-novos-carros-disponiveis-no-move-brasil-com-financiamento-de-ate-r-200-mil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério do Desenvolvimento Econômico, Indústria, Comércio e Serviços divulgou a nova lista de carros elegíveis para o programa Move Brasil, direcionado a taxistas e motoristas de aplicativo. O programa oferece financiamento com limite de até R$ 200 mil.", "titulo_pt": "Confira a lista de novos carros disponíveis no Move Brasil com financiamento até R$ 200 mil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 131035, "titulo": "Trigo sobe 3,06% em Chicago e acumula alta de 19,25% em quatro semanas", "url": "https://www.cnnbrasil.com.br/agro/trigo-sobe-306-em-chicago-e-acumula-alta-de-1925-em-quatro-semanas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As cotações do trigo subiram 3,06% no mercado de Chicago, atingindo o maior nível em três anos. As restrições no Mar Negro são um dos principais fator
