<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 06/08/2026 08:12 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">
      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>
      <option value="erro_traducao">Erro de tradução</option>
      <option value="classificacao_errada">Classificação errada</option>
      <option value="resumo_impreciso">Resumo impreciso</option>
      <option value="outro">Outro</option>
    </select>
    <label for="flag-nota">Nota (opcional)</label>
    <textarea id="flag-nota" placeholder="Descreva o problema..."></textarea>
    <div class="modal-btns">
      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "06/08/2026 08:12", "stats": {"noticias_novas": 810, "resumos_gerados": 250}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva assinou a lei que estabelece uma tabela mínima de frete para o transporte de cargas, com reajustes baseados nos custos operacionais e nas flutuações do preço do combustível. Esta medida visa garantir um salário mínimo para os caminhoneiros, mas não fixa valores específicos; a Agência Nacional de Transportes Terrestres (ANTT) será responsável por atualizá-los conforme as variações dos preços do combustível. Em outro desenvolvimento, o Supremo Tribunal Federal (STF) iniciou o julgamento de um recurso que questiona a constitucionalidade da Lei das Bets, com a Procuradoria-Geral da República defendendo a criminalização dos jogos de azar e o ministro Luiz Fux classificando a atividade como 'deletéria'. Além disso, a eleição presidencial de 2026 será a primeira deste século sem mulheres em chapas presidenciais competitivas, uma situação que não ocorre desde 2002. O governador Tarcísio de Freitas criticou a greve dos ferroviários no estado de São Paulo, classificando-a como 'política' e afirmando que greves podem ser usadas politicamente durante campanhas eleitorais.", "mundo": "O mundo enfrenta diversos desafios importantes. Primeiramente, a Ucrânia continua buscando apoio para sua defesa aérea, mas parece que os aliados ocidentais estão hesitantes em fornecer os mísseis interceptadores necessários. Além disso, o governo cubano expressou interesse em investimentos de um investidor árabe para desenvolver o projeto 'Trump Island', mostrando abertura para possíveis investidores estrangeiros, mesmo diante da situação econômica difícil do país. Em outro evento notável, a ONU alertou que os ataques realizados por drones têm se tornado o principal motivo das mortes civis no Sudão desde abril de 2023, com esses ataques responsáveis por cerca de 80% dos óbitos civis durante a guerra entre as Forças de Apoio Rápido (RSF) e o Exército sudanês.\n\nA situação geopolítica na região da Europa Oriental e do Mar do Norte permanece tenso. A Ucrânia enfrenta ataques de mísseis e drones russos, levando a um pedido urgente de defesas aéreas pela OTAN. Como resposta, os Estados Unidos e Israel intensificaram suas operações militares, com o Líbano sendo afetado por uma escalada recente de conflitos regionais. A Coreia do Norte realizou testes de mísseis, aumentando as tensões na região asiática. Diante disso, o Brasil também se posiciona em meio a essas tensões, com o ministro da Defesa indicando que o país só precisaria 'abrir o portão' aos EUA em caso de ataque.", "economia": "O Copom do Banco Central reduziu a taxa Selic para 14% ao ano, uma redução que já ocorre pela quarta vez consecutiva. Esta decisão foi bem recebida, mas considerada insuficiente por entidades como a Firjan, que ressaltou o alto nível da taxa ainda em vigor, mantendo o crédito caro e atrasando investimentos. A CNI pediu ao STF o direito de crédito do IPI, PIS e Cofins após a reoneração da LC 249/2015, argumentando que a lei criou um regime híbrido não baseado em constitucionalidade ou economia. No mercado de frango no Brasil, enfrenta-se uma oferta excessiva, pressionando as margens das empresas como JBS e BRF. Além disso, a Eletrobras registrou um lucro líquido recorde de R$ 1,2 bilhão no segundo trimestre, impulsionado por melhores resultados na venda de energia e em participações societárias.", "tecnologia": "A tecnologia da inteligência artificial (IA) está transformando rapidamente diversos setores, especialmente de acordo com alguns líderes que acreditam estar entrando na era da singularidade tecnológica. Arquitetos do desenvolvimento de IA sugerem que essa fase pode levar a um avanço acelerado da inteligência artificial e a uma mudança civilizatória mais rápida do que a humanidade consegue compreender ou controlar. Paralelamente, a China lançou uma investigação sobre produtos da Palo Alto Networks para garantir a segurança cibernética na infraestrutura crítica de informação. A IA também está se tornando cada vez mais acessível, levando a uma maior necessidade de governança e responsabilidade ética em seu uso. Um estudo da OpenAI mostrou que o ChatGPT está mudando as funções realizadas por pessoas nas empresas, alterando o panorama do trabalho. Além disso, a Força Aérea do Exército Popular da Libertação na China está aumentando sua influência no uso de IA em defesa, enquanto empresas privadas chinesas se movem para competir com gigantes americanos nesse campo.", "ciencia": "Cientistas confirmaram uma hipótese levantada por Charles Darwin há 151 anos sobre as plantas carnívoras, considerando-as 'uma das plantas mais maravilhosas do mundo'. Em outro desenvolvimento, a IXPE (Imaging X-ray Polarimetry Explorer) da NASA realizou observações que podem ter capturado o comportamento do vácuo espacial como previsto há 90 anos pelos físicos. Além disso, a NASA publicou uma nova imagem do Sol como Imagem do Dia, a mais nítida até agora e que revela instabilidades na superfície solar. Estudos mostram que os pumas reduzem o número de acidentes com cervos nas estradas onde estão presentes, tornando as vias mais seguras. A NASA também uniu os módulos de tripulação e serviço do Orion para a missão Artemis III, preparando-se para trazer astronautas à Lua.", "cultura": "No MASP, Flávia Almeida assume a presidência após 12 anos de Heitor Martins, continuando o trabalho iniciado pelo atual grupo administrativo. Michelle Yeoh será homenageada com o título de cineasta asiático do ano no 31º Festival Internacional de Cinema de Busan, reconhecendo suas contribuições excepcionais para o cinema asiático desde 2003. A Netflix produzirá um novo suspense intitulado 'A Última Casa', estrelado por Wagner Moura, que mistura elementos de ficção científica com drama familiar. Além disso, a reabertura do Museu Marítimo de Hull apresentará uma série de exibições inovadoras, incluindo um esqueleto gigante de baleia que permitirá aos visitantes entrar em seu interior e ver imagens digitais de baleias nadando.", "sociedade": "O Brasil permitiu o cultivo de Cannabis para produção de medicamentos e apoio à pesquisa científica, conforme regulamentação publicada pela Anvisa. Em São Paulo, o estudo Mapa da Desigualdade mostrou disparidades na qualidade de vida nas cidades da Grande SP, com São Caetano do Sul em primeiro lugar e Pirapora do Bom Jesus em último. No Distrito Federal, a maioria das vítimas de feminicídio já sofria violência antes dos assassinatos, conforme relatório da OAB-DF. Em Cuba, o MST entregou 7,6 toneladas de medicamentos como parte de uma campanha de solidariedade. Na Coreia do Sul, a government está considerando oferecer educação gratuita em universidades regionais, enquanto medidas para combater os recordes de calor são adotadas por empresas e governos locais. O Brasil também registrou avanços na educação básica, com uma escola no sertão pernambucano atingindo nota histórica no IDEB, além de universitários da geração Z enfrentando desafios relacionados à falta de networking em suas carreiras.", "meio_ambiente": "As mudanças climáticas estão aumentando os riscos ambientais e sociais, como mostram diversos eventos ao redor do mundo. O uso de mosquitórios (fumacê) nas regiões oeste dos Estados Unidos e em Washington, estado americano, ilustra a crescente ameaça das alterações climáticas para a segurança global. Em particular, estudos indicam que o aquecimento global dobrou as chances de condições secas e quentes, responsáveis pela ignição de grandes incêndios florestais no Canadá durante o verão. Além disso, o nível do rio Danúbio está em seu menor registro histórico, afetando o comércio e os cruzeiros turísticos na região da Sérvia, expondo as comunidades ribeirinhas aos impactos do aquecimento global. Esses eventos evidenciam a urgência de medidas urgentes para mitigar esses impactos.", "direitos_humanos": "Organizações de direitos humanos, como a Amnistia Internacional e a Watch dos Direitos Humanos, estão pedindo uma investigação sobre crimes de guerra relacionados à morte do jornalista libanês Amal Khalil, assassinado em 22 de abril. Em outro desenvolvimento, o Superior Tribunal de Justiça (STJ) vai analisar o processo disciplinar contra Marco Buzzi, acusado de assédio sexual. A situação humanitária também é preocupante: pelo menos 300 crianças foram mortas em Gaza nos últimos 300 dias e o Programa Mundial de Alimentos da ONU alertou sobre o potencial aumento da fome em 45 países devido ao fortalecimento do fenômeno El Niño. Além disso, a Organização Mundial da Saúde (OMS) chamou para uma resposta 'massiva' ao surto de ebola na República Democrática do Congo, com 3.874 casos confirmados e 1.751 mortes causadas pelo vírus. O governo do primeiro-ministro Anwar Ibrahim anunciou planos para repatriar aproximadamente 5.000 rohingyas com o consentimento da Birmânia, enquanto organizações de direitos humanos alertam que eles continuam em risco de perseguição no Myanmar."}, "resumo_do_dia": {"politica_nacional": [{"id": 90659, "titulo": "Ministério e Funai não respondem sobre dragagem no Tapajós apesar de apelos de outras pastas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https:/ "Lula realiza encontro com Alcolumbre após trégua de três meses", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 90668, "titulo": "O risco de uma eleição decidida na delegacia, no medo e na raiva", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/viniciustorres/2026/08/o-risco-de-uma-eleicao-decidida-na-delegacia-no-medo-e-na-raiva.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-05T23:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A eleição presidencial de 2026 pode ser influenciada por casos judiciais e policiais envolvendo os principais candidatos. O artigo sugere que esses eventos podem decidir o resultado da votação.", "titulo_pt": "O risco de uma eleição presidencial decisiva em decorrência de processos judiciais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 91102, "titulo": "Ukraine’s military hits one of Russia’s biggest oil refineries in long-range drone attack", "url": "https://www.cnbc.com/2026/08/06/ukraine-war-russia-zelenskyy-oil-refinery.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-06T09:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A força militar ucraniana realizou um ataque com drones a uma das maiores refinarias de petróleo da Rússia, localizada no Slavneft-Yanos em Yaroslavl. Esta refinaria está situada a centenas de quilômetros do limite ucraniano.", "titulo_pt": "Força militar ucraniana ataca uma das maiores refinarias de petróleo russas com drones", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 91115, "titulo": "Germany arrests Ukrainian suspected of spying on arms firm", "url": "https://www.dw.com/en/germany-arrests-ukrainian-suspected-of-spying-on-arms-firm/a-78262186?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-06T09:57:00Z", "idioma": "en", "provav dência de álcool e drogas são seguros e eficazes, mas são raramente oferecidos aos pacientes. Isso ocorre porque muitos médicos e enfermeiros ainda veem pessoas com dependência de álcool ou drogas com suspeita e hostilidade.", "titulo_pt": "Como viés médico profundo cria consequências letais para pacientes com dependência", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 91057, "titulo": "Indian journalist Tarun Tejpal sentenced to 10 years in jail for rape", "url": "https://www.bbc.co.uk/news/articles/cx2v551w9v8o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-06T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tarun Tejpal, jornalista indiano, foi condenado a 10 anos de prisão por estupro. Ele nega as acusações e pode recorrer à Suprema Corte do Índia.", "titulo_pt": "Jornalista indiano é sentenciado a 10 anos de prisão por estupro", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 91149, "titulo": "Cuban government open to the idea of an Arab investor to develop ‘Trump Island’", "url": "https://english.elpais.com/international/2026-08-06/cuban-government-open-to-the-idea-of-an-arab-investor-to-develop-trump-island.html", "fonte_id": "elpais_en", "data_pub": "2026-08-06T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo cubano está aberto à ideia de investimento de um investidor árabe para desenvolver o projeto 'Trump Island'. Diante da situação econômica difícil, Havana sinaliza que as portas do país estão abertas a possíveis investidores estrangeiros, inclusive dos Estados Unidos.", "titulo_pt": "Cuba abre portas para investimento de árabe em projeto de Trump", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 90709, "titulo": "Otan fornecerá defesas aéreas à Ucrânia em caráter de urgência", "url": "https://www.metropoles.com/mundo/otan-fornecera-defesas-aereas-a-ucrania-em-carater-de-urgencia", "fonte_id": "metropoles", "data_pub": "2026-08-06T09:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OTAN fornecerá defesas aéreas de urgência à Ucrânia para fortalecer seu sistema de defesa. O país alerta para o aumento da produção de mísseis russos.", "titulo_pt": "Otan fornecerá defesas aéreas à Ucrânia em caráter de urgência", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 91360, "titulo": "(2nd LD) N. Korea fires short-range ballistic missile toward East Sea: military", "url": "https://en.yna.co.kr/view/AEN20250710005752315", "fonte_id": "yonhap_news", "data_pub": "2026-08-06T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Norte disparou ao menos uma mísseis balísticos de curto alcance na direção do Mar Oriental. A informação foi divulgada pela força-armada sul-coreana.", "titulo_pt": "Coreia do norte dispara míssil de curto alcance na direção do mar oriental: militares", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 91078, "titulo": "Gianni Infantino lives to see another day after FIFA crisis meeting", "url": "https://www.france24.com/en/video/20260806-gianni-infantino-lives-to-see-another-day-after-fifa-crisis-meeting", "fonte_id": "france24", "data_pub": "2026-08-06T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apesar das chamadas generalizadas à sua renúncia, Gianni Infantino manteve seu cargo após a reunião do conselho da FIFA. O conselho afirmou em comunicado que 'reafirmaram seu completo apoio a Gianni Infantino', após uma reunião construtiva e positiva realizada em Rabat.", "titulo_pt": "Gianni Infantino sobrevive à crise após reunião do conselho da FIFA", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 91172, "titulo": "Uccide la nonna a martellate, arrestato il nipote 25enne", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/06/uccide-la-nonna-a-martellate-arrestato-il-nipote-25enne_eb7488c6-8596-4fe3-8de5-dc855 ravel patterns", "url": "https://www.aljazeera.com/news/2026/8/6/how-the-middle-east-conflict-is-upending-european-travel?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-06T09:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os turistas estão preferindo viagens mais próximas de casa devido ao conflito, enquanto operadores turísticos se adaptam às novas circunstâncias.", "titulo_pt": "Guerra dos EUA e israel contra a Irã altera padrões de férias do verão na Europa", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 91079, "titulo": "Cape Verde: Illegal sand extractions for construction industry erodes coastline", "url": "https://www.france24.com/en/cape-verde-illegal-sand-extractions-for-construction-industry-erodes-coastline", "fonte_id": "france24", "data_pub": "2026-08-06T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Cabo Verde, as praias da ilha de Santiago estão perdendo sua aparência paradisíaca devido à extração ilegal de areia marinha para a indústria da construção há décadas. Esta atividade ilegal está ameaçando ecossistemas, contribuindo para o salinização de terras agrícolas e forçando mulheres a correrem riscos para sobreviver.", "titulo_pt": "Cabo Verde: extração ilegal de areia para construção erosiona costa", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 91062, "titulo": "Afghan boxer accused of killing Scottish aid worker back in court", "url": "https://www.bbc.co.uk/news/articles/cj6390k0e26o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-06T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sharif Ahmadzai, um afegão de 26 anos, está sendo acusado de homicídio com intenção, roubo e posse ilegal de armas. Ele voltou à tribuna judicial no caso envolvendo a morte de uma trabalhadora humanitária escocesa.", "titulo_pt": "Boxeador afegão acusado do assassinato de trabalhadora humanitária escocesa retorna ao tribunal", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 90827, "titulo": "Delegar fiscalização à Unimed é ‘diminuir poder’ da ANS, afirma ex-diretora", "url": "https://www.jota.info/saude/delegar-fiscalizacao-a-unimed-e-diminuir-poder-da-ans-afirma-ex-diretora", "fonte_id": "jota", "data_pub": "2026-08-06T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ex-diretora Maria Stella Gregori criticou a possibilidade de uma parceria entre a Agência Nacional de Saúde Suplementar (ANS) e a Unimed para fiscalizar as afiliadas do grupo. Ela afirmou que isso seria diminuir o poder da ANS.", "titulo_pt": "Ex-diretora critica possível parceria entre ANS e Unimed para fiscalização", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 90825, "titulo": "Multilixo faz M&A de R$ 150 milhões e cresce fora de São Paulo", "url": "https://braziljournal.com/multilixo-faz-ma-de-r-150-milhoes-e-cresce-fora-de-sao-paulo/", "fonte_id": "brazil_journal", "data_pub": "2026-08-06T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Grupo Multilixo adquiriu 100% da RCR Ambiental por R$ 150 milhões, a maior transação desde a fundação da empresa paulistana em 1996. Esta é a 28ª aquisição realizada pela Multilixo como parte de um ciclo de consolidação.", "titulo_pt": "Multilixo realiza M&A de R$ 150 milhões e expande fora de São Paulo", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 90828, "titulo": "CNI pede ao STF direito a crédito de IPI, PIS e Cofins depois da reoneração da LC 224/25", "url": "https://www.jota.info/tributos/cni-pede-ao-stf-direito-a-credito-de-ipi-pis-e-cofins-depois-da-reoneracao-da-lc-224-25", "fonte_id": "jota", "data_pub": "2026-08-06T09:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Confederação Nacional da Indústria (CNI) solicitou ao Supremo Tribunal Federal (STF) o direito a crédito de IPI, PIS e Cofins após a reoneração da Lei Complementar 249/2015. A CNI argumenta que a lei criou um regime híbrido para o PIS/Cofins que não tem base constitucional, legal ou econômica.", "titulo_pt": "CNI pede ao STF direito a crédito de IPI, PIS e Cofins após reoneração da LC 249/15", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 90756, "titulo": "Mercado de frango no Brasil passa por momento de oferta excessiva", "url": "https://www.cnnbrasil.com.br/agro/mercado-de-frango-no-brasil-tem-oferta-excessiva/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-06T09:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado de frango no Brasil enfrenta um momento com oferta excessiva, e as empresas mantêm sua solidez financeira sem prever uma diminuição na quantidade de aves, o que deve pressionar as margens da JBS e BRF.", "titulo_pt": "Mercado de frango no Brasil passa por momento de oferta excessiva", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 90658, "titulo": "JPMorgan lança ETF de gestão ativa com foco em tecnologia dos EUA na B3", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/jpmorgan-lanca-etf-de-gestao-ativa-com-foco-em-tecnologia-dos-eua-na-b3.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A JPMorgan Asset Management lançou o JTEK39, um ETF ativo com foco nas empresas de tecnologia dos Estados Unidos. Este é o segundo fundo do tipo da gestora listado na B3 e surge em um momento em que a preferência por esse tipo de investimento está crescendo no mercado brasileiro.", "titulo_pt": "Jpmorgan lança ETF ativo de tecnologia norte-americana na B3", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 90832, "titulo": "A nova guerra fiscal", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-fiscal/a-nova-guerra-fiscal", "fonte_id": "jota", "data_pub": "2026-08-06T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A nova guerra fiscal se refere a incentivos fiscais para aumentar artificialmente a arrecadação durante a transição do IBS.", "titulo_pt": "Nova guerra fiscal", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 90762, "titulo": "Alltech acelera expansão no Brasil e fortalece operação de Crop Science", "url": "https://www.cnnbrasil.com.br/agro/alltech-acelera-expansao-no-brasil-e-fortalece-operacao-de-crop-science/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-06T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Alltech está acelerando sua expansão no Brasil através do investimento em inovação, crescimento orgânico e parcerias novas. A empresa busca fortalecer sua operação de Crop Science no mercado brasileiro.", "titulo_pt": "Alltech acelera expansão no Brasil e fortalece operação de Crop Science", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 90834, "titulo": "As atividades legítimas de lobby", "url": "https://www.jota.info/opiniao-e-analise/colunas/elas-no-jota/as-atividades-legitimas-de-lobby", "fonte_id": "jota", "data_pub": "2026-08-06T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A atuação de lobistas profissionais tem crescido e se profissionalizado, mas ainda existem representações equivocadas sobre sua função. Os lobistas desempenham atividades legítimas na defesa de interesses, apesar das percepções errôneas que persistem.", "titulo_pt": "As atividades legítimas dos lobistas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 90835, "titulo": "O mandado de segurança em matéria tributária não pode virar peça decorativa", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-mandado-de-seguranca-em-materia-tributaria-nao-pode-virar-peca-decorativa", "fonte_id": "jota", "data_pub": "2026-08-06T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mandado de segurança na área tributária não pode ser utilizado como mero ornamento legal, pois suas consequências práticas negativas afetam diretamente o ambiente empresarial e a eficiência judicial.", "titulo_pt": "O mandado de segurança em matéria tributária não pode ser usado como mero ornamento legal", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 90766, "titulo": "Warsh aposta na IA para justificar corte de juros nos EUA", "url": "https://www.cnnbrasil.com.br/economia/macroeconomia/warsh-aposta-na-ia-para-justificar-corte-de-juros-nos-eua/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-06T07:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Federal Reserve (Fed) mencionou o potencial da inteligência artificial para aumentar a produtividade e reduzir a inflação, sem fornecer diretrizes sobre os juros.", "titulo_pt": "Warsh aposta na IA para justificar corte de juros nos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 91227, "titulo": "CLP posts HK$5.73 billion underlying profit in first half of 2026", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3363152/clp-posts-hk573-billion-underlying-profit-first-half-2026?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-06T07:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "CLP Holdings, a holding da principal empresa de energia de Hong Kong, registrou um lucro bruto de HK$5.73 bilhões no primeiro semestre de 2026, crescimento de 9,7% em comparação com o mesmo período do ano anterior, impulsionado pelo aumento dos negócios regulados locais. A empresa também planeja investir para aumentar a suprimento elétrico do mega projeto Metrópole do Norte.", "titulo_pt": "CLP registra lucro bruto de HK$5,73 bilhões no primeiro semestre de 2026", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 91374, "titulo": "(URGENT) Seoul shares tumble 4.6 pct on tech losses amid lingering AI concerns", "url": "https://en.yna.co.kr/view/AEN20260806005400320", "fonte_id": "yonhap_news", "data_pub": "2026-08-06T06:33:00Z", "idioma": "en", "provavel_duplicata_de": 91268, "texto_pt": "As ações de Seul caíram 4,6% devido às perdas no setor tecnológico e preocupações persistentes sobre IA.", "titulo_pt": "(Urgente) ações de seul caem 4,6% devido a perdas na tecnologia e preocupações com AI", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 91204, "titulo": "Weak yen and industry shifts drive greater demand for used smartphone handsets", "url": "https://www.japantimes.co.jp/business/2026/08/06/iphone-price-hike-used-smartphones/", "fonte_id": "japan_times", "data_pub": "2026-08-06T05:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado de smartphones usados no Japão expandiu-se por sete anos consecutivos, atingindo um recorde de 3,6 milhões de unidades e uma participação de 10% no ano fiscal de 2025.", "titulo_pt": "Fraco iene e mudanças industriais impulsionam maior demanda por smartphones usados", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 90738, "titulo": "O patamar da Selic que pode destravar o financiamento imobiliário", "url": "https://exame.com/mercado-imobiliario/o-patamar-da-selic-que-pode-destravar-o-financiamento-imobiliario/", "fonte_id": "exame", "data_pub": "2026-08-06T05:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A taxa Selic está no patamar de 14%, mas o financiamento imobiliário ainda depende de outros fatores como a inflação, a captação dos bancos e o risco.", "titulo_pt": "O patamar da Selic que pode destravar o financiamento imobiliário", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 91151, "titulo": "Biggest US law firms explore selling stakes to private equity", "url": "https://www.ft.com/content/475d573a-886d-4b75-b07c-f74c38b093f2?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-06T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias das maiores empresas de advocacia dos EUA, incluindo Paul Weiss, Quinn Emanuel e Proskauer, estão explorando a possibilidade de vender partes delas mesmas para fundos de private equity.", "titulo_pt": "Maiores escritórios de advocacia dos EUA consideram venda de participações para private equity", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 91152, "titulo": "The deal that saved Intel", "url": "https://www.ft.com/content/77ece212-2768-4abe-9af1-b40a0db27c8f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-06T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Intel aumentaram quatro vezes, mas ainda não se provou uma competidora séria de fabricação para a TSMC da Taiwan.", "titulo_pt": "O acordo que salvo a Intel", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 91036, "titulo": "Welcome to the singularity: AI's architects say the next era of human history is here", "url": "https://www.axios.com/2026/08/06/ai-singularity-intelligence-explosion", "fonte_id": "axios", "data_pub": "2026-08-06T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Top AI arquitetos afirmam que sua tecnologia atingiu um ponto de singularidade, onde as máquinas começam a acelerar seu próprio desenvolvimento. Se esses líderes estiverem corretos, poderíamos estar entrando na maior transformação tecnológica da história humana, com uma explosão de inteligência que pode transformar a civilização mais rapidamente do que a humanidade consegue compreender ou controlar.", "titulo_pt": "Bem-vindo à singularidade: arquitetos de ai dizem que o próximo período da história humana chegou", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 91215, "titulo": "China launches probe into US cybersecurity firm Palo Alto Networks", "url": "https://www.scmp.com/economy/global-economy/article/3363177/china-launches-probe-us-cybersecurity-firm-palo-alto-networks?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-06T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A administração do Cyberspace da China iniciou uma revisão de segurança cibernética nos produtos vendidos na China pela empresa de tecnologia norte-americana Palo Alto Networks. A investigação visa assegurar a operação segura e estável de infraestrutura de informação crítica, prevenir riscos e vulnerabilidades cibernéticas e proteger a segurança nacional.", "titulo_pt": "China inicia investigação em empresa de segurança cibernética norte-americana Palo Alto Networks", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 90833, "titulo": "Quando a IA vira commodity, governança ganha impulso", "url": "https://www.jota.info/opiniao-e-analise/artigos/quando-a-ia-vira-commodity-governanca-ganha-impulso", "fonte_id": "jota", "data_pub": "2026-08-06T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial se tornando cada vez mais acessível, a capacidade de demonstrar o uso responsável da tecnologia ganha maior importância.", "titulo_pt": "Quando a IA vira commodity, governança ganha impulso", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 91193, "titulo": "AI’s volatile power demand is damaging its own data centers", "url": "https://www.japantimes.co.jp/business/2026/08/06/tech/ai-power-demand-data-centers/", "fonte_id": "japan_times", "data_pub": "2026-08-06T08:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aumento de energia para a IA pode ser muito volátil, variando rapidamente e criando choques repetidos que equipamentos conectados têm dificuldade de absorver. Essas variações podem surgir e desaparecer em segundos, causando danos aos centros de dados da própria IA.", "titulo_pt": "A demanda volátil de energia da IA está prejudicando seus próprios centros de dados", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 90763, "titulo": "ChatGPT está mudando quem faz o quê nas empresas, aponta estudo da OpenAI", "url": "https://www.cnnbrasil.com.br/inteligencia-artificial/chatgpt-esta-mudando-quem-faz-o-que-nas-empresas-aponta-estudo-da-openai/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-06T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório da OpenAI analisou como os usuários interagem com a IA ChatGPT no ambiente de trabalho, indicando que esta tecnologia está alterando as funções realizadas por pessoas nas empresas.", "titulo_pt": "Chatgpt está mudando quem faz o quê nas empresas, aponta estudo da OpenAI", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 91194, "titulo": "Nintendo tops estimates with strong games and tariff refunds", "url": "https://www.japantimes.co.jp/business/2026/08/06/companies/nintendo-tops-estimates/", "fonte_id": "japan_times", "data_pub": "2026-08-06T07:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa sediada em Kyoto registrou um lucro líquido de ¥147,4 bilhões no trimestre encerrado em junho, superando a estimativa dos analistas de ¥77,8 bilhões.", "titulo_pt": "Nintendo ultrapassa expectativas com jogos fortes e reembolsos de tarifas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 91196, "titulo": "SoftBank beats profit expectations as chip bets compensate for muted AI gains", "url": "https://www.japantimes.co.jp/business/2026/08/06/companies/softbank-quarterly-earnings/", "fonte_id": "japan_times", "data_pub": "2026-08-06T07:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SoftBank, uma investidora de tecnologia com sede no Tóquio, registrou um lucro líquido de ¥347,3 bilhões em seu primeiro trimestre fiscal, diminuindo 18% em comparação com as estimativas do mercado de cerca de ¥166 bilhões.", "titulo_pt": "Softbank supera expectativas de lucros graças às apostas em chips que compensam os ganhos moderados da inteligência artificial", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 91197, "titulo": "Mitsubishi Electric to start industrial buildup for GCAP fighter", "url": "https://www.japantimes.co.jp/business/2026/08/06/companies/mitsubishi-electric-fighter-jet-production/", "fonte_id": "japan_times", "data_pub": "2026-08-06T07:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Mitsubishi Electric será parte crucial do Programa de Combate Aéreo Global (GCAP), com o objetivo de implantar um caça de primeira linha até 2035.", "titulo_pt": "Mitsubishi Electric vai iniciar a construção industrial para o caça GCAP", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 91199, "titulo": "Japan’s police to monitor ‘ tokuryū ’ use of confidential messaging apps", "url": "https://www.japantimes.co.jp/news/2026/08/06/japan/crime-legal/japan-police-organized-crime-app-use-analyze/", "fonte_id": "japan_times", "data_pub": "2026-08-06T07:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia japonesa vai monitorar o uso de aplicativos de mensagens confidenciais por membros altos da tokuryū, que é uma organização política. O método envolve o controle remoto dos smartphones e outros dispositivos desses membros para acessar registros de comunicação e outras informações.", "titulo_pt": "Polícia japonesa vai monitorar uso de apps de mensagens confidenciais por membros da tokuryū", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 91155, "titulo": "OpenAI says Apple’s trade secrets lawsuit aims to stop employees leaving", "url": "https://www.ft.com/content/d9e9cbbe-8443-4c10-821a-1834e4965236?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-06T06:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI está buscando descartar um caso judicial importante que envolve acusações de violação de segredos comerciais da Apple, enquanto se prepara para lançar seu próprio dispositivo baseado em IA.", "titulo_pt": "Openai tenta descartar processo da Apple por supostas violações de segredos comerciais", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 91106, "titulo": "Google is expanding its AI empire — and losing the people who built it", "url": "https://www.cnbc.com/2026/08/05/google-is-expanding-its-ai-empire-and-losing-the-people-who-built-it.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-06T06:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google está expandindo seu império de inteligência artificial, mas isso está testando a dedicação da empresa ao avanço tecnológico à medida que os retornos comerciais ganham prioridade.", "titulo_pt": "Google está ampliando seu império de IA - mas perde as pessoas que o construíram", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 90739, "titulo": "MCP: o protocolo que pode conectar a IA aos sistemas da empresa e mudar a automação corporativa", "url": "https://exame.com/inteligencia-artificial/mcp-o-protocolo-que-pode-conectar-a-ia-aos-sistemas-da-empresa-e-mudar-a-automacao-corporativa/", "fonte_id": "exame", "data_pub": "2026-08-06T05:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Model Context Protocol (MCP) foi criado para padronizar a comunicação entre modelos de inteligência artificial e aplicações externas, visando simplificar integrações e expandir o uso da IA em ambientes corporativos.", "titulo_pt": "MCP: protocolo que pode conectar a IA aos sistemas da empresa e mudar a automação corporativa", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 91288, "titulo": "Total Wireless Promo Codes & Deals: 50% Off Select Plans", "url": "https://www.wired.com/story/total-wireless-promo-code/", "fonte_id": "wired", "data_pub": "2026-08-06T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Total Wireless oferece descontos significativos, com até 50% de desconto em planos selecionados. Os clientes podem aproveitar grandes economias nesses pacotes.", "titulo_pt": "Total Wireless: descontos de 50% em planos escolhidos", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 91289, "titulo": "Sealy Promo Codes: $100 Off", "url": "https://www.wired.com/story/sealy-promo-code/", "fonte_id": "wired", "data_pub": "2026-08-06T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Existem ofertas especiais da Sealy que oferecem descontos para quem está considerando trocar seu colchão de molas por um de espuma de memória ou busca dormir mais fresco no verão. Com essas promoções, os consumidores podem se beneficiar de uma noite de sono revigorante e ainda economizar dinheiro.", "titulo_pt": "$100 Off em colchões sealy", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 91290, "titulo": "Home Chef Promo Codes for August 2026", "url": "https://www.wired.com/story/home-chef-promo-code/", "fonte_id": "wired", "data_pub": "2026-08-06T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Promoções da Home Chef para agosto de 2026 oferecem descontos até 50% nas entregas e refeições gratuitas.", "titulo_pt": "Cupons de promoção home Chef para agosto de 2026", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 91154, "titulo": "Who needs consultants in the age of AI?", "url": "https://www.ft.com/content/0d600619-6521-4de2-963e-c6f44f6e5468?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-06T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Implementar as mudanças recomendadas por consultores ainda requer habilidades humanas, especialmente na execução de alterações nas empresas.", "titulo_pt": "Quem precisa de consultores na era da IA?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 90674, "titulo": "Cientistas confirmam hipótese levantada em 1875 por Charles Darwin sobre planta carnívora", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/cientistas-confirmam-hipotese-levantada-em-1875-por-charles-darwin-sobre-planta-carnivora.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas confirmaram uma hipótese levantada por Charles Darwin em 1875 sobre as plantas carnívoras. Darwin era particularmente fascinado com essas espécies, considerando-as 'uma das plantas mais maravilhosas do mundo'.", "titulo_pt": "Cientistas confirmam hipótese de Darwin sobre plantas carnívoras", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 91345, "titulo": "Opinion: What my colleagues and I will look for as we assess U.S. measles elimination status", "url": "https://www.statnews.com/2026/08/06/measles-elimination-status-2026-paho/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-06T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Noel T. Brewer e seus colegas irão breve decidir se os Estados Unidos mantiveram seu status de eliminação da rubéola. Eles estarão avaliando vários aspectos relacionados à eliminação da doença no país.", "titulo_pt": "Opinião: o que meus colegas e eu vamos analisar na avaliação do status de eliminação da rubéola dos estados unidos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 91346, "titulo": "Opinion: Stop asking if AI is good for medicine", "url": "https://www.statnews.com/2026/08/06/ai-health-care-skepticism-advances-nature-medicine-scribe-sepsis/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-06T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Generalizações excessivas sobre a inteligência artificial podem retardar o uso de ferramenta ucedido na captura de imagens do choque entre o foguete Starship da SpaceX e a Lua.", "titulo_pt": "S. Korea's Danuri orbiter successfully films moon collision of SpaceX rocket (orbiter lunar sul-coreano Danuri registra colisão com a lua de foguete starship da SpaceX)", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 91384, "titulo": "APOD: 2026 August 6 – New Sharpest Image of the Sun Uncovers Instability", "url": "https://science.nasa.gov/image-article/apod-2026-august-6-new-sharpest-image-of-the-sun-uncovers-instability/", "fonte_id": "nasa_news", "data_pub": "2026-08-06T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA publicou uma nova imagem do Sol como Imagem do Dia, que é a mais nítida até o momento. Esta imagem revela instabilidades na superfície solar.", "titulo_pt": "Imagem do dia: 6 de agosto de 2026 – nova imagem mais nítida do sol revela instabilidade", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 91382, "titulo": "NASA and Roscosmos continue seat barter agreement", "url": "https://spacenews.com/nasa-and-roscosmos-continue-seat-barter-agreement/", "fonte_id": "spacenews", "data_pub": "2026-08-06T02:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA e a Roscosmos concordaram em continuar o acordo de troca de assentos entre os veículos Soyuz e Crew Dragon, mas esse acordo não se estende ainda para o Starliner.", "titulo_pt": "NASA e Roscosmos continuam acordo de troca de assentos", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 91347, "titulo": "FDA approves Moderna’s mRNA flu vaccine, the first to use the technology", "url": "https://www.statnews.com/2026/08/05/fda-approves-moderna-mflusiva-first-mrna-flu-vaccine/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-06T02:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA aprovou o vacina contra a gripe da Moderna, sendo a primeira vacina aut ção de Doenças), ocupando uma vaga que durou quase um ano. É a terceira indicação para o cargo desde que Trump assumiu seu segundo mandato.", "titulo_pt": "Erica Schwartz confirmada como diretora do CDC, preenchendo vaga há quase um ano", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 91385, "titulo": "NASA’s IXPE May Have Proven 90-Year-Old Theory", "url": "https://science.nasa.gov/missions/ixpe/nasas-ixpe-may-have-proven-90-year-old-theory/", "fonte_id": "nasa_news", "data_pub": "2026-08-05T18:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A IXPE (Imaging X-ray Polarimetry Explorer) da NASA realizou observações de mais de 140 horas de um magnetar e pode ter capturado o comportamento do vácuo espacial como previsto há 90 anos pelos físicos, mas nunca diretamente observado.", "titulo_pt": "IXPE da nasa pode ter confirmado teoria de 90 anos", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 90824, "titulo": "No MASP, uma sucessão com tom de continuidade", "url": "https://braziljournal.com/no-masp-uma-sucessao-com-tom-de-continuidade/", "fonte_id": "brazil_journal", "data_pub": "2026-08-06T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávia Almeida será a nova presidente do MASP, sucedendo Heitor Martins após 12 anos de gestão. Ela já é vice-presidente do museu desde o ano anterior e continuará o trabalho iniciado pelo atual grupo administrativo.", "titulo_pt": "No MASP, sucessão com tom de continuidade", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 90648, "titulo": "Crítica à Globo, Havan vira maior anunciante de telejornais locais da emissora pelo Brasil", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/08/critica-a-globo-havan-vira-maior-anunciante-de-telejornais-locais-da-emissora-pelo-brasil.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-06T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O empresário Luciano Hang, conhecido por criticar a linha editorial da Globo em seus programas de jornalismo, tornou-se o maior anunciante das afiliadas locais da emissora pelo Brasil entre janeiro e junho. A Havan ocupou este posto durante esse período, conforme levantamento obtido pela coluna.", "titulo_pt": "Crítica à Globo: Havan se torna maior anunciante de telejornais locais da emissora", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 91190, "titulo": "‘The Man Who Carries the Voice of August’ explores the fragile legacy of the hibakusha", "url": "https://www.japantimes.co.jp/culture/2026/08/06/film/takeshi-shibata-man-who-carried-voice-august/", "fonte_id": "japan_times", "data_pub": "2026-08-06T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um jornalista tenta registrar testemunhos de sobreviventes das bombas atômicas, levantando questões sobre memória, verdade e sobrevivência. O título original do trabalho é 'O Homem que Carrega a Voz de Agosto'.", "titulo_pt": "O homem que carrega a voz de agosto", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 91399, "titulo": "Blue Note to bring world-famous jazz club to London", "url": "https://www.theguardian.com/uk-news/2026/aug/06/blue-note-jazz-club-london", "fonte_id": "guardian_culture", "data_pub": "2026-08-06T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O famoso clube de jazz Blue Note abrirá sua primeira sede no Reino Unido, na cidade de Covent Garden, em breve. O pianista vencedor do Grammy Robert Glasper será o cabeça de cartaz para a abertura da nova instalação, que promete apresentar uma mistura de jazz britânico e artistas internacionais renomados.", "titulo_pt": "Blue Note trará famoso clube de jazz para londres", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 91264, "titulo": "Michelle Yeoh named Asian filmmaker of the year at Busan film festival", "url": "https://www.koreaherald.com/article/10833362", "fonte_id": "korea_herald", "data_pub": "2026-08-06T08:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Michelle Yeoh será premiada com o título de cineasta asiático do ano no 31º Festival Internacional de Cinema de Busan. O prêmio, que reconhece contribuições excepcionais para o cinema asiático desde 2003, já foi concedido a diretores e atores como Jafar Panahi, Kiyoshi Kurosawa, Chow Yun-fat e Tony Leung Chiu-wai.", "titulo_pt": "Michelle Yeoh recebe prêmio de cineasta asiático do ano no festival de Busan", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 91010, "titulo": "Starbucks Korea raided by police after ‘Tank Day’ campaign sparks public outrage", "url": "https://www.theguardian.com/world/2026/aug/06/starbucks-korea-raided-police-tank-day-campaign-gwangju-massacre", "fonte_id": "guardian_world", "data_pub": "2026-08-06T07:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Starbucks Korea enfrentou reações negativas após uma campanha de marketing relacionada ao aniversário do massacre de Gwangju. As autoridades policiais sul-coreanas realizaram uma busca no escritório da empresa e nas residências dos executivos, como parte de uma investigação sobre a acusação de que o marketing trivializou o movimento pró-democracia dos anos 80.", "titulo_pt": "Starbucks Coreia alvo de operação policial após campanha de marketing envolver aniversário do massacre de gwangju", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 91198, "titulo": "As hibakusha age, storytelling mantle passes to the next generation", "url": "https://www.japantimes.co.jp/news/2026/08/06/japan/society/atomic-bombing-memories-families/", "fonte_id": "japan_times", "data_pub": "2026-08-06T07:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de sobr de baixo, danúbio interrompe comércio e cruzeiros", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 91095, "titulo": "Smoke towers above Washington forests as firefighting continues", "url": "http://www.euronews.com/video/2026/08/06/smoke-towers-above-washington-forests-as-firefighting-continues", "fonte_id": "euronews", "data_pub": "2026-08-06T07:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imagens de helicópteros estão sendo usadas para derramar água sobre incêndios florestais enquanto equipes reforçam as linhas de contenção em áreas centrais e orientais do estado de Washington. A fumaça de vários focos de incêndio paira acima das florestas locais.", "titulo_pt": "Fumaça invade florestas de Washington durante operações de combate a incêndios", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 91349, "titulo": "Climate change contributed to big Canada fires, study says as Trump blames mismanagement", "url": "https://phys.org/news/2026-08-climate-contributed-big-canada-trump.html", "fonte_id": "phys_org", "data_pub": "2026-08-06T07:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que o aquecimento global humano dobrou as chances de condições climáticas secas e quentes, responsáveis pela ignição das grandes incêndios florestais no Canadá durante o verão. O presidente dos Estados Unidos, Donald Trump, expressou sua irritação com essa conclusão.", "titulo_pt": "Clima seco contribuiu para grandes incêndios no canadá, estudo diz; Trump culpa gestão inadequada", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 90777, "titulo": "Ciclone bomba no Brasil: quais estados serão afetados pelo fenômeno", "url": "https://www.cnnbrasil.com.br/nacional/brasil/ciclone-bomba-no-brasil-quais-estados-serao-afetados-pelo-fenomeno/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-06T06:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ciclone bomba previsto para o Brasil vai causar temporais, granizo e ventos acima de 60 km/h entre quinta-feira e sábado nos estados do Rio Grande do Sul e Santa Catarina.", "titulo_pt": "Ciclone bomba no Brasil: quais estados serão afetados pelo fenômeno", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 91144, "titulo": "How Gambian women are restoring the mangroves protecting Banjul", "url": "https://www.aljazeera.com/news/2026/8/6/how-gambian-women-are-restoring-the-mangroves-protecting-banjul?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-06T02:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mulheres gambianas estão replantando manguezais que protegem a capital ilha de Banjul da erosão e inundações. As árvores fornecem sustento para as mulheres, que plantam e cuidam delas.", "titulo_pt": "Como mulheres gambianas estão restaurando os mangueiros protegendo Banjul", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 90206, "titulo": "Energy-use regulations advance in legislature", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/06/2003862004", "fonte_id": "taipei_times", "data_pub": "2026-08-06T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A regulamentação do uso de energia avançou no legislativo. O projeto está sendo analisado pelas autoridades.", "titulo_pt": "Regulamento sobre uso de energia avança na legislatura", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 89785, "titulo": "Construcción sostenible: UTEM desarrolla paneles con hongos para reemplazar el plumavit", "url": "https://www.latercera.com/emprendimiento/noticia/construccion-sostenible-utem-desarrolla-paneles-con-hongos-para-reemplazar-el-plumavit/", "fonte_id": "la_tercera", "data_pub": "2026-08-05T21:04:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Universidade Tecnológica Metropolitana está desenvolvendo painéis isolantes biodegradáveis utilizando micelios de "2026-08-05T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As vendas de carros elétricos no Brasil estão aumentando, atingindo cerca de 50 mil unidades por mês, lideradas pelas marcas BYD e GWM. Analistas do Citi estão examinando o impacto disso na demanda por combustíveis.", "titulo_pt": "O carro elétrico vai pressionar a demanda por combustíveis? Veja as contas do Citi", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 89754, "titulo": "El Niño could push 50m people into acute hunger before end of next year", "url": "https://www.theguardian.com/environment/2026/aug/05/el-nino-could-push-50m-people-acute-hunger-next-year", "fonte_id": "guardian_world", "data_pub": "2026-08-05T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ONU alerta para agravamento das condições de 45 países já enfrentando insegurança alimentar severa. A previsão é que cerca de 50 milhões de pessoas passem por fome aguda antes do final do próximo ano, devido ao rápido desenvolvimento do fenômeno El Niño.", "titulo_pt": "El Niño pode empurrar 50 milhões de pessoas para a fome aguda até o fim do próximo ano", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 90009, "titulo": "Fuego volcano eruption forces mass evacuations in Guatemala", "url": "http://www.euronews.com/video/2026/08/05/fuego-volcano-eruption-forces-mass-evacuations-in-guatemala", "fonte_id": "euronews", "data_pub": "2026-08-05T06:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vulcão Fuego na Guatemala entrou em erupção, levando o país a aumentar o nível de alerta para vermelho e a evacuar 659 pessoas de oito vilas. O vulcão também lançou jatos de lava e fluxos piroclásticos pelas suas encostas.", "titulo_pt": "Eruption do vulcão fuego força massivas evacuações na Guatemala", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 89864, "titulo": "El Niño Bakes Southeast Asia", "url": "https://foreignpolicy.com/2026/08/05/el-nino-southeast-asia-rice-production/", "fonte_id": "foreign_policy", "data_pub": "2026-08-05T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A região de Southeast Asia, que é importante produtora de arroz, sofreu com os efeitos do El Niño.", "titulo_pt": "El Niño castiga a ásia oriental", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 90012, "titulo": "Fuego volcano spews more ash and lava as Guatemala shelters 1,700 who fled nearby villages", "url": "http://www.euronews.com/2026/08/05/fuego-volcano-spews-more-ash-and-lava-as-guatemala-shelters-1700-who-fled-nearby-villages", "fonte_id": "euronews", "data_pub": "2026-08-05T04:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vulcão Fuego, na Guatemala, entrou em erupção novamente, emitindo mais cinzas e lava. Serviços de emergência emitiram um alerta vermelho, o nível mais grave, após a atividade volcânica intensificar à noite.", "titulo_pt": "Vulcão fuego explode com maior intensidade; 1.700 pessoas são abrigadas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 88786, "titulo": "'Megafires like the one in Gironde usher in an unknown dimension in Earth's human history'", "url": "https://www.lemonde.fr/en/opinion/article/2026/08/05/megafires-like-the-one-in-gironde-usher-in-an-unknown-dimension-to-the-human-history-of-life-on-earth_6756166_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-05T00:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais de grandes proporções, como o ocorrido na Gironde, estão se tornando uma realidade nos últimos anos. Especialistas em clima alertam que é necessário um chamado à ação para evitar que esses incêndios levem ao aumento ainda maior dos riscos.", "titulo_pt": "Grandes incêndios como o da Gironde abrem uma nova dimensão na história humana da terra", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 91067, "titulo": "Human rights organizations call for war crime probe into Israel's killing of Lebanese journalist", "url": "https://www.lemonde.fr/en/international/article/2026/08/06/human-rights-organizations-call-for-war-crime-probe-into-israel-s-killing-of-lebanese-journalist_6756211_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-06T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Organizações de direitos humanos, como a Amnistia Internacional e a Watch dos Direitos Humanos, estão pedindo uma investigação sobre crimes de guerra relacionados à morte do jornalista libanês Amal Khalil, que trabalhava para o 'Al-Akhbar', um periódico esquerdista próximo ao Hezbollah, no dia 22 de abril.", "titulo_pt": "Organizações de direitos humanos pleiteiam investigação sobre crime de guerra em relação à morte do jornalista libanês", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 90689, "titulo": "STJ decide destino de Marco Buzzi, acusado de assédio sexual", "url": "https://veja.abril.com.br/brasil/stj-decide-destino-de-marco-buzzi-acusado-de-assedio-sexual/", "fonte_id": "veja", "data_pub": "2026-08-06T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ministros do Superior Tribunal de Justiça (STJ) vão analisar, em uma sessão fechada, a conclusão do processo disciplinar contra Marco Buzzi, acusado de assédio sexual.", "titulo_pt": "STJ decide destino de Marco Buzzi, acusado de assédio sexual", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 91386, "titulo": "At least 300 children reportedly killed in Gaza in past 300 days", "url": "https://www.unicef.org/press-releases/least-300-children-reportedly-killed-gaza-past-300-days", "fonte_id": "unicef", "data_pub": "2026-08-06T07:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com relatos, pelo menos 300 crianças foram mortas em Gaza nos últimos 300 dias. Não há detal :54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O diretor geral da OMS, Tedros Adhanom Ghebreyesus, chamou para uma resposta 'massiva' ao surto de ebola na República Democrática do Congo. Segundo as autoridades sanitárias, há 3.874 casos confirmados e 1.751 mortes causadas pelo vírus.", "titulo_pt": "Tedros incentiva resposta massiva ao surto de ébola na RDC diante da rápida propagação", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 91028, "titulo": "Malaysia Says It Will Not Deport Rohingya if There Are Risks to Their Safety", "url": "https://thediplomat.com/2026/08/malaysia-says-it-will-not-deport-rohingya-if-there-are-risks-to-their-safety/", "fonte_id": "the_diplomat", "data_pub": "2026-08-06T02:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do primeiro-ministro Anwar Ibrahim anunciou planos para repatriar aproximadamente 5.000 rohingyas com o consentimento da Birmânia.", "titulo_pt": "Malásia afirma que não deportará Rohingya se houver riscos à sua segurança", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 90081, "titulo": "Malaysia vows not to return Rohingya refugees to Myanmar if lives at risk", "url": "https://www.aljazeera.com/news/2026/8/5/malaysia-will-not-return-rohingya-refugees-to-myanmar-if-lives-are-at-risk?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-05T18:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades malásias estãoscreenando 5.000 refugiados rohingya, enquanto organizações de direitos humanos alertam que eles continuam em risco de perseguição no Myanmar.", "titulo_pt": "Malásia se compromete não devolver refugiados Rohingya ao Myanmar se suas vidas estiverem em perigo", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 89672, "titulo": "Tribunal confisca la casa que el exalcalde Aguilera compró con fondos ilícitos y que CIPER detectó en 2018", "url": "https://www.ciperchile function toggleDrill(id) {

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
