<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "01/11/2026 15:18", "stats": {"noticias_novas": 599, "resumos_gerados": 234}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Após a reeleição de Lula nas eleições, o Brasil viveu um período de intensa atividade política e social. Em novembro, o Bolsa Família teve seu piso reajustado para R$ 691 por família, com pagamentos antecipados nos últimos meses do ano. O PT comemorou a vitória de Lula com um vídeo que relembra a semana após a vitória nas urnas. Por outro lado, o PT de Cleitinho, senador de Minas Gerais, criticou campanhas de boicote ao compartilhar uma história positiva com um adversário. A transição de mandato para Lula já começou com a saída de José Múcio, que era responsável pela estruturação do financiamento de projetos de Defesa no governo. Além disso, a justiça liberou documentos sigilosos sobre a morte de Tancredo Neves após 41 anos, e o mercado de carbono brasileiro terá regras específicas para a aviação, com a Anac regulando o uso do SAF (combustível sustentável de aviação).", "mundo": "As eleições médias nos Estados Unidos estão em andamento, com todos os 435 assentos da Câmara dos Representantes e 35 dos 100 assentos do Senado em disputa. O presidente Joe Biden e os democratas estão intensificando seus esforços antes do pleito. A França registrou 779 prisões durante o fim de semana de protestos, com o governo atribuindo a redução da violência a uma estratégia de segurança bem-sucedida. O governo sérvio fechou o banco Alta Bank, que era favorito dos russos, após suspeitas de transferências de grandes quantias de dinheiro do país. A Coreia do Norte foi acusada pelo FBI de realizar o maior roubo de criptomoedas da história, drenando US$ 6,3 bilhões da corretora Binance. Além disso, o presidente ucraniano, Zelensky, expressou sua disposição para se encontrar com Putin em território turco, enquanto o prefeito de Carcassonne, na França, enfrenta críticas por suas afirmações provocativas e ações.\n\nTaiwan protestou contra a percepção de discriminação na APEC, enquanto o FBI acusou a Coreia do Norte de estar por trás de uma roubagem de criptomoedas no valor de US$6 bilhões. As tensões geopolíticas continuam com ataques israelenses na Faixa de Gaza, que resultaram em pelo menos oito mortes, incluindo uma criança, apesar da trégua. O Irã prometeu uma resposta militar sem limites a ataques dos EUA e Israel, intensificando as ameaças de ação militar. A Coreia do Norte foi notificada pela Suíça para retomar conversações diretas, enquanto a ONU pediu uma investigação urgente após o falecimento de um de seus funcionários detido pelos hutis no Yemen. A China está expandindo seu comércio de armas para África, oferecendo equipamentos mais especializados, enquanto o conflito israelo-palestino continua com ataques de drones israelenses em Gaza, que resultaram em pelo menos oito mortes, incluindo uma criança de quatro anos.", "economia": "As exportações da Coreia do Sul quase dobraram devido à crescente demanda por tecnologia de inteligência artificial, refletindo o avanço desta indústria. A Petrobras aumentou o preço do querosene de aviação em 7,2%, resultando em um acréscimo de R$ 0,45 por litro, em resposta às tensões militares e políticas no Oriente Médio e na Europa. A Binance registrou saídas líquidas de US$ 3,64 bilhões após a retomada dos saques, representando 2,1% do total de US$ 171 bilhões em ativos sob gestão. O mercado de petróleo está em alta, enquanto os rendimentos das tesourarias têm diminuído, indicando preocupações com a inteligência artificial. Além disso, as petroleiras aumentaram seus lucros durante a guerra, com a ExxonMobil reportando um lucro de US$ 15,4 bilhões no trimestre. O preço do petróleo continua subindo, enquanto os investidores de crédito enfrentam uma 'batalha sangrenta' devido a estratégias agressivas de transferência de ativos.", "tecnologia": "A Standard & Poor's alterou para negativo a perspectiva de Meta, a empresa dona do Facebook, sem fornecer detalhes específicos. No âmbito da tecnologia, a Binance retomou as retiradas de criptomoedas após um furto de US$ 6,3 bilhões, recuperando 95% dos ativos roubados. Ainda na área das criptomoedas, a Binance anunciou que cobrirá as perdas resultantes do ataque hacker com recursos próprios. A NASA aprimorou seus satélites para monitorar com maior precisão o dióxido de carbono na atmosfera, coletando mais de um milhão de observações diárias. Além disso, a startup chinesa DeepSeek apresentou um agente de inteligência artificial mais autônomo, capaz de lidar com múltiplas tarefas com intervenção humana mínima, entrando em competição com concorrentes dos EUA que também oferecem IAs com iniciativa.", "ciencia": "Um estudo publicado no site [phys_org] revela que pinheiros plantados no Hemisfério Sul crescem até quatro vezes mais rápido e são mais resistentes à seca do que na sua região nativa, o que tem implicações significativas para as florestas e para os carbonos-sink. No Brasil, um medicamento oral aprovado pela Anvisa pode frear o avanço do câncer de pulmão por até sete anos, com um custo médio de R$ 40 mil por caixa. A NASA informou que a missão SR-1 Freedom, a primeira nave com propulsão nuclear para voo interplanetário com destino a Marte, segue em linha para um lançamento até o final de 2028, o que representa um avanço significativo na exploração espacial. Além disso, um estudo publicado no [science_daily] descobriu que comer amendoim todos os dias pode auxiliar na saúde cerebral e na memória em adultos mais velhos, com uma melhoria na resposta à insulina em regiões cerebrais importantes para a memória.", "cultura": "A Noite Branca em Taipei trouxe arte ao bairro de Yuanshan, com diversas formas de expressão artística. Em outro evento cultural, a indumentária de Mãe Bernadete, líder quilombola, foi doada ao Museu Nacional do Rio de Janeiro, preservando parte da história e cultura afro-brasileira. O documentário 'Você Pode Ver Tudo', da A24, liderou as bilheterias, superando 'Clayface'. O diretor de teatro Gerald Thomas, que publicou um vídeo de sua internação em um hospital no Maranhão, enfatizou a importância da persistência na realização de filmes e séries de TV. A animação 'As Aventuras de Tita' estreou na programação infantil da TV Brasil, enquanto o filósofo Pietro del Soldà, participante do Festival Puerto de Ideas Valparaíso, reivindicou a importância do amor, da amizade e da aventura para a liberdade e a convivência democrática.", "sociedade": "Em Paris, estudantes franceses planejam retomar bloqueios em escolas após rejeitarem as medidas do governo, com o presidente Emmanuel Macron pedindo normalidade nas aulas. No entanto, a violência persiste, com centenas de milhares de jovens europeus protestando contra altos preços e falta de perspectivas, resultando em saques de lojas e prisões em Frankfurt. No Brasil, a Geração Z realiza manifestações na Alemanha, com o Ministro do Interior condenando a violência e apontando os extremistas de esquerda como responsáveis. Em Bangladesh, trabalhadores da indústria de confecção entraram em conflito com a polícia em protesto contra salários baixos. No México, jovens enfrentam desafios de emprego e desespero em Linares, onde a taxa de desemprego é alta e os jovens enfrentam dificuldades para encontrar trabalho fora do setor agrícola. Em Hong Kong, uma corte decidiu que pedir a empregadas que tenham filhos para que deixem o trabalho para que seu marido cuide do filho constitui assédio no local de trabalho.", "meio_ambiente": "Em dezembro, o estado da Califórnia inaugurará o maior puente para animais do mundo, localizado perto das Montanhas de Santa Mônica, com o objetivo de conectar habitats e promover a circulação de animais. Na Flórida, um adolescente de 14 anos, Isaac Nelson, construiu jardins submarinos verticais de ostras para purificar água, limpando 950.000 litros por dia. Este projeto foi destaque em um documentário sobre mudanças oceanográficas e foi finalista do Prêmio Sylvia Earle de Conservação Oceânica 2026. O governo do Território do Norte do Canadá planeja eliminar uma exigência legal que garante a reserva de água para a natureza, o que é visto como um 'ataque escancarado e sem vergonha' ao meio ambiente por grupos ambientais. Além disso, questões relacionadas a desastres climáticos podem ser abordadas no Enem e vestibulares devido à sua relevância atual.", "direitos_humanos": "O aumento da população carcerária tem levado a várias consequências, incluindo a falta de atendimento à saúde mental nos presídios, conforme alerta o Comitê para a Prevenção da Tortura. Entre 2020 e 2025, a taxa de suicídios foi de 51,2 por 100.000 detentos anualmente. Outro caso de violação dos direitos humanos envolve o ICE (Immigration and Customs Enforcement) dos EUA, que publicou um vídeo em que debocha de migrantes presos, começando com a música 'Thriller', de Michael Jackson, e mostrando imagens de prisões e migrantes detidos, acompanhadas por ícones de filmes de terror. A artista Pitjantjatjara Sally Scales denuncia que a tecnologia está usando arte indígena australiana e criando 'Temu slop', representando uma 'falta de respeito' pela cultura e diminuindo a autonomia dos artistas indígenas. O governo brasileiro anunciou no sábado, 31, que aumentará a presença da Força Nacional em aldeias indígenas de Mato Grosso do Sul, em resposta a denúncias de violência, incluindo reforço no efetivo e monitoramento das comunidades Guarani Kaiowá."}, "resumo_do_dia": {"politica_nacional": [{"id": 238943, "titulo": "Bolsa Família de novembro: Veja calendário de pagamentos para o mês", "url": "https://www.cnnbrasil.com.br/economia/seu-bolso/meu-dinheiro/bolsa-familia-de-novembro-veja-calendario-de-pagamentos-para-o-mes/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-01T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Bolsa Família teve seu piso mínimo reajustado para R$ 691 por família a partir de novembro. O governo antecipou os pagamentos para os últimos meses do ano.", "titulo_pt": "Calendário de pagamentos do bolsa Família de novembro: veja quando receber", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 238864, "titulo": "PT volta a celebrar reeleição com vídeo da “tropa das vós e dos vôs”", "url": "https://www.poder360.com.br/poder-eleicoes-2026/pt-volta-a-celebrar-reeleicao-com-video-da-tropa-das-vos-e-dos-vos/", "fonte_id": "poder360", "data_pub": "2026-11-01T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PT comemorou a reeleição de Lula com um vídeo que menciona a 'tropa das vós e dos vôs'. Lula venceu Flávio no segundo turno das eleições após obter mais de 10,4 milhões de votos e terminar com 51,78% dos votos válidos.", "titulo_pt": "PT comemora reeleição com vídeo da 'tropa das vós e dos vôs'", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 238876, "titulo": "Trump quer que eleições legislativas sejam sobre ele, mas isso pode ser tiro no pé", "url": "https://veja.abril.com.br/mundo/trump-quer-que-eleicoes-legislativas-sejam-sobre-ele-mas-isso-pode-ser-tiro-no-pe/", "fonte_id": "veja", "data_pub": "2026-11-01T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os republicanos têm enfrentado dificuldades para se distanciar do presidente impopular, que exige lealdade absoluta. Trump quer que as eleições legislativas sejam sobre ele, o que pode ser um risco para os republicanos.", "titulo_pt": "Trump quer que eleições legislativas sejam sobre ele, mas isso pode ser tiro no pé", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 238877, "titulo": "O otimismo de Alcolumbre na eleição para a presidência do Senado", "url": "https://veja.abril.com.br/politica/o-otimismo-de-alcolumbre-na-eleicao-para-a-presidencia-do-senado/", "fonte_id": "veja", "data_pub": "2026-11-01T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alcolumbre expressou otimismo sobre a eleição para a presidência do Senado. O parlamentar discutiu planos com ministros do STF e sinalizou com possibilidade de anistia para o ex-presidente Jair Bolsonaro aos bolsonaristas.", "titulo_pt": "O otimismo de Alcolumbre na eleição para a presidência do Senado", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 238899, "titulo": "Contra boicotes, Cleitinho dá testemunho sobre cliente petista de varejão", "url": "https://www.metropoles.com/minas-gerais/contra-boicotes-cleitinho-da-testemunho-sobre-cliente-petista-de-varejao", "fonte_id": "metropoles", "data_pub": "2026-11-01T17:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador eleito de Minas Gerais, Cleitinho, criticou campanhas de boicote e compartilhou uma história sobre um cliente do partido adversário que continuou comprando em seu comércio.", "titulo_pt": "Cleitinho critica boicotes e relata história de cliente petista", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 238973, "titulo": "Justiça libera documentos sobre morte de Tancredo Neves após 41 anos; entenda", "url": "https://www.infomoney.com.br/brasil/justica-libera-documentos-sobre-morte-de-tancredo-neves-apos-41-anos-entenda/", "fonte_id": "infomoney", "data_pub": "2026-11-01T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça permitiu que a família de Tancredo Neves consultasse documentos sigilosos relacionados à sua morte, ocorrida em 1985, após 41 anos. Os registros médicos e processos podem esclarecer as suspeitas sobre possíveis falhas no tratamento do presidente eleito antes de sua posse.", "titulo_pt": "Justiça libera documentos sobre morte de Tancredo Neves após 41 anos; entenda", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 238879, "titulo": "A transição de mandato para Lula já começou na área militar do governo", "url": "https://veja.abril.com.br/brasil/a-transicao-de-mandato-para-lula-ja-comecou-na-area-militar-do-governo/", "fonte_id": "veja", "data_pub": "2026-11-01T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "José Múcio, responsável por pacificar a caserna e estruturar o financiamento de projetos de Defesa no país, está prestes a deixar o governo.", "titulo_pt": "Transição de mandato para Lula já começou na área militar do governo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 238831, "titulo": "PSOL pede que Ministério Público apure exoneração de servidora da gestão Tarcísio que criticou Flávio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/psol-pede-que-ministerio-publico-apure-exoneracao-de-servidora-da-gestao-tarcisio-que-criticou-flavio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-01T16:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada federal Luciene Cavalcante, o deputado estadual Carlos Giannazi e o vereador Celso Giannazi, todos do PSOL, protocolaram uma representação no Ministério Público de São Paulo pedindo a apuração da exoneração de Silvana Pereira Gimenes, uma servidora com deficiência da gestão Tarcísio de Freitas. A exoneração ocorreu após a servidora criticar Flávio, irmão de Tarcísio, em um vídeo.", "titulo_pt": "PSOL pede apuração da exoneração de servidora criticou Flávio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 238865, "titulo": "PT publica vídeo em que relembra uma semana da vitória nas eleições", "url": "https://www.poder360.com.br/poder-eleicoes/pt-publica-video-em-que-relembra-uma-semana-da-vitoria-nas-eleicoes/", "fonte_id": "poder360", "data_pub": "2026-11-01T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido dos Trabalhadores (PT) publicou um vídeo relembrando uma semana após a vitória nas eleições, mostrando momentos de Lula, aliados e apoiadores com bandeiras do partido e do Brasil.", "titulo_pt": "PT divulga vídeo lembrando semana após vitória nas eleições", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 238866, "titulo": "Boulos critica Tarcísio por preço do diesel, mas ignora aumento de petistas", "url": "https://www.poder360.com.br/poder-economia/boulos-critica-tarcisio-por-preco-do-diesel-mas-ignora-aumento-de-petistas/", "fonte_id": "poder360", "data_pub": "2026-11-01T16:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Boulos criticou o governador Tarcísio por aumentos no preço do diesel, enquanto o aumento no ICMS foi aprovado por um conselho presidido pelo ministro da Fazenda, Dario Durigan. Boulos não mencionou o aumento proposto por petistas.", "titulo_pt": "Boulos critica Tarcísio por preço do diesel, mas ignora aumento de petistas", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 238868, "titulo": "Filha de brasileira no Texas pede desculpas após criticar Charlie Kirk", "url": "https://www.poder360.com.br/poder-internacional/isa-casahuga-pede-desculpas-apos-debochar-de-charlie-kirk/", "fonte_id": "poder360", "data_pub": "2026-11-01T16:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A filha de brasileira que reside no Texas, Isa Casahuga, pediu desculpas após criticar Charlie Kirk em um vídeo. Ela assumiu a responsabilidade pelas falas e afirmou que a violência política é inaceptável.", "titulo_pt": "Filha de brasileira no Texas se retrata após criticar Charlie Kirk", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 238848, "titulo": "Parlamentares recorrem ao MP contra exoneração de servidora que criticou Flávio Bolsonaro", "url": "https://www.cartacapital.com.br/cartaexpressa/parlamentares-recorrem-ao-mp-contra-exoneracao-de-servidora-que-criticou-flavio-bolsonaro/", "fonte_id": "cartacapital", "data_pub": "2026-11-01T15:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Parlamentares recorreram ao Ministério Público contra a exoneração de uma servidora que criticou Flávio Bolsonaro. Silvana Pereira, que trabalhava na Secretaria de Estado dos Direitos da Pessoa com Deficiência de São Paulo, foi demitida pelo governo Tarcísio.", "titulo_pt": "Parlamentares recorrem ao MP contra exoneração de servidora que criticou Flávio Bolsonaro", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 238869, "titulo": "Mercado ilegal cresceu em países que restringiram bets, diz estudo", "url": "https://www.poder360.com.br/poder-economia/mercado-ilegal-cresceu-em-paises-que-restringiram-bets-diz-estudo/", "fonte_id": "poder360", "data_pub": "2026-11-01T15:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo com base em 11 países mostrou que o mercado ilegal de apostas cresceu nos locais onde as restricções foram implementadas, além de indicar perdas na arrecadação e a saída de recursos para o exterior.", "titulo_pt": "Mercado ilegal expandiu-se em países que restringiram apostas, sugere estudo", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 238912, "titulo": "Apoiadores do Lula celebram vitória em ato com música e dança no Eixão", "url": "https://www.metropoles.com/distrito-federal/apoiadores-do-lula-celebram-vitoria-em-ato-com-musica-e-danca-no-eixao", "fonte_id": "metropoles", "data_pub": "2026-11-01T15:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma manifestação convocada pelo PT reuniu eleitores no Eixão do Lazer para comemorar o resultado das eleições. Apoiadores do Lula celebraram com música e dança.", "titulo_pt": "Apoiadores do Lula celebram vitória em ato com música e dança no Eixão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 238939, "titulo": "Ex-agente do Mossad teria ajudado Flávio Bolsonaro a fugir do Brasil, afirma jornal", "url": "https://www.brasildefato.com.br/2026/11/01/ex-agente-do-mossad-teria-ajudado-flavio-bolsonaro-a-fugir-do-brasil-afirma-jornal/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-01T15:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ex-agente do Mossad, serviço de inteligência de Israel, teria acompanhado o senador Flávio Bolsonaro na fuga do Brasil para a Argentina, onde ele embarcou em um avião particular com destino aos Estados Unidos. A informação foi publicada no jornal israelense The Jerusalem Post.", "titulo_pt": "Ex-agente do Mossad teria ajudado Flávio Bolsonaro a fugir do Brasil, afirma jornal", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 238872, "titulo": "Ação contra pedofilia prende 17 funcionários de Disney e Universal", "url": "https://www.poder360.com.br/poder-internacional/acao-contra-pedofilia-prende-17-funcionarios-de-disney-e-universal/", "fonte_id": "poder360", "data_pub": "2026-11-01T15:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A operação contra pedofilia resultou na prisão de 17 funcionários de Disney e Universal. A ação também deteve 281 pessoas relacionadas a tráfico humano e abuso sexual infantil na Flórida, Estados Unidos.", "titulo_pt": "Operação contra pedofilia prende 17 funcionários de Disney e Universal", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 239307, "titulo": "Taiwan protests APEC ‘discrimination’", "url": "https://www.taipeitimes.c _pt": "EUA atribuem roubo de criptomoedas de US$6 bilhões à Coreia do norte", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 239176, "titulo": "The midterms will test the nation's political direction and confidence", "url": "https://www.npr.org/2026/11/01/nx-s1-6023380/midterms-test-confidence", "fonte_id": "npr_news", "data_pub": "2026-11-01T17:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As eleições médias podem testar a direção política e a confiança do país nos próximos dias e semanas. Este teste pode se estender por algum tempo.", "titulo_pt": "As eleições médias testarão a direção política e a confiança do país", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 238969, "titulo": "Irã e mediadores do Catar travam 3º dia de negociações para fim de guerra", "url": "https://www.infomoney.com.br/mundo/ira-e-mediadores-do-catar-travam-3o-dia-de-negociacoes-para-fim-de-guerra/", "fonte_id": "infomoney", "data_pub": "2026-11-01T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Negociações para o fim da guerra entre o Irã e mediadores do Catar estão em seu terceiro dia. O presidente dos Estados Unidos, Donald Trump, declarou que os EUA não lançarão novos ataques contra o Irã antes de uma votação.", "titulo_pt": "Irã e mediadores do Catar mantêm 3º dia de negociações para fim de guerra", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 238861, "titulo": "Eleição nos Estados Unidos define futuro de Trump nesta terça-feira", "url": "https://agenciabrasil.ebc.com.br/internacional/noticia/2026-10/eleicao-nos-estados-unidos-define-futuro-de-trump-nesta-terca-feira", "fonte_id": "agencia_brasil_intl", "data_pub": "2026-11-01T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os eleitores dos Estados Unidos votarão em 3 de novembro para escolher membros da Câmara dos Representantes, senadores e governadores, o que pode influenciar o futuro político de Donald Trump. A conquista de uma maioria pelos democratas no Congresso poderia afetar as políticas internacionais, incluindo as relações entre os EUA e o Brasil.", "titulo_pt": "Eleição nos EUA define futuro de Trump nesta terça-feira", "veiculo": "Agência Brasil - Internacional", "pais": "Brasil", "classe": "A"}, {"id": 239187, "titulo": "Democratic Rep. Haley Stevens endorses Republican Mike Rogers for Michigan Senate", "url": "https://www.politico.com/news/2026/11/01/haley-stevens-endorses-mike-rogers-michigan-senate-01144698", "fonte_id": "politico", "data_pub": "2026-11-01T17:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A democrata Haley Stevens endossou o republicano Mike Rogers para o Senado de Michigan, prejudicando o candidato democrata Abdul El-Sayed nas últimas semanas de sua campanha.", "titulo_pt": "República endossa democrata em Michigan, prejudicando candidato do partido", "veiculo": "Politico", "pais": "EUA", "classe": "A"}, {"id": 239025, "titulo": "França registra quase 800 prisões em novo fim de semana de protestos", "url": "https://www.dw.com/pt-br/frança-registra-quase-800-prisões-em-novo-fim-de-semana-de-protestos/a-79823505?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-01T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As autoridades francesas registraram 779 prisões durante o fim de semana de protestos, um número menor em comparação com as últimas semanas. O governo atribui a redução da violência a uma forte estratégia de segurança.", "titulo_pt": "França registra quase 800 prisões em novo fim de semana de protestos", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 239177, "titulo": "New York marathon: Sweden's Almgren and Kenya's Chepkirui win as 60,000 take part", "url": "https://www.npr.org/2026/11/01/nx-s1-6025437/new-york-marathon-almgren-chepkirui-win", "fonte_id": "npr_news", "data_pub": "2026-11-01T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andreas Almgren, da Suécia, venceu a prova masculina do Maratona de Nova York em sua estreia no evento, enquanto Sheila Chepkirui, da Quênia, conquistou a prova feminina pela segunda vez.", "titulo_pt": "Maratona de nova York: Almgren da suécia e Chepkirui da quênia são campeões", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 239257, "titulo": "Hebron siege continues for 10th day as Israel threatens wider offensive", "url": "https://www.aljazeera.com/news/2026/11/1/hebron-siege-continues-for-10th-day-as-israel-threatens-wider-offensive?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-01T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O cerco em Hebron continua por 10 dias, com perdas econômicas superando 3,8 milhões de dólares. As forças israelenses estão demolindo casas na Cisjordânia Ocidental e fechando centenas de estabelecimentos comerciais.", "titulo_pt": "Siege em hebron continua por 10 dias com perdas econômicas superando 3,8 milhões de dólares", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 238822, "titulo": "A Ilha de Coiba, a brutal prisão a céu aberto que se tornou um paraíso natural e para onde o Panamá está enviando prisioneiros novamente", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/11/a-ilha-de-coiba-a-brutal-prisao-a-ceu-aberto-que-se-tornou-um-paraiso-natural-e-para-onde-o-panama-esta-enviando-prisioneiros-novamente.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-11-01T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Ilha de Coiba, uma vez uma prisão aberta, se tornou um paraíso natural com a liberdade dos presos e agora o Panamá está considerando enviar prisioneiros novamente. A praia é repleta de caranguejos e a vegetação densa cobre o interior da ilha.", "titulo_pt": "A Ilha de Coiba, uma prisão aberta que se tornou um paraíso natural e para onde o Panamá está enviando prisioneiros novamente", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 239074, "titulo": "Tras fin de 35 años de misión por la paz: ONU reafirma compromiso con una solución pacífica en el Sáhara", "url": "https://www.latercera.com/mundo/noticia/tras-fin-de-35-anos-de-mision-por-la-paz-onu-reafirma-compromiso-con-una-solucion-pacifica-en-el-sahara/", "fonte_id": "la_tercera", "data_pub": "2026-11-01T17:27:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Secretário Geral da ONU, António Guterres, reafirmou o compromisso da organização com uma solução pacífica para o conflito do Saara Ocidental, mesmo após o fim da missão de referendo. O direito do povo a uma autodeterminação livre não foi anulado pelo encerramento da missão Minurso.", "titulo_pt": "ONU reafirma compromisso com solução pacífica no saara ocidental após fim da missão", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 239048, "titulo": "Cómo van las elecciones en USA 2026: resultados en vivo del voto anticipado y las midterms entre republicanos vs. demócratas hoy", "url": "https://www.lanacion.com.ar/estados-unidos/washington/como-van-las-elecciones-en-usa-2026-resultados-en-vivo-del-voto-anticipado-y-las-midterms-entre-nid01112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-01T17:25:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O voto anticipado nas eleições dos Estados Unidos de 2026 está sendo acompanhado em tempo real, com foco nas participações presenciais e por correspondência antes do dia 3 de novembro. Os resultados são comparados entre republicanos e democratas.", "titulo_pt": "Como andam as eleições nos EUA 2026: resultados em tempo real do voto antecipado entre republicanos e democratas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 239297, "titulo": "Zelensky, 'sono pronto a incontrare Putin in Turchia'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/01/zelensky-sono-pronto-a-incontrare-putin-in-turchia_516083df-7e30-4737-9ff6-48eec4624bb1.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-01T17:22:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O presidente ucraniano, Zelensky, expressou sua disposição para se encontrar com Putin em território turco. As negociações focam no cessar-fogo ao longo da linha do fronte e no cumprimento dos acordos.", "titulo_pt": "Zelensky prontos para se encontrar com Putin na Turquia", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 239159, "titulo": "Ukraine defies Trump to resume attacks on Russian oil refineries", "url": "https://www.theguardian.com/world/2026/nov/01/ukraine-defies-trump-resumes-attacks-russian-oil", "fonte_id": "guardian_world", "data_pub": "2026-11-01T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Ucrânia continuou seus ataques a refinarias de petróleo russas em desafio à pressão do ex-presidente dos Estados Unidos, Donald Trump, antes das eleições legislativas americanas. Um cessar-fogo na cidade ocupada de Oleshky terminará no final de domingo. O Kremlin afirma que Kiev está 'simplesmente ignorando' os desejos dos EUA.", "titulo_pt": "Ucrânia desobedece a Trump e volta a atacar refinarias de petróleo russas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 239324, "titulo": "US sell-offs pose challenge for TAIEX", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/02/2003866974", "fonte_id": "taipei_times", "data_pub": "2026-11-02T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vendas de títulos dos Estados Unidos representam um desafio para o índice de ações TAIEX. O TAIEX é o principal índice de ações da Bolsa de Valores de Tóquio.", "titulo_pt": "Vendas de títulos dos EUA representam desafio para o TAIEX", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id":  {"id": 238890, "titulo": "Conhece a IA proativa? Ela lê suas conversas e propõe soluções", "url": "https://veja.abril.com.br/coluna/planeta-ia/conhece-a-ia-proativa-ela-le-suas-conversas-e-propoe-solucoes/", "fonte_id": "veja", "data_pub": "2026-11-01T14:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O DeepSeek, um agente de inteligência artificial proativo, foi disponibilizado recentemente para desenvolvedores. Este agente lê conversas e propõe soluções, entrando em uma disputa com concorrentes dos EUA que também oferecem IAs com iniciativa.", "titulo_pt": "Conhece a IA proativa? Ela lê suas conversas e propõe soluções", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 239360, "titulo": "Here’s what ‘renoa’ — the first new fiber in 25 years — feels like", "url": "https://techcrunch.com/2026/11/01/heres-what-renoa-the-first-new-fiber-in-25-years-feels-like/", "fonte_id": "techcrunch", "data_pub": "2026-11-01T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup Everbloom desenvolveu um novo material chamado renoa, que é a primeira fibra inovadora em 25 anos. A sensação da fibra é muito familiar.", "titulo_pt": "Veja o que 'renoa' — a primeira fibra nova em 25 anos — se sente", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 239372, "titulo": "Why some trees thrive far from home—and what that means for carbon sinks", "url": "https://phys.org/news/2026-10-trees-home-carbon.html", "fonte_id": "phys_org", "data_pub": "2026-11-01T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo que abrange 192 locais e quatro continentes descobriu que pinheiros plantados no Hemisfério Sul crescem até quatro vezes mais rápido e são mais resistentes à seca do que os pinheiros que crescem em suas regiões nativas.", "titulo_pt": "Por que algumas árvores prosperam longe de casa — e o que isso significa para os bancos de carbono", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 238946, "titulo": "Remédio para câncer de pulmão pode evitar avanço da doença por 7 anos", "url": "https://www.cnnbrasil.com.br/saude/remedio-para-cancer-de-pulmao-pode-evitar-avanco-da-doenca-por-7-anos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-01T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um medicamento em forma de comprimido de via oral pode frear o avanço do câncer de pulmão por até sete anos. No Brasil, o medicamento é aprovado pela Anvisa e tem um custo médio de R$ 40 mil por caixa.", "titulo_pt": "Remédio para câncer de pulmão pode evitar avanço da doença por 7 anos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 239398, "titulo": "'Metroid Prime' needs some 'Resident Evil'-style remakes to rediscover its sci-fi shooter mojo", "url": "https://www.space.com/entertainment/space-games/metroid-prime-needs-some-resident-evil-style-remakes-to-rediscover-its-sci-fi-shooter-mojo", "fonte_id": "space_com", "data_pub": "2026-11-01T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A franquia de jogos de tiro em primeira pessoa sci-fi da Nintendo está em problemas, mas há uma solução para os problemas da Samus.", "titulo_pt": "'Metroid Prime' precisa de remasterizações do estilo 'Resident Evil' para recuperar seu encanto como jogo de tiro sci-fi", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 239373, "titulo": "How permanent daylight saving time could affect schools", "url": "https://phys.org/news/2026-10-permanent-daylight-affect-schools.html", "fonte_id": "phys_org", "data_pub": "2026-11-01T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A mudança para um horário de verão permanente pode afetar o sono, que é fundamental para o bem-estar. Canadáulas decidiram manter o horário de verão todo o ano, o que pode causar deslocamento de sono para milhões de canadenses.", "titulo_pt": "Como o horário de verão permanente poderia afetar as escolas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 239374, "titulo": "Heavy hydrogen in 3I/ATLAS's methane points to a frigid birthplace", "url": "https://phys.org/news/2026-10-heavy-hydrogen-3iatlas-methane-frigid.html", "fonte_id": "phys_org", "data_pub": "2026-11-01T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cometa interestelar 3I/ATLAS apresenta uma pista química sobre as condições em seu sistema planetário de origem, preservada há muito tempo antes de chegar ao nosso sol. A sua assinatura de metano é excepcionalmente rica em hidrogênio pesado, indicando que os ingredientes congelados do cometa se formaram em um ambiente extremamente frio ao redor de outra estrela ou na nuvem que a precedeu.", "titulo_pt": "Hidrogênio pesado no metano do cometa 3I/ATLAS indica um nascimento frio", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 239399, "titulo": "Planetary defense: How military and civil satellites are watching fireballs to help keep Earth safe from space rocks", "url": "https://www.space.com/stargazing/meteor-showers/planetary-defense-how-military-and-civil-satellites-are-watching-fireballs-to-help-keep-earth-safe-from-space-rocks", "fonte_id": "space_com", "data_pub": "2026-11-01T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Satélites estão monitorando meteoros brilhantes que passam pela atmosfera terrestre, fortalecendo o conhecimento de defesa planetária e auxiliando os cientistas a aprenderem mais sobre impactos de detritos espaciais.", "titulo_pt": "Defesa planetária: como satélites militares e civis estão observando meteoros para ajudar a proteger a terra de rochas espaciais", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 239400, "titulo": "On this day in space! Nov. 1, 1962: The Soviet Union Launches Mars 1 spacecraft to Red Planet during the Space Race", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-1-2026", "fonte_id": "space_com", "data_pub": "2026-11-01T14:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 1º de novembro de 1962, a União Soviética lançou o foguete Mars 1 em direção ao planeta Vermelho. Este lançamento fazia parte da corrida espacial e buscava realizar um voo por Marte.", "titulo_pt": "1º de novembro de 1962: união soviética lança foguete Mars 1 em direção ao planeta vermelho durante a corrida espacial", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 239375, "titulo": "2,700-year-old mummy head yields first molecular evidence linking aloe to Egyptian embalming", "url": "https://phys.org/news/2026-10-year-mummy-yields-molecular-evidence.html", "fonte_id": "phys_org", "data_pub": "2026-11-01T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time interdisciplinar da Universidade de Marburg combina análise de produtos naturais modernos com arqueologia egípcia e história da farmacologia para investigar os materiais usados pelos antigos egípcios na preservação dos mortos e como sua composição pode ainda ser estudada após milhares de anos. A cabeça mumificada de 2.700 anos forneceu a primeira evidência molecular ligando aloe à embalsamação egípcia.", "titulo_pt": "Cabeça mumificada de 2.700 anos oferece primeiro evidência molecular de uso de aloe na embalsamação egípcia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 239383, "titulo": "Scientists discover a surprising brain benefit of eating peanuts every day", "url": "https://www.sciencedaily.com/releases/2026/10/261030003001.htm", "fonte_id": "science_daily", "data_pub": "2026-11-01T13:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo surpreendente indica que comer amendoim todos os dias pode auxiliar na saúde cerebral e na memória em adultos mais velhos. Consumir aproximadamente duas porções diárias de amendoim desfiado e assado sem sal durante 16 semanas melhorou a resposta à insulina em regiões cerebrais importantes para a memória.", "titulo_pt": "Cientistas descobrem benefício surpreendente para o cérebro ao comer amendoim diariamente", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 239401, "titulo": "NASA's Swift space telescope is about to crash to Earth. Where will it fall?", "url": "https://www.space.com/space-exploration/missions/nasas-swift-space-telescope-is-about-to-crash-to-earth-where-will-it-fall", "fonte_id": "space_com", "data_pub": "2026-11-01T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A data e o local exatos do desembarque da estação espacial Swift na Terra ainda não foram determinados. No entanto, os pesquisadores estão monitorando a situação de perto.", "titulo_pt": "A estação espacial Swift da nasa está prestes a cair na terra. Onde será que ela cairá?", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 239380, "titulo": "Common pesticide linked to 2.5 times the risk of Parkinson’s disease", "url": "https://www.sciencedaily.com/releases/2026/10/261031013035.htm", "fonte_id": "science_daily", "data_pub": "2026-11-01T12:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da UCLA descobriu que o contato a longo prazo com um pesticida comum está associado a mais de 2,5 vezes o risco de desenvolver doença de Parkinson. Os cientistas também identificaram como o químico danifica as células cerebrais e sugeriram um possível método de proteção contra elas.", "titulo_pt": "Pesticida comum relacionado a 2,5 vezes o risco de doença de Parkinson", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 238835, "titulo": "Missão nuclear a Marte segue programada para 2028, diz Nasa", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/blogs/mensageiro-sideral/2026/11/missao-nuclear-a-marte-segue-programada-para-2028-diz-nasa.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-01T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A NASA informou que a missão SR-1 Freedom, a primeira nave com propulsão nuclear para voo interplanetário com destino a Marte, segue em linha para um lançamento até o final de 2028.", "titulo_pt": "Missão nuclear a Marte segue programada para 2028, diz Nasa", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 238922, "titulo": "Como o cérebro de crianças autistas reconhece rostos? Estudo encontra diferença inesperada", "url": "https://exame.com/ciencia/como-o-cerebro-de-criancas-autistas-reconhece-rostos-estudo-encontra-diferenca-inesperada/", "fonte_id": "exame", "data_pub": "2026-11-01T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Yale identificou sinais neurais relacionados ao reconhecimento de rostos em crianças autistas mais cedo do que se esperava. Este descobrimento abre caminho para a investigação de possíveis biomarcadores do autismo.", "titulo_pt": "Como o cérebro de crianças autistas reconhece rostos? Estudo encontra diferença inesperada", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 239385, "titulo": "Scientists shrink Archimedes’ screw to the size of a single molecule", "url": "https://www.sciencedaily.com/releases/2026/10/261030002940.htm", "fonte_id": "science_daily", "data_pub": "2026-11-01T11:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas desenvolveram um motor molecular revolucionário que gira em qualquer direção usando eletricidade, inspirado em uma máquina inventada há mais de 2.000 anos. A rotação deste motor pode aumentar a condutividade elétrica em até 100 vezes, com potencial para transformar a eletrônica molecular no futuro.", "titulo_pt": "Cientistas miniaturizam o espiral de arquimedes para uma única molécula", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 239384, "titulo": "The Great Barrier Reef's most notorious coral killer may actually be helping it", "url": "https://www.sciencedaily.com/releases/2026/10/261030002957.htm", "fonte_id": "science_daily", "data_pub": "2026-11-01T11:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Crown-of-thorns estrelas-do-mar são conhecidas por devorar os recifes de coral, mas novas pesquisas surpreendentes revelam que esses predadores espinhosos podem, na verdade, auxiliar no bem-estar dos recifes quando suas populações são controladas. Os cientistas descobriram que quase 75% dos eventos de alimentação observados deixaram corais vivos, criando oportunidades para espécies de corais mais lentas de crescimento sobreviverem.", "titulo_pt": "O maior predador dos recifes de coral do grande Barrier Reef pode estar ajudando-os a se recuperar", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 239376, "titulo": "Breaking the ice: Scientists use attracting particles to form an anti-spin ice", "url": "https://phys.org/news/2026-10-ice-scientists-particles-anti.html", "fonte_id": "phys_org", "data_pub": "2026-11-01T11:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas realizaram um estudo publicado na Nature Communications sobre a criação de um anti-spin ice, um sistema que contraria as regras do spin ice convencional.", "titulo_pt": "Quebrando o gelo: cientistas usam partículas atrativas para formar um anti-spin ice", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 239315, "titulo": "Nuit Blanche brings a night of art to Taipei’s Yuanshan", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/02/2003867002", "fonte_id": "taipei_times", "data_pub": "2026-11-02T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Noite Branca trouxe uma noite de arte para o Yuanshan em Taipei. O evento apresentou diversas formas de arte durante a noite.", "titulo_pt": "Noite branca traz uma noite de arte para Yuanshan, Taipei", "veiculo": "Taipei Times", "pais a-sepultada-neste-domingo", "fonte_id": "metropoles", "data_pub": "2026-11-01T16:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Byanca de Araújo Leão, uma jovem de 18 anos, faleceu após levar um tiro na cabeça na madrugada deste sábado. Ela será velada no cemitério Campo da Esperança, em Sobradinho.", "titulo_pt": "Jovem de 18 anos que morreu após levar tiro na cabeça será sepultada neste domingo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 238884, "titulo": "França investiga lançamento de coquetel molotov contra polícia como ‘tentativa de homicídio’", "url": "https://veja.abril.com.br/mundo/franca-investiga-lancamento-de-coquetel-molotov-contra-policia-como-tentativa-de-homicidio/", "fonte_id": "veja", "data_pub": "2026-11-01T15:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Centenas de milhares de pessoas continuam a protestar na França contra o aumento do custo de vida há três semanas seguidas. A França investiga um lançamento de coquetel molotov contra a polícia como tentativa de homicídio.", "titulo_pt": "França investiga lançamento de coquetel molotov contra polícia como 'tentativa de homicídio'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 239295, "titulo": "Gen Z protests turn violent in Germany", "url": "https://www.ft.com/content/4ffb1a86-853b-4151-9902-2ff302e79d24?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-01T11:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos de jovens se tornaram violentos em Berlim e lojas foram saqueadas em Frankfurt, em uma cena semelhante às revoltas de outubro passado na França.", "titulo_pt": "Protestos de geração Z se tornam violentos em berlim e frankfurt", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 239030, "titulo": "França reúne 320 mil em atos; mobilização \"gen Z\" decepciona na Alemanha, mas violência toma ruas pela madrugada", "url": "https://www.dw.com/pt-br/frança-reúne-320-mil-em-atos-mobilização-gen-z-decepciona-na-alemanha-mas-violência-toma-ruas-pela-madrugada/a-79819033?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-01T10:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jovens europeus protestam contra altos preços e falta de perspectivas, com mais de 320 mil pessoas participando de atos na França. Em Frankfurt, houve violência com vitrines quebradas e lojas saqueadas, resultando em 400 pessoas presas.", "titulo_pt": "França reúne 320 mil em atos; violência toma as ruas na Alemanha", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 238357, "titulo": "Apenas 30% dos hipertensos seguem o tratamento, dizem médicos ao Dr. Kalil", "url": "https://www.cnnbrasil.com.br/saude/apenas-30-dos-hipertensos-seguem-o-tratamento-dizem-medicos-ao-dr-kalil/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-01T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cristine Cukiert, neurologista, e Ronaldo Rosa, cardiologista e diretor da Santa Casa de Misericórdia de São Paulo, afirmam que apenas 30% dos hipertensos seguem o tratamento. Eles alertam que interromper medicamentos ao melhorar os exames aumenta o risco de infarto e AVC.", "titulo_pt": "Apenas 30% dos hipertensos seguem o tratamento, alertam médicos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 238475, "titulo": "Jóvenes, desempleados y desesperanzados en Linares", "url": "https://www.latercera.com/esto-es-chile/maule/noticia/jovenes-desempleados-y-desesperanzados-en-linares/", "fonte_id": "la_tercera", "data_pub": "2026-11-01T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A província de Linares, com uma taxa de desemprego de 11,8%, produz profissionais que seu mercado de trabalho não consegue absorver. Isso faz com que os jovens que buscam emprego fora do setor agrícola, afetado pelo setor industrial do Maule, enfrentem um desafio quase impossível. Um alto percentual de 92% dos moradores do Maule acredita que um grau universitário não garante emprego.", "titulo_pt": "Jovens, desempregados e desiludidos em Linares", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 238531, "titulo": "English children’s homes are in crisis. Does Denmark hold the answers?", "url": "https://www.theguardian.com/society/2026/nov/01/english-childrens-homes-crisis-denmark-care-system-model", "fonte_id": "guardian_world", "data_pub": "2026-11-01T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro britânico dos Assuntos Infantis, Josh MacAlister, visitou Copenhague para estudar o sistema de casas para crianças da Dinamarca. As casas para crianças dinamarquesas são frequentemente consideradas o padrão mundial em cuidados residenciais para crianças e estão sendo analisadas pelo governo britânico.", "titulo_pt": "Casas para crianças no reino unido estão em crise. A dinamarca pode ter respostas?", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 238334, "titulo": "Governo age para conter casos de assédio e violência após Eleições 2026", "url": "https://www.metropoles.com/brasil/governo-age-para-conter-casos-de-assedio-e-violencia-apos-eleicoes-2026", "fonte_id": "metropoles", "data_pub": "2026-11-01T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Relatos de assédio e intimidação a funcionários foram divulgados nas redes sociais após as eleições. O governo está investigando esses casos e também outros de violência.", "titulo_pt": "Governo age para combater assédio e violência após Eleições 2026", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 238371, "titulo": "Novembro Azul: câncer de próstata é o segundo tipo mais comum em homens", "url": "https://www.cnnbrasil.com.br/saude/novembro-azul-cancer-de-prostata-e-o-segundo-tipo-mais-comum-em-homens/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-01T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O câncer de próstata é estimado em mais de 77 mil novos casos por ano até 2028, segundo o Inca. O diagnóstico precoce aumenta as chances de cura.", "titulo_pt": "Novembro Azul: câncer de próstata é o segundo tipo mais comum em homens", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 239034, "titulo": "California inaugurará en diciembre el puente para animales más grande del mundo: cruza una autopista de diez carriles", "url": "https://www.clarin.com/estados-unidos/california-inaugurara-diciembre-puente-animales-grande-mundo-cruza-autopista-carriles_0_RiD8cjrUw4.html", "fonte_id": "clarin", "data_pub": "2026-11-01T17:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em dezembro, o estado da Califórnia inaugurará o maior puente para animais do mundo, que cruza uma autopista de dez pistas perto das Montanhas de Santa Mônica. A estrutura é coberta com terra e vegetação típica da região.", "titulo_pt": "Califórnia inaugurará em dezembro o puente para animais mais grande do mundo: cruza uma autopista de dez pistas", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 239035, "titulo": "En Florida, un adolescente de 14 años construyó jardines submarinos verticales de ostras para limpiar 950.000 litros de agua por día", "url": "https://www.clarin.com/estados-unidos/florida-adolescente-14-anos-construyo-jardines-submarinos-verticales-ostras-limpiar-950000-litros-agua-dia_0_bHdiJZRSGB.html", "fonte_id": "clarin", "data_pub": "2026-11-01T17:19:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Isaac Nelson, um adolescente de 14 anos, construiu jardins submarinos verticais de ostras na Flórida para limpar água. O projeto resulta na purificação de 950.000 litros de água por dia. Ele é protagonista de um documentário sobre mudanças no water e foi finalista do Premio Sylvia Earle de Conservação Oceânica 2026.", "titulo_pt": "Em flórida, adolescente de 14 anos construiu jardins submarinos verticais de ostras para limpar água", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 239234, "titulo": "Biodiversity COP17: Leading negotiator Steven Guilbeault believes harmful subsidies will be 'main battleground in the coming years'", "url": "https://www.lemonde.fr/en/environment/article/2026/11/01/biodiversity-cop17-leading-negotiator-steven-guilbeault-believes-harmful-subsidies-will-be-main-battleground-in-the-coming-years_6768841_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-01T15:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O negociador-chefe anterior do Canadá para biodiversidade, Steven Guilbeault, expressou uma avaliação positiva sobre a conferência sobre biodiversidade que terminou em 31 de outubro na Armênia. Ele acredita que as subsídios prejudiciais serão o principal campo de batalha nos anos vindouros.", "titulo_pt": "COP17 de biodiversidade: Steven Guilbeault acredita que os subsídios prejudiciais serão o principal campo de batalha nos anos vindouros", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 238964, "titulo": "Vídeo: barcaça com mil toneladas de minério afunda em rio no Pantanal de MS", "url": "https://www.cnnbrasil.com.br/nacional/centro-oeste/ms/video-barcaca-com-mil-toneladas-de-minerio-afunda-em-rio-no-pantanal-de-ms/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-01T15:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Marinha está investigando o acidente que ocorreu no sábado (31) no rio Paraguai, onde uma barcaça com mil toneladas de minério afundou. O Ibama relatou um vazamento do material na água e está apurando as possíveis consequências ambientais.", "titulo_pt": "Vídeo: barcaça com mil toneladas de minério afunda em rio no Pantanal de MS", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 239157, "titulo": "Northern Territory water plan condemned as ‘blatant and shameless’ attack on nature", "url": "https://www.theguardian.com/australia-news/2026/nov/02/northern-territory-water-plan-condemned-as-blatant-and-shameless-attack-on-nature", "fonte_id": "guardian_world", "data_pub": "2026-11-01T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Território do Norte está planejando eliminar uma exigência legal que determina a reserva de água para a natureza, o que é visto por grupos ambientais como uma 'ataque escancarado e sem vergonha' ao meio ambiente. Isso seria a última medida de uma série de ataques ambientais por parte do governo do Partido Liberal do País.", "titulo_pt": "Plano de água do território do norte é acusado de 'ataque escancarado e sem vergonha' ao meio ambiente", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 238354, "titulo": "Desastres climáticos podem cair no Enem e vestibulares? Veja dicas", "url": "https://www.cnnbrasil.com.br/educacao/desastres-climaticos-podem-cair-no-enem-e-vestibulares-veja-dicas/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-01T09:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Questões relacionadas a desastres climáticos podem ser abordadas em diversos assuntos do Enem e vestibulares devido à sua relevância atual. O tema ambiental tem sido frequentemente incorporado em provas devido às suas implicações para grandes populações.", "titulo_pt": "Desastres climáticos podem surgir no Enem e vestibulares? Confira dicas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 238717, "titulo": "Hate paper straws? Asia’s new alternatives are another eco trap", "url": "https://www.scmp.com/week-asia/health-environment/article/3372751/hate-paper-straws-asias-new-alternatives-are-another-eco-trap", "fonte_id": "scmp", "data_pub": "2026-11-01T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Para a flight attendant Chloe Tan Zi Ling, de 35 anos, os palitos de papel são impráticos porque se desidratam antes de terminar a bebida. Ela prefere alternativas metálicas reutilizáveis, mas acha que deixam um sabor desagradável. Essa frustração reflete um debate mais amplo sobre a transição asiática para palitos de papel e alternativas, com um estudo sul-coreano recente indicando que os palitos de plástico convencionais se saem melhor que os de papel e outras opções.", "titulo_pt": "Detestando palitos de papel? Alternativas asiáticas podem ser outro engodo ecológico", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 238480, "titulo": "Presidente de Bolivia decreta emergencia nacional por el fenómeno climático de El Niño", "url": "https://www.latercera.com/mundo/noticia/presidente-de-bolivia-decreta-emergencia-nacional-por-el-fenomeno-climatico-de-el-nino/", "fonte_id": "la_tercera", "data_pub": "2026-11-01T02:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente da Bolívia decretou emergência nacional em face do fenômeno climático El Niño, que está afetando o território do país. O mandatário afirmou que mobilizará recursos financeiros e humanos para lidar com as consequências desse evento climatológico.", "titulo_pt": "Presidente da bolívia declara emergência nacional por fenômeno climático El Niño", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 237824, "titulo": "Amendments to combat illegal land use pass legislature", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/01/2003866960", "fonte_id": "taipei_times", "data_pub": "2026-11-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A legislatura aprovou emendas para combater o uso ilegal de terrenos.", "titulo_pt": "Emendas para combater uso ilegal de terrenos são aprovadas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 239077, "titulo": "Comité de Prevención de la Tortura adviert function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

}

function filtrarSecao(topico) {

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}
