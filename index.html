do iraque", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 74536, "titulo": "China memory chipmaker CXMT skyrockets 470% in blockbuster Shanghai debut", "url": "https://www.cnbc.com/2026/07/27/cxmt-china-market-debut-chipmaker-ipo.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-27T02:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de chips de memória baseada em Hefei arrecadou 57,92 bilhões de yuanes (equivalente a cerca de 8,6 bilhões de dólares) durante sua oferta inicial de ações na bolsa de Shanghai. O IPO foi um sucesso, com o valor da empresa disparando 470% em sua estreia no mercado.", "titulo_pt": "CXMT, fabricante de chips de memória chinesa, explode 470% em debutista impressionante na bolsa de Shanghai", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 74589, "titulo": "Seven & i Shares drop after ending deal talks with Poland’s Zabka", "url": "https://www.japantimes.co.jp/business/2026/07/27/companies/seven-i-share-zabka-deal-failure/", "fonte_id": "japan_times", "data_pub": "2026-07-27T02:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Seven & i caíram após encerrar negociações de compra com Zabka, uma rede de lojas conveniência na Polônia. A empresa ainda vê Europa como uma oportunidade de crescimento e continuará avaliando opções no continente.", "titulo_pt": "Ações da seven & i caem após encerrar negociações com Zabka", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 74537, "titulo": "China industrial profit growth slows again in June as retreating oil prices sap earnings lift", "url": "https://www.cnbc.com/2026/07/27/china-industrial-profit-growth-exports-oil-drops.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-27T02:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O crescimento dos lucros industriais chineses diminuiu novamente em junho, devido a uma redução nos preços do petróleo que atenuaram o aumento das receitas. Os lucros corporativos têm experimentado um dos maiores reveses na economia este ano, passando de crescimento ligeiramente positivo em 2025 para ganhos em duas dígitos.", "titulo_pt": "Crescimento dos lucros industriais chineses diminui novamente em junho, devido a baixas do petróleo", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 74225, "titulo": "Alta dos aluguéis faz brilhar paixão nacional por tijolo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/marcos-de-vasconcellos/2026/07/alta-dos-alugueis-faz-brilhar-paixao-nacional-por-tijolo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-27T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os altos valores dos alugueis têm levado a uma crescente preferência pela locação entre jovens, refletindo o desafio de adquirir imóveis próprios. A geração Z se queixa frequentemente sobre a dificuldade de alcançar o sonho da casa própria em tempos de preços elevados e juros altos.", "titulo_pt": "Alta dos aluguéis faz brilhar paixão nacional por tijolo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 74227, "titulo": "Cortes no orçamento do BC ameaçam segurança e inovação do Pix", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/cortes-no-orcamento-do-bc-ameacam-seguranca-e-inovacao-do-pix.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-27T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os cortes no orçamento do Banco Central têm adiado projetos de atualização tecnológica e inovações do Pix, sistema que processa cerca de R$ 3 trilhões em transações por mês.", "titulo_pt": "Cortes no orçamento do BC ameaçam segurança e inovação do Pix", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 74570, "titulo": "Oil prices fall as Iran and US pause strikes over Strait of Hormuz tensions", "url": "https://www.ft.com/content/403625cc-8371-43ee-997a-f6908a97f52e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-27T01:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços do petróleo caíram após duas semanas de violência escalando, levando o preço do Brent a mais de US$100 por barril. A pausa nas tensões entre Irã e Estados Unidos no Estreito de Ormuz contribuiu para essa queda.", "titulo_pt": "Preços do petróleo caem com pausa na tensão entre Irã e EUA no estreito de Ormuz", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 74481, "titulo": "Cadem proyecta fuerte deterioro de las expectativas económicas y sitúa a Quiroz entre los ministros peor evaluados", "url": "https://www.latercera.com/nacional/noticia/cadem-proyecta-fuerte-deterioro-de-las-expectativas-economicas-y-situa-a-quiroz-entre-los-ministros-peor-evaluados/", "fonte_id": "la_tercera", "data_pub": "2026-07-27T01:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A pesquisa mostra que a proporção de pessoas que acredita que a economia do país irá piorar no segundo semestre de 2026 aumentou para 43%, um aumento de sete pontos percentuais desde o último levantamento. O pessimismo sobre o futuro atingiu seu nível mais alto desde 2015.", "titulo_pt": "Cadem projeta forte deterioro das expectativas econômicas e situa Quiroz entre os ministros menos bem avaliados", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 74594, "titulo": "Fed faces growing pressure to hike rates as price risks rebound", "url": "https://www.japantimes.co.jp/business/2026/07/27/economy/fed-pressure-rates-price-risks/", "fonte_id": "japan_times", "data_pub": "2026-07-27T01:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tensão crescente no Oriente Médio levou os preços do petróleo a subirem novamente, enquanto o aumento inesperado dos preços ao consumidor de junho diminuiu o foco nessa questão.", "titulo_pt": "Fed enfrenta crescente pressão para aumentar as taxas de juros diante da recuperação dos riscos inflacionários", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 74393, "titulo": "Más que la peor crisis con el principal socio comercial", "url": "https://www.lanacion.com.ar/politica/mas-que-la-peor-crisis-con-el-principal-socio-comercial-nid27072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-27T01:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Milei repetiu a demonstração de que sua lista de autolesões, tanto pessoais quanto ao país, não tem fim e pode ser superada em intensidade e alcance.", "titulo_pt": "Mais do que a pior crise com o principal parceiro comercial", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 74573, "titulo": "Asian private credit fundraising sinks to 12-year low amid bankruptcy fears", "url": "https://www.ft.com/content/b52ce5ba-6493-4c0c-9395-c227b9937a71?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-27T01:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No primeiro semestre, apenas cinco fundos asiáticos foram encerrados, o que representa um nível mínimo desde há 12 anos. Os investidores preferem agora gerentes americanos maiores.", "titulo_pt": "Arrecadação de capital privado asiático atinge nível mais baixo em 12 anos devido a medo de falências", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 74540, "titulo": "CNBC Daily Open: Markets finally get a calm weekend; Nvidia and SK Hynix announce massive memory deal", "url": "https://www.cnbc.com/2026/07/27/cnbc-daily-open-markets-calm-weekend-nvidia-sk-hynix-deal.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-27T01:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os mercados experimentaram um fim de semana relativamente calmo, com uma pausa no conflito no Oriente Médio ao invés de sua escalada.", "titulo_pt": "CNBC diário aberto: mercados finalmente têm um fim de semana tranquilo; Nvidia e SK Hynix anunciam grande acordo de memória", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 74228, "titulo": "Petróleo abre a semana em queda com pausa nos ataques entre EUA e Irã", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/petroleo-abre-a-semana-em-queda-com-pausa-nos-ataques-entre-eua-e-ira.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-27T00:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O preço do petróleo abriu a semana em queda devido à pausa nos ataques entre Estados Unidos e Irã. O barril Brent caía mais de 5%, cotado a US$ 91,38, enquanto o barril WTI recuava 5,46% para US$ 84,43.", "titulo_pt": "Petróleo inicia semana em baixa com fim dos ataques entre EUA e Irã", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 74539, "titulo": "Singapore tightens monetary policy as rising oil prices rekindle inflation risk", "url": "https://www.cnbc.com/2026/07/27/singapore-mas-july-monetary-policy-middle-east-oil-prices-inflation-.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-27T00:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Monetary Authority of Singapore (MAS) está endurecendo sua política monetária, devido ao risco inflacionário aumentado causado pelo aumento dos preços do petróleo. Diferentemente da maioria das autoridades monetárias, a MAS controla a estabilidade de preços a longo prazo gerenciando o valor da moeda sênior em relação uma cesta ponderada de divisas.", "titulo_pt": "Singapura endurece política monetária diante do risco inflacionário elevado", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 74670, "titulo": "Seoul shares open higher on eased Mideast tensions, mega chip deals", "url": "https://www.koreaherald.com/article/10820981", "fonte_id": "korea_herald", "data_pub": "2026-07-27T00:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações sul-coreanas abriram com alta nesta segunda-feira, impulsionadas pela redução das tensões militares no Oriente Médio após os Estados Unidos adiarem ataques à Irã. O índice Kospi subiu 0,68%, para 6.736,09 pontos.", "titulo_pt": "Seul abre em alta com alívio nas tensões do oriente médio e grandes acordos de chips", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 74339, "titulo": "Ministério da Saúde lança campanha sobre riscos de bets com retomada do Brasileirão", "url": "https://www.infomoney.com.br/brasil/ministerio-da-saude-lanca-campanha-sobre-riscos-de-bets-com-retomada-do-brasileirao/", "fonte_id": "infomoney", "data_pub": "2026-07-27T00:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Saúde lançou uma campanha sobre os riscos de apostas com a retomada do Brasileirão. A campanha utiliza mídias como TV, rádio e redes sociais. A OMS estima que 1,2% da população adulta mundial sofra com transtorno de jogo.", "titulo_pt": "Ministério da Saúde lança campanha sobre riscos de apostas com retomada do Brasileirão", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 74010, "titulo": "Qualcomm plans to increase prices by double digits", "url": "https://www.taipeitimes.com/News/biz/archives/2026/07/27/2003861423", "fonte_id": "taipei_times", "data_pub": "2026-07-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Qualcomm planeja aumentar os preços de seus produtos em duas dígitos.", "titulo_pt": "Qualcomm planeja aumentar preços em duas dígitos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 74607, "titulo": "Black Lake CEO’s strategy to sell AI solutions to factories: turn to food couriers", "url": "https://www.scmp.com/news/hong-kong/article/3361910/black-lake-ceos-strategy-sell-ai-solutions-factories-turn-food-couriers?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-27T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Zhou Yuxiang, fundador e CEO da Black Lake Technologies sediada em Shanghai, adotou uma estratégia inusitada para vender soluções de inteligência artificial (IA) para fábricas familiares chinesas: contratou entregadores de comida. O time de vendas passou por um intenso treinamento de cinco dias para explicar como a IA pode resolver problemas específicos da manufatura.", "titulo_pt": "CEO da black Lake technologies recruta entregadores de comida para vender soluções de IA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 74571, "titulo": "Chinese chipmaker CXMT soars almost 500% in market debut", "url": "https://www.ft.com/content/8e82e939-908b-42bf-a314-0bb02a3f1b07", "fonte_id": "financial_times", "data_pub": "2026-07-27T01:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa chinesa de chips CXMT teve seu IPO que foi o maior na bolsa da China desde 2010, refletindo a crescente demanda por chips de memória para inteligência artificial.", "titulo_pt": "Fabricante chinês de chips CXMT explode em sua estreia no mercado quase 500%", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 74609, "titulo": "CXMT shares rise 472% as DRAM maker becomes largest China-listed firm by total market cap", "url": "https://www.scmp.com/tech/big-tech/article/3361926/chinas-cxmt-shares-rise-472-star-market-debut-valuing-dram-maker-us489-billion?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-27T01:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da ChangXin Memory Technologies (CXMT), principal fabricante chines de chips DRAM, subiram 472% em sua estreia na bolsa de Shanghai. A empresa agora é a mais valiosa entre as listadas no mercado continental chinês, avaliada em 3,31 trilhões de yuan (US$489 bilhões).", "titulo_pt": "Ações da CXMT sobem 472% e se tornam a maior empresa listada na bolsa chinesa por capitalization total", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 74637, "titulo": "India's HCLTech plans US$4.4B AI data center", "url": "https://www.digitimes.com/news/a20260727PR201/india-data-center-expansion-infrastructure-partnership.html", "fonte_id": "digitimes", "data_pub": "2026-07-27T01:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A HCLTech planeja estabelecer seu primeiro centro de dados de inteligência artificial no Parque Sovereign AI de Odisha, em parceria com a startup Sarvam e o governo de Odisha. O projeto tem um valor estimado de 4,4 bilhões de dólares e representa uma etapa adicional na expansão da empresa para o mercado completo de inteligência artificial.", "titulo_pt": "HCLTech planeja centro de dados de IA por US$4,4 bi no odisha", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 74638, "titulo": "DeepSeek reportedly pauses second funding round amid market and geopolitical scrutiny", "url": "https://www.digitimes.com/news/a20260727VL202/deepseek-ai-fundraising-startup.html", "fonte_id": "digitimes", "data_pub": "2026-07-27T01:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa chinesa de inteligência artificial DeepSeek informou verbalmente a investidores potenciais que está pausando sua segunda rodada de financiamento, segundo fontes citadas pelo Bloomberg. O anúncio inesperado ocorreu poucos dias após transcrições vazadas atribuídas ao fundador Liang Wenfeng levantarem discussões online sobre a dependência da China em hardware dos EUA e seu atraso tecnológico em relação às concorrentes americanas.", "titulo_pt": "Deepseek pausaria segunda rodada de financiamento diante da vigilância do mercado e geopolítica", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 74639, "titulo": "IDMs target AI margins, boosting Taiwan power suppliers", "url": "https://www.digitimes.com/news/a20260727PD210/texas-instruments-stmicroelectronics-demand-market-power-semiconductors.html", "fonte_id": "digitimes", "data_pub": "2026-07-27T01:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Internacionais como Texas Instruments e STMicroelectronics estão se voltando para a demanda de AI nos data centers, enquanto o mercado está movendo-se para arquiteturas de potência de 400V e 800V, criando um horizonte mais longo para semicondutores de potência. Essa mudança pode beneficiar fornecedores taiwaneses em produtos de faixa intermediária, com ganhos de preço estendendo-se até o segundo semestre de 2025 e, em alguns casos, até 2027.", "titulo_pt": "Fabricantes internacionais apostam em AI e impulsionam fornecedores taiwaneses de potência", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 74640, "titulo": "AMD widens robotics push with Taiwan IPC partners as it targets Nvidia lead", "url": "https://www.digitimes.com/news/a20260727PD211/amd-robotics-taiwan-nvidia-ipc.html", "fonte_id": "digitimes", "data_pub": "2026-07-27T01:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A AMD está aprofundando suas ambições em robótica e inteligência artificial física, expandindo sua rede de parceiros no edge AI e robótica. A empresa visa desafiar a Nvidia, enquanto desenvolvedores e fabricantes globais buscam caminhos mais baratos e rápidos para sistemas autônomos.", "titulo_pt": "AMD amplia esforços em robótica com parceiros taiwaneses de pc industrial, visando desafiar a liderança da Nvidia", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 74634, "titulo": "Are brain waves the next unlock for physical AI?", "url": "https://techcrunch.com/2026/07/26/are-brain-waves-the-next-unlock-for-physical-ai/", "fonte_id": "techcrunch", "data_pub": "2026-07-27T00:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fronteiras de modelos físicos de inteligência artificial requerem múltiplas câmeras, anotações densas e, em breve, leituras de ondas cerebrais para seu desenvolvimento.", "titulo_pt": "Cerebros como próxima forma de desbloqueio para IA física?", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 73996, "titulo": "Robots to help with labor shortage", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/07/27/2003861449", "fonte_id": "taipei_times", "data_pub": "2026-07-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Robôs serão utilizados para auxiliar na falta de mão-de-obra.", "titulo_pt": "Robots para ajudar com a escassez de mão-de-obra", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 74000, "titulo": "New standards from Ministry of Interior slated to boost rooftop solar development", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/07/27/2003861453", "fonte_id": "taipei_times", "data_pub": "2026-07-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas diretrizes do Ministério do Interior devem promover o desenvolvimento de energia solar nas telhas de edifícios.", "titulo_pt": "Novos padrões do ministério do Interior previstos para impulsionar a expansão da energia solar no telhado", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 74641, "titulo": "TIER says Taiwan exports and investment can help absorb geopolitical shocks", "url": "https://www.digitimes.com/news/a20260727PD201/taiwan-investment-exports-gdp-2026.html", "fonte_id": "digitimes", "data_pub": "2026-07-26T23:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Taiwan Institute of Economic Research (TIER) afirma que as exportações e investimentos da ilha mantêm um ritmo forte, o suficiente para mitigar parcialmente os impactos das tensões geopolíticas. A instituição destaca a volatilidade crescente nos preços de energia e commodities, bem como a pressão adicional sobre cadeias globais de suprimentos, mercados financeiros e inflação.", "titulo_pt": "TIER diz que exportações e investimentos podem ajudar a absorver choques geopolíticos", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 74642, "titulo": "TIER lifts Taiwan 2026 growth forecast and flags AI bubble risks", "url": "https://www.digitimes.com/news/a20260727PD202/taiwan-2026-forecast-growth-investment.html", "fonte_id": "digitimes", "data_pub": "2026-07-26T23:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Taiwan Institute of Economic Research elevou sua previsão de crescimento do PIB deTaiwan para 2026 para 10,38%. A instituição também alertou sobre os riscos associados à bolha de investimentos em inteligência artificial para a economia global e mercados financeiros.", "titulo_pt": "TIER aumenta previsão de crescimento do pib de Taiwan para 2026 e avisa sobre riscos da bolha de IA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 74643, "titulo": "SK Telecom forms SK Hyper to build 15GW of AI data centers by 2035", "url": "https://www.digitimes.com/news/a20260727PD203/sk-telecom-data-center-2035-subsidiary-infrastructure.html", "fonte_id": "digitimes", "data_pub": "2026-07-26T23:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SK Telecom criou uma subsidiária dedicada, a SK Hyper, com o objetivo de desenvolver negócios relacionados a centrais de dados de inteligência artificial e expandir a infraestrutura de AI na Coreia do Sul. Esta iniciativa apoia a estratégia governamental 'Três Grandes Poderes da Inteligência Artificial' e fornece ao provedor uma nova plataforma para construir e operar capacidade de centrais de dados de grande escala de IA.", "titulo_pt": "SK Telecom forma SK Hyper para desenvolver 15GW de centrais de dados de AI até 2035", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 74646, "titulo": "Aluminum gains ground as high copper prices push substitution across industries", "url": "https://www.digitimes.com/news/a20260727PD206/copper-aluminum-2026.html", "fonte_id": "digitimes", "data_pub": "2026-07-26T23:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A substituição de alumínio por cobre ganhou força em 2026 devido a altos custos de matérias-primas e pressão para cortar custos nas indústrias automotiva, de energia e de eletrodomésticos. O movimento foi impulsionado pela tensão geopolítica e pelo entendimento de que os preços do cobre não teriam uma queda abrupta.", "titulo_pt": "Substituição de alumínio por cobre cresce em 2026 com alta dos custos de matérias-primas", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 74647, "titulo": "Nokia says AI spending is driving optical networking demand", "url": "https://www.digitimes.com/news/a20260727PD208/data-center-demand-nokia-ip-performance.html", "fonte_id": "digitimes", "data_pub": "2026-07-26T23:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O gasto com IA nos data centers está impulsionando a demanda por redes de alta velocidade, e a Nokia afirmou que suas redes ópticas e IP estão se tornando motores importantes para o crescimento. A empresa associou esse movimento à crescente procura por produtos de interconexão de data center e de interconexão óptica com a expansão de grandes clusters de IA.", "titulo_pt": "Nokia diz que gastos com AI estão impulsionando a demanda por redes ópticas", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 74648, "titulo": "Samsung bolsters energy team as chip projects test power supply", "url": "https://www.digitimes.com/news/a20260724VL218/samsung-power-supply-government-transmission-infrastructure.html", "fonte_id": "digitimes", "data_pub": "2026-07-26T23:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samsung está recrutando ex-funcionários do governo com experiência em energia para seu think tank interno, devido à crescente importância da infraestrutura elétrica para sua expansão nos semicondutores em Yongin e no supostamente planejado clúster Honam de semicondutores.", "titulo_pt": "Samsung fortalece time de energia com ex-funcionários do governo", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 74608, "titulo": "From fungus to fashion: Chinese scientists develop sustainable ‘living textiles’", "url": "https://www.scmp.com/news/china/science/article/3361873/fungus-fashion-chinese-scientists-develop-sustainable-living-textiles?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-27T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas chineses desenvolveram uma técnica para criar roupas e textiles a partir de um fungo que pode se auto-limpar e se regenerar. O tecido também pode ser personalizado, como adicionar cores ou proteger do raio UV, com a ajuda de outros microorganismos.", "titulo_pt": "De fungo à moda: cientistas chineses desenvolvem tecidos sustentáveis vivos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 74685, "titulo": "Tigray's old grapevines have survived against the odds: New research uncovers their genetic and historic value", "url": "https://phys.org/news/2026-07-tigray-grapevines-survived-odds-uncovers.html", "fonte_id": "phys_org", "data_pub": "2026-07-27T00:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A região de Tigray, no norte da Etiópia, abriga vinhedos antigos que sobreviveram contra todas as odds. Estudos recentes descobriram o valor genético e histórico dessas videiras.", "titulo_pt": "Videiras antigas do tigray têm valor genético e histórico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 74686, "titulo": "Near a black hole, gravity changes a quantum circuit's readings, not its rules", "url": "https://phys.org/news/2026-07-black-hole-gravity-quantum-circuit.html", "fonte_id": "phys_org", "data_pub": "2026-07-26T23:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma circuito quântico, como um juntador de Josephson, pode converter uma voltagem em uma oscilação quântica com grande precisão. A gravidade intensa perto de um buraco negro alteraria apenas as leis do circuito ou afetaria como um observador distante leria o dispositivo?", "titulo_pt": "Perto de um buraco negro, a gravidade altera os leiters do circuito quântico, não suas regras", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 74687, "titulo": "Forest productivity, not rapid warming, shapes Northern Eurasia's carbon sink", "url": "https://phys.org/news/2026-07-forest-productivity-rapid-northern-eurasia.html", "fonte_id": "phys_org", "data_pub": "2026-07-26T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A produtividade florestal, e não o aquecimento rápido, determina o sink de carbono da Ártica Oriental. Esta região abriga cerca de 20% das florestas do mundo e desempenha um papel crucial na mitigação do aquecimento global ao absorver dióxido de carbono.", "titulo_pt": "Produtividade florestal, não aquecimento rápido, forma o sink de carbono da ártica oriental", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 74199, "titulo": "Twisted laser light distinguishes mirror-image molecules by their fragment counts", "url": "https://phys.org/news/2026-07-laser-distinguishes-mirror-image-molecules.html", "fonte_id": "phys_org", "data_pub": "2026-07-26T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Moléculas podem existir em duas formas que são espelhadas, mas não idênticas, como as mãos esquerda e direita. Distinguir essas moléculas enantiômeras (também chamadas de moléculas círicas) é um desafio antigo na ciência e tecnologia.", "titulo_pt": "Luz laser torcida distingue moléculas espelhadas pelo número de fragmentos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 74016, "titulo": "When a teenager makes the 'stupid choice,' their brain is working exactly as designed", "url": "https://phys.org/news/2026-07-teenager-stupid-choice-brain.html", "fonte_id": "phys_org", "data_pub": "2026-07-26T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quando um adolescente reage a uma ofensa, correndo o risco de ser punido, isso é frequentemente atribuído à incompletude do desenvolvimento cerebral. No entanto, quando um adulto se posiciona contra uma injustiça, chamamos isso de princípios. Acreditamos que os adolescentes não conseguem avaliar as consequências da mesma forma que os adultos.", "titulo_pt": "Quando um adolescente faz a 'opcão estúpida', seu cérebro está funcionando exatamente como foi projetado", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 74017, "titulo": "Gamma-ray pulsations reveal extreme 3.2-millisecond pulsar 3,900 light-years away", "url": "https://phys.org/news/2026-07-gamma-ray-pulsations-reveal-extreme.html", "fonte_id": "phys_org", "data_pub": "2026-07-26T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos chineses analisaram dados da telescopeira gamma-ray Fermi da NASA e descobriram que o pulsar de milissegundo conhecido como PSR J0435+3233 emite pulsos de gama. A descoberta foi publicada em um artigo no servidor pré-impresso arXiv em 17 de julho.", "titulo_pt": "Pulsos de gama revelam pulsar extremo de 3,2 milissegundos a 3,900 luzes anos de distância", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 74100, "titulo": "Fue confirmado por la ciencia: el azúcar es clave para fijar recuerdos en nuestra memoria", "url": "https://www.clarin.com/estados-unidos/confirmado-ciencia-azucar-clave-fijar-recuerdos-memoria_0_9Gb8xBharO.html", "fonte_id": "clarin", "data_pub": "2026-07-26T17:41:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo do CNRS francês demonstrou que a glucosa desempenha um papel crucial na fixação de memórias a longo prazo. O cérebro ativa circuitos relacionados à fome após o aprendizado para 'guardar' informações importantes.", "titulo_pt": "Ciência confirma: açúcar é fundamental para fixar memórias", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 73744, "titulo": "Aurelio Rojas, cardiólogo: \"Como médico estoy sorprendido. La ciencia acaba de confirmar si el café es bueno o malo para la salud y los resultados son más que sorprendentes\"", "url": "https://www.clarin.com/internacional/aurelio-rojas-cardiologo-medico-sorprendido-ciencia-acaba-confirmar-cafe-bueno-malo-salud-mayor-consenso-cientifico-resultados-sorprendentes_0_22elmNIg0s.html", "fonte_id": "clarin", "data_pub": "2026-07-26T17:07:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo da American Heart Association confirmou os efeitos do café na saúde, gerando surpresa no divulgador. O relatório discute a quantidade segura de consumo, benefícios possíveis e como o método de preparo influencia os resultados.", "titulo_pt": "Aurelio Rojas, cardiólogo: 'estou surpreso com as novas conclusões científicas sobre o café e sua relação com a saúde'", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 74018, "titulo": "Trace molecules emerge as chemical 'keystones' that steer life's communities", "url": "https://phys.org/news/2026-07-molecules-emerge-chemical-keystones-life.html", "fonte_id": "phys_org", "data_pub": "2026-07-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa de Dr. Erika C. Freeman, publicada na Trends in Ecology & Evolution, sugere que uma pequena quantidade de moléculas raras pode moldar comunidades biológicas inteiras, desempenhando um papel crucial apesar da escassez. Essas moléculas são chamadas por ecologistas de 'moléculas keystone'.", "titulo_pt": "Moléculas trace emergem como 'chaves' químicas que direcionam as comunidades vivas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 74019, "titulo": "A quantum heat engine that simultaneously provides work and refrigeration", "url": "https://phys.org/news/2026-07-quantum-simultaneously-refrigeration.html", "fonte_id": "phys_org", "data_pub": "2026-07-26T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um motor quântico de calor opera simultaneamente como um motor que produz trabalho e como um refrigerador. As leis da termodinâmica estabelecem que o calor naturalmente flui de sistemas mais quentes para sistemas mais frios até atingir um estado de equilíbrio térmico.", "titulo_pt": "Um motor quântico de calor que fornece trabalho e refrigeração ao mesmo tempo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 74310, "titulo": "Lagartixa de estimação pode revelar como o câncer surge e se espalha", "url": "https://exame.com/ciencia/lagartixa-de-estimacao-pode-revelar-como-o-cancer-surge-e-se-espalha/", "fonte_id": "exame", "data_pub": "2026-07-26T16:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo identificou alterações genéticas semelhantes às de tumores humanos em uma variedade de lagartixas-leopardo. Essa pesquisa pode ajudar a entender como o câncer surge e se espalha no organismo.", "titulo_pt": "Lagartixa de estimação pode revelar como o câncer surge e se espalha", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 73720, "titulo": "Astronautas dos EUA e Rússia retornam da Estação Espacial Internacional após oito meses no espaço", "url": "https://olhardigital.com.br/2026/07/26/ciencia-e-espaco/astronautas-dos-eua-e-russia-retornam-da-estacao-espacial-internacional-apos-oito-meses-no-espaco/", "fonte_id": "olhar_digital", "data_pub": "2026-07-26T15:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Três astronautas, entre eles americanos e russos, retornaram à Terra com segurança após passarem oito meses na Estação Espacial Internacional a bordo da nave Soyuz MS-28.", "titulo_pt": "Astronautas dos EUA e Rússia retornam da Estação Espacial Internacional após oito meses no espaço", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 73584, "titulo": "Humanos pavimentam caminho para própria extinção, diz paleontólogo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/07/humanos-pavimentam-caminho-para-propria-extincao-diz-paleontologo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-26T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O paleontólogo Michael J. Benton afirma que os humanos modernos estão pavimentando o próprio caminho para a extinção, diferentemente de outras espécies que habitaram a Terra ao longo dos últimos 4,5 bilhões de anos.", "titulo_pt": "Paleontólogo diz que humanos estão pavimentando seu próprio caminho para a extinção", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 73983, "titulo": "You can get three months of Xbox Game Pass Ultimate for almost half off", "url": "https://www.theverge.com/gadgets/970775/xbox-game-pass-ultimate-deal-sale", "fonte_id": "the_verge", "data_pub": "2026-07-26T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "É possível adquirir um assinamento de três meses do Xbox Game Pass Ultimate por quase metade do preço normal, através de um código digital obtido no site Eneba. O valor da assinatura é de $69, mas pode ser comprada por $39,01.", "titulo_pt": "Você pode adquirir três meses de Xbox Game Pass Ultimate por quase a metade do preço", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 73688, "titulo": "Morre irmão de Leide das Neves, símbolo do acidente com Césio-137 em Goiânia", "url": "https://exame.com/brasil/morre-irmao-de-leide-das-neves-simbolo-do-acidente-com-cesio-137-em-goiania/", "fonte_id": "exam  "2026-07-26T16:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O último suspeito envolvido no assalto que resultou na tentativa de homicídio de um tenente do Exército em outubro de 2025 foi preso em São Paulo. O homem era procurado pela Justiça por roubos a farmácias e outras infrações relacionadas ao caso.", "titulo_pt": "Último suspeito envolvido no assalto que resultou na tentativa de homicídio de tenente do Exército é preso em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 73857, "titulo": "Fiscalía investiga dos ataques a balazos que dejaron cuatro heridos en sector costero de Arica", "url": "https://www.latercera.com/nacional/noticia/fiscalia-investiga-dos-ataques-a-balazos-que-dejaron-cuatro-heridos-en-sector-costero-de-arica/", "fonte_id": "la_tercera", "data_pub": "2026-07-26T15:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Dois ataques a balas ocorreram próximo à praia La Lisera, em Arica, deixando quatro pessoas feridas. Uma das vítimas está em situação crítica e o Equipo ECOH está investigando se os dois incidentes estão ligados.", "titulo_pt": "Fiscalia investiga dois ataques a balas que deixaram quatro feridos no litoral de Arica", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 74477, "titulo": "Senapred declara alerta roja en comunas de Ñuble por aumento de caudal del río Perquilauquén", "url": "https://www.latercera.com/mundo/noticia/senapred-declara-alerta-roja-en-comunas-de-nuble-por-aumento-de-caudal-del-rio-perquilauquen/", "fonte_id": "la_tercera", "data_pub": "2026-07-27T02:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Senapred declarou um alerta vermelho nas comunas de Ñuble devido ao aumento do caudal no rio Perquilauquén. A medida foi tomada após a estação hidrométrica em San Miguel atingir o limite crítico.", "titulo_pt": "Senapred declara alerta vermelho em comunas de Ñuble por aumento do caudal do rio Perquilauquén", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 74478, "titulo": "Senapred eleva a alerta roja por crecida en cuatro comunas de Ñuble tras aumento crítico de los ríos Chillán y Niblinto", "url": "https://www.latercera.com/nacional/noticia/senapred-eleva-a-alerta-roja-por-crecida-en-cuatro-comunas-de-nuble-tras-aumento-critico-de-los-rios-chillan-y-niblinto/", "fonte_id": "la_tercera", "data_pub": "2026-07-27T02:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Senapred elevou a alerta para nível vermelho em quatro comunas de Ñuble devido ao aumento crítico nos níveis dos rios Chillán e Niblinto. Esta medida substitui a alerta amarela vigente e representa um maior risco para a população.", "titulo_pt": "Senapred eleva alerta vermelho em quatro comunas de Ñuble após aumento crítico nos rios Chillán e Niblinto", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 74544, "titulo": "Ebola infections in DR Congo surge to 3,200, with 1,405 deaths", "url": "https://www.aljazeera.com/news/2026/7/27/ebola-infections-in-dr-congo-surge-to-3200-with-1405-deaths?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-27T01:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de infecções pelo Ebola no Congo Democrático aumentou para 3.200, com 1.405 mortes, em apenas dez dias. O surto continua se espalhando por cinco províncias.", "titulo_pt": "Infectados pelo ebola no Congo democrático chegam a 3.200, com 1.405 mortos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 74599, "titulo": "Wildfires threaten Bordeaux as France and Spain battle blazes", "url": "https://www.japantimes.co.jp/news/2026/07/27/world/wildfires-bordeaux-france-spain/", "fonte_id": "japan_times", "data_pub": "2026-07-27T00:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais ameaçam Bordeaux enquanto França e Espanha lutam contra incêndios. Os incêndios são os últimos desastres relacionados a uma estiagem prolongada e sucessivas ondas de calor, intensificados pela mudança climática, segundo cientistas.", "titulo_pt": "Fogos ameaçam Bordeaux enquanto França e Espanha lutam contra as chamas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 73991, "titulo": "Typhoon Noul weakens as it lashes southern China", "url": "https://www.taipeitimes.com/News/front/archives/2026/07/27/2003861439", "fonte_id": "taipei_times", "data_pub": "2026-07-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Noul enfraqueceu enquanto atingia o sul da China com fortes ventos e chuvas intensas.", "titulo_pt": "Typhoon Noul enfraquece ao castigar sul da China", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 74257, "titulo": "Onda de calor e mudanças climáticas já afetam produção de azeite no Alentejo", "url": "https://veja.abril.com.br/comportamento/onda-de-calor-e-mudancas-climaticas-ja-afetam-producao-de-azeite-no-alentejo/", "fonte_id": "veja", "data_pub": "2026-07-26T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A região do Alentejo, conhecida pelo plantio de oliveiras e parreiras, tem sido afetada pela onda de calor e mudanças climáticas, impactando a produção de azeite.", "titulo_pt": "Onda de calor e mudanças climáticas já afetam produção de azeite no Alentejo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 73896, "titulo": "France fires: 'What burns is not just forests, but a way of inhabiting the land that is no longer possible'", "url": "https://www.lemonde.fr/en/opinion/article/2026/07/26/france-fires-what-burns-is-not-just-forests-but-a-way-of-inhabiting-the-land-that-is-no-longer-possible_6755855_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-26T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Philósofos e políticos franceses argumentam que a preparação para os incêndios florestais atuais não se limita à adaptação técnica, mas pode se tornar um ato democrático. Essa perspectiva sugere que o enfrentamento dos incêndios é mais do que uma questão de segurança, envolvendo também questões sociais e políticas.", "titulo_pt": "Incêndios florestais na França: 'o que arde não são apenas as florestas, mas um modo de habitar a terra que já não é possível'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 73669, "titulo": "Frio pode aumentar em até 30% o risco de infarto, alerta cardiologista", "url": "https://www.cnnbrasil.com.br/saude/frio-pode-aumentar-em-ate-30-o-risco-de-infarto-alerta-cardiologista/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-26T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Baixas temperaturas podem aumentar em até 30% o risco de infarto, conforme alerta dado por um cardiologista. As baixas temperaturas causam vasoconstrição e elevam a pressão arterial, levando a eventos cardiovasculares graves, especialmente em pessoas com fatores de risco.", "titulo_pt": "Frio pode aumentar em até 30% o risco de infarto, alerta cardiologista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 74065, "titulo": "Incêndios avançam na Espanha e ameaçam Madri", "url": "https://exame.com/mundo/incendios-avancam-na-espanha-e-ameacam-madri/", "fonte_id": "exame", "data_pub": "2026-07-26T15:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Chamas já consumiram quase 77 mil hectares na Espanha e obrigaram milhares de pessoas a deixar suas casas. A França enfrenta uma 'tempestade de fogo' perto de Bordeaux.", "titulo_pt": "Incêndios avançam na Espanha e ameaçam Madri; França enfrenta 'tempestade de fogo'", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 73624, "titulo": "Incêndios na França e Espanha obrigam 325 mil pessoas a deixarem suas casas", "url": "https://www.brasildefato.com.br/2026/07/26/incendios-na-franca-e-espanha-obrigam-325-mil-pessoas-a-deixarem-suas-casas/", "fonte_id": "brasil_de_fato", "data_pub": "2026-07-26T15:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais no sul da França e na Espanha, próximos a regiões turísticas, obrigaram 325 mil pessoas a deixarem suas casas. O fogo se alastrou rapidamente devido ao solo e vegetação secos, além de uma onda de calor intensa.", "titulo_pt": "Incêndios na França e Espanha forçam 325 mil pessoas a deixarem suas casas", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 73934, "titulo": "More than 360,000 evacuated as wildfires rage in France and Spain", "url": "https://www.aljazeera.com/news/2026/7/26/more-than-360000-evacuated-as-wildfires-rage-in-france-and-spain?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-26T14:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 360 mil pessoas foram evacuadas devido às chamas que estão avançando na França e Espanha. As autoridades francesas e espanholas estão lutando para controlar os incêndios, que em parte são causados por ondas sucessivas de calor.", "titulo_pt": "Mais de 360 mil evacuados com incêndios florestais queimando França e Espanha", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 74014, "titulo": "Wildfires in France drive 250,000 people from their homes and creep toward wine city of Bordeaux", "url": "https://www.koreaherald.com/article/10820623", "fonte_id": "korea_herald", "data_pub": "2026-07-26T12:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio florestal no sul da França forçou a evacuação de 55.000 pessoas durante a noite, elevando o número total de deslocados em uma única região para 220.000. As chamas se aproximam da cidade vitivinícola de Bordéus. Em Espanha, também houve evacuações por causa do fogo na costa leste.", "titulo_pt": "Incêndios no sul da França desalojam 250 mil pessoas e ameaçam região vinícola de Bordeaux", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 73952, "titulo": "‘Violent’ wildfires rage close to French and Spanish cities", "url": "https://www.ft.com/content/e5bf56e2-9ad1-4778-a25b-9fbe7a3f9eb8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-26T11:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 335 mil pessoas foram evacuadas devido a piores incêndios florestais. Os focos de fogo estão próximos às cidades francesas e espanholas.", "titulo_pt": "Incêndios violentos atingem áreas próximas a cidades francesas e espanholas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 73313, "titulo": "Thousands of firefighters are battling the monster blaze near Bordeaux. Their commanders are dealing with a huge coordination challenge", "url": "https://www.lemonde.fr/en/environment/article/2026/07/26/thousands-of-firefighters-are-battling-the-monster-blaze-near-bordeaux-from-all-sides-their-commanders-deal-with-a-huge-coordination-challenge_6755850_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-26T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de bombeiros, principalmente voluntários, estão lutando contra um grande incêndio perto de Bordeaux. Eles trabalham em condições árduas sem muita chance de descanso.", "titulo_pt": "Milhares de bombeiros combatem fogo gigante perto de Bordeaux", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 72991, "titulo": "Clima: domingo tem ar frio no Sul e Sudeste e seca em partes do país", "url": "https://www.metropoles.com/brasil/clima-domingo-tem-ar-frio-no-sul-e-sudeste-e-seca-em-partes-do-pais", "fonte_id": "metropoles", "data_pub": "2026-07-26T10:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O domingo apresenta ar frio no Sul e Sudeste do Brasil, além de seca em algumas regiões. A semana inicia com temperaturas mais baixas e v const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
