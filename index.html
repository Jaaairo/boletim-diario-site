ventos ao vivo, entretenimento, crimes/questões sociais e artes. KMEX, afiliada da Univision, foi o segundo colocado com sete prêmios.", "titulo_pt": "PBS SoCal e KMEX levam principais vitórias na cerimônia de Emmy local de los angeles", "veiculo": "Variety", "pais": "EUA", "classe": "C"}], "cultura__eventos": [], "sociedade": [{"id": 73152, "titulo": "La evidencia genética fue la clave para identificar a un abusador serial que comenzó a atacar en 2010", "url": "https://www.lanacion.com.ar/seguridad/la-evidencia-genetica-fue-la-clave-para-identificar-a-un-abusador-serial-que-comenzo-a-atacar-en-nid26072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-26T10:41:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Oral Criminal de Quilmes condenou Sebastián Figueroa, um marplatense de 40 anos, a 30 anos de prisão por ser considerado responsável pelo abuso serial que começou em 2010. A evidência genética foi crucial para identificá-lo como o agressor.", "titulo_pt": "Evidências genéticas levaram à condenação de estuprador serial", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 73236, "titulo": "Luis Cordero: “La trayectoria del gremialismo permite entender mejor el gobierno de Kast que la importación de patrones extranjeros”", "url": "https://www.latercera.com/politica/noticia/luis-cordero-la-trayectoria-del-gremialismo-permite-entender-mejor-el-gobierno-de-kast-que-la-importacion-de-patrones-extranjeros/", "fonte_id": "la_tercera", "data_pub": "2026-07-26T10:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Luis Cordero, exministro de Segurança chileno, discorda da comparação entre o governo de Kast e figuras como Trump ou Milei. Ele sugere que as claves para entender o atual governo são locais e não importam de países estrangeiros.", "titulo_pt": "Luis Cordero: 'a trajetória do gremialismo permite entender melhor o governo de Kast que a importação de padrões extranjeros'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 73049, "titulo": "Inscrições para cursos gratuitos da Faetec EAD terminam neste domingo (26)", "url": "https://www.cnnbrasil.com.br/educacao/inscricoes-para-cursos-gratuitos-da-faetec-ead-terminam-neste-domingo-26/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-26T09:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Fundação de Apoio à Escola Técnica do Rio oferece 15 mil vagas para cursos gratuitos pela internet. As inscrições terminam neste domingo (26).", "titulo_pt": "Inscrições para cursos gratuitos da Faetec EAD terminam neste domingo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 73523, "titulo": "Man convicted of abetting suicide in wife's death", "url": "https://www.koreaherald.com/article/10820438", "fonte_id": "korea_herald", "data_pub": "2026-07-26T05:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de meia-idade na Coreia do Sul foi condenado a uma pena suspensa de 18 meses por auxiliar no suicídio da esposa, que faleceu. O casal havia feito um pacto de morte após sofrerem perdas financeiras em um golpe de phishing voz em agosto de 2025.", "titulo_pt": "Homem condenado por auxiliar no suicídio da esposa", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 73473, "titulo": "Hong Kong expands after-school care but some families say they still lack access", "url": "https://www.scmp.com/news/hong-kong/education/article/3361859/hong-kong-expands-after-school-care-some-families-say-they-still-lack-access?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-26T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O esquema de cuidados após as aulas em Hong Kong expandiu-se rapidamente este ano, com alguns operadores dizendo que têm capacidade suficiente para atender à demanda. No entanto, limitações de mão-de-obra em alguns centros impediram que todas as famílias elegíveis acessassem o programa.", "titulo_pt": "Hong Kong amplia serviços de cuidados após as aulas, mas falta acesso para algumas famílias", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 72932, "titulo": "Longevidade muda dinâmica das famílias, e avós assumem mais cuidados e gastos com netos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/longevidade-muda-dinamica-das-familias-e-avos-assumem-mais-cuidados-e-gastos-com-netos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-26T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A longevidade está mudando a dinâmica familiar, com avós assumindo mais responsabilidades e gastos com os netos. Izede Zago, aos 77 anos, cuida do neto Theo, que leva as refeições para o trabalho.", "titulo_pt": "Longevidade altera dinâmica das famílias, com avós assumindo mais cuidados e gastos com netos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 72934, "titulo": "Conta de lixo enfrenta resistência em municípios, e vereadores derrubam taxa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/conta-de-lixo-enfrenta-resistencia-em-municipios-e-vereadores-derrubam-taxa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-26T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Municípios brasileiros têm aprovado leis para derrubar a cobrança da taxa do lixo, também conhecida como conta de lixo. Essas medidas enfrentam resistência e já foram adotadas por vereadores em diversos locais.", "titulo_pt": "Leis contra taxa do lixo são aprovadas em municípios", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 73313, "titulo": "Thousands of firefighters are battling the monster blaze near Bordeaux. Their commanders are dealing with a huge coordination challenge", "url": "https://www.lemonde.fr/en/environment/article/2026/07/26/thousands-of-firefighters-are-battling-the-monster-blaze-near-bordeaux-from-all-sides-their-commanders-deal-with-a-huge-coordination-challenge_6755850_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-26T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de bombeiros, principalmente voluntários, estão lutando contra um grande incêndio perto de Bordeaux. Eles trabalham em condições árduas sem muita chance de descanso.", "titulo_pt": "Milhares de bombeiros combatem fogo gigante perto de Bordeaux", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 72991, "titulo": "Clima: domingo tem ar frio no Sul e Sudeste e seca em partes do país", "url": "https://www.metropoles.com/brasil/clima-domingo-tem-ar-frio-no-sul-e-sudeste-e-seca-em-partes-do-pais", "fonte_id": "metropoles", "data_pub": "2026-07-26T10:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O domingo apresenta ar frio no Sul e Sudeste do Brasil, além de seca em algumas regiões. A semana inicia com temperaturas mais baixas e variação de nuvens.", "titulo_pt": "Clima: domingo tem ar frio no Sul e Sudeste e seca em partes do país", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 73384, "titulo": "Photos: Wildfires in France drive 250,000 people from their homes", "url": "https://www.aljazeera.com/gallery/2026/7/26/photos-wildfires-in-france-drive-250000-people-from-their-homes?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-26T10:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais na França obrigaram mais de 250 mil pessoas a deixarem suas casas. Na cidade de Bordeaux, 55 mil pessoas foram evacuadas durante a noite.", "titulo_pt": "Imagens: incêndios em França fazem 250 mil pessoas deixarem as casas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 73457, "titulo": "‘Super’ El Nino: Africa facing mass migration, US$20 billion in damages", "url": "https://www.scmp.com/news/world/africa/article/3361891/super-el-nino-africa-facing-mass-migration-us20-billion-damages?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-26T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um 'super' El Niño está previsto para causar danos combinados entre US$10 bilhões e US$20 bilhões em países afetados da África, possivelmente levando a uma massiva migração de áreas duramente impactadas. Meteorologistas alertam que o padrão climático El Niño, frequentemente associado a severos secos, inundações e tempestades na África, pode se tornar um dos mais intensos já observados se as tendências de aquecimento do Oceano Pacífico continuarem.", "titulo_pt": "Super El niño: áfrica enfrentará grandes danos e possível onda de migração", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 73065, "titulo": "Desmatamento cai na Amazônia e 588 áreas protegidas ficam intactas no semestre", "url": "https://exame.com/esg/desmatamento-cai-na-amazonia-e-588-areas-protegidas-ficam-intactas-no-semestre/", "fonte_id": "exame", "data_pub": "2026-07-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desmatamento na Amazônia diminuiu, com 588 áreas protegidas mantendo sua integridade entre janeiro e junho. Apenas uma terra indígena e sete unidades de conservação perderam mais de 1 km² de floresta no período.", "titulo_pt": "Desmatamento diminui na Amazônia e 588 áreas protegidas permanecem intactas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 73436, "titulo": "Strong winds and rain lash China after Typhoon Noul makes landfall", "url": "https://www.japantimes.co.jp/news/2026/07/26/asia-pacific/china-typhoon-noul/", "fonte_id": "japan_times", "data_pub": "2026-07-26T06:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças meteorológicas severas atingiram China após o Furacão Noul tocar terra. Autoridades evacuaram mais de 340 mil pessoas e suspenderam serviços de trabalho e ferrovia.", "titulo_pt": "Fortes ventos e chuva castigam China após furacão Noul fazer landfall", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 73350, "titulo": "Chickenpox sweeps Gaza camps as thousands of cases emerge in two weeks", "url": "http://www.euronews.com/2026/07/26/chickenpox-sweeps-gaza-camps-as-thousands-of-cases-emerge-in-two-weeks", "fonte_id": "euronews", "data_pub": "2026-07-26T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A varicela tem se propagado nas tendas do Gaza, com milhares de casos surgindo em duas semanas. Os médicos acreditam que o tamanho real da epidemia é maior, devido ao overcrowding e à falta de isolamento adequado, além do fato de muitos crianças nascidas durante o conflito não terem completado suas vacinas.", "titulo_pt": "Varicela atinge campos de Gaza com milhares de casos em duas semanas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 73246, "titulo": "Más de 340.000 personas evacuadas y decenas de vuelos cancelados tras la llegada del tifón Noul a China", "url": "https://www.latercera.com/mundo/noticia/mas-de-340000-personas-evacuadas-y-decenas-de-vuelos-cancelados-tras-la-llegada-del-tifon-noul-a-china/", "fonte_id": "la_tercera", "data_pub": "2026-07-26T04:58:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de 340.000 pessoas foram evacuadas e vários voos cancelados após o tifão Noul chegar à China. As autoridades locais declararam estado de alerta máximo e suspenderam as aulas, o trabalho, as atividades comerciais e o transporte público na província de Guangdong.", "titulo_pt": "Mais de 340.000 pessoas evacuadas e decenas de voos cancelados após chegada do tifão Noul à China", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 73247, "titulo": "Extienden alerta ambiental para este domingo en la Región Metropolitana por persistencia de malas condiciones de ventilación", "url": "https://www.latercera.com/nacional/noticia/extienden-alerta-ambiental-para-este-domingo-en-la-region-metropolitana-por-persistencia-de-malas-condiciones-de-ventilacion/", "fonte_id": "la_tercera", "data_pub": "2026-07-26T03:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Embora a qualidade do ar tenha permanecido entre níveis bons e regulares durante o sábado, as autoridades previram condições meteorológicas desfavoráveis para a dispersão de contaminantes neste domingo na Região Metropolitana. Como resultado, uma alerta ambiental foi estendido.", "titulo_pt": "Alerta ambiental estendido para domingo na região Metropolitana devido a condições meteorológicas desfavoráveis", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 73248, "titulo": "Senapred declara alerta amarilla para San Clemente y Talca por aumento del caudal del río Lircay", "url": "https://www.latercera.com/nacional/noticia/senapred-declara-alerta-amarilla-para-san-clemente-y-talca-por-aumento-del-caudal-del-rio-lircay/", "fonte_id": "la_tercera", "data_pub": "2026-07-26T03:16:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Senapred declarou um alerta amarelo para as cidades de San Clemente e Talca devido ao aumento do caudal do rio Lircay. A medida foi tomada após a estação hidrométrica Puente Rastras registrar níveis acima do limite amarelo.", "titulo_pt": "Senapred emite alerta amarelo para San Clemente e Talca devido ao aumento do caudal do rio Lircay", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 72693, "titulo": "Thousands flee wildfires ravaging France and Spain", "url": "https://www.taipeitimes.com/News/front/archives/2026/07/26/2003861388", "fonte_id": "taipei_times", "data_pub": "2026-07-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas estão fugindo das chamas que devastam áreas em França e               ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
