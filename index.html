<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "21/08/2026 19:16", "stats": {"noticias_novas": 580, "resumos_gerados": 234}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva lidera as intenções de voto para o segundo turno da eleição presidencial com 47%, contra 43% de Flávio Bolsonaro, de acordo com a pesquisa Datafolha. Em São Paulo, Tarcísio de Freitas lidera com 45%, seguido por Fernando Haddad com 27%. No Rio de Janeiro, Eduardo Paes tem 41% das intenções de voto para o governo, contra 19% de Douglas Ruas. Em Minas Gerais, Cleitinho Azevedo lidera a disputa para o governo estadual com 32%, seguido por Patrus e Kalil, cada um com 12%. A governadora Raquel Lyra lidera as intenções de voto em Pernambuco com 47%, contra 40% de João Campos. Movimentos sociais iniciaram uma mobilização semanal em apoio à reeleição de Lula. Além disso, a Polícia Federal identificou a participação de mais diretores do Banco de Brasília (BRB) em supostas irregularidades nas relações com o Banco Master e pediu a prorrogação do inquérito para obter mais depoimentos.", "mundo": "Um ataque com drones e mísseis a um shopping center em Kriviy Rih, na Ucrânia, deixou pelo menos 15 mortos e mais de 130 feridos, incluindo 23 crianças, conforme informaram as autoridades locais. O presidente Volodimir Zelenski prometeu uma resposta ao que chamou de 'ato de barbárie'. Em outro evento, a Suprema Corte dos Estados Unidos autorizou temporariamente que o presidente Donald Trump continue com a construção de um salão de festas luxuoso na Casa Branca, para substituir a Ala Leste, que foi demolida. Além disso, o governo turco solicitou um 'aviso vermelho' da Interpol para o arresto de Netanyahu, acusando Israel de abusos contra ativistas de uma flotilha. A Turquia também emitiu um mandado de prisão contra Netanyahu, acusando-o de crimes contra a humanidade, genocídio e tortura relacionados ao tratamento de ativistas de uma flotilha de ajuda destinada ao Gaza.\n\nA geopolítica global continuou a se movimentar com vários eventos significativos. Nos Estados Unidos, o Supremo Tribunal permitiu a continuação das obras do controverso salão de baile de Donald Trump na Casa Branca, que haviam sido temporariamente suspensas por uma corte inferior. Em Israel, ataques aéreos foram realizados em áreas do sul do Líbano, incluindo a região de Ali al-Taher, causando preocupações regionais. Internamente, o governo dos Estados Unidos assinou uma nova política espacial com o objetivo de permitir mais de 1.000 lançamentos de foguetes por ano até 2030, refletindo o crescimento da indústria espacial. No exterior, o Irã não estaria pronto para fazer 'os devidos acordos', segundo Trump, enquanto a Irmandade Muçulmana na Albânia apoia a 'Revolução das Garças'. A Rússia intensificou os ataques com drones na Ucrânia, causando 15 mortes em Kryvyi Rih, enquanto a Comissão Europeia condenou o plano israelense de assentamentos no Território Ocidental. Além disso, a guerra com o Irã continua a ser um fator importante, com o presidente do Irã chamando para encerrar a guerra a partir de uma posição de força, enquanto Trump busca apoio da China para efetivar sanções.", "economia": "O Brasil e os Estados Unidos marcam uma reunião para discutir tarifas no próximo semestre, seguindo um contato entre os presidentes Lula e Trump. A oferta inicial de ações da Anthropic, em um momento de crescente preocupação com a inteligência artificial, pode refletir essas preocupações. A Petz Cobasi projeta faturar R$ 8 bilhões em 2026, apesar de enfrentar desafios como juros altos e concorrência. O Banco do Brasil anunciou uma parceria com o iFood para expandir os financiamentos na linha Move Brasil. O Ibovespa fechou acima dos 171 mil pontos, com uma alta de 2,45% na semana, impulsionado por dados de inflação mais suaves. O Bitcoin registrou um aumento de US$ 15.000 em apenas três dias, gerando expectativas sobre seu desempenho futuro. A Petrobras expressou interesse em explorar petróleo em Gana, enquanto a Avibras, fabricante de mísseis, foi adquirida pela família Batista. O HSBC demitiu seu maior grupo de executivos seniores desde a crise financeira de 2008, gastando aproximadamente US$ 70 milhões no ano anterior. O Plano de Diversificação de Exportações da ApexBrasil, investindo R$ 210 milhões, visa reduzir os impactos das tarifas dos EUA. A Polícia Federal identificou suspeitas adicionais envolvendo diretores do BRB no caso Master, pedindo prazo extra de 60 dias ao STF para concluir a investigação.", "tecnologia": "Um relatório recente destaca os impactos crescentes da inteligência artificial no ambiente de trabalho, com a AI transformando as dinâmicas de trabalho em diversas indústrias. Além disso, a TikTok e sua matriz chinesa ByteDance concordaram em pagar US$400 milhões para resolver uma ação judicial nos Estados Unidos sobre violação de leis de privacidade infantil. O processo de busca por emprego está se tornando cada vez mais complexo, com a presença de vagas fictícias e a competição com candidatos gerados por inteligência artificial, o que pode erosionar a confiança no mercado de trabalho americano. Diante desses desenvolvimentos, as empresas estão tomando medidas significativas, como a redução de funcionários nas equipes do Siri e do Vision Pro da Apple, além de investir em sistemas operacionais privados como o GrapheneOS da Motorola.", "ciencia": "A exposição de tecnologias de adaptação ao calor, promovida por um instituto, apresenta inovações para mitigar o efeito do calor em diversos ambientes. Paralelamente, pesquisadores da Universidade de Tampere desenvolveram uma plataforma de hidrogel que facilita a criação de biomateriais personalizados, com potencial para engenharia de tecidos e medicina regenerativa. O aumento das mudanças climáticas pode triplicar o preço do trigo, devido à escassez de água em regiões produtoras. Em outro avanço, cientistas da Johns Hopkins Medicine criaram uma tecnologia que permite capturar a formação de folículos pilosos em diferentes estágios de desenvolvimento, publicada na revista Cell. A China está envolvida em uma missão para buscar água congelada em crateras da Lua, enquanto a NASA compartilhou imagens de um eclipse solar total capturado em 12 de agosto. A Agência Nacional de Meteorologia do Reino Unido prevê que o fenômeno El Niño deste ano será o maior em mais de um século, potencialmente tornando 2027 o ano mais quente globalmente. Além disso, a missão japonesa MMX, prevista para lançamento em 19 de outubro, terá como objetivo coletar amostras do marteide Phobos e retorná-las à Terra.", "cultura": "O evento mais importante dos artigos é a anúncio do Festival The Town, que agendou sua terceira edição para 2027, com datas marcadas para os dias 4, 5, 6, 11 e 12 de setembro, no Autódromo de Interlagos, na zona sul de São Paulo. Em seguida, a Feira do Livro, que ocorreu durante nove dias em junho, atraindo 250 convidados e um público de aproximadamente 100 mil pessoas, com todos os debates disponíveis no YouTube. Outro destaque é o anúncio do Armory Show, que irá inaugurar dois novos prêmios para aquisições de museus no evento de 2026, no Javits Center em Nova York, focando em artistas do Caribe.", "sociedade": "Uma diretora é acusada de obrigar uma criança a ingerir urina em uma escola de Minas Gerais. Um tutor foi preso após agredir um cachorro durante um passeio em Balneário Camboriú. Especialistas afirmam que um pré-natal odontológico pode preparar o bebê para a amamentação. A Polícia Federal investiga um campo de society financiado pelo tráfico de drogas e lavagem de dinheiro em São Paulo. Um programa de reinserção social em Las Condes, Santiago, tem 92% dos participantes se mantendo afastados do delito. A discussão continua sobre a definição do autismo. Um entregador foi preso por espancar um homem em Copacabana. A Polícia investiga um 'ranking' com fotos de estudantes e avaliações de teor sexual em Presidente Prudente. Moradores da ocupação Kasa Invisível em Belo Horizonte foram despejados e realizaram um ato em protesto. O prefeito do Rio de Janeiro pede que cariocas se protejam de ventos fortes. Um homem foi agredido com mais de 50 pauladas em Copacabana após ser acusado injustamente de roubo. Câmeras de segurança registraram um incidente em uma academia de Recife, onde uma professora foi agarrada e mordida por um instrutor. Um estatuto laboral para o turismo provavelmente estabelecerá regras específicas para o setor. Mais de 3.400 pessoas buscaram emprego em uma feira de empregos no bairro de Caballito, onde 30 empresas receberam currículos e realizaram entrevistas para mais de 600 vagas.", "meio_ambiente": "O Brasil enfrentará condições climáticas extremas, com temperaturas baixas e geadas no Sul, e calor extremo, conhecido como 'calor sufocante', em outras regiões, devido a uma massa de ar frio se movendo pelo centro-sul do país. O fenômeno 'Super Niño' tem alta probabilidade de se tornar 'Muito Forte', com 90% de chances de superar suas médias históricas de precipitação, o que ameaça inundações na Flórida e em outras áreas. A Vale fechou um novo acordo após quase 11 anos sobre a tragédia de Mariana, enquanto o governo articula medidas de prevenção para incêndios florestais em virtude do El Niño. Além disso, a Hungria enfrenta uma grave crise hídrica devido a um período prolongado de calor e seca, com níveis de água em lagos e rios em recordes baixos.", "direitos_humanos": "A Organização das Nações Unidas (ONU) alerta para uma nova crise de fome na Somália, com a ameaça de uma estação de fome a milhões de pessoas. Paralelamente, a senadora Damares afirma que as mortes de Yanomamis representam uma das maiores crises humanitárias do Brasil, apesar de uma comissão ter solicitado uma investigação sobre o destino de uma verba bilionária destinada à assistência aos Yanomamis. A situação de direitos humanos na região de Gaza também preocupa, com 94% da população enfrentando níveis 'críticos ou catastróficos' de fome, segundo a ONU. Além disso, trabalhadores indonésios acusam empregadores de usar trabalho forçado e reduzir salários, enquanto uma família iraniana enfrenta detenção prolongada pela ICE devido a atividades políticas de um parente há 50 anos. Por fim, um tribunal no Reino Unido decidiu que o Home Office pode ser impedido de deportar jovens vítimas de tráfico para a Albânia, mesmo que tenham sido identificados como seguros lá."}, "resumo_do_dia": {"politica_nacional": [{"id": 116686, "titulo": "Tarcísio lidera em SP com 45% contra 27% de Haddad, diz Datafolha", "url": "https://www.metropoles.com/sao-paulo/tarcisio-45-sp-27-haddad-datafolha", "fonte_id": "metropoles", "data_pub": "2026-08-21T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador Tarcísio lidera as intenções de voto para a reeleição com 45% das intenções, contra 27% de Haddad, de acordo com a pesquisa do Datafolha. A margem de erro é de 2 pontos percentuais.", "titulo_pt": "Tarcísio lidera em SP com 45% contra 27% de Haddad, diz pesquisa Datafolha", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 116550, "titulo": "Datafolha: Marina e Tebet têm 12%, e André do Prado, 10%, na disputa pelo Senado em SP", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/datafolha-marina-e-tebet-tem-12-e-andre-do-prado-10-na-disputa-pelo-senado-em-sp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-21T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marina Silva (Rede) e Simone Tebet (PSB) têm 12% cada um, e André do Prado (PL), presidente da Alesp, tem 10% na disputa pelo Senado em São Paulo, de acordo com uma pesquisa Datafolha divulgada nesta sexta-feira (21).", "titulo_pt": "Marina e Tebet têm 12%, e André do Prado, 10%, na disputa pelo Senado em SP", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 116551, "titulo": "Datafolha: Benedita lidera com 15% ao Senado no Rio; 6 empatam na segunda vaga", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/datafolha-benedita-lidera-com-15-ao-senado-no-rio-6-empatam-na-segunda-vaga.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-21T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada federal Benedita da Silva lidera a corrida para uma vaga no Senado pelo Rio de Janeiro, conforme pesquisa do Datafolha divulgada nesta sexta-feira. Seis candidatos estão empatados na segunda vaga.", "titulo_pt": "Benedita lidera com 15% ao Senado no Rio; 6 empatam na segunda vaga", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 116605, "titulo": "Pesquisa Datafolha: Paes lidera no Rio com 41%, seguido por Douglas Ruas, que soma 19%", "url": "https://veja.abril.com.br/politica/datafolha-paes-lidera-no-rio-com-41-seguido-por-douglas-ruas-que-tem-19/", "fonte_id": "veja", "data_pub": "2026-08-21T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha indica que o ex-prefeito do Rio de Janeiro, Paes, lidera com 41% das intenções de voto, seguido pelo candidato Douglas Ruas, que tem 19%. Esta é a primeira pesquisa realizada após a campanha ter iniciado.", "titulo_pt": "Pesquisa Datafolha: paes lidera no Rio com 41%, seguido por Douglas Ruas com 19%", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 116688, "titulo": "Datafolha: Eduardo Paes tem 41% e Douglas Ruas, 19% ao governo do Rio", "url": "https://www.metropoles.com/brasil/datafolha-eduardo-paes-tem-41-e-douglas-ruas-19-ao-governo-do-rio", "fonte_id": "metropoles", "data_pub": "2026-08-21T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Datafolha realizou uma pesquisa entre 18 e 21 de agosto, ouvindo 1.204 eleitores em 35 municípios do Rio de Janeiro. Eduardo Paes teve 41% das intenções de voto e Douglas Ruas obteve 19%.", "titulo_pt": "Datafolha: eduardo Paes tem 41% e Douglas Ruas, 19% nas intenções de voto para o governo do Rio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 116690, "titulo": "Datafolha: Celina tem 30% das intenções de voto e empata tecnicamente com Arruda, que soma 28%", "url": "https://www.metropoles.com/colunas/grande-angular/datafolha-celina-tem-30-das-intencoes-de-voto-e-empata-tecnicamente-com-arruda-que-soma-28", "fonte_id": "metropoles", "data_pub": "2026-08-21T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha, divulgada na sexta-feira, 21 de agosto, mostrou que Celina respondeu com 30% das intenções de voto e está tecnicamente empatada com Arruda, que obteve 28%. Leandro Grass (PT) ficou em terceiro lugar com 11% das intenções de voto.", "titulo_pt": "Datafolha: celina e Arruda empatam tecnicamente com 30% cada, leandro grass em terceiro com 11%", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 116591, "titulo": "Datafolha em MG: Cleitinho, 32%; Patrus, 12%; Kalil, 12%", "url": "https://g1.globo.com/mg/minas-gerais/eleicoes/2026/noticia/2026/08/21/datafolha-mg-governador-21-agosto.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-21T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha divulgada em Minas Gerais indica que Cleitinho, do Republicanos, lidera com 32% das intenções de voto no primeiro turno, seguido por Patrus Ananias e Alexandre Kalil, ambos com 12%.", "titulo_pt": "Cleitinho lidera com 32%; Patrus e Kalil empatados com 12% na pesquisa de minas gerais", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 116592, "titulo": "Datafolha em MG para o Senado: Marília, 11%; Viana, 8%; Sávio, 6%; Aro, 5%; Ana Luiza, 4%; Superman, 3%", "url": "https://g1.globo.com/mg/minas-gerais/eleicoes/2026/noticia/2026/08/21/datafolha-mg-senado-21-agosto.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-21T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha divulgada nesta sexta-feira (21) indica que os candidatos ao Senado por Minas Gerais apresentam apoio baixo, com Marília Campos (PT) liderando com 11%, seguida por Carlos Viana (PSD) com 8%. Na pesquisa estimulada, apenas 15% dos entrevistados tinham opinião formada sobre os candidatos.", "titulo_pt": "Pesquisa datafolha para o Senado em minas gerais: marília campos lidera com 11%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 116593, "titulo": "Datafolha no DF: Celina, 30%; Arruda, 28%; Grass, 11%", "url": "https://g1.globo.com/df/distrito-federal/eleicoes/2026/noticia/2026/08/21/datafolha-df-governador-21-agosto.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-21T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha divulgada no Distrito Federal indica que Celina Leão lidera com 30% das intenções de voto, seguida por Arruda com 28% e Leandro Grass com 11%. Paula Belmonte e Cappelli aparecem com menores percentuais, enquanto 11% dos entrevistados optaram por votos em branco ou nulos.", "titulo_pt": "Pesquisa datafolha no DF: celina com 30%, Arruda com 28% e Grass com 11%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 116594, "titulo": "Datafolha em SP: Tarcísio, 45%; Haddad, 27%", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/08/21/datafolha-sp-governador-21-agosto.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-21T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha, divulgada nesta sexta-feira (21), mostra Tarcísio de Freitas (Republicanos) com 45% das intenções de voto e Fernando Haddad (PT) com 27% no primeiro turno para governador de São Paulo. Haddad ainda não realizou seu evento de lançamento oficial, mas participou de uma campanha ao lado de Lula em São Bernardo do Campo.", "titulo_pt": "Datafolha em SP: tarcísio, 45%; Haddad, 27%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [{"titulo": "Novos números do Datafolha sobre a disputa entre Lula e Flávio Bolsonaro", "sumario": "Uma pesquisa sobre a sucessão presidencial realizada pelo Datafolha foi divulgada nesta sexta-feira. No primeiro levantamento do Datafolha após o início oficial da campanha presidencial, Lula (PT) registrou 39% de intenção de voto no primeiro turno, contra 33% de Flávio Bolsonaro (PL). A pesquisa Datafolha, encomendada pela Globo e pelo jornal Folha de S.Paulo, indica que Lula lidera com 39% das intenções de voto para a Presidência da República, seguido por Flávio Bolsonaro com 33%.", "artigos": [{"id": 116604, "titulo": "Os novos números do Datafolha sobre a disputa entre Lula e Flávio Bolsonaro", "url": "https://veja.abril.com.br/politica/os-novos-numeros-do-datafolha-sobre-a-disputa-entre-lula-e-flavio-bolsonaro/", "fonte_id": "veja", "data_pub": "2026-08-21T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa sobre a sucessão presidencial realizada pelo Datafolha foi divulgada nesta sexta-feira. O instituto divulgou os novos números da disputa entre Lula e Flávio Bolsonaro.", "titulo_pt": "Novos números do Datafolha sobre a disputa entre Lula e Flávio Bolsonaro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 116552, "titulo": "Datafolha: Lula marca 39% no 1º turno, e Flávio Bolsonaro tem 33%", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/datafolha-lula-marca-39-no-1o-turno-e-flavio-bolsonaro-tem-33.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-21T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No primeiro levantamento do Datafolha após o início oficial da campanha presidencial, Lula (PT) registrou 39% de intenção de voto no primeiro turno, contra 33% de Flávio Bolsonaro (PL). Lula liderava por 47% a 43% na simulação de uma segunda rodada.", "titulo_pt": "Datafolha: lula com 39% no 1º turno, Flávio Bolsonaro com 33%", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 116589, "titulo": "Datafolha: Lula, 39%; Flávio Bolsonaro, 33%; Ronaldo Caiado; 5%; Renan Santos; 4%; Zema, 3%; Augusto Cury, 2%", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/08/21/datafolha-primeiro-turno-21-agosto.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-21T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha, encomendada pela Globo e pelo jornal Folha de S.Paulo, indica que Lula lidera com 39% das intenções de voto para a Presidência da República, seguido por Flávio Bolsonaro com 33%. Os outros candidatos têm porcentagens mais baixas, com o escritor Augusto Cury em terceiro lugar com 2%. O levantamento é o primeiro divulgado após o início das campanhas presidenciais.", "titulo_pt": "Datafolha: lula com 39%; Flávio Bolsonaro com 33%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 116590, "titulo": "Datafolha - 2º turno: Lula, 47%; Flávio Bolsonaro, 43%", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/08/21/datafolha-segundo-turno-21-agosto.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-21T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha divulgada nesta sexta-feira (21) indica que, em um cenário de segundo turno, Lula (PT) lidera com 47% das intenções de voto contra Flávio Bolsonaro (PL), que tem 43%. Os outros cenários simulados mostram Lula com liderança significativa sobre seus adversários.", "titulo_pt": "2º turno: lula, 47%; Flávio Bolsonaro, 43%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 116693, "titulo": "Datafolha: Lula tem 47% e Flávio Bolsonaro, 43%, no 2º turno", "url": "https://www.metropoles.com/brasil/datafolha-lula-tem-47-e-flavio-bolsonaro-43-no-2o-turno-2", "fonte_id": "metropoles", "data_pub": "2026-08-21T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha, realizada entre os dias 18 e 20 de agosto, ouviu 2.058 eleitores e mostrou que Lula tem 47% das intenções de voto no segundo turno, enquanto Flávio Bolsonaro tem 43%.", "titulo_pt": "Datafolha: lula tem 47% e Flávio Bolsonaro, 43%, no 2º turno", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 116634, "titulo": "Datafolha: Lula tem 47% das intenções de voto no 2º turno; Flávio, 43%", "url": "https://www.cnnbrasil.com.br/eleicoes/datafolha-lula-tem-47-das-intencoes-de-voto-no-2o-turno-flavio-43/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha realizada entre os dias 18 e 20 de agosto ouviu 2.058 pessoas e mostrou que Lula tem 47% das intenções de voto no segundo turno, enquanto Flávio tem 43%. A margem de erro é de 2 pontos percentuais.", "titulo_pt": "Datafolha: lula lidera com 47% das intenções de voto no 2º turno; Flávio tem 43%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}]}], "mundo": [{"id": 116358, "titulo": "MAC calls for release of pro-democracy HK activists", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/22/2003862922", "fonte_id": "taipei_times", "data_pub": "2026-08-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Macau chamou para a liberação dos ativistas pró-democracia de Hong Kong. O governo de Macau pediu que as autoridades de Hong Kong considerem a soltura de ativistas que estão detidos por suas atividades pró-democracia.", "titulo_pt": "Macau pede liberdade para ativistas pró-democracia de hong kong", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 116727, "titulo": "O que Lula e Trump conversaram, o que ficou de fora e qual estratégia do governo", "url": "https://www.infomoney.com.br/politica/o-que-lula-e-trump-conversaram-o-que-ficou-de-fora-e-qual-estrategia-do-governo/", "fonte_id": "infomoney", "data_pub": "2026-08-21T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A conversa entre Lula e Trump focou principalmente na relação bilateral entre os dois países, mas também abordaram questões gerais sobre guerras e o papel das Nações Unidas.", "titulo_pt": "O que Lula e Trump conversaram, o que ficou de fora e qual estratégia do governo", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 116862, "titulo": "Mexican Governor, Accused by U.S. of Helping Cartel, Returns to His Job", "url": "https://www.nytimes.com/2026/08/21/world/americas/mexico-sinaloa-governor-cartels.html", "fonte_id": "nyt_world", "data_pub": "2026-08-21T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rubén Rocha Moya, governador mexicano acusado pelos Estados Unidos de auxiliar a cartel de Sinaloa, afirmou que retornou ao cargo após declarar que se afastaria para se defender.", "titulo_pt": "Governador mexicano acusado de ajudar Cartel retorna ao cargo", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 116972, "titulo": "US Supreme Court allows construction of Trump's ballroom for now", "url": "https://www.lemonde.fr/en/international/article/2026/08/21/us-supreme-court-allows-construction-of-trump-s-ballroom-for-now_6756744_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-21T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal dos Estados Unidos, sob a presidência do Chief Justice, temporariamente suspendeu uma decisão de uma corte inferior que havia interrompido a construção do controverso salão de baile no Palácio Branco, permitindo que as obras continuem enquanto a litigância continua.", "titulo_pt": "Supremo dos EUA permite continuidade da construção do salão de baile controverso no palácio branco", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 116988, "titulo": "Mexico Governor Ruben Rocha returns to office despite US criminal charges", "url": "https://www.aljazeera.com/news/2026/8/21/mexico-governor-ruben-rocha-returns-to-office-despite-us-criminal-charges?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-21T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governador Ruben Rocha, que lidera o estado de Sinaloa, retornou ao cargo apesar de acusações criminais feitas pelo governo dos Estados Unidos de que ele se associou a um cartel.", "titulo_pt": "Governador do México Ruben Rocha retorna ao cargo despite US criminal charges", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 117011, "titulo": "Trump says Iran not ready to make the 'right deal'", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/trump-says-iran-not-ready-make-right-deal", "fonte_id": "middle_east_eye", "data_pub": "2026-08-21T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, afirmou que a Irã não está preparado para fazer o 'deals certo' e que Washington está observando a situação durante a guerra. Trump também mencionou que os EUA têm controle total da região, incluindo o Estreito de Ormuz.", "titulo_pt": "Trump diz que Irã não está pronto para fazer o 'deals certo'", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 116559, "titulo": "Lula defendeu sistema eleitoral brasileiro durante conversa com Trump", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/lula-defendeu-sistema-eleitoral-brasileiro-durante-conversa-com-trump.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-21T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula discutiu o sistema eleitoral brasileiro com Trump. O presidente petista defendeu o sistema durante a conversa sobre as eleições brasileiras.", "titulo_pt": "Lula defendeu sistema eleitoral brasileiro em conversa com Trump", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 116595, "titulo": "Em ligação com Lula, Trump quis saber sobre eleições no Brasil e ouviu que processo corre bem e de forma confiável", "url": "https://g1.globo.com/politica/noticia/2026/08/21/em-ligacao-com-lula-trump-quis-saber-sobre-eleicoes-no-brasil-e-ouviu-que-processo-corre-bem-e-de-forma-confiavel.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-21T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Durante uma conversa telefônica de mais de uma hora entre Donald Trump e Luiz Inácio Lula da Silva, Trump questionou sobre as eleições brasileiras de outubro. Lula informou que o processo eleitoral está andando bem e de forma confiável.", "titulo_pt": "Em ligação com Lula, Trump questiona sobre eleições no Brasil e ouve que processo corre bem", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 117012, "titulo": "Israel launches attacks in southern Lebanon", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israel-launches-attacks-southern-lebanon-0", "fonte_id": "middle_east_eye", "data_pub": "2026-08-21T21:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel realizou ataques aéreos em áreas do sul do Líbano, incluindo a região de Ali al-Taher, perto da fronteira com o norte de Israel. As notícias também mencionam ataques em Deir Siryan, Doha Kafr Rumman e al-Mansouri.", "titulo_pt": "Israel realiza ataques no sul do líbano", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 116991, "titulo": "Global Sumud Flotilla joins Albania’s anti-resort protest", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/21/global-sumud-flotilla-joins-albanias-anti-resort-protest?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-21T21:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três barcos da Flotilha Global Sumud chegaram à cidade de Vlorë, na Albânia, para apoiar a 'Revolução das Garças'.", "titulo_pt": "Flotilha global Sumud chega à albânia para apoiar a 'revolução das garças'", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 117038, "titulo": "Wsj, 'tensioni con Hegseth, lascia entro fine anno il segretario dell'esercito Usa'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/21/wsj-tensioni-con-hegseth-lascia-entro-fine-anno-il-segretario-dellesercito_c1d75c11-d9e2-4e6c-8d85-7e45f0b5a212.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-21T21:01:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O secretário do Exército dos Estados Unidos está prestes a deixar o cargo até o final do ano, levando a uma situação sem líder confirmado pelo Congresso. Existem tensões com o general Kenneth Hegseth, que parece ser uma figura central na saída do atual secretário.", "titulo_pt": "Tensões com Hegseth levam secretário do exército dos EUA a deixar cargo até final do ano", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 116596, "titulo": "Ministro brasileiro e representante dos EUA retomam conversas após telefonema de Lula e Trump", "url": "https://g1.globo.com/politica/blog/julia-duailibi/post/2026/08/21/ministro-brasileiro-e-americano-reabrem-conversas-apos-telefonema-de-lula-e-trump.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-21T20:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O embaixador dos Estados Unidos entrou em contato com o ministro do Desenvolvimento, Indústria, Comércio e Serviços do Brasil para discutir a retomada das negociações técnicas sobre o tarifaço americano, após uma conversa telefônica entre os presidentes Luiz Inácio Lula da Silva e Donald Trump. Os países devem retomar as discussões na próxima semana.", "titulo_pt": "Ministro brasileiro e representante dos EUA retomam conversas após telefonema de Lula e Trump", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 117087, "titulo": "Israel probes killing of Hind Rajab, Gaza child who called for help", "url": "https://www.washingtonpost.com/world/2026/08/21/israel-probes-killing-hind-rajab-gaza-child-who-called-help/", "fonte_id": "washington_post_world", "data_pub": "2026-08-21T20:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um mandato israelense de investigação não encaminhou para promotores militares alguns casos excepcionais, incluindo o assassinato de uma criança palestiniana que chamou por ajuda em Gaza.", "titulo_pt": "Israel investiga morte de criança palestiniana em Gaza que pediu ajuda", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 116654, "titulo": "Hezbollah diz que é injusto EUA reclassificarem grupo como aliado do Irã", "url": "https://www.cnnbrasil.com.br/internacional/hezbollah-diz-que-e-injusto-eua-reclassificarem-grupo-como-aliado-do-ira/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Hezbollah declarou que é injusto o governo dos Estados Unidos reclassificar o grupo como aliado do Irã, um dia após o anúncio de novas sanções contra o grupo armado.", "titulo_pt": "Hezbollah considera injusto EUA reclassificar grupo como aliado do Irã", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 117014, "titulo": "EU's von der Leyen joins European countries to condemn Israel's West Bank plan", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/eus-von-der-leyen-joins-european-countries-condemn-israels-west-bank", "fonte_id": "middle_east_eye", "data_pub": "2026-08-21T20:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A presidente da Comissão Europeia, Ursula von der Leyen, juntou-se a outros países europeus para condenar o plano israelense de abrir licitações para a construção de um projeto de assentamento chamado 'E1' na Cisjordânia Ocidental ocupada. France, Germany, Britain e Italy também emitiram uma declaração conjunta condenando o projeto israelense.", "titulo_pt": "Von der Leyen condena plano israelense para assentamentos na cisjordânia ocidental", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 116863, "titulo": "Turkey Requests Netanyahu’s Arrest, Saying Israel Abused Flotilla Activists", "url": "https://www.nytimes.com/2026/08/21/world/middleeast/turkey-netanyahu-arrest-israel.html", "fonte_id": "nyt_world", "data_pub": "2026-08-21T20:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Turquia solicitou a Israel um 'aviso vermelho' de Interpol para o arresto de Netanyahu, alegando que Israel abusou dos ativistas da flotilha. Essa solicitação ocorreu em um momento de tensões crescentes entre os dois países.", "titulo_pt": "Turquia solicita arresto de Netanyahu, afirmando abuso de ativistas da flotilha", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 116685, "titulo": "Brasil e EUA marcam reunião sobre tarifaço para a próxima semana", "url": "https://www.metropoles.com/mundo/brasil-e-eua-marcam-reuniao-sobre-tarifaco-para-a-proxima-semana", "fonte_id": "metropoles", "data_pub": "2026-08-21T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há um encontro marcado entre representantes dos EUA e do Brasil para a próxima semana, focado em discutir o problema das tarifas. A reunião seguirá após um contato entre o presidente Lula e o presidente Trump, que resultou em uma ligação entre eles.", "titulo_pt": "Brasil e EUA marcam reunião sobre tarifaço para a próxima semana", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 116980, "titulo": "Anthropic IPO filing will show AI backlash as a risk factor, sources say", "url": "https://www.cnbc.com/2026/08/21/-anthropic-ipo-filing-will-show-ai-backlash-as-risk-sources-say.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-21T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthropic está prestes a realizar sua oferta inicial de ações em um momento em que o público está cada vez mais insatisfeito com os centros de dados e tem medo de que a inteligência artificial leve embora empregos.", "titulo_pt": "IPO da anthropic mostrará risco de rejeição à IA, dizem fontes", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 116729, "titulo": "Petz Cobasi deve faturar R$ 8 bi em 2026, diz presidente do conselho de administração", "url": "https://www.infomoney.com.br/business/petz-cobasi-deve-faturar-r-8-bi-em-2026-diz-presidente-do-conselho-de-administracao/", "fonte_id": "infomoney", "data_pub": "2026-08-21T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do conselho de administração da Petz Cobasi afirmou que a empresa deve faturar R$ 8 bilhões em 2026. O setor tem enfrentado dificuldades devido a juros altos, concorrência de importados e a presença de apostas online.", "titulo_pt": "Petz Cobasi deve faturar R$ 8 bi em 2026, diz presidente do conselho de administração", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 116576, "titulo": "Recuperações judiciais batem recorde; é hora de fugir do crédito privado?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/08/recuperacoes-judiciais-batem-recorde-e-hora-de-fugir-do-credito-privado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta quinta-feira (20), o Banco Central divulgou sua Pesquisa Trimestral de Condições de Crédito, mostrando como as instituições financeiras estão ajustando sua disposição para emprestar. O relatório chega em um momento particularmente interessante.", "titulo_pt": "Recuperações judiciais batem recorde; é hora de fugir do crédito privado?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 116577, "titulo": "Eudora entra no Beautybox e amplia base de clientes ativa para 25 milhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/eudora-entra-no-beautybox-e-amplia-base-de-clientes-ativa-para-25-milhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A marca Eudora, do Grupo Boticário, foi incluída no Beautybox, programa de fidelidade que já conta com as marcas O Boticário e Quem Disse, Berenice?. Esta inclusão aumenta a base de clientes ativa para 25 milhões.", "titulo_pt": "Eudora entra no Beautybox e amplia base de clientes ativa para 25 milhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 116579, "titulo": "Bradesco propõe equacionar dívida da Invepar e quer novo CEO no aeroporto de Guarulhos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/bradesco-propoe-equacionar-divida-da-invepar-e-quer-novo-ceo-no-aeroporto-de-guarulhos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T20:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt":  116583, "titulo": "J&F, dos irmãos Batista, fecha acordo para comprar fabricante de material bélico Avibras", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/jf-dos-irmaos-batista-fecha-acordo-para-comprar-fabricante-de-material-belico-avibras.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T19:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A fabricante de material bélico Avibras Aeroco está sendo vendida para a Globe Investimentos, empresa da holding J&F, dos irmãos Joesley e Wesley Batista, da JBS. A empresa é considerada estratégica pelo governo.", "titulo_pt": "J&F, dos irmãos Batista, fecha acordo para comprar fabricante de material bélico Avibras", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 116757, "titulo": "Driblando as tarifas dos EUA: ApexBrasil anuncia Plano de Diversificação de Exportações", "url": "https://www.brasildefato.com.br/2026/08/21/driblando-as-tarifas-dos-eua-apexbrasil-anuncia-plano-de-diversificacao-de-exportacoes/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-21T19:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Para reduzir os impactos das tarifas impostas pelos EUA, a ApexBrasil lançou o Plano de Diversificação de Exportações, investindo R$ 210 milhões em ações de promoção comercial e atendimento individualizado para empresas afetadas.", "titulo_pt": "Driblando as tarifas dos EUA: apexbrasil anuncia Plano de Diversificação de Exportações", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 116584, "titulo": "Seis em cada dez jovens aceitariam salário menor por trabalho menos estressante", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/seis-em-cada-dez-jovens-aceitariam-salario-menor-por-trabalho-menos-estressante.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T19:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da Fundação Itaú revelou que 60% dos jovens brasileiros de 16 a 29 anos aceitariam um salário menor se isso significasse trabalhar em um ambiente com menos estresse. Foram entrevistadas 1.816 pessoas nessa faixa etária.", "titulo_pt": "Seis em cada dez jovens brasileiros aceitariam salário menor por trabalho menos estressante", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 116585, "titulo": "PF aponta suspeitas sobre mais diretores do BRB no caso Master e pede prazo para concluir inquérito", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/pf-aponta-suspeitas-sobre-mais-diretores-do-brb-no-caso-master-e-pede-prazo-para-concluir-inquerito.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T18:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal identificou suspeitas adicionais envolvendo mais diretores do BRB no caso da compra de carteiras de crédito fraudulentas do Banco Master e solicitou prazo extra de 60 dias ao STF para concluir a investigação.", "titulo_pt": "PF suspeita de mais diretores do BRB no caso Master e pede prazo para concluir inquérito", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 116586, "titulo": "ANP avança para monitorar mistura de biodiesel por notas fiscais eletrônicas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466758", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T18:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diretoria da ANP aprovou mudanças nas regras para o biodiesel que permitirão a autarquia acessar diariamente notas fiscais eletrônicas, aumentando a fiscalização das distribuidoras. Essa medida visa monitorar a mistura obrigatória
