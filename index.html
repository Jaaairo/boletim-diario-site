  </div>
</div>

<script>
const D = {"gerado_em": "14/09/2026 07:19", "stats": {"noticias_novas": 727, "resumos_gerados": 226}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O cenário eleitoral brasileiro continua em destaque, com a pesquisa BTG/Nexus mostrando que Lula lidera com 50% de potencial de voto e 48% de rejeição, enquanto Flávio Bolsonaro tem 48% de potencial de voto e 50% de rejeição. No primeiro turno, Lula tem 40% dos votos, seguido por Flávio com 36% e Cury com 7%. A crise no Supremo Tribunal Federal (STF) continua a agitar a política, com sessões decisivas marcadas para a próxima terça-feira, incluindo o julgamento sobre a possibilidade de investigar o ministro Alexandre de Moraes. A situação fiscal da Bahia também merece destaque, com a gestão de Jerônimo Rodrigues (PT) sendo criticada por ter agravado a situação fiscal do estado em comparação com a gestão de Rui Costa. Além disso, a reforma tributária, que entrará em vigor em 2027, deve afetar os Microempreendedores Individuais (MEIs) com a necessidade de emitir notas fiscais conforme novas regras.", "mundo": "A Suécia está em um período de transição política, com a oposição centro-esquerda, liderada por Magdalena Andersson, avançando nas eleições gerais. Isso pode levar a formação de um novo governo dessa aliança. No entanto, o aumento do gasto militar em resposta à entrada da Suécia na OTAN pode limitar as opções do novo governo. Em outro desenvolvimento, Israel é acusado de um projeto de 'eliminação' dos palestinos na Cisjordânia, conforme relatório da organização B'Tselem. Além disso, a Finlândia se juntou a uma iniciativa francesa de 'deterrença nuclear avançada', com dez países europeus já aderidos. No cenário econômico, a Suécia e a Coreia do Sul discutem temas como cadeias de suprimentos, inteligência artificial e energia com o Banco Asiático de Desenvolvimento. No âmbito da segurança cibernética, a CNBC destaca a importância de manter uma vantagem na corrida pela IA, enquanto a Coreia do Sul enfrenta a queda no apoio popular à gestão atual. Finalmente, a Suécia pode ter que lidar com a pressão financeira devido ao aumento do gasto militar, enquanto a Coreia do Sul busca aprofundar sua parceria estratégica com o Uzbekistão.\n\nA tensão geopolítica na região do Oriente Médio e na Ucrânia continua a crescer, com relatos de ataques e confrontos entre as partes envolvidas. O Irã e os Estados Unidos estão em conflito com drones, com o Irã afirmando ter derrubado um dron avançado dos EUA sobre o Estreito de Ormuz. As tensões no Estreito de Ormuz levaram a uma reunião adiada entre o Irã e as potências do Golfo, enquanto 101 navios comerciais foram redirecionados como parte de um bloqueio marítimo contra o Irã. Na Ucrânia, drones russos causaram incêndios em uma estação de combustível na fronteira com a Polônia, levando a preocupações de escalada da tensão. Além disso, ataques a instalações de petróleo na Arábia Saudita causaram preocupações sobre a crise global do petróleo, com estimativas de 4% da oferta global em risco.", "economia": "Os mercados financeiros e econômicos, tanto brasileiros quanto internacionais, enfrentam diversos desafios e oportunidades nesta segunda-feira (14). A indústria da reclamação trabalhista continua empurrando empresas para processos judiciais, enquanto a desigualdade social influencia os resultados desses litígios, conforme relatado. As empresas chinesas de óptica estão apostando em tecnologias de comunicação óptica e óculos inteligentes, enquanto as grandes instituições bancárias japonesas lançam serviços para pequenas e médias empresas. No cenário internacional, a Arábia Saudita fechou uma linha de transbordo crítica de petróleo, levando o preço do Brent a subir acima de 108 dólares. Em outro desenvolvimento, a indústria petroquímica sul-coreana enfrenta investigações sobre a fixação de preços. O rendimento da dívida dos Estados Unidos de 10 anos está se aproximando de 5%, enquanto o Federal Reserve se prepara para uma decisão sobre as taxas de juros. Além disso, a Casa Branca apoiará a decisão do Fed sobre os juros, e há preocupações sobre a inflação e a economia brasileira, com a intervenção do governo sobre o dólar ajudando a controlar a inflação, mas enfraquecendo a economia.", "tecnologia": "A tecnologia está em destaque em vários aspectos, desde a construção de casas em apenas 48 horas por meio de impressoras 3D, até a criação de um novo smartphone para adolescentes na Coreia do Sul. A China está intensificando a regulamentação de drones, implementando regras mais rígidas que entram em vigor em novembro. A indústria de inteligência artificial (IA) também está sob a mira, com líderes de empresas como OpenAI e Anthropic chamando para um freio no desenvolvimento 'descontrolado' da tecnologia. Sam Altman, CEO da OpenAI, alertou para o risco de perder o controle para a IA se a corrida tecnológica ultrapassar a segurança. Em outro desenvolvimento, a Coreia do Sul está buscando soluções para o problema dos idosos que se sentem deslocados pelo mundo digital. Além disso, a Lotte Biologics está intensificando sua presença global, participando de conferências de biotecnologia em outubro. Por fim, a Plataforma de Pedágio Eletrônico, criada em 2023, já movimentou R$ 400 milhões com transações realizadas através do reconhecimento de placas de veículos e inteligência artificial.", "ciencia": "Um estudo conduzido por uma equipe internacional de pesquisadores, liderada pela Universidade de Sydney e pela Imperial College London, descobriu que, à medida que a África se prepara para um poderoso evento El Niño, a disponibilidade de previsões climáticas mais precisas não será suficiente para proteger muitos dos agricultores de gado mais pobres da região das consequências do aquecimento global. A descoberta, publicada no Phys.org, indica que a África precisa de soluções mais integrais para enfrentar as mudanças climáticas, além de previsões meteorológicas mais precisas. Em outro desenvolvimento, cientistas chineses encontraram mais evidências de misteriosos humanos ancestrais, os denisovanos, no sudoeste do país, que podem contribuir para esclarecer o mistério em torno desses ancestrais menos conhecidos da humanidade moderna. Além disso, um estudo em três cavernas neolíticas na Espanha revelou práticas canibais e rituais macabros, incluindo crânios usados como copos e restos de ossos fervidos, sugerindo que essas práticas variavam entre massacres violentos e oferendas simbólicas. Estes são alguns dos principais avanços científicos abordados nos artigos fornecidos.", "cultura": "O evento mais importante dos artigos é a estreia da peça 'The Palace Letters' no Sydney Theatre Company, prevista para 2027. Inspirada na correspondência secreta entre a Rainha Elizabeth II, Malcolm Fraser e o governador-geral John Kerr, a peça aborda os eventos que levaram ao afastamento de Gough Whitlam. O festival Rock in Rio 2026 no Brasil também merece destaque, com performances de K-pop dominando o evento, incluindo a estréia de Stray Kids como a primeira banda K-pop a encabeçar o festival. Além disso, a estreia de 'Misty Green', dirigida por Chris Rock, é uma novidade no mundo do cinema, enquanto a 10ª Biennale de Fotografia de Vevey, na Suíça, oferece uma visão global da fotografia com 50 instalações artísticas de 21 países. A obra de Jane Austen, 'Sanditon', ganha um desfecho com o trabalho de Walcyr Carrasco, e a estrela Zara Larsson se apresenta no Rock in Rio sob chuva, enquanto o Príncipe Herdeiro Hisahito visita uma área afetada pelo tsunami de 2011, acompanhado pelo Príncipe Akishino.", "sociedade": "A saúde digital, que tem potencial para fortalecer o SUS, ainda não foi totalmente explorada pelo sistema, conforme relatório do Jota. Em Hong Kong, o Consumer Council revelou grandes diferenças na velocidade de absorção entre absorventes descartáveis testados em 36 produtos. No Brasil, a desigualdade climática é evidente, com diferenças de 15°C entre as regiões do Morumbi e Paraisópolis no verão, conforme relatório do Exame. O Ministério Público Federal, em parceria com a Fundação Nacional dos Povos Indígenas (Funai), investiga casos de proselitismo religioso abusivo e invasões em terras indígenas, buscando proteger os povos isolados.", "meio_ambiente": "Os oceanos têm registrado temperaturas acima da média, batendo um novo recorde, conforme relatório do Greenpeace. Este fenômeno, que se estende por 100 dias e é agravado pelo El Niño atual, representa uma ameaça ao clima global. Paralelamente, um estudo publicado pelo South China Morning Post alerta que os glaciares dos Himalaias estão derretendo mais rapidamente do que há uma década, ameaçando a segurança hídrica da região até 2050. O relatório indica que milhões de vidas estão em risco à medida que o Himalaia se aproxima do ponto de não retorno. As mudanças climáticas também estão afetando a economia global, com os oceanos registrando recordes de temperatura, preocupando os cientistas que alertam sobre as consequências econômicas e ambientais globais. Além disso, o aquecimento do Ártico está levantando preocupações de segurança em relação aos tradicionais caminhos marítimos do Oriente Médio, enquanto o acordo da ONU para fornecer US$ 1,3 trilhão em financiamento climático está em risco, pois instituições multilaterais de crédito, incluindo o Banco Mundial, podem abandonar suas metas verdes sob pressão dos EUA.", "direitos_humanos": "Os pais palestinos expressam preocupação com os ataques a escolas na Cisjordânia ocupada, onde um diretor de escola instalou uma nova cerca de arame farpado após a morte de três alunos este ano. Na Venezuela, a decisão dos Estados Unidos sobre pedidos de asilo venezuelanos determina que cada caso deve ser avaliado individualmente diante das mudanças nas condições após a saída de Nicolás Maduro. Em outro caso, a ministra de Mulheres e Igualdade de Gênero criticou a decisão no caso Mariana Sepúlveda, afirmando que sente impotência diante dessa situação. Para muitas famílias iranianas, a vida digna é um sonho distante diante da guerra dos Estados Unidos, com uma constante deterioração e sem perspectivas reais de melhoria no futuro próximo. A Turquia realizou uma operação contra organizações, empresas e indivíduos LGBTQ+, acusando-os de atividades como prostituição e conteúdo obsceno."}, "resumo_do_dia": {"politica_nacional": [{"id": 160056, "titulo": "O indicador em que Lula abre vantagem sobre Flávio na nova pesquisa BTG/Nexus", "url": "https://veja.abril.com.br/politica/o-indicador-em-que-lula-abre-vantagem-sobre-flavio-na-nova-pesquisa-btg-nexus/", "fonte_id": "veja", "data_pub": "2026-09-14T09:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na nova pesquisa BTG/Nexus, Lula registra 50% de potencial de voto e 48% de rejeição, enquanto Flávio registra 48% de potencial de voto e 50% de rejeição.", "titulo_pt": "Indicador mostra Lula com vantagem sobre Flávio na nova pesquisa", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 160074, "titulo": "BTG/Nexus: aprovação do governo Lula vai a 47% e 49% o desaprovam", "url": "https://www.metropoles.com/brasil/btg-nexus-aprovacao-do-governo-lula-vai-a-47-e-49-o-rejeitam", "fonte_id": "metropoles", "data_pub": "2026-09-14T09:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O levantamento indica que 47% dos entrevistados aprovam a gestão do governo Lula, enquanto 49% desaprovam. Além disso, 37% avaliam a gestão como ótima ou boa, e 44% consideram-a ruim ou péssima.", "titulo_pt": "Aprovação do governo Lula é de 47% e 49% desaprovam", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 160152, "titulo": "Ponto a ponto, as decisões de ministros do STF sobre o caso Master durante o fim de semana", "url": "https://www.bbc.com/portuguese/articles/czdzg00rzp4o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-14T09:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fim de semana foi marcado por uma intensa divulgação de despachos e ofícios dos ministros do Supremo Tribunal Federal em meio a uma crise sem precedentes na Corte.", "titulo_pt": "Ponto a ponto, as decisões de ministros do STF sobre o caso Master durante o fim de semana", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 160057, "titulo": "As boas notícias para Lula na pesquisa BTG/Nexus a três semanas do primeiro turno", "url": "https://veja.abril.com.br/politica/as-boas-noticias-para-lula-na-pesquisa-btg-nexus-a-tres-semanas-do-primeiro-turno/", "fonte_id": "veja", "data_pub": "2026-09-14T09:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No primeiro turno, Lula tem vantagem sobre Flávio numericamente no segundo turno. O ex-presidente também apresenta crescimento no primeiro turno e melhora nos indicadores de potencial de voto, rejeição e aprovação do governo.", "titulo_pt": "Boas notícias para Lula na pesquisa BTG/Nexus a três semanas do primeiro turno", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 160113, "titulo": "Nexus/BTG: No 1° turno, Lula tem 40%; Flávio, 36% e Cury, 7%", "url": "https://www.cnnbrasil.com.br/eleicoes/nexus-btg-no-1-turno-lula-tem-40-flavio-36-e-cury-7/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-14T09:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Foram ouvidos 2.003 eleitores entre os dias 11 e 13 de setembro, e no primeiro turno, Lula lidera com 40% dos votos, seguido por Flávio com 36% e Cury com 7%. A margem de erro é de 2 pontos percentuais.", "titulo_pt": "Nexus/BTG: no primeiro turno, Lula tem 40%; Flávio, 36% e Cury, 7%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 160114, "titulo": "Nexus/BTG: Lula empata com Flávio e Cury no 2° turno", "url": "https://www.cnnbrasil.com.br/eleicoes/nexus-btg-lula-empata-com-flavio-e-cury-no-2-turno/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-14T09:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O levantamento mostrou que Lula tem igual número de votos no segundo turno com Flávio e Cury. A pesquisa foi realizada entre os dias 11 e 13 de setembro com 2.003 eleitores, com uma margem de erro de dois pontos percentuais.", "titulo_pt": "Nexus/BTG: lula empatado com Flávio e Cury no 2° turno", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 160058, "titulo": "A nova pesquisa BTG/Nexus sobre a disputa Lula x Flávio a três semanas da eleição", "url": "https://veja.abril.com.br/politica/a-nova-pesquisa-btg-nexus-sobre-a-disputa-lula-x-flavio-a-tres-semanas-da-eleicao/", "fonte_id": "veja", "data_pub": "2026-09-14T09:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 14ª rodada da pesquisa BTG/Nexus sobre a disputa entre Lula e Flávio ocorreu durante a intensificação da crise no Supremo Tribunal Federal (STF).", "titulo_pt": "Nova pesquisa BTG/Nexus sobre Lula x Flávio em meio à crise no stf", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 160059, "titulo": "Sessão vai decidir, nesta terça, o futuro de Alexandre de Moraes e do próprio STF", "url": "https://veja.abril.com.br/brasil/sessao-vai-decidir-nesta-terca-o-futuro-de-alexandre-de-moraes-e-do-proprio-stf/", "fonte_id": "veja", "data_pub": "2026-09-14T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O STF (Supremo Tribunal Federal) vai julgar, nesta terça-feira, se abre ou não uma investigação contra o ministro Alexandre de Moraes. Este julgamento é inédito.", "titulo_pt": "Sessão decide, nesta terça, o futuro de Alexandre de Moraes e do STF", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 160032, "titulo": "Advogado que administrou escritório de vice de governadora do DF recebeu R$ 3 mi de Vorcaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/advogado-que-administrou-escritorio-de-vice-de-governadora-do-df-recebeu-r-3-mi-de-vorcaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-14T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O advogado Engels Muniz, que administrou o escritório de Gustavo Rocha, candidato a vice-governador do Distrito Federal, recebeu R$ 3 milhões do Banco Master e de Daniel Vorcaro.", "titulo_pt": "Advogado que administrou escritório de vice-governador do DF recebeu R$ 3 mi", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 160079, "titulo": "Eleição voto a voto", "url": "https://www.metropoles.com/blog-do-noblat/enquetes/eleicao-voto-a-voto", "fonte_id": "metropoles", "data_pub": "2026-09-14T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A enquete analisa a contagem de votos na eleição. Os resultados são apresentados voto a voto.", "titulo_pt": "Eleição voto a voto", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 160080, "titulo": "Aliados de Flávio miram Lula no TSE por live no Alvorada", "url": "https://www.metropoles.com/colunas/milena-teixeira/aliados-de-flavio-miram-lula-no-tse-por-live-no-alvorada", "fonte_id": "metropoles", "data_pub": "2026-09-14T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados de Flávio Dino consideram levar ao Tribunal Superior Eleitoral (TSE) uma possível ação relacionada a uma live realizada no Palácio Alvorada. Eles veem semelhanças com a decisão que afetou Jair Bolsonaro durante a eleição de 2022.", "titulo_pt": "Aliados de Flávio miram Lula no TSE por live no Alvorada", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 160151, "titulo": "Por dentro da rede de influenciadores que ataca o voto feminino no Brasil", "url": "https://www.bbc.com/portuguese/articles/cy74n45p7dyo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-14T08:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reportagem identificou uma rede de influenciadores que questiona o direito das mulheres ao voto no Brasil. A ministra Cármen Lúcia, do STF, criticou essas declarações e afirmou que propor qualquer mudança neste direito é inconstitucional.", "titulo_pt": "Dentro da rede de influenciadores que questiona o voto feminino no Brasil", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 160033, "titulo": "Podcast trata do fim do sigilo de inquéritos do caso Master e discute novas tensões no STF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/podcasts/2026/09/podcast-trata-do-fim-do-sigilo-de-inqueritos-do-caso-master-e-discute-novas-tensoes-no-stf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-14T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A sessão do STF na terça-feira (15) pode decidir sobre a possível investigação do ministro Alexandre de Moraes. O fim de semana foi marcado por expectativa, pedidos, respostas e articulações dos ministros, além do fim do sigilo de inquéritos relacionados ao caso 'Dark Horse'.", "titulo_pt": "Podcast discute fim do sigilo de inquéritos e novas tensões no STF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 160083, "titulo": "O pessimismo dos aliados de Mendonça para a sessão da terça sobre Moraes", "url": "https://www.metropoles.com/colunas/igor-gadelha/o-pessimismo-dos-aliados-de-mendonca-para-a-sessao-da-terca-sobre-moraes", "fonte_id": "metropoles", "data_pub": "2026-09-14T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O gabinete do ministro André Mendonça tem uma visão pessimista sobre um movimento da ala do STF que tenta adiar a sessão prevista para terça-feira (15/9), que julgará Alexandre de Moraes.", "titulo_pt": "Pessimismo do gabinete de Mendonça sobre movimento para adiar sessão de terça sobre Moraes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 160144, "titulo": "Eleição pode acabar no 1º turno? A conta que preocupa Lula e favorece Flávio", "url": "https://www.infomoney.com.br/politica/eleicao-pode-acabar-no-1o-turno-a-conta-que-preocupa-lula-e-favorece-flavio/", "fonte_id": "infomoney", "data_pub": "2026-09-14T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cila Schulman sugere que Lula tem pouco espaço para crescer nas intenções de voto. A possibilidade de um voto útil antipetista pode beneficiar Flávio no primeiro turno.", "titulo_pt": "Eleição pode acabar no 1º turno? Conta que preocupa Lula e favorece Flávio", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 160084, "titulo": "Flávio recebe do PL 7,9 vezes mais do que rivais arrecadaram fora de siglas", "url": "https://www.metropoles.com/brasil/flavio-recebe-do-pl-79-vezes-mais-do-que-rivais-arrecadaram-fora-de-siglas", "fonte_id": "metropoles", "data_pub": "2026-09-14T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio recebeu R$ 46,15 milhões de recursos do PL, enquanto os outros 12 candidatos arrecadaram juntos R$ 5,83 milhões fora das siglas.", "titulo_pt": "Flávio recebe do PL 7,9 vezes mais do que rivais arrecadaram fora de siglas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 160603, "titulo": "S. Korean president says hopes to deepen strategic partnership with Uzbekistan", "url": "https://en.yna.co.kr/view/AEN20260914009600315", "fonte_id": "yonhap_news", "data_pub": "2026-09-14T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sul-coreano Lee Jae Myung realizou uma cúpula com representantes de Uzbekistão. Os detalhes específicos da reunião ainda não foram divulgados.", "titulo_pt": "Presidente sul-coreano expressa intenção de aprofundar parceria estratégica com uzbekistão", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 160425, "titulo": "Berlin businesswoman charged over alleged spying for Russia", "url": "https://www.dw.com/en/berlin-businesswoman-charged-over-alleged-spying-for-russia/a-79258004?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-14T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma executiva de marketing de Berlim foi acusada de espionagem a favor da Rússia. De acordo com os procuradores, ela utilizou contatos políticos e militares para auxiliar um oficial de inteligência russo a acessar círculos influentes e buscar informações sobre a política de defesa alemã.", "titulo_pt": "Empresária de berlim é acusada de espionagem para a Rússia", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 160342, "titulo": "New Carlo Rovelli book challenges science's understanding of reality and the universe", "url": "https://www.npr.org/2026/09/14/nx-s1-5968442/on-the-equality-of-all-things-physics-carlo-rovelli", "fonte_id": "npr_news", "data_pub": "2026-09-14T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O físico renomado Carlo Rovelli, em seu novo livro, combina ciência e filosofia para questionar a noção de que o universo e a realidade podem ser completamente compreendidos.", "titulo_pt": "Novo livro de Carlo Rovelli questiona a compreensão científica da realidade e do universo", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 160282, "titulo": "Swedish centre-left opposition widens lead to three seats with 95% of votes counted – Europe live", "url": "https://www.theguardian.com/world/live/2026/sep/14/sweden-election-magdalena-andersson-social-democrats-centre-left-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-09-14T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A oposição centro-esquerda sueca ampliou sua vantagem para três cadeiras com 95% dos votos contados. A parlamentar Magdalena Andersson lidera discussões internas sobre os próximos passos. A Social Democrata é provavelmente a primeira a tentar formar o próximo governo, mas enfrentará desafios com o bloco esquerdo complexo.", "titulo_pt": "Oposição centro-esquerda sueca amplia vantagem com 95% dos votos contados", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 160426, "titulo": "Finland: EU leaders meet to forge new Arctic policy", "url": "https://www.dw.com/en/finland-eu-leaders-meet-to-forge-new-arctic-policy/a-79256956?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-14T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes da Europa se reúnem para discutir políticas sobre o Ártico, incluindo navegação, recursos naturais e segurança, diante da pressão dos Estados Unidos, China e Rússia. O Ártico é visto pela UE como crucial para sua segurança futura, devido à expansão de sua acessibilidade devido ao derretimento da neve.", "titulo_pt": "Finlândia: líderes da ue se reúnem para definir nova política do ártico", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 160117, "titulo": "Piloto abatido no Irã relata resgate que mobilizou forças especiais dos EUA", "url": "https://www.cnnbrasil.com.br/internacional/piloto-abatido-ira-resgate-que-mobilizou-forcas-especiais-dos-eua/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-14T09:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um piloto, conhecido pelo codinome 'Bravo', relata ter quebrado a coluna na queda, escapado das forças iranianas e sido resgatado por uma operação secreta com centenas de agentes americanos.", "titulo_pt": "Piloto abatido no Irã relata resgate com intervenção de forças especiais dos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 160219, "titulo": "Rusia anuncia el derribo de cerca de 400 drones lanzados por Ucrania", "url": "https://www.latercera.com/mundo/noticia/rusia-anuncia-el-derribo-de-cerca-de-400-drones-lanzados-por-ucrania/", "fonte_id": "la_tercera", "data_pub": "2026-09-14T09:27:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Rússia anunciou o derrubamento de cerca de 400 drones lançados por Ucrânia. A Força Aérea ucraniana afirmou que as tropas russas lançaram 108 drones durante a noite, sendo que 85 foram interceptados.", "titulo_pt": "Rússia anuncia derrubada de cerca de 400 drones lançados por Ucrânia", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 160243, "titulo": "The New Moscow: A Digital Utopia Doubling as a Surveillance Trap", "url": "https://www.nytimes.com/2026/09/14/world/europe/moscow-russia-putin-digital-surveillance.html", "fonte_id": "nyt_world", "data_pub": "2026-09-14T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As tecnologias de ponta transformaram a capital russa, tornando-a mais segura e conveniente, mas também mais vigiada.", "titulo_pt": "A nova moscou: uma Utopia Digital que serve como armadilha de vigilância", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 160390, "titulo": "Can Sweden restore welfare system amid increased defense spending?", "url": "https://www.france24.com/en/video/20260914-can-sweden-restore-welfare-system-amid-increased-defense-spending", "fonte_id": "france24", "data_pub": "2026-09-14T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As eleições gerais da Suécia parecem indicar que oposição de centro-esquerda terá a chance de formar governo após quatro anos de aliança de centro-direita. Entretanto, as obrigações financeiras internacionais, especialmente o aumento do gasto militar em resposta à entrada da Suécia na OTAN, podem limitar as opções do novo governo.", "titulo_pt": "Suécia pode restaurar seu sistema de bem-estar enquanto aumenta gastos militares?", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 160438, "titulo": "Yemen gov’t forces advance in Taiz as Houthis claim attack on Saudi Arabia", "url": "https://www.aljazeera.com/news/2026/9/14/yemen-govt-forces-advance-in-taiz-as-houthis-claim-attack-on-saudi-arabia?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-14T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças do governo yemenita avançaram na cidade ocidental de Taiz após rechaçar uma ofensiva dos hutitas. Os hutitas afirmaram ter realizado um ataque contra o Reino do Egito, mas isso não consta no relatório original.", "titulo_pt": "Forças do governo yemenita avançam em Taiz enquanto hutitas reivindicam ataque ao reino do egito", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 160391, "titulo": "Centre-left holds narrow lead in knife-edge Sweden vote", "url": "https://www.france24.com/en/video/20260914-centre-left-holds-narrow-lead-in-knife-edge-sweden-vote", "fonte_id": "france24", "data_pub": "2026-09-14T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A oposição centro-esquerda parece ser a formação mais provável do próximo governo na Suécia, com uma vantagem apertada de três cadeiras sobre os partidos de governo da direita, conforme os resultados provisionais da eleição mostram. No entanto, os líderes dos partidos ainda são cautelosos sobre declarar vitória ou derrota, com 353 distritos eleitorais ainda a serem contados e os votos dos eleitores no exterior a serem contabilizados somente na terça-feira.", "titulo_pt": "Centro-esquerda lidera votação apertada na suécia", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 160392, "titulo": "As Yemen conflict intensifies, Iran the winner?", "url": "https://www.france24.com/en/video/20260914-as-yemen-conflict-intensifies-iran-the-winner", "fonte_id": "france24", "data_pub": "2026-09-14T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O conflito no Iêmen intensificou-se com ataques do governo contra rebeldes hutíes apoiados pela Irã ao longo do Mar Vermelho e disparos hutíes em direção à Arábia Saudita, que apoia o governo iemenita. A captura de uma cidade portuária e uma ilha pelo movimento hutí reduziu as linhas de comércio marítimo e aumentou a pressão sobre os preços do petróleo, potencialmente dando ao Irã mais poder na sua disputa com os Estados Unidos.", "titulo_pt": "Conflito no iêmen intensifica-se, com Irã como vencedor?", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 160527, "titulo": "La Finlandia aderirà alla 'deterrenza nucleare avanzata' proposta dalla Francia", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/14/la-finlandia-aderira-alla-deterrenza-nucleare-avanzata-proposta-dalla-francia_8eb892e2-b653-4f56-8952-afbe9e63953f.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-14T09:15:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Finlândia se juntará a uma iniciativa proposta pela França de 'deterrença nuclear avançada'. Agora, dez países europeus já aderiram a esta iniciativa.", "titulo_pt": "Finlândia se juntará à 'deterrença nuclear avançada' proposta pela França", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 160379, "titulo": "2027 presidential election: As France faces populist surge, voters' desire for radical change remains ambiguous", "url": "https://www.lemonde.fr/en/politics/article/2026/09/14/2027-presidential-election-as-france-faces-populist-surge-voters-desire-for-radical-change-remains-ambiguous_6757497_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-14T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As pesquisas indicam que a França está cada vez mais permeada por sentimentos que podem levar a um movimento populista, mas não há garantia de que isso aconteça. Brice Teinturier, vice-diretor geral da Ipsos, baseou-se nas descobertas da primeira pesquisa do Le Monde para fazer essa avaliação.", "titulo_pt": "Eleição presidencial de 2027: França enfrenta onda populista, mas mudança radical não é inevitável", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 160409, "titulo": "Trump urges Ukraine to stop ‘knocking out’ Russian oil refineries as U.S. diesel hits record", "url": "https://www.cnbc.com/2026/09/14/trump-ukraine-russia-diesel-prices-oil.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-14T09:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços do diesel nos Estados Unidos superaram pela primeira vez a marca de $6 por galão devido às tensões na Ucrânia e as relações com a Irã, que estão afetando a segurança da oferta energética global.", "titulo_pt": "Trump pede à Ucrânia para parar de 'derrubar' refinarias de petróleo russas enquanto o diesel americano atinge recorde", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 160528, "titulo": "Parigi, 'attacco al treno puntava a dividere gli alleati di Kiev'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/14/parigi-attacco-al-treno-puntava-a-dividere-gli-alleati-di-kiev_9e818967-1550-40ab-b295-73f2344d3537.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-14T09:10:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Um ataque a um trenino em Paris era uma tentativa de dividir os aliados na região de Kiev, segundo o ministro dos Negócios Estrangeiros da França. O ataque foi considerado inaceitável e teve o objetivo de intimidar os aliados.", "titulo_pt": "Paris, ataque ao trenino visava dividir aliados de Kiev, diz ministro dos EUA", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 160605, "titulo": "POSCO International to raise 532.9 bln won for U.S. shale gas assets", "url": "https://en.yna.co.kr/view/AEN20260914009500320", "fonte_id": "yonhap_news", "data_pub": "2026-09-14T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A POSCO International planeja arrecadar 532,9 bilhões de wones para investir em ativos de gás de xisto nos Estados Unidos. A informação foi divulgada em 14 de setembro pela empresa sediada em Seul.", "titulo_pt": "POSCO International planeja arrecadar 532,9 bilhões de wones para investir em ativos de gás de xisto nos EUA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 160414, "titulo": "Brent crude jumps above $108 after Saudi Arabia shuts down critical pipeline that bypasses Strait of Hormuz", "url": "https://www.cnbc.com/2026/09/13/oil-price-iran-war-strait-hormuz-saudi-pipeline.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-14T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O preço do petróleo Brent subiu acima de 108 dólares após a Arábia Saudita fechar uma linha de transbordo crítica que evita o Estreito de Ormuz. As recentes investidas de grupos militantes apoiados pelo Irã contra a Arábia Saudita têm aumentado a tensão.", "titulo_pt": "Preço do petróleo brent sobe acima de 108 dólares após arábia saudita fechar linha de transbordo crítica", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 160141, "titulo": "Boletim Focus, dados da China, petróleo e mais destaques desta segunda-feira", "url": "https://www.infomoney.com.br/mercados/boletim-focus-petroleo-china-agenda-14092026/", "fonte_id": "infomoney", "data_pub": "2026-09-14T09:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os mercados serão influenciados por informações como o Boletim Focus, dados econômicos da China e a situação do petróleo nesta segunda-feira (14).", "titulo_pt": "Boletim Focus, dados da China, petróleo e outros destaques desta segunda-feira", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 160212, "titulo": "A indústria da reclamação trabalhista", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-industria-da-reclamacao-trabalhista", "fonte_id": "jota", "data_pub": "2026-09-14T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indústria da reclamação trabalhista pune empresas, mas o efeito mais perverso afeta diretamente os trabalhadores.", "titulo_pt": "A indústria da reclamação trabalhista", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 160415, "titulo": "Yen appreciation has carry-trade seekers looking at these two currencies", "url": "https://www.cnbc.com/2026/09/14/yen-strength-carry-trade-cad-yuan.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-14T08:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O fortalecimento do iene tem levado investidores de carry-trade a avaliar outras duas moedas. Essa estratégia envolve a busca por rendimentos maiores em moedas com taxas de juros mais altas, aproveitando o valor do iene como moeda de hedge.", "titulo_pt": "A apreciação do iene está atraiendo investidores de carry-trade para essas duas moedas", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 160213, "titulo": "PNRS mostrou o caminho; falta percorrê-lo por inteiro", "url": "https://www.jota.info/opiniao-e-analise/artigos/pnrs-mostrou-o-caminho-falta-percorre-lo-por-inteiro", "fonte_id": "jota", "data_pub": "2026-09-14T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após 16 anos, o avanço na política de resíduos exige financiar os serviços, valorizar os catadores e gerar energia.", "titulo_pt": "PNRS mostrou o caminho; falta percorrer todo o trajeto", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 160214, "titulo": "Litigiosidade e acesso à Justiça – Parte 3", "url": "https://www.jota.info/opiniao-e-analise/colunas/direito-dos-grupos-vulneraveis/litigiosidade-e-acesso-a-justica-parte-3", "fonte_id": "jota", "data_pub": "2026-09-14T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Este texto aborda como a desigualdade social influencia os resultados dos litígios, determinando quem tende a ganhar e perder nos processos judiciais.", "titulo_pt": "Litigiosidade e acesso à Justiça – Parte 3", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 160215, "titulo": "SICX: Uma terceira modalidade de contratação direta", "url": "https://www.jota.info/opiniao-e-analise/artigos/sicx-uma-terceira-modalidade-de-contratacao-direta", "fonte_id": "jota", "data_pub": "2026-09-14T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Sistema de Compras Expressas (SICX) representa uma nova forma de contratação direta, distinta das modalidades de dispensa e inexigibilidade. Este sistema oferece uma alternativa para a realização de compras sem a necessidade de licitação.", "titulo_pt": "SICX: uma terceira modalidade de contratação direta", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 160129, "titulo": "Agro pode estar deixando pior fase para trás, diz gestora", "url": "https://www.cnnbrasil.com.br/agro/agro-pode-estar-deixando-pior-fase-para-tras-diz-gestora/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-14T08:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A gestora SFA Investimentos observa uma alta de 32% nos preços dos grãos desde a mínima de agosto de 2025, associando este movimento a uma combinação de estoques menores, juros em queda e novas fontes de demanda. Isso sugere que o setor agrícola pode estar deixando uma fase menos favorável para trás.", "titulo_pt": "Agricultura pode estar superando fase difícil, indica gestora", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 160421, "titulo": "U.S. Treasury yields are steady as 10-year closes in on 5% ahead of Fed rates decision", "url": "https://www.cnbc.com/2026/09/14/10-year-us-treasury-is-closing-in-on-5percent.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-14T08:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rendimento da dívida dos Estados Unidos de 10 anos está se aproximando de 5%, um nível não atingido desde outubro de 2023. Estrategistas afirmam que os fatores por trás dos rendimentos mais altos são mais significativos.", "titulo_pt": "Rendimentos da dívida dos EUA de 10 anos se aproximam de 5% antes da decisão da taxa de juros do Fed", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 160132, "titulo": "Treasuries: Entenda como funciona o mercado de títulos públicos dos EUA", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/treasuries-entenda-como-funciona-o-mercado-de-titulos-publicos-dos-eua/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-14T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado de títulos públicos dos Estados Unidos representa cerca de 19% do mercado global de títulos, com títulos com diferentes prazos de vencimento totalizando aproximadamente US$ 30 trilhões.", "titulo_pt": "Entenda como funciona o mercado de títulos públicos dos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 160145, "titulo": "Copom deve cortar juros, mas eleição, El Niño e petróleo travam sinalização do BC", "url": "https://www.infomoney.com.br/economia/copom-corte-juros-selic-incertezas/", "fonte_id": "infomoney", "data_pub": "2026-09-14T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A atividade econômica decelerou e a inflação está se arrefecendo, mas as incertezas políticas, o fenômeno El Niño e as pressões sobre os preços do petróleo estão dificultando a determinação dos próximos movimentos da autoridade monetária. O Copom provavelmente reduzirá os juros, mas as condições atuais estão obscurecendo essa tendência.", "titulo_pt": "Copom deve cortar juros, mas eleição, El Niño e petróleo obscurecem sinalização do BC", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 160607, "titulo": "Arrest warrants sought for 8 petrochemical executives over alleged price fixing", "url": "https://en.yna.co.kr/view/AEN20260914008700315", "fonte_id": "yonhap_news", "data_pub": "2026-09-14T07:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Procuradores solicitaram mandados de prisão para oito executivos da indústria petroquímica suspeitos de fixação de preços. A solicitação foi feita em Seul, Coreia do Sul, em 14 de setembro.", "titulo_pt": "Procuradores pedem mandados de prisão para oito executivos da petroquímica suspeitos de fixação de preços", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 160609, "titulo": "S. Korean won retreats against U.S. dollar ahead of Fed decision", "url": "https://en.yna.co.kr/view/AEN20260914008600320", "fonte_id": "yonhap_news", "data_pub": "2026-09-14T07:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano cedeu valor em relação ao dólar americano antes da decisão do Federal Reserve. A moeda sul-coreana apresentou uma desvalorização em relação ao dólar.", "titulo_pt": "Won sul-coreano cede valor ante dólar antes da decisão do Fed", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 160135, "titulo": "CEO da Yara vê queda na demanda por fertilizante e na produção de alimentos", "url": "https://www.cnnbrasil.com.br/agro/ceo-da-yara-ve-queda-na-demanda-por-fertilizante-e-na-producao-de-alimentos/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-14T07:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da Yara, Svein Tore Holsether, observa uma diminuição na demanda por fertilizantes e na produção de alimentos. Ele alerta que o uso inadequado de nutrientes pode prejudicar a produtividade das lavouras.", "titulo_pt": "CEO da Yara vê redução na demanda por fertilizantes e na produção de alimentos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 160507, "titulo": "Rate increase baked in, attention turns to BOJ’s outlook and mood", "url": "https://www.japantimes.co.jp/business/2026/09/14/markets/nagata-boj-meeting-preview/", "fonte_id": "japan_times", "data_pub": "2026-09-14T06:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A reunião do conselho diretor do Banco do Japão ocorre esta semana e provavelmente resultará na elevação da taxa de juros interbancária não garantida para 1,25%.", "titulo_pt": "Aumento de juros garantido, foco na perspectiva e postura do BOJ", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 160202, "titulo": "Ni construcción en seco ni ladrillo: la nueva tecnología para edificar una casa de 120 m2 en 48 horas", "url": "https://www.lanacion.com.ar/propiedades/construccion-y-diseno/ni-construccion-en-seco-ni-ladrillo-la-nueva-tecnologia-para-edificar-una-casa-de-120-m2-en-48-horas-nid10092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-14T09:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma tecnologia de impressora 3D está sendo utilizada para construir casas em apenas 48 horas, reduzindo os tempos, custos e resíduos gerados durante a obra.", "titulo_pt": "Sem cimento nem tijolo: nova tecnologia para construir casa de 120 m² em 48 horas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 160554, "titulo": "Xi touts Brics cooperation on AI as US titans flag tech risks", "url": "https://www.scmp.com/plus/news/china/diplomacy/article/3367456/xi-touts-brics-cooperation-ai-us-titans-flag-tech-risks?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-14T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Xi Jinping promoveu a visão chinesa sobre inteligência artificial (IA) durante a cúpula anual Brics, buscando apoio dos países do Global South em meio à concorrência tecnológica com os Estados Unidos. China propôs a criação de uma comunidade de IA Brics e convidou os países Brics para se juntarem à nova Organização Mundial de Cooperação em IA.", "titulo_pt": "Xi promove cooperação em IA dos Brics enquanto EUA alertam sobre riscos tecnológicos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 160555, "titulo": "Hong Kong’s iPhone scam: how to protect your credit card from online fraud", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3367443/hong-kongs-iphone-scam-how-protect-your-credit-card-online-fraud?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-14T09:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 700 habitantes de Hong Kong descobriram que suas cartões de crédito foram usados sem autorização para realizar compras de iPhones 18 Pro. Apesar das garantias dos bancos de que os clientes não serão cobrados, o incidente levantou preocupações sobre a segurança dos cartões de crédito.", "titulo_pt": "Fraude com iphone em hong Kong: como proteger seu cartão de crédito de fraudes online", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 160495, "titulo": "Tech stocks fall after big AI groups call for slowdown", "url": "https://www.ft.com/content/aa8a1be7-abe0-44b7-bcd3-31fd0a44de08?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-14T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações de tecnologia caíram no mercado sul-coreano, com o Kospi caindo, e Wall Street também está previsto para abrir em baixa, após grandes grupos de IA chamarem para um enfraquecimento.", "titulo_pt": "Ações de tecnologia caem após grandes grupos de IA pedirem para reduzir o ritmo", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 160559, "titulo": "How an AI plot targeted Malaysia’s elections and exposed deep data risks", "url": "https://www.scmp.com/week-asia/politics/article/3367440/how-ai-plot-targeted-malaysias-elections-and-exposed-deep-data-risks?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-14T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A descoberta de uma plataforma de manipulação eleitoral baseada em IA que alvoou a Malásia ilustra como a tecnologia pode explorar as vulnerabilidades políticas de um país para operações de influência sofisticadas. O uso de milhões de registros de eleitores, contas de mídia social falsas, um site de notícias sintética e dossiês fabricados evidenciaram riscos mais profundos relacionados à segurança de dados e divisões étnicas e religiosas profundamente enraizadas que podem permitir que atores políticos alvejem eleitores.", "titulo_pt": "Como uma plataforma de IA planejada alvejou as eleições da malásia e expôs riscos de dados", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 160621, "titulo": "‘I Like My Big Rat Wife’: Meet the People Using Chatbots to Write Custom Fiction", "url": "https://www.wired.com/story/chatbot-generated-fiction-i-like-my-big-rat-wife/", "fonte_id": "wired", "data_pub": "2026-09-14T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitos leitores estão utilizando chatbots para criar ficção personalizada, enquanto o setor editorial se preocupa com como os autores estão usando a inteligência artificial.", "titulo_pt": "Gostaria da minha esposa gorda e grande: conheça as pessoas usando Chatbots para escrever ficção personalizada", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 160408, "titulo": "OpenAI boss Sam Altman spells out how and why the AI industry wants to slow down: 'We could lose control'", "url": "https://www.cnbc.com/2026/09/14/sam-altman-ai-slowdown-anthropic-amodei-musk.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-14T08:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sam Altman, CEO da OpenAI, discursou sobre como e por que a indústria de IA deseja diminuir o ritmo, sugerindo a necessidade de frameworks de segurança de IA. Essa medida visa evitar que a indústria perca o controle sobre o desenvolvimento das tecnologias de inteligência artificial.", "titulo_pt": "Ceo da openai explica como e por que a indústria quer diminuir o ritmo do desenvolvimento de IA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 160501, "titulo": "Beijing launches drone buyback in crackdown after Citic Tower crash", "url": "https://www.ft.com/content/8ec31da9-9922-44e2-98c2-3225c9eb0e21?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-14T08:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Beijing anunciou um programa de devolução de drones após um acidente envolvendo um avião leve e um dos prédios mais altos do país. Este anúncio ocorreu meses após o incidente no Citic Tower.", "titulo_pt": "Pequim lança programa de devolução de drones após colisão com torre", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 160585, "titulo": "Korea’s answer to teen digital addiction? A ‘teen-only smartphone’", "url": "https://www.koreaherald.com/article/10873088", "fonte_id": "korea_herald", "data_pub": "2026-09-14T08:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro da Educação da Coreia do Sul, Choi Kyo-jin, anunciou a criação de uma unidade dentro do ministério para explorar a possibilidade de desenvolver um smartphone dedicado para adolescentes, em resposta às preocupações sobre a dependência digital entre crianças. A decisão visa promover discussões públicas antes do lançamento desse dispositivo.", "titulo_pt": "Coreia do sul planeja smartphone dedicado para adolescentes para combater adição digital", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 160216, "titulo": "A espiral da conexão humana: dos primórdios à advocacia pública na IA", "url": "https://www.jota.info/opiniao-e-analise/colunas/advogadas-publicas-em-debate/a-espiral-da-conexao-humana-dos-primordios-a-advocacia-publica-na-ia", "fonte_id": "jota", "data_pub": "2026-09-14T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A regulamentação da inteligência artificial na Advocacia Pública busca recuperar a presença e o diálogo humanos. O texto explora como a regulação visa preservar elementos essenciais da prática jurídica.", "titulo_pt": "A espiral da conexão humana: dos primórdios à advocacia pública na IA", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 160217, "titulo": "A advocacia e o valor da imperfeição", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-advocacia-e-o-valor-da-imperfeicao", "fonte_id": "jota", "data_pub": "2026-09-14T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O receio de cometer erros pode limitar a criatividade na advocacia e afetar a prática jurídica. O texto argumenta que essa preocupação excessiva pode empobrecer a profissão.", "titulo_pt": "Advocacia e o valor da imperfeição", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 160277, "titulo": "AI-linked stocks fall after tech bosses call for slowdown in ‘reckless’ development", "url": "https://www.theguardian.com/business/2026/sep/14/ai-linked-stocks-fall-tech-bosses-call-slowdown-anthropic-openai", "fonte_id": "guardian_world", "data_pub": "2026-09-14T07:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ações de empresas tecnológicas caíram em toda a Ásia, com o Nasdaq também provavelmente a baixar, após líderes de empresas como Anthropic, OpenAI e SpaceX chamarem para um freio na 'desenvolvimento imprudente' devido a preocupações de que a tecnologia possa sair de controle. A SoftBank, investidora japonesa que apoia o OpenAI, viu suas ações cair 13%.", "titulo_pt": "Ações de tecnologia caem após líderes pedirem freio no 'desenvolvimento imprudente'", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 160093, "titulo": "Podemos perder o controle para a IA se corrida superar segurança, diz CEO da OpenAI", "url": "https://exame.com/inteligencia-artificial/podemos-perder-o-controle-para-a-ia-se-corrida-superar-seguranca-diz-ceo-da-openai/", "fonte_id": "exame", "data_pub": "2026-09-14T06:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sam Altman, CEO da OpenAI, alerta para o risco de perder o controle para a inteligência artificial (IA) se a corrida tecnológica ultrapassar a segurança. Ele também menciona a concentração excessiva de poder como outro cenário a ser evitado pela indústria.", "titulo_pt": "Podemos perder o controle para a IA se corrida superar segurança, avisa CEO da OpenAI", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 160619, "titulo": "Lee, ADB chief agree to boost cooperation on critical minerals, AI", "url": "https://en.yna.co.kr/view/AEN20260914006600315", "fonte_id": "yonhap_news", "data_pub": "2026-09-14T06:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sul-coreano Lee Jae Myung e o chefe do Banco Asiático de Desenvolvimento concordaram em aumentar a cooperação em relação a minérios críticos e inteligência artificial.", "titulo_pt": "Lee e chefe do ADB concordam em aumentar cooperação em minérios críticos e AI", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 160620, "titulo": "Science minister eyes more partnerships in AI, science with Central Asia", "url": "https://en.yna.co.kr/view/AEN20260914006700320", "fonte_id": "yonhap_news", "data_pub": "2026-09-14T06:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro da Ciência, Bae Kyung-hoon, expressou interesse em estabelecer mais parcerias em inteligência artificial e ciência com o Central Asia durante uma reunião ministerial.", "titulo_pt": "Ministro de ciência planeja mais parcerias em IA e ciência com o Central Asia", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 160496, "titulo": "Can AI’s leaders really put aside rivalry for the common good?", "url": "https://www.ft.com/content/b3d01493-f0f5-491b-bcf8-2d414539fbe7?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-14T06:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A profunda divisão entre OpenAI e Anthropic levou a uma dinâmica de corrida em direção a modelos cada vez mais poderosos.", "titulo_pt": "Os líderes da IA realmente podem colocar de lado a rivalidade pelo bem comum?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 160179, "titulo": "Fueron descubiertos a comienzos del siglo XX y sobrevivieron a la caza furtiva, la tala y las guerras civiles: la difícil historia del gorila de montaña", "url": "https://www.clarin.com/internacional/descubiertos-comienzos-siglo-xx-sobrevivieron-caza-furtiva-tala-guerras-civiles-dificil-historia-gorila-montana_0_tc1a7YZQ0H.html", "fonte_id": "clarin", "data_pub": "2026-09-14T09:15:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Atualmente, restam cerca de 1.000 indivíduos do gorila de montanha em estado silvestre, distribuídos em duas populações na África Central. Os esforços de conservação conseguiram inverter o declínio populacional e, nas últimas décadas, a população começou a se recuperar.", "titulo_pt": "Gorilas de montanha: história difícil e recuperação recente", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 160001, "titulo": "Chineses encontram mais pistas de misteriosos humanos ancestrais", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/chineses-encontram-mais-pistas-de-misteriosos-humanos-ancestrais.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-14T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Novas descobertas arqueológicas no sudoeste da China podem contribuir para esclarecer o mistério em torno dos denisovanos, ancestrais menos conhecidos da humanidade moderna. Essas descobertas podem ajudar a elucidar mais sobre essa espécie.", "titulo_pt": "Chineses encontram mais pistas dos misteriosos humanos ancestrais denisovanos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 160657, "titulo": "Improved climate forecasts alone won't protect Africa's poorest farmers", "url": "https://phys.org/news/2026-09-climate-wont-africa-poorest-farmers.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo conduzido por uma equipe internacional de pesquisadores, liderada pela Universidade de Sydney e pela Imperial College London, descobriu que, à medida que a África se prepara para um poderoso evento El Niño, a disponibilidade de previsões climáticas melhoradas não será suficiente para proteger muitos dos agricultores de gado mais pobres da região das consequências do aquecimento global.", "titulo_pt": "Melhores previsões climáticas sozinhas não protegerão os agricultores de gado mais pobres da áfrica contra as mudanças climáticas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 160627, "titulo": "STAT+: What’s in a name? Novo looks to a rebrand", "url": "https://www.statnews.com/2026/09/14/novo-nordisk-company-rebrand-obesity-diabetes/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-14T08:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novo Nordisk agora opera sob o nome de Novo, em um rebranding que a empresa espera que indique um futuro mais focado e competitivo.", "titulo_pt": "O que importa no nome? Novo busca uma rebranding", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 160629, "titulo": "Opinion: Restoring public trust in science doesn’t have a simple solution. That’s OK", "url": "https://www.statnews.com/2026/09/14/trust-in-science-academia-research-communication-listening/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-14T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A comunicação não pode substituir a infraestrutura relacional necessária para construir e manter a confiança no cientista Michelle Groman e Caroline Montojo afirmam.", "titulo_pt": "Opinião: restaurar a confiança do público na ciência não tem uma solução simples. E isso está bem.", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 160630, "titulo": "The GOP’s $50 billion rural health fund is coming up short, hospital leaders say", "url": "https://www.statnews.com/2026/09/14/rural-health-transformation-fund-skepticism-shortcomings-part-5-unraveled-series/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-14T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hospital líderes estavam entusiasmados com o Fundo de Transformação da Saúde Rural até que leram as condições. O fundo, que prometia 50 bilhões de dólares, está apresentando problemas financeiros, segundo líderes hospitalares.", "titulo_pt": "Fundos do GOP para saúde rural não atingem as expectativas, dizem líderes hospitalares", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 160562, "titulo": "China’s self-powered neural device helps stroke survivors walk naturally", "url": "https://www.scmp.com/news/china/science/article/3367424/chinas-self-powered-neural-device-helps-stroke-survivors-walk-naturally?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-14T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas desenvolveram um dispositivo neural leve e sem bateria que pode ajudar a melhorar a mobilidade de pessoas com dificuldade de caminhar, como sobreviventes de AVC. O prótese neural utiliza a energia gerada pelos movimentos do portador para estimular elétricamente os músculos, auxiliando na flexão do tornozelo e na restauração do caminhar natural.", "titulo_pt": "Dispositivo neural autossustentado ajuda sobreviventes de avc a caminharem naturalmente", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 160694, "titulo": "The cosmic coincidences that made our universe – and us – possible", "url": "https://www.newscientist.com/article/2588854-the-cosmic-coincidences-that-made-our-universe-and-us-possible/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-14T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A posição da Lua e do Sol é perfeita para observarmos totais de eclipses solares, e a composição do universo é adequada para a existência da vida. A colunista Leah Crane questiona se essas condições podem ser consideradas apenas coincidências.", "titulo_pt": "As coincidências cósmicas que tornaram possível nossa universo e nós", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 160658, "titulo": "Japan's biomass energy boom threatens further deforestation in Indonesia", "url": "https://phys.org/news/2026-09-japan-biomass-energy-boom-threatens.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T07:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A produção de pellets de madeira e chipsets na Indonésia está aumentando, levando a uma nova onda de desmatamento, ameaçando as florestas tropicais restantes do arquipélago, os pontos quentes de biodiversidade e o território dos povos indígenas.", "titulo_pt": "A expansão da energia biomassa na indonésia ameaça mais desmatamento", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 160101, "titulo": "Túmulo intacto com 38 pessoas revela 'segredos' de antiga elite no Peru", "url": "https://exame.com/ciencia/tumulo-intacto-com-38-pessoas-revela-segredos-de-antiga-elite-no-peru/", "fonte_id": "exame", "data_pub": "2026-09-14T05:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um túmulo intacto há cerca de 600 anos foi descoberto no Peru, contendo 38 pessoas e objetos como armas e ornamentos. O enterro incomum pode estar relacionado a um ritual sacrificial.", "titulo_pt": "Túmulo intacto com 38 pessoas revela 'segredos' de antiga elite no Peru", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 160107, "titulo": "Estudo com mil ossos humanos revela canibalismo e rituais macabros na Espanha", "url": "https://exame.com/ciencia/estudo-com-mil-ossos-humanos-revela-canibalismo-e-rituais-macabros-na-espanha/", "fonte_id": "exame", "data_pub": "2026-09-14T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo em três cavernas neolíticas na Espanha analisou mil ossos humanos e revelou práticas canibais e rituais macabros, incluindo crânios usados como copos e restos de ossos fervidos. Essas práticas variavam entre massacres violentos e oferendas simbólicas.", "titulo_pt": "Estudo com mil ossos humanos revela canibalismo e rituais macabros na Espanha", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 160572, "titulo": "Data from Greater Bay Area’s 88 million residents to help improve healthcare policy: GSK", "url": "https://www.scmp.com/business/companies/article/3367404/data-greater-bay-areas-88-million-residents-help-improve-healthcare-policy-gsk?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-14T04:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa farmacêutica britânica GSK está utilizando dados de pacientes dos 88 milhões de habitantes das 11 cidades da Região da Baía Grande para acelerar o desenvolvimento de vacinas e terapias contra o câncer. Os dados podem suportar solicitações regulatórias e expansões de rótulos, além de ajudar a descobrir benefícios adicionais.", "titulo_pt": "Dados dos 88 milhões de habitantes da região da baía grande serão usados para acelerar o desenvolvimento de medicamentos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 160109, "titulo": "Lua pode ter se formado em apenas 5 horas após colisão com a Terra", "url": "https://exame.com/ciencia/lua-pode-ter-se-formado-em-apenas-5-horas-apos-colisao-com-a-terra/", "fonte_id": "exame", "data_pub": "2026-09-14T04:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Lua pode ter se formado em apenas 5 horas após uma colisão com a Terra, desafiando a teoria de que ela se formou gradualmente a partir de detritos espaciais. Impacto gigante com Theia pode ter produzido um satélite praticamente intacto.", "titulo_pt": "Lua pode ter se formado em apenas 5 horas após colisão com a Terra", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 160664, "titulo": "APOD: 2026 September 14 – Where Your Elements Came From", "url": "https://science.nasa.gov/image-article/apod-2026-september-14-where-your-elements-came-from/", "fonte_id": "nasa_news", "data_pub": "2026-09-14T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da astronomia (APOD) de 14 de setembro de 2026 explica a origem dos elementos químicos na Universidade. O conteúdo aborda como esses elementos foram formados ao longo do tempo.", "titulo_pt": "Onde vieram os seus elementos?", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 160659, "titulo": "No cities on the moon—there isn't enough water, scientists say", "url": "https://phys.org/news/2026-09-cities-moon-isnt-scientists.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A descoberta de água em crateras sombrias no polo lunar tem levado a uma corrida para estabelecer bases na lua, seguida por vilas, cidades e indústria pesada. No entanto, os cientistas questionam a sustentabilidade dessa corrida.", "titulo_pt": "Nem cidades na lua—cientistas dizem que não há água suficiente", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 160665, "titulo": "An Early Look at Fall Color in Canada", "url": "https://science.nasa.gov/earth/earth-observatory/an-early-look-at-fall-color-in-canada/", "fonte_id": "nasa_news", "data_pub": "2026-09-14T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cores vermelhas, amarelas e laranjas já estão espalhando-se pelos paisagens da tundra em Nunavut.", "titulo_pt": "Uma visão antecipada das cores de outono no canadá", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 160693, "titulo": "Good Muslim Artist, Bad Muslim Artist", "url": "https://hyperallergic.com/good-muslim-artist-bad-muslim-artist/", "fonte_id": "hyperallergic", "data_pub": "2026-09-14T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Naeem Mohaiemen reflete sobre o dia dos ataques, Channelle Chevelle Russel revisa Pope.L, e o Brooklyn recebe uma biblioteca de suprimentos de artesanato.", "titulo_pt": "Bom artista muçulmano, má artista muçulmana", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 160720, "titulo": "Children of the Wolf", "url": "https://lithub.com/children-of-the-wolf/", "fonte_id": "lithub", "data_pub": "2026-09-14T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor descendente de vikings tem linhagem paterna que remonta a Erik o Vermelho, o primeiro europeu a chegar à América do Norte. Sua família exilou Erik devido à sua brutalidade e impulsividade.", "titulo_pt": "Filhos do loup", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 160197, "titulo": "Platón, filósofo griego: “la verdadera libertad consiste en escapar de la caverna de la ignorancia y atreverse a buscar y a vivir de acuerdo con la verdad. y su relación con la moda”", "url": "https://www.lanacion.com.ar/salud/mente/platon-filosofo-griego-la-verdadera-libertad-consiste-en-escapar-de-la-caverna-de-la-ignorancia-y-nid13092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-14T09:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Platão, filósofo grego, ensinou que a verdadeira liberdade consiste em sair da caverna da ignorância e viver de acordo com a verdade. Suas reflexões sobre beleza e estética ainda são relevantes hoje.", "titulo_pt": "Platão, filósofo grego: a verdadeira liberdade e sua relação com a moda", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 160201, "titulo": "Visita a Gregg Sauder: el último invento del hombre que resuelve los cuellos de botella de la agricultura moderna", "url": "https://www.lanacion.com.ar/economia/campo/agricultura/visita-a-gregg-sauder-el-ultimo-invento-del-hombre-que-resuelve-los-cuellos-de-botella-de-la-nid14092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-14T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A empresa de um agricultor de Illinois, Estados Unidos, que desenvolveu a Precision Planting, introduziu recentemente uma máquina autônoma que aplica água e nutrientes em uma faixa estreita ao longo da linha de sowing. Este inovador equipamento representa um avanço significativo na resolução de gargalos na agricultura moderna.", "titulo_pt": "Visita a Gregg Sauder: o último invento do homem que resolve os gargalos da agricultura moderna", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 160204, "titulo": "Los expertos en psicología coinciden: quienes pintan la habitación de celeste, rosa o blanco logran un estado de calma y tranquilidad en el descanso"
