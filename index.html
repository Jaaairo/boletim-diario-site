day becomes the latest publisher to sue OpenAI", "url": "https://www.theverge.com/ai-artificial-intelligence/1008198/usa-today-openai-copyright-lawsuit", "fonte_id": "the_verge", "data_pub": "2026-10-08T17:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "USA Today, junto com vários jornais locais que ele detém, está processando a OpenAI por supostamente ter copiado 'centenas de milhares' de artigos para treinar seus modelos de inteligência artificial, reivindicando danos superiores a 250 milhões de dólares. A publicadora acusa a OpenAI de uso não autorizado dos seus conteúdos.", "titulo_pt": "USA Today processa OpenAI por suposto uso não autorizado de artigos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 203615, "titulo": "SpaceXAI backs Omarchy, the controversial Linux distro, with $1.5 million in compute", "url": "https://www.theverge.com/tech/1008148/spacexai-omarchy-grok-david-heinemeier-hansson", "fonte_id": "the_verge", "data_pub": "2026-10-08T17:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SpaceXAI, uma empresa associada a Elon Musk, contribuiu com $1,5 milhão em tokens Grok para o projeto Linux Omarchy, através da Omacom Foundation, que administra o sistema operacional.", "titulo_pt": "Spacexai apoia Omarchy, distribuição Linux controversa, com $1,5 milhão", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 203338, "titulo": "Trump: Anyone saying \"AI\" is \"THE ENEMY!\" The White House uses it", "url": "https://www.axios.com/2026/10/08/trump-ai-super-intelligence-white-house", "fonte_id": "axios", "data_pub": "2026-10-08T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, criticou aqueles que usam o termo 'Inteligência Artificial' (IA) em vez de 'Super Inteligência'. Simultaneamente, o governo federal continua utilizando o termo IA.", "titulo_pt": "Trump: qualquer um que diga 'IA' é 'o inemigo!' O palácio vermelho usa o termo", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 203518, "titulo": "OpenAI annualised revenues $20bn less than previously signalled", "url": "https://www.ft.com/content/b66a9858-f8fb-46cb-b506-44bfe26fca2a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-08T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI informou recentemente aos investidores que a receita anualizada estava se aproximando dos 20 bilhões de dólares, muito menos do que os 50 bilhões de dólares que haviam sido anteriormente sinalizados. A empresa também indicou que a receita era significativamente menor do que os 70 bilhões de dólares que eram amplamente divulgados.", "titulo_pt": "Receitas anuais da openai são 20 bilhões de dólares menores do que anteriormente sinalizadas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 202997, "titulo": "Uso de IA pode ajudar empresas a ganhar produtividade e reduzir custos", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/uso-de-ia-pode-ajudar-empresas-a-ganhar-produtividade-e-reduzir-custos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T17:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A utilização de inteligência artificial pode auxiliar empresas a aumentar a produtividade e reduzir custos. Tecnologias existentes permitem que pequenos e médios negócios automatizem tarefas e ampliem suas operações.", "titulo_pt": "Uso de IA pode ajudar empresas a ganhar produtividade e reduzir custos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 202925, "titulo": "Einstein é vítima de ataque cibernético, mas dados de pacientes não vazaram, informa hospital", "url": "https://veja.abril.com.br/saude/einstein-e-vitima-de-ataque-cibernetico-mas-dados-de-pacientes-nao-vazaram-informa-hospital/", "fonte_id": "veja", "data_pub": "2026-10-08T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um hospital informou que Einstein sofreu um ataque cibernético em 4 de agosto, mas os dados dos pacientes não foram vazados. Os pacientes afetados foram notificados por e-mail e o caso está em apuração.", "titulo_pt": "Einstein sofre ataque cibernético, mas dados dos pacientes não vazaram, informa hospital", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 203617, "titulo": "Anthropic bans ‘abusive or cruel behavior’ toward Claude", "url": "https://www.theverge.com/ai-artificial-intelligence/1008100/anthropic-new-usage-policy-abuse-claude", "fonte_id": "the_verge", "data_pub": "2026-10-08T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic está implementando mudanças em sua política de uso após um ano, incluindo proibir comportamento abusivo e cruel persistente em relação ao Claude. As alterações refletem casos de má utilização recentes e de alto risco, como interferência nas eleições, desenvolvimento de armas, vigilância e uso em saúde e finanças.", "titulo_pt": "Anthropic proíbe comportamento abusivo e cruel em relação ao Claude", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 203618, "titulo": "Trump administration says Microsoft ‘abused’ worker visa program and is cutting off access", "url": "https://www.theverge.com/policy/1008115/trump-microsoft-worker-visa-program-vance", "fonte_id": "the_verge", "data_pub": "2026-10-08T16:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump está suspendendo, incluindo a Microsoft, o acesso a um programa de imigração que permite que as empresas contratem trabalhadores estrangeiros que podem residir permanentemente nos EUA. Segundo o vice-presidente JD Vance, o programa de certificação de mão-de-obra permanente foi abusado.", "titulo_pt": "Governo trump suspende acesso de empresas, incluindo Microsoft, a programa de imigração", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 203619, "titulo": "New York accuses TikTok of serving users ‘placebo’ safety features", "url": "https://www.theverge.com/tech/1008112/new-york-tiktok-lawsuit-placebo-safety-features", "fonte_id": "the_verge", "data_pub": "2026-10-08T16:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nova York acusa TikTok de fornecer a milhares de usuários, incluindo crianças e adolescentes, versões 'fantasmas' de suas funcionalidades de segurança, em vez das versões funcionais. O estado apresentou uma nova versão do processo de 2024 contra a empresa, que foi posteriormente desbloqueado por um juiz.", "titulo_pt": "Nova York acusa TikTok de fornecer 'fantasmas' de funcionalidades de segurança", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 203620, "titulo": "Are you ready for everything to look like TikTok?", "url": "https://www.theverge.com/tech/1006069/instagram-facebook-full-screen-reels-test-tiktok", "fonte_id": "the_verge", "data_pub": "2026-10-08T16:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde que o TikTok se tornou amplamente conhecido, muitas plataformas de vídeo foram comparadas a ele, incluindo YouTube Shorts, Instagram Reels, Netflix's Clips e outras como Triller, Zynn e Byte. A Meta tem investido significativamente em vídeos para os feeds de seus aplicativos, em busca de replicar o sucesso do TikTok há vários anos.", "titulo_pt": "Você está pronto para tudo parecer como o TikTok?", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 203624, "titulo": "A startup founder who served time in prison is looking to court an untapped market: ex-cons", "url": "https://techcrunch.com/2026/10/08/a-startup-founder-who-served-time-in-prison-is-looking-to-court-an-untapped-market-ex-cons/", "fonte_id": "techcrunch", "data_pub": "2026-10-08T16:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Richard Bronson, ex-parceiro da Stratton Oakmont que cumpriu pena por violações de valores mobiliários, lançou o Commissary Club, uma startup que utiliza inteligência artificial para auxiliar ex-presidiários na busca por emprego, moradia, comunidade e até mesmo encontros amorosos.", "titulo_pt": "Empreendedor que cumpriu pena busca mercado de ex-presidiários", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 203622, "titulo": "Apple announces surprise ‘Welcome home’ launch event", "url": "https://www.theverge.com/news/1008039/apple-smart-home-event-october-13th", "fonte_id": "the_verge", "data_pub": "2026-10-08T16:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apple anunciou um novo evento para outubro, que ocorrerá em Nova York no dia 13 de outubro às 9h horário doeste. A empresa está rumoreada para lançar produtos focados em casa inteligente nesse evento, com o mote 'Welcome home'.", "titulo_pt": "Apple anuncia surpresa 'Welcome home' em evento de outubro", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 203723, "titulo": "AI or ‘super intelligence’? Trump isn’t the only one who is confused", "url": "https://www.newscientist.com/article/2592404-ai-or-super-intelligence-trump-isnt-the-only-one-who-is-confused/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-08T16:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, sugeriu que a inteligência artificial deve ser chamada de 'super inteligência'. Um colunista, Jacob Aron, explora a origem do termo e discute se suas múltiplas definições históricas ainda são relevantes atualmente.", "titulo_pt": "AI ou 'super inteligência'? Trump não é o único confuso", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 202893, "titulo": "Ataque com IA atinge 9 bancos e vaza dados de 25 mil pessoas na Coreia do Sul", "url": "https://www.cartacapital.com.br/tecnologia/ataque-com-ia-atinge-9-bancos-e-vaza-dados-de-25-mil-pessoas-na-coreia-do-sul/", "fonte_id": "cartacapital", "data_pub": "2026-10-08T16:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um hacker chinês de 26 anos usou inteligência artificial para atacar nove bancos na Coreia do Sul, vazando dados de 25 mil pessoas. A empresa Crowdstrike afirmou ter identificado a origem do ataque.", "titulo_pt": "Ataque com IA atinge nove bancos e vaza dados de 25 mil pessoas na Coreia do Sul", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 203555, "titulo": "US suspends Microsoft, major IT firms from green card programme", "url": "https://www.scmp.com/news/world/united-states-canada/article/3370230/us-suspends-microsoft-major-it-firms-green-card-programme?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-08T15:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos suspendeu Microsoft, Adobe e várias grandes empresas de tecnologia de um programa que permite a estrangeiros altamente qualificados obterem residência permanente nos Estados Unidos, devido a supostas fraudes. Esta medida faz parte de uma iniciativa para incentivar as empresas a contratarem mais cidadãos americanos.", "titulo_pt": "EUA suspende Microsoft e grandes empresas de ti do programa de green card", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 203623, "titulo": "Google’s AI note-taking app transcribes your meetings completely offline", "url": "https://www.theverge.com/tech/1007985/google-ai-notetaking-app-transcribe-offline", "fonte_id": "the_verge", "data_pub": "2026-10-08T15:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google lançou uma aplicação experimental de anotação de áudio que transcreve reuniões e arquivos de áudio completamente offline. O aplicativo, chamado Google AI Edge Foresight, utiliza um modelo de inteligência artificial local chamado EmbeddingGemma 2 e pode ser usado gratuitamente no macOS.", "titulo_pt": "Google libera aplicativo experimental de anotação de áudio que transcreve offline", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 203177, "titulo": "Radar LT | Estudio revela que la forma de hablar puede entregar señales de envejecimiento cerebral y demencia", "url": "https://www.latercera.com/videos/noticia/radar-lt-estudio-revela-que-la-forma-de-hablar-puede-entregar-senales-de-envejecimiento-cerebral-y-demencia/", "fonte_id": "la_tercera", "data_pub": "2026-10-08T17:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo realizado em cinco países latinoamericanos, incluindo o Chile, desenvolveu um modelo de inteligência artificial que analisa o modo de falar para identificar sinais de envelhecimento cerebral, deterioro cognitivo e demência.", "titulo_pt": "Estudo revela que o jeito de falar pode indicar sinais de envelhecimento cerebral e demência", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 203659, "titulo": "'Move away' and 'stop that!' Wild elephants use a rich gestural repertoire intentionally to 'mean business'", "url": "https://phys.org/news/2026-10-wild-elephants-rich-gestural-repertoire.html", "fonte_id": "phys_org", "data_pub": "2026-10-08T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores internacionais, incluindo cientistas da Universidade de Portsmouth, da Universidade de Viena e da Universidade de St Andrews, descobriram que elefantes selvagens da savana africana usam uma ampla gama de gestos quando competem entre si.", "titulo_pt": "‘Mova-se’ e ‘pare isso!’: elefantes selvagens usam uma rica repertórios gestuais intencionalmente para ‘negociar’", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 203660, "titulo": "AI tool makes culturally appropriate lessons for teachers in India", "url": "https://phys.org/news/2026-10-ai-tool-culturally-lessons-teachers.html", "fonte_id": "phys_org", "data_pub": "2026-10-08T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um assistente de inteligência artificial chamado Shiksha Copilot está sendo usado em escolas no sul da Índia para criar planos de aula relevantes culturalmente, ajudando professores sobrecarregados com poucos recursos.", "titulo_pt": "Ferramenta de IA desenvolve aulas adaptadas culturalmente para professores na Índia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 203661, "titulo": "Rare traces of wooden tools reveal Neanderthals were skilled woodworkers", "url": "https://phys.org/news/2026-10-rare-wooden-tools-reveal-neanderthals.html", "fonte_id": "phys_org", "data_pub": "2026-10-08T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A descoberta de um artefato parecido com um bastão e outras ferramentas de madeira em um sítio arqueológico perto de Barcelona, Espanha, fornece evidências adicionais de que os neandertais podem ter sido habilidosos trabalhadores de madeira. Essa descoberta sugere que eles eram mais complexos do que se pensava anteriormente.", "titulo_pt": "Raros vestígios de ferramentas de madeira indicam que neandertais eram habilidosos trabalhadores de madeira", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 203662, "titulo": "All-electrical imaging offers innovative alternative for tracking cell movement", "url": "https://phys.org/news/2026-10-electrical-imaging-alternative-tracking-cell.html", "fonte_id": "phys_org", "data_pub": "2026-10-08T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Engenheiros da Brown University desenvolveram uma nova técnica de imagens que permite monitorar o movimento celular de forma elétrica, contribuindo para o entendimento de processos cruciais como a metástase do câncer, a cicatrização de feridas e a resposta imune.", "titulo_pt": "Imagem elétrica oferece alternativa inovadora para rastrear o movimento de células", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 203663, "titulo": "Patience is a lucrative virtue for entrepreneurs, new research finds", "url": "https://phys.org/news/2026-10-patience-lucrative-virtue-entrepreneurs.html", "fonte_id": "phys_org", "data_pub": "2026-10-08T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pessoas mais pacientes têm maior probabilidade de se tornarem empreendedores e ganharem mais uma vez que fazem isso, conforme mostrou uma nova pesquisa da Escola de Administração da Universidade de Bath. Os pesquisadores analisaram dados de mais de 21.000 empregados do Reino Unido entre 2009 e 2023 e constataram que os indivíduos mais pacientes tinham cerca de 50% mais chances de se tornarem empreendedores em relação aos menos pacientes.", "titulo_pt": "Paciência é uma virtude lucrativa para empreendedores, novo estudo mostra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 202993, "titulo": "OMS não recomenda uso de remédio e cirurgia para tratar obesidade infantil", "url": "https://www.cnnbrasil.com.br/saude/oms-nao-recomenda-uso-de-remedio-e-cirurgia-para-tratar-obesidade-infantil/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T17:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Organização Mundial da Saúde (OMS) não recomenda o uso de medicamentos e cirurgias para tratar a obesidade infantil em crianças menores de 10 anos. O guia da OMS, lançado na última quarta-feira, sugere mudanças na alimentação e exercícios físicos como principais abordagens para prevenir a doença.", "titulo_pt": "OMS não recomenda medicamentos e cirurgias para tratar obesidade infantil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 203706, "titulo": "NASA’s SpaceX Crew‑12 Splashes Down, Sets Briefing to Discuss Mission", "url": "https://www.nasa.gov/news-release/nasas-spacex-crew-12-splashes-down-sets-briefing-to-discuss-mission/", "fonte_id": "nasa_news", "data_pub": "2026-10-08T17:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A missão SpaceX Crew-12, que durou mais de sete meses a bordo da Estação Espacial Internacional, pousou com segurança no Oceano Pacífico, perto da costa de Los Angeles. Os tripulantes farão uma conferência de imprensa para discutir sua missão científica às 15:30 de quinta-feira, 15 de outubro, no Centro Espacial Johnson, em Houston.", "titulo_pt": "Nasa’s SpaceX Crew-12 desembarca com segurança, agendando conferência de imprensa", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 203006, "titulo": "Estudo indica que jejum universal para exames de sangue é desnecessário", "url": "https://www.cnnbrasil.com.br/saude/estudo-indica-que-jejum-universal-para-exames-de-sangue-e-desnecessario/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T16:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo com mais de cem mil pacientes mostrou que a restrição alimentar excessiva antes de exames de sangue não melhora a precisão diagnóstica e causa desconforto desnecessário.", "titulo_pt": "Estudo indica que jejum universal para exames de sangue é desnecessário", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 202834, "titulo": "Com a IA, o matemático passará de explorador a turista", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/com-a-ia-o-matematico-passara-de-explorador-a-turista.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-08T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 1993, Andrew Wiles anunciou a solução do Último Teorema de Fermat, um problema que desafiou matemáticos por mais de três séculos. A conquista foi celebrada com champanhe e cobertura na primeira página do The New York Times.", "titulo_pt": "Com a IA, o matemático passará de explorador a turista", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 203707, "titulo": "NASA, Energy Department Advance New Era of Nuclear-Powered Exploration", "url": "https://www.nasa.gov/news-release/nasa-energy-department-advance-new-era-of-nuclear-powered-exploration/", "fonte_id": "nasa_news", "data_pub": "2026-10-08T15:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "NASA e o Departamento de Energia dos EUA estão avançando no desenvolvimento de tecnologias nucleares seguras e confiáveis para exploração espacial. Essas tecnologias serão usadas para acelerar a exploração civil espacial, realizar descobertas científicas ousadas e reafirmar a liderança americana em poder e propulsão nuclear espacial.", "titulo_pt": "NASA e departamento de energia avançam nova Era de exploração espacial nucleada", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 203684, "titulo": "STAT+: AI for breast cancer risk prediction goes DTC, regulatory cloud over Utah sandbox, and AI psychosis", "url": "https://www.statnews.com/2026/10/08/breast-cancer-ai-goes-dtc-utah-sandbox-ai-psychosis-health-tech/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-08T15:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma startup está levando seu algoritmo de previsão do risco de câncer de mama diretamente aos pacientes. O texto também menciona problemas regulatórios em um sandbox de Utah e um caso de psicose relacionada à inteligência artificial.", "titulo_pt": "IA para previsão do risco de câncer de mama vai direto ao consumidor, problemas regulatórios em Utah e psicose por IA", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 203685, "titulo": "STAT+: The fresh faces that may shake up key Senate committees ahead of midterms", "url": "https://www.statnews.com/2026/10/08/health-policy-news-fresh-faces-shake-up-senate-committees-2026-midterms/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-08T15:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias dezenas de democratas estão concorrendo a vagas nos comitês de Energia e Comércio e de Meios de Pagamento da Câmara dos Representantes, com vários membros de ambas as legendas deixando suas posições ou concorrendo em eleições próximas.", "titulo_pt": "Novos rostos que podem abalar os principais comitês do senado nas eleições de meios", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 203708, "titulo": "NASA Advances LISA Mission Contributions With New Test Telescope", "url": "https://science.nasa.gov/missions/lisa/nasa-advances-lisa-mission-contributions-with-new-test-telescope/", "fonte_id": "nasa_news", "data_pub": "2026-10-08T15:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA avançou no desenvolvimento de um novo telescópio todo de vidro para a missão LISA, uma observatória espacial projetada para detectar ondas gravitacionais. A L3Harris Technologies será responsável pela concepção, montagem e integração desse telescópio de teste chamado Engineering Test Unit (ETU).", "titulo_pt": "NASA avança na missão LISA com novo telescópio de teste", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 203686, "titulo": "STAT+: Roche goes beyond licensing in deal with Chinese biotech", "url": "https://www.statnews.com/2026/10/08/biotech-news-roche-goes-beyond-licensing-in-deal-with-chinese-biotech/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-08T15:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Roche está colaborando com a startup chinesa Defand Therapeutics para descobrir novos medicamentos.", "titulo_pt": "Roche se associa à startup chinesa defand therapeutics para descobrir novos medicamentos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 203687, "titulo": "FDA says its safety review of abortion pill will continue into next year", "url": "https://www.statnews.com/2026/10/08/fda-mifepristone-abortion-pill-safety-review-continue-into-2027/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-08T15:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA anunciou que a revisão de segurança do principal remédio abortivo usado nos Estados Unidos continuará no próximo ano. Esta decisão foi rapidamente criticada por contrapartes anti-aborto.", "titulo_pt": "FDA anuncia que revisão de segurança do remédio abortivo continuará no próximo ano", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 202922, "titulo": "O que é um thriller? Raphael Montes destrincha o gênero no programa Livro Aberto; assista", "url": "https://veja.abril.com.br/cultura/o-que-e-um-thriller-raphael-montes-destrincha-o-genero-no-programa-livro-aberto-assista/", "fonte_id": "veja", "data_pub": "2026-10-08T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O autor Raphael Montes explora as características do gênero thriller no programa Livro Aberto. Ele também discute as inspirações que o levaram a criar histórias sombrias e envolventes.", "titulo_pt": "O que é um thriller? Raphael Montes analisa no programa Livro Aberto; assista", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 203097, "titulo": "Anne Carson reveló dónde estaba y qué hacía en el momento exacto en que ganó el Premio Nobel de Literatura", "url": "https://www.lanacion.com.ar/cultura/anne-carson-revelo-donde-estaba-y-que-hacia-en-el-momento-exacto-en-que-gano-el-premio-nobel-de-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T17:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Academia Sueca concedeu o Premio Nobel de Literatura à autora canadense Anne Carson; durante o primeiro contato telefônico, ela informou sobre seus planos para o prêmio e expressou suas primeiras reações.", "titulo_pt": "Anne Carson revela local e ação no momento em que ganhou o Nobel de Literatura", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 202996, "titulo": "Buscas por Anne Carson aumentam após Prêmio Nobel da Literatura 2026", "url": "https://www.cnnbrasil.com.br/pop/celebridades/buscas-por-anne-carson-aumentam-apos-premio-nobel-da-literatura-2026/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A escritora canadense Anne Carson, de 76 anos, venceu o Prêmio Nobel da Literatura 2026, anunciado pela Academia Sueca. As buscas por Anne Carson aumentaram após a divulgação do prêmio, que oferece um valor de US$ 1,2 milhão, aproximadamente R$ 6 milhões.", "titulo_pt": "Buscas por Anne Carson crescem após conquista do Prêmio Nobel da Literatura 2026", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 202802, "titulo": "'Se a prosa é uma casa, a poesia é um homem em chamas', disse Anne Carson", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/se-a-prosa-e-uma-casa-a-poesia-e-um-homem-em-chamas-disse-anne-carson.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-08T16:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Anne Carson, escritora canadense, ganhou o Nobel de Literatura em 8 de agosto. Sua obra combina poesia, prosa, tradução e estudos clássicos, frequentemente rompendo as fronteiras entre os gêneros.", "titulo_pt": "Se a prosa é uma casa, a poesia é um homem em chamas", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 202803, "titulo": "Record vai produzir nova série bíblica sobre Sansão; filha de Edir Macedo será uma das autoras", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/record-vai-produzir-nova-serie-biblica-sobre-sansao-filha-de-edir-macedo-sera-uma-das-autoras.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-08T16:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Record está produzindo uma nova série bíblica sobre Sansão, que será exibida em 2027. A filha de Edir Macedo será uma das autoras do projeto.", "titulo_pt": "Record produzirá nova série bíblica sobre Sansão; filha de Edir Macedo será autora", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 202805, "titulo": "Vinheta de fim de ano da Globo será inspirada em antigo programa de Márcio Garcia", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/vinheta-de-fim-de-ano-da-globo-sera-inspirada-em-antigo-programa-de-marcio-garcia.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-08T15:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Globo está produzindo uma vinheta de fim de ano inspirada no programa 'Tamanho Família', comandado por Márcio Garcia entre 2016 e 2020. As gravações estão programadas para novembro.", "titulo_pt": "Vinheta de fim de ano da Globo inspirada em 'tamanho família'", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 203750, "titulo": "Gilded Statue of Nude, Golf-Club-Wielding Trump Installed in European Parliament", "url": "https://www.artforum.com/news/gilded-statue-nude-trump-installed-in-european-parliament-1234761017/", "fonte_id": "artforum", "data_pub": "2026-10-08T15:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma escultura de 8,5 pés de altura, representando um nudo Donald Trump em ouro de 23 quilates, foi instalada na cadeira oficial do Parlamento Europeu em Strasbourg, França, em 6 de outubro. A escultura, intitulada 'A Peste Laranja' e também conhecida como 'O Rei da Injustiça', foi criada pelo artista dinamarquês Jens Galschiøt.", "titulo_pt": "Estátua de ouro de Trump nu instalada no parlamento europeu", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 202807, "titulo": "Lollapalooza 2027 divulga lineup com Charli XCX, Travis Scott e Sombr", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/lollapalooza-2027-divulga-line-up-com-charli-xcx-travis-scott-e-sombr.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-08T15:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Lollapalooza 2027 incluirá Charli XCX, Travis Scott e Sombr no evento que será realizado nos dias 19, 20 e 21 de março no Autódromo de Interlagos, em São Paulo.", "titulo_pt": "Lineup do lollapalooza 2027 divulgado com Charli XCX, Travis Scott e Sombr", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 203303, "titulo": "The Triumph of America’s Least Respected Governor", "url": "https://www.theatlantic.com/politics/2026/10/kathy-hochul-trump-mamdani-ny/688868/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-08T14:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kathy Hochul está finalmente recebendo reconhecimento por seu trabalho.", "titulo_pt": "O triunfo da governadora mais desprezada dos estados unidos", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 203713, "titulo": "Willem de Kooning review – the artist’s lifelong rebellion against himself is thrilling to watch", "url": "https://www.theguardian.com/artanddesign/2026/oct/08/willem-de-kooning-at-work-review-rijksmuseum-amsterdam", "fonte_id": "guardian_culture", "data_pub": "2026-10-08T14:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Esta vasta retrospectiva no Rijksmuseum, em Amsterdã, celebra o centenário do artista holandês Willem de Kooning, exibindo sua obra abstracionista que desafia fronteiras. A mostra destaca sua habilidade em desenho, considerada transformadora e acadêmica.", "titulo_pt": "Revisão de willem de Kooning – a rebeldia do artista ao longo de toda a sua vida é emocionante de assistir", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 203712, "titulo": "The woman with the mattress: the radical, rage-fuelled history of anti-rape art", "url": "https://www.theguardian.com/artanddesign/2026/oct/08/anti-rape-art-history-cornell-mattress-performance", "fonte_id": "guardian_culture", "data_pub": "2026-10-08T14:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2014, Emma Sulkowicz começou a carregar uma colcha azul pesando 23kg pelo campus da universidade onde ela estudava, em resposta a uma acusação de estupro. A ação artística durou todo o ano letivo e chamou atenção para a falta de processos criminais no caso. Com performances similares tendo ocorrido há centenas de anos, a questão do tratamento das denúncias de estupro persiste.", "titulo_pt": "A mulher com a colcha: a história radical e cheia de raiva do arte anti-estupro", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 202808, "titulo": "Pequeno Cidadão lança música com batuque no corpo e faz shows no Dia das Crianças", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/blogs/musica-em-letras/2026/10/pequeno-cidadao-lanca-musica-com-batuque-no-corpo-e-faz-shows-no-dia-das-criancas.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-08T14:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O grupo Pequeno Cidadão lançou um single inspirado na brincadeira de batucar no corpo em 9 de outubro de 2026. A canção, quase psicodélica, incentiva as crianças a se afastarem das telas de seus dispositivos eletrônicos.", "titulo_pt": "Pequeno Cidadão lança música com batuque no corpo e realiza shows no Dia das Crianças", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 203479, "titulo": "Shoot the People: Global Activism through Misan Harriman’s Lens", "url": "https://www.aljazeera.com/video/witness/2026/10/8/shoot-the-people-global-activism-through-misan-harrimans-lens?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-08T14:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Misan Harriman, fotógrafo e ativista britânico-nigeriano, registra protestos globais que promovem mudanças sociais.", "titulo_pt": "Dispare contra as pessoas: ativismo global através do olhar de Misan Harriman", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 203710, "titulo": "Fierce, frantic and loaded with menace: Fontaines DC’s 20 greatest songs – ranked!", "url": "https://www.theguardian.com/music/2026/oct/08/fierce-frantic-and-loaded-with-menace-fontaines-dcs-20-greatest-songs-ranked", "fonte_id": "guardian_culture", "data_pub": "2026-10-08T14:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antes do lançamento do quinto álbum dos irlandeses de rock alternativo Fontaines DC, Dopamine Chamber, a lista das 20 músicas mais importantes da banda é apresentada. Uma música inspirada na chegada do filho do baixista Conor Deegan, 'It's Amazing to Be Young', é mencionada como um exemplo de quando a banda opera em um modo eufórico.", "titulo_pt": "Feroz, frenético e carregado de ameaça: as 20 maiores músicas dos fontaines DC – classificadas!", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 202809, "titulo": "Aos 30 anos de palco, Laila Garin alcança auge dramático como Édith Piaf", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/blogs/mise-en-scene/2026/10/aos-30-anos-de-palco-laila-garin-alcanca-auge-dramatico-como-edith-piaf.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-08T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Laila Garin atinge o auge em sua carreira ao interpretar Édith Piaf, demonstrando profunda compreensão da figura retratada e evitando simplesmente copiar trejeitos e modos de falar.", "titulo_pt": "Aos 30 anos de palco, Laila Garin atinge o auge dramático como Édith Piaf", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 203717, "titulo": "Six buds in a freaky coat: Split Enz share stories behind their colourful costumes – in pictures", "url": "https://www.theguardian.com/music/gallery/2026/oct/09/split-enz-costumes-makeup-book-in-pictures", "fonte_id": "guardian_culture", "data_pub": "2026-10-08T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O grupo musical Split Enz, que surgiu na Nova Zelândia no início dos anos 1970, transformou o pop em teatro surreal. O baterista Noel Crombie foi o arquiteto visual da banda, criando seus looks através de roupas exageradas, maquiagem, penteados e capas de álbuns e vídeos musicais. Uma nova publicação, escrita em colaboração com o jornalista musical Michael Dwyer, retrata esse período e anuncia um novo álbum da banda, que fará sua primeira turnê em 17 anos.", "titulo_pt": "Seis botões em um casaco estranho: split Enz compartilham histórias por trás de seus looks coloridos – em fotos", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 202937, "titulo": "Crianças da Uganda promovem site que troca criptomoedas por voto em Flávio", "url": "https://www.metropoles.com/viralizou/criancas-da-uganda-promovem-site-que-troca-criptomoedas-por-voto-em-flavio", "fonte_id": "metropoles", "data_pub": "2026-10-08T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Crianças na Uganda criaram um site que distribui tokens em troca de compartilhamento de conteúdo promovendo o voto em Flávio Bolsonaro. O site incentiva o voto em Flávio Bolsonaro (PL) através do compartilhamento de conteúdo relacionado à campanha.", "titulo_pt": "Crianças da Uganda criam site que troca tokens por compartilhamento de conteúdo em favor de Flávio bolsonaro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 203086, "titulo": "Con drenaje sostenible, suelo absorbente y farolas peatonales: la Ciudad recuperó un predio usurpado y lo transforma en un nuevo parque que promete beneficiar a más de 50.000 vecinos porteños", "url": "https://www.lanacion.com.ar/sociedad/con-drenaje-sostenible-suelo-absorbente-y-farolas-peatonales-la-ciudad-recupero-un-predio-usurpado-y-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T17:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo da Cidade de Buenos Aires recuperou um espaço de 5.900 metros quadrados no Parque Ferroviário Urquiza e transformou-o em um novo parque. Este projeto promete beneficiar mais de 50.000 moradores da região.", "titulo_pt": "Com drenagem sustentável, solo absorvente e lâmpadas para pedestres: a cidade recuperou um terreno usurpado e o transformou em um novo parque que promete beneficiar mais de 50.000 moradores", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 203089, "titulo": "Juicio por la muerte de Maradona: la fiscalía pidió que Leopoldo Luque sea condenado a la pena de 12 años de cárcel", "url": "https://www.lanacion.com.ar/seguridad/juicio-por-la-muerte-de-maradona-la-fiscalia-pidio-que-el-leopoldo-luque-sea-condenado-a-la-pena-de-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T17:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os fiscais generais adjuntos de San Isidro, Patricio Ferrari e Cosme Iribarren, apresentaram seus argumentos no tribunal responsável pelo julgamento de Leopoldo Luque, acusado pela morte de Maradona. A fiscalia solicitou que Luque seja condenado a 12 anos de prisão.", "titulo_pt": "Juízo pela morte de Maradona: fiscalia pede 12 anos de prisão para Leopoldo Luque", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 202940, "titulo": "Jovem morre de apendicite após 3 idas a hospital; família alega negligência", "url": "https://www.metropoles.com/brasil/jovem-morre-de-apendicite-apos-3-idas-a-hospital-familia-alega-negligencia", "fonte_id": "metropoles", "data_pub": "2026-10-08T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um jovem faleceu devido a complicações de apendicite após ter feito três idas a hospitais, conforme alega a família. Segundo o pai, apenas na terceira visita os médicos diagnosticaram a apendicite e realizaram a internação para a cirurgia.", "titulo_pt": "Jovem morre de apendicite após três idas a hospital; família alega negligência", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 202943, "titulo": "Mapa interativo revela onde foram encontrados corpos em SP. Confira", "url": "https://www.metropoles.com/sao-paulo/locais-corpos-dentro-de-sacos-de-lixo", "fonte_id": "metropoles", "data_pub": "2026-10-08T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Civil de São Paulo está investigando casos individuais de corpos encontrados em sacolas plásticas ou cobertores na capital paulista. Um mapa interativo foi criado para mostrar os locais onde esses corpos foram encontrados.", "titulo_pt": "Mapa interativo mostra locais de descobertas de corpos em SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 202953, "titulo": "Vila recheada de centenárias pode ter maior expectativa de vida do mundo", "url": "https://www.metropoles.com/saude/vila-recheada-de-centenarias-pode-ter-maior-expectativa-de-vida-do-mundo", "fonte_id": "metropoles", "data_pub": "2026-10-08T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na cidade de Bolotana, na Itália, a probabilidade de uma mulher viver mais de 100 anos é três vezes maior em comparação com os Estados Unidos. A vila é conhecida por ter um grande número de centenárias.", "titulo_pt": "Vila recheada de centenárias na Itália pode ter maior expectativa de vida do mundo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 203002, "titulo": "Operação investiga desvio de remédios de alto custo na Grande São Paulo", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/operacao-investiga-desvio-de-remedios-de-alto-custo-na-grande-sao-paulo/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T16:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A operação policial cumpriu 12 mandados de busca e apreensão e revelou um prejuízo de R$ 400 mil aos cofres públicos com o desvio de remédios de alto custo na Grande São Paulo. Duas pessoas foram levadas para prestar depoimento.", "titulo_pt": "Operação investiga desvio de remédios de alto custo na Grande São Paulo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 202929, "titulo": "Modelo Dandara Couto é encontrada após dois dias desaparecida em São Paulo", "url": "https://veja.abril.com.br/brasil/modelo-dandara-couto-e-encontrada-apos-dois-dias-desaparecida-em-sao-paulo/", "fonte_id": "veja", "data_pub": "2026-10-08T16:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma modelo de 27 anos foi localizada após dois dias de desaparecimento em São Paulo. Ela havia sido vista pela última vez na Zona Oeste da cidade.", "titulo_pt": "Modelo Dandara Couto é encontrada após dois dias desaparecida em São Paulo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 203237, "titulo": "Thousands to march in Madrid after death of evicted pensioner Maricarmen", "url": "https://www.theguardian.com/world/2026/oct/08/thousands-to-march-in-madrid-after-death-of-evicted-pensioner-maricarmen", "fonte_id": "guardian_world", "data_pub": "2026-10-08T15:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas estão programadas para marchar por Madri em memória de María del Carmen Abascal, uma pensionista de 87 anos cuja batalha judicial contra uma empresa de investimento levou a protestos nacionais sobre a crise imobiliária. Sua evicção, que resultou em um aumento de 230% no aluguel de seu apartamento, a tornou o rosto público da crise antes de ela falecer em um hospital.", "titulo_pt": "Milhares marcharão em madri em memória da pensionista cuja luta judicial despertou protestos sobre a crise imobiliária", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 203028, "titulo": "Mortes de pais após nascimento dos filhos revelam problema pouco monitorado", "url": "https://exame.com/ciencia/mortes-de-pais-apos-nascimento-dos-filhos-revelam-problema-pouco-monitorado/", "fonte_id": "exame", "data_pub": "2026-10-08T14:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo acompanhou mais de 130 mil nascimentos e constatou que 60% dos óbitos paternos em cinco anos foram causados por fatores potencialmente evitáveis.", "titulo_pt": "Mortes de pais após nascimento dos filhos revelam problema pouco monitorado", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 202899, "titulo": "Racionamento de energia gera protestos na Venezuela", "url": "https://www.cartacapital.com.br/mundo/racionamento-de-energia-gera-protestos-na-venezuela/", "fonte_id": "cartacapital", "data_pub": "2026-10-08T14:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Manifestações ocorrem em várias regiões da Venezuela em razão do racionamento de energia.", "titulo_pt": "Protestos acontecem na Venezuela devido ao racionamento de energia", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 203559, "titulo": "1 dead in Poland’s second school knife attack in 2 days, amid ‘copycat’ fears", "url": "https://www.scmp.com/news/world/europe/article/3370224/1-dead-polands-second-school-knife-attack-2-days-amid-copycat-fears?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-08T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ex-aluno de 15 anos matou uma funcionária e feriu outras duas em uma escola primária na Polônia, na quinta-feira, usando uma câmera montada no capacete. Este foi o segundo ataque com faca em uma escola em dois dias, possivelmente em resposta a um desafio na internet.", "titulo_pt": "1 Morto na segunda tentativa de ataque com faca em escola da polônia, em 2 dias", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 203226, "titulo": "What if making your neighborhood safer means breaking the rules?", "url": "https://www.vox.com/future-perfect/505575/tactical-urbanism-diy-benches", "fonte_id": "vox", "data_pub": "2026-10-08T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jonathan Hale, um advogado de direito que se tornou um ativista de segurança viária viral, enfrentou problemas legais ao pintar faixas de pedestres DIY em algumas das interseções mais perigosas de Los Angeles. Em uma reunião com a prefeita de Los Angeles, Karen Bass, ele discutiu a questão.", "titulo_pt": "E se tornar seu bairro mais seguro significasse quebrar as regras?", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 203311, "titulo": "The Biggest Source of Inequality That No One Talks About", "url": "https://www.theatlantic.com/economy/2026/10/pass-through-corporate-tax/688918/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-08T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Progressistas se concentram em uma fuga de impostos que não é o principal problema de desigualdade.", "titulo_pt": "A maior fonte de desigualdade que ninguém discute", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 203229, "titulo": "How one city made gains on school integration without trying", "url": "https://www.vox.com/policy/505269/washington-dc-segregated-schools-integration-academic-progress", "fonte_id": "vox", "data_pub": "2026-10-08T10:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A maioria das grandes cidades dos Estados Unidos não fez progressos significativos em reduzir a segregação racial em suas escolas públicas nas últimas décadas. Muitas dessas cidades se tornaram ainda mais polarizadas, com níveis atuais de segregação superiores aos do início do século.", "titulo_pt": "Como uma cidade fez avanços na integração escolar sem tentar", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 203575, "titulo": "French teenagers ‘not backing down’ as school blockades continue", "url": "https://www.scmp.com/news/world/europe/article/3370201/french-school-blockades-continue-despite-pms-pledge-act?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-08T10:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alunos franceses estão bloqueando algumas escolas e marchando pelas cidades, enquanto o governo promete abordar suas preocupações sobre a escassez de professores e edifícios escolares em estado deplorável, mas não fornece detalhes específicos. A movimentação de protesto, que já dura três semanas, expõe tensões profundas na França entre as demandas populares por investimentos em serviços públicos deteriorados e um governo economicamente estressado sob pressão para reduzir sua dívida e déficit.", "titulo_pt": "Jovens franceses não desistem enquanto bloqueios escolares continuam", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 203096, "titulo": "Miden 13 cm y pesan casi un kilo: Gendarmería recuperó seis huevos de ñandú que iban escondidos de forma ilegal debajo del asiento de un auto en la Patagonia", "url": "https://www.lanacion.com.ar/sociedad/miden-13-cm-y-pesan-casi-un-kilo-gendarmeria-recupero-seis-huevos-de-nandu-que-iban-escondidos-de-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T17:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Foram recuperados seis ovos de ñandú, medindo 13 centímetros e pesando quase um quilograma cada, escondidos ilegalmente debaixo do assento de um carro na Patagonia. O responsável foi investigado de acordo com a lei de fauna, pois o ñandú é uma ave ameaçada.", "titulo_pt": "Medem 13 cm e pesam quase um kilo: gendarmeria recupera seis ovos de ñandú escondidos ilegalmente embaixo do assento de um carro na Patagonia", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 202985, "titulo": "“Oceano mais quente que já medimos”: Agência da ONU alerta para um dos El Niño mais fortes da história", "url": "https://www.cnnbrasil.com.br/ciencia/oceano-mais-quente-que-ja-medimos-agencia-da-onu-alerta-para-um-dos-el-nino-mais-fortes-da-historia/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência da ONU registrou o pico do El Niño em dezembro de 2026, com temperaturas marítimas recordes. Os efeitos intensificados deste fenômeno devem persistir até fevereiro de 2027.", "titulo_pt": "Oceano mais quente que já medimos: agência da ONU alerta para o El Niño mais forte da história", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 203230, "titulo": "Seychelles giant tortoise numbers hit record 180,000 in conservation triumph", "url": "https://www.theguardian.com/environment/2026/oct/08/researchers-find-180000-giant-tortoises-living-on-island-in-seychelles", "fonte_id": "guardian_world", "data_pub": "2026-10-08T17:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A população de tartarugas gigantes de Aldabra, na ilha de Aldabra, Seychelles, atingiu um recorde de 180.000 animais, resultado de um programa de recuperação que durou décadas. Essa espécie, uma vez em perigo de extinção, está prosperando em um atol do Oceano Índico.", "titulo_pt": "Números de tartarugas gigantes de aldabra atingem recorde de 180.000 no triunfo da conservação", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 202926, "titulo": "Vinícola Aurora conquista selo Carbon Free e levará novidade a 220 produtos", "url": "https://veja.abril.com.br/economia/vinicola-aurora-conquista-selo-carbon-free-e-levara-novidade-a-220-produtos/", "fonte_id": "veja", "data_pub": "2026-10-08T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A vinícola Aurora, maior cooperativa vinícola do Brasil, conquistou o selo Carbon Free e planeja incorporar essa certificação ambiental aos rótulos de seus produtos. A empresa gerou faturamento de R$ 874,8 milhões em 2025.", "titulo_pt": "Vinícola Aurora conquista selo Carbon Free e levará novidade a 220 produtos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 202999, "titulo": "MP denuncia ex-secretária de Meio Ambiente por desmatamento irregular no RN", "url": "https://www.cnnbrasil.com.br/nacional/nordeste/rn/mp-denuncia-ex-secretaria-de-meio-ambiente-por-desmatamento-irregular-no-rn/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ex-secretária de Meio Ambiente foi denunciada pelo Ministério Público por desmatamento irregular em uma área protegida de Mata Atlântica no Rio Grande do Norte. A área devastada era equivalente a 30 campos de futebol e foi usada para a construção de um loteamento e um centro comercial.", "titulo_pt": "MP denuncia ex-secretária de Meio Ambiente por desmatamento irregular no RN", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 203003, "titulo": "Teste de estudantes usa lã de ovelha para evitar derretimento de geleira nos Alpes suíços e combater proliferação de microplásticos", "url": "https://www.cnnbrasil.com.br/ciencia/teste-de-estudantes-usa-la-de-ovelha-para-evitar-derretimento-de-geleira-nos-alpes-suicos-e-combater-proliferacao-de-microplasticos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um experimento demonstrou que a lã de ovelha oferece isolamento térmico igual ao de materiais sintéticos sem poluir o meio ambiente com microplásticos. O teste foi realizado para evitar o derretimento de geleiras nos Alpes suíços.", "titulo_pt": "Teste de estudantes usa lã de ovelha para evitar derretimento de geleiras nos Alpes suíços e combater proliferação de microplásticos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 203423, "titulo": "Heavy autumn snow paralyses roads in Russia’s Far East", "url": "https://www.euronews.com/video/2026/10/08/heavy-autumn-snow-paralyses-roads-in-russias-far-east", "fonte_id": "euronews", "data_pub": "2026-10-08T15:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A forte neve no outono paralisou as estradas na região de Magadan, na Rússia, dificultando o movimento de caminhões e interrompendo os serviços de ônibus intercidades.", "titulo_pt": "Neve de outono paralisa estradas na região de magadan, na Rússia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 203546, "titulo": "Climate needs same urgency as defense spending, COP31 chief says", "url": "https://www.japantimes.co.jp/environment/2026/10/08/climate-change/cop-chief-climate-defense-spending/", "fonte_id": "japan_times", "data_pub": "2026-10-08T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro do Meio Ambiente da Turquia e presidente-designado da COP31, Murat Kurum, afirmou que cada país deve demonstrar a mesma responsabilidade e determinação no enfrentamento do clima.", "titulo_pt": "Clima precisa da mesma urgência que gastos com defesa, diz chefe da COP31", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 202479, "titulo": "Dry wells and shrinking water holes as drought grips Sri Lanka", "url": "https://www.euronews.com/video/2026/10/08/dry-wells-and-shrinking-water-holes-as-drought-grips-sri-lanka", "fonte_id": "euronews", "data_pub": "2026-10-08T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O prolongado período de seca no centro da Sri Lanka está deixando poços secos, prejudicando os meios de subsistência dos agricultores e empurrando a vida selvagem a se aglomerar em poças d'água cada vez menores.", "titulo_pt": "Poços secos e poças d'água encolhendo à medida que a seca atinge o centro da Sri Lanka", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 202099, "titulo": "Crianças sofrerão impacto \"desproporcional\" do El Niño, alerta Unicef", "url": "https://www.metropoles.com/saude/criancas-sofrerao-impacto-desproporcional-do-el-nino-alerta-unicef", "fonte_id": "metropoles", "data_pub": "2026-10-08T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Unicef alerta que as crianças serão impactadas de forma 'desproporcional' pelo El Niño, devido à sua vulnerabilidade em face das mudanças climáticas urgentes.", "titulo_pt": "Crianças sofrerão impacto 'desproporcional' do El Niño, alerta Unicef", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 202129, "titulo": "Dia das Crianças 2026 deve movimentar R$ 9,27 bi no comércio brasileiro", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/dia-das-criancas-2026-deve-movimentar-r-927-bi-no-comercio-brasileiro/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-08T08:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As vendas do varejo durante o Dia das Crianças 2026 devem atingir R$ 9,27 bilhões, sendo as maiores desde 2014. Brinquedos são os itens mais procurados, enquanto o vestuário perdeu destaque nas intenções de compra.", "titulo_pt": "Dia das Crianças 2026 deve movimentar R$ 9,27 bi no comércio brasileiro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 202101, "titulo": "Clima: Sul, Sudeste e Centro-Oeste enfrentam chuvas; interior tem calorão", "url": "https://www.metropoles.com/brasil/clima-sul-sudeste-e-centro-oeste-enfrentam-chuvas-interior-tem-calorao", "fonte_id": "metropoles", "data_pub": "2026-10-08T08:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sistemas frontais e corredores de umidade estão causando chuvas expressivas no Sul, Sudeste e Centro-Oeste. O interior dessas regiões, por outro lado, está enfrentando um calor intenso.", "titulo_pt": "Clima: sul, Sudeste e Centro-Oeste enfrentam chuvas; interior tem calorão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 202526, "titulo": "‘Nature can recover’: Inside the race to rescue world’s crisis-hit wildlife", "url": "https://www.aljazeera.com/features/2026/10/8/nature-can-recover-inside-the-race-to-rescue-worlds-crisis-hit-wildlife?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-08T08:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Conservação de vida selvagem está tendo sucesso em meio à queda de 73% na população de animais selvagens, trazendo esperança para o mundo natural em crise.", "titulo_pt": "Ainda há esperança: a corrida para resgatar a vida selvagem em crise", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 202597, "titulo": "Populations of wild species fell by an average of 73% from 1970 to 2022, WWF says", "url": "https://www.japantimes.co.jp/environment/2026/10/08/wildlife/wildlife-population-fall-survey/", "fonte_id": "japan_times", "data_pub": "2026-10-08T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De 1970 a 2022, as populações de espécies silvestres diminuíram em média 73%. O relatório Living Planet 2026 estima que, ao longo de 52 anos, as populações globais caíram em torno de 2,5% por ano.", "titulo_pt": "População de espécies silvestres caiu em média 73% entre 1970 e 2022, diz WWF", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 202571, "titulo": "Real men don’t do climate change", "url": "https://www.ft.com/content/61118fd6-b5d2-4ce1-9a78-4535a0ef3ead?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-08T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos sobre as diferenças de gênero na percepção do aquecimento global indicam que campanhas e comunicações sobre o tema podem precisar ser reconsideradas.", "titulo_pt": "Homens reais não fazem mudanças climáticas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 202268, "titulo": "Rusia descarta “riesgo epidémico” por supuesto caso de peste neumónica en Siberia", "url": "https://www.latercera.com/mundo/noticia/rusia-descarta-riesgo-epidemico-por-supuesto-caso-de-peste-neumonica-en-siberia/", "fonte_id": "la_tercera", "data_pub": "2026-10-08T00:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A agência federal rusa de saúde, Rospotrebnadzor, informou que mais de 90% das pessoas que tiveram contato com a mulher que faleceu em Siberia não apresentaram sinais de doença infecciosa. Não há risco epidêmico de peste neumônica, segundo a agência.", "titulo_pt": "Rússia descarta 'risco epidêmico' por suposto caso de peste neumônica em sibéria", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 203589, "titulo": "Laws inadequate to fight transnational repression: MAC", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/09/2003865663", "fonte_id": "taipei_times", "data_pub": "2026-10-09T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Comando de Operações de Inteligência (MAC) afirmou que as leis atuais são insuficientes para combater a repressão transnacional. A instituição destacou a necessidade de reformas legais mais robustas.", "titulo_pt": "Leis insuficientes para combater repressão transnacional, afirma MAC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 202949, "titulo": "Valdemar se refere a gays como \"essa gente\" e deputado reage: \"LGBTfobia\"", "url": "https://www.metropoles.com/colunas/grande-angular/valdemar-se-refere-a-gays-como-essa-gente-e-deputado-reage-lgbtfobia", "fonte_id": "metropoles", "data_pub": "2026-10-08T17:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Fábio Felix (PSol) reagiu a uma declaração do presidente nacional do Partido Liberal (PL), Valdemar Costa Neto, em que este se referiu aos gays como \"essa gente\". A reação do parlamentar foi classificada como uma resposta à LGBTfobia.", "titulo_pt": "Deputado reage a valdemar costa neto, que se referiu a gays como 'essa gente'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 203102, "titulo": "Suspensión confirmada: un juez falla a favor de inmigrantes que recibían multas de hasta US$1,8 millones", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/suspension-confirmada-un-juez-falla-a-favor-de-inmigrantes-que-recibian-multas-de-hasta-us18-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T17:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um juiz confirmou a suspensão do mecanismo de multas a imigrantes que podiam ser cobrados até US$1,8 milhão. O juiz decidiu a favor dos imigrantes, suspendendo temporariamente o sistema de sanciones.", "titulo_pt": "Suspensão confirmada: juiz decide a favor de imigrantes com multas de até US$1,8 milhões", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 203103, "titulo": "Juicio por la muerte de Maradona: fue la “internación más deficiente y temeraria de todos los tiempos”, sostuvo la acusación oficial", "url": "https://www.lanacion.com.ar/seguridad/juicio-por-la-muerte-de-maradona-fue-la-internacion-mas-deficiente-y-temeraria-de-todos-los-tiempos-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T17:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os fiscais generais adjuntos de San Isidro, Patricio Ferrari e Cosme Iribarren, apresentaram seus argumentos perante o tribunal no processo relacionado à morte de Maradona. Eles afirmaram que a internação médica foi a 'mais deficiente e temerária de todos os tempos'.", "titulo_pt": "Julgamento da morte de Maradona: internação foi 'a mais deficiente e temerária de todos os tempos', afirma acusação oficial", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 202896, "titulo": "EUA apresenta nova acusação contra Maduro e sua esposa por tortura", "url": "https://www.cartacapital.com.br/cartaexpressa/eua-apresentam-nova-acusacao-contra-maduro-e-sua-esposa-por-tortura/", "fonte_id": "cartacapital", "data_pub": "2026-10-08T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os EUA apresentaram novas acusações contra Maduro e sua esposa por tortura. Além disso, Maduro e Flores foram acusados de narcotráfico e tráfico de armas após serem capturados em uma operação militar em Caracas no dia 3 de janeiro.", "titulo_pt": "EUA apresenta nova acusação contra Maduro e sua esposa por tortura", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 203342, "titulo": "Nicolás Maduro and his wife hit with fresh torture charge", "url": "https://www.axios.com/2026/10/08/maduro-torture-charges-court-case", "fonte_id": "axios", "data_pub": "2026-10-08T15:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nicolás Maduro e sua esposa foram acusados de organizar tortura de pessoas detidas pelo regime venezuelano. Essas novas acusações foram anuncias em um novo mandado de prisão, acrescentando a acusações anteriores de narcoterrorismo.", "titulo_pt": "Maduro e sua esposa são acusados de novas acusações de tortura", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 203562, "titulo": "Is the Philippines using new anti-spying laws to silence critics?", "url": "https://www.scmp.com/week-asia/politics/article/3370221/philippines-using-new-anti-spying-laws-silence-critics?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-08T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um projeto de lei filipino que expande a lei de espionagem do país para incluir atividades de tempo de paz está levantando preocupações entre jornalistas e especialistas em direito, que alertam que suas disposições amplas podem silenciar a livre expressão e limitar a fiscalização pública de questões nacionais. O projeto foi aprovado pela Câmara dos Representantes em 17 de setembro.", "titulo_pt": "Filipinas está usando novas leis antiespionagem para silenciar críticos?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 202225, "titulo": "Chicas desnudadas con IA: otro caso reaviva el debate sobre la violencia digital y los límites legales para castigarla", "url": "https://www.lanacion.com.ar/sociedad/chicas-desnudadas-con-ia-otro-caso-reaviva-el-debate-sobre-la-violencia-digital-y-los-limites-nid08102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-08T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "13% dos jovens conhecem casos de violência digital envolvendo a utilização de inteligência artificial para desnudamento em seu ambiente escolar. Eles pedem ao Congresso a tipificação específica deste delito para melhor combate.", "titulo_pt": "Meninas desnudadas com IA: caso reaviva debate sobre violência digital e limites legais", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 202700, "titulo": "Court orders JMS leader, religious group to compensate W370m to sexual assault victims", "url": "https://www.koreaherald.com/article/10897334", "fonte_id": "korea_herald", "data_pub": "2026-10-08T07:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juízo determinou que o líder de uma organização religiosa controversa e sua organização devem compensar 370 milhões de wones (cerca de 276 mil dólares) a três mulheres que foram estupradas pelo líder. Jeong Myeong-seok, fundador e líder da Christian Gospel Mission (JMS), e a organização religiosa devem pagar 250 milhões de wones com juros a uma nacional de Hong Kong identificada como Maple, e 80 milhões de wones com juros a outra vítima.", "titulo_pt": "Corte ordena que líder de grupo religioso e organização paguem 370 milhões a vítimas de estupro", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 203297, "titulo": "Gen Z Women Take to the Streets Over Spate of Rapes in India’s Capital", "url": "https://thediplomat.com/2026/10/gen-z-women-take-to-the-streets-over-spate-of-rapes-in-indias-capital/", "fonte_id": "the_diplomat", "data_pub": "2026-10-08T05:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mulheres da geração Z urbanas na Índia estão se manifestando contra uma série de estupros em sua capital. Eles rejeitam ser intimidadas, serem chamadas de 'slut shamed' ou serem policiadas em relação ao seu vestuário e são contra o costume de ficarem em casa à noite para garantir sua segurança.", "titulo_pt": "Geração Z de mulheres da Índia se manifestam contra série de estupros em sua Capital", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 202448, "titulo": "Egypt charges six journalists with terrorism offenses", "url": "https://www.lemonde.fr/en/international/article/2026/10/08/egypt-charges-six-journalists-with-terrorism-offenses_6758375_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-08T03:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seis jornalistas de uma plataforma de verificação de fatos independente chamada Matsadaash, cujo nome significa 'Não Acredite Nisso' em árabe, foram detidos em operações policiais em várias províncias no Egito nos dias 28 e 29 de setembro.", "titulo_pt": "Egito acusa seis jornalistas de crimes relacionados a terrorismo", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 202257, "titulo": "Texas concreta la primera ejecución en EE.UU. desde el fallido intento de inyección letal de Christa Pike", "url": "https://www.latercera.com/mundo/noticia/texas-concreta-la-primera-ejecucion-en-eeuu-desde-el-fallido-intento-de-inyeccion-letal-de-christa-pike/", "fonte_id": "la_tercera", "data_pub": "2026-10-08T03            return `<div class="item" data-flag-url="${esc(n.url)}">

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;

  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
