 do grupo toky; dois fundos saem do grupo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 115015, "titulo": "Guerra, geada e dólar: por que o café é o “trade perfeito” de Martha Matsumura", "url": "https://www.infomoney.com.br/mercados/guerra-geada-dolar-por-que-cafe-trade-perfeito-de-martha-matsumura/", "fonte_id": "infomoney", "data_pub": "2026-08-21T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O café é considerado um 'trade perfeito' devido à sua volatilidade, que é influenciada pela demanda global e pela oferta sensível ao clima.", "titulo_pt": "Guerra, geada e dólar: por que o café é o ‘trade perfeito’ de Martha Matsumura", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 114919, "titulo": "Braskem admite avaliar medidas de proteção e intensifica negociação com credores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/braskem-admite-avaliar-medidas-de-protecao-e-intensifica-negociacao-com-credores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T11:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Braskem está avaliando medidas de proteção e intensificando negociações com credores, mas ainda não decidiu sobre uma possível recuperação extrajudicial. A empresa respondeu a questionamentos da CVM e da B3 sobre sua situação financeira.", "titulo_pt": "Braskem considera medidas de proteção e intensifica negociação com credores", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 115569, "titulo": "Korea freezes fuel price caps for another four weeks", "url": "https://www.koreaherald.com/article/10848547", "fonte_id": "korea_herald", "data_pub": "2026-08-21T11:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo sul-coreano vai manter os limites de preço do combustível inalterados por mais quatro semanas, devido ao aumento das tensões no Oriente Médio que elevou os preços globais do petróleo. Os preços máximos para gasolina, diesel e kerosene vendidos nas estações de serviço permanecerão os mesmos, respectivamente, a 1.784 won, 1.773 won e 1.380 won por litro, a partir de sábado.", "titulo_pt": "Coreia do sul congela preços de combustíveis por mais quatro semanas", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 115254, "titulo": "Airbus bows to remote working demands after series of strikes", "url": "https://www.theguardian.com/business/2026/aug/21/airbus-bows-remote-working-strikes", "fonte_id": "guardian_world", "data_pub": "2026-08-21T11:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Airbus teria flexibilizado suas políticas sobre trabalho remoto após uma série de greves. A empresa estaria reduzindo a restrição de trabalho remoto de um dia para quatro dias por semana, em vez de uma semana inteira, como inicialmente planejado.", "titulo_pt": "Airbus cede às demandas sobre trabalho remoto após greves", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 114920, "titulo": "Grupo Estrela apresenta plano de recuperação judicial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/grupo-estrela-apresenta-plano-de-recuperacao-judicial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T11:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A fabricante de brinquedos Estrela apresentou seu plano de recuperação judicial na 1ª Vara Cível da Comarca de Três Pontas, em Minas Gerais.", "titulo_pt": "Estrela apresenta plano de recuperação judicial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 114948, "titulo": "Beneficiários com NIS de final 4 recebem Bolsa Família de agosto", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/beneficiarios-com-nis-de-final-4-recebem-bolsa-familia-de-agosto", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-21T10:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Caixa Econômica Federal realiza o pagamento do Bolsa Família de agosto para os beneficiários com NIS final 4 nesta sexta-feira (21). O benefício atingirá 19,3 milhões de famílias, com um valor médio de R$ 678,35. Além disso, 186 municípios de sete estados receberam o pagamento antecipado devido a situações de emergência ou calamidade pública.", "titulo_pt": "Beneficiários com NIS final 4 recebem Bolsa Família de agosto", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 115444, "titulo": "Bitcoin and gold surge as Bessent’s bond market intervention weighs on dollar", "url": "https://www.ft.com/content/7e0c8dc0-e957-420a-bba3-d33666d919b8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-21T10:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Bitcoin e o ouro registraram ganhos significativos, com o Bitcoin tendo a melhor semana em mais de três anos. A intervenção do Bessent no mercado de títulos está pesando sobre o dólar.", "titulo_pt": "Bitcoin e ouro avançam com a intervenção de Bessent no mercado de títulos pressionando o dólar", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 115125, "titulo": "STJ: alíquota zero de PIS/Cofins na importação de aeronaves vale desde a lei", "url": "https://www.jota.info/tributos/stj-aliquota-zero-de-pis-cofins-na-importacao-de-aeronaves-vale-desde-a-lei", "fonte_id": "jota", "data_pub": "2026-08-21T10:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O STJ decidiu que a alíquota zero de PIS/Cofins para a importação de aeronaves é válida desde a Lei 10.925/2004, mesmo antes de sua regulamentação por decreto.", "titulo_pt": "STJ: alíquota zero de PIS/Cofins na importação de aeronaves válida desde a lei 10.925/2004", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 114921, "titulo": "Palmeiras afirma que compras com seu cartão de crédito já movimentaram R$ 2 bilhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/palmeiras-afirma-que-compras-com-seu-cartao-de-credito-ja-movimentaram-r-2-bilhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Palmeiras Pay, programa de cartão de crédito do clube, movimentou cerca de R$ 2 bilhões em compras desde 2023. Essas transações geraram R$ 54,7 milhões para o clube, provenientes de royalties e faturamento do programa sócio-torcedor Avanti.", "titulo_pt": "Palmeiras diz que compras com seu cartão de crédito já movimentaram R$ 2 bilhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 115261, "titulo": "Why this year’s Medicare-for-all debate is different", "url": "https://www.vox.com/policy/499938/medicare-for-all-health-care-democrats-2028", "fonte_id": "vox", "data_pub": "2026-08-21T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A acessibilidade e a qualidade do sistema de saúde estão se tornando uma das principais preocupações dos americanos, com candidatos progressistas que venceram primárias recentes apoiando a discussão sobre Medicare-for-all.", "titulo_pt": "Por que o debate sobre Medicare-for-all está diferente este ano", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 115452, "titulo": "Samsung to return record $80bn to shareholders", "url": "https://www.ft.com/content/d434a48b-4b6c-4071-bf16-da16a6b95bda?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-21T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung planeja devolver um recorde de 80 bilhões de dólares aos acionistas. A empresa tem sido pressionada a distribuir mais de seus lucros recordes, resultado do boom da inteligência artificial.", "titulo_pt": "Samsung vai devolver recorde de 80 bilhões de dólares aos acionistas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 115423, "titulo": "Samsung plans up to $80 billion in shareholder returns after SK Hynix buyback", "url": "https://www.cnbc.com/2026/08/21/samsung-shareholder-return-package-sk-hynix-buyback-ai-chip-boom.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-21T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung Electronics planeja retornos para acionistas no valor de 90 trilhões a 110 trilhões de wons, incluindo aproximadamente 30 trilhões de wons em dividendos em dinheiro no terceiro trimestre.", "titulo_pt": "Samsung planeja retornos de até 80 bilhões de dólares para acionistas após compra da SK Hynix", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 114922, "titulo": "BNDES desembolsa maior valor para crédito no 1º semestre desde governo Dilma", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/bndes-desembolsa-maior-valor-para-credito-no-1o-semestre-desde-governo-dilma.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O BNDES desembolsou R$ 75,6 bilhões em crédito no primeiro semestre de 2026, representando uma alta de 31,2% em comparação com o mesmo período do ano anterior.", "titulo_pt": "BNDES desembolsa maior valor para crédito no 1º semestre de 2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 115129, "titulo": "A asfixia do mercado de capitais", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-asfixia-do-mercado-de-capitais", "fonte_id": "jota", "data_pub": "2026-08-21T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O adiamento das normas ESG no Chile e no Brasil revela uma diminuição no dinamismo dos mercados de capitais. Este fenômeno expõe um problema mais amplo no funcionamento destes mercados.", "titulo_pt": "A asfixia dos mercados de capitais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 115018, "titulo": "Trump assina diretriz para ampliar lançamentos espaciais nos EUA", "url": "https://www.infomoney.com.br/mundo/trump-assina-diretriz-para-ampliar-lancamentos-espaciais-nos-eua/", "fonte_id": "infomoney", "data_pub": "2026-08-21T11:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, assinou uma diretriz para aumentar os lançamentos espaciais no país, com o objetivo de revitalizar a liderança americana no transporte espacial e permitir mais de 1.000 lançamentos.", "titulo_pt": "Trump assina diretriz para ampliar lançamentos espaciais nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 115335, "titulo": "A roadmap for safeguarding against AI bioweapons", "url": "https://www.axios.com/2026/08/21/safeguards-ai-bioweapons-roadmap", "fonte_id": "axios", "data_pub": "2026-08-21T11:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório sugere que armas biológicas baseadas em IA podem ser um risco catastrófico, mas gerenciável, se governos, comunidades científicas, setores de saúde pública e empresas tecnológicas de destaque desenvolverem medidas apropriadas de proteção. Um relatório da RAND identifica nove estratégias para mitigar esses riscos, abrangendo uma variedade de atores que poderiam usar IA para projetar e liberar um agente biológico.", "titulo_pt": "Roteiro para proteger contra armas biológicas baseadas em IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 114969, "titulo": "Lula anuncia investimentos de R$ 2,3 bilhões em inteligência artificial", "url": "https://veja.abril.com.br/economia/lula-anuncia-investimentos-de-r-23-bilhoes-em-inteligencia-artificial/", "fonte_id": "veja", "data_pub": "2026-08-21T11:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula anunciou investimentos de R$ 2,3 bilhões em inteligência artificial. Ele justificou os motivos para o investimento sem fazer comentários diretos sobre as regiões Sul e Sudeste.", "titulo_pt": "Lula anuncia investimentos de R$ 2,3 bilhões em inteligência artificial", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 115636, "titulo": "Patreon is changing its algorithm to help smaller creators get discovered", "url": "https://www.theverge.com/tech/983156/patreon-update-roadmap-algorithm-changes", "fonte_id": "the_verge", "data_pub": "2026-08-21T11:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Patreon anunciou várias atualizações e melhorias no seu algoritmo de descoberta, bem como no plataforma e segurança, com o objetivo de ajudar criadores de conteúdo menores a serem mais visíveis. Essas mudanças fazem parte de um plano maior para construir uma melhor rede e internet, segundo o CEO Jack Conte.", "titulo_pt": "Patreon está mudando seu algoritmo para ajudar criadores menores a serem descobertos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 115639, "titulo": "Nyrius Phoenix Home True 4K60 (2026): A Solution for Cord Clutter", "url": "https://www.wired.com/review/nyrius-phoenix-home-true-4k60/", "fonte_id": "wired", "data_pub": "2026-08-21T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Nyrius Phoenix Home True 4K60 pode transmitir jogos, programas de TV, filmes e outros conteúdo de forma sem fio por toda a casa, mesmo através de paredes.", "titulo_pt": "Nyrius Phoenix Home True 4K60: solução para o desarranjo de cabo em casa", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 115640, "titulo": "The Patrick Clancy Conspiracy Theories Are Rooted in the Harsh Realities of Motherhood", "url": "https://www.wired.com/story/the-patrick-clancy-conspiracy-theories-are-rooted-in-the-harsh-realities-of-motherhood/", "fonte_id": "wired", "data_pub": "2026-08-21T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lindsay Clancy defende que matou seus três filhos devido a psicose pós-parto. Conspiradores, incluindo muitas mães insatisfeitas, estão, no entanto, culpando seu ex-marido.", "titulo_pt": "A teoria da conspiração de Patrick Clancy está raiz nas duras realidades da maternidade", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 114984, "titulo": "China e EUA buscam mecanismos de proteção contra riscos da IA", "url": "https://www.poder360.com.br/poder-china/com-o-aumento-dos-riscos-da-ia-china-e-eua-buscam-diferentes-mecanismos-de-protecao/", "fonte_id": "poder360", "data_pub": "2026-08-21T10:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As superpotências tecnológicas China e EUA adotam abordagens diferentes para gerenciar os riscos associados à inteligência artificial. Ambos buscam mecanismos de proteção contra esses riscos.", "titulo_pt": "China e EUA buscam mecanismos de proteção contra riscos da IA", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 115542, "titulo": "The Mistral paradox: Europe’s push for tech sovereignty relies on China’s Z.ai", "url": "https://www.scmp.com/news/china/diplomacy/article/3364745/mistral-paradox-europes-push-tech-sovereignty-relies-chinas-zai?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-21T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 11 de agosto, a empresa francesa Mistral AI anunciou que começaria a oferecer modelos de outras empresas em sua plataforma, enquanto trabalhava na criação de infraestrutura europeia para inteligência artificial soberana. Este movimento ilustra os desafios estratégicos e tecnológicos enfrentados pela União Europeia na busca por soberania tecnológica, especialmente em um contexto geopolítico e comercial volátil.", "titulo_pt": "Paradoxo da Mistral: a Europa busca soberania tecnológica baseando-se na Z.Ai chinesa", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 115642, "titulo": "Influencers and Resellers Are Turning Empty Boxes Into Big Cash", "url": "https://www.wired.com/story/when-the-packaging-is-the-product-empty-boxes-influencers/", "fonte_id": "wired", "data_pub": "2026-08-21T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Conteúdo criado para promover autenticidade está comprando caixas vazias de produtos de luxo, enquanto revendedores estão lucrando com preços exorbitantes. O interesse crescente pela autenticidade online está impulsionando essa prática.", "titulo_pt": "Influenciadores e revendedores estão transformando caixas vazias em grana", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 115643, "titulo": "The Super El Niño Won’t Fix the West’s Water Crisis", "url": "https://www.wired.com/story/the-super-el-nino-wont-fix-the-wests-water-crisis/", "fonte_id": "wired", "data_pub": "2026-08-21T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O especialista afirma que o problema da Crise do Rio Colorado tem sido discutido há décadas e que agora a situação se tornou real. Pessoas em todas as esferas estão expressando preocupação com a crise hídrica.", "titulo_pt": "O Super El Niño não resolverá a crise hídrica do oeste", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 115544, "titulo": "Embrace AI to boost competitiveness, Paul Chan says at tech festival opening", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3364834/embrace-ai-boost-competitiveness-paul-chan-says-tech-festival-opening?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-21T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Hong Kong, humanoid robots, 3D impressoras e hubs de inteligência artificial são algumas das tecnologias mais recentes exibidas na 22ª edição da Feira de Computadores e Comunicações, um evento tecnológico anual. O secretário financeiro da cidade incentivou os residentes a aprenderem a usar essas tecnologias.", "titulo_pt": "Adote a IA para aumentar a competitividade, diz Chan ao abrir festival tecnológico", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 115595, "titulo": "(2nd LD) Samsung Electronics expects up to 110 tln won for shareholder returns this year", "url": "https://en.yna.co.kr/view/AEN20260821010151315", "fonte_id": "yonhap_news", "data_pub": "2026-08-21T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samsung Electronics espera receber até 110 trilhões de wones em retorno aos acionistas neste ano. A empresa fez essa declaração na sexta-feira.", "titulo_pt": "Samsung Electronics espera até 110 trilhões de wones para retorno aos acionistas este ano", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 115566, "titulo": "Mother tongue", "url": "https://www.technologyreview.com/2026/08/21/1141726/mother-tongue-fiction/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filho Theo perguntou a seu pai sobre o destino das palavras quando elas morrem. O pai havia terminado a rotina noturna perfeitamente, incluindo banho, escova de dentes, uso do banheiro, leitura de duas histórias e um cântico, antes que Theo fizesse a pergunta inesperada.", "titulo_pt": "Língua materna", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 115567, "titulo": "When AI designs a drug, who gets the credit?", "url": "https://www.technologyreview.com/2026/08/21/1142627/when-ai-designs-a-drug-who-gets-the-credit/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de biotecnologia Insilico Medicine anunciou em um comunicado de imprensa que um medicamento promissor para fibrose pulmonar havia sido 'descoberto por' seu sistema de inteligência artificial gerativa. A empresa está à frente de outras que utilizam IA para desenvolver rapidamente ideias de medicamentos que humanos podem não ter pensado.", "titulo_pt": "Quem recebe o crédito quando a IA desenvolve um medicamento?", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 115568, "titulo": "This company’s plans to deploy space mirrors could jeopardize the night sky for many", "url": "https://www.technologyreview.com/2026/08/21/1142755/space-mirrors-night-sky/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma empresa planeja lançar um satélite-teste com um espelho de 18 por 18 metros em órbita para refletir a luz do sol para a Terra. Um novo estudo sugere que esse projeto pode iluminar o céu noturno de forma indesejada para muitas pessoas além do que foi planejado.", "titulo_pt": "Este plano de empresa para lançar espelhos espaciais pode comprometer o céu noturno para muitas pessoas", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 115505, "titulo": "Fujifilm expands key chip material output to capture AI demand", "url": "https://www.japantimes.co.jp/business/2026/08/21/companies/fujifilm-expansion-chip-material-ai/", "fonte_id": "japan_times", "data_pub": "2026-08-21T08:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Fujifilm expandiu a produção de materiais-chave para chips em um novo edifício de fabricação que aumentará a produção de limpa-líquidos pós-CMP, essenciais para remover partículas e resíduos de placas após o polimento químico-mecânico. Essa expansão visa capturar a demanda crescente de inteligência artificial.", "titulo_pt": "Fujifilm amplia produção de material-chave para chips para atender à demanda de AI", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 115655, "titulo": "China is launching a moon mission to find water ice", "url": "https://phys.org/news/2026-08-china-moon-mission-ice.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China está lançando uma missão lunar para procurar água congelada. A presença de água no manto lunar é conhecida há quase duas décadas, mas ainda não se sabe exatamente quantos depósitos de água congelada existem nos craters permanentemente sombreados, a profundidade em que estão enterrados ou qual é sua forma.", "titulo_pt": "China lança missão lunar para encontrar água congelada", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 115667, "titulo": "Crossword: Lab Animals", "url": "https://www.sciencenews.org/article/crossword-lab-animals-september-2026", "fonte_id": "science_news", "data_pub": "2026-08-21T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O crosswords da edição de setembro de 2026 do periódico celebra características de criaturas.", "titulo_pt": "Crossword: animais de laboratório", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 115668, "titulo": "Shock wave therapy for erectile dysfunction is on the rise", "url": "https://www.sciencenews.org/article/shock-therapy-ed-therapy-treatment", "fonte_id": "science_news", "data_pub": "2026-08-21T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma terapia baseada em ondas sonoras, comumente utilizada para deslocar cálculos renais, está ganhando popularidade como tratamento para disfunção erétil.", "titulo_pt": "Terapia com ondas sonoras para disfunção erétil está em ascensão", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 115689, "titulo": "My favorite thing in the night sky appears on Aug. 28 — and it proves Earth is a sphere", "url": "https://www.space.com/stargazing/my-favorite-thing-in-the-night-sky-appears-on-aug-28-and-it-proves-earth-is-a-sphere", "fonte_id": "space_com", "data_pub": "2026-08-21T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 28 de agosto, haverá uma eclipses parcial profundo da lua, durante o qual veremos a sombra curvada da Terra se mover lentamente sobre a lua. Este fenômeno serve como prova de que a Terra é esférica.", "titulo_pt": "Minha coisa favorita no céu noturno aparece em 28 de agosto — e isso prova que a terra é esférica", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 115656, "titulo": "Ph.D. student's forensic review highlights need for standardized bloodstain pattern classification", "url": "https://phys.org/news/2026-08-phd-student-forensic-highlights-standardized.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T11:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma estudante de doutorado da Universidade de Staffordshire recebeu reconhecimento nacional por sua pesquisa que poderia transformar a análise de evidências de manchas de sangue nos locais de crime. Emma Hook foi premiada com o Prêmio Science & Justice Review pela melhor revisão publicada na revista Science & Justice entre 2024 e 2025.", "titulo_pt": "Estudante de doutorado destaca a necessidade de padronização na classificação de manchas de sangue em investigações forenses", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 115657, "titulo": "Archaeologists uncover 11 rare marked arrowheads at Tepecik-Çiftlik whose purpose remains a mystery", "url": "https://phys.org/news/2026-08-archaeologists-uncover-rare-arrowheads-tepecik.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T11:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arqueólogos descobriram 11 setas marcadas antiga em Tepecik-Çiftlik, na Anatólia Central Neolítica, cada uma com um design único gravado em sua superfície escura de obsidiana há cerca de 9.000 anos. O propósito dessas setas incisas permanece desconhecido há décadas.", "titulo_pt": "Arqueólogos descobrem 11 setas marcadas raras em Tepecik-Çiftlik, cuja finalidade permanece desconhecida", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 115658, "titulo": "What comes after fire? What forests need to survive in a warming world", "url": "https://phys.org/news/2026-08-forests-survive-world.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T11:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jennifer Bhatnagar percorreu áreas desoladas de encostas calcinadas por incêndio florestal na Califórnia setentrional em verão de 2023. Ela examinou propriedades devastadas, coletou amostras e fez perguntas sobre o que acontecerá após o fogo em um mundo aquecido.", "titulo_pt": "O que vem após o fogo? O que as florestas precisam para sobreviver em um mundo aquecido", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 115659, "titulo": "Spinach peptide discovery leads to citrus greening treatment", "url": "https://phys.org/news/2026-08-spinach-peptide-discovery-citrus-greening.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tratamento para a doença do amarelo da laranja, baseado em mais de uma década de pesquisa no Texas A&M AgriLife Research, alcançou um marco no caminho para a disponibilidade comercial. O Agência de Proteção Ambiental dos Estados Unidos concedeu registro incondicional ao novo tratamento.", "titulo_pt": "Descoberta de peptídeo de couve-de-praia leva ao tratamento do amarelo da laranja", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 115652, "titulo": "‘Earth-like’ exoplanets may exist—but we don’t know of any yet", "url": "https://www.scientificamerican.com/article/earth-like-exoplanets-may-exist-but-we-dont-know-of-any-yet/", "fonte_id": "scientific_american", "data_pub": "2026-08-21T10:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A descoberta de exoplanetas 'semelhantes à Terra' é uma tendência que precisa ser reconsiderada. Até o momento, nenhum exoplaneta similar à Terra foi confirmado.", "titulo_pt": "A busca por exoplanetas 'semelhantes à terra' precisa ser reavaliada", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 115653, "titulo": "What happened when people with anorexia tried magic mushrooms", "url": "https://www.scientificamerican.com/podcast/episode/what-happened-when-people-with-anorexia-tried-magic-mushrooms/", "fonte_id": "scientific_american", "data_pub": "2026-08-21T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores estão explorando a possibilidade de que cogumelos mágicos possam oferecer um novo tratamento para anorexia.", "titulo_pt": "O que aconteceu quando pessoas com anorexia experimentaram cogumelos mágicos", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 115654, "titulo": "The national debt is $40 trillion. What does that mean mathematically?", "url": "https://www.scientificamerican.com/article/the-national-debt-is-40-trillion-what-does-that-mean-mathematically/", "fonte_id": "scientific_american", "data_pub": "2026-08-21T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O título traduzido para português brasileiro é 'A dívida nacional é de 40 trilhões de dólares. O que isso significa matematicamente?'. O artigo investiga o enormemente grande valor monetário que os Estados Unidos devem.", "titulo_pt": "A dívida nacional é de 40 trilhões de dólares. O que isso significa matematicamente?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 115690, "titulo": "Could 'dark photons' explain dark matter?", "url": "https://www.space.com/astronomy/dark-universe/could-dark-photons-explain-dark-matter", "fonte_id": "space_com", "data_pub": "2026-08-21T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos estudos indicam que se a matéria escura estiver composta por 'fotões escuros', ela não aqueceria o cosmos primitivo como os cientistas acreditavam.", "titulo_pt": "Poderiam 'fotões escuros' explicar a matéria escura?", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 115660, "titulo": "What a record-breaking El Niño could mean for the world", "url": "https://phys.org/news/2026-08-el-nio-world.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este ano, o El Niño está prestes a se tornar o mais forte da história, o que pode levar a condições climáticas extremas em todo o mundo e fazer 2027 o ano mais quente já registrado.", "titulo_pt": "O que um El Niño recorde poderoso pode significar para o mundo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 114906, "titulo": "Nobel condenado por pedofilia escreveu em diário que, 'sem protetores, jamais teria conseguido', diz New Yorker", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/nobel-condenado-por-pedofilia-escreveu-em-diario-que-sem-protetores-jamais-teria-conseguido-diz-new-yorker.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O médico e virologista ganhador do prêmio Nobel Daniel Carleton Gajdusek, que faleceu em 2008, confessou em seu diário que levava sua pedofilia toda a vida para sua carreira médica e que, sem medidas protetivas, não teria tido sucesso nela.", "titulo_pt": "Nobel condenado por pedofilia escreveu em diário sobre seus atos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 115661, "titulo": "Seeing the unseen: A new tool visualizes hidden structures in complex biological data", "url": "https://phys.org/news/2026-08-unseen-tool-visualizes-hidden-complex.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa em biologia moderna pode agora gerar dados valiosos em uma escala sem precedentes. No entanto, um grande desafio é interpretar esses grandes conjuntos de dados altamente dimensionais. Um time da Universidade de Basileia, Suíça, desenvolveu uma nova ferramenta que pode fornecer imagens precisas das estruturas escondidas dentro desses conjuntos de dados complexos.", "titulo_pt": "Visualizando o invisível: nova ferramenta visualiza estruturas ocultas em dados biológicos complexos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 115662, "titulo": "Pioneering cancer treatment saves python named Jodie Foster: UK zoo", "url": "https://phys.org/news/2026-08-cancer-treatment-python-jodie-foster.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um zoo britânico comemorou o sucesso do tratamento de uma python, nomeada Jodie Foster, que sofreu com câncer. A cobra se tornou a primeira serpente a receber uma inovadora combinação de cirurgia e electroquimioterapia (ECT).", "titulo_pt": "Tratamento inovador salva cobra python nomeada Jodie Foster em zoo britânico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 115191, "titulo": "La psicología dice que el desarrollo personal requiere de la aceptación de la propia vulnerabilidad para abrazar nuevas formas de ser", "url": "https://www.lanacion.com.ar/sociedad/la-psicologia-dice-que-las-personas-cambian-todo-el-tiempo-evolucionan-y-dependen-de-la-nid18082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-21T12:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Pilar Sordo analisou a transformação da conduta humana diante das experiências de vida e enfatizou a importância do discurso interno na LA NACION. Ela discutiu o desenvolvimento pessoal como resultado da aceitação da vulnerabilidade.", "titulo_pt": "A psicologia afirma que o desenvolvimento pessoal exige a aceitação da própria vulnerabilidade para adotar novas formas de ser", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 115192, "titulo": "Gabriel Rolón, psicólogo: “La gracia del amor es abrazar también la imperfección del otro”", "url": "https://www.lanacion.com.ar/sociedad/gabriel-rolon-psicologo-la-gracia-del-amor-es-abrazar-tambien-la-imperfeccion-del-otro-nid19082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-21T12:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Gabriel Rolón, psicólogo e escritor, foi entrevistado sobre a natureza humana e ofereceu uma visão crua sobre amor, morte e os mandatos sociais persistentes.", "titulo_pt": "Gabriel Rolón, psicólogo: 'a graça do amor está em abraçar também a imperfeição do outro'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 115193, "titulo": "Robin Sharma, experto en desarrollo personal: “Un mal día para el ego es un buen día para el alma; aprendemos en la dificultad”", "url": "https://www.lanacion.com.ar/sociedad/robin-sharma-experto-en-desarrollo-personal-un-mal-dia-para-el-ego-es-un-buen-dia-para-el-alma-nid14082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-21T12:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Robin Sharma, especialista em desenvolvimento pessoal, analisou a reação humana diante da adversidade e sugeriu transformar os problemas cotidianos em ferramentas para o crescimento pessoal. Ele afirmou que um mau dia para o ego pode ser um bom dia para o alma, aprendendo com as dificuldades.", "titulo_pt": "Robin Sharma, especialista em desenvolvimento pessoal: 'um mau dia para o ego é um bom dia para o alma; aprendemos com a dificuldade'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 115196, "titulo": "Conrado Estol, neurólogo: “No tenés que decir: ´Tengo 75, a ver qué hago, me pongo a ver telenovelas toda la tarde´, no, tenés que mantenerte activo\"", "url": "https://www.lanacion.com.ar/sociedad/conrado-estol-neurologo-no-tenes-que-decir-tengo-75-a-ver-que-hago-me-pongo-a-ver-telenovelas-toda-nid19082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-21T12:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Conrado Estol, um neurologista, afirmou que não é necessário dizer 'Tenho 75, a ver que faço, vou assistir novelas toda tarde', ao contrário, é preciso manter-se ativo. Em uma entrevista, ele detalhou como alcançar uma longevidade saudável através de mudanças no estilo de vida e alertou sobre o manejo médico da saúde mental.", "titulo_pt": "Conrado Estol, neurologista: 'não é preciso dizer que vou assistir novelas toda tarde, mantenha-se ativo'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 115095, "titulo": "Festival de Tiradentes começa nesta sexta; veja programação e valores", "url": "https://www.metropoles.com/minas-gerais/festival-de-tiradentes-comeca-nesta-sexta-veja-programacao-e-valores", "fonte_id": "metropoles", "data_pub": "2026-08-21T11:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O 29º Festival de Gastronomia de Tiradentes inicia nesta sexta-feira (21/8) e está previsto para atrair 35 mil pessoas apenas no primeiro fim de semana.", "titulo_pt": "Festival de gastronomia de Tiradentes começa nesta sexta; veja programação e valores", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 114972, "titulo": "Como cresce a longa presa em espiral do ‘unicórnio do mar’, o narval", "url": "https://veja.abril.com.br/ciencia/como-cresce-a-longa-presa-em-espiral-do-unicornio-do-mar-o-narval/", "fonte_id": "veja", "data_pub": "2026-08-21T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado na revista Nature explorou o desenvolvimento da presa longa e em espiral dos narvais. O objetivo foi compreender como essa estrutura única se forma no animal.", "titulo_pt": "Como cresce a longa presa em espiral do ‘unicórnio do mar’, o narval", "veiculo": "Veja", "pais": 094, "titulo": "Mulher é assediada ao ser agarrada e mordida por instrutor em academia", "url": "https://www.metropoles.com/brasil/mulher-e-assediada-ao-ser-agarrada-e-mordida-por-instrutor-em-academia", "fonte_id": "metropoles", "data_pub": "2026-08-21T11:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Câmeras de segurança registraram um incidente em uma academia de Recife, onde uma professora foi agarrada e mordida por um instrutor.", "titulo_pt": "Mulher é agarrada e mordida por instrutor em academia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 115637, "titulo": "My big, fat, technophobic cat", "url": "https://www.theverge.com/gadgets/981738/my-big-fat-technophobic-cat", "fonte_id": "the_verge", "data_pub": "2026-08-21T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O gato Pablo é um gato corpulento. Quando tinha cinco ou seis anos, um veterinário alertou que ele estava muito gordo para sua idade.", "titulo_pt": "O meu gato grande, gorduroso e temeroso à tecnologia", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 115713, "titulo": "The fog of hunger", "url": "https://aeon.co/essays/a-hungry-woman-is-easier-to-dismiss-than-a-well-fed-woman", "fonte_id": "aeon", "data_pub": "2026-08-21T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mulheres são treinadas desde a infância a restringir sua fome. Isso tem um alto custo cognitivo oculto.", "titulo_pt": "A névoa da fome", "veiculo": "Aeon Magazine", "pais": "Reino Unido", "classe": "A"}, {"id": 115035, "titulo": "Festa do Peão de Barretos: veja os valores dos ingressos do rodeio", "url": "https://exame.com/pop/festa-do-peao-de-barretos-veja-os-valores-dos-ingressos-do-rodeio/", "fonte_id": "exame", "data_pub": "2026-08-21T07:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ingressos para a Festa do Peão de Barretos variam de R$ 35 a R$ 534, dependendo do dia, do lote e da modalidade escolhid :00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O estatuto laboral para o turismo provavelmente estabelece regras específicas para o setor turístico, incluindo questões relacionadas ao trabalho, como horários, salários e direitos dos trabalhadores no setor.", "titulo_pt": "Estatuto laboral para o turismo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 113869, "titulo": "Expo Empleo Barrial: casi 3500 personas se acercaron a una feria de Caballito en busca de trabajo", "url": "https://www.lanacion.com.ar/economia/expo-empleo-barrial-3500-personas-se-acercaron-a-una-feria-de-caballito-en-busca-de-trabajo-nid20082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-21T00:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de 3.400 pessoas buscaram emprego em uma feira de empregos no bairro de Caballito, onde 30 empresas receberam currículos e realizaram entrevistas para mais de 600 vagas. Metade das buscas de emprego estava voltada para pessoas com mais de 45 anos.", "titulo_pt": "Expo emprego Barrial: quase 3.500 pessoas buscaram emprego em uma feira no bairro de Caballito", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 114462, "titulo": "70% in Taiwan view Chinese coast guard patrols as ‘ill will’: MAC poll", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/21/2003862878", "fonte_id": "taipei_times", "data_pub": "2026-08-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa realizada pelo MAC revelou que 70% dos taiwaneses consideram as patrulhas do guarda-costas chinês como manifestações de má vontade.", "titulo_pt": "70% Dos taiwaneses veem patrulhas do guarda-costas chinês como sinal de má vontade, diz pesquisa", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 114466, "titulo": "New preschool policy draws the ire of unions", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/21/2003862882", "fonte_id": "taipei_times", "data_pub": "2026-08-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo policiamento para creches tem provocado a ira das sindicatos. A medida tem gerado debates sobre a qualidade e os custos da educação infantil.", "titulo_pt": "Nova política para creches gera irritação entre sindicatos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 115084, "titulo": "Casal planta 34 mil árvores e transforma área em refúgio para coalas", "url": "https://www.metropoles.com/colunas/e-o-bicho/casal-planta-34-mil-arvores-e-transforma-area-em-refugio-para-coalas", "fonte_id": "metropoles", "data_pub": "2026-08-21T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os australianos Brett e Lisa Vercoe estão plantando 34 mil árvores em uma fazenda de 30 hectares, transformando a área em um refúgio para coalas e outros animais.", "titulo_pt": "Casal planta 34 mil árvores e transforma área em refúgio para coalas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 115400, "titulo": "Ebola outbreak in Democratic Republic of the Congo 'growing exponentially,' UN warns", "url": "http://www.euronews.com/2026/08/21/ebola-outbreak-in-democratic-republic-of-the-congo-growing-exponentially-un-warns", "fonte_id": "euronews", "data_pub": "2026-08-21T11:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A epidemia de Ebola na República Democrática do Congo é a maior na história do país e está se espalhando mais rapidamente do que qualquer outra epidemia registrada. A ONU alerta que a epidemia está crescendo exponencialmente.", "titulo_pt": "Epidemia de ebola na república democrática do Congo cresce exponencialmente, alerta ONU", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 115401, "titulo": "More than 300 migrants, including 40 children, rescued off Mauritania, coastguard says", "url": "http://www.euronews.com/2026/08/21/more-than-300-migrants-including-40-children-rescued-off-mauritania-coastguard-says", "fonte_id": "euronews", "data_pub": "2026-08-21T11:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 300 migrantes, incluindo 40 crianças, foram resgatados no Mar da África Ocidental perto da Mauritânia. Milhares de pessoas têm tentado o perigoso trajeto pelo Oceano Atlântico em barcos sobrecarregados e frequentemente em estado precário para chegar às Ilhas Canárias, na Espanha, e assim chegar à Europa.", "titulo_pt": "Mais de 300 migrantes, incluindo 40 crianças, resgatados perto da mauritânia, diz guarda-costas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 114973, "titulo": "Após quase 11 anos, Vale fecha novo acordo sobre tragédia de Mariana", "url": "https://veja.abril.com.br/economia/apos-quase-11-anos-vale-fecha-novo-acordo-sobre-tragedia-de-mariana/", "fonte_id": "veja", "data_pub": "2026-08-21T10:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Vale fechou um novo acordo após quase 11 anos sobre a tragédia de Mariana. A adesão foi formalizada durante um processo de mediação conduzido pelo Tribunal Regional Federal da 6ª Região (TRF-6).", "titulo_pt": "Após quase 11 anos, Vale fecha novo acordo sobre tragédia de Mariana", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 115402, "titulo": "Hungary’s lakes and rivers hit record lows as severe drought deepens", "url": "http://www.euronews.com/video/2026/08/21/hungarys-lakes-and-rivers-hit-record-lows-as-severe-drought-deepens", "fonte_id": "euronews", "data_pub": "2026-08-21T10:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Hungria enfrenta uma grave crise hídrica devido a um período prolongado de calor e seca, que está baixando os níveis de água em lagos e rios. Cerca de 99% do país está sujeito a uma seca severa ou extremamente severa, e a desertificação ameaça a Planície Maior da Hungria.", "titulo_pt": "Hungria enfrenta grave crise hídrica com seca prolongada e níveis de água em baixa", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 115384, "titulo": "Despite summer of extremes, France's political leaders offer no climate response", "url": "https://www.lemonde.fr/en/politics/article/2026/08/21/despite-summer-of-extremes-france-s-political-leaders-offer-no-climate-response_6756730_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-21T10:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Francia enfrentou uma sucessão de eventos climáticos extremos, mas nem o governo nem os candidatos à eleição presidencial de 2027 ainda abordaram diretamente o desafio do clima.", "titulo_pt": "Embora tenha havido verão de extremos, líderes políticos franceses não respondem ao clima", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 114976, "titulo": "Ebola: Congo recebe 70 mil doses de vacina para tentar conter surto", "url": "https://veja.abril.com.br/saude/ebola-congo-recebe-70-mil-doses-de-vacina-para-tentar-conter-surto/", "fonte_id": "veja", "data_pub": "2026-08-21T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Organização Mundial da Saúde (OMS) informou que 70 mil doses de vacina contra o Ebola foram enviadas para o Congo para ajudar a conter o surto. Não se sabe se a vacina Ervebo é eficaz contra a cepa Bundibugyo, mas um estudo está sendo realizado sobre isso.", "titulo_pt": "Congo recebe 70 mil doses de vacina contra ebola para combater surto", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 115409, "titulo": "Two fishermen rescued by Mexico's coastguard after floating at sea for five days in cooler box", "url": "http://www.euronews.com/2026/08/21/group-of-15-cuban-migrants-rescued-by-mexicos-navy-after-days-adrift-at-sea", "fonte_id": "euronews", "data_pub": "2026-08-21T08:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois pescadores foram resgatados pelo guarda-costas mexicano após flutuar por cinco dias em uma caixa-fria no mar. As equipes de resgate não forneceram detalhes sobre o destino da embarcação original nem explicaram como os pescadores sobreviveram durante cinco dias no oceano.", "titulo_pt": "Dois pescadores resgatados após cinco dias flutuando em caixa-fria no mar", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 115050, "titulo": "No Distrito da Inovação, Porto Alegre aposta na resiliência climática para atrair negócios", "url": "https://exame.com/esg/no-distrito-da-inovacao-porto-alegre-aposta-na-resiliencia-climatica-para-atrair-negocios/", "fonte_id": "exame", "data_pub": "2026-08-21T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Distrito da Inovação em Porto Alegre está concentrando mais de 18 mil empresas e desenvolvendo uma plataforma com informações sobre infraestrutura, obras de proteção e oportunidades econômicas. A previsão é de investimentos de R$ 1 bilhão até 2027.", "titulo_pt": "Quarto Distrito de Porto Alegre aposta na resiliência climática para atrair negócios", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 113992, "titulo": "Ambicioso proyecto busca descontaminar el lago Villarrica en 15 años y una inversión de US$ 56 millones", "url": "https://www.latercera.com/nacional/noticia/ambicioso-proyecto-busca-descontaminar-el-lago-villarrica-en-15-anos-y-una-inversion-de-us-56-millones/", "fonte_id": "la_tercera", "data_pub": "2026-08-21T00:25:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um ambicioso projeto será implementado pelo Ministério do Meio Ambiente com o objetivo de descontaminar o Lago Villarrica em 15 anos, com uma estimativa de investimento de US$ 56 milhões. A estratégia visa reduzir a proliferação de algas e o impacto das embarcações com motor até 2041.", "titulo_pt": "Ambicioso projeto busca descontaminar o lago Villarrica em 15 anos e uma investida de 56 milhões de dólares", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 114473, "titulo": "Lack of low-carbon power could deter investment", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/21/2003862844", "fonte_id": "taipei_times", "data_pub": "2026-08-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A falta de fontes de energia com baixo teor de carbono pode dissuadir investimentos. O artigo sugere que a ausência de opções de energia limpa pode ser um desafio para a atração de investimentos em projetos de energia.", "titulo_pt": "Falta de energia com baixo teor de carbono pode dissuadir investimentos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 115087, "titulo": "Justiça mantém condenação de mulher que fingiu próprio sequestro no DF", "url": "https://www.metropoles.com/distrito-federal/justica-mantem-condenacao-de-mulher-que-fingiu-proprio-sequestro-no-df", "fonte_id": "metropoles", "data_pub": "2026-08-21T11:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher foi condenada por ter fingido seu próprio sequestro no Distrito Federal. Ela usou o celular de um conhecido para enviar mensagens falsas, exigindo resgate de R$ 5 mil ao seu companheiro.", "titulo_pt": "Justiça mantém condenação de mulher que fingiu próprio sequestro no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 115454, "titulo": "Who does the law serve in the occupied West Bank?", "url": "https://www.aljazeera.com/video/by-the-numbers-3/2026/8/21/who-does-the-law-serve-in-the-occupied-west-bank?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-21T11:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os colonos israelenses atacam seis vezes por dia na Cisjordânia ocupada. AJLabs investiga como o território palestino é apropriado.", "titulo_pt": "Quem a lei serve na cisjordânia ocupada?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 115540, "titulo": "Outrage as China programmer’s toilet death ruled non-work-related for being ‘not at desk’", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3364847/outrage-china-programmers-toilet-death-ruled-non-work-related-being-not-desk?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-21T10:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Xing Zhi, um programador de 39 anos de Shenzhen, morreu no banheiro da empresa em abril após ir diretamente ao banheiro em vez de ir para seu escritório. As autoridades não classificaram a morte como relacionada ao trabalho, alegando que ele não estava à mesa de trabalho.", "titulo_pt": "Ira na China após morte de programador no banheiro não ser classificada como relacionada ao trabalho", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 114975, "titulo": "‘É uma das maiores crises humanitárias do país’, diz Damares sobre mortes de Yanomamis", "url": "https://veja.abril.com.br/brasil/e-uma-das-maiores-crises-humanitarias-do-pais-diz-damares-sobre-mortes-de-yanomamis/", "fonte_id": "veja", "data_pub": "2026-08-21T10:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra Damares afirmou que as mortes de Yanomamis representam uma das maiores crises humanitárias do país. Uma comissão está solicitando investigação sobre o destino de uma verba bilionária destinada à assistência aos Yanomamis.", "titulo_pt": "É uma das maiores crises humanitárias do país', diz Damares sobre mortes de Yanomamis", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 115673, "titulo": "Hundreds of health and nutrition facilities closed as Somalia’s child crisis deepens", "url": "https://www.unicef.org/press-releases/hundreds-health-and-nutrition-facilities-closed-somalias-child-crisis-deepens", "fonte_id": "unicef", "data_pub": "2026-08-21T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitas instalações de saúde e nutrição foram fechadas em Somalia à medida que a crise infantil se agrava. Esta é uma síntese das declarações feitas pelo porta-voz do UNICEF, James Elder, durante uma coletiva de imprensa no Palácio das Nações em Genebra.", "titulo_pt": "Muitas instalações de saúde e nutrição fechadas em Somalia à medida que a crise infantil se agrava", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 115508, "titulo": "The Hong Kong Tiananmen vigil activists convicted in national security trial", "url": "https://www.japantimes.co.jp/news/2026/08/21/asia-pacific/hong-kong-tiananmen-activists-convicted/", "fonte_id": "japan_times", "data_pub": "2026-08-21T07:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal de Hong Kong condenou dois ativistas pró-democracia que organizavam vigílias anuais para marcar o massacre de Tiananmen à subversão nacional em uma audiência de segurança nacional.", "titulo_pt": "Ativistas de Hong Kong que organizavam vigílias de Tiananmen condenados por incitação à subversão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 115389, "titulo": "Hong Kong court convicts activists who organized Tiananmen vigil", "url": "https://www.lemonde.fr/en/international/article/2026/08/21/hong-kong-court-convicts-activists-who-organized-tiananmen-vigil_6756724_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-21T06:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lee Cheuk-yan, de 69 anos, e Chow Hang-tung, de 41 anos, ativistas pró-democracia, foram condenados por organizar uma vigília em Hong Kong. Eles podem enfrentar até 10 anos de prisão.", "titulo_pt": "Juízo condena ativistas pró-democracia que organizaram vigília em hong Kong", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 114345, "titulo": "Four out of every five families in Gaza face 'critical or catastrophic' hunger levels, UN warns", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/four-out-every-five-families-gaza-face-critical-or-catastrophic-hunger", "fonte_id": "middle_east_eye", "data_pub": "2026-08-21T01:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização das Nações Unidas (ONU) alerta que 94% da população de Gaza, que ultrapassa 2,1 milhões de pessoas, necessita de abrigo e assistência básica. Além disso, quatro em cada cinco famílias enfrentam níveis 'críticos ou catastróficos' de fome em seus abrigos, que carecem de combustível, energia e itens essenciais domésticos.", "titulo_pt": "Quatro em cada cinco famílias em Gaza enfrentam 'níveis críticos ou catastróficos' de fome, avisa a ONU", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 114024, "titulo": "Court ends case against police charged over use of Taser and pepper spray on ‘vulnerable’ First Nations man", "url": "https://www.theguardian.com/australia-news/2026/aug/21/court-ends-case-queensland-police-officers-tasered-vulnerable-man-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-08-21T01:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O caso contra dois policiais, Andrew David Couchman e Ulrich Weiss, que foram acusados de cometer crimes relacionados ao uso de spray pimenta, Taser e restrições em um homem indígena 'cognitivamente e emocionalmente vulnerável' em custódia policial, foi permanentemente arquivado após uma corte identificar 'defeitos' na investigação subsequente.", "titulo_pt": "Juízo arquiva processo contra policiais acusados de uso excessivo de força em homem indígena vulnerável", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 113867, "titulo": "Datos bancarios y placas de carros: el temor de los migrantes por información compartida al ICE", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/datos-bancarios-y-placas-de-carros-el-temor-de-los-migrantes-por-informacion-compartida-al-ice-nid20082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-21T00:15:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ICE pode utilizar informações bancárias e placas de veículos para localizar pessoas, mas há limites legais para o acesso a essas informações. Migrantes temem a possibilidade de compartilhamento de dados que poderia resultar em suas localizações.", "titulo_pt": "Dados bancários e placas de carros: o medo dos migrantes sobre a compartilhamento de informações com o ICE", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 113899, "titulo": "Allanan oficinas del Senado en investigación por coimas en la Junaeb; Cepal reduce a 1,6% proyección de crecimiento para Chile, y 7 de cada 10 muertos por influenza no se vacunaron", "url": "https://www.ciperchile.cl/2026/08/20/radar-20-08-2026/?utm_source=rss&utm_medium=rss&utm_campaign=radar-20-08-2026", "fonte_id": "ciper_chile", "data_pub": "2026-08-21T00:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As oficinas do Senado foram alvo de uma investigação por supostas coimas relacionadas à Junaeb. A Cepal revisou para 1,6% a previsão de crescimento para o Chile. Sete em cada dez mortes por influenza não haviam sido vacinadas.", "titulo_pt": "Senado alvo de investigação por coimas; Cepal reduz projeção de crescimento para Chile; maioria dos mortos por influenza não se vacinou", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 115421, "fonte_id": "cnbc_international", "titulo": "Bitcoin on track for 20% weekly gain as investor optimism floods back", "url": "https://www.cnbc.com/2026/08/21/bitcoin-gain-cryptocurrency-investors-optimistic.html", "data_pub": "2026-08-21T12:07:00Z", "topico": "economia", "idioma": "en", "titulo_pt": "Bitcoin pode avançar 20% na semana com otimismo dos investidores", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 115078, const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
