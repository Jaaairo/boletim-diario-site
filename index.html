<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "13/09/2026 15:21", "stats": {"noticias_novas": 646, "resumos_gerados": 231}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O ministro Flávio Dino retirou o sigilo de uma investigação sobre a produtora do filme 'Dark Horse', que retrata a trajetória do ex-presidente Jair Bolsonaro, envolvendo o ex-deputado Mário Frias. Dino argumentou que há riscos de vazamentos seletivos, falta de igualdade entre os investigados e possíveis mudanças de entendimento no STF que justificam a divulgação dos documentos. Em outro desenvolvimento, a Polícia Civil de São Paulo informou que o Instituto Centro de Blood (ICB) realizou pagamentos duplicados que totalizam R$ 925 mil, relacionados a uma ONG vinculada à Karina Gama. Além disso, a Polícia Federal (PF) respondeu ao ministro Fachin sobre a possibilidade de enviar dados integrais do celular de Daniel Vorcaro a ministros do STF, o que poderia influenciar o julgamento sobre Moraes. A pesquisa Datafolha revelou que apenas 2% dos eleitores ainda pretendem votar no ex-presidente Jair Bolsonaro, que está preso e inelegível. No cenário das eleições para prefeito de São Paulo, Celina lidera com 41,1% das intenções de voto, seguida por Arruda com 15,7% e Grass com 14%. O ministro André Mendonça afirmou que o acesso integral ao celular de Vorcaro pode tumultuar o julgamento sobre Moraes, enquanto o ex-deputado Wadih Damous, aconselhou amigos a processarem as empresas de saúde por negativas em tratamentos.", "mundo": "As tensões geopolíticas continuam dominando o cenário internacional, com destaque para os ataques russos na zona fronteiriça entre Polônia e Ucrânia, a apenas dois quilômetros de território da OTAN, frustrando a nova tentativa de paz proposta por Donald Trump na Ucrânia. Em meio a esses eventos, a Suécia vive momentos cruciais com eleições gerais que podem ver o partido de extrema-direita, com raízes neonazistas, assumindo cargos ministeriais. Além disso, o presidente dos Estados Unidos, Joe Biden, reafirmou seu apoio à unificação da Irlanda, gerando debates sobre sua neutralidade tradicional em relação ao assunto.\n\nMais delegações visitaram Taiwan, conforme informou o Ministério dos Negócios Estrangeiros (MOFA). Em um desenvolvimento geopolítico significativo, uma operadora ferroviária estatal ucraniana relatou que figuras importantes da Europa Ocidental, incluindo o ex-primeiro-ministro britânico Boris Johnson e o ex-diretor da CIA David Petraeus, estavam em uma estação ferroviária ucraniana no oeste do país, perto da fronteira com a Polônia, momentos antes do ataque russo a um trem que viajava para Varsóvia. O Kremlin afirmou que os vagões eram usados para 'transportar carga militar'. Em outro incidente, um trem foi atingido em uma linha ferroviária na Ucrânia, no momento em que dignitários estrangeiros passavam pelo local. A Ucrânia e a Polônia acusaram a Rússia de atacar um trem com 206 passageiros que viajava de Kiev a Varsóvia. O ataque ocorreu a dois quilômetros da fronteira polonesa. As tensões na região continuam com ataques de drones por ambas as partes e a Arábia Saudita emitindo alertas sobre possíveis ataques em duas regiões próximas à fronteira com o Iêmen. Além disso, a força aérea da China exibiu um vídeo mostrando o H-6N, seu bombardista mais moderno, transportando o míssil balístico de ala fixa Jing Lei-1 durante uma operação conjunta anti-navio, exibindo a capacidade nuclear aérea do país.", "economia": "Todos os olhares estão voltados para o Federal Reserve dos EUA, que pode aumentar as taxas de juros em sua próxima reunião, de acordo com a CNN. Antes dessa reunião, Donald Trump afirmou que os Estados Unidos deveriam ter a taxa de juros mais baixa do mundo, o que contrasta com o cenário de alta inflação. Uma paralisação em um oleoduto saudita pode reduzir em 4% a oferta global de petróleo, levando a novos recordes nos preços internacionais, conforme informado pelo Infomoney. Em outro desenvolvimento, a Jovi, marca do grupo chinês Vivo Mobile Communication no Brasil, registrou um crescimento de 60% em sua atuação no Nordeste desde junho de 2025, de acordo com o Folha Mercado. Além disso, o Irã prepara uma proposta para uma navegação temporária pelo Estreito de Ormuz, em um acordo negociado com Omã, conforme relata o Exame. No cenário econômico global, o Irã também enfrenta pressões para aumentar os laços econômicos com outros países do Brics, liderado por Xi Jinping, que enfatizou a importância de fortalecer os laços econômicos entre os países do bloco.", "tecnologia": "O debate sobre a inteligência artificial (IA) ganhou novos alicerces, com líderes do setor e políticos expressando suas posições. O CEO da Anthropic, Dario Amodei, sugeriu uma pausa no desenvolvimento da IA, alegando que os sistemas estão evoluindo rapidamente e que os mecanismos de segurança podem não acompanhar as novas capacidades. Amodei recebeu apoio de Demis Hassabis, presidente do Google DeepMind, e de Elon Musk, enquanto o presidente dos Estados Unidos, Donald Trump, rejeitou essas demandas, considerando-as medos existenciais sobre a tecnologia. O Congresso dos EUA também se dividiu sobre a regulamentação da IA, com republicanos liderados por Trump se opondo a restrições e democratas considerando a regulamentação urgente. Além disso, empresas como Nvidia e Z.ai estão em negociações para investimentos significativos na Anthropic, enquanto a Nvidia considera investir até NT$10 bilhões na oferta inicial de ações da empresa. O avanço chinês na indústria automotiva também se destaca, redefinindo a competitividade no mercado brasileiro. Tecnologias emergentes, como computadores quânticos e fusão nuclear, também estão ganhando atenção, com cientistas desenvolvendo técnicas para acelerar os computadores quânticos em 1.000 vezes e empresas de fusão nuclear assinando acordos com o setor de defesa.", "ciencia": "Em 13 de setembro de 2007, o Japão lançou o foguete Kaguya para a Lua com o objetivo de mapear a superfície lunar em alta definição. Por outro lado, pesquisadores descobriram que a estrutura tridimensional do DNA está desorganizada em várias células do cérebro afetadas pela doença de Alzheimer, o que altera a atividade de genes importantes. Esta descoberta revela um aspecto anteriormente subexplorado da doença, o que pode abrir novas possibilidades para o entendimento e o tratamento da doença de Alzheimer. Além disso, pesquisadores do Instituto de Tecnologia de Materiais de Ningbo (NIMTE), da Academia Chinesa de Ciências (CAS), em colaboração com o Instituto de Física e Química Técnica da CAS, desenvolveram um framework orgânico covalente (COF) ligado a coumarina que permite a separação fotocatalítica de água com alta eficiência para a produção de hidrogênio. Este avanço pode ser crucial para a produção de hidrogênio solar em larga escala, contribuindo para a transição energética global.", "cultura": "O Festival de Cinema de Veneza premiou o filme 'Retorno a Buenos Aires', dirigido por Marco Bechis, que ganhou o prêmio de Melhor Filme e Melhor Ator para Adriano Giannini. A diretora dinamarquesa-egípcia May el-Toukhy recebeu o prêmio Golden Lion por 'Woman Unknown', que se dedica ao 'povo invisível e sem voz'. Outro destaque foi a Globo, que anunciou um especial de fim de ano com Xuxa Meneghel no Maracanã, marcando sua despedida do gênero infantil. O Festival de Veneza também viu a estreia do filme 'Shaun the Sheep: O Monstro do Fundo de Moosy', uma produção da Aardman, que apresenta uma história com personagens de ovelhas ousadas e heroicas. Além disso, a marca japonesa WEGO cancelou um projeto em colaboração com a franquia de anime e mangá My Hero Academia devido a uma forte reação negativa dos consumidores chineses.", "sociedade": "O Brasil está passando por um momento de grande tristeza com a morte do fundador do sindicato de técnicos de enfermagem do Distrito Federal, João Cardoso, aos 75 anos. Ele foi uma figura importante na defesa e valorização dos profissionais de enfermagem. Em São Paulo, uma menina de 7 anos foi a última vítima resgatada após um desabamento, sendo que apenas duas pessoas sobreviveram. No âmbito da saúde, um paciente que sofreu danos após implantes dentários em Minas Gerais obteve indenização por danos materiais e morais. No que diz respeito à sociedade, o Ministério Público Federal (MPF) está investigando casos de proselitismo religioso abusivo e invasões em terras indígenas na Amazônia. Além disso, o número de suicídios entre estudantes sul-coreanos aumentou 65% em cinco anos, atingindo seu maior nível histórico em 2025. Na América Latina, o Brasil registrou um derramamento de sangue após um edifício vizinho colapsar em São Paulo, matando uma grávida e outras pessoas. No cenário econômico, famílias endividadas em várias províncias argentinas enfrentam problemas de morosidade com bancos e entidades não financeiras. Ainda, a transição energética em Hong Kong enfrenta desafios demográficos e econômicos, como uma população envelhecida, baixa natalidade e perdas de emprego, o que pode comprometer o progresso verde se não houver legitimidade social.", "meio_ambiente": "O ar mais limpo está acelerando o aquecimento global, conforme relata a BBC Brasil, que destaca um problema maior nas discussões sobre mudanças climáticas. Em São Paulo, o calor recorde dos oceanos ameaça a economia global, alertam os cientistas da Folha de S.Paulo. O Parque Rural de Ministro Rivadavia, em Buenos Aires, enfrenta um dilema entre o crescimento urbano e a preservação ambiental, com moradores pedindo maior proteção. Em Bengaluru, parques icônicos enfrentam ameaças devido ao aquecimento da cidade, destacam os efeitos locais do aquecimento global. Indígenas e comunidades brasileiras buscam maior participação no debate climático, reivindicando uma voz mais ativa no fórum, segundo o Exame. Em meio a esses desafios, o The Guardian relata o primeiro caso de morte de uma lula-lobo australiana devido à gripe aviária H5, em um momento de preocupação pela espécie em perigo.", "direitos_humanos": "A Turquia realizou uma operação contra organizações, empresas e indivíduos LGBTQ+, acusando-os de atividades como prostituição e conteúdo obsceno, limitando a liberdade de expressão e de associação dos grupos de minorias sexuais. Em outro desenvolvimento, um proprietário de Porsche na China colocou 90 cartazes de crianças desaparecidas em seu veículo, gerando grande atenção nas redes sociais e resultando na reunião de uma família. Na América Latina, a ministra de Mulheres e Igualdade de Gênero criticou a prescrição no caso Mariana Sepúlveda, sentindo-se impotente diante dessa situação, enquanto a vida digna continua sendo um sonho distante para muitas famílias iranianas diante da guerra dos Estados Unidos. Além disso, a decisão dos Estados Unidos sobre o pedido de asilo venezuelano determina que cada caso deve ser avaliado individualmente diante das mudanças nas condições após a saída de Nicolás Maduro. Por fim, a missão francesa nas Nações Unidas pediu desculpas após criticar a postura dos Estados Unidos durante uma votação no Conselho de Segurança, expressando apreciação pelo pedido de desculpas dos EUA."}, "resumo_do_dia": {"politica_nacional": [{"id": 159096, "titulo": "Defesa da produtora de Dark Horse diz que decisão de Dino é “positiva”", "url": "https://www.infomoney.com.br/politica/defesa-da-produtora-de-dark-horse-diz-que-decisao-de-dino-e-positiva/", "fonte_id": "infomoney", "data_pub": "2026-09-13T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino determinou o levantamento do sigilo de uma investigação que apura repasses de dinheiro público para a suposta produção do filme The post Defesa da produtora de Dark Horse diz que decisão de Dino é “positiva” appeared first on InfoMoney.", "titulo_pt": "Defesa da produtora de Dark Horse considera decisão de Dino positiva", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 159097, "titulo": "Mendonça diz que abrir celular de Vorcaro pode tumultuar julgamento sobre Moraes", "url": "https://www.infomoney.com.br/politica/mendonca-diz-que-abrir-celular-de-vorcaro-pode-tumultuar-julgamento-sobre-moraes/", "fonte_id": "infomoney", "data_pub": "2026-09-13T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Mendonça afirmou que o acesso integral ao celular de Vorcaro pode tumultuar o julgamento sobre Moraes. Ele argumentou que isso pode prejudicar as investigações sobre o Master e desviar o foco da sessão marcada para terça-feira.", "titulo_pt": "Mendonça diz que abrir celular de Vorcaro pode tumultuar julgamento sobre Moraes", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 159100, "titulo": "Os argumentos de Dino para derrubar o sigilo da investigação ligada a Dark Horse", "url": "https://www.infomoney.com.br/politica/os-argumentos-de-dino-para-derrubar-o-sigilo-da-investigacao-ligada-a-dark-horse/", "fonte_id": "infomoney", "data_pub": "2026-09-13T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro argumenta que há riscos de vazamentos seletivos, falta de igualdade entre os investigados e possíveis mudanças de entendimento no STF que justificam a divulgação dos documentos da investigação relacionada a Dark Horse.", "titulo_pt": "Os argumentos de Dino para tornar públicos os documentos da investigação de Dark Horse", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 158995, "titulo": "PT libera R$ 3,9 milhões para eleger condenados no mensalão e no petrolão", "url": "https://veja.abril.com.br/politica/pt-libera-r-39-milhoes-para-eleger-condenados-no-mensalao-e-no-petrolao/", "fonte_id": "veja", "data_pub": "2026-09-13T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido dos Trabalhadores (PT) destinou R$ 3,9 milhões para financiar campanhas de candidatos condenados no processo do mensalão e do petrolão. Candidatos apoiados pelo partido exibem imagens de Lula nas redes sociais e contam com o apoio da base petista para se elegerem no Congresso.", "titulo_pt": "PT destina R$ 3,9 milhões para candidatos condenados no mensalão e petrolão", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 159047, "titulo": "ICB fez pagamentos duplicados que somam R$ 925 mil, diz Polícia Civil de SP", "url": "https://www.cnnbrasil.com.br/politica/icb-fez-pagamentos-duplicados-que-somam-r-925-mil-diz-policia-civil-de-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-13T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Civil de São Paulo informou que o Instituto Centro de Blood (ICB) realizou pagamentos duplicados que totalizam R$ 925 mil. Essa informação consta em uma representação policial sobre o financiamento do Dark Horse, que investiga uma ONG vinculada à Karina Gama.", "titulo_pt": "ICB fez pagamentos duplicados que somam R$ 925 mil, diz Polícia Civil de SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 158968, "titulo": "Mendonça diz que compartilhar conteúdo do celular de Vorcaro só serviria para 'tumultuar' e pode colocar investigações em risco", "url": "https://g1.globo.com/politica/noticia/2026/09/13/mendonca-celular-vorcaro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-13T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça do STF afirmou em ofício que compartilhar conteúdo do celular de Daniel Vorcaro só serviria para tumultuar o julgamento e colocar as investigações em risco. A declaração foi feita dois dias antes do julgamento no STF sobre mensagens entre Vorcaro e Alexandre de Moraes.", "titulo_pt": "Mendonça diz que compartilhar conteúdo do celular de Vorcaro só serviria para tumultuar e pode colocar investigações em risco", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 159035, "titulo": "Igape: Celina lidera com 41,1%, Arruda tem 15,7% e Grass soma 14%", "url": "https://www.metropoles.com/colunas/grande-angular/igape-celina-lidera-com-411-arruda-tem-157-e-grass-soma-14", "fonte_id": "metropoles", "data_pub": "2026-09-13T17:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento divulgado neste domingo (13) indica que Celina, candidata a prefeita, lidera com 41,1% das intenções de voto, seguida por Arruda com 15,7% e Grass com 14%. O estudo considera o cenário estimulado, onde os nomes dos candidatos são apresentados aos eleitores.", "titulo_pt": "Igape: celina lidera com 41,1%, Arruda tem 15,7% e Grass soma 14%", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 158996, "titulo": "Os pontos fracos de Lula na visão de uma importante gestora do mercado financeiro", "url": "https://veja.abril.com.br/brasil/os-pontos-fracos-de-lula-na-visao-de-uma-importante-gestora-do-mercado-financeiro/", "fonte_id": "veja", "data_pub": "2026-09-13T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um importante gestor financeiro descreve Lula como um 'presidente analógico em uma sociedade cada vez mais digital'.", "titulo_pt": "Os pontos fracos de Lula na visão de uma importante gestora do mercado financeiro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 159037, "titulo": "Caso Dark Horse: polícia acha outros quatro acordos entre ICB e pasta de SP", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/caso-dark-horse-policia-acha-outros-quatro-acordos-entre-icb-e-pasta-de-sp", "fonte_id": "metropoles", "data_pub": "2026-09-13T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Civil encontrou outros quatro acordos entre o Instituto de Ciência e Tecnologia (ICB) e a Secretaria de Inovação e Tecnologia. Os documentos foram liberados por Dino.", "titulo_pt": "Caso Dark Horse: polícia encontra mais quatro acordos entre ICB e pasta de SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 159052, "titulo": "Parte dos pagamentos do WiFi Livre SP ocorreu sem nota fiscal", "url": "https://www.cnnbrasil.com.br/politica/parte-dos-pagamentos-do-wifi-livre-sp-ocorreu-sem-nota-fiscal/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-13T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Parte dos pagamentos do programa WiFi Livre SP ocorreu sem nota fiscal. O projeto foi operacionalizado por uma ONG ligada à produtora de um filme do presidente Bolsonaro, e o contrato está sendo investigado pela Polícia Civil.", "titulo_pt": "Parte dos pagamentos do WiFi Livre SP foi feita sem nota fiscal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 159054, "titulo": "Pedido de vista em julgamento sobre Moraes anteciparia votos de ministros", "url": "https://www.cnnbrasil.com.br/politica/pedido-de-vista-em-julgamento-sobre-moraes-anteciparia-votos-de-ministros/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-13T16:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O julgamento sobre Alexandre de Moraes poderia ser suspenso, permitindo que os ministros da Corte revelassem antecipadamente suas posições sobre a apuração envolvendo o ministro. Essa possibilidade de vista antecipada poderia influenciar a dinâmica do julgamento.", "titulo_pt": "Pedido de vista no julgamento sobre Moraes anteciparia votos de ministros", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 158999, "titulo": "PF responde Fachin sobre informações de celular de Vorcaro", "url": "https://veja.abril.com.br/brasil/pf-responde-fachin-sobre-informacoes-de-celular-de-vorcaro/", "fonte_id": "veja", "data_pub": "2026-09-13T16:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF (Supremo Tribunal Federal) pediu detalhes sobre a custódia e o estado do material extraído do celular de Vorcaro. A Polícia Federal respondeu a essa solicitação.", "titulo_pt": "PF responde Fachin sobre informações de celular de Vorcaro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 158942, "titulo": "Vista à distância, a corrida eleitoral brasileira é 'non sense'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/mafalda-anjos/2026/09/vista-a-distancia-a-corrida-eleitoral-brasileira-e-non-sense.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-13T16:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Experimentem tentar explicar as eleições brasileiras a um jovem europeu que não acompanha política brasileira. É um exercício revelador.", "titulo_pt": "Vista à distância, a corrida eleitoral brasileira é 'non sense'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 158969, "titulo": "'Dark Horse': ao retirar sigilo de investigação, Dino cita suspeita de que Frias liderou esquema criminoso de desvios", "url": "https://g1.globo.com/politica/noticia/2026/09/13/dark-horse-ao-retirar-sigilo-de-investigacao-dino-cita-suspeita-de-que-frias-liderou-esquema-criminoso-de-desvios.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-13T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino, do Supremo Tribunal Federal (STF), afirmou que há indícios de que o deputado federal Mario Frias (PL-SP) pode ter liderado um esquema criminoso de desvios de recursos públicos. Dino retirou o sigilo de documentos que apuram um possível esquema de desvios e ocultação de verbas públicas, unificando-os sob sua relatoria.", "titulo_pt": "‘Dark Horse’: Dino cita suspeita de que Frias liderou esquema de desvios", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 158943, "titulo": "Grupo de milicianos de Vorcaro tinha até férias de fim de ano, mostram mensagens obtidas pela PF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/grupo-de-milicianos-de-vorcaro-tinha-ate-ferias-de-fim-de-ano-mostram-mensagens-obtidas-pela-pf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-13T16:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O grupo de milicianos liderado pelo policial aposentado Marilson Roseno da Silva, que atuava para obter informações sigilosas e intimidar pessoas a serviço do ex-banqueiro Daniel Vorcaro, planejava entrar em férias de fim de ano. Roseno da Silva cobrou uma definição sobre suas demandas para evitar que o serviço ficasse para a última hora.", "titulo_pt": "Grupo de milicianos de Vorcaro planejava férias de fim de ano", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 158944, "titulo": "PF responde a Fachin e diz que pode enviar dados integrais do celular de Vorcaro a ministros do STF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/pf-responde-a-fachin-e-diz-que-pode-enviar-dados-integrais-do-celular-de-vorcaro-a-ministros-do-stf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-13T16:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal informou ao STF que tem capacidade técnica para fornecer cópias integrais do celular de Daniel Vorcaro aos ministros que solicitaram, respeitando as medidas de sigilo necessárias.", "titulo_pt": "PF informa ao STF que pode enviar dados integrais do celular de Vorcaro a ministros", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 159479, "titulo": "More delegations visit Taiwan: MOFA", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/14/2003864219", "fonte_id": "taipei_times", "data_pub": "2026-09-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais delegações visitaram Taiwan, conforme informou o Ministério dos Negócios Estrangeiros (MOFA).", "titulo_pt": "Mais delegações visitam Taiwan: MOFA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 159488, "titulo": "Taiwan key for a China-free drone supply: source", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/14/2003864234", "fonte_id": "taipei_times", "data_pub": "2026-09-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Taiwan é crucial para a supply chain de drones sem a China, segundo uma fonte.", "titulo_pt": "Taiwan é chave para a supply chain de drones sem a china: fonte", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 159324, "titulo": "Trump doubles down on united Ireland comments on day two of visit", "url": "https://www.bbc.co.uk/news/articles/cx2z79n0eeno?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-13T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, reafirmou seus comentários sobre uma Irlanda unificada durante sua segunda visita à Irlanda. Ele afirmou que muitas pessoas concordam com suas observações.", "titulo_pt": "Trump reafirma comentários sobre uma irlanda unificada em visita à irlanda", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 159315, "titulo": "Wisconsin congressman survives emergency plane landing, swims to safety", "url": "https://www.npr.org/2026/09/13/nx-s1-5968081/wisconsin-congressman-survives-emergency-plane-landing-swims-to-safety", "fonte_id": "npr_news", "data_pub": "2026-09-13T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O congressista Tom Tiffany do Wisconsin sobreviveu a um pouso de emergência em um lago e nadou até água mais rasca. Tiffany e o piloto ligaram para o 911 do topo do avião.", "titulo_pt": "Congressista do wisconsin sobrevive a pouso de emergência em lago e se salva nadando", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 159320, "titulo": "Russia hits Ukrainian train shortly after Boris Johnson and top European officials leave station", "url": "https://www.bbc.co.uk/news/articles/cy5zg41dkqwo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-13T17:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um trecho de uma conversa com o ex-PM britânico Boris Johnson menciona que ele não entende a lógica de Putin em explodir uma locomotiva ucraniana estacionada na fronteira polonesa. Uma train se refere a um trem ucraniano que foi atingido por uma explosão perto da fronteira polonesa, após altos funcionários europeus e o ex-PM britânico terem deixado o local.", "titulo_pt": "Rússia atinge trem ucraniano perto da fronteira polonesa após saída de altos funcionários", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 159462, "titulo": "Senior Western figures at Ukraine station before Russia train strike, rail operator says", "url": "https://www.scmp.com/news/world/russia-central-asia/article/3367370/senior-western-figures-ukraine-station-russia-train-strike-rail-operator-says?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-13T17:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A operadora ferroviária estatal ucraniana, Ukrzaliznytsia, informou que figuras importantes da Europa Ocidental, como o ex-primeiro-ministro britânico Boris Johnson e o ex-diretor do CIA David Petraeus, estavam em uma estação ferroviária ucraniana no oeste do país, perto da fronteira com a Polônia, momentos antes do ataque russo a um trem que viajava para Varsóvia. O incidente ocorreu perto da fronteira ucraniana-polonesa.", "titulo_pt": "Figuras de alto nível ocidentais estavam em estação ucraniana antes do ataque russo a trem", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 159422, "titulo": "Fonti italiane, fermato e non evacuato il treno su cui viaggiava Fabrizio Saggio", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/13/fonti-italiane-fermato-e-non-evacuato-il-treno-su-cui-viaggiava-fabrizio-saggio_479d8b3f-7be6-49a1-aa73-36cad90894cd.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-13T17:35:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Fabrizio Saggio, conselheiro de segurança nacional, viajava no trenço que ligava a Ucrânia à Polônia. As autoridades italianas detiveram o trenço, mas não o evacuaram.", "titulo_pt": "Fonte italiana: trenço com Fabrizio Saggio não foi evacuado e permanece detido", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 159423, "titulo": "Tusk, 'l'escalation delle azioni russe sta diventando realtà'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/13/tusk-lescalation-delle-azioni-russe-sta-diventando-realta_fc496489-133b-403b-956b-3438e4e05a7d.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-13T17:35:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro polonês afirma que não pode ser descartado o risco de ações russas se estenderem ao território polonês. A escalada das ações russas está se tornando realidade.", "titulo_pt": "Tusk, a escalada das ações russas está se tornando realidade", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 159173, "titulo": "Ucrania y Polonia denunciaron que Rusia atacó un tren que iba de Kiev a Varsovia con 206 pasajeros a bordo", "url": "https://www.lanacion.com.ar/el-mundo/ucrania-y-polonia-denunciaron-que-rusia-ataco-un-tren-que-iba-de-kiev-a-varsovia-con-206-pasajeros-a-nid13092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-13T17:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Ucrânia e Polônia acusaram a Rússia de atacar um trem com 206 passageiros que viajava de Kiev a Varsovia. O impacto ocorreu a dois quilômetros da fronteira polonesa. O Kremlin afirmou que os vagões eram usados para 'transportar carga militar'.", "titulo_pt": "Ucrânia e polônia denunciam ataque de Rússia a trem com 206 passageiros entre Kiev e Varsovia", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 159244, "titulo": "Voting under way in Sweden with far right eyeing first role in government", "url": "https://www.theguardian.com/world/2026/sep/13/voting-under-way-in-sweden-with-far-right-eyeing-first-role-in-government", "fonte_id": "guardian_world", "data_pub": "2026-09-13T17:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As eleições gerais na Suécia estão em andamento, com o partido de extrema-direita com raízes neonazistas em posição de obter cargos ministeriais se a aliança de direita vencer. As pesquisas indicam uma disputa muito apertada, com a possibilidade de o Partido dos Democratas da Suécia entrar no governo pela primeira vez.", "titulo_pt": "Votação em andamento na suécia com partido de extrema-direita mirando primeiro papel no governo", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 159237, "titulo": "Iran Will Meet With Gulf Arab States as Mideast Conflict Widens", "url": "https://www.nytimes.com/2026/09/13/world/middleeast/iran-meeting-gulf-arab-states.html", "fonte_id": "nyt_world", "data_pub": "2026-09-13T17:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Negociações estão programadas para ocorrer amanhã, segundo autoridades, enquanto um navio foi alvo no Estreito de Ormuz e aliados iranianos em Yemen afirmaram ter realizado um novo ataque contra a Arábia Saudita.", "titulo_pt": "Irã irá se encontrar com estados árabes do golfo à medida que se agrava o conflito no oriente médio", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 159404, "titulo": "Israeli forces detain foreign activist at Al-Mughayyir checkpoint", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-forces-detain-foreign-activist-al-mughayyir-checkpoint", "fonte_id": "middle_east_eye", "data_pub": "2026-09-13T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças israelenses detiveram um ativista estrangeiro e apreenderam seu veículo em um bloqueio na entrada ocidental do vilarejo de Al-Mughayyir, próximo a Ramallah, em terras ocupadas da Cisjordânia. O bloqueio também causou congestionamento no trânsito e interrompeu o movimento dos residentes locais.", "titulo_pt": "Forças israelenses detêm ativista estrangeiro em bloqueio de Al-Mughayyir", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 159261, "titulo": "Rusia ataca la zona fronteriza entre Polonia y Ucrania, a dos kilómetros de territorio OTAN", "url": "https://elpais.com/internacional/2026-09-13/rusia-ataca-la-zona-fronteriza-entre-polonia-y-ucrania-a-pocos-kilometros-de-territorio-otan.html", "fonte_id": "elpais_america", "data_pub": "2026-09-13T17:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Rússia realiza ataques na zona fronteiriça entre Polônia e Ucrânia, a dois quilômetros de território da OTAN. O aeroporto de Vilnius, na Lituânia, suspendeu suas operações devido a possíveis drones no ar.", "titulo_pt": "Rússia ataca zona fronteiriça entre polônia e Ucrânia, a dois quilômetros de território da Otan", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 159571, "titulo": "Trump pokes the U.K., and Ireland’s unity debate catches fire", "url": "https://www.washingtonpost.com/world/2026/09/13/uk-debate-over-ireland-unification-catches-fire-after-trump-comments/", "fonte_id": "washington_post_world", "data_pub": "2026-09-13T17:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O comentário de Trump sobre o conflito envolvendo o Reino Unido e Irlanda do Norte gerou incerteza sobre se ele estava apoiando a Irlanda, provocando o Reino Unido, ou falando sem pensar. Isso ocorre após décadas de neutralidade da Casa Branca em relação ao assunto.", "titulo_pt": "Trump se pronuncia sobre o conflito entre reino unido e irlanda do norte, aceso debate sobre unidade", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 159333, "titulo": "Poll: Le Pen begins presidential campaign in strongest position ever amid worried, angry electorate", "url": "https://www.lemonde.fr/en/politics/article/2026/09/13/2027-presidential-election-le-pen-begins-campaign-in-strongest-position-ever-amid-worried-angry-electorate_6757478_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-13T17:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na cena política francesa polarizada, Marine Le Pen do Rassemblement National está registrando suporte inédito, enquanto Jean-Luc Mélenchon, do extremo esquerda, está construindo uma base sólida. O Le Monde relata que a corrida presidencial está gerando grande interesse entre eleitores preocupados com o futuro, com espaço aberto para outros candidatos.", "titulo_pt": "Pesquisa: le Pen inicia campanha presidencial em sua posição mais forte, com eleitorado preocupado e irritado", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 159245, "titulo": "Donald Trump doubles down on support for united Ireland", "url": "https://www.theguardian.com/uk-news/2026/sep/13/donald-trump-doubles-down-on-support-for-united-ireland", "fonte_id": "guardian_world", "data_pub": "2026-09-13T16:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump reafirmou seu apoio à unificação da Irlanda e ignorou a oposição de Andy Burnham a um referendo. O presidente americano também comentou sobre a resposta do primeiro-ministro britânico, afirmando que as coisas tendem a acontecer naturalmente.", "titulo_pt": "Trump reafirma apoio à unificação da irlanda", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 159496, "titulo": "Central bank pressured to raise rates", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/14/2003864204", "fonte_id": "taipei_times", "data_pub": "2026-09-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ainda não há informações suficientes sobre a pressão para aumentar as taxas de juros por parte do banco central. O texto original não fornece detalhes adicionais sobre essa pressão ou as razões por trás dela.", "titulo_pt": "Banco central pressionado a aumentar taxas de juros", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 159498, "titulo": "All eyes on US Fed to tackle high inflation", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/14/2003864206", "fonte_id": "taipei_times", "data_pub": "2026-09-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Todos os olhares estão voltados para o Fed dos EUA para combater a alta inflação.", "titulo_pt": "Todos os olhos no Fed dos EUA para enfrentar a alta inflação", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 159461, "titulo": "Ahead of US Fed meeting, Trump says America should have world’s lowest interest rate", "url": "https://www.scmp.com/news/world/africa/article/3367371/ahead-us-fed-meeting-trump-says-america-should-have-worlds-lowest-interest-rate?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-13T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump afirmou que o país deveria ter a taxa de juros mais baixa do mundo antes da próxima reunião do fonte", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 159106, "titulo": "Quais são as séries mais premiadas na história do Emmy?", "url": "https://canaltech.com.br/entretenimento/emmy-quais-sao-series-mais-premiadas-historia/", "fonte_id": "canaltech", "data_pub": "2026-09-13T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Emmy Awards é a premiação mais importante da televisão norte-americana, com a 78ª edição marcada para o dia 14 de setembro. Séries como The Pitt e Hacks lideram o ranking de premiações nessa edição.", "titulo_pt": "Quais são as séries mais premiadas na história do Emmy?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 159107, "titulo": "Kindle ficou 50% mais caro: 5 alternativas mais baratas para comprar agora", "url": "https://canaltech.com.br/e-reader/kindle-ficou-50-mais-caro-5-alternativas-mais-baratas-para-comprar-agora/", "fonte_id": "canaltech", "data_pub": "2026-09-13T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Kindle de 11ª geração, modelo de entrada de 16 GB, aumentou de preço em 50% no Brasil, passando de R$ 599 para R$ 899. O reajuste afetou todos os modelos da linha e levou a um aumento nas buscas por alternativas mais baratas.", "titulo_pt": "Kindle ficou 50% mais caro: 5 alternativas mais baratas para comprar agora", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 158947, "titulo": "Se a IA é um risco existencial, o que fazer?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/ronaldolemos/2026/09/se-a-ia-e-um-risco-existencial-o-que-fazer.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-13T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na última semana, líderes da inteligência artificial nos Estados Unidos argumentaram que a tecnologia representa um risco existencial para a humanidade. O mundo assistiu, impressionado, a essas manifestações.", "titulo_pt": "Se a IA é um risco existencial, o que fazer?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 159158, "titulo": "Gobierno de EEUU reticente a regular la IA, los demócratas lo consideran urgente", "url": "https://www.clarin.com/estados-unidos/gobierno-de-eeuu-reticente-a-regular-la-ia-los-democratas-lo-consideran-urgente_0_t8AvUewTHK.html", "fonte_id": "clarin", "data_pub": "2026-09-13T17:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O debate sobre a regulamentação da inteligência artificial se intensifica nos Estados Unidos, com lideranças políticas divididas. Enquanto os republicanos liderados por Trump se opõem a restrições, democratas consideram a regulamentação urgente, a partir das advertências de especialistas sobre os riscos potenciais da tecnologia.", "titulo_pt": "Governo dos EUA relutante em regular a IA, democratas consideram urgente", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 159367, "titulo": "Anthropic's Amodei says China presents 'toughest dilemma' for his proposed AI slowdown", "url": "https://www.cnbc.com/2026/09/13/china-dilemma-ai-slowdown-anthropic.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-13T16:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Demis Hassabis, presidente do Google DeepMind, e outros líderes de empresas de inteligência artificial, como Sam Altman, da OpenAI, e Elon Musk, apoiaram a proposta deslowdowm da IA feita por Dario Amodei, da Anthropic.", "titulo_pt": "Amodei diz que a China representa o maior desafio para a proposta de aceleração da IA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 159509, "titulo": "Obama urges Democrats to have a ‘clear plan’ for AI safeguards", "url": "https://techcrunch.com/2026/09/13/obama-urges-democrats-to-have-a-clear-plan-for-ai-safeguards/", "fonte_id": "techcrunch", "data_pub": "2026-09-13T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente dos Estados Unidos, Barack Obama, encorajou os democratas a incluírem a inteligência artificial em seus principais objetivos políticos e a desenvolver um plano claro para abordar as preocupações em relação ao impacto econômico e à segurança da tecnologia.", "titulo_pt": "Obama incentiva democratas a fazer da IA uma de suas principais agendas", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 159329, "titulo": "Johnson calls for AI solutions but says Congress won't take the lead", "url": "https://www.axios.com/2026/09/13/ai-safety-congress-law-mike-johnson", "fonte_id": "axios", "data_pub": "2026-09-13T16:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder da Câmara dos Representantes, Mike Johnson (Republicano-Louisiana), declarou que o Congresso não será responsável pela regulação da segurança do AI. Ele sugere que as empresas de AI devem adotar protocolos de segurança por conta própria.", "titulo_pt": "Johnson afirma que congresso não liderará na regulação de segurança de AI", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 159510, "titulo": "TechCrunch Mobility: Lyft has entered the robotaxi chat", "url": "https://techcrunch.com/2026/09/13/techcrunch-mobility-lyft-has-entered-the-robotaxi-chat/", "fonte_id": "techcrunch", "data_pub": "2026-09-13T16:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lyft está entrando no mercado dos táxis robóticos. O TechCrunch Mobility continua sendo o principal recurso para informações sobre o futuro do transporte e o papel cada vez mais importante que a inteligência artificial está desempenhando nesse setor.", "titulo_pt": "Techcrunch Mobility: lyft entra no mercado dos táxis robóticos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 159371, "titulo": "Donald Trump rejects calls from tech bosses for an AI slowdown", "url": "https://www.ft.com/content/cae60732-f929-4735-a627-db8c14e7c7ed?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-13T15:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Donald Trump rejeitou pedidos de chefes de tecnologia para uma pausa no desenvolvimento de inteligência artificial. Ele denunciou as demandas por regulamentação como medos existenciais sobre a tecnologia que estão tomando centro na política americana.", "titulo_pt": "Trump rejeita chamados de chefes de tecnologia para um freio no AI", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 158950, "titulo": "Trump critica 'forças negativas' que querem desacelerar a IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/trump-critica-forcas-negativas-que-querem-desacelerar-a-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-13T15:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, criticou aqueles que querem desacelerar o desenvolvimento da inteligência artificial, considerando-os forças negativas. Esta posição foi expressa em meio a crescentes preocupações sobre os riscos associados à IA.", "titulo_pt": "Trump critica 'forças negativas' que querem desacelerar a IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 159385, "titulo": "What are the five pros and cons of artificial intelligence?", "url": "https://www.aljazeera.com/news/2026/9/13/what-are-the-five-pros-and-cons-of-artificial-intelligence?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-13T15:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial cria oportunidades na programação e na automação, mas especialistas alertam sobre riscos para os trabalhadores em estágios iniciais de carreira.", "titulo_pt": "Quais são os cinco prós e contras da inteligência artificial?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 159004, "titulo": "CEO da Anthropic pede que empresas desacelerem avanço da inteligência artificial", "url": "https://veja.abril.com.br/tecnologia/ceo-da-anthropic-pede-que-empresas-desacelerem-avanco-da-inteligencia-artificial/", "fonte_id": "veja", "data_pub": "2026-09-13T15:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da Anthropic, Dario Amodei, pediu que as empresas desacelerem o avanço da inteligência artificial, alegando que os sistemas estão evoluindo rapidamente e que os mecanismos de segurança podem não acompanhar as novas capacidades.", "titulo_pt": "CEO da Anthropic pede desaceleração do avanço da inteligência artificial", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 159513, "titulo": "Waymo pulls over, calls cops on riders with a ghost gun", "url": "https://www.theverge.com/transportation/994405/waymo-pulls-over-calls-cops-on-riders-with-a-ghost-gun", "fonte_id": "the_verge", "data_pub": "2026-09-13T14:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois jovens foram presos em São Francisco após serem flagrados em um táxi robótico Waymo com uma arma de plástico carregada. O veículo parou e acionou a polícia, que levou os jovens para um centro de detenção juvenil.", "titulo_pt": "Waymo para e chama a polícia sobre passageiros com uma arma de plástico carregada", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 159551, "titulo": "On this day in space! Sept. 13, 2007: Japan launches Kaguya spacecraft to the moon to map the lunar surface in HD", "url": "https://www.space.com/space-exploration/on-this-day-in-space-september-13-2026", "fonte_id": "space_com", "data_pub": "2026-09-13T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 13 de setembro de 2007, o Japão lançou o foguetão Kaguya para a lua com o objetivo de mapear a superfície lunar em alta definição.", "titulo_pt": "13 De setembro de 2007: Japão lança foguetão Kaguya para mapear a lua em HD", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 159525, "titulo": "Luminescence dating pushes age of South Dakota's Mammoth Site back by more than 100,000 years", "url": "https://phys.org/news/2026-09-luminescence-dating-age-south-dakota.html", "fonte_id": "phys_org", "data_pub": "2026-09-13T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A datação luminiscente redefiniu a idade dos restos de mamutes no Sítio Mamut do Sudão, nos Estados Unidos, empurrando-a para mais de 160.000 anos, cerca de 100.000 anos a mais do que o valor anterior de 26.000 anos.", "titulo_pt": "Datação luminiscente redefine a idade dos mamutes do sítio mamut do sudão", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 159526, "titulo": "The tourism industry is slowly waking up to solo travelers' needs", "url": "https://phys.org/news/2026-09-tourism-industry-slowly-solo.html", "fonte_id": "phys_org", "data_pub": "2026-09-13T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de viajantes solitários está aumentando e a indústria do turismo está começando a prestar mais atenção a suas necessidades. Pesquisas online mostraram que as buscas por 'viagem solitária' atingiram um recorde este ano, com as buscas por 'mulheres viajando sozinhas' registrando um pico de 15 anos.", "titulo_pt": "O setor de turismo começa a notar as necessidades dos viajantes solitários", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 159527, "titulo": "Gravitational-wave analysis narrows the search for black hole impostors", "url": "https://phys.org/news/2026-09-gravitational-analysis-narrows-black-hole.html", "fonte_id": "phys_org", "data_pub": "2026-09-13T14:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Black holes são regiões do espaço-tempo onde a gravidade é tão forte que nada pode escapar, nem mesmo a luz. A análise de ondas gravitacionais está restringindo a busca por possíveis objetos compactos que não sejam buracos negros, mas que também produzam ondas gravitacionais similares àquelas geradas por fusões de buracos negros.", "titulo_pt": "Análise de ondas gravitacionais reduz a busca por buracos negros falsos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 159528, "titulo": "Fish may be highly sensitive to antidepressants found in water", "url": "https://phys.org/news/2026-09-fish-highly-sensitive-antidepressants.html", "fonte_id": "phys_org", "data_pub": "2026-09-13T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitos medicamentos que atuam no sistema nervoso humano, como antidepressivos, permanecem biologicamente ativos após saírem do corpo. Essas substâncias e seus metabólitos podem persistir nos efluentes domésticos e eventualmente chegar ao mar, rios ou outros ambientes aquáticos.", "titulo_pt": "Peixes podem ser altamente sensíveis a antidepressivos encontrados na água", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 158939, "titulo": "Cientistas querem descobrir se há detritos de civilizações alienígenas na Lua", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/cientistas-querem-descobrir-se-ha-detritos-de-civilizacoes-alienigenas-na-lua.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-13T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas planejam investigar a Lua em busca de evidências de detritos de civilizações alienígenas avançadas, como naves estelares e estruturas gigantes.", "titulo_pt": "Cientistas querem descobrir se há detritos de civilizações alienígenas na Lua", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 159553, "titulo": "NASA astronaut Jessica Meir shares zero-G curly hair tips from the ISS (video)", "url": "https://www.space.com/space-exploration/international-space-station/nasa-astronaut-jessica-meir-shares-zero-g-curly-hair-tips-from-the-iss-video", "fonte_id": "space_com", "data_pub": "2026-09-13T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astronauta Jessica Meir, da NASA, compartilhou dicas de penteados para cabelos crespos durante sua estadia na Estação Espacial Internacional (ISS).", "titulo_pt": "Astronauta Jessica Meir compartilha dicas de penteados para cabelos crespos da ISS (vídeo)", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 159535, "titulo": "Scientists find a new layer of Alzheimer’s hidden in the genome", "url": "https://www.sciencedaily.com/releases/2026/09/260912220051.htm", "fonte_id": "science_daily", "data_pub": "2026-09-13T13:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram que a organização tridimensional do DNA está desorganizada em várias células do cérebro afetadas pela doença de Alzheimer, alterando a atividade de genes importantes. Essa descoberta revela um nível anteriormente subexplorado da doença que pode abrir novas possibilidades para o entendimento e o tratamento da doença de Alzheimer.", "titulo_pt": "Cientistas encontram nova camada da doença de Alzheimer no genoma", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 159529, "titulo": "Cataract surgery will be needed in space, surgeon predicts", "url": "https://phys.org/news/2026-09-cataract-surgery-space-surgeon.html", "fonte_id": "phys_org", "data_pub": "2026-09-13T13:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um oftalmologista, apaixonado por espaço desde a infância, prevê que, à medida que astronautas iniciarem viagens à lua e Marte no futuro próximo, cirurgias oculares no espaço eventualmente se tornarão necessárias.", "titulo_pt": "Cirurgia de catarata no espaço será necessária, preveem oftalmologista", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 159536, "titulo": "Physicists can’t agree on how the Universe works", "url": "https://www.sciencedaily.com/releases/2026/09/260912220041.htm", "fonte_id": "science_daily", "data_pub": "2026-09-13T13:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um levantamento mundial de físicos revelou pouca concordância sobre algumas das maiores mistérios do universo. A maioria não apoia o modelo cosmológico padrão ou qualquer teoria única de gravidade quântica.", "titulo_pt": "Físicos não concordam sobre como o universo funciona", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 159082, "titulo": "Fumo passivo está ligado a 1,6 milhão de mortes por ano, aponta estudo", "url": "https://exame.com/ciencia/fumo-passivo-esta-ligado-a-16-milhao-de-mortes-por-ano-aponta-estudo/", "fonte_id": "exame", "data_pub": "2026-09-13T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo global indica que o fumo passivo causa a morte de aproximadamente 1,6 milhão de pessoas por ano. Mais de 2,7 bilhões de pessoas inalam fumaça de tabaco sem fumar, com mulheres e crianças sendo as principais afetadas.", "titulo_pt": "Fumo passivo está ligado a 1,6 milhão de mortes por ano, aponta estudo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 159530, "titulo": "A 1,000-fold longer charge lifetime helps organic catalyst produce solar hydrogen faster", "url": "https://phys.org/news/2026-09-longer-lifetime-catalyst-solar-hydrogen.html", "fonte_id": "phys_org", "data_pub": "2026-09-13T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores do Instituto de Tecnologia de Materiais de Ningbo (NIMTE) da Academia Chinesa de Ciências (CAS), em colaboração com o Instituto Técnico de Física e Química da CAS, desenvolveram um framework orgânico covalente (COF) ligado a coumarina que permite a separação fotocatalítica de água com alta eficiência para a produção de hidrogênio.", "titulo_pt": "Tempo de carregamento 1.000 vezes maior ajuda no catalisador orgânico produzir hidrogênio solar mais rápido", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 159531, "titulo": "NASA's next great observatory could spot oceans on distant worlds", "url": "https://phys.org/news/2026-09-nasa-great-observatory-oceans-distant.html", "fonte_id": "phys_org", "data_pub": "2026-09-13T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está planejando um novo observatório espacial que poderia detectar oceans em mundos distantes. Embora mais de 5.500 exoplanetas tenham sido descobertos, ainda não foi possível confirmar a existência de um oceano líquido em nenhum deles.", "titulo_pt": "Próxima grande observatória da nasa pode identificar oceans em mundos distantes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 159554, "titulo": "James Webb Space Telescope discovers the rings of tiny solar system body Chariklo are changing", "url": "https://www.space.com/astronomy/james-webb-space-telescope/james-webb-space-telescope-discovers-the-rings-of-tiny-solar-system-body-chariklo-are-changing", "fonte_id": "space_com", "data_pub": "2026-09-13T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos usaram o Telescópio Espacial James Webb para descobrir que o sistema anelar do corpo do sistema solar menor Chariklo é ainda mais interessante do que se sabia anteriormente.", "titulo_pt": "James Webb Space Telescope descobre que anéis do pequeno corpo do sistema solar Chariklo estão mudando", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 159541, "titulo": "Most men don’t know dairy is linked to prostate cancer risk", "url": "https://www.sciencedaily.com/releases/2026/09/260911214259.htm", "fonte_id": "science_daily", "data_pub": "2026-09-13T12:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa revelou que apenas 20% dos homens sabem que o consumo de leite pode aumentar o risco de câncer de próstata. Estudos associam dietas à base de plantas a riscos significativamente menores de câncer de próstata, sua progressão e recorrência.", "titulo_pt": "A maioria dos homens ignora a ligação entre o consumo de leite e o risco de câncer de próstata", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 159471, "titulo": "Hong Kong teen battling rare disease creates AI avatar to ensure his story lives on", "url": "https://www.scmp.com/news/hong-kong/society/article/3367361/hong-kong-teen-fatal-disease-creates-ai-avatar-ensure-his-story-lives?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-13T12:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um adolescente de Hong Kong com uma rara doença muscular criou um avatar de inteligência artificial (IA) de si mesmo, com o objetivo de que a versão digital continue compartilhando sua história de vida e mensagem de perseverança após sua morte. Chen Tsz-kin, de 17 anos, apresentou o 'AI Tsz-kin' na Universidade de Hong Kong (HKU) algumas semanas antes de completar 18 anos.", "titulo_pt": "Jovem de hong Kong com doença rara cria avatar de IA para garantir que sua história continue", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 159485, "titulo": "Chinese microdrama distorts history: academic", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/14/2003864231", "fonte_id": "taipei_times", "data_pub": "2026-09-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um acadêmico afirma que um microdrama chinês distorce a história. O trabalho acadêmico critica a representação histórica no conteúdo do microdrama.", "titulo_pt": "Acadêmico critica distorção histórica em microdrama chinês", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 159486, "titulo": "CCP and China becoming one and the same: experts", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/14/2003864232", "fonte_id": "taipei_times", "data_pub": "2026- , apresentado pelo repórter David Brooks. O programa discute questões fundamentais da vida humana com pensadores, escritores e artistas, abordando temas como o que nos define como humanos, o que dá sentido à vida e como construir relações e sociedades mais justas.", "titulo_pt": "The Atlantic lança novo Podcast em vídeo: The Permanent Questions com David Brooks", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 159338, "titulo": "France public radio staff strike over commentator from far-right weekly", "url": "https://www.lemonde.fr/en/france/article/2026/09/13/france-public-radio-staff-strike-over-commentator-from-far-right-weekly_6757476_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-13T16:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde agosto, Charles Sapin, vice-diretor-gerente da revista semanal Valeurs Actuelles de extrema-direita, tem apresentado comentários políticos semanais na France Inter, a rádio mais ouvida do país.", "titulo_pt": "Funcionários da rádio pública francesa em greve contra comentarista da revista de extrema-direita", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 159225, "titulo": "Kast llama a la unidad tras su primer Te Deum Evangélico: “Chile es la patria común de todos, más allá de nuestras diferencias”", "url": "https://www.latercera.com/nacional/noticia/kast-llama-a-la-unidad-tras-su-primer-te-deum-evangelico-chile-es-la-patria-comun-de-todos-mas-alla-de-nuestras-diferencias/", "fonte_id": "la_tercera", "data_pub": "2026-09-13T16:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em 2026, após seis anos realizados em diferentes templos da Região Metropolitana, o Te Deum Evangélico retornou à sua sede histórica na Catedral Evangélica de Chile. O presidente Kast enfatizou que desde sua posse, tem buscado unidade nacional.", "titulo_pt": "Kast apela à unidade após Te Deum Evangélico em sua sede histórica", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 159337, "titulo": "Venice Film Festival: May el-Toukhy's 'Woman Unknown' wins Golden Lion at politically charged edition", "url": "https://www.lemonde.fr/en/culture/article/2026/09/13/venice-film-festival-may-el-toukhy-s-woman-unknown-wins-golden-lion-at-politically-charged-edition_6757474_30.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-13T16:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A diretora dinamarquesa-egípcia May el-Toukhy dedicou seu filme 'Woman Unknown' ao 'povo invisível e sem voz'. O documentarista Ilia Khrjanovski recebeu o Silver Lion e dedicou-o aos ucranianos que lutam por liberdade. O júri especial concedeu o prêmio a um documentário israelense sobre civis mortos pelo exército israelense em Gaza.", "titulo_pt": "Festival de veneza: 'mulher desconhecida' de may el-toukhy vence leão de ouro em edição politicamente carregada", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 159565, "titulo": "‘Practical Magic 2,’ the Sequel to a 28-Year-Old Box Office Bomb, Opens to Lackluster $30 Million", "url": "https://www.indiewire.com/news/box-office/practical-magic-2-box-office-bomb-sandra-bullock-nicole-kidman-1235216664/", "fonte_id": "indiewire", "data_pub": "2026-09-13T16:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A sequência de 'Practical Magic', lançada 28 anos após o primeiro filme, arrecadou apenas $30 milhões nas bilheterias, um resultado fraco. O artigo critica a indústria cinematográfica por produzir sequências para filmes antigos que já não têm o interesse do público atual.", "titulo_pt": "Practical Magic 2", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 158955, "titulo": "Filme recria de forma inteligente o programa de rádio PRK-30", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/filme-recria-de-forma-inteligente-o-programa-de-radio-prk-30.shtml
