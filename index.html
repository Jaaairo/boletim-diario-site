<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "03/09/2026 19:20", "stats": {"noticias_novas": 605, "resumos_gerados": 234}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Congresso Nacional aprovou a medida provisória que eliminou a 'taxa das blusinhas', um imposto de 20% sobre compras internacionais até US$ 50 que já está em vigor e se tornará permanente após a sanção do presidente Lula. O projeto de lei do governo que termina o sistema 6×1 pode ser dividido para ganhar apoio dos deputados ligados à educação, oferecendo a relatoria para aqueles que atuam no tema. O ex-governador José Roberto Arruda anunciou que recorrerá ao Tribunal Superior Eleitoral (TSE) após ter sua candidatura ao governo do Distrito Federal negada pelo Tribunal Regional Eleitoral do DF. O Ibovespa encerrou o dia em leve desvalorização após 11 dias consecutivos de alta, com especialistas indicando que a volatilidade do índice em setembro está relacionada à proximidade das eleições. O Congresso Internacional de Direito Constitucional será realizado em outubro em Brasília, reunindo ministros de cortes superiores, juristas, acadêmicos, magistrados e especialistas do setor.", "mundo": "O governo brasileiro enfrenta tensões com a União Europeia devido a um veto à carne brasileira, levando a ameaças de medidas de reciprocidade. O terminal 1 do aeroporto de Berlim foi reaberto após um alarme de segurança, enquanto a Noruega capturou um navio russo, levando a uma disputa diplomática. O Instituto Iter, vinculado a André Mendonça, obteve R$ 10,7 milhões em dois anos através de contratos públicos, e o governo brasileiro está pressionando a UE sobre o conflito relacionado a carnes. A Nvidia anunciou a aquisição de Hugging Face por 12,93 bilhões de dólares, expandindo sua influência no campo da inteligência artificial. O Líbano recebeu o primeiro prisioneiro de guerra devolvido pelo Comitê Internacional da Cruz Vermelha, após solicitações de Beirute.\n\nIsrael propôs um plano para expulsar quase dois milhões de pessoas de Gaza em sete anos, incluindo compensação financeira para os países receptores dos migrantes. Em outro desenvolvimento, Andy Burnham, novo ministro do Interior do Reino Unido, discutiu segurança fronteiriça com o presidente francês Emmanuel Macron, visando fortalecer as relações entre o Reino Unido e a Europa. O Nepal planeja identificar vítimas das cheias através do DNA, enquanto a França registrou sua estação mais quente desde o início das medições. Na América do Sul, o encontro entre os presidentes Gabriel Boric e Horacio Cartes (Milei) durou apenas 35 minutos, com foco em disputas sobre o Estreito de Magallanes. No contexto global, a China é vista como um parceiro melhor para o Brasil do que os Estados Unidos, segundo Renan Santos, candidato do partido Missão. Além disso, o Canal de Panamá está limitando o número de navios que podem passar, o que pode causar atrasos nas entregas e aumentar os custos dos fretes, devido à crise no Estreito de Ormuz.", "economia": "A economia global enfrenta diversos desafios e avanços. A Volkswagen anunciou a redução de até 100.000 postos de trabalho até o final da década, refletindo os desafios de vendas e a crescente concorrência, especialmente da China. No Brasil, a Caixa Econômica introduziu uma nova funcionalidade que permite o parcelamento de transferências e pagamentos realizados por Pix através do aplicativo CAIXA. O Banco Central holandês transferiu mais de 78 toneladas de ouro de Nova York para Londres devido ao aumento das tensões geopolíticas. Por outro lado, o Reino Unido confirmou um investimento de 540 milhões de dólares no Fundo de Florestas Tropicais, liderado pelo Brasil. No setor financeiro, a Revolut recebeu uma licença bancária provisória nos Estados Unidos, um marco importante para a fintech britânica que busca expandir em território americano. Além disso, o Ibovespa encerrou o dia em nível estável, interrompendo uma sequência de 11 sessões de alta, e o dólar caiu pela quarta sessão consecutiva. A atividade de serviços no Brasil cresceu em agosto, conforme indicado pelo PMI, com a estabilização das novas encomendas e do emprego, além de uma melhora na confiança dos empresários. No setor de carnes, a União Europeia iniciou a suspensão da importação de produtos animais do Brasil, afetando carnes bovina, de frango e suína, além de mel, pescados e ovos, o que impacta diretamente o mercado brasileiro.", "tecnologia": "As despesas com centros de dados devem chegar a US$31,6 trilhões até 2050, refletindo a crescente importância desses centros em diversos setores. A Nvidia comprou a plataforma de inteligência artificial Hugging Face por US$12,9 bilhões, expandindo seu acesso à IA para desenvolvedores e instituições em todo o mundo. A OpenAI está implementando o modelo Astra para empresas de segurança cibernética e lançou um novo modelo, GPT-6 Astra, que pode marcar um importante avanço no desenvolvimento da IA. Esses eventos destacam a crescente importância da tecnologia de inteligência artificial em diversos setores, desde a segurança cibernética até a criação de veículos autônomos e a gestão de centros de dados.", "ciencia": "A ciência avança em vários campos, desde novas técnicas de agricultura regenerativa até a exploração espacial. Um novo remédio aprovado no Brasil para o câncer de pâncreas, que já se espalhou pelo corpo, aumenta as opções de tratamento para esta forma avançada do câncer. Além disso, a OpenAI anunciou o lançamento do GPT-6 Astra, que o presidente da empresa descreveu como um 'salto de geração' e potencialmente a chegada da inteligência artificial geral (AGI). Em pesquisa científica, a psilocibina, substância psicodélica presente nos cogumelos mágicos, pode proteger contra o dano nervoso causado pelo quimioterapia, oferecendo uma nova maneira de prevenir um efeito colateral comum do tratamento. Outros estudos destacam a importância de microorganismos na saúde do solo, a evolução dos mamíferos desde a era dos dinossauros e a descoberta de um novo material que pode levar a tecnologias de memória magnética mais eficientes. A Antártica continua sendo um desafio para a ciência climática, com as nuvens desta região remota ainda sendo uma das características menos compreendidas.", "cultura": "O filme 'Cavalo Selvagem Nove', dirigido por Martin McDonagh e estrelado por John Malkovich, estreou no Festival de Veneza, recebendo elogios e sendo considerado um forte candidato ao Oscar. A obra 'Le Disque', de Fernand Léger, da coleção do Museu Thyssen-Bornemisza, será exibida na Pinacoteca do Estado de São Paulo. A 28ª Bienal Internacional do Livro de São Paulo, que começa nesta sexta-feira, contará com a Espanha como país convidado de honra, destacando a importância cultural do evento na América Latina. Além disso, o evento 'Lavagem de São João', um dos maiores eventos de cultura afro-brasileira na Europa, programado para receber cerca de 60 mil participantes em Paris, destaca a relevância da cultura afro-brasileira na promoção cultural internacional.", "sociedade": "A sociedade brasileira enfrenta diversos desafios, como a questão do trabalho escravo, com o resgate de duas idosas que trabalhavam há décadas sob condições precárias em Belo Horizonte. O INSS anunciou que a fila será considerada apenas para pedidos que ultrapassam o fluxo mensal, mas ainda há 235 mil pedidos esperando mais de 45 dias. O Instituto Nacional do Seguro Social enfrenta críticas por não atender a todos os requerimentos em tempo hábil. Além disso, a China enviou o terceiro lote de ajuda ao Nepal após a avalanche, incluindo especialistas e assistência financeira. Em contrapartida, a Pensilvânia, nos Estados Unidos, enfrenta oposição de moradores à expansão de data centers, com explosões de dinamite causando perturbações na região. No Brasil, 33% das pessoas consideram a educação um desafio para jovens, conforme pesquisa da Ipsos, enquanto 53% desejam aumentos salariais para professores.", "meio_ambiente": "O Reino Unido planeja investir 2,7 bilhões de reais em um mecanismo financeiro para incentivar a preservação das florestas tropicais no Brasil, conforme informou o CNN Brasil. Em outro desenvolvimento, o Le Monde informou que a França registrou o verão mais quente da história, junto com a Bélgica e a Grã-Bretanha, após uma estação que assustou a Europa, que está aquecendo mais rapidamente no globo. No Chile, pinguins de Humboldt feridos estão sendo equipados com coletes de recuperação projetados para proteger feridas e prevenir o dano às suturas em processo de cura, conforme relatado pelo Euronews. Em contraste, o Science Daily destaca que o maior reservatório de Novo México atingiu apenas 1,4% da sua capacidade em julho de 2026, devido a anos de seca extrema e derretimento de neve recorde no outono anterior, enfatizando a crescente pressão sobre as reservas de água do Rio Grande.", "direitos_humanos": "Mais de 20 milhões de crianças enfrentam abuso sexual online anualmente, conforme relatório da UNICEF. Em outro desenvolvimento, mais de 80 pessoas morreram em um barco adrift nas Ilhas Canárias, após terem saído da Gâmbia há 27 dias. Na África do Sul, vítimas do massacre de Sharpeville em 1960 estão processando o governo, buscando compensação por crimes cometidos durante o apartheid. Além disso, a libertação de Ezra Jin, um pastor chinês, contrasta com a situação de outros líderes cristãos detidos. Em um caso particular, uma mulher síria notou o nome do irmão desaparecido em uma porta de cela em uma exposição em Damasco. No Nepal, milhares de crianças ainda não têm acesso a água segura após as inundações. Finalmente, 57 pessoas foram indiciadas em um esquema de golpe de romance baseado em inteligência artificial, e os Estados Unidos afirmam que um suposto plano de drone russo tem características típicas de terrorismo."}, "resumo_do_dia": {"politica_nacional": [{"id": 143608, "titulo": "Empresário que fez repasses a 'Dark Horse' diz que movimentava malas de dinheiro a mando de Vorcaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/empresario-que-fez-repasses-a-dark-horse-diz-que-movimentava-malas-de-dinheiro-a-mando-de-vorcaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-03T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Antônio Carlos Freixo Júnior, conhecido como Mineiro, foi responsável por fazer remessas financeiras e conseguir dinheiro vivo para Daniel Vorcaro, do Banco Master. Esse dinheiro era frequentemente entregue em malas devido ao seu volume.", "titulo_pt": "Empresário que fez repasses a 'Dark Horse' revela movimentação de dinheiro em malas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 143926, "titulo": "Furacão contra STF aumenta busca por nome antissistema, mas não rompe polarização", "url": "https://www.jota.info/opiniao-e-analise/colunas/democracia-em-transe/furacao-contra-stf-aumenta-busca-por-nome-antissistema-mas-nao-rompe-polarizacao", "fonte_id": "jota", "data_pub": "2026-09-03T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A busca por nomes antissistema para a terceira via continua, mas existe o risco de esses candidatos serem influenciados pelas pautas bolsonaristas. A polarização política persiste, não sendo rompida por essa busca.", "titulo_pt": "Furacão contra STF intensifica busca por nome antissistema, mas não rompe polarização", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 143689, "titulo": "Donald Trump apoia a criação de uma ‘Lei Rouanet’ americana", "url": "https://veja.abril.com.br/cultura/donald-trump-apoia-a-criacao-de-uma-lei-rouanet-americana/", "fonte_id": "veja", "data_pub": "2026-09-03T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, apoiou a criação de uma 'Lei Rouanet' americana, com o objetivo de incentivar a criação de empregos na indústria de TV e cinema.", "titulo_pt": "Trump defende 'Lei Rouanet' americana para tv e cinema", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 143690, "titulo": "A reação de delegados da PF à proposta de Gilmar de tirá-los do STF", "url": "https://veja.abril.com.br/brasil/a-reacao-de-delegados-da-pf-a-proposta-de-gilmar-de-tira-los-do-stf/", "fonte_id": "veja", "data_pub": "2026-09-03T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes sugeriu ao ministro Fachin que os delegados da Polícia Federal não atuem mais nos gabinetes do Supremo Tribunal Federal.", "titulo_pt": "Reação de delegados da PF à proposta de Gilmar de retirá-los do STF", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 143728, "titulo": "Arruda diz que recorrerá ao TSE após ter candidatura barrada no TRE", "url": "https://www.metropoles.com/colunas/grande-angular/arruda-diz-que-recorrera-ao-tse-apos-ter-candidatura-barrada-no-tre", "fonte_id": "metropoles", "data_pub": "2026-09-03T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Arruda anunciou que recorrerá ao Tribunal Superior Eleitoral (TSE) após ter sua candidatura barrada pelo Tribunal Regional Eleitoral do Distrito Federal (TRE-DF).", "titulo_pt": "Arruda recorrerá ao TSE após ter candidatura barrada no TRE", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 143623, "titulo": "Arruda diz que vai recorrer ao TSE para manter candidatura ao governo do DF; TRE negou registro por unanimidade", "url": "https://g1.globo.com/df/distrito-federal/eleicoes/2026/noticia/2026/09/03/arruda-diz-que-vai-recorrer-ao-tse-para-manter-candidatura-ao-governo-do-df-tre-negou-registro-por-unanimidade.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-03T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-governador José Roberto Arruda (PSD) anunciou que vai recorrer ao Tribunal Superior Eleitoral (TSE) para manter sua candidatura ao governo do Distrito Federal após o Tribunal Regional Eleitoral do DF rejeitar, por unanimidade, o registro da candidatura.", "titulo_pt": "Arruda anuncia recurso ao TSE para manter candidatura ao governo do DF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 143609, "titulo": "Justiça eleitoral barra candidatura de Arruda ao Governo do DF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/justica-eleitoral-barra-candidatura-de-arruda-ao-governo-do-df.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-03T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Regional Eleitoral do Distrito Federal (TRE-DF) negou a candidatura de José Roberto Arruda (PSD) ao Governo do Distrito Federal nesta quinta-feira (3).", "titulo_pt": "Justiça eleitoral barrar candidatura de Arruda ao Governo do DF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 143640, "titulo": "Congresso aprova redução do prazo de espera no INSS para análise prioritária de aposentadoria", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/congresso-aprova-reducao-do-prazo-de-espera-no-inss-para-analise-prioritaria-de-aposentadoria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou uma medida provisória que reduz o prazo de espera para a inclusão de aposentadorias e pensões na fila prioritária do INSS e da Perícia Médica Federal, de 45 para 30 dias. A aprovação foi realizada nesta quinta-feira (3) pelo governo Luiz Inácio Lula da Silva (PT).", "titulo_pt": "Senado aprova redução do prazo de espera para aposentadorias prioritárias no INSS", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 143928, "titulo": "STF mantém poder de requisição do MPU a órgãos estaduais", "url": "https://www.jota.info/stf/do-supremo/stf-mantem-poder-de-requisicao-do-mpu-a-orgaos-estaduais", "fonte_id": "jota", "data_pub": "2026-09-03T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ministros do Supremo Tribunal Federal (STF) mantiveram o poder do Ministério do Meio Ambiente (MPU) de requisitar órgãos estaduais para cumprir suas funções. A maioria entendeu que limitar essa prerrogativa poderia restringir o trabalho do órgão.", "titulo_pt": "STF mantém poder de requisição do MPU a órgãos estaduais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 143736, "titulo": "Câmara aprova projeto que permite incentivos a data centers já em 2026", "url": "https://www.metropoles.com/brasil/camara-aprova-projeto-que-permite-incentivos-a-data-centers-ja-em-2026", "fonte_id": "metropoles", "data_pub": "2026-09-03T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto permitirá incentivos fiscais para data centers a partir de 2026, através do Regime Especial de Tributação para Serviços de Datacenter (Redata). A proposta seguirá para o Senado após aprovação na Câmara.", "titulo_pt": "Câmara aprova projeto que permite incentivos a data centers a partir de 2026", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 143738, "titulo": "Bancada do PSol pede cassação de Nikolas após divulgação de áudio a Vorcaro", "url": "https://www.metropoles.com/sao-paulo/bancada-do-psol-pede-cassacao-de-nikolas-apos-divulgacao-de-audio-a-vorcaro", "fonte_id": "metropoles", "data_pub": "2026-09-03T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nikolas, deputado do PSol, teria pedido favores a Vorcaro, que afirmou ter bancado voos do parlamentar. A conversa foi divulgada nesta quinta-feira (3/9).", "titulo_pt": "Bancada do PSol pede cassação de Nikolas após divulgação de áudio a Vorcaro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 143624, "titulo": "Senado Federal aprova MP que auxilia na redução da fila do INSS", "url": "https://g1.globo.com/politica/noticia/2026/09/03/senado-federal-aprova-mp-que-auxilia-na-reducao-das-fila-do-inss.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-03T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado Federal aprovou uma medida provisória que altera um programa do INSS com o objetivo de reduzir a fila de processos. Aprovada sem alterações, a MP segue para promulgação e posterior transformação em lei.", "titulo_pt": "Senado aprova MP para reduzir fila do INSS", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 143697, "titulo": "Augusto Cury planeja ato de 7 de Setembro em reduto bolsonarista", "url": "https://veja.abril.com.br/politica/augusto-cury-planeja-ato-de-7-de-setembro-em-reduto-bolsonarista/", "fonte_id": "veja", "data_pub": "2026-09-03T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury planeja realizar um ato no Dia da Independência em Copacabana, um local associado ao movimento bolsonarista. O escritor anunciou uma caminhada no local.", "titulo_pt": "Augusto Cury planeja ato de 7 de Setembro em reduto bolsonarista", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 143792, "titulo": "Lula defende despesa com previdência e diz que acabou com fraude no INSS", "url": "https://www.cnnbrasil.com.br/politica/lula-defende-despesa-com-previdencia-e-diz-que-acabou-com-fraude-no-inss/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-03T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula anunciou no Palácio do Planalto que eliminou as filas do INSS. Ele também defendeu a despesa com a previdência e afirmou ter acabado com a fraude no INSS durante sua gestão.", "titulo_pt": "Lula anuncia fim das filas do INSS e defende despesa previdenciária", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 143625, "titulo": "Candidatos ao Senado em Mato Grosso participam de debate no g1", "url": "https://g1.globo.com/ms/mato-grosso-do-sul/eleicoes/2026/ao-vivo/g1-debate-candidatos-senado-mato-grosso-do-sul.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-03T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Candidatos ao Senado em Mato Grosso participaram de um debate no portal g1. Quatro candidatos confirmaram presença, enquanto dois recusaram o convite.", "titulo_pt": "Candidatos ao Senado em Mato Grosso participam de debate no g1", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 143626, "titulo": "Taxa das blusinhas: calculadora do g1 mostra quanto você pagaria com ou sem o imposto", "url": "https://g1.globo.com/economia/noticia/2026/09/03/calculadora-do-g1-taxa-das-blusinhas.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-03T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Congresso Nacional aprovou a medida provisória que cancelou a 'taxa das blusinhas', um imposto de 20% sobre compras internacionais de até US$ 50. A isenção do imposto já está em vigor e se tornará permanente após a sanção do presidente Lula.", "titulo_pt": "O que é a 'taxa das blusinhas', que lula cancelou após quase dois anos?", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 143871, "titulo": "El ministro de Seguridad de Israel presentó un proyecto para expulsar a casi dos millones de personas de Gaza en siete años", "url": "https://www.lanacion.com.ar/el-mundo/el-ministro-de-seguridad-de-israel-presento-un-proyecto-para-expulsar-a-casi-dos-millones-de-nid03092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-03T21:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ministro de Segurança de Israel apresentou um projeto para expulsar quase dois milhões de pessoas de Gaza em sete anos, com 250.000 habitantes sendo deslocados no primeiro ano, e a proposta inclui compensação financeira para os países receptores dos migrantes.", "titulo_pt": "Ministro de segurança de Israel apresenta projeto para expulsar quase dois milhões de pessoas de Gaza em sete anos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 143942, "titulo": "News live: Two more Australians confirmed safe in Nepal-Tibet floods; Hanson to make cost of living ‘worse’, union boss warns", "url": "https://www.theguardian.com/australia-news/live/2026/sep/04/anthony-albanese-pauline-hanson-actu-union-labor-one-nation-coalition-angus-taylor-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-09-03T21:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo australiano continua preocupado com os 36 cidadãos australianos que ainda não foram localizados após as inundações no Nepal-Tibet. O tesoureiro Jim Chalmers anunciou que dois australianos foram encontrados, mas expressou preocupação com os desaparecidos.", "titulo_pt": "Notícias em tempo real: dois australianos adicionais localizados em inundações no Nepal-Tibet; tesoureiro expressa preocupação com desaparecidos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 143731, "titulo": "Governo critica veto da UE à carne e cita medidas de reciprocidade", "url": "https://www.metropoles.com/brasil/governo-critica-veto-da-ue-a-carne-e-cita-medidas-de-reciprocidade", "fonte_id": "metropoles", "data_pub": "2026-09-03T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo brasileiro criticou o veto da União Europeia à carne brasileira, afirmando que isso prejudica o acordo Mercosul-UE e ameaça adotar medidas de reciprocidade.", "titulo_pt": "Governo critica veto da UE à carne e ameaça medidas de reciprocidade", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 143843, "titulo": "Como instituto de André Mendonça conseguiu R$ 10,7 milhões em dois anos com contratos públicos", "url": "https://www.bbc.com/portuguese/articles/c1j4xxn88d5o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-03T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Iter, vinculado a André Mendonça, obteve R$ 10,7 milhões em dois anos através de contratos públicos. Mendonça declarou que nunca auferiu lucro com sua participação na instituição.", "titulo_pt": "Instituto de Mendonça conquistou R$ 10,7 milhões em dois anos com contratos públicos", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 144041, "titulo": "Burnham, Macron talk border security and stronger Europe-UK ties", "url": "https://www.aljazeera.com/news/2026/9/3/burnham-macron-talk-border-security-and-stronger-europe-uk-ties?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-03T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O novo primeiro-ministro do Reino Unido, Andy Burnham, discutiu desafios compartilhados em sua primeira reunião oficial com o presidente francês. Os temas abordados incluíram segurança fronteiriça e fortalecimento das relações entre o Reino Unido e a Europa.", "titulo_pt": "Burnham e Macron discutem segurança fronteiriça e laços mais fortes entre o reino unido e a Europa", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 144101, "titulo": "Ecuador’s ex-president and Chinese ambassador seek to avoid jail over belt and road dam", "url": "https://www.scmp.com/news/china/article/3366283/ecuadors-ex-president-and-chinese-ambassador-seek-avoid-jail-over-belt-and-road-dam?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-03T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente ecuatoriano Lenin Moreno e um ex-ambassador chinês pediram ao tribunal supremo do país que evitem cumprir pena de cinco anos de prisão por um esquema de corrupção envolvendo uma propina de US$76 milhões. Moreno foi condenado por corrupção em relação a contratos para o maior projeto hidrelétrico do país, garantidos por uma empresa contratada pelo governo chinês.", "titulo_pt": "Ex-presidente e ex-ambassador chinês pedem para evitar prisão por esquema de corrupção", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 144042, "titulo": "NYC’s AI ban through grade 8 sets stage for rest of US, experts say", "url": "https://www.aljazeera.com/economy/2026/9/3/nycs-ai-ban-through-grade-8-sets-stage-for-rest-of-us-experts-say?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-03T21:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A proibição de tecnologias de inteligência artificial será aplicada por um ano e afetará 600 mil estudantes na escolaridade básica de Nova York.", "titulo_pt": "Proibição de IA na escolaridade básica de nova york estabelece precedente para o resto dos estados unidos, dizem especialistas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 143787, "titulo": "EUA investigam relatos de civis mortos em casamento durante ataques ao Irã", "url": "https://www.cnnbrasil.com.br/internacional/eua-investigam-relatos-de-civis-mortos-em-casamento-durante-ataques-ao-ira/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-03T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vice-presidente dos Estados Unidos, JD Vance, comentou sobre relatos de civis mortos durante um casamento em ataques do Irã. Segundo a mídia iraniana, quatro pessoas morreram em uma festa em um vilarejo próximo ao Estreito de Ormuz.", "titulo_pt": "EUA investigam relatos de civis mortos em casamento durante ataques do Irã", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 144020, "titulo": "Lebanon receives first detainee of five to be freed by Israel", "url": "https://www.lemonde.fr/en/international/article/2026/09/03/lebanon-receives-first-detainee-of-five-to-be-freed-by-israel_6757135_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-03T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Líbano recebeu até agora um prisioneiro de guerra devolvido pelo Comitê Internacional da Cruz Vermelha (ICRC), sendo o primeiro após Beirute solicitar conversas para o liberamento de um grupo inicial de prisioneiros desde o início da guerra entre Israel e Hezbollah em 2024.", "titulo_pt": "Líbano recebe primeiro prisioneiro de cinco a ser libertado por Israel", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 144035, "titulo": "Berlin: BER Airport Terminal 1 reopened after security scare", "url": "https://www.dw.com/en/berlin-ber-airport-terminal-1-reopened-after-security-scare/a-78895207?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-03T21:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O terminal 1 do aeroporto de Berlim-BER foi reaberto pela polícia após um alarme de segurança e evacuação. Algumas chegadas foram atrasadas, mas os esforços estavam sendo feitos para evitar cancelamentos de voos.", "titulo_pt": "Berlim: Terminal 1 do aeroporto BER reaberto após alarme de segurança", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 143939, "titulo": "Norway Seizes Russian Ship, Testing Moscow in the High Arctic", "url": "https://www.nytimes.com/2026/09/03/world/europe/norway-russian-research-ship-arctic.html", "fonte_id": "nyt_world", "data_pub": "2026-09-03T21:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Noruega capturou um navio russo com base em uma ordem judicial internacional, parte de uma iniciativa global para apreender ativos russos. Os russos consideraram essa ação como pirataria.", "titulo_pt": "Noruega apreende navio russo, testando moscou no ártico", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 144043, "titulo": "Nepal flood victims to be identified through DNA", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/3/nepal-flood-victims-to-be-identified-through-dna?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-03T21:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Nepal planeja identificar vítimas das cheias através do DNA.", "titulo_pt": "Nepal utilizará DNA para identificar vítimas das cheias", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 144045, "titulo": "US Vice President JD Vance declines to offer timeline for end of Iran war", "url": "https://www.aljazeera.com/news/2026/9/3/us-vice-president-jd-vance-declines-to-offer-timeline-for-end-of-iran-war?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-03T21:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vice-presidente dos Estados Unidos, JD Vance, não ofereceu uma data para o fim da guerra com a Irã durante uma conferência de imprensa. Um funcionário do governo Trump expressou ceticismo sobre a classificação da situação como guerra, apesar de um recente aumento nas tensões.", "titulo_pt": "Vice-presidente dos EUA não fornece prazo para fim da guerra com a Irã", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 143929, "titulo": "Quem são os candidatos à Presidência da República nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-a-presidente-da-republica-do-brasil-eleicoes-de-2026-3-setembro", "fonte_id": "jota", "data_pub": "2026-09-03T21:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há treze candidatos à Presidência da República concorrendo nas eleições de outubro. O número total de candidatos é de treze.", "titulo_pt": "Quem são os candidatos à Presidência da República nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 144008, "titulo": "Groundbreaking for Trump's arch will begin soon, Burgum says", "url": "https://www.politico.com/news/2026/09/03/trump-arch-groundbreaking-timeline-01064052", "fonte_id": "politico", "data_pub": "2026-09-03T21:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário do Interior anunciou que as obras de escavação para a construção do monumento de 250 pés de altura, projetado por Trump, podem começar nos próximos dois semanas.", "titulo_pt": "Início das obras do arco de Trump está próximo, diz Burgum", "veiculo": "Politico", "pais": "EUA", "classe": "A"}, {"id": 144188, "titulo": "Uber ceases operations in Nigeria, catching drivers and riders by surprise", "url": "https://www.washingtonpost.com/world/2026/09/03/uber-stops-operating-nigeria-uganda-surprising-drivers-riders/", "fonte_id": "washington_post_world", "data_pub": "2026-09-03T21:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Uber anunciou repentinamente o encerramento de suas operações na Nigéria, surpreendendo motoristas e passageiros. O anúncio, feito em meio a desafios operacionais e altos preços do petróleo, reduz a presença da aplicação de corridas na África.", "titulo_pt": "Uber encerra operações na nigéria, surpreendendo motoristas e passageiros", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 143869, "titulo": "El BCRA compartirá información para detectar cuentas vinculadas al fraude y al juego ilegal", "url": "https://www.lanacion.com.ar/economia/el-bcra-compartira-informacion-para-detectar-cuentas-vinculadas-al-fraude-y-al-juego-ilegal-nid03092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-03T21:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O BCRA (Banco Central de Reservas da Argentina) compartilhará informações com administradores de transferências para detectar contas relacionadas ao fraude e ao jogo ilegal. Os administradores deverão criar perfis de risco com esses dados.", "titulo_pt": "BCRA compartilhará informações para detectar contas envolvidas em fraude e jogo ilegal", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 143927, "titulo": "Congresso aprova fim da taxa das blusinhas, com responsabilização de plataformas por fraude ou pirataria", "url": "https://www.jota.info/tributos/congresso-aprova-mp-das-blusinhas-com-responsabilizacao-de-plataformas-por-fraude-ou-pirataria", "fonte_id": "jota", "data_pub": "2026-09-03T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Congresso Nacional aprovou a remoção da taxa sobre as blusinhas, com a responsabilidade das plataformas de garantir que não haja fraudes ou pirataria. A Fazenda poderá reestabelecer a tributação se o mercado nacional for impactado.", "titulo_pt": "Congresso aprova fim da taxa das blusinhas, com responsabilização de plataformas por fraude ou pirataria", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 143874, "titulo": "La industria fintech debatió su futuro, entre evolución y regulación: “El ecosistema llegó para quedarse”", "url": "https://www.lanacion.com.ar/economia/la-industria-fintech-debatio-su-futuro-entre-evolucion-y-regulacion-el-ecosistema-llego-para-nid03092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-03T21:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Representantes da indústria fintech discutiram o futuro do setor, focando em medidas regulatórias propostas pela CNV e a infraestrutura global de pagamentos. O encontro ocorreu no escritório jurídico Marval O'Farrell Mairal.", "titulo_pt": "A indústria fintech debatê seu futuro, entre evolução e regulamentação: ‘o ecossistema chegou para ficar’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 143654, "titulo": "Caixa passa a oferecer modalidade de Pix parcelado", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/caixa-passa-oferecer-modalidade-de-pix-parcelado", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-03T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Caixa Econômica introduziu uma nova funcionalidade que permite o parcelamento de transferências e pagamentos realizados por Pix através do aplicativo CAIXA. Esta medida foi anunciada na quinta-feira (3) e utiliza contratação de crédito na hora da transação.", "titulo_pt": "Caixa oferece modalidade de Pix parcelado", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 144018, "titulo": "Volkswagen plans to cut 100,000 jobs by end of decade", "url": "https://www.lemonde.fr/en/economy/article/2026/09/03/volkswagen-plans-to-cut-100-000-jobs-by-end-of-decade_6757136_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-03T21:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Volkswagen planeja cortar 100.000 postos de trabalho até o final da década, o que representará cerca de 15% do seu quadro de funcionários globais.", "titulo_pt": "Volkswagen planeja cortar 100.000 postos de trabalho até o final da década", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 143655, "titulo": "BC proíbe publicidade em comprovantes do Pix a partir de março de 2027", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/bc-proibe-publicidade-em-comprovantes-do-pix-partir-de-marco-de-2027", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-03T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central proibiu a inclusão de publicidade em comprovantes de pagamento do Pix a partir de março de 2027. A nova regra visa garantir que o comprovante só registre a transação e reduzir o risco de golpes.", "titulo_pt": "BC proíbe publicidade em comprovantes do Pix a partir de março de 2027", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 143656, "titulo": "UE suspende carnes do Brasil; entenda impacto e próximos passos", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/ue-suspende-carnes-do-brasil-entenda-impacto-e-proximos-passos", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-03T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Europeia iniciou a suspensão da importação de produtos animais do Brasil, afetando carnes bovina, de frango e suína, além de mel, pescados e ovos. O Brasil está tentando comprovar que atende às exigências europeias e uma auditoria está sendo realizada para avaliar as cadeias de produção de frango e mel no país.", "titulo_pt": "UE suspende importação de carnes brasileiras; entenda impacto e próximos passos", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 143803, "titulo": "Soja fecha em alta em Chicago com suporte do farelo e compras chinesas", "url": "https://www.cnnbrasil.com.br/agro/soja-fecha-em-alta-em-chicago-com-suporte-do-farelo-e-compras-chinesas/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-03T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A soja fechou em alta no mercado de Chicago, apoiada pelo farelo e pelas compras chinesas. A recuperação do mercado durante o pregão foi limitada pela proximidade da colheita nos Estados Unidos e pela pressão dos fundos.", "titulo_pt": "Soja fecha em alta em Chicago com suporte do farelo e compras chinesas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 144031, "titul nal", "pais": "EUA", "classe": "B"}, {"id": 143644, "titulo": "Mercado ilegal une crime e consumo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/mercado-ilegal-une-crime-e-consumo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T20:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Consumidores muitas vezes escolhem produtos ilegais, atraídos por preços baixos, que podem ser aparelhos, equipamentos, bebidas, roupas, remédios e tênis contrabandeados ou falsificados. Essa escolha une crime e consumo, refletindo uma ilusão de economia por preços inferiores.", "titulo_pt": "Mercado ilegal une crime e consumo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 143645, "titulo": "Comitê Gestor do IBS aprova orçamento com despesa de R$ 2,7 bi para 2027 sob críticas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/comite-gestor-do-ibs-aprova-orcamento-com-despesa-de-r-27-bi-para-2027-sob-criticas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O orçamento do Comitê Gestor do IBS para 2027 foi aprovado no valor de R$ 2,7 bilhões, mesmo com a oposição de maioria dos representantes dos estados e municípios. O Comitê foi criado pela reforma tributária.", "titulo_pt": "Comitê Gestor do IBS aprova orçamento de R$ 2,7 bi para 2027 sob críticas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 144076, "titulo": "Volkswagen to slash up to 50,000 jobs in historic restructuring", "url": "https://www.ft.com/content/77641f53-8dcb-4adf-9295-9ce44b8d49d6?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-03T20:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Volkswagen planeja reduzir até 50.000 postos de trabalho em uma reestruturação histórica. ll, "texto_pt": "O ministro da Indústria sul-coreano Kim Jung-kwan discutiu tarifas de chips com os Estados Unidos. Segundo o governo sul-coreano, não há intenção de colocar a Coreia do Sul em desvantagem.", "titulo_pt": "Negociações sobre tarifas de chips com EUA baseadas no entendimento de que Coreia do sul não será desvantajosa: oficial sul-coreano", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 144118, "titulo": "Startup ARR is less secure than ever, new research shows", "url": "https://techcrunch.com/2026/09/03/startup-arr-is-less-secure-than-ever-new-research-shows/", "fonte_id": "techcrunch", "data_pub": "2026-09-03T20:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas pesquisas mostram que a era da IA tem alterado drasticamente os padrões de compra das empresas, e as startups ainda não encontraram uma maneira de se adaptar a essa nova realidade.", "titulo_pt": "Startup: era da IA desestabiliza padrões de compra das empresas e startups ainda não se adaptaram", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 143992, "titulo": "The Failed Promise of Computers", "url": "https://www.theatlantic.com/newsletters/2026/09/early-computers-1984-apple/688515/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-03T20:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tecnologia de computadores era uma vez vista como contracultural. No entanto, o que aconteceu desde então?", "titulo_pt": "A falha da promessa dos computadores", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 144010, "titulo": "OpenAI unveils plan to protect critical services from AI cyberattacks", "url": "https://www.axios.com/2026/09/03/openai-critical-infrastructure-cyber-ai-models", "fonte_id": "axios", "data_pub": "2026-09-03T20:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI lançou uma nova iniciativa para fornecer acesso subvencionado aos seus modelos a sistemas de água, provedores de energia, governos locais e outras infraestruturas críticas. A iniciativa visa auxiliar organizações de infraestrutura crítica, que historicamente enfrentam dificuldades para se defenderem contra ameaças cibernéticas, a se prepararem para ataques cibernéticos potenciais facilitados por inteligência artificial.", "titulo_pt": "Openai anuncia programa para proteger serviços críticos contra ameaças cibernéticas de IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 144110, "titulo": "US senator calls on the NSA to give guidance for use of VPNs", "url": "https://arstechnica.com/security/2026/09/us-senator-calls-on-the-nsa-to-give-guidance-for-use-of-vpns/", "fonte_id": "ars_technica", "data_pub": "2026-09-03T19:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um senador dos EUA pediu ao NSA que fornecesse orientações sobre o uso de VPNs. As opções disponíveis, que incluem opções de código aberto, comerciais, de um pulo e múltiplos pules, bem como redes mistas, são muitas e complexas.", "titulo_pt": "Senador dos EUA solicita orientações do NSA sobre o uso de VPNs", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 144111, "titulo": "NJ urges SCOTUS to rule that Kalshi sports bets are gambling, not \"swaps\"", "url": "https://arstechnica.com/tech-policy/2026/09/nj-urges-scotus-to-rule-that-kalshi-sports-bets-are-gambling-not-swaps/", "fonte_id": "ars_technica", "data_pub": "2026-09-03T19:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O New Jersey está pedindo ao Supremo Tribunal dos Estados Unidos que decida se as apostas esportivas feitas pelo Kalshi são apostas ou negociações financeiras, uma questão que divide os tribunais. Isso aumenta as chances de que o Supremo Tribunal dê uma decisão sobre o caso.", "titulo_pt": "NJ pede ao stf que determine se apostas esportivas do Kalshi são apostas ou 'swap'", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 144119, "titulo": "The Cybercab is Tesla’s ‘fork in the road’ moment", "url": "https://techcrunch.com/2026/09/03/the-cybercab-is-teslas-fork-in-the-road-moment/", "fonte_id": "techcrunch", "data_pub": "2026-09-03T19:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Tesla está prestes a formalmente lançar o Cybercab, um veículo de dois lugares sem volante ou pedais. Este lançamento pode marcar um ponto de virada significativo para a empresa.", "titulo_pt": "O Cybercab é o 'ponto de decisão' da Tesla", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 144120, "titulo": "Accel reportedly in talks to lead $1B round for Thinking Machines at $40B valuation", "url": "https://techcrunch.com/2026/09/03/accel-reportedly-in-talks-to-lead-1b-round-for-thinking-machines-at-40b-valuation/", "fonte_id": "techcrunch", "data_pub": "2026-09-03T19:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup de destaque está em negociações para liderar uma rodada de investimento de 1 bilhão de dólares com uma avaliação de 40 bilhões de dólares. A receita anual corrente da empresa é superior a 100 milhões de dólares.", "titulo_pt": "Acel relatada em negociações para liderar rodada de 1 bilhão para Thinking Machines com avaliação de 40 bilhões", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 143648, "titulo": "'Ter informação não significa ter conhecimento', diz CEO de nova plataforma brasileira de IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/ter-informacao-nao-significa-ter-conhecimento-diz-ceo-de-nova-plataforma-brasileira-de-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T19:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa brasileira WeCogno lançou uma nova plataforma de inteligência artificial com investimento de R$ 2,5 milhões. Os recursos foram utilizados para desenvolver uma nova categoria dentro do mercado, chamada cognitech.", "titulo_pt": "Ter informação não significa ter conhecimento, diz CEO de nova plataforma brasileira de IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 143651, "titulo": "ChatGPT, Claude e Grok têm instabilidade nesta quinta, mas voltam a funcionar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/chatgpt-claude-e-grok-tem-instabilidade-nesta-quinta-mas-voltam-a-funcionar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T18:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os usuários do ChatGPT, Claude e Grok enfrentaram instabilidade nesta quinta-feira (3), mas os serviços foram restabelecidos conforme informado pelas empresas responsáveis pelos modelos de inteligência artificial.", "titulo_pt": "Chatgpt, Claude e Grok enfrentaram instabilidade nesta quinta, mas voltaram a funcionar", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 144130, "titulo": "GPT-6 Astra Is Here—and OpenAI Thinks It May Kick Off the AGI Era", "url": "https://www.wired.com/story/openai-says-gpt-6-can-use-a-computer-better-than-a-human/", "fonte_id": "wired", "data_pub": "2026-09-03T18:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes da OpenAI acreditam que o próximo modelo da empresa, que se destaca no uso de computadores e codificação, pode marcar um importante marco no desenvolvimento da IA.", "titulo_pt": "GPT-6 Astra chegou—e a OpenAI acha que pode marcar o início da Era de AGI", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 143415, "titulo": "OpenAI’s next big AI model has ‘entered the AGI era’", "url": "https://www.theverge.com/ai-artificial-intelligence/989601/openai-gpt-6-astra-release", "fonte_id": "the_verge", "data_pub": "2026-09-03T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O próximo grande modelo de inteligência artificial da OpenAI, chamado GPT-6 Astra, foi lançado. A empresa afirma que é um 'salto geração em capacidade' para áreas como segurança cibernética, trabalho profissional, engenharia de software, ciência e uso de computadores.", "titulo_pt": "Openai's próximo grande modelo de IA entra na era AGI com gpt-6 astra", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 143753, "titulo": "Sua IA concorda demais? Entenda o viés de bajulação e como obter respostas críticas", "url": "https://exame.com/inteligencia-artificial/sua-ia-concorda-demais-entenda-o-vies-de-bajulacao-e-como-obter-respostas-criticas/", "fonte_id": "exame", "data_pub": "2026-09-03T17:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O viés de bajulação em inteligências artificiais foi notado após incidentes envolvendo modelos de IA. Este comportamento pode ser mitigado com instruções mais específicas nos prompts.", "titulo_pt": "Sua IA concorda demais? Entenda o viés de bajulação e como obter respostas críticas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 143363, "titulo": "Forestry agency publishes documentary on hundred-pace viper and its newborns", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/04/2003863667", "fonte_id": "taipei_times", "data_pub": "2026-09-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência florestal publicou um documentário sobre a viperina de cem passos e seus recém-nascidos. O documentário fornece informações sobre a espécie e seu nascimento.", "titulo_pt": "Agência florestal publica documentário sobre viperina de cem passos e seus recém-nascidos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 144133, "titulo": "The Arctic melt season is a week longer now than it was in the 1980s, new research on sea ice trends shows", "url": "https://phys.org/news/2026-09-arctic-season-week-longer-1980s.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O período de derretimento do gelo no Ártico é uma semana mais longo agora do que era nos anos 1980, de acordo com novas pesquisas sobre tendências de geleada marinha. A maioria das pessoas não tem acesso direto a essas regiões, então dependem da imaginação e da mídia para visualizá-las e perceber as mudanças que ocorrem nelas.", "titulo_pt": "A estação de derretimento do gelo no ártico é uma semana mais longa agora do que nos anos 1980", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 144134, "titulo": "Microbes—dead or alive—can be early indicators of soil health under regenerative farming", "url": "https://phys.org/news/2026-09-microbes-dead-alive-early-indicators.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores desenvolveram uma série de testes biológicos que podem servir como indicadores para medir como diferentes práticas de agricultura regenerativa podem melhorar o carbono do solo, anos antes que seja possível medir o carbono diretamente. Essa técnica oferece novas perspectivas sobre a eficácia de várias práticas regenerativas na melhoria da saúde do solo.", "titulo_pt": "Microrganismos—mortos ou vivos—podem ser indicadores precoces da saúde do solo sob agricultura regenerativa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 144135, "titulo": "Even second graders can reason like scientists—if we ask them the right way", "url": "https://phys.org/news/2026-09-graders-scientists.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Perguntas como 'Como um peixe balão se infla?' podem estimular o pensamento científico em crianças, ao contrário de responder com fatos. Esta abordagem pode ajudar a desenvolver habilidades de raciocínio e pensamento crítico em gerações futuras, tanto na ciência quanto em outras áreas.", "titulo_pt": "Inclusive crianças do segundo ano podem raciocinar como cientistas, se perguntarmos de maneira correta", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 144136, "titulo": "Nanoscale multiferroic materials open the path to efficient magnetic memory technology", "url": "https://phys.org/news/2026-09-nanoscale-multiferroic-materials-path-efficient.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Materiais multiferroicos nanosscale oferecem potencial para tecnologias de memória magnética eficientes, permitindo a escrita de informações usando campos elétricos. Essas memórias magnéticas são não voláteis, mantendo a informação sem a necessidade de uma fonte de energia contínua.", "titulo_pt": "Materiais multiferroicos nanosscale abrem caminho para tecnologias de memória magnética eficiente", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 143695, "titulo": "Câncer de pâncreas: nova indicação para remédio que aumenta sobrevida é aprovada no Brasil", "url": "https://veja.abril.com.br/saude/cancer-de-pancreas-nova-indicacao-para-remedio-que-aumenta-sobrevida-e-aprovada-no-brasil/", "fonte_id": "veja", "data_pub": "2026-09-03T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo remédio foi aprovado no Brasil para ser usado em esquemas de quimioterapia em pacientes com câncer de pâncreas que já se espalharam pelo corpo. A decisão aumenta as opções de tratamento para esta forma avançada do câncer.", "titulo_pt": "Novo remédio para câncer de pâncreas avançado é aprovado no Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 144137, "titulo": "Predictive tools can confuse rare mutations with dangerous ones", "url": "https://phys.org/news/2026-09-tools-rare-mutations-dangerous.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ao analisar o DNA de um paciente, as variações são comparadas com uma versão de referência do genoma humano. Embora a maioria das variações seja inofensiva e compartilhada por muitas pessoas, algumas podem causar doenças.", "titulo_pt": "Ferramentas preditivas podem confundir mutações raras com perigosas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 144138, "titulo": "Beyond the 'Great Divide': What we really know about political polarization", "url": "https://phys.org/news/2026-09-great-political-polarization.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A divisão política nos Estados Unidos pode não ser tão extrema quanto se pensa. Um novo estudo sugere que a percepção da polarização depende muito das perguntas feitas nos estudos.", "titulo_pt": "Através do 'gran divisor': o que realmente sabemos sobre a polarização política", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 144139, "titulo": "Ig Nobel Prize winners reveal why babies smell better than teenagers", "url": "https://phys.org/news/2026-09-ig-nobel-prize-winners-reveal.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo internacional de pesquisadores, incluindo Ilona Croy, Tomasz Frackowiak, Thomas Hummel e Agnieszka Sorokowska, investigou por que os adolescentes perdem a vantagem olfativa especial que bebês parecem ter e foi premiado com um Prêmio Ig Nobel pelo estudo.", "titulo_pt": "Vencedores do prêmio ig Nobel revelam por que bebês cheiram melhor que adolescentes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 144140, "titulo": "Traces of nearly 4 million coins reveal how Rome achieved economic integration", "url": "https://phys.org/news/2026-09-million-coins-reveal-rome-economic.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A digitização de coleções arqueológicas extensas, combinada com o desenvolvimento de métodos quantitativos que integram milhões de registros dispersos, está revolucionando o estudo da história antiga. Pesquisas recentes têm utilizado a análise de quase 4 milhões de moedas para revelar como a Roma antiga conseguiu integrar sua economia.", "titulo_pt": "Rastros de quase 4 milhões de moedas mostram como roma integrou sua economia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 144044, "titulo": "El Nino: A phenomenon supercharged by climate change", "url": "https://www.aljazeera.com/features/2026/9/3/el-nino-a-phenomenon-supercharged-by-climate-change?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-03T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas advertem que o El Niño de 2026-27 pode se tornar o mais forte já registrado, agravando o aquecimento global, as secas e inundações.", "titulo_pt": "El niño: fenômeno acelerado pelo aquecimento global", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 144165, "titulo": "Schiess takes command of Space Force as the service prepares for expansion", "url": "https://spacenews.com/schiess-takes-command-of-space-force-as-the-service-prepares-for-expansion/", "fonte_id": "spacenews", "data_pub": "2026-09-03T21:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O general Douglas Schiess substitui o general Chance Saltzman como o terceiro chefe de operações espaciais da Força Espacial dos Estados Unidos. Ele assume o comando enquanto a força se prepara para expansão.", "titulo_pt": "Schiess assume comando da força espacial nos estados unidos em meio à expansão do serviço", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 144141, "titulo": "'Green thumb' molecule helps leaf stalks grow in crowded conditions", "url": "https://phys.org/news/2026-09-green-thumb-molecule-leaf-stalks.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O potássio é um dos três nutrientes essenciais para as plantas, desempenhando um papel crucial em processos como crescimento celular, fotossíntese e regulação do equilíbrio hídrico. Uma canalização de potássio chamada AKT5 no modelo de planta Arabidopsis thaliana tem sido um mistério para os cientistas, apesar de mais de 30 anos de estudo.", "titulo_pt": "Molécula com 'dedo verde' auxilia nas folhas de plantas em condições de espaço limitado", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 144142, "titulo": "A molecular brake that keeps muscle architecture in check", "url": "https://phys.org/news/2026-09-molecular-muscle-architecture.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cada movimento que realizamos, seja piscar ou correr, a precisão na contração das fibras musculares depende de um sistema de membranas internas conhecido como rede tubular transversal, ou T-tubulo. Este sistema carrega sinais elétricos da superfície da célula até o interior do fio muscular, onde eles desencadeiam a liberação de cálcio necessário para a contração.", "titulo_pt": "Um freio molecular que mantém a estrutura muscular em equilíbrio", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 144143, "titulo": "How a plant's refusal to self-pollinate could help India grow more of its own cooking oil", "url": "https://phys.org/news/2026-09-pollinate-india-cooking-oil.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T20:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores do Instituto Tecnológico Indiano de Gandhinagar mapearam e testaram os genes que controlam um sistema natural de 'rejeição de si mesmo' em duas variedades de plantas de óleo comuns na Índia: Brassica rapa (mustardo) toria e sarson amarelo. Este sistema regula o mecanismo molecular 'chave-e-serrilha' que permite às plantas mustardo rejeitarem o seu próprio pólen.", "titulo_pt": "Como a recusa de uma planta em se polinizar por si mesma pode ajudar a Índia a produzir mais óleo de cozinha", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 144161, "titulo": "STAT+: Ionis wins FDA approval for first drug for Alexander disease, a rare and deadly neurological disorder", "url": "https://www.statnews.com/2026/09/03/ionis-fda-approval-zanvastro-alexander-disease/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-03T20:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ionis recebeu aprovação da FDA para o uso de Zanvastro, o primeiro tratamento modificador da doença para a doença de Alexander, uma rara e fatal afecção neurológica.", "titulo_pt": "Ionis ganha aprovação da FDA para primeiro medicamento contra a doença de Alexander", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 143951, "titulo": "“Mariana Di Girolamo ofrece una interpretación encantadora”: la crítica alaba cinta filmada en Rapa Nui", "url": "https://www.latercera.com/culto/noticia/mariana-di-girolamo-ofrece-una-interpretacion-encantadora-la-critica-alaba-cinta-filmada-en-rapa-nui/", "fonte_id": "la_tercera", "data_pub": "2026-09-03T21:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A película 'Caballo Salvaje Nueve', dirigida por Martin McDonagh e filmada em 2025 no Chile, recebeu elogios positivos no Festival de Venecia, onde concorre ao Leão de Ouro. A atuação de Mariana Di Girolamo foi particularmente destacada.", "titulo_pt": "Crítica elogia atuação de mariana Di Girolamo em 'caballo salvaje nueve'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 144177, "titulo": "John Malkovich Could Finally Win an Oscar as ‘Wild Horse Nine’ Emerges as First Major Academy Awards Contender of the Fall", "url": "https://www.indiewire.com/news/fest
