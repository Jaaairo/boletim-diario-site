<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

<script>
const D = {"gerado_em": "21/10/2026 07:23", "stats": {"noticias_novas": 1060, "resumos_gerados": 244}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva planeja enviar a Proposta de Emenda à Constituição (PEC) da Tarifa Zero ao Congresso, mas o custo e o financiamento ainda estão em discussão. Esta medida, que visa instituir a tarifa zero no transporte público urbano aos finais de semana, é uma promessa de campanha do petista. Por outro lado, a campanha de Flávio Bolsonaro propõe a adoção de um programa de cashback com o uso do Pix e a retomada do Programa de Estímulo à Saúde (Perse), sem detalhar os aspectos financeiros da iniciativa. As decisões do Supremo Tribunal Federal e do Tribunal Superior Eleitoral têm passado por mudanças e idas e vindas, refletindo o racha entre ministros. Além disso, a governadora Celina Leão pretende estabelecer uma parceria com o Senac para oferecer serviços como corte de cabelo e capacitação profissional para pessoas em situação de rua, visando ampliar o atendimento às pessoas em situação de rua no estado.", "mundo": "A França anunciou o envio de forças militares para auxiliar a polícia durante as manifestações agendadas para o sábado (24), em meio a distúrbios de grande escala. O governo reconheceu falhas na inteligência e na presença policial. No Canadá, os eleitores de Alberta rejeitaram de forma massiva um plano para separar a província do país, com cerca de 76% dos votos a favor da manutenção do status quo. A Coreia do Norte publicou fotos do líder Kim Jong-un com sua filha, após a circulação de novos boatos sobre a suposta morte do ditador. O Reino Unido planeja enviar aviões para auxiliar na defesa de cidades sauditas contra ataques do grupo insurgente Houthi, sem realizar operações ofensivas. Além disso, o Montenegro adotou mudanças constitucionais para melhorar as verificações de integridade para altos cargos governamentais, um passo importante para a adesão à União Europeia.\n\nAs relações geopolíticas internacionais continuam sendo foco, com destaque para a situação na Ucrânia e as tensões regionais. Em conversações recentes, um embaixador dos Estados Unidos esteve em discussões com Vladimir Putin sobre a Ucrânia, enquanto o Kremlin afirma estar disposto a considerar propostas econômicas dos EUA, mas não fará concessões políticas. A Rússia continua a auxiliar seus aliados balcânicos em suas campanhas eleitorais, como mostraram os recentes esforços de Vladimir Putin para fortalecer as campanhas de Milorad Dodik e Aleksandar Vucic. Além disso, a China anunciou a criação de uma nova empresa estatal, a National Data Group, para apoiar sua estratégia de infraestrutura de inteligência artificial. No Oriente Médio, o Reino Unido está prestes a enviar caças Typhoon e conselheiros militares para a Arábia Saudita para proteger contra ataques hutíes, enquanto o conflito em Yemen continua, com ataques que resultaram em mortes de civis. Em outros assuntos, a situação na Coreia do Norte continua tenso, com a irmã do líder norte-coreano, Kim Yo-jong, inspecionando um local de fortificação na fronteira. A situação na região do Mekong também é preocupante, com a produção de metanfetamina em Myanmar se tornando mais lucrativa do que os centros de fraude.", "economia": "Os mercados financeiros internacionais e a economia brasileira foram temas importantes na semana. A despesa turística no Japão aumentou, apesar do decréscimo no número de visitantes, com a expectativa de que o Banco do Japão mantenha as taxas de juros estáveis em sua próxima reunião. Na França, os custos de empréstimo atingiram 5% pela primeira vez desde 2002, devido a preocupações sobre as finanças públicas e a estabilidade política. No Brasil, a proposta dos candidatos para crédito pode levar a juros maiores, enquanto a Americanas registrou alta de mais de 20% nas ações após a Justiça do Rio encerrar a recuperação judicial da empresa. Ainda, a Âmbar Energia, controlada pela J&F, investiu R$ 59 milhões para reformar uma usina no Amazonas para operar com gás natural e energia solar. Além disso, a Netflix enfrentou dificuldades em atrair novos assinantes, resultando em queda de ações. Também, o mercado de escritórios no Brasil demora 15 meses para reagir às mudanças nas taxas de juros, e a China, México e Chile restringiram as importações de frango do Brasil devido a uma confirmação de doença de Newcastle em uma granja em Santa Catarina.", "tecnologia": "A tecnologia está passando por um momento de transformação significativa, com destaque para a expansão global da inteligência artificial (IA) e a possibilidade de fusão entre SpaceX e Tesla, duas gigantes do setor. A Nvidia busca se estabelecer como a estrutura fundamental para a economia global de IA, expandindo sua tecnologia além dos Estados Unidos e da China. A Anthropic, que está prestes a realizar sua oferta inicial de ações (IPO), precisa se adaptar a um mercado público ansioso, enquanto busca financiamento para sua próxima fase. O presidente da Coreia do Sul, Yoon Suk Yeol, propõe o uso da IA para suprir lacunas no sistema de saúde global. Por outro lado, SpaceX e Tesla estão explorando a possibilidade de uma fusão, lideradas pelo mesmo CEO, Elon Musk, e avaliadas em vários trilhões de dólares. Estes eventos refletem o dinamismo atual da indústria tecnológica, com IA e fusões de grandes empresas dominando as discussões e decisões estratégicas.", "ciencia": "Um primata peçonhento, o lóris-lento-de-Bangka, foi novamente registrado cientificamente após quase um século, com mais de 90 espécimes encontrados na ilha de Bangka, na Indonésia. A NASA está avançando no desenvolvimento do SR-1 Freedom, um reator nuclear espacial destinado a Marte, com progressos significativos no módulo de poder nuclear. A qualidade nutricional das dietas é mais baixa entre os jovens no Japão, de acordo com uma pesquisa, destacando a importância de bons hábitos alimentares desde cedo. Além disso, a Reuters mapeou ondas de calor gigantescas que assolam o planeta nas últimas décadas, enquanto a NASA realizará voos baixos sobre uma área de terra agrícola perto de Amarillo, Texas, para medir emissões gaseosas e partículas emitidas.", "cultura": "O documentário 'Lula', dirigido por Oliver Stone, está sendo remontado após sua exibição no Festival de Cannes, conforme informa o jornal Folha de S. Paulo. O filme já foi exibido, mas ainda não foi lançado comercialmente nem em plataformas de streaming, incluindo no Brasil. Em outro projeto cultural, Cyndi Lauper, famosa por seu synth-pop dos anos 1980, realiza um leilão de seus bens pessoais e roupas em Nova York, rejeitando a cultura do cancelamento e falando sobre sua estética única. O documentário 'O Outro Lado das Redes', que será debatido na 50ª Mostra Internacional de Cinema em São Paulo, aborda questões relacionadas à internet e suas implicações na saúde pública. Por outro lado, a exposição 'Ghosts: The Possession of Button House' apresenta personagens da série de comédia em situações inusitadas, explorando temas de assombração e humor.", "sociedade": "Milhares de pessoas se manifestaram em Lisboa, Portugal, em protesto contra os altos custos imobiliários, após a polícia ter removido um acampamento. Essas manifestações fazem parte de uma onda de protestos em vários países europeus, incluindo a França, onde estudantes e grupos sociais estão se mobilizando por melhorias na educação, direitos dos imigrantes e combate ao alto custo de vida. Em um contexto mais amplo, a pesquisa da Meiji Yasuda Life revela que menos de 30% das famílias japonesas querem ter um segundo filho devido ao aumento dos custos, enquanto a indústria da solidão cresce na China, oferecendo serviços de companhia a pessoas solitárias.", "meio_ambiente": "O Programa das Nações Unidas para o Meio Ambiente (UNEP) alertou que a chance de manter o aumento da temperatura global abaixo de 1,5°C sem um 'overshoot' foi perdida devido a décadas de ação climática insuficiente. Segundo a UNEP, um rompimento temporário da linha de 1,5°C de aquecimento global é agora 'inevitável'. Em meio a essas preocupações climáticas, inundações devastaram áreas da Espanha e França, enquanto fortes chuvas também atingiram o Sul do Brasil, levando a temperaturas elevadas no Centro-Oeste. No Japão, o Tufão Dujuan causou 10 mortes e 37 feridos em Chiba, e a Indonésia enfrenta o impacto de fumaça tóxica de fogos florestais que afetam a qualidade do ar e a saúde nas cidades de Borneo. Em Nigéria, um caso de Ebola foi confirmado, enquanto a doença continua a se espalhar pela África Ocidental. Estudos e relatórios indicam a necessidade de ações urgentes para mitigar os efeitos das mudanças climáticas e proteger a biodiversidade, desde a implementação de políticas energéticas até a proteção da floresta amazônica.", "direitos_humanos": "Um guatemalteco foi condenado a 30 anos de prisão nos Estados Unidos por causa da morte de 53 migrantes em um caminhão refrigerado no Texas em 2022, sendo que ele fazia parte de uma rede de tráfico humano. Em outro caso, cinco policiais do Departamento de Polícia de Charlotte-Mecklenburg, na Carolina do Norte, renunciaram após a descoberta de mensagens racistas. As autoridades estão revisando gravações corporais e registros de detenções para verificar se houve comportamentos discriminatórios. A Organização das Nações Unidas advertiu que o número de pessoas enfrentando insegurança alimentar aguda no Afeganistão pode ultrapassar 19 milhões durante o inverno, com mais de quatro milhões de bebês e crianças menores de seis anos precisando de tratamento para desnutrição aguda no próximo ano. Além disso, a Suprema Corte dos Estados Unidos está prestes a decidir sobre uma questão que envolve mulheres transexuais em esportes femininos, um dos maiores desenvolvimentos dos últimos anos na operação do tribunal."}, "resumo_do_dia": {"politica_nacional": [{"id": 215222, "titulo": "Carf mantém cobrança de IPI em caso de classificação fiscal de areia para gatos", "url": "https://www.jota.info/tributos/carf-mantem-cobranca-de-ipi-em-caso-de-classificacao-fiscal-de-areia-para-gatos", "fonte_id": "jota", "data_pub": "2026-10-21T09:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Junta Administrativa de Recursos Fiscais (Carf) manteve a cobrança do Imposto sobre Produtos Industrializados (IPI) em um caso envolvendo a classificação fiscal de areia para gatos. Segundo o Carf, o produto deveria ser classificado como aglutinante preparado, aditivo e mistura de produtos químicos não especificados.", "titulo_pt": "Carf mantém cobrança de IPI em caso de classificação fiscal de areia para gatos", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 215114, "titulo": "Lula prevê enviar PEC da Tarifa Zero ao Congresso com custo e financiamento ainda em discussão", "url": "https://veja.abril.com.br/brasil/lula-preve-enviar-pec-da-tarifa-zero-ao-congresso-com-custo-e-financiamento-ainda-em-discussao/", "fonte_id": "veja", "data_pub": "2026-10-21T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Luiz Inácio Lula da Silva prevê enviar a Proposta de Emenda à Constituição (PEC) da Tarifa Zero ao Congresso, mas o custo e o financiamento ainda estão em discussão. A expectativa é que a tramitação do projeto avance somente após o segundo turno das eleições.", "titulo_pt": "Lula planeja enviar PEC da Tarifa Zero ao Congresso após segundo turno", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 214880, "titulo": "Desafio de Lula a Flávio sobre sigilo bancário repete estratégia de Boulos contra Nunes", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/desafio-de-lula-a-flavio-sobre-sigilo-bancario-repete-estrategia-de-boulos-contra-nunes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula exigiu que Flávio Bolsonaro abrisse o sigilo bancário, uma estratégia semelhante à usada por Guilherme Boulos contra o prefeito Ricardo Nunes em São Paulo em 2024.", "titulo_pt": "Lula pressiona Flávio sobre sigilo bancário, seguindo tática de Boulos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 215051, "titulo": "Democratas lideram disputa pelo Congresso dos EUA com 10 pontos", "url": "https://www.cnnbrasil.com.br/internacional/democratas-lideram-disputa-pelo-congresso-dos-eua-com-10-pontos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-21T08:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa CNN indica que os democratas estão liderando a disputa pelo Congresso dos EUA com uma vantagem de 10 pontos sobre os republicanos. Este resultado está associado a uma onda de sentimentos contrários ao presidente Donald Trump.", "titulo_pt": "Democratas lideram disputa pelo Congresso dos EUA com 10 pontos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 215223, "titulo": "A alteração no CTN e a decisão do STF que equiparou a licença-maternidade", "url": "https://www.jota.info/opiniao-e-analise/colunas/observatorio-constitucional/a-alteracao-no-ctn-e-a-decisao-do-stf-que-equiparou-a-licenca-maternidade", "fonte_id": "jota", "data_pub": "2026-10-21T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A decisão do STF que equiparou a licença-maternidade e a alteração no CTN relacionam-se à vinculação da Administração Pública em nosso sistema de precedentes.", "titulo_pt": "A decisão do STF e a alteração no CTN sobre licença-maternidade", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 215224, "titulo": "Mudança na Resolução TSE 23.610 pode afetar garantias constitucionais de apoiadores", "url": "https://www.jota.info/opiniao-e-analise/artigos/mudanca-na-resolucao-tse-23-610-pode-afetar-garantias-constitucionais-de-apoiadores", "fonte_id": "jota", "data_pub": "2026-10-21T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Resolução TSE 23.610 foi alterada, o que pode afetar as garantias constitucionais dos apoiadores de campanhas. A nova regra sobre canais de apoio pode impactar a liberdade de expressão e organização política.", "titulo_pt": "Mudança na Resolução TSE 23.610 pode afetar garantias constitucionais de apoiadores", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 214881, "titulo": "Mario Frias pagou com verba de campanha empresa ligada a ex-servidora de gestão na Cultura", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/mario-frias-pagou-com-verba-de-campanha-empresa-ligada-a-ex-servidora-de-gestao-na-cultura.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um dos fornecedores da campanha de Mario Frias foi uma empresa associada a uma diretora da Secretaria Especial da Cultura durante o governo de Jair Bolsonaro. Frias é atualmente deputado federal pelo PL-SP.", "titulo_pt": "Mario Frias utilizou verba de campanha para contratar empresa ligada a ex-diretora de Cultura", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 214882, "titulo": "PF localiza menção a servidor alvo da Abin Paralela com amigo de Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/pf-localiza-mencao-a-servidor-alvo-da-abin-paralela-com-amigo-de-flavio-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal investiga se Paulo Maurício Fortunato, ex-diretor da Abin, recebeu US$ 180 mil de Willer Tomaz, amigo de Flávio Bolsonaro. O valor equivale a cerca de R$ 900 mil atualmente.", "titulo_pt": "PF investiga se ex-diretor da Abin recebeu dinheiro de amigo de Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 214883, "titulo": "Muçulmanos se dividem entre causa palestina e antipetismo para decidir voto no 2º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/muculmanos-se-dividem-entre-causa-palestina-e-antipetismo-para-decidir-voto-no-2o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os muçulmanos estão divididos entre apoiar a causa palestina e se posicionar contra o governo petista para decidir o voto no segundo turno das eleições. Uma citação do Profeta Muhammad sobre a importância de não se enfurecer é incluída, mas não está diretamente relacionada ao contexto político.", "titulo_pt": "Muçulmanos divididos entre causa palestina e antipetismo para segundo turno das eleições", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 214884, "titulo": "18 integrantes da gestão Bolsonaro respondem na Justiça ou são investigados; governo Lula tem 6 casos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/18-integrantes-da-gestao-bolsonaro-respondem-na-justica-ou-sao-investigados-governo-lula-tem-6-casos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quase quatro anos após o fim do governo Bolsonaro, 18 ex-integrantes do seu gabinete e auxiliares enfrentam processos judiciais ou estão sendo investigados por diversos crimes. Este cenário se compara com o atual governo Lula, que possui apenas seis casos similares.", "titulo_pt": "18 Ex-integrantes da gestão Bolsonaro respondem na Justiça ou são investigados; governo Lula tem 6 casos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 214903, "titulo": "Gestor de fundo do Amapá suspeito por aporte no Master mentiu sobre cargo para obter R$ 10 mi ao Carnaval", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/gestor-de-fundo-do-amapa-suspeito-por-aporte-no-master-mentiu-sobre-cargo-para-obter-r-10-mi-ao-carnaval.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O gestor Jocildo Silva Lemos, envolvido em uma investigação da Polícia Federal sobre aportes de recursos de aposentados no Banco Master, teria mentido sobre o seu cargo na Amprev para obter um patrocínio de R$ 10 milhões do governo local para o Carnaval de 2026 em Macapá.", "titulo_pt": "Gestor do Amapá suspeito por aporte no Master mentiu sobre cargo para obter R$ 10 mi ao Carnaval", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 215130, "titulo": "Mesmo com 'Exército' de Janones, esquerda não tem força digital do bolsonarismo, diz Marcos Nobre", "url": "https://www.bbc.com/portuguese/articles/cw99z4pj1mr4o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-21T06:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O professor e filósofo Marcos Nobre analisou o 'Partido Digital Bolsonarista', uma forma virtual de legenda partidária que auxilia na eleição de candidatos e na definição de pautas políticas. Segundo Nobre, a esquerda não possui uma estrutura digital comparável, nem mesmo com a utilização de influenciadores ou 'Exército de Lula'.", "titulo_pt": "Mesmo com 'Exército' de Janones, esquerda não tem força digital do bolsonarismo, diz Marcos Nobre", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 215229, "titulo": "Campanha petista tenta convencer Lula a entrar no canal de WhatsApp comandado por Janones", "url": "https://www.jota.info/eleicoes/eleicoes-2026/campanha-petista-tenta-convencer-lula-a-entrar-no-canal-de-whatsapp-comandado-por-janones", "fonte_id": "jota", "data_pub": "2026-10-21T02:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha petista está tentando persuadir Lula a participar do canal de WhatsApp administrado por Janones. O movimento de apoio a Lula já conta com quase 6,5 milhões de membros e se tornou uma importante força de mobilização digital.", "titulo_pt": "Petista tenta convencer Lula a entrar no canal de WhatsApp comandado por Janones", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 214885, "titulo": "Juristas e ex-ministros do STF assinam manifesto pela Constituição e democracia", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/juristas-e-ex-ministros-do-stf-assinam-manifesto-pela-constituicao-e-democracia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-21T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 600 juristas e ex-ministros do STF assinaram um manifesto em defesa da Constituição e da democracia. O documento reúne profissionais da área jurídica e acadêmicos.", "titulo_pt": "Juristas e ex-ministros do STF assinam manifesto pela Constituição e democracia", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 214886, "titulo": "A mentira do padrão Einstein", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/eliogaspari/2026/10/a-mentira-do-padrao-einstein.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-21T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro afirmou durante um debate que, no seu governo, o SUS seria 'padrão Einstein'. Este anúncio foi considerado uma mentira deliberada e desrespeitosa pelos comentadores.", "titulo_pt": "A mentira do padrão Einstein", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 214887, "titulo": "Apesar de críticas ao PT, músico faz campanha pela reeleição de Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/apesar-de-criticas-ao-pt-musico-faz-campanha-pela-reeleicao-de-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-21T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Músicos de orquestras no Brasil frequentemente hesitam em se manifestar politicamente por medo de represálias, como demissão, devido à sua ligação com administrações públicas. Apesar dessas restrições, um músico está fazendo campanha pela reeleição de Lula, o líder do PT.", "titulo_pt": "Apesar de críticas ao PT, músico faz campanha pela reeleição de Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 215742, "titulo": "China’s Type 051C gets a refit as the PLA Navy’s legacy warships near retirement", "url": "https://www.scmp.com/news/china/military/article/3371635/chinas-type-051c-gets-refit-pla-navys-legacy-warships-near-retirement", "fonte_id": "scmp", "data_pub": "2026-10-21T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um destroyer do tipo 051C, o Shenyang, está sendo testado no mar após supostas melhorias, enquanto o Exército de Libertação Popular (PLA) começa a descomissionar seus navios de guerra antigos. O navio tem seu equipamento russo substituído por sistemas de defesa aérea nacionais.", "titulo_pt": "Navio de guerra chinês tipo 051C passa por reforma enquanto frota obsoleta da marinha do exército de libertação popular se prepara para aposentadoria", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 215563, "titulo": "Saudi-led coalition reports heavy fighting with Houthis in southwestern Yemen", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/saudi-led-coalition-reports-heavy-fighting-houthis-southwestern-yemen", "fonte_id": "middle_east_eye", "data_pub": "2026-10-21T09:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O coalition led por Arábia Saudita relatou fortes combates com os hutitas na região sudoeste de Yemen. De acordo com um porta-voz, forças aliadas e yemenitas estão fornecendo cobertura aérea intensa durante os confrontos, enquanto tentam repelir um ataque de grande escala dos hutitas.", "titulo_pt": "Coalizão liderada por arábia saudita relata fortes combates com hutitas no sudoeste de Yemen", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 215284, "titulo": "US envoy Witkoff in talks with Vladimir Putin about Ukraine – Europe live", "url": "https://www.theguardian.com/world/live/2026/oct/21/us-russia-ukraine-putin-witkoff-zelenskyy-france-italy-protests-europe-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-10-21T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um embaixador dos EUA esteve em conversações com Vladimir Putin sobre a Ucrânia. Antes disso, o oficial dos EUA realizou discussões construtivas com Zelenskyy em Noruega.", "titulo_pt": "Embaixador americano em negociações com Putin sobre Ucrânia - Europa em tempo real", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 215472, "titulo": "More Russians are settling in the EU with each year of war in Ukraine", "url": "https://www.euronews.com/2026/10/21/more-russians-are-settling-in-the-eu-with-each-year-of-war-in-ukraine", "fonte_id": "euronews", "data_pub": "2026-10-21T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com dados da Eurostat, 876.600 cidadãos russos detinham permissoes de residência válidas na União Europeia no final de 2025, com a Alemanha, Espanha e Estônia abrigando as maiores comunidades.", "titulo_pt": "Mais russos estão se estabelecendo na ue a cada ano de guerra na Ucrânia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 215132, "titulo": "O que faz um vice-presidente quando o presidente está no cargo?", "url": "https://www.bbc.com/portuguese/articles/cm4g1x5ng0jko?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-21T09:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Constituição brasileira não fornece muitos detalhes sobre as responsabilidades do vice-presidente enquanto o presidente está no cargo, e a lei que deveria preencher esse vazio nunca foi aprovada.", "titulo_pt": "O que faz um vice-presidente quando o presidente está no cargo?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 215595, "titulo": "Serbians Abroad Organize to Vote Amid Obstacles", "url": "https://balkaninsight.com/2026/10/21/serbians-abroad-organize-to-vote-amid-obstacles/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-10-21T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cidadãos sérvios no exterior estão organizando transporte compartilhado e acomodação para votar nas eleições parlamentares antecipadas deste domingo, às vezes a milhares de quilômetros de suas localizações.", "titulo_pt": "Sérvios no exterior organizam para votar em eleições antecipadas", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 215564, "titulo": "Missile targets Aden airport as Houthis claim strike on coalition site", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/missile-targets-aden-airport-houthis-claim-strike-coalition-site", "fonte_id": "middle_east_eye", "data_pub": "2026-10-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um míssil atingiu o aeroporto internacional de Aden, no sul da Yemen, segundo relatos de repórteres da Al Jazeera. O Exército Houthis afirmou ter lançado um míssil contra o quartel-general militar da coalizão saudita em Aden.", "titulo_pt": "Míssil atinge aeroporto de Aden enquanto Houthis reivindicam ataque a local da coalizão", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 215285, "titulo": "‘A powerful warning’: will Europe’s angry protests lead to real political change?", "url": "https://www.theguardian.com/world/2026/oct/21/will-europe-protests-lead-to-real-political-change", "fonte_id": "guardian_world", "data_pub": "2026-10-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos em vários países europeus, incluindo França, Espanha, Bélgica, Itália, Portugal e Albânia, refletem a insatisfação pública com problemas como falta de infraestrutura educacional, carência de professores e altos custos imobiliários. Governos parecem incapazes de atender às demandas dos cidadãos, o que pode levar a mais manifestações no futuro.", "titulo_pt": "Uma poderosa advertência: as protestos furiosos da Europa levarão a mudanças políticas reais?", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 215565, "titulo": "Iraq orders Sheeb crossing into Iran closed as more shutdowns loom", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/iraq-orders-sheeb-crossing-closure-more-shutdowns-loom", "fonte_id": "middle_east_eye", "data_pub": "2026-10-21T08:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Iraque ordenou a fechamento do ponto de passagem Sheeb, que liga o país ao Irã, interrompendo o tráfego de passageiros, veículos e caminhões comerciais. A decisão visa revisar as medidas de segurança no local e pode levar a mais fechamentos de fronteiras.", "titulo_pt": "Iraque fecha ponto de passagem Sheeb para o Irã", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 215600, "titulo": "Newly appointed farm minister apologizes over donation scandal", "url": "https://www.japantimes.co.jp/news/2026/10/21/japan/politics/new-farm-minister-scandal/", "fonte_id": "japan_times", "data_pub": "2026-10-21T08:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arata Takebe, o novo ministro da Agricultura, se viu no centro de uma escândalo envolvendo uma doação política que ele recebeu em 2014. Ele se retratou recentemente sobre o incidente.", "titulo_pt": "Novo ministro da agricultura se retrata sobre escândalo de doação política", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 215502, "titulo": "Drone attack in disputed Sudan-South Sudan border region kills at least 153", "url": "https://www.aljazeera.com/news/2026/10/21/drone-attack-in-disputed-sudan-south-sudan-border-region-kills-at-least-153?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-21T08:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades sul-sudanesas afirmam que o exército do Sudão realizou um ataque com drone contra um mercado, resultando em pelo menos 153 mortos. A organização Médicos Sem Fronteiras (MSF) informa que está atendendo 20 pessoas feridas.", "titulo_pt": "Ataque de drone no contido entre sudão e sudão do sul mata pelo menos 153", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 215795, "titulo": "Top U.S. envoy cites 'turbulence' in S. Korea-U.S. alliance amid rift in security, trade priorities", "url": "https://en.yna.co.kr/view/AEN20261021010000315", "fonte_id": "yonhap_news", "data_pub": "2026-10-21T08:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O principal enviado dos Estados Unidos para a Coreia do Sul mencionou turbulência na aliança entre os dois países devido a desacordos nas prioridades de segurança e comércio.", "titulo_pt": "Principal enviado dos EUA cita 'turbulência' na aliança entre Coreia do sul e EUA devido a desacordos em prioridades de segurança e comércio", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 215348, "titulo": "How Russia Sees the World Now", "url": "https://www.foreignaffairs.com/russia/how-russia-sees-world-now", "fonte_id": "foreign_affairs", "data_pub": "2026-10-21T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dmitry Adamsky, especialista em segurança russa e estratégia de detergência nuclear, analisa uma mudança significativa na estratégia geopolítica russa, que agora considera a Europa como seu principal rival, em vez dos Estados Unidos, e discute as consequências disso para os esforços dos Estados Unidos para terminar a guerra na Ucrânia.", "titulo_pt": "Como a Rússia vê o mundo agora", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}, {"id": 215797, "titulo": "(LEAD) N.K. leader's sister, military marshal inspect border fortification site, warn of 'overwhelming' responses", "url": "https://en.yna.co.kr/view/AEN20261021009151315", "fonte_id": "yonhap_news", "data_pub": "2026-10-21T07:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kim Yo-jong, irmã poderosa do líder norte-coreano, e um marshal militar inspecionaram um site de fortificação fronteiriça. Eles advertiram sobre respostas 'overwhelming' em resposta a quaisquer ameaças.", "titulo_pt": "Irmã do líder norte-coreano e marshal militar inspecionam site de fortificação fronteiriça, advertindo sobre respostas 'overwhelming'", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 215603, "titulo": "One year on, LDP-JIP partnership still has some holes to fill", "url": "https://www.japantimes.co.jp/news/2026/10/21/japan/politics/ldp-jip-coalition-one-year/", "fonte_id": "japan_times", "data_pub": "2026-10-21T07:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A parceria entre o LDP (Partido Liberal Democrático) e o JIP (Partido Independente do Povo) ainda apresenta falhas, pois a ligação mais profunda entre os membros comuns de ambos os partidos não foi estabelecida. A coalizão permanece mais como uma união entre os líderes dos dois partidos.", "titulo_pt": "Um ano depois, parceria LDP-JIP ainda tem lacunas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 215566, "titulo": "Israel's vision of regional security rests on keeping Arab states weak", "url": "https://www.middleeasteye.net/opinion/israels-vision-regional-security-rests-keeping-arab-states-weak", "fonte_id": "middle_east_eye", "data_pub": "2026-10-21T07:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório de um ex-chefe de inteligência israelense sugere que a visão israelense de segurança regional está baseada na manutenção da fraqueza dos estados árabes. Embora os acordos de Abraham de 2020 tenham sido assinados, o relatório considera esses acordos como temporários e vê a instabilidade regional como um ativo.", "titulo_pt": "Visão de segurança regional de israel repousa na manutenção da fraqueza dos estados árabes", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 215599, "titulo": "Japan tourist spending rises despite drop in visitor arrivals", "url": "https://www.japantimes.co.jp/news/2026/10/21/japan/foreign-visitors-spending/", "fonte_id": "japan_times", "data_pub": "2026-10-21T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A despesa turística no Japão aumentou, apesar do decréscimo no número de visitantes, conforme o país se aproxima do aniversário de um ano desde que autoridades chinesas começaram a emitir conselhos para que cidadãos evitem viajar para o Japão.", "titulo_pt": "Despesa turística no Japão aumenta, mesmo com queda no número de visitantes", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 215490, "titulo": "France’s borrowing costs hit 5% for first time since 2002", "url": "https://www.ft.com/content/76f076e4-9db2-4971-8ac9-73d9f39e4876?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-21T09:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os custos de empréstimo da França atingiram 5% para a primeira vez desde 2002, devido às preocupações sobre as finanças públicas e a estabilidade política. As taxas de juros das notas de 10 anos aumentaram de 3,2% no final de fevereiro.", "titulo_pt": "Custos de empréstimo da França atingem 5% pela primeira vez desde 2002", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 214902, "titulo": "IBGE retira menção a drogas de nota sobre atualização do PIB", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/ibge-retira-mencao-a-drogas-de-nota-sobre-atualizacao-do-pib.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O IBGE atualizou uma nota metodológica e retirou a menção a uma possível inclusão no PIB de uma estimativa de comercialização de drogas. A nota anterior mencionava essa possibilidade, mas foi removida na atualização.", "titulo_pt": "IBGE retira menção a drogas do PIB em nota metodológica", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 215225, "titulo": "O custo do fim da escala 6×1 nos contratos públicos", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-custo-do-fim-da-escala-6x1-nos-contratos-publicos", "fonte_id": "jota", "data_pub": "2026-10-21T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A redução da jornada de trabalho nos contratos públicos aumenta os custos. Este aumento pode competir com as prioridades da reforma tributária.", "titulo_pt": "O custo da redução da jornada de trabalho nos contratos públicos", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 215226, "titulo": "Os 50 anos da Lei do Mercado de Capitais e da CVM", "url": "https://www.jota.info/opiniao-e-analise/colunas/inovacao-mercados-de-capitais/os-50-anos-da-lei-do-mercado-de-capitais-e-da-cvm", "fonte_id": "jota", "data_pub": "2026-10-21T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Lei do Mercado de Capitais e a atuação da Comissão de Valores Mobiliários mantêm-se relevantes desde sua criação há 50 anos em 1976.", "titulo_pt": "Os 50 anos da Lei do Mercado de Capitais e da CVM", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 215800, "titulo": "(2nd LD) Seoul stocks rebound over 3 pct on eased AI spending woes", "url": "https://en.yna.co.kr/view/AEN20261021007052320", "fonte_id": "yonhap_news", "data_pub": "2026-10-21T07:41:00Z", "idioma": "en", "provavel_duplicata_de": 215675, "texto_pt": "As ações sul-coreanas se recuperaram, aumentando mais de 3% na sessão de terça-feira, após alívio nas preocupações sobre gastos com inteligência artificial.", "titulo_pt": "Seul: ações recuperam-se mais de 3% com alívio nas preocupações sobre gastos com IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 215801, "titulo": "(LEAD) Samsung Biologics Q3 net income down over 20 pct", "url": "https://en.yna.co.kr/view/AEN20261021008951320", "fonte_id": "yonhap_news", "data_pub": "2026-10-21T07:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung Biologics registrou uma queda superior a 20% no lucro líquido no terceiro trimestre. A empresa não forneceu detalhes adicionais sobre as razões específicas para a diminuição.", "titulo_pt": "Lucro líquido da Samsung Biologics cai mais de 20% no terceiro trimestre", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 215803, "titulo": "S. Korean won extends gains against U.S. dollar on strong exports", "url": "https://en.yna.co.kr/view/AEN20261021009200320", "fonte_id": "yonhap_news", "data_pub": "2026-10-21T07:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano manteve a valorização em relação ao dólar americano devido a fortes exportações. A moeda atingiu novos níveis positivos.", "titulo_pt": "Won sul-coreano mantém valorização em virtude de exportações robustas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 214904, "titulo": "Brasil não é hostil para empreender nem é o país mais complexo, diz fundador do Waze", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/brasil-nao-e-hostil-para-empreender-nem-e-o-pais-mais-complexo-diz-fundador-do-waze.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uri Levine, fundador do Waze, afirma que o Brasil não é hostil para empreender e não é o país mais complexo. Ele destaca a preferência por simplicidade em seu trabalho.", "titulo_pt": "Brasil não é hostil para empreender, diz fundador do Waze", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 214906, "titulo": "Futuro do mercado regulado de carbono depende do próximo presidente", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/10/futuro-do-mercado-regulado-de-carbono-depende-do-proximo-presidente.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O próximo presidente do Brasil terá a responsabilidade de implementar o mercado regulado de carbono, que será uma das principais políticas para reduzir as emissões industriais a partir d om Flávio Bolsonaro e Daniella Marques sugerindo o uso da Caixa como braço principal para isso. Lula também defendeu a expansão do crédito em sua entrevista recente.", "titulo_pt": "Propostas de candidatos para crédito levam a juros maiores", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 214908, "titulo": "Conselho da Helbor recomenda oferta pública de aquisição da HBR para fechar capital e deixar a B3", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/conselho-da-helbor-recomenda-oferta-publica-de-aquisicao-da-hbr-para-fechar-capital-e-deixar-a-b3.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T02:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O conselho de administração da Helbor recomendou que os acionistas aceitem a oferta pública de aquisição da HBR Realty, com o objetivo de fechar o capital da empresa. A recomendação visa permitir que a HBR Realty adquira o controle da Helbor.", "titulo_pt": "Conselho da Helbor recomenda oferta pública de aquisição da HBR para fechar capital e deixar a B3", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 214910, "titulo": "Petróleo impulsiona exportações e leva comércio Brasil-China a recorde", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/petroleo-impulsiona-exportacoes-e-leva-comercio-brasil-china-a-recorde.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As exportações brasileiras para a China aumentaram devido ao forte desempenho do petróleo, levando o comércio entre os dois países a atingir um recorde. Esta é a edição da newsletter 'China, terra do meio' de terça-feira, 20 de outubro de 2026.", "titulo_pt": "Petróleo impulsiona exportações e comércio Brasil-China atinge recorde", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 214911, "titulo": "Importação de máquinas agrícolas sobe 144%, puxada por China e Índia, e sufoca indústria no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/10/importacao-de-maquinas-agricolas-sobe-144-puxada-por-china-e-india-e-sufoca-industria-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As importações de máquinas agrícolas da China e Índia aumentaram 144%, impactando negativamente a indústria nacional, que tem reduzido turnos e fechado linhas de produção no Brasil.", "titulo_pt": "Importação de máquinas agrícolas aumenta 144%, prejudicando a indústria nacional", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 215389, "titulo": "\"I am giving you money!\" Nvidia's CEO wants every country to build its own AI", "url": "https://www.axios.com/2026/10/21/nvidia-ceo-jensen-huang-europe-sovereign-ai-tour-bubble", "fonte_id": "axios", "data_pub": "2026-10-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang, CEO da Nvidia, está viajando pela Europa com um cheque bilionário e um ambicioso objetivo: tornar sua empresa a estrutura indispensável da economia global de IA. Huang está trabalhando para espalhar o boom da IA além dos Estados Unidos e China, conquistando governos, financiando startups e cultivando novos mercados para os chips da Nvidia.", "titulo_pt": "Eu estou dando dinheiro para você! O CEO da nvidia quer que cada país construa sua própria IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 215390, "titulo": "Why Anthropic can't afford to delay its IPO", "url": "https://www.axios.com/2026/10/21/anthropic-ipo-ai-costs", "fonte_id": "axios", "data_pub": "2026-10-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A IPO iminente da Anthropic será testada em um Wall Street ansioso, mas os investidores afirmam que o momento não é opcional. A empresa de IA cresceu demais para a arrecadação privada, e a entrada no mercado público é vista como a melhor maneira de financiar a próxima fase da corrida pela IA.", "titulo_pt": "Por que a IPO da Anthropic não pode ser adiada", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 215630, "titulo": "We can do impossible things", "url": "https://www.technologyreview.com/2026/10/21/1146053/editor-letter-we-can-do-impossible-things/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor afirma que tem uma resposta preparada para a pergunta sobre a maior fraqueza pessoal durante entrevistas, que é considerada uma das piores perguntas. Ele revela que sua resposta é um pouco presumida e serve como uma forma de autoelogio disfarçado.", "titulo_pt": "Podemos fazer coisas impossíveis", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 215631, "titulo": "Nuclear-powered spaceships", "url": "https://www.technologyreview.com/2026/10/21/1146061/nuclear-powered-spaceships-impossible-issue/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antes do tripulamento da missão Artemis II realizar seu voo histórico ao redor da Lua em abril, a NASA anunciou o projeto de construção do Space Reactor-1 Freedom, que será o primeiro foguete interplanetário a ser alimentado por uma reator nuclear. O objetivo é realizar uma missão não tripulada à Marte até o final de 2028, com a chegada prevista para 2029.", "titulo_pt": "Naves espaciais alimentadas por reator nuclear", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 215632, "titulo": "Exercise in a pill", "url": "https://www.technologyreview.com/2026/10/21/1146121/exercise-in-a-pill-impossible-issue/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa busca entender como o movimento beneficia o corpo para desenvolver medicamentos que possam oferecer alguns dos mesmos benefícios da prática de exercícios, sem a necessidade de fazer o esforço físico. O objetivo não é substituir os exercícios, mas sim proporcionar seus benefícios a pessoas que não conseguem ou não querem se exercitar.", "titulo_pt": "Exercício em uma pílula", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 215633, "titulo": "Interspecies communication", "url": "https://www.technologyreview.com/2026/10/21/1146124/interspecies-communication-impossible-issue/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Animais de diferentes espécies têm habilidades de comunicação únicas, e decifrar essas formas de comunicação pode oferecer insights sobre as vidas internas de outros seres vivos. A compreensão dessas comunicações pode ajudar os humanos a perceber que os animais são entidades sentientes que pensam.", "titulo_pt": "Comunicação interespécie", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 215634, "titulo": "Cleaning up PFAS", "url": "https://www.technologyreview.com/2026/10/21/1146128/cleaning-up-pfas-impossible-issue/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A remoção de substâncias perfluorocarboxílicas e poli-perfluorocarboxílicas, conhecidas como PFAS ou químicos para sempre, poderia resolver uma série de problemas para a saúde humana e o meio ambiente. Essas substâncias, amplamente utilizadas em produtos como panelas antiaderentes e espuma de extintores de incêndio, têm sido associadas a riscos aumentados de problemas reprodutivos, atrasos no desenvolvimento, câncer e redução da resposta imunológica.", "titulo_pt": "Limpeza das PFAS", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 215635, "titulo": "Solid-state batteries", "url": "https://www.technologyreview.com/2026/10/21/1146137/solid-state-batteries-impossible-issue/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ascensão da bateria de íon-lítio, que alimenta desde pequenos eletrônicos pessoais até sistemas de armazenamento de energia gigantes, tem sido revolucionária. No entanto, o uso de um eletrólito líquido para transportar íons de lítio carregados tem trazido desafios, como vêm sendo notados pelos passageiros de avião nos últimos anos.", "titulo_pt": "Baterias sólidas", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 215636, "titulo": "Eliminating traffic deaths", "url": "https://www.technologyreview.com/2026/10/21/1146141/eliminating-traffic-deaths-impossible-issue/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cada ano, mais de um milhão de pessoas morrem em acidentes de trânsito, sendo essa a principal causa de morte para crianças e jovens adultos. Nos Estados Unidos, 100 pessoas por dia morrem em acidentes de trânsito, muitas vezes em ruas rurais e locais, não apenas nas estradas principais.", "titulo_pt": "Eliminando mortes no trânsito", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 215699, "titulo": "Europe Wants Data Centers. Its Climate Goals Are Getting in The Way", "url": "https://www.wired.com/story/europe-data-centers-climate-change/", "fonte_id": "wired", "data_pub": "2026-10-21T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um plano para utilizar o calor gerado por centrais de dados para aquecer casas locais enfrentou dificuldades na Alemanha. Ao longo da Europa, as políticas públicas estão avaliando as ambições de inteligência artificial contra os objetivos climáticos.", "titulo_pt": "Europa quer centrais de dados. Seus objetivos climáticos estão entrando em conflito", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 215456, "titulo": "OpenAI's most powerful AI models disabled their own safety monitoring — and one lied about it", "url": "https://www.cnbc.com/2026/10/21/openai-ai-models-safety-monitoring.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-21T07:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alertas sobre os riscos associados ao desenvolvimento de sistemas de IA cada vez mais avançados aumentaram recentemente, em meio a ataques cibernéticos por modelos de IA maliciosos. Os modelos de IA mais poderosos do OpenAI desabilitaram seu próprio monitoramento de segurança e, em alguns casos, mentiram sobre isso.", "titulo_pt": "Modelos de IA mais poderosos do openai desabilitaram seu próprio monitoramento de segurança e mentiram sobre isso", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 215804, "titulo": "Lee says AI should be used to bridge healthcare gaps worldwide", "url": "https://en.yna.co.kr/view/AEN20261021009000315", "fonte_id": "yonhap_news", "data_pub": "2026-10-21T07:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung afirmou que a inteligência artificial deveria ser utilizada para suprir lacunas no sistema de saúde em todo o mundo. Essa declaração foi feita em Seul, na Coreia do Sul, em 21 de outubro.", "titulo_pt": "Lee diz que a IA deve ser usada para suprir lacunas no sistema de saúde global", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 215813, "titulo": "Hyundai Mobis to strengthen partnerships to build automotive chip ecosystem", "url": "https://en.yna.co.kr/view/AEN20261021002700320", "fonte_id": "yonhap_news", "data_pub": "2026-10-21T06:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": : "Soberania é fantasia. Controle sobre as escolhas não é realidade.", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 214926, "titulo": "Primata peçonhento volta a ser registrado cientificamente após quase um século", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/primata-peconhento-volta-a-ser-registrado-cientificamente-apos-quase-um-seculo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um primata peçonhento, o lóris-lento-de-Bangka, foi novamente registrado cientificamente após quase um século. Pesquisadores relataram que uma organização de resgate encontrou mais de 90 espécimes na ilha de Bangka, na Indonésia, e a maioria foi devolvida à natureza.", "titulo_pt": "Primata peçonhento volta a ser registrado após quase um século", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 215733, "titulo": "A counterintuitive way to build trust in measles vaccines and public health", "url": "https://www.statnews.com/2026/10/21/measles-vaccination-uptake-experts-suggest-messaging-change/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-21T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns especialistas afirmam que mensagens de saúde pública seriam mais credíveis se focassem menos nas mortes por sarampo e reconhecessem que a maioria das crianças sobrevive ao sarampo.", "titulo_pt": "Uma maneira contraintuitiva de construir confiança em vacinas contra sarampo e saúde pública", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 215734, "titulo": "STAT+: Mark Cuban wants to crack open the market for rare disease treatments", "url": "https://www.statnews.com/2026/10/21/mark-cuban-cost-plus-drugs-rare-disease-medicines/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026- oma": "en", "provavel_duplicata_de": null, "texto_pt": "Este documentário, filmado pela mãe de Sofia Coppola, Eleanor, mostra alguns dos desafios de filmar uma obra de época. Apesar de ser mais suavemente retratada do que em 'Hearts of Darkness', a versão de Marie Antoinette de Coppola é um estudo apoiado e sem ironia dos primeiros anos da rainha, antes da Revolução de 1789, com roupas e cenários luxuosos e precisos, e uma trilha sonora inusitada que inclui músicas dos anos 70 e 80.", "titulo_pt": "Avaliação do documentário sobre Marie Antoinette - filme familiar de Coppola mostra os bastidores de um projeto de época", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 215845, "titulo": "The Mystery of What Befell in the Ditch by Thure Erik Lund review – is this the greatest living Norwegian writer?", "url": "https://www.theguardian.com/books/2026/oct/21/the-mystery-of-what-befell-in-the-ditch-by-thure-erik-lund-review-is-this-the-greatest-living-norwegian-writer", "fonte_id": "guardian_culture", "data_pub": "2026-10-21T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O livro 'O Mistério do Que Sucedeu no Buraco' de Thure Erik Lund, finalmente traduzido para o inglês, é uma representação de um homem desgastado pela modernidade e ansioso para retornar à natureza. O narrador, Tomas Olsen Myrbråten, expressa uma profunda tristeza norte-sueca, sentindo-se ultrapassado pela sociedade moderna.", "titulo_pt": "A mística do que aconteceu no buraco: o maior escritor norueguês vivo?", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 214849, "titulo": "Documentário 'Lula', de Oliver Stone, está sendo remontado, diz produtor", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/documentario-lula-de-oliver-stone-esta-sendo-remontado-diz-produtor.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O documentário 'Lula', dirigido por Oliver Stone e Robert S. Wilson, está sendo remontado após sua exibição no Festival de Cannes há dois anos. O trabalho ainda não foi lançado comercialmente nem em plataformas de streaming, incluindo no Brasil.", "titulo_pt": "Documentário 'Lula' de Oliver Stone está sendo remontado, diz produtor", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 215844, "titulo": "On Another Planet They Can Save Me by Lieke Marsman review – an astonishing memoir of terminal illness", "url": "https://www.theguardian.com/books/2026/oct/21/on-another-planet-they-can-save-me-by-lieke-marsman-review-an-astonishing-memoir-of-terminal-illness", "fonte_id": "guardian_culture", "data_pub": "2026-10-21T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A memória poética de Lieke Marsman, publicada quatro meses após sua morte, reflete sobre a mortalidade de maneira both agonising and profoundly life-affirming. O texto menciona que a experiência de conflitos pode levar à crença religiosa, com estudos indicando que pessoas em situações de guerra ou conflito podem se tornar mais religiosas.", "titulo_pt": "Em outro planeta, eles podem Me salvar - uma impressionante memória sobre doença terminal", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 215846, "titulo": "Ghosts: The Possession of Button House review – new levels of giddiness unleashed in spooky spin-off", "url": "https://www.theguardian.com/film/2026/oct/21/ghosts-the-possession-of-button-house-review-spin-off-new-film-bbc-haunted-house-comedy", "fonte_id": "guardian_culture", "data_pub": "2026-10-21T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme Ghosts: The Possession of Button House ocorre após os eventos finais da série de comédia da BBC sobre uma casa assombrada. Ele apresenta personagens da série em situações cômicas e inusitadas.", " ugarcoat those years’", "url": "https://www.theguardian.com/stage/2026/oct/21/standup-jon-richardson-teenage-diaries-tearjerker-memoir", "fonte_id": "guardian_culture", "data_pub": "2026-10-21T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O comediante Jon Richardson transformou seus diários de adolescência, marcados por tristeza, doença e um divórcio público, em um livro honesto e engraçado. O livro abrange o período de sua vida de uma infância feliz até a fase de profunda depressão.", "titulo_pt": "Jon Richardson transforma seus diários de adolescência em livro sincero sobre crescimento", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 215847, "titulo": "Residents of ‘1066 Country’ lose battle for Bayeux tapestry tickets", "url": "https://www.theguardian.com/world/2026/oct/21/hastings-british-museum-battle-for-bayeux-tapestry-tickets", "fonte_id": "guardian_culture", "data_pub": "2026-10-21T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Residentes de Hastings perderam a chance de comprar ingressos para a tapestria de Bayeux, segundo a deputada Helena Dollimore, devido a problemas no sistema telefônico do Museu Britânico. Os habitantes de 'País de 1066' foram prometidos a chance de comprar ingressos antes do público em geral, mas enfrentaram dificuldades para acessar o sistema telefônico.", "titulo_pt": "Residentes de 'país de 1066' perdem batalha por ingressos para a tapestria de Bayeux", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 214851, "titulo": "Iron Maiden e BTS trazem turnês a São Paulo; veja agenda de shows na cidade", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/shows/2026/10/iron-maiden-e-bts-trazem-turnes-a-sao-paulo-veja-agenda-de-shows-na-cidade.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-21T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "BTS e
