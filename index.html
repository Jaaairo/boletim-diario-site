<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">

  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>

</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "06/10/2026 19:15", "stats": {"noticias_novas": 657, "resumos_gerados": 233}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O senador Flávio Bolsonaro declarou que utilizará a maioria no Congresso para propor mudanças na Constituição, buscando 'redemocratizar o país'. A União Brasil e o PP decidiram apoiar Flávio Bolsonaro no segundo turno da disputa presidencial. A campanha de Lula planeja organizar uma força-tarefa digital para aumentar seu desempenho nas redes sociais, incluindo reuniões com deputadas eleitas para a Câmara dos Deputados. O PL foi o partido que mais elegeram deputados estaduais e distritais, seguido pelo PT, com 212 e 141 respectivamente. O crescimento da participação de partidos mais conservadores no Congresso Nacional e nos governos estaduais deve influenciar a agenda legislativa a partir de 2027, com maior espaço para temas como segurança pública, valores e família, conforme avaliou o economista e professor da UnB Jeferson Ramos dos Santos.", "mundo": "A família Bolsonaro conquistou vitórias nas eleições no Brasil, trazendo uma surpreendente renovação política ao maior país da América Latina. Em outro desenvolvimento, a caderneta de racionamento, usada por décadas em Cuba para a compra de produtos a preços subsidiados, está prestes a ser desmontada após 60 anos, marcam o fim de um sistema simbólico da revolução de 1959. Na França, os protestos dos estudantes secundaristas atingiram seu dia mais grave desde o início da greve, com cerca de 256 mil manifestantes em mais de 40 cidades, incluindo 56 mil em Paris. O governo de Emmanuel Macron está em alerta diante desta situação. Além disso, a Força Italia em Sicília enfrenta tensões, com uma dura ligação telefônica entre Tajani e Schifani sobre a possibilidade de recandidatura do presidente nas eleições regionais de 2027.\n\nA Rússia é acusada de afundar navios com drones em águas da zona econômica exclusiva da Bulgária, um incidente que ocorre no contexto de tensões geopolíticas na região. O presidente ucraniano, Volodymyr Zelensky, acusa a Rússia de realizar o ataque, reforçando as tensões entre as duas nações. Além disso, a Bulgária iniciou uma operação de busca após dois navios serem atingidos por drones no Mar Negro. Em outro desenvolvimento, os Estados Unidos estão monitorando um caso de peste na Rússia, enquanto a Rússia nega que haja casos de peste após a morte de um técnico de laboratório. A tensão entre Israel e o Reino Unido também aumenta, com Israel estabelecendo um prazo para fechar o consulado britânico em resposta a novas sanções. Em meio a esses eventos, o mercado imobiliário dos Estados Unidos está estagnado, com a economia em alta e a inteligência artificial contribuindo para essa situação, mas não sendo o único fator envolvido.", "economia": "O Ibovespa registrou uma correção após um ganho de 8% no último pregão, encerrando o dia acima dos 205 mil pontos, enquanto o dólar fechou a R$ 4,97. O Banco do Brasil viu suas ações cair após a JP Morgan rebaixar sua recomendação, passando de 'neutro' para 'underweight'. O S&P 500 atingiu um novo recorde, mas a recuperação se tornou cada vez mais dependente de ações de tecnologia, após uma queda no mercado de títulos. A América Latina reduziu seu ritmo de crescimento para 2,2% em 2026, de acordo com as previsões do Banco Mundial, uma diminuição em relação aos 2,4% observados no ano anterior. A França enfrenta uma grave crise fiscal, com protestos em todo o país e juros mais altos para financiar suas dívidas do que nações tradicionalmente associadas a crises financeiras, como a Grécia e a Itália. A balança comercial brasileira registrou um superávit de US$ 7,74 bilhões em setembro, resultado da exportação de petróleo, combustíveis, soja e cobre, com as exportações aumentando 12,9% no mês. A exportação de café verde do Brasil atingiu o maior nível em 20 meses, totalizando 3,93 milhões de sacas em setembro. As exportações para a União Europeia aumentaram 60,1% em setembro, enquanto as vendas para a China caíram 7,6% em comparação com o mesmo mês do ano anterior. A Aneel aprovou um novo modelo de rateio para os cortes de geração que gradualmente inclui usinas hidrelétricas. O FMI alertou que a alta dos preços de produtos básicos, como alimentos e energia, está sendo mais persistente do que se previa, devido às guerras no Irã e na Ucrânia. A curva de juros nos EUA continua subindo, com os rendimentos dos Tesouros de 10 anos atingindo seu maior nível em mais de duas décadas, chegando a 5,3%. A Uber está próxima de adquirir a empresa de catering ezCater por US$ 2,3 bilhões, o que ajudará a plataforma Uber Eats a atingir uma clientela mais corporativa. A Suzano, maior produtora de celulose do mundo, investe no papel higiênico, afirmando que o mercado não aceita ruído. O Brasil prevê um superávit da balança comercial de US$ 84,4 bilhões em 2026, contra a projeção anterior de US$ 90 bilhões, devido à queda do preço do petróleo. Além disso, o governo federal está avaliando assumir parte dos riscos relacionados a eventos climáticos extremos em concessões de aeroportos, portos e hidrovias, compartilhando os prejuízos com as empresas privadas quando os seguros não cobrirem os danos.", "tecnologia": "A Apple está colaborando com a LG para lançar uma nova linha de dispositivos inteligentes para o lar, incluindo um videotelhado, termostato e câmera interna. Os produtos serão vendidos sob a marca LG, mas se integrarão a um suposto hub de inteligência residencial da Apple, que deve ser lançado em um evento em 13 de outubro. Além disso, a Tesla está expandindo a função PowerShare Home Backup para os modelos Model 3 e Model Y, permitindo que os proprietários destes veículos utilizem suas baterias como fonte de energia em caso de falha de energia, desde que tenham também um Powerwall 3. Na área de inteligência artificial, a startup francesa Mistral lançou um novo modelo de IA com o objetivo de competir com gigantes mundiais como o ChatGPT e o Claude. A empresa Musubi lançou um modelo de decisão leve chamado PolicyLM-1.7B, projetado para moderação em tempo real. A Google firmou um acordo de 20 anos com a Constellation para atualizar seis instalações de usinas nucleares nos Estados Unidos, com o objetivo de gerar mais eletricidade para seus centros de dados consumidores de energia. A startup Lambda, que recebeu investimento da Nvidia, está levantando até US$ 4 bilhões em uma avaliação pré-money de US$ 14,5 bilhões, em preparação para uma oferta inicial de ações planejada para 2027, liderada por Coatue e Blackstone. Por fim, a empresa brasileira lançará um aplicativo de inteligência artificial para o mercado de cafés especiais durante um evento nos Emirados Árabes, auxiliando os usuários a identificar seu perfil de paladar, descobrir novos cafés e receber orientações.", "ciencia": "Francis Halzen, físico belga de 82 anos, recebeu o Prêmio Nobel de Física em 2026, sozinho, por suas contribuições na detecção de neutrinos de alta energia de origem astrofísica. A cerimônia de premiação ocorreu na manhã desta terça-feira (6). Halzen havia esperado pela premiação anualmente em outubro durante muitos anos, e a escolha do Nobel foi mais uma vitória na área da astronomia multimensageira. O Telescópio Espacial James Webb, da NASA/ESA/CSA, revelou estrelas ocultas por nuvens de poeira em uma nebulosa chamada NGC 7129, a 3.300 luzes-ano da Terra. A captura de luz infravermelha pelo telescópio permitiu visualizar regiões densas que normalmente escurecem a visão de outras formas de luz. Além disso, um caso de uma doença infecciosa em um instituto na Rússia levou à quarentena de um hospital e ao monitoramento de pessoas que entraram em contato com o paciente. O caso gerou preocupação, mas autoridades russas e a Organização Mundial da Saúde (OMS) afirmaram que não há risco de surto epidêmico.", "cultura": "A cultura global teve notícias significativas nos últimos dias. A atriz Eva Marie Saint, famosa por seus papéis em filmes de Alfred Hitchcock, faleceu aos 102 anos. O edifício anteriormente usado como sede pela arquiteta Zaha Hadid será reaberto ao público como um espaço de arte, incluindo uma exposição intitulada 'Zaha Hadid: Arquitetura de Performance'. O Distrito de Design de Detroit lançou um novo programa de estudo independente inspirado no renomado Programa de Estudo Independente da Whitney, visando formar profissionais de destaque no campo do design. O Museu de Arte de Phoenix recebeu uma doação de 5 milhões de dólares para expandir as galerias de arte sri-lanqueza e sul-asiática, com foco na arte sul-asiática e sri-lankesa. A exposição 'O Brasil de Tarsila' inaugurou o Nubank Arte Lab, no Conjunto Nacional, em São Paulo, com aproximadamente 40 obras projetadas em 360 graus. Além disso, a equipe por trás do aclamado filme de fantasia 'Pan's Labyrinth', dirigido por Guillermo del Toro, informou que a versão restaurada do filme, lançada em cinemas em 3D e Dolby Atmos, oferece uma experiência visual e sonora ainda melhor.", "sociedade": "Protestos estudantis em França continuam com violência e graves ferimentos. Segundo relatos, milhares de manifestantes em todo o país se mobilizam em defesa de uma educação melhor e de condições adequadas nas escolas. O incidente mais grave envolveu um adolescente que perdeu uma mão durante os confrontos. Em outro incidente, um homem foi preso após agredir fisicamente sua companheira em uma rodoviária no interior de São Paulo. As manifestações, que se estendem por várias cidades, incluindo Paris, Marselha e Nantes, levaram à detenção de mais de 5.000 pessoas. Além disso, a Sociedade Rural de San Pedro emitiu uma nota questionando o uso de recursos públicos para melhorias em estradas rurais, exigindo transparência sobre o destino desses fundos. No Brasil, a rede pública do Distrito Federal realizou o NaMoral de 2026, com alunos apresentando suas produções no Cine Brasília, enquanto a igreja Lagoinha e seu pastor foram condenados por um sermão controverso sobre beijar a filha.", "meio_ambiente": "O primeiro-ministro da Austrália, Anthony Albanese, alertou para um verão perigoso devido ao 'super El Niño' no Pacífico, com possíveis inundações, ciclones e calor extremo. Este alerta destaca a urgência de ações climáticas, especialmente para países insulares como Tuvalu. Paralelamente, a Natura estima que a mudança climática na Amazônia possa comprometer R$ 584,2 milhões em vendas, representando 2,6% da receita líquida da empresa em 2025. Em outro projeto, a Mataquito Transmisora de Energia enfrenta cinco reclamações no Tribunal Ambiental por supostas ilegalidades na aprovação de um projeto de transmissão elétrica de US$ 324 milhões. No exterior, as autoridades finlandesas ordenaram que a Google pare com a construção de centrais de dados até que possa comprovar conformidade com as leis ambientais, devido a preocupações ambientais.", "direitos_humanos": "A situação de direitos humanos em diversos países e regiões continua preocupante, com casos que abrangem desde violência sexual e casamentos forçados em Gaza, até a violência contra mulheres em Johannesburg, na África do Sul. Segundo relatos, mais de 1.900 crianças foram deixadas órfãs ou separadas de suas famílias devido à Ebola na República Democrática do Congo. No Brasil, apesar das mudanças de nome, há discussões sobre a continuidade de práticas sociais e políticas anteriores. Em um contexto mais amplo, a França enfrenta críticas por usar a força contra estudantes, enquanto a Rússia é acusada de adotar uma abordagem evasiva sobre a morte devido a um possível acidente de laboratório no norte do país. Além disso, a Coreia do Sul tem 52 condenados à morte, com uma média de idade de 58,7 anos. A guerra na região de Tigray, na Etiópia, tem levantado preocupações sobre a recruta forçada de meninos. A Assembleia da ONU condenou os ataques contra civis no Sudão e pediu um cessar-fogo, enquanto a UNICEF alertou sobre o impacto do El Niño nas crianças em mais de 100 países."}, "resumo_do_dia": {"politica_nacional": [{"id": 199433, "titulo": "Flávio diz que usará maioria no Congresso para “mudar Constituição”", "url": "https://www.cnnbrasil.com.br/eleicoes/flavio-diz-que-usara-maioria-no-congresso-para-mudar-constituicao/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro afirmou que utilizará a maioria no Congresso para propor mudanças na Constituição. O deputado federal disse que planeja fazer alterações constitucionais.", "titulo_pt": "Flávio diz que usará maioria no Congresso para 'mudar Constituição'", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 199558, "titulo": "União Brasil e PP fecham apoio a Flávio Bolsonaro", "url": "https://www.jota.info/eleicoes/eleicoes-2026/uniao-brasil-e-pp-fecham-apoio-a-flavio-bolsonaro", "fonte_id": "jota", "data_pub": "2026-10-06T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Brasil e o PP decidiram fornecer apoio a Flávio Bolsonaro. A decisão foi tomada em uma reunião que incluiu Ciro Nogueira, Antonio Rueda, Arthur Lira e Tereza Cristina.", "titulo_pt": "União Brasil e PP apoiam Flávio Bolsonaro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 199270, "titulo": "Veja os deputados federais mais votados em sua cidade", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/veja-os-deputados-federais-mais-votados-em-sua-cidade.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No domingo (4), o Brasil elegeria 513 deputados federais, sendo 311 deles reeleitos, que assumirão a Câmara a partir de fevereiro de 2027.", "titulo_pt": "Confira os deputados federais mais votados em sua cidade", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 199498, "titulo": "Deputada mais votada de SP apresentou projetos de lei que repetem textos de outros políticos e erra até a própria cidade", "url": "https://www.bbc.com/portuguese/articles/crwyd10307kjo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-06T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada mais votada de São Paulo apresentou projetos de lei que repetem textos de outros políticos e contêm erros geográficos, segundo análise da BBC News Brasil. Além disso, suas propostas quando era vereadora de Praia Grande mencionam órgãos públicos e leis de outras cidades, além de incluir um link referenciando ao ChatGPT.", "titulo_pt": "Deputada mais votada de SP apresenta projetos com repetição de textos e erros geográficos", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 199271, "titulo": "Boulos fará viagens no segundo turno em defesa da reeleição de Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/boulos-fara-viagens-no-segundo-turno-em-defesa-da-reeleicao-de-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Guilherme Boulos fará uma série de viagens pelo segundo turno das eleições, com o objetivo de apoiar a reeleição do presidente Luiz Inácio Lula da Silva, focando principalmente nas periferias.", "titulo_pt": "Boulos fará viagens no segundo turno para defender reeleição de Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 199501, "titulo": "Debates no segundo turno: datas, o que se sabe e o que falta definir sobre a participação de Lula e Flávio Bolsonaro", "url": "https://www.bbc.com/portuguese/articles/cmd93nkj51pgo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-06T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Candidatos à Presidência indicaram que irão participar dos debates no segundo turno. Até o momento, três debates estão marcados.", "titulo_pt": "Debates no segundo turno: datas, o que se sabe e o que falta definir sobre a participação de Lula e Flávio Bolsonaro", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 199285, "titulo": "PGR concorda com visita de Flávio Bolsonaro ao pai; pedido foi feito pela defesa após primeiro turno", "url": "https://g1.globo.com/politica/noticia/2026/10/06/pgr-nao-se-opoe-a-visita-de-flavio-bolsonaro-ao-pai.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-06T20:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República (PGR) concordou com o pedido da defesa de Jair Bolsonaro para permitir a visita do filho Flávio Bolsonaro durante a prisão domiciliar do ex-presidente. A decisão foi tomada após o pedido ser feito pela defesa após o primeiro turno das eleições.", "titulo_pt": "PGR concorda com visita de Flávio Bolsonaro ao pai após pedido da defesa", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 199283, "titulo": "Alcolumbre anuncia sessões para discutir e votar fim da escala 6x1", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/alcolumbre-anuncia-sessoes-para-discutir-e-votar-fim-da-escala-6x1", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-06T20:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Davi Alcolumbre, anunciou sessões para discutir e votar a Proposta de Emenda Constitucional que trata do fim da escala 6x1 e da redução da jornada de trabalho. Serão cinco sessões deliberativas antes da votação em primeiro turno, totalizando cinco dias de debates.", "titulo_pt": "Alcolumbre anuncia sessões para discutir e votar fim da escala 6x1 e redução da jornada de trabalho", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 199272, "titulo": "Lula contra a matemática no 2º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/voto-a-voto/2026/10/lula-contra-a-matematica-no-2o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T20:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2022, a análise de 287 disputas brasileiras mostrou que 75,5% dos candidatos vencedores no primeiro turno também ganharam o segundo turno. Naquele ano, o modelo de probabilidade dava 27% de chance de Bolsonaro vencer. Em 2026, a mesma matemática favorece Lula.", "titulo_pt": "Lula contra a matemática no 2º turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 199286, "titulo": "Site do TSE registra falta para quem votou e eleitores reclamam nas redes; processamento vai até 11 de outubro, diz tribunal", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/06/site-do-tse-registra-falta-para-quem-votou-e-eleitores-reclamam-nas-redes-tribunal-vai-atualizar-status-para-em-processamento.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-06T20:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eleitores têm relatado problemas no site do Tribunal Superior Eleitoral (TSE), que estaria registrando como falta a situação de eleitores que votaram no primeiro turno das eleições. O TSE informou que o processamento dos dados vai até 11 de outubro.", "titulo_pt": "Eleitores reclamam de site do TSE que registra falta para quem votou", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 199273, "titulo": "Lula e PT não sabem falar em autonomia e em prosperidade", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/marcosaugustogoncalves/2026/10/pt-nao-viu-que-identidade-politica-dos-pobres-mudou.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As urnas indicaram uma forte tendência de direita para mudar nomes tradicionais e o padrão de representação política desde a redemocratização. O PT e Lula não demonstram conhecimento sobre autonomia e prosperidade.", "titulo_pt": "Lula e PT não entendem autonomia e prosperidade", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 199287, "titulo": "Sem parentesco, só 5 de 29 candidatos que usaram nome de Bolsonaro ou de Lula na urna foram eleitos", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/06/candidatos-nome-bolsonaro-lula-resultado-eleicoes-2026.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-06T20:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Das 29 candidaturas que usaram o nome de Bolsonaro ou Lula na urna, apenas cinco foram eleitos. Dos 20 candidatos que registraram nomes com referência a Bolsonaro, apenas três foram eleitos, enquanto entre os nove que adotaram o nome de Lula, dois foram eleitos.", "titulo_pt": "Sem parentesco, só 5 de 29 candidatos que usaram nome de Bolsonaro ou Lula na urna foram eleitos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 199261, "titulo": "Flávio Roscoe é cotado para comandar pasta da indústria em eventual governo de Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/flavio-roscoe-e-cotado-para-comandar-pasta-da-industria-em-eventual-governo-de-flavio-bolsonaro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T20:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Roscoe, um candidato do PL ao governo de Minas Gerais, é considerado um dos nomes mais prováveis para ocupar uma pasta relacionada à indústria em um eventual governo de Flávio Bolsonaro, segundo relatos da coluna. O apoio vem de políticos mineiros e industriais que apoiam a campanha do presidenciável.", "titulo_pt": "Flávio Roscoe é cotado para pasta da indústria em eventual governo de Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199262, "titulo": "Aena assume concessão do Galeão, no Rio, e Infraero sai do quadro acionário", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/10/aena-assume-concessao-do-galeao-no-rio-e-infraero-sai-do-quadro-acionario.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T20:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A espanhola Aena assumiu a concessão do Aeroporto Internacional do Galeão, no Rio de Janeiro, após vencer o leilão do terminal em março deste ano. A Infraero deixou de ser acionista do aeroporto carioca.", "titulo_pt": "Aena assume concessão do Galeão e Infraero sai do quadro acionário", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 199288, "titulo": "Sem detalhar, OEA diz que houve 'ativismo político internacional' na eleição; TSE descarta interferência", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/06/sem-detalhar-oea-diz-que-houve-ativismo-politico-internacional-na-eleicao-tse-descarta-interferencia.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-06T20:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Organização dos Estados Americanos (OEA) afirmou em relatório que as eleições no Brasil ocorreram pacificamente, mas que houve 'ativismo político internacional' sobre o processo. O TSE (Tribunal Superior Eleitoral) negou qualquer interferência.", "titulo_pt": "OEA aponta 'ativismo político internacional' nas eleições brasileiras; TSE nega interferência", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 199274, "titulo": "Datafolha divulga pesquisa de 2º turno para presidente e DF nesta quinta (8); live comenta resultados", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/datafolha-divulga-pesquisa-de-2o-turno-para-presidente-e-df-nesta-quinta-8-live-comenta-resultados.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-06T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Datafolha divulga uma nova pesquisa sobre a intenção de voto para o segundo turno da eleição presidencial entre Lula e Flávio Bolsonaro, bem como para o governo do Distrito Federal entre Celina Leão e Leandro Grass. O levantamento também aborda a avaliação do governo Lula e da gestão de Celina.", "titulo_pt": "Datafolha divulga pesquisa de segundo turno para presidente e DF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 199591, "titulo": "Bolsonaro Family Emerges Triumphant in Brazil’s Elections, Mounting a Surprising Resurrection", "url": "https://www.nytimes.com/2026/10/06/world/americas/brazil-election-flavio-jair-bolsonaro.html", "fonte_id": "nyt_world", "data_pub": "2026-10-06T21:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A família Bolsonaro obteve vitórias nas eleições no Brasil, realizando uma surpreendente renovação política no maior país da América Latina.", "titulo_pt": "Família bolsonaro emerge triunfante nas eleições no Brasil, realizando renovação surpreendente", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 199540, "titulo": "Se destrabó un negocio clave con Europa y las exportaciones ya son más de cuatro veces las del primer semestre", "url": "https://www.lanacion.com.ar/economia/campo/se-destrabo-un-negocio-clave-con-europa-y-las-exportaciones-ya-son-mas-de-cuatro-veces-las-del-nid06102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-06T21:43:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Após o Parlamento Europeu rejeitar uma medida que ameaçava o biodiesel de soja argentino, as exportações do produto aumentaram significativamente, passando de 50.000 toneladas no primeiro semestre para 220.000 toneladas até o momento atual.", "titulo_pt": "Negócio com Europa se desbloqueou e exportações de biodiesel de soja já são quatro vezes maiores", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 199564, "titulo": "Un tribunal de apelación cancela la vinculación a proceso contra El Jardinero", "url": "https://elpais.com/mexico/2026-10-06/un-tribunal-de-apelacion-cancela-la-vinculacion-a-proceso-contra-el-jardinero.html", "fonte_id": "elpais_america", "data_pub": "2026-10-06T21:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um tribunal de apelación anulou a vinculação a processo contra El Jardinero, que é acusado de usar armas de uso exclusivo do Exército. No entanto, ele ainda enfrenta outros processos judiciais.", "titulo_pt": "Tribunal de apelação revoga vinculação a processo contra El Jardinero", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 199683, "titulo": "US death row inmate Christa Pike conscious and speaking after failed execution, lawyers say", "url": "https://www.bbc.co.uk/news/articles/c8kgezxn54qko?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-06T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Christa Pike, de 50 anos, permanece consciente e falando após um fracasso na execução capital, de acordo com um comunicado dos seus advogados. Ela está recebendo cuidados médicos vitais enquanto manacada em um hospital.", "titulo_pt": "Incorrigível condenada à morte Christa Pike consciente e falando após falha na execução, informam advogados", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 199244, "titulo": "Cuba desmonta caderneta de racionamento após 60 anos de produtos subsidiados", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/10/cuba-desmonta-caderneta-de-racionamento-apos-60-anos-de-produtos-subsidiados.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-10-06T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A caderneta de racionamento que foi usada por décadas em Cuba para a compra de produtos a preços subsidiados está prestes a ser desmontada após 60 anos. Os mercados de bairro estão substituindo gradualmente as mercearias onde a caderneta era utilizada, marcando o fim de um sistema simbólico da revolução de 1959.", "titulo_pt": "Cuba desmonta caderneta de racionamento após 60 anos de produtos subsidiados", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 199694, "titulo": "Former German spy chief detained over suspected treasonous espionage", "url": "https://www.france24.com/en/europe/20261006-former-german-spy-chief-detained-over-suspected-treasonous-espionage", "fonte_id": "france24", "data_pub": "2026-10-06T21:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-chefe da inteligência alemã August Hanning foi detido sob suspeitas de traição e espionagem após ser acusado de pagar por documentos de inteligência secretos e usá-los para preparar um análise para um serviço de inteligência estrangeiro. O caso pode afetar as relações de Berlim com as agências de espionagem aliadas.", "titulo_pt": "Ex-chefe da inteligência alemã detido por suspeita de traição e espionagem", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 199718, "titulo": "CNN, CBS News now under one roof as Paramount-Warner Bros merger closes", "url": "https://www.aljazeera.com/economy/2026/10/6/cnn-cbs-news-now-under-one-roof-as-paramount-warner-bros-merger-closes?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-06T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova empresa combinada é chamada de Skydance e começou a negociar na Bolsa de Valores de Nova York na terça-feira. A fusão entre CNN e CBS News foi concluída.", "titulo_pt": "CNN e CBS News se unem em uma única empresa", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 199546, "titulo": "El Súper Niño, la sequía del milenio y la herramienta creada por una provincia para anticipar lo que viene", "url": "https://www.lanacion.com.ar/sociedad/el-super-nino-la-sequia-del-milenio-y-la-herramienta-creada-por-una-provincia-para-anticipar-lo-que-nid06102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-06T21:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Desenvolvida por cientistas do Ianigla-Conicet, a ferramenta permite monitorar nevadas, precipitações, caudais e eventos extremos, e prevê como o água disponível se comportará em Mendoza.", "titulo_pt": "O super novo, a seca do milênio e a ferramenta criada por uma província para antecipar o futuro", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 199719, "titulo": "US arrests suspect in connection with Tumbler Ridge school shooting", "url": "https://www.aljazeera.com/news/2026/10/6/us-arrests-suspect-in-connection-with-tumbler-ridge-school-shooting?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-06T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um suspeito de Washington, estado ocidental dos Estados Unidos, é acusado de ter dado dinheiro e conselhos ao atacante virtualmente.", "titulo_pt": "Suspeito dos estados unidos é detido em relação ao tiroteio escolar em Tumbler Ridge", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 199686, "titulo": "Watch: Riot police clash with school protesters and use tear gas in France", "url": "https://www.bbc.co.uk/news/videos/cwm26078pkepo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-06T21:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Houve confrontos entre policiais e estudantes de escolas em várias cidades da França, com uso de gás lacrimogênico. Centenas de milhares de pessoas participaram de protestos contra a reforma educacional no país.", "titulo_pt": "Assista: polícias militares entram em conflito com estudantes nas ruas da França", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 199721, "titulo": "Tokyo protests US military presence after Okinawa killing", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/6/tokyo-protests-us-military-presence-after-okinawa-killing?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-06T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos ocorreram fora do Embaixado dos Estados Unidos em Tóquio após um marinheiro dos Estados Unidos ser detido pelo assassinato de uma mulher de 39 anos.", "titulo_pt": "Protestos em tóquio contra presença militar dos EUA após assassinato em Okinawa", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 199752, "titulo": "Christa Pike ha ripreso conoscenza e parla", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/06/christa-pike-ha-ripreso-conoscenza-e-parla_d382c5fa-d2b2-4535-9a37-3a42adda6df7.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-06T21:19:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Christa Pike recuperou a consciência e está conversando. Os advogados consideram o caso um 'sem precedentes'.", "titulo_pt": "Christa Pike recupera consciência e fala; caso é considerado sem precedentes", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 199340, "titulo": "Mulher é presa após “desabafar” com IA planos de tiroteio em massa", "url": "https://veja.abril.com.br/coluna/planeta-ia/mulher-e-presa-apos-desabafar-com-ia-planos-de-tiroteio-em-massa/", "fonte_id": "veja", "data_pub": "2026-10-06T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma usuária do Claude, uma inteligência artificial da Anthropic, relatou ao chatbot que havia comprado uma arma e planejava realizar um tiroteio no gabinete do xerife. A empresa notificou as autoridades sobre o relato.", "titulo_pt": "Mulher é presa após 'desabafar' com IA sobre tiroteio em massa", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 199402, "titulo": "OEA elogia processo eleitoral do Brasil, mas faz alertas para o 2º turno", "url": "https://www.metropoles.com/brasil/oea-elogia-processo-eleitoral-do-brasil-mas-faz-alertas-para-o-2o-turno", "fonte_id": "metropoles", "data_pub": "2026-10-06T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OEA elogiou o processo eleitoral do Brasil após o 1º turno das eleições, mas alertou sobre o clima de tensão e forte polarização política no país.", "titulo_pt": "OEA elogia processo eleitoral do Brasil, mas faz alertas para o 2º turno", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 199438, "titulo": "PGR se manifesta a favor de Bolsonaro receber visita de Flávio", "url": "https://www.cnnbrasil.com.br/politica/pgr-se-manifesta-a-favor-de-bolsonaro-receber-visita-de-flavio/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Paulo Gonet, Procurador-Geral da República, afirmou que não há fatos novos para justificar a manutenção da suspensão da visita de Flávio Bolsonaro ao pai, o presidente Jair Bolsonaro. Não se opô
