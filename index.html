m apoio da indústria fonográfica", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 155217, "titulo": "Agtech argentina direciona decisões de plantio por IA e expande no Brasil", "url": "https://www.cnnbrasil.com.br/agro/agtech-argentina-direciona-decisoes-de-plantio-por-ia-e-expande-no-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-09T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa Calice pode testar sementes em lavouras virtuais antes da próxima safra, utilizando dados de campo para simular o desempenho dos produtos. A companhia projeta que o Brasil e os Estados Unidos serão seus principais mercados em 2027.", "titulo_pt": "Agtech argentina direciona decisões de plantio por IA e expande no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 155219, "titulo": "Will.i.am vê IA como chance de resgatar o lado humano da música", "url": "https://www.cnnbrasil.com.br/pop/musica/will-i-am-ve-ia-como-chance-de-resgatar-o-lado-humano-da-musica/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-09T21:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Will.i.am vê a inteligência artificial como uma oportunidade para resgatar a autenticidade na música. O artista afirma que a perda de autenticidade na indústria musical começou antes da IA, com algoritmos e métricas de reprodução.", "titulo_pt": "Will.I.Am vê IA como chance de resgatar o lado humano da música", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 155635, "titulo": "OpenAI’s sly mathematical breakthrough sends a chill through academia", "url": "https://www.theverge.com/ai-artificial-intelligence/992953/openai-math-millennium-prize-navier-stokes", "fonte_id": "the_verge", "data_pub": "2026-09-09T21:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI anunciou ter resolvido um dos problemas matemáticos mais famosos conhecidos como Millennium Prize Problems. Embora seja uma conquista significativa, o avanço gerou complicações antes mesmo de ser formalmente anunciado, devido à natureza incomum da situação.", "titulo_pt": "Openai's sly mathematical breakthrough sends a chill through academia (o avanço matemático sutil da openai causa frio na espinha na academia)", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 155627, "titulo": "San Francisco Orders Meta to Stop ‘Allowing’ AI Child Abuse Ads", "url": "https://www.wired.com/story/san-francisco-orders-meta-to-stop-allowing-ai-child-abuse-ads/", "fonte_id": "wired", "data_pub": "2026-09-09T21:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Promotoria de São Francisco solicitou que a Meta explique como anúncios prejudiciais envolvendo abuso infantil se repetiram em Facebook e Instagram. A empresa argumenta que os anúncios estão fora do escopo da jurisdição da cidade.", "titulo_pt": "São Francisco require a Meta a esclarecer anúncios prejudiciais a crianças", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 155643, "titulo": "Securities firms' Q2 net spikes 20 pct on increased commission income", "url": "https://en.yna.co.kr/view/AEN20260909007100320", "fonte_id": "yonhap_news", "data_pub": "2026-09-09T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas de corretagem de valores em Coreia do Sul registraram um aumento de 20% nos lucros líquidos no segundo trimestre, impulsionados pela receita de comissões aumentada.", "titulo_pt": "Lucros líquidos das empresas de corretagem de valores na Coreia do sul aumentam 20% no segundo trimestre", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 155636, "titulo": "Read the Apple document explaining how new listening features still protect your privacy", "url": "https://www.theverge.com/tech/992919/apple-siri-ai-audio-intelligence-privacy", "fonte_id": "the_verge", "data_pub": "2026-09-09T20:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apple lançou novas funcionalidades de inteligência artificial da Siri, como Resumo Siri, Retrocesso em Tempo Real, Reconhecimento de Som e Reconhecimento Musical, durante o evento de lançamento do iPhone Duo. A empresa também divulgou um documento explicando como pretende equilibrar a coleta de áudio ambiental pelo AI e a privacidade dos usuários.", "titulo_pt": "Leia o documento da Apple explicando como as novas funcionalidades de escuta da siri ainda protegem a privacidade dos usuários", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 155410, "titulo": "Renuncia de investigador de Anthropic por temor a que la IA esté “fuera de control” aumenta presión por límites a la industria", "url": "https://www.latercera.com/mundo/noticia/renuncia-de-investigador-de-anthropic-por-temor-a-que-la-ia-este-fuera-de-control-aumenta-presion-por-limites-a-la-industria/", "fonte_id": "la_tercera", "data_pub": "2026-09-09T20:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O engenheiro de software britânico Jacob Coxon renunciou ao trabalho na empresa Anthropic por temer que os sistemas de IA possam se tornar descontrolados e potencialmente destrutivos para a humanidade. Sua saída aumenta a pressão para que a indústria estabeleça limites mais rigorosos.", "titulo_pt": "Renúncia de investigador de Anthropic por medo de IA fora de controle aumenta pressão por limites na indústria", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 155071, "titulo": "Apple sobe preços de iPhones após lançamentos e retira três modelos da loja oficial; veja valores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/apple-sobe-precos-de-iphones-apos-lancamentos-e-retira-tres-modelos-da-loja-oficial-veja-valores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-09T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Apple aumentou os preços dos iPhones 16, 17 e 17e na loja oficial após o lançamento dos novos modelos 18 Pro, 18 Pro Max e Duo. Além disso, a empresa retirou três modelos do catálogo disponíveis.", "titulo_pt": "Apple aumenta preços de iphones após lançamentos e retira modelos da loja oficial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 155504, "titulo": "AI is making it harder to trust your own eyes this election", "url": "https://www.axios.com/2026/09/09/ai-political-ads-deepfakes-2026-elections", "fonte_id": "axios", "data_pub": "2026-09-09T20:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A utilização de anúncios de campanha gerados por inteligência artificial está dificultando a confiança dos eleitores em suas próprias percepções. Especialistas em tecnologia política afirmam que essa tendência pode aprofundar a desconfiança já existente em instituições e políticos nos Estados Unidos.", "titulo_pt": "A inteligência artificial está tornando mais difícil confiar nos próprios sentidos nesta eleição", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 155249, "titulo": "AI “could kill us all’’. Quem aperta o botão do pânico?", "url": "https://braziljournal.com/ai-could-kill-us-all-quem-aperta-o-botao-do-panico/", "fonte_id": "brazil_journal", "data_pub": "2026-09-09T19:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jacob Coxon, um pesquisador de IA, trocou a OpenAI pela Anthropic no início do ano, acreditando que a empresa de Dario Amodei era mais responsável. No entanto, após nove meses, ele anunciou que está deixando a indústria.", "titulo_pt": "IA 'poderia nos matar todos'. Quem aperta o botão do pânico?", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 155629, "titulo": "Everything Apple Announced: iPhone Duo, iPhone 18 Pro, Apple Watch, AirPods 5", "url": "https://www.wired.com/story/everything-apple-announced-september-2026/", "fonte_id": "wired", "data_pub": "2026-09-09T19:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple lançou seu primeiro telefone dobrável, novos modelos de iPhone 18 Pro, atualizações para o Apple Watch, novas AirPods e melhorias para o assistente de inteligência artificial Siri.", "titulo_pt": "Tudo que a Apple anunciou: iphone dobrável, iphone 18 Pro, Apple Watch, AirPods 5", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 155630, "titulo": "Apple Doesn’t Want You to Worry About the New Apple Watch’s Listening Features", "url": "https://www.wired.com/story/apple-doesnt-want-you-to-worry-about-the-new-apple-watchs-listening-features/", "fonte_id": "wired", "data_pub": "2026-09-09T19:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O novo Apple Watch possui várias funcionalidades 'inteligentes' que escutam, com proteções de privacidade e segurança incorporadas. No entanto, essas proteções não alteram o fato das ferramentas coletarem áudio.", "titulo_pt": "Apple não quer que você se preocupe com as novas funcionalidades de escuta do Apple Watch", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 155673, "titulo": "Coroner releases details of infants who died amid growing Pennsylvania measles outbreak", "url": "https://www.statnews.com/2026/09/09/coroner-details-infant-deaths-pennsylvania-measles-outbreak/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-09T21:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois bebês morreram em Pennsylvania no mês passado, e o vírus da morbidez foi confirmado como causa de uma das mortes, conforme informou o coroner do estado na sexta-feira.", "titulo_pt": "Coronel divulga detalhes sobre bebês que morreram durante crescimento da epidemia de morbidez em Pennsylvania", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 155235, "titulo": "Restos fossilizados que pertenciam a uma população misteriosa de hominídeos extintos são encontrados na China e revelam a vida de parentes humanos", "url": "https://www.cnnbrasil.com.br/ciencia/restos-fossilizados-que-pertenciam-a-uma-populacao-misteriosa-de-hominideos-extintos-sao-encontrados-na-china-e-revelam-a-vida-de-parentes-humanos/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-09T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Restos fossilizados de um possível membro da população denisovana, um grupo de hominídeos extintos, foram encontrados na China. Essa descoberta inclui quatro dentes, parte de um osso do braço e dois fragmentos de crânio.", "titulo_pt": "Novos fósseis de parentes humanos misteriosos são encontrados na China", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 155703, "titulo": "NASA Adds Relativity Space’s Terran R to Launch Services Contract", "url": "https://www.nasa.gov/news-release/nasa-adds-relativity-spaces-terran-r-to-launch-services-contract/", "fonte_id": "nasa_news", "data_pub": "2026-09-09T20:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA concedeu um contrato de serviços de lançamento (NLS II) à Relativity Space Inc., incluindo o serviço de lançamento do Terran R. Este contrato permitirá que o Terran R seja usado por missões futuras da NASA.", "titulo_pt": "NASA adiciona serviço de lançamento Terran R da Relativity Space ao contrato de serviços de lançamento", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 155699, "titulo": "AI may have solved one of math’s biggest puzzles, raising controversy", "url": "https://www.sciencenews.org/article/ai-math-puzzle-navier-stokes-openai", "fonte_id": "science_news", "data_pub": "2026-09-09T19:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores há décadas se perguntavam se as equações de Navier-Stokes, que descrevem o fluxo de fluidos, podem quebrar. A OpenAI enviou milhares de agentes para investigar o problema, o que gerou controvérsia.", "titulo_pt": "IA pode ter resolvido um dos maiores mistérios da matemática, levantando controvérsia", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 155704, "titulo": "NASA’s Chandra Unveils Mysterious X-Ray Objects", "url": "https://science.nasa.gov/missions/chandra/nasas-chandra-unveils-mysterious-x-ray-objects/", "fonte_id": "nasa_news", "data_pub": "2026-09-09T18:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA's Chandra observou novos objetos em outras galáxias que emitem raios-X de baixa energia e radiação ultravioleta intensa, possivelmente ajudando a responder duas questões astrosfísicas pendentes.", "titulo_pt": "Nasa’s Chandra descobre novos objetos misteriosos", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 154884, "titulo": "Body-related TikTok content linked to self-objectification and mood", "url": "https://phys.org/news/2026-09-body-tiktok-content-linked-objectification.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A visualização de conteúdo 'thinspiration' no TikTok aumenta a auto-objetoificação e piora o humor, enquanto o conteúdo positivo sobre o corpo também aumenta a auto-objetoificação, mas está associado a um humor mais positivo, de acordo com uma nova pesquisa publicada no PLOS One.", "titulo_pt": "Conteúdo relacionado ao corpo no TikTok ligado a auto-objetoificação e humor", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 154885, "titulo": "'Here, There and Everywhere': The Beatles have permeated research papers across academic disciplines", "url": "https://phys.org/news/2026-09-beatles-permeated-papers-academic-disciplines.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 3.000 títulos de artigos científicos de diversas disciplinas utilizaram títulos ou letras de músicas dos Beatles, de acordo com um estudo publicado no PLOS One. Este análise abrange uma ampla gama de campos acadêmicos e demonstra o impacto duradouro dos Beatles na escrita científica.", "titulo_pt": "Aqui, ali e cada lugar: os Beatles permearam o vocabulário científico em diversas disciplinas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 154886, "titulo": "Fossils from embryo to adult suggest how an enigmatic, bird-like troodontid dinosaur grew", "url": "https://phys.org/news/2026-09-fossils-embryo-adult-enigmatic-bird.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos de fósseis de dinossauros troodontídeos mostram como as pernas e ossos pélvicos de uma espécie podem ter evoluído ao longo da vida, do embrião ao adulto, com possíveis implicações para resolver desafios taxonômicos antigos. Os pesquisadores David Varricchio e Heath Caldwell, da Montana State University e da North Carolina State University, respectivamente, publicaram seus resultados no Journal of PLOS One em 9 de setembro de 2026.", "titulo_pt": "Fossis de embrião a adulto revelam o crescimento de um dinossauro troodontídeo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 154887, "titulo": "Asian elephants can resist impulsive behavior, researchers find", "url": "https://phys.org/news/2026-09-asian-elephants-resist-impulsive-behavior.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da CUNY Graduate Center e Hunter College descobriram que os elefantes asiáticos podem suprimir comportamentos impulsivos e ajustar suas ações quando as circunstâncias mudam. Este tipo de cognição pode ajudar a explicar as habilidades sofisticadas de resolução de problemas e o comportamento social dos animais.", "titulo_pt": "Elefantes asiáticos podem resistir a comportamentos impulsivos, encontram os pesquisadores", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 154888, "titulo": "JWST discovers that Chariklo's invisible rings are changing", "url": "https://phys.org/news/2026-09-jwst-chariklo-invisible.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Até há cerca de uma década, os anéis eram considerados exclusivos dos gigantes gasosos do sistema solar, como Júpiter, Saturno, Urano e Netuno. Em 2013, o corpo interestelar Chariklo, com apenas 250 quilômetros de diâmetro, foi descoberto com dois anéis.", "titulo_pt": "JWST descobre que os anéis invisíveis de Chariklo estão mudando", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 154889, "titulo": "Ice Age origins of one of humanity's oldest drug habits discovered", "url": "https://phys.org/news/2026-09-ice-age-humanity-oldest-drug.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de arqueólogos da Universidade Griffith descobriu evidências de que os humanos estavam usando substâncias que alteram a mente muito mais cedo do que se supunha anteriormente.", "titulo_pt": "Origens do idade de gelo das mais antigas hábitos de drogas humanos descobertas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 154928, "titulo": "Bursts of ‘pink noise’ during sleep seem to help clear waste from brain", "url": "https://www.newscientist.com/article/2588451-bursts-of-pink-noise-during-sleep-seem-to-help-flush-waste-from-brain/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O cérebro humano libera resíduos durante o sono, e agora parece que certos sons podem aumentar esse processo. Bursts de 'ruído rosa' durante o sono parecem auxiliar na remoção de resíduos do cérebro.", "titulo_pt": "Bursts de 'ruído rosa' durante o sono parecem ajudar na remoção de resíduos do cérebro", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 154929, "titulo": "Heat spikes over Tibet may help explain severe Californian flooding", "url": "https://www.newscientist.com/article/2588424-heat-spikes-over-tibet-may-be-to-blame-for-catastrophic-californian-flooding/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Temperaturas anormalmente altas na região montanhosa do Tibete podem desencadear uma cadeia de eventos que resultam em intensas chuvas na costa oeste dos Estados Unidos.", "titulo_pt": "Aumento das temperaturas no tibete pode explicar chuvas severas na califórnia", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 154930, "titulo": "Earliest evidence of habitual drug use found in teeth in Indonesia", "url": "https://www.newscientist.com/article/2588277-earliest-evidence-of-habitual-drug-use-found-in-teeth-in-indonesia/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Descobriu-se estranhas e arredondadas grooves em dentes pré-históricos que são supostamente resultado do hábito de sugar betel inteiros para extrair um composto aliviador de dores. Isso marca o mais antigo exemplo conhecido de possivelmente dependência de substâncias.", "titulo_pt": "Menor evidência de uso habitual de drogas encontrada em dentes na indonésia", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 155700, "titulo": "New maps reveal hidden landscapes inside a prehistoric supercontinent", "url": "https://www.scientificamerican.com/article/new-maps-reveal-hidden-landscapes-inside-a-prehistoric-supercontinent/", "fonte_id": "scientific_american", "data_pub": "2026-09-09T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova análise revela paisagens ocultas dentro de um supercontinente pré-histórico chamado Gondwana, que era muito maior do que se pensava.", "titulo_pt": "Novas mapas descobrem paisagens ocultas dentro do supercontinente pré-histórico gondwana", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 154890, "titulo": "Decades-old DNA mystery solved after strands are captured zipping together for the first time", "url": "https://phys.org/news/2026-09-decades-dna-mystery-strands-captured.html", "fonte_id": "phys_org", "data_pub": "2026-09-09T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas capturaram pela primeira vez o momento em que duas moléculas de DNA se unem, revelando um mecanismo que intrigou os cientistas há mais de 20 anos. Usando microscopia de força atômica de alta resolução, os pesquisadores da Universidade de Sheffield e da Universidade de York visualizaram diretamente a união de duas hélices de DNA duplas.", "titulo_pt": "Mistério antigo sobre DNA resolvido após moléculas serem capturadas se unindo pela primeira vez", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 154812, "titulo": "Documentary explores the experiences of Taiwanese WWII prisoners of war", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/10/2003864012", "fonte_id": "taipei_times", "data_pub": "2026-09-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O documentário explora as experiências dos prisioneiros de guerra taiwaneses durante a Segunda Guerra Mundial. O filme aborda as histórias e os desafios enfrentados pelos prisioneiros durante esse período.", "titulo_pt": "Documentário explora as experiências dos prisioneiros de guerra taiwaneses durante a segunda guerra mundial", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 154813, "titulo": "Taiwan and the UK sign literature translator deal", "url": "https:// nline/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/operacao-resgata-479-trabalhadores-em-condicoes-analogas-a-escravidao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-09T14:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em agosto, uma operação liderada pelo Ministério do Trabalho e Emprego resgatou 479 trabalhadores em condições análogas à escravidão em todo o país. Os empregadores devem pagar R$ 3,49 milhões em verbas rescisórias.", "titulo_pt": "Operação resgata 479 trabalhadores em condições análogas à escravidão", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 154818, "titulo": "Volunteers go to shoal to protect it from erosion", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/10/2003864018", "fonte_id": "taipei_times", "data_pub": "2026-09-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Voluntários estão sendo enviados para uma ilha para proteger o local da erosão. A ação visa preservar a ilha e combater a degradação causada pela erosão costeira.", "titulo_pt": "Voluntários vão à ilha para proteger do desgaste", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 155119, "titulo": "Nepal recorre a drones para enviar ajuda humanitária a vítimas de inundações", "url": "https://veja.abril.com.br/mundo/nepal-recorre-a-drones-para-enviar-ajuda-humanitaria-a-vitimas-de-inundacoes/", "fonte_id": "veja", "data_pub": "2026-09-09T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nepal está utilizando drones para distribuir alimentos, medicamentos e outros itens essenciais a comunidades isoladas afetadas por inundações. O Exército está a frente dessa operação humanitária.", "titulo_pt": "Nepal recorre a drones para enviar ajuda humanitária a vítimas de inundações", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 155559, "titulo": "US records hottest summer in 132 years", "url": "https://www.aljazeera.com/news/2026/9/9/us-records-hottest-summer-in-132-years?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-09T18:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Meteorologia dos EUA registrou o verão mais quente do país desde que começaram a coletar dados, em 132 anos. Além disso, o mês de agosto também bateu um novo recorde de calor.", "titulo_pt": "EUA registram verão mais quente em 132 anos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 155193, "titulo": "Eucatex incorpora risco climático à estratégia e investe R$ 410 milhões em expansão florestal", "url": "https://exame.com/esg/eucatex-incorpora-risco-climatico-a-estrategia-e-investe-r-410-milhoes-em-expansao-florestal/", "fonte_id": "exame", "data_pub": "2026-09-09T18:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Eucatex incorporou o risco climático em sua estratégia e investiu R$ 410 milhões em expansão florestal. O relatório de sustentabilidade da empresa destaca a criação de um grupo de trabalho climático, o desenvolvimento de eucaliptos mais resistentes e o avanço em bioenergia e conservação.", "titulo_pt": "Eucatex incorpora risco climático à estratégia e investe R$ 410 milhões em expansão florestal", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 154261, "titulo": "1 em cada 5 carros vendidos no Brasil já é elétrico ou híbrido, diz ABVE", "url": "https://www.cnnbrasil.com.br/auto/1-em-cada-5-carros-vendidos-no-brasil-ja-e-eletrico-ou-hibrido-diz-abve/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-09T17:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em agosto, 57,3 mil veículos elétricos e híbridos foram emplacados no Brasil, representando 22% das vendas de carros leves no país.", "titulo_pt": "1 Em cada 5 carros vendidos no Brasil já é elétrico ou híbrido, segundo ABVE", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 154332, "titulo": "California crea un nuevo consejo ambiental: jóvenes desde los 14 años podrán participar en decisiones del estado", "url": "https://www.clarin.com/estados-unidos/california-crea-nuevo-consejo-ambiental-jovenes-14-anos-podran-participar-decisiones-estado_0_c5VbArQfMW.html", "fonte_id": "clarin", "data_pub": "2026-09-09T17:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O estado da Califórnia criou um novo conselho ambiental composto por jovens entre 14 e 20 anos que poderão participar das decisões da Agência de Proteção Ambiental. Não é necessário experiência prévia em questões ambientais para se inscrever.", "titulo_pt": "Califórnia cria novo conselho ambiental com jovens a partir de 14 anos", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 154572, "titulo": "United States had warmest summer on record", "url": "https://www.lemonde.fr/en/environment/article/2026/09/09/united-states-had-warmest-summer-on-record_6757354_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-09T16:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com a NOAA, o verão nos Estados Unidos foi o mais quente da história, com uma temperatura média de 23,6°C entre junho e agosto, superando os registros de 1936 e 2021.", "titulo_pt": "Verão dos EUA foi o mais quente da história", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 154743, "titulo": "Indonesia’s wildfire emissions surge to world’s highest, data shows", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3366962/indonesias-wildfire-emissions-surge-worlds-highest-data-shows?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-09T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia está enfrentando uma elevação nos lançamentos de gases de efeito estufa devido a incêndios florestais que estão queimando florestas e áreas de turfa nas ilhas de Borneu                 const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
