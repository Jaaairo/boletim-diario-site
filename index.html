<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "28/07/2026 09:16", "stats": {"noticias_novas": 861, "resumos_gerados": 245}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Na disputa presidencial no estado do Rio de Janeiro, Flávio Bolsonaro lidera com 46% das intenções de voto contra 42% para Lula, segundo uma pesquisa realizada entre os dias 23 e 27 de julho. Em Minas Gerais, o governador Romeu Zema tem 45% dos votos contra 39% do ex-prefeito João Campos (PSB). Já em Pernambuco, Raquel Lyra mantém sua popularidade com 68% de aprovação e 23% de desaprovação. No Senado em Pernambuco, Marília Arraes (PDT) lidera a corrida com 19% das intenções de voto, seguida por Humberto Costa (PT) com 12%. No cenário do Senado em Minas Gerais, Marília Campos (PT) e Aécio Neves (PSDB) são os favoritos com 18% e 16%, respectivamente.", "mundo": "Um incêndio devastador atinge as vinhas de Bordeaux na França, agravando os problemas enfrentados pela indústria vitivinícola francesa. Paralelamente, um terremoto de magnitude 7,1 no Japão causa danos materiais e interrompe o trânsito local, com relatos iniciais de vítimas. O presidente ucraniano Zelensky se reuniu com Trump em Washington para discutir a defesa antiaérea do país contra os ataques russos. Em outro desenvolvimento, o governo italiano é criticado por ovespa caindo 11% em um único dia e reacendendo temores sobre uma bolha na indústria de inteligência artificial. O governo brasileiro acionou a Organização Mundial do Comércio (OMC) contra novas tarifas impostas pelos Estados Unidos, que podem aumentar as tarifas sobre parte das exportações brasileiras para 37,5%. Em outro desenvolvimento econômico, o Grupo Joom lançará o JoomAI, uma ferramenta de inteligência artificial para vendedores de marketplaces, no Brasil como primeiro mercado. Além disso, a LW Soluções Metálicas investiu R$ 14 milhões em uma nova sede no Rio Grande do Sul, enquanto a Johnson & Johnson concordou em pagar até US$ 5,5 bilhões para encerrar todas as ações judiciais relacionadas ao uso de talco da empresa que alegam causar câncer de ovário.", "tecnologia": "As notícias da tecnologia desta edição abrangem diversos aspectos do setor, desde startups até grandes corporações. A startup Anthropic e OpenAI estão atraindo investimentos significativos, com suas receitas crescendo rapidamente e superando marcas como Starbucks e McDonald's. Estima-se uma receita anual de cerca de 120 bilhões de dólares. No entanto, o avanço tecnológico vem acompanhado de desafios, como a questão da eficiência energética dos centros de dados. A ONU incentiva o uso de energia renovável, mas enfrenta a crescente tensão do uso de combustíveis fósseis. Além disso, as startups e empresas estão enfrentando novos desafios legais, como no caso do New York Times que processou OpenAI e Microsoft por supostas violações de direitos autorais.", "ciencia": "Um estudo recente mostrou que evitar comer quatro horas antes de dormir pode beneficiar o cérebro, sugerindo uma mudança nas rotinas alimentares noturnas. Além disso, um programa de prevenção ao uso de substâncias em escolares e suas famílias resultou em benefícios que se estenderam até a idade adulta, com os efeitos sendo transmitidos para as crianças dos participantes. Em outro desenvolvimento científico, a ProMIS Neurosciences está avançando com um medicamento para clarear a amilóide no tratamento da Alzheimer's, com resultados preliminares indicando que o caminho para uma terapia mais segura pode estar sendo trilhado. Estes avanços na ciência abrangem desde a melhoria do sono até a busca por novas terapias para doenças neurodegenerativas.", "cultura": "A Turquia será o anfitrião do encontro da Comissão do Patrimônio Mundial da UNESCO no próximo ano, com a reunião marcada para ocorrer em Istambul. Outro destaque cultural é a abertura da 50ª Mostra Internacional de Cinema de São Paulo pelo filme 'Paper Tiger', dirigido por James Gray, que acontecerá entre os dias 14 e 31 de outubro. O evento também contará com apresentações, como o show do cantor Jão em seu espetáculo 'Memórias Póstumas', no Nubank Parque em São Paulo, marcado para o dia 25 de setembro.", "sociedade": "Um pesquisador da Universidade de São Paulo (USP) foi condenado por estupro que resultou na morte de uma estudante, levando a um julgamento no dia 28 de março. O caso ocorreu em um alojamento estudantil e a vítima faleceu devido a uma infecção generalizada após o abuso sexual. Além disso, jovens vulneráveis que estão afastados da família enfrentam dificuldades quando deixam os abrigos, pois o Estado frequentemente não oferece suporte adequado após eles completarem 18 anos. A Agência Nacional de Vigilância Sanitária (Anvisa) autorizou a venda livre de dez medicamentos que anteriormente exigiam receita médica, após cinco anos no mercado sem relatos de efeitos adversos graves. Estes medicamentos são de administração oral, oftálmica ou tópica. O consumo de tabaco no Brasil aumentou, levantando dúvidas sobre a eficácia das políticas públicas nesse campo. Finalmente, um carabinero morreu após ser atingido por um disparo ocorrido durante a entrega de armamento na 6ª Comisaría Las Compañías, em La Serena, Chile, com a Fiscalía Militar responsável pela investigação das circunstâncias do incidente.", "meio_ambiente": "Um bloco de ar antártico está trazendo temperaturas baixas para a Patagônia, com possibilidade de chegar a -20°C e afetar outras regiões do país. Incêndios florestais na França e Espanha estão queimando quase 300 mil hectares, e medidas de proteção foram tomadas em instalações industriais próximas aos focos de fogo no sul da França.", "direitos_humanos": "Três pessoas morreram no centro de detenção de Texas, Camp East Montana, desde que ele abriu no ano passado. A ICE estendeu o aluguel deste centro, onde mais de cem rohingyas buscavam asilo e foram detidos pela polícia malaysiana após serem expulsos de um acampamento em Penang. Em outro evento, sessenta palestinos libertados por Israel relataram abusos sofridos durante a detenção, incluindo a presença de pessoas com deficiência em cadeiras de rodas. Na Malásia, mais de cem rohingyas foram detidos pela autoridade malaysiana após serem expulsos de um acampamento em Penang, num contexto de crescente hostilidade pública em relação aos refugiados rohingyas. Além disso, Bernarda Vera foi confirmada como viva através de exame de DNA e o candidato Kast propôs testes de drogas para autoridades, enquanto a procuradoria acusou dois ex-funcionários da Conaf por um alerta tardio em um grande incêndio que resultou em 138 mortos."}, "resumo_do_dia": {"politica_nacional": [{"id": 76532, "titulo": "Real Time no RJ: Flávio tem 46% e Lula, 42% no 2º turno", "url": "https://www.cnnbrasil.com.br/eleicoes/real-time-rj-flavio-tem-46-e-lula-42-das-intencoes-de-voto-no-2o-turno/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-28T11:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa realizada entre os dias 23 e 27 de julho entrevistou 2.000 pessoas no Rio de Janeiro, indicando que Flávio tem 46% das intenções de voto no segundo turno e Lula tem 42%. A margem de erro é de 2 pontos percentuais para mais ou menos e o índice de confiança é de 95%.", "titulo_pt": "Real Time no RJ: flávio tem 46% e Lula, 42% no 2º turno", "veiculo": "CN /2026/noticia/2026/07/28/quaest-pe-governador-julho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-28T10:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest divulgada nesta terça-feira (28) mostrou que Raquel Lyra tem 43% das intenções de voto para o governo de Pernambuco, enquanto João Campos tem 37%. A aprovação da governadora Raquel Lyra subiu de 62% para 68% em comparação com a última pesquisa realizada em abril.", "titulo_pt": "Raquel Lyra lidera com 43%, João Campos tem 37% no 1º turno em pesquisa quaest", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 76542, "titulo": "Quaest: Raquel Lyra tem 45% e João Campos, 39% no 2º turno em Pernambuco", "url": "https://www.cnnbrasil.com.br/eleicoes/quaest-raquel-lyra-tem-45-e-joao-campos-39-no-2o-turno-em-pernambuco/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-28T10:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na segunda volta das eleições no estado de Pernambuco, Raquel Lyra lidera com 45% dos votos contra 39% de João Campos. No primeiro turno, Raquel Lyra obteve 43% dos votos enquanto João Campos teve 37%.", "titulo_pt": "Raquel Lyra tem 45% e João Campos, 39% no segundo turno em Pernambuco", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 76465, "titulo": "Quaest em MG: Cleitinho aparece à frente, seguido por Kalil, Patrus e Simões", "url": "https://g1.globo.com/mg/minas-gerais/eleicoes/2026/noticia/2026/07/28/quaest-mg-governador-julho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-28T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest divulgada em Minas Gerais indica que Cleitinho Azevedo lidera com 35% das intenções de voto, seguido por Alexandre Kalil (15%), Patrus Ananias (13%) e Mateus Simões (9%).", "titulo_pt": "Quaest em MG: cleitinho na frente, seguido por Kalil, Patrus e Simões", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 76479, "titulo": "Senador e cientista político estão entre cotados para vice de Zema", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/senador-e-cientista-politico-estao-entre-cotados-para-vice-de-zema.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Eduardo Girão (Novo-CE) e o cientista político Luiz Felipe D'Ávila (Novo-SP) são considerados os principais candidatos do partido Novo para a posição de vice-governador ao lado de Romeu Zema no estado.", "titulo_pt": "Senador e cientista político são cotados como vice de Zema", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 76674, "titulo": "Trump, Suprema Corte e o fim das agências independentes", "url": "https://www.jota.info/opiniao-e-analise/artigos/trump-suprema-corte-e-o-fim-das-agencias-independentes", "fonte_id": "jota", "data_pub": "2026-07-28T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Se a mudança de orientação política traz instabilidades ao contexto americano, movimentos parecem paradoxais para o leitor brasileiro.", "titulo_pt": "Trump, Suprema Corte e o fim das agências independentes", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 76491, "titulo": "Terremoto de 7,1 atinge Japão e aciona alerta de tsunami", "url": "https://www.poder360.com.br/poder-internacional/terremoto-de-71-atinge-japao-e-aciona-alerta-de-tsunami/", "fonte_id": "poder360", "data_pub": "2026-07-28T11:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 7,1 atingiu o Japão e acionou um alerta de tsunami. A primeira-ministra instalou o gabinete de crise após o tremor em Kumamoto.", "titulo_pt": "Terremoto de 7,1 atinge Japão e aciona alerta de tsunami", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 76758, "titulo": "Fire Raging Near Bordeaux Brings More Bad News for Its Vineyards", "url": "https://www.nytimes.com/2026/07/28/world/europe/bordeaux-wine-fires-smoke.html", "fonte_id": "nyt_world", "data_pub": "2026-07-28T11:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um dos maiores incêndios na história recente da França está ativo perto das vinhas de Bordeaux. Este é apenas o último problema para a indústria vitivinícola francesa, que já enfrenta dificuldades.", "titulo_pt": "Incêndio em grande escala perto de Bordeaux traz mais problemas para a indústria vitivinícola francesa", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 76521, "titulo": "Terremoto no Japão causa falta de energia e interrompe transporte", "url": "https://agenciabrasil.ebc.com.br/internacional/noticia/2026-07/terremoto-no-japao-causa-falta-de-energia-e-interrompe-transporte", "fonte_id": "agencia_brasil_intl", "data_pub": "2026-07-28T11:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 7,1 atingiu a província de Kumamoto no Sul do Japão, causando falta de energia elétrica e interrupção no trânsito. A primeira-ministra Sanae Takaichi informou que há vítimas e danos materiais, mas as informações ainda estão sendo avaliadas.", "titulo_pt": "Terremoto no sul do Japão causa falta de energia e interrompe transporte", "veiculo": "Agência Brasil - Internacional", "pais": "Brasil", "classe": "A"}, {"id": 76756, "titulo": "Live Updates: 6.8-Magnitude Earthquake Strikes Japan", "url": "https://www.nytimes.com/live/2026/07/28/world/japan-earthquake-kumamoto-tsunami", "fonte_id": "nyt_world", "data_pub": "2026-07-28T11:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram relatados incêndios e feridos após o terremoto de magnitude 6,8 na prefectura de Kumamoto, no sul da ilha de Kyushu. O alerta para tsunami foi levantado.", "titulo_pt": "Atualizações em tempo real: terremoto de magnitude 6,8 atinge Japão", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 77038, "titulo": "Sisma in Giappone, esplosione in un centro commerciale, persone intrappolate", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/28/sisma-in-giappone-esplosione-in-un-centro-commerciale-persone-intrappolate_2cf8159e-f9a0-4e48-a1df-72dcfc414f2d.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-28T11:01:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Houve um terremoto no Japão e uma explosão em um centro comercial Aeon Mall em Kumamoto. Há pessoas presas nas estruturas afetadas.", "titulo_pt": "Sismo no Japão, explosão em shopping, pessoas intrappulcadas", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 77039, "titulo": "Ue, 'sui fondi Safe l'Italia chiarisca, non c'è tempo da perdere", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/28/ue-sui-fondi-safe-litalia-chiarisca-non-ce-tempo-da-perdere_0818dfa4-d170-4894-b209-0ba808e1908f.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-28T11:01:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Itália foi informada que os fundos Safe estão disponíveis, mas ainda não há tempo para assinar os empréstimos. O anúncio de hoje é considerado positivo.", "titulo_pt": "Ue: fundos Safe da Itália devem esclarecer, não se tem tempo a perder", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 76903, "titulo": "'Trump Needs a Way Out of This War': General Yakovlev explains 'charade' over US-Iran negotiations", "url": "https://www.france24.com/en/trump-needs-a-way-out-of-this-war-general-yakovlev-explains-charade-over-us-iran-negotiations", "fonte_id": "france24", "data_pub": "2026-07-28T10:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O general Michel Yakovleff, professor da Sciences-Po e ex-sub-chefe de staff do SHAPE (Supremo Quartel General Aliado das Forças Europeias), explica que a pausa na tensão entre Estados Unidos e Irã não é sinal de progresso diplomático, mas sim de limitações estruturais. Ele argumenta que os pausas nas hostilidades são resultado de pressões políticas, logística militar e restrições industriais.", "titulo_pt": "Trump precisa sair desse conflito: general yakovleff explica a 'farsa' das negociações entre EUA e Irã", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 76610, "titulo": "Genial/Quaest: Lula lidera com folga a corrida presidencial em PE", "url": "https://www.metropoles.com/brasil/genial-quaest-lula-lidera-com-folga-a-corrida-presidencial-em-pe", "fonte_id": "metropoles", "data_pub": "2026-07-28T10:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No primeiro turno da corrida presidencial em Pernambuco, 55% dos eleitores pretendem votar no petista Lula, contra 21% para Flávio Bolsonaro.", "titulo_pt": "Lula lidera com folga a corrida presidencial em pernambuco", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 77040, "titulo": "Assalti ai cantieri Tav, la procura chiede il carcere per due fermati", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/28/assalti-ai-cantieri-tav-la-procura-chiede-il-carcere-per-due-fermati_5784d607-317f-4af9-a9d8-e12d74e83a26.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-28T10:53:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Dois trabalhadores de 20 anos, de origem alemã, foram detidos em conexão com assaltos em obras da TAV. A promotoria pediu prisão preventiva para eles.", "titulo_pt": "Assaltos em obras Tav: promotoria solicita prisão preventiva para dois detidos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 76928, "titulo": "West Bank plagued by terrorism from Israeli settlers", "url": "https://www.lemonde.fr/en/opinion/article/2026/07/28/west-bank-faces-terrorism-from-israeli-settlers_6755919_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-28T10:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vítimas recentes de ataques armados por colonos israelenses em uma vila palestina perto de Nablus, relatadas em 24 de julho, reforçam a realidade de que a expansão dos assentamentos israelenses leva à escalada da violência. Sem pressão internacional forte, nada mudará.", "titulo_pt": "Cisjordânia assolada por terrorismo de colonos israelenses", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 76760, "titulo": "Fresh Clashes Erupt in Pakistani Kashmir on First Day of Contested Vote", "url": "https://www.nytimes.com/2026/07/28/world/asia/pakistan-kashmir-election-violence.html", "fonte_id": "nyt_world", "data_pub": "2026-07-28T10:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Múltiplos confrontos ocorreram no primeiro dia de uma eleição regional contendeda em Kashmir do Paquistão, resultando em mortes. Uma organização civil proibida relatou que apoiadores morreram durante conflitos com a polícia.", "titulo_pt": "Novos conflitos eclodem em caxemira do paquistão no primeiro dia de eleição contendeda", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 76879, "titulo": "Zelensky to press Trump on air defences while in Washington", "url": "https://www.bbc.co.uk/news/articles/c9v4g7e047zo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-28T10:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder ucraniano pretende fortalecer as promessas dos Estados Unidos de reforçar a defesa antiaérea do Kiev, enquanto está em Washington. A Rússia tem intensificado ataques letais contra a Ucrânia.", "titulo_pt": "Zelensky pressionará Trump sobre defesas aéreas durante visita a Washington", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 77041, "titulo": "Bonelli e Fratoianni, 'follia' ipotizzare nuove spese per le armi", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/28/bonelli-e-fratoianni-follia-ipotizzare-nuove-spese-per-le-armi_2de13e7e-d42a-47ed-90da-a2320f30e17a.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-28T10:41:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Exponentes do Avs e da Esquerda italiana criticam o governo por especular sobre novas despesas para armamentos.", "titulo_pt": "Bonelli e Fratoianni criticam governo por especular sobre novas despesas para armamento", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 76580, "titulo": "Governo Lula aciona OMC contra novas tarifas impostas pelos EUA", "url": "https://www.congressoemfoco.com.br/noticia/120812/governo-lula-aciona-omc-contra-novas-tarifas-impostas-pelos-eua", "fonte_id": "congresso_em_foco", "data_pub": "2026-07-28T10:19:00Z", "idioma": "pt", "provavel_duplicata_de": 76557, "texto_pt": "O governo Lula apresentou uma contestação à Organização Mundial do Comércio contra sobretaxas de 25% e 12,5% impostas pelos EUA. Os produtos brasileiros estão sujeitos a uma cobrança total acumulada de 37,5%.", "titulo_pt": "Governo Lula contesta na OMC sobre novas tarifas dos EUA", "veiculo": "Congresso em Foco", "pais": "Brasil", "classe": "B"}, {"id": 76814, "titulo": "Encuentro virtual, presentaciones y despliegue en regiones: Martínez y Yeomans retoman campaña por la presidencia del FA", "url": "https://www.latercera.com/politica/noticia/encuentro-virtual-presentaciones-y-despliegue-en-regiones-martinez-y-yeomans-retoman-campana-por-la-presidencia-del-fa/", "fonte_id": "la_tercera", "data_pub": "2026-07-28T10:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Depois de focar nos esforços emergenciais, as duas candidatas retomaram suas atividades campanha para as eleições do FA previstas para os dias 15 e 16 de agosto.", "titulo_pt": "Encontro virtual, apresentações e desdobramento nas regiões: martínez e Yeomans reativam campanha pelo comando do FA", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 77084, "titulo": "Israel expands ‘yellow line’ military zone, pushing Gazans away from home", "url": "https://www.scmp.com/news/world/middle-east/article/3362135/israel-expands-yellow-line-military-zone-pushing-gazans-away-home?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-28T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O residente palestiniano Assem Dawla carregava colchões e malas para um caminhão perto de uma estrada no distrito Zeitoun da Cidade Gaza, enquanto blocos de concreto amarelos marcavam o limite do novo zoneamento militar israelense. Este é o sétimo ou oitavo movimento obrigatório que ele e sua família tiveram que fazer desde o início da guerra, devido às ordens de evacuação israelenses e ao avanço da chamada linha amarela pelos residentes.", "titulo_pt": "Israel amplia zona militar 'amarela', forçando gazzitas a se mudarem", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 76535, "titulo": "Johnson & Johnson vai pagar até US$ 5,5 bi para encerrar ações sobre talco", "url": "https://www.cnnbrasil.com.br/economia/negocios/johnson-johnson-vai-pagar-ate-us-55-bi-para-encerrar-acoes-sobre-talco/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-28T10:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Johnson & Johnson concordou em pagar até US$ 5,5 bilhões para encerrar todas as ações judiciais relacionadas ao uso de talco da empresa que alegavam causar câncer de ovário.", "titulo_pt": "Johnson & Johnson vai pagar até US$ 5,5 bi para encerrar processos sobre talco", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 76538, "titulo": "Bolsas da Ásia despencam com pressão de techs; Kospi tomba quase 11%", "url": "https://www.cnnbrasil.com.br/economia/mercado/bolsas-da-asia-despencam-com-pressao-de-techs-kospi-tomba-quase-11/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-28T10:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As bolsas asiáticas, especialmente a da Coreia do Sul, sofreram fortes quedas, com o Kospi caindo quase 11%, devido à forte liquidação de ações de fabricantes de chips.", "titulo_pt": "Bolsas asiáticas despencam com forte queda no Kospi", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 76487, "titulo": "Gastos com apostas online no Rio chegam a R$ 2,2 bilhões anualmente", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/gastos-com-apostas-online-no-rio-chegam-r-22-bilhoes-anualmente", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-28T10:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O levantamento realizado pelo Instituto Fecomércio de Pesquisas e Análises indica que R$ 2,2 bilhões são gastos anualmente com apostas online na região metropolitana do Rio de Janeiro. Este montante é superior à movimentação financeira estimada para as compras de Natal no estado.", "titulo_pt": "Gastos com apostas online no Rio chegam a R$ 2,2 bilhões anualmente", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 76488, "titulo": "Beneficiários com NIS de final 7 recebem Bolsa Família de julho", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/beneficiarios-com-nis-de-final-7-recebem-bolsa-familia-de-julho", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-28T10:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Caixa Econômica Federal efetua o pagamento do Bolsa Família de julho aos beneficiários com NIS final 6 nesta segunda-feira (27). O valor médio do benefício é de R$ 679,19. Além disso, 175 municípios de seis estados receberam antecipadamente o crédito em 20 de julho, devido a situações de emergência ou calamidade pública.", "titulo_pt": "Beneficiários com NIS final 6 recebem Bolsa Família de julho", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 76433, "titulo": "LW Soluções Metálicas investe em nova sede no Rio Grande do Sul", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/07/lw-solucoes-metalicas-investe-em-nova-sede-no-rio-grande-do-sul.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-28T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A LW Soluções Metálicas comprou uma área de 20 mil metros quadrados em Rio Grande, RS, para construir sua nova sede industrial. O investimento previsto é de R$ 14 milhões, destinado a obras civis, ampliação da estrutura produtiva e aquisição de equipamentos.", "titulo_pt": "LW Soluções Metálicas adquire novo espaço em Rio Grande do Sul para sua sede industrial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 76545, "titulo": "Rastreabilidade unificada pode abrir mercados para soja e carne brasileiras", "url": "https://www.cnnbrasil.com.br/agro/rastreabilidade-unificada-pode-abrir-mercados-para-soja-e-carne-brasileiras/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-28T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa do WRI Brasil propõe um protocolo unificado de rastreabilidade para melhorar a competitividade das exportações brasileiras de soja e carne, atendendo às exigências dos mercados chines e europeu.", "titulo_pt": "Unificação do protocolo de rastreabilidade pode expandir mercados para soja e carne brasileiras", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 76632, "titulo": "Johnson & Johnson oferece R$ 28 bilhões para encerrar processos que ligam uso de talco a câncer", "url": "https://www.bbc.com/portuguese/articles/cp30q77ggn8o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-28T09:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Johnson & Johnson ofereceu 28 bilhões de reais para encerrar processos judiciais que relacionam o uso do talco aos casos de câncer. O acordo visa pôr fim a uma disputa judicial prolongada sobre as alegações de que os produtos de talco da empresa podem causar câncer.", "titulo_pt": "Johnson & Johnson oferece R$ 28 bilhões para encerrar processos relacionados ao uso de talco e câncer", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 77106, "titulo": "S. Korea's 1st investment project in U.S. said to be power plant", "url": "https://en.yna.co.kr/view/AEN20260728011600320", "fonte_id": "yonhap_news", "data_pub": "2026-07-28T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seoul, 28 de julho (Yonhap) -- A Coreia do Sul está lançando seu primeiro projeto de investimento nos Estados Unidos, que envolve uma usina elétrica.", "titulo_pt": "Coreia do sul anuncia seu primeiro investimento nos EUA em usina elétrica", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 76557, "titulo": "Governo aciona OMC contra novas tarifas impostas pelos EUA", "url": "https://exame.com/brasil/governo-aciona-omc-contra-novas-tarifas-impostas-pelos-eua/", "fonte_id": "exame", "data_pub": "2026-07-28T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo brasileiro acionou a OMC para contestar duas sobretaxas impostas pelos EUA, que podem aumentar as tarifas sobre parte das exportações brasileiras para 37,5%. A medida visa questionar as novas tarifas anunciadas pelo governo Trump.", "titulo_pt": "Governo brasileiro aciona OMC contra sobretaxas impostas pelos EUA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 76558, "titulo": "Bolsa da Coreia do Sul vira 'termômetro de IA' para Wall Street", "url": "https://exame.com/invest/mercados/bolsa-da-coreia-do-sul-vira-termometro-de-ia-para-wall-street/", "fonte_id": "exame", "data_pub": "2026-07-28T07:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A bolsa da Coreia do Sul está se tornando um indicador para ações de tecnologia dos Estados Unidos, com empresas como Samsung e SK Hynix representando uma grande parte do índice Kospi. Isso estreita o relacionamento entre os mercados asiáticos e norte-americanos em termos de tecnologia.", "titulo_pt": "Bolsa da Coreia do Sul se torna 'termômetro de IA' para Wall Street", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 76677, "titulo": "Você tem certeza de que sua empresa está enquadrada no Lucro Presumido?", "url": "https://www.jota.info/coberturas-especiais/pulso-da-reforma/voce-tem-certeza-de-que-sua-empresa-esta-enquadrada-no-lucro-presumido", "fonte_id": "jota", "data_pub": "2026-07-28T07:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O contexto fiscal desaconselha o otimismo sobre a utilização do Lucro Presumido como forma de tributação para empresas. O texto sugere cautela diante das mudanças na legislação fiscal.", "titulo_pt": "Você tem certeza de que sua empresa está enquadrada no Lucro Presumido?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 77113, "titulo": "S. Korean won gains despite foreign selloff of local stocks", "url": "https://en.yna.co.kr/view/AEN20260728009800320", "fonte_id": "yonhap_news", "data_pub": "2026-07-28T07:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano se fortaleceu contra o dólar americano, apesar da venda internacional de ações locais.", "titulo_pt": "Won sul-coreano fortalece-se contra o dólar apesar da venda de ações locais por estrangeiros", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 76435, "titulo": "Falta de correção monetária em plano socioambiental de R$ 500 mi de Belo Monte opõe Aneel e MPF", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/falta-de-correcao-monetaria-em-plano-socioambiental-de-r-500-mi-de-belo-monte-opoe-aneel-e-mpf.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O plano socioambiental de R$ 500 milhões para a usina Belo Monte corre o risco de se tornar um novo ponto de conflito judicial, devido à falta de correção monetária. Este plano foi criado em 2009 para financiar ações compensatórias nos municípios afetados pela construção da usina no Pará.", "titulo_pt": "Falta de correção monetária ameaça plano socioambiental de R$ 500 mi de Belo Monte", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 76438, "titulo": "Governo decide distribuição do lucro do FGTS nesta terça (28); veja quem recebe e quando o valor será pago", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/governo-decide-distribuicao-do-lucro-do-fgts-nesta-terca-28-veja-quem-recebe-e-quando-o-valor-sera-pago.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Curador do FGTS se reúne nesta terça-feira (28) para decidir sobre a distribuição do lucro do Fundo de Garantia. O percentual a ser pago aos trabalhadores e a data do depósito serão definidos no encontro, presidido pelo ministro Luiz Marinho, do MTE.", "titulo_pt": "Governo decide distribuição do lucro do FGTS nesta terça (28); veja quem recebe e quando o valor será pago", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 76565, "titulo": "Bolsa da Coreia cai 11% e reacende temor de bolha de IA no mundo", "url": "https://exame.com/invest/mercados/bolsa-da-coreia-cai-11-e-reacende-temor-de-bolha-de-ia-no-mundo/", "fonte_id": "exame", "data_pub": "2026-07-28T06:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A bolsa da Coreia do Sul caiu 11%, atingindo o menor nível desde abril, devido a uma forte queda nas ações das empresas Samsung e SK Hynix, que caíram mais de 13%.", "titulo_pt": "Bolsa da Coreia cai 11% e reacende temor de bolha de IA no mundo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 76568, "titulo": "Esta construtora do Paraná quer dobrar de tamanho com obras para o agro e faturar R$ 40 milhões", "url": "https://exame.com/negocios/esta-construtora-do-parana-quer-dobrar-de-tamanho-com-obras-para-o-agro-e-faturar-r-40-milhoes/", "fonte_id": "exame", "data_pub": "2026-07-28T06:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A construtora paranaense, fundada em 2018, está consolidando sua atuação no mercado B2B e planeja dobrar seu tamanho através de novos contratos. O objetivo é faturar R$ 40 milhões.", "titulo_pt": "Esta construtora do Paraná quer dobrar de tamanho com obras para o agro e faturar R$ 40 milhões", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 77148, "titulo": "A Two-Person Startup Has Fixed One of the Most Hated Sounds in Modern Life", "url": "https://www.wired.com/story/a-two-person-startup-has-fixed-one-of-the-most-hated-sounds-in-modern-life/", "fonte_id": "wired", "data_pub": "2026-07-28T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma startup com apenas duas pessoas resolveu um dos sons mais odiados na vida moderna. O som de alerta característico é descrito repetidamente como 'Beeeep. Beeeep. Beeeeeeeeeeeeeeeep.'", "titulo_pt": "Duas pessoas criaram uma solução para um dos sons mais odiados da vida moderna", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 77103, "titulo": "(2nd LD) Brief alert issued after U.S. military reports low-risk white phosphorus leak at air base", "url": "https://en.yna.co.kr/view/AEN20260728011752315", "fonte_id": "yonhap_news", "data_pub": "2026-07-28T10:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um breve alerta de evacuação foi emitido após relatos da Força Aérea dos Estados Unidos sobre uma fuga de fosfento branco de baixo risco em uma base aérea sul-coreana.", "titulo_pt": "(2º LD) breve alerta de evacuação emitido após relato de vazamento de fosfento branco de baixo risco na base aérea dos EUA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 76630, "titulo": "Como centenas de conversas privadas com chat de IA Claude acabaram disponíveis publicamente", "url": "https://www.bbc.com/portuguese/articles/cd6923x3vl4o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-28T10:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Centenas de conversas privadas com o chat de IA Claude ficaram disponíveis publicamente através do Google, após um usuário pesquisar termos específicos no site. Alguns desses chats incluíam informações pessoais e profissionais.", "titulo_pt": "Como centenas de conversas privadas com chat de IA Claude acabaram disponíveis publicamente", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 77149, "titulo": "Can the New York Times Save Journalism From Our AI Overlords?", "url": "https://www.wired.com/story/the-big-interview-podcast-a-g-sulzberger-new-york-times/", "fonte_id": "wired", "data_pub": "2026-07-28T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2023, o New York Times processou OpenAI e Microsoft por supostas violações de direitos autorais. A empresa investiu mais de 20 milhões de dólares no caso e o editor-executivo A.G. Sulzberger não planeja parar de lutar.", "titulo_pt": "O New York Times pode salvar a jornalismo dos nossos senhores da IA?", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 77024, "titulo": "AI stock sell-off deepens as investors dump chipmakers", "url": "https://www.ft.com/content/f8c03b5b-e194-4236-82c3-389b6f5dd7ae?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-28T10:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores estão vendendo ações de fabricantes de chips, com o índice tech-heavy Kospi da Coreia do Sul liderando as quedas na Ásia.", "titulo_pt": "Venda de ações de empresas de chip se intensifica, com kospi da ásia à frente", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 76902, "titulo": "Indian EV makers beat Tesla and BYD on energy efficiency", "url": "https://restofworld.org/2026/indian-evs-beat-tesla-byd-icct-efficiency-ranking/?utm_source=rss&utm_medium=rss&utm_campaign=feeds", "fonte_id": "rest_of_world", "data_pub": "2026-07-28T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tata Motors e Mahindra lideraram uma classificação global de eficiência energética de baterias, demonstrando a força da Índia na fabricação de carros elétricos econômicos. No entanto, eles ainda ficam atrás em termos de velocidade de recarga e alcance do veículo.", "titulo_pt": "Fabricantes indianos de veículos elétricos superam Tesla e BYD em eficiência energética", "veiculo": "Rest of World", "pais": "EUA", "classe": "A"}, {"id": 77082, "titulo": "China teenager wins praise for developing app to remind grandpa to take daily medication", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3362080/china-teenager-wins-praise-developing-app-remind-grandpa-take-daily-medication?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-28T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um jovem de 18 anos, recente graduado do ensino médio em Shanghai, desenvolveu uma aplicativo simples com inteligência artificial para lembrar seu avô de tomar medicamentos regularmente. A inovação gerou grande atenção nas redes sociais e conquistou elogios online.", "titulo_pt": "Jovem chinês de 18 anos ganha destaque com app que lembra avô de tomar remédio", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 77150, "titulo": "Silicon Valley’s Next IPO Billionaires Are Coming. Nonprofits Are Ready for Them", "url": "https://www.wired.com/story/nonprofits-are-getting-ready-for-the-funding-anthropalypse/", "fonte_id": "wired", "data_pub": "2026-07-28T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Funcionários de empresas como Anthropic e OpenAI estão esperados a fazer doações generosas após as suas companhias realizarem o IPO. Um líder de uma organização sem fins lucrativos afirma que será um passeio emocionante.", "titulo_pt": "Próximos bilionários da bolsa de valores da Valley estarão dispostos a fazer doações generosas, dizem líderes de ongs", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 76949, "titulo": "China’s reported chip breakthrough comes with some big caveats", "url": "https://www.cnbc.com/2026/07/28/china-chipmaking-duv-tool-asml-explained.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-28T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China está relatadamente produzindo uma ferramenta-chave para chips em um mercado dominado pela ASML. No entanto, analistas questionaram a capacidade da China de competir com o gigante holandês.", "titulo_pt": "China's reported chip breakthrough comes with some big caveats (traduzido para) avanço chinês em chips apresenta grandes reservas", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 77105, "titulo": "Alert issued after suspected white phosphorus leak at U.S. base", "url": "https://en.yna.co.kr/view/AEN20260728011700315", "fonte_id": "yonhap_news", "data_pub": "2026-07-28T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um alerta de emergência foi emitido na base dos Estados Unidos em Pyeongtaek, Coreia do Sul, após um suposto vazamento de fosfeto branco.", "titulo_pt": "Alerta emitido após suposto vazamento de fosfeto branco em base dos EUA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 77102, "titulo": "Samsung’s chip workers are jumping ship to rival SK Hynix", "url": "https://www.technologyreview.com/2026/07/28/1140853/samsung-chip-workers-exodus-sk-hynix/", "fonte_id": "mit_tech_review", "data_pub": "2026-07-28T09:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um engenheiro da divisão de semicondutores da Samsung tem vindo a aplicar-se para empregos na sua concorrente SK Hynix, dedicando tempo extra após o horário normal. Ele compartilha conselhos com colegas de trabalho sobre essa mudança.", "titulo_pt": "Funcionários de chips da samsung estão deixando a empresa para concorrente SK Hynix", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 76895, "titulo": "UN's renewable-powered AI goal meets physical reality", "url": "https://www.axios.com/2026/07/28/renewables-ai-data-centers-power-fossil-fuels", "fonte_id": "axios", "data_pub": "2026-07-28T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ONU incentivou os centros de dados a serem alimentados por energia renovável, destacando uma tensão central na era da inteligência artificial: embora a energia renovável esteja crescendo, o uso de combustíveis fósseis também está aumentando. A demanda elétrica para centros de dados deve dobrar nos próximos quatro anos, e isso impactará investimentos e emissões de gases de efeito estufa.", "titulo_pt": "Objetivo das nações unidas de energizar os centros de dados com renováveis enfrenta realidade física", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 76896, "titulo": "Anthropic, OpenAI blow past Starbucks, McDonald's amid AI boom", "url": "https://www.axios.com/2026/07/28/anthropic-openai-revenue-mcdonalds-starbucks-yum", "fonte_id": "axios", "data_pub": "2026-07-28T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A receita das empresas de IA, Anthropic e OpenAI, está crescendo tão rapidamente que está começando a superar marcas reconhecidas globalmente como Starbucks e McDonald's. Estas empresas de IA estão em trilhar um caminho para uma receita anual estimada em cerca de 120 bilhões de dólares.", "titulo_pt": "Anthropic e OpenAI superam Starbucks e McDonald's com a bolha da IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 77153, "titulo": "An Extreme Solar Storm May Be Even More Devastating Than Previously Imagined", "url": "https://www.wired.com/story/an-extreme-solar-storm-may-be-even-more-devastating-than-previously-imagined/", "fonte_id": "wired", "data_pub": "2026-07-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos estudos sugerem que não existe um limite máximo para a intensidade das rajadas solares que atingem a Terra. Isso tem implicações preocupantes.", "titulo_pt": "Uma tempestade Solar extrema pode ser mais devastadora do que se imaginava", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 76554, "titulo": "App de namoro com IA do governo japonês resulta em 265 casamentos", "url": "https://exame.com/mundo/app-de-namoro-com-ia-do-governo-japones-resulta-em-265-casamentos/", "fonte_id": "exame", "data_pub": "2026-07-28T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O aplicativo de namoro com inteligência artificial do governo japonês resultou em 265 casamentos. O app exige a comprovação de estado civil e já formou 760 casais em relacionamentos sérios.", "titulo_pt": "App de namoro com IA do governo japonês resulta em 265 casamentos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 76560, "titulo": "Meta e BlackRock se unem para construir data center de US$ 14 bilhões nos EUA", "url": "https://exame.com/inteligencia-artificial/meta-e-blackrock-se-unem-para-construir-data-center-de-us-14-bilhoes-nos-eua/", "fonte_id": "exame", "data_pub": "2026-07-28T07:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meta e a BlackRock planejam construir um data center de US$ 14 bilhões no Texas, com capacidade para 1 gigawatt. O complexo deve começar suas operações em 2028, e a BlackRock será proprietária de 80% do empreendimento.", "titulo_pt": "Meta e BlackRock unem-se para construir data center de US$ 14 bilhões no texas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 76505, "titulo": "Parar de comer quatro horas antes de dormir pode beneficiar o cérebro, sugere estudo", "url": "https://veja.abril.com.br/saude/parar-de-comer-quatro-horas-antes-de-dormir-pode-beneficiar-o-cerebro-sugere-estudo/", "fonte_id": "veja", "data_pub": "2026-07-28T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo com 47 mulheres indica que evitar comer quatro horas antes de dormir pode ser benéfico para o cérebro. O mesmo estudo sugere também que concentrar as refeições em uma janela de oito a nove horas por dia traz benefícios cognitivos.", "titulo_pt": "Parar de comer quatro horas antes de dormir pode beneficiar o cérebro, sugere estudo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 77079, "titulo": "What’s behind China’s recent spike in Covid-19 cases? And is it anything to worry about?", "url": "https://www.scmp.com/news/china/politics/article/3362131/whats-behind-chinas-recent-spike-covid-19-cases-and-it-anything-worry-about?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-28T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China registrou um aumento recente de casos de Covid-19, superando a influenza como o principal patógeno respiratório deste ano. A maioria dos pacientes apresentou sintomas leves e os dados indicam que a taxa de infecção é significativamente menor do que no pico do ano passado. O variante Omicron NB.1.8.1 está se espalhando em um nível moderado, segundo o Centro Chinês de Controle e Prevenção de Doenças.", "titulo_pt": "O que há por trás do aumento recente de casos de Covid-19 na China? E isso nos preocupa?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 77196, "titulo": "Benefits of middle school program trickle down to next generation", "url": "https://phys.org/news/2026-07-benefits-middle-school-trickle-generation.html", "fonte_id": "phys_org", "data_pub": "2026-07-28T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um programa de prevenção ao uso de substâncias aplicado a estudantes do sexto e sétimo ano e suas famílias resultou em benefícios abrangentes que se estenderam até a idade adulta. Além disso, esses benefícios foram transmitidos para as crianças dos participantes que se tornaram pais.", "titulo_pt": "Benefícios de programa do ensino médio se estendem para a geração seguinte", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 76812, "titulo": "El cerebro podría seguir escuchando bajo anestesia general, según un reciente estudio", "url": "https://www.latercera.com/tendencias/noticia/el-cerebro-podria-seguir-escuchando-bajo-anestesia-general-segun-un-reciente-estudio/", "fonte_id": "la_tercera", "data_pub": "2026-07-28T10:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo recente realizado por uma equipe de pesquisadores nos Estados Unidos registrou sinais cerebrais que desafiam algumas ideias tradicionais sobre a inconsciência durante o uso de anestesia geral.", "titulo_pt": "Cérebro poderia continuar ouvindo sob anestesia geral, sugere estudo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 77191, "titulo": "STAT+: Preliminary trial results suggest a path to a safer Alzheimer’s treatment", "url": "https://www.statnews.com/2026/07/28/promis-neurosciences-amyloid-alzheimers-aria/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-07-28T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "ProMIS Neurosciences está desenvolvendo um medicamento para clarear a amilóide no tratamento da Alzheimer's com o objetivo de torná-lo mais seguro. Os resultados preliminares indicam que a empresa pode estar no caminho certo.", "titulo_pt": "Preliminary trial results suggest a path to a safer Alzheimer’s treatment", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 76471, "titulo": "Marmotas vão parar no OnlyFans para arrecadar dinheiro para pesquisas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/07/marmotas-vao-parar-no-onlyfans-para-arrecadar-dinheiro-para-pesquisas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em junho, o biólogo Daniel Blumstein esperava por marmotas em Colorado enquanto lamentava a falta de apoio para suas pesquisas devido aos cortes do governo Trump no financiamento científico.", "titulo_pt": "Marmotas são usadas em OnlyFans para arrecadar fundos para pesquisa", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 77107, "titulo": "(LEAD) Tremor of Japan earthquake felt in parts of S. Korea: authorities", "url": "https://en.yna.co.kr/view/AEN20260728010951315", "fonte_id": "yonhap_news", "data_pub": "2026-07-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 7,1 que ocorreu no Japão foi sentido em algumas partes da Coreia do Sul, conforme informaram as autoridades.", "titulo_pt": "Tremor do terremoto japonês senti-se na Coreia do sul: autoridades", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 77192, "titulo": "STAT+: CMS evaluates one year of health tech progress, announces eight new pledge categories", "url": "https://www.statnews.com/2026/07/28/medicare-medicaid-evaluates-health-tech-progress-unveils-eight-pledge-categories/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-07-28T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ano após o lançamento do Ecosistema de Tecnologia da Saúde CMS, autoridades se reuniram em Washington para comemorar a modernização da tecnologia da saúde pela administração Trump. O CMS também anunciou categorias novas de compromi ldfire in southwest France highlights Seveso sites' vulnerability to forest fires", "url": "https://www.lemonde.fr/en/economy/article/2026/07/28/wildfire-in-southwest-france-highlights-seveso-sites-vulnerability-to-forest-fires_6755920_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-28T10:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais na região sul da França exigiram medidas de proteção em instalações industriais que utilizam ou armazenam materiais inflamáveis ou explosivos. Pelo menos sete dessas instalações, listadas no departamento do Gironde, estavam próximas ao fogo ou localizadas em cidades evacuadas.", "titulo_pt": "Incêndio florestal na França destaca vulnerabilidade de sites Seveso", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 76951, "titulo": "Wildfires burn nearly 300,000 acres in France and Spain as heat wave looms", "url": "https://www.cnbc.com/2026/07/28/france-spain-wildfires-heat-wave.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-28T10:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais estão queimando quase 300 mil acres na França e Espanha, enquanto temperaturas elevadas são esperadas na região. As chamas já afetaram áreas da Espanha e os bombeiros lutam para controlar as fogueiras.", "titulo_pt": "Incêndios florestais queimam quase 300 mil acres na França e Espanha com onda de calor iminente", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 76629, "titulo": "Terremoto de magnitude 7,1 atinge o Japão; shopping desaba e deixa pessoas presas nos escombros", "url": "https://www.bbc.com/portuguese/articles/cp8x5wzp7wzo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-28T10:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 7,1 atingiu o Japão, causando a desabamento de um shopping e deixando pessoas presas nos escombros. A primeira-ministra Sanae Takaichi informou que o tremor também resultou em colapsos de edifícios e incêndios.", "titulo_pt": "Terremoto de magnitude 7,1 atinge o Japão; shopping desaba e pessoas ficam presas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 76544, "titulo": "Reparação, aprendizado e o futuro da Samarco", "url": "https://www.cnnbrasil.com.br/infra/reparacao-aprendizado-e-o-futuro-da-samarco/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-28T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rodrigo Vilela afirmou que o Novo Acordo do Rio Doce definiu responsabilidades que aceleraram entregas para comunidades, meio ambiente e sociedade.", "titulo_pt": "Reparação, aprendizado e o futuro da Samarco", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 76636, "titulo": "Contra curtailment e estagnação, geradores eólicos investem nos ventos do Sul", "url": "https://braziljournal.com/contra-curtailment-e-estagnacao-geradores-eolicos-investem-nos-ventos-do-sul/", "fonte_id": "brazil_journal", "data_pub": "2026-07-28T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Statkraft, uma empresa norueguesa de energia eólica, anunciou um investimento de mais de R$ 1 bilhão para construir um parque eólico com 280 megawatts no Sul do Brasil. Este projeto é visto como um sinal positivo na indústria, que está atualmente em quase total paralisação no país.", "titulo_pt": "Contra curtailment e estagnação, geradores eólicos investem nos ventos do Sul", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 76941, "titulo": "France wildfire: Residents douse embers with water after blaze destroys 170 homes in Le Porge", "url": "http://www.euronews.com/2026/07/28/france-wildfire-residents-douse-embers-with-water-after-blaze-destroys-170-homes-in-le-por", "fonte_id": "euronews", "data_pub": "2026-07-28T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Residentes
