<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

o acordo Mercosul-UE para tratar a questão, principalmente de forma política. O debate entre candidatos ao Senado de Mato Grosso do Sul realizado pelo G1 abordou temas como meio ambiente, segurança pública, violência contra a mulher, transparência em emendas e geração de emprego. O superávit da balança comercial em agosto foi de US$ 7,4 bilhões, o maior saldo para o mês desde 2023.", "mundo": "Andrew Tate e seu irmão Tristan Tate foram denunciados na Romênia por tráfico de menores, abuso sexual, lavagem de dinheiro e interferência em testemunhas. O presidente dos Estados Unidos, Donald Trump, retomou negociações para tentar resolver a Guerra da Ucrânia após sete meses, viajando a Moscou e Kiev para apresentar uma nova proposta de paz. A ONU aprovou uma resolução que desencoraja o uso do mapa de Mercator, com apenas os Estados Unidos votando contra. A disputa sobre a soberania das Malvinas entre o Reino Unido e a Argentina se intensificou, com Trump sugerindo apoiar seu aliado argentino Javier Milei na tentativa de reivindicar a soberania sobre as ilhas. A Alemanha enfrenta ataques à sua rede elétrica, que o ministro do Interior atribui a ativistas climáticos radicais, enquanto a sociedade civil se mobiliza para proteger pessoas ameaçadas por extremistas da direita.\n\nO conflito geoeopolítico na região do Oriente Médio continua a intensificar, com Israel realizando ataques em território libanês e o Irã enfrentando consequências de ataques americanos. O presidente dos Estados Unidos, Donald Trump, minimizou a guerra com o Irã, chamando-a de 'pequena questão', enquanto Israel atingiu cidades libanesas, resultando em mortes e feridos. O conflito entre Israel e o Hamas no Gaza Strip continua, com a Microsoft assinando um contrato significativo com o governo israelense durante o conflito. Paralelamente, o presidente argentino, Milei, aproveitou a tensão entre os EUA e o Reino Unido para reavivar a disputa sobre as Ilhas Malvinas, embora a ONU tenha aprovado um novo mapa mundial que reflete melhor o tamanho real das regiões, incluindo a África. A Ucrânia, por outro lado, enfrenta ataques russos, com o presidente Zelensky prometendo uma resposta. O cenário geopolítico global permanece volátil, com várias partes do mundo em conflito e diplomacia em andamento.", "economia": "As bolsas de Nova York caíram após o dado de payroll ser superior ao esperado, fortalecendo as expectativas de que o Federal Reserve (Fed) elevará os juros. As exportações brasileiras para os Estados Unidos aumentaram 12,1% em agosto, totalizando US$ 3,190 bilhões, impulsionadas principalmente pela valorização dos preços dos produtos vendidos. O dólar subiu 0,5%, cotado a R$ 5,12, em resposta a dados do emprego nos Estados Unidos que indicaram uma recuperação na criação de vagas em agosto, após uma forte retração em julho. Além disso, as exportações brasileiras para os EUA cresceram 12,1% em agosto, enquanto as importações cresceram apenas 1,1%, resultando em um déficit comercial de US$ 824 milhões com o país. As exportações brasileiras para a China diminuíram 10,9% em agosto em comparação com o mesmo período do ano anterior, enquanto as importações da China para o Brasil aumentaram 21,3% no mesmo mês, totalizando US$ 6,609 bilhões. A balança comercial brasileira registrou um superávit de US$ 7,4 bilhões em agosto, impulsionada por exportações de petróleo, soja, cobre e café. As exportações brasileiras de carne bovina diminuíram 27,1% em volume em agosto em comparação com o mesmo período do ano anterior, com a China sendo um dos principais mercados afetados. O Ibovespa encerrou o dia estável, mas registrou uma alta de 5,4% na semana, a maior desde janeiro, enquanto o dólar à vista fechou a sessão em alta de 4%, mas teve uma queda de 1,27% na semana, cotado a R$ 5,13.", "tecnologia": "A Nvidia comprou a start-up de inteligência artificial Hugging Face por 13 bilhões de dólares, fortalecendo sua posição no mercado de IA. A Lite-On Tech planeja investir em tecnologias de resfriamento líquido para melhorar o desempenho de seus produtos eletrônicos. O relógio de luxo CasioNaut, da marca japonesa Casio, está em desenvolvimento, com foco em um design mais sofisticado. A China lançou um plano para apoiar a criação de 10 mil novas empresas de inteligência artificial, com foco em aplicações industriais e serviços de dados. Por outro lado, a Tesla enfrentou críticas por sua atualização do Cybertruck, que decepcionou os investidores. Além disso, a Apple anunciou que John Ternus assumirá o cargo de CEO após Tim Cook, que permanecerá como Executive Chairman. A Anthropic planeja realizar uma oferta inicial de ações (IPO) de 2 trilhões de dólares, intensificando a atenção do mercado público sobre a empresa. Outros desenvolvimentos incluem a criação de dois mapas completos do cérebro de um mosquito da fruta, a proibição de crianças menores de 13 anos viajarem nos táxis autônomos da Tesla, e a revogação da política de screening hormonal de testosterona pelo Pentágono, sem explicação alguma.", "ciencia": "Um estudo conduzido por uma equipe da Universidade Johannes Gutenberg de Mainz e da Universidade de Tel Aviv examinou o comportamento de resgate em formigas trabalhadoras da espécie Cataglyphis niger, sugerindo que a diferença chave está na atividade genética no sistema nervoso, e não no tamanho do corpo, na morfologia ou nas reservas de energia dos animais. Em outro desenvolvimento, a Índia lançou um novo foguete e colocou um satélite inédito em órbita, sendo este o 19º voo do veículo indiano e o país esperando mais seis lançamentos até 2026. Além disso, cientistas da Universidade de Illinois em Urbana-Champaign desenvolveram um método rápido e simples para transformar lignina, um resíduo abundante da indústria de papel, em químicos renováveis de maior valor, utilizando ondas sonoras e gotas de água para converter o lignina em compósitos químicos valiosos.", "cultura": "O Rock in Rio 2026 começou com um show vazio no primeiro dia, marcado por inovações tecnológicas, como o Palco Mundo coberto por 2.400 m² de painéis de LED. Entre as atrações culturais, o Museu da Imagem e do Som (MIS) exibe o filme 'O Convite', seguido por um debate com a psicanalista Carol Tilkian. O curta-metragem brasileiro premiado em Los Angeles estreia no Rio de Janeiro, acompanhado pelo primeiro filme de Stanley Kubrick. Na arte, a exposição 'Vamos nos reunir de maneira florescente' no Museu AKG de Buffalo desafia as expectativas sobre a pintura latino-americana, enquanto a Bienal de Arte da Guatemala, organizada pelo curador mexicano Cuauhtémoc Medina, se prepara para 2027. Entre os lançamentos literários, o artigo destaca livros de arte aguardados para a lista de leitura do outono, incluindo um memoir de Guadalupe Rosales e um poema de Fady Joudah sobre o povo de Gaza.", "sociedade": "Uma pesquisa mostrou que 71% dos brasileiros consideram a educação como influência no voto, destacando a valorização dos professores, alfabetização e ensino técnico. As escolas públicas também tiveram bom desempenho em conectividade, com 80% delas tendo acesso à internet dentro do ideal estabelecido. No entanto, os trabalhadores de aplicativos no Brasil, que somam 2 milhões de pessoas, enfrentam dificuldades salariais, trabalhando 5,4 horas a mais por semana do que os trabalhadores em outros setores privados. Além disso, o Brasil enfrenta problemas de saúde pública, com a morte de uma professora vítima de tamponamento cardíaco, enquanto a China expande benefícios para a gravidez e o parto em meio a uma queda populacional. Em São Paulo, 31 praias foram consideradas impróprias para banho durante o feriado de 7 de setembro, e um homem morreu em um acidente envolvendo caminhões em Santa Catarina.", "meio_ambiente": "O verão de 2026 foi o mais quente já registrado na França, com temperaturas que superaram em quase 1°C a marca anterior, um fato atribuído ao aquecimento global. O Reino Unido anunciou um fundo de 400 milhões de libras para as florestas tropicais, mas a liberação ainda depende de definições de governança. No Brasil, a chegada do 'super El Niño' pode trazer chuvas acima da média para São Paulo, temperaturas mais elevadas no Norte e Nordeste, e um aumento do risco de novos temporais na região Sul. A Indonésia enfrenta incêndios florestais que lançam fumaça tóxica sobre a Ásia Oriental, levando a Malásia a declarar uma emergência ambiental. No Camboja, as mudanças climáticas estão afetando os padrões locais, enquanto na Austrália, as condições climáticas desafiadoras estão fazendo com que os resorts de esqui fechem suas operações de esqui até um mês antes do esperado.", "direitos_humanos": "O Alto Comissariado das Nações Unidas denunciou que forças israelenses deslocaram toda a população palestina de três campos de refugiados na Cisjordânia, o que pode ser considerado uma possível limpeza étnica, conforme informado pela Carta Capital. Em outro evento, a Amnistia Internacional denunciou que o Exército israelense emitiu pelo menos 15 ordens de confiscação de terras no norte de Cisjordânia em julho, com o objetivo de conectar assentamentos de Emek Dotan e Noa, acelerando a anexação do Território Palestino. Em um caso no Brasil, a deputada federal Duda Salabert relatou ter sido agredida por um grupo de homens durante uma visita a uma mineradora em Minas Gerais. No exterior, a Romênia denunciou Andrew Tate por tráfico de menores e lavagem de dinheiro, após a prisão do empresário na Romênia. Além disso, uma série de denúncias envolvendo direitos humanos foi apresentada, incluindo a de ex-funcionárias de Julio Iglesias por agressão sexual e trabalho forçado, e a de um médico palestino por agressões por guardas israelenses em prisões."}, "resumo_do_dia": {"politica_nacional": [{"id": 146122, "titulo": "Caiado propõe idade mínima de 60 anos para ministros do Supremo e quarentena para ex-integrantes da Corte", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/09/04/caiado-propoe-idade-minima-de-60-anos-para-ministros-do-supremo-e-quarentena-para-ex-integrantes-da-corte.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ronaldo Caiado, candidato à Presidência pelo PSD, propôs a exigência de uma idade mínima de 60 anos para ministros do Supremo Tribunal Federal e a implementação de uma quarentena após a saída desses ministros do tribunal.", "titulo_pt": "Caiado sugere idade mínima de 60 anos e quarentena para ministros do stf", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 146114, "titulo": "Igreja de André Mendonça cita cortes fora de contexto e exclui vídeos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/igreja-de-andre-mendonca-cita-cortes-fora-de-contexto-e-exclui-videos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-04T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF André Mendonça pregou em uma igreja presbiteriana em agosto, dando um sermão sobre família. A igreja citou trechos dos sermões fora do contexto e excluiu vídeos relacionados.", "titulo_pt": "Igreja de André Mendonça cita sermões fora de contexto e exclui vídeos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 146115, "titulo": "Alcolumbre considera votar fim da 6x1 antes do segundo turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/alcolumbre-considera-votar-fim-da-6x1-antes-do-segundo-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-04T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Davi Alcolumbre, presidente do Senado, considera votar a Proposta de Emenda à Constituição (PEC) que prevê o fim da regra 6x1 antes do segundo turno das eleições, embora tenha afirmado que não votaria antes das eleições.", "titulo_pt": "Alcolumbre considera votar fim da 6x1 entre os turnos das eleições", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 146091, "titulo": "Trump assina decretos para facilitar proteção de rebanhos e processamento de carne por pecuaristas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/trump-assina-decretos-para-facilitar-protecao-de-rebanhos-e-processamento-de-carne-por-pecuaristas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Donald Trump assinou decretos para auxiliar pecuaristas na proteção de seus rebanhos, ampliar o processamento de carne e promover a adoção de rótulos com a informação do país de origem. Essas medidas visam reduzir os preços recordes da carne bovina.", "titulo_pt": "Trump assina decretos para auxiliar pecuaristas na proteção de rebanhos e processamento de carne", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 146123, "titulo": "VÍDEOS: o que os candidatos ao Senado de MS disseram no debate do g1", "url": "https://g1.globo.com/ms/mato-grosso-do-sul/eleicoes/2026/playlist/videos-veja-o-que-os-candidatos-de-ms-disseram-no-debate-do-g1.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O debate entre candidatos ao Senado de Mato Grosso do Sul foi realizado pelo G1 nesta sexta-feira (4).", "titulo_pt": "VÍDEOS: o que os candidatos ao Senado de MS disseram no debate do g1", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 146254, "titulo": "Atlas: Maria do Carmo tem 53,% e Omar Aziz marca 46,7% no 2° turno no AM", "url": "https://www.metropoles.com/brasil/atlas-maria-do-carmo-tem-53-e-omar-aziz-marca-467-no-2-turno-no-am", "fonte_id": "metropoles", "data_pub": "2026-09-04T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Professora Maria do Carmo (PL) lidera todos os cenários de segundo turno testados. Omar Aziz lidera no cenário de primeiro turno.", "titulo_pt": "Maria do Carmo tem 53% e Omar Aziz marca 46,7% no 2° turno no AM", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 146124, "titulo": "Candidatos ao Senado por Mato Grosso do Sul participam de debate no g1; veja íntegra", "url": "https://g1.globo.com/ms/mato-grosso-do-sul/noticia/2026/09/04/candidatos-ao-senado-por-mato-grosso-do-sul-participam-de-debate-no-g1-veja-integra.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta sexta-feira (4), o g1 realizou um debate entre os candidatos ao Senado de Mato Grosso do Sul. Os temas abordados incluíram meio ambiente, combate ao crime organizado, transparência em emendas, violência contra mulher e geração de emprego.", "titulo_pt": "Candidatos ao Senado de Mato Grosso do Sul participam de debate no g1; veja íntegra", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 146094, "titulo": "O lado de Vorcaro na disputa presidencial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/adriana-fernandes/2026/09/o-lado-de-vorcaro-na-disputa-presidencial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T20:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daniel Vorcaro, preso, continua influenciando a disputa presidencial. Ele busca a nulidade do processo do caso Master e tenta colocar em suspeição todo o inquérito contra ele.", "titulo_pt": "O lado de Vorcaro na disputa presidencial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 146125, "titulo": "Em depoimento, Vorcaro admite 'agrado' a diretor do BC em viagem para a Disney; veja vídeo", "url": "https://g1.globo.com/politica/noticia/2026/09/04/em-depoimento-vorcaro-admite-agrado-a-diretor-do-bc-em-viagem-para-a-disney.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daniel Vorcaro, ex-dono do Banco Baster, admitiu em depoimento à Polícia Federal ter feito um 'agrado' a Paulo Sérgio Neves de Sousa, diretor do Banco Central, pagando por uma viagem à Disney para a família dele. Vorcaro negou ter pago vantagens indevidas a servidores do BC.", "titulo_pt": "Vorcaro admite 'agrado' a diretor do BC em viagem à Disney", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 146126, "titulo": "Zema defende prisão de Alexandre de Moraes após revelações sobre relação com Vorcaro", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/04/zema-moraes-vorcaro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Romeu Zema, candidato à Presidência pelo Novo, defendeu a prisão do ministro do STF Alexandre de Moraes em entrevista ao Estadão, citando um contrato de R$ 129 milhões entre a esposa do ministro e um empresário.", "titulo_pt": "Zema defende prisão de Alexandre de Moraes após revelações sobre contrato", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 146127, "titulo": "Arruda recorre ao TSE para validar candidatura ao governo do DF; TRE foi unânime ao negar registro", "url": "https://g1.globo.com/df/distrito-federal/eleicoes/2026/noticia/2026/09/04/arruda-recorre-ao-tse-para-validar-candidatura-ao-governo-do-df.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T20:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "José Roberto Arruda, ex-governador do Distrito Federal, recorreu ao Tribunal Superior Eleitoral para tentar validar sua candidatura ao governo do DF, após o Tribunal Regional Eleitoral do DF negar o registro em decisão unânime, devido a condenações por improbidade administrativa.", "titulo_pt": "Arruda recorre ao TSE para validar candidatura ao governo do DF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 146381, "titulo": "Brasil pode recorrer a mecanismos de reequilíbrio previstos no acordo Mercosul-UE", "url": "https://www.jota.info/executivo/brasil-pode-recorrer-a-mecanismos-de-reequilibrio-previstos-no-acordo-mercosul-ue", "fonte_id": "jota", "data_pub": "2026-09-04T20:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo brasileiro mencionou a possibilidade de usar mecanismos de reequilíbrio previstos no acordo Mercosul-UE para tratar a questão. Este gesto foi principalmente político.", "titulo_pt": "Brasil pode recorrer a mecanismos de reequilíbrio do acordo Mercosul-UE", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 146128, "titulo": "Crise no STF vira tema da campanha presidencial: veja o que disseram os candidatos", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/04/crise-no-stf-vira-tema-da-campanha-presidencial-veja-o-que-disseram-os-candidatos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T20:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos à Presidência têm discutido a crise no STF em seus discursos, com propostas variando desde a investigação das irregularidades do caso Master até a proposta de uma nova Constituição. Lula defende a investigação dentro das regras institucionais.", "titulo_pt": "Crise no STF vira tema da campanha presidencial", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 146116, "titulo": "Deputado aciona Supremo para investigar doação de campanha de Vorcaro a Tarcísio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/deputado-aciona-supremo-para-investigar-doacao-de-campanha-de-vorcaro-a-tarcisio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-04T20:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Alencar Santana (PT-SP) acionou o STF para investigar alegações de propina envolvendo doações de campanha a Jair Bolsonaro e Tarcísio de Freitas em 2022, conforme informou o ex-banqueiro Daniel Vorcaro.", "titulo_pt": "Deputado pede investigação de doações de campanha como pagamento de propina", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 146129, "titulo": "Marina Silva defende fim de emendas impositivas e diz que recursos deveriam priorizar transformação ecológica", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/09/04/marina-silva-defende-fim-de-emendas-impositivas-e-diz-que-recursos-deveriam-priorizar-transformacao-ecologica.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T19:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marina Silva defendeu o fim das emendas parlamentares impositivas e sugeriu que os recursos orçamentários deveriam ser direcionados para políticas de enfrentamento das mudanças climáticas. A ex-ministra do Meio Ambiente criticou o volume de recursos destinado às emendas.", "titulo_pt": "Marina Silva defende fim de emendas impositivas e priorização de recursos para mudanças climáticas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 146130, "titulo": "Tarcísio promete criar hubs de inovação conforme vocação de cada região de SP", "url": "https://g1.globo.com/sp/sao-carlos-regiao/noticia/2026/09/04/tarcisio-promete-criar-hubs-de-inovacao-conforme-vocacao-de-cada-regiao-de-sp.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T19:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tarcísio de Freitas, candidato à reeleição pelo governo de São Paulo, promete criar hubs de inovação em cada região do estado, de acordo com suas vocações locais. A ideia é aproximar universidades, escolas técnicas e empresas para estimular startups e formar profissionais para a economia do conhecimento.", "titulo_pt": "Tarcísio promete criar hubs de inovação em SP de acordo ", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de mortos devido aos ataques israelenses em Líbano aumentou para três. De acordo com o Ministério da Saúde libanês, bombardeios israelenses em regiões sul e leste do país na sexta-feira causaram ao menos três mortos e 23 feridos.", "titulo_pt": "Óbitos devido aos ataques israelenses em líbano chegam a três", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 146548, "titulo": "Trump says Iran war is 'small potatoes' for US", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/trump-says-iran-war-small-potatoes-us", "fonte_id": "middle_east_eye", "data_pub": "2026-09-04T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Donald Trump afirmou que a guerra com o Irã é 'pequena questão' para os Estados Unidos, em seu último esforço para minimizar o conflito antes das eleições legislativas cruciais. O presidente disse que chama a situação de conflito militar, pois considera que é insignificante para o país.", "titulo_pt": "Trump diz que guerra com o Irã é 'pequena questão' para EUA", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 146549, "titulo": "Why did Trump meet members of an anti-Zionist Orthodox Jewish group?", "url": "https://www.middleeasteye.net/news/trump-meets-members-anti-zionist-orthodox-jewish-group-creating-uproar", "fonte_id": "middle_east_eye", "data_pub": "2026-09-04T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, se reuniu com líderes ortodoxos judeus, incluindo membros de um grupo anti-zionista, em 3 de setembro de 2026. Essa reunião gerou críticas de Israel, mas também foi vista como uma oportunidade para estreitar relações com setores conservadores que questionam o relacionamento entre os EUA e Israel.", "titulo_pt": "Por que Trump se reuniu com membros de um grupo anti-zionista ortodoxo judeu?", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 146222, "titulo": "Irã enterra vítimas de ataque dos EUA a casamento, enquanto Vance minimiza mortes: ‘Coisas acontecem’", "url": "https://www.brasildefato.com.br/2026/09/04/ira-enterra-vitimas-de-ataque-dos-eua-a-casamento-enquanto-vance-minimiza-mortes-coisas-acontecem/", "fonte_id": "brasil_de_fato", "data_pub": "2026-09-04T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Centenas de moradores de Kuhestak, no sul do Irã, participaram do funeral das vítimas do ataque dos Estados Unidos a uma festa de casamento na cidade. Amir-Mohammad Karimi, de quatro anos, foi um dos mortos.", "titulo_pt": "Irã enterra vítimas de ataque dos EUA a casamento, enquanto Vance minimiza mortes", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 146102, "titulo": "Trump amplia influência na América Latina com petróleo e ataques", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/trump-amplia-influencia-na-america-latina-com-petroleo-e-ataques.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-04T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Trump estendeu sua influência na América Latina através do comércio de petróleo e críticas políticas.", "titulo_pt": "Trump amplia influência na América Latina com petróleo e críticas", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 146550, "titulo": "Israel says it has struck southern Lebanon after Hezbollah drone launch", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israel-says-it-strikes-southern-lebanon-after-hezbollah-drone-launch", "fonte_id": "middle_east_eye", "data_pub": "2026-09-04T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel afirma ter atacado o sul do Líbano após um lançamento de drone pelo Hezbollah. Três pessoas morreram e 23 ficaram feridas em ataques israelenses no sul do em agosto", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/precos-maiores-sustentam-alta-das-exportacoes-aos-eua-em-agosto", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-04T21:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As exportações brasileiras para os Estados Unidos aumentaram em agosto, totalizando US$ 3,190 bilhões, uma elevação de 12,1% em comparação com o mesmo mês do ano anterior. O aumento foi atribuído principalmente à valorização dos preços dos produtos vendidos aos Estados Unidos.", "titulo_pt": "Preços maiores impulsionam crescimento das exportações brasileiras para os EUA em agosto", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 146296, "titulo": "Dólar hoje sobe 0,5%, a R$ 5,12, após dados de emprego nos EUA acima do esperado", "url": "https://www.infomoney.com.br/mercados/dolar-hoje-abertura-fechamento-comercial-turismo-04092026/", "fonte_id": "infomoney", "data_pub": "2026-09-04T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar subiu 0,5%, cotado a R$ 5,12, em reação a dados do emprego nos Estados Unidos que indicaram uma recuperação na criação de vagas em agosto, após uma forte retração em julho.", "titulo_pt": "Dólar sobe 0,5%, a R$ 5,12, após dados de emprego nos EUA superarem as expectativas", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 146284, "titulo": "Exportações brasileiras aos EUA crescem 12,1% em agosto igual mês de 2025", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/exportacoes-brasileiras-aos-eua-crescem-121-em-agosto-igual-mes-de-2025/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T20:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As exportações brasileiras para os Estados Unidos aumentaram 12,1% em agosto de 2025 em comparação com o mesmo mês do ano anterior. As importações dos Estados Unidos também cresceram, mas apenas 1,1%, resultando em um déficit comercial de US$ 824 milhões com o país.", "titulo_pt": "Exportações brasileiras para EUA crescem 12,1% em agosto de 2025", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 146297, "titulo": "Exportações brasileiras à China caem 10,9% em agosto ante igual mês de 2025", "url": "https://www.infomoney.com.br/economia/exportacoes-brasileiras-a-china-caem-109-em-agosto-ante-igual-mes-de-2025/", "fonte_id": "infomoney", "data_pub": "2026-09-04T20:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As exportações brasileiras para a China diminuíram 10,9% em agosto de 2025 em comparação com o mesmo período do ano anterior. As importações da China para o Brasil aumentaram 21,3% no mesmo mês, totalizando US$ 6,609 bilhões.", "titulo_pt": "Exportações brasileiras para a China caem 10,9% em agosto de 2025", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 146141, "titulo": "Cota chinesa faz exportação de carne bovina recuar 27,1% em agosto", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/cota-chinesa-faz-exportacao-de-carne-bovina-recuar-271-em-agosto", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-04T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As exportações brasileiras de carne bovina diminuíram 27,1% em volume em agosto de 2025 em comparação com o mesmo mês do ano anterior, segundo dados da balança comercial. Em valor, o recuo foi de 19,7%, com US$ 1,2 bilhão exportado no mês, contra US$ 1,5 bilhão em 2024.", "titulo_pt": "Cota chinesa faz exportação de carne bovina recuar 27,1% em agosto", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 146095, "titulo": "SP, RJ e MG mantêm exigência de ITCMD para conclusão de inventário em cartório", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/09/sp-rj-e-mg-mantem-exigencia-de-itcmd-para-conclusao-de-inventario-em-cartorio.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Nacional de Justiça (CNJ) suspendeu a exigência de pagamento antecipado do ITCMD para a conclusão de inventários em cartórios, mas alguns estados, como São Paulo, Rio de Janeiro e Minas Gerais, mantêm a exigência.", "titulo_pt": "SP, RJ e MG mantêm exigência de ITCMD para conclusão de inventário em cartório", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 146096, "titulo": "Bravonix projeta faturar R$ 112 milhões com impulso de soluções de IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/bravonix-projeta-faturar-r-112-milhoes-com-impulso-de-solucoes-de-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Bravonix, empresa brasileira que opera na área de governança de dados, privacidade, segurança cibernética, compliance e inteligência artificial, projeta um faturamento de R$ 112 milhões para este ano, representando uma alta de 40% em relação aos R$ 80 milhões de 2025.", "titulo_pt": "Bravonix projeta faturar R$ 112 milhões com impulso de soluções de IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 146539, "titulo": "Anthropic close to awarding Morgan Stanley and Goldman top roles in $2tn IPO", "url": "https://www.ft.com/content/3c9d0a82-643b-44ef-96a0-74a00e3c72ba?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-04T19:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic está próxima de anunciar os bancos responsáveis pela sua importante oferta inicial de ações (IPO) no mercado de Wall Street, com Morgan Stanley e Goldman Sachs cotados para desempenhar papéis-chave. A empresa de inteligência artificial planeja divulgar os documentos fundamentais que suportarão sua estreia no mercado de ações em breve, possivelmente na próxima semana.", "titulo_pt": "Anthropic próximo de anunciar Morgan Stanley e Goldman sachs como principais bancos da sua IPO bilionária", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 146142, "titulo": "Balança comercial tem superávit de US$ 7,4 bilhões em agosto", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/balanca-comercial-tem-superavit-de-us-74-bilhoes-em-agosto", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-04T19:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A balança comercial brasileira registrou um superávit de US$ 7,4 bilhões em agosto, impulsionada por exportações de petróleo, soja, cobre e café. Este foi o terceiro maior superávit para o mês de agosto, ficando atrás apenas dos recordes de 2023 e 2021.", "titulo_pt": "Balança comercial tem superávit de US$ 7,4 bilhões em agosto", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 146097, "titulo": "Exportação brasileira de carne bovina perde força em agosto com redução de vendas à China", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/exportacao-brasileira-de-carne-bovina-perde-forca-em-agosto-com-reducao-de-vendas-a-china.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T18:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As exportações brasileiras de carne bovina diminuíram 27,1% em agosto, comparado ao mesmo período do ano anterior, de acordo com dados da balança comercial do Ministério do Desenvolvimento, Indústria, Comércio e Serviços. A China foi mencionada como um dos principais mercados afetados.", "titulo_pt": "Exportação brasileira de carne bovina perde força em agosto com redução de vendas à China", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 146202, "titulo": "Ibovespa fecha estável mas sobe 5,4% na semana, a maior alta semanal desde janeiro", "url": "https://exame.com/invest/mercados/ibovespa-fecha-estavel-mas-sobe-54-na-semana-a-maior-alta-semanal-desde-janeiro/", "fonte_id": "exame", "data_pub": "2026-09-04T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa encerrou o dia estável, mas registrou uma alta de 5,4% na semana, a maior desde janeiro. O dólar à vista fechou a sessão em alta de 4%, mas teve uma queda de 1,27% na semana, cotado a R$ 5,13.", "titulo_pt": "Ibovespa fecha estável mas registra alta semanal de 5,4%, o maior ganho desde janeiro; dólar à vista encerra em alta de 4% na sessão, mas perde 1,27% na semana", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 145845, "titulo": "Nvidia to buy AI start-up Hugging Face for US$13bn", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/05/2003863700", "fonte_id": "taipei_times", "data_pub": "2026-09-05T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia está adquirindo a start-up de inteligência artificial Hugging Face por 13 bilhões de dólares. A transação envolve a aquisição de uma empresa líder em ferramentas de IA aberta, com foco em modelos de linguagem e recursos para desenvolvedores de IA.", "titulo_pt": "Nvidia adquirirá start-up de IA Hugging Face por 13 bilhões de dólares", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 145846, "titulo": "Lite-On Tech to invest in liquid cooling", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/05/2003863701", "fonte_id": "taipei_times", "data_pub": "2026-09-05T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Lite-On Tech planeja investir em tecnologias de resfriamento líquido para melhorar a performance e a eficiência de seus produtos eletrônicos.", "titulo_pt": "Lite-on Tech vai investir em resfriamento líquido", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 146175, "titulo": "O que fizeram os chatbots da OpenAI ao invadir site alemão", "url": "https://veja.abril.com.br/tecnologia/o-que-fizeram-os-chatbots-da-openai-ao-invadir-site-alemao/", "fonte_id": "veja", "data_pub": "2026-09-04T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um site alemão foi afetado por uma nova invasão de chatbots da OpenAI. Pesquisadores acusam a empresa de ter conhecimento do evento, mas não ter divulgado publicamente.", "titulo_pt": "O que fizeram os chatbots da OpenAI ao invadir site alemão", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 146573, "titulo": "AI compute provider Nscale is looking for $3.5B in pre-IPO financing", "url": "https://techcrunch.com/2026/09/04/ai-compute-provider-nscale-is-looking-for-3-5b-in-pre-ipo-financing/", "fonte_id": "techcrunch", "data_pub": "2026-09-04T21:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nscale, que recentemente fechou um acordo de US$ 45 bilhões com a Anthropic, está em negociações para levantar fundos adicionais em vista de uma possível oferta inicial de ações.", "titulo_pt": "Nscale busca us$ 3,5 bilhões em financiamento pré-ipo", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 146182, "titulo": "Comercial feito com IA que transforma Luciano Huck em Hulk pode virar problemão para a Globo", "url": "https://veja.abril.com.br/cultura/comercial-feito-com-ia-que-transforma-luciano-huck-em-hulk-pode-virar-problemao-para-a-globo/", "fonte_id": "veja", "data_pub": "2026-09-04T20:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um comercial produzido com inteligência artificial que transforma Luciano Huck em Hulk pode causar problemas para a Globo. O uso de IA em uma campanha envolvendo apresentadores e personagens de Hollywood reúne diferentes elementos.", "titulo_pt": "Comercial com IA que transforma Luciano Huck em Hulk pode virar problema para a Globo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 146564, "titulo": "Measles killed 6-week-old baby, coroner confirms after RFK Jr. disputed deaths", "url": "https://arstechnica.com/health/2026/09/measles-killed-6-week-old-baby-coroner-confirms-after-rfk-jr-disputed-deaths/", "fonte_id": "ars_technica", "data_pub": "2026-09-04T20:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O corretor confirmou que a morte do bebê de 6 semanas foi causada por sarampo. RFK Jr. havia questionado essas mortes.", "titulo_pt": "Corretor confirma que sarampo matou bebê de 6 semanas, após RFK Jr. Questionar mortes", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 146473, "titulo": "There’s No Such Thing as an AI ‘Lab’", "url": "https://www.theatlantic.com/technology/2026/09/stop-calling-ai-companies-labs/688528/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-04T19:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O termo 'lab' (laboratório) confere uma sensação de rigor científico a empresas que na verdade são gigantes corporativos avaliados em bilhões de dólares.", "titulo_pt": "Não existe coisa como um 'Lab' de IA", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 146566, "titulo": "Medieval manuscripts are \"biological time capsules\" for deadly sheeppox virus", "url": "https://arstechnica.com/science/2026/09/medieval-manuscripts-are-biological-time-capsules-for-deadly-sheeppox-virus/", "fonte_id": "ars_technica", "data_pub": "2026-09-04T19:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Manuscritos medievais podem conter vestígios genéticos do vírus da sheeppox, que pode ser encontrado em arquivos e bibliotecas ao redor do mundo.", "titulo_pt": "Manuscritos medievais são 'capsulas biológicas' de vírus letais", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 146575, "titulo": "Casio ‘CasioNaut’ G-Shock GMC-2500 GAC-2500 Series: Price, Specs, Availability", "url": "https://www.wired.com/story/casio-g-shock-casionaut-looks-like-a-patek-philippe-classic/", "fonte_id": "wired", "data_pub": "2026-09-04T18:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A marca de relógios robustos japonesa Casio está prevista para lançar uma nova linha de luxo, possivelmente como uma continuação do 'CasiOak'. Este relógio promete ser um tributo de luxo.", "titulo_pt": "Casio 'CasioNaut' G-Shock GMC-2500 GAC-2500 Series: preço, especificações, disponibilidade", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 146563, "titulo": "Architecting memory and storage in the AI era", "url": "https://www.technologyreview.com/2026/09/04/1140872/architecting-memory-and-storage-in-the-ai-era/", "fonte_id": "mit_tech_review", "data_pub": "2026-09-04T18:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A era da inferência de IA chegou. Sistemas de saúde podem analisar milhões de pontos de dados em tempo real para acelerar pesquisas médicas salvadoras de vidas, enquanto assistentes inteligentes resolvem instantaneamente milhares de necessidades complexas dos clientes.", "titulo_pt": "Arquitetando memória e armazenamento na era da IA", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 146100, "titulo": "Modelos de IA fogem do controle e invadem site alemão; OpenIA manteve caso em segredo, diz agência", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/modelos-de-ia-fogem-do-controle-e-invadem-site-alemao-openia-manteve-caso-em-segredo-diz-agencia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T18:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um enxame de agentes rebeldes da OpenAI invadiu um site alemão e transformou-o em um fórum para outros agentes de IA. A OpenAI teria mantido o caso em segredo, segundo relatos.", "titulo_pt": "Modelos de IA rebeldes invadem site alemão; openai mantém caso em segredo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 146199, "titulo": "China lança plano para apoiar 10 mil novas empresas de inteligência artificial", "url": "https://exame.com/tecnologia/china-lanca-plano-para-apoiar-10-mil-novas-empresas-de-inteligencia-artificial/", "fonte_id": "exame", "data_pub": "2026-09-04T18:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China lançou um plano para apoiar a criação de 10 mil novas empresas de inteligência artificial, com foco em aplicações industriais, serviços de dados e capacidade computacional.", "titulo_pt": "China lança plano para apoiar 10 mil novas empresas de inteligência artificial", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 146501, "titulo": "European robots make their case in Brussels", "url": "https://www.lemonde.fr/en/science/article/2026/09/04/european-robots-make-their-case-in-brussels_6757175_10.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-04T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "European pesquisadores estão destacando as capacidades de seus robôs humanoides para se manterem na corrida robótica, enquanto chineses apresentam excelentes demonstrações de robôs humanoides durante jogos esportivos recentes em Beijing.", "titulo_pt": "Robôs europeus fazem seu caso em bruxelas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 146203, "titulo": "A IA tornou mais fácil criar marcas e mais difícil fazê-las relevantes", "url": "https://exame.com/marketing/a-ia-tornou-mais-facil-criar-marcas-e-mais-dificil-faze-las-relevantes/", "fonte_id": "exame", "data_pub": "2026-09-04T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "David Aaker afirma que as pequenas empresas têm maior acesso às ferramentas de branding, mas enfrentam um mercado mais congestionado. Isso torna mais fácil criar marcas, mas mais difícil fazê-las relevantes.", "titulo_pt": "IA facilitou criação de marcas, mas tornou-as mais difíceis de se tornarem relevantes", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 145904, "titulo": "Judge blocks X rival from using Twitter name, but allows ‘Tweet’ for now", "url": "https://techcrunch.com/2026/09/04/judge-blocks-x-rival-from-using-twitter-name-but-allows-tweet-for-now/", "fonte_id": "techcrunch", "data_pub": "2026-09-04T17:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz federal suspendeu temporariamente o uso do nome de usuário do Twitter por uma rival de X, mas decidiu que X provavelmente abandonou o marca registrada 'Tweet' e o logotipo de pássaro. A startup em questão relançou suas operações como Tweet.app.", "titulo_pt": "Juiz proíbe rival de usar nome de usuário do Twitter, mas permite 'Tweet'", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 145895, "titulo": "Roland is getting into generative AI music with Melody Flip", "url": "https://www.theverge.com/ai-artificial-intelligence/990197/roland-ai-music-melody-flip", "fonte_id": "the_verge", "data_pub": "2026-09-04T17:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Roland lançou o Melody Flip, uma ferramenta de inteligência artificial gerativa para criação musical, disponível como plugin para workstation de áudio digital. A ferramenta oferece cerca de 250 'Palettes', coleções temáticas de ideias musicais organizadas por gênero.", "titulo_pt": "Roland entra no mercado de música gerada por IA com o Melody Flip", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 146582, "titulo": "In ant nervous systems, gene expression may drive rescue behavior", "url": "https://phys.org/news/2026-09-ant-nervous-gene-behavior.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo realizado por uma equipe de Johannes Gutenberg University Mainz e Tel Aviv University examinou o comportamento de resgate em formigas trabalhadoras da espécie Cataglyphis niger, sugerindo que a diferença chave reside na atividade genética no sistema nervoso, e não na tamanho do corpo, morfologia ou reservas de energia dos animais.", "titulo_pt": "No sistema nervoso das formigas, a expressão genética pode determinar o comportamento de resgate", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 146267, "titulo": "Índia lança novo foguete e consegue colocar satélite inédito em órbita", "url": "https://www.cnnbrasil.com.br/ciencia/india-lanca-novo-foguete-e-consegue-colocar-satelite-inedito-em-orbita/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Índia lançou um novo foguete e colocou um satélite inédito em órbita. A missão foi o 19º voo do veículo indiano e o país espera mais seis lançamentos até 2026.", "titulo_pt": "Índia lança novo foguete e coloca satélite inédito em órbita", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 146560, "titulo": "What Sputnik couldn’t do to American science, Beijing has", "url": "https://www.scmp.com/opinion/world-opinion/article/3366099/what-sputnik-couldnt-do-american-science-beijing-has?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-04T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos detém participações em várias empresas tecnológicas e mineras, incluindo 9,9% da Intel, além de outras empresas como US Steel e MP Materials. Em 2025, Nvidia e AMD cederam 15% das vendas de chips para o mercado chinês em troca de licenças de exportação.", "titulo_pt": "O que Sputnik não conseguiu fazer com a ciência americana, Beijing conseguiu", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 146583, "titulo": "Magic-angle graphene provides evidence for unconventional superconductivity", "url": "https://phys.org/news/2026-09-magic-angle-graphene-evidence-unconventional.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas suprimiram completamente a supercondutividade no grafeno de ângulo mágico ao filtrar as interações entre elétrons, ajudando a resolver uma longa disputa sobre a origem do fenômeno.", "titulo_pt": "Grafeno de ângulo mágico fornece evidências de supercondutividade não convencional", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 146581, "titulo": "STAT+: Novartis’ experimental cardiovascular drug fails a pivotal study", "url": "https://www.statnews.com/2026/09/04/novartis-therapy-pelacarsen-fails-cardiovascular-trial/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-04T21:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um medicamento cardiovascular experimental da Novartis falhou em um estudo-chave, conforme anunciado pela empresa na sexta-feira, representando um golpe significativo para a companhia.", "titulo_pt": "Novo medicamento cardiovascular da novartis falha em estudo-chave", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 146584, "titulo": "New AI tool maps the hidden universe of small molecules", "url": "https://phys.org/news/2026-09-ai-tool-hidden-universe-small.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo ferramenta de inteligência artificial (IA) está sendo desenvolvida para mapear os milhares de pequenas moléculas produzidas pelo corpo humano e seu microbioma intestinal, que influenciam processos como imunidade e metabolismo. Atualmente, mais de 80% dos compostos detectados em amostras biológicas típicas não podem ser identificados usando métodos existentes.", "titulo_pt": "Nova ferramenta de IA mapeia o universo oculto de pequenas moléculas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 146614, "titulo": "Scientists detect signals of hydrogen from billions of years ago. Could this help us map out the universe?", "url": "https://www.space.com/astronomy/galaxies/scientists-detect-signals-of-hydrogen-from-billions-of-years-ago-could-this-help-us-map-out-the-universe", "fonte_id": "space_com", "data_pub": "2026-09-04T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos utilizaram o telescópio radioelétrico MeerKAT para detectar gases de hidrogênio a bilhões de anos-luz de distância, provenientes de uma época em que o universo era bilhões de anos mais jovem.", "titulo_pt": "Cientistas detectam sinais de hidrogênio de bilhões de anos atrás. Isso poderia nos ajudar a mapear o universo?", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 146585, "titulo": "Shoreline scavenger shows biological effects after eating plastic foam", "url": "https://phys.org/news/2026-09-shoreline-scavenger-biological-effects-plastic.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T20:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Kyushu relataram no jornal Marine Pollution Bulletin que roedores da praia, um escavador comum da linha costeira, que consumiram poliestireno expandido (EPS) não apresentaram redução significativa na longevidade, mas seus intestinos mostraram expressão alterada de genes envolvidos na defesa química, reparo do DNA e digestão. Microorganismos rares foram encontrados apenas nos roedores que consumiram EPS.", "titulo_pt": "Coletor de praia demonstra efeitos biológicos após consumir espuma de poliestireno", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 146586, "titulo": "Do games make children more attentive or more distractible?", "url": "https://phys.org/news/2026-09-games-children-attentive-distractible.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa em crianças pré-escolares mostrou que jogos digitais ou tradicionais breves melhoraram o desempenho em tarefas que exigiam respostas rápidas, mas reduziram o desempenho em tarefas que exigiam maior concentração e autocontrole.", "titulo_pt": "Jogos melhoram a reação rápida, mas diminuem a concentração e autocontrole em crianças?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 146587, "titulo": "Periodical cicadas may be doomed to extinction", "url": "https://phys.org/news/2026-09-periodical-cicadas-doomed-extinction.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cada 13 ou 17 anos, nuvens de cigarras saem da terra, cobrindo árvores e florestas com seus corpos pretos, asas tingidas de laranja e olhos rubi. É um maravilhoso fenômeno biológico único no reino dos insetos.", "titulo_pt": "As cigarras cicádicas podem estar condenadas à extinção", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 146588, "titulo": "AI helps reveal the immersive sensory experiences of ancient Etruscan tombs", "url": "https://phys.org/news/2026-09-ai-reveal-immersive-sensory-ancient.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As tumbas pintadas etruscas em Tarquinia, na Itália, datam do primeiro milênio a.C. e são conhecidas por suas cenas vívidas de música, festas, procissões e o além. Embora tenham sido estudadas extensivamente, os arqueólogos geralmente analisam as pinturas como imagens a decodificar, em vez de como partes de uma experiência que as pessoas percorriam.", "titulo_pt": "IA ajuda a revelar as experiências sensoriais imersivas das tumbas etruscas antigas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 146589, "titulo": "Before mixing starts, initial catalyst structure governs fuel-cell ink dispersion", "url": "https://phys.org/news/2026-09-catalyst-fuel-cell-ink-dispersion.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Kanazawa, Universidade de Tóquio e HORIBA, Ltd., demonstraram que o estado inicial das partículas de catalisador platina-sobre-carvão (Pt/C) antes de serem misturadas com um ionomer influencia significativamente como a tinta do catalisador de células de combustível a eletrólito polimérico (PEFC) se desenvolve posteriormente. O artigo foi publicado no Journal of Chemical Engineering.", "titulo_pt": "Antes da mistura começar, o estado inicial do catalisador determina a dispersão da tinta do célula de combustível", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 146591, "titulo": "How Mercury formed its graphite crust and core", "url": "https://phys.org/news/2026-09-mercury-graphite-crust-core.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos conduzidos por pesquisadores da Universidade da Liège e KU Leuven, utilizando petrologia experimental, estão explorando os primeiros estágios da evolução de Mercúrio, incluindo a formação do núcleo do planeta, a cristalização do oceano de magma e a formação da crosta de grafite. Os resultados dessas pesquisas foram publicados em Earth and Planetary Science Letters, Nature Communications e Advances in Geochemistry and Cosmochemistry.", "titulo_pt": "Como mercúrio formou sua crosta de grafite e seu núcleo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 146604, "titulo": "NASA Ames Fire Department Aircraft Firefighting Training", "url": "https://www.nasa.gov/news-release/nasa-ames-fire-department-aircraft-firefighting-training/", "fonte_id": "nasa_news", "data_pub": "2026-09-04T19:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A equipe de bombeiros do Centro de Pesquisas Ames da NASA, na Califórnia, realizará treinamento com um simulador de incêndio de avião alimentado a gás depropano no Aeroporto Federal Moffett de 8 a 11 de setembro. O treinamento ocorrerá das 8h às 20h horário do Pacífico.", "titulo_pt": "Treinamento de combate a incêndios de avião pela equipe de bombeiros do Ames", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 146592, "titulo": "El Niño set to bring warmer spring to NZ and Australia", "url": "https://phys.org/news/2026-09-el-nio-warmer-nz-australia.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O El Niño está estabelecido e deve intensificar-se em um evento muito forte nos próximos meses, com impactos significativos nas precipitações e nas temperaturas, aumentando os riscos de inundações, secas e calor extremo, conforme informado pela Organização Meteorológica Mundial (OMM).", "titulo_pt": "El Niño promete trazer primavera mais quente para nova zelândia e austrália", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 146593, "titulo": "Embedded platinum channels bring nanoscale spin-based thermoelectric conversion to bulk materials", "url": "https://phys.org/news/2026-09-embedded-platinum-channels-nanoscale-based.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de pesquisa da NIMS e da Universidade de Tóquio desenvolveu um novo composto em que interfaces tridimensionais nanoescamosas são distribuídas ao longo do material através do revestimento das superfícies de pozzos de ímã isolante com um metal e soldagem. Usando esta estrutura, a equipe conseguiu observar a conversão termoelétrica impulsionada por spins em um isolante, um fenômeno anteriormente observado apenas em interfaces de filme fino nanoscale, em um material macroscale.", "titulo_pt": "Canais de platina incorporados trazem conversão termoelétrica baseada em spins a escala nanoscale para materiais em massa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 146168, "titulo": "Tico Santa Cruz pede para público ‘vibrar’ pela democracia no Rock in Rio", "url": "https://veja.abril.com.br/cultura/tico-santa-cruz-pede-para-publico-vibrar-pela-democracia-no-rock-in-rio/", "fonte_id": "veja", "data_pub": "2026-09-04T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artista Tico Santa Cruz se apresentou no Rock in Rio, no Palco Sunset, ao lado do Biquini Caiçara, pedindo para o público vibrar pela democracia.", "titulo_pt": "Tico Santa Cruz pede para público 'vibrar' pela democracia no Rock in Rio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 146624, "titulo": "Yeat Appears to Diss Travis Scott on New Track “On Nothing”", "url": "https://pitchfork.com/story/yeat-appears-to-diss-travis-scott-on-new-track-on-nothing/", "fonte_id": "pitchfork", "data_pub": "2026-09-04T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Yeat sugere diss Tracker Scott em nova faixa 'On Nothing', indicando que vai apagar o fogo que ele considera inútil.", "titulo_pt": "Yeat sugere Diss tracker Scott em nova faixa 'On Nothing'", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 146172, "titulo": "Produtora de ‘Dark Horse’ envia à PF conjunto de 25 mil documentos sobre gastos do filme", "url": "https://veja.abril.com.br/brasil/produtora-de-dark-horse-envia-a-pf-conjunto-de-25-mil-documentos-sobre-gastos-do-filme/", "fonte_id": "veja", "data_pub": "2026-09-04T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A produtora responsável pelo filme 'Dark Horse' enviou 25 mil documentos à Polícia Federal para comprovar que os recursos destinados ao filme no Brasil foram investidos corretamente.", "titulo_pt": "Produtora de 'Dark Horse' envia 25 mil documentos à PF", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 146107, "titulo": "MIS exibe filme 'O Convite' em sessã
