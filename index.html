ema comum no setor audiovisual brasileiro, relacionado à escassez de recursos e incertezas sobre direitos autorais.", "titulo_pt": "Site Roteiroteca vai reunir textos de filmes e séries brasileiros de forma gratuita", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 198332, "titulo": "Emmy faz acordo com o Prime Video e não será mas transmitido na TV aberta", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/emmy-faz-acordo-com-o-prime-video-e-nao-sera-mas-transmitido-na-tv-aberta.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-06T15:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Prime Video adquiriu os direitos de transmissão do Emmy a partir do próximo ano, exibindo a premiação exclusivamente em seu serviço de streaming globalmente e de forma gratuita.", "titulo_pt": "Emmy faz acordo com o Prime Video e não será mais transmitido na TV aberta", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 198562, "titulo": "Paro en la línea A de subte: a partir de qué hora comienza la medida de fuerza de hoy, martes 6 de octubre", "url": "https://www.lanacion.com.ar/sociedad/paro-en-la-linea-a-de-subte-a-partir-de-que-hora-comienza-la-medida-de-fuerza-de-hoy-martes-6-de-nid06102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-06T17:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O paro na linha A do metrô começará às 19h. A posição das entidades envolvidas foi anunciada.", "titulo_pt": "Paro na linha A do metrô: A partir de que hora começa A medida de força de hoje, terça-feira 6 de outubro", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 198570, "titulo": "Incendios, disturbios y jóvenes mutilados en una violenta jornada de protestas estudiantiles que sacude al país", "url": "https://www.lanacion.com.ar/el-mundo/francia-enfrenta-la-mayor-jornada-de-protesta-y-crece-la-tension-por-la-represion-policial-tras-la-nid06102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-06T17:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Entre 256.000 e 450.000 pessoas participaram de protestos estudiantis violentos, levando a incêndios, disturbios e graves ferimentos, incluindo jovens mutilados. Houve milhares de detenções e a atuação da polícia gerou controvérsia.", "titulo_pt": "Incêndios, distúrbios e jovens mutilados em violentos protestos estudiantis que sacodem o país", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 198487, "titulo": "Idosa perde casa em terremoto e constrói outra de 10 metros quadrados com garrafas plásticas", "url": "https://www.cnnbrasil.com.br/curiosidades/idosa-perde-casa-em-terremoto-e-constroi-outra-de-10-metros-quadrados-com-garrafas-plasticas/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "María Ponce, uma idosa de El Salvador, construiu uma casa de 10 metros quadrados usando garrafas plásticas recolhidas. O uso de garrafas PET na construção é objeto de pesquisas.", "titulo_pt": "Idosa constrói casa de 10 metros quadrados com garrafas plásticas após terremoto", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 199135, "titulo": "Americas advance on healthy aging, but gaps remain as 2030 approaches", "url": "https://www.paho.org/en/news/6-10-2026-americas-advance-healthy-aging-gaps-remain-2030-approaches", "fonte_id": "paho", "data_pub": "2026-10-06T17:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A América avançou em relação ao envelhecimento saudável, mas ainda existem gaps antes de 2030. O relatório destaca que, à medida que se aproxima o ano de 2030, persistem desigualdades no processo de envelhecimento saudável na região.", "titulo_pt": "América avança em envelhecimento saudável, mas gaps persistem até 2030", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 198435, "titulo": "Casal discute e homem esfaqueia namorada, foge mas acaba preso pela polícia", "url": "https://www.metropoles.com/distrito-federal/na-mira/casal-discute-e-homem-esfaqueia-namorada-foge-mas-acaba-preso-pela-policia", "fonte_id": "metropoles", "data_pub": "2026-10-06T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher de 27 anos foi esfaqueada no pescoço e nas costas pelo seu namorado de 22 anos, que fugiu após o ataque, mas foi preso pela polícia em flagrante.", "titulo_pt": "Casal discute e homem esfaqueia namorada, foge mas acaba preso pela polícia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 198501, "titulo": "Protestos na França escalam após adolescente perder a mão em confrontos", "url": "https://www.cnnbrasil.com.br/internacional/protestos-na-franca-escalam-apos-adolescente-perder-a-mao-em-confrontos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Protestos na França continuam após um adolescente de 14 anos ficar gravemente ferido durante confrontos. Organizações de direitos humanos criticam o uso desproporcional da força policial.", "titulo_pt": "Protestos na França escalam após adolescente de 14 anos ficar gravemente ferido", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 198798, "titulo": "Hundreds of thousands demonstrate across France for better education", "url": "https://www.lemonde.fr/en/france/article/2026/10/06/hundreds-of-thousands-demonstrate-across-france-for-better-education_6758289_8.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-06T16:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas demonstraram em todo o país francês em prol de uma educação melhor. Os organizadores estimaram que 450 mil pessoas tenham participado, enquanto o ministério do Interior relatou um número de 256 mil.", "titulo_pt": "Milhares demonstram em França por melhor educação", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 198665, "titulo": "‘This is state violence’: Paris students rage at politicians and heavy-handed policing", "url": "https://www.theguardian.com/world/2026/oct/06/french-student-protests-barricades-paris-police", "fonte_id": "guardian_world", "data_pub": "2026-10-06T16:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos inéditos em uma suburbio de baixa renda de Paris estão se tornando violentos, com investigações sendo realizadas sobre abusos policiais. Pupilos da escola Lycée Sophie-Germain construíram uma barricada com caixas de lixo e carrinhos de compras, expondo demandas por maior financiamento e igualdade nas escolas francesas.", "titulo_pt": "Isso é violência estatal: estudantes de paris se revoltam contra políticos e policiamento rigoroso", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 198455, "titulo": "Milhares de estudantes tomam as ruas em defesa da educação na França", "url": "https://www.brasildefato.com.br/2026/10/06/milhares-de-estudantes-tomam-as-ruas-em-defesa-da-educacao-na-franca/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-06T15:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta terça-feira (6), cerca de 90 mil estudantes secundaristas e universitários participam de protestos em diferentes regiões da França. Este é o terceiro dia de manifestações nacionais consecutivas, após duas grandes mobilizações em 29 de setembro e 1º de outubro.", "titulo_pt": "Milhares de estudantes tomam as ruas em defesa da educação na França", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 198607, "titulo": "Experto internacional destaca el “botón de pánico” como herramienta para prevenir el juego problemático", "url": "https://www.latercera.com/branded/noticia/experto-internacional-destaca-el-boton-de-panico-como-herramienta-para-prevenir-el-juego-problematico/", "fonte_id": "la_tercera", "data_pub": "2026-10-06T13:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um especialista neerlandês destaca o uso de mecanismos como o 'botão de pânico' como ferramenta para prevenir o jogo problemático, em meio ao debate sobre a falta de regulamentação das plataformas de apostas digitais. Esses mecanismos buscam fortalecer o Jogo Responsável em cassinos.", "titulo_pt": "Especialista destaca 'botão de pânico' como ferramenta para prevenir o jogo problemático", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 199003, "titulo": "French school unrest: students, teachers march on biggest day of protests", "url": "https://www.scmp.com/news/world/europe/article/3369936/french-school-unrest-students-teachers-march-biggest-day-protests?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-06T11:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos em escolas francesas foram realizados por estudantes, professores e pais em várias cidades, incluindo Marselha e Nantes, em um dos dias mais significativos de manifestações contra salas de aula sobrecarregadas e deterioradas. A polícia usou gás lacrimogêneo para dispersar manifestantes que bloquearam escolas de nível médio.", "titulo_pt": "Descontentamento na França: estudantes, professores e pais marcham em dia de protestos mais amplos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 199009, "titulo": "Hong Kong’s Generation Y unhappiest amid housing and economic pressures, poll finds", "url": "https://www.scmp.com/news/hong-kong/society/article/3369930/hong-kongs-generation-y-unhappiest-amid-housing-and-economic-pressures-poll-finds?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-06T10:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os residentes de Hong Kong na geração Y, entre 30 e 45 anos, são considerados os menos felizes da cidade, de acordo com uma pesquisa que aponta insatisfação com as condições econômicas e imobiliárias. O Índice de Felicidade de Hong Kong ficou em 5,87 de 10, em uma pesquisa de 1.039 adultos realizada pela HK.WeCare, uma iniciativa da Wofoo Social Enterprises.", "titulo_pt": "Geração Y de hong Kong é a menos feliz, devido a problemas econômicos e imobiliários, pesquisa mostra", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 197951, "titulo": "Student riots engulf France as far-right presidential frontrunner Le Pen vows fiscal turnaround", "url": "https://www.cnbc.com/2026/10/06/france-student-protests-budget.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-06T09:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Manifestações estudantis se espalharam por toda a França, com mais de 5.000 pessoas detidas. Um adolescente teria perdido uma mão durante os protestos.", "titulo_pt": "Manifestações estudantis tomam França e far-right de Le Pen promete reverter situação fiscal", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 197568, "titulo": "Estudantes voltam às ruas na França em dia nacional de protestos", "url": "https://www.cnnbrasil.com.br/internacional/estudantes-voltam-as-ruas-na-franca-em-dia-nacional-de-protestos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T09:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudantes franceses realizaram protestos em todo o país contra a falta de funcionários e infraestrutura precária nas escolas. Eles exigem investimentos da gestão de Emmanuel Macron.", "titulo_pt": "Estudantes voltam às ruas na França em dia nacional de protestos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 197647, "titulo": "Carlos Spina, vicepresidente de CEDU-AEV: “Cuando financiamos una vivienda nueva, ese dinero se transforma en tierra, proyecto, obra, materiales, transporte, proveedores, profesionales, impuestos y empleo formal registrado”", "url": "https://www.lanacion.com.ar/propiedades/casas-y-departamentos/carlos-spina-vicepresidente-de-cedu-aev-cuando-financiamos-una-vivienda-nueva-ese-dinero-se-nid06102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-06T09:43:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Carlos Spina, vice-presidente da CEDU-AEV, afirma que o financiamento de uma nova residência transforma o dinheiro em diversos elementos econômicos. Se uma parte crescente do aporte de longo prazo financiar hipotecas de casas novas, o efeito será multiplicado.", "titulo_pt": "Carlos Spina, vice-presidente da CEDU-AEV: 'quando financiamos uma vivienda nueva, ese dinero se transforma en tierra, proyecto, obra, materiales, transporte, proveedores, profesionales, impuestos y empleo formal registrado'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 197513, "titulo": "MP denuncia líderes de organizada do Bahia por tortura com taco e martelo", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/taco-e-martelo-mp-denuncia-lideres-de-organizada-do-bahia-por-tortura", "fonte_id": "metropoles", "data_pub": "2026-10-06T09:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As autoridades apuram a prática de tortura física e psicológica dentro da sede da torcida organizada do Bahia contra duas vítimas. O Ministério Público denunciou os líderes da organizada por esses atos abusivos.", "titulo_pt": "MP denuncia líderes de torcida organizada do Bahia por tortura com taco e martelo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 198553, "titulo": "Sembraron 30.000 pejerreyes en una laguna bonaerense que busca recuperar la pesca y el turismo", "url": "https://www.clarin.com/informacion-general/sembraron-30000-pejerreyes-laguna-bonaerense-busca-recuperar-pesca-turismo_0_qZeRFsmDaX.html", "fonte_id": "clarin", "data_pub": "2026-10-06T17:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um projeto implantou 30.000 pejerreyes em uma lagoa bonaerense com o objetivo de fortalecer a população de peixes e recuperar o ecossistema, visando também promover o turismo local.", "titulo_pt": "Foram plantados 30.000 pejerreyes em uma lagoa bonaerense para fortalecer a pesca e promover o turismo", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 198804, "titulo": "Finland orders halt to work on Google data centers over environmental concerns", "url": "https://www.lemonde.fr/en/international/article/2026/10/06/finland-orders-halt-to-work-on-google-data-centers-over-environmental-concerns_6758325_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-06T16:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades finlandesas ordenaram que a empresa representante do gigante americano Google na Finlândia pare com a construção de centrais de dados até que possa comprovar que está em conformidade com as leis ambientais. Além disso, as autoridades estão investigando se as árvores e o solo foram removidos antes que a empresa realizasse um estudo de impacto ambiental.", "titulo_pt": "Finlândia ordena paralisação da construção de centrais de dados do Google devido a preocupações ambientais", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 198611, "titulo": "Agrupaciones indígenas y municipios piden revocar permiso ambiental de millonario proyecto de transmisión eléctrica", "url": "https://www.latercera.com/pulso/noticia/agrupaciones-indigenas-y-municipios-piden-revocar-permiso-ambiental-de-millonario-proyecto-de-transmision-electrica/", "fonte_id": "la_tercera", "data_pub": "2026-10-06T14:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O projeto de transmissão elétrica de US$ 324 milhões da Mataquito Transmisora de Energía enfrenta cinco reclamações no Tribunal Ambiental por supostas ilegalidades na aprovação. Simultaneamente, a empresa defende o avanço das obras e apresentou uma nova consulta de pertinência para ajustar mais de cem estruturas.", "titulo_pt": "Grupos indígenas e municípios pedem revogação de licença ambiental de projeto de transmissão elétrica milionário", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 198661, "titulo": "Australia faces summer of extreme weather, Anthony Albanese warns at pre-Cop", "url": "https://www.theguardian.com/australia-news/2026/oct/06/agreement-to-transition-away-from-fossil-fuels-not-open-for-renegotiation-pacific-leader-tells-pre-cop", "fonte_id": "guardian_world", "data_pub": "2026-10-06T11:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro Anthony Albanese advertiu que a Austrália enfrentará um verão perigoso, com possíveis inundações, ciclones e calor extremo, devido ao 'super El Niño' no Pacífico. Ele destacou que isso demonstra a urgência da ação climática, especialmente para os países insulares do Pacífico, como Tuvalu, que já estão sentindo os efeitos do aquecimento global.", "titulo_pt": "Austrália enfrentará verão perigoso devido ao 'super el niño', avisa Albanese", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 198701, "titulo": "America’s tallest, most spectacular trees are getting…heat stroke?", "url": "https://www.vox.com/climate/504991/redwood-tree-california-heat-photosynthesis", "fonte_id": "vox", "data_pub": "2026-10-06T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A floresta de sequoias costeiras é composta por árvores que podem viver por milhares de anos. Suas copas desenvolvem ecossistemas elevados, criando algo semelhante a um segundo solo florestal a centenas de metros acima do solo.", "titulo_pt": "As árvores mais altas e espetaculares dos estados unidos estão... Tendo calor?", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 197705, "titulo": "Para amainar a crise de abstinência, as próximas eleições em outros países", "url": "https://veja.abril.com.br/coluna/mundialista/para-amainar-a-crise-de-abstinencia-as-proximas-eleicoes-em-outros-paises/", "fonte_id": "veja", "data_pub": "2026-10-06T09:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Israel, Estados Unidos e Espanha terão eleições até o fim do ano, com debates entre direita e esquerda. Estas eleições terão grande influência no cenário político desses países.", "titulo_pt": "Para amenizar a crise de abstinência, eleições em israel, EUA e Espanha até o fim do ano", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 197571, "titulo": "Quênia confirma primeiro caso de ebola vindo do Congo; paciente morreu", "url": "https://www.cnnbrasil.com.br/internacional/quenia-confirma-primeiro-caso-de-ebola-vindo-do-congo-paciente-morreu/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T09:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Quênia confirmou o primeiro caso de ebola vindo da República Democrática do Congo, onde o paciente havia residido. Ele chegou a Nairóbi no sábado e 28 pessoas tiveram contato com ele.", "titulo_pt": "Quênia confirma primeiro caso de ebola vindo do Congo; paciente morreu", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 197516, "titulo": "Falta de energia afetará endereços em Santa Maria e Fercal nesta 3ª (6/10)", "url": "https://www.metropoles.com/distrito-federal/falta-de-energia-afetara-enderecos-em-santa-maria-e-fercal-nesta-3a-6-10", "fonte_id": "metropoles", "data_pub": "2026-10-06T09:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta terça-feira (6/10), haverá interrupções temporárias de energia em Santa Maria e Fercal para serviços de melhoria e modernização da rede elétrica e poda de árvores.", "titulo_pt": "Falta de energia afetará endereços em Santa Maria e Fercal nesta terça-feira (6/10)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 197522, "titulo": "Clima: temporais atingem Sul, Sudeste e Centro-Oeste nesta 3ª", "url": "https://www.metropoles.com/brasil/clima-temporais-atingem-sul-sudeste-e-centro-oeste-nesta-3a", "fonte_id": "metropoles", "data_pub": "2026-10-06T08:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Temporais atingem o Sul, Sudeste e Centro-Oeste nesta terça-feira. Conforme o dia avança, as chuvas tendem a abrandar em boa parte do Sul, com precipitações mais persistentes no Paraná.", "titulo_pt": "Temporais atingem Sul, Sudeste e Centro-Oeste nesta terça-feira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 197441, "titulo": "Natura diz que mudança climática na amazônia põe em risco 2,6% da receita líquida", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/10/natura-diz-que-mudanca-climatica-na-amazonia-poe-em-risco-26-da-receita-liquida.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Natura estima que a mudança climática na Amazônia possa comprometer R$ 584,2 milhões em vendas, representando 2,6% da receita líquida da empresa em 2025.", "titulo_pt": "Natura avisa que mudança climática na amazônia pode ameaçar 2,6% da receita líquida", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 198490, "titulo": "França: Grupos de direitos humanos condenam uso da força contra estudantes", "url": "https://www.cnnbrasil.com.br/internacional/franca-grupos-de-direitos-humanos-condenam-uso-da-forca-contra-estudantes/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Emmanuel Macron acionou a polícia de choque em resposta às manifestações de estudantes. Há registros de jovens gravemente feridos e milhares foram detidos.", "titulo_pt": "França: grupos de direitos humanos condenam uso da força contra estudantes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 198657, "titulo": "Outcry in Trinidad and Tobago after passing of police bill that could threaten press freedom", "url": "https://www.theguardian.com/world/2026/oct/06/outcry-in-trinidad-and-tobago-after-passing-of-police-bill-that-could-threaten-press-freedom", "fonte_id": "guardian_world", "data_pub": "2026-10-06T16:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jornalistas em Trinidad e Tobago estão pedindo uma alteração urgente na Lei de Operações Especiais 2026, que aumenta os poderes de busca e apreensão da polícia. Eles argumentam que a lei ameaça a liberdade de imprensa do país.", "titulo_pt": "Alvoroço em Trinidad e Tobago após aprovação de lei que pode ameaçar a liberdade de imprensa", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 198697, "titulo": "Russia Needs to Tell the Truth About a Plague Death", "url": "https://www.theatlantic.com/ideas/2026/10/russia-siberia-pneumonic-plague/688895/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-06T16:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois de um suposto acidente de laboratório na Sibéria, Moscou está voltando para seus métodos soviéticos antigos. A frase sugere que a Rússia está adotando uma abordagem evasiva sobre a morte devido a um possível acidente de laboratório no norte do país.", "titulo_pt": "Rússia precisa dizer a verdade sobre uma morte por praga", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 198702, "titulo": "Los nombres cambian, Brasil permanece", "url": "https://www.ciperchile.cl/2026/10/06/los-nombres-cambian-brasil-permanece/?utm_source=rss&utm_medium=rss&utm_campaign=los-nombres-cambian-brasil-permanece", "fonte_id": "ciper_chile", "data_pub": "2026-10-06T16:09:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O título do artigo original em espanhol é 'Los nombres cambian, Brasil permanece'. O texto trata da continuidade do Brasil, apesar de mudanças nos nomes envolvidos.", "titulo_pt": "Os nomes mudam, Brasil permanece", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 197816, "titulo": "Kenya confirms first Ebola case and says patient has died", "url": "https://www.theguardian.com/world/2026/oct/06/kenya-first-ebola-case-death-drc", "fonte_id": "guardian_world", "data_pub": "2026-10-06T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kenya confirmou seu primeiro caso de Ebola, envolvendo um cidadão keniata que havia estado na República Democrática do Congo. O paciente faleceu e 28 contatos foram identificados, incluindo familiares e profissionais de saúde.", "titulo_pt": "Kenya confirma primeiro caso de Ebola e relata óbito", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 197605, "titulo": "Como a guerra aumentou a violência sexual e os casamentos forçados de meninas e mulheres em Gaza", "url": "https://www.bbc.com/portuguese/articles/c8ly4yd5xkkpo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-06T08:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A convivência com desconhecidos e a falta de privacidade nos abrigos em Gaza têm sido acompanhadas por relatos de assédio e abuso sexual. Muitas famílias têm optado pelo casamento forçado de suas filhas como forma de proteção e preservação da reputação familiar.", "titulo_pt": "Como a guerra aumentou a violência sexual e os casamentos forçados de meninas e mulheres em Gaza", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 197927, "titulo": "Discovery of 11 bodies in Johannesburg exposes scale of violence against women", "url": "https://www.lemonde.fr/en/le-monde-africa/article/2026/10/06/discovery-of-11-bodies-in-johannesburg-exposes-scale-of-violence-against-women_6758291_124.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-06T08:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde julho, corpos de mulheres encontrados nus ou semi-nus, e brutalmente espancados, foram descobertos nos arredores da capital sul-africana. A realidade cruel da violência diária contra as mulheres no país se tornou inegável.", "titulo_pt": "Descoberta de 11 corpos em joanesburgo expõe escala da violência contra mulheres", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 198214, "titulo": "More than 1,900 children orphaned or separated from their families by Ebola in eastern DR Congo – UNICEF", "url": "https://www.unicef.org/press-releases/more-1900-children-orphaned-or-separated-their-families-ebola-eastern-dr-congo", "fonte_id": "unicef", "data_pub": "2026-10-06T08:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 1.900 crianças foram deixadas órfãs ou separadas de suas famílias devido à Ebola nas regiões de Ituri e North Kivu. O UNICEF está pedindo fundos urgentes para proteger as crianças que ficaram sem cuidados.", "titulo_pt": "Mais de 1.900 crianças órfãs ou separadas de suas famílias por Ebola em oriental da república democrática do Congo - UNICEF", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 198215, "titulo": "\"Ebola takes the people children depend on and unravels their lives” – UNICEF", "url": "https://www.unicef.org/press-releases/ebola-takes-people-children-depend-and-unravels-their-lives-unicef", "fonte_id": "unicef", "data_pub": "2026-10-06T07:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A comunicação-chefe da UNICEF na República Democrática do Congo, Halimatou Amadou, falou sobre como a Ebola remove as pessoas que as crianças dependem, desestruturando suas vidas. Essa foi a conclusão de uma conferência de imprensa realizada hoje no Palácio das Nações em Genebra.", "titulo_pt": "Ebola remove as pessoas que as crianças dependem e desestrutura suas vidas – UNICEF", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 198122, "titulo": "S. Korea has 52 death row inmates, average age of 58.7", "url": "https://en.yna.co.kr/view/AEN20261006006100315", "fonte_id": "yonhap_news", "data_pub": "2026-10-06T06:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "South Korea possui 52 condenados à morte com umidade média de 58,7 anos. As execuções foram suspensas no país há aproximadamente 30 anos.", "titulo_pt": "Coreia do sul tem 52 condenados à morte, com idade média de 58,7 anos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 197817, "titulo": "Tigray rebel groups ‘forcibly recruiting boys as young as 15’ as fighting spreads", "url": "https://www.theguardian.com/global-development/2026/oct/06/ethiopia-tigray-conflict-tplf-rebels-forcibly-recruit-boys-war-crimes", "fonte_id": "guardian_world", "data_pub": "2026-10-06T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatos indicam que grupos rebeldes na região de Tigray estão forçando a recruta de meninos com 15 anos ou menos. O conflito entre o governo federal etíope e o Tigray People's Liberation Front, que governava a região, ressurgiu em 23 de setembro, ameaçando uma nova crise humanitária.", "titulo_pt": "Grupos rebeldes na tigray estariam forçando a recruta de meninos de 15 anos ou menos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 198003, "titulo": "UN rights council condemns attacks on civilians in Sudan, calls for truce", "url": "https://www.aljazeera.com/news/2026/10/6/un-rights-council-condemns-attacks-on-civilians-in-sudan-calls-for-truce?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-06T02:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A assembleia dos direitos humanos condenou os ataques contra civis no Sudão e pediu um cessar function toggleDrill(id) {

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">

    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
