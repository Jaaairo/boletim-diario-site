<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "19/11/2026 07:49", "stats": {"noticias_novas": 849, "resumos_gerados": 237}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O governo Lula enfrenta desafios com o pacote de ajuste fiscal, aprovado pelo Senado e agora em análise na Câmara dos Deputados. O projeto, chamado de 'plano Moretti', visa equilibrar as contas públicas sem prejudicar as políticas sociais essenciais. O Supremo Tribunal Federal (STF) também está sob pressão, com relatórios da Polícia Federal sobre ministros do STF no caso Master sendo encaminhados à Procuradoria-Geral da República (PGR) para análise. Além disso, o STF deve discutir a modulação de efeitos do Tema 69, que afetará decisões sobre ISS e PIS/Cofins. Na arena política, o PSB e o PDT formalizaram uma federação para as eleições de 2028 e 2030, fortalecendo suas posições no Congresso.", "mundo": "Os líderes dos Estados Unidos, Donald Trump, da Rússia, Vladimir Putin, e da China, Xi Jinping, realizaram um histórico encontro trilateral em Shenzhen, China, durante a cúpula da APEC. O encontro, focado na redução de armas nucleares, marcou a primeira reunião entre os três maiores detentores de armas nucleares do mundo. Xi Jinping propôs mecanismos para evitar conflitos, enquanto Trump expressou desconfiança em abandonar armas nucleares, apesar das sugestões do chinês. O encontro ocorreu em um contexto de tensões geopolíticas, com a Rússia reconsiderando suas relações com a ASEAN e o Japão se encontrando com Putin após a invasão da Ucrânia. Além disso, a Comissão Europeia propôs um empréstimo de 45 bilhões de euros para a Ucrânia para ajudar a evitar uma crise de caixa e fortalecer as defesas do país, enquanto a Rússia continua bombardeando o país.\n\nOs líderes dos Estados Unidos, China e Rússia se reuniram em Shenzhen, China, em 19 de novembro de 2026, em uma cúpula trilateral histórica. O encontro foi focado em temas globais como a redução das armas nucleares e a estabilidade regional. Durante o encontro, Donald Trump destacou as grandes responsabilidades de resolver problemas globais, enquanto Xi Jinping enfatizou a importância da harmonia entre grandes potências para a paz mundial. O encontro, que ocorreu durante as celebrações da APEC, foi considerado significativo pela primeira vez envolvendo os três líderes em uma reunião tripartite. Além disso, o presidente chinês Xi Jinping enfatizou a 'significância pioneira' da reunião, indicando que a harmonia entre grandes potências traz paz ao mundo, enquanto conflitos entre elas causam caos. Apesar da Coreia do Norte não estar presente, ela provavelmente foi um dos temas centrais das discussões, com os líderes discutindo potenciais medidas para mitigar tensões regionais e internacionais.", "economia": "A economia global enfrenta diversos desafios e realizações, conforme relatado nos artigos. A empresa Novartis elevou suas projeções de vendas para medicamentos-blockbuster para US$ 18 bilhões, devido à forte demanda. A Japan Tobacco sofreu um prejuço operacional de 36,8 bilhões de ienes devido a uma multa relacionada à apreensão de produtos na Rússia. A Coreia do Sul viu suas exportações ultrapassarem pela primeira vez os 1 trilhão de dólares, impulsionadas pela forte demanda por chips. A Anthropic levantou US$ 81 bilhões em uma oferta inicial de ações recorde, avaliando a companhia em US$ 1,5 trilhão, criando milhares de novos milionários no Vale do Silício. O Brasil pediu à OMC que julgue o tarifaço imposto pelos EUA, enquanto a Copel não planeja investir em novos parques eólicos enquanto persistirem cortes de geração. O setor nuclear cobra espaço nas metas climáticas da COP31, pressionando para que a energia atômica seja incluída nas decisões sobre metas climáticas. Além disso, a regra dos EUA que exige licença para a exportação de chips avançados de inteligência artificial entra em vigor, potencialmente atrasando compras no Brasil. Ainda, a regra do mercado livre de energia introduzira uma nova dinâmica entre o consumidor e o setor elétrico, trazendo liberdade para escolher e segurança para decidir.", "tecnologia": "A Anthropic realizou uma IPO recorde de US$ 81,3 bilhões, valendo a empresa mais de US$ 1 trilhão, refletindo a crescente importância da IA no mercado financeiro. Este evento levanta preocupações sobre a expansão da competição global, especialmente com rivais chineses mais baratos. As bolsas de Seul encerraram o dia em alta, lideradas por ganhos no setor de tecnologia, em vista do IPO iminente da Anthropic. Por outro lado, a LG Group manteve a maioria dos CEOs de suas subsidiárias e elevou talentos na pesquisa e desenvolvimento em sua remodelação executiva de 2027, anunciando 132 promoções, incluindo 89 novas posições. A LG Display cancelou seu plano de investimento de 3 trilhões de wons em tecnologia OLED, afetando o desenvolvimento de tecnologias avançadas na Coreia do Sul. Além disso, a Intel firmou seu primeiro contrato com um cliente externo para seus processadores 18A avançados, enquanto a Nvidia elevou suas projeções financeiras e afirmou que pode prosperar sem a liderança de Huang, gerando incertezas sobre o impacto em Taiwan.", "ciencia": "Um estudo recente indica que a fertilização in vitro não afeta negativamente o desenvolvimento e a saúde a longo prazo dos filhos, comparados a bebês concebidos naturalmente. Em outro avanço, cientistas desenvolveram um tratamento com campos magnéticos que pode ajudar a combater o Parkinson, permitindo atuar em regiões profundas do cérebro sem a necessidade de implantes permanentes de eletrodos. Um estudo sugere que células imunológicas se comportam de maneira diferente entre homens e mulheres em relação à obesidade, o que pode ajudar na compreensão da condição e na busca por novas formas de melhorar a saúde metabólica. Além disso, um novo estudo financiado pela NASA revelou que rochas de Marte encontradas no deserto do Saara indicam a presença de fluidos no planeta há 4,1 bilhões de anos, fornecendo novas informações sobre a história geológica do planeta vermelho. O Voyager 1, da NASA, atingiu uma distância equivalente a um dia-luz da Terra após 49 anos no espaço, marcando um marco histórico na exploração espacial.", "cultura": "O evento mais importante dos artigos é a venda recorde de uma pintura de Van Gogh. 'Castanheiros em flor', uma obra do artista holandês pintada em 1890, foi vendida por R$ 1,1 bilhão em um leilão realizado pela Sotheby's em Nova York, batendo o recorde de valor de uma venda em leilão. A pintura foi vendida após um longo desentendimento entre os proprietários atuais e os herdeiros de uma família judia que venderam a obra sob o regime nazista em 1936, conforme relatado pelo Le Monde. Em outro destaque, o Festival Animage, em sua 16ª edição, reúne mais de 280 filmes de animação de 60 países em Recife, com exibições em 11 locais, incluindo sessões ao ar livre, de 20 de novembro a 29 de novembro. Além disso, a artista Bela Gil anuncia sua saída do programa Saia Justa, causando emoção entre as outras participantes. No campo da literatura, o escritor Jeferson Tenório defende sua classificação como 'literatura negra', argumentando que sua obra aborda temas além da questão racial.", "sociedade": "Um dos principais temas abordados nos artigos é o triple femicídio em Barracas, na Argentina, onde Justo Fernando Barrientos, de 70 anos, foi condenado à prisão perpétua por matar três mulheres por serem lesbianas. Este caso levanta questões sobre a discriminação e violência de gênero. Em seguida, destaca-se o feriado da Consciência Negra no Distrito Federal, onde a maioria dos serviços públicos funcionará parcialmente, e os direitos dos trabalhadores que trabalham neste dia são discutidos, com a possibilidade de receberem o salário em dobro ou uma folga compensatória. Também são mencionados casos como a explosão de uma caldeira em uma fábrica da Klabin em Santa Catarina, que levou a hospitalização de dez trabalhadores, e a briga entre uma vendedora de trufas e uma funcionária da ViaMobilidade, onde a suspeita foi presa em flagrante. Outros eventos destacados incluem a troca de gestão do Hospital Evangélico de Pituba no Distrito Federal, com a promessa de aumentar em 25% os atendimentos, e a legalização de um fundo para medicamentos contra o câncer em Taiwan, entre outros assuntos de interesse público.", "meio_ambiente": "No penúltimo dia da COP31, os debates se concentraram em investimentos, justiça climática e soluções práticas, com negociações em andamento na reta final. A ministra do Meio Ambiente do Nepal, Gita Chaudhary, enfatizou a urgência de justiça climática e a responsabilidade dos países mais poluentes, após a tragédia climática que deixou mais de 1.400 mortos e causou perdas equivalentes a 10% do PIB do país. A conferência termina oficialmente na sexta-feira, com expectativa por uma decisão importante. Em Minas Gerais, um decreto foi emitido reconhecendo a responsabilidade compartilhada no licenciamento ambiental, servindo como modelo para outros estados. As inundações recentes na região de Prachinburi, na Tailândia, revelaram problemas de poluição por resíduos na 'área de descarte de lixo', localizada entre Bangkok e a principal zona industrial do leste do país. Além disso, o fenômeno El Niño deve afetar as áreas mais vulneráveis do Brasil, especialmente aquelas com menor capacidade de adaptação às mudanças climáticas, levando o governo a mobilizar equipes para monitorar a situação.", "direitos_humanos": "Um em cada quatro mulheres no mundo inteiro não pode negar consentimento sexual se seu marido ou parceiro exigir, de acordo com um relatório da UNFPA. Na África ocidental e central, quase metade das mulheres (45%) não podem dizer não em seus próprios casamentos. O direito à negação sexual é um dos temas mais importantes abordados no contexto dos direitos humanos. Além disso, a lei italiana contra o antisemitismo, aprovada em 17 de novembro, foi criticada por confundir o discurso de ódio com a crítica à política israelense. Em outro desenvolvimento, a lei aprovada no Bahrein acusa dezenas de clérigos xiitas de conspirar com o Irã, levantando preocupações sobre tortura e confissões forçadas. As Nações Unidas advertiram que a lei poderia desvincular todos os advogados do instituto, o que poderia limitar a autonomia e as faculdades do organismo."}, "resumo_do_dia": {"politica_nacional": [{"id": 273933, "titulo": "O Supremo entre a supremocracia e as onze ilhas digitais", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-supremo-entre-a-supremocracia-e-as-onze-ilhas-digitais", "fonte_id": "jota", "data_pub": "2026-11-19T09:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2025, o Tribunal Supremo processou mais de 118 mil decisões, julgou 23 mil delas em colegiado e tomou 107 decisões com os ministros na mesma sala.", "titulo_pt": "O Supremo entre a supremocracia e as onze ilhas digitais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 273861, "titulo": "Justiça livra Renan Santos de multas em processo movido por Wesley Safadão", "url": "https://www.metropoles.com/brasil/justica-livra-renan-santos-de-multas-em-processo-movido-por-wesley-safadao", "fonte_id": "metropoles", "data_pub": "2026-11-19T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal de Justiça do Ceará derrubou a proibição que impedia Renan Santos de fazer novas postagens sobre Wesley Safadão. A decisão segue o entendimento do ministro Gilmar Mendes, do Supremo Tribunal Federal.", "titulo_pt": "Justiça libera Renan Santos de multas em processo contra Wesley Safadão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 273864, "titulo": "Lula leva o pacote e o mercado chora o tesouraço", "url": "https://www.metropoles.com/blog-do-noblat/ricardo-noblat/lula-leva-o-pacote-e-o-mercado-chora-o-tesouraco", "fonte_id": "metropoles", "data_pub": "2026-11-19T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "José Guimarães articulou em plenário, Cid Gomes criticou o Banco Central e houve pressa para aprovar o pacote antes do novo Congresso.", "titulo_pt": "Lula leva o pacote e o mercado chora a saída do tesoureiro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 273866, "titulo": "Governo Lula tenta vencer resistências e concluir votação do ajuste fiscal", "url": "https://www.metropoles.com/brasil/governo-lula-tenta-vencer-resistencias-e-concluir-votacao-do-ajuste-fiscal", "fonte_id": "metropoles", "data_pub": "2026-11-19T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula busca acordos para concluir a votação do ajuste fiscal, mantendo o texto aprovado pelo Senado e permitindo a implementação de medidas que podem melhorar as contas públicas até 2026.", "titulo_pt": "Governo Lula tenta concluir votação do ajuste fiscal", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 273868, "titulo": "Apoiadores de Lula recebem multas de R$ 3 mil em ato de vitória no interior", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/apoiadores-de-lula-recebem-multas-de-r-3-mil-em-ato-de-vitoria-no-interior", "fonte_id": "metropoles", "data_pub": "2026-11-19T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Prefeitura de uma cidade no interior de São Paulo multou veículos envolvidos em uma comemoração pela vitória de Lula no segundo turno das eleições, com cerca de 200 multas aplicadas.", "titulo_pt": "Apoiadores de Lula recebem multas de R$ 3 mil após comemoração na vitória no interior de sp", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 273719, "titulo": "Integrantes do STF esperam que relatórios da PF esvaziem parte da discussão na corte sobre caso Master", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/integrantes-do-stf-esperam-que-relatorios-da-pf-esvaziem-parte-da-discussao-na-corte-sobre-caso-master.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ministros do STF consideram baixas as chances de Edson Fachin apresentar todos os novos relatórios da Polícia Federal que mencionam integrantes da corte durante as sessões plenárias. Interlocutores avaliam que os relatórios podem esvaziar parte da discussão na corte sobre o caso Master.", "titulo_pt": "Integrantes do STF consideram baixas as chances de relatórios da PF esvaziarem discussão sobre caso Master", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 273720, "titulo": "Stedile, do MST, chama ajuste fiscal de enganação e defende ministros mais jovens e representativos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/stedile-do-mst-chama-ajuste-fiscal-de-enganacao-e-defende-ministros-mais-jovens-e-representativos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "João Pedro Stedile, fundador do MST, critica a proposta de ajuste fiscal do governo, chamando-a de enganação. Ele questiona a falta de discussão com as bancadas da coligação que reelegeu Lula.", "titulo_pt": "Stedile, do MST, critica ajuste fiscal e questiona diálogo com bancadas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 273753, "titulo": "Entenda o 'plano Moretti', proposta de ajuste fiscal do governo Lula que foi aprovada pelo Senado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/entenda-o-plano-moretti-proposta-de-ajuste-fiscal-do-governo-lula-que-foi-aprovada-pelo-senado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O 'plano Moretti', uma proposta de ajuste fiscal do governo Lula, foi aprovado pelo Senado. As medidas devem permitir ao governo buscar o centro da meta de resultado primário.", "titulo_pt": "Entenda o 'plano Moretti', proposta de ajuste fiscal do governo Lula aprovada pelo Senado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 273890, "titulo": "Após aval no Senado, ajuste fiscal será votado na Câmara na próxima semana", "url": "https://www.cnnbrasil.com.br/politica/apos-aval-no-senado-ajuste-fiscal-sera-votado-na-camara-na-proxima-semana/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto do ajuste fiscal foi alterado pelos senadores e teve seu impacto financeiro estimado reduzido em R$ 6 bilhões. O relator na Câmara dos Deputados informou que não fará mais alterações no projeto.", "titulo_pt": "Ajuste fiscal será votado na Câmara na próxima semana após alterações no Senado", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 273938, "titulo": "Tema 118 e a modulação de efeitos: o dever de coerência com o Tema 69", "url": "https://www.jota.info/opiniao-e-analise/artigos/tema-118-e-a-modulacao-de-efeitos-o-dever-de-coerencia-com-o-tema-69", "fonte_id": "jota", "data_pub": "2026-11-19T05:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) excluiu o ISS do PIS/Cofins, mas a vitória dos contribuintes depende da modulação, que deve ser coerente com a da 'tese do século'.", "titulo_pt": "Tema 118 e a modulação de efeitos: o dever de coerência com o Tema 69", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 273728, "titulo": "Machado de Xangô, crucifixos e Cristo de madeira: veja símbolos religiosos já instalados nas sedes dos Três Poderes, em Brasília", "url": "https://g1.globo.com/df/distrito-federal/noticia/2026/11/19/machado-de-xango-crucifixos-e-cristo-de-madeira-veja-simbolos-religiosos-ja-instalados-nas-sedes-dos-tres-poderes-em-brasilia.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-19T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Símbolos religiosos de diferentes tradições, como crucifixos e uma escultura de Cristo em madeira, já estavam presentes nas sedes dos Três Poderes em Brasília. O mais recente é um machado de Xangô, instalado no Supremo Tribunal Federal.", "titulo_pt": "Machado de Xangô, crucifixos e Cristo de madeira: veja símbolos religiosos nas sedes dos Três Poderes, em Brasília", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 273940, "titulo": "Dois meses para decidir quem decide", "url": "https://www.jota.info/opiniao-e-analise/colunas/elas-no-jota/dois-meses-para-decidir-quem-decide", "fonte_id": "jota", "data_pub": "2026-11-19T03:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Coletivos de mulheres enviaram uma carta a Lula solicitando a paridade de gênero e a equidade racial no governo e nos tribunais superiores. O prazo para a decisão é de dois meses.", "titulo_pt": "Dois meses para decidir sobre paridade de gênero e equidade racial", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 273729, "titulo": "Ajuste fiscal: Moretti diz que texto aprovado pelo Senado preserva políticas sociais essenciais em 2027", "url": "https://g1.globo.com/politica/noticia/2026/11/19/ajuste-fiscal-moretti-diz-que-texto-aprovado-pelo-senado-preserva-politicas-sociais-essenciais-em-2027.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-19T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Planejamento, Bruno Moretti, afirmou que o pacote fiscal aprovado pelo Senado manteve as políticas sociais essenciais para 2027. Ele destacou que o objetivo é equilibrar as contas públicas e garantir recursos para essas políticas no próximo ano.", "titulo_pt": "Moretti afirma que texto aprovado pelo Senado mantém políticas sociais essenciais em 2027", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 273730, "titulo": "Posse de Lula: com hotéis caros e cheios, Planalto e governo do DF discutem camping para caravanas", "url": "https://g1.globo.com/df/distrito-federal/noticia/2026/11/19/posse-de-lula-com-hoteis-caros-e-cheios-planalto-e-governo-do-df-discutem-camping-para-caravanas.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-19T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal e o governo do Distrito Federal estão considerando a reserva de espaços públicos, como escolas e parques, para abrigar caravanas de apoiadores do presidente eleito Luiz Inácio Lula da Silva, devido aos altos preços dos hotéis e aplicativos de hospedagem.", "titulo_pt": "Posse de Lula: com hotéis caros e cheios, Planalto e governo do DF discutem camping para caravanas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 273731, "titulo": "PGR terá que analisar relatórios da PF sobre relação de Vorcaro com ministros do STF e apontar providências cabíveis; entenda", "url": "https://g1.globo.com/politica/noticia/2026/11/19/pgr-tera-que-analisar-relatorios-da-pf-sobre-relacao-de-vorcaro-com-ministros-do-stf-e-apontar-providencias-cabiveis-entenda.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-19T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República (PGR) será responsável por analisar relatórios da Polícia Federal sobre a relação do ex-banqueiro Daniel Vorcaro com ministros do Supremo Tribunal Federal (STF) e determinar as providências necessárias. O STF encaminhará os relatórios para a PGR nesta quarta-feira (18).", "titulo_pt": "PGR analisará relatórios sobre relações de Vorcaro com ministros do STF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 273721, "titulo": "Com novas funções, 'supersecretária' de Tarcísio promete fortalecer controle de concessões", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/com-novas-funcoes-supersecretaria-de-tarcisio-promete-fortalecer-controle-de-concessoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-19T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Natália Resende, a nova secretária de Planejamento, Orçamento e Investimentos, promete fortalecer o controle sobre as concessões públicas no segundo mandato de Tarcísio de Freitas (Republicanos), que inclui leilões de infraestrutura na bolsa de valores.", "titulo_pt": "Supersecretária de Tarcísio promete fortalecer controle de concessões", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 273851, "titulo": "Xi sugere proibir armas nucleares, mas Trump acha \"difícil abrir mão delas\"", "url": "https://www.metropoles.com/mundo/xi-sugere-proibir-armas-nucleares-mas-trump-acha-dificil-abrir-mao-delas", "fonte_id": "metropoles", "data_pub": "2026-11-19T09:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, expressou sua desconfiança em abandonar armas nucleares, apesar das sugestões do presidente chinês, Xi Jinping, para proibir essas armas.", "titulo_pt": "Xi sugere proibir armas nucleares, mas Trump acha 'difícil abrir mão delas'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 274352, "titulo": "Serbian Anti-Corruption Agency Files Criminal Complaint Against Belgrade Mayor", "url": "https://balkaninsight.com/2026/11/19/serbian-anti-corruption-agency-files-criminal-complaint-against-belgrade-mayor/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-19T09:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência antissequestro sérvia apresentou um pedido criminal contra o prefeito de Belgrado, Aleksandar Sapic, após uma revisão prolongada de seus bens e renda. Essa informação foi confirmada pela BIRN.", "titulo_pt": "Agência antissequestro sérvia apresenta denúncia Criminal contra prefeito de belgrado", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 274400, "titulo": "(5th LD) Trump, Xi, Putin hold unprecedented 3-way summit with nuclear arms reduction in focus", "url": "https://en.yna.co.kr/view/AEN20261119001355315", "fonte_id": "yonhap_news", "data_pub": "2026-11-19T09:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os líderes dos Estados Unidos, China e Rússia realizaram uma cúpula inédita, focando em redução de armas nucleares.", "titulo_pt": "Trump, Xi e Putin realizam cúpula inédita com foco em redução de armas nucleares", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 274325, "titulo": "Air strike hits Saudi sovereign wealth fund headquarters", "url": "https://www.ft.com/content/05ed47a5-7cc1-402f-ad0d-826ba09a05c8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-19T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque aéreo atingiu o escritório principal do Fundo de Investimento Público da Arábia Saudita. O ataque ocorreu em meio a ataques diários realizados pelos rebeldes hutíes ao reino.", "titulo_pt": "Ataque aéreo atinge sede do fundo de investimento público da arábia saudita", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 273797, "titulo": "Putin e Xi defendem ampliar parceria entre Rússia e China", "url": "https://www.poder360.com.br/poder-internacional/putin-e-xi-defendem-ampliar-parceria-entre-russia-e-china/", "fonte_id": "poder360", "data_pub": "2026-11-19T09:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os presidentes Putin e Xi discutiram comércio, energia e educação durante uma cúpula da Ásia-Pacífico.", "titulo_pt": "Putin e Xi defendem ampliar parceria entre Rússia e China", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 274327, "titulo": "Trump puts nuclear weapons in spotlight at unprecedented summit with Xi and Putin", "url": "https://www.japantimes.co.jp/news/2026/11/19/asia-pacific/politics/trump-putin-xi-summit-apec-nuclear-weapons/", "fonte_id": "japan_times", "data_pub": "2026-11-19T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma cúpula inédita, Donald Trump focou nas armas nucleares, enquanto os líderes chineses e russos não abordaram o tema em suas declarações, indicando futuros desafios.", "titulo_pt": "Trump coloca armas nucleares sob a luz em cúpula inédita com Xi e Putin", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 274359, "titulo": "Xi-Trump-Putin trilateral breaks historic ground", "url": "https://www.scmp.com/plus/economy/china-economy/article/3375070/xi-trump-putin-trilateral-breaks-historic-ground", "fonte_id": "scmp", "data_pub": "2026-11-19T09:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente chinês Xi Jinping enfatizou a 'significância pioneira' da primeira reunião tripartite entre os líderes da China, Estados Unidos e Rússia, durante a qual Donald Trump propôs discutir a redução do número de armas nucleares. Xi destacou que a harmonia entre grandes potências traz paz ao mundo, enquanto conflitos entre elas causam caos.", "titulo_pt": "Reunião tripartite xi-trump-putin marca novo passo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 274236, "titulo": "Watch: Trump, Putin and Xi sit down for historic three-way talks", "url": "https://www.euronews.com/2026/11/19/watch-trump-putin-and-xi-sit-down-for-historic-three-way-talks", "fonte_id": "euronews", "data_pub": "2026-11-19T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os líderes dos Estados Unidos, China e Rússia iniciaram suas primeiras conversações trilaterais históricas em Shenzhen, China.", "titulo_pt": "Assista: trump, Putin e Xi se reúnem em conversas trilaterais históricas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 274329, "titulo": "South Korea’s Lee hopes reopening talks with North Korea could lead to lasting peace", "url": "https://www.japantimes.co.jp/news/2026/11/19/asia-pacific/south-korea-lee-north-korea-peace/", "fonte_id": "japan_times", "data_pub": "2026-11-19T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lee, da Coreia do Sul, falou sobre a APEC em Shenzhen, enfatizando que a paz e a estabilidade na Península Coreana são essenciais para a prosperidade regional compartilhada.", "titulo_pt": "Lee da Coreia do sul espera que as negociações com a Coreia do norte levem à paz duradoura", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 274151, "titulo": "The Paradox of American Credibility", "url": "https://www.foreignaffairs.com/united-states/paradox-american-credibility", "fonte_id": "foreign_affairs", "data_pub": "2026-11-19T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A luta de Washington enfraquece sua credibilidade, enquanto a retirada pode fortalecê-la.", "titulo_pt": "O paradoxo da credibilidade americana", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}, {"id": 274152, "titulo": "Avoiding Colombia’s Escalation Trap", "url": "https://www.foreignaffairs.com/colombia/avoiding-colombias-escalation-trap", "fonte_id": "foreign_affairs", "data_pub": "2026-11-19T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma ofensiva militar apoiada pelos Estados Unidos contra grupos armados poderia resultar em um contraproducente aumento da violência.", "titulo_pt": "Evitando a armadilha da escalada na colômbia", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}, {"id": 274153, "titulo": "How Arab Parties Can Rescue Israeli Democracy", "url": "https://www.foreignaffairs.com/israel/how-arab-parties-can-rescue-israeli-democracy", "fonte_id": "foreign_affairs", "data_pub": "2026-11-19T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os únicos meios para pôr fim à era Netanyahu estão nas mãos das forças políticas árabes israelenses.", "titulo_pt": "Como os partidos árabes podem rescuperar a democracia israelense", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}, {"id": 274404, "titulo": "(3rd LD) Trump, Xi, Putin hold unprecedented 3-way summit, with N. Korea likely on agenda", "url": "https://en.yna.co.kr/view/AEN20261119001353315", "fonte_id": "yonhap_news", "data_pub": "2026-11-19T08:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os líderes dos Estados Unidos, China e Rússia realizaram uma cúpula inédita tripartite em Shenzen, China, em 19 de novembro. A Coreia do Norte provavelmente esteve no centro das discussões.", "titulo_pt": "Trump, Xi e Putin realizam cúpula tripartite inédita, com Coreia do norte provavelmente em pauta", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 274366, "titulo": "Xi invokes WWII alliance, Trump raises nuclear cuts in 3-way talks with Putin", "url": "https://www.scmp.com/news/china/diplomacy/article/3375055/xi-trump-and-putin-meet-landmark-trilateral-talks-apec", "fonte_id": "scmp", "data_pub": "2026-11-19T08:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os presidentes dos Estados Unidos, Donald Trump, da Rússia, Vladimir Putin, e da China, Xi Jinping, realizaram uma histórica reunião trilateral, sendo a primeira entre os líderes das três maiores potências nucleares do mundo. O encontro ocorreu em Shenzhen, na China, durante o APEC.", "titulo_pt": "Xi invoca aliança da segunda guerra, Trump discute cortes nucleares em reunião tripartite com Putin", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 274330, "titulo": "Takaichi stresses need for ‘stable’ ties with China after encounters with Xi", "url": "https://www.japantimes.co.jp/news/2026/11/19/japan/politics/xi-takaichi-apec-greeting-protocol/", "fonte_id": "japan_times", "data_pub": "2026-11-19T08:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira-ministra Sanae Takaichi teve duas curtas, mas calorosas, reuniões com Xi Jinping durante uma cúpula regional, o primeiro encontro entre os dois desde que Takaichi fez comentários sobre Taiwan.", "titulo_pt": "Takaichi enfatiza a necessidade de laços 'estáveis' com a China após encontros com Xi", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 274406, "titulo": "Lee heads home after attending APEC, ASEAN summits", "url": "https://en.yna.co.kr/view/AEN20261119006200315", "fonte_id": "yonhap_news", "data_pub": "2026-11-19T08:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung retornou a Seoul após participar dos summitos da APEC e da ASEAN em Shenzen, China.", "titulo_pt": "Lee retorna a seoul após participar dos summitos da APEC e da ASEAN", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 274253, "titulo": "Novartis raises blockbuster drug forecasts to $18 billion as it seeks to prove growth can last", "url": "https://www.cnbc.com/2026/11/19/novartis-stock-cmd-2026-ceo.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-19T09:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novartis elevou as projeções de vendas para seus medicamentos-blockbuster para US$ 18 bilhões, citando forte demanda. A empresa atualizou as projeções de vendas pico para medicamentos contra múltipla esclerose, leucemia e colesterol.", "titulo_pt": "Novartis eleva projeções de vendas de medicamentos-blockbuster para us$ 18 bilhões", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 273932, "titulo": "Carf: benefícios estornados e contribuições obrigatórias não podem ser excluídos do IRPJ/CSLL", "url": "https://www.jota.info/tributos/carf-beneficios-estornados-e-contribuicoes-obrigatorias-nao-podem-ser-excluidos-do-irpj-csll", "fonte_id": "jota", "data_pub": "2026-11-19T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa Irmãos Muffato & Cia Ltda enfrenta um caso judicial envolvendo a inclusão de benefícios estornados e contribuições obrigatórias no cálculo do IRPJ e CSLL. O tratamento tributário diferenciado da empresa é objeto de discussão no estado do Paraná e Santa Catarina.", "titulo_pt": "Carf: benefícios estornados e contribuições obrigatórias não podem ser excluídos do IRPJ/CSLL", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 274328, "titulo": "Japan Tobacco hit by $8.9 billion charge on Russia seizure", "url": "https://www.japantimes.co.jp/business/2026/11/19/japan-tobacco-russia-seizure-charge/", "fonte_id": "japan_times", "data_pub": "2026-11-19T09:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa japonesa Japan Tobacco sofreu um prejuízo operacional de 36,8 bilhões de ienes em vez de um lucro de 1 trilhão de ienes devido a uma multa relacionada à apreensão de produtos na Rússia.", "titulo_pt": "Japan Tobacco sofre prejuízo de 8,9 bilhões de dólares devido à apreensão na Rússia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 273935, "titulo": "Euro17 não é Banco Master: entre o FGC e o arresto", "url": "https://www.jota.info/opiniao-e-analise/artigos/euro17-nao-e-banco-master-entre-o-fgc-e-o-arresto", "fonte_id": "jota", "data_pub": "2026-11-19T09:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O termo 'renda fixa' é usado para descrever diferentes tipos de investimentos com proteções distintas. O Euro17 não é o Banco Master, e os leitores devem estar cientes das diferenças entre as proteções oferecidas pelo Fundo Garantidor de Créditos (FGC) e o arresto judicial.", "titulo_pt": "Renda fixa oculta proteções variadas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 274335, "titulo": "Consumption tax cut in Japan would create pricing dilemma for some businesses", "url": "https://www.japantimes.co.jp/business/2026/11/19/companies/consumption-tax-cut-pricing/", "fonte_id": "japan_times", "data_pub": "2026-11-19T07:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas no Japão enfrentam um dilema de preços, pois ainda precisam cobrar mais devido à inflação, mas devem ser cautelosas com o momento da implementação da redução da taxa do imposto sobre consumo.", "titulo_pt": "Corte na taxa de imposto sobre consumo no Japão criaria dilema de preços para algumas empresas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 274414, "titulo": "S. Korean won extends gains against U.S. dollar", "url": "https://en.yna.co.kr/view/AEN20261119006900320", "fonte_id": "yonhap_news", "data_pub": "2026-11-19T07:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano manteve as ganhos em relação ao dólar americano. Esta tendência ocorreu em Seul, em 19 de novembro, conforme informado pela Yonhap News.", "titulo_pt": "Won sul-coreano mantém ganhos contra o dólar", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 274316, "titulo": "Anthropic raises $81bn in record IPO", "url": "https://www.ft.com/content/62c0510b-ca65-441e-9baf-675b93903b9e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-19T07:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de inteligência artificial Anthropic levantou US$ 81 bilhões em uma oferta inicial de ações (IPO) recorde, avaliando a companhia em US$ 1,5 trilhão. As ações da empresa começarão a ser negociadas na bolsa nesta quinta-feira.", "titulo_pt": "Anthropic levanta us$ 81 bilhões em IPO recorde", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 273747, "titulo": "Abertura do mercado de energia traz liberdade para escolher e segurança para decidir", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/abertura-do-mercado-de-energia-traz-liberdade-para-escolher-e-seguranca-para-decidir.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A abertura do mercado livre de energia introduzirá uma nova dinâmica entre o consumidor e o setor elétrico, além de trazer liberdade para escolher e segurança para decidir. Este movimento representa uma mudança regulatória significativa.", "titulo_pt": "Abertura do mercado de energia traz liberdade para escolher e segurança para decidir", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 273749, "titulo": "Acionista da concessionária do estádio Pacaembu pede recuperação extrajudicial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/acionista-da-concessionaria-do-estadio-pacaembu-pede-recuperacao-extrajudicial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Progen S.A., empresa que detém 50% da Allegra, concessionária do estádio Pacaembu, apresentou um pedido de recuperação extrajudicial. A empresa acumula mais de R$ 900 milhões em dívidas com bancos e investidores, além de R$ 631 milhões em obrigações trabalhistas e tributárias e R$ 134 milhões de débitos com fornecedores.", "titulo_pt": "Acionista da concessionária do estádio Pacaembu pede recuperação extrajudicial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 273751, "titulo": "Trava a compensações tributárias no 'plano Moretti' incomoda entidades empresariais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/trava-a-compensacoes-tributarias-no-plano-moretti-incomoda-entidades-empresariais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entidades empresariais criticaram a medida do 'plano Moretti' que limita as compensações tributárias. O texto foi aprovado pelo Senado nesta quarta-feira (18).", "titulo_pt": "Crítica a medida que limita compensações tributárias no 'plano Moretti' incomoda entidades empresariais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 273752, "titulo": "Restrição dos EUA a exportação de chips de IA entra em vigor e pode atrasar compras no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/restricao-dos-eua-a-exportacao-de-chips-de-ia-entra-em-vigor-e-pode-atrasar-compras-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A nova regra dos Estados Unidos que exige licença para a exportação de chips avançados de inteligência artificial entrou em vigor nesta quinta-feira. Esta medida adiciona uma etapa burocrática à importação de determinados processadores e servidores, mas não afeta igualmente todas as empresas.", "titulo_pt": "Nova regra dos EUA sobre exportação de chips de IA entra em vigor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 274415, "titulo": "(LEAD) S. Korea's exports top US$1 tln for 1st time on strong chip demand", "url": "https://en.yna.co.kr/view/AEN20261119003951320", "fonte_id": "yonhap_news", "data_pub": "2026-11-19T06:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações da Coreia do Sul ultrapassaram os 1 trilhão de dólares por primeira vez, devido à forte demanda por chips.", "titulo_pt": "Exportações da Coreia do sul atingem 1 trilhão de dólares pela primeira vez, impulsionadas pela demanda por chips", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 273936, "titulo": "Projetos de Inteligência Artificial no Jurídico", "url": "https://www.jota.info/opiniao-e-analise/colunas/legal-business/projetos-de-inteligencia-artificial-no-juridico", "fonte_id": "jota", "data_pub": "2026-11-19T05:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute a implementação de Inteligência Artificial no setor jurídico, focando na eficiência dessas tecnologias. A pergunta central é quando a eficiência desses projetos realmente se apresenta.", "titulo_pt": "Projetos de Inteligência Artificial no Jurídico", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 273937, "titulo": "O mercado já profissionalizou os criadores de conteúdo. E os governos?", "url": "https://www.jota.info/opiniao-e-analise/colunas/radar-de-evidencias/o-mercado-ja-profissionalizou-os-criadores-de-conteudo-e-os-governos", "fonte_id": "jota", "data_pub": "2026-11-19T05:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado digital tem se profissionalizado rapidamente para os criadores de conteúdo, enquanto o reconhecimento estatal ainda não acompanha essa tendência, tanto no Brasil quanto em outros países, segundo dados da Reglab.", "titulo_pt": "O mercado já profissionalizou os criadores de conteúdo. E os governos?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 274318, "titulo": "Retail investors face squeeze in blockbuster Anthropic IPO", "url": "https://www.ft.com/content/38c122d6-b533-4595-9554-3852c52e580f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-19T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores individuais enfrentam dificuldades em uma oferta inicial de ações (IPO) da Anthropic, enquanto a corrida por ações de empresas de inteligência artificial testa as capacidades das bolsas de acomodar essa nova base de investidores.", "titulo_pt": "Investidores individuais enfrentam pressão em IPO de sucesso da Anthropic", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 274320, "titulo": "Adani: the billionaire at the heart of Modi’s India", "url": "https://www.ft.com/content/e1867545-5142-4ee5-b092-b7e04ac04b66?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-19T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três anos atrás, o bilionário estava enfrentando processos judiciais e acusações de fraude. Agora, seu império empresarial parece mais poderoso do que nunca.", "titulo_pt": "Adani: o bilionário no centro da Índia de Modi", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 273872, "titulo": "Muito além das cambalhotas, robôs humanoides começam a assumir tarefas em fábricas e centros de distribuição", "url": "https://www.cnnbrasil.com.br/curiosidades/muito-alem-das-cambalhotas-robos-humanoides-comecam-a-assumir-tarefas-em-fabricas-e-centros-de-distribuicao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Robôs humanoides estão sendo testados para realizar diversas tarefas em fábricas e centros de distribuição, como transportar materiais, organizar encomendas e auxiliar na produção. A expectativa é que suas aplicações se expandam para diferentes atividades.", "titulo_pt": "Muito além das cambalhotas, robôs humanoides começam a assumir tarefas em fábricas e centros de distribuição", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 273934, "titulo": "Quem pisa no freio primeiro? Incentivos e governança corporativa na corrida da IA", "url": "https://www.jota.info/opiniao-e-analise/artigos/quem-pisa-no-freio-primeiro-incentivos-e-governanca-corporativa-na-corrida-da-ia", "fonte_id": "jota", "data_pub": "2026-11-19T09:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Compromissos voluntários, como o acordo 'moralmente vinculante' da Casa Branca, só funcionam com incentivos bem desenhados. A governança corporativa na corrida da IA depende de incentivos efetivos para ser bem-sucedida.", "titulo_pt": "Quem pisa no freio primeiro? Incentivos e governança corporativa na corrida da IA", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 274402, "titulo": "LG Display scraps 3 tln-won OLED investment plan", "url": "https://en.yna.co.kr/view/AEN20261119010000320", "fonte_id": "yonhap_news", "data_pub": "2026-11-19T09:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "LG Display cancelou seu plano de investimento de 3 trilhões de wones em tecnologia OLED.", "titulo_pt": "LG Display cancela plano de investimento de 3 trilhões de wones em OLED", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 274423, "titulo": "LG Group retains CEOs, elevates R&D talent in 2027 reshuffle", "url": "https://www.koreaherald.com/article/10943152", "fonte_id": "korea_herald", "data_pub": "2026-11-19T09:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A LG Group manteve a maioria dos CEOs das suas subsidiárias e elevou talentos da pesquisa e desenvolvimento em sua remodelação executiva de 2027. Foram anunciadas 132 promoções, incluindo 89 novas posições. Especialistas em pesquisa e desenvolvimento representaram 30% das novas promoções para vice-presidentes. Entre as promoções, destaque para Baek Seung-tae, que passou a presidir as operações de eletrodomésticos, e Lee Sang-woo, que foi promovido para a liderança da estratégia da LG Corp.", "titulo_pt": "LG Group mantém CEOs e eleva talentos de pesquisa e desenvolvimento em remodelação executiva de 2027", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 274425, "titulo": "IAEA gives positive assessment of S. Korea's nuclear-powered submarine project in first report: ministry", "url": "https://www.koreaherald.com/article/10943149", "fonte_id": "korea_herald", "data_pub": "2026-11-19T09:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Agência Internacional de Energia Atômica avaliou positivamente a cooperação da Coreia do Sul em relação às garantias nucleares e obrigações de não proliferação relacionadas ao seu projeto de submarino nuclear. Este relatório é considerado um passo positivo para o avanço do programa pelo Ministério das Relações Exteriores sul-coreano.", "titulo_pt": "IAEA elogia cooperação da Coreia do sul em projeto de submarino nuclear", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 274361, "titulo": "From glasses to buttons, South Korea’s anti-cheating exam checks raise eyebrows", "url": "https://www.scmp.com/week-asia/lifestyle-culture/article/3375067/glasses-buttons-south-koreas-anti-cheating-exam-checks-raise-eyebrows", "fonte_id": "scmp", "data_pub": "2026-11-19T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alunos sul-coreanos se preocupam com lentes de grau grossas, enquanto outros tiveram botões de suas roupas verificados, durante as provas do exame de admissão à universidade, sob medidas de segurança inéditas para combater a fraude usando câmeras ocultas. A repressão, implementada após uma série de escândalos de fraude com ajuda de inteligência artificial, levanta dúvidas sobre se o governo está protegendo a integridade do exame mais importante do país ou apenas se esforçando.", "titulo_pt": "Das lentes aos botões, medidas anti-fraude do exame de admissão na Coreia do sul causam surpresa", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 274427, "titulo": "How semiconductors powered South Korea’s $1tr export milestone", "url": "https://www.koreaherald.com/article/10943146", "fonte_id": "korea_herald", "data_pub": "2026-11-19T08:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os semicondutores foram o principal motor das exportações anuais de South Korea que atingiram o valor de 1 trilhão de dólares pela primeira vez, impulsionadas pela alta demanda por chips de memória para inteligência artificial e aumentos de preços. O Ministério do Comércio, Indústria e Recursos declarou que as exportações cumulativas alcançaram o marco no horário de 14:09 local, tornando South Korea a quarta nação a atingir a marca após os Estados Unidos, Alemanha e China.", "titulo_pt": "Como os semicondutores levaram South Korea a sua marca de exportações anuais de 1 trilhão de dólares", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 274403, "titulo": "(2nd LD) Seoul shares end higher ahead of Anthropic's stock market debut", "url": "https://en.yna.co.kr/view/AEN20261119006552320", "fonte_id": "yonhap_news", "data_pub": "2026-11-19T08:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As bolsas de Seul encerraram o dia em alta, lideradas por ganhos no setor de tecnologia, em vista do IPO iminente da Anthropic.", "titulo_pt": "Seoul compartilhamentos encerram em alta antes do ipo da Anthropic", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 274364, "titulo": "AI work-ready Hong Kong graduates? It’s no longer an academic question", "url": "https://www.scmp.com/opinion/hong-kong-opinion/article/3374793/ai-work-ready-hong-kong-graduates-its-no-longer-academic-question", "fonte_id": "scmp", "data_pub": "2026-11-19T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As instituições de ensino superior de Hong Kong têm construído suas reputações de elite através de uma rigorosa formação acadêmica. No entanto, com a era econômica em rápida evolução impulsionada pela inteligência artificial, a fórmula para o sucesso dos graduados está mudando. Nota de classificação global alta, principalmente baseada em produção de pesquisa, não é mais suficiente para garantir o futuro dos graduados.", "titulo_pt": "Os graduados de Hong Kong estão preparados para a era da inteligência artificial?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 274365, "titulo": "Qatar-gifted Boeing 747 makes China debut as Air Force One in Shenzhen", "url": "https://www.scmp.com/news/china/diplomacy/article/3375056/qatar-gifted-boeing-747-makes-china-debut-air-force-one-shenzhen", "fonte_id": "scmp", "data_pub": "2026-11-19T08:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três Boeing 747 da presidência dos Estados Unidos aterrissaram em Manila, Filipinas, durante a viagem de Donald Trump pela Ásia. Esta foi uma ocasião incomum, já que geralmente a frota completa de jatos presidenciais não é enviada para viagens internacionais.", "titulo_pt": "Boeing 747 da presidência dos EUA fazem estreia na China em Shenzhen como Air Force One", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 273945, "titulo": "Recorde da Anthropic em estreia na bolsa conseguirá impedir o estouro da bolha da IA?", "url": "https://www.bbc.com/portuguese/articles/cm782wyv0153o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-19T08:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic estreará na bolsa com um preço inicial de US$ 83 por ação, levando seu valor de mercado a cerca de US$ 1,5 trilhão. Este recorde pode refletir a crescente importância da IA no mercado financeiro.", "titulo_pt": "Recorde da Anthropic em estreia na bolsa pode indicar o tamanho da bolha da IA?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 274334, "titulo": "Tobu launches facial recognition payment service at Tokyo store in Japan first", "url": "https://www.japantimes.co.jp/business/2026/11/19/companies/tobu-facial-recognition-payment/", "fonte_id": "japan_times", "data_pub": "2026-11-19T07:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Tobu Railway lançou um serviço de pagamento por reconhecimento facial em uma loja em Tóquio, sendo o primeiro país a implementar essa tecnologia. O serviço utiliza um sistema de autenticação biométrica promovido em conjunto com a Hitachi.", "titulo_pt": "Tobu lança serviço de pagamento por reconhecimento facial em loja de tóquio", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 274481, "titulo": "Ford ships first Michigan LFP cells, but the batteries are still licensed from China", "url": "https://www.digitimes.com/news/a20261119VL220/ford-michigan-plant-localization-production.html", "fonte_id": "digitimes", "data_pub": "2026-11-19T07:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ford começou a enviar as primeiras células de bateria de fósforo-ferro-lítio (LFP) de sua fábrica em Michigan, representando um passo significativo na tentativa da montadora de localizar a produção de baterias de baixo custo para veículos elétricos nos Estados Unidos.", "titulo_pt": "Ford inicia envio de primeiras células LFP de Michigan, mas as baterias ainda são licenciadas da China", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 273827, "titulo": "6 em cada 10 executivos dizem que suas empresas não têm estrutura pronta para IA", "url": "https://exame.com/inteligencia-artificial/pesquisa-dell-empresas-brasileiras-infraestrutura-ia-armazenamento/", "fonte_id": "exame", "data_pub": "2026-11-19T06:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa indica que 60% dos executivos afirmam que suas empresas não estão preparadas para a inteligência artificial. Para 74% dos entrevistados, o acesso a dados e armazenamento são mais importantes do que a capacidade de processamento, e a eficiência energética se tornou uma condição necessária para expandir a utilização da IA.", "titulo_pt": "6 Em cada 10 executivos dizem que suas empresas não têm estrutura pronta para IA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 273828, "titulo": "Por que o Brasil entrou na lista dos EUA para chips de IA, e o que muda para os data centers", "url": "https://exame.com/inteligencia-artificial/regra-eua-chips-ia-vigor-brasil-data-centers-big-techs/", "fonte_id": "exame", "data_pub": "2026-11-19T06:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lista dos EUA incluiu o Brasil na restrição de exportação de chips de inteligência artificial. Isso significa que subsidiárias americanas podem importar tais chips sem licença prévia, criando assim condições desiguais de concorrência com empresas brasileiras.", "titulo_pt": "Por que o Brasil entrou na lista dos EUA para chips de IA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 274381, "titulo": "Anthropic’s record US$81.3 billion IPO arms US AI giant for price war with Chinese rivals", "url": "https://www.scmp.com/tech/big-tech/article/3375005/anthropics-record-us813-billion-ipo-arms-us-ai-giant-price-war-chinese-rivals", "fonte_id": "scmp", "data_pub": "2026-11-19T05:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A IPO recorde de US$81,3 bilhões da Anthropic forneceu ao gigante americano de inteligência artificial uma fortuna para iniciar uma guerra de preços global, aumentando a pressão de avaliação e monetização sobre rivais chineses de custo mais baixo.", "titulo_pt": "IPO recorde da anthropic equipa gigante de IA dos EUA para guerra de preços com rivais chineses", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 273803, "titulo": "Fertilização in vitro pode afetar a saúde dos filhos no longo prazo?", "url": "https://veja.abril.com.br/coluna/letra-de-medico/fertilizacao-in-vitro-pode-afetar-a-saude-dos-filhos-no-longo-prazo/", "fonte_id": "veja", "data_pub": "2026-11-19T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Evidências recentes indicam que a fertilização in vitro não afeta negativamente o desenvolvimento e a saúde dos filhos no longo prazo. Os resultados são comparáveis aos de bebês concebidos naturalmente.", "titulo_pt": "Fertilização in vitro pode não afetar a saúde dos filhos no longo prazo?", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 274469, "titulo": "STAT+: Before midterm losses, MAHA spent on itself instead of candidates", "url": "https://www.statnews.com/2026/11/19/maha-pac-how-it-spent-money-insiders-candidates-nonprofit/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-19T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O MAHA PAC gastou mais em um restaurante de churrasco em Washington, D.C., do que no pleito parlamentar de um aliado-chave.", "titulo_pt": "Antes das perdas nas eleições intermédiacas, MAHA gastou em si mesmo em vez dos candidatos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 274470, "titulo": "Opinion: STAT+: I’m a cardiologist. I’m a little puzzled about the blockbuster new study on deprescribing statins", "url": "https://www.statnews.com/2026/11/19/deprescribing-statins-study-stream-trial-aha-questions/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-19T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O colunista do STAT Vishal Khetpal analisa o estudo STREAM e suas descobertas sobre a descontinuação do uso de estatinas.", "titulo_pt": "Opinião: colunista do STAT: estou um pouco perplexo com o novo estudo de destinação de estatinas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 274422, "titulo": "Suneung English section deemed easier than last year", "url": "https://www.koreaherald.com/article/10943153", "fonte_id": "korea_herald", "data_pub": "2026-11-19T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O English section do Suneung deste ano foi considerado mais fácil do que o do ano anterior, mas mais difícil do que o simulado de setembro, de acordo com uma análise de um professor. As perguntas abordaram tópicos familiares e estimularam pensamento mais profundo.", "titulo_pt": "Seção de inglês do suneung deste ano considerada mais fácil do que o ano anterior", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 274014, "titulo": "Científicos desarrollan un tratamiento con campos magnéticos que podría ayudar a combatir el Parkinson, según un estudio", "url": "https://www.latercera.com/tendencias/noticia/cientificos-desarrollan-un-tratamiento-con-campos-magneticos-que-podria-ayudar-a-combatir-el-parkinson-segun-un-estudio/", "fonte_id": "la_tercera", "data_pub": "2026-11-19T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Cientistas desenvolveram um tratamento com campos magnéticos que poderia ajudar a combater o Parkinson, permitindo atuar em regiões profundas do cérebro sem a necessidade de implantes permanentes de eletrodos. O método, segundo os pesquisadores, pode se tornar uma alternativa para certos pacientes no futuro.", "titulo_pt": "Cientistas desenvolvem tratamento com campos magnéticos para Parkinson", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 274015, "titulo": "Por qué la obesidad afecta de forma distinta a hombres y mujeres, según una investigación", "url": "https://www.latercera.com/tendencias/noticia/por-que-la-obesidad-afecta-de-forma-distinta-a-hombres-y-mujeres-segun-una-investigacion/", "fonte_id": "la_tercera", "data_pub": "2026-11-19T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo indica que células imunológicas se comportam de maneira diferente entre homens e mulheres em relação à obesidade. Os resultados podem ajudar na compreensão da condição e na busca por novas formas de melhorar a saúde metabólica.", "titulo_pt": "Por que a obesidade afeta de forma distinta homens e mulheres, de acordo com uma pesquisa", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 273773, "titulo": "Homo erectus pode ter vivido até 200 mil anos atrás na China", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/homo-erectus-pode-ter-vivido-ate-200-mil-anos-atras-na-china.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-19T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fósseis de Homo erectus, encontrados na China, sugerem que a espécie pode ter sobrevivido até cerca de 200 mil anos atrás, adaptando-se a um ambiente de floresta tropical.", "titulo_pt": "Homo erectus pode ter vivido até 200 mil anos atrás na China", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 274407, "titulo": "IAEA issues first report on S. Korea's nuclear-powered sub project", "url": "https://en.yna.co.kr/view/AEN20261119007000315", "fonte_id": "yonhap_news", "data_pub": "2026-11-19T08:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Agência Internacional de Energia Atômica (AIEA) divulgou seu primeiro relatório sobre o projeto de submarino nuclear da Coreia do Sul. O relatório foi lançado em Seul, no dia 19 de novembro.", "titulo_pt": "IAEA lança primeiro relatório sobre projeto de submarino nuclear da Coreia do sul", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 273892, "titulo": "Claude ajudou a revelar estrutura molecular inédita; entenda", "url": "https://www.cnnbrasil.com.br/economia/money/intel
