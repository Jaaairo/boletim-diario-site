ate to 26% today", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/31/2003866922", "fonte_id": "taipei_times", "data_pub": "2026-10-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple reduzirá a taxa de comissão na App Store para 26% a partir de hoje. A decisão visa aliviar as preocupações sobre a alta taxa de 30% que tem sido criticada por desenvolvedores de aplicativos.", "titulo_pt": "Apple reduzirá comissão na App Store para 26%", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 235865, "titulo": "MediaTek gains new AI customer", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/31/2003866887", "fonte_id": "taipei_times", "data_pub": "2026-10-31T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A MediaTek ganhou um novo cliente para suas tecnologias de inteligência artificial (AI).", "titulo_pt": "Mediatek conquista novo cliente de inteligência artificial", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 236485, "titulo": "Is this our last time setting our clocks back?", "url": "https://www.vox.com/today-explained-newsletter/508553/daylight-saving-time-standard-time-sunlight-debate", "fonte_id": "vox", "data_pub": "2026-10-30T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No próximo domingo às 2h, os relógios serão ajustados para trás, marcando o fim do horário de verão. Este é um alerta para a mudança horária que ocorrerá durante o fim de semana, antes de feriados como Halloween e a Maratona de Nova York.", "titulo_pt": "Este será nosso último ajuste de relógio para o horário de verão?", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 236586, "titulo": "Intel’s stock crashes, knocking $12B from government’s stake", "url": "https://techcrunch.com/2026/10/30/intels-stock-crashes-knocking-12b-from-governments-stake/", "fonte_id": "techcrunch", "data_pub": "2026-10-30T21:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Intel caíram, resultando em uma perda de aproximadamente 12 bilhões de dólares no valor das ações detidas pelo governo. A indústria de inteligência artificial está consumindo componentes como memória, aumentando os preços dos PCs e prejudicando as vendas da Intel.", "titulo_pt": "Ações da intel caem, reduzindo valor do investimento governamental em 12 bilhões de dólares", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 236587, "titulo": "Anthropic expected to receive high ‘junk’ rating from credit agencies following IPO, report says", "url": "https://techcrunch.com/2026/10/30/anthropic-expected-to-receive-high-junk-rating-from-credit-agencies-following-ipo-report-says/", "fonte_id": "techcrunch", "data_pub": "2026-10-30T21:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com um relatório, a AI lab Anthropic está prevista para receber uma alta classificação de 'junk' das agências de rating após sua oferta inicial de ações (IPO).", "titulo_pt": "Anthropic pode obter alta classificação 'junk' após IPO, diz relatório", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 236588, "titulo": "Applebee’s exposed customers’ personal data after leaving database password in app", "url": "https://techcrunch.com/2026/10/30/applebees-exposed-customers-personal-data-after-leaving-database-password-in-app/", "fonte_id": "techcrunch", "data_pub": "2026-10-30T21:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um pesquisador de segurança descobriu uma credencial hardcodeada no aplicativo da Applebee's, proporcionando acesso ilimitado aos dados pessoais dos clientes. A empresa deixou o nome de usuário e senha expostos no código-fonte do aplicativo, exposto recentemente por um pesquisador de segurança.", "titulo_pt": "Applebee's expôs dados pessoais dos clientes após deixar credencial hardcodeada no app", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 236539, "titulo": "Binance loses $6.3 billion in crypto heist—what happens to your money when an exchange gets hacked", "url": "https://www.cnbc.com/make-it/2026/10/30/binance-crypto-hack-customer-funds.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-30T21:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exchanges de criptomoedas facilitam a compra, venda e armazenamento de ativos digitais, mas também apresentam riscos. Recentemente, a Binance sofreu um furto de criptomoedas que resultou em perdas de US$ 6,3 bilhões.", "titulo_pt": "Binance perde us$ 6,3 bilhões em roubão de criptomoedas - o que acontece com o seu dinheiro quando uma exchange é hackeada?", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 236526, "titulo": "Earnings stoke AI fears, send tech stocks tumbling", "url": "https://www.lemonde.fr/en/economy/article/2026/10/30/markets-lashed-by-tech-rout-as-earnings-fan-ai-fears_6767686_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-30T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As perdas significativas das empresas de tecnologia na sexta-feira contrariaram a optimismo anterior, gerado pela apresentação do IPO da gigante de IA Anthropic.", "titulo_pt": "Lucros levantam temores sobre IA e fazem ações de tecnologia cair", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 236589, "titulo": "Last-minute Halloween costumes for tech nerds", "url": "https://techcrunch.com/2026/10/30/last-minute-halloween-costumes-for-tech-nerds/", "fonte_id": "techcrunch", "data_pub": "2026-10-30T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto sugere algumas opções de fantasia para Halloween que podem agradar os geeks, incluindo um ícone de assistente de inteligência artificial, uma vulnerabilidade em PHP ou Bryan Johnson dormindo.", "titulo_pt": "Fantasias de Halloween para nerds da tecnologia", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 236593, "titulo": "How a Contractor’s Claude Agent Got Into the Pentagon", "url": "https://www.wired.com/story/uncanny-valley-podcast-how-a-contractors-claude-agent-got-into-the-pentagon/", "fonte_id": "wired", "data_pub": "2026-10-30T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A discussão desta semana no programa 'Uncanny Valley' aborda um contratante que conectou seu agente de IA ao sistema do Pentágono, a declaração de intenções de IPO da Anthropic e os voluntários que se preparam para contrariar a ICE nas eleições de meia legislatura.", "titulo_pt": "Como um contratante seu agente de IA chegou ao pentágono", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 236590, "titulo": "Cracks are emerging in the AI spending boom", "url": "https://techcrunch.com/2026/10/30/cracks-are-emerging-in-the-ai-spending-boom/", "fonte_id": "techcrunch", "data_pub": "2026-10-30T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas de grande tecnologia estão investindo bilhões em infraestrutura de IA, mas dívidas crescentes, fluxo negativo de caixa e crescente desconfiança dos investidores estão levantando dúvidas sobre a sustentabilidade do boom de gastos em IA.", "titulo_pt": "Rachaduras estão aparecendo no boom de gastos em AI", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 236284, "titulo": "Google vai implementar anúncios nas respostas de IA no Brasil", "url": "https://www.cnnbrasil.com.br/economia/money/tecnologia/google-vai-implementar-anuncios-nas-respostas-de-ia-no-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Google anunciou a expansão dos anúncios no Modo IA para mais países, incluindo o Brasil. A implementação desses anúncios nas respostas de inteligência artificial será realizada em território nacional.", "titulo_pt": "Google vai implementar anúncios nas respostas de IA no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 236598, "titulo": "Sam Altman says it’s better for RAM to be in a data center than on your desk", "url": "https://www.theverge.com/ai-artificial-intelligence/1023820/sam-altman-ram-shortage-cloud-servers", "fonte_id": "the_verge", "data_pub": "2026-10-30T20:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sam Altman, CEO do OpenAI, afirmou que é melhor ter a memória RAM em centrais de dados do que em computadores pessoais, em uma entrevista ao podcast Cheeky Pint. Ele discutiu sobre a escassez de componentes, como a falta de RAM, e sobre o impacto da inteligência artificial no campo matemático.", "titulo_pt": "Sam Altman diz que é melhor ter RAM em centrais de dados do que em computadores pessoais", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 236582, "titulo": "Dartmouth's provost warned us about AI cheating—but his own AI use cost him his job", "url": "https://arstechnica.com/tech-policy/2026/10/dartmouths-provost-warned-us-about-ai-cheating-but-his-own-ai-use-cost-him-his-job/", "fonte_id": "ars_technica", "data_pub": "2026-10-30T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O pró-reitor da Dartmouth foi demitido após usar IA para avaliar trabalhos, mesmo após ter advertido sobre o uso de IA para fraudar exames. Isso sugere que a instituição não é consistente na sua abordagem em relação à IA e às suas políticas internas.", "titulo_pt": "Pró-reitor da dartmouth foi demitido após usar IA para avaliação, mesmo após advertência sobre o uso de IA para fraude", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 236594, "titulo": "A Supply Chain Attack Put Malicious Anthropic Claude Extensions on Thousands of Devices", "url": "https://www.wired.com/story/trojan-malware-targets-thousands-of-anthropic-claude-developer-systems/", "fonte_id": "wired", "data_pub": "2026-10-30T20:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque à cadeia de suprimentos resultou na instalação de uma extensão maliciosa do Claude Anthropic em cerca de 5.000 máquinas de desenvolvedores. No entanto, um erro no código da extensão impediu o atacante de se espalhar completamente para essas máquinas.", "titulo_pt": "Ataque à cadeia de suprimentos colocou extensões maliciosas do Claude Anthropic em milhares de dispositivos", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 236599, "titulo": "The biggest names in AI are backing a new way to opt out of scraping", "url": "https://www.theverge.com/tech/1023763/openai-google-microsoft-ai-scraping-standard-opt-out", "fonte_id": "the_verge", "data_pub": "2026-10-30T20:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI, Google, Microsoft e Anthropic adotarão um novo padrão que permitirá aos publicadores optar por fora do scraping por AI. Este controle permitirá que os publicadores apliquem suas preferências de treinamento de IA em múltiplas empresas de IA, em vez de configurá-las individualmente. O sinal compartilhado 'token de política' será usado para isso.", "titulo_pt": "Grandes nomes da IA adotarão novo padrão para bloqueio de scraping", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 236180, "titulo": "Anvisa aprova novo comprimido para tratar doença rara progressiva", "url": "https://veja.abril.com.br/saude/anvisa-aprova-novo-comprimido-para-tratar-doenca-rara-progressiva/", "fonte_id": "veja", "data_pub": "2026-10-30T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa aprovou o comprimido Evrysdi Go (risdiplam) para o tratamento da atrofia muscular espinhal 5q em adultos e crianças acima de 2 anos.", "titulo_pt": "Anvisa aprova comprimido para tratar atrofia muscular espinhal 5q em adultos e crianças", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 236603, "titulo": "New home for orangutans rescued from Indonesia's burning forests", "url": "https://phys.org/news/2026-10-home-orangutans-indonesia-forests.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Conservacionistas abrem uma grade em uma floresta da Borneu, Indonésia, liberando uma orangotango e seu bebê, que logo se escondem nas altas árvores, seguras finalmente.", "titulo_pt": "Novo lar para orangotangos resgatados das florestas em chamas da indonésia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 236604, "titulo": "For many, striped bass fishing is a way of life. But the iconic species could face collapse", "url": "https://phys.org/news/2026-10-striped-bass-fishing-life-iconic.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bill Jakob tem mais de 60 anos de paixão pela pesca de peixes-estripes, e lembra um tempo em que ele conseguia pescar oito a nove peixes de até 40 libras (18 kg) por noite, o que era considerado uma grande captura por qualquer padrão.", "titulo_pt": "Para muitos, a pesca de peixes-estripes é uma forma de vida, mas a espécie icônica pode enfrentar colapso", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 236605, "titulo": "Chemists create disappearing tattoos: Here's the science behind how they work", "url": "https://phys.org/news/2026-10-chemists-tattoos-science.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Químicos criaram tatuagens que podem ser visíveis ou invisíveis, dependendo das condições. Esta tecnologia permite que as tatuagens sejam ocultadas durante o dia e reveladas à noite, podendo ser útil para ocasiões específicas.", "titulo_pt": "Químicos criam tatuagens desaparecíveis: veja como elas funcionam", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 236656, "titulo": "An aquanaut comes home: Returning to Earth from an undersea 'space station'", "url": "https://www.space.com/space-exploration/human-spaceflight/an-aquanaut-comes-home-returning-to-earth-from-an-undersea-space-station", "fonte_id": "space_com", "data_pub": "2026-10-30T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A astronauta aquática Dr. Musilova e sua equipe retornaram à superfície terrestre após cinco dias vivendo sob a água. Eles foram afetados pelas maiores pressões e se sentiram desconectados do mundo exterior durante o período subaquático.", "titulo_pt": "Uma astronauta aquática retorna à terra: voltando para a superfície após uma 'estação espacial' subaquática", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 236606, "titulo": "Are narcissists multiplying or is the social media algorithm making them bolder? The answer in five stages", "url": "https://phys.org/news/2026-10-narcissists-social-media-algorithm-bolder.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A mídia social não necessariamente reflete quem você é, mas pode intensificar traços de personalidade específicos e confirmar ou até mesmo persuadir que seu comportamento pior é justificado.", "titulo_pt": "Os narcisistas estão se multiplicando ou é o algoritmo das redes sociais que os torna mais audaciosos?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 236607, "titulo": "Hidden erosion: Study reveals soft mountain rock erodes three times faster than hard rock—with climate implications", "url": "https://phys.org/news/2026-10-hidden-erosion-reveals-soft-mountain.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo liderado pela Universidade da Massachusetts Amherst descobriu que rochas mais fracas em paisagens montanhosas erodem três vezes mais rápido do que rochas mais duras, mesmo em encostas suaves. Este achado sugere que a errosão de rochas mais fracas pode ter um impacto maior na liberação de dióxido de carbono do que se pensava anteriormente.", "titulo_pt": "Erosão oculta: estudo revela que rochas mais fracas em montanhas erodem três vezes mais rápido que as mais duras", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 236657, "titulo": "India launches next-gen navigation satellite to orbit (video)", "url": "https://www.space.com/space-exploration/launches-spacecraft/india-launches-nvs-03-navigation-satellite-gslv-rocket", "fonte_id": "space_com", "data_pub": "2026-10-30T20:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Índia lançou o satélite de navegação NVS-03 em órbita hoje (30 de outubro) em cima de um foguete GSLV. Foi o quarto lançamento orbital do país este ano.", "titulo_pt": "Índia lança satélite de navegação avançado em órbita", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 236608, "titulo": "Tiny photonic chip links telescopes together to view the universe in 'astonishing' detail", "url": "https://phys.org/news/2026-10-tiny-photonic-chip-links-telescopes.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um pequeno chip de vidro desenvolvido por pesquisadores da Universidade Heriot-Watt conectou duas telescópias, permitindo que elas operem como um único instrumento poderoso. Este avanço representa um passo importante para a próxima geração de tecnologia astronômica.", "titulo_pt": "Pequeno chip de vidro conecta telescópias e proporciona visualização do universo em detalhes 'estranhamente impressionantes'", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 236609, "titulo": "What the Cornell 7 sexual assault allegations reveal about how parents talk to their kids about rape", "url": "https://phys.org/news/2026-10-cornell-sexual-assault-allegations-reveal.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Cornell 7 é uma investigação sobre acusações de assédio sexual que ilustra como os pais conversam com seus filhos sobre estupro. Há cerca de 60 anos de pesquisa sobre assédio sexual na universidade e muitos livros sobre as experiências sexuais e comportamentos de jovens, incluindo suas experiências com assédio.", "titulo_pt": "O que as acusações de assédio sexual da Cornell 7 revelam sobre como os pais conversam com seus filhos sobre estupro", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 236610, "titulo": "Why it could be a bad idea to get AI to flirt for you", "url": "https://phys.org/news/2026-10-bad-idea-ai-flirt.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pessoa finalmente iniciou uma conversa online com um estranho que acha atraente, mas está tendo dificuldades para manter a conversa fluente. Ela considera usar uma assistente de inteligência artificial para ajudar nessa tarefa.", "titulo_pt": "Por que pode ser uma má ideia usar AI para flertar em seu lugar", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 236611, "titulo": "Four new frog species reveal more of Peru's biodiversity", "url": "https://phys.org/news/2026-10-frog-species-reveal-peru-biodiversity.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quatro novas espécies de rãs foram descritas, graças aos esforços do biólogo da FIU, Alessandro Catenazzi. Essa descoberta permite que a ciência estude essas espécies e explore seu potencial para mudar o mundo.", "titulo_pt": "Quatro novas espécies de rãs revelam mais da biodiversidade do Peru", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 236612, "titulo": "Hauntology examines how what happened in the past—and what didn't—informs the present", "url": "https://phys.org/news/2026-10-hauntology-didnt.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hauntology investiga como o que aconteceu no passado, e o que não aconteceu, influencia o presente. O fenômeno assustador é muito popular na cultura britânica, refletido em uma longa comemoração de Halloween, uma rica tradição de filmes de horror e um crescente interesse no estranho.", "titulo_pt": "Hauntology examina como o passado, e o que não ocorreu, influenciam o presente", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 236613, "titulo": "How a 'tropical' shortcut could help particle collider experiments", "url": "https://phys.org/news/2026-10-tropical-shortcut-particle-collider.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os aceleradores de partículas são caros não apenas para construir ou operar, mas também para prever os resultados das medições obtidas neles.", "titulo_pt": "Como um 'tropical' atalho poderia auxiliar as experimentações de colisores de partículas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 236624, "titulo": "NASA Releases MAX POWER Key Events for Media, Participants", "url": "https://www.nasa.gov/news-release/nasa-releases-max-power-key-events-for-media-participants/", "fonte_id": "nasa_news", "data_pub": "2026-10-30T19:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA anunciou eventos-chave para a exposição aeroespacial e show aéreo mais recente dos Estados Unidos, MAX POWER, que ocorrerá de 6 a 8 de novembro, no Centro Espacial Kennedy em Flórida. O evento incluirá várias experiências de parque organizadas em colaboração com a NASA e parceiros externos.", "titulo_pt": "NASA divulga eventos-chave para MAX POWER, exposição aeroespacial", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 236615, "titulo": "Survey reveals what students think about AI", "url": "https://phys.org/news/2026-10-survey-reveals-students-ai.html", "fonte_id": "phys_org", "data_pub": "2026-10-30T19:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Dartmouth AI Survey, um novo levantamento multianual, revelou que estudantes de universidade utilizam a IA principalmente para aprendizado e não para evitar trabalho, embora acreditem que seus colegas o façam.", "titulo_pt": "Enquete revela como estudantes de universidade percebem a utilização da IA", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 236352, "titulo": "La frase de El Principito sobre los vínculos: “Se debe pedir a cada cual lo que está a su alcance realizar”", "url": "https://www.lanacion.com.ar/sociedad/la-frase-de-el-principito-sobre-los-vinculos-se-debe-pedir-a-cada-cual-lo-que-esta-a-su-alcance-nid29102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T21:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O livro 'O Príncipe Encantado', que combina fábulas, filosofia e profundos reflexões, apresenta frases impactantes que podem influenciar a vida cotidiana das pessoas. Uma frase notável é sobre pedir a cada um o que está ao seu alcance realizar, refletindo sobre os vínculos humanos.", "titulo_pt": "A frase de o príncipe encantado sobre os vínculos: ‘se deve pedir a cada qual o que está ao seu alcance realizar’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 236126, "titulo": "Atores mostram bastidores da cena do primeiro beijo de Mau Mau e Felipe em 'Quem Ama Cuida'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/televisao/2026/10/atores-mostram-bastidores-da-cena-do-primeiro-beijo-de-mau-mau-e-felipe-em-quem-ama-cuida.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-30T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os atores João Victor Gonçalves e Pietro Antonelli compartilharam em suas redes socia n to the forest", "url": "https://www.euronews.com/video/2026/10/30/indonesia-nine-orangutans-rescued-from-wildfires-return-to-the-forest", "fonte_id": "euronews", "data_pub": "2026-10-30T11:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove orangotangos resgatados de incêndios florestais devastadores na Borneu, Indonésia, foram devolvidos à natureza após semanas de reabilitação. Entre eles estão quatro mães com seus filhos, incluindo três fêmeas grávidas.", "titulo_pt": "Indonésia: nove orangotangos resgatados de incêndios florestais retornam à floresta", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 234598, "titulo": "Novo foco de doença em aves em SC. O risco agora são os vizinhos", "url": "https://braziljournal.com/novo-foco-de-doenca-em-aves-em-sc-o-risco-agora-sao-os-vizinhos", "fonte_id": "brazil_journal", "data_pub": "2026-10-30T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A produção de aves no Brasil está em alerta máximo após a confirmação do terceiro foco da doença de Newcastle em uma granja comercial de perus em Nova Erechim, Santa Catarina, na terça-feira.", "titulo_pt": "Novo foco de doença em aves em santa catarina aumenta risco", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 234942, "titulo": "How drought and oil expansion are eroding livelihoods in Iraq's Hawizeh Marshes", "url": "https://www.middleeasteye.net/news/how-drought-and-oil-expansion-are-eroding-livelihoods-iraqs-hawizeh-marshes", "fonte_id": "middle_east_eye", "data_pub": "2026-10-30T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A seca e a expansão da extração de óleo estão destruindo o meio ambiente nos pântanos de Hawizeh, no Iraque, afetando a vida dos moradores que dependem daquele ecossistema frágil. A Unesco protege oficialmente os pântanos, mas a situação dos residentes está se deteriorando.", "titulo_pt": "Como a seca e a expansão do óleo estão destruindo a vida nos pântanos de Hawizeh, no iraque", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 234637, "titulo": "Clima: sexta-feira tem alertas de temporais e calorão pelo Brasil", "url": "https://www.metropoles.com/brasil/clima-sexta-feira-tem-alertas-de-temporais-e-calorao-pelo-brasil", "fonte_id": "metropoles", "data_pub": "2026-10-30T08:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O avanço de uma frente fria sobre o centro-sul do Brasil favorece a formação de nuvens carregadas, resultando em pancadas de chuvas volumosas. Alertas de temporais e calorão serão emitidos para esta sexta-feira.", "titulo_pt": "Clima: sexta-feira terá alertas de temporais e calorão pelo Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 234896, "titulo": "Smoke from wildfires killed 3,500 people in Indonesia in September: Report", "url": "https://www.aljazeera.com/news/2026/10/30/smoke-from-wildfires-killed-3500-people-in-indonesia-in-september-report?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-30T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatório indica que 3.500 pessoas morreram devido a fumaça proveniente de incêndios florestais em setembro na Indonésia. As chamas, causadas por secas prolongadas, cobriram a região com fuligem.", "titulo_pt": "Fumaça de incêndios florestais matou 3.500 pessoas na indonésia em setembro, relatório aponta", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 234879, "titulo": "DR Congo: MSF celebrates Ebola patient discharges in Ituri province", "url": "https://www.euronews.com/video/2026/10/30/dr-congo-msf-celebrates-ebola-patient-discharges-in-ituri-province", "fonte_id": "euronews", "data_pub": "2026-10-30T07:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Danzas e cantos eclodiram em um centro de tratamento de Ebola na República Democrática do Congo quando os últimos pacientes foram liberados. É a primeira vez desde maio que o centro administrado pela MSF não tem casos confirmados em tratamento, apesar da epidemia continuar em escala maior.", "titulo_pt": "República democrática do Congo: MSF comemora saídas de pacientes de Ebola na província de Ituri", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 234581, "titulo": "Cinco regiões de corais no Brasil estão em estado crítico e correm risco de colapso", "url": "https://www.cnnbrasil.com.br/ciencia/cinco-regioes-de-corais-no-brasil-estao-em-estado-critico-e-correm-risco-de-colapso/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T06:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cinco regiões de corais no Brasil estão em estado crítico e correm risco de colapso devido a poluição marinha, atividades de navegação e mudanças climáticas. A exploração de petróleo e gás também contribuem para o branqueamento dos corais.", "titulo_pt": "Cinco regiões de corais no Brasil estão em estado crítico e correm risco de colapso", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 234963, "titulo": "Fire pollution killed 3,560 people in Indonesia in September, report says", "url": "https://www.japantimes.co.jp/news/2026/10/30/asia-pacific/science-health/indonesia-wildfire-toll/", "fonte_id": "japan_times", "data_pub": "2026-10-30T06:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório indica que 3.560 pessoas morreram devido à poluição de fumaça em setembro na Indonésia. Cerca de 57,8 milhões de pessoas nesse mesmo mês estavam expostas a ar considerado inadequado ou perigoso.", "titulo_pt": "Incêndios causaram a morte de 3.560 pessoas na indonésia em setembro, relatório diz", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 234995, "titulo": "Indonesia’s wildfire smoke crisis claims over 3,500 lives in September", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3372692/indonesias-wildfire-smoke-crisis-claims-over-3500-lives-september", "fonte_id": "scmp", "data_pub": "2026-10-30T06:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo indica que cerca de 3.560 mortes no arquipélago indonésio em setembro foram causadas pela poluição resultante de fumos emitidos por incêndios florestais que duraram meses. Cerca de 57,8 milhões de pessoas na Indonésia estavam expostas a ar nocivo ou perigoso no mesmo mês, de acordo com a CREA, um think tank baseado em Helsinhigi.", "titulo_pt": "Crise de fumaça de incêndios florestais na indonésia causa mais de 3.500 mortes em setembro", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 236493, "titulo": "Cautious Hope For Mekong’s Irrawaddy Dolphins Amid a River in Crisis", "url": "https://thediplomat.com/2026/10/cautious-hope-for-mekongs-irrawaddy-dolphins-amid-a-river-in-crisis/", "fonte_id": "the_diplomat", "data_pub": "2026-10-30T05:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apesar da pesca ilegal e da construção de usinas hidrelétricas, as tentativas de conservar os golfinhos sagrados do Irrawaddy estão começando a dar resultados positivos.", "titulo_pt": "Cautela com esperança para os golfinhos sagrados do Irrawaddy diante de um rio em crise", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 233628, "titulo": "Informe oficial: ya se evacuaron 147.500 vacunos y búfalos de las zonas inundadas del Litoral", "url": "https://www.lanacion.com.ar/economia/campo/informe-oficial-ya-se-evacuaron-147500-bovinos-y-bufalos-de-las-zonas-inundadas-del-litoral-nid29102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T03:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Serviço Nacional de Sanidade e Qualidade Agroalimentar (Senasa) informa que 147.500 animais de rebanho já foram evacuados das áreas afetadas pela inundação no Litoral. A quantidade de animais transferidos desde agosto aumentou 102% em comparação com o mesmo período de 2025.", "titulo_pt": "Relatório oficial: 147.500 animais foram evacuados das áreas inundadas no Litoral", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 234026, "titulo": "Indonesia rain set to ease toxic haze in Singapore and Malaysia", "url": "https://www.japantimes.co.jp/news/2026/10/30/asia-pacific/science-health/indonesia-haze-rain/", "fonte_id": "japan_times", "data_pub": "2026-10-30T02:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A neblina tóxica causada pelas chamas da pior temporada de incêndios na história da Indonésia tem coberto cidades locais e se espalhado para países vizinhos durante semanas. A chuva prevista deve aliviar essa situação.", "titulo_pt": "Chuva deve amenizar neblina tóxica causada por incêndios na indonésia em singapura e malásia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 233708, "titulo": "El Niño-driven drought in Papua New Guinea a ‘national crisis’ as rivers dry up and local farms fail", "url": "https://www.theguardian.com/world/2026/oct/30/png-el-nino-drought-papua-new-guinea", "fonte_id": "guardian_world", "data_pub": "2026-10-30T01:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um histórico fenômeno El Niño está causando uma severa escassez de alimentos, água e energia elétrica, afetando até 8 milhões de pessoas em Papua Nova Guiné. O país está enfrentando uma crise nacional devido à seca extrema, com encerramentos de clínicas de saúde e interrupções no ensino.", "titulo_pt": "Seca provocada pelo el niño em Papua nova Guiné se torna uma ‘crise nacional’", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 236362, "titulo": "Un agente de ICE fue acusado de atropellar a un trabajador mexicano durante una persecución: “Le pisó las dos piernas”", "url": "https://www.lanacion.com.ar/el-mundo/un-agente-de-ice-fue-acusado-de-atropellar-a-un-trabajador-mexicano-durante-una-persecucion-le-piso-nid30102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-30T21:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um agente do ICE enfrenta acusações de agressão após supostamente atropelar deliberadamente Miguel Parra Hernández, um trabalhador mexicano, atingindo suas duas pernas. Morales agora está sendo processado por este incidente.", "titulo_pt": "Agente do ICE é acusado de atropelar trabalhador mexicano, que teve as duas pernas atingidas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 236182, "titulo": "Missão federal vai a MS após denúncias de violência contra comunidades indígenas", "url": "https://veja.abril.com.br/politica/missao-federal-vai-a-ms-apos-denuncias-de-violencia-contra-comunidades-indigenas/", "fonte_id": "veja", "data_pub": "2026-10-30T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma comitiva liderada por Sônia Guajajara, composta por representantes de três ministérios, chegou a Dourados com o objetivo de investigar relatos de ameaças enfrentadas por comunidades indígenas Guarani e Kaiowá.", "titulo_pt": "Missão federal vai a mato grosso do sul após denúncias de violência contra comunidades indígenas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 236523, "titulo": "Los fallos judiciales que contradicen la versión de Rabat acerca de que la ley obliga a aceptar las rebajas de condena", "url": "https://www.ciperchile.cl/2026/10/30/los-fallos-judiciales-que-contradicen-la-version-de-rabat-acerca-de-que-la-ley-obliga-a-aceptar-las-rebajas-de-condena/?utm_source=rss&utm_medium=rss&utm_campaign=los-fallos-judiciales-que-contradicen-la-version-de-rabat-acerca-de-que-la-ley-obliga-a-aceptar-las-rebajas-de-condena", "fonte_id": "ciper_chile", "data_pub": "2026-10-30T19:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute falhas judiciais que contradizem a versã classe": "A"}, {"id": 235815, "titulo": "Ethnic cleansing fears rise as Israel squeezes space in Gaza: UN", "url": "https://www.aljazeera.com/news/2026/10/30/ethnic-cleansing-fears-rise-as-israel-squeezes-space-in-gaza-un?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-30T14:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ONU relata preocupações com o medo de limpeza étnica à medida que as forças israelenses avançam a linha amarela para o oeste em Gaza. De acordo com a OHCHR, as forças israelenses estão tratando essa linha como uma 'zona de morte'.", "titulo_pt": "Medo de limpeza étnica cresce à medida que Israel comprime espaço em Gaza: ONU", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 235553, "titulo": "Beijing Queer film festival cancelled after harassment from authorities", "url": "https://www.theguardian.com/world/2026/oct/30/beijing-queer-film-festival-cancelled-after-police-harassment", "fonte_id": "guardian_world", "data_pub": "2026-10-30T11:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Beijing Queer film festival foi cancelada após uma campanha de hostilidade persistente por parte das autoridades. O festival, que seria realizado na capital chinesa, é um dos mais antigos do país.", "titulo_pt": "Festival de cinema gay de beijing cancelado após harassamento das autoridades", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 234776, "titulo": "Por qué la cifra de muertos en el terremoto de Venezuela podría ser mayor de la que declara su gobierno", "url": "https://www.latercera.com/tendencias/noticia/por-que-la-cifra-de-muertos-en-el-terremoto-de-venezuela-podria-ser-mayor-de-la-que-declara-su-gobierno/", "fonte_id": "la_tercera", "data_pub": "2026-10-30T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo do Serviço Geológico dos Estados Unidos, uma análise de prédios derrubados e registros não oficiais de d function toggleDrill(id) {

  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
