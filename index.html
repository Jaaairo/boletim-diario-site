feitos definiu áreas sensíveis do orçamento e solicitaram uma mesa de trabalho ao governo. Eles expressaram preocupação com a falta de clareza no financiamento da saúde primária e outros assuntos.", "titulo_pt": "Prefeitos definem áreas sensíveis do orçamento e pedem mesa de trabalho ao governo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 213380, "titulo": "Radar LT | Estudio desafía los mitos generacionales en el mundo laboral", "url": "https://www.latercera.com/videos/noticia/radar-lt-estudio-desafia-los-mitos-generacionales-en-el-mundo-laboral/", "fonte_id": "la_tercera", "data_pub": "2026-10-20T16:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Ipsos indica que as diferenças no mercado de trabalho são influenciadas mais pelas fases de vida do que pela idade. O Foro Tálanton discutirá os desafios da longevidade e da convivência multigeneracional no Chile.", "titulo_pt": "Estudo desafia mitos generacionais no mercado de trabalho", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 213288, "titulo": "Indústria da solidão: os serviços que oferecem companhia a chineses solitários", "url": "https://www.bbc.com/portuguese/articles/cjn5vq4p0pdlo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-20T14:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A solidão tem crescido na China, levando a novas profissões que oferecem apoio e companhia. Esses serviços visam atender a um aumento na demanda de pessoas que buscam interação social.", "titulo_pt": "Indústria da solidão: os serviços que oferecem companhia a chineses solitários", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 214292, "titulo": "They Fled Trump’s America. Now They Regret It", "url": "https://www.wired.com/story/they-fled-trumps-america-now-they-regret-it/", "fonte_id": "wired", "data_pub": "2026-10-20T10:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Eles fugiram da América sob o governo de Trump, mas agora se arrependeram. A internet os levou a acreditar que a Europa era um paraíso social, mas descobriram que os trens são ruins, a saúde não é gratuita e as pessoas podem ser muito mal-educadas.", "titulo_pt": "Eles fugiram da américa sob o governo de Trump. Agora, eles se arrependeram.", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 213761, "titulo": "Empathy divides Americans by religion, with white evangelicals standing apart", "url": "https://www.axios.com/2026/10/20/religious-divide-empathy-democrats-republicans", "fonte_id": "axios", "data_pub": "2026-10-20T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo levantamento realizado pelo PRRI mostrou que os evangélicos brancos são a única grande grupo religioso onde a maioria acredita que a empatia pode ser perigosa quando leva as pessoas embora de uma sociedade guiada pela verdade de Deus. Este resultado se insere em um conflito silencioso dentro do cristianismo americano sobre quem merece empatia, com conservadores, incluindo pastores evangélicos e Elon Musk, tendo se posicionado contra a empatia em debates sobre imigração, justiça racial e direitos LGBTQ+.", "titulo_pt": "Empatia divide americanos por religião, com evangélicos brancos em posição única", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 214125, "titulo": "Threats of political violence soar in Australia’s ‘online echo chamber’", "url": "https://www.japantimes.co.jp/news/2026/10/20/asia-pacific/politics/australia-echo-chamber/", "fonte_id": "japan_times", "data_pub": "2026-10-20T08:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A parlamentar independente Helen Haines, em estado crítico, foi atingida deliberadamente por um carro. As ameaças de violência política aumentaram na Austrália devido ao que se chama de 'câmara de eco online'.", "titulo_pt": "Ameaças de violência política crescem na 'câmara de eco online' da austrália", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 213934, "titulo": "What’s making Europe so angry? The frustration behind the protests", "url": "https://www.cnbc.com/2026/10/20/france-protests-europe-cost-living-violence.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-20T07:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos eclodiram em França e vários países europeus em resposta a altos custos de vida, condições ruins de ensino e uma crise habitacional.", "titulo_pt": "O que está fazendo a Europa tão irritada? A frustração por trás das manifestações", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 213547, "titulo": "A young life ‘dominated by gambling’: Victorian coroner delivers stinging findings on death of 22-year-old", "url": "https://www.theguardian.com/australia-news/2026/oct/20/kyle-hudson-inquest-victorian-coroner-gambling-online-betting-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-10-20T06:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O inquérito apontou que a aposta online esportiva foi a 'causa direta e principal' que levou Kyle Hudson, de 22 anos, a se suicidar. Hudson era descrito como um jovem com grande potencial e apoio de família e amigos, mas estava sob o 'domínio' do jogo online.", "titulo_pt": "Vida jovem 'dominada pelo jogo': corregedor victoriano entrega achados críticos sobre morte de 22 anos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 214138, "titulo": "Fewer than 1 in 3 families want a second child amid rising costs, study finds", "url": "https://www.japantimes.co.jp/news/2026/10/20/japan/society/couple-second-child-inflation-pressures/", "fonte_id": "japan_times", "data_pub": "2026-10-20T05:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da Meiji Yasuda Life revelou que menos de 30% das famílias querem ter um segundo filho devido ao aumento dos custos. O número de pais interessados em ter um segundo filho caiu quase 57% em comparação com 2020.", "titulo_pt": "Menos de 1 em 3 famílias querem ter um segundo filho devido aos crescentes custos, estudo mostra", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 214139, "titulo": "Alberta voters reject separation from Canada as Carney triumphs", "url": "https://www.japantimes.co.jp/news/2026/10/20/world/politics/alberta-referendum-vote/", "fonte_id": "japan_times", "data_pub": "2026-10-20T05:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os eleitores de Alberta rejeitaram a separação do Canadá, e Carney venceu a campanha referendária. A campanha longa criou divisões no coração energético do país.", "titulo_pt": "Voters de alberta rejeitam separação do canadá e Carney vence campanha", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 213844, "titulo": "Italy, Spain, Belgium, Portugal: Social unrest spreads across Europe amid soaring energy prices and a housing crisis", "url": "https://www.lemonde.fr/en/international/article/2026/10/20/italy-spain-belgium-portugal-social-unrest-spreads-across-europe-amid-soaring-energy-prices-and-a-housing-crisis_6759435_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-20T04:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos sociais estão se espalhando por vários países da Europa, incluindo Itália, Espanha e Portugal, devido a altos preços de energia e crise imobiliária. Uma greve geral está programada para Itália em 20 de novembro, enquanto manifestações semelhantes estão previstas para 11 de novembro em Espanha e Portugal.", "titulo_pt": "Itália, Espanha, bélgica, Portugal: incontentamento social se alastra pela Europa em meio a altos preços de energia e crise imobiliária", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 213845, "titulo": "How much is the cost of living in France rising? What the data say", "url": "https://www.lemonde.fr/en/les-decodeurs/article/2026/10/20/how-much-is-the-cost-of-living-in-france-rising-what-the-data-say_6759402_8.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-20T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inflação e os salários estagnados estão afetando o padrão de vida na França, conforme analisado pelo Le Monde. O artigo detalha como o custo de vida na França tem mudado.", "titulo_pt": "Quanto está aumentando o custo de vida na França? O que os dados dizem", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 214167, "titulo": "EDITORIAL: Energy policy and security", "url": "https://www.taipeitimes.com/News/editorials/archives/2026/10/21/2003866324", "fonte_id": "taipei_times", "data_pub": "2026-10-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O editorial aborda a política energética e a segurança energética.", "titulo_pt": "Edital EDITORIAL: política energética e segurança energética", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 213123, "titulo": "O que é a doença de Newscastle, que interditou granja em SC e levou México a suspender compra de frango do Brasil", "url": "https://veja.abril.com.br/saude/o-que-e-a-doenca-de-newscastle-que-interditou-granja-em-sc-e-levou-mexico-a-suspender-compra-de-frango-do-brasil/", "fonte_id": "veja", "data_pub": "2026-10-20T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A doença de Newcastle é uma infecção viral e altamente contagiosa que afeta tanto aves domésticas quanto silvestres. O Ministério da Agricultura, Pecuária e Abastecimento (MAPA) informou que não há risco de contaminação pelo consumo de carne de frango.", "titulo_pt": "O que é a doença de newcastle, que interditou granja em SC e levou México a suspender compra de frango do Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 213211, "titulo": "Estudo associa calor a 46 mil mortes por doenças respiratórias no Brasil", "url": "https://www.cnnbrasil.com.br/saude/estudo-associa-calor-a-46-mil-mortes-por-doencas-respiratorias-no-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-20T16:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo analisou dados de 646 municípios no Brasil entre 2010 e 2020 e associou calor a 46 mil mortes por doenças respiratórias. A região Norte mostrou maior vulnerabilidade às altas temperaturas.", "titulo_pt": "Estudo associa calor a 46 mil mortes por doenças respiratórias no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 213912, "titulo": "Heavy rain causes widespread flooding in France’s Marseille", "url": "https://www.euronews.com/video/2026/10/20/heavy-rain-causes-widespread-flooding-in-frances-marseille", "fonte_id": "euronews", "data_pub": "2026-10-20T14:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fortes chuvas provenientes de um sistema meteorológico do Mediterrâneo causaram inundações em várias áreas da região sudeste da França, submergindo ruas e estradas no departamento de Bouches-du-Rhône.", "titulo_pt": "Fortes chuvas causam inundações em marselha, França", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 214520, "titulo": "Q&A: Why a pivotal IPCC meeting in Ethiopia ended in ‘profound disappointment’", "url": "https://www.carbonbrief.org/qa-why-a-pivotal-ipcc-meeting-in-ethiopia-ended-in-profound-disappointment", "fonte_id": "carbon_brief", "data_pub": "2026-10-20T14:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Países falharam pela sexta vez consecutiva em alcançar um consenso sobre o cronograma para publicação do relatório do Painel Intergovernmental sobre Mudanças Climáticas (IPCC). A reunião crucial realizada na Étiopía terminou com 'grande decepção'.", "titulo_pt": "Perguntas e respostas: por que uma reunião-chave do IPCC na étiopía terminou com 'grande decepção'?", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 213846, "titulo": "16 new bear cubs detected in French Pyrénées, but inbreeding problems persist", "url": "https://www.lemonde.fr/en/environment/article/2026/10/20/16-new-bear-cubs-detected-in-french-pyrenees-but-inbreeding-problems-persist_6760030_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-20T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório mais recente sobre o monitoramento dos ursos publicado pelo Serviço Francês para a Biodiversidade estima que quase 130 ursos vivem nas Pyrénées. No entanto, a preservação genética da população ainda não está garantida.", "titulo_pt": "16 Novos ursos-prego detectados nas Pyrénées, mas problemas de inbreeding persistem", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 213536, "titulo": "Giving £2 a day to people in the Amazon helps protect rainforest, pilot project finds", "url": "https://www.theguardian.com/environment/2026/oct/20/unconditional-basic-income-amazon-rainforest-peru-study", "fonte_id": "guardian_world", "data_pub": "2026-10-20T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Universidade de Bath indica que quase 90% dos participantes de um projeto de renda básica incondicional no Peru adotaram práticas ambientalmente benéficas. O projeto forneceu uma renda básica incondicional a povos indígenas na Amazônia peruana e contribuiu para a proteção da floresta tropical.", "titulo_pt": "Dar £2 por dia a pessoas na amazônia ajuda a proteger a floresta", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 214021, "titulo": "The hidden water crisis beneath the American west", "url": "https://www.ft.com/content/ff5859fb-dfa6-4fe5-a5cf-824a98ad32d4?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-20T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A região está se secando, e cidades e agricultores estão extraíndo água subterrânea, que é a principal causa de perda de água no Vale do Rio Colorado.", "titulo_pt": "A crise oculta da água sob o oeste americano", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 213923, "titulo": "At least 14 killed and seven injured in landslide at illegal gold mine in Colombia", "url": "https://www.euronews.com/2026/10/20/at-least-14-killed-and-seven-injured-in-landslide-at-illegal-gold-mine-in-colombia", "fonte_id": "euronews", "data_pub": "2026-10-20T06:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 14 pessoas morreram e sete ficaram feridas em um deslizamento de terra em uma mina ilegal de ouro na Colômbia. Nas proximidades de Narino, uma área de mineração ilegal no limite com o Equador, grupos armados controlam o comércio clandestino de ouro, além de traficar drogas e praticar extorsão.", "titulo_pt": "Pelo menos 14 mortos e sete feridos em deslizamento de terra em mina ilegal de ouro na colômbia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 213926, "titulo": "Residents clean up as deadly floods devastate eastern Spain", "url": "https://www.euronews.com/video/2026/10/20/residents-clean-up-as-deadly-floods-devastate-eastern-spain", "fonte_id": "euronews", "data_pub": "2026-10-20T06:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Residentes de Els Poblets, perto de Alicante, estavam limpar resíduos de lama e móveis danificados na segunda-feira após inundações em regiões leste da Espanha que deixaram pelo menos duas pessoas mortas.", "titulo_pt": "Moradores limpam após inundações fatais devastarem região leste da Espanha", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 213336, "titulo": "Condenan a guatemalteco por muerte de migrantes abandonados en un tráiler en Texas en 2022", "url": "https://www.clarin.com/estados-unidos/condenan-a-guatemalteco-por-muerte-de-migrantes-abandonados-en-un-trailer-en-texas-en-2022_0_TPQ8XnSLtE.html", "fonte_id": "clarin", "data_pub": "2026-10-20T17:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um guatemalteco foi condenado a 30 anos de prisão nos Estados Unidos por causa da morte de 53 migrantes em um tráiler em Texas em 2022. Ele era parte de uma rede de tráfico humano.", "titulo_pt": "Guatemalteco condenado a 30 anos por mortes de migrantes em tráiler em Texas", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 213338, "titulo": "Confirmado en Carolina del Norte: cinco policías renunciaron por presuntos mensajes racistas y el FBI podría investigar sus detenciones", "url": "https://www.clarin.com/estados-unidos/confirmado-carolina-norte-policias-renunciaron-presuntos-mensajes-racistas-fbi-podria-investigar-detenciones_0_M5GJo92tVF.html", "fonte_id": "clarin", "data_pub": "2026-10-20T17:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Cinco policiais do Departamento de Polícia de Charlotte-Mecklenburg, na Carolina do Norte, renunciaram após a descoberta de mensagens racistas. As autoridades estão revisando gravações corporais e registros de detenções para verificar se houve comportamentos discriminatórios.", "titulo_pt": "Confirmado na Carolina do Norte: cinco policiais renunciaram por mensagens racistas e FBI pode investigar suas detenções", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 213997, "titulo": "JERUSALEM DAILY: Half a million Palestinians lose food aid", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/20/jerusalem-daily-half-a-million-palestinians-lose-food-aid?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-20T16:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israeli ataques causaram mortes entre palestinos em Gaza, enquanto a falta de fundos ameaça o fornecimento de alimentos a meio milhão de pessoas.", "titulo_pt": "Diário de jerusalém: meio milhão de palestinos perdem assistência alimentar", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 213551, "titulo": "Why are French police so violent? Their job is to protect the state, not the people", "url": "https://www.theguardian.com/world/2026/oct/20/france-culture-violent-policing-protests-riots", "fonte_id": "guardian_world", "data_pub": "2026-10-20T16:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia francesa é conhecida por usar força física significativa em resposta a protestos, diferentemente da maioria dos países europeus ocidentais que tendem a priorizar a contenção da multidão e a desarmamentização. Os policiais franceses são vistos como instrumentos do estado que reprimem, em vez de gerenciar, a dissidência pública.", "titulo_pt": "Por que a polícia francesa é tão violenta?", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 214524, "titulo": "At least 12 children reportedly killed in separate incidents in West Kordofan and Khartoum, Sudan", "url": "https://www.unicef.org/press-releases/least-12-children-reportedly-killed-separate-incidents-west-kordofan-and-khartoum", "fonte_id": "unicef", "data_pub": "2026-10-20T14:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ao menos 12 crianças foram mortas em incidentes separados no estado de West Kordofan e na capital Khartoum, Sudão.", "titulo_pt": "Ao menos 12 crianças mortas em incidentes separados no sudão", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 214176, "titulo": "19.2 million Afghans could soon face ‘acute food insecurity’: UN", "url": "https://www.scmp.com/news/world/russia-central-asia/article/3371551/192-million-afghans-could-soon-face-acute-food-insecurity-un", "fonte_id": "scmp", "data_pub": "2026-10-20T14:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização das Nações Unidas (ONU) advertiu que o número de pessoas enfrentando insegurança alimentar aguda no Afeganistão pode ultrapassar 19 milhões durante o inverno. Mais de quatro milhões de bebês e crianças menores de seis anos precisarão de tratamento para desnutrição aguda no próximo ano, de acordo com a agência humanitária da ONU, OCHA.", "titulo_pt": "Mais de 19 milhões de afegãos podem enfrentar insegurança alimentar aguda no inverno, avisa a ONU", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 214177, "titulo": "Hong Kong child sex sentences remain far below maximum life, report finds", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3371548/hong-hong-child-sex-sentences-remain-far-below-maximum-life-report-finds", "fonte_id": "scmp", "data_pub": "2026-10-20T14:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As sentenças médias para os crimes sexuais mais graves contra crianças em Hong Kong permaneceram abaixo de 10 anos nos últimos 30 anos, bem abaixo da pena máxima de prisão perpétua. Isso levou a uma chamada por um conselho de sentenças para fornecer diretrizes judiciais mais claras.", "titulo_pt": "Sentenças para crimes sexuais contra crianças em hong Kong permanecem abaixo da pena máxima", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 213843, "titulo": "'The repression of France's high school and social movements is already historic in scale'", "url": "https://www.lemonde.fr/en/opinion/article/2026/10/20/the-repression-of-france-s-high-school-and-social-movements-is-already-historic-in-scale_6760063_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-20T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quentin Deluermoz, um professor da Universidade Paris Cité, reflete sobre a importância de várias referências à Revolução Francesa, à Comuna de Paris e aos protestos de maio de 1968 que moldaram os protestos de outubro de 2017, argumentando que essas r const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
