onte_id": "folha_mercado", "data_pub": "2026-11-19T17:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Associações setoriais apresentaram dados alarmantes na Câmara dos Deputados sobre a dificuldade das empresas em implementar a nova escala de trabalho após o fim da escala 6x1. Estudos mostram a necessidade de contratações adicionais de milhares de trabalhadores, refletindo um aperto na oferta de mão de obra.", "titulo_pt": "Entidades apresentam dados alarmantes na Câmara sobre fim da escala 6x1", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 274686, "titulo": "Lula anuncia novo ministério e total deve chegar a 40", "url": "https://veja.abril.com.br/brasil/lula-anuncia-novo-ministerio-e-total-deve-chegar-a-40/", "fonte_id": "veja", "data_pub": "2026-11-19T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula anunciou a criação de um novo ministério que se encarregará de políticas para idosos. O nome da nova pasta ainda será definido.", "titulo_pt": "Lula anuncia novo ministério para políticas com idosos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 274772, "titulo": "Fachin autoriza PF a acessar dados sobre gastos de Vorcaro com autoridades", "url": "https://www.cnnbrasil.com.br/politica/fachin-autoriza-pf-a-acessar-dados-sobre-gastos-de-vorcaro-com-autoridades/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T16:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa Signature Luxury Services deve fornecer dados sobre os gastos de alto padrão com agentes públicos, incluindo o senador Ciro Nogueira. A autorização foi concedida pelo juiz Fachin à Polícia Federal para acessar essas informações.", "titulo_pt": "Fachin autoriza PF a acessar dados sobre gastos de Vorcaro com agentes públicos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 274626, "titulo": "IFI alerta que 'bondades' de Lula na eleição apertam máquina pública e pede ajuste 'profundo'", "url": "https://g1.globo.com/economia/noticia/2026/11/19/orgao-do-senado-alerta-que-bondades-de-lula-nas-eleicoes-apertam-maquina-publica-e-pede-ajuste-fiscal-profundo.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-19T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Instituição Fiscal Independente (IFI), vinculada ao Senado, alertou que as medidas propostas pelo presidente Lula durante a campanha podem dificultar o funcionamento da máquina pública nos próximos anos, devido ao impacto nos gastos livres do governo. Entre as propostas estão reajustes de programas sociais e ações que podem aumentar despesas do governo.", "titulo_pt": "IFI avisa que 'bondades' de Lula na eleição apertam máquina pública e pede ajuste 'profundo'", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 274907, "titulo": "Alcolumbre e Motta apostam na Lei da Dosimetria para destravar reeleição, mas dependem de Moraes", "url": "https://www.jota.info/legislativo/alcolumbre-e-motta-apostam-na-lei-da-dosimetria-para-destravar-reeleicao-mas-dependem-de-moraes", "fonte_id": "jota", "data_pub": "2026-11-19T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alcolumbre e Motta esperam que a Lei da Dosimetria seja válida para facilitar a reeleição dos presidentes do Senado e da Câmara, mas isso dependerá da decisão do ministro Moraes. A validação da norma pode diminuir a oposição bolsonarista à reeleição dos dois parlamentares.", "titulo_pt": "Alcolumbre e Motta apostam na Lei da Dosimetria para reeleição, mas dependem de Moraes", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 274589, "titulo": "Fachin mantém prisão de primo de Vorcaro por risco de ingerência na investigação do caso Master", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/fachin-mantem-prisao-de-primo-de-vorcaro-por-risco-de-ingerencia-na-investigacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T16:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, ministro Edson Fachin, decidiu manter a prisão preventiva de Felipe Vorcaro, primo do ex-banqueiro Daniel Vorcaro, por risco de novos crimes. A decisão foi tomada nesta quinta-feira (19).", "titulo_pt": "Fachin mantém prisão de primo de Vorcaro por risco de novos crimes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 274643, "titulo": "Prevendo judicialização, Lula cobra atenção à aplicação da escala 5x2", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/prevendo-judicializacao-lula-cobra-atencao-aplicacao-da-escala-5x2", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-19T16:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva alertou para a necessidade de preparo do movimento sindical, do Ministério do Trabalho e Emprego e da Justiça do Trabalho para lidar com possíveis conflitos durante a implementação da jornada de trabalho 5x2 e a redução da carga horária semanal. Lula anticipou que haverá confusões e queixas.", "titulo_pt": "Lula avisa sobre possíveis conflitos com nova jornada de trabalho", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 274576, "titulo": "Salles na Justiça é escárnio de Tarcísio com São Paulo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/marcosaugustogoncalves/2026/11/salles-na-justica-e-escarnio-de-tarcisio-com-sao-paulo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-19T16:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tarcísio de Freitas escolheu Ricardo Salles para a Secretaria da Justiça e Cidadania de São Paulo, o que é visto como uma zombaria pelo governador contra o estado e o Brasil em geral. O governador se apresenta como administrador competente, moderado e técnico, mas essa percepção não se sustenta com a escolha de Salles.", "titulo_pt": "Título traduzido: escolha de salles é zombaria de Tarcísio contra São Paulo e Brasil", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 274627, "titulo": "Ministro afirma que pacote fiscal dará segurança ao mercado, mas admite possíveis novas medidas para cumprir metas", "url": "https://g1.globo.com/politica/blog/camila-bomfim/post/2026/11/19/moreti-fiscal-mercado.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-19T16:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Planejamento e Orçamento, Bruno Moretti, afirmou que o pacote fiscal dará segurança ao mercado, mas admitiu que novas medidas podem ser tomadas para cumprir as metas fiscais. Moretti espera que o projeto economize cerca de R$ 50 bilhões a partir de 2027.", "titulo_pt": "Ministro diz que pacote fiscal dará segurança ao mercado, mas admite possíveis novas medidas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 275018, "titulo": "Iran’s ‘Boiling Frog’ Strategy", "url": "https://foreignpolicy.com/2026/11/19/iran-war-us-strikes-dirty-bomb-trump-congress-democrats-vali-nasr/", "fonte_id": "foreign_policy", "data_pub": "2026-11-19T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Té Hitch, a estratégia do Irã de afetar o Ocidente de forma gradual está funcionando, segundo a perspectiva do país.", "titulo_pt": "A estratégia 'coxilhando rana' do Irã", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 275019, "titulo": "Is This the Beginning of the End for Modi?", "url": "https://foreignpolicy.com/2026/11/19/beginning-end-modi-protests/", "fonte_id": "foreign_policy", "data_pub": "2026-11-19T17:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há sinais de descontentamento político na Índia e a resposta do governo está começando a se agravar.", "titulo_pt": "É isto o início do fim para Modi?", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 274987, "titulo": "UK-EU reset talks will go ‘down to the wire’ as crunch summit approaches", "url": "https://www.theguardian.com/world/2026/nov/19/uk-eu-reset-talks-andy-burnham-food-farming-tuition-fees", "fonte_id": "guardian_world", "data_pub": "2026-11-19T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Negociações entre Reino Unido e União Europeia para um novo acordo estão prestes a se concluir, com tensões persistindo sobre o papel do Reino Unido na formação de regras futuras para alimentos e agricultura na UE. O Reino Unido teria oferecido uma concessão em um esquema de mobilidade para jovens cidadãos da UE, permitindo que 100.000 jovens venham ao Reino Unido anualmente.", "titulo_pt": "Negociações reino unido-eu irão até o último minuto com cúpula decisiva se aproximando", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 275021, "titulo": "MAGA Finds a New Cabal", "url": "https://www.theatlantic.com/technology/2026/11/indian-american-anti-semitism-far-right/689487/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-19T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O plano de anti-semitismo está sendo aplicado contra indianos americanos.", "titulo_pt": "MAGA encontra um novo círculo", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 275156, "titulo": "Middle East conflict poses biggest threat to global energy security in history, IEA warns", "url": "https://www.euronews.com/2026/11/19/middle-east-conflict-poses-biggest-threat-to-global-energy-security-in-history-iea-warns", "fonte_id": "euronews", "data_pub": "2026-11-19T17:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A crise no Oriente Médio representa a maior ameaça à segurança energética global na história, conforme alerta a Agência Internacional de Energia. A interrupção das suprimentos de petróleo através do Estreito de Ormuz está elevando os custos para as famílias, e a agência afirma que a recuperação dos mercados energéticos globais será mais difícil à medida que a crise se prolonga.", "titulo_pt": "Conflito no oriente médio representa maior ameaça à segurança energética global, avisa IEA", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 275185, "titulo": "‘Not an acquittal’: After impeachment vote, Hegseth still under microscope", "url": "https://www.aljazeera.com/news/2026/11/19/not-an-acquittal-after-impeachment-vote-hegseth-still-under-microscope?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-19T17:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma semana após um tentativo falho de impeachment, analistas afirmam que Hegseth continua enfrentando críticas por sua liderança no Pentágono.", "titulo_pt": "‘Não é uma absolvição’: após o voto de impeachment, Hegseth ainda é analisado", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 274979, "titulo": "China, Russia and US agree peace declaration with no mention of Ukraine and Iran wars", "url": "https://www.theguardian.com/world/2026/nov/19/china-russia-us-agree-peace-statement-no-mention-ukraine-iran-wars", "fonte_id": "guardian_world", "data_pub": "2026-11-19T17:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China, Rússia e EUA concordaram com um documento de paz após uma cúpula tripartite inédita, mas o documento não mencionou as guerras na Ucrânia e no Irã, causadas por dois dos participantes. Os países listaram prioridades que incluem reforma da ONU, aumento da produção de petróleo e proteção do imunidade diplomática.", "titulo_pt": "China, Rússia e EUA assinam declaração de paz sem mencionar guerras na Ucrânia e no Irã", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 275144, "titulo": "Online content creators will have to follow French election pluralism rules, media regulator says", "url": "https://www.lemonde.fr/en/politics/article/2026/11/19/online-content-creators-will-have-to-follow-french-election-pluralism-rules-regulator-says_6784457_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-19T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Regulador francês Arcom estendeu a regra de pluralismo eleitoral a grandes criadores de conteúdo do YouTube e podcasters. As estações de televisão e rádios francesas são obrigadas a oferecer tempo de ar ao menos para todos os candidatos ou partidos presidenciais.", "titulo_pt": "Criadores de conteúdo online terão que seguir regras de pluralismo eleitoral na França, diz regulador", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 275383, "titulo": "STAT+: Lawmakers want U.S. biotech to outcompete China", "url": "https://www.statnews.com/2026/11/19/biotech-news-lawmakers-want-us-biotech-to-outcompete-china/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-19T17:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Legisladores liderando a Caixa de Biotecnologia do Congresso dos EUA afirmam que Washington precisa agir nessa área e de forma rápida.", "titulo_pt": "Congressistas querem que a biotecnologia dos EUA superem a China", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 275067, "titulo": "Myanmar committed genocide against Rohingya minority, top UN court rules", "url": "https://www.bbc.co.uk/news/articles/c804wzp20ddvo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-19T16:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Corte Internacional de Justiça declarou que a Birmanha cometeu genocídio contra a minoria rohingya em 2017. A sentença é inédita e envolve um ataque militar que resultou em milhares de mortes naquele ano.", "titulo_pt": "Corte internacional de justiça concluiu que a birmanha cometeu genocídio contra a minoria Rohingya", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 275158, "titulo": "Iraq orders armed factions to withdraw from strategic area amid alleged oil smuggling and US pressure", "url": "https://www.euronews.com/2026/11/19/iraq-orders-armed-factions-to-withdraw-from-strategic-area-amid-alleged-oil-smuggling-and-", "fonte_id": "euronews", "data_pub": "2026-11-19T16:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Iraque, Ali Faleh al-Zaidi, ordenou que um grupo apoiado pelo Irã se retire de uma área estratégica até esta sexta-feira, em meio a crescentes pressões de Washington para que o governo controle as milícias poderosas.", "titulo_pt": "Iraque ordena retirada de grupo armado estratégico sob alegações de comércio ilegal de petróleo e pressão dos EUA", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 275147, "titulo": "Noose tightens around former Hungarian prime minister Viktor Orban", "url": "https://www.lemonde.fr/en/international/article/2026/11/19/noose-tightens-around-former-hungarian-prime-minister-viktor-orban_6784455_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-19T16:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades húngaras recuperaram aproximadamente 18 milhões de euros em dinheiro como parte de uma investigação sobre acusações de desvios de fundos envolvendo um ex-ministro sob a liderança de Viktor Orban. O dinheiro foi encontrado enterrado em uma floresta, escondido em cofres, armazéns e até mesmo dentro de um comedouro de pássaros.", "titulo_pt": "Enchame seita-se ao redor do ex-primeiro-ministro húngaro Viktor Orban", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 274922, "titulo": "U.N. Court Rules Myanmar Committed Genocide Against Rohingya", "url": "https://www.nytimes.com/live/2026/11/19/world/myanmar-icj-ruling-genocide", "fonte_id": "nyt_world", "data_pub": "2026-11-19T16:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A International Court of Justice determinou que Myanmar cometeu genocídio contra o povo rohingya, tornando-se o primeiro estado a ser responsabilizado por violar a Convenção de Genocídio de 1948. O julgamento tem implicações amplas.", "titulo_pt": "Tribunal das nações unidas condena Myanmar por genocídio contra Rohingya", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 274695, "titulo": "O que EUA, China e Rússia disseram sobre risco de guerra nuclear", "url": "https://veja.abril.com.br/mundo/o-que-eua-china-e-russia-disseram-sobre-risco-de-guerra-nuclear/", "fonte_id": "veja", "data_pub": "2026-11-19T16:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O encontro trilateral entre Trump, Xi e Putin abordou os arsenais atômicos das três maiores potências nucleares do mundo.", "titulo_pt": "O que EUA, China e Rússia disseram sobre risco de guerra nuclear", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 274819, "titulo": "Por que Justiça anulou condenação da Marinha por ataque à memória de João Cândido, 116 anos após Revolta da Chibata", "url": "https://www.bbc.com/portuguese/articles/cwjd735m9093o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-19T16:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça anulou a condenação da Marinha por um ataque à memória de João Cândido, ocorrido 116 anos após a Revolta da Chibata. No mês da Consciência Negra, o Ministério Público foi notificado sobre essa decisão, que se refere a uma carta que chamou Cândido e seus companheiros de 'abjetos'.", "titulo_pt": "Por que Justiça anulou condenação da Marinha por ataque à memória de João Cândido, 116 anos após Revolta da Chibata", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 274981, "titulo": "New page in history? Xi, Trump and Putin summit was more of a footnote", "url": "https://www.theguardian.com/world/2026/nov/19/new-page-in-history-xi-trump-and-putin-summit-was-more-of-a-footnote", "fonte_id": "guardian_world", "data_pub": "2026-11-19T15:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O encontro entre Xi, Trump e Putin em Shenzhen não alcançou os grandes objetivos declarados em Yalta em 1945. Embora seja considerado histórico como o primeiro encontro entre os líderes dos três países, provavelmente não terá um impacto significativo e será mencionado apenas em passagens secundárias em futuras histórias sobre a diplomacia do século XXI.", "titulo_pt": "Nova página na história? Encontro de xi, Trump e Putin em shenzhen foi mais um ponto de pano", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 274859, "titulo": "El dólar se consolida sobre los $1.000 y registra nuevo máximo de casi dos años", "url": "https://www.latercera.com/pulso/noticia/el-valor-del-dolar-en-chile-el-19-de-noviembre-de-2026/", "fonte_id": "la_tercera", "data_pub": "2026-11-19T17:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O dólar manteve-se acima dos R$1.000 por duas sessões consecutivas, registrando um novo máximo próximo a dois anos.", "titulo_pt": "O dólar se consolida acima dos r$1.000 e atinge novo máximo de quase dois anos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 274584, "titulo": "Fim da escala 6x1 aumenta a hora extra; veja tabela com novos valores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/fim-da-escala-6x1-aumenta-a-hora-extra-veja-tabela-com-novos-valores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir do dia 16 de dezembro, a jornada semanal de trabalho será reduzida, aumentando o valor das horas extras para trabalhadores mensalistas. O divisor para calcular o salário-hora será reduzido de 220 para 210, com a mudança entrando em vigor em 2027 para 200.", "titulo_pt": "Fim da escala 6x1 aumenta hora extra; veja novos valores", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 275153, "titulo": "US: Protesters warn of AI bubble as Anthropic makes stock market history", "url": "https://www.euronews.com/video/2026/11/19/us-protesters-warn-of-ai-bubble-as-anthropic-makes-stock-market-history", "fonte_id": "euronews", "data_pub": "2026-11-19T17:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic fez sua estreia na Nasdaq com uma IPO recorde, avaliando a empresa de IA em 1,5 trilhões de dólares. Fora da bolsa, na cidade de Nova York, a polícia prendeu três protestantes que alertavam sobre riscos financeiros.", "titulo_pt": "Estados unidos: protestantes avisam sobre bolha de IA enquanto Anthropic estreia na nasdaq com ipo recorde", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 274891, "titulo": "Un ciberataque sacude a JPMorgan Chase y podría haber expuesto datos de sus clientes", "url": "https://www.lanacion.com.ar/estados-unidos/un-ciberataque-sacude-a-jpmorgan-chase-y-podria-haber-expuesto-datos-de-sus-clientes-nid19112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-19T17:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A JPMorgan Chase confirmou um ciberataque que permitiu que piratas informáticos acessassem dados de provedores externos. Os detalhes específicos sobre os dados expostos não foram detalhados.", "titulo_pt": "Ciberataque atinge JPMorgan Chase e expõe dados de provedores externos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 274585, "titulo": "Empresas dos EUA recorrem a robôs para enfrentar falta de mão de obra", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/empresas-dos-eua-recorrem-a-robos-para-enfrentar-falta-de-mao-de-obra.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas americanas estão aumentando a instalação de robôs industriais em fábricas e armazéns para combater a escassez de mão de obra e os aumentos de custos. Este movimento visa apoiar o setor manufatureiro, que enfrenta dificuldades devido à falta de trabalhadores e elevação dos preços.", "titulo_pt": "Empresas americanas recorrem a robôs para enfrentar falta de mão de obra", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 274588, "titulo": "Ações da Anthropic estreiam com alta de mais de 30% na Nasdaq", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/acoes-da-anthropic-estreiam-com-alta-de-mais-de-30-na-nasdaq.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações da Anthropic abriram em forte alta na Nasdaq em seu primeiro dia de negociações, após uma oferta pública inicial que levantou US$ 81 bilhões. O valor de abertura foi superior a 30% acima do preço inicial.", "titulo_pt": "Ações da Anthropic estreiam com alta de mais de 30% na Nasdaq", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 275167, "titulo": "Gold's bad year is getting worse. Why its price keeps falling", "url": "https://www.cnbc.com/2026/11/19/gold-prices-fall-fed-rates-dollar.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-19T16:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ouro caiu significativamente desde o recorde de janeiro, devido a juros mais altos e a uma moeda americana mais forte, o que altera o caso de investimento para o metal precioso.", "titulo_pt": "Ano ruim para o ouro se agrava. Por que seu preço continua caindo", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 275166, "titulo": "Palo Alto stock jumps on earnings beat and company's big bet on securing open-weight models", "url": "https://www.cnbc.com/2026/11/19/palo-alto-networks-earnings-applied-compute.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-19T16:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Palo Alto Networks apresentou resultados do primeiro trimestre melhores do que o esperado e firmou um acordo por $4,5 bilhões com uma startup de inteligência artificial chamada Applied Compute.", "titulo_pt": "Ações de palo Alto subiram após resultados superiores às expectativas e acordo de Alto valor com startup de IA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 275209, "titulo": "Anthropic soars in Wall Street debut", "url": "https://www.ft.com/content/7a6b211d-c73b-4953-97ee-ed92dab8ee07?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-19T16:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic realizou seu IPO na Wall Street e começou a negociar. A empresa, considerada uma gigante da IA, levantou US$ 81 bilhões em uma oferta inicial de ações recorde.", "titulo_pt": "Anthropic estreia na Wall Street em oferta inicial recorde", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 274779, "titulo": "Alibaba triplica lucro no 2º tri com a melhora da rentabilidade em IA", "url": "https://www.cnnbrasil.com.br/economia/alibaba-triplica-lucro-no-2o-trimestre-fiscal-com-a-melhora-da-rentabilidade-em-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T16:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O lucro da Alibaba triplicou no segundo trimestre, impulsionado pelo crescimento do comércio eletrônico e avanços em inteligência artificial. O resultado foi de 64,5 bilhões de yuans.", "titulo_pt": "Alibaba triplica lucro no 2º tri com crescimento do comércio eletrônico e avanços em IA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 274783, "titulo": "Bancos cortam previsão para crédito e elevam estimativa para inadimplência", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/bancos-cortam-previsao-para-credito-e-elevam-estimativa-para-inadimplencia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T15:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Federação Brasileira de Bancos (Febraban) reduziu a previsão para o crescimento do crédito no ano, projetando um aumento de 8,6% na carteira total. Além disso, a expectativa para a inadimplência foi elevada para 6,4%.", "titulo_pt": "Bancos reduzem previsão para crédito e elevam estimativa para inadimplência", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 274591, "titulo": "Com El Niño, Bradesco Seguros registra alta de 37,5% nos casos de prejuízos ligados ao clima", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/com-el-nino-bradesco-seguros-registra-alta-de-375-nos-casos-de-prejuizos-ligados-ao-clima.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T15:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Bradesco Seguros registrou uma alta de 37,5% nos casos de prejuízos relacionados ao clima nos primeiros dez meses de 2026 em comparação com 2025. Estes prejuízos já superaram o total registrado no ano anterior.", "titulo_pt": "Com El Niño, Bradesco Seguros registra alta de 37,5% nos casos de prejuízos ligados ao clima", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 274592, "titulo": "Consórcio dos EUA vence disputa por minerais estratégicos no Quênia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/consorcio-dos-eua-vence-disputa-por-minerais-estrategicos-no-quenia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T15:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um consórcio americano venceu a licitação para um projeto de mineração de minerais estratégicos em Mrima Hill, no Quênia, contra empresas chinesas e australianas.", "titulo_pt": "Conselho americano vence disputa por minerais estratégicos no Quênia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 274595, "titulo": "Proposta de ajuste fiscal deve passar na Câmara sem alterações substanciais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/proposta-de-ajuste-fiscal-deve-passar-na-camara-sem-alteracoes-substanciais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T15:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proposta de ajuste fiscal aprovada pelo Senado deve ser rapidamente votada na Câmara sem alterações substanciais, segundo parlamentares. O relator da medida, deputado Mauro Benevides, sinalizou que não modificará o texto original.", "titulo_pt": "Proposta de ajuste fiscal deve passar na Câmara sem alterações", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 274600, "titulo": "BNDES tem lucro de R$ 20,3 bi até setembro, puxado por venda de ações da Petrobras", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/bndes-tem-lucro-de-r-203-bi-ate-setembro-puxado-por-venda-de-acoes-da-petrobras.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T14:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O BNDES registrou um lucro líquido de R$ 20,3 bilhões nos nove primeiros meses de 2026, aumento de 18% em comparação com o mesmo período de 2025, que gerou R$ 17,2 bilhões. A receita foi principalmente impulsionada pela venda de ações da Petrobras.", "titulo_pt": "BNDES registra lucro de R$ 20,3 bi nos nove primeiros meses de 2026, puxado por venda de ações da Petrobras", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 274601, "titulo": "Ouro perde força como proteção para investidores em meio à turbulência nos mercados", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/ouro-perde-forca-como-protecao-para-investidores-em-meio-a-turbulencia-nos-mercados.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T14:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investidores estão questionando o papel tradicional do ouro como proteção em carteiras, já que o metal precioso perdeu valor nos últimos meses, enquanto outros ativos de risco, como ações, experimentavam fortes perdas.", "titulo_pt": "Ouro perde status como proteção para investidores diante da turbulência nos mercados", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 275309, "titulo": "TSMC tightens China AI chip curbs as new US rules close manufacturing loophole, sources say", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/20/2003868041", "fonte_id": "taipei_times", "data_pub": "2026-11-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A TSMC está endurecendo as restrições sobre chips de inteligência artificial para a China em resposta às novas regras dos EUA que fecham um possível vazio legal nas fabricações. De acordo com fontes, essas medidas visam garantir que a empresa cumpra as novas regulamentações americanas.", "titulo_pt": "TSMC endurece restrições de chips de IA para a China diante de novas regras dos EUA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 275310, "titulo": "TSMC acquires 0.03% stake in Anthropic for US$500 million", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/20/2003868042", "fonte_id": "taipei_times", "data_pub": "2026-11-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A TSMC adquiriu uma participação de 0,03% na Anthropic por US$500 milhões. Esta aquisição representa uma investimento significativo na empresa de inteligência artificial.", "titulo_pt": "TSMC adquire 0,03% da Anthropic por US$500 milhões", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 275311, "titulo": "IMF’s Georgieva warns more AI correction to come", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/20/2003868043", "fonte_id": "taipei_times", "data_pub": "2026-11-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A diretora gerente do FMI, Kristalina Georgieva, alertou que mais correções do mercado de inteligência artificial estão por vir. Ela fez essa declaração sem fornecer detalhes adicionais sobre o assunto.", "titulo_pt": "Kristalina Georgieva avisa sobre mais correções no mercado de IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 275312, "titulo": "Rayzher, Messer ink deal over semiconductor gases", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/20/2003868044", "fonte_id": "taipei_times", "data_pub": "2026-11-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas Rayzher e Messer fecharam um acordo comercial para a fornecimento de gases para semicondutores.", "titulo_pt": "Rayzher e Messer fecham acordo para gases de semicondutores", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 275313, "titulo": "Anthropic to begin trading after big debut", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/20/2003868045", "fonte_id": "taipei_times", "data_pub": "2026-11-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Anthropic começará a negociar após uma grande estreia. As informações não detalham mais detalhes sobre o momento exato ou o mercado específico onde a empresa iniciará a negociação.", "titulo_pt": "Anthropic vai começar a negociar após grande estreia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 275340, "titulo": "Google Built a Giant ‘Mirror Dimension’ Internet to Test Its Chrome AI Agents", "url": "https://www.wired.com/story/google-built-a-giant-mirror-dimension-internet-to-test-its-chrome-ai-agents/", "fonte_id": "wired", "data_pub": "2026-11-19T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Google criou uma gigantesca versão paralela da internet para testar seus agentes de inteligência artificial baseados em navegação do Chrome, sem riscos deles causarem problemas.", "titulo_pt": "Google construiu uma grande 'dimensão de espelhos' da Internet para testar seus agentes de IA do Chrome", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 275337, "titulo": "ChatGPT can transcribe as you speak now with Live Dictation", "url": "https://www.theverge.com/ai-artificial-intelligence/1037634/openai-chatgpt-live-dictation", "fonte_id": "the_verge", "data_pub": "2026-11-19T15:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A função Live Dictation no ChatGPT agora transcreve o que você fala enquanto você fala, sem aguardar o fim da gravação. Essa funcionalidade está sendo lançada globalmente em todos os planos do ChatGPT, tanto na web quanto em aplicativos para desktop e dispositivos móveis.", "titulo_pt": "Chatgpt agora transcreve ao falar com Live Dictation", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 274596, "titulo": "Como se preparar para o próximo grande apagão das big techs?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/11/como-se-preparar-para-o-proximo-grande-apagao-das-big-techs.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-19T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após uma série de falhas tecnológicas recentes afetarem companhias aéreas e outros consumidores, muitos estão se perguntando como se preparar para futuros interrompimentos.", "titulo_pt": "Como se preparar para o próximo grande apagão das grandes tecnológicas?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 274728, "titulo": "IA, ESG e os limites do compliance", "url": "https://exame.com/lideres-extraordinarios/ia-esg-e-os-limites-do-compliance/", "fonte_id": "exame", "data_pub": "2026-11-19T14:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sistemas de inteligência artificial (IA) e critérios ESG (ambientais, sociais e de governança) exigem novos mecanismos de responsabilidade. Decisões tomadas por sistemas automatizados necessitam de novas formas de garantir a responsabilidade e a ética.", "titulo_pt": "IA, ESG e os limites da responsabilidade", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 274731, "titulo": "CEO da Ripple diz que o mercado cripto pode subir após IPO da Anthropic", "url": "https://exame.com/future-of-money/ceo-da-ripple-diz-que-o-mercado-cripto-pode-subir-apos-ipo-da-anthropic/", "fonte_id": "exame", "data_pub": "2026-11-19T13:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da Ripple expressou optimismo sobre o mercado cripto após o IPO da Anthropic, no entanto, investidores não compartilham da mesma convicção, acreditando que as criptomoedas continuam a sofrer devido à concorrência com empresas de inteligência artificial.", "titulo_pt": "CEO da Ripple diz que mercado cripto pode subir após IPO da Anthropic", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 274734, "titulo": "Anthropic estreia na Nasdaq, no maior IPO da história, em alta de mais de 30%", "url": "https://exame.com/invest/mercados/anthropic-estreia-na-nasdaq-no-maior-ipo-da-historia-em-alta-de-mais-de-30/", "fonte_id": "exame", "data_pub": "2026-11-19T13:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic realizou seu IPO na Nasdaq e captou US$ 107,3 bilhões, alcançando uma avaliação de US$ 1,5 trilhão, o maior IPO da história. O mercado valoriza o potencial de crescimento da empresa.", "titulo_pt": "Anthropic estreia na Nasdaq, no maior IPO da história, em alta de mais de 30%", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 275211, "titulo": "The key to Anthropic’s value", "url": "https://www.ft.com/content/aa8290dc-a20a-45af-97ab-1e71f97f236a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-19T13:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de IA Anthropic precisa se tornar uma plataforma completa de tecnologia empresarial após a oferta inicial de ações.", "titulo_pt": "A chave para o valor da Anthropic", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 275316, "titulo": "The Download: a living liver, a billion-dollar battery deal, and AI hype", "url": "https://www.technologyreview.com/2026/11/19/1148979/the-download-liver-kept-alive-sila-battery-deal-ai-hype/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-19T13:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um fígado humano foi mantido vivo fora do corpo por sete semanas, um recorde. Pesquisadores australianos afirmam ter mantido um fígado humano em suporte de vida fora do corpo durante este período.", "titulo_pt": "Download do dia: fígado humano vivo por sete semanas, acordo bilionário em baterias e hype da IA", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 274742, "titulo": "Disney e Globo unificam a venda de publicidade no streaming", "url": "https://exame.com/marketing/disney-e-globo-unificam-a-venda-de-publicidade-no-streaming/", "fonte_id": "exame", "data_pub": "2026-11-19T13:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Globo e a Disney uniram suas operações de venda de publicidade para seus serviços de streaming. Agora, a área comercial da Globo será responsável por negociar espaços publicitários em ambas as plataformas, enquanto os assinantes continuarão a acessar os serviços separadamente.", "titulo_pt": "Disney e Globo unificam a venda de publicidade em seus serviços de streaming", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 274743, "titulo": "Microsoft negocia US$ 500 milhões em IA com dona do TikTok e desagrada OpenAI", "url": "https://exame.com/tecnologia/microsoft-negocia-us-500-milhoes-em-ia-com-dona-do-tiktok-e-desagrada-openai/", "fonte_id": "exame", "data_pub": "2026-11-19T13:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Microsoft está negociando um acordo avaliado em 500 milhões de dólares com a proprietária do TikTok para acesso a tecnologias de inteligência artificial (IA). O comitê da Câmara dos EUA pediu explicações à Microsoft sobre as negociações.", "titulo_pt": "Microsoft negocia 500 milhões em IA com dona do TikTok e é questionada pelo congresso", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 274744, "titulo": "Redes sociais e IA podem se tornar porta de entrada para serviços financeiros, diz Campos Neto", "url": "https://exame.com/bussola/redes-sociais-e-ia-podem-se-tornar-porta-de-entrada-para-servicos-financeiros-diz-campos-neto/", "fonte_id": "exame", "data_pub": "2026-11-19T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Roberto Campos Neto, vice-presidente do Nubank, afirma que redes sociais e inteligência artificial podem se tornar portais para serviços financeiros. Open Finance, inteligência artificial e tokenização serão responsáveis por transformar a intermediação financeira, de acordo com sua avaliação.", "titulo_pt": "Redes sociais e IA podem se tornar porta de entrada para serviços financeiros, diz vice-presidente do nubank", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 275358, "titulo": "Artificial wetland near Valencia traps 36% of incoming microplastics, study finds", "url": "https://phys.org/news/2026-11-artificial-wetland-valencia-incoming-microplastics.html", "fonte_id": "phys_org", "data_pub": "2026-11-19T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um pantanal artificial chamado Tancat de la Pipa, projetado como um 'filtrador verde' para a Albufera de Valência, reduz a poluição por microplásticos na lagoa natural em 36%, de acordo com uma pesquisa conduzida pelo Instituto de Engenharia Hídrica e Ambiental (IIAMA) da Universitat Politècnica de València (UPV) e pela Faculdade de Ciências Ambientais e Engenharia da Universidade Babe–Bolyai na Romênia, publicada na revista Applied Sciences.", "titulo_pt": "Pantanal artificial próximo a valência retira 36% dos microplásticos entrantes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 275359, "titulo": "Black gobies are growing larger despite climate change", "url": "https://phys.org/news/2026-11-black-gobies-larger-climate.html", "fonte_id": "phys_org", "data_pub": "2026-11-19T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Departamento de Paleontologia da Universidade de Viena compararam espinhas de ouvido fósseis e modernas de góbios pretos (Gobius niger) do Mar Adriático do Norte para reconstruir sua história de crescimento ao longo dos últimos 8.000 anos. Surpreendentemente, enquanto o tamanho do corpo permaneceu estável no passado, os góbios pretos atuais crescem mais rápido e atingem maiores tamanhos, mesmo com o Mar Adriático aquecendo rapidamente.", "titulo_pt": "Góbios pretos estão crescendo mais, apesar do aquecimento global", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 275452, "titulo": "Huge extinct orca may have eaten other whales", "url": "https://www.newscientist.com/article/2599960-huge-extinct-orca-may-have-eaten-other-whales/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-19T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um espécime de orca de quase 8 metros de comprimento viveu no Mar do Norte há mais de 2 milhões de anos. Sua descoberta indica que as orcas evoluíram para se alimentar de mamíferos marinhos mais cedo do que se pensava.", "titulo_pt": "Grande orca extinta pode ter comido outras baleias", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 275360, "titulo": "New metal-organic material combines metallic conductivity with promise for light-sensing electronics", "url": "https://phys.org/news/2026-11-metal-material-combines-metallic-electronics.html", "fonte_id": "phys_org", "data_pub": "2026-11-19T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo material metal-orgânico combina a condutividade metálica com potencial para eletrônica sensível à luz. Esta descoberta é crucial para a eletrônica moderna, pois busca materiais que possam mover cargas elétricas eficientemente sem perder energia.", "titulo_pt": "Novo material metal-orgânico une condutividade metálica com perspectivas para eletrônica sensível à luz", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 275361, "titulo": "Duck-billed dinosaur discovered in Italy had a birdlike beak hidden among its bizarre 'spikes'", "url": "https://phys.org/news/2026-11-duck-billed-dinosaur-italy-birdlike.html", "fonte_id": "phys_org", "data_pub": "2026-11-19T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo recente publicado na Royal Society Open Science revelou que a estrutura de bico de um dinossaoro hadrosauroid italiano, Tethyshadros insularis, não era composta por projeções ósseas visíveis, mas sim por um bico semelhante ao de uma ave escondido sob essas projeções.", "titulo_pt": "Dinossauro hadrosauroid italiano tinha bico semelhante ao de uma ave escondido entre suas estranhas 'espinhos'", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 274888, "titulo": "Los científicos coinciden: “La gente que más vive se mueve de forma natural; no hace ejercicio, pero vive en entornos en los que cada desplazamiento supone un paseo”", "url": "https://www.lanacion.com.ar/lifestyle/los-cientificos-coinciden-la-gente-que-mas-vive-se-mueve-de-forma-natural-no-hace-ejercicio-pero-nid19112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-19T17:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Cientistas concordam que as pessoas que vivem mais tempo se movimentam de forma natural em seus ambientes, sem necessariamente fazer exercícios específicos. Países com população envelhecida tendem a ter níveis mais altos de atividade física cotidiana.", "titulo_pt": "Cientistas concordam: quem vive mais se move naturalmente em seu ambiente", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 275412, "titulo": "The sweet spot for constellation size", "url": "https://spacenews.com/the-sweet-spot-for-constellation-size/", "fonte_id": "spacenews", "data_pub": "2026-11-19T17:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O episódio de Space Minds, apresentado por Mike Gruss da SpaceNews, aborda a discussão sobre o tamanho ideal de constelações com Jan Smolders, chief commercial officer da Space Inventor, durante uma conversa no Space Tech Expo Europe.", "titulo_pt": "O ponto ideal para o tamanho de constelações", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 275362, "titulo": "Confirmed: Numbers tell, but language sells", "url": "https://phys.org/news/2026-11-language-1.html", "fonte_id": "phys_org", "data_pub": "2026-11-19T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa sugere que, ao discutir a porcentagem de colegas que dirigem para o trabalho (57%), o gerente da política de transporte da empresa deve considerar não apenas os números, mas também como os dados são apresentados para os colegas de trabalho.", "titulo_pt": "Confirmado: números informam, mas a linguagem vende", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 274763, "titulo": "“Endereço” da Terra, imagens da humanidade e saudações em 55 idiomas: o que há no disco de ouro que a Nasa enviou para alienígenas", "url": "https://www.cnnbrasil.com.br/ciencia/endereco-da-terra-imagens-da-humanidade-e-saudacoes-em-55-idiomas-o-que-ha-no-disco-de-ouro-que-a-nasa-enviou-para-alienigenas/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-19T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 1977, as sondas Voyager foram lançadas com um disco de ouro contendo músicas, sons naturais, imagens e mensagens humanas, com instruções para possíveis alienígenas que o encontrarem.", "titulo_pt": "Endereço", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 275256, "titulo": "Nasa’s Voyager 1 phones home from an awe-inspiring 1 light-day away", "url": "https://www.scmp.com/news/world/united-states-canada/article/3375126/nasas-voyager-1-phones-home-awe-inspiring-1-light-day-away", "fonte_id": "scmp", "data_pub": "2026-11-19T17:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Voyager 1 da NASA enviou um sinal para a Terra após percorrer uma distância equivalente a um dia-luz, ou seja, mais de 16 bilhões de milhas. Este é o primeiro sinal vindo de uma espaçonave humana que cruzou essa marca significativa no espaço interestelar.", "titulo_pt": "Voyager 1 telefona para casa a uma impressionante distância de um dia-luz", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 275384, "titulo": "STAT+: Peptide market poised to explode with new Hims and Noom launches", "url": "https://www.statnews.com/2026/11/19/hims-noom-enter-peptide-market-mainstream-products-health-risks/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-19T16:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Duas gigantes do teleatendimento lançaram programas de peptí
