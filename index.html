const D = {"gerado_em": "16/09/2026 07:20", "stats": {"noticias_novas": 903, "resumos_gerados": 242}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "No dia 15 de setembro, o Supremo Tribunal Federal (STF) enfrentou uma sessão tensa e inédita, que discutiu a possibilidade de investigar o ministro Alexandre de Moraes. Durante a sessão, houve conflitos verbais entre os ministros, e Flávio Dino pediu vista, paralisando o julgamento. A sessão também abordou o caso Master, com ministros dos dois lados buscando adiar a análise do relatório da Polícia Federal. Essa crise na Corte pode afetar a proposta de um Código de Ética e influenciar a agenda do presidente Edson Fachin. Além disso, a sessão foi noticiada pela imprensa internacional, sendo destacada como um 'conflito feroz' às vésperas da eleição presidencial. A crise no STF também impactou julgamentos econômicos e a campanha de impeachments ganhou força, com o vice-presidente do STF, Cármen Lúcia, expressando preocupação com o 'mal-estar cívico' causado pela Corte durante o período eleitoral.", "mundo": "A União Europeia anunciou a possibilidade de o Canadá se tornar o primeiro membro associado, em meio a tensões comerciais causadas pelas tarifas de Trump e à tentativa do Canadá de fortalecer suas relações econômicas e de segurança com a Europa. O ex-presidente do Kosovo, Hashim Thaci, foi condenado a 25 anos de prisão por crimes de guerra cometidos durante a separação violenta da Sérvia nos anos 90. O presidente sul-coreano Lee Jae Myung pediu para diversificar as relações comerciais com o Central Asia e colaborar em relação a minérios críticos. O número de visitantes estrangeiros no Japão caiu em agosto, com 3,1 milhões de turistas, uma diminuição de 9,6% em comparação com o mesmo mês do ano anterior. O governo dos Estados Unidos restringiu vistos para autoridades sul-africanas em resposta à acusação de que o governo da África do Sul discrimina sul-africanos brancos. Um ex-dirigente de uma empresa de eventos foi condenado por envolvimento no esquema de corrupção relacionado à candidatura dos Jogos Olímpicos de Tóquio. O presidente dos Estados Unidos, Donald Trump, e o presidente da China, Xi Jinping, se encontrarão em Washington em 24 de setembro, com discussões sobre a possibilidade de reduzir algumas tarifas entre os dois países.\n\nO conflito na Ucrânia continua causando mortes, com pelo menos cinco pessoas mortas e sete feridas em um ataque de drone russo perto da linha de frente. O Irã viaja à China para discutir o conflito no Oriente Médio, enquanto a Arábia Saudita nega ter atingido a cidade sagrada de Meca. O conflito na Ucrânia também afeta a região asiática, com a Ucrânia alertando sobre a presença de semicondutores asiáticos em mísseis russos. Em outros desenvolvimentos, o presidente dos Estados Unidos, Donald Trump, e o presidente chinês, Xi Jinping, se reúnem para discutir tecnologia, controle de exportações e regulamentações. O Japão planeja vender armas para Israel, gerando preocupações sobre o risco de baixas civis. Além disso, a escalada do conflito nuclear entre os Estados Unidos e o Irã continua, com o Escritório do Orçamento do Congresso dos Estados Unidos estimando que o país gastou US$ 38 bilhões na guerra com o Irã.", "economia": "A decisão do Superior Tribunal de Justiça (STJ) de que o Imposto sobre Circulação de Mercadorias e Serviços (ICMS) não compõe a base de cálculo para o Programa de Integração Social (PIS) e Contribuição para o Financiamento da Seguridade Social (Cofins) é um dos eventos mais importantes na economia brasileira. Esta decisão segue um entendimento anterior do Supremo Tribunal Federal (STF) e afeta significativamente o cálculo de contribuições sociais. Paralelamente, a China comprou ouro por 22 meses consecutivos, com o banco central chinês adicionando 650 mil onças às reservas do país em agosto. Essa aquisição reflete a preocupação global com a volatilidade econômica e a busca por ativos seguros. Em outro desenvolvimento, o Índice de Centros Financeiros Globais classificou Seul como a sétima cidade entre 139 cidades, subindo uma posição em comparação com o relatório anterior, mantendo seu lugar entre as dez maiores cidades financeiras do mundo por quarto ano consecutivo. Este ranking destaca o papel crescente de Seul como um hub financeiro global.", "tecnologia": "A União Europeia planeja limitar o acesso a redes sociais e inteligência artificial para menores de 15 anos, em um esforço para proteger a privacidade e a segurança de crianças online. A Comissão Europeia, liderada por Ursula von der Leyen, também discutirá medidas de segurança com empresas de inteligência artificial. Por outro lado, a Coreia do Sul afirma que não pode retardar o desenvolvimento de inteligência artificial, destacando a importância de manter o ritmo tecnológico do país. No Brasil, a capacidade dos data centers deve dobrar até 2026, impulsionada pela crescente demanda por inteligência artificial, com investimentos bilionários previstos. Além disso, 39% dos candidatos já usam inteligência artificial para compor seus currículos, o que pode dificultar a distinção para recrutadores.", "ciencia": "O plano de cinco anos de Hong Kong, proposto pelo chefe do Executivo John Lee Ka-chiu, enfatiza a importância de fortalecer a inovação, o empreendedorismo e a atividade financeira na cidade. O plano prevê aumentar o investimento em inovação para 3% do PIB até 2030, a partir dos atuais 1,63% em 2024. Paralelamente, um novo estudo revela que o tigre-da-tasmânia, ou tilacino, era um predador de pequenas e ágeis presas, desafiando a ideia de que era um superpredador. Além disso, uma terapia bacteriófaga preventiva mostrou resultados promissores na luta contra a Salmonella, enquanto novas simulações estabeleceram uma relação entre a difusão incomum de partículas e o fenômeno de 'yielding' em materiais macios e empacados. Esses materiais, como suspensões coloidais, emulsões, espumas e géis, apresentam comportamentos complexos e atípicos, podendo resistir à deformação como sólidos, mas começar a fluir como líquidos sob a ação de uma força externa suficiente.", "cultura": "O evento mais importante dos artigos é a confirmação da segunda temporada do reality culinário 'Infiltrado na Cozinha', com Paola Carosella. A Globo também planeja renovar o time de repórteres do Jornal Nacional em 2027, com a intenção de incluir mais profissionais com experiência política em Brasília. No campo da cultura, a peça teatral 'La Pérgola de las Flores' reúne mais de 18 artistas e apresenta música executada em tempo real. A 8ª edição da Semana Paulista de Dança sediará 12 apresentações gratuitas no Museu de Arte de São Paulo, com destaque para o balé de Dom Quixote e o cenário de Beatriz Milhazes. No cinema, 'Wolverine' é considerado divertido, mas apresenta contradições. O diretor coreano Lee Chang-dong afirma que 'Possible Love' é um esforço para compreender os humanos. A literatura também ganha destaque com a publicação de 'Iorubahia – Escritos raros sobre a cultura iorubá e as relações entre Brasil e golfo do Benim', que reúne 12 ensaios de Pierre Verger, um estudioso brasileiro conhecido por sua pesquisa sobre as relações entre o Brasil, a Bahia, a África Ocidental e as tradições orais da cultura iorubá. Além disso, a revista Hyperallergic noticiou que funcionários de três museus importantes votaram a favor de uma greve, enquanto a série Slow Horses, que perdeu seu criador, enfrenta críticas por esgotar suas ideias técnicas.", "sociedade": "Começamos com um julgamento significativo: um agropecuarista é acusado de causar um acidente fatal que resultou na morte de uma família inteira, incluindo um casal e dois filhos de 2 e 4 anos, além de outro homem. O julgamento ocorreu em fevereiro de 2022, e é agravado pelo fato de que o acusado é o único sobrevivente. Em seguida, abordamos a longevidade: o Japão ultrapassou pela primeira vez a marca de 100 mil pessoas com 100 anos ou mais, refletindo tendências de envelhecimento e diminuição populacional. A região do Jardim Pantanal, em São Paulo, enfrenta um desafio com a alagação que durou quatro dias, levando a comunidade a se mobilizar para distribuir água e alimentos. Por fim, a saúde brasileira é criticada, com estudos indicando que o sistema desperdiça entre R$ 240 bilhões e R$ 360 bilhões por ano. A Caixa Econômica Federal e os bancários retomam negociações para encerrar a greve nacional, que já dura desde 10 de setembro.", "meio_ambiente": "Os cortes na geração de energia solar e eólica no Brasil superaram 60% nos últimos cinco meses, conforme informa a consultoria Volt Robotics. Durante este período, a geração renovável não utilizada aumentou em 18,3% em comparação com o mesmo intervalo de 2025, o que seria suficiente para abastecer todas as residências de São Paulo, Rio de Janeiro e Fortaleza. Em contraste, o clima no Brasil variou, com geada no Sul e calor no Norte, devido a uma área de baixa pressão e um fluxo de umidade que favoreceu instabilidades em partes do Sul e do Sudeste. Além disso, o El Niño atingiu um nível extremo, sendo considerado o mais forte da história por meteorologistas, o que resultou em intensas mudanças climáticas, incluindo chuvas abundantes e secas severas, além de calor extremo. No que diz respeito à política ambiental, o governo Lula está prestes a implementar uma regra nacional que permitirá a realização de atividades de pesquisa de mineração sem a necessidade de licença ambiental, com o objetivo de acelerar a busca por minerais críticos como terras raras, níquel, nióbio, potássio e fosfato, usados na produção de fertilizantes.", "direitos_humanos": "A advogada dos direitos humanos palestina Noura Erakat foi detida na Flórida durante uma audiência contra o investimento em Israel Bonds, um evento que chama atenção para a situação dos defensores dos direitos humanos em Israel e o conflito israelo-palestino. No Brasil, o país manteve-se na 72ª posição no ranking global de igualdade de gênero, com uma pequena queda em comparação ao ano anterior, conforme informou o Fórum Econômico Mundial. Em um contexto mais amplo, a terceira Guerra Mundial foi identificada como o maior risco global para os próximos dois anos, de acordo com um relatório da ONU, superando outros riscos como pandemias e avanços da inteligência artificial."}, "resumo_do_dia": {"politica_nacional": [{"id": 165111, "titulo": "Por que Moraes votou no processo que discute se ele próprio será investigado?", "url": "https://www.jota.info/stf/do-supremo/por-que-moraes-votou-no-processo-que-discute-se-ele-proprio-sera-investigado", "fonte_id": "jota", "data_pub": "2026-09-16T09:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) discutiu se deveria julgar de forma conjunta processos contra Moraes e Mendonça. O título original questionava por que Moraes votou em um processo que pode resultar em sua própria investigação.", "titulo_pt": "Por que Moraes votou no processo que discute sua própria investigação?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 164908, "titulo": "'Me respeite, Gilmar', 'assumam que estão ferrados': ministros do STF têm embate no celular antes de sessão", "url": "https://g1.globo.com/politica/blog/andreia-sadi/post/2026/09/16/ministros-do-stf-tem-embate-no-celular-antes-de-sessao.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-16T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ministros do Supremo Tribunal Federal tiveram conflitos antes de uma sessão ao vivo, com Gilmar Mendes, Luiz Fux e Nunes Marques protagonizando as discussões via aplicativo de celular. Os desentendimentos envolveram a suposta relação entre Alexandre de Moraes e Daniel Vorcaro.", "titulo_pt": "‘Me respeite, Gilmar’, 'assumam que estão ferrados': ministros do STF se desentendem via celular antes de sessão", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 165126, "titulo": "Como foi o papel de cada ministro em sessão tensa e inédita no STF", "url": "https://www.bbc.com/portuguese/articles/c9rk3r6lylmpo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-16T09:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ministros do Supremo Tribunal Federal discutiram um julgamento que envolve Alexandre de Moraes no caso Master, marcado por pedidos de união e conflitos verbais.", "titulo_pt": "Como foi o papel de cada ministro em sessão tensa e inédita no STF", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 164883, "titulo": "Cleitinho é carregado nos ombros em evento por deputado investigado por fraude no INSS", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/cleitinho-e-carregado-nos-ombros-em-evento-por-deputado-investigado-por-fraude-no-inss.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-16T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Cleitinho Azevedo cumpriu uma agenda com o deputado Euclydes Pettersen, que está indiciado pela Polícia Federal por suspeita de envolvimento em fraudes do INSS. Pettersen é candidato ao governo de Minas Gerais.", "titulo_pt": "Cleitinho é carregado nos ombros em evento por deputado investigado por fraudes no INSS", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 164909, "titulo": "'Consequências imprevisíveis' para eleição: como imprensa internacional noticiou sessão tumultuada do STF", "url": "https://g1.globo.com/mundo/noticia/2026/09/16/consequencias-imprevisiveis-para-eleicao-como-imprensa-internacional-noticiou-sessao-tumultuada-do-stf.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-16T08:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A sessão extraordinária do Supremo Tribunal Federal (STF) que julgou a situação do ministro Alexandre de Moraes foi destacada pela imprensa internacional. O jornal britânico The Guardian chamou a sessão de 'conflito feroz' e noticiou que ocorreu às vésperas da eleição presidencial no Brasil.", "titulo_pt": "Conflito feroz irrompe no STF às vésperas da eleição presidencial", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 164910, "titulo": "Veja o que é #FATO ou #FAKE nas entrevistas com candidatos ao governo de São Paulo no SP1", "url": "https://g1.globo.com/fato-ou-fake/eleicoes/noticia/2026/09/16/veja-o-que-e-fato-ou-fake-nas-entrevistas-com-candidatos-ao-governo-de-sao-paulo-no-sp1.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-16T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos ao governo de São Paulo, Fernando Haddad (PT) e Tarcísio de Freitas (Republicanos), participaram de entrevistas ao vivo conduzidas pelo jornalista Alan Severiano no SP1. As conversas, sobre temas relevantes para o estado, foram transmitidas pela TV Globo, pelo g1 e pelo Globoplay, e classificadas como #FATO ou #FAKE.", "titulo_pt": "Veja o que é #FATO ou #FAKE nas entrevistas com candidatos ao governo de São Paulo no SP1", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 165125, "titulo": "Quem venceu primeiro embate da batalha entre Moraes e Mendonça no STF? O que dizem os analistas", "url": "https://www.bbc.com/portuguese/articles/ckyvz5nel578o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-16T08:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas ouvidos pela BBC avaliam que, embora a estratégia de ministros aliados a Moraes tenha sido bem-sucedida ao conseguir adiar a análise do caso, o STF é o maior perdedor da sessão. O trecho destaca que a sessão beneficiou mais os aliados de Moraes do que o próprio STF.", "titulo_pt": "Quem venceu primeiro embate da batalha entre Moraes e Mendonça no STF? Análise dos especialistas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 165118, "titulo": "Até onde o TCU pode controlar o Poder Legislativo?", "url": "https://www.jota.info/opiniao-e-analise/colunas/defensor-legis/ate-onde-o-tcu-pode-controlar-o-poder-legislativo", "fonte_id": "jota", "data_pub": "2026-09-16T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute a relação entre a gestão administrativa e o mérito parlamentar. Explora como essas duas áreas podem entrar em conflito.", "titulo_pt": "Até onde o TCU pode controlar o Poder Legislativo?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 165127, "titulo": "Como Flávio Dino 'sequestrou o debate' em sessão do Supremo que acabou sem decisão", "url": "https://www.bbc.com/portuguese/articles/c94gml8k74yeo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-16T07:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em uma sessão do Supremo Tribunal Federal, Flávio Dino interveio no debate, mas não houve decisão final. O ministro pediu mais tempo para apreciar uma questão de ordem após discussões entre Gilmar Mendes e André Mendonça, justificando que o pedido de vista ocorreu porque o ministro Fachin não tomou providências.", "titulo_pt": "Como Flávio Dino 'sequestrou o debate' em sessão do stf que acabou sem decisão", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 164911, "titulo": "Impasse em sessão do STF sobre Moraes pode adiar análise sobre a condução de Mendonça do caso Master", "url": "https://g1.globo.com/politica/noticia/2026/09/16/impasse-em-sessao-do-stf-sobre-moraes-pode-adiar-analise-sobre-a-conducao-de-mendonca-do-caso-master.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-16T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ministros do STF que apoiam André Mendonça querem adiar a discussão sobre a possível abertura de uma investigação para apurar a condução dos inquéritos do Master e INSS. A sessão estava prevista para o dia 23 de setembro, mas pode ser adiada devido à análise do relatório da PF sobre a suposta ligação entre Alexandre de Moraes e Daniel Vorcaro, marcada para esta terça-feira (15).", "titulo_pt": "Impasse na sessão do STF sobre Moraes pode adiar análise sobre a condução de Mendonça do caso Master", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 164884, "titulo": "Doações individuais na eleição têm 'Rei do Gás' à frente e repasses voltados a direita e centro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/doacoes-individuais-na-eleicao-tem-rei-do-gas-a-frente-e-repasses-voltados-a-direita-e-centro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-16T03:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O empresário baiano Carlos Seabra Suarez, conhecido como o 'Rei do Gás', lidera as doações individuais para campanhas eleitorais de 2026, tendo transferido R$ 5,7 milhões diretamente para seis partidos do centro e centro-direita.", "titulo_pt": "Doações individuais na eleição têm 'Rei do Gás' à frente e repasses voltados a centro e centro-direita", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 165119, "titulo": "Quem são os candidatos a deputado federal pelo Pará (PA) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-a-deputado-federal-pelo-para-pa-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-09-16T03:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os mais de seis milhões de eleitores do Pará irão eleger 17 deputados federais. Os candidatos a essas vagas serão apresentados posteriormente.", "titulo_pt": "Quem são os candidatos a deputado federal pelo Pará nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 164912, "titulo": "Flávio Dino pede vista no STF: o que acontece agora e quando julgamento será retomado", "url": "https://g1.globo.com/politica/noticia/2026/09/16/flavio-dino-pede-vista-no-stf-o-que-acontece-agora-e-quando-julgamento-sera-retomado.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-16T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino pediu vista durante uma sessão extraordinária do Supremo Tribunal Federal (STF) realizada na terça-feira (15), que analisava um relatório da Polícia Federal sobre a relação entre o ministro Alexandre de Moraes e o fundador do Banco Master, Daniel Vorcaro. Dino argumentou que não há condições de deliberar devido ao clima negativo e à atenção da sociedade.", "titulo_pt": "Flávio Dino pede vista: o que acontece agora e quando julgamento será retomado", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 164913, "titulo": "Bate-bocas, pedido de vista e indefinição: veja em 10 pontos como foi a sessão do STF sobre o caso Moraes", "url": "https://g1.globo.com/politica/noticia/2026/09/16/bate-bocas-pedido-de-vista-e-indefinicao-veja-em-10-pontos-como-foi-a-sessao-do-stf-sobre-o-caso-moraes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-16T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) realizou uma sessão histórica, sendo a primeira vez que o plenário discutiu a possibilidade de abrir uma investigação contra um de seus próprios integrantes. O julgamento, marcado por discussões entre os ministros, terminou sem uma decisão definitiva, devido a um pedido de vista de Flávio Dino.", "titulo_pt": "Bate-bocas, pedido de vista e indefinição: veja como foi a sessão do STF sobre o caso Moraes", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 164914, "titulo": "Ministros do STF avaliam que crise na Corte pode afetar proposta de código de ética e alterar forças no caso Master", "url": "https://g1.globo.com/politica/quiz/ministros-do-stf-avaliam-que-crise-na-corte-pode-afetar-proposta-de-codigo-de-etica-e-alterar-forcas-no-caso-master.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-16T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ministros do STF avaliam que a crise na Corte pode afetar a proposta de um Código de Ética e influenciar a agenda do presidente Edson Fachin. A crise, que já se prolonga, foi aprofundada por uma sessão inédita que discutiu a possibilidade de abertura de uma apuração contra o ministro Alexandre de Moraes.", "titulo_pt": "Ministros do STF veem crise como potencialmente prejudicial à proposta de código de ética", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 164915, "titulo": "VÍDEO: Até que horas posso votar na eleição 2026?", "url": "https://g1.globo.com/politica/eleicoes/2026/videos/noticia/2026/09/16/video-ate-que-horas-posso-votar-na-eleicao-2026.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-16T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A votação na eleição de 2026 começa às 8h e termina às 17h no horário de Brasília em todo o Brasil. No entanto, em estados com fusos horários diferentes, como Amazonas, Rondônia e Mato Grosso, a votação começa às 7h e termina às 16h no horário local.", "titulo_pt": "Até que horas posso votar na eleição 2026?", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 165272, "titulo": "E.U. Offers to Make Canada ‘Associate Member’ as U.S. Ties Weaken for Both", "url": "https://www.nytimes.com/2026/09/16/world/europe/eu-canada-associate-member.html", "fonte_id": "nyt_world", "data_pub": "2026-09-16T09:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos ofereceu a tornar Canadá um membro associado, enquanto as relações entre os dois países se enfraquecem. Canadá e União Europeia enfrentam uma relação cada vez mais desafiadora com os Estados Unidos sob a presidência de Trump.", "titulo_pt": "EUA oferece a fazer canadá 'membro associado' enquanto relações se enfraquecem", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 165276, "titulo": "Does the Stork’s Return to Britain Restore History or Rewrite It?", "url": "https://www.nytimes.com/2026/09/16/climate/white-storks-project-knepp-rewild-conservation-uk.html", "fonte_id": "nyt_world", "data_pub": "2026-09-16T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Conservacionistas estabeleceram uma colônia de storks brancos no sul da Inglaterra, levantando um debate sobre se eles realmente pertencem à região.", "titulo_pt": "O retorno dos storks na grã-bretanha: restaura a história ou reescreve-a?", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 165349, "titulo": "Journalist and pilot among three killed after news helicopter crashes in LA", "url": "https://www.bbc.co.uk/news/articles/cw4gq0j5jg10o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-16T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um jornalista e um piloto morreram após o helicóptero da NBCLA cair perto do local de um acidente fatal de ônibus.", "titulo_pt": "Jornalista e piloto entre três mortos após helicóptero da nbcla cair perto de acidente de ônibus fatal", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 165293, "titulo": "Former Kosovo president Thaçi sentenced to 25 years in prison by international court in The Hague – Europe live", "url": "https://www.theguardian.com/world/live/2026/sep/16/european-union-ursula-von-der-leyen-eu-europe-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-09-16T09:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente do Kosovo, Thaçi, foi condenado a 25 anos de prisão por um tribunal internacional em The Hague por crimes de guerra cometidos durante a separação violenta do Serbia nos anos 90. A presidente da Comissão Europeia, Von der Leyen, enfatizou a importância de reativar a economia europeia, destacando a necessidade de reformar o mercado único europeu.", "titulo_pt": "Ex-presidente do Kosovo Thaçi condenado a 25 anos de prisão por tribunal internacional em The Hague", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 164992, "titulo": "Houthis negam ter cidade sagrada de Meca como alvo", "url": "https://www.cnnbrasil.com.br/internacional/houthis-negam-ter-cidade-sagrada-de-meca-como-alvo/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-16T09:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O grupo Houthis negou ter a cidade sagrada de Meca como alvo. A Arábia Saudita afirmou ter downed um drone do grupo apoiado pelo Irã perto de Meca.", "titulo_pt": "Houthis negam ter Meca como alvo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 165434, "titulo": "At least five killed in Russian drone strike near Ukraine front line", "url": "https://www.aljazeera.com/news/2026/9/16/at-least-five-killed-in-russian-drone-strike-near-ukraine-front-line?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-16T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque de drone russo próximo à linha de frente na Ucrânia deixou pelo menos cinco mortos e sete feridos perto de Nikopol, na região sudeste da Ucrânia, de acordo com o governador de Dnipropetrovsk.", "titulo_pt": "Pelo menos cinco mortos em ataque de drone russo perto da linha de frente na Ucrânia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 165607, "titulo": "China Isn’t Buying Silicon Valley’s Call for an AI Slowdown", "url": "https://www.wired.com/story/china-isnt-buying-silicon-valley-call-for-ai-slowdown/", "fonte_id": "wired", "data_pub": "2026-09-16T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os EUA e China concordam que a inteligência artificial avançada apresenta riscos significativos. No entanto, Pequim é cético sobre um acordo que enfatiza a manutenção das empresas americanas à frente no campo da IA.", "titulo_pt": "China não está comprando o chamado pela retrasada do AI da Silicon Valley", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 164996, "titulo": "EUA restringem vistos de autoridades sul-africanas por “racismo reverso”", "url": "https://www.cnnbrasil.com.br/internacional/eua-restringem-vistos-de-autoridades-sul-africanas-por-racismo-reverso/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-16T09:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos restringiu vistos para autoridades sul-africanas em resposta à acusação de que o governo da África do Sul discrimina sul-africanos brancos. Esta é a mais recente medida tomada pelo governo de Donald Trump contra o país sul-africano.", "titulo_pt": "EUA restringem vistos de autoridades sul-africanas por 'racismo reverso'", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 165191, "titulo": "El ministro de Exteriores de Irán viaja a China para abordar el conflicto en Medio Oriente", "url": "https://www.latercera.com/mundo/noticia/el-ministro-de-exteriores-de-iran-viaja-a-china-para-abordar-el-conflicto-en-medio-oriente/", "fonte_id": "la_tercera", "data_pub": "2026-09-16T09:22:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ministro das Relações Exteriores do Irã viajará à China para discutir o conflito no Oriente Médio. O deslocamento de Araqchi ocorre em meio ao estagnação do processo de diálogo mediado pelo Paquistão para alcançar um acordo de paz.", "titulo_pt": "Ministro das relações Exteriores do Irã viaja à China para tratar do conflito no Oriente médio", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 165417, "titulo": "Yemen's Houthis claim they shot down Saudi fighter jet, deny targeting Mecca", "url": "https://www.euronews.com/2026/09/16/yemens-houthis-claim-they-shot-down-saudi-fighter-jet-deny-targeting-mecca", "fonte_id": "euronews", "data_pub": "2026-09-16T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Iêmen dos Houthis afirmou ter downido um avião de combate saudita e negou ter alvejado a cidade sagrada de Meca. A Arábia Saudita declarou que não hesitará em tomar medidas dissuasivas contra os Houthis em resposta a alertas sobre possíveis ataques com drones perto do local mais sagrado do Islã, os primeiros desde o início da guerra com o Irã em fevereiro.", "titulo_pt": "Houthis do iêmen afirmam ter downido avião saudita e negam ataque a meca", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 165419, "titulo": "At least 60 dead after gold mine collapses in Sudan", "url": "https://www.euronews.com/2026/09/16/at-least-60-dead-after-gold-mine-collapses-in-sudan", "fonte_id": "euronews", "data_pub": "2026-09-16T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um colapso em uma mina de ouro causou pelo menos 60 mortes na região de West Kordofan, em Sudan. O colapso ocorreu após a perfuração de túneis muito próximos.", "titulo_pt": "Pelo menos 60 mortos após colapso de mina de ouro no Sudan", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 165420, "titulo": "At least 12 dead and dozens missing after building collapse in Gaza City", "url": "https://www.euronews.com/video/2026/09/16/at-least-12-dead-and-dozens-missing-after-building-collapse-in-gaza-city", "fonte_id": "euronews", "data_pub": "2026-09-16T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No menos de 16 de setembro, um colapso de prédio em Gaza City resultou em pelo menos 12 mortes e deixou várias pessoas desaparecidas. O edifício, que abrigava famílias deslocadas, desabou.", "titulo_pt": "Pelo menos 12 mortos e várias pessoas desaparecidas após colapso de prédio em Gaza City", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 165536, "titulo": "Sweden’s long election night ends without answers – but caution on China seems certain", "url": "https://www.scmp.com/economy/global-economy/article/3367705/swedens-long-election-night-ends-without-answers-caution-china-seems-certain?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-16T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A eleição parlamentar da Suécia deste domingo resultou em uma disputa muito estreita, com o bloco de oposição à esquerda liderando por três votos sobre o bloco governamental à direita. Os resultados finais estão previstos para quinta-feira, mas já há incerteza política no país.", "titulo_pt": "Noite eleitoral longa na suécia termina sem clareza - mas cautela em relação à China parece certa", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 165200, "titulo": "El ministro de Defensa de China pide estar alerta ante las tendencias “militaristas y revisionistas”", "url": "https://www.latercera.com/mundo/noticia/el-ministro-de-defensa-de-china-pide-estar-alerta-ante-las-tendencias-militaristas-y-revisionistas/", "fonte_id": "la_tercera", "data_pub": "2026-09-16T08:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ministro de Defesa da China destacou a necessidade de estar alerta frente a tendências 'militaristas e revisionistas', e enfatizou a importância da cooperação prática com outros países para obter resultados tangíveis e alcance o sucesso mútuo.", "titulo_pt": "Ministro de defesa da China alerta para tendências militaristas e revisionistas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 165496, "titulo": "Drop in Chinese visitors drives decline in Japan’s inbound tourism in August", "url": "https://www.japantimes.co.jp/news/2026/09/16/japan/august-foreign-visitors/", "fonte_id": "japan_times", "data_pub": "2026-09-16T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de visitantes estrangeiros no Japão caiu em agosto, com 3,1 milhões de turistas, uma diminuição de 9,6% em comparação com o mesmo mês do ano anterior, de acordo com estimativas da Organização Nacional de Turismo do Japão.", "titulo_pt": "Decréscimo no número de visitantes chineses leva a queda no turismo internacional no Japão em agosto", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 165294, "titulo": "European Union opens door for Canada to become first associate member", "url": "https://www.theguardian.com/world/2026/sep/16/von-der-leyen-mark-carney-canada-eu-first-associate-member", "fonte_id": "guardian_world", "data_pub": "2026-09-16T08:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A presidente da Comissão Europeia, Ursula von der Leyen, informou ao primeiro-ministro canadense, Mark Carney, que pretende abrir a possibilidade para o Canadá se tornar o primeiro membro associado da União Europeia. Esta proposta surge em meio ao aumento das tensões comerciais causadas pelos tarifas de Trump e à tentativa do Canadá de estreitar suas relações econômicas e de segurança com a Europa.", "titulo_pt": "União europeia abre porta para canadá se tornar primeiro membro associado", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 165112, "titulo": "ICMS-Difal não compõe a base do PIS/Cofins, decide STJ", "url": "https://www.jota.info/tributos/icms-difal-nao-compoe-a-base-do-pis-cofins-decide-stj", "fonte_id": "jota", "data_pub": "2026-09-16T09:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Superior Tribunal de Justiça (STJ) decidiu que o Imposto sobre Circulação de Mercadorias e Serviços (ICMS) não compõe a base de cálculo para o Programa de Integração Social (PIS) e Contribuição para o Financiamento da Seguridade Social (Cofins). Esta decisão segue um entendimento anterior do Supremo Tribunal Federal (STF) que também excluiu o ICMS da base das contribuições.", "titulo_pt": "STJ decide que icms não compõe a base do PIS/Cofins", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 164931, "titulo": "China estende sequência de compras de ouro para o 22º mês", "url": "https://www.poder360.com.br/poder-china/china-estende-sequencia-de-compras-de-ouro-para-o-22o-mes/", "fonte_id": "poder360", "data_pub": "2026-09-16T09:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em agosto, o banco central chinês realizou a maior compra mensal de ouro desde 2023, adicionando 650 mil onças às reservas do país.", "titulo_pt": "China estende sequência de compras de ouro para o 22º mês", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 165399, "titulo": "Intel, SK Hynix shares jump on report they're discussing U.S. memory chip manufacturing", "url": "https://www.cnbc.com/2026/09/16/intel-sk-hynix-us-memory-chips.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-16T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Intel e da SK Hynix subiram após relatos de que estas empresas estão discutindo a possibilidade de fabricar chips de memória nos Estados Unidos. O acordo poderia ser um grande avanço para a Intel, que tem buscado clientes de destaque para seu negócio de fabricação.", "titulo_pt": "Ações da intel e SK Hynix sobem em relatos de discussão sobre fabricação de chips de memória nos EUA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 165568, "titulo": "Seoul rises to 7th in global financial hub ranking", "url": "https://www.koreaherald.com/article/10875936", "fonte_id": "korea_herald", "data_pub": "2026-09-16T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seul foi classificada como a sétima cidade entre 139 cidades no Índice de Centros Financeiros Globais mais recente, subindo uma posição em comparação com o relatório anterior. A capital sul-coreana manteve seu lugar entre as dez maiores cidades financeiras do mundo por quarto ano consecutivo.", "titulo_pt": "Seul avança para o 7º lugar entre centros financeiros globais", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 164855, "titulo": "Bancos e escritórios de advocacia reforçam áreas que cuidam de créditos na UTI", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/bancos-e-escritorios-de-advocacia-reforcam-areas-que-cuidam-de-creditos-na-uti.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bancos e escritórios de advocacia estão reforçando equipes que lidam com empréstimos a empresas em dificuldade financeira após uma série de grandes empresas terem solicitado recuperação judicial ou extrajudicial.", "titulo_pt": "Bancos e escritórios de advocacia reforçam equipes para cuidar de créditos em empresas em dificuldade", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 164856, "titulo": "Casas Bahia contesta plano de recuperação do GPA na Justiça de São Paulo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/casas-bahia-contesta-plano-de-recuperacao-do-gpa-na-justica-de-sao-paulo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O grupo Casas Bahia contestou o plano de recuperação extrajudicial do GPA, argumentando que o plano não detalha o valor total das dívidas submetidas à recuperação, o que impede a verificação da validade dos créditos aprovados. A aprovação teria sido de 57,49% dos credores.", "titulo_pt": "Casas Bahia contesta plano de recuperação do GPA em São Paulo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 165022, "titulo": "Super Quarta tem decisões de juros do Copom e Fed, IBC-Br e varejo nos EUA", "url": "https://www.infomoney.com.br/mercados/super-quarta-copom-fed-16092026/", "fonte_id": "infomoney", "data_pub": "2026-09-16T08:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Haverá decisões de juros do Copom e do Fed, além do lançamento do IBC-Br e do relatório do varejo nos Estados Unidos nesta quarta-feira (16).", "titulo_pt": "Super Quarta tem decisões de juros do Copom e Fed, IBC-Br e varejo nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 165023, "titulo": "Dow Jones Futuro sobe antes da decisão sobre juros do Fed", "url": "https://www.infomoney.com.br/mercados/dow-jones-futuro-sobe-antes-da-decisao-sobre-juros-do-fed/", "fonte_id": "infomoney", "data_pub": "2026-09-16T08:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado espera uma elevação de 0,25 ponto percentual na taxa de juros pelo Federal Reserve (Fed), que seria a primeira alta desde 2023. O Dow Jones Futuro subiu antes da decisão.", "titulo_pt": "Dow Jones Futuro sobe antes da decisão sobre juros do Fed", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 165113, "titulo": "Da simples divulgação à comparabilidade do GRSAC", "url": "https://www.jota.info/opiniao-e-analise/colunas/fronteiras-regulacao-financeira/da-simples-divulgacao-a-comparabilidade-do-grsac", "fonte_id": "jota", "data_pub": "2026-09-16T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Resolução BCB 586 estabelece a padronização de dados sociais e ambientais das instituições financeiras. O objetivo é permitir a comparabilidade desses dados.", "titulo_pt": "Da simples divulgação à padronização de dados sociais e ambientais do GRSAC", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 165114, "titulo": "A política de minerais críticos entre cadeia produtiva, metas e bicameralismo", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-politica-de-minerais-criticos-entre-cadeia-produtiva-metas-e-bicameralismo", "fonte_id": "jota", "data_pub": "2026-09-16T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei 2.780/24 estabelece uma política para minerais críticos, mas uma emenda do Senado pode ter alterado o mérito do texto original sem uma nova votação na Câmara.", "titulo_pt": "Política de minerais críticos: projeto de lei e emenda do senado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 165115, "titulo": "Os desafios do PL que altera a Lei de Recuperação e Falência", "url": "https://www.jota.info/opiniao-e-analise/artigos/os-desafios-do-pl-que-altera-a-lei-de-recuperacao-e-falencia", "fonte_id": "jota", "data_pub": "2026-09-16T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei que altera a Lei de Recuperação e Falência representa uma evolução necessária, mas ainda é considerado uma reforma incompleta.", "titulo_pt": "Os desafios da reforma do PL que altera a Lei de Recuperação e Falência", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 165388, "titulo": "Restaurant bankruptcies surge across France as costs climb and customers spend less", "url": "https://www.lemonde.fr/en/economy/article/2026/09/16/restaurant-bankruptcies-surge-across-france-as-costs-climb-and-customers-spend-less_6757577_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-16T08:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 4.900 empresas de restaurantes se declararam em falência desde o início do ano, representando uma elevação de 7% em comparação com o mesmo período de 2025. O verão excepcionalmente quente não conseguiu inverter a tendência decrescente da indústria.", "titulo_pt": "Declarações de falência de restaurantes aumentam em 7% no ano", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 165116, "titulo": "IBS: o acordo pioneiro entre o estado do Paraná e o município de Curitiba", "url": "https://www.jota.info/opiniao-e-analise/artigos/ibs-o-acordo-pioneiro-entre-o-estado-do-parana-e-o-municipio-de-curitiba", "fonte_id": "jota", "data_pub": "2026-09-16T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estado do Paraná e o município de Curitiba firmaram um acordo inédito que disciplina a atuação conjunta na cobrança do IBS, preservando a autonomia de cada ente federativo.", "titulo_pt": "Acordo inédito entre Paraná e Curitiba disciplina atuação conjunta na cobrança do IBS", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 165403, "titulo": "Crypto exchange Binance takes on tradfi by courting rich investors to join its expanded wealth-management platform", "url": "https://www.cnbc.com/2026/09/16/crypto-exchange-binance-expands-wealth-management-platform-.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-16T08:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Binance está permitindo que investidores individuais qualificados usem sua plataforma Capital Connect pela primeira vez. A exchange está alargando seu serviço de gerenciamento de riquezas para atrair investidores ricos.", "titulo_pt": "Binance expande plataforma de gerenciamento de riquezas para investidores qualificados", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 165025, "titulo": "Bolsa e eleições: o que 5 ciclos revelam sobre o Ibovespa entre os turnos", "url": "https://www.infomoney.com.br/mercados/bolsa-eleicoes-ibovespa-entre-turnos-5-ciclos/", "fonte_id": "infomoney", "data_pub": "2026-09-16T08:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo demonstra que as altas no Ibovespa são mais frequentes durante as eleições, mas períodos de forte volatilidade também são observados. Esses episódios ajudam a mitigar o saldo geral positivo.", "titulo_pt": "Bolsa e eleições: o que 5 ciclos revelam sobre o Ibovespa entre os turnos", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 165027, "titulo": "O que anos de inflação fizeram com os preços nos EUA?", "url": "https://www.infomoney.com.br/business/global/o-que-anos-de-inflacao-fizeram-com-os-precos-nos-eua/", "fonte_id": "infomoney", "data_pub": "2026-09-16T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os americanos comuns têm sido afetados pela inflação acumulada ao longo do tempo. O alívio que ocorria até o ano anterior acabou devido à política tarifária e à guerra no Irã.", "titulo_pt": "O que anos de inflação fizeram com os preços nos EUA?", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 165606, "titulo": "Boox Launches the Palma 3 E-Reader", "url": "https://www.wired.com/story/boox-palma-3-announced/", "fonte_id": "wired", "data_pub": "2026-09-16T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Boox lançou recentemente o Palma 3, um dispositivo de leitura eletrônica com tela de papel eletrônico, bem como dois novos cadernos digitais coloridos, o Note Air6 C e o Mini C.", "titulo_pt": "Boox lança o Palma 3 e dois novos cadernos digitais coloridos", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 165533, "titulo": "People’s Daily rejects US claims of malicious AI distillation, warns of countermeasures", "url": "https://www.scmp.com/tech/article/3367717/peoples-daily-rejects-us-claims-malicious-ai-distillation-warns-countermeasures?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-16T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O People's Daily, órgão oficial do Partido Comunista Chinês, rejeitou acusações dos EUA de que empresas chinesas de inteligência artificial estariam realizando uma 'distilação industrial em grande escala' de modelos americanos avançados. O jornal advertiu que Pequim tomaria medidas se Washington continuar a suprimir o setor de IA chinês.", "titulo_pt": "People's Daily rejeita acusações americanas sobre IA e ameaça medidas contra supressão", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 165338, "titulo": "An aging Congress' dilemma: Can they regulate AI without using it?", "url": "https://www.axios.com/2026/09/16/lawmakers-regulate-ai-without-using-it", "fonte_id": "axios", "data_pub": "2026-09-16T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Congressistas e governadores estão sob crescente pressão para regulamentar a IA, mas mais de 25 deles, que conversaram com a Axios, afirmaram não usar a tecnologia ou raramente a utilizam. Isso ocorre enquanto há chamados por uma pausa na IA e alertas de que ela poderia ser prejudicial à humanidade se não for controlada.", "titulo_pt": "O dilema da congresso em idade avançada: eles podem regular a IA sem utilizá-la?", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 165608, "titulo": "Why It Seems Like Great White Sharks Are Overrunning Maine", "url": "https://www.wired.com/story/why-great-white-sharks-are-overrunning-maine/", "fonte_id": "wired", "data_pub": "2026-09-16T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A presença de grandes tubarões brancos na costa do Maine não é uma ameaça, mas sim um sinal de um sucesso na conservação.", "titulo_pt": "Por que parece haver muitos tubarões brancos invadindo o Maine?", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 164997, "titulo": "UE quer banir acesso a redes sociais e IA para menores de 13 anos", "url": "https://www.cnnbrasil.com.br/internacional/ue-redes-sociais-13-anos/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-16T09:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Comissão Europeia planeja anunciar detalhes de uma proposta para banir o acesso a redes sociais e inteligência artificial para menores de 13 anos. Ursula von der Leyen, presidente da Comissão, também se reunirá com empresas de IA para discutir medidas de segurança.", "titulo_pt": "UE quer banir acesso a redes sociais e IA para menores de 13 anos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 165001, "titulo": "IA nas escolas: a tecnologia pode aumentar as desigualdades?", "url": "https://www.cnnbrasil.com.br/educacao/ia-nas-escolas-a-tecnologia-pode-aumentar-as-desigualdades/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-16T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As novas diretrizes do Conselho Nacional de Educação (CNE) limitam o uso da inteligência artificial (IA) nas salas de aula. Um especialista alerta, no entanto, que sem formação adequada e infraestrutura, a disparidade entre diferentes redes escolares pode se agravar.", "titulo_pt": "IA nas escolas: novas diretrizes limitam uso, mas risco de aumentar desigualdades persiste", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 165610, "titulo": "Polymarket’s Next Bet? It Can Also Be a Media Company", "url": "https://www.wired.com/story/prediction-markets-polymarket-media-company-kalshi/", "fonte_id": "wired", "data_pub": "2026-09-16T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A batalha legal sobre se as plataformas de mercado de previsão são uma forma de apostas tem escondido outro aspecto importante: elas já se tornaram uma nova forma de mídia.", "titulo_pt": "Próxima aposta do polymarket? Também pode se tornar uma empresa de mídia", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 165495, "titulo": "AI can supercharge Putin’s goals, not his great-power ambitions", "url": "https://www.japantimes.co.jp/news/2026/09/16/world/politics/ai-putin-goals-ambitions/", "fonte_id": "japan_times", "data_pub": "2026-09-16T08:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Por enquanto, as capacidades de IA da Rússia provavelmente são suficientes para atender às necessidades do estado. A IA pode amplificar os objetivos de Putin, mas não seus ambiciosos planos de potência global.", "titulo_pt": "IA pode potencializar os objetivos de Putin, mas não seus ambiciosos planos de potência global", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 165611, "titulo": "‘Smart’ Nanoparticles Deliver mRNA Directly to Tumors in New Cancer Therapy", "url": "https://www.wired.com/story/smart-nanoparticles-deliver-mrna-directly-to-tumors-in-new-cancer-therapy/", "fonte_id": "wired", "data_pub": "2026-09-16T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nanopartículas inteligentes são usadas para entregar mRNA diretamente aos tumores em uma nova terapia contra o câncer. Essa terapia pode reprogramar células imunes corrompidas pelo câncer, fortalecendo a capacidade do corpo de combater o tumor.", "titulo_pt": "Nanopartículas inteligentes entregam mrna diretamente aos tumores em nova terapia contra câncer", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 165492, "titulo": "EU to restrict social media and chatbots for children under 15", "url": "https://www.ft.com/content/410db291-f133-4d72-b883-b2d5a32abbf8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-16T08:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia planeja limitar o uso de redes sociais e chatbots por crianças menores de 15 anos. Ursula von der Leyen, presidente da Comissão Europeia, compara a inteligência artificial à segunda grande mudança do século, após o aquecimento global.", "titulo_pt": "Ue vai limitar redes sociais e chatbots para crianças abaixo de 15 anos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 165615, "titulo": "S. Korea cannot afford to slow down AI development: science minister", "url": "https://en.yna.co.kr/view/AEN20260916010200320", "fonte_id": "yonhap_news", "data_pub": "2026-09-16T08:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Ciência da Coreia do Sul afirma que o país não pode retardar o desenvolvimento de inteligência artificial. O texto sugere que a Coreia do Sul deve manter o ritmo no avanço tecnológico nessa área.", "titulo_pt": "Coreia do sul não pode retardar o desenvolvimento de IA, afirma ministro da ciência", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 165499, "titulo": "Pickle-flavored tart? AI inspires Japan’s convenience stores", "url": "https://www.japantimes.co.jp/business/2026/09/16/ai-sweets-japan-convenience-stores/", "fonte_id": "japan_times", "data_pub": "2026-09-16T07:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As redes de conveniência japonesas estão utilizando a inteligência artificial para desenvolver novos produtos, incluindo sabores inusitados. Isso visa atender clientes cansados de pratos tradicionais como sanduíches de ovos e bolos de arroz.", "titulo_pt": "Tart de palato picante? Inteligência artificial inspira pratos inusitados em lojas de conveniência japonesas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 165542, "titulo": "Tesla revives China discounts; Iran war drives shift to electric cars: 7 EV reads", "url": "https://www.scmp.com/business/china-evs/article/3367677/tesla-revives-china-discounts-iran-war-drives-shift-electric-cars-7-ev-reads?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-16T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Tesla reativou descontos nos carros elétricos fabricados na China para combater a queda nas entregas no maior mercado mundial de veículos elétricos. O aumento do conflito com a Irã pode impulsionar a adoção de veículos elétricos devido ao aumento do preço das importações de combustíveis.", "titulo_pt": "Tesla reativa descontos na China; aumento do conflito com a Irã pode impulsionar veículos elétricos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 165625, "titulo": "Ahnlab to invest 100 bln won over 3 yrs for 'AI-native' transformation", "url": "https://en.yna.co.kr/view/AEN20260916007100320", "fonte_id": "yonhap_news", "data_pub": "2026-09-16T06:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ahnlab, uma empresa sul-coreana de segurança cibernética, anunciou que investirá 100 bilhões de wones em três anos para transformar sua empresa em uma 'AI-native'.", "titulo_pt": "Ahnlab investirá 100 bilhões de wones em três anos para transformação em 'AI-native'", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 165051, "titulo": "Brasil dobra capacidade de data centers em 2026 e vira alvo da corrida global por IA", "url": "https://exame.com/inteligencia-artificial/brasil-dobra-capacidade-de-data-centers-em-2026-e-vira-alvo-da-corrida-global-por-ia/", "fonte_id": "exame", "data_pub": "2026-09-16T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A capacidade de data centers no Brasil deve dobrar até 2026, impulsionada pela crescente demanda por inteligência artificial. Centenas de megawatts em novos projetos e bilhões de dólares em investimentos estão previstos.", "titulo_pt": "Brasil duplica capacidade de data centers em 2026 e se torna alvo da corrida global por IA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 165588, "titulo": "Samsung’s foldable lead faces the Apple test", "url": "https://www.koreaherald.com/article/10875728", "fonte_id": "korea_herald", "data_pub": "2026-09-16T05:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samsung Electronics desenvolveu o Galaxy Z Fold durante sete anos e lançou o modelo Z Fold8 por US$ 1.899,99. Agora, o dispositivo enfrentará pela primeira vez um iPhone com uma abordagem semelhante no mercado americano, com o iPhone Duo sendo lançado por US$ 1.999.", "titulo_pt": "Levantamento de samsung enfrenta teste do iphone", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 165534, "titulo": "Hong Kong’s first five-year plan seeks to boost innovation", "url": "https://www.scmp.com/plus/news/hong-kong/politics/article/3367711/hong-kongs-first-five-year-plan-seeks-boost-innovation?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-16T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe do Executivo de Hong Kong, John Lee Ka-chiu, apresentou o primeiro plano de cinco anos da cidade, que inclui medidas para fortalecer a inovação, os nascimentos e a atividade financeira. O plano visa aumentar o gasto com inovação para 3% do PIB após 2030, a partir de 1,63% em 2024.", "titulo_pt": "Plano de cinco anos de hong Kong busca estimular inovação", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 165193, "titulo": "El alimento vinculado a un mayor riesgo de cáncer de próstata, según distintos estudios", "url": "https://www.latercera.com/tendencias/noticia/el-alimento-vinculado-a-un-mayor-riesgo-de-cancer-de-prostata-segun-distintos-estudios/", "fonte_id": "la_tercera", "data_pub": "2026-09-16T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O câncer de próstata é o mais comum entre os homens no Chile. Estudos distintos associaram um alimento a um maior risco de desenvolver essa doença.", "titulo_pt": "Alimento relacionado a maior risco de câncer de próstata, segundo diversos estudos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 164869, "titulo": "Tigre-da-tasmânia tinha mordida mais similar à do lobo-guará e caçava presas pequenas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/tigre-da-tasmania-tinha-mordida-mais-similar-a-do-lobo-guara-e-cacava-presas-pequenas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-16T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo sugere que o tilacino, conhecido como tigre-da-tasmânia, caçava principalmente presas pequenas e ágeis, em vez de ser um superpredador como se pensava anteriormente. O animal era mais similar em seu estilo de caça ao do lobo-guará.", "titulo_pt": "Tigre-da-tasmânia tinha mordida mais similar à do lobo-guará e caçava presas pequenas", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 165661, "titulo": "First-of-its-kind preventive phage therapy provides promising results against Salmonella", "url": "https://phys.org/news/2026-09-kind-phage-therapy-results-salmonella.html", "fonte_id": "phys_org", "data_pub": "2026-09-16T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma terapia bacteriófaga preventiva, inovadora no seu gênero, mostrou resultados promissores na luta contra a Salmonella. Cada espécie bacteriana no microbioma intestinal animal geralmente possui seu próprio conjunto de parcerias bacteriófagas.", "titulo_pt": "Primeira terapia bacteriófaga preventiva oferece resultados promissores contra a Salmonella", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 165662, "titulo": "New simulations link unusual particle diffusion to yielding in soft jammed matter", "url": "https://phys.org/news/2026-09-simulations-link-unusual-particle-diffusion.html", "fonte_id": "phys_org", "data_pub": "2026-09-16T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas simulações estabelecem uma ligação entre a difusão incomum de partículas e o fenômeno de 'yielding' em materiais macios e empacados. Estes materiais, como suspensões coloidais, emulsões, espumas e géis, mostram comportamentos complexos e atípicos, podendo resistir à deformação como sólidos, mas começar a fluir como líquidos quando uma força externa suficientemente forte é aplicada.", "titulo_pt": "Novas simulações conectam difusão incomum de partículas ao fenômeno de 'yielding' em materiais macios e empacados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 165663, "titulo": "'Born-again' star offers rare chance to watch stellar evolution in real time", "url": "https://phys.org/news/2026-09-born-star-rare-chance-stellar.html", "fonte_id": "phys_org", "data_pub": "2026-09-16T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos confirmaram que uma das estrelas mais variáveis já observadas entrou em uma nova fase de sua evolução, oferecendo uma oportunidade rara de assistir à vida de uma estrela se desenvolver em escala de tempo humana.", "titulo_pt": "Estrela renascida oferece chance rara de observar evolução estelar em tempo real", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 165664, "titulo": "Speeding glaciers drive half a century of polar ice loss", "url": "https://phys.org/news/2026-09-glaciers-century-polar-ice-loss.html", "fonte_id": "phys_org", "data_pub": "2026-09-16T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O registro de satélite mais longo mostrou que Groenlândia e Antártica perderam 11,3 trilhões de toneladas métricas de gelo desde os anos 1970, elevando o nível do mar global em mais de 3 centímetros, e a maioria dessa perda veio de geleiras que se moviam mais rápido para o oceano, não de derivação superficial.", "titulo_pt": "Glaciar acelerado é responsável pela maioria da perda de gelo polar nos últimos 50 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 165665, "titulo": "The local costs of remote sensing: Examining the ethics of laser scanning in tropical forests", "url": "https://phys.org/news/2026-09-local-remote-ethics-laser-scanning.html", "fonte_id": "phys_org", "data_pub": "2026-09-16T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O laser scanning, frequentemente chamado de lidar, transformou rapidamente a forma como as regiões de florestas tropicais são estudadas, monitoradas e compreendidas em várias disciplinas acadêmicas. A tecnologia permite que os pesquisadores avancem através das coberturas de árvores densas, fornecendo escaneamentos de alta resolução do terreno abaixo de forma rápida.", "titulo_pt": "Os custos locais do sensor remoto: examinando a ética do laser scanning nas florestas tropicais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 165570, "titulo": "COVID-19 drug controversy clouds justice minister nominee's confirmation", "url": "https://www.koreaherald.com/article/10875980", "fonte_id": "korea_herald", "data_pub": "2026-09-16T08:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O nomeado para Ministro da Justiça, Kim Seung-won, está sendo investigado por supostamente ter interferido em favor de uma empresa biotecnológica, Genencell, em outubro de 2021, em um pedido para aprovação de ensaios clínicos de um medicamento. A investigação está relacionada a suspeitas de manipulação de preço de ações.", "titulo_pt": "Controvérsia sobre medicamento ameaça aprovação do nomeado para ministro da justiça", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 165658, "titulo": "STAT+: House Democrats may use oversight powers to plan for health care overhaul", "url": "https://www.statnews.com/2026/09/16/healthcare-reform-house-democrats-oversight-targets-after-midterms/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-16T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os democratas nos Estados Unidos estão elaborando sua estratégia após as eleições e consideram que investigações sobre saúde podem ser um assunto vencedor.", "titulo_pt": "Democratas podem usar poderes de fiscalização para planejar reforma na saúde", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 165659, "titulo": "Opinion: How my cancer diagnosis changed the way I train physicians", "url": "https://www.statnews.com/2026/09/16/medical-school-cancer-structure-pathology-professor-personal-experience/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-16T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "David Elkowitz, um professor de patologia e medicina laboratorial, descreve como sua própria experiência com câncer está sendo usada para treinar futuros médicos.", "titulo_pt": "Opinião: como a minha diagnóstico de câncer mudou a forma como treino médicos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 165660, "titulo": "Opinion: STAT+: Dementia should be a campaign issue — not an insult", "url": "https://www.statnews.com/2026/09/16/dementia-november-2026-midterm-elections-policy-privacy-caregivers-economy/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-16T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O colunista do STAT Neurotransmissions, Jason Karlawish, questiona as consequências negativas da forma como os políticos falam sobre demência e sugere que deveriam escolher uma abordagem diferente.", "titulo_pt": "Opinião: o STAT+: a demência deveria ser um tema de campanha - não uma ofensa", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 165666, "titulo": "Wildfires push endangered Sumatran elephants to brink: Indonesian NGO", "url": "https://phys.org/news/2026-09-wildfires-endangered-sumatran-elephants-brink.html", "fonte_id": "phys_org", "data_pub": "2026-09-16T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais estão empurrando as elefantes de Sumatra, uma espécie criticamente em perigo, para a borda da extinção, conforme relatado pela organização de conservação Geopix, de Indonesia.", "titulo_pt": "Incêndios empurram elefantes de sumatra, em perigo crítico, para a borda da extinção", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 165667, "titulo": "SpaceX prepares for first orbital flight of Starship rocket", "url": "https://phys.org/news/2026-09-spacex-orbital-flight-starship-rocket.html", "fonte_id": "phys_org", "data_pub": "2026-09-16T08:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SpaceX planeja enviar o foguete Starship em sua primeira viagem orbital, um passo crucial em seu projeto de chegar à Lua ou Marte no futuro.", "titulo_pt": "Spacex prepara-se para primeira viagem orbital do foguete Starship", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 165668, "titulo": "Well-preserved tooth from Pacific mastodon found in a creek in San Francisco Bay Area", "url": "https://phys.org/news/2026-09-tooth-pacific-mastodon-creek-san.html", "fonte_id": "phys_org", "data_pub": "2026-09-16T08:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Brigid Lynch encontrou um dente fósil de mastodonte do Pacífico enquanto trabalhava perto de um riacho boscoso na região da Baía de San Francisco. O dente estava bem preservado e chamou a atenção da pesquisadora durante sua pesquisa.", "titulo_pt": "Dente fósil de mastodonte do pacífico encontrado em riacho na região da baía de San Francisco", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 165669, "titulo": "A world 20 light-years away reveals surprisingly organized, Jupiter-like weather", "url": "https://phys.org/news/2026-09-world-years-reveals-jupiter-weather.html", "fonte_id": "phys_org", "data_pub": "2026-09-16T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas da Universidade Trinity College Dublin desenvolveram um método para decifrar os padrões climáticos em mundos distantes. Eles descobriram que o clima de um dwarfa branco bem estudado, o SIMP 0136, que anteriormente estava associado a fenômenos semelhantes às auroras, é principalmente moldado por apenas dois processos dominantes: mudanças na temperatura e na estrutura vertical das nuvens.", "titulo_pt": "Mundo a 20 luzes anos de distância revela clima organizado, semelhante ao de júpiter", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 165749, "titulo": "Fallow", "url": "https://lithub.com/fallow/", "fonte_id": "lithub", "data_pub": "2026-09-16T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O paciente foi informado de que o custo da cirurgia dentária estaria entre dois e quatro mil dólares. O dentista não foi capaz de fornecer um preço mais preciso até que o procedimento fosse realizado.", "titulo_pt": "Fallow", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 165702, "titulo": "Terre radiator by Sebastian Herkner for Tubes", "url": "https://www.dezeen.com/2026/09/16/terre-radiator-sebastian-herkner-tubes-dezeen-showroom/", "fonte_id": "dezeen", "data_pub": "2026-09-16T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O designer Sebastian Herkner criou o radiador Terre em colaboração com a marca italiana de aquecimento Tubes. Terre é o primeiro radiador da empresa feito de argila, proveniente da praia de Impruneta na Toscana, proporcionando um contraste quente e rústico em relação ao caráter metálico usual dos radiadores.", "titulo_pt": "Radiador terre por Sebastian Herkner para Tubes", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 165750, "titulo": "The Movie Star and the Mountain: On Robert Redford’s Sundance Origin Story", "url": "https://lithub.com/the-movie-star-and-the-mountain-on-robert-redfords-sundance-origin-story/", "font
