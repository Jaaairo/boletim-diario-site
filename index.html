ger pessoas e o meio ambiente, mas a versão atual falta clareza.", "titulo_pt": "Lei de registro para cientistas na áfrica do sul pode servir de modelo mundial — se o país acertar", "veiculo": "Nature News", "pais": "Reino Unido", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 123904, "titulo": "Daniel Mecca, escritor: “Recorrer las calles por donde Borges caminaba permite crear una imaginación poética de su figura”", "url": "https://www.lanacion.com.ar/que-sale/daniel-mecca-escritor-caminar-por-las-calles-donde-borges-caminaba-permite-crear-una-imaginacion-nid25082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-26T11:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Daniel Mecca, escritor, percorre as ruas de Buenos Aires onde Jorge Luis Borges caminhou, criando uma imaginação poética sobre a figura do autor de 'Ficciones'. Este percurso, que abrange bairros como Recoleta e Retiro, visa aproximar a obra de Borges a novas gerações através de locais biográficos e literários.", "titulo_pt": "Daniel Mecca, escritor: ‘percorrer as ruas por onde Borges caminhou permite criar uma imaginação poética de sua figura’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 124574, "titulo": "Qué significa que una persona interrumpa todo el tiempo a los demás sin ningún reparo, según la psicología", "url": "https://www.lanacion.com.ar/lifestyle/que-significa-que-una-persona-interrumpa-todo-el-tiempo-a-los-demas-sin-ningun-reparo-segun-la-nid25082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-26T09:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Interrumpir frequentemente pode estar associado à impaciência, à ansiedade, à necessidade de ser ouvido ou a dificuldades em praticar a escuta ativa.", "titulo_pt": "O que significa que uma pessoa interrompe constantemente os outros, de acordo com a psicologia", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 124576, "titulo": "Bruce Lee: “Esperar que la vida te trate bien por ser buena persona es como esperar que un tigre o un león no te ataquen por ser vegetariano”", "url": "https://www.lanacion.com.ar/lifestyle/bruce-lee-esperar-que-la-vida-te-trate-bien-por-ser-buena-persona-es-como-esperar-que-un-tigre-o-un-nid25082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-26T09:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Bruce Lee é conhecido não apenas por sua habilidade física, mas também como um pensador pragmático cujas máximas sobre resiliência e comportamento humano ainda são relevantes na cultura popular.", "titulo_pt": "Bruce Lee: ‘esperar que a vida te trate bem por ser uma boa pessoa é como esperar que um tigre ou um leão não te ataque por ser vegetariano’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 125113, "titulo": "Tributes pour in after country music legend Dolly Parton dies – latest updates", "url": "https://www.theguardian.com/us-news/live/2026/aug/25/dolly-parton-dead-age-80-live", "fonte_id": "guardian_culture", "data_pub": "2026-08-26T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dolly Parton, lendária cantora country de 80 anos, faleceu após ser diagnosticada com câncer, segundo sua equipe. Celebridades como Beyoncé, Taylor Swift e Dionne Warwick lideraram as homenagens a ela.", "titulo_pt": "Homensagens fluem após morte da lendária cantora country Dolly Parton", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 124583, "titulo": "Noche estrellada", "url": "https://www.lanacion.com.ar/cultura/noche-estrellada-nid26082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-26T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto original fornecido não contém nenhum trecho específico para resumir. No entanto, baseado no título 'Noche estrellada', o resumo pode ser: Uma noite iluminada por estrelas.", "titulo_ neses 'retomando o poder' sobre sua alimentação", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 124766, "titulo": "Inside the backlash over the Jeffries-Kushner meeting", "url": "https://www.axios.com/2026/08/26/jeffries-kushner-meeting-reaction-democrats-left", "fonte_id": "axios", "data_pub": "2026-08-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hakeem Jeffries, líder minoritário da Câmara dos Representantes, enfrenta tensões com a esquerda do seu partido após uma reunião com Jared Kushner, conselheiro do presidente Trump. Jeffries justificou a reunião, afirmando que ela foi para discutir a crise da acessibilidade.", "titulo_pt": "Debate em torno da reunião entre jeffries e kushner", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 125116, "titulo": "Clive Barker’s Hellraiser: Revival – a game so grotesque it scares its own director", "url": "https://www.theguardian.com/games/2026/aug/26/clive-barkers-hellraiser-revival", "fonte_id": "guardian_culture", "data_pub": "2026-08-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Clive Barker supervisionou a produção de Hellraiser: Revival, que apresenta novamente o personagem Pinhead de Doug Bradley. O jogo inclui imagens perturbadoras, baseadas em pesquisas sobre imagens que causam desconforto visual, como clusters de pequenos buracos, mantendo um alto nível de terror.", "titulo_pt": "Clive Barker’s Hellraiser: revival – um jogo tão grotesco que assusta seu próprio diretor", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 125058, "titulo": "(LEAD) Do Ho Suh reconstructs home, memory, family at MMCA exhibition", "url": "https://en.yna.co.kr/view/AEN20260826005551315", "fonte_id": "yonhap_news", "data_pub": "2026-08-26T08:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artista contemporâneo renomado Do Ho Suh está exibindo obras que reconstroem conceitos de lar, memória e família no MMCA. A exposição está em Seoul, Coreia do Sul, e ocorre em 26 de agosto.", "titulo_pt": "Do Ho Suh reconstitui casa, memória e família em exposição no MMCA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 124908, "titulo": "North Korea to ‘bring joy’ to Kim with 100 athletes at Asian Games in Japan", "url": "https://www.japantimes.co.jp/sports/2026/08/26/north-korea-asian-games/", "fonte_id": "japan_times", "data_pub": "2026-08-26T08:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Norte enviou 100 atletas para competir nas Assembleias Asiáticas em Tóquio, marcando sua volta às competições internacionais esportivas após o período da pandemia de COVID-19. O país participou das Assembleias Asiáticas na China em 2023.", "titulo_pt": "Coreia do norte enviará 100 atletas para assembleias asiáticas no Japão para alegrar Kim", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 125119, "titulo": "Adam Riches: The Captain review – the extraordinary glory of a ‘half man, half fish’ Victorian hero", "url": "https://www.theguardian.com/stage/2026/aug/26/adam-riches-the-captain-review-summerhall-edinburgh-swimming-channel-matthew-webb", "fonte_id": "guardian_culture", "data_pub": "2026-08-26T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A peça 'O Capitão', de Adam Riches, reaviva a história de Matthew Webb, o primeiro homem a nadar o Canal da Inglaterra sem auxílio. A performance é apresentada no Summerhall, em Edimburgo.", "titulo_pt": "Adam Riches: a revista do capitão – a extraordinária glória de um herói victoriano 'meio homem, meio peixe'", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 124332, "titulo": "Anna Maria Maiolino ganha exposição em que usa a arte para radiografar o corpo", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/anna-maria-maiolino-g o de um período de residência artística no local. O Instituto Capobianco foi reaberto este ano no centro de São Paulo.", "titulo_pt": "Janaína Leite estreia novo espetáculo no Instituto Capobianco", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 125075, "titulo": "Interior minister orders nationwide review of missing person cases after Jeju scandal", "url": "https://www.koreaherald.com/article/10853301", "fonte_id": "korea_herald", "data_pub": "2026-08-26T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro do Interior da Coreia do Sul ordenou uma revisão nacional dos casos de pessoas desaparecidas após um escândalo em Jeju. Durante uma reunião de emergência com altos oficiais da polícia em Seul, Yun Ho-jung pediu que a polícia investigasse a suposta falsificação do fechamento de casos de desaparecidos em Jeju e revisasse como esses casos são tratados em todo o país.", "titulo_pt": "Ministro do interior ordena revisão nacional de casos de desaparecidos após escândalo em Jeju", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 124936, "titulo": "North Macedonia Sees Drop in New School Pupils amid Demographic Woes", "url": "https://balkaninsight.com/2026/08/26/north-macedonia-sees-drop-in-new-school-pupils-amid-demographic-woes/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-08-26T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "North Macedonia começa o novo ano letivo com cerca de 14.500 alunos matriculados no ensino fundamental, quase 38% menos do que há uma década. O declínio populacional e a emigração estão levando a encerramentos de escolas e turmas.", "titulo_pt": "Macedônia do norte registra diminuição de novos alunos no início do ano letivo", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 124564, "titulo": "Nueva ley de salud mental: qué cambios impulsan ahora para las internaciones y otros dos ejes clave del plan oficial", "url": "https://www.clarin.com/sociedad/nueva-ley-salud-mental-cambios-impulsan-ahora-internaciones-ejes-clave-plan-oficial_0_RhiTVAbMhM.html", "fonte_id": "clarin", "data_pub": "2026-08-26T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo tenta alcançar um consenso com as províncias sobre uma nova lei de saúde mental. Há ainda pontos em discussão antes do dictamen do projeto, que promove mudanças em internações, hospitais e o papel dos psiquiatras.", "titulo_pt": "Nova lei de saúde mental: quais mudanças estão sendo discutidas para internações e outros dois pilares do plano oficial", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 124909, "titulo": "‘Black smoke’ chokes Pakistan maternity ward as hospital fire kills 14 infants", "url": "https://www.japantimes.co.jp/news/2026/08/26/asia-pacific/pakistan-maternity-ward-fire/", "fonte_id": "japan_times", "data_pub": "2026-08-26T08:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio no terceiro andar do setor de maternidade e saúde infantil do principal hospital público da capital do Paquistão, o Pakistan Institute of Medical Sciences, resultou na morte de 14 bebês.", "titulo_pt": "Fumaça preta sufoca maternidade paquistanesa enquanto incêndio mata 14 bebês", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 124551, "titulo": "O que tabaco, álcool e ultraprocessados têm a ensinar sobre o vício digital", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-que-tabaco-alcool-e-ultraprocessados-tem-a-ensinar-sobre-o-vicio-digital", "fonte_id": "jota", "data_pub": "2026-08-26T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um caso nos Estados Unidos reviveu a discussão sobre a responsabilidade pelos vícios digitais. O caso destaca o paralelo entre o vício em plataformas digitais, tabaco, álcool e alimentos ultraprocessados.", "titulo_pt": "O que tabaco, álcool e ultraprocessados têm a ensinar sobre o vício digital?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 124435, "titulo": "Hytalo Santos é condenado a pagar R$ 60 mil a ex-seguranças por assédio", "url": "https://www.metropoles.com/brasil/hytalo-santos-condenado-assedio", "fonte_id": "metropoles", "data_pub": "2026-08-26T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Hytalo Santos foi condenado a pagar R$ 60 mil a ex-seguranças por assédio. A defesa do influenciador informou que vai recorrer da decisão da Justiça do Trabalho.", "titulo_pt": "Hytalo Santos é condenado a pagar R$ 60 mil a ex-seguranças por assédio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 125070, "titulo": "No. of immigrant-background students in primary, secondary education hits record high", "url": "https://en.yna.co.kr/view/AEN20260826005300315", "fonte_id": "yonhap_news", "data_pub": "2026-08-26T06:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de estudantes de origem imigrante em ensino fundamental, médio e superior atingiu um novo recorde. Em Seul, 26 de agosto de 2023, foi relatado que a participação de estudantes com origem imigrante em níveis educacionais básicos aumentou significativamente.", "titulo_pt": "Número de estudantes de origem imigrante em ensino básico atinge novo recorde", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 124486, "titulo": "Pacientes com TOC levam quase 7 anos para buscar ajuda; psiquiatra explica", "url": "https://www.cnnbrasil.com.br/saude/pacientes-com-toc-levam-quase-7-anos-para-buscar-ajuda-psiquiatra-explica/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-26T06:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudo mostra que pacientes com TOC aguentam cerca de 7 anos sem buscar ajuda devido à vergonha de expor seus sintomas e ao estigma associado. Barreiras significativas para o tratamento do transtorno obsessivo-compulsivo são identificadas.", "titulo_pt": "Pacientes com TOC aguardam quase 7 anos para buscar ajuda; psiquiatra explica", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 125097, "titulo": "Jang Mi-ran case leaves Korea asking how to handle missing adults", "url": "https://www.koreaherald.com/article/10853004", "fonte_id": "korea_herald", "data_pub": "2026-08-26T06:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A morte de Jang Mi-ran, após um caso de desaparecimento de adulto supostamente encerrado com base em informações falsas, reavivou a discussão sobre o sistema de busca por adultos desaparecidos na Coreia do Sul. Mais de 70.000 adultos foram reportados como desaparecidos no país.", "titulo_pt": "Caso jang Mi-ran reaviva debate sobre sistema de busca por adultos desaparecidos na Coreia do sul", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 124957, "titulo": "At least 14 newborns die in Pakistan hospital fire triggered by air-con fault", "url": "https://www.scmp.com/news/asia/south-asia/article/3365296/15-newborns-die-pakistan-hospital-fire-triggered-air-con-fault?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-26T06:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 14 bebês morreram em um incêndio em um hospital público em Islamabad, capital do Paquistão, conforme informou o primeiro-ministro. O fogo teria começado no sistema de ar condicionado na terceira planta do setor de maternidade do Pakistan Institute of Medical Sciences.", "titulo_pt": "Pelo menos 14 bebês morrem em incêndio em hospital do paquistão, atribuído a falha no ar condicionado", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 124647, "titulo": "Man on trial for Daphne Caruana Galizia murder claims he was framed", "url": "https://www.theguardian.com/world/2026/aug/26/yorgen-fenech-trial-daphne-caruana-galizia-claims-framed", "fonte_id": "guardian_world", "data_pub": "2026-08-26T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Yorgen Fenech, um empresário em julgamento pelo assassinato da jornalista Daphne Caruana Galizia, afirma que não tem nada a ver com o crime e acusa o mais alto conselheiro do ex-primeiro-ministro de Malta de ter ordenado o assassinato. Durante quatro dias de interrogatório por advogados de defesa e promotorias, Fenech declarou que foi enganado pela polícia.", "titulo_pt": "Suspeito do assassinato de Daphne Caruana Galizia afirma ter sido enganado pela polícia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 124490, "titulo": "Telas na primeira infância prejudicam o desenvolvimento cerebral", "url": "https://www.cnnbrasil.com.br/saude/telas-na-primeira-infancia-prejudicam-o-desenvolvimento-cerebral/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-26T03:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas alertam que o uso excessivo de telas prejudica o desenvolvimento neuropsicomotor das crianças, fazendo-as perder experiências cruciais para o seu crescimento.", "titulo_pt": "Uso excessivo de tecnologia prejudica o desenvolvimento cerebral na primeira infância", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 124713, "titulo": "Tratamientos de fertilización asistida aumentan 52,5% en Fonasa durante el primer semestre", "url": "https://www.latercera.com/nacional/noticia/tratamientos-de-fertilizacion-asistida-aumentan-525-en-fonasa-durante-el-primer-semestre/", "fonte_id": "la_tercera", "data_pub": "2026-08-26T00:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O número de tratamentos de fertilização assistida aumentou em 52,5% no Fonasa durante o primeiro semestre. Especialistas atribuem este crescimento à postergação da maternidade, que dificulta o processo natural de fertilização.", "titulo_pt": "Tratamentos de fertilização assistida aumentam 52,5% no Fonasa no primeiro semestre", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 123395, "titulo": "Teachers’ safety and inclusion", "url": "https://www.taipeitimes.com/News/editorials/archives/2026/08/26/2003863129", "fonte_id": "taipei_times", "data_pub": "2026-08-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo aborda questões relacionadas à segurança e inclusão dos professores.", "titulo_pt": "Segurança e inclusão dos professores", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 123809, "titulo": "SP registra mais de 122 mil multas por celular ao volante no 1º semestre", "url": "https://www.metropoles.com/sao-paulo/sp-registra-mais-de-122-mil-multas-por-celular-ao-volante-no-1o-semestre", "fonte_id": "metropoles", "data_pub": "2026-08-25T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estado de São Paulo registrou mais de 122 mil multas por uso de celular ao volante no primeiro semestre. Mexer no aparelho, falar ao telefone ou segurar o celular também são infrações que podem resultar em autuações.", "titulo_pt": "SP registra mais de 122 mil multas por uso de celular ao volante no 1º semestre", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 123816, "titulo": "Homem invade clínica com carro e é preso com porções de crack no RS", "url": "https://www.metropoles.com/brasil/homem-invade-clinica-com-carro-e-e-preso-com-porcoes-de-crack-no-rs", "fonte_id": "metropoles", "data_pub": "2026-08-25T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem de 70 anos foi preso após invadir uma clínica com um carro no Rio Grande do Sul. Durante a prisão, foram encontradas porções de crack.", "titulo_pt": "Homem de 70 anos invade clínica com carro e é preso com crack no RS", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 124905, "titulo": "Deadly flash flood and mudslide cause casualties in Nepal and China", "url": "https://www.japantimes.co.jp/news/2026/08/26/asia-pacific/nepal-flash-flood/", "fonte_id": "japan_times", "data_pub": "2026-08-26T09:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um temporal causou alagamentos e deslizamentos de terra em Nepal e China, causando vítimas. As estradas, pontes e projetos de energia foram danificados e os helicópteros de resgate não poderão aterrissar até que as águas baixem.", "titulo_pt": "Inundações e deslizamentos de terra causam vítimas em Nepal e China", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 124342, "titulo": "Número de empresas que publicam dados sobre emissões de carbono bate recorde no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/numero-de-empresas-que-publicam-dados-sobre-emissoes-de-carbono-bate-recorde-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de empresas que divulgam informações sobre emissões de carbono ao Programa Brasileiro GHG Protocol atingiu um novo recorde. Este programa é considerado um dos maiores bancos de dados nacionais sobre gases de efeito estufa no contexto corporativo.", "titulo_pt": "Número de empresas que publicam dados sobre emissões de carbono bate recorde no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 124815, "titulo": "Haze from El Niño-fuelled wildfires threatens health of millions in Indonesia, ministry warns", "url": "http://www.euronews.com/2026/08/26/haze-from-el-nino-fuelled-wildfires-threatens-health-of-millions-in-indonesia-ministry-war", "fonte_id": "euronews", "data_pub": "2026-08-26T07:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério indonésio advertiu sobre a ameaça à saúde de milhões de pessoas devido a uma névoa de fuligem proveniente de incêndios florestais alimentados pelo El Niño. Entre janeiro e julho, os incêndios queimaram mais de 200.000 hectares de terra, uma área três vezes maior que a capital Jakarta.", "titulo_pt": "Névoa de fuligem de incêndios florestais ameaça saúde de milhões na indonésia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 124951, "titulo": "Vietnam’s Ho Chi Minh City plans low-emission zone to clear downtown air", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3365307/vietnams-ho-chi-minh-city-plans-low-emission-zone-clear-downtown-air?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-26T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ho Chi Minh, o centro comercial da Vietnam, está planejando restringir gradativamente veículos a gasolina e diesel em sua área central a partir de meados de 2027, como parte de uma zona de baixas emissões planejada. A iniciativa incluirá um período de teste a partir de julho de 2027 em áreas centrais e novas áreas urbanas, antes de expandir em 2029.", "titulo_pt": "Ho Chi Minh City, vietnã, planeja área de baixas emissões na área central", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 124916, "titulo": "Japan to end subsidies for solar panels", "url": "https://www.japantimes.co.jp/news/2026/08/26/japan/solar-panels-environment-ministry-subsidies/", "fonte_id": "japan_times", "data_pub": "2026-08-26T06:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Japão vai cessar os subsídios para painéis solares. Os custos de instalação permanecerão elegíveis para auxílio em princípio.", "titulo_pt": "Japão vai extinguir subsídios para painéis solares", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 124818, "titulo": "Fire kills 14 newborns at major hospital in Pakistan, officials say", "url": "http://www.euronews.com/2026/08/26/fire-kills-14-newborns-at-major-hospital-in-pakistan-officials-say", "fonte_id": "euronews", "data_pub": "2026-08-26T06:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio em um hospital majoritário no Paquistão resultou na morte de 14 bebês recém-nascidos. A baixa aplicação das regras de segurança construtiva no país é apontada como responsável pelo alto número de vítimas fatais em incêndios.", "titulo_pt": "Incêndio mata 14 recém-nascidos em hospital importante no paquistão, dizem autoridades", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 124445, "titulo": "Muro de Trump ameaça pinturas rupestres de até 5 mil anos na fronteira dos EUA", "url": "https://exame.com/mundo/muro-de-trump-ameaca-pinturas-rupestres-de-ate-5-mil-anos-na-fronteira-dos-eua/", "fonte_id": "exame", "data_pub": "2026-08-26T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O muro de Trump ameaça pinturas rupestres que podem ter entre 5.000 e 7.000 anos de idade, localizadas na fronteira dos Estados Unidos. O terreno necessário para o projeto abriga dezenas dessas pinturas, tão antigas quanto as pirâmides do Egito.", "titulo_pt": "Muro de Trump ameaça pinturas rupestres de até 5 mil anos na fronteira dos EUA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 124819, "titulo": "Next Atlantic tropical storm will be named Dolly but no connection to Parton's death", "url": "http://www.euronews.com/2026/08/26/next-atlantic-tropical-storm-will-be-named-dolly-but-no-connection-to-partons-death", "fonte_id": "euronews", "data_pub": "2026-08-26T05:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O próximo furacão no Oceano Atlântico será nomeado Dolly, conforme os procedimentos estabelecidos pela Organização Meteorológica Mundial. As listas de nomes são reutilizadas a cada seis anos.", "titulo_pt": "Próximo furacão no atlântico será nomeado Dolly, sem conexão com a morte de Parton", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 124851, "titulo": "Massive natural gas leak in Wisconsin puts community on alert", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/26/massive-natural-gas-leak-in-wisconsin-puts-community-on-alert?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-26T05:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um caminhão atingiu um pipeline de gás natural perto de Saxon, Wisconsin, levando a uma evacuação de moradores nas proximidades.", "titulo_pt": "Grande vazamento de gás natural em Wisconsin coloca comunidade em alerta", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 124788, "titulo": "'We can't water a forest': Switzerland is testing a forestry method to protect against wildfires", "url": "https://www.lemonde.fr/en/summer-reads/article/2026/08/26/we-can-t-water-a-forest-switzerland-is-testing-a-forestry-method-to-protect-against-wildfires_6756853_183.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-26T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suíça está testando uma técnica antiga que promove condições mais frescas e maior biodiversidade, em contraste com as florestas monosspecíficas e de corte total que predominam na Europa.", "titulo_pt": "Não podemos regar uma floresta: Suíça testa método antigo para proteger contra incêndios florestais", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 123374, "titulo": "Europe records at least 35,000 more deaths from heat", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/26/2003863141", "fonte_id": "taipei_times", "data_pub": "2026-08-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Europa registrou pelo menos 35.000 mortes adicionais devido ao calor. Essa informação foi divulgada pela fonte taipei_times.", "titulo_pt": "Europa registra pelo menos 35.000 mortes a mais devido ao calor", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 123790, "titulo": "Rápida elevação de temperatura ocorrerá no Brasil nos próximos dias", "url": "https://www.cnnbrasil.com.br/nacional/brasil/rapida-elevacao-de-temperatura-ocorrera-no-brasil-nos-proximos-dias/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-25T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As temperaturas estão previstas para subir rapidamente no Brasil nos próximos dias, com previsão de ultrapassar os 40 graus no interior do Sudeste, Centro-Oeste, Paraná e em partes do Norte e Nordeste.", "titulo_pt": "Elevação rápida de temperatura ocorrerá no Brasil nos próximos dias", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 123803, "titulo": "Oceanos batem recorde histórico de temperatura e Super El-Niño deve elevar níveis a ‘nunca vistos’, alerta Copernicus", "url": "https://www.cnnbrasil.com.br/ciencia/oceanos-batem-recorde-historico-de-temperatura-e-super-el-nino-deve-elevar-niveis-a-nunca-vistos-alerta-copernicus/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-25T21:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os oceanos estabeleceram um novo recorde histórico de temperatura. O Super El-Niño é considerado a principal influência no aumento da temperatura da superfície dos oceanos, e pode levar a níveis nunca vistos.", "titulo_pt": "Oceânomos batem recorde histórico de temperatura e Super El-Niño deve elevar níveis a ‘nunca vistos’, alerta Copernicus", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 123804, "titulo": "Cacau avança de forma sustentável na Amazônia, segundo Embrapa", "url": "https://www.cnnbrasil.com.br/agro/cacau-avanca-de-forma-sustentavel-na-amazonia-segundo-embrapa/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-25T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Embrapa mapeou a produção de cacau na Amazônia e constatou que a expansão do cultivo se dá principalmente em áreas já consolidadas, sem desmatamento após o ano de 2008.", "titulo_pt": "Cacau avança de forma sustentável na Amazônia, de acordo com Embrapa", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 124040, "titulo": "Diálogos Ciudadanos: ¿Qué avances enfrenta Chile para limitar el calentamiento global?", "url": "https://www.latercera.com/videos/noticia/dialogos-ciudadanos-que-avances-enfrenta-chile-para-limitar-el-calentamiento-global/", "fonte_id": "la_tercera", "data_pub": "2026-08-25T21:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro de Meio Ambiente do Chile, Marcelo Mena, conversa com Mauro Lombardi, decano da Faculdade de Comunicações e Artes da UDLA, sobre os desafios enfrentados pelo Chile para limitar o aquecimento global. Eles discutem sobre a linha tênue que separa um planeta habitável de um que foi alterado de forma irreversível pela ação humana.", "titulo_pt": "Diálogos cidadãos: quais avanços enfrenta o Chile para limitar o aquecimento global?", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 122883, "titulo": "El Niño eleva temperatura dos oceanos e supera recorde de 2024", "url": "https://www.metropoles.com/ciencia/el-nino-eleva-temperatura-dos-oceanos-e-supera-recorde-de-2024", "fonte_id": "metropoles", "data_pub": "2026-08-25T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2026, a temperatura dos oceanos atingiu um novo recorde devido ao aumento de calor causado pelo El Niño.", "titulo_pt": "El Niño supera recorde de temperatura dos oceanos em 2026", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 124811, "titulo": "Human rights in Myanmar hit 'new low,' fuelled by illegal mining and scam centres, UN warns", "url": "http://www.euronews.com/2026/08/26/human-rights-in-myanmar-hit-new-low-fuelled-by-illegal-mining-and-scam-centres-un-warns", "fonte_id": "euronews", "data_pub": "2026-08-26T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A junta que governa Myanmar tomou o poder em 2021 através de um golpe que derrubou o governo eleito de Aung San Suu Kyi, interrompendo uma década de experimento com democracia e causando instabilidade e uma crise humanitária no país. As violações dos direitos humanos no Myanmar atingiram um novo nível, de acordo com a ONU, devido a atividades ilegais de mineração e centros de estelionato.", "titulo_pt": "Direitos humanos em Myanmar atingem 'novo baixo', alerta ONU", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 125103, "titulo": "UNICEF Statement on the deaths of 14 newborns following hospital fire in Islamabad, Pakistan", "url": "https://www.unicef.org/press-releases/unicef-statement-deaths-14-newborns-following-hospital-fire-islamabad-pakistan", "fonte_id": "unicef", "data_pub": "2026-08-26T08:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A UNICEF emitiu uma declaração sobre as mortes de 14 bebês recém-nascidos após um incêndio em um hospital em Islamabad, Paquistão. A declaração foi atribuída à representante do UNICEF no Paquistão, Pernille Ironside.", "titulo_pt": "Declaração da UNICEF sobre as mortes de 14 bebês após incêndio em hospital em Islamabad, paquistão", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 124924, "titulo": "Human rights in Myanmar hitting a ‘new low,’ U.N. warns", "url": "https://www.japantimes.co.jp/news/2026/08/26/asia-pacific/human-rights-myanmar-un/", "fonte_id": "japan_times", "data_pub": "2026-08-26T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Divisão de Direitos Humanos da ONU condenou a 'abuso brutal agravado' contra a minoria rohingya e o 'impacto devastador' das economias ilícitas.", "titulo_pt": "Direitos humanos em Myanmar atingem 'novo baixo', alerta ONU", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 124489, "titulo": "Incêndio em hospital mata ao menos 14 bebês no Paquistão, diz mídia local", "url": "https://www.cnnbrasil.com.br/internacional/incendio-em-hospital-deixa-mortos-no-paquistao-diz-midia-local/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-26T04:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incêndio em um hospital no Paquistão matou pelo menos 14 bebês. O fogo foi causado por uma falha nos sistemas de ar-condicionado.", "titulo_pt": "Incêndio em hospital mata ao menos 14 bebês no Paquistão", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 124676, "titulo": "ICE Has Quietly Changed Its Deadly-Force Rule", "url": "https://www.theatlantic.com/politics/2026/08/ice-shootings-deadly-force/688407/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-08-25T22:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ICE modificou sua regra sobre o uso de força letal e agora oficiais sob investigação não podem retornar rapidamente ao trabalho nas ruas.", "titulo_pt": "ICE alterou silenciosamente sua regra sobre força letal", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 124252, "titulo": "Russia’s FSB Agents Recruited Former Pussy Riot Member to Spy on Artists", "url": "https://www.artnews.com/art-news/news/pussy-riot-member-recruited-russia-fsb-spy-artists-1234795669/", "fonte_id": "artnews", "data_pub": "2026-08-25T18:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rita Flores, cujo nome real é Margarita Konovalova, afirma que foi recrutada pela Agência Federal de Segurança (FSB) da Rússia para auxiliar na espionagem de críticos do Kremlin.", "titulo_pt": "Agentes FSB da Rússia recrutaram ex-membro do Pussy Riot para espiar artistas", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 122876, "titulo": "ONU e Cruz Vermelha pedem proibição de armas autônomas", "url": "https://www.metropoles.com/mundo/onu-e-cruz-vermelha-pedem-proibicao-de-armas-autonomas", "fonte_id": "metropoles", "data_pub": "2026-08-25T17:59:00Z", "idioma": "pt", "provavel_dup ces' gunfire in Qalandia refugee camp", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/child-injured-israeli-forces-gunfire-qalandia-refugee-camp", "fonte_id": "middle_east_eye", "data_pub": "2026-08-25T15:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um menino palestiniano ficou ferido após ser atingido por disparos de forças israelenses em Qalandia, um campo de refugiados ao norte de Jerusalém ocupada, conforme relatado pela Wafa. O governador de Jerusalém informou que o menino sofreu uma lesão no ombro devido aos tiros disparados pelos soldados ao redor do campo.", "titulo_pt": "Menino ferido por tiros de forças israelenses em Qalandia", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 123266, "titulo": "Nine years of Rohingya refugee crisis", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/25/nine-years-of-rohingya-refugee-crisis?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-25T15:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O conflito que levou à crise dos refugiados rohingya durou nove anos.", "titulo_pt": "Nove anos de crise de refugiados Rohingya", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 123240, "titulo": "One million Afghan children suffering 'life-threatening' malnutrition, UNICEF says", "url": "http://www.euronews.com/2026/08/25/one-million-afghan-children-suffering-life-threatening-malnutrition-unicef-says", "fonte_id": "euronews", "data_pub": "2026-08-25T11:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um milhão de crianças afegãs estão sofrendo de nutrição crítica, segundo a UNICEF. O Afeganistão tem enfrentado períodos de fome generalizada nas últimas décadas devido a conflitos e crises diversas.", "titulo_pt": "Um milhão de crianças afegãs sofrem 'nutrição de vida em perigo', diz UNICEF", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 122398, "titulo": "What   const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
