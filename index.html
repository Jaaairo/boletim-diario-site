<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "07/09/2026 19:41", "stats": {"noticias_novas": 459, "resumos_gerados": 235}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O ato de Flávio Bolsonaro na Avenida Paulista, realizado em 7 de setembro, reuniu aproximadamente 28,5 mil pessoas, segundo cálculos feitos com o uso de drones. Durante o evento, Flávio Bolsonaro criticou o ministro do STF Alexandre de Moraes, associando-o ao presidente Lula, seu principal adversário nas eleições. A pesquisa Quaest, divulgada em 7 de setembro, mostrou que Lula e Flávio Bolsonaro empatam numericamente em um cenário de segundo turno, com 41% das intenções de voto cada. No entanto, o levantamento também indicou que 33% dos brasileiros afirmam que a renda familiar não aumentou no último ano e 21% disseram que ela cresceu menos que o custo de vida, sugerindo preocupações econômicas entre os eleitores. Além disso, a desaprovação de Lula subiu para 50%, enquanto a aprovação caiu para 43%, de acordo com outra pesquisa Quaest, refletindo a dinâmica negativa do governo Lula (PT) na reta final da campanha presidencial.", "mundo": "O partido de extrema-direita AfD obteve uma vitória expressiva nas eleições na Saxônia-Anhalt, Alemanha, conquistando 44% dos votos. Este resultado levanta preocupações sobre a formação de um novo governo no estado, com o risco de a extrema-direita assumir o poder pela primeira vez desde a Segunda Guerra Mundial. O resultado abalou a Alemanha e a Europa, apesar de não ter sido suficiente para garantir a vitória direta. O partido conservador CDU, liderado por Friedrich Merz, afirmou que continuará a desempenhar seu papel, apesar do choque causado pela vitória do AfD. Em outro desenvolvimento, o Reino Unido está prestes a anunciar uma proibição comercial contra as colônias israelenses no Vale do Jordão, como parte de uma estratégia para isolar Israel devido às suas políticas em relação aos palestinos após o conflito em Gaza. Além disso, a Torre Eiffel foi fechada devido a uma greve dos funcionários, que protestavam contra o afastamento das mulheres da equipe durante a visita de uma delegação hindu, levando a um conflito com o governo e os trabalhadores.\n\nA Coreia do Norte adicionou uma segunda destructor naval à sua frota marítima, fortalecendo sua capacidade naval. Em contrapartida, a Rússia fechou o consulado-geral da Alemanha em São Petersburgo, como resposta a uma medida semelhante tomada pela Alemanha. As tensões geopolíticas continuam a aumentar, com o Estreito de Ormuz sob risco de interrupção devido a ataques dos Estados Unidos ao Irã, levando a um aumento nos preços do petróleo. Além disso, a Letônia planeja taxar os grãos da Rússia e da Bielorrússia em 300%, refletindo a tensão regional. O fortalecimento das relações entre a Rússia e a Coreia do Norte, com a inauguração de uma ponte rodoviária, é outro ponto importante, ocorrendo no contexto da guerra na Ucrânia.", "economia": "O petróleo atingiu seu nível mais alto em seis semanas, com o barril se aproximando novamente dos US$ 100, devido às tensões entre Irã e Estados Unidos no Oriente Médio, após relatos de ataques a instalações da Aramco, empresa de petróleo saudita. Em contraste, o dólar operava em queda com o fortalecimento do iene, em uma sessão limitada por feriado nos Estados Unidos. As exportações brasileiras de carne bovina caíram 23% em relação ao ano anterior, em 2024, com a perda de 225 mil toneladas de exportações em agosto. Além disso, a produção de vinho na França deve ser uma das menores em 30 anos, com a produção de champanhe prevista para cair pela metade devido ao calor intenso e à seca.", "tecnologia": "A Apple está prestes a lançar seu primeiro iPhone dobrável, o Ultra, em um evento agendado para o dia 9 de setembro, conforme anunciado pelo CEO Tim Cook. Além disso, o evento também trará novidades sobre AirPods e HomePods. Essa informação foi divulgada pela Folha Mercado. Em outro desenvolvimento, a Xiaomi lançou um novo telefone dobrável com chip próprio, competindo diretamente com a Apple e Huawei. Na área de inteligência artificial, a China endureceu as regras contra o uso de deepfakes e clonagem de voz sem consentimento. A OpenAI advertiu recentemente sobre as potenciais consequências da IA, destacando o lançamento do GPT-6 Astra, considerado o produto mais poderoso da empresa até o momento. Além disso, a China publicou diretrizes judiciais para julgar disputas envolvendo IA, incluindo a responsabilização por deepfakes e clonagem de voz, reforçando a importância do consentimento nesses casos.", "ciencia": "Um estudo recente, publicado na revista Molecular Ecology e liderado pelo Leibniz-IZW, mostrou que mecanismos epigenéticos são cruciais para a adaptação de leões selvagens da Namíbia, permitindo que eles desenvolvam diferentes fenótipos apesar da baixa diversidade genética. Este achado ressalta a importância do epigenoma na expressão genética dos animais. Paralelamente, um novo relatório da Organização Meteorológica Mundial destaca a forte ligação entre clima e qualidade do ar, alertando para o risco de incêndios florestais e ondas de calor comprometerem os esforços internacionais para melhorar a saúde ambiental. Estes dois estudos, um focado em biologia e outro em climatologia, ilustram a complexidade e interconexão dos desafios científicos contemporâneos, destacando a necessidade de abordagens integradas para enfrentar problemas globais.", "cultura": "O Rock in Rio 2023 teve uma forte temática nacional, com o público usando o verde e amarelo durante os shows. Um momento inusitado ocorreu quando a cantora Luísa Sonza cantou bossa nova no palco Mundo, convidando o fundador do gênero, Roberto Menescal. No âmbito cultural, o documentário sobre Elon Musk, dirigido por Alex Gibney, será lançado nos cinemas em outubro. No mundo da arte, o Chile anunciou que participará pela primeira vez do Consumer Electronics Show (CES) em 2027, com um pavilhão próprio. Além disso, a série 'The Drop: Uma Saga Snowfall' foi lançada, focando na ascensão do rap da Costa Oeste nos anos 90, enquanto a polêmica envolvendo o streamer GH, acusado de homofobia, resultou em uma investigação pela Polícia Civil do Rio de Janeiro.", "sociedade": "Em Los Angeles, Estados Unidos, milhares de pessoas vivem em carros, vans ou campeiros, refletindo as crescentes dificuldades dos americanos de baixa renda em encontrar moradia estável. No Brasil, a sociedade enfrenta diversos desafios, como a rejeição de um acordo de greve pelos bancários da Caixa Econômica Federal e do Banco do Brasil em Minas Gerais, que confirmaram uma greve por tempo indeterminado. Em Marcos Juárez, a crise no setor de saúde e a necessidade de novos candidatos dificultaram a oferta de candidatos não peronistas. No Chile, a população está envelhecendo, levantando questões sobre a preparação do país para os desafios demográficos. A Sociedade Brasileira de Dermatologia destacou falsos mitos que contribuem para o avanço das infecções de transmissão sexual. Em Minas Gerais, um coronel réu por matar a esposa relatou sua rotina na prisão, descrevendo tarefas menores e a minoria de oficiais no presídio. O Bolsa Família começa a ser pago em 17 de setembro, com liberações seguindo a ordem dos dígitos finais do NIS para os beneficiários com NIS terminando em 1.", "meio_ambiente": "O meio ambiente enfrenta diversos desafios em todo o mundo, com destaque para os impactos das mudanças climáticas. A Europa registrou safras mais cedo devido ao aquecimento global, enquanto a Itália enfrentou o verão mais quente em mais de 75 anos. A China relatou 43 mortos e centenas desaparecidos após um deslizamento de terra causado pelo colapso de uma geleira no Nepal. Em contraste, a Indonésia enfrentou uma erupção vulcânica no Anak Krakatoa, que cancelou 2.300 voos e deixou mais de 268.000 passageiros em situação de espera por reembolsos. O El Niño extremamente forte pode levar a preços mais altos dos alimentos na Austrália, enquanto a China investe em energia renovável para combater a poluição. Em Manaus, capital do Amazonas, existe o risco de secar até 2040 devido ao uso descontrolado de poços subterrâneos e mudanças climáticas. Além disso, escolas em Sarawak, Malásia, foram fechadas devido a uma névoa tóxica causada por incêndios florestais na Indonésia, e Nepal está em luto após cheias que resultaram na morte de 1.300 pessoas.", "direitos_humanos": "Um relatório do Australian Institute of Health and Welfare (AIHW) mostrou que as gerações de indígenas australianos removidos forçosamente sob políticas governamentais enfrentam maiores desafios de saúde física em comparação com a população indígena e não-indígena em geral. O diretor dos direitos humanos da ONU, Volker Turk, alertou que a inteligência artificial pode representar um risco existencial para a humanidade e prometeu pressionar as empresas de AI a reduzir riscos, como interrupções de serviços, comunicações e sistemas democráticos. O diretor das direitos humanos da ONU também exigiu responsabilização por mortes em detenção de imigrantes nos EUA e condenou o uso supostamente autônomo de armas por parte da Rússia. Em um evento mais local, Arthur Layne Lundeen, de 67 anos, foi acusado de agressão de segundo grau e conduta desordeira após amarrar um passageiro com fita adesiva em um voo dos EUA, motivado por ataques racistas e homofóbicos. Além disso, a marcha anual de Pride em Belgrado, celebrando 25 anos desde o primeiro evento em 2001, foi marcada por um chamado à tolerância, apesar de ter sido interrompida por violência no passado."}, "resumo_do_dia": {"politica_nacional": [{"id": 151507, "titulo": "Ato de Flávio Bolsonaro confirma resiliência do bolsonarismo, mas sem força disruptiva de anos atrás", "url": "https://www.jota.info/eleicoes/eleicoes-2026/ato-de-flavio-bolsonaro-confirma-resiliencia-do-bolsonarismo-mas-sem-forca-disruptiva-de-anos-atras", "fonte_id": "jota", "data_pub": "2026-09-07T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ato de Flávio Bolsonaro demonstra a resiliência do bolsonarismo, mas não apresenta a força disruptiva observada nos anos anteriores. A corrente ligada à família Bolsonaro permanece como principal opção política contra o PT, apesar dos sinais de que seu discurso antissistema pode estar esgotado.", "titulo_pt": "Ato de Flávio Bolsonaro confirma resiliência do bolsonarismo, mas sem força disruptiva de anos atrás", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 151370, "titulo": "Quaest: 33% dizem que a renda não aumentou no último ano e 21%, que subiu menos que o custo de vida", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/07/quaest-33percent-dizem-que-a-renda-nao-aumentou-no-ultimo-ano-e-21percent-que-subiu-menos-que-o-custo-de-vida.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-07T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest, divulgada em 7 de novembro, indica que 33% dos brasileiros afirmam que a renda da família não aumentou no último ano, enquanto 21% disseram que a renda cresceu menos que o custo de vida. O levantamento também mapeou como a renda se comportou em relação ao custo de vida.", "titulo_pt": "33% Dizem que a renda não aumentou no último ano e 21%, que subiu menos que o custo de vida", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 151466, "titulo": "Flávio Bolsonaro vai focar em segurança pública e aumento do custo de vida", "url": "https://www.metropoles.com/colunas/neila-guimaraes/flavio-bolsonaro-vai-focar-em-seguranca-publica-e-aumento-do-custo-de-vida", "fonte_id": "metropoles", "data_pub": "2026-09-07T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Flávio Bolsonaro se concentrará em segurança pública e no aumento do custo de vida, com especial ênfase nas altas dos preços nos supermercados após um levantamento mostrar empate entre ele e Lula no segundo turno.", "titulo_pt": "Flávio Bolsonaro se concentrará em segurança pública e aumento do custo de vida", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 151512, "titulo": "Fachin cancela reunião com dirigentes da OAB em meio à crise no STF", "url": "https://www.cnnbrasil.com.br/politica/fachin-cancela-reuniao-com-dirigentes-da-oab-em-meio-a-crise-no-stf/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-07T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reunião entre o ministro do STF (Supremo Tribunal Federal) Fachin e dirigentes da OAB (Ordem dos Advogados do Brasil) foi cancelada. O encontro estava agendado para a próxima quarta-feira (9) e não há nova data programada.", "titulo_pt": "Fachin cancela reunião com dirigentes da OAB em meio à crise no STF", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 151490, "titulo": "Quaest: desaprovação de Lula sobe a 50% e aprovação cai para 43%", "url": "https://www.infomoney.com.br/politica/quaest-desaprovacao-de-lula-sobe-a-50-e-aprovacao-cai-para-43/", "fonte_id": "infomoney", "data_pub": "2026-09-07T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A desaprovação de Lula subiu para 50% e a aprovação caiu para 43%, de acordo com uma pesquisa. Os movimentos ficam próximos da margem de erro, mas ampliam a diferença entre os que desaprovam e aprovam o governo na fase final da campanha.", "titulo_pt": "Desaprovação de Lula sobe para 50% e aprovação cai para 43%", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 151371, "titulo": "Quaest: 32% dizem que Lula e PT vencerem é o melhor resultado da eleição presidencial; para 24%, a volta da família Bolsonaro", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/07/quaest-melhor-resultado-eleitor-7-de-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-07T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest indica que 32% dos brasileiros preferem que Lula e o PT vencem a eleição presidencial de 2026, enquanto 24% apoiam a volta da família Bolsonaro ao governo.", "titulo_pt": "32% Preferem Lula e PT; 24% querem Bolsonaro de volta, mostra pesquisa", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 151436, "titulo": "7 de setembro na Paulista: Flávio tenta se descolar de Vorcaro em ato com símbolos dos EUA e manifestantes pedindo intervenção de Trump", "url": "https://www.brasildefato.com.br/2026/09/07/7-de-setembro-na-paulista-flavio-tenta-se-descolar-de-vorcaro-em-ato-com-simbolos-dos-eua-e-manifestantes-pedindo-intervencao-de-trump/", "fonte_id": "brasil_de_fato", "data_pub": "2026-09-07T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro participou de um ato no 7 de Setembro na Avenida Paulista, onde bandeiras dos Estados Unidos e de Israel estavam presentes, junto com as do Brasil. Um boneco gigante de Donald Trump também foi usado durante o evento.", "titulo_pt": "7 De setembro na Paulista: flávio tenta se destacar com símbolos dos EUA e boneco de Trump", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 151537, "titulo": "Ato de Flávio Bolsonaro na av. Paulista vira protesto contra Moraes e reúne quase 30 mil: 'Última semana me fez estar aqui'", "url": "https://www.bbc.com/portuguese/articles/c0j34vd8x3no?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-07T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um protesto contra o ministro do STF, Alexandre Moraes, reuniu aproximadamente 30 mil pessoas na Avenida Paulista. A aglomeração foi menor do que a registrada durante o feriado do ano anterior, quando cerca de 42,2 mil pessoas se reuniram na mesma localidade.", "titulo_pt": "Ato de Flávio Bolsonaro na avenida paulista vira protesto contra Moraes e reúne quase 30 mil", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 151493, "titulo": "Valdemar Costa Neto: com Flávio eleito, Bolsonaro estará com a gente no dia seguinte", "url": "https://www.infomoney.com.br/politica/valdemar-costa-neto-com-flavio-eleito-bolsonaro-estara-com-a-gente-no-dia-seguinte/", "fonte_id": "infomoney", "data_pub": "2026-09-07T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Valdemar Costa Neto declarou que, se Flávio Bolsonaro for eleito, o presidente Jair Bolsonaro estará ao lado do partido no dia seguinte. O parlamentar puxou o coro 'Volta Bolsonaro' após a declaração.", "titulo_pt": "Valdemar Costa Neto: com Flávio eleito, Bolsonaro estará com a gente no dia seguinte", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 151372, "titulo": "Quaest: 50% desaprovam e 43% aprovam governo Lula", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/07/quaest-aprovacao-lula-7-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-07T21:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest revelou que 50% dos eleitores desaprovam o governo Lula (PT), enquanto 43% o aprovam. A desaprovação aumentou dois pontos percentuais e a aprovação diminuiu dois pontos percentuais em comparação com uma pesquisa anterior, mas as variações estão dentro da margem de erro.", "titulo_pt": "50% Desaprovam e 43% aprovam governo Lula", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 151348, "titulo": "Governo e setor produtivo esperam voltar a exportar frango e mel em até dois meses", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/governo-e-setor-produtivo-esperam-voltar-a-exportar-frango-e-mel-em-ate-dois-meses.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-07T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após a auditoria da União Europeia no Brasil, o governo Lula e o setor produtivo esperam retomar as exportações de frango e mel para o bloco europeu em até dois meses. O otimismo é maior, com a possibilidade de as vendas serem reiniciadas antes do 2º turno das eleições.", "titulo_pt": "Governo e setor produtivo esperam voltar a exportar frango e mel para a Europa em até dois meses", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [{"titulo": "Lula e Flávio empatam com 41% em eventual segundo turno, segundo pesquisa", "sumario": "A pesquisa divulgada nesta segunda-feira (7/9) mostrou que Lula e Flávio têm 41% de votos em um eventual segundo turno. Uma pesquisa Quaest divulgada em 7 de julho de 2026 mostrou que o presidente Lula e o senador Flávio Bolsonaro estavam numericamente empatados em 41% em um cenário de segundo turno da eleição presidencial. Uma nova pesquisa da Quaest mostra o candidato Lula com 36% das intenções de voto no primeiro turno, enquanto Flávio registra 29%.", "artigos": [{"id": 151508, "titulo": "Quaest: Lula e Flávio empatam com 41% em eventual 2º turno", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quaest-lula-e-flavio-empatam-com-41-em-eventual-2o-turno", "fonte_id": "jota", "data_pub": "2026-09-07T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa divulgada nesta segunda-feira (7/9) mostrou que Lula e Flávio têm 41% de votos em um eventual segundo turno. A pesquisa testou Lula com outros quatro adversários e constatou uma queda no apoio a Cury.", "titulo_pt": "Lula e Flávio empatam com 41% em eventual segundo turno, segundo pesquisa", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 151347, "titulo": "Quaest: Lula e Flávio Bolsonaro empatam numericamente em cenário de 2º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/quaest-lula-e-flavio-bolsonaro-empatam-numericamente-em-cenario-de-2o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-07T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest divulgada em 7 de julho de 2026 mostrou que o presidente Lula e o senador Flávio Bolsonaro estavam numericamente empatados em 41% em um cenário de segundo turno da eleição presidencial.", "titulo_pt": "Lula e Flávio Bolsonaro empatam numericamente em cenário de 2º turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 151492, "titulo": "Quaest: Lula tem 36% e Flávio, 29% no primeiro turno, a menos de um mês do 1º turno", "url": "https://www.infomoney.com.br/politica/quaest-lula-tem-36-e-flavio-29-no-primeiro-turno-a-menos-de-um-mes-do-1o-turno/", "fonte_id": "infomoney", "data_pub": "2026-09-07T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa da Quaest mostra o candidato Lula com 36% das intenções de voto no primeiro turno, enquanto Flávio registra 29%. A menos de um mês para a eleição, os dois principais candidatos aparecem empatados com 41% em um eventual segundo turno.", "titulo_pt": "Quaest: lula tem 36% e Flávio, 29% no primeiro turno, a menos de um mês do 1º turno", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 151373, "titulo": "Quaest, 2º turno: Lula, 41%; Flávio Bolsonaro, 41%", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/07/quaest-2-turno-7-de-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-07T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest, encomendada pela Globo, divulgada em 7 de outubro, indica que Lula (PT) e Flávio Bolsonaro (PL) têm 41% das intenções de voto em um segundo turno. O cenário apresenta cinco simulações com outros candidatos, mas Lula e Flávio Bolsonaro lideram com 41% cada, 13% para brancos/nulos/não votantes e 5% de indecisos.", "titulo_pt": "Quaest, 2º turno: lula e Flávio Bolsonaro empatados com 41%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 151374, "titulo": "Quaest, 1º turno: Lula, 36%; Flávio Bolsonaro, 29%; Cury, 8%; Renan, 3%; Caiado, 3%; Zema, 2%", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/07/quaest-presidente-7-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-07T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest divulgada em 7 de setembro mostra que, no cenário do 1º turno da eleição presidencial, Lula lidera com 36% das intenções de voto, seguido por Flávio Bolsonaro com 29%. Os outros candidatos apresentam porcentagens menores, com Cury em 8%, Renan, Caiado e Zema com 3% e 2%, respectivamente.", "titulo_pt": "Pesquisa quaest: lula lidera com 36%; Flávio Bolsonaro tem 29% no 1º turno", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}]}], "mundo": [{"id": 151143, "titulo": "China security laws spell travel risks", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/08/2003863863", "fonte_id": "taipei_times", "data_pub": "2026-09-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As leis de segurança da China estabelecem riscos para viajantes. Isso inclui restrições e possíveis penalidades para atividades consideradas potencialmente prejudiciais à segurança nacional.", "titulo_pt": "Leis d
