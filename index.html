clear, fortalecer a soberania nacional e aumentar a vigilância da Amazônia Azul.", "titulo_pt": "Construção da base de submarino nuclear brasileiro começa", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 247132, "titulo": "Trump met Russian envoy after he appeared with Melania Trump and Ukrainians", "url": "https://www.aljazeera.com/news/2026/11/6/trump-met-russian-envoy-after-he-appeared-with-melania-trump-and-ukrainians?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-06T00:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump se reuniu com um enviado russo após este aparecer com Melania Trump e ucranianos. O presidente americano afirmou que um grande acordo entre Rússia e Ucrânia está 'muito próximo', mas não forneceu detalhes.", "titulo_pt": "Trump se reuniu com russo após aparecimento com Melania e ucranianos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 246080, "titulo": "China targeted 131 Taiwanese: MAC", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/06/2003867245", "fonte_id": "taipei_times", "data_pub": "2026-11-06T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China alvoou 131 taiwaneses: MAC.", "titulo_pt": "China alvoou 131 taiwaneses: MAC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 246088, "titulo": "Chinese men sentenced over illegal entry into Taiwan", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/06/2003867258", "fonte_id": "taipei_times", "data_pub": "2026-11-06T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Homens chineses foram condenados por entrar ilegalmente em Taiwan.", "titulo_pt": "Chineses condenados por entrada ilegal em Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 247077, "titulo": "Israel's former chief of staff Eisenkot in strong position to replace Netanyahu as new PM", "url": "https://www.lemonde.fr/en/international/article/2026/11/06/israel-s-former-chief-of-staff-eisenkot-in-strong-position-to-replace-netanyahu-as-new-pm_6773098_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-06T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gadi Eisenkot foi escolhido pelos líderes de seis partidos, que representam a maioria dos assentos no Knesset, como o candidato mais legítimo para formar um novo governo. O presidente Isaac Herzog deve anunciar sua decisão no domingo.", "titulo_pt": "Ex-comandante em chefe israelense Eisenkot em posição forte para substituir Netanyahu como novo PM", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 247133, "titulo": "Iran war live: Trump warns US may have to ‘destroy’ rest of Iran", "url": "https://www.aljazeera.com/news/liveblog/2026/11/6/iran-war-live-trump-warns-us-may-have-to-destroy-rest-of-iran?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-06T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, advertiu que os EUA podem ter que 'destruir' o resto da Irã. Ele disse que as pessoas 'irão saber em breve'.", "titulo_pt": "Trump ameaça destruir o resto da Irã", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 247217, "titulo": "N. Korea lambasts money-laundering watchdog over renewed 'high-risk' label", "url": "https://en.yna.co.kr/view/AEN20261106001200315", "fonte_id": "yonhap_news", "data_pub": "2026-11-05T23:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Norte denunciou o organismo internacional responsável por lavagem de dinheiro após este renovar a classificação de alto risco para o país. A informação foi divulgada em Seul em 6 de novembro.", "titulo_pt": "Coreia do norte critica órgão internacional por manter classificação de risco alto", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 246975, "titulo": "How Foreign Policy Shaped These 3 Critical Midterm Races", "url": "https://foreignpolicy.com/2026/11/05/us-midterms-israel-immigration-deportation-tariffs-democrats/", "fonte_id": "foreign_policy", "data_pub": "2026-11-05T22:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A política externa influenciou significativamente três eleições legislativas importantes. Assuntos como Irã, Israel, tarifas e imigração foram temas de grande relevância para os eleitores.", "titulo_pt": "Como a política exterior moldou estas 3 eleições legislativas críticas", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 246919, "titulo": "Flávio Bolsonaro diz a jornal americano que fugiu sozinho do Brasil", "url": "https://www.dw.com/pt-br/flávio-bolsonaro-diz-a-jornal-americano-que-fugiu-sozinho-do-brasil/a-79871184?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-05T22:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato derrotado à Presidência, afirmou ao jornal americano New York Times que fugiu sozinho do Brasil para os Estados Unidos. Segundo ele, não houve ajuda de nenhum governo na sua viagem.", "titulo_pt": "Flávio Bolsonaro diz a jornal americano que fugiu sozinho do Brasil", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 247214, "titulo": "(LEAD) Lotte Shopping swings to Q3 profit on strong overseas, department store sales", "url": "https://en.yna.co.kr/view/AEN20261106001851320", "fonte_id": "yonhap_news", "data_pub": "2026-11-06T00:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Lotte Shopping, uma filial da empresa de varejo sul-coreana, registrou lucro no terceiro trimestre graças às vendas robustas no exterior e nas lojas de departamento.", "titulo_pt": "Lotte Shopping registra lucro no terceiro trimestre com vendas sólidas no exterior e em lojas de departamento", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 246597, "titulo": "'Não falei com Lula nem tenho nada marcado. Isso foi plantado para queimar alguém que defendeu a proposta', diz economista André Lara Resende", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/nao-falei-com-lula-nem-tenho-nada-marcado-isso-foi-plantado-para-queimar-alguem-que-defendeu-a-proposta-diz-economista-andre-lara-resende.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T00:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "André Lara Resende, economista, afirma que não conversou com Lula e que não tem nenhum encontro marcado, afirmando que suas declarações foram usadas para prejudicar alguém que defendeu a proposta de criação de um novo órgão de gestão das políticas monetária e fiscal.", "titulo_pt": "Economista André Lara Resende nega ter falado com Lula e afirma que declarações foram usadas para prejudicar alguém", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 246598, "titulo": "Risco de crise feia nos EUA é mais um motivo para o Brasil apressar conserto da economia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/viniciustorres/2026/11/risco-de-crise-feia-nos-eua-e-mais-um-motivo-para-o-brasil-apressar-conserto-da-economia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T00:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A situação econômica do Brasil em 2027 será desafiadora, especialmente em caso de crise nos EUA. É necessário adotar medidas urgentes e prudentes para consertar a economia.", "titulo_pt": "Risco de crise nos EUA em 2027 é mais um motivo para o Brasil apressar conserto econômico", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 247216, "titulo": "(URGENT) KRX issues circuit breaker for KOSPI on sharp fall", "url": "https://en.yna.co.kr/view/AEN20261106002000320", "fonte_id": "yonhap_news", "data_pub": "2026-11-06T00:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A KRX (Korea Exchange) implementou um circuit breaker para o índice KOSPI devido a uma queda abrupta nos mercados.", "titulo_pt": "(Urgente) KRX implementa circuit breaker para KOSPI devido a queda abrupta", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 246599, "titulo": "Desembargadora libera três bets e chama veto de Lula a apostas de 'verdadeiro confisco'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/desembargadora-libera-tres-bets-e-chama-veto-de-lula-a-apostas-de-verdadeiro-confisco.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-06T00:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TRF3 permitiu que três sites de apostas da empresa CDA Gaming operassem novamente, em uma decisão liminar. A decisão não afeta outras companhias do setor.", "titulo_pt": "Desembargadora libera três sites de apostas após veto de Lula", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 246601, "titulo": "Lucro da Sabesp cai 36% no 3º tri, com pressão de juros sobre dívida", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/lucro-da-sabesp-cai-36-no-3o-tri-com-pressao-de-juros-sobre-divida.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-05T23:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Sabesp registrou lucro líquido de R$ 1,39 bilhão no terceiro trimestre, uma redução de 35,7% em comparação com o mesmo período do ano anterior, devido à pressão dos juros sobre a dívida utilizada para financiar investimentos.", "titulo_pt": "Lucro da Sabesp cai 36% no 3º tri, com pressão de juros sobre dívida", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 247100, "titulo": "Wall Street sheds $3.2tn as Democratic midterm sweep triggers brutal AI rout", "url": "https://www.ft.com/content/3d079b3d-580d-400b-bf9c-56af6a08f60f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-05T22:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O índice tecnológico Nasdaq 100 caiu 6,4% em um dia de negociações caóticas. O mercado de ações de Wall Street perdeu US$ 3,2 trilhões de valor após a vitória dos democratas nas eleições médias nos Estados Unidos, levando a uma forte queda no uso de inteligência artificial.", "titulo_pt": "Wall Street perde us$ 3,2 trilhões com vitória democrata nas eleições médias e queda brutal no uso de inteligência artificial", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 246605, "titulo": "Dívida externa de países em desenvolvimento atinge recorde de US$ 9,4 tri em 2025, diz Banco Mundial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/divida-externa-de-paises-em-desenvolvimento-atinge-recorde-de-us-94-tri-em-2025-diz-banco-mundial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-05T22:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A dívida externa de países de baixa e média renda atingiu um recorde de US$ 9,4 trilhões em 2025, aumentando 5,5% em comparação com o ano anterior, conforme informou o Banco Mundial. Os países dessas categorias estão contraindo mais empréstimos e pagando mais pelos novos empréstimos.", "titulo_pt": "Dívida externa de países em desenvolvimento atinge recorde de US$ 9,4 tri em 2025, diz Banco Mundial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 246607, "titulo": "Às vésperas de nova regra para VR e VA, Alelo toma revés contra a União", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/as-vesperas-de-nova-regra-para-vr-e-va-alelo-toma-reves-contra-a-uniao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-05T22:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 2ª Vara Federal de Barueri julgou improcedentes os pedidos da Alelo em relação às novas regras para vouchers de benefícios de alimentação e condenou a companhia a pagar custas e honorários de 10% sobre R$ 5 milhões à União. A empresa ainda pode recorrer.", "titulo_pt": "À vésperas de nova regra para VR e VA, Alelo sofre revés judicial contra a União", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 246608, "titulo": "Vibra prevê margens acima de níveis pré-guerra nos próximos anos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/vibra-preve-margens-acima-de-niveis-pre-guerra-nos-proximos-anos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-05T22:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Vibra Energia espera manter margens superiores aos níveis pré-guerra nos próximos anos, independentemente do cenário econômico. O presidente da empresa, Ernesto Pousada, atribui esses ganhos a melhorias estruturais, como a redução de fraudes no setor e o fortalecimento da posição comercial.", "titulo_pt": "Vibra prevê margens acima dos níveis pré-guerra nos próximos anos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 246611, "titulo": "Governo Lula quer levar etapa de mistura de biocombustíveis para refinarias", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/governo-lula-quer-levar-etapa-de-mistura-de-biocombustiveis-para-refinarias.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-05T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula pretende que a mistura de biocombustíveis com derivados de petróleo seja realizada na etapa de refino, em vez da etapa de distribuição. O Palácio do Planalto está promovendo essa mudança.", "titulo_pt": "Governo Lula quer mistura de biocombustíveis em refinarias", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 246613, "titulo": "Dino marca conciliação entre empresas, trabalhadores e governo sobre transição para o fim da 6x1", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/dino-marca-conciliacao-entre-empresas-trabalhadores-e-governo-sobre-transicao-para-o-fim-da-6x1.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-05T20:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino, do STF, agendou uma audiência de conciliação com representantes de empresas, trabalhadores e o governo para discutir a transição para o fim da escala 6x1. A reunião ocorreu nesta quinta-feira (5) de maio de 2026.", "titulo_pt": "Dino agendou conciliação sobre transição para fim da escala 6x1", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 246616, "titulo": "Número de pedidos de auxílio-desemprego nos EUA atinge menor nível em 57 anos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/25/6568-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post468036", "fonte_id": "folha_mercado", "data_pub": "2026-11-05T19:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de americanos que solicitaram auxílio-desemprego atingiu o nível mais baixo em 57 anos na semana passada, refletindo baixas taxas de demissão em um mercado de trabalho resiliente.", "titulo_pt": "Número de pedidos de auxílio-desemprego nos EUA atinge menor nível em 57 anos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 246618, "titulo": "iFood vai à Justiça contra Keeta por preço predatório e prática anticompetitiva", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/ifood-vai-a-justica-contra-keeta-por-preco-predatorio-e-pratica-anticompetitiva.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-05T19:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O iFood ingressou com uma ação judicial contra a Keeta, da chinesa Meituan, acusando-a de praticar preços predatórios e outras práticas anticompetitivas. A Keeta teria utilizado recursos da matriz chinesa para atrair clientes e sufocar a concorrência.", "titulo_pt": "Ifood processa Keeta por preços predatórios e práticas anticompetitivas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 246621, "titulo": "Ação do Mercado Livre desaba 13% em NY após lucro abaixo do esperado no 3º tri", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/25/6568-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post468035", "fonte_id": "folha_mercado", "data_pub": "2026-11-05T19:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações do Mercado Livre caíram 13% em Nova York na quinta-feira após o relatório de lucro do terceiro trimestre ser inferior às expectativas do mercado. A companhia também registrou uma contração nas margens.", "titulo_pt": "Ação do Mercado Livre cai 13% em NY após lucro abaixo do esperado no 3º tri", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 246855, "titulo": "DF se diz vítima do caso Master e pede transferência de R$ 2,2 bi bloqueados", "url": "https://www.jota.info/stf/do-supremo/df-se-diz-vitima-do-caso-master-e-pede-transferencia-de-r-22-bi-bloqueados", "fonte_id": "jota", "data_pub": "2026-11-05T19:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Distrito Federal (DF) afirmou ser a vítima do caso Master e solicitou a transferência de R$ 2,2 bilhões que estão bloqueados. O DF argumenta que é o acionista controlador do BRB e sofre os efeitos do dano causado à instituição estatal.", "titulo_pt": "DF se declara vítima do caso Master e pede transferência de R$ 2,2 bi bloqueados", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 247183, "titulo": "Seoul stocks open sharply lower on AI fears after US midterms", "url": "https://www.koreaherald.com/article/10928097", "fonte_id": "korea_herald", "data_pub": "2026-11-06T00:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As bolsas de Seul abriram com forte queda na sexta-feira, seguindo a retração noturna na Wall Street devido às preocupações de que uma vitória democrata na Câmara dos EUA possa retardar o desenvolvimento de centros de dados. A bolsa de valores suspendeu as operações por 20 minutos após o toque de sineta de abertura devido à forte venda.", "titulo_pt": "Bolsas de seul abrem em forte queda devido a preocupações com vitória democrata nos EUA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 247212, "titulo": "Doosan to expand CCL production capacity in China amid growing AI demand", "url": "https://en.yna.co.kr/view/AEN20261106003000320", "fonte_id": "yonhap_news", "data_pub": "2026-11-06T00:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Doosan Group anunciou que investirá aproximadamente 550 bilhões de wones para expandir a capacidade de produção de CCL (Copper Clad Laminate) na China, devido ao aumento da demanda por inteligência artificial.", "titulo_pt": "Doosan ampliará produção de CCL na China diante da crescente demanda por IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 247265, "titulo": "OpenAI is stepping back from NDAs for data center projects", "url": "https://www.theverge.com/ai-artificial-intelligence/1028454/openai-data-center-nda", "fonte_id": "the_verge", "data_pub": "2026-11-06T00:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI anunciou que não usará acordos de confidencialidade (NDAs) com autoridades públicas em projetos de centrais de dados, em resposta à oposição expressa pelos eleitores nos últimos midterms. A empresa fez novas promessas para comunidades afetadas por esses projetos.", "titulo_pt": "Openai recua do uso de NDAs em projetos de centrais de dados", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 247188, "titulo": "Samsung, SK hynix slide 10% as AI data center fears spread", "url": "https://www.koreaherald.com/article/10927984", "fonte_id": "korea_herald", "data_pub": "2026-11-06T00:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações das principais empresas de semicondutores sul-coreanas, como a Samsung e a SK hynix, caíram cerca de 10% durante a sessão de negociação de sexta-feira, fazendo com que o índice Kospi caísse abaixo dos 5.000 pontos. Isso ocorreu após uma forte venda em ações de tecnologia nos Estados Unidos após as eleições legislativas americanas.", "titulo_pt": "Samsung e SK hynix caem 10% com medo de dados centrais de IA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 246790, "titulo": "CEO da Totvs: Ampliamos investimentos para IA", "url": "https://www.cnnbrasil.com.br/economia/ceo-da-totvs-ampliamos-investimentos-para-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T00:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Totvs registrou um aumento de 8,8% no lucro líquido ajustado no 3º trimestre de 2026, além de uma aceleração na receita de nuvem.", "titulo_pt": "CEO da Totvs: ampliamos investimentos em IA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 246099, "titulo": "Global AI server shipments expected to jump 36%", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/06/2003867228", "fonte_id": "taipei_times", "data_pub": "2026-11-06T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As entregas de servidores de IA globais estão previstas para aumentar em 36%.", "titulo_pt": "Entregas de servidores de IA globais devem crescer 36%", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 247245, "titulo": "How Singapore confronts AI fears of ‘broken’ career ladder, no pause button", "url": "https://www.scmp.com/week-asia/economics/article/3373439/how-singapore-confronts-ai-fears-broken-career-ladder-no-pause-button", "fonte_id": "scmp", "data_pub": "2026-11-05T23:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Singapore está buscando transformar suas limitações de território e mão-de-obra em razões para adotar a inteligência artificial, em vez de temê-la, mesmo com o risco de perdas de empregos e ameaças cibernéticas. A ministra de Desenvolvimento Digital e Informação, Josephine Teo, argumenta que uma abordagem pragmática dará a seu país escasso em recursos uma vantagem sem se tornar excessivamente dependente de qualquer potência ou provedor de IA.", "titulo_pt": "Como singapura enfrenta medos de carreira quebrada e ausência de pausa com a AI", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 247268, "titulo": "T-Mobile owner on Elon Musk launching a wireless carrier: ‘Welcome to the party’", "url": "https://www.theverge.com/tech/1028346/t-mobile-deutsche-telecom-spacex-starlink-mobile", "fonte_id": "the_verge", "data_pub": "2026-11-05T23:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Deutsche Telekom, Tim Höttges, expressou dúvidas sobre as intenções de SpaceX de se tornar um importante provedor de serviços móveis nos Estados Unidos. Ele considera a empresa de Elon Musk séria, mas afirma que o projeto custará pelo menos 200 bilhões de dólares.", "titulo_pt": "Ceo da t-mobile sobre spacex: 'bem-vindo ao clube'", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 247260, "titulo": "How Elon Musk and Big Tech Poured Millions Into the Midterms, and Lost", "url": "https://www.wired.com/story/uncanny-valley-podcast-how-elon-musk-and-big-tech-poured-millions-into-the-midterms-and-lost/", "fonte_id": "wired", "data_pub": "2026-11-05T22:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa 'Uncanny Valley' abordou a onda azul histórica que dominou as eleições médias e repreendeu o governo Trump, as grandes tecnológicas e os centros de dados.", "titulo_pt": "Como Elon Musk e as grandes tecnologias injetaram milhões nas eleições e falharam", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 247261, "titulo": "Ads in Chatbots Have Arrived. Here’s What’s Working—and What’s Not", "url": "https://www.wired.com/story/ads-in-chatbots-have-arrived-heres-whats-working-and-whats-not/", "fonte_id": "wired", "data_pub": "2026-11-05T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic mantém sua promessa de manter anúncios fora do Claude, enquanto a indústria de chatbots baseados em IA está correndo para agradar os anunciantes sem desagradar os usuários.", "titulo_pt": "Anúncios em Chatbots chegaram. Eis o que funciona e o que não funciona", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 246978, "titulo": "The Post-Midterms AI Reckoning", "url": "https://foreignpolicy.com/2026/11/05/midterm-results-ai-data-centers-texas-georgia-ohio/", "fonte_id": "foreign_policy", "data_pub": "2026-11-05T21:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tech billionaires investiram consideravelmente, e as centrais de dados se tornaram um ponto de conflito.", "titulo_pt": "A reconsideração do AI após as eleições", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 247252, "titulo": "AI storm dooms tech stocks to US$2 trillion decline on darkest day since 2025", "url": "https://www.scmp.com/news/world/united-states-canada/article/3373465/ai-storm-dooms-tech-stocks-us2-trillion-decline-darkest-day-2025", "fonte_id": "scmp", "data_pub": "2026-11-05T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações das grandes empresas de tecnologia caíram significativamente na quinta-feira, registrando a maior queda desde o colapso 'Dia da Libertação' do ano anterior. O índice Nasdaq 100 perdeu valor superior a US$ 2 trilhões, refletindo o medo dos investidores de que a vitória eleitoral dominante do Partido Democrata possa frear o expansionismo da infraestrutura de inteligência artificial e levar a uma reavaliação caótica de empresas menores, cuja capacidade de arrecadar fundos já foi limitada por juros mais altos e restrições mais rígidas.", "titulo_pt": "Tempestade de IA causa queda de US$ 2 trilhões nas ações de tecnologia no dia mais difícil desde 2025", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 246849, "titulo": "Grandes empresas de IA deveriam ser fechadas, defende autor de livro sobre ameaça apocalíptica das máquinas", "url": "https://www.bbc.com/portuguese/articles/cred7d1z1x24o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-05T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O pesquisador Nate Soares, autor do livro 'Se Alguém Criar, Todos Morrem', defende que grandes empresas de inteligência artificial, como a OpenAI, deveriam ser fechadas.", "titulo_pt": "Autor de livro sobre ameaça apocalíptica das máquinas defende fechamento de grandes empresas de IA", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 247102, "titulo": "Will Democrats stall the AI boom?", "url": "https://www.ft.com/content/5dedb9bf-bd12-4956-b2b7-ce968e1e1371?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-05T20:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos legisladores eleitos prometeram limitar a construção de centros de dados, causando preocupação no setor que tem impulsionado os mercados de ações dos Estados Unidos.", "titulo_pt": "Vão os democratas frear o boom da IA?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 247089, "titulo": "Top Democrats call to rein in AI buildout after midterms sweep: 'National data center moratorium now'", "url": "https://www.cnbc.com/2026/11/05/democrats-data-center-restrictions-midterms.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-05T20:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Democratas eleitos e legisladores progressistas estão pedindo por restrições mais rígidas ao desenvolvimento de inteligência artificial e centros de dados após as eleições de meios de 2026.", "titulo_pt": "Top democratas sugerem moratória em expansão de AI e centros de dados após vitória nas eleições de meios", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 247263, "titulo": "The Blue Tsunami Swept Doctors and Scientists Into Office", "url": "https://www.wired.com/story/the-blue-tsunami-swept-doctors-and-scientists-into-office/", "fonte_id": "wired", "data_pub": "2026-11-05T19:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 80% dos candidatos congressuais apoiados pela PAC pro-ciência 314 Action foram eleitos, incluindo o epidemiologista eleito senador do Michigan, Abdul El-Sayed.", "titulo_pt": "A Tsunami azul empurrou médicos e cientistas para as cortes", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 247283, "titulo": "Astronomers deliver the sharpest and deepest view yet of the low-frequency radio sky", "url": "https://phys.org/news/2026-11-astronomers-sharpest-deepest-view-frequency.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T00:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time internacional de astrônomos, liderado pela Universidade Leiden, usou o Array de Frequências Baixas (LOFAR) para produzir a imagem de rádio mais nítida e sensível já feita em baixas frequências. A imagem, que revela cerca de 63.000 fontes de rádio, incluindo núcleos galácticos ativos e galáxias em formação de estrelas, cobre uma área do céu equivalente a cerca de 25 vezes a área da Lua inteira.", "titulo_pt": "Astrônomos entregam a imagem de rádio mais nítida e sensível do céu no infravermelho", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 247284, "titulo": "Children may be missing out on free school meals as families favor private education, study finds", "url": "https://phys.org/news/2026-11-children-free-school-meals-families.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T00:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa mostrou que crianças de algumas das famílias mais pobres da Índia podem estar perdendo a oportunidade de receber refeições gratuitas nas escolas, pois os pais priorizam a educação privada para o futuro de seus filhos.", "titulo_pt": "Crianças de famílias pobres podem estar perdendo refeições gratuitas nas escolas em favor da educação privada, estudo revela", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 247285, "titulo": "Twisted atomic layers slide spontaneously at room temperature in simulations", "url": "https://phys.org/news/2026-11-atomic-layers-spontaneously-room-temperature.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T00:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores descobriram um mecanismo de deslizamento coletivo ultrabarreiro mediado por paredes de domínio, bem como a fixação de movimentos devido a defeitos. Eles observaram que camadas de MoS₂ dobradas em 2 graus podem deslizar espontaneamente em larga escala entre camadas ao nível do ambiente, enquanto uma concentração de vácuos de sulfeto de apenas cerca de 0,1% pode transformar o movimento em oscilações localizadas.", "titulo_pt": "Camadas atômicas torcidas deslizam espontaneamente a temperatura ambiente em simulações", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 247286, "titulo": "Climate shapes microbial nitrogen pump in forests, not in farmlands", "url": "https://phys.org/news/2026-11-climate-microbial-nitrogen-forests-farmlands.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T00:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os microrganismos criam um reervo de nitrogênio duradouro no solo a partir dos restos de bactérias e fungos mortos, que se agarram a minerais e resistem ao decomposador. A eficiência do uso de nitrogênio pelos microrganismos (NUE) tem sido considerada responsável pelo processo de transformação do nitrogênio absorvido pelos microrganismos vivos em esse reservatório persistente.", "titulo_pt": "O clima molda a bomba de nitrogênio microbiana nas florestas, mas não nas áreas de cultivo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 247287, "titulo": "Societies could lose ability to respond to climate change", "url": "https://phys.org/news/2026-11-societies-ability-climate.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T00:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas alertam que as sociedades poderiam perder a capacidade de responder a uma agravamento do aquecimento global.", "titulo_pt": "Cientistas alertam que sociedades podem perder capacidade de responder a agravamento do clima", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 246907, "titulo": "Qué estudio deberían realizarse las personas que fuman o fumaron y para qué sirve", "url": "https://www.lanacion.com.ar/sociedad/que-estudio-deberian-realizarse-las-personas-que-fuman-o-fumaron-y-para-que-sirve-nid05112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-06T00:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Jorge Tartaglione comparou o tabagismo com a adicção à cocaína e relatou que seu pai morreu de câncer de pulmão devido ao hábito de fumar.", "titulo_pt": "Quais exames devem ser realizados pelas pessoas que fumam ou já fumaram e para que servem", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 247288, "titulo": "Laser-plasma accelerator could generate bright X-rays for biological imaging, simulations show", "url": "https://phys.org/news/2026-11-laser-plasma-generate-bright-rays.html", "fonte_id": "phys_org", "data_pub": "2026-11-06T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aceleradores plasmáticos com laser podem gerar raios-X brilhantes, especialmente nas ondas-métricas do chamado 'água janela', entre 2,3 e 4,4 nanômetros, o que é ideal para examinar amostras biológicas em seu ambiente natural aquoso. No entanto, até agora, era difícil obter este tipo de radiação com a qualidade e intensidade adequadas, pois apenas lasers de elétrons livres em sistemas de aceleradores de grande escala são capazes de produzi-lo.", "titulo_pt": "Acelerador plasmático com laser poderia gerar raios-x brilhantes para imagens biológicas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 247289, "titulo": "Land plants' closest algal relatives evolved multicellular growth repeatedly, genetic analysis suggests", "url": "https://phys.org/news/2026-11-closest-algal-evolved-multicellular-growth.html", "fonte_id": "phys_org", "data_pub": "2026-11-05T23:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo liderado pela Universidade de Göttingen, em colaboração com a Universidade de Maastricht, a Universidade de Innsbruck e o Museu Nacional de Ciências Naturais, examinou a Zygnematophyceae, um grupo de algas considerado o parente mais próximo das plantas terrestres. Embora simples em aparência, essas algas são cruciais para entender a evolução das primeiras plantas terrestres.", "titulo_pt": "Parentes mais próximos das plantas terrestres evoluíram multicelulares repetidamente, sugere análise genética", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 247290, "titulo": "Paired DNA strands recognize shape, not just sequence, in new small-molecule sensing method", "url": "https://phys.org/news/2026-11-paired-dna-strands-sequence-small.html", "fonte_id": "phys_org", "data_pub": "2026-11-05T23:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo método de detecção de pequenas moléculas reconhece não apenas a sequência, mas também a forma das estruturas de DNA. O método utiliza uma técnica similar ao teste de COVID em formato de sanduíche, onde uma amostra reage com anticorpos associados a partículas de ouro, formando uma 'sanduíche' molecular com a presença de proteínas virais.", "titulo_pt": "Pares de fitas de DNA reconhecem forma, não apenas sequência, em novo método de detecção de pequenas moléculas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 247291, "titulo": "Underwater cameras can estimate fish weight in real time without generating full depth maps", "url": "https://phys.org/news/2026-11-underwater-cameras-fish-weight-real.html", "fonte_id": "phys_org", "data_pub": "2026-11-05T23:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Câmeras submarinas podem estimar o peso de peixes em tempo real sem gerar mapas de profundidade completos, o que pode auxiliar na gestão de alimentação, monitoramento do crescimento e planejamento da colheita na aquicultura. No entanto, métodos convencionais de imagens submarinas frequentemente exigem poder computacional significativo e podem ter dificuldades com reflexões, bolhas e água turva.", "titulo_pt": "Câmeras submarinas estimam peso de peixes em tempo real sem mapas de profundidade", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 247292, "titulo": "New placenta-on-a-chip model allows engineers to study effects of environmental toxins", "url": "https://phys.org/news/2026-11-placenta-chip-effects-environmental-toxins.html", "fonte_id": "phys_org", "data_pub": "2026-11-05T23:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo modelo de placenta-on-a-chip permite que engenheiros estudem os efeitos de toxinas ambientais, incluindo metais tóxicos como o cadmio, em grávidas. Essas exposições têm sido associadas a resultados negativos da gravidez, como abortos, nascimento prematuro e baixo peso ao nascer, mas estudos diretos em mulheres grávidas são difíceis e éticamente desafiadores.", "titulo_pt": "Novo modelo de placenta-on-a-chip permite estudar efeitos de toxinas ambientais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 247308, "titulo": "CesiumAstro Secures $730 Million in Janus Henderson-Led Series D at a Valuation Above $4.5 Billion; Unveils Synchronicity Satellite Constellation Following Fully Successful Element-1 Mission", "url": "https://spacenews.com/cesiumastro-secures-730-million-in-janus-henderson-led-series-d-at-a-valuation-above-4-5-billion-unveils-synchronicity-satellite-constellation-following-fully-successful-element-1-mission/", "fonte_id": "spacenews", "data_pub": "2026-11-05T21:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "CesiumAstro, uma empresa global líder em sistemas e satélites de comunicações espaciais e defesa, concluiu uma rodada de financiamento de série D no valor de US$ 730 milhões, avaliando a empresa em mais de US$ 4,5 bilhões. A empresa também apresentou uma constelação de satélites chamada Synchronicity após a missão Element-1 ser bem-sucedida.", "titulo_pt": "Cesiumastro conclui rodada de financiamento de série D de us$ 730 milhões com avaliação superior a us$ 4,5 bilhões; anuncia constelação de satélites Synchronicity", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 247275, "titulo": "STAT+: Pharma’s trade group spent heavily on search ads to sway public opinion", "url": "https://www.statnews.com/pharmalot/2026/11/05/phrma-blamed-pbms-high-drug-prices-search-ads/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-05T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PhRMA gastou aproximadamente US$ 59 milhões em anúncios de busca ao longo de sete anos recentes com o objetivo de influenciar como os americanos percebem os custos dos medicamentos prescritos.", "titulo_pt": "A phrma gastou pesadamente em anúncios de busca para influenciar a opinião pública sobre os custos dos medicamentos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 247281, "titulo": "How octopuses squeeze through tiny openings, step by step", "url": "https://www.sciencenews.org/article/octopuses-squeeze-escape-steps-video", "fonte_id": "science_news", "data_pub": "2026-11-05T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na pesquisa, octopuses demonstraram movimentos específicos para passar seus braços e corpos bulbosos por aberturas minúsculas. Essa descoberta pode inspirar novos designs para robôs blandos.", "titulo_pt": "Como octopuses se encaixam em aberturas pequenas, passo a passo", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 247276, "titulo": "Ballot measures affirm divisions over abortion and transgender issues", "url": "https://www.statnews.com/2026/11/05/state-health-ballot-measures-abortion-marijuana-transgender-issues/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-05T20:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nos votos do plebiscito nas eleições médias de 2026, os eleitores decidiram sobre medidas relacionadas a direitos de aborto, leis sobre maconha, empréstimos científicos e cuidados com jovens transexuais.", "titulo_pt": "Medidas eleitorais reafirmam divisões em torno de questões de aborto e transexuais", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 247277, "titulo": "Child dies of measles in Wisconsin’s first such death since 1990", "url": "https://www.statnews.com/2026/11/05/child-dies-measle ta reúne quarteto na Casa de Francisca para show de jazz", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://guia.folha.uol.com.br/shows/2026/11/toninho-horta-reune-quarteto-na-casa-de-francisca-para-show-de-jazz.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-05T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Toninho Horta se apresentará na Casa de Francisca acompanhado por Danilo Penteado, Rafael Martini e Lucas Casacio. O show acontecerá às 21h30 desta quinta-feira (5) e os ingressos já estão disponíveis para venda no Sympla.", "titulo_pt": "Toninho Horta reúne quarteto na Casa de Francisca para show de jazz", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 246983, "titulo": "The Ballad of Bob Dylan and the Pope", "url": "https://www.theatlantic.com/culture/2026/11/bob-dylan-pope-leo/689314/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-05T21:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem de sua encontros no Vaticano é estranha e engraçada, mas esses dois fazem sentido juntos.", "titulo_pt": "A canção de Bob Dylan e o papa", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 246638, "titulo": "Democratização das mídias com cem anos de atraso", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/djamila-ribeiro/2026/11/democratizacao-das-midias-com-cem-anos-de-atraso.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-05T20:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cem anos se passaram desde a demonstração pública do sistema de transmissão de imagens em movimento por John Logie Baird, considerado um marco na história da televisão. A pergunta sobre quem conquistou o poder de mostrar o mundo aos outros persiste e se aprofundou com a invenção da televisão.", "titulo_pt": "Democratização das mídias com cem anos de atraso", sil", "classe": "A"}, {"id": 247254, "titulo": "Mass protests sweep France again, as workers strike and march for ‘dignified wage’", "url": "https://www.scmp.com/news/world/europe/article/3373463/mass-protests-sweep-france-again-workers-strike-and-march-dignified-wage", "fonte_id": "scmp", "data_pub": "2026-11-05T20:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de trabalhadores em greve protestaram em todo o país contra a elevação dos custos de vida, em França. Os protestos ocorreram simultaneamente com manifestações de jovens e coincidem com o esforço do segundo maior economia da zona do euro para reorganizar suas finanças, seis meses antes das eleições presidenciais, com o partido de extrema-direita liderando nas pesquisas de opinião.", "titulo_pt": "Protestos generalizados tomam França, com greves e marchas por um salário digno", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 246857, "titulo": "Consulta pública abre discussão sobre tratamento de doença pulmonar rara no SUS", "url": "https://www.jota.info/coberturas-especiais/consulta-publica-abre-discussao-sobre-tratamento-de-doenca-pulmonar-rara-no-sus", "fonte_id": "jota", "data_pub": "2026-11-05T19:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Conitec está avaliando um novo tratamento para pacientes inoperáveis com Hipertensão Pulmonar Tromboembólica Crônica (HPTEC). Uma consulta pública foi aberta para discutir o tratamento no SUS.", "titulo_pt": "Consulta pública debate novo tratamento para doença pulmonar rara no SUS", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 246727, "titulo": "Empresária cresce 150% em setor industrial dominado por homens", "url": "https://exame.com/negocios/empresaria-cresce-150-em-setor-industrial-dominado-por-homens/", "fonte_id": "exame", "data_pub": "2026-11-05T19:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Karen Carvalho, à frente da Eletromecânica ABC, expandiu sua empresa em 150% no setor industrial dominado por homens ao combinar habilidades financeiras com conhecimento técnico.", "titulo_pt": "Empresária cresce 150% em setor industrial dominado por homens", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 246860, "titulo": "Falta de efetividade de lei impacta pacientes com doenças inflamatórias intestinais", "url": "https://www.jota.info/casa-jota/falta-de-efetividade-de-lei-impacta-pacientes-com-doencas-inflamatorias-intestinais", "fonte_id": "jota", "data_pub": "2026-11-05T18:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um evento Casa JOTA abordou o diagnóstico precoce e a linha de cuidado para pacientes com doenças inflamatórias intestinais (DII) no ano anterior à implementação da Lei 15.138/2025. A lei, que completará um ano no futuro, tem mostrado falta de efetividade.", "titulo_pt": "Falta de efetividade da lei impacta pacientes com doenças inflamatórias intestinais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 245274, "titulo": "BA: Quatro homens são presos por morte de adolescente em caminhada política", "url": "https://www.cnnbrasil.com.br/nacional/nordeste/ba/ba-quatro-homens-sao-presos-por-morte-de-adolescente-em-caminhada-politica/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-05T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quatro homens foram presos suspeitos da morte de um adolescente de 16 anos, que foi atingido a facadas em outubro. A polícia investiga se o crime está relacionado a uma rivalidade entre grupos criminosos.", "titulo_pt": "Quatro homens são presos por morte de adolescente em caminhada política", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 245501, "titulo": "Ante discusión del presupuesto para Educación: alcaldes Iglesias y White llaman a mantener programa Yo Elijo mi PC", "url": "https://www.latercera.com/nacional/noticia/ante-discusion-del-presupuesto-para-educacion-alcaldes-iglesias-y-white-llaman-a-mantener-programa-yo-elijo-mi-pc/", "fonte_id": "la_tercera", "data_pub": "2026-11-05T17:47:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os prefeitos de Independência e San Bernardo, Iglesias e White, chamaram a atenção para a importância das oportunidades educacionais para crianças e jovens. Eles pediram que o programa 'Yo Elijo mi PC' seja mantido durante as discussões sobre o orçamento da educação.", "titulo_pt": "Prefeitos de independência e san bernardo defendem manutenção do programa 'Yo Elijo mi PC'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 246736, "titulo": "Franceses voltam às ruas contra alta do custo de vida e pressionam governo Macron", "url": "https://exame.com/mundo/franceses-voltam-as-ruas-contra-alta-do-custo-de-vida-e-pressionam-governo-macron/", "fonte_id": "exame", "data_pub": "2026-11-05T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sindicatos franceses afirmam que o país está à beira da recessão e expressam temores sobre o aumento de demissões. Manifestantes estão nas ruas em protesto contra a alta do custo de vida e pressionam o governo de Macron.", "titulo_pt": "Franceses nas ruas contra alta do custo de vida e pressão sobre governo Macron", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 245619, "titulo": "Protesters join street demonstrations across France on day of strike action", "url": "https://www.theguardian.com/world/2026/nov/05/protesters-france-march-strikes-education-cost-of-living", "fonte_id": "guardian_world", "data_pub": "2026-11-05T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas participaram de manifestações pacíficas em várias cidades francesas durante um dia de greve generalizada, em protesto contra a elevação dos custos de vida e cortes em serviços públicos. A presença policial foi alta, com cerca de 70 mil policiais deslocados para manter a ordem.", "titulo_pt": "Manifestantes se juntam a protestos nas ruas em todo o França em dia de greve", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 245268, "titulo": "“É desumano”: mãe reage a novo arquivamento sobre morte de jovem em quartel", "url": "https://www.metropoles.com/colunas/alfredo-henrique/e-desumano-mae-reage-a-novo-arquivamento-sobre-morte-de-jovem-em-quartel", "fonte_id": "metropoles", "data_pub": "2026-11-05T17:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A mãe de um soldado falecido em um quartel acusa uma tentativa de encobrimento. A Promotoria declarou que não há provas novas para reabrir a investigação.", "titulo_pt": "É desumano”: mãe denuncia tentativa de encobrimento sobre morte de soldado em quartel", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 246747, "titulo": "Em 2026, cidade de SP tem segundo outubro mais chuvoso desde 1995, diz CGE", "url": "https://www.metropoles.com/sao-paulo/em-2026-cidade-de-sp-tem-segundo-outubro-mais-chuvoso-desde-1995-diz-cge", "fonte_id": "metropoles", "data_pub": "2026-11-06T00:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2026, a cidade de São Paulo registrou o segundo outubro mais chuvoso desde 1995, com 220,3 mm de precipitação, um volume 96,7% superior à média esperada. O mês teve 26 dias com chuva.", "titulo_pt": "Em 2026, cidade de SP tem segundo outubro mais chuvoso desde 1995, diz CGE", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 247312, "titulo": "Analysis: China’s quarterly CO2 falls 3% in largest drop since Covid", "url": "https://www.carbonbrief.org/analysis-chinas-quarterly-co2-falls-3-in-largest-drop-since-covid", "fonte_id": "carbon_brief", "data_pub": "2026-11-06T00:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As emissões de dióxido de carbono (CO2) na China caíram 3,1% no terceiro trimestre de 2026, sendo este o maior decréscimo desde a pandemia de COVID-19.", "titulo_pt": "Análise: emissões de CO2 trimestrais da china caem 3% no maior decréscimo desde a pandemia de Covid-19", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 246909, "titulo": "El Niño. Las lluvias no dan tregua y en el sur bonaerense hay hasta 20 días de atraso en la siembra: “Vamos lerdo”", "url": "https://www.lanacion.com.ar/economia/campo/el-nino-las-lluvias-no-dan-tregua-y-en-el-sur-bonaerense-hay-hasta-20-dias-de-atraso-en-la-siembra-nid05112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-05T23:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em partes sul e ocidental da Província de Buenos Aires, as chuvas exageradas, as baixas temperaturas e a falta de sol dificultam a implantação de milho e girassol; alguns produtores podem não concluir a área prevista.", "titulo_pt": "O Niño. Chuvas não dão trégua e no sul da província de buenos aires há atraso de até 20 dias na sementeira: 'vamos devagar'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 246829, "titulo": "Sarampo: bebê morre nos EUA em meio a surto com mais de 400 casos", "url": "https://olhardigital.com.br/2026/11/05/medicina-e-saude/sarampo-bebe-morre-nos-eua-em-meio-a-surto-com-mais-de-400-casos/", "fonte_id": "olhar_digital", "data_pub": "2026-11-05T23:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um bebê morreu nos Estados Unidos durante um surto de sarampo que registrou mais de 400 casos. Este é o primeiro óbito por sarampo na região desde 1990.", "titulo_pt": "Bebê morre nos EUA em surto de sarampo com mais de 400 casos", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 245502, "titulo": "Copec, Coca-Cola Andina y Sendero avanzan en la gestión sustentable del agua con el Certificado Azul", "url": "https://www.latercera.com/sustentabilidad/noticia/copec-coca-cola-andina-y-sendero-avanzan-en-la-gestion-sustentable-del-agua-con-el-certificado-azul/", "fonte_id": "la_tercera", "data_pub": "2026-11-05T17:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Seis instalações das empresas Copec, Coca-Cola Andina e Sendero receberam o Nível 1 Avanzado do Acordo de Produção Limpia (APL) Certificado Azul, um programa promovido pela Agência de Sustentabilidade e Mudanças Climáticas da Corfo. A avaliação da sua pegada hídrica permitiu identificar os principais impactos das operações e definir medidas para reduzi-los, promovendo um uso mais eficiente da água.", "titulo_pt": "Copec, Coca-Cola Andina e Sendero avançam na gestão sustentável da água com o Certificado Azul", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 245288, "titulo": "Tornado, ciclones e ventos: o que está acontecendo no Centro-Sul do Brasil", "url": "https://www.cnnbrasil.com.br/nacional/brasil/tornado-ciclones-e-ventos-o-que-esta-acontecendo-no-centro-sul-do-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-05T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um especialista relacionou mudanças climáticas e a influência do El Niño como fatores associados à frequência e intensidade dos eventos climáticos no Centro-Sul do Brasil. Este ano, mais de 100 tornados já foram registrados no país.", "titulo_pt": "Tornados, ciclones e ventos: o que está acontecendo no Centro-Sul do Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 245476, "titulo": "Por que a doença de Newcastle voltou a preocupar a avicultura no Brasil e no mundo", "url": "https://www.dw.com/pt-br/por-que-a-doença-de-newcastle-voltou-a-preocupar-a-avicultura-no-brasil-e-no-mundo/a-79867131?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-05T14:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A doença de Newcastle causou focos em granjas de Santa Catarina, levando 37 países a restringirem as compras do Brasil. As notificações globais da doença bateram recorde em 2025, com a Europa liderando os casos.", "titulo_pt": "Por que a doença de Newcastle voltou a preocupar a avicultura no Brasil e no mundo", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 246402, "titulo": "Interactive: Tracking negotiating texts at the COP31 climate summit", "url": "https://www.carbonbrief.org/interactive-tracking-negotiating-texts-at-the-cop31-climate-summit", "fonte_id": "carbon_brief", "data_pub": "2026-11-05T14:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cada summit das Nações Unidas sobre clima vê países negociando a redação de numerosos artigos legais. O post Interactive: Rastreando os textos de negociação na COP31 de clima apareceu originalmente no Carbon Brief.", "titulo_pt": "Interactive: rastreando os textos de negociação na COP31 de clima", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 245886, "titulo": "Gaza: Displaced Palestinian builds wind turbine to generate electricity", "url": "https://www.euronews.com/video/2026/11/05/gaza-displaced-palestinian-builds-wind-turbine-to-generate-electricity", "fonte_id": "euronews", "data_pub": "2026-11-05T08:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um palestino deslocado em Gaza construiu uma turbina de vento improvisada para fornecer eletricidade aos barracos em Khan Younis. Ele não pode affordar painéis solares, então encontrou uma maneira de aproveitar o vento para alimentar bens de uso diário.", "titulo_pt": "Palestino deslocado em gaza constrói turbina de vento para gerar eletricidade", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 245888, "titulo": "New Zealand: Dead whales found as rescuers battle mass stranding", "url": "https://www.euronews.com/video/2026/11/05/new-zealand-dead-whales-found-as-rescuers-battle-mass-stranding", "fonte_id": "euronews", "data_pub": "2026-11-05T07:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
