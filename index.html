<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "27/07/2026 08:06", "stats": {"noticias_novas": 631, "resumos_gerados": 240}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O cenário das eleições presidenciais no Brasil continua com Lula na liderança, com 47% de intenção de voto no segundo turno. Flávio Bolsonaro vem logo atrás com 43%. As pesquisas também mostram um empate técnico entre Lula e os candidatos Caiado e Zema. No Rio de Janeiro, Eduardo Paes venceu as eleições para prefeito nos dois turnos. Já no Paraná, Sergio Moro lidera com 39% das intenções de voto. O Itamaraty reagiu negativamente às declarações do presidente argentino, Javier Milei, sobre o ministro Alexandre de Moraes e outras instituições brasileiras. Além disso, a Aneel deve tomar uma decisão sobre o futuro da caducidade da Enel SP antes das eleições, enquanto o Supremo Tribunal Federal decretou luto oficial pela morte do ex-ministro Octavio Gallotti.", "mundo": "O Irã rejeitou conversações com os Estados Unidos e manteve o Estreito de Ormuz fechado, afirmando que as mensagens serão transmitidas por intermédio de mediadores. O presidente francês, Emmanuel Macron, realizou uma reunião de crise sobre incêndios florestais na região de Bordeaux. Paralelamente, os Estados Unidos intensificaram suas atividades na América Latina, com a crença de que o tarifaço imposto pelo governo de Donald Trump ao Brasil foi para ajudar a campanha do senador Flávio Bolsonaro. O presidente chinês Xi Jinping e o brasileiro Luiz Inácio Lula da Silva discutiram sobre acelerar as negociações para um acordo entre o Mercosul e a China, reforçando a aproximação bilateral. Além disso, o governo brasileiro decidiu chamar o embaixador do Brasil na Argentina para consultas após declarações polêmicas feitas por Javier Milei.\n\nAs negociações entre Estados Unidos e Irã por uma paz duradoura enfrentaram novos obstáculos no fim de semana, mas parece que uma pausa temporária no conflito permanece em vigor. O Irã ameaçou 'consequências imprevistas' após o ataque ucraniano ao navio na costa do Mar Cáspio, classificado como 'absolutamente ilegal e injustificado'. Em outro desenvolvimento importante, Israel aprovou a entrada de uma força de segurança internacional no Gaza sob o plano de cessar-fogo proposto pelo presidente dos Estados Unidos, Donald Trump. O tráfego marítimo no Mar Vermelho diminuiu após um ataque dos Houthis à Arábia Saudita, com o fluxo de embarcações pelo Estreito de Bab el-Mandeb atingindo seu nível mais baixo em meses. Além disso, a China lançou uma série documental em cinco partes sobre as ilhas disputadas Diaoyu para apresentar sua versão da história e das discussões legais dessas ilhas.", "economia": "Nesta segunda-feira (27), diversos eventos econômicos importantes afetam a situação global. A tensão internacional, especialmente entre Estados Unidos e Irã, influencia os rendimentos das dívidas do Tesouro dos EUA, levando a uma queda nos preços do petróleo. Um desenvolvimento significativo para a economia chinesa é que as principais empresas de fabricação de chips registraram lucros que aumentaram 2.579,5% no primeiro semestre de 2026, impulsionados pela demanda por inteligência artificial e poder computacional. No Brasil, o governo anunciou que a Procuradoria-Geral da Fazenda Nacional (PGFN) deixará de recorrer em casos onde multas são aplicadas simultaneamente, enquanto o país atinge 80% da cota de carne bovina para a China e está prestes a ser taxado em 55%. A Zona Franca de Manaus ganhará novos benefícios tributários a partir de 2027, incluindo isenção no IPI e CBS, tornando-se um local mais atrativo para negócios. Além disso, o Brasil poderá se beneficiar de mudanças na imigração global, especialmente em face dos desafios demográficos do envelhecimento populacional, conforme sugere o pesquisador Michel Clemens, do PIIE.", "tecnologia": "A inteligência artificial (IA) continua sendo um tema central na tecnologia global. Em junho, as exportações de Hong Kong aumentaram 53% em comparação com o mesmo período do ano anterior, impulsionadas pela forte demanda internacional por produtos relacionados à IA, conforme relatado pelo SCMP. No entanto, os desafios associados ao avanço da IA também estão ganhando atenção. Sam Altman, CEO da OpenAI, afirmou que a IA atingiu uma 'singularidade', um ponto em que a inteligência artificial passa a superar a inteligência humana e se torna difícil de controlar, levantando preocupações sobre o futuro controle da tecnologia, conforme informado pela Al Jazeera. Além disso, a Apple planeja adiar o lançamento de seus óculos inteligentes até 2027 para lidar com os riscos à privacidade associados às funções de IA, conforme relatado pela Wired.", "ciencia": "Um estudo recente do CNRS francês confirmou que a glicose desempenha um papel crucial na fixação de memórias a longo prazo, ativando circuitos relacionados à fome após o aprendizado para 'guardar' informações importantes. Além disso, uma pesquisa liderada pela Lee Moon Won Bio, empresa coreana, foi selecionada para receber financiamento governamental de 800 milhões de won (cerca de $545.200) para pesquisas sobre calvície, após anos de experiência clínica na Clínica Lee Moon Won Coreana de Medicina. Em outro desenvolvimento importante, astrônomos chineses descobriram um pulsar de milissegundos emissor de raios gama a 3,900 anos-luz de distância, revelando um fenômeno extremo que pode ajudar a entender melhor as dinâmicas do universo. Estas pesquisas ilustram o amplo espectro da ciência atual, desde os processos biológicos fundamentais até avanços tecnológicos e descobertas astronômicas.", "cultura": "Em dezembro de 2027, o festival cultural coreano Fanomenon será realizado por 11 dias consecutivos, focado nas fandoms e organizado pelo Comitê Presidencial para Trocas Culturais Populares. Outras notícias relevantes incluem a primeira membro pública do coletivo feminista Guerrilla Girl, Joyce Kozloff, que se tornará visível ao público pela primeira vez. O podcast 'The No 1 Ladies Detective Agency' será lançado com histórias curtas projetadas para melhorar o humor dos ouvintes sobre a situação global. A Globo relançará a reprise da novela 'Avenida Brasil', enquanto a minissérie 'Pompeia: Além do Tempo' combinará ficção e documentário para explorar a erupção vulcânica de Vesúvio, com Tom Hiddleston no comando.", "sociedade": "Um jovem de 21 anos foi assassinado a tiros em uma loja de conveniência no Entorno do Distrito Federal, o que gerou preocupações sobre a violência. Em Nova York, a governadora Kathy Hochul anunciou que o estado serviu 396 milhões de refeições escolares gratuitas e ajudou a economizar cerca de 450 milhões de dólares mensais para as famílias, beneficiando aproximadamente 2,7 milhões de alunos. No Chile, Carmona acusa o governo de não ter respondido adequadamente à passagem do sistema frontal, pedindo que os municípios fortaleçam sua atuação. Em Berlim, Alemanha, uma parada LGBTQ+ foi interrompida por um suspeito que atropelou participantes, resultando em uma morte e 29 feridos.", "meio_ambiente": "A Europa enfrenta uma crise climática com incêndios florestais avassaladores, especialmente na Espanha e França. Segundo relatos, mais de 360 mil pessoas foram evacuadas em ambos os países, com as chamas se alastrando rapidamente devido a um solo e vegetação secos, além de uma onda de calor intensa. O primeiro-ministro espanhol, Pedro Sánchez, alertou que a Espanha e a Península Ibérica estão sofrendo os efeitos da crise climática. Na América do Sul, o Chile e a região de Coquimbo enfrentam danos significativos após um temporal, com estimativas de custo de até 700 milhões de dólares para a reconstrução nas áreas afetadas. No Brasil, o frio persiste no Sul e Sudeste do país, enquanto a seca severa na Amazônia ameaça a economia local, com prejuízos estimados em R$ 1,4 bilhão em 2023 devido à queda nos níveis dos rios. Além disso, um 'super' El Niño está previsto para causar danos combinados entre US$10 bilhões e US$20 bilhões na África, possivelmente levando a uma massiva migração de áreas duramente impactadas.", "direitos_humanos": "O governo do Distrito Federal implementou uma nova lei que criará um cadastro distrital para condenados por violência contra a mulher, incluindo informações como nome, foto e endereço. Na Coreia do Norte, o rádio que transmite mensagens para refugiados abduzidos enfrenta problemas devido ao equipamento obsoleto e tensões geopolíticas. Em Qaryut, perto de Nablus, um caso de violência contra a mulher resultou na perda de um bebê após forças israelenses terem obstruído uma ambulância. Na região de Gaza, Saba Rabah, 18 anos, se destacou como a aluna com melhor nota no exame nacional de escola secundária em Palestina. No entanto, as forças militares birmanesas intensificaram os ataques contra civis desde o início da nova administração, conforme relatado por monitores de conflitos. Em Malásia, escolas rohingya enfrentam fechamentos devido ao aumento online de discurso de ódio. Além disso, duas mortes durante operações migratórias dos agentes do ICE colocaram sua atuação sob questionamento nos Estados Unidos. No Irã, um ataque em uma escola matou 120 crianças quase cinco meses após o incidente. Na Alemanha, a polícia realiza uma busca por suspeitos de um atentado durante a parada LGBTQIA+ em Berlim. O texto também aborda a responsabilidade penal para adolescentes e a questão da violência juvenil, além de mencionar críticas de Donald Trump ao jogador LeBron James."}, "resumo_do_dia": {"politica_nacional": [{"id": 74764, "titulo": "Genial/Quaest: Eduardo Paes vence 1º e 2º turnos para governo do RJ", "url": "https://www.metropoles.com/brasil/genial-quaest-eduardo-paes-vence-1o-e-2o-turnos-para-governo-do-rj", "fonte_id": "metropoles", "data_pub": "2026-07-27T10:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Paes venceu os primeiros dois turnos das eleições para governador do Rio de Janeiro, superando adversários como o ex-governador Antony Garotinho e o presidente da Alerj Douglas Ruas.", "titulo_pt": "Eduardo Paes vence primeiro e segundo turnos para governo do RJ", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 74802, "titulo": "Nexus/BTG: Lula empata com Flávio, Caiado e Zema no 2º turno", "url": "https://www.cnnbrasil.com.br/eleicoes/nexus-btg-lula-empata-com-flavio-caiado-e-zema-no-2o-turno/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-27T10:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O levantamento realizado entre os dias 24 e 26 de julho ouviu 2.004 pessoas e mostrou que Lula está empatado com Flávio, Caiado e Zema no segundo turno das eleições.", "titulo_pt": "Nexus/BTG: lula empatado com Flávio, Caiado e Zema no 2º turno", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 74715, "titulo": "Pesquisa Quaest para o governo do Paraná: Moro tem 39%, Requião Filho 18% e Greca 12%", "url": "https://g1.globo.com/pr/parana/eleicoes/2026/noticia/2026/07/27/quaest-pr-governador-julho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-27T10:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest revelou que o senador Sergio Moro (PL) lidera as intenções de votos para o governo do Paraná com 39%, seguido por Requião Filho (PDT) com 18% e Rafael Greca (MDB) com 12%. O cenário incluiu outros candidatos, mas eles obtiveram menores percentagens.", "titulo_pt": "Pesquisa Quaest para o governo do Paraná: moro lidera com 39%, Requião Filho tem 18% e Greca 12%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 74702, "titulo": "Genial/Quaest: Moro teria 48% em 2º turno no Paraná, e Requião Filho marca 29%", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/genialquaest-moro-teria-48-em-2o-turno-no-parana-e-requiao-filho-marca-29.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-27T10:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Sergio Moro (PL) lidera a disputa pelo governo do Paraná com 48% das intenções de voto no segundo turno, contra 29% do deputado estadual Requião Filho (PDT).", "titulo_pt": "Moro teria 48% e Requião Filho 29% em simulação de segundo turno para governo do Paraná", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 74804, "titulo": "Nexus/BTG: No 1º turno, Lula tem 42% e Flávio 33%", "url": "https://www.cnnbrasil.com.br/eleicoes/nexus-btg-no-1o-turno-lula-tem-42-e-flavio-33/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-27T10:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa mostrou que, no primeiro turno das eleições, Lula obteve 42% dos votos e Flávio 33%. A pesquisa foi realizada entre os dias 24 e 26 de julho com 2.004 pessoas entrevistadas.", "titulo_pt": "Nexus/BTG: no primeiro turno, Lula tem 42% e Flávio 33%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 74716, "titulo": "Quaest no Pará: Hana Ghassan tem 24% e Daniel Santos, 20%", "url": "https://g1.globo.com/pa/para/eleicoes/2026/noticia/2026/07/27/quaest-no-para-hana-ghassan-tem-24percent-e-daniel-santos-20percent.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-27T10:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest revelou que, nos dois cenários de primeiro turno analisados, a governadora Hana Ghassan (MDB) e o candidato Dr. Daniel Santos (Podemos) estão empatados tecnicamente com 24% e 20% dos votos, respectivamente. Os demais candidatos obtiveram porcentagens menores.", "titulo_pt": "Quaest no Pará: hana Ghassan tem 24% e Daniel Santos, 20%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 74717, "titulo": "Quaest: Eduardo Paes lidera em todos os cenários na disputa para o governo do Rio de Janeiro", "url": "https://g1.globo.com/rj/rio-de-janeiro/eleicoes/2026/noticia/2026/07/27/quaest-rio-de-janeiro-governador-julho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-27T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest indica que Eduardo Paes lidera as intenções de voto para o governo do Rio de Janeiro, com até 42% nas simulações de primeiro turno. Os candidatos Douglas Ruas e Anthony Garotinho aparecem em seguida, com cerca de 10% cada.", "titulo_pt": "Eduardo Paes lidera intenções de voto para governo do Rio em pesquisa quaest", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 74718, "titulo": "Quaest para o Senado no RJ: Benedita e Crivella lideram cenários", "url": "https://g1.globo.com/rj/rio-de-janeiro/eleicoes/2026/noticia/2026/07/27/quaest-rio-de-janeiro-senador-julho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-27T09:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest divulgada em 27 de fevereiro apresentou dois cenários para a corrida ao Senado no Rio de Janeiro em 2026, mostrando que a ex-governadora Benedita da Silva (PT) e o deputado federal Marcelo Crivella (Republicanos) lideram. A pesquisa também simulou uma disputa sem Cláudio Castro (PL), atualmente inelegível, e Alessandro Molon (PSB).", "titulo_pt": "Quaest para o Senado no RJ: benedita e Crivella na frente", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 74719, "titulo": "Por que Javier Milei veio ao lançamento da candidatura de Flávio Bolsonaro a presidente", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/07/27/por-que-javier-milei-veio-ao-lancamento-da-candidatura-de-flavio-bolsonaro-a-presidente.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-27T09:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Itamaraty reagiu negativamente às declarações de Javier Milei, presidente da Argentina, sobre Alexandre de Moraes. Em um evento no sábado, Flávio Bolsonaro, senador pelo PL, lançou sua candidatura à Presidência, com a presença do político argentino que criticou o ministro do STF.", "titulo_pt": "Por que Javier Milei esteve no lançamento da candidatura de Flávio Bolsonaro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 74756, "titulo": "Com alianças e vice definidos, Lula chega à convenção melhor do que adversários", "url": "https://veja.abril.com.br/politica/com-aliancas-e-vice-definidos-lula-chega-a-convencao-melhor-do-que-adversarios/", "fonte_id": "veja", "data_pub": "2026-07-27T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente tem mais alianças estabelecidas do que seus adversários e deve ter maior tempo de televisão durante a propaganda eleitoral. Lula chega à convenção em melhores condições comparado aos seus rivais.", "titulo_pt": "Com alianças e vice definidos, Lula chega à convenção com vantagem sobre adversários", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 74703, "titulo": "Ministros de Lula apagam referência ao cargo em suas redes com receio do TSE", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/ministros-de-lula-apagam-referencia-ao-cargo-em-suas-redes-com-receio-do-tse.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ao menos onze ministros do governo Lula removem menções ao cargo nas redes sociais durante o período de defeso eleitoral. Eles fazem isso com medo das regras do TSE.", "titulo_pt": "Ministros de Lula apagam referência ao cargo em suas redes com receio do TSE", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 74861, "titulo": "O último capítulo da reforma do Judiciário", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-ultimo-capitulo-da-reforma-do-judiciario", "fonte_id": "jota", "data_pub": "2026-07-27T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A sanção presidencial ao filtro de relevância no recurso especial transformará o STJ (Superior Tribunal de Justiça) em uma corte de precedentes mais eficiente e ágil. Este processo visa melhorar a efetividade do Judiciário brasileiro.", "titulo_pt": "Último capítulo da reforma do Judiciário", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 74704, "titulo": "Podcast discute Datafolha e momento da corrida antes de campanha oficial começar", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/podcasts/2026/07/podcast-discute-datafolha-e-momento-da-corrida-antes-de-campanha-oficial-comecar.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-27T08:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro (PL) e Ronaldo Caiado (PSD) foram oficializados como candidatos à Presidência. A convenção do PL mencionou Jair Bolsonaro, refletindo o isolamento do senador sem vice definido.", "titulo_pt": "Podcast discute Datafolha e momento da corrida presidencial antes de campanha oficial começar", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 74777, "titulo": "Da 6x1 à soberania: o que Lula quer explorar na busca pela reeleição", "url": "https://www.metropoles.com/brasil/da-6x1-a-soberania-o-que-lula-quer-explorar-na-busca-pela-reeleicao", "fonte_id": "metropoles", "data_pub": "2026-07-27T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula pretende explorar o discurso da soberania, reforçado pelo novo tarifaço de Trump, como uma parte importante de sua campanha para a reeleição.", "titulo_pt": "Da 6x1 à soberania: o que Lula quer na busca pela reeleição", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 74780, "titulo": "Michelle, Flávio, Zema e mais: veja as candidaturas ainda com impasses", "url": "https://www.metropoles.com/brasil/flavio-michelle-e-zema-candidaturas", "fonte_id": "metropoles", "data_pub": "2026-07-27T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O prazo para as convenções partidárias está encerrando e várias candidaturas importantes ainda não foram definidas para a eleição de outubro. As candidaturas de Michelle, Flávio e Zema são algumas das que seguem em aberto.", "titulo_pt": "Michelle, Flávio, Zema e mais: veja as candidaturas ainda com impasses", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 74820, "titulo": "Aneel deve decidir futuro da caducidade da Enel SP antes das eleições", "url": "https://www.cnnbrasil.com.br/infra/aneel-deve-decidir-futuro-da-caducidade-da-enel-sp-antes-das-eleicoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-27T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O diretor-relator Fernando Mosna da Aneel pretende levar para o colegiado, no dia 11 de agosto, um recurso apresentado pela Enel SP contra a abertura do processo de caducidade; a decisão pode manter, anular ou arquivar o procedimento.", "titulo_pt": "Aneel deve decidir futuro da caducidade da Enel SP antes das eleições", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 74954, "titulo": "Even Before Attack, Berlin’s Gay Community Felt ‘More and More Unsafe’", "url": "https://www.nytimes.com/2026/07/27/world/europe/gay-community-berlin-attack.html", "fonte_id": "nyt_world", "data_pub": "2026-07-27T10:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A comunidade gay de Berlim se sentia cada vez mais insegura, mesmo antes do assassinato de uma mulher que os autoridades atribuíram a um ato de terrorismo islâmico. Houve um aumento nas ameaças, incluindo de extremistas da direita.", "titulo_pt": "Antes do ataque, comunidade Gay de berlim sentia-se ‘mais e mais insegura’", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 75072, "titulo": "U.S. and Iran pause fighting to give peace talks 'space.' Here's where negotiations stand", "url": "https://www.cnbc.com/2026/07/27/us-iran-war-trump-hormuz.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-27T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Negociações entre Estados Unidos e Irã para uma paz duradoura enfrentaram novos obstáculos no fim de semana, mas parece que uma pausa temporária na conflito permanece em vigor.", "titulo_pt": "EUA e Irã pausam conflitos para dar espaço às negociações de paz.", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 75030, "titulo": "Musk takes 'crusade' to Europe with Armie Hammer film", "url": "https://www.bbc.co.uk/news/articles/c5y4w5nwk00o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-27T09:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Elon Musk apoia um filme europeu chamado 'Cidadão Vigilante', que os críticos afirmam promove uma mensagem anti-imigrante.", "titulo_pt": "Musk empenha-se na Europa com filme de Armie Hammer", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 75061, "titulo": "Iran rules out US talks as Hormuz Strait remains closed", "url": "https://www.dw.com/en/iran-rules-out-us-talks-as-hormuz-strait-remains-closed/live-78127467?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-07-27T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Irã não solicitou a retomada de conversações com os Estados Unidos, segundo o porta-voz do Ministério das Relações Exteriores Esmaeil Baghaei. O Estreito de Ormuz permanece fechado e as mensagens estão sendo transmitidas por intermédio de mediadores.", "titulo_pt": "Irã descarta negociações com EUA enquanto estreito de Ormuz permanece fechado", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 75160, "titulo": "Rottamazione-quinquies, prima o unica rata in scadenza il 31 luglio", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/27/rottamazione-quinquies-prima-o-unica-rata-in-scadenza-il-31-luglio_608e2f44-de90-4f40-97b4-9c51bfd3ac95.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-27T09:48:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Agência de Entradas e Riscossões informou que o prazo para pagamento da quinta parcela, bem como para os reamessados, termina no dia 31 de julho.", "titulo_pt": "Rottamazione-quinquies: última parcela vence em 31 de julho", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 75036, "titulo": "Suspect in Berlin Pride attack shot dead by police", "url": "https://www.france24.com/en/video/20260727-suspect-in-berlin-pride-attack-shot-dead-by-police", "fonte_id": "france24", "data_pub": "2026-07-27T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de 21 anos, com antecedentes de atividade extremista islâmica, foi morto pela polícia alemã no domingo após supostamente dirigir um miniônibus contra pessoas durante as celebrações do orgulho LGBTQ em Berlim, causando uma morte.", "titulo_pt": "Suspeito dos ataques na Pride de berlim morto pela polícia", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 75062, "titulo": "Car ramming attacks: Why do they keep happening?", "url": "https://www.dw.com/en/car-ramming-attacks-why-do-they-keep-happening/a-71827106?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-07-27T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Veículos estão sendo utilizados como armas para atropelar e ferir pessoas inocentes. As razões por trás desses ataques não são sempre claras, nem as soluções para preveni-los.", "titulo_pt": "Ataques com veículos: por que eles continuam ocorrendo?", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 75159, "titulo": "Wwf, le risorse della terra saranno esaurite il 30 luglio", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/27/wwf-le-risorse-della-terra-saranno-esaurite-il-30-luglio_44453ee9-7785-472f-8b8a-e7533a291d8f.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-27T09:43:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O Dia de Sobrecarga da Terra para 2026 ocorreu no dia 30 de julho. A WWF informou que, neste ano, as demandas humanas sobre os recursos naturais do planeta excederam o que a Terra pode regenerar em um ano.", "titulo_pt": "Dia da sobrecarga da terra será comemorado no dia 30 de julho de 2026", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 75037, "titulo": "French firefighters battle the blaze with local residents through the night", "url": "https://www.france24.com/en/video/20260727-french-firefighters-battle-the-blaze-with-local-residents-through-the-night", "fonte_id": "france24", "data_pub": "2026-07-27T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Noites difíceis para os bombeiros franceses, que trabalham perto do incêndio com a ajuda de moradores locais, pois os aviões Canadair não podem operar devido à baixa visibilidade.", "titulo_pt": "Bombeiros franceses e moradores locais lutam contra o fogo durante a noite", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 75038, "titulo": "Wildfire threatens French defence sites ArianeGroup, Dassault and Thales", "url": "https://www.france24.com/en/video/20260727-wildfire-threatens-french-defence-sites-arianegroup-dassault-and-thales", "fonte_id": "france24", "data_pub": "2026-07-27T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 42.000 hectares foram queimados na região de Gironde, no sul-oeste da França, enquanto incêndios florestais se aproximam de Bordeaux e ameaçam instalações sensíveis da defesa e do setor espacial franceses. Até agora, 240 casas foram destruídas pelas chamas.", "titulo_pt": "Incêndio ameaça instalações de defesa e indústria espacial na França", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 75039, "titulo": "Spain to start first return of fire evacuees as wildfires advance has slowed", "url": "https://www.france24.com/en/video/20260727-spain-to-start-first-return-of-fire-evacuees-as-wildfires-advance-has-slowed", "fonte_id": "france24", "data_pub": "2026-07-27T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades espanholas planejam permitir que algumas pessoas evacuadas de incêndios florestais perto de Madrid retornem às suas casas na próxima segunda-feira, indicando um progresso no combate a alguns dos piores incêndios da história do país.", "titulo_pt": "Espanha vai começar primeiro retorno de evacuados de incêndios como as chamas se estancam", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 75063, "titulo": "France: Macron holds crisis talks as wildfires spread", "url": "https://www.dw.com/en/france-macron-holds-crisis-talks-as-wildfires-spread/a-78128027?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-07-27T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A França e a Espanha estão lutando contra alguns dos piores incêndios florestais em anos. O governo francês está realizando uma reunião de crise, pois uma nuvem gerada por fogo sobre o país aumentou as preocupações com mais focos de incêndio.", "titulo_pt": "França: macron realiza reuniões de crise enquanto incêndios florestais se espalham", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 75040, "titulo": "France, Spain wildfires: Climate change increasing frequency, intensity of extreme weather events", "url": "https://www.france24.com/en/video/20260727-france-spain-wildfires-climate-change-increasing-frequency-intensity-of-extreme-weather-events", "fonte_id": "france24", "data_pub": "2026-07-27T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais na região de Bordeaux, no sul da França, e perto de Madrid, na Espanha Central, são alguns dos mais graves nos últimos décadas. A mudança climática, que trouxe sucessivas ondas de calor e falta de chuva, agravou o problema, alimentando os incêndios em áreas secas.", "titulo_pt": "Incêndios florestais na França e Espanha: mudança climática aumenta frequência e intensidade dos eventos extremos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 74953, "titulo": "Berlin Pride Attack Suspect Tried to Join ISIS, Prosecutors Say", "url": "https://www.nytimes.com/2026/07/27/world/europe/berlin-pride-attack-suspect-isis.html", "fonte_id": "nyt_world", "data_pub": "2026-07-27T09:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O suspeito do ataque à Berlin Pride estava envolvido no planejamento de um ato violento grave contra o estado, mas foi solto da prisão preventiva em maio. Os procuradores afirmam que ele tentou se juntar ao ISIS.", "titulo_pt": "Suspeito do ataque à berlin Pride tentou se juntar ao ISIS, dizem procuradores", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 75058, "titulo": "Iran threatens 'unforeseen' consequences after Ukrainian attack on Caspian Sea vessel", "url": "https://www.lemonde.fr/en/international/article/2026/07/27/iran-threatens-unforeseen-consequences-after-ukrainian-attack-on-vessel_6755873_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-27T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério das Relações Exteriores do Irã classificou o ataque ucraniano ao navio na costa do Mar Cáspio como 'absolutamente ilegal e injustificado'. O Irã ameaçou 'consequências imprevistas' em resposta.", "titulo_pt": "Irã ameaça 'consequências imprevistas' após ataque ucraniano a navio no mar cáspio", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 75083, "titulo": "‘Only America was rich enough to satisfy my hypertrophied self’: Florida exhibition explores how Salvador Dalí transformed US culture", "url": "https://english.elpais.com/culture/2026-07-27/only-america-was-rich-enough-to-satisfy-my-hypertrophied-self-florida-exhibition-explores-how-salvador-dali-transformed-us-culture.html", "fonte_id": "elpais_en", "data_pub": "2026-07-27T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A exposição no Museu Dalí, em St. Petersburg, faz parte das comemorações do 250º aniversário dos Estados Unidos e apresenta uma coleção que abrange a vida e o trabalho de Salvador Dalí na Nova York e na Califórnia.", "titulo_pt": "Apenas américa era rica o suficiente para satisfazer meu eu hipertrofiado”: exposição no museu Dalí explora como Salvador Dalí transformou a cultura americana", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 74827, "titulo": "Minidólar (WDOQ26): tensão global pode ditar o rumo nesta segunda", "url": "https://www.infomoney.com.br/mercados/minidolar-hoje-futuro-do-dolar-wdoq26-27072026/", "fonte_id": "infomoney", "data_pub": "2026-07-27T10:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta segunda-feira (27), o minidólar (WDOQ26) pode ser influenciado pela tensão global. A situação internacional será um fator importante para determinar o movimento do minidólar.", "titulo_pt": "Minidólar (WDOQ26): tensão global pode guiar o rumo nesta segunda", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 74828, "titulo": "Mini-índice (WINQ26) hoje: suportes e resistências para operar", "url": "https://www.infomoney.com.br/mercados/mini-indice-hoje-futuro-ibovespa-winq26-27072026/", "fonte_id": "infomoney", "data_pub": "2026-07-27T10:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A análise técnica aponta suportes e resistências para o mini-índice (WINQ26) no dia 27 de julho. O post original está disponível no InfoMoney.", "titulo_pt": "Mini-índice (WINQ26) hoje: suportes e resistências para operar", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 74709, "titulo": "Megalink obtém R$ 30 milhões do BNDES para inclusão digital em escolas públicas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/07/megalink-obtem-r-30-milhoes-do-bndes-para-inclusao-digital-em-escolas-publicas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-27T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Megalink, empresa de telecomunicações, recebeu um financiamento no valor de R$ 30 milhões do BNDES para implementar um projeto de inclusão digital em escolas públicas nos estados do Piauí e Maranhão.", "titulo_pt": "Megalink obtém R$ 30 milhões do BNDES para inclusão digital em escolas públicas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 74859, "titulo": "As janelas que se fecham em 31 de dezembro de 2026", "url": "https://www.jota.info/coberturas-especiais/pulso-da-reforma/as-janelas-que-se-fecham-em-31-de-dezembro-de-2026", "fonte_id": "jota", "data_pub": "2026-07-27T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A transição para o IVA dual trará oportunidades tributárias, especialmente no último ano antes da implementação completa. As janelas de tempo para aproveitar essas oportunidades se encerram em 31 de dezembro de 2026.", "titulo_pt": "As janelas que se fecham em 31 de dezembro de 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 75176, "titulo": "Profits in China’s chipmaking sector soar 2,500% in first half amid AI boom", "url": "https://www.scmp.com/tech/tech-trends/article/3362002/profits-chinas-chipmaking-sector-soar-2500-first-half-amid-ai-boom?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As principais empresas de fabricação de chips na China registraram lucros que aumentaram 2.579,5% no primeiro semestre de 2026, impulsionados pela demanda inédita por inteligência artificial e poder computacional.", "titulo_pt": "Lucros das indústrias de chips chinesas triplicam em 2.579,5% no primeiro semestre com boom da IA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 75075, "titulo": "Treasury yields tumble as Middle East tensions ease", "url": "https://www.cnbc.com/2026/07/27/treasury-yields-oil-iran.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-27T09:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos das dívidas do Tesouro dos EUA caíram na segunda-feira devido ao alívio nas tensões entre Estados Unidos e Irã, o que levou a uma queda nos preços do petróleo.", "titulo_pt": "Rendimentos das dívidas do tesouro americanos diminuem com alívio da tensão no oriente médio", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 74740, "titulo": "Beneficiários com NIS de final 6 recebem Bolsa Família de julho", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/beneficiarios-com-nis-de-final-6-recebem-bolsa-familia-de-julho", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-27T09:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Caixa Econômica Federal realiza o pagamento do Bolsa Família de julho para os beneficiários com NIS final 6 nesta segunda-feira (27). O valor médio do benefício é de R$ 679,19. Os pagamentos foram antecipados em 20 de julho para moradores de 175 municípios em situação de emergência ou calamidade pública nos estados do Amazonas, Paraíba, Paraná, Rio Grande do Norte, Roraima e Sergipe.", "titulo_pt": "Beneficiários com NIS final 6 recebem Bolsa Família de julho", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 74860, "titulo": "PGFN vai deixar de recorrer em concomitância de multas e desiste de recursos em andamento", "url": "https://www.jota.info/tributos/pgfn-vai-deixar-de-recorrer-em-concomitancia-de-multas-e-desiste-de-recursos-em-andamento", "fonte_id": "jota", "data_pub": "2026-07-27T09:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da Fazenda Nacional (PGFN) decidiu não mais recorrer quando as multas são aplicadas simultaneamente e também encerrou os processos de recurso em andamento. Essa orientação deve ser seguida pela Receita Federal do Brasil.", "titulo_pt": "PGFN vai deixar de recorrer em concomitância de multas e desiste de recursos em andamento", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 74836, "titulo": "Lula e Xi Jinping defendem aceleração de negociações para acordo Mercosul-China", "url": "https://www.infomoney.com.br/politica/lula-e-xi-jinping-defendem-aceleracao-de-negociacoes-para-acordo-mercosul-china/", "fonte_id": "infomoney", "data_pub": "2026-07-27T09:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula e Xi Jinping enfatizaram a necessidade de acelerar as negociações para um acordo entre o Mercosul e a China, com foco em áreas estratégicas e tecnológicas avançadas como inteligência artificial e satélites.", "titulo_pt": "Lula e Xi Jinping defendem aceleração das negociações para acordo Mercosul-China", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 74710, "titulo": "Brasileiros conseguem usar Pix em viagens ao exterior; veja como funciona", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/brasileiros-conseguem-usar-pix-em-viagens-ao-exterior-veja-como-funciona.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Turistas brasileiros podem usar o Pix durante viagens ao exterior, especialmente na América do Sul, graças a empresas e bancos que conectam o sistema brasileiro a redes internacionais de pagamentos.", "titulo_pt": "Brasileiros conseguem usar Pix em viagens ao exterior; veja como funciona", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 74711, "titulo": "Empregadores temem escassez de mão de obra com a perda de proteção de imigrantes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/empregadores-temem-escassez-de-mao-de-obra-com-a-perda-de-protecao-de-imigrantes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Equipes de imigrantes salvadorenhos ajudaram na renovação e manutenção de edifícios importantes nos arredores de Washington, enquanto cuidadores haitianos auxiliam idosos em residências para idosos em vários estados dos Estados Unidos. Essas ações ocorrem no contexto da preocupação com a escassez de mão de obra após a perda de proteção migratória.", "titulo_pt": "Empregadores temem escassez de mão de obra com a perda de proteção para imigrantes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 74712, "titulo": "Brasil atinge 80% da cota de carne para a China e está prestes a ser taxado em 55%", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/brasil-atinge-80-da-cota-de-carne-para-a-china-e-esta-prestes-a-ser-taxado-em-55.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil atingiu na semana passada a marca de 80% da cota de carne bovina para a China, medida estabelecida pelo Ministério do Comércio chinês como salvaguarda. Aproximadamente 55% da cota restante pode ser utilizada antes que a China possa impor uma tarifa.", "titulo_pt": "Brasil atinge 80% da cota de carne para a China e está prestes a ser taxado em 55%", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 74862, "titulo": "Zona Franca de Manaus ganha novo peso estratégico com a reforma tributária", "url": "https://www.jota.info/opiniao-e-analise/artigos/zona-franca-de-manaus-ganha-novo-peso-estrategico-com-a-reforma-tributaria", "fonte_id": "jota", "data_pub": "2026-07-27T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Zona Franca de Manaus ganhará novos benefícios tributários a partir de 2027, incluindo isenção no IPI e CBS. A tendência é que Manaus se torne um local atrativo para negócios.", "titulo_pt": "Zona Franca de Manaus adquire novo peso estratégico com reforma tributária", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 75134, "titulo": "Portable air conditioner sales surge in Japan amid intense heat", "url": "https://www.japantimes.co.jp/business/2026/07/27/companies/japan-portable-air-conditioner-sales/", "fonte_id": "japan_times", "data_pub": "2026-07-27T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas de condicionadores de ar portáteis aumentaram no Japão devido ao calor intenso. Os preços relativamente baixos e a facilidade de instalação contribuem para sua popularidade.", "titulo_pt": "Vendas de condicionadores de ar portáteis crescem no Japão por causa do calor intenso", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 74863, "titulo": "Contrabando de cigarros e cooptação indígena", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-da-abde/contrabando-de-cigarros-e-cooptacao-indigena", "fonte_id": "jota", "data_pub": "2026-07-27T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute o contrabando de cigarros e a cooptação indígena, identificando esses fenômenos como uma externalidade criminal menos conhecida.", "titulo_pt": "Contrabando de cigarros e cooptação indígena", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 74864, "titulo": "A cura amarga da insegurança jurídica trabalhista", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-cura-amarga-da-inseguranca-juridica-trabalhista", "fonte_id": "jota", "data_pub": "2026-07-27T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A segurança jurídica trabalhista sofre quando a Constituição, a Consolidação das Leis do Trabalho (CLT) e os precedentes do Supremo Tribunal Federal (STF) são tratados como sugestões.", "titulo_pt": "A amarga cura da insegurança jurídica trabalhista", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 75035, "titulo": "In China, people are renting out their faces to AI", "url": "https://restofworld.org/2026/china-ai-microdramas-face-licensing/?utm_source=rss&utm_medium=rss&utm_campaign=feeds", "fonte_id": "rest_of_world", "data_pub": "2026-07-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Plataformas chinesas estão pagando pessoas para licenciar suas imagens para a produção de dramas e anúncios gerados por IA, criando um novo mercado para identidades biométricas.", "titulo_pt": "Em China, as pessoas estão alugando seus rostos para a inteligência artificial", "veiculo": "Rest of World", "pais": "EUA", "classe": "A"}, {"id": 75201, "titulo": "Europe got its own TBPN-style live show, and everyone’s angling for a guest spot", "url": "https://techcrunch.com/2026/07/27/europe-got-its-own-tbpn-style-live-show-and-its-already-a-hot-spot-on-a-press-tour/", "fonte_id": "techcrunch", "data_pub": "2026-07-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A rede Europeia anunciou uma rodada inicial de financiamento no valor de $1,6 milhão proveniente de investidores-chave do ecossistema de mídia, como Powerhouse Capital, Axel Springer SE (proprietário de Business Insider e Politico), LadBible e investidores anjos da OpenAI e DeepMind. Com esses fundos, a rede planeja expandir significativamente.", "titulo_pt": "Europa ganha seu próprio show ao vivo do estilo tbpn, com todos buscando uma participação especial", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 75203, "titulo": "This Is Donald Trump’s AI Brain Trust", "url": "https://www.wired.com/story/this-is-donald-trumps-ai-brain-trust/", "fonte_id": "wired", "data_pub": "2026-07-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um oficial de alto nível da administração americana afirma que a política de IA dos Estados Unidos está sendo desenvolvida com múltiplos pontos de vista, não apenas dois lados de uma argumentação.", "titulo_pt": "Esta é a inteligência artificial do cérebro de Trump", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 75092, "titulo": "Sam Altman says AI has entered ‘singularity’: Should we be worried?", "url": "https://www.aljazeera.com/news/2026/7/27/sam-altman-says-ai-has-entered-singularity-should-we-be-worried?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-27T09:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sam Altman afirma que a inteligência artificial (IA) entrou na 'singularidade', momento em que a IA passa a superar a inteligência humana e se torna difícil de controlar. Este conceito sugere preocupações sobre o controle futuro da IA.", "titulo_pt": "Sam Altman diz que AI atingiu 'singularidade': devemos nos preocupar?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 75205, "titulo": "Measles Is Becoming So Common That Treatments May Soon Be Needed", "url": "https://www.wired.com/story/measles-treatments-soon-needed/", "fonte_id": "wired", "data_pub": "2026-07-27T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nos Estados Unidos, com o aumento do número de casos de sarampo e a redução das taxas de imunização, pesquisadores estão desenvolvendo tratamentos para ajudar as pessoas que contraiam o vírus ou que são particularmente vulneráveis.", "titulo_pt": "Sarampo está se tornando tão comum que pode ser necessário desenvolver tratamentos", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 75278, "titulo": "Multiverse Computing targeting up to $570M in latest round", "url": "https://tech.eu/2026/07/27/multiverse-computing-says-has-funding-commitments-up-to-570m-in-latest-round/", "fonte_id": "tech_eu", "data_pub": "2026-07-27T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup espanhola Multiverse Computing busca financiamento de até $570 milhões em sua rodada mais recente, avaliando a empresa em $1,7 bilhões. A empresa visa tornar a inteligência artificial mais barata e eficiente para empresas.", "titulo_pt": "Multiverse Computing alvo de até 570 milhões em nova rodada de financiamento", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 75244, "titulo": "South Korea, AMD team up to integrate homegrown NPUs with CPUs and GPUs", "url": "https://www.digitimes.com/news/a20260727VL218/amd-software-infrastructure-government-2026.html", "fonte_id": "digitimes", "data_pub": "2026-07-27T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul e a AMD concordaram em desenvolver e demonstrar uma infraestrutura de computação heterogênea de IA, integrando processadores CPUs e GPUs da AMD com unidades de processamento neural localmente desenvolvidas. Este esforço visa fornecer modelos práticos para o setor de chips de IA sul-coreano e permitir sua entrada na cadeia de suprimentos global de computação de IA.", "titulo_pt": "Coreia do sul e AMD unem-se para integrar unidades de processamento neural domésticas com CPUs e GPUs", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 75245, "titulo": "Apple reportedly delays smart glasses launch to late 2027 due to privacy risks", "url": "https://www.digitimes.com/news/a20260727VL221/apple-smart-glasses-camera-data-privacy-2027.html", "fonte_id": "digitimes", "data_pub": "2026-07-27T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple planeja apresentar seus primeiros óculos inteligentes durante a Conferência Mundial de Desenvolvedores (WWDC) em junho de 2027, antes de colocá-los à venda no mesmo ano. O lançamento foi adiado para lidar com os riscos à privacidade associados às muitas funções de inteligência artificial que os dispositivos oferecerão.", "titulo_pt": "Apple adia lançamento dos óculos inteligentes para 2027 devido a riscos à privacidade", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 75180, "titulo": "AI fuels boom as Hong Kong exports soar 53% to record HK$641 billion in June", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3361989/ai-fuels-boom-hong-kong-exports-soar-53-record-hk641-billion-june?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-27T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações de Hong Kong aumentaram 53,4% no mês de junho em comparação com o mesmo período do ano anterior, atingindo um recorde de HK$641,1 bilhões. O aumento foi impulsionado pela forte demanda internacional por produtos relacionados à inteligência artificial.", "titulo_pt": "Inteligência artificial impulsiona boom nas exportações de Hong Kong em junho", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 75246, "titulo": "Samsung converts AMD and OpenAI ties into HBM4 supply wins", "url": "https://www.digitimes.com/news/a20260727VL220/samsung-amd-openai-hbm4-infrastructure.html", "fonte_id": "digitimes", "data_pub": "2026-07-27T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samsung está ganhando momentum na corrida de memória para IA ao fortalecer suas parcerias com OpenAI e AMD, o que pode melhorar sua posição no ecossistema HBM4 da próxima geração após perder terreno inicialmente para a SK hynix em memórias para IA.", "titulo_pt": "Samsung intensifica parcerias com OpenAI e AMD para ganhar espaço na memória de IA HBM4", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 75207, "titulo": "It’s Becoming Clear Why Black Holes Never Run Out of Fuel", "url": "https://www.wired.com/story/its-becoming-clear-why-black-holes-never-run-out-of-fuel/", "fonte_id": "wired", "data_pub": "2026-07-27T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Buracos negros lançam jatos de energia poderosos que expulsam o gás circundante para distâncias consideráveis. No entanto, a pergunta é: como eles podem continuar crescendo?", "titulo_pt": "Torna-se evidente por quê os buracos negros nunca ficam sem combustível", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 75279, "titulo": "Beelzebub raises €3M to strengthen enterprise cyber defence with AI", "url": "https://tech.eu/2026/07/27/beelzebub-raises-eur3m-to-strengthen-enterprise-cyber-defence-with-ai/", "fonte_id": "tech_eu", "data_pub": "2026-07-27T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup italiana Beelzebub, que desenvolve uma plataforma de segurança cibernética baseada em inteligência artificial para proteger organizações contra ameaças cibernéticas geradas por IA, levantou €3 milhões em rodada de financiamento de semente liderada exclusivamente por um investidor não especificado.", "titulo_pt": "Beelzebub arrecada €3M para fortalecer defesa cibernética empresarial com AI", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 75247, "titulo": "Singapore startup Acrab claims 7.5x speed edge over Mac Mini M4 Pro with new AI chip", "url": "https://www.digitimes.com/news/a20260727VL211/startup-processor-language.html", "fonte_id": "digitimes", "data_pub": "2026-07-27T08:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma startup de chip malásia chamada Acrab lançou seu primeiro processador de IA no dia 22 de julho, afirmando que pode executar modelos de linguagem grande localmente com velocidades 7,5 vezes superiores ao Mac Mini M4 Pro da Apple em certos testes.", "titulo_pt": "Startup malásia Acrab anuncia processador de IA 7,5 vezes mais rápido do que Mac Mini M4 Pro", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 75248, "titulo": "Samsung to use 2nm process for HBM5 base die as heat challenge grows", "url": "https://www.digitimes.com/news/a20260727VL216/samsung-2nm-hbm-performance-hbm4.html", "fonte_id": "digitimes", "data_pub": "2026-07-27T08:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung planeja fabricar a base do die da próxima geração de memória HBM5 usando um processo de 2nm gate-all-around. Isso ocorre devido ao aumento da pressão para melhorias na performance lógica, eficiência energética e gerenciamento térmico, devido à velocidade crescente das memórias de alto banda.", "titulo_pt": "Samsung usará processo de 2nm para base do die de HBM5 diante do desafio térmico", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 75280, "titulo": "BAE Systems' energy spinout Nuclear Turbines emerges from stealth with £15M raise", "url": "https://tech.eu/2026/07/27/bae-systems-energy-spinout-nuclear-turbines-emerges-from-stealth-with-ps15m-raise/", "fonte_id": "tech_eu", "data_pub": "2026-07-27T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A spinoff da BAE Systems, Nuclear Turbines, saiu do modo de stealth e levantou £15 milhões, da estão sendo investigados.", "titulo_pt": "Um antigo remédio contra o diabetes pode diminuir o risco de demência?", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 75238, "titulo": "Virtual reality fish platform offers insights into the impact of artificial light on aquatic life", "url": "https://phys.org/news/2026-07-virtual-reality-fish-platform-insights.html", "fonte_id": "phys_org", "data_pub": "2026-07-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma plataforma de realidade virtual foi utilizada para fornecer novos insights sobre como a luz artificial à noite altera as respostas das peixes de recifes de corais aos predadores. O estudo combina o conhecimento metabólico da Universidade de Glasgow com uma inovadora plataforma de realidade virtual projetada no Institut de Neurosciences de la Timone e implementada no CRIOBE.", "titulo_pt": "Plataforma de realidade virtual oferece novos insights sobre a influência da luz artificial na vida aquática", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 75277, "titulo": "AI in orbit is a double-edged sword. Here’s how to keep it from cutting space cooperation apart", "url": "https://spacenews.com/ai-in-orbit-is-a-double-edged-sword-heres-how-to-keep-it-from-cutting-space-cooperation-apart/", "fonte_id": "spacenews", "data_pub": "2026-07-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a necessidade de tratados ou acordos voluntários para prevenir uma corrida armada no espaço. Aborda como o uso da inteligência artificial nos satélites pode ser um fator duplamente afiado, tanto promissor quanto potencialmente prejudicial para a cooperação espacial internacional.", "titulo_pt": "IA no espaço é uma faca de dois gumes. Como evitar que ela cause divisões na cooperação espacial?", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 75300, "titulo": "A seed that flew around the moon grew into this tree in NYC", "url": "https://www.space.com/astronomy/moon/a-seed-that-flew-around-the-moon-grew-into-this-tree-in-nyc", "fonte_id": "space_com", "data_pub": "2026-07-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Madison Square Park Conservancy revelou sua árvore chamada 'moon tree' em uma festa de aniversário com fumaça. A árvore cresceu a partir de uma semente que orbitou a Lua.", "titulo_pt": "Sementes que orbitaram a lua germinaram nesta árvore em nova york", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 75301, "titulo": "This is the best lunar eclipse until New Year's Eve 2028 — Here's how to spot the 'almost blood moon' on Aug. 27", "url": "https://www.space.com/stargazing/lunar-eclipses/this-is-the-best-lunar-eclipse-until-new-years-eve-2028-heres-how-to-spot-the-almost-blood-moon-on-aug-27", "fonte_id": "space_com", "data_pub": "2026-07-27T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um eclipse lunar dramático de 96% será visível para milhões de observadores no céu noturno em 27 de agosto. É o melhor eclipse lunar até 31 de dezembro de 2028.", "titulo_pt": "Este é o melhor eclipse lunar até 31 de dezembro de 2028 — saiba como ver a 'lua quase sangrenta' no dia 27 de agosto", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 74705, "titulo": "Macacos e humanos compartilham bases do conhecimento geométrico", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/07/macacos-e-humanos-compartilham-bases-do-conhecimento-geometrico.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo recente demonstrou que macacos e humanos compartilham a capacidade de compreender formas geométricas intuitivamente, sugerindo que essa habilidade não é exclusiva dos seres humanos.", "titulo_pt": "Macacos e humanos compartilham bases do conhecimento geométrico", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 75269, "titulo": "Opinion: E-bikes, e-scooters are a burgeoning pediatric public health emergency", "url": "https://www.statnews.com/2026/07/27/e-bikes-scooters-children-teens-safety-orthopedics-research/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-07-27T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "E-bikes e e-scooters têm causado um aumento significativo de lesões graves nos departamentos de emergência dos Estados Unidos, de acordo com especialistas do CHOP.", "titulo_pt": "Opinião: e-bikes e e-scooters representam uma emergência pública de saúde pediátrica em desenvolvimento", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 75270, "titulo": "STAT+: As some medical schools embrace RFK Jr.’s nutrition push, they deftly sidestep MAHA priorities", "url": "https://www.statnews.com/2026/07/27/kennedy-medical-school-nutrition-training-cautious-adoption/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-07-27T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Algumas escolas médicas estão adotando a iniciativa de Robert F. Kennedy Jr. para incluir mais educação nutricional, mas afirmaram que evitarão abordar temas que não se encaixam nos objetivos prioritários da MAHA.", "titulo_pt": "Enquanto algumas escolas médicas seguem o chamado de RFK Jr. Para mais educação nutricional, elas desviem-se dos objetivos MAHA", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 75271, "titulo": "Opinion: How midwives like me can help fight medical misinformation", "url": "https://www.statnews.com/2026/07/27/midwives-vaccine-denial-misinformation-judgment/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-07-27T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mara Evans, uma enfermeira-midwife, acredita que mudar de ideia é raramente o objetivo. Ela sugere que plantar uma sement
