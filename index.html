<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">

  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "17/08/2026 19:16", "stats": {"noticias_novas": 588, "resumos_gerados": 233}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva (PT) e o presidente do Senado, Davi Alcolumbre (UNIÃO-AP), trocaram gestos de afeto durante uma visita ao navio-sonda da Petrobras no Amapá, após a reaproximação política entre eles. Em outro desenvolvimento, o ex-presidente Jair Bolsonaro (PL) foi autorizado a sair da prisão domiciliar para um atendimento odontológico. O Tribunal Superior Eleitoral (TSE) lançou uma campanha para incentivar a participação nas eleições de 2026, destacando a importância do trabalho de jornalistas para a democracia. Além disso, a plataforma Discord suspendeu temporariamente as lives no Brasil em conformidade com uma decisão da Agência Nacional de Proteção de Dados (ANPD).", "mundo": "A Suprema Corte dos Estados Unidos rejeitou o segundo pedido de Donald Trump para revisar uma condenação cível de US$ 5 milhões relacionada a um caso de abuso sexual, encerrando o processo. Esta decisão reduziu a taxa de aprovação de Trump para 33%, seu menor nível durante o mandato. O ex-presidente dos Estados Unidos, Donald Trump, declarou que o líder da Coreia do Norte, Kim Jong-un, respondeu ao seu chamado para diálogo, mas não houve detalhes sobre a natureza ou o conteúdo da resposta. Diante das incertezas nas relações entre Estados Unidos e Irã, o petróleo WTI subiu 2,83% para US$ 84,73 por barril, enquanto o Brent aumentou 2,85% para US$ 91,04 por barril. A Coreia do Norte permaneceu no foco das discussões, com Trump defendendo a decisão de cortar os exercícios militares com a Coreia do Sul e alegando que a Coreia do Sul recusou-se a ajudar no Estreito de Ormuz. Além disso, a Universidade Nacional Autônoma do México realizou testes para 43.000 jovens após um escândalo de fraude, enquanto a Meta enfrentava o maior julgamento de sua história em Califórnia por danos causados pelas redes sociais a jovens. O petróleo atingiu um novo máximo de 62 euros na praça TTF de Amsterdã devido ao bloqueio no Estreito de Ormuz.\n\nA geopolítica global continua movimentada com uma série de eventos significativos. Os Estados Unidos pausaram a construção de um muro na fronteira com o México em um parque nacional do Texas, enquanto a União Europeia impôs sanções contra líderes da indústria espacial russa, incluindo o chefe de uma subsidiária da Roscosmos. Em outro front, Israel realizou uma operação no Hospital de Reabilitação de Bethlehem, na Palestina, levando a protestos e denúncias de violações à lei internacional. Além disso, a Coreia do Norte continua a desafiar a presença americana no Pacífico, com o Pentágono informando que está 'ativamente trabalhando' para executar a diretiva de Trump sobre manobras militares entre Coreia do Sul e Estados Unidos. A situação no Oriente Médio também é tenso, com Israel ameaçando Gaza e o Irã continuando a disputa pelo controle do Estreito de Ormuz, enquanto o Comando Central dos EUA informou que redirecionou 64 navios durante esse bloqueio.", "economia": "A economia brasileira registrou uma desaceleração no segundo trimestre, com o PIB crescendo 0,3% em relação ao mesmo período do ano anterior, conforme informou a FGV. Este resultado foi inferior às expectativas iniciais de um crescimento mais forte. Em meio a essas incertezas, a Petrobras anunciou a descoberta de petróleo na Foz do Amazonas, o que pode aumentar as reservas do pré-sal, embora ainda sejam necessários estudos adicionais para avaliar a viabilidade comercial. O Ibovespa e o dólar registraram quedas devido a preocupações com a recuperação judicial da Casas Bahia, que solicitou um empréstimo de R$ 1 bilhão para fortalecer suas finanças. A empresa enfrenta uma crise financeira e pediu recuperação judicial para renegociar R$ 17,3 bilhões em dívidas. Além disso, a Marabraz, uma grande empresa de varejo, entrou em crise devido a uma disputa familiar e uma dívida de R$ 140 milhões, o que prejudicou seu acesso a recursos financeiros.", "tecnologia": "Um estudo recente destacou o uso incorreto da inteligência artificial (IA) em artigos acadêmicos, alertando para a necessidade de maior cuidado na aplicação dessa tecnologia. Empresas de tecnologia também enfrentam desafios, como o encerramento recente da startup Relay, que desenvolvia automação com IA, e a acusação de 'gaslighting' por parte da Petlibro, devido a problemas com alimentadores inteligentes para animais. No entanto, a tecnologia está trazendo inovações, como a criação de um sistema de monitoramento do ar inspirado em borboletas, prometendo revolucionar os métodos atuais de detecção. Além disso, a Nvidia anunciou um compromisso de garantir até US$105 bilhões em pagamentos de aluguel para ajudar a OpenAI a financiar um grande centro de dados em Ohio, destacando o papel crucial da IA no cenário econômico global.", "ciencia": "Um estudo sobre câncer pancreático divulgou seus resultados, embora os detalhes específicos não tenham sido fornecidos. Em outra notícia, pesquisadores descobriram que as águas da Baía de Labrador são responsáveis pelo oxigênio que mantém a vida marinha nas profundezas do Oceano Atlântico Norte, destacando a importância dessas águas para a biodiversidade marinha. Além disso, um novo estudo mostra que as borboletas estão migrando para áreas mais altas devido ao aquecimento global, alterando os habitats alpinos. A NASA escolheu quatro empresas para fornecer serviços de processamento de cargueiros, enquanto a OpenAI financiou um projeto para desenvolver um sistema de compartilhamento de informações para prevenir o uso de inteligência artificial em biowarfare. Por fim, uma pesquisa indica que consumir pelo menos uma bebida adoçada com açúcar diariamente está associado a um risco duas vezes maior de desenvolver câncer gástrico, reforçando o impacto das dietas adoçadas na saúde.", "cultura": "A cultura global continua a se moldar e evoluir. Um exemplo disso é a abertura de um espaço amigável para gatos em Nova Taipei, Taiwan, que visa promover a adoção e o cuidado com os animais de estimação. Em termos econômicos, o fundador da King Slide se tornou o indivíduo mais rico da Taiwan, refletindo o crescimento econômico da região. Na literatura e arte, Mary Heilmann, conhecida por suas abstrações irreverentes, faleceu aos 86 anos, deixando um legado significativo. O Museu de Arte Contemporânea de San Diego anunciou Brett Littman como seu novo diretor, enquanto a SP-Arte Rotas, em São Paulo, busca unir obras de diferentes valores, promovendo a diversidade artística. O assassinato de Tupac Shakur, ocorrido há 30 anos, finalmente está sendo julgado, com Duane Davis sendo acusado de planejar o assassinato para vingar seu sobrinho. Essas notícias ilustram a variedade de temas culturais que permeiam a sociedade atual, desde o cuidado com os animais até a arte e a história do entretenimento.", "sociedade": "Um estudo indica que violência e desigualdade econômica estão custando bilhões de reais ao Brasil a cada ano, afetando a arrecadação pública, atração de investimentos e o crescimento a longo prazo do país. Em São Paulo, a polícia está utilizando a integração de dados de rodovias, Metrô e vigilância privada para rastrear suspeitos e prever crimes, com 15 mil pessoas já capturadas com essa estratégia. Além disso, a matrícula nos SLEP diminuiu 16% entre 2010 e 2025, enquanto a dotação de docentes aumentou 7% e a de assistentes de educação aumentou 11% nos últimos oito anos. A proposta de desalojo de inquilinos inadimplentes será analisada pela Câmara dos Deputados, visando acelerar a devolução de imóveis em casos de inadimplência, ocupações precárias e invasões.", "meio_ambiente": "A história de conservação do Chile completa 100 anos, e o país anunciou a postulação de recursos no valor de US$10,3 milhões ao GEF (Fundo Global para o Meio Ambiente) para criar um fundo patrimonial para os parques nacionais e fortalecer sua gestão a longo prazo. Em meio a uma onda de eventos climáticos extremos, um ciclone extratropical se aproxima do Brasil, causando temporais e fortes rajadas de vento. No exterior, o Rio Reno na Alemanha continua com baixos níveis de água devido à seca, pressionando o transporte fluvial em uma das rotas mais importantes da Europa. Em outros países, agricultores europeus enfrentam uma crise sem precedentes devido a sucessivas ondas de calor intensas e uma seca continental severa, enquanto a coroa-de-espinhos será removida em parques para proteger os recifes. No Brasil, o etanol e o biometano avançam no transporte de cargas, oferecendo novas opções para reduzir a emissão de gases de efeito estufa em setores difíceis de eletrificar. Além disso, os Estados Unidos enfrentam recordes baixos nos níveis de água dos reservatórios, enquanto as empresas de energia priorizam a resistência a incêndios em seus planos para a próxima geração da rede elétrica. No exterior, a Bélgica luta contra um grande incêndio que se aproxima da Alemanha, enquanto milhares de pessoas na Indonésia aguardam auxílio após um terremoto que deixou 53 mortos.", "direitos_humanos": "Um grave retrocesso nos direitos das mulheres foi relatado no Afeganistão, onde os talibãs, após retornarem ao poder em 2021, desmontaram as instituições e serviços voltados para as mulheres em Cabul. Posteriormente, uma série de violações e injustiças foi denunciada, incluindo a exploração de trabalhadores agrícolas caribenhos no Canadá, a possibilidade de reeleição do presidente da FIFA devido a limitações estatutárias de mandato, a violência cometida por seteiros israelenses contra palestinos, restrições impostas a mulheres solteiras no Irã que desejam armazenar ovócitos congelados, a falta de subsídios para hormonioterapia de gênero na Albânia, a exploração financeira de crianças-atores no Brasil, o surto de Ebola na República Democrática do Congo, a situação de refugiadas vulneráveis em Kiev, Ucrânia, e declarações extremistas do ministro de segurança nacional de Israel. Essas denúncias abrangem uma ampla gama de questões relacionadas aos direitos humanos em diferentes regiões do mundo."}, "resumo_do_dia": {"politica_nacional": [{"id": 108080, "titulo": "Após reaproximação, Alcolumbre e Lula trocam afagos em evento da Petrobras no Amapá", "url": "https://g1.globo.com/politica/noticia/2026/08/17/apos-reaproximacao-alcolumbre-e-lula-trocam-afagos-em-evento-da-petrobras-no-amapa.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-17T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) e o presidente do Senado, Davi Alcolumbre (União-AP), trocaram gestos de afeto durante uma visita ao navio-sonda da Petrobras no município de Oiapoque, Amapá. Foi a primeira aparição pública dos dois após a reaproximação política, que ocorreu após a rejeição do nome de Jorge Messias para o STF em abril deste ano.", "titulo_pt": "Após reaproximação, Lula e Alcolumbre trocam afagos em evento da Petrobras no Amapá", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 108072, "titulo": "Caiado chama de estupidez possibilidade de governo Lula retaliar EUA por tarifaço", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/caiado-chama-de-estupidez-possibilidade-de-governo-lula-retaliar-eua-por-tarifaco.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-17T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ronaldo Caiado, candidato do PSD à Presidência, criticou o governo Lula e a possibilidade de o Brasil retaliar os Estados Unidos com tarifas após o tarifaço americano.", "titulo_pt": "Caiado critica possibilidade de governo Lula retaliar EUA com tarifas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 108073, "titulo": "Cury troca de marqueteiro a dez dias do início da propaganda de TV", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/cury-troca-de-marqueteiro-a-dez-dias-do-inicio-da-propaganda-de-tv.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-17T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury, candidato presidencial pelo Avante, trocou seu marqueteiro a dez dias do início do programa eleitoral de TV e rádio, substituindo Leandro Grôppo por Sergio Lima, que já havia trabalhado com o candidato durante a pré-campanha.", "titulo_pt": "Cury troca marqueteiro a dez dias do início da propaganda eleitoral", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 108321, "titulo": "Quem são os candidatos a governador de Pernambuco (PE) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-a-governador-de-pernambuco-pe-nas-eleicoes-2026-agosto", "fonte_id": "jota", "data_pub": "2026-08-17T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Raquel Lyra concorre à reeleição para o governo de Pernambuco, enfrentando João Campos e mais seis candidatos. A lista completa dos concorrentes está disponível.", "titulo_pt": "Quem são os candidatos a governador de Pernambuco nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 108074, "titulo": "Redução de judicialização pode aumentar segurança, dizem especialistas em seminário da Folha", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/seminariosfolha/2026/08/reducao-de-judicializacao-pode-aumentar-seguranca-dizem-especialistas-em-seminario-da-folha.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-17T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas disseram que a redução da judicialização pode aumentar a segurança jurídica, mas que isso exige mudanças em várias áreas, incluindo o Judiciário, o Estado e as empresas, além da adoção de outros métodos para resolver conflitos.", "titulo_pt": "Redução da judicialização pode melhorar segurança jurídica, dizem especialistas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 108081, "titulo": "PT não desistiu do apoio do Centrão no primeiro turno, mesmo com neutralidade dos principais partidos", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/17/pt-nao-desistiu-do-apoio-do-centrao-no-primeiro-turno-mesmo-com-neutralidade-dos-principais-partidos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-17T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Partido dos Trabalhadores (PT), Edinho Silva, afirmou que o partido ainda busca apoio do Centrão no primeiro turno das eleições presidenciais, apesar da neutralidade declarada por principais partidos do grupo. O PT pretende dialogar com essas legendas em prol da reeleição de Lula.", "titulo_pt": "PT não desistiu do apoio do Centrão no primeiro turno, diz presidente do partido", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 108075, "titulo": "Possível entrada de Marçal na disputa eleitoral beneficia Flávio, diz Renan Santos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/possivel-entrada-de-marcal-na-disputa-eleitoral-beneficia-flavio-diz-renan-santos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-17T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renan Santos, candidato à Presidência pelo partido Missão, afirmou que a entrada de Pablo Marçal (PRTB) na disputa eleitoral visa beneficiar Flávio Bolsonaro (PL).", "titulo_pt": "Entrada de Marçal na disputa eleitoral seria manobra para beneficiar Flávio, diz Renan Santos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 108076, "titulo": "Pablo Marçal diz querer ir a debates e que não criará problema para Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/pablo-marcal-diz-que-quer-ir-a-debates-e-que-nao-criara-problema-para-flavio-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-17T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O influenciador Pablo Marçal, que registrou candidatura à Presidência pelo PRTB, declarou que pretende participar dos debates eleitorais e que não vai criar problemas para a candidatura de Flávio Bolsonaro ao Palácio do Planalto. As declarações foram dadas em uma sabatina promovida pelo canal Brasil Paralelo.", "titulo_pt": "Pablo Marçal quer participar de debates e não vai criar problemas para Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 108064, "titulo": "TRE-RJ pede que eleitores confiram se locais de votação se mantêm", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/tre-rj-pede-que-eleitores-confiram-se-locais-de-votacao-se-mantem", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-17T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Regional Eleitoral do Rio de Janeiro (TRE-RJ) pede aos eleitores fluminenses que verifiquem seus locais de votação antes do primeiro turno das eleições, marcado para 4 de outubro. Há alterações em 268 locais de votação afetando cerca de 610 mil eleitores.", "titulo_pt": "TRE-RJ pede que eleitores fluminenses confiram locais de votação antes do primeiro turno", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 108082, "titulo": "Moraes autoriza Bolsonaro a passar por atendimento odontológico", "url": "https://g1.globo.com/politica/noticia/2026/08/17/moraes-autoriza-bolsonaro-a-passar-por-atendimento-odontologico.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-17T20:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes autorizou o ex-presidente Jair Bolsonaro a sair da prisão domiciliar para um atendimento odontológico. Esta será a primeira saída de Bolsonaro desde 4 de maio, quando ele realizou um procedimento no ombro.", "titulo_pt": "Moraes autoriza Bolsonaro a passar por atendimento odontológico", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 108083, "titulo": "Eleições 2026: veja quem são os 13 candidatos à Presidência que pediram registro de candidatura ao TSE", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/17/quem-sao-candidatos-a-presidencia-registro-tse.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-17T20:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O processo eleitoral para a Presidência da República de 2026 começou oficialmente com 13 candidatos que apresentaram suas candidaturas ao Tribunal Superior Eleitoral (TSE) dentro do prazo. O TSE agora analisará as documentações para verificar se os candidatos atendem aos requisitos necessários.", "titulo_pt": "Eleições 2026: veja os 13 candidatos que pediram registro de candidatura ao TSE", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 108065, "titulo": "TSE lança campanha para estimular participação nas eleições 2026", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/tse-lanca-campanha-para-estimular-participacao-nas-eleicoes-2026", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-17T20:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) lançou uma campanha chamada 'Eleições 2026 – Coisa de Pele' para incentivar a participação dos eleitores nas eleições de outubro. A campanha visa mostrar que o eleitor é o protagonista da democracia.", "titulo_pt": "TSE lança campanha para estimular participação nas eleições 2026", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 108323, "titulo": "Dino vê ‘ecossistema criminoso’ de desvio de dinheiro e afasta presidente do TCE-MA", "url": "https://www.jota.info/stf/do-supremo/dino-ve-ecossistema-criminoso-de-desvio-de-dinheiro-e-afasta-presidente-do-tce-ma", "fonte_id": "jota", "data_pub": "2026-08-17T20:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Tribunal de Contas do Estado do Maranhão (TCE-MA), Daniel Brandão, afastou o governador do Maranhão, Carlos Brandão, de um suposto 'ecossistema criminoso' envolvendo o desvio de dinheiro. Daniel Brandão é sobrinho do governador Carlos Brandão.", "titulo_pt": "Dino afasta presidente do TCE-MA de 'ecossistema criminoso' e revela parentesco", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 108066, "titulo": "Filho de Mãe Bernadete desiste de candidatura a deputado federal na BA", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/filho-de-mae-bernadete-desiste-de-candidatura-deputado-federal-na-ba", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-17T19:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jurandy Pacífico, filho de Mãe Bernadete, desistiu da candidatura a deputado federal na Bahia devido a ameaças e preocupações com a segurança da família. A violência que levou à morte de Mãe Bernadete há três anos continua a causar medo na família.", "titulo_pt": "Filho de Mãe Bernadete desiste de candidatura a deputado federal na BA", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 108084, "titulo": "Trabalho da imprensa é 'essencial' para eleições e democracia, diz Kassio Nunes Marques", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/17/trabalho-da-imprensa-e-essencial-para-eleicoes-e-democracia-diz-kassio-nunes-marques.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-17T19:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Tribunal Superior Eleitoral, Kassio Nunes Marques, destacou a importância do trabalho de jornalistas para o processo eleitoral e afirmou que uma imprensa livre é fundamental para a democracia. Essas declarações foram feitas durante a inauguração do Centro de Divulgação das Eleições, destinado a profissionais de imprensa que cobrirão as eleições de outubro.", "titulo_pt": "Trabalho da imprensa é 'essencial' para eleições e democracia, diz Kassio Nunes Marques", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 108085, "titulo": "'Meu maior medo era ser passada como mentirosa', diz dentista após agressões de empresário", "url": "https://g1.globo.com/politica/blog/andreia-sadi/post/2026/08/17/giulia-falcao-entrevista-estudio-i.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-17T19:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Giulia Melo Falcão, ex-mulher de Ivo Vel Kos, empresário acusado de tentativa de homicídio, afirmou que seu maior medo após as agressões era ser considerada mentirosa. Ela relatou que já havia registrado outros boletins de ocorrência contra o ex-marido, incluindo um por estupro matrimônio.", "titulo_pt": "Minha maior preocupação era ser considerada mentirosa", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 107820, "titulo": "German writer tells of Chinese spy in Taiwan", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/18/2003862671", "fonte_id": "taipei_times", "data_pub": "2026-08-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um escritor alemão relatou sobre um suposto agente chinês em Taiwan. O relato não fornece detalhes adicionais sobre a situação.", "titulo_pt": "Alemão relata suposto agente chinês em Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 108336, "titulo": "Australia politics live: Labor and Coalition party rooms to consider deal on gambling ads; Labor wants to adopt AI ‘everywhere we can’", "url": "https://www.theguardian.com/australia-news/live/2026/aug/18/australia-politics-live-labor-coalition-gambling-advertising-ai-charlton-datacentres-question-time-anthony-albanese-angus-taylor-one-nation-pauline-hanson-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-08-17T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O partido Labor propõe um sistema de opção-saída para anúncios de apostas, afirmando que o sistema não reconhece como realmente funciona a internet. O tesoureiro Jim Chalmers considera as mudanças propostas significativas e afirmou que o setor de apostas será responsável pelo custo do registro de opção-saída.", "titulo_pt": "Audiência política australiana: Labor e Coalition irão considerar acordo sobre anúncios de apostas; Labor quer adotar IA 'em todo lugar que for possível'", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 108338, "titulo": "The Incoherence of Trump’s Past Week of Foreign Policy", "url": "https://www.theatlantic.com/newsletters/2026/08/trump-foreign-policy-incoherence-iran/688312/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-08-17T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente discorda tanto dos membros do seu próprio governo, como dos aliados tradicionais dos Estados Unidos, e também da realidade.", "titulo_pt": "A incoerência das últimas semanas de política externa de Trump", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 108061, "titulo": "Suprema Corte dos EUA rejeita novo recurso de Trump em caso de abuso sexual", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/suprema-corte-dos-eua-rejeita-novo-recurso-de-trump-em-caso-de-abuso-sexual.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-17T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte dos Estados Unidos rejeitou o segundo pedido de Donald Trump para revisar uma condenação cível de US$ 5 milhões, relacionada a um caso de abuso sexual contra E. Jean Carroll. A decisão finalizou o processo, mantendo a condenação.", "titulo_pt": "Suprema Corte dos EUA rejeita recurso de Trump em caso de abuso sexual", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 108329, "titulo": "After the Earthquakes", "url": "https://www.nytimes.com/2026/08/17/world/earthquake-response-japan-venezuela.html", "fonte_id": "nyt_world", "data_pub": "2026-08-17T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Venezuela e Japan sofreram terremotos significativos este verão. Suas respostas diferiram, não apenas devido aos recursos financeiros disponíveis.", "titulo_pt": "Depois dos terremotos", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 108500, "titulo": "US pauses construction of border wall through national park in Texas", "url": "https://www.ft.com/content/6aafe865-0bd0-4b18-bf9e-5073fcd91c35?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-17T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A construção de um muro na fronteira foi pausada em um parque nacional no Texas. Equipamentos pesados foram enviados para uma área remota do parque como parte da repressão à imigração de Trump.", "titulo_pt": "EUA pausam construção de muro na fronteira através de parque nacional no Texas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 108534, "titulo": "State Dept. reiterates U.S. remains open to dialogue with N. Korea 'without preconditions'", "url": "https://en.yna.co.kr/view/AEN20260818000900315", "fonte_id": "yonhap_news", "data_pub": "2026-08-17T21:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Estado dos Estados Unidos reiterou que está disposto a manter diálogos com a Coreia do Norte sem condições prévias. Essa posição foi expressa em Washington no dia 17 de agosto.", "titulo_pt": "EUA reiteram disposição para diálogo com Coreia do norte sem pré-condições", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 108123, "titulo": "Bases militares e condenação de Assad: qual é o futuro das relações Rússia e Síria?", "url": "https://www.brasildefato.com.br/2026/08/17/bases-militares-e-condenacao-de-assad-qual-e-o-futuro-das-relacoes-russia-e-siria/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-17T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um tribunal de Damasco condenou o ex-presidente da Síria, Bashar al-Assad, à morte por crimes contra a humanidade e de guerra. A sentença foi dada à revelia, sem que Assad pudesse fazer sua defesa.", "titulo_pt": "Condenação de Assad: qual é o futuro das relações Rússia e Síria?", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 108339, "titulo": "What Trump Officials Mean by “Never”", "url": "https://www.theatlantic.com/ideas/2026/08/todd-blanche-trump-power-abuse/688310/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-08-17T21:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A afirmação de que o presidente não poderia possivelmente fazer algo ilegal é um novo limite de impunidade por parte da administração.", "titulo_pt": "O que os funcionários de Trump significam por 'nunca'", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 108580, "titulo": "New EU sanctions target leaders of Russia’s space industry", "url": "https://spacenews.com/new-eu-sanctions-target-leaders-of-russias-space-industry/", "fonte_id": "spacenews", "data_pub": "2026-08-17T21:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia impôs sanções ao chefe de uma subsidiária da Roscosmos que está desenvolvendo um sistema de satélite de radar de abertura sintética para o exército russo. As sanções fazem parte de uma medida mais ampla contra líderes da indústria espacial russa.", "titulo_pt": "Novas sanções da ue alvo de líderes da indústria espacial russa", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 108480, "titulo": "Israeli forces raid Bethlehem rehabilitation hospital", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-forces-raid-bethlehem-rehabilitation-hospital", "fonte_id": "middle_east_eye", "data_pub": "2026-08-17T21:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças israelenses realizaram uma operação no Hospital de Reabilitação de Bethlehem, assustando pacientes e visitantes e agredindo pessoas no pátio do hospital, conforme relatado pela Wafa. A secretaria de saúde palestina condenou a ação, afirmando que ela viola a lei internacional e compromete os serviços de saúde e o direito fundamental dos pacientes de se tratarem em um ambiente seguro.", "titulo_pt": "Forças israelenses realizam operação no hospital de reabilitação de Bethlehem", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 108390, "titulo": "Former federal prosecutor is suing DOJ for 'unlawful and retaliatory' firing", "url": "https://www.npr.org/2026/08/17/g-s1-138997/former-federal-prosecutor-sue-doj-retaliatory-firing", "fonte_id": "npr_news", "data_pub": "2026-08-17T21:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma ex-procuradora federal que foi demitida este ano está processando o DOJ, afirmando que foi demitida de forma ilegal e vingativa por motivos políticos relacionados ao seu trabalho em um caso contra ativistas anti-aborto.", "titulo_pt": "Ex-procuradora federal processa DOJ por demissão 'ilegal e vingativa' relacionada a caso contra ativistas anti-aborto", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 108406, "titulo": "Declaran alarma meteorológica para zonas de la región de Antofagasta: se esperan para el martes precipitaciones de entre 15 y 25 mm", "url": "https://www.latercera.com/nacional/noticia/declaran-alarma-meteorologica-para-zonas-de-la-region-de-antofagasta-se-esperan-para-el-martes-precipitaciones-de-entre-15-y-25-mm/", "fonte_id": "la_tercera", "data_pub": "2026-08-17T20:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A partir da madrugada de terça-feira, se esperam precipitações intensas em Tocopilla e Taltal, com até 25 mm. As chuvas de segunda-feira já acarretaram a evacuação preventiva de várias comunidades, devido ao aumento do nível de rios.", "titulo_pt": "Alerta meteorológico para regiões de Antofagasta: previstas precipitações de até 25 mm", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 108467, "titulo": "Civilians paying price as Israeli military raises stakes in Lebanon: UNIFIL", "url": "https://www.aljazeera.com/news/2026/8/17/civilians-pay-price-as-israeli-military-activity-rises-in-lebanon-unifil?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-17T20:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A força de paz da ONU registrou, nos últimos dois dias, uma média de 137 projéteis disparados diariamente na região. Civis estão sendo afetados à medida que o exército israelense aumenta as suas operações no Líbano.", "titulo_pt": "Civis pagam o preço à medida que o exército israelense aumenta as suas operações no líbano: UNIFIL", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 108468, "titulo": "Trump says Iran will not make the deal he believes is necessary", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/17/trump-says-iran-will-not-make-the-deal-he-believes-is-necessary?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-17T20:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump afirma que Irã não fará o acordo que ele considera necessário.", "titulo_pt": "Trump diz que Irã não fará o acordo que ele considera necessário", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 108062, "titulo": "Taxa de aprovação de Trump cai para 33%, menor nível de seu mandato", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/taxa-de-aprovacao-de-trump-cai-para-33-menor-nivel-de-seu-mandato.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-17T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa realizada pelo Instituto Ipsos, a pedido da Reuters, mostrou que apenas 33% dos americanos aprovam o trabalho de Donald Trump como presidente. Este é o menor nível de aprovação registrada durante seu mandato.", "titulo_pt": "Aprovação de Trump cai para 33%, menor nível do seu mandato", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 107818, "titulo": "Lai announces NT$10,000 cash handout", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/18/2003862669", "fonte_id": "taipei_times", "data_pub": "2026-08-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governante Lai anunciou um pacote de ajuda financeira no valor de NT$10.000 (New Taiwan Dollars) para os cidadãos do país.", "titulo_pt": "Lai anuncia pacote de ajuda financeira de NT$10.000", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 107836, "titulo": "Taiwan’s excess savings skyrocketing", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/18/2003862654", "fonte_id": "taipei_times", "data_pub": "2026-08-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As economias excessivas em Taiwan estão aumentando significativamente. Este aumento é um indicador do comportamento econômico dos consumidores e das empresas no país.", "titulo_pt": "Economias excessivas em taiwan em alta", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 108144, "titulo": "Petrobras vê Margem Equatorial como caminho para repor reservas do pré-sal", "url": "https://www.cnnbrasil.com.br/infra/petrobras-ve-margem-equatorial-como-caminho-para-repor-reservas-do-pre-sal/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-17T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras considera a descoberta de óleo na Margem Equatorial como um sinal de seu potencial para repor reservas do pré-sal, mas destaca a necessidade de mais estudos para avaliar a viabilidade comercial do achado.", "titulo_pt": "Petrobras vê Margem Equatorial como potencial para repor reservas do pré-sal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 108048, "titulo": "Cada R$ 1 gasto com canetas emagrecedoras, clientes compram R$ 8 em outros produtos, diz CEO da Pague Menos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/cada-r-1-gasto-com-canetas-emagrecedoras-clientes-compram-r-8-em-outros-produtos-diz-ceo-da-pague-menos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cada R$ 1 gasto com canetas emagrecedoras, os clientes das Farmácias Pague Menos compram aproximadamente R$ 8 em outros produtos. O CEO das Farmácias Pague Menos, Jonas Marques, destaca que esses medicamentos, usados para controlar o peso, também geram vendas cruzadas de outros itens.", "titulo_pt": "Cada R$ 1 gasto com canetas emagrecedoras, clientes compram R$ 8 em outros produtos, diz CEO da Pague Menos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 108050, "titulo": "Demitidos da Casas Bahia podem ter desconto nas verbas da rescisão; entenda o pagamento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/demitidos-da-casas-bahia-podem-ter-desconto-nas-verbas-da-rescisao-entenda-o-pagamento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ex-empregados da Casas Bahia receberão as verbas rescisórias com desconto, exceto a contribuição ao INSS, que não pode ser descontada. O pagamento será feito em até três anos.", "titulo_pt": "Ex-funcionários da Casas Bahia terão desconto nas verbas rescisórias", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 108051, "titulo": "Sul perde receitas com lavoura de grãos, mas ganha com proteínas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/vaivem/2026/08/sul-perde-receitas-com-lavoura-de-graos-mas-ganha-com-proteinas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A região Sul tem enfrentado problemas climáticos recentemente, como secas e enchentes, que afetaram a produção agrícola e reduziram a participação dos estados da região na produção nacional de grãos. No entanto, esses estados ganharam em outra área, especificamente na produção de proteínas.", "titulo_pt": "Sul perde receitas com lavoura de grãos, mas ganha com proteínas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 108052, "titulo": "1.242 artigos em nove anos: o que há por trás do De Grão em Grão", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*http Veja", "pais": "Brasil", "classe": "B"}, {"id": 108053, "titulo": "De loja popular a gigante do varejo em crise: veja a trajetória da Casas Bahia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/de-loja-popular-a-gigante-do-varejo-em-crise-veja-a-trajetoria-da-casas-bahia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Grupo Casas Bahia, conhecido por oferecer crédito facilitado e pagamentos a longo prazo para o setor populares, está enfrentando uma crise financeira e pediu recuperação judicial para renegociar R$ 17,3 bilhões em dívidas.", "titulo_pt": "De loja popular a gigante do varejo em crise: veja a trajetória da Casas Bahia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 108054, "titulo": "'Tem petróleo, mas não sabemos quanto', diz presidente da Petrobras sobre descoberta na Foz do Amazonas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/tem-petroleo-mas-nao-sabemos-quanto-diz-presidente-da-petrobras-sobre-descoberta-na-foz-do-amazonas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T20:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A presidente da Petrobras, Magda Chambriard, confirmou a descoberta de petróleo no poço Morpho, localizado na bacia da Foz do Amazonas, no litoral do Amapá. A informação foi divulgada na segunda-feira (17).", "titulo_pt": "Tem petróleo, mas não sabemos quanto", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 108322, "titulo": "Galípolo alerta para uso de linha emergencial de crédito e fala em defesa do PIX", "url": "https://www.jota.info/tributos-e-empresas/mercado/galipolo-alerta-para-uso-de-linha-emergencial-de-credito-e-fala-em-defesa-do-pix", "fonte_id": "jota", "data_pub": "2026-08-17T20:26:00Z", "idioma": "pt", ", "titulo_pt": "O que é El Niño? Saiba sobre os impactos na meteorologia, na água e na economia Global", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 108524, "titulo": "AI automation startup Relay shuts down, staff joins Google’s Chrome team", "url": "https://techcrunch.com/2026/08/17/ai-automation-startup-relay-shuts-down-staff-joins-googles-chrome-team/", "fonte_id": "techcrunch", "data_pub": "2026-08-17T21:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup Relay, que desenvolvia automação com inteligência artificial, encerrou suas operações. O fundador e CEO Jacob Bank e sua equipe foram absorvidos pela equipe do Chrome da Google.", "titulo_pt": "Startup Relay de IA fecha e equipe junta-se ao time do Chrome da Google", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 108153, "titulo": "Tecnologia inspirada em borboletas promete revolucionar monitoramento do ar", "url": "https://www.cnnbrasil.com.br/ciencia/tecnologia-inspirada-em-borboletas-promete-revolucionar-monitoramento-do-ar/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-17T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores chineses desenvolveram um sistema sem bomba, de baixo custo e com alta sensibilidade para monitorar poluentes e vírus no ar. Este sistema promete revolucionar métodos atuais de detecção.", "titulo_pt": "Tecnologia inspirada em borboletas promete revolucionar monitoramento do ar", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 108164, "titulo": "Uso de IA pode gerar “dívida cognitiva”, alerta estudo", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/uso-de-ia-pode-gerar-divida-cognitiva-alerta-estudo/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-17T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que o uso de inteligência artificial pode gerar uma 'dívida cognitiva', ou seja, pode levar a uma diminuição do esforço mental independente. O estudo sugere que a IA seja considerada um recurso complementar ao aprendizado, não como substituto para o esforço mental autônomo.", "titulo_pt": "Uso de IA pode gerar 'dívida cognitiva', alerta estudo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 108402, "titulo": "Meta enfrenta en California la batalla más importante hasta la fecha sobre los daños que las redes sociales causan a los niños", "url": "https://www.latercera.com/mundo/noticia/meta-enfrenta-en-california-la-batalla-mas-importante-hasta-la-fecha-sobre-los-danos-que-las-redes-sociales-causan-a-los-ninos/", "fonte_id": "la_tercera", "data_pub": "2026-08-17T20:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Facebook comparecerá em tribunal em Oakland, Califórnia, onde a empresa foi demandada por vários estados americanos que buscam uma indenização de mais de 1,4 trilhões de dólares e pedem mudanças na operação de Facebook e Instagram. A audiência ocorrerá nesta terça-feira.", "titulo_pt": "Meta enfrenta na califórnia a batalha mais importante sobre os danos das redes sociais aos crianças", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 108055, "titulo": "Cansado da porcaria gerada por IA? As gigantes da tecnologia também", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/cansado-da-porcaria-gerada-por-ia-as-gigantes-da-tecnologia-tambem.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T20:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial produziu conteúdos de baixa qualidade em várias plataformas, como receitas enganosas no Google, anúncios falsos na Amazon e imagens enganosas no Facebook.", "titulo_pt": "Cansado da porcaria gerada por IA? As gigantes da tecnologia também", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 108516, "titulo": "The Moon's shadow raced across the heart of Spain, and I was there to see it", "url": "https://arstechnica.com/space/2026/08/the-moons-shadow-raced-across-the-heart-of-spain-and-i-was-there-to-see-it/", "fonte_id": "ars_technica", "data_pub": "2026-08-17T20:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um eclipse solar total avançou por uma região a 90 minutos ao norte de Madri, e o autor estava presente para assisti-lo.", "titulo_pt": "A sombra da lua correu pelo centro da Espanha, e eu estava lá para vê-la", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 108525, "titulo": "‘Unprecedented’ number of Apple users received recent spyware alert, say investigators", "url": "https://techcrunch.com/2026/08/17/unprecedented-number-of-apple-users-received-recent-spyware-alert-say-investigators/", "fonte_id": "techcrunch", "data_pub": "2026-08-17T20:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores de segurança cibernética relatam que um número inusitadamente alto de usuários do Apple recebeu uma notificação recente sobre uma ameaça de espionagem.", "titulo_pt": "Número 'inédito' de usuários do Apple receberam alerta recente de espionagem, dizem investigadores", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 108533, "titulo": "This R-Rated Film Studio Wants to Be the HBO of AI", "url": "https://www.wired.com/story/this-r-rated-film-studio-wants-to-be-the-hbo-of-ai/", "fonte_id": "wired", "data_pub": "2026-08-17T20:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rogue Studios, um novo estúdio de produção de conteúdo adulto usando inteligência artificial, está apostando no futuro de conteúdo 'sophisticado' e picante. A empresa visa se tornar o equivalente de HBO para esse tipo de conteúdo.", "titulo_pt": "Este estúdio R-Rated quer ser o HBO do AI", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 108517, "titulo": "As Wisconsin cities flee Flock, its shared camera network loses value", "url": "https://arstechnica.com/tech-policy/2026/08/as-wisconsin-cities-flee-flock-its-shared-camera-network-loses-value/", "fonte_id": "ars_technica", "data_pub": "2026-08-17T20:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias cidades do Wisconsin estão abandonando a rede Flock, resultando em uma diminuição do valor da rede compartilhada de câmeras. O efeito rede pode funcionar em reverso quando a adesão diminui.", "titulo_pt": "As cidades do Wisconsin abandonam a Flock, reduzindo o valor da rede de câmeras compartilhadas", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 108518, "titulo": "Supreme Court rejects Verizon bid for $47 million refund of FCC fine", "url": "https://arstechnica.com/tech-policy/2026/08/supreme-court-rejects-verizon-bid-for-47-million-refund-of-fcc-fine/", "fonte_id": "ars_technica", "data_pub": "2026-08-17T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Corte Suprema rejeitou o pedido da Verizon por um reembolso de 47 milhões de dólares de uma multa da FCC, apesar do resultado negativo, as operadoras continuam a afirmar que vender dados de localização de dispositivos não é ilegal.", "titulo_pt": "Suprema corte rejeita pedido da Verizon por reembolso de 47 milhões de dólares de multa da FCC", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 108600, "titulo": "China bounces back from Long March rocket explosion with back-to-back launches (video)", "url": "https://www.space.com/space-exploration/launches-spacecraft/china-bounces-back-from-long-march-rocket-explosion-with-back-to-back-launches-video", "fonte_id": "space_com", "data_pub": "2026-08-17T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China retornou às operações espaciais após uma explosão do foguete Long March 7A em 10 de agosto, realizando duas lançagens consecutivas de foguetes Long March 12 e Long March 2C no dia 16 de agosto.", "titulo_pt": "China retorna às operações espaciais com lançamentos sucessivos após explosão", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 107826, "titulo": "Pancreatic cancer study shares findings", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/18/2003862684", "fonte_id": "taipei_times", "data_pub": "2026-08-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo sobre câncer pancreático compartilhou seus resultados. Os detalhes específicos do estudo não foram mencionados nessa notícia.", "titulo_pt": "Estudo sobre câncer pancreático divulga resultados", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 108555, "titulo": "Researchers identify ways to reduce the lag between biodiversity data and action", "url": "https://phys.org/news/2026-08-ways-lag-biodiversity-action.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A biodiversidade é extremamente diversa, imensamente observada de forma desigual e constantemente em movimento no espaço e no tempo, tornando seu monitoramento mais difícil do que muitas outras partes do ambiente. Isso faz com que a gestão da biodiversidade dependa frequentemente de informações incompletas, atrasadas ou distribuídas de forma desigual.", "titulo_pt": "Investigadores identificam maneiras de reduzir atraso entre os dados da biodiversidade e a ação", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 108556, "titulo": "Can computers learn what makes the most iconic jazz musicians stand out?", "url": "https://phys.org/news/2026-08-iconic-jazz-musicians.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos utilizando modelos de aprendizado de máquina conseguem identificar pianistas de jazz famosos a partir de gravações e revelam os elementos musicais únicos que tornam os performers individuais reconhecíveis. O trabalho, publicado na Nature Machine Intelligence, pode oferecer insights sobre atribuição artística, estilo, herança cultural e educação musical.", "titulo_pt": "Os computadores podem aprender a identificar os pianistas de jazz mais icônicos?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 108557, "titulo": "Pesticides make Argentine ants go crazy, sending them roaming or clustering before workers die", "url": "https://phys.org/news/2026-08-pesticides-argentine-ants-crazy-roaming.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nova pesquisa da UC Riverside demonstra que o comportamento das formigas argentinas muda quando químicos pesticidas se propagam pela colônia, levando-as a se comportarem de forma diferente antes de os trabalhadores morrerem. Não se pode assumir que um aumento na atividade das formigas após o uso de armadilhas de pesticida indica que o tratamento falhou.", "titulo_pt": "Pesticidas alteram o comportamento das formigas argentinas antes de matá-las", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 108558, "titulo": "Labrador Sea a key player in providing oxygen for deep North Atlantic life", "url": "https://phys.org/news/2026-08-labrador-sea-key-player-oxygen.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Cornell University identificaram as águas agitadas da Baía de Labrador como a origem do oxigênio que mantém a vida marinha nas profundezas do Oceano Atlântico Norte.", "titulo_pt": "Baía de labrador chave para fornecimento de oxigênio para a vida marinha profunda do atlântico norte", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 108509, "titulo": "China’s space race has a new problem: finding room for failure", "url": "https://www.scmp.com/opinion/china-opinion/article/3364147/chinas-space-race-has-new-problem-finding-room-failure?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-17T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há algo sobre a velocidade com que se chega a um consenso sobre os fracassos dos foguetes chineses que merece ser questionado. Poucas horas após a desintegração do foguete Long March-7A sobre o Mar do Sul da China em 10 de agosto, relatórios de comércio apontavam para um motor como o possível culpado, mas a Corporação de Ciência e Tecnologia Aeroespacial da China (CASC) não havia feito tal declaração.", "titulo_pt": "China's space race tem novo problema: encontrar espaço para falhas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 108559, "titulo": "Quantum light engine links atom-photon thermodynamics to classical physics", "url": "https://phys.org/news/2026-08-quantum-links-atom-photon-thermodynamics.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os físicos da Universidade de Basileia, Suíça, desenvolveram uma abordagem teórica que une a termodinâmica clássica à física quântica, especialmente em sistemas compostos por átomos e partículas de luz.", "titulo_pt": "Motor quântico de luz conecta termodinâmica de átomos e fótons ao físico clássico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 108438, "titulo": "Kindergarten vaccine exemptions rose in 2025-2026: CDC", "url": "https://www.axios.com/2026/08/17/kindergarten-vaccine-rates-fall", "fonte_id": "axios", "data_pub": "2026-08-17T21:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As taxas de vacinação entre os alunos do jardim de infância nos Estados Unidos diminuíram durante o ano letivo de 2025-2026 para todas as vacinas monitoradas. O número de exceções a vacinação aumentou em 41 estados e no Distrito de Columbia, passando de 3,6% para 4,2%.", "titulo_pt": "Exceções a vacinação aumentaram entre alunos do jardim de infância nos EUA em 2025-2026: CDC", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 108560, "titulo": "How rugged gullies protect hidden rainforests in the Greater Blue Mountains", "url": "https://phys.org/news/2026-08-rugged-gullies-hidden-rainforests-greater.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores descobririram comunidades de florestas tropicais ocultas nas ásperas ravinas da Área de Patrimônio Mundial das Maiores Montanhas Azuis, protegendo vegetação que não cresce em nenhum outro lugar.", "titulo_pt": "Como ravinas ásperas protegem florestas tropicais ocultas na grande serra azul", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 108561, "titulo": "Butterflies on the move to higher ground as warming redraws Alpine habitats", "url": "https://phys.org/news/2026-08-butterflies-higher-ground-redraws-alpine.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As borboletas estão se mudando para áreas mais altas devido ao aquecimento global, que reconfigura os habitats alpinos. Diante do aquecimento das condições climáticas em seus habitats tradicionais, as espécies precisam se adaptar ou migrar para locais mais adequados.", "titulo_pt": "Borboletas se mudam para altitudes mais elevadas devido ao aquecimento global que redefine os habitats alpinos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 108562, "titulo": "Brazil's vast coastline could help address food insecurity through sustainable seafood", "url": "https://phys.org/news/2026-08-brazil-vast-coastline-food-insecurity.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova pesquisa sobre o consumo e produção de peixes no Brasil destaca como o país, um dos mais populosos do mundo, pode construir sistemas alimentares mais saudáveis e sustentáveis através do incentivo ao consumo de maior quantidade de peixe, do desenvolvimento de aquicultura sustentável e diversificada nutricionalmente, e de uma gestão mais eficiente das pesca.", "titulo_pt": "Costa vasta do Brasil pode contribuir para a segurança alimentar através da pesca sustentável", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 108563, "titulo": "Observations since 1850 reveal regional climate fingerprints of human-induced warming", "url": "https://phys.org/news/2026-08-reveal-regional-climate-fingerprints-human.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Observações desde 1850 revelam padrões regionais do aquecimento global humano. O aumento da temperatura global atual é indubitavelmente causado pelo homem, com o aquecimento dominando as flutuações climáticas naturais, mas identificar como ele se manifesta regionalmente ainda é um desafio.", "titulo_pt": "Observações desde 1850 mostram rastros regionais do aquecimento humano", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 108564, "titulo": "Engineered E. coli convert kimchi radish waste into biodegradable bioplastic", "url": "https://phys.org/news/2026-08-coli-kimchi-radish-biodegradable-bioplastic.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas do Instituto do Kimchi do Mundo (WiKim) desenvolveram uma estratégia de engenharia microbiana que permite transformar resíduos de raiz de rússula utilizados na produção de kimchi em bioplásticos biodegradáveis. Este processo utiliza um modelo genômico para racionalmente engenheirar cepas microbianas específicas para o hidrolisado de raiz de rússula.", "titulo_pt": "Engenheiros E. Coli convertem resíduos de rússula de kimchi em bioplástico biodegradável", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 108311, "titulo": "Subir escadas é mesmo um bom exercício: estudo aponta queda no risco de morte precoce", "url": "https://veja.abril.com.br/saude/subir-escadas-e-mesmo-um-bom-exercicio-estudo-aponta-queda-no-risco-de-morte-precoce/", "fonte_id": "veja", "data_pub": "2026-08-17T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo avaliou dados de mais de 480.000 pessoas entre 35 e 84 anos e constatou que subir escadas pode reduzir em 39% o risco de morte por problemas cardiovasculares.", "titulo_pt": "Subir escadas é um bom exercício que diminui o risco de morte precoce por problemas cardiovasculares, sugere estudo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 108581, "titulo": "NASA Selects Companies to Provide Payload Processing Services", "url": "https://www.nasa.gov/news-release/nasa-selects-companies-to-provide-payload-processing-services/", "fonte_id": "nasa_news", "data_pub": "2026-08-17T20:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA selecionou quatro empresas para fornecer serviços de processamento de cargueiros sob a provisão do contrato de Operações de Processamento de Naves Espaciais. Essa provisão permite que provedores qualificados ofereçam serviços de processamento de cargueiros comerciais para missões da agência que lançarão de várias localizações, onde as capacidades não estavam disponíveis no momento do contrato inicial.", "titulo_pt": "NASA seleciona empresas para serviços de processamento de cargueiros", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 108553, "titulo": "OpenAI funds research to try to stop AI from being used to make bioweapons", "url": "https://www.scientificamerican.com/article/openai-funds-research-to-try-and-stop-ai-from-being-used-to-make-bioweapons/", "fonte_id": "scientific_american", "data_pub": "2026-08-17T19:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup OpenAI financiou um projeto que irá desenvolver um sistema internacional de compartilhamento de informações para identificar ameaças à biosegurança provenientes de inteligência artificial.", "titulo_pt": "Openai investe em pesquisa para prevenir o uso de IA em bioterrorismo", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 107834, "titulo": "New Taipei opens cat-friendly space to promote pet care, adoption", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/18/2003862692", "fonte_id": "taipei_times", "data_pub": "2026-08-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cidade de Nova Taipei abriu um espaço amigável para gatos com o objetivo de promover o cuidado com os animais de estimação e a adoção. O local visa aumentar a conscientização e a responsabilidade em relação aos pets.", "titulo_pt": "Nova Taipei abre espaço amigável para gatos para promover cuidado e adoção de animais de estimação", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 107838, "titulo": "China embracing the hamburger with both hands", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/18/2003862656", "fonte_id": "taipei_times", "data_pub": "2026-08-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China está adotando o hambúrguer de forma ampla. O país está expandindo a produção e a distribuição de hambúrgueres, refletindo a crescente influência do fast-food global.", "titulo_pt": "China abraçando o hambúrguer com ambas as mãos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 107840, "titulo": "King Slide founder becomes Taiwan’s richest person", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/18/2003862658", "fonte_id": "taipei_times", "data_pub": "2026-08-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O fundador da King Slide se tornou a pessoa mais rica da Taiwan. A informação se refere a um indivíduo que alcançou o topo da
