  </div>
</div>

<script>
const D = {"gerado_em": "24/11/2026 15:30", "stats": {"noticias_novas": 1012, "resumos_gerados": 248}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva cancelou uma reunião com a equipe econômica para participar do velório do jurista Fábio Konder Comparato em São Paulo. O evento ocorreu na madrugada do dia 24 de outubro. Em Brasília, o ex-presidente Jair Bolsonaro apresentou melhora em seu quadro de obstrução intestinal, mas ainda não há previsão de alta do hospital DF Star, onde está internado. Em São Paulo, o governo anunciou que não vai fechar por um dia se isso evitar mortes, referindo-se à opção de fechar uma vez na semana, adotada por algumas empresas, que não representa um risco à segurança dos trabalhadores. A situação é comparada a práticas adotadas em outros países, como na Europa, que fecha aos domingos. Além disso, a arrecadação federal atingiu um novo recorde em outubro, com R$ 294 bilhões, um aumento real de 7,3% em comparação com o mesmo período do ano anterior.", "mundo": "Mais de 300 russos morreram em Mali nos últimos três anos, de acordo com dados exclusivos. O líder do Partido Comunista em Shanghai, Chen Jining, está sendo investigado por suspeitas de corrupção, em uma quarta investigação de um membro do Politburo desde o ano passado. A Corte Suprema de Apelações da França confirmou a condenação de Eric Zemmour por contestar crimes contra a humanidade, referindo-se à afirmação de que Pétain salvou judeus franceses durante a Segunda Guerra Mundial. A prisão de Isidro, conhecido como o Chapo, oferece uma chance para seus antigos comparsas fornecerem informações e negociarem uma redução de suas penas. A Corte Europeia de Direitos Humanos decidiu que os Estados do Conselho da Europa podem rejeitar migrantes, mesmo em condições 'hostis', desde que não haja provas de que eles possam ser submetidos a tratamento cruel, insano ou degradante. O Reino Unido impôs sanções às Forças de Houthi no Iêmen, acusando o grupo de abusos graves de direitos humanos e de tentar minar a estabilidade no Oriente Médio, sem mencionar a aliança com a Arábia Saudita. O Brasil recuperou a certificação de país livre do sarampo em menos de cinco anos após um surto recorde, considerado uma lição para os Estados Unidos, que recentemente perderam esse status. A aprovação do primeiro-ministro australiano Anthony Albanese caiu a níveis históricos, atingindo seu maior nível de desaprovação, com a população se opondo fortemente a centrais de dados de IA.\n\nA geopolítica global enfrenta uma série de tensões e conflitos em vários pontos do mundo. Na Arábia Saudita, o edifício-símbolo 'PIF Tower', que abriga a sede do fundo de riqueza soberana, foi atingido por supostos ataques de drone por dois dias seguidos, resultando em doze feridos. O ministro das Finanças saudita, Mohammed al-Jadaan, declarou que o reino é capaz de resistir a um conflito prolongado com os hutitas no Iêmen, rejeitando a ideia de que ataques a infraestrutura civil ou 'blackmail por mísseis' poderiam ameaçar a segurança nacional. No Iêmen, o Ministério da Economia estima que as perdas econômicas causadas pelos ataques da Arábia Saudita e pelo bloqueio tenham ultrapassado 1,13 trilhões de dólares desde o início da guerra em março de 2015. Em outra frente, a Rússia acusa a Estônia de realizar 'ações hostis' e advertiu que suas medidas na fronteira poderiam levar a uma guerra aberta, com a capital Tallin planejando fechar os cruzamentos rodoviários a partir de dezembro. Além disso, a Rússia também acusa a NATO de hostilidades, com o ministro das Relações Exteriores russo, Sergei Lavrov, alegando que a Estônia está 'em um limbo' entre a guerra e a paz.", "economia": "A arrecadação federal registrou um novo recorde em outubro, com um aumento de 7,3% em relação ao mesmo mês do ano anterior, totalizando R$ 293,975 bilhões. Este resultado contribuiu para um crescimento real de 7% no acumulado do ano, em comparação com o mesmo período do ano anterior. Em outro destaque, a Petrobras aprovou um plano de negócios para o período de 2027 a 2031, com investimentos totais previstos de US$ 122 bilhões, sendo que US$ 113 bilhões serão destinados a projetos em implantação. Ainda sobre a Petrobras, a empresa aprovou a aquisição de 42% da Neomille S.A., produtora de etanol de milho, por R$ 2,8 bilhões, com o objetivo de produzir e comercializar combustíveis de baixo carbono. Outro destaque é a criação da Rede dos Bancos Centrais dos Países de Língua Portuguesa, oficializada em 4 de novembro durante uma reunião em Luanda, Angola, com o objetivo de compartilhar conhecimento e experiências entre os bancos centrais.", "tecnologia": "O retorno de Jensen Huang à Nvidia trouxe alívio para a indústria de inteligência artificial, mas várias questões permanecem. Huang, o CEO reinstalado, se retratou diante dos funcionários, admitindo ter violado o código de conduta da empresa e cometido erros pessoais. O Departamento do Comércio dos Estados Unidos incluiu a Megaspeed na Lista de Entidades, proibindo o comércio com a empresa devido a riscos de segurança nacional. O retorno de Huang também tem implicações geopolíticas, com especialistas vendo essa movimentação como uma vitória para a China, embora não represente um alívio para Pequim em suas relações internacionais. Além disso, a Anthropic criou uma armadilha para testar se os agentes de inteligência artificial podem resistir a tentações que os fariam agir de maneira inadequada, enquanto a empresa ElipseAI, após ser adquirida por um holding canadense, inicia uma nova fase de expansão internacional. A adoção rápida da inteligência artificial está pressionando as redes de empresas, com tarefas realizadas por agentes de IA estimando gerar 450% mais tráfego de rede do que as mesmas tarefas realizadas por trabalhadores humanos.", "ciencia": "A NASA recentemente divulgou novos detalhes sobre a supernova Cassiopeia A, usando imagens do Telescópio Espacial James Webb. As imagens, obtidas no infravermelho, mostram a poeira quente que compõe o resíduo da explosão estelar. Paralelamente, a missão Dragonfly da NASA está em desenvolvimento, com a instalação de equipamentos científicos, incluindo o DragonCam, no Laboratório Aplicado de Física da Johns Hopkins. Esses avanços tecnológicos e científicos representam um passo significativo na exploração do espaço e na compreensão do universo. Além disso, a NASA também divulgou uma imagem do dia mostrando a interação de galáxias no grupo NGC 7771, destacando a dinâmica das estruturas cósmicas. Em um contexto mais próximo da Terra, a vacinação contra a hepatite B em recém-nascidos tem diminuído drasticamente, levando a preocupações sobre a propagação da doença do fígado. A descoberta de um novo subtipo de depressão associado ao relógio biológico pode indicar a necessidade de tratamentos personalizados, enquanto a identificação de uma quasar mais distante ajuda a esclarecer cenários de formação de buracos negros. Estes avanços científicos e tecnológicos demonstram a importância da pesquisa contínua em diversos campos, desde a astronomia até a medicina.", "cultura": "Em 2027, o Brasil receberá um show histórico com a dupla Lauryn Hill e Wyclef Jean, celebrando os 30 anos do álbum 'The Score' do Fugees, no Nubank Parque em São Paulo. Este evento marcará uma celebração cultural significativa, reunindo fãs e admiradores dos artistas. Outro desenvolvimento cultural notável é a Record planejando exibir um especial de fim de ano com Amado Batista durante o feriado de Natal, tentando disputar audiência com o filme 'Amor Eterno' na Globo. Internamente, a Amazon assinou um contrato exclusivo com Ullisses Campbell, criador de 'Tremembé', uma série de grande sucesso na plataforma, dando a Campbell várias funções na empresa. A Ópera de Paris negou acusações de antisemitismo em relação à montagem da ópera 'The Clemency of Titus', dirigida por Willy Decker em 1997.", "sociedade": "No ano de 2025, o relatório da ONU registrou nove mortes suspeitas de violência doméstica e familiar, representando 60% dos casos de feminicídios do ano anterior. Em São Paulo, 10 pessoas perderam a vida devido às chuvas em um mês. No Rio de Janeiro, 11 crianças foram mortas durante as operações de segurança na região metropolitana, mas essas mortes não foram incluídas nas estatísticas oficiais de letalidade policial. Além disso, a Axios analisou que a redução da idade de elegibilidade para o Medicare pode ser mais difícil de ser implementada do que parece. O concurso para professores em São Paulo oferece 5.000 vagas em dez disciplinas, com salários iniciais que variam até R$ 5.565.", "meio_ambiente": "O evento mais importante dos artigos foi a COP31 em Antalya, na Turquia. Apesar de não ter chegado a um acordo sobre um 'pacto' que abordava questões relacionadas a alimentos, florestas, oceanos e natureza, a conferência reafirmou a necessidade de cooperação internacional para enfrentar a crise climática. Em uma fazenda leiteira na província de Córdoba, na Argentina, houve uma redução de 31% na emissão de metano sem afetar a produção de leite, através do uso de um suplemento natural feito com compostos bioativos vegetais. A LATAM e a Siemens firmaram seu primeiro acordo na América do Sul para reduzir as emissões de gases do efeito estufa dos voos de negócios de seus funcionários através do uso de atributos ambientais associados ao SAF (Combustível de Aviação Sustentável).", "direitos_humanos": "A ONU Mulheres relata que cinco mulheres são assassinadas a cada hora por parceiros ou parentes em todo o mundo, mostrando o perigo que as mulheres enfrentam em suas próprias casas. Em outra notícia, a American Civil Liberties Union está ampliando suas lutas pelo direito à votação em estados conservadores após as eleições de meio-termo. Em relação aos direitos humanos, a Malásia planeja devolver 6.803 refugiados birmaneses, enquanto a Amnesty International UK pede ao governo britânico para impedir a Amana, uma organização israelense, de estimular a imigração para assentamentos ilegais na Cisjordânia. Além disso, a cantora iraniana Parastoo Ahmadi recebeu 74 chicotadas por se apresentar sem véu no YouTube, e famílias estão sob pressão devido à Ebola, com as mulheres e garotas suportando grande parte do impacto."}, "resumo_do_dia": {"politica_nacional": [{"id": 284083, "titulo": "Bolsonaro tem melhora em quadro de obstrução intestinal, mas segue sem previsão de alta", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/11/bolsonaro-tem-melhora-em-quadro-de-obstrucao-intestinal-mas-segue-sem-previsao-de-alta.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro apresentou melhora em seu quadro de obstrução intestinal, mas ainda não há previsão de alta. O boletim médico foi divulgado pelo hospital DF Star, onde ele está internado em Brasília.", "titulo_pt": "Bolsonaro apresenta melhora em obstrução intestinal, mas sem previsão de alta", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 284098, "titulo": "Lula cancela reunião com equipe econômica e vai a velório de jurista em SP", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/lula-cancela-reuniao-com-equipe-economica-e-vai-a-velorio-de-jurista-em-sp.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva cancelou uma reunião com a equipe econômica para participar do velório do jurista Fábio Konder Comparato. A reunião estava prevista para ocorrer na terça-feira (24) e foi substituída pela participação no velório do jurista, que faleceu durante a madrugada.", "titulo_pt": "Lula cancela reunião com equipe econômica e vai ao velório de jurista em SP", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 284329, "titulo": "O que se sabe e o que ainda não está definido sobre a posse de Lula em 2027", "url": "https://www.bbc.com/portuguese/articles/cmewv01z9n7wo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-24T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cerimônia de posse de Lula em 2027 será realizada no dia 5 de janeiro e incluirá atrações internacionais como Roger Waters e Bad Bunny.", "titulo_pt": "O que se sabe e o que ainda não está definido sobre a posse de Lula em 2027", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 284067, "titulo": "Milei foi desconvidado para posse de Lula, diz jornal argentino", "url": "https://g1.globo.com/mundo/noticia/2026/11/24/milei-desconvidado-posse-lula-diz-jornal.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-24T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente argentino, Javier Milei, foi desconvidado para a cerimônia de posse do presidente eleito do Brasil, Luiz Inácio Lula da Silva, que ocorrerá em 5 de janeiro em Brasília, segundo informou o jornal argentino Clarín.", "titulo_pt": "Milei foi desconvidado para a posse de Lula, diz jornal argentino", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 284068, "titulo": "Justiça italiana adia para fevereiro reavaliação do pedido de extradição de Carla Zambelli", "url": "https://g1.globo.com/politica/noticia/2026/11/24/justica-italiana-adia-para-fevereiro-reavaliacao-do-pedido-de-extradicao-de-carla-zambelli.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-24T16:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça italiana adiou para fevereiro de 2027 a reavaliação do pedido de extradição de Carla Zambelli. A audiência inicialmente prevista para 24 de outubro foi transferida para 2 de fevereiro de 2027.", "titulo_pt": "Justiça italiana adia para fevereiro reavaliação do pedido de extradição de Carla Zambelli", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 284085, "titulo": "Fachin determina que liquidantes do Master e BC se manifestem sobre pedido do BRB por recursos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/fachin-determina-que-liquidantes-do-master-e-bc-se-manifestem-sobre-pedido-do-brb-por-recursos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T16:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, Edson Fachin, determinou que os liquidantes do Banco Master e o Banco Central se manifestem sobre o pedido do BRB para desbloqueio de recursos relacionados à investigação de fraude financeira envolvendo Daniel Vorcaro.", "titulo_pt": "Fachin determina que liquidantes do Master e BC se manifestem sobre pedido do BRB por recursos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 284069, "titulo": "PCC foca em rotas do tráfico a partir do Sudeste e CV aposta no controle do território no Norte e Nordeste, mostra estudo da Abin", "url": "https://g1.globo.com/politica/noticia/2026/11/24/pcc-cv-estudo-abin-forum-brasileiro-seguranca-publica.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-24T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Agência Brasileira de Inteligência (Abin) em parceria com o Fórum Brasileiro de Segurança Pública (FBSP) revela que o Primeiro Comando da Capital (PCC) se concentra no tráfico internacional de cocaína e no controle de rotas estratégicas no Sudeste, enquanto o Comando Vermelho (CV) se expande pelo Norte e Nordeste, dominando territórios e comunidades urbanas.", "titulo_pt": "PCC e CV adotam estratégias diferentes para expandir seus negócios ilícitos, mostra estudo", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 284070, "titulo": "'Ninguém vai morrer se fechar um dia', diz ministro sobre fim da escala 6x1", "url": "https://g1.globo.com/economia/noticia/2026/11/24/ninguem-vai-morrer-se-fechar-um-dia-diz-ministro-sobre-fim-da-escala-6x1.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-24T16:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Trabalho, Luiz Marinho, afirmou que a opção de fechar uma vez na semana, adotada por algumas empresas, não representa um risco à segurança dos trabalhadores. Ele comparou a situação com práticas adotadas em outros países, como a Europa, que fecha aos domingos.", "titulo_pt": "Ninguém vai morrer se fechar um dia", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 284086, "titulo": "Programa do governo de SP destina R$ 20 milhões do crime organizado para investimentos em segurança", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/programa-do-governo-de-sp-destina-r-20-milhoes-do-crime-organizado-para-investimentos-em-seguranca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O programa de recuperação de ativos do governo de São Paulo destinou R$ 20,2 milhões às polícias Civil, Militar e Técnico-Científica desde sua criação, em 2024. O valor foi usado para investimentos em segurança.", "titulo_pt": "Programa do governo de SP destina R$ 20 milhões do crime organizado para investimentos em segurança", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 284087, "titulo": "Investigadores veem lacunas e alcance limitado em relatórios da PF sobre relação do STF com Master", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/investigadores-veem-lacunas-e-alcance-limitado-em-relatorios-da-pf-sobre-relacao-do-stf-com-master.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investigadores avaliam que os relatórios da Polícia Federal sobre as menções a ministros do STF em mensagens encontradas nos celulares de Daniel Vorcaro têm alcance limitado e pouco contribuem com informações novas. O método utilizado para a confecção desses documentos teria restringido o alcance final.", "titulo_pt": "Investigadores veem alcance limitado em relatórios da PF sobre STF e Master", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 284088, "titulo": "Ex-superintendente do Cade diz que PL das big techs amplia insegurança jurídica e eleva custos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/ex-superintendente-do-cade-diz-que-pl-das-big-techs-amplia-inseguranca-juridica-eleva-custos-e-afeta-usuario-no-brasil.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T15:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-superintendente geral do Cade, Carlos Ragazzo, afirma que o PL das big techs não apresenta critérios claros para intervenção no mercado e pode aumentar a insegurança jurídica, afetar a experiência do usuário e elevar custos das empresas.", "titulo_pt": "Ex-superintendente do Cade critica PL das big techs por insegurança jurídica e aumento de custos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 284071, "titulo": "Relatórios da PF têm citações a Moraes, Nunes e Toffoli, mas deixam de fora diálogos e documentos que poderiam indicar conexão com Vorcaro", "url": "https://g1.globo.com/politica/noticia/2026/11/24/relatorios-da-pf-tem-citacoes-a-moraes-nunes-e-tofolli-mas-deixam-de-fora-dialogos-e-documentos-que-poderiam-indicar-conexao-com-vorcaro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-24T15:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal usou apenas citações a ministros do Supremo Tribunal Federal nos relatórios sobre as relações com Daniel Vorcaro, deixando de lado imagens e documentos que poderiam indicar uma possível conexão. A PF nega a omissão.", "titulo_pt": "Relatórios da PF sobre Vorcaro mencionam ministros do stf, mas ignoram documentos que poderiam indicar conexão", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 284072, "titulo": "Conservadores cristãos e classe D e E somam quase metade do eleitorado brasileiro, diz Quaest", "url": "https://g1.globo.com/politica/noticia/2026/11/24/segmentos-identitarios-quaest-2026.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-24T15:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest revelou que quase metade do eleitorado brasileiro (47%) é composta por conservadores cristãos e pessoas das classes D e E. O estudo classificou os eleitores em nove segmentos identitários. O presidente Lula teve maior crescimento no segmento liberal social entre o primeiro e o segundo turno das eleições de 2026.", "titulo_pt": "Conservadores cristãos E classes D E E formam quase metade do eleitorado brasileiro, diz pesquisa", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 284089, "titulo": "Kassio volta atuar no caso Master após ser sorteado relator de pedido de Vorcaro contra Fachin", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/kassio-volta-ao-caso-master-apos-ser-sorteado-relator-de-pedido-de-vorcaro-contra-fachin.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T15:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Kassio Nunes Marques, do STF, foi sorteado relator do pedido da defesa de Daniel Vorcaro contra Edson Fachin, no caso do Banco Master. Com isso, Kassio volta a julgar processos relacionados à investigação após se declarar impedido anteriormente.", "titulo_pt": "Kassio volta a atuar no caso Master após ser sorteado relator", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 284090, "titulo": "Acervo da Comissão Nacional da Verdade fica fora do ar; ex-coordenador fala em 'perplexidade'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/acervo-da-comissao-nacional-da-verdade-fica-fora-do-ar-ex-coordenador-fala-em-perplexidade.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A plataforma que armazena o acervo da Comissão Nacional da Verdade do governo federal está indisponível desde pelo menos a semana passada. Os únicos documentos acessíveis são os três volumes do relatório final, disponíveis em um portal separado.", "titulo_pt": "Acervo da Comissão Nacional da Verdade fica fora do ar; ex-coordenador fala em 'perplexidade'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 284359, "titulo": "Por que Lula deve indicar quatro mulheres negras ao STF", "url": "https://www.jota.info/opiniao-e-analise/colunas/mulheres-na-regulacao/por-que-lula-deve-indicar-quatro-mulheres-negras-ao-stf", "fonte_id": "jota", "data_pub": "2026-11-24T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo argumenta que a indicação de quatro mulheres negras pelo presidente Lula ao Supremo Tribunal Federal (STF) deve ser vista como uma forma de promover diversidade no Judiciário, sem diminuir o mérito dos candidatos.", "titulo_pt": "Por que Lula deve indicar quatro mulheres negras ao STF", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 284777, "titulo": "Australia, Solomons aim to sign deal to block China", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/25/2003868339", "fonte_id": "taipei_times", "data_pub": "2026-11-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Austrália e as Ilhas Salomão buscam assinar um acordo para bloquear a influência chinesa.", "titulo_pt": "Austrália e ilhas salomão buscam assinar acordo para bloquear influência chinesa", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 284797, "titulo": "US blacklists Alibaba subsidiary and Megaspeed linked to Nvidia scandal", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/25/2003868323", "fonte_id": "taipei_times", "data_pub": "2026-11-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Alibaba subsidiary e a Megaspeed foram incluídas em uma lista negra dos Estados Unidos em conexão com um escândalo envolvendo a Nvidia.", "titulo_pt": "EUA incluem subsidiária da Alibaba e Megaspeed na lista negra relacionada ao escândalo da Nvidia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 284450, "titulo": "Trump’s Nvidia Push Shows Companies’ Importance in Global Economic War", "url": "https://www.nytimes.com/2026/11/24/business/economy/trump-nvidia-national-security-us-economics.html", "fonte_id": "nyt_world", "data_pub": "2026-11-24T17:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antes, presidentes americanos auxiliaram empresas durante crises nacionais. Trump foi mais longe, colocando a sorte dos Estados Unidos no colo de um executivo preferido.", "titulo_pt": "O empurrão de trump para a Nvidia revela a importância das empresas na guerra econômica Global", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 284452, "titulo": "Stock Markets Slip as Nvidia and A.I. Stocks Erase Some of Monday’s Rally", "url": "https://www.nytimes.com/2026/11/24/business/stocks-sp500-huang-nvidia.html", "fonte_id": "nyt_world", "data_pub": "2026-11-24T17:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações têm oscilado fortemente por dias, influenciadas pela situação em Nvidia e pelo movimento de valorização e desvalorização das ações da Anthropic após sua impressionante oferta pública inicial.", "titulo_pt": "Mercados de ações flutuam com dinâmica de Nvidia e ações da anthropic", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 284456, "titulo": "Washington aguarda al Chapo Isidro con una lista de antiguos cómplices dispuestos a hundirlo", "url": "https://elpais.com/us/2026-11-24/washington-aguarda-al-chapo-isidro-con-una-lista-de-antiguos-complices-dispuestos-a-hundirlo.html", "fonte_id": "elpais_america", "data_pub": "2026-11-24T17:47:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A prisão do Chapo Isidro oferece uma oportunidade para seus antigos comparsas fornecerem informações e negociarem uma redução de suas penas. A queda deste líder representa uma chance para esses indivíduos colaborarem com as autoridades.", "titulo_pt": "Washington espera Chapo Isidro com lista de antigos comparsas dispostos a hundir-no", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 284597, "titulo": "European court: States can turn back migrants in some cases", "url": "https://www.dw.com/en/european-court-states-can-turn-back-migrants-in-some-cases/a-80038352?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-24T17:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Corte Europeia de Direitos Humanos decidiu que os Estados do Conselho da Europa podem rejeitar migrantes, mesmo em condições 'hostis', desde que não haja provas de que eles possam ser submetidos a tratamento cruel, insano ou degradante.", "titulo_pt": "Corte europeia de direitos humanos: estados podem rejeitar migrantes em certos casos", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 284407, "titulo": "Elecciones España 2026, EN VIVO: qué dicen las encuestas en los días previos", "url": "https://www.lanacion.com.ar/el-mundo/elecciones-espana-2026-en-vivo-que-dicen-las-encuestas-en-los-dias-previos-nid24112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-24T17:41:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Partido Popular é considerado o favorito nas eleições espanholas de 2026, mas precisaria do apoio da ultradireita para obter a maioria absoluta. O líder do Partido Popular demonstrou maior assertividade no debate contra o presidente do Partido Socialista.", "titulo_pt": "Eleições Espanha 2026, EN VIVO: quais são as previsões nas últimas semanas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 284463, "titulo": "La Copa América vuelve a Estados Unidos por tercera vez en 12 años", "url": "https://elpais.com/us/2026-11-24/la-copa-america-vuelve-a-estados-unidos-por-tercera-vez-en-12-anos.html", "fonte_id": "elpais_america", "data_pub": "2026-11-24T17:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Conmebol anunciou que a Copa América retornará aos Estados Unidos pela terceira vez em 12 anos, sinalizando uma transformação no histórico torneio sul-americano.", "titulo_pt": "Copa América volta aos Estados Unidos pela terceira vez em 12 anos", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 284765, "titulo": "\"Grandi passi in avanti\" sulla patrimoniale al tavolo progressista", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/24/grandi-passi-in-avanti-sulla-patrimoniale-al-tavolo-progressista_abc93b0e-ecef-406e-a28b-96ed6d22e5c5.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-24T17:38:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Haverá um novo encontro no dia seguinte pela manhã. Os participantes expressaram confiança no processo.", "titulo_pt": "Grande avanço na patrimonial na mesa progressista", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 284737, "titulo": "Houthis won't seize Aden, Yemeni government forces say", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/houthis-wont-seize-aden-yemeni-government-forces-say", "fonte_id": "middle_east_eye", "data_pub": "2026-11-24T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças do governo yemenita afirmam que os houthis não irão conquistar Aden, apesar de terem avançado a 60 km da cidade, que é a capital provisória do governo reconhecido internacionalmente. O porta-voz das forças armadas do país declarou que a situação não é tão grave quanto relatado.", "titulo_pt": "Houthis não irão conquistar Aden, diz governo yemenita", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 284614, "titulo": "Gunmen hold two dozen people hostage at supermarket in Colombia's Cartagena", "url": "https://www.france24.com/en/americas/20261124-hostages-supermarket-colombia-cartagena-flights", "fonte_id": "france24", "data_pub": "2026-11-24T17:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Armações rendeu cerca de duas dúzias de pessoas em um supermercado na cidade turística de Cartagena, Colômbia, levando a uma operação policial significativa e a um suspensão temporária de voos de chegada. Os poucos voos que normalmente chegam ao Aeroporto Rafael Núñez foram retomados após cerca de 45 minutos, após o uso de uma pista de pouso durante a operação militar.", "titulo_pt": "Armações rendem pessoas em supermercado em Cartagena, colômbia", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 284084, "titulo": "Julgamento na Itália sobre extradição de Zambelli tem novo adiamento", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/julgamento-na-italia-sobre-extradicao-de-zambelli-tem-novo-adiamento.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-24T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O julgamento na Itália do segundo pedido de extradição da ex-deputada Carla Zambelli foi adiado novamente para 2 de fevereiro de 2027, devido a uma greve de advogados penalistas. A nova audiência será realizada na Corte de Apelação de Roma.", "titulo_pt": "Julgamento na Itália sobre extradição de carla Zambelli é adiado novamente", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 284766, "titulo": "Odg maggioranza su ebook, \"stop per elementari, differimento per medie e superiori\"", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/24/odg-maggioranza-su-ebook-stop-per-elementari-differimento-per-medie-e-superiori_20b80b1f-f01b-42e8-a978-4f11ddd32f40.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-24T17:31:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O projeto visa iniciar rapidamente um debate técnico com os editores sobre o uso de livros eletrônicos. A decisão prevê a proibição do uso de eBooks em escolas primárias, adiamento para as escolas secundárias.", "titulo_pt": "Votação favorável a ebooks, proibição para escolas primárias, adiamento para níveis superiores", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 284767, "titulo": "Manfredi (Anci), 'condono? Non si può far ricadere sui comuni problemi decennali'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/24/manfredi-anci-condono-non-si-puo-far-ricadere-sui-comuni-problemi_26656851-1a92-4be5-ad14-0ff73daef23f.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-24T17:29:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O prefeito de Anci, Manfredi, declarou que expressará a posição da cidade quando souberem a proposta real. Não será possível atribuir problemas decenais aos municípios.", "titulo_pt": "Manfredi: 'expressaremos nossa posição quando soubermos a proposta real? Não se pode atribuir problemas decenais aos comuni'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 284769, "titulo": "Urzì ricorre su emendamento alla manovra per marcatori, proposta resta in dl sicurezza", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/24/urzi-ricorre-su-emendamento-alla-manovra-per-marcatori-proposta-resta-in-dl-sicurezza_1766afec-a60d-4c22-9cfa-a8104758f7af.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-24T17:27:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O deputado da Frente de Esquerda propôs focar no mérito e considerar a proposta como uma iniciativa parlamentar. Um emendamento à manobra para marcadores está sendo discutido.", "titulo_pt": "Urzì pede foco no mérito sobre emenda à manobra para marcadores", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 284738, "titulo": "Riyadh's landmark 'PIF Tower' struck in aerial attack for second time in five days", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/riyadhs-landmark-pif-tower-struck-aerial-attack-second-time-five-days", "fonte_id": "middle_east_eye", "data_pub": "2026-11-24T17:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O edifício-símbolo 'PIF Tower', que abriga a sede do fundo de riqueza soberana da Arábia Saudita em Riad, foi atingido por um suposto ataque de dronel pelo segundo dia consecutivo. Doze pessoas ficaram feridas no ataque de segunda-feira.", "titulo_pt": "PIF Tower, em riad, atingida em ataque aéreo por segunda vez em cinco dias", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 284355, "titulo": "Banco Central trabalha em medidas para intermediadores em arranjos de pagamento", "url": "https://www.jota.info/tributos-e-empresas/mercado/banco-central-trabalha-em-medidas-para-intermediadores-em-arranjos-de-pagamento", "fonte_id": "jota", "data_pub": "2026-11-24T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central está desenvolvendo medidas que podem afetar intermediadores em arranjos de pagamento, incluindo marketplaces que atuam como subcredenciadores.", "titulo_pt": "Banco Central trabalha em medidas para intermediadores em arranjos de pagamento", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 284121, "titulo": "Petrobras prevê investimentos de US$ 122 bilhões entre 2027 e 2031", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/petrobras-preve-investimentos-de-us-122-bilhoes-entre-2027-e-2031", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-24T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras aprovou um plano de negócios para o período de 2027 a 2031 com investimentos totais previstos de US$ 122 bilhões. Desse total, US$ 113 bilhões serão destinados a projetos em implantação e US$ 9 bilhões à Carteira em Avaliação.", "titulo_pt": "Petrobras prevê investimentos de US$ 122 bilhões entre 2027 e 2031", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 284282, "titulo": "Patrimônio de Fiagros quase triplica em um ano e chega a R$ 67 bilhões", "url": "https://www.cnnbrasil.com.br/agro/patrimonio-de-fiagros-quase-triplica-em-um-ano-e-chega-a-r-67-bilhoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-24T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ofertas públicas de títulos no Brasil somaram R$ 22,5 bilhões entre janeiro e outubro de 2026, quase triplificando o volume do ano anterior. O patrimônio de Fiagros alcançou R$ 67 bilhões no período.", "titulo_pt": "Patrimônio de Fiagros quase triplica em um ano e chega a R$ 67 bilhões", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 284356, "titulo": "Efeitos do PL de Mercados Digitais vão além das big techs", "url": "https://www.jota.info/opiniao-e-analise/artigos/efeitos-do-pl-de-mercados-digitais-vao-alem-das-big-techs", "fonte_id": "jota", "data_pub": "2026-11-24T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei sobre mercados digitais pode ter suas alterações, mas ainda pode afetar empresas que dependem das grandes tecnológicas para realizar negócios. A estrutura do texto do projeto não foi corrigida, mantendo potenciais impactos além das próprias grandes empresas tecnológicas.", "titulo_pt": "Efeitos do PL de Mercados Digitais vão além das grandes tecnológicas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 284180, "titulo": "Arrecadação federal cresce 7,3% e bate recorde em outubro", "url": "https://veja.abril.com.br/economia/arrecadacao-federal-cresce-73-e-bate-recorde-em-outubro/", "fonte_id": "veja", "data_pub": "2026-11-24T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A arrecadação federal cresceu 7,3% em outubro e atingiu um novo recorde. As receitas foram impulsionadas pela tributação de investimentos, pelo mercado de trabalho e por pagamentos extraordinários.", "titulo_pt": "Arrecadação federal cresce 7,3% e bate recorde em outubro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 284100, "titulo": "Governo mantém estimativa de arrecadar R$ 10,5 bi com taxação de dividendos, apesar de frustração até agora", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/governo-mantem-estimativa-de-arrecadar-r-105-bi-com-taxacao-de-dividendos-apesar-de-frustracao-ate-agora.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T16:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O coordenador de Previsão e Análise da Receita Federal, Marcelo Gomide, declarou que a previsão de arrecadar R$ 10,5 bilhões com o imposto de renda sobre dividendos permanece inalterada, apesar da frustração atual. A afirmação foi feita nesta terça-feira (24/11/2026).", "titulo_pt": "Governo mantém estimativa de arrecadar R$ 10,5 bi com taxação de dividendos, apesar de frustração até agora", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 284707, "titulo": "Trump readies raft of new tariffs on major economies", "url": "https://www.ft.com/content/335b593d-1478-4550-ab0a-71fec6280eb0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-24T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, está preparando uma série de novas tarifas sobre grandes economias, incluindo China, União Europeia, Japão e Coreia do Sul. Trump está reafirmando sua estratégia de trade, aumentando as tensões comerciais.", "titulo_pt": "Trump prepara novas tarifas sobre grandes economias", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 284122, "titulo": "BCs de países de língua portuguesa criam rede de cooperação", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/bcs-de-paises-de-lingua-portuguesa-criam-rede-de-cooperacao", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-24T16:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os bancos centrais dos países de língua portuguesa criaram uma rede permanente de cooperação para compartilhar conhecimento e experiências. A Rede dos Bancos Centrais dos Países de Língua Portuguesa foi oficializada em 4 de novembro durante uma reunião em Luanda, Angola.", "titulo_pt": "Bcs de países de língua portuguesa criam rede de cooperação", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 284101, "titulo": "Aneel propõe variar preço da energia conforme horário do dia e pode frear expansão de painéis solares", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/aneel-propoe-variar-preco-da-energia-conforme-horario-do-dia-e-pode-frear-expansao-de-paineis-solares.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Aneel propôs uma nova tarifa de energia elétrica que variaria conforme o horário do dia e enquadraria alguns consumidores automaticamente nessa modalidade. A proposta foi apresentada no início de novembro de 2026.", "titulo_pt": "Aneel sugere tarifa variável de energia conforme horário e pode impactar painéis solares", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 284123, "titulo": "Arrecadação federal atinge R$ 294 bilhões e bate recorde para outubro", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/arrecadacao-federal-atinge-r-294-bilhoes-e-bate-recorde-para-outubro", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-24T15:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A arrecadação das receitas federais atingiu R$ 293,975 bilhões em outubro de 2025, um aumento real de 7,28% em comparação com o mesmo mês do ano anterior. De janeiro a outubro, a arrecadação totalizou R$ 2,645 trilhões, com crescimento real de 7% na comparação com o mesmo período de 2024.", "titulo_pt": "Arrecadação federal bate recorde em outubro", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 284102, "titulo": "De olho no 13º, distribuidoras renegociam dívidas de conta de luz com clientes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/de-olho-no-13o-empresas-renegociam-dividas-de-conta-de-luz-com-clientes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As distribuidoras de energia elétrica estão promovendo renegociações de dívidas com clientes inadimplentes, oferecendo condições especiais para que os consumidores regularizem suas contas de luz em atraso. Isso ocorre em virtude da alta inadimplência e do pagamento do 13º salário aos trabalhadores no final do ano.", "titulo_pt": "Distribuidoras oferecem renegociação de dívidas de conta de luz com olho no 13º salário", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 284358, "titulo": "Receita e Comitê Gestor dizem que apuração assistida estará pronta em janeiro", "url": "https://www.jota.info/coberturas-especiais/ambiente-negocios-oportunidades/receita-e-comite-gestor-dizem-que-apuracao-assistida-estara-pronta-em-janeiro", "fonte_id": "jota", "data_pub": "2026-11-24T15:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os técnicos do Comitê Gestor e da Receita Federal detalharam o calendário de regulamentos e sistemas relacionados à apuração assistida, indicando que as normas passarão por revisão contínua. A expectativa é que o sistema esteja pronto para uso em janeiro.", "titulo_pt": "Comitê Gestor e receita federal afirmam que apuração assistida estará pronta em janeiro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 284103, "titulo": "Ações contra o Banco Master movidas por pessoas físicas somam R$ 4 bilhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/acoes-contra-o-banco-master-movidos-por-pessoas-fisicas-somam-r-4-bilhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há processos judiciais movidos por pessoas físicas contra o Banco Master no valor total de R$ 3,9 bilhões. A liquidação extrajudicial do banco ainda coloca em dúvida o recebimento desses valores, além dos custos já contabilizados com a quebra do banco.", "titulo_pt": "Ações contra o Banco Master movidas por pessoas físicas somam R$ 3,9 bilhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 284104, "titulo": "Discussão sobre gás natural atrasa benefícios fiscais para data centers; setor teme esvaziamento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/11/discussao-sobre-gas-natural-atrasa-beneficios-fiscais-para-data-centers-setor-teme-esvaziamento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A política de incentivo a data centers entrou em lei há dois meses, mas os detalhes sobre as regras de habilitação, os prazos e o uso de energia ainda não foram definidos. O setor teme que a falta de clareza possa atrasar os benefícios fiscais.", "titulo_pt": "Discussão sobre gás natural atrasa benefícios fiscais para data centers; setor teme esvaziamento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 284105, "titulo": "Mercado recebe com cautela plano da Petrobras com mais investimento e produção estável", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/mercado-recebe-com-cautela-plano-da-petrobras-com-mais-investimento-e-producao-estavel.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T14:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado recebeu com cautela o aumento dos investimentos previsto no novo plano de negócios da Petrobras, sem um aumento significativo na produção. Analistas esperam menor espaço para dividendos nos próximos dois anos e um plano mais dependente do preço do petróleo.", "titulo_pt": "Mercado recebe com cautela plano da Petrobras com investimentos aumentados e produção estável", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 284361, "titulo": "Quando regular é expropriar?", "url": "https://www.jota.info/opiniao-e-analise/colunas/observatorio-agencias-reguladoras/quando-regular-e-expropriar", "fonte_id": "jota", "data_pub": "2026-11-24T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute a distinção entre regulamentações justas e apropriações que exigem compensação.", "titulo_pt": "Quando regulamentar se torna expropriação?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 284798, "titulo": "Huang’s Nvidia return sparks relief for battered AI trade, but questions remain", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/25/2003868324", "fonte_id": "taipei_times", "data_pub": "2026-11-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O retorno de Huang à Nvidia gerou alívio na indústria de inteligência artificial, mas muitas perguntas permanecem. A reinserção de Huang na empresa levou a uma melhora no ânimo dos investidores e participantes do setor, mas ainda há incertezas sobre o futuro da empresa e seu impacto na indústria de AI.", "titulo_pt": "Retorno de huang à Nvidia desperta alívio na trade de AI, mas questionamentos persistem", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 284868, "titulo": "Jensen Huang Apologizes to Nvidia Employees in First All-Hands Since His Return", "url": "https://www.wired.com/story/jensen-huang-apologizes-to-nvidia-employees-in-first-all-hands-since-his-return/", "fonte_id": "wired", "data_pub": "2026-11-24T17:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang, o CEO reinstalado da Nvidia, se retratou diante dos funcionários, admitindo ter violado o código de conduta da empresa e ter cometido alguns erros pessoais graves.", "titulo_pt": "Jensen Huang se retrata com funcionários da Nvidia após retorno", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 284413, "titulo": "Tao Lin, investigador de Anthropic, sobre el impacto de la IA en el trabajo: “El empleo humano desaparecerá”", "url": "https://www.lanacion.com.ar/tecnologia/tao-lin-investigador-de-anthropic-sobre-el-impacto-de-la-ia-en-el-trabajo-el-empleo-humano-nid24112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-24T17:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Tao Lin, um investigador da Anthropic, alerta para o risco de desemprego permanente devido à inteligência artificial. Os dados laborais nos Estados Unidos não mostram ainda um aumento significativo no desemprego relacionado à IA, mas especialistas observam sinais preocupantes.", "titulo_pt": "Tao Lin, investigador da Anthropic, sobre o impacto da IA no trabalho: ‘o emprego humano desaparecerá’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 284421, "titulo": "RADAR LT ElipseAI: de solucionar un problema de salud en Chile a conquistar mercados internacionales", "url": "https://www.latercera.com/videos/noticia/radar-lt-elipseai-de-solucionar-un-problema-de-salud-en-chile-a-conquistar-mercados-internacionales/", "fonte_id": "la_tercera", "data_pub": "2026-11-24T17:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "ElipseAI surgiu para simplificar o acesso a consultas médicas através da inteligência artificial. Agora, após ser adquirida por um holding canadense, a empresa chilena começa uma nova fase de expansão internacional, focada em inovação tecnológica com propósito.", "titulo_pt": "ElipseAI: de resolver um problema de saúde no Chile a conquistar mercados internacionais", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 284099, "titulo": "Meta e TikTok se unem ao Google contra mudanças na lei de direitos autorais da Indonésia sobre IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/meta-e-tiktok-se-unem-ao-google-contra-mudancas-na-lei-de-direitos-autorais-da-indonesia-sobre-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As plataformas digitais Meta e TikTok, junto com o Google, contestaram mudanças propostas na lei de direitos autorais da Indonésia. A revisão exigiria que as plataformas pagassem empresas de comunicação por exibir conteúdo jornalístico e estabeleceria regras para o uso de inteligência artificial.", "titulo_pt": "Meta, TikTok e Google se unem contra mudanças na lei de direitos autorais da Indonésia sobre IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 284289, "titulo": "O erro trilionário da Nvidia que ajudou a trazer Jensen Huang de volta", "url": "https://www.cnnbrasil.com.br/economia/money/tecnologia/o-erro-trilionario-da-nvidia-que-ajudou-a-trazer-jensen-huang-de-volta/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-24T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas em governança apontam falhas graves na gestão de crise da Nvidia após a demissão e rápido retorno do executivo Jensen Huang ao cargo.", "titulo_pt": "O erro trilionário da Nvidia que ajudou a trazer Jensen Huang de volta", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 284331, "titulo": "O que o retorno de Jensen Huang à chefia da Nvdia ensina a Xi Jinping sobre Donald Trump", "url": "https://www.bbc.com/portuguese/articles/ck20vn7vnd37o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-24T16:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O retorno de Jensen Huang à chefia da Nvidia pode ser visto como uma vitória para a China, mas não representa um alívio para Pequim em suas relações internacionais.", "titulo_pt": "Retorno de Jensen Huang à nvidia pode ser visto como vitória da china, mas não alívio para pequim", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 284842, "titulo": "US Commerce Department adds Megaspeed to trade blacklist as Huang retakes control of Nvidia", "url": "https://www.theverge.com/policy/1041270/nvidia-megaspeed-commerce-dept-entity-list", "fonte_id": "the_verge", "data_pub": "2026-11-24T16:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang reassumiu o cargo de CEO da Nvidia com o apoio da Administração Trump, enquanto o Departamento do Comércio dos Estados Unidos incluiu a Megaspeed na Lista de Entidades, proibindo assim o comércio com a empresa devido a riscos de segurança nacional. Howard Lutnick, secretário do Comércio, enfrentou pressão para incluir a empresa na lista após relatos anteriores por parte da Semafor.", "titulo_pt": "Departamento de comércio dos EUA inclui Megaspeed na lista de entidades com Huang de volta como ceo da Nvidia", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 284843, "titulo": "Jensen Huang deepfakes are the hot new AI slop", "url": "https://www.theverge.com/tech/1041222/jensen-huang-nvidia-scandal-deepfakes", "fonte_id": "the_verge", "data_pub": "2026-11-24T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang, ex-CEO da Nvidia, está em Ibiza dançando em um clubão, com seu tradicional casaco de couro preto, em um vídeo com quase 6 milhões de visualizações no Instagram. Alice Huang, sua supostamente suspeita comparsa executiva chinesa, aparece de surpresa por trás dele.", "titulo_pt": "Jensen Huang dança em ibiza com seu tradicional casaco de couro preto em vídeo com 6 milhões de visualizações", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 284871, "titulo": "Anthropic Created a Honeypot to Lure AI Agents Into Misbehaving", "url": "https://www.wired.com/story/ai-agents-can-get-honeypotted-too-aw/", "fonte_id": "wired", "data_pub": "2026-11-24T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic criou uma armadilha para AI (inteligência artificial) para testar se os agentes de IA podem resistir a tentações que os fariam agir de maneira inadequada.", "titulo_pt": "Anthropic cria armadilha para testar resistência de agentes de IA", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 284835, "titulo": "Raising the stakes for enterprise networks with AI modernization", "url": "https://www.technologyreview.com/2026/11/24/1148091/raising-the-stakes-for-enterprise-networks-with-ai-modernization/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-24T15:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As redes de empresas estão sob forte pressão. A adoção rápida de inteligência artificial está rapidamente se tornando a maior fonte de demanda para as redes. As tarefas realizadas por agentes de IA estão estimando gerar 450% mais tráfego de rede do que as mesmas tarefas realizadas por trabalhadores humanos.", "titulo_pt": "Aumentando os riscos para as redes empresariais com modernização de IA", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 284872, "titulo": "Thanksgiving Travel Will Be a Stormy Mess", "url": "https://www.wired.com/story/thanksgiving-travel-will-be-stormy-mess/", "fonte_id": "wired", "data_pub": "2026-11-24T15:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A viagem de Thanksgiving enfrentará condições meteorológicas adversas, incluindo neve, vento, chuva e inundações. As tempestades na costa leste e na costa oeste prometem tornar a semana de feriados caótica nos aeroportos dos Estados Unidos.", "titulo_pt": "Viagem de thanksgiving será um caos meteorológico", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 284214, "titulo": "Foxbit consegue autorização para virar DTVM e distribuir investimentos além de cripto", "url": "https://exame.com/future-of-money/foxbit-consegue-autorizacao-para-virar-dtvm-e-distribuir-investimentos-alem-de-cripto/", "fonte_id": "exame", "data_pub": "2026-11-24T14:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Foxbit obteve autorização do Banco Central para se transformar em uma DTVM (Depositária e Tesouraria Virtual de Mercadorias) e começar a distribuir investimentos além de criptomoedas. A empresa está no processo de se tornar uma PSAV (Plataforma de Serviços de Administração Virtual) regulada no Brasil.", "titulo_pt": "Foxbit conquista autorização para se tornar DTVM e expandir investimentos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 284805, "titulo": "How Jensen Huang’s Nvidia return could deepen US rift over China chip curbs", "url": "https://www.scmp.com/news/china/diplomacy/article/3375631/how-jensen-huangs-nvidia-return-could-deepen-us-rift-over-china-chip-curbs", "fonte_id": "scmp", "data_pub": "2026-11-24T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O retorno de Jensen Huang como CEO da Nvidia poderia complicar a política dos EUA em relação à China, ampliando o desacordo entre um governo Biden que busca estabilizar as relações com Pequim e um Congresso democrata que está pronto para endurecer as restrições sobre chips. A decisão foi tomada após a recomendação de altos funcionários dos EUA.", "titulo_pt": "Retorno de Jensen Huang como ceo da Nvidia pode aprofundar desacordo sobre política de chipografia com a China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 284996, "titulo": "China launching 1st international astronaut to Tiangong space station today: Watch it live", "url": "https://www.space.com/space-exploration/human-spaceflight/china-shenzhou-24-first-international-astronaut-launch-tiangong-space-station", "fonte_id": "space_com", "data_pub": "2026-11-24T13:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China realizará pela primeira vez o lançamento de um astronauta internacional para sua estação espacial Tiangong no dia 24 de novembro, podendo ser acompanhado ao vivo.", "titulo_pt": "China lançará primeiro astronauta internacional para estação espacial Tiangong hoje: assista ao vivo", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 284113, "titulo": "Fornecedores da Nvidia e startups na Ásia comemoram retorno de Huang com redução das incertezas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/fornecedores-da-nvidia-e-startups-na-asia-comemoram-retorno-de-huang-com-reducao-das-incertezas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-24T13:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fornecedores e clientes da Nvidia em Coreia do Sul e Taiwan comemoram a volta de Jensen Huang como CEO, reduzindo as incertezas sobre os planos de produtos e investimentos em startups de IA.", "titulo_pt": "Fornecedores e startups asiáticas comemoram retorno de Huang à ceo da Nvidia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 284963, "titulo": "Webb Reveals New Details in Supernova Remnant", "url": "https://www.nasa.gov/image-article/webb-reveals-new-details-in-supernova-remnant/", "fonte_id": "nasa_news", "data_pub": "2026-11-24T16:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Telescópio Espacial James Webb da NASA revelou detalhes da poeira quente que compõe o resíduo da supernova Cassiopeia A (Cas A) em uma imagem de alta resolução no infravermelho médio divulgada em 23 de novembro de 2026. Esses resíduos são as nuvens de gás e poeira que permanecem após a explosão de uma estrela massiva e eventualmente semeiam uma nova geração de estrelas.", "titulo_pt": "Webb revela novos detalhes da resíduo de Supernova cassiopeia a", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 284933, "titulo": "This man sometimes sees his cat’s eyes on people’s faces", "url": "https://www.sciencenews.org/article/man-cats-eyes-faces-brain", "fonte_id": "science_news", "data_pub": "2026-11-24T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem que teve cirurgia no cérebro começou a ver os olhos de seu gato em rostos humanos. A condição rara está ajudando a entender como o cérebro percebe rostos.", "titulo_pt": "Este homem às vezes vê os olhos do seu gato em rostos humanos", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 284964, "titulo": "NASA’s Titan-Bound Dragonfly Rotorcraft Gets Its Eyes", "url": "https://science.nasa.gov/missions/dragonfly/nasas-titan-bound-dragonfly-rotorcraft-gets-its-eyes/", "fonte_id": "nasa_news", "data_pub": "2026-11-24T15:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os instrumentos científicos para a missão Dragonfly da NASA estão sendo instalados no Laboratório Aplicado de Física da Johns Hopkins em Laurel, Maryland. O primeiro equipamento a chegar foi o DragonCam, um conjunto de sete câmeras destinadas a caracterizar a superfície de Titan em múltiplos escalões durante a missão.", "titulo_pt": "Olhos do Dragonfly da nasa chegam ao laboratório", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 284953, "titulo": "Simera Sense, Spacemanic, Zaitra and World from Space Join Forces on an End-to-End Dual-Use Mission Solution", "url": "https://spacenews.com/simera-sense-spacemanic-zaitra-and-world-from-space-join-forces-on-an-end-to-end-dual-use-mission-solution/", "fonte_id": "spacenews", "data_pub": "2026-11-24T15:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Simera Sense, Spacemanic, Zaitra e World from Space assinaram um Memorando de Entendimento em Bremen para cooperar em uma solução completa de missão baseada em […]", "titulo_pt": "Simera Sense, Spacemanic, Zaitra e World from Space unem forças em solução End-to-End para missão Dual-Use", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 284958, "titulo": "Lightning strikes could more than double by 2100 thanks to climate change", "url": "https://www.scientificamerican.com/article/lightning-strikes-could-more-than-double-by-2100-thanks-to-climate-change/", "fonte_id": "scientific_american", "data_pub": "2026-11-24T15:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aumento da temperatura global pode levar a um aumento superior a 100% no número de raios que atingem o solo até o ano 2100. O aquecimento da superfície terrestre cria condições mais favoráveis para a formação de campos elétricos e raios entre nuvem e solo.", "titulo_pt": "Aumento do número de raios pode dobrar até 2100 devido ao aquecimento global", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 284060, "titulo": "Arqueólogos decifram quebra-cabeça do Partenon, templo da Grécia Antiga", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/arqueologos-decifram-quebra-cabeca-do-partenon-templo-da-grecia-antiga.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-24T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partenon, um dos templos mais importantes da Grécia Antiga com 2.500 anos, é considerado uma das maiores obras-primas do período clássico.", "titulo_pt": "Arqueólogos decifram quebra-cabeça do Partenon, templo da Grécia Antiga", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 284959, "titulo": "The number of babies getting vaccinated for hepatitis B at birth is dropping precipitously", "url": "https://www.scientificamerican.com/article/the-number-of-babies-getting-vaccinated-for-hepatitis-b-at-birth-is-dropping-precipitously/", "fonte_id": "scientific_american", "data_pub": "2026-11-24T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de bebês que recebem a vacina contra a hepatite B no nascimento tem diminuído drasticamente. A hepatite B, uma doença do fígado que pode ser transmitida da mãe para o bebê, pode ser fatal se não for tratada.", "titulo_pt": "O número de bebês vacinados contra a hepatite B no nascimento está caindo drasticamente", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 284927, "titulo": "STAT+: Pharmalittle: We’re reading about Sanofi buying Insmed, Roche touting its breast cancer pill, and more", "url": "https://www.statnews.com/pharmalot/2026/11/24/sanofi-buying-insmed-roche-breast-cancer-pill/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-24T14:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sanofi está adquirindo a biotecnológica Insmed por 41 bilhões de dólares, a maior aquisição na indústria farmacêutica nos últimos anos, expandindo sua carteira com dois novos medicamentos aprovados.", "titulo_pt": "Sanofi compra Insmed por 41 bilhões de dólares", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 284928, "titulo": "STAT+: Roche’s potential breast cancer blockbuster drug wins second FDA nod", "url": "https://www.statnews.com/2026/11/24/biotech-news-roche-potential-breast-cancer-blockbluster-drug-wins-second-fda-nod/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-24T14:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Roche obteve sua segunda aprovação da FDA para seu remédio para câncer de mama, desta vez para uso em câncer de mama em estágio inicial após a cirurgia.", "titulo_pt": "Remédio potencial contra câncer de mama da roche recebe segunda aprovação da FDA", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 284929, "titulo": "STAT+: Alaskan hospitals use AI to improve stroke care, peptides go mainstream, and RSNA 2026", "url": "https://www.statnews.com/2026/11/24/alaskan-hospitals-using-ai-rsna-2026-peptides-health-tech/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-24T14:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hospitais alascianos e
