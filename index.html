<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">

  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>
      <option value="erro_traducao">Erro de tradução</option>

      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "22/08/2026 15:20", "stats": {"noticias_novas": 575, "resumos_gerados": 242}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Neste fim de semana, diversos candidatos à presidência e aos cargos de governo realizaram atos e prometeram melhorias para diferentes regiões do país. O candidato Lula iniciou sua agenda de campanha no Rio de Janeiro, onde acenou com religiosos e prometeu tirar o estado das 'páginas policiais'. Em atos simultâneos, Lula e Flávio Bolsonaro marcaram presença na região Sudeste, participando de comícios e debates. Na política local, André do Prado, do PL, se manifestou sobre investigações envolvendo a campanha em uma igreja, enquanto Celina Leão, do PP, prometeu reformar UPAs e hospitais. No cenário econômico, a Petrobras foi destacada como vencedora da semana após confirmar a presença de petróleo na costa do Amapá. Outras notícias relevantes incluem a implementação de novas regras pelo INSS para a liberação de empréstimos consignados, a investigação do jornalista Luís Pablo por supostamente integrar um esquema de extorsão, e a rejeição da tese de 'deepfake do bem' pela ministra Cármen Lúcia do STF.", "mundo": "O Canadá e os Estados Unidos entraram em uma guerra comercial após o presidente americano, Donald Trump, reavaliar tarifas sobre importações canadenses. O primeiro-ministro canadense, Justin Trudeau, respondeu com tarifas equivalentes, declarando que o Canadá está 'em guerra' com os Estados Unidos. A situação afetou milhares de famílias na Faixa de Gaza, que buscam informações sobre parentes desaparecidos. Em outro front, a Rússia ameaça retaliar contra a logística ucraniana em resposta a ataques ucranianos a armazéns de e-commerce. Na Nigéria, homens armados sequestraram dezenas de pessoas em dois vilarejos. Além disso, a justiça dos Estados Unidos derrubou restrições de vistos de residência para 75 países, incluindo o Brasil, enquanto o Irã prometeu superar as 'sanções cruéis' dos EUA. A guerra comercial entre Canadá e EUA intensificou-se após o fracasso nas negociações, com Trudeau acusando Trump de subestimar a reação canadense.\n\nA situação geopolítica no Oriente Médio e na Europa continua instável, com novos conflitos e tensões. Na Ucrânia, o conflito entre Rússia e Ucrânia intensificou, com ataques com drones causando mortes e danos econômicos. Putin acusa a Ucrânia de ter aberto uma 'caixa de Pandora' com novos ataques. Em outro desenvolvimento, Israel intensificou seus ataques com drones na Síria, resultando em feridos. No Oriente Médio, o conflito em Gaza continua, com milhares de corpos sendo enterrados em locais improvisados. Além disso, a pirataria aumentou no Golfo de Aden, com 20 marinheiros sequestrados por piratas somalis. Na Ásia, a Coreia do Sul testou o caminho Ártico para avaliar a viabilidade comercial de uma rota aberta pelo derretimento da geleada marítima. O Irã criticou as novas sanções dos EUA, considerando-as uma violação da soberania extraterritorial. Em contraste, os EUA planejam anunciar novas sanções contra o Irã, o que pode levar a tensões adicionais. Na Europa, a Rússia intensificou seus bombardeios na Ucrânia, causando mortes, enquanto a Ucrânia intensificou seus ataques com drones contra a infraestrutura econômica russa.", "economia": "Os Estados Unidos aplicaram uma tarifa de 50% sobre produtos canadenses, valendo cerca de 20 bilhões de dólares, após falhas em um acordo comercial, aumentando a tensão comercial entre os dois países. O Canadá planeja retaliar essa medida, que entrará em vigor a partir de 8 de setembro. Em outro desenvolvimento, a ANS autorizou a Hapvida a negociar reajustes com 947 mil beneficiários, após suspensões temporárias na quinta-feira, e afirmou que vai monitorar as decisões da operadora. Além disso, a Shein, uma das empresas de varejo mais comentadas, enfrenta desafios para expandir seu negócio após conquistar o mundo, enquanto a Disney corta o benefício de saúde para parte dos cônjuges de funcionários.", "tecnologia": "A tecnologia enfrenta diversos desafios e avanços em diferentes campos. A Starlink, por exemplo, opera internet via satélite em locais litorâneos, enquanto os smart speakers Alexa oferecem opções em várias cores e são promovidos pela Amazon. A inteligência artificial também é um foco importante, com a OpenAI pedindo a fortificação de leis de segurança de IA na Califórnia, e a Anthropic enfrentando a rejeição popular em torno de seus data centers. No mercado automotivo brasileiro, as marcas chinesas estão liderando o crescimento. Além disso, a Amazon aumentou os preços de seus dispositivos Echo, Kindle e Fire TV devido ao aumento dos custos dos componentes de memória e armazenamento. Outros aspectos tecnológicos abrangem desde a evolução do armazenamento com SSDs NVMe em promoção, até a segurança de carregamento de celulares, passando por novas funcionalidades de amplificadores de som e a evolução do Windows 10 Mobile. A Uber foi multada em € 825 milhões por práticas de algoritmos de suspensão de contas de motoristas, enquanto a inteligência artificial pode estar substituindo a criatividade no marketing. O uso de carregadores de alta potência em celulares antigos é discutido, bem como a complexidade de carregar carros elétricos com energia solar. A funcionalidade de audiolivros no Kindle também é explorada, e a NASA cancelou sua missão de resgate para o telescópio Swift devido a problemas técnicos.", "ciencia": "A Europa registrou mais de 30.000 mortes a mais durante o verão, conforme a primeira análise, atribuídas ao aquecimento global e à ocorrência de ondas de calor consecutivas. Um estudo global revelou que os homens têm o dobro de chances de contrair tuberculose em comparação com as mulheres, mas a razão exata para essa diferença ainda não foi identificada. A NASA planeja explorar a lua de Saturno, Titã, com a missão Dragonfly, em busca de sinais de vida. Além disso, um estudo sugere que a magnetosfera da Terra pode não proteger completamente do risco de superstorms. O óleo de menta pode reduzir a pressão arterial em adultos com hipertensão leve em 8,5 mmHg após 20 dias de ingestão. Por fim, uma nova espécie de cobra foi descoberta na Nova Guiné e recebeu o nome de um guitarrista, embora não seja venenosa para humanos.", "cultura": "A Focus Cia de Dança, representando o Brasil no Living Dance Festival na China, apresentará o espetáculo 'Still Reich', inspirado no trabalho do músico Steve Reich, durante uma turnê de 13 dias. Este evento cultural é um destaque, destacando a presença brasileira em um importante festival internacional. Além disso, a companhia contará com cerca de 20 pessoas, incluindo bailarinos, diretores e técnicos, demonstrando a força e a diversidade do cenário artístico nacional. Paralelamente, o Dia do Folclore também merece destaque, ressaltando a importância das tradições populares na educação, valorizando a cultura como uma ferramenta pedagógica no currículo escolar. Esses eventos e discussões sobre cultura e educação refletem a diversidade e a importância do patrimônio cultural em diferentes contextos globais.", "sociedade": "Um homem de 35 anos foi morto a tiros durante a madrugada em uma residência familiar na região de Punta Mira, Coquimbo, Chile, o que levou à abertura de uma investigação policial. Em São Paulo, um policial foi detido após uma operação que cumpriu mandados de busca e prisão temporária em cinco cidades ligadas a um sequestro. No Complexo de Israel, no Rio de Janeiro, policiais encontraram artefatos explosivos, como carros-bomba e barricadas, que podem ter sido acionados por controle remoto. Em Mataderos, Buenos Aires, cinco adolescentes foram detidos após roubos de veículos e uma perseguição policial, totalizando 23 antecedentes. Em São Paulo, um motorista reagiu a um assalto e matou dois suspeitos, encontrando um revólver, cinco celulares e duas alianças com eles. Além disso, estudos mostram que o consumo de bebidas açucaradas aumenta 2,45 vezes o risco de câncer. A agenda do CNJ (Conselho Nacional de Justiça) aborda ações para assistência às vítimas da violência estatal, com foco em quebrar silêncios relacionados a essas vítimas.", "meio_ambiente": "A China está considerando sediar as negociações climáticas da ONU em 2028, uma proposta ainda não oficializada. Em outro desenvolvimento, a Conaf denunciou a presença de motos de neve em atividades ilegais na Reserva Nacional Malalcahuello, no Chile, levando a ações judiciais e a aumento das rondas de vigilância. O fenômeno 'Super El Niño' e suas consequências, como o aumento do risco de eventos climáticos extremos, foram alvo de preocupação da Organização Não-Governamental Habitat para a Humanidade Brasil. Além disso, a China enfrenta desafios na implementação de políticas ambientais, com o contrabando de ivoire continuando no Vietnã, mesmo após a proibição. A Europa registrou mais de 32.000 mortes a mais durante o verão devido às ondas de calor, destacando a urgência de ações climáticas.", "direitos_humanos": "Trabalhadores indonésios acusam empregadores de violações de direitos trabalhistas, relatando o uso de trabalho forçado e reduções salariais em operações de empregos temporários. Este caso ilustra preocupações crescentes sobre a implementação adequada de direitos humanos no contexto do trabalho precário e da migração laboral. Além disso, um artigo fictício discute a regulamentação de influenciadores digitais por meio de um suposto cassino, levantando questões sobre a ética e a supervisão das influências online, embora não sejam fornecidos detalhes adicionais sobre o conteúdo específico do artigo."}, "resumo_do_dia": {"politica_nacional": [{"id": 117862, "titulo": "Em \"adesivaço\", Paula Belmonte defende diálogo do GDF com população", "url": "https://www.metropoles.com/distrito-federal/em-adesivaco-paula-belmonte-defende-dialogo-do-gdf-com-populacao", "fonte_id": "metropoles", "data_pub": "2026-08-22T17:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Paula Belmonte, candidata ao governo do Distrito Federal (GDF), defendeu o diálogo com a população. Ela também mencionou a importância do cuidado com a transparência e com a gestão pública como prioridades.", "titulo_pt": "Paula Belmonte defende diálogo e transparência no GDF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 117779, "titulo": "Jornalista investigado no STF por textos contra Dino será julgado em dezembro por esquema de extorsão", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/jornalista-investigado-no-stf-por-textos-contra-dino-sera-julgado-em-dezembro-por-esquema-de-extorsao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-22T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O jornalista Luís Pablo Conceição Almeida será julgado em dezembro pela 2ª Vara Criminal do Maranhão por supostamente integrar um esquema de extorsão a políticos e empresários. Ele já é investigado no STF após publicar textos contra o ministro Flávio Dino.", "titulo_pt": "Jornalista investigado no STF por textos contra Dino será julgado em dezembro por esquema de extorsão", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 117780, "titulo": "Ex-chefe de gabinete de Lula pediu quadro que lobista disse custar ? 100 mil, diz jornal", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/ex-chefe-de-gabinete-de-lula-pediu-quadro-que-lobista-disse-custar-eur-100-mil-diz-jornal.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-22T17:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-chefe de gabinete do presidente Lula, Marco Aurélio Ribeiro, pediu um quadro à lobista Roberta Luchsinger, que avaliou o item em R$ 100 mil, conforme relatou o jornal O Estado de S. Paulo.", "titulo_pt": "Ex-chefe de gabinete de Lula pediu quadro avaliado em r$ 100 mil, diz jornal", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 117870, "titulo": "André do Prado se manifesta sobre investigação por campanha em igreja", "url": "https://www.metropoles.com/sao-paulo/andre-do-prado-se-manifesta-sobre-investigacao-por-campanha-em-igreja", "fonte_id": "metropoles", "data_pub": "2026-08-22T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "André do Prado, candidato ao Senado pelo partido PL, afirmou que participou de um culto convidado e não realizou campanha ou pediu votos durante o evento.", "titulo_pt": "André do Prado se manifesta sobre investigação por campanha em culto", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 117871, "titulo": "Lula acena a religiosos e defende tirar o RJ das \"páginas policiais\"", "url": "https://www.metropoles.com/brasil/lula-acena-a-religiosos-e-defende-tirar-o-rj-das-paginas-policiais", "fonte_id": "metropoles", "data_pub": "2026-08-22T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula realizou sua primeira agenda de campanha no Rio de Janeiro, acenando com religiosos e defendendo a retirada do estado das páginas policiais.", "titulo_pt": "Lula acena com religiosos e defende tirar o RJ das 'páginas policiais'", "veiculo": "Metrópoles", "pais sem exageros e que Paes continuará com a limpeza interina no estado.", "titulo_pt": "Lula promete resolver segurança sem pirotecnia e diz que Paes vai continuar limpeza de interino no RJ", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 117876, "titulo": "Celina promete reformar UPAs, hospitais e dar reajuste para médicos", "url": "https://www.metropoles.com/distrito-federal/celina-promete-reformar-upas-hospitais-e-dar-reajuste-para-medicos", "fonte_id": "metropoles", "data_pub": "2026-08-22T16:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Celina Leão, atual governadora e candidata à reeleição pelo PP, participou do lançamento da campanha de deputados no sábado (22/8).", "titulo_pt": "Celina promete reformar UPAs, hospitais e dar reajuste para médicos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 117878, "titulo": "\"Gostaria de vê-los\", diz Tarcísio sobre Lula e Flávio fora de debate", "url": "https://www.metropoles.com/sao-paulo/gostaria-tarcisio-lula-flavio-debate", "fonte_id": "metropoles", "data_pub": "2026-08-22T16:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O primeiro debate entre os candidatos à presidência para as eleições de 2026 será realizado neste domingo sem a participação de Lula e Flávio, que estão na liderança das pesquisas de intenção de voto.", "titulo_pt": "Tarcísio quer ver Lula e Flávio fora do debate", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 117952, "titulo": "Depois de uma longa reflexão — by Pedro Vinicio", "url": "https://braziljournal.com/depois-de-uma-longa-reflexao-by-pedro-vinicio/", "fonte_id": "brazil_journal", "data_pub": "2026-08-22T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto original é um título de postagem, indicando que Pedro Vinicio escreveu sobre um assunto após uma reflexão prolongada. Não há conteúdo adicional para resumir além desse fato.", "titulo_pt": "Depois de uma longa reflexão — por Pedro vinício", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 117783, "titulo": "Flávio deixa de lado 'Bolsonaro moderado' e defende tirar bandido 'de pé ou deitado'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/flavio-deixa-de-lado-bolsonaro-moderado-e-defende-tirar-bandido-de-pe-ou-deitado-da-rua.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-22T15:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato pelo PL à Presidência, declarou que os bandidos serão removidos de circulação, independentemente de estarem em pé ou deitados. Ele enfatizou que a população deve ser a única a circular nas ruas.", "titulo_pt": "Flávio deixa de lado 'Bolsonaro moderado' e defende tirar bandido 'de pé ou deitado'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 117784, "titulo": "Direita se organiza, e centro ganha terreno no Nordeste sem confrontar Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/direita-se-organiza-e-centro-ganha-terreno-no-nordeste-sem-confrontar-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-22T15:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A direita nordestina se organiza, enquanto o centro político ganha espaço no Nordeste sem confrontar diretamente o presidente Lula. Raquel Lyra, governadora de Pernambuco, participa de missa no sertão central do estado, ao lado de seu adversário João Campos.", "titulo_pt": "Direita se organiza e centro ganha terreno no Nordeste sem confrontar Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 118263, "titulo": "Defense budget proposal sending US signals: expert", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/23/2003862980", "fonte_id": "taipei_times", "data_pub": "2026-08-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um plano de orçamento de defesa está sendo usado para enviar sinais para os Estados Unidos, de acordo com um especialista. O plano parece indicar que Taiwan está disposta a aumentar sua capacidade defensiva.", "titulo_pt": "Plano de orçamento de defesa enviando sinais para os estados unidos: especialista", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 118059, "titulo": "Carney Slams U.S.-Canada Trade Proposal and Vows Retaliation", "url": "https://www.nytimes.com/2026/08/22/world/canada/carney-tariffs-trade-trump.html", "fonte_id": "nyt_world", "data_pub": "2026-08-22T17:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro Canadá, Mark Carney, fez um discurso forte aos canadenses no sábado de manhã, após ordenar que negociadores suspendessem as negociações de comércio com os Estados Unidos, em resposta às tarifas impostas pelo presidente americano, Donald Trump.", "titulo_pt": "Carney desdenha proposta de comércio entre EUA e canadá e promete retaliação", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 118239, "titulo": "Ukrainian drones kill at least 10, hit warehouse of Russian online retailer Ozon", "url": "https://www.scmp.com/news/world/russia-central-asia/article/3364941/ukrainian-drones-kill-least-10-hit-warehouse-russian-online-retailer-ozon?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-22T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ucranianos usaram drones para atacar alvos em território russo e em áreas ocupadas pela Rússia na Ucrânia, causando pelo menos 10 mortes, incluindo um armazém do varejista online russo Ozon. A Rússia e a Ucrânia intensificaram suas campanhas com drones visando desestruturar a infraestrutura econômica do adversário.", "titulo_pt": "Drones ucranianos matam pelo menos 10 pessoas em ataques a depósito do varejista russo Ozon", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 118178, "titulo": "Trump reshuffled his portfolio in June, selling names like Meta and buying Berkshire Hathaway", "url": "https://www.cnbc.com/2026/08/22/trump-reshuffled-his-portfolio-in-june-selling-names-like-meta-and-buying-berkshire-hathaway.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-22T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em junho, o presidente Donald Trump realizou mais de mil transações financeiras, indicando uma reorganização significativa de sua carteira de investimentos. Ele vendeu ativos como Meta e comprou ações da Berkshire Hathaway.", "titulo_pt": "Trump reorganizou sua carteira em junho, vendendo Meta e comprando Berkshire Hathaway", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 117884, "titulo": "Putin diz que Ucrânia abriu “caixa de Pandora” após novos ataques", "url": "https://www.cnnbrasil.com.br/internacional/putin-diz-que-ucrania-abriu-caixa-de-pandora-apos-novos-ataques/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-22T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Kiev intensificou ataques com drones contra infraestrutura econômica russa, incluindo refinarias de petróleo e armazéns de varejistas online. Putin afirma que a Ucrânia abriu uma 'caixa de Pandora' com esses novos ataques.", "titulo_pt": "Putin diz que Ucrânia abriu 'caixa de Pandora' após novos ataques com drones", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 118160, "titulo": "Canada to hit back with retaliatory tariffs after US trade talks fail", "url": "https://www.dw.com/en/canada-to-hit-back-with-retaliatory-tariffs-after-us-trade-talks-fail/a-78471618?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-22T17:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Canadá implementou tarifas sobre produtos americanos em resposta à declaração dos Estados Unidos de que tarifas seguiriam após o fracasso das negociações. A disputa comercial entre Ottawa e Washington intensificou-se.", "titulo_pt": "Canadá reagirá com tarifas retaliatórias após falha nas negociações comerciais", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 118208, "titulo": "Mark Carney says Canada is now ‘at war’ with US over trade", "url": "https://www.ft.com/content/e3b5c236-bd5f-45c2-8ddf-5279a7375d3f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-22T17:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Canadá afirmou que o país está agora 'em guerra' com os Estados Unidos devido às tarifas comerciais. Ele argumentou que Donald Trump subestimou a reação do Canadá ao aumentar suas tarifas.", "titulo_pt": "Canadá está 'em guerra' com EUA sobre comércio, diz primeiro-ministro", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 117986, "titulo": "A agonia das famílias de milhares de pessoas que permanecem desaparecidas na Faixa de Gaza", "url": "https://www.bbc.com/portuguese/articles/c3ekgjg0qp5o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-22T17:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Cruz Vermelha relatou ter recebido mais de 5 mil pedidos de localização de pessoas que podem ter sido detidas por Israel ou cujos corpos podem estar entre os destroços na Faixa de Gaza. Essa situação afeta milhares de famílias desesperadas por informações.", "titulo_pt": "A agonia das famílias de milhares de pessoas desaparecidas na Faixa de Gaza", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 118211, "titulo": "L'offerta di Mps sul tavolo del cda del Banco Bpm, cruciale il Credit Agricole", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/22/lofferta-di-mps-sul-tavolo-del-cda-del-banco-bpm-cruciale_1607e49f-75fb-4f7e-95ae-627af1ee9c56.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-22T17:09:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A reunião do conselho de administração do Banco BPM ocorreu no início da semana, aguardando a posição dos franceses, especialmente do Credit Agricole. O Financial Times considera a situação muito crítica.", "titulo_pt": "Proposta do Mps na mesa do conselho do Banco Bpm, situação crítica aguardando posicionamento dos franceses", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 118131, "titulo": "The slow reconciliation of Polish and Ukrainian memories over World War II mass graves", "url": "https://www.lemonde.fr/en/international/article/2026/08/22/the-slow-reconciliation-of-polish-and-ukrainian-memories-over-world-war-ii-mass-graves_6756766_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-22T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em vilas ucranianas do Ocidente, como Wola Ostrowiecka e Ostrowki, arqueólogos e historiadores estão exumando corpos de civis poloneses mortos a manos de nacionalistas ucranianos em 1943. Este passado doloroso ainda pesa nas relações diplomáticas entre Kiev e Varsovia, mais de 80 anos depois.", "titulo_pt": "O lento reconciliamento das memórias polonesas e ucranianas sobre os túmulos da segunda guerra mundial", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 118130, "titulo": "US military newspaper editor voices censorship fears after being fired", "url": "https://www.bbc.co.uk/news/articles/cm2g23ng8p4o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-22T16:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Erik Slavin, editor de um jornal militar dos Estados Unidos, acredita ter sido demitido por falar em uma entrevista que censuração seria um limite vermelho em uma situação hipotética.", "titulo_pt": "Editor de jornal militar dos EUA alega censura após demissão", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 118181, "titulo": "South Korea sending first container ship through Arctic route", "url": "https://www.aljazeera.com/news/2026/8/22/south-korea-sending-first-container-ship-through-arctic-route?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-22T16:46:00Z", "idioma": "en", "provavel_duplicata_de": 117725, "texto_pt": "Um navio-container chamado PanStar Acro está sendo enviado pela Coreia do Sul pelo caminho Ártico para testar a viabilidade comercial de uma rota aberta pela derretimento da geleada marítima.", "titulo_pt": "Coreia do sul envia primeiro navio-container pelo caminho ártico", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 118127, "titulo": "Carney calls Trump's fresh tariffs a 'miscalculation' after trade talks collapse", "url": "https://www.bbc.co.uk/news/articles/cx272np7vgyo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-22T16:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Canadá declarou que os novos tarifas impostas pelos EUA por Trump são uma 'miscalculada' e que o Canadá está retaliando com tarifas após o colapso das negociações comerciais. Ele acusou os EUA de iniciarem uma guerra comercial.", "titulo_pt": "Carney chama novas tarifas de Trump de 'miscalculada' após falência das negociações comerciais", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 118182, "titulo": "Sanctioned by EU, Israeli settler steals and kills Palestinian donkey", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/22/22-08-clip-palestinian-donkey-killed-by-setllers-ps?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-22T16:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um burro de um agricultor palestiniano foi supostamente roubado e arrastado até a morte por colonos israelenses.", "titulo_pt": "Palestino tem burro roubado e morto por colonos israelenses, aprovado pela ue", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 118036, "titulo": "Trump vuelve a imponer aranceles de 50% a Canadá y Carney responde con la misma cifra", "url": "https://www.lanacion.com.ar/el-mundo/trump-vuelve-a-imponer-aranceles-de-50-a-canada-y-carney-responde-con-la-misma-cifra-nid22082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-22T16:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Após falhar nas negociações, Trump reestabeleceu aranceles de 50% sobre importações canadenses. O primeiro-ministro canadense respondeu com aranceles equivalentes de 50%.", "titulo_pt": "Trump reestabelece arancel de 50% sobre Canadá e Carney contrapõe com a mesma cifra", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 118161, "titulo": "Nigeria: Jihadis kidnap dozens during Friday prayers", "url": "https://www.dw.com/en/nigeria-jihadis-kidnap-dozens-during-friday-prayers/a-78471356?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-22T16:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Homens armados com armas de fogo e machados sequestraram dezenas de pessoas em dois vilarejos no estado de Niger, na Nigéria. Detalhes sobre o ataque ainda não foram confirmados pela polícia.", "titulo_pt": "Nigéria: jihadistas sequestram dezenas durante orações de Friday", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 118258, "titulo": "Trump tariffs hit as Canada tries to curb US reliance", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/23/2003862968", "fonte_id": "taipei_times", "data_pub": "2026-08-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As tarifas impostas pelo governo dos Estados Unidos estão causando problemas, enquanto o Canadá tenta reduzir a dependênc egador de alta potência em um celular antigo não prejudica a bateria, desde que o carregador seja compatível e em boas condições. O celular controla a quantidade de energia que recebe, mesmo com um carregador mais potente.", "titulo_pt": "Usar 'carregador turbo' em celular antigo vicia a bateria? Entenda o risco real", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 117972, "titulo": "Hora de dar um upgrade no armazenamento: SSDs NVMe em promoção na Amazon", "url": "https://olhardigital.com.br/2026/08/22/reviews/hora-de-dar-um-upgrade-no-armazenamento-ssds-nvme-em-promocao-na-amazon-2/", "fonte_id": "olhar_digital", "data_pub": "2026-08-22T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon está oferecendo SSDs NVMe em promoção, com diferentes capacidades e perfis de uso. São três opções disponíveis, desde upgrades básicos até opções de alto desempenho.", "titulo_pt": "Hora de dar um upgrade no armazenamento: ssds NVMe em promoção na Amazon", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 117958, "titulo": "Como saber se sua fonte aguenta uma GPU nova sem gambiarras", "url": "https://canaltech.com.br/hardware/como-saber-se-fonte-aguenta-gpu-nova/", "fonte_id": "canaltech", "data_pub": "2026-08-22T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Trocar a placa de vídeo é um dos upgrades mais empolgantes no PC, mas é crucial avaliar a capacidade da fonte de alimentação para evitar problemas de estabilidade e reduzir o risco de danos ao sistema. É necessário verificar se a fonte atual pode suportar a nova GPU, evitando o uso de adaptadores improvisados.", "titulo_pt": "Como saber se sua fonte aguenta uma placa de vídeo nova sem gambiarras", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 117959, "titulo": "7 coisas que você não deve fazer enquanto o celular está carregando", "url": "https://canaltech.com.br/smartphone/7-coisas-que-voce-nao-deve-fazer-enquanto-o-celular-esta-carregando/", "fonte_id": "canaltech", "data_pub": "2026-08-22T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O uso do celular enquanto está carregando pode aumentar o aquecimento e acelerar o desgaste dos componentes. Testes realizados pelo Canaltech com câmeras térmicas mostraram que o smartphone pode atingir temperaturas superiores a 40 °C durante tarefas pesadas enquanto carregado.", "titulo_pt": "7 Coisas que você não deve fazer enquanto o celular está carregando", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}], "tecnologia__eventos": [], "ciencia": [{"id": 118308, "titulo": "Mars Curiosity rover discovers massive field of polygons", "url": "https://phys.org/news/2026-08-mars-curiosity-rover-massive-field.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rover Curiosity da NASA descobriu um campo extenso de polígonos na superfície de Marte. A superfície do planeta vermelho carece de processos de renovação da superfície encontrados na Terra, como tectonicidade placa, vulcanismo e água líquida em movimento.", "titulo_pt": "Curiosity da nasa descobre vasto campo de polígonos em marte", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118309, "titulo": "AI mapping reveals hidden stage of Arctic freeze with climate implications", "url": "https://phys.org/news/2026-08-ai-reveals-hidden-stage-arctic.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fase chamada de 'curtina zero' no Ártico, onde o solo permanece próximo ao ponto de congelamento por dias ou semanas, foi mapeada com alta resolução em um novo estudo liderado pela NASA. Esses mapas revelam um estágio oculto do congelamento no Ártico com implicações climáticas.", "titulo_pt": "Mapeamento de inteligência artificial revela estágio oculto do congelamento no ártico com implicações climáticas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118038, "titulo": "Por qué un equipo de científicos pidió extraer 3500 corales de Florida y trasladarlos al norte: “Están en peligro”", "url": "https://www.lanacion.com.ar/ciencia/por-que-un-equipo-de-cientificos-pidio-extraer-3500-corales-de-florida-y-trasladarlos-al-norte-estan-nid22082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-22T16:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um grupo de cientistas planeja remover 3500 corais de Florida e transferi-los para o norte em uma estratégia para proteger essas espécies da elevação da temperatura marinha. Os corais estão em risco devido ao aquecimento das águas.", "titulo_pt": "Por que um time de cientistas moveu 3500 corais de Florida para o norte: 'estão em perigo'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 118025, "titulo": "Descubren por qué los hombres tienen el doble de probabilidades de contraer tuberculosis que las mujeres", "url": "https://www.clarin.com/internacional/descubren-hombres-doble-probabilidades-contraer-tuberculosis-mujeres_0_RSbdkTJK67.html", "fonte_id": "clarin", "data_pub": "2026-08-22T16:22:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo global descobriu que os homens têm o dobro de chances de contrair tuberculose em comparação com as mulheres, mas isso não está relacionado a diferenças biológicas. O verdadeiro motivo para essa diferença ainda não foi identificado.", "titulo_pt": "Por que os homens têm o dobro de chances de contrair tuberculose que as mulheres?", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 118310, "titulo": "Heat wave-hit Europe logs over 30,000 excess summer deaths: First figures", "url": "https://phys.org/news/2026-08-europe-excess-summer-deaths-figures.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Europa registrou mais de 30.000 mortes excessivas durante o verão, influenciado por uma série de ondas de calor consecutivas e seca, que os cientistas atribuíram ao aquecimento global causado pelo homem.", "titulo_pt": "Europa registra mais de 30.000 mortes excessivas no verão devido a ondas de calor e seca", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118323, "titulo": "How will NASA's astronaut training hub change with commercial space stations?", "url": "https://www.space.com/space-exploration/international-space-station/how-will-nasas-astronaut-training-hub-change-with-commercial-space-stations", "fonte_id": "space_com", "data_pub": "2026-08-22T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A visita à Johnson Space Center em Houston demonstra como NASA e indústria privada já colaboram no futuro dos voos espaciais humanos. O hub de treinamento de astronautas da NASA está se adaptando para trabalhar com estações espaciais comerciais futuras.", "titulo_pt": "Como o hub de treinamento de astronautas da NASA vai mudar com as estações espaciais comerciais?", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 118311, "titulo": "AI decodes DNA initiator sequence found in about 60% of human genes", "url": "https://phys.org/news/2026-08-ai-decodes-dna-sequence-human.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A precisão na ativação de dezenas de milhares de genes é crucial para o desenvolvimento e crescimento saudáveis. Seções específicas do DNA desempenham um papel importante na regulação dos genes que resultam na produção de enzimas, hormônios, proteínos e outros componentes essenciais para a estrutura e função celular.", "titulo_pt": "IA decodifica sequência DNA que inicia a ativação de aproximadamente 60% dos genes humanos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118312, "titulo": "Arctic shipping a daunting prospect in hotly contested region", "url": "https://phys.org/news/2026-08-arctic-shipping-daunting-prospect-hotly.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A instabilidade no Golfo está reduzindo o tráfego no Canal de Suez, levando as empresas de navegação a considerar o Ártico como uma alternativa para viagens mais rápidas entre a Europa e a Ásia, embora as perspectivas comerciais não estejam alinhadas com as aspirações estratégicas dos países em relação ao Polo Norte.", "titulo_pt": "Marítimo no ártico: uma proposta tentadora, mas com limitadas perspectivas comerciais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118313, "titulo": "Thawing Arctic riverbeds may erode up to 10 times faster than unfrozen ground", "url": "https://phys.org/news/2026-08-arctic-riverbeds-erode-faster-unfrozen.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa mostrou que os leitos de rios no Ártico estão erosionando até 10 vezes mais rápido do que o solo não congelado, algo inesperado para os pesquisadores.", "titulo_pt": "Leitos de rios no ártico podem erodir até 10 vezes mais rápido que o solo não congelado", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118314, "titulo": "A museum-shelf mystery reveals 6,500-year-old human tooth pendant in Serbia", "url": "https://phys.org/news/2026-08-museum-shelf-mystery-reveals-year.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um dente humano datado de mais de 6.500 anos foi encontrado durante pesquisas arqueológicas no site vinča de Jablanica na Sérvia. Inicialmente confundido com uma pulseira de dente de animal, o dente foi reidentificado como um colar após uma análise mais detalhada por Nemanja Marković e Ana Maričić.", "titulo_pt": "Mistério de museu revela pingente de dente humano de 6.500 anos na sérvia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118315, "titulo": "Near-total lunar eclipse is coming up with the Americas in prime position", "url": "https://phys.org/news/2026-08-total-lunar-eclipse-americas-prime.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T14:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um eclipse lunar quase total está ocorrendo, com as Américas em uma posição privilegiada para observá-lo. A superfície lunar será quase completamente coberta pela sombra da Terra, com 96% do disco lunar entrando na penumbra.", "titulo_pt": "Eclipse lunar quase total está por vir, com as américas em ótima posição", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118300, "titulo": "Peppermint oil lowers blood pressure in just 20 days", "url": "https://www.sciencedaily.com/releases/2026/08/260821012238.htm", "fonte_id": "science_daily", "data_pub": "2026-08-22T14:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo mostrou que o óleo de menta pode reduzir a pressão arterial sistólica em adultos com hipertensão leve em média 8,5 mmHg após 20 dias de ingestão de uma pequena dose duas vezes ao dia. Os participantes do grupo placebo não apresentaram mudanças significativas.", "titulo_pt": "Óleo de menta reduz pressão arterial em 20 dias", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 117790, "titulo": "Cores não estão na luz, mas na interpretação que o cérebro faz", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/cores-nao-estao-na-luz-mas-na-interpretacao-que-o-cerebro-faz.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-22T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As cores não são intrínsecas à luz, mas sim interpretadas pelo cérebro. Vermelho é associado a perigo, verde a tranquilidade, azul a relaxamento e amarelo a atenção.", "titulo_pt": "As cores não estão na luz, mas na interpretação que o cérebro faz", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 118324, "titulo": "'We Want to Believe' book explores the reality of UFOs: 'It's always going to be more likely that someone is wrong about what they saw' (interview)", "url": "https://www.space.com/entertainment/we-want-to-believe-book-explores-the-reality-of-ufos-its-always-going-to-be-more-likely-that-someone-is-wrong-about-what-they-saw-interview", "fonte_id": "space_com", "data_pub": "2026-08-22T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Adam Kirsch, crítico literário e editor sênior da The Atlantic, explora a curiosidade humana em relação a fenômenos desconhecidos no céu em seu livro 'We Want to Believe'.", "titulo_pt": "Livro explora a fascinação humana por ovnis", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 118299, "titulo": "Exercise may work better for keeping weight off than losing it", "url": "https://www.sciencedaily.com/releases/2026/08/260821012240.htm", "fonte_id": "science_daily", "data_pub": "2026-08-22T13:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Exercícios físicos podem não ser uma ferramenta eficaz para perda de peso sozinhos, mas parecem desempenhar um papel maior na prevenção do retorno do peso perdido. A atividade regular pode facilitar a manutenção a longo prazo do peso ao preservar a massa muscular, suportar a metabolização, melhorar a queima de gordura e regular o apetite e o açúcar no sangue.", "titulo_pt": "Exercício pode funcionar melhor para manter o peso do que para perdê-lo", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 118325, "titulo": "This Week In Space podcast: Episode 224 — The Science of Artemis", "url": "https://www.space.com/entertainment/space-movies-shows/this-week-in-space-podcast-episode-224-the-science-of-artemis", "fonte_id": "space_com", "data_pub": "2026-08-22T13:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na 224ª edição do This Week In Space, Rod Pyle, Rick Jenet e Dr. David Kring discutem os planos de exploração lunar do programa Artemis, abordando os locais, motivos e métodos envolvidos.", "titulo_pt": "Podcast this Week In Space: episódio 224 — a ciência por trás do programa Artemis", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 118279, "titulo": "The challenges of Bilingual 2030", "url": "https://www.taipeitimes.com/News/editorials/archives/2026/08/23/2003862957", "fonte_id": "taipei_times", "data_pub": "2026-08-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute os desafios relacionados à implementação do programa bilíngue 2030. Ele aborda as dificuldades que podem surgir durante a implementação desta iniciativa educacional.", "titulo_pt": "Desafios do bilíngue 2030", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 118030, "titulo": "Tres novelistas argentinos entre los seleccionados para la Feria del Libro de Guadalajara", "url": "https://www.lanacion.com.ar/cultura/tres-novelistas-argentinos-entre-los-seleccionados-para-la-feria-del-libro-de-guadalajara-nid22082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-22T17:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um comité de escritores mexicanos e a diretora da Feria do Livro de Guadalajara selecionaram vinte e seis novelistas hispanoamericanos para participar do evento, que ocorrerá de 28 de novembro a 6 de dezembro.", "titulo_pt": "Três novelistas argentinos entre os selecionados para a feira do livro de Guadalajara", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 117803, "titulo": "Elenco de 'Quem Ama Cuida' muda visual em festa de perucas; veja fotos", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/televisao/2026/08/elenco-de-quem- arte. A família possui quatro gerações de atores.", "titulo_pt": "Sou uma bisnepobaby, brinca Ana Clara Winter, bisneta de Lima Duarte e filha de Palomma Duarte", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 118121, "titulo": "Why Do Rich Kids Love Socialism?", "url": "https://www.theatlantic.com/culture/2026/08/socialism-rich-kids-gordillo/688382/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-08-22T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ter dinheiro não está em conflito com a vontade de ter um sistema econômico mais justo.", "titulo_pt": "Por que filhos de ricos gostam de socialismo?", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 118320, "titulo": "The film Apollo 13 taught me how to survive heartbreak", "url": "https://www.theguardian.com/culture/2026/aug/22/the-film-apollo-13-taught-me-how-to-survive-heartbreak", "fonte_id": "guardian_culture", "data_pub": "2026-08-22T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois do fim do seu relacionamento, a autora se viu repetidamente assistindo ao filme Apollo 13, sobre três astronautas presos em uma nave danificada. O filme a ajudou a perceber que o sucesso pode ser apenas chegar em casa. A frase 'Falha não é uma opção' é um lema familiar da família dela, inspirada no filme.", "titulo_pt": "O filme Apollo 13 me ensinou como sobreviver ao coração partido", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 118322, "titulo": "The faces behind the feeds: Gen Z’s private lives and public posts – in pictures", "url": "https://www.theguardian.com/artanddesign/2026/aug/22/the-faces-behind-the-feeds-gen-zs-private-lives-and-public-posts-in-pictures", "fonte_id": "guardian_culture", "data_pub": "2026-08-22T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Niccolò Rastrelli fotografou jovens da geração Z para comparar suas identidades privada es", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 118136, "titulo": "'We used to see it as a White sport': Black South Africans grow fond of national rugby team", "url": "https://www.lemonde.fr/en/le-monde-africa/article/2026/08/22/we-used-to-see-it-as-a-white-sport-black-south-africans-grow-fond-of-national-rugby-team_6756764_124.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-22T16:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ao longo das últimas décadas, a seleção nacional de rugby da África do Sul conseguiu unir uma ampla audiência, realizando o sonho que Nelson Mandela apoiou em 1995. No sábado, os Springboks enfrentarão os All Blacks da Nova Zelândia em casa, em sua primeira partida de três confrontos.", "titulo_pt": "Nós costumávamos ver isso como um esporte branco: sul-africanos negros se aproximam da seleção nacional de rugby", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 117896, "titulo": "“Líquido da morte”? Bebidas açucaradas elevam em 2,45 vezes risco de câncer", "url": "https://www.cnnbrasil.com.br/saude/liquido-da-morte-bebidas-acucaradas-elevam-em-245-vezes-risco-de-cancer/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-22T16:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O consumo de bebidas açucaradas aumenta em 2,45 vezes o risco de câncer. Quanto maior a ingestão de frutose, maior a incidência de câncer gástrico.", "titulo_pt": "‘Líquido da morte’? Bebidas açucaradas elevam em 2,45 vezes o risco de câncer", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 118027, "titulo": "Cinco adolescentes robaron un auto en Mataderos, salieron en un raid por La Matanza y cayeron tras una persecución: acumulan 23 antecedentes", "url": "https://www.clarin.com/policiales/adolescentes-robaron-auto-mataderos-salieron-raid-matanza-cayeron-persecucion-acumulan-23-antecedentes_0_lwyWowqEQ2.html", "fonte_id": "clarin", "data_pub": "202 l, "texto_pt": "Jovens adultos estão tomando medicamentos para ansiedade em festas para se sentirem embriagados. Especialistas alertam sobre as consequências para a saúde.", "titulo_pt": "A geração sóbria: por que jovens adultos usam remédios para ansiedade em festas e as preocupações disso", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 117991, "titulo": "Hayden Panettiere: como acesso a drogas e pressão intensa levam estrelas mirins ao vício", "url": "https://www.bbc.com/portuguese/articles/cp8x8e5dne5o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-22T10:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas afirmam que a pressão da fama na infância pode aumentar o risco de atrizes jovens desenvolverem problemas com o abuso de substâncias. O acesso a drogas e a pressão intensa são citados como fatores que podem levar estrelas mirins ao vício.", "titulo_pt": "Hayden Panettiere: pressão da fama e acesso a drogas podem levar estrelas mirins ao vício", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 118139, "titulo": "Drug trafficking: 'We are facing behavior marked by extreme violence, with few limits on taking action'", "url": "https://www.lemonde.fr/en/france/article/2026/08/22/drug-trafficking-we-are-facing-behavior-marked-by-extreme-violence-with-few-limits-on-taking-action_6756758_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-22T10:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O procurador-chefe Nice Damien Martinelli fala sobre a violência relacionada ao tráfico de drogas em sua cidade em uma entrevista ao Le Monde, detalhando como as redes criminosas e a luta contra o tráfico de drogas evoluíram.", "titulo_pt": "Tráfico de drogas: 'fazemos face a comportamentos marcados por violência extrema, com poucos limites para a ação'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 117355, "titulo": "Ass : "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 118259, "titulo": "China mulls bid to host 2028 UN climate talks: sources", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/23/2003862969", "fonte_id": "taipei_times", "data_pub": "2026-08-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fontes informaram que a China está considerando a possibilidade de sediar as negociações climáticas da ONU em 2028. Até o momento, não há decisão oficial sobre a proposta.", "titulo_pt": "China considera sediar debates climáticos da ONU em 2028: fontes", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 118092, "titulo": "Conaf denuncia presencia de motos de nieve en actividades ilegales en reserva nacional Malalcagüello", "url": "https://www.latercera.com/nacional/noticia/conaf-denuncia-presencia-de-motos-de-nieve-en-actividades-ilegales-en-reserva-nacional-malalcaguello/", "fonte_id": "la_tercera", "data_pub": "2026-08-22T17:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Guardas ambientais identificaram seis motos de neve realizando atividades ilegais na Reserva Nacional Malalcagüello. A Conaf denunciou esses incidentes ao Juzgado de Polícia Local de Curacautín e aumentará as rondas em conjunto com a Carabineros.", "titulo_pt": "Conaf denuncia presença de motos de neve em atividades ilegais na reserva nacional Malalcagüello", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 118140, "titulo": "Climate demands political leadership", "url": "https://www.lemonde.fr/en/opinion/article/2026/08/22/climate-demands-political-leadership_6756762_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-22T14:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os líderes políticos não comentaram sobre as consequências da onda de calor inédita no verão de 2026 e as soluções necessárias, o que pode ser interpretado como inabilidade em agir ou, pior, falta de vontade de faz l", "data_pub": "2026-08-22T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Organização Não-Governamental Habitat para a Humanidade Brasil alerta para o risco de aumento de eventos como enchentes, deslizamentos de terra, estiagens e queimadas devido à elevação das temperaturas e mudanças nas chuvas associadas ao fenômeno 'Super El Niño'.", "titulo_pt": "Super El Niño: ONG avalia risco para moradias vulneráveis no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 117547, "titulo": "Climatologist Jean Jouzel: 'None of France's presidential candidates truly grasp the reality of global warming'", "url": "https://www.lemonde.fr/en/environment/article/2026/08/22/climatologist-jean-jouzel-none-of-france-s-presidential-candidates-truly-grasp-the-reality-of-global-warming_6756754_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-22T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O paleoclimatologista e ex-vice-presidente do painel científico do IPCC, Jean Jouzel, expressou preocupação sobre a possibilidade de que os candidatos presidenciais franceses não compreendam plenamente a gravidade do aquecimento global. Ele incentiva os candidatos a reconhecerem a escala deste desafio global.", "titulo_pt": "Cientista do clima Jean Jouzel: 'nenhum dos candidatos presidenciais franceses realmente compreende a realidade do aquecimento global'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 117699, "titulo": "China banned ivory, but Vietnamese gangs keep the trade alive", "url": "https://www.scmp.com/week-asia/health-environment/article/3364858/china-banned-ivory-vietnamese-gangs-keep-trade-alive?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-22T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três meses após deixar uma porta fluvial interna do Congo, uma remessa de madeira que chegou à Vietnam neste verão escondia 1,2 toneladas quase de ossos de elefante de ivoire, contrabandeado por metade do mundo. A carga viajou cerca de 9.000 náuticos com paradas em Sri Lanka e Singapura antes de chegar a Quy Nhon, um porto na costa central do Vietnam.", "titulo_pt": "China proibiu o ivoire, mas gangues vietnamitas mantêm o comércio vivo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 117664, "titulo": "Heat wave-hit Europe logs over 30,000 excess summer deaths", "url": "https://www.japantimes.co.jp/environment/2026/08/22/heat-wave-europe-30000-deaths/", "fonte_id": "japan_times", "data_pub": "2026-08-22T00:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Entre julho e agosto, o EuroMomo, plataforma de monitoramento da Europa, estima que mais de 32.000 mortes a mais ocorreram na região. O verão ainda não terminou.", "titulo_pt": "Onslaught de calor na Europa registra mais de 30.000 mortes a mais no verão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 116371, "titulo": "Indigenous groups unequally affected by energy poverty", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/22/2003862942", "fonte_id": "taipei_times", "data_pub": "2026-08-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos indígenas são afetados de forma desigual pela pobreza energética.", "titulo_pt": "Grupos indígenas afetados de forma desigual pela pobreza energética", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 118052, "titulo": "El casino que no existe: sancionando a influencers", "url": "https://www.ciperchile.cl/2026/08/22/el-casino-que-no-existe-sancionando-a-influencers/?utm_source=rss&utm_medium=rss&utm_campaign=el-casino-que-no-existe-sancionando-a-influencers", "fonte_id": "ciper_chile", "data_pub": "2026-08-22T12:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a regulamentação de influenciadores p function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");

    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}
