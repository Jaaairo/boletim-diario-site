os. Além disso, o Canadá implementou tarifas retaliatórias de até 50% sobre produtos americanos, em meio a uma escalada na guerra comercial entre os dois países. Em um evento cultural, a cantora Dolly Parton faleceu aos 80 anos, deixando uma herança duradoura na música country e influenciando artistas como Stevie Nicks e Miley Cyrus.\n\nO Irã prometeu retaliar após os Estados Unidos intensificarem as sanções econômicas contra o país, conforme relatado pelo Taipei Times. O secretário de Estado americano, Marco Rubio, informou a aliados que os Estados Unidos não planejam iniciar novos ataques ao Irã, mas enfatizam as sanções, de acordo com o Axios. Apesar de novas sanções econômicas terem sido impostas pelo Estados Unidos, especialistas afirmam que isso não pressionará o governo iraniano a ceder, informa o Al Jazeera. A Organização da Cooperação Islâmica condenou veementemente o ataque israelense ao quartel-general da Agência das Nações Unidas para Refugiados Palestinos (Unrwa) em Qalqilya, ocupado, conforme relatado pelo Middle East Eye. Além disso, Israel realizou ataques aéreos em Al-Mansouri e Sarbin, nas regiões sul do Líbano, segundo a agência de notícias nacional libanesa (NNA).", "economia": "A economia brasileira registrou um aumento no índice de produção industrial, indicando uma recuperação gradual. As vendas no varejo e no setor de alimentos e bebidas também atingiram recordes em julho, refletindo um crescimento econômico. O governo federal prorrogou o regime de drawback para empresas afetadas por tarifas adicionais dos Estados Unidos, enquanto o Ibovespa atingiu 174 mil pontos após cinco sessões consecutivas de alta. A arrecadação federal cresceu 9% em julho, impulsionada pelo IOF e pelo imposto sobre a exportação de petróleo, o melhor resultado para o mês desde 1995. A Embraer obteve certificação para um jato executivo com sistema de pouso automatizado, enquanto a Smart Fit anunciou o crescimento do segmento de estúdios dentro da empresa. A Braskem caiu mais de 8% na Bolsa após solicitar recuperação extrajudicial, e a Oi teve sua falência decretada pela justiça. O Canadá anunciou tarifas retaliatórias de 50% sobre US$ 20 bilhões em exportações dos Estados Unidos, em resposta a uma taxa similar imposta pelos EUA. A Volkswagen enfrentou protestos de funcionários durante uma reunião na sede da empresa em Berlim, com o CEO Oliver Blume pedindo união dos trabalhadores em face de cortes de custos e possíveis demissões.", "tecnologia": "A SpaceX planeja investir 100 bilhões de dólares em um segundo complexo de lançamento em Louisiana, conhecido como Starbase, para apoiar mais lançamentos do Starship. Este projeto, que começará a ser construído em 2027, visa expandir as operações espaciais da empresa. Em outra notícia, a Stability AI, detentora do gerador de imagens Stable Diffusion, levantou recentemente 76 milhões de dólares em novos fundos, elevando seu total de financiamento para 232 milhões de dólares. Além disso, o Google expandiu sua plataforma de inteligência artificial, Gemini Enterprise, com novas ferramentas direcionadas a advogados e escritórios de advocacia, intensificando a competição entre empresas de tecnologia para atender às necessidades do setor jurídico. Um estudo conduzido por Pattie Maes e colegas do MIT Media Lab revelou que chatbots de inteligência artificial podem comprometer a precisão na avaliação de notícias, enquanto engenheiros da MIT desenvolveram um sensor de temperatura ingestível de apenas 6 por 4 mm que pode fornecer atualizações contínuas de temperatura.", "ciencia": "A pesquisa em 3D atômica revelou um novo caminho para a formação de cristais, desafiando a teoria clássica de núcleação. Esta descoberta, publicada em [phys_org], sugere novos mecanismos de formação de núcleos ordenados, com implicações significativas para a compreensão de como transições de fase ocorrem. Além disso, a NASA anunciará os vencedores do LunaRecycle Challenge, um desafio para inovar em sistemas de reciclagem para futuras missões lunares, no dia 28 de agosto na Universidade do Alabama, conforme informado em [nasa_news]. Estes dois eventos representam avanços significativos em ciência e tecnologia, destacando a importância de pesquisas fundamentais e inovações aplicadas.", "cultura": "Dolly Parton, a lendária cantora country, deixou uma marca indelével na música e cultura americana, com hits como 'Jolene' e 'I Will Always Love You'. Suas inovações na música country e sua filantropia a tornaram uma figura global, inspirando artistas como Cyndi Lauper, Paul McCartney e Jack White. A Bienal de Gwangju restaurou o nome 'Taiwan' em suas atividades, enquanto a artista chinesa Gao Zhen recebeu uma sentença de três anos de prisão por suas esculturas satíricas de Mao Zedong. A 50ª Mostra Internacional de Cinema de São Paulo terá a presença do diretor James Gray para a abertura, com o filme 'Tigre de Papel' estreando no festival. A cultura também se expressou em outros formatos, como o show de Ana Castela em São Fidélis, e a performance de Anne Imhof inspirada em balé no Tai Kwun Contemporary em Hong Kong.", "sociedade": "No Reino Unido, sete pessoas morreram em um acidente envolvendo a prática perigosa de dirigir na contramão, que se espalhou rapidamente em plataformas como o TikTok. Como resposta, Londres pediu à TikTok para remover os vídeos relacionados a essa prática. No estado de São Paulo, o programa contra a violência de gênero já treinou mais de 120 mil trabalhadores e incorporou orientações sobre direitos e proteção nas salas de aula. Em Rio Grande do Sul, um homem de 70 anos foi preso após invadir uma clínica com um carro, sendo encontrado com porções de crack. Em São Paulo, uma influenciadora esfaqueou um suspeito acusado de abusar da filha de 5 anos, levando a uma investigação policial. A Venezuela construiu 335 novas moradias e reabilitou mais de 1.100 imóveis após terremotos, acolhendo mais de 25 mil pessoas desabrigadas. Além disso, o governo de Gyeonggi, na Coréia do Sul, aumentou para 300 o número de oficiais dedicados à proteção dos direitos dos professores.", "meio_ambiente": "Os oceanos registraram um novo recorde histórico de temperatura devido ao fenômeno El Niño, que também superou o recorde de 2024, conforme alertou o Copernicus. O Chile enfrenta desafios para limitar o aquecimento global. Em outro desenvolvimento, a Coreia do Sul está prestes a sediar seu primeiro festival musical com foco na neutralidade de carbono em Incheon. Além disso, uma menina de 8 anos, Lillian Smart, morreu em Louisiana após contrair uma infecção por Naegleria fowleri, uma ameba presente em águas quentes. No Brasil, as temperaturas subiram rapidamente em várias regiões, com altas temperaturas previstas para o Sudeste, Centro-Oeste, Paraná e Nordeste. No exterior, um tornado causou danos em pelo menos 300 casas e feriu 39 pessoas na França, enquanto a Indonésia enfrenta intensas queimadas florestais e neblina tóxica no Sul de Sumatra.", "direitos_humanos": "A ONU e a Cruz Vermelha pediram a proibição de armas autônomas após relatos de que um drone russo usou inteligência artificial na Ucrânia para escolher alvos em um ataque que resultou em mortes. Mais de 3.900 crianças foram mortas ou feridas em ataques na Ucrânia desde o agravamento da guerra, atingindo o maior nível de vítimas infantis dos últimos quatro anos. Em outro conflito, os rohingyas em Myanmar continuam sendo forçados a fugir devido ao genocídio, com a crise durando nove anos. Em outro caso, um milhão de crianças afegãs estão enfrentando problemas de nutrição crítica, segundo a UNICEF. A China condenou o artista Gao Zhen a três anos de prisão por satirizar o ex-líder Mao Zedong, acusado de atentar contra a honra dos heróis nacionais. Na Bulgária, a Corte Europeia de Direitos Humanos determinou que a demolição de casas de famílias romas em um bairro de Sofia foi ilegal. Um menino palestiniano ficou ferido após ser atingido por disparos de forças israelenses em Qalandia, um campo de refugiados ao norte de Jerusalém ocupada. A Amnesty Internacional afirma que a Índia usou armas letais contra os protestantes conhecidos como 'Café-da-Manhã'."}, "resumo_do_dia": {"politica_nacional": [{"id": 123675, "titulo": "Veja o que é #FATO e o que é #FAKE na sabatina de Romeu Zema a 'O Globo', 'Valor' e CBN", "url": "https://g1.globo.com/fato-ou-fake/eleicoes/noticia/2026/08/25/veja-o-que-e-fato-e-o-que-e-fake-na-sabatina-de-romeu-zema-a-o-globo-valor-e-cbn.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-25T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Romeu Zema, candidato à Presidência pelo Novo, participou de uma sabatina conduzida por jornalistas de 'O Globo', 'Valor' e CBN. A entrevista durou 1h30 e ocorreu na terça-feira (25). A próxima entrevistada será Ronaldo Caiado (PSD) na quarta-feira (26).", "titulo_pt": "Veja O que é #FATO e O que é #FAKE na sabatina de Romeu Zema a 'O Globo', 'Valor' e CBN", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 123824, "titulo": "Flávio Bolsonaro e Lula estão tecnicamente empatados no RJ, diz Quaest", "url": "https://www.metropoles.com/brasil/flavio-bolsonaro-e-lula-estao-tecnicamente-empatados-no-rj-diz-quaest", "fonte_id": "metropoles", "data_pub": "2026-08-25T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro e Lula estão tecnicamente empatados no Rio de Janeiro, de acordo com uma pesquisa da Quaest, onde Flávio tem 33% das intenções de voto e Lula tem 31%, com uma diferença dentro da margem de erro.", "titulo_pt": "Flávio Bolsonaro e Lula empatados no RJ, diz Quaest", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 123805, "titulo": "Lula troca Porto Alegre por Salvador após previsão de chuva no Sul", "url": "https://www.cnnbrasil.com.br/eleicoes/lula-troca-porto-alegre-por-salvador-apos-previsao-de-chuva-no-sul/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-25T21:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula mudou sua agenda e passou de Porto Alegre para Salvador. Ele faria sua primeira aparição na região nesta sexta-feira (25), mas agora realizará um comício no Circuito Barra-Ondina.", "titulo_pt": "Lula muda de Porto Alegre para Salvador após previsão de chuva", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 123638, "titulo": "Janja rebate fala de Renan Santos e diz que candidato ridiculariza mulheres", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/08/janja-rebate-fala-de-renan-santos-e-diz-que-candidato-ridiculariza-mulheres.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-25T21:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A primeira-dama da República, Janja Lula da Silva, respondeu a uma declaração de Renan Santos, candidato à Presidência, que afirmou que Lula não participou do debate porque precisou ficar com Janja. Janja disse que o candidato está ridicularizando as mulheres.", "titulo_pt": "Janja rebate fala de Renan Santos sobre ausência de lula em debate", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 123744, "titulo": "Governo Ricardo Couto tem 38% de aprovação e 20% de desaprovação, aponta Quaest", "url": "https://veja.abril.com.br/politica/governo-ricardo-couto-tem-38-de-aprovacao-e-20-de-desaprovacao-aponta-quaest/", "fonte_id": "veja", "data_pub": "2026-08-25T20:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Ricardo Couto recebeu 38% de aprovação e 20% de desaprovação, conforme apontado pela pesquisa Quaest. A avaliação positiva soma 20%.", "titulo_pt": "Governo Ricardo Couto tem 38% de aprovação e 20% de desaprovação, diz Quaest", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 123676, "titulo": "Governo reduz em R$ 5 bilhões previsão de gastos da Previdência para 2027", "url": "https://g1.globo.com/economia/noticia/2026/08/25/governo-reduz-em-r-5-bilhoes-previsao-de-gastos-da-previdencia-para-2027.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-25T20:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal reduziu a previsão de gastos da Previdência Social em R$ 5 bilhões para 2027, estimando despesas de R$ 1,218 trilhão. Esta projeção representa uma alta de 7,92% em relação ao previsto para 2026.", "titulo_pt": "Governo reduz em R$ 5 bilhões previsão de gastos da Previdência para 2027", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 123677, "titulo": "Bolsonaro pede ao STF para transferir titularidade de armas apreendidas", "url": "https://g1.globo.com/politica/noticia/2026/08/25/bolsonaro-pede-ao-stf-para-transferir-titularidade-de-armas-apreendidas.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-25T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A defesa de Jair Bolsonaro solicitou ao STF que autorize a transferência da titularidade de 10 armas apreendidas. Segundo os advogados, a pessoa com certificado de registro cancelado deve dar destino a produtos controlados pelo Exército em 90 dias.", "titulo_pt": "Defesa de bolsonaro pede ao STF transferência de armas apreendidas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 123639, "titulo": "STF cria penduricalho que dá adicional de até 22,5% para chefes de gabinete de ministros", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/stf-criam-penduricalho-que-da-adicional-de-ate-225-para-chefes-de-gabinete-de-ministros.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-25T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O STF instituiu um adicional salarial que pode aumentar em até 22,5% o salário de servidores em cargos de confiança, como assessores e chefes de gabinete de ministros. Este aumento foi criado em 24 de agosto de 2026.", "titulo_pt": "STF cria adicional de até 22,5% para assessores e chefes de gabinete de ministros", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 123959, "titulo": "Quem são os candidatos a governador do Ceará (CE) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-a-governador-do-ceara-ce-nas-eleicoes-2026-agosto", "fonte_id": "jota", "data_pub": "2026-08-25T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos a governador do Ceará nas eleições de 2026 incluem Elmano de Freitas, que tenta a reeleição, e Ciro Gomes, além de outros seis políticos.", "titulo_pt": "Quem são os candidatos a governador do Ceará nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 123640, "titulo": "Quaest: Celina Leão lidera ao Governo do DF com 34%, e José Roberto Arruda tem 20%", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/quaest-celina-leao-lidera-ao-governo-do-df-com-34-e-jose-roberto-arruda-tem-20.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-25T20:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora Celina Leão (PP) lidera as intenções de voto com 34% na disputa pelo Governo do Distrito Federal, seguido por José Roberto Arruda (PSD) com 20%. Os outros candidatos, Leandro Grass (PT), Paulo Belmonte (PSDB) e Ricardo Cappelli (PSB), têm intenções de voto mais baixas, com 13%, 3% e 3% respectivamente.", "titulo_pt": "Celina Leão lidera com 34% e José Roberto Arruda tem 20% na corrida pelo Governo do DF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 123678, "titulo": "Quaest em SP: 56% aprovam e 31% desaprovam governo de Tarcísio de Freitas", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/08/25/quaest-sp-avaliacao-governo-25-agosto.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-25T20:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest encomendada pela Globo revelou que 56% dos entrevistados aprovam e 31% desaprovam o governo de Tarcísio de Freitas em São Paulo. A pesquisa também mostrou que 42% avaliam o governo positivamente, 31% regularmente e 21% negativamente.", "titulo_pt": "Quaest em SP: 56% aprovam e 31% desaprovam governo de Tarcísio de Freitas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 123679, "titulo": "Benedito Gonçalves, do STJ, assume corregedoria nacional de Justiça", "url": "https://g1.globo.com/politica/noticia/2026/08/25/benedito-goncalves-do-stj-assume-corregedoria-nacional-de-justica.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-25T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Benedito Gonçalves, ministro do Superior Tribunal de Justiça (STJ), assumiu a posição de corregedor nacional de Justiça, no Conselho Nacional de Justiça (CNJ), com mandato até 2028. O corregedor nacional tem como principais funções analisar denúncias disciplinares contra juízes e fiscalizar a atuação de tribunais.", "titulo_pt": "Benedito Gonçalves assume corregedoria nacional de Justiça", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 123642, "titulo": "Quaest: Raquel Lyra tem 44%, contra 36% de João Campos em Pernambuco", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/quaest-raquel-lyra-tem-44-contra-36-de-joao-campos-em-pernambuco.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-25T20:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora Raquel Lyra (PSD) lidera com 44% das intenções de voto, contra 36% de João Campos (PSB) no cenário de primeiro turno para o governo de Pernambuco, de acordo com uma pesquisa Quaest divulgada em 25 de agosto de 2026.", "titulo_pt": "Raquel Lyra tem 44%, contra 36% de João Campos em Pernambuco", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 123650, "titulo": "CEO da Volkswagen enfrenta batalha com acionistas e funcionários em meio a proposta de cortes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/ceo-da-volkswagen-enfrenta-batalha-com-acionistas-e-funcionarios-em-meio-a-proposta-de-cortes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T20:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente-executivo da Volkswagen, Oliver Blume, enfrenta oposição em sua reunião do conselho fiscal na próxima semana, com duas propostas rivais apresentadas pelos representantes dos trabalhadores e do governo estadual. Essa oposição surge em meio ao seu plano de reestruturação.", "titulo_pt": "CEO da Volkswagen enfrenta oposição em reunião do conselho fiscal", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 123680, "titulo": "Quaest para o Senado em SP: Derrite, 12%, Marina Silva, 12%, Tebet, 11% e André do Prado, 7%", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/08/25/quaest-para-o-senado-em-sp.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-25T20:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest para o Senado em São Paulo mostra que Marina Silva e Tebet têm 12% das intenções de voto cada, enquanto Derrite tem 12% e André do Prado tem 7%. O levantamento foi realizado entre os dias 21 e 24 de agosto com 1.800 pessoas e tem uma margem de erro de 2 pontos percentuais.", "titulo_pt": "Quaest para o Senado em SP: derrite, 12%; Marina Silva, 12%; Tebet, 11%; André do Prado, 7%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 123643, "titulo": "Quaest RJ: Eduardo Paes lidera com 37%; Ruas tem 14% e Garotinho, 7%", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/quaest-rj-eduardo-paes-lidera-com-37-ruas-tem-14-e-garotinho-7.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-25T20:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest RJ indica que Eduardo Paes lidera as intenções de voto para o governo do Rio de Janeiro com 37%, seguido por Ruas com 14% e Garotinho com 7%.", "titulo_pt": "Eduardo Paes lidera com 37%; Ruas tem 14% e Garotinho, 7%", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 123375, "titulo": "Tehran vows to retaliate after US widens sanctions", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/26/2003863142", "fonte_id": "taipei_times", "data_pub": "2026-08-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Irã se comprometeu a retaliar após os Estados Unidos ampliarem as sanções. As novas sanções dos EUA visam expandir o escopo das restrições econômicas aplicadas ao país.", "titulo_pt": "Téhran promete retaliar após EUA ampliarem sanções", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 124119, "titulo": "Oil prices fall for second day as US shifts from Iran strikes to sanctions", "url": "https://www.france24.com/en/economy/20260825-oil-prices-fall-us-iran-strikes-sanctions", "fonte_id": "france24", "data_pub": "2026-08-25T21:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços do petróleo caíram por mais um dia consecutivo, com os traders percebendo uma reduzida probabilidade de novas operações militares dos Estados Unidos contra a Irã, após Washington ameaçar sanções econômicas mais amplas. O secretário do Tesouro dos EUA, Scott Bessent, declarou um 'D-Day econômico' contra Teerã, mas não forneceu prazos ou detalhes sobre quais países poderiam enfrentar penalidades.", "titulo_pt": "Preços do petróleo caem por segundo dia após EUA ameaçarem sanções econômicas à Irã", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 123972, "titulo": "Australia news live: man charged after allegedly stabbing woman with scissors in Melbourne", "url": "https://www.theguardian.com/australia-news/live/2026/aug/26/national-cabinet-datacentres-cpi-inflation-data-politics-reactions-anthony-albansese-labor-angus-taylor-coalition-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-08-25T21:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher e seu filho foram levados ao hospital com ferimentos não letais após supostamente serem atacados com tesouras em Melbourne. A Greens Party defende que o Conselho Nacional deve se concentrar em financiar serviços de frente para a linha para evitar que mulheres e crianças Guy enfrentem violência.", "titulo_pt": "Austrália: homem é acusado de supostamente ferir mulher com tesouras em Melbourne", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 124120, "titulo": "US-led Gaza peace board warns Hamas over kites after Israeli threat", "url": "https://www.france24.com/en/middle-east/20260825-us-gaza-peace-board-hamas-kites-israeli-threat", "fonte_id": "france24", "data_pub": "2026-08-25T21:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O conselho liderado pelos Estados Unidos, responsável pelo plano de paz de Gaza, advertiu o Hamas para parar com atividades militantes, incluindo o voo de kites, após ameaças de retaliatórias por parte de Israel. Um oficial do Conselho de Paz disse que Israel também deve respeitar o cessar-fogo, limitando suas ações militares a respostas a 'ameaças genuínas e iminentes'.", "titulo_pt": "Conselho de paz liderado pelos EUA avisa Hamas sobre kites após ameaça israelense", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 124082, "titulo": "In Gaza, children forced to put away their kites after Israeli threats", "url": "https://www.lemonde.fr/en/international/article/2026/08/25/in-gaza-children-forced-to-put-away-their-kites-after-israeli-threats_6756846_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-25T21:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois que several kites de Gaza foram encontrados no lado israelense, as autoridades, vendo uma potencial ameaça, anunciaram que qualquer pessoa que voasse um balão de papel seria alvo. Muitas famílias palestinas decidiram confiscar esses brinquedos – uma das poucas atividades que restaram para as crianças.", "titulo_pt": "Em Gaza, crianças são obrigadas a guardar seus kites após ameaças israelenses", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 124133, "titulo": "Trump administration pauses immigrant visa applications", "url": "https://www.ft.com/content/857fb8e1-eec6-443e-97e8-f6876302aabc?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-25T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A administração Trump pausou as aplicações de vistos para imigrantes e pediu aos funcionários consulares que excluam pessoas que possam precisar de benefícios públicos.", "titulo_pt": "Administração trump pausa solicitações de vistos para imigrantes", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 123738, "titulo": "Diretor da CIA viajou a Moscou para reunião com autoridades da Rússia, diz emissora", "url": "https://veja.abril.com.br/mundo/diretor-da-cia-viaja-a-moscou-para-reuniao-com-autoridades-da-russia-diz-emissora/", "fonte_id": "veja", "data_pub": "2026-08-25T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um diretor da CIA viajou a Moscou para uma reunião com autoridades russas, mas a visita não foi confirmada por Moscou ou Washington. Esta seria a primeira visita de um chefe da inteligência americana à capital russa desde 2021.", "titulo_pt": "Diretor da CIA teria viajado a Moscou para reunião com autoridades russas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 124086, "titulo": "Rubio tells allies U.S. shifting from strikes to sanctions on Iran", "url": "https://www.axios.com/2026/08/25/rubio-iran-war-hormuz-oil", "fonte_id": "axios", "data_pub": "2026-08-25T21:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário de Estado americano Marco Rubio informou vários de seus colegas estrangeiros que, por enquanto, os Estados Unidos não planejam iniciar novos ataques contra o Irã. Em vez disso, a ênfase está em outras formas de pressão, incluindo as sanções recentemente anunciadas.", "titulo_pt": "Rubio informa aliados que EUA estão mudando de ataques para sanções contra o Irã", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 123793, "titulo": "Trump diz que EUA vão destruir qualquer navio que colocar minas em Ormuz", "url": "https://www.cnnbrasil.com.br/internacional/trump-diz-que-eua-vao-destruir-qualquer-navio-que-colocar-minas-em-ormuz/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-25T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, declarou que os Estados Unidos vão destruir qualquer navio que coloque minas na rota de Ormuz. Navios que já colocaram minas na região foram removidos ou detonados.", "titulo_pt": "Trump afirma que EUA vão destruir navios que colocarem minas em Ormuz", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 124097, "titulo": "Seven killed in Gaza as Israeli strike ‘destroys’ aid supply warehouse", "url": "https://www.aljazeera.com/news/2026/8/25/seven-killed-in-gaza-as-israeli-strike-destroys-aid-supply-warehouse?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-25T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sete pessoas foram mortas em Gaza durante um ataque israelense que destruiu um depósito de suprimentos humanitários. O Ministério da Saúde de Gaza advertiu sobre uma 'colapso total das necessidades básicas de vida' devido às continuas operações militares israelenses.", "titulo_pt": "Sete mortos em Gaza após ataque israelense a depósito de ajuda humanitária", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 124021, "titulo": "The U.S. Can’t Catch Up to China’s Robots by Banning Them", "url": "https://foreignpolicy.com/2026/08/25/china-robot-race-humanoids-drones-us-ban-restrictions/", "fonte_id": "foreign_policy", "data_pub": "2026-08-25T21:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo argumenta que os EUA estão tentando impedir a adoção de robôs chineses em vez de aprender com a concorrência. Washington está fechando as portas em vez de se adaptar.", "titulo_pt": "Os EUA não podem competir com robôs chineses proibindo-os", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 124022, "titulo": "The U.S.-Canada Trade War Is Full Steam Ahead", "url": "https://foreignpolicy.com/2026/08/25/us-canada-retaliatory-tariffs-trade-war-trump-ontario-ford/", "fonte_id": "foreign_policy", "data_pub": "2026-08-25T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ottawa impôs tarifas retaliatórias que correspondem, munição por munição, às tarifas dos Estados Unidos.", "titulo_pt": "Guerra comercial eua-canadá em pleno vapor", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 123924, "titulo": "El director de la CIA, John Ratcliffe, viaja a Moscú por sorpresa", "url": "https://elpais.com/internacional/2026-08-25/el-director-de-la-cia-john-ratcliffe-viaja-a-moscu-por-sorpresa.html", "fonte_id": "elpais_america", "data_pub": "2026-08-25T21:16:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O diretor da CIA, John Ratcliffe, viajou de surpresa a Moscú. Não se sabe com quem ele se reuniu nem o motivo de sua breve visita.", "titulo_pt": "Diretor da CIA viaja surpreendentemente a Moscú", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 123800, "titulo": "Quaest RJ: Benedita tem 10%, Carlos Jordy, 7%, e Crivella, 6%, no Senado", "url": "https://www.cnnbrasil.com.br/eleicoes/quaest-rj-benedita-tem-10-carlos-jordy-7-e-crivella-6-no-senado/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-25T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest RJ, realizada entre 21 e 24 de agosto, mostrou que Benedita tem 10% das intenções de voto para o Senado, seguida por Carlos Jordy com 7% e Crivella com 6%. A pesquisa entrevistou 1.302 eleitores por meio de entrevistas pessoais e a margem de erro é de três pontos percentuais, para mais ou para menos.", "titulo_pt": "Quaest RJ: benedita lidera com 10%, Jordy tem 7% e Crivella, 6%, no Senado", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 123801, "titulo": "Palestinos fazem vigília para jornalistas mortos em ataque a hospital", "url": "https://www.cnnbrasil.com.br/internacional/palestinos-fazem-vigilia-para-jornalistas-mortos-em-ataque-a-hospital/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-25T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 25 de agosto de 2025, Israel atacou o Hospital Nasser na Faixa de Gaza, resultando em pelo menos 20 mortes, incluindo cinco jornalistas.", "titulo_pt": "Palestinos fazem vigília para jornalistas mortos em ataque a hospital", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 124099, "titulo": "US lawmakers urge Trump team to free of American student held by Israel", "url": "https://www.aljazeera.com/news/2026/8/25/us-lawmakers-urge-trump-team-to-free-of-american-student-held-by-israel?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-25T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Congressistas americanos pedem ao senador Marco Rubio o uso de todos os meios à sua disposição para garantir a liberação de um estudante americano de 20 anos, Sama Safi, detido pela Israel.", "titulo_pt": "Congressistas americanos pressionam equipe de Trump para libertar estudante americano detido por Israel", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 123388, "titulo": "Industrial production index increases", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/26/2003863122", "fonte_id": "taipei_times", "data_pub": "2026-08-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O índice de produção industrial aumentou. Não há detalhes adicionais sobre o aumento ou o período específico.", "titulo_pt": "Índice de produção industrial aumenta", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 123390, "titulo": "Retail, food and beverage sales hit record for July", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/26/2003863124", "fonte_id": "taipei_times", "data_pub": "2026-08-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas no varejo e no setor de alimentos e bebidas registraram recordes em julho. O desempenho financeiro destes setores foi superior aos meses anteriores, refletindo a recuperação econômica.", "titulo_pt": "Vendas no varejo e setor de alimentos e bebidas atingem recorde em julho", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 123958, "titulo": "Economista da campanha de Flávio Bolsonaro propõe PEC fiscal e corte de 10 ministérios", "url": "https://www.jota.info/eleicoes/eleicoes-2026/economista-da-campanha-de-flavio-bolsonaro-propoe-pec-fiscal-e-corte-de-10-ministerios", "fonte_id": "jota", "data_pub": "2026-08-25T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A economista da campanha de Flávio Bolsonaro propôs uma PEC fiscal e o corte de 10 ministérios. O plano prevê a revisão do arcabouço fiscal e medidas para reduzir a dívida pública.", "titulo_pt": "Economista da campanha de Flávio Bolsonaro sugere PEC fiscal e corte de 10 ministérios", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 123703, "titulo": "Empresas afetadas por tarifaço terão drawback estendido por um ano", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/empresas-afetadas-por-tarifaco-terao-drawback-estendido-por-um-ano", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-25T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas brasileiras afetadas por tarifas adicionais dos Estados Unidos poderão ter o regime de drawback prorrogado por até um ano. A medida foi estabelecida pela Medida Provisória 1.386, assinada pelo presidente Luiz Inácio Lula da Silva.", "titulo_pt": "Empresas afetadas por tarifaço terão drawback estendido por um ano", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 123648, "titulo": "Tecnologia na semente cresce, mas informação deve chegar ao setor", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/vaivem/2026/08/tecnologia-na-semente-cresce-mas-informacao-deve-chegar-ao-setor.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A tecnologia incorporada em sementes modernas é avançada, incluindo técnicas específicas, melhoramento, biotecnologia e até edição gênica. É crucial levar esse conhecimento para o setor e garantir o aproveitamento dessas tecnologias para o desenvolvimento.", "titulo_pt": "Tecnologia nas sementes avança, mas informação precisa chegar ao setor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 123649, "titulo": "Lego aposta em blocos com tecnologia e novos produtos para manter crescimento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/lego-aposta-em-blocos-com-tecnologia-e-novos-produtos-para-manter-crescimento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T20:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Lego está aumentando os investimentos em novos produtos, como blocos equipados com software, e em sustentabilidade. A empresa busca manter um forte crescimento da receita e do lucro.", "titulo_pt": "Lego amplia investimentos em novos produtos e sustentabilidade para manter crescimento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 123858, "titulo": "Brasil e EUA farão reunião sobre tarifas na próxima segunda-feira, diz MDIC", "url": "https://www.infomoney.com.br/economia/brasil-e-eua-farao-reuniao-sobre-tarifas-na-proxima-segunda-feira-diz-mdic/", "fonte_id": "infomoney", "data_pub": "2026-08-25T20:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos implementou em julho tarifas de 25% sobre produtos brasileiros, alegando práticas comerciais desleais. O Ministério do Desenvolvimento, Indústria e Comércio Exterior (MDIC) informou que haverá uma reunião entre Brasil e EUA na próxima segunda-feira para discutir o assunto.", "titulo_pt": "Brasil e EUA farão reunião sobre tarifas na próxima segunda-feira, diz MDIC", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 123754, "titulo": "Porsche vende braço de tecnologia por 320 milhões de euros", "url": "https://veja.abril.com.br/coluna/faria-lima-news/porsche-vende-braco-de-tecnologia-por-320-milhoes-de-euros/", "fonte_id": "veja", "data_pub": "2026-08-25T20:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Porsche vendeu um braço de tecnologia por 320 milhões de euros. O acordo inclui ainda 1,25 bilhões de euros em serviços.", "titulo_pt": "Porsche vende braço de tecnologia por 320 milhões de euros", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 123651, "titulo": "Embraer anuncia certificação de jato capaz de pousar sozinho", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/embraer-anuncia-certificacao-de-jato-capaz-de-pousar-sozinho.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Embraer obteve certificação tripla para o jato executivo Phenom 300EV, que possui um sistema de pouso automatizado em caso de falha do piloto.", "titulo_pt": "Embraer anuncia certificação de jato que pode pousar sozinho", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 123652, "titulo": "PF faz operação contra fraude em benefícios do INSS com prejuízo de R$ 86 milhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/pf-faz-operacao-contra-fraude-em-beneficios-do-inss-com-prejuizo-de-r-86-milhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal realizou uma operação nesta terça-feira (25) para combater um grupo suspeito de fraudar benefícios previdenciários, causando um prejuízo superior a R$ 86 milhões ao INSS.", "titulo_pt": "PF desarticula grupo que fraudava benefícios previdenciários com prejuízo de R$ 86 milhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 123655, "titulo": "Passando pano para o Banco Central?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/bernardo-guimaraes/2026/08/passando-pano-para-o-banco-central.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T19:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reportagem discute uma crítica feita a um artigo que foca os erros do governo em relação às altas taxas de juros, minimizando o papel do Banco Central.", "titulo_pt": "Você está passando pano para o Banco Central?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 123657, "titulo": "Estúdios ganham espaço na estratégia interna da Smart Fit", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/estudios-ganham-espaco-na-estrategia-interna-da-smart-fit.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A líder do segmento de estúdios da Smart Fit, Carolina Corona, afirma que o setor está ganhando espaço dentro da empresa e que, neste ano, começou a convencer o conselho e os acionistas do seu potencial.", "titulo_pt": "Estúdios ganham espaço na estratégia interna da Smart Fit", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 123757, "titulo": "Ajuste fiscal e fim de privilégios: os planos dos presidenciáveis para economia", "url": "https://exame.com/brasil/ajuste-fiscal-e-fim-de-privilegios-os-planos-dos-presidenciaveis-para-economia/", "fonte_id": "exame", "data_pub": "2026-08-25T18:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os presidenciáveis propõem ajustes fiscais e fim de privilégios, enquanto o governo defende uma abordagem gradualista. As campanhas apostam em cortes de gastos e reformas na estrutura do Estado.", "titulo_pt": "Ajuste fiscal e fim de privilégios: os planos dos candidatos para a economia", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 123659, "titulo": "Procuradoria do Trabalho processa Uber em R$ 321 mi por taxa obrigatória a motoristas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/procuradoria-do-trabalho-processa-uber-em-r-321-mi-por-taxa-obrigatoria-a-motoristas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T18:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria do Trabalho ajuizou uma ação civil pública contra a Uber por causa de uma taxa obrigatória paga pelos motoristas para aceitarem corridas pelo aplicativo. O valor da indenização solicitada é de R$ 321 milhões.", "titulo_pt": "Procuradoria do Trabalho processa Uber em R$ 321 mi por taxa obrigatória a motoristas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 123660, "titulo": "Arrecadação sobe 9% em julho puxada por IOF e tributação sobre exportação de petróleo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/arrecadacao-sobe-9-puxada-por-iof-e-tributacao-sobre-exportacao-de-petroleo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-25T18:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A arrecadação federal aumentou 9% em julho, impulsionada pelo IOF e pelo imposto sobre a exportação de petróleo. Este é o melhor resultado para o mês de julho desde 1995.", "titulo_pt": "Arrecadação cresce 9% em julho, impulsionada por IOF e exportação de petróleo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 123705, "titulo": "Arrecadação federal cresce 8,97% em julho e chega a R$ 289,3 bilhões", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/arrecadacao-federal-cresce-897-em-julho-e-chega-r-2893-bilhoes", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-25T18:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A arrecadação federal no mês de julho de 2026 atingiu R$ 289,3 bilhões, representando um crescimento de 8,97% em relação ao mesmo período do ano anterior, após descontar a inflação. O governo federal arrecadou R$ 1,876 trilhão no acumulado de janeiro a julho de 2026.", "titulo_pt": "Arrecadação federal cresce 8,97% em julho e chega a R$ 289,3 bilhões", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 123389, "titulo": "Hermes eyes doubling revenue on thermal modules", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/26/2003863123", "fonte_id": "taipei_times", "data_pub": "2026-08-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Hermes planeja dobrar suas receitas através do uso de módulos térmicos.", "titulo_pt": "Hermes mira em dobrar receita com módulos térmicos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 123391, "titulo": "Manufacturing confidence rises: TIER", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/26/2003863125", "fonte_id": "taipei_times", "data_pub": "2026-08-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A confiança na indústria está aumentando, conforme indicado pelo TIER.", "titulo_pt": "Confiança na indústria cresce: TIER", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 123392, "titulo": "Indian firm orders 9,000 of Nvidia’s AI systems", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/26/2003863126", "fonte_id": "taipei_times", "data_pub": "2026-08-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma empresa indiana encomendou 9.000 sistemas de inteligência artificial da Nvidia.", "titulo_pt": "Empresa indiana encomenda 9.000 sistemas de IA da Nvidia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 124190, "titulo": "‘Darth Vader’ Wants You to Know He Definitely Supports Flock Surveillance", "url": "https://www.wired.com/story/darth-vader-wants-you-to-know-he-definitely-supports-flock-surveillance/", "fonte_id": "wired", "data_pub": "2026-08-25T21:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthony Ralphs estava frustrado com o apoio da Câmara Municipal de San Diego a favor da Flock. Ele decidiu que algo além de argumentos razoáveis seria necessário para chamar a atenção dos membros do conselho.", "titulo_pt": "‘Darth Vader’ quer que você saiba que definitivamente apoia a vigilância da Flock", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 124170, "titulo": "Trump is upping the price of Big Tech’s favorite visa", "url": "https://www.theverge.com/policy/984723/trump-h1b-fee-asylum-legal-immigration", "fonte_id": "the_verge", "data_pub": "2026-08-25T21:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Segurança Nacional dos EUA anunciou que aumentaria a taxa de mais de $103.000 para as vistos H-1B e o Departamento de Estado planeja revogar até 200.000 vistos de asilo.", "titulo_pt": "Trump está aumentando o preço do visto favorito da Big Tech", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 123954, "titulo": "Que la verdad importe: IA y periodismo", "url": "https://www.ciperchile.cl/2026/08/25/que-la-verdad-importe-ia-y-periodismo/?utm_source=rss&utm_medium=rss&utm_campaign=que-la-verdad-importe-ia-y-periodismo", "fonte_id": "ciper_chile", "data_pub": "2026-08-25T21:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto aborda o tema da inteligência artificial e o jornalismo. A entrada foi publicada originalmente no CIPER Chile.", "titulo_pt": "Que a verdade importe: IA e jornalismo", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 124154, "titulo": "Addressing a sticking point in sustainable adhesives", "url": "https://www.technologyreview.com/2026/08/25/1140902/addressing-a-sticking-point-in-sustainable-adhesives/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Adesivos baseados em petróleo são amplamente utilizados em diversas aplicações, incluindo a fixação de madeira e drywall em projetos de construção, a ligação de juntas em móveis e a adesão de rótulos em embalagens recicláveis. Isso impede que tais embalagens sejam adequadamente recicladas.", "titulo_pt": "Abordando um obstáculo na produção de adesivos sustentáveis", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 124155, "titulo": "YouTuber finds niche as college admissions mentor", "url": "https://www.technologyreview.com/2026/08/25/1140905/youtuber-finds-niche-as-college-admissions-mentor/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gohar Khan, um estudante de primeira geração de uma pequena cidade, criou o canal do YouTube Gohar’s Guide para auxiliar outros jovens no processo de admissão à faculdade. Hoje, mais de 10 milhões de pessoas seguem Khan em suas redes sociais para obter conselhos sobre aplicação à faculdade, dicas de estudo e mais.", "titulo_pt": "Youtuber se torna mentor nas admissões universitárias", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 124156, "titulo": "Launching youth entrepreneurship", "url": "https://www.technologyreview.com/2026/08/25/1140911/launching-youth-entrepreneurship/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Laurie Stach, de 2006, tinha um ambicioso desejo de resolver problemas desde a juventude. Ela percebeu que outros jovens talentosos em matemática e ciências também compartilhavam essa visão em sua experiência na MIT.", "titulo_pt": "Lançando empreendedorismo jovem", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 124157, "titulo": "A new stamp on cyberfraud prevention", "url": "https://www.technologyreview.com/2026/08/25/1140914/a-new-stamp-on-cyberfraud-prevention/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rupert Young, formado em 1995 e 1995 em Ciência de Dados e Cybersegurança na MIT, começou sua carreira ao construir bancos de dados detalhados para catalogar selos recebidos de seu avô, demonstrando o olhar preciso para detalhes e sutilezas que sua declaração de aplicação para a MIT destacou como características desejáveis. Ele atualmente ocupa o cargo de Chief Product Officer.", "titulo_pt": "Um selo na prevenção do cibercrime", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 124158, "titulo": "AgeLab research inspires an A I startup", "url": "https://www.technologyreview.com/2026/08/25/1140917/agelab-research-inspires-an-a-i-startup/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Don Yansen, um empreendedor serial, desenvolveu uma alternativa para dispositivos modernos difíceis de usar após ouvir participantes de uma pesquisa no MIT AgeLab sobre cuidados para idosos.", "titulo_pt": "Pesquisa do mit agelab inspira startup de inteligência artificial", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 124159, "titulo": "Amping up T cells to target cancer", "url": "https://www.technologyreview.com/2026/08/25/1140949/amping-up-t-cells-to-target-cancer/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vacinas que utilizam o sistema imunológico do corpo para combater tumores mostraram promessa em ensaios clínicos e algumas já foram aprovadas pela FDA para o tratamento de certos cânceres. No entanto, em muitos pacientes, essas vacinas não estimulam uma resposta suficiente, e uma abordagem usada por alguns pesquisadores para fortalecer o efeito envolve a administração da vacina junto com moléculas estimulantes do sistema imunológico chamadas citocinas.", "titulo_pt": "Potencializando células T para combater o câncer", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 124160, "titulo": "Taking your temperature from the inside", "url": "https://www.technologyreview.com/2026/08/25/1140952/taking-your-temperature-from-the-inside/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Termômetros orais e de fronteira podem não capturar corretamente a temperatura corporal interna de uma pessoa, e os poucos sensores de temperatura ingestíveis disponíveis no mercado são grandes e difíceis de engolir, com risco de obstruir o trato gastrointestino. Engenheiros da MIT desenvolveram um sensor de temperatura ingestível de apenas 6 por 4 mm que pode fornecer atualizações contínuas de temperatura.", "titulo_pt": "Medindo a temperatura interna pelo interior", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 124161, "titulo": "Seeing through murky waters", "url": "https://www.technologyreview.com/2026/08/25/1140955/seeing-through-murky-waters/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo sistema desenvolvido por Amy Phung e seu orientador ajuda veículos operados remotamente a navegar por sedimentos visíveis apenas após a nuvem de poeira se dissipar. Quando esses veículos se posicionam no fundo do mar ou enterram-se no leito de areia, podem levantar nuvens de sedimento que dificultam a visualização para as câmeras a bordo. Normalmente, a única opção é esperar até que a poeira se dissipe.", "titulo_pt": "Enxergando através das águas turvas", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 124162, "titulo": "Your brain on AI", "url": "https://www.technologyreview.com/2026/08/25/1140958/your-brain-on-ai/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo conduzido por Pattie Maes e colegas do MIT Media Lab revelou que, embora os chatbots de inteligência artificial possam ser úteis para manter-se informado, eles podem comprometer a precisão na avaliação de notícias. Os participantes que avaliaram cabeças de notícias e imagens ao longo de quatro semanas foram inicialmente 21% menos precisos em determinadas tarefas de comparação.", "titulo_pt": "Seu cérebro com AI", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 124163, "titulo": "MIT tech powered the Artemis II livestreams", "url": "https://www.technologyreview.com/2026/08/25/1140961/mit-tech-powered-the-artemis-ii-livestreams/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No mês de abril, durante a missão Artemis II Orion, a transmissão ao vivo de imagens e vídeos foi de alta qualidade, comparável às velocidades de internet domésticas. Isso representou uma melhoria significativa em relação às comunicações radiofrequenciais utilizadas nas missões originais à Lua dos anos 1960 e 1970.", "titulo_pt": "Tecnologia MIT fez parte da transmissão ao vivo da missão Artemis II", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 124204, "titulo": "3D atomic imaging reveals a new pathway to crystal formation", "url": "https://phys.org/news/2026-08-3d-atomic-imaging-reveals-pathway.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imageria atômica em 3D revelou um novo caminho para a formação de cristais. A teoria clássica de núcleação, desenvolvida há cerca de um século, é amplamente utilizada para entender como transições de fase, como condensação e congelamento, iniciam-se, mas experimentos recentes sugerem novos mecanismos de formação de núcleos ordenados.", "titulo_pt": "Imagem atômica 3d revela novo caminho para formação de cristais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 124205, "titulo": "Closing the gap between wildfire modeling and real-world response", "url": "https://phys.org/news/2026-08-gap-wildfire-real-world-response.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A temporada de incêndios florestais de 2023 no Canadá queimou mais de 18,5 milhões de hectares, uma área maior que a Grécia. Embora os pesquisadores da UBC Okanagan tenham avançado significativamente ao aplicar a pesquisa operacional ao problema nos últimos 20 anos, eles constataram que ainda há dificuldades em levar as melhores ideias das publicações para o campo prático.", "titulo_pt": "Fechando a brecha entre o modelamento de incêndios florestais e a resposta real", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 124206, "titulo": "JWST reveals a race against time for forming planets", "url": "https://phys.org/news/2026-08-jwst-reveals-planets.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Planetas se formam a partir de discos de gás e poeira ao redor de estrelas jovens, mas o gás necessário para o crescimento não durará para sempre. Observações recentes do Telescópio Espacial James Webb da NASA oferecem uma nova visão sobre como esse gás escapa e como o processo muda ao longo do desenvolvimento dos sistemas planetários jovens.", "titulo_pt": "JWST revela uma corrida contra o tempo para a formação de planetas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 124207, "titulo": "Habitat changes found to be no deterrent for some Fijian native bees", "url": "https://phys.org/news/2026-08-habitat-deterrent-fijian-native-bees.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa conduzida pela Flinders University descobriu que algumas espécies de abelhas nativas de Fiji, do gênero Lasioglossum, evoluíram e utilizaram suas características individuais para resistir a mudanças ambientais humanas, permitindo que sobrevivessem e prosperassem. Embora o clima extremo e as mudanças no habitat geralmente sejam desastrosos para muitos animais, incluindo insetos, esse estudo mostrou uma situação diferente para essas espécies de abelhas.", "titulo_pt": "Alterações no habitat não detêm algumas abelhas nativas de fiji", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 124208, "titulo": "Microcline reveals how a common mineral surface triggers ice formation in clouds", "url": "https://phys.org/news/2026-08-microcline-reveals-common-mineral-surface.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa demonstrou, pela primeira vez a nível molecular, por que a minério de microcline é particularmente eficaz em formar gelo em nuvens. O estudo, publicado na revista Nature Communications, oferece uma nova explicação para processos que influenciam o clima e a precipitação mundialmente.", "titulo_pt": "Microcline revela por que um mineral comum desencadeia a formação de gelo em nuvens", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 124209, "titulo": "Scientists unlock 'ancestral code' of banana family", "url": "https://phys.org/news/2026-08-scientists-ancestral-code-banana-family.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas reconstruíram o cromossomo ancestral da família das bananas, mostrando como os números de cromossomos diminuíram de forma gradual de 17 para 9-11 ao longo do tempo evolutivo.", "titulo_pt": "Cientistas desvendam 'código ancestral' da família das bananas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 124210, "titulo": "Pomegranate emerges as a promising natural phytobiotic for veterinary medicine", "url": "https://phys.org/news/2026-08-pomegranate-emerges-natural-phytobiotic-veterinary.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores identificaram uma ampla gama de propriedades biológicas da granada com potenciais aplicações médicas, incluindo propriedades antimicrobianas, antiparásiticas, antioxidantes, imunomodulatórias, antidiabéticas, anti-inflamatórias, que apoiam o fígado e auxiliam no tratamento de feridas.", "titulo_pt": "Granada emerge como um biótico natural promissor para a medicina veterinária", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 123743, "titulo": "Caso Lito: centros de pesquisa se manifestam sobre pedidos de inclusão em testes experimentais", "url": "https://veja.abril.com.br/saude/caso-lito-centros-de-pesquisa-se-manifestam-sobre-pedidos-de-inclusao-em-testes-experimentais/", "fonte_id": "veja", "data_pub": "2026-08-25T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lito Sousa, um influenciador e especialista em aviação diagnosticado com a doença de Creutzfeld-Jacob, está sendo investigado sobre sua inclusão em testes experimentais. Centros de pesquisa se manifestaram sobre esses pedidos.", "titulo_pt": "Caso Lito: centros de pesquisa se manifestam sobre inclusão em testes experimentais", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 124211, "titulo": "Finding the world's highest late Middle Pleistocene marine deposits", "url": "https://phys.org/news/2026-08-world-highest-late-middle-pleistocene.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Selma Sarı e uma equipe internacional investigaram a seção TOL-1 na Bacia do Mut (sul da Turquia), documentando os depósitos marinhos mais altos conhecidos do Paleolítico Médio Inferior (MIS 7), preservados a 1.177 metros acima do nível do mar na margem sul do Plano Central Anatólico.", "titulo_pt": "Localizando os depósitos marinhos mais altos do paleolítico médio inferior no mundo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 124212, "titulo": "Sound waves do double duty, carrying and protecting quantum information", "url": "https://phys.org/news/2026-08-duty-quantum.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Harvard John A. Paulson School of Engineering and Applied Sciences demonstraram um novo método promissor para proteger informações quânticas frágeis usando vibrações mecânicas, ou seja, ondas sonoras extremamente pequenas. Este avanço, liderado pelo professor Marko Lončar, abre caminho para redes quânticas baseadas em som em chips compactos e sistemas quânticos híbridos que combinam diversos tipos de bits quânticos, ou qubits.", "titulo_pt": "Ondas sonoras desempenham dupla função, transportando e protegendo informações quânticas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 124254, "titulo": "'You just saved the video dish': Two astronauts complete spacewalk to replace ISS antenna", "url": "https://www.space.com/space-exploration/international-space-station/you-just-saved-the-video-dish-two-astronauts-complete-spacewalk-to-replace-iss-antenna", "fonte_id": "space_com", "data_pub": "2026-08-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astronautas Anil Menon e Sophie Adenot concluíram uma caminhada espacial de 6,5 horas em 25 de agosto, instalando uma antena de substituição Space-to-Ground na exterior da Estação Espacial Internacional.", "titulo_pt": "Você acabou de salvar o parabrisas do vídeo': astronautas concluem caminhada espacial para substituir antena da ISS", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 124203, "titulo": "STAT+: Sword Health to acquire Headspace, according to filing", "url": "https://www.statnews.com/2026/08/25/sword-health-to-acquire-headspace-per-regulatory-filing/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-25T20:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de saúde digital Sword Health planeja adquirir o provedor de serviços de saúde mental Headspace, de acordo com um relatório regulatório.", "titulo_pt": "Sword Health planeja adquirir Headspace, segundo relatório regulatório", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 124213, "titulo": "Developing a genetic toolkit for manipulating abundant intestinal microbes", "url": "https://phys.org/news/2026-08-genetic-toolkit-abundant-intestinal-microbes.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores da Weill Cornell Medicine desenvolveram uma série de ferramentas moleculares para regular a atividade de genes específicos em uma das classes bacterianas intestinais mais comuns. Essa capacidade de manipulação genética dessas bactérias pode levar a um melhor entendimento do papel que elas desempenham na fisiologia humana e em doenças.", "titulo_pt": "Desenvolvendo um conjunto de ferramentas genéticas para manipular microbios intestinais comuns", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 124214, "titulo": "How to win shares and influence fast-food market: Warm and fuzzy can't cut it", "url": "https://phys.org/news/2026-08-fast-food-fuzzy.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa da QUT desafia uma suposição comum em marketing nas redes sociais: para marcas de fast-food, posts que demonstram expertise e competência são compartilhados mais frequentemente do que aqueles que se concentram em calor e amizade.", "titulo_pt": "Como ganhar partes do mercado de fast-food nas redes sociais: calor e bondade não bastam", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 124215, "titulo": "Even biodiversity-friendly policies may not halt declines in Europe's common birds and butterflies by 2050", "url": "https://phys.org/news/2026-08-biodiversity-friendly-policies-halt-declines.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa publicada na revista Nature Ecology & Evolution examina a correlação entre os objetivos de governança para a conservação da biodiversidade e as realidades no campo para grupos selecionados de espécies, como aves e borboletas. O trabalho faz parte dos esforços para mapear a interface entre a ciência e a política em relação à biodiversidade em Europa.", "titulo_pt": "Mesmo políticas amigáveis à biodiversidade podem não deter as declinações das aves e borboletas comuns na Europa até 2050", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 124216, "titulo": "Machine learning method uncovers hidden patterns in DNA methylation", "url": "https://phys.org/news/2026-08-machine-method-uncovers-hidden-patterns.html", "fonte_id": "phys_org", "data_pub": "2026-08-25T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores de Berlim, Potsdam e Jena apresentaram uma nova metodologia de aprendizado de máquina para analisar o epigênoma. A técnica identifica regiões de DNA metilado de maneira diferente, sem a necessidade de rótulos de amostra, permitindo a identificação de padrões biológicos ocultos e novas subgrupos de células ou doenças.", "titulo_pt": "Método de aprendizado de máquina descobre padrões ocultos na metilação do DNA", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 123904, "titulo": "Daniel Mecca, escritor: “Recorrer las calles por donde Borges caminaba permite crear una imaginación poética de su figura”", "url": "https://www.lanacion.com.ar/que-sale/daniel-mecca-escritor-caminar-por-las-calles-donde-borges-caminaba-permite-crear-una-imaginacion-nid25082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-26T11:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Daniel Mecca, escritor, percorre as ruas de Buenos Aires onde Jorge Luis Borges caminhou, criando uma imaginação poética sobre a figura do autor de 'Ficciones'. Este percurso, que abrange bairros como Recoleta e Retiro, visa aproximar a obra de Borges a novas gerações através de locais biográficos e literários.", "titulo_pt": "Daniel Mecca, escritor: ‘percorrer as ruas por onde Borges caminhou permite criar uma imaginação poética de sua figura’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 123371, "titulo": "Gwangju Biennale restores ‘Taiwan’ name: report", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/26/2003863138", "fonte_id": "taipei_times", "data_pub": "2026-08-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Bienal de Gwangju restaurou o nome 'Taiwan' em suas atividades, conforme relatório. A decisão mantém o nome original usado anteriormente.", "titulo_pt": "Bienal de gwangju restaura nome 'Taiwan'", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 123377, "titulo": "‘Youth diplomacy’ goes forward", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/26/2003863149", "fonte_id": "taipei_times", "data_pub": "2026-08-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A diplomacia jovem continua avançando. O título traduzido para o português brasileiro é 'Diplomacia jovem avança'.", "titulo_pt": "Diplomacia jovem avança", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 124282, "titulo": "Russian Drone Strike Causes A Fire At The Kherson Regional Art Museum In Ukraine", "url": "https://www.artforum.com/news/russian-drone-strike-kherson-regional-art-museum-1234757874/", "fonte_id": "artforum", "data_pub": "2026-08-25T21:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio ocorreu no Museu Regional de Kherson na Ucrânia em 20 de agosto, após um drone de primeira pessoa (FPV) russo atingir o prédio. O incêndio danificou o edifício do museu e alguns trabalhos de arte, mas não houve vítimas civis.", "titulo_pt": "Ataque de Drone russo causa incêndio no museu Regional de Kherson, Ucrânia", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 123661, "titulo": "Após foto com Nikolas Ferreira, Ana Castela fará show com cachê pago por emenda do PL", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/apos-foto-com-nikolas-ferreira-ana-castela-fara-show-com-cache-pago-por-emenda-do-pl.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-25T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cantora Ana Castela realizará um show em São Fidélis, no Rio de Janeiro, com um cachê de R$ 850 mil pago por emenda parlamentar do PL, nesta quinta-feira. O prefeito da cidade, José William, também do PL, convidou a cantora após ela ter feito uma foto com Nikolas Ferreira.", "titulo_pt": "Ana Castela fará show com cachê pago por emenda do PL após foto com Nikolas Ferreira", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 123914, "titulo": "Dolly Parton, la montañesa que desafió a Elvis y conquistó el mundo más allá del country", "url": "https://www.lanacion.com.ar/espectaculos/musica/dolly-parton-la-montanesa-que-desafio-a-elvis-y-conquisto-el-mundo-mas-alla-del-country-nid25082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-25T21:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Dolly Parton, cantora de 80 anos, deixou sua marca na música folclórica norte-americana e no cinema hollywoodiano. Ela desafiou Elvis Presley e se tornou uma figura global.", "titulo_pt": "Dolly Parton, a montanhesa que desafiou Elvis e conquistou o mundo além do country", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 123740, "titulo": "Do country ao pop: as estrelas que carregam Dolly Parton como referência", "url": "https://veja.abril.com.br/cultura/do-country-ao-pop-as-estrelas-que-carregam-dolly-parton-como-referencia/", "fonte_id": "veja", "data_pub": "2026-08-25T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dolly Parton, com uma carreira que abrange décadas e diversos gên -08-25T19:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo do Reino Unido pediu à TikTok e outras redes sociais que removam vídeos que exaltam a direção perigosa, após sete mortes em um acidente envolvendo manobras na contramão. As autoridades também exigiram que as plataformas impeçam que esse tipo de conteúdo seja impulsionado pelos algoritmos.", "titulo_pt": "Tendência de direção perigosa no TikTok deixa 7 mortos no Reino Unido", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 124034, "titulo": "Gremios de servicios básicos rechazan decisión del TC por norma de reconexión: “Es imposible de cumplir”", "url": "https://www.latercera.com/pulso/noticia/gremios-de-servicios-basicos-rechazan-decision-del-tc-por-norma-de-reconexion-es-imposible-de-cumplir/", "fonte_id": "la_tercera", "data_pub": "2026-08-25T18:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Associação Nacional de Empresas de Serviços Sanitários e Empresas Eléctricas rejeitaram a decisão do Tribunal Constitucional por considerarem a norma de reconexão como impraticável. Eles argumentaram que a norma requer recursos operacionais e pessoais para casos individuais, o que pode não ser viável durante uma catástrofe.", "titulo_pt": "Gremios de serviços básicos rejeitam decisão do TC por norma de reconexão: 'é impraticável de cumprir'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 123846, "titulo": "Dois meses após terremotos, Venezuela apresenta balanço com 335 novas moradias e mais de 1,1 mil imóveis reabilitados", "url": "https://www.brasildefato.com.br/2026/08/25/dois-meses-apos-terremotos-venezuela-apresenta-balanco-com-335-novas-moradias-e-mais-de-11-mil-imoveis-reabilitados/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-25T17:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois meses após os terremotos, a Venezuela informou que construiu 335 novas moradias e reabilitou mais de 1.100 imóvei let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);

function toggleDrill(id) {
  const el = document.getElementById(id);

  const aberta = el.classList.toggle("aberta");

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  const d = D.destaque;

    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}

  return `<div>

    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>

    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;
