n cita clave para celebrar el “Encuentro Nacional del Centenario del Municipalismo”", "url": "https://www.latercera.com/nacional/noticia/alcaldes-fijan-cita-clave-para-celebrar-el-encuentro-nacional-del-centenario-del-municipalismo/", "fonte_id": "la_tercera", "data_pub": "2026-11-20T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Asociación Chilena de Municipalidades (ACHM), liderada por Gustavo Alessandri, agendou uma reunião para discutir temas como maior atribuição de poderes e a Lei de Rentas Municipais a 100 anos do primeiro encontro nacional de prefeitos.", "titulo_pt": "Prefeitos marcam encontro para celebrar o 'encontro Nacional centenário do Municipalismo'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 277288, "titulo": "El Toyota Century de Kast, el español de Naruhito y las otras escenas que dejó la gira por Asia", "url": "https://www.latercera.com/politica/noticia/el-toyota-century-de-kast-el-espanol-de-naruhito-y-las-otras-escenas-que-dejo-la-gira-por-asia/", "fonte_id": "la_tercera", "data_pub": "2026-11-20T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A viagem do presidente Kast por Asia incluiu o uso de um automóvel de luxo japonês, uma recepção informal entre os emperadores, uma reunião com Xi Jinping que durou mais do que planejado, um encontro com Keiko Fujimori e uma série de eventos protocolares com interações fora do previsto.", "titulo_pt": "O Toyota Century de Kast, o espanhol de Naruhito e outras cenas da gira por Asia", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 277706, "titulo": "Boys Noize turns to the club (and an obscure Italian synth) for inspiration on 7LLVSION", "url": "https://www.theverge.com/entertainment/1038444/boys-noize-7llvsion-interview", "fonte_id": "the_verge", "data_pub": "2026-11-20T16:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alex Ridha, conhecido como Boys Noize, não foi diretamente influenciado pela colaboração com Nine Inch Nails para seu novo álbum 7LLVSION. No entanto, ele aprendeu com a produção de Trent Reznor e Atticus Ross.", "titulo_pt": "Boys Noize busca inspiração em clubes e um sintetizador italiano raro para 7LLVSION", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 276983, "titulo": "Documentário resgata Richard Avedon e seu legado entre arte e moda", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/documentario-resgata-richard-avedon-e-seu-legado-entre-arte-e-moda.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-20T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O documentário resgata o trabalho de Richard Avedon, destacando sua influência como fotógrafo de moda e sua importância no mundo da arte e da moda. Avedon é citado como uma referência para fotógrafos de moda, e muitos deles o aderiram como admirador.", "titulo_pt": "Documentário resgata Richard Avedon e seu legado entre arte e moda", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 277707, "titulo": "Andrey Zvyagintsev believes filmmakers know what the audience wants — not executives", "url": "https://www.theverge.com/entertainment/1038410/andrey-zvyagintsev-minotaur-interview-director", "fonte_id": "the_verge", "data_pub": "2026-11-20T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme 'Minotauro', dirigido por Andrey Zvyagintsev e ambientado em 2022, segue uma família em uma cidade fictícia chamada Krasoborsk, enquanto Vladimir Putin anuncia um chamado militar. A trama se concentra em um casal, Gleb e Galina, que tenta manter sua vida normal apesar do contexto geopolítico.", "titulo_pt": "Andrey Zvyagintsev acredita que os cineastas sabem o que o público quer — não os executivos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 277782, "titulo": "You shall go to the panto! Northern Ballet’s Cinderella spices the fairytale with festive fun – and a sweet twist", "url": "https://www.theguardian.com/stage/2026/nov/20/northern-ballet-cinderella-review-norwich-theatre", "fonte_id": "guardian_culture", "data_pub": "2026-11-20T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Northern Ballet apresenta uma versão de 'Cinderela' que mistura dança clássica com elementos de pôro (pantomime), incluindo uma vilã com expressões grotescas. O espetáculo, com música tocada pela Northern Ballet Sinfonia, estreia no Norwich Theatre Royal e adiciona uma dose de diversão festiva ao clássico conto de fadas.", "titulo_pt": "Você irá ao pôro! Northern Ballet traz uma cinderela com toque festivo e piada gélida", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 277778, "titulo": "Melania: the series review – so bad it robbed me of my capacity to discern time and space", "url": "https://www.theguardian.com/tv-and-radio/2026/nov/20/melania-review-tv-documentary-prime", "fonte_id": "guardian_culture", "data_pub": "2026-11-20T15:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A série documental em duas partes sobre a primeira-dama Melania Trump é considerada uma propaganda sem graça que mal consegue passar por entretenimento. A Amazon investiu US$ 75 milhões em sua produção e marketing, mas poucos assistiram ao filme.", "titulo_pt": "Melania: a série review – tão ruim que me privou da capacidade de discernir tempo e espaço", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 277429, "titulo": "How the oligarchic problem has become central to democratic debate", "url": "https://www.lemonde.fr/en/opinion/article/2026/11/20/how-the-oligarchic-problem-has-become-central-to-democratic-debate_6785539_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-20T15:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um encontro contra as oligarquias internacionais está programado para ocorrer em Paris neste fim de semana, com a participação de vários laureados com o Nobel. A palavra 'oligarca' teve seu significado ampliado nos últimos 15 anos, passando a se referir a bilionários de diferentes origens, não apenas a russos corruptos.", "titulo_pt": "O problema das oligarquias tornou-se central para debates democráticos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 276985, "titulo": "Gérard Depardieu e autor Michel Houellebecq teriam praticado estupro coletivo", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/gerard-depardieu-e-autor-michel-houellebecq-teriam-praticado-estupro-coletivo.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-20T14:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ator Gérard Depardieu e o escritor Michel Houellebecq são investigados em Paris por suspeita de estupro coletivo. A apuração foi iniciada após uma denúncia apresentada por uma atriz em maio de 2025, conforme informou uma fonte próxima ao caso em 11 de outubro de 2026.", "titulo_pt": "Depardieu e Houellebecq são investigados por estupro coletivo", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 276986, "titulo": "'Não dá para sudestino escrever para nordestino', diz atriz ao criticar novela da Globo", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/televisao/2026/11/nao-da-para-sudestino-escrever-para-nordestino-diz-atriz-ao-criticar-novela-da-globo.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-20T14:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A atriz Claudia Di Moura criticou a forma como personagens negros e nordestinos são retratados na televisão brasileira, destacando a falta de vivência dos profissionais nos grupos representados.", "titulo_pt": "Sudestino não pode escrever para nordestino, diz atriz", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 277058, "titulo": "Suspeito de matar namorada a facadas no PR é preso em rodovia de São Paulo", "url": "https://www.metropoles.com/sao-paulo/suspeito-de-matar-namorada-a-facadas-no-pr-e-preso-em-rodovia-de-sao-paulo", "fonte_id": "metropoles", "data_pub": "2026-11-20T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um suspeito foi preso em uma rodovia em São Paulo após ser acusado de matar sua namorada a facadas em Paraná. Durante a abordagem policial, o suspeito tentou danificar intencionalmente um aparelho celular.", "titulo_pt": "Suspeito de matar namorada a facadas no PR é preso em rodovia de sp", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 277271, "titulo": "Chile registra 602 trasplantes en lo que va del año. la cifra más alta desde el 2000", "url": "https://www.latercera.com/nacional/noticia/chile-registra-602-trasplantes-en-lo-que-va-del-ano-la-cifra-mas-alta-desde-el-2000/", "fonte_id": "la_tercera", "data_pub": "2026-11-20T17:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Chile registrou 602 trasplantes até o momento deste ano, o número mais alto desde 2000. Além disso, foram realizados 58 trasplantes de coração, também a maior quantidade desde 2019.", "titulo_pt": "Chile registra 602 trasplantes no ano, maior número desde 2000", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 277062, "titulo": "Vídeo: cadela em UTI recebe declaração emocionante de garota de 2 anos", "url": "https://www.metropoles.com/colunas/e-o-bicho/video-cadela-em-uti-recebe-declaracao-emocionante-de-garota-de-2-anos", "fonte_id": "metropoles", "data_pub": "2026-11-20T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma cadela hospitalizada após um envenenamento acidental recebeu uma 'serenata' de sua tutora de 2 anos. O vídeo registra esse momento emocionante.", "titulo_pt": "Vídeo: cadela hospitalizada recebe 'serenata' emocionante de garota de 2 anos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 277067, "titulo": "Dia da Consciência Negra: do início das cotas ao Oxê de Xangô no Supremo", "url": "https://www.metropoles.com/colunas/matheus-leitao/dia-da-consciencia-negra-do-inicio-das-cotas-ao-oxe-de-xango-no-supremo", "fonte_id": "metropoles", "data_pub": "2026-11-20T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Neste Dia da Consciência Negra, a história recente das cotas no ensino superior contrasta com os números elevados de violência e desigualdade racial no Brasil. O texto também menciona a decisão do Supremo Tribunal Federal (STF) sobre o uso das cotas.", "titulo_pt": "Dia da Consciência Negra: da história das cotas ao cenário da desigualdade no Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 276960, "titulo": "Brasil tem quarta pior proficiência em inglês na América Latina, diz levantamento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/brasil-tem-quarta-pior-proficiencia-em-ingles-na-america-latina-diz-levantamento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-20T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil ocupa o quarto lugar em termos de proficiência em inglês na América Latina, de acordo com o EF English Proficiency Index 2026, publicado pelo Education First. O levantamento analisou o nível de inglês em vários países da região.", "titulo_pt": "Brasil tem quarto pior proficiência em inglês na América Latina, diz estudo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 277194, "titulo": "Casos de covid crescem no Brasil mesmo com vacina sobrando", "url": "https://www.dw.com/pt-br/casos-de-covid-crescem-no-brasil-mesmo-com-vacina-sobrando/a-80004772?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-20T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de casos de covid-19 aumentou em 19 estados brasileiros, mesmo com a disponibilidade excessiva de vacinas. Especialistas atribuem essa tendência à baixa adesão à imunização, associada a uma diminuição da percepção de risco e à disseminação de desinformação sobre as vacinas.", "titulo_pt": "Casos de covid aumentam no Brasil com vacinas em sobra", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 277238, "titulo": "Huelga general y marchas en toda Italia contra el gobierno de Giorgia Meloni y el alto costo de vida", "url": "https://www.clarin.com/mundo/huelga-general-marchas-toda-italia-gobierno-giorgia-meloni-alto-costo-vida_0_SKPTWNQ2cW.html", "fonte_id": "clarin", "data_pub": "2026-11-20T17:04:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas se manifestaram em várias cidades italianas contra o governo de Giorgia Meloni e o alto custo de vida, similar a protestos em outros países europeus. Os sindicatos e os estudantes participaram, e houve pequenos conflitos entre os manifestantes e a polícia.", "titulo_pt": "Greve geral e marchas em toda Itália contra o governo de Giorgia Meloni e o alto custo de vida", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 277202, "titulo": "'A cidade acabou': a destruição causada por temporal que provocou mortes no RS", "url": "https://www.bbc.com/portuguese/articles/cqdr1xmyg3kzo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-20T17:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Temporal causou destruição em várias cidades do Rio Grande do Sul, com ruas cobertas de granizo e destroços de prédios, árvores e postes vistos em fotos compartilhadas por moradores nas redes sociais.", "titulo_pt": "A cidade acabou: destruição causada por temporal no RS", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 277624, "titulo": "Mamdani unveils plan to close New York’s notorious Rikers Island jail", "url": "https://www.scmp.com/news/world/united-states-canada/article/3375293/mamdani-unveils-plan-close-new-yorks-notorious-rikers-island-jail", "fonte_id": "scmp", "data_pub": "2026-11-20T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O prefeito de Nova York, Zohran Mamdani, apresentou um plano para fechar a prisão controversa de Rikers Island até 2032. O plano inclui um significativo redução do número de detentos e a construção de quatro novas prisões menores e mais modernas até 2027.", "titulo_pt": "Mamdani anuncia plano para fechar Rikers Island em 2032", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 277028, "titulo": "Jovens organizam protestos em mais de 25 países europeus contra custo de vida", "url": "https://veja.abril.com.br/mundo/jovens-organizam-protestos-em-mais-de-25-paises-europeus-contra-custo-de-vida/", "fonte_id": "veja", "data_pub": "2026-11-20T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jovens organizam protestos em mais de 25 países europeus contra o aumento dos custos de vida, a crise habitacional, a precarização do ensino e os gastos militares. Estudantes e ativistas participam destas manifestações.", "titulo_pt": "Jovens organizam protestos em mais de 25 países europeus contra custo de vida", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 277030, "titulo": "Justiça recebe denúncia e manda prender 11 pela morte de policial em megaoperação no Rio", "url": "https://veja.abril.com.br/brasil/justica-recebe-denuncia-e-manda-prender-11-pela-morte-de-policial-em-megaoperacao-no-rio/", "fonte_id": "veja", "data_pub": "2026-11-20T16:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça autorizou a prisão de 11 pessoas por envolvimento com o Comando Vermelho em relação à morte de um policial. O policial Rodrigo Velloso Cabral foi morto por um tiro de fuzil durante a operação.", "titulo_pt": "Justiça prende 11 suspeitos pela morte de policial no comando vermelho", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 277158, "titulo": "Turista estrangeiro morre após ser baleado durante assalto no Centro do Rio", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/rj/turista-estrangeiro-morre-apos-ser-baleado-durante-assalto-no-centro-do-rio/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T15:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um turista estrangeiro foi morto após ser baleado durante um assalto na rua dos Inválidos, no Centro do Rio, na madrugada desta sexta-feira (20). Os criminosos fugiram após o crime.", "titulo_pt": "Turista estrangeiro é morto em assalto no Centro do Rio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 277036, "titulo": "O congestionamento das estradas para o litoral de São Paulo no feriado da Consciência Negra", "url": "https://veja.abril.com.br/agenda-verde/o-congestionamento-das-estradas-para-o-litoral-de-sao-paulo-no-feriado-da-consciencia-negra/", "fonte_id": "veja", "data_pub": "2026-11-20T15:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O congestionamento na estrada Anchieta-Imigrantes registra aproximadamente 50 km de lentidão na manhã desta sexta-feira, 20 de novembro. O feriado da Consciência Negra contribuiu para o aumento no fluxo de veículos rumo ao litoral de São Paulo.", "titulo_pt": "Congestionamento na anchieta-imigrantes no feriado da Consciência Negra", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 277341, "titulo": "Young people across Europe stage coordinated ‘fight for our future’ protests", "url": "https://www.theguardian.com/world/2026/nov/20/young-people-europe-coordinated-protests-cost-of-living", "fonte_id": "guardian_world", "data_pub": "2026-11-20T15:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudantes e jovens trabalhadores de mais de 20 países europeus realizaram protestos coordenados contra o custo de vida, condições de aprendizado e aumento do gasto militar. Ativistas de mais de 50 grupos em países como Bélgica, França, Alemanha, Grécia, Itália, Portugal, Espanha e Reino Unido participaram de manifestações, que incluíram a queima de modelos de tanques e a exibição de cartazes com a mensagem 'luta pelo nosso futuro'.", "titulo_pt": "Jovens de mais de 20 países europeus realizam protestos coordenados por 'luta pelo nosso futuro'", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 277434, "titulo": "Isolated Indigenous group resurfaces in Brazil, raising fears over their survival", "url": "https://www.lemonde.fr/en/environment/article/2026/11/20/isolated-indigenous-group-resurfaces-in-brazil-raising-fears-over-their-survival_6785506_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-20T14:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo da tribo Awa-Guaja emergiu brevemente da isolamento em 16 de novembro, após pelo menos 50 anos. Pesquisadores temem que eles possam ser afetados por seca ou violência de organizações criminosas.", "titulo_pt": "Grupo isolado da tribo awa-guaja reaparece no Brasil, levantando preocupações sobre sua sobrevivência", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 277207, "titulo": "Como mulher foi dopada e oferecida a desconhecidos pelo marido durante 13 anos", "url": "https://www.bbc.com/portuguese/articles/cmg46knk175vo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-20T13:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher foi dopada e oferecida a estranhos pelo marido durante 13 anos no Reino Unido. Este caso tem semelhanças com o de Gisèle Pelicot na França, que também sofreu estupros repetidos por anos.", "titulo_pt": "Como mulher foi dopada e oferecida a desconhecidos pelo marido durante 13 anos", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 277204, "titulo": "Fiona, hipopótamo que viralizou nas redes por nascimento prematuro, morre após engolir gorro de lã em zoológico", "url": "https://www.bbc.com/portuguese/articles/cjn502p90dzxo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-20T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O hipopótamo Fiona, que virou famoso nas redes sociais por seu nascimento prematuro, morreu após engolir um gorro de lã. Durante as últimas dez dias, o animal passou por tentativas de expelir o objeto.", "titulo_pt": "Fiona, hipopótamo viral nas redes por nascimento prematuro, morre após engolir gorro de lã", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 277249, "titulo": "Trabajadores escucharon chillidos en los túneles y cuando fueron a ver de dónde provenían se encontraron con cuatro focas atrapadas", "url": "https://www.lanacion.com.ar/lifestyle/trabajadores-escucharon-chillidos-en-los-tuneles-y-cuando-fueron-a-ver-de-donde-provenian-se-nid17112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-20T17:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores ouviram chiados em túneis e, ao investigar, encontraram quatro focas presas em cavernas escurecidas e perigosas. Um grupo que defende a fauna salvou os animais.", "titulo_pt": "Trabalhadores ouviram chiados em túneis e encontraram focas presas em cavernas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 277241, "titulo": "Nació una cría de tapir en el Ecoparque porteño: por qué es una buena noticia para una especie amenazada", "url": "https://www.clarin.com/informacion-general/nacio-cria-tapir-ecoparque-porteno-buena-noticia-especie-amenazada_0_XfAyR5owXv.html", "fonte_id": "clarin", "data_pub": "2026-11-20T17:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Yunga, uma criana de tapir, nasceu no Ecoparque porteño, representando um avanço importante para a conservação de uma espécie ameaçada pela caça furtiva e pela deforestação.", "titulo_pt": "Nasceu uma criana de tapir no Ecoparque porteño: por que é uma boa notícia para uma espécie ameaçada", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 277083, "titulo": "Temporal de 114 km/h destelha 5 mil casas no RS; três mortes são investigadas", "url": "https://exame.com/brasil/temporal-de-114-km-h-destelha-5-mil-casas-no-rs-tres-mortes-sao-investigadas/", "fonte_id": "exame", "data_pub": "2026-11-20T13:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um temporal com velocidade de 114 km/h destelhou cerca de 5 mil casas no Rio Grande do Sul, deixando 60 feridos e interrompendo serviços essenciais. O governo gaúcho destinou R$ 2 milhões para a situação.", "titulo_pt": "Temporal de 114 km/h destelha 5 mil casas no RS; 60 feridos e r$ 2 milhões liberados", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 277128, "titulo": "Venezuela apresenta na COP31 modelo próprio de participação comunitária na proteção ambiental", "url": "https://www.brasildefato.com.br/2026/11/20/venezuela-apresenta-na-cop31-modelo-proprio-de-participacao-comunitaria-na-protecao-ambiental/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-20T13:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Venezuela apresenta um modelo próprio de participação comunitária na proteção ambiental e combate às mudanças climáticas, através de projetos locais e políticas de conservação do território. Essa iniciativa foi apresentada pelo ministro do Poder Popular para o Ecosocialismo, Nelson Rodríguez, durante a 31ª Conferência das Nações Unidas.", "titulo_pt": "Venezuela apresenta modelo de participação comunitária na proteção ambiental na COP31", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 276629, "titulo": "Video shows isolated Awá Indigenous people make contact with government team in Brazil", "url": "https://www.euronews.com/2026/11/20/video-shows-isolated-awa-indigenous-people-make-contact-with-government-team-in-brazil", "fonte_id": "euronews", "data_pub": "2026-11-20T09:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 20 membros do grupo indígena isolado Awá no Amazonas se aproximaram de uma unidade do governo, pedindo yamãs antes de retornarem à floresta. O encontro raro levanta preocupações sobre a saúde e a possível falta de alimentos dos indígenas.", "titulo_pt": "Vídeo mostra membros isolados do povo Awá entrando em contato com equipe do governo no amazonas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 276587, "titulo": "Climate crisis is already reshaping global tourism, top destinations remain unprepared, study finds", "url": "https://www.lemonde.fr/en/economy/article/2026/11/20/climate-crisis-is-already-reshaping-global-tourism-top-destinations-remain-unprepared-study-finds_6785143_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-20T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório Destination Climate RiskScan analisa 2.600 regiões em 263 países e conclui que o risco associado às altas temperaturas está intensificando, exigindo adaptação do setor turístico e redução das emissões de gases de efeito estufa, que estão em aumento.", "titulo_pt": "Crise climática já está remodelando o turismo global, destinos principais não se prepararam, estudo aponta", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 276229, "titulo": "Alerta viral: o que explica o aumento recente dos casos de covid-19 no Brasil", "url": "https://veja.abril.com.br/saude/alerta-viral-o-que-explica-o-aumento-recente-dos-casos-de-covid-19-no-brasil/", "fonte_id": "veja", "data_pub": "2026-11-20T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vírus da COVID-19 continua sendo um risco para os brasileiros, mesmo após um período de baixa incidência. É importante manter os cuidados e continuar a vacinação.", "titulo_pt": "Alerta viral: o que explica o aumento recente dos casos de covid-19 no Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 276631, "titulo": "Japan: The dark secret behind an island paradise full of rabbits", "url": "https://www.euronews.com/video/2026/11/20/japan-the-dark-secret-behind-an-island-paradise-full-of-rabbits", "fonte_id": "euronews", "data_pub": "2026-11-20T08:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Centenas de coelhos se movem livremente na Ilha Okunoshima, no Japão, encantando visitantes de todo o mundo. No entanto, a triste história de produção secreta de armas químicas escondida por trás do cenário encantador é um segredo sombrio.", "titulo_pt": "Japão: o segredo escuro por trás de uma ilha paradisíaca cheia de coelhos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 276282, "titulo": "Chuvas pressionam produtores de mandioca e margens da indústria no Paraná", "url": "https://www.cnnbrasil.com.br/agro/chuvas-pressionam-produtores-de-mandioca-e-margens-da-industria-no-parana/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As chuvas limitaram a oferta de mandioca, elevando os preços da raiz. No entanto, os custos no campo aumentaram e a valorização dos derivados não acompanhou essa tendência, reduzindo a rentabilidade da cadeia produtiva.", "titulo_pt": "Chuvas pressionam produtores de mandioca e rentabilidade da indústria no Paraná", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 276636, "titulo": "US sells first deep-sea mining leases off American Samoa, days after court ruled against process", "url": "https://www.euronews.com/2026/11/20/us-sells-first-deep-sea-mining-leases-off-american-samoa-days-after-court-ruled-against-pr", "fonte_id": "euronews", "data_pub": "2026-11-20T05:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump realizou leilões de mineração marinha em águas próximas a American Samoa, mesmo após um juiz federal determinar que as autoridades violaram a lei de proteção à vida selvagem. Grupos ambientalistas prometeram anular os contratos.", "titulo_pt": "EUA realiza primeiro leilão de mineração marinha em águas americanas, após decisão judicial", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 276728, "titulo": "Climate talks ditch call to quit fossil fuels as deal nears", "url": "https://www.japantimes.co.jp/environment/2026/11/20/climate-change/cop-fossil-fuel-language/", "fonte_id": "japan_times", "data_pub": "2026-11-20T03:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As discussões climáticas na COP31 em Antalya, Turquia, chegaram a um compromisso em questões polêmicas, aumentando as chances de um acordo amplo, embora diluído. O acordo final pode não incluir uma chamada para abandonar os combustíveis fósseis.", "titulo_pt": "Negociações climáticas na cop31 abandonam chamado para abandonar combustíveis fósseis", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 275297, "titulo": "Advocates ask candidates for clear climate policies", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/20/2003868073", "fonte_id": "taipei_times", "data_pub": "2026-11-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Advogados pedem aos candidatos políticos que apresentem políticas claras sobre o clima. O objetivo é garantir que os candidatos estejam preparados para lidar com questões ambientais de forma transparente e eficaz.", "titulo_pt": "Advogados pedem políticos clareza sobre políticas climáticas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 277205, "titulo": "Homem gritou de dor em execução que durou uma hora no Texas, nos Estados Unidos", "url": "https://www.bbc.com/portuguese/articles/c84gn75r49eno?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-20T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem gritou de dor durante uma execução que durou uma hora no Texas, EUA, semanas após uma mulher de 50 anos sobreviver a duas injeções letais no Tennessee. O uso de pentobarbital, proibido federalmente nos EUA, ainda é utilizado em alguns estados.", "titulo_pt": "Homem gritou de dor em execução que durou uma hora no Texas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 277583, "titulo": "One third of attacks on children worldwide recorded in Palestine", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/20/one-third-of-attacks-on-children-worldwide-recorded-in-palestine?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T15:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2025, um terço das violações registradas contra crianças em todo o mundo ocorreram em Palestina.", "titulo_pt": "Um terço dos ataques a crianças mundialmente registrados em 2025 ocorreram em palestina", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 277607, "titulo": "ARTE Europe Weekly: Gender-Based Violence in the Military", "url": "https://balkaninsight.com/2026/11/20/arte-europe-weekly-gender-based-violence-in-the-military/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-20T15:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatos de assédio e abuso estão prejudicando a reputação das forças armadas em alguns países europeus. Trata-se de um problema sistêmico?", "titulo_pt": "ARTE Europe Weekly: violência de gênero nas forças armadas", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 277708, "titulo": "UN court cites military Facebook posts while finding Myanmar guilty of genocide", "url": "https://www.theverge.com/policy/1038450/facebook-myanmar-genocide-un", "fonte_id": "the_verge", "data_pub": "2026-11-20T15:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Corte Internacional de Justiça declarou que a Myanmar cometeu genocídio estatal contra o povo rohingya em 2016 e 2017. A corte mencionou publicações militares no Facebook como parte do esforço de disseminar discurso de ódio contra a minoria muçulmana do país.", "titulo_pt": "Corte internacional de justiça cita publicações militares no Facebook ao condenar Myanmar por genocídio", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 277587, "titulo": "Blood Gold: The Munduruku’s fight for survival in the Brazilian Amazon", "url": "https://www.aljazeera.com/video/fault-lines/2026/11/20/blood-gold-the-mundurukus-fight-for-survival-in-the-brazilian-amazon?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa Fault Lines explora como a mineração ilegal de ouro polui e ameaça as comunidades indígenas na Amazônia brasileira.", "titulo_pt": "Sangue de ouro: a luta pela sobrevivência dos Munduruku na amazônia brasileira", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 277643, "titulo": "Vietnam scraps death sentence for drug trafficking", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3375257/vietnam-scraps-death-sentence-drug-trafficking", "fonte_id": "scmp", "data_pub": "2026-11-20T11:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Vietnã aboliu a pena de morte para tráfico de drogas e várias outras infrações, mantendo-a apenas para quatro delitos. Segundo a Amnesty International, mais de 1.200 pessoas ainda aguardavam execução no país no final de 2023.", "titulo_pt": "Vietnã elimina pena de morte para tráfico de drogas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 277335, "titulo": "‘Weak and dizzy’: the secretive ICE force-feeding tactics that ended a Cuban father’s hunger strike", "url": "https://www.theguardian.com/us-news/2026/nov/20/ice-cuba-hunger-strike-force-feeding", "fonte_id": "guardian_world", "data_pub": "2026-11-20T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Luis Alejandro Cora Pérez, um solicitante de asilo cubano, de 32 anos, que estava em greve de fome há três meses, disse em mensagens ao Guardian que havia interrompido sua greve de fome porque a força alimentação pela ICE o deixava fraco e tonto.", "titulo_pt": "Fraco e desorientado: as táticas secretas de força alimentação da ICE que interromperam a greve de fome de um pai cubano", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 276738, "titulo": "Malaysia plans to resettle 10,000 Rohingya in Turkey", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3375243/malaysia-plans-resettle-10000-rohingya-turkey", "fonte_id": "scmp", "data_pub": "2026-11-20T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Malásia planeja relocalizar 10.000 refugiados rohingya para a Turquia como parte de esforços para resolver um desafio de refugiados com longa duração envolvendo solicitantes de asilo de países como a Myammar. A proposta foi anunciada pelo vice-primeiro-ministro Ahmad Zahid Hamidi.", "titulo_pt": "Malásia planeja relocalizar 10.000 Rohingya na Turquia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 276301, "titulo": "Mianmar cometeu genocídio contra a minoria rohingya, decide corte da ONU", "url": "https://www.metropoles.com/mundo/mianmar-cometeu-genocidio-contra-a-minoria-rohingya-decide-corte-da-onu", "fonte_id": "metropoles", "data_pub": "2026-11-20T09:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A corte principal da ONU decidiu que o Mianmar cometeu genocídio contra a minoria rohingya. Esta é a primeira decisão do órgão judicial mais importante da ONU que atribui responsabilidade por genocídio a um país.", "titulo_pt": "Mianmar cometeu genocídio contra a minoria rohingya, decide corte da ONU", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 276362, "titulo": "A batalha na Justiça para apagar homenagem a expoente do racismo científico no Brasil", "url": "https://www.bbc.com/portuguese/articles/cm4gn08l5ldeo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-20T08:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma ação popular está sendo julgada na segunda instância em dezembro com o objetivo de mudar o nome do Hospital Nina Rodrigues, em São Luís, como forma de reparação histórica. O hospital leva o nome de Nina Rodrigues, considerada um expoente do racismo científico no Brasil.", "titulo_pt": "Batalha na Justiça para mudar nome do hospital nina rodrigues, em são luís", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 276281, "titulo": "Mulheres são 61% das vítimas de racismo online denunciado ao Disque 100", "url": "https://www.cnnbrasil.com.br/nacional/brasil/mulheres-sao-61-das-vitimas-de-racismo-online-denunciado-ao-disque-100/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-20T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo do Aláfia Lab analisou 1.739 denúncias de racismo online de 2011 a 2025, constatando que 61% das vítimas eram mulheres. O perfil mais frequente era de mulheres pretas com idades entre 25 e 30 anos, e houve falta de informações sobre os agressores em muitos dos registros.", "titulo_pt": "Mulheres são 61% das vítimas de racismo online denunciado ao Disque 100", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 277805, "titulo": "“When a home and even a kindergarten are not safe, where can a child feel safe?” - Children in Ukraine face mounting casualties and relentless attacks", "url": "https://www.unicef.org/press-releases/when-home-and-even-kindergarten-are-not-safe-where-can-child-feel-safe-children", "fonte_id": "unicef", "data_pub": "2026-11-20T07:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Crianças na Ucrânia enfrentam crescentes vítimas e ataques persistentes, mesmo em locais como casas e jardins de infância. A UNICEF destaca a falta de segurança para as crianças nesse contexto de conflito.", "titulo_pt": "Onde uma criança pode se sentir segura se nem casa nem jardim de infância são seguros?", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 276307, "titulo": "Execução nos EUA dura uma hora e condenado relata dor durante o processo", "url": "https://www.metropoles.com/mundo/execucao-nos-eua-dura-uma-hora-e-condenado-relata-dor-durante-o-processo", "fonte_id": "metropoles", "data_pub": "2026-11-20T07:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A execução nos Estados Unidos durou uma hora, e o condenado relatou ter sentido dor durante o processo. Antes disso, ocorreu uma tentativa falhada de executar Christa Pike no Tennessee, que sobreviveu a duas doses de pentobarbital.", "titulo_pt": "Execução nos EUA dura uma hora e condenado relata dor durante o processo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 276312, "titulo": "Estado mais negro do país é o que mais registra ações de racismo na Justiça", "url": "https://www.metropoles.com/brasil/estado-mais-negro-do-pais-e-o-que-mais-registra-acoes-de-racismo-na-justica", "fonte_id": "metropoles", "data_pub": "2026-11-20T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estado da Bahia possui mais de 2,9 mil processos pendentes relacionados a ações de racismo, representando aproximadamente 17% do total de ações ajuizadas no país.", "titulo_pt": "O estado mais negro do país é o que mais registra ações de racismo na Justiça", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 276906, "titulo": "Child casualties in Ukraine reach highest level in almost four years – UNICEF", "url": "https://www.unicef.org/press-releases/child-casualties-ukraine-reach-highest-level-almost-four-years-unicef", "fonte_id": "unicef", "data_pub": "2026-11-20T07:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As mortes de crianças em Ucrânia atingiram o nível mais alto em quase quatro anos, de acordo com o UNICEF. Ataques verificados a infraestrutura energética aumentaram significativamente desde o início da guerra de escala completa.", "titulo_pt": "Vítimas infantis na Ucrânia atingem nível mais alto em quase quatro anos – UNICEF", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 276679, "titulo": "Lula visits ailing Chief Raoni as Brazil recognises Indigenous land", "url": "https://www.aljazeera.com/news/2026/11/20/lula-visits-ailing-chief-raoni-as-brazil-recognises-indigenous-land?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-20T03:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lula visita Raoni, que está doente, em Mato Grosso, enquanto reconhece terras indígenas Kayapo e Yudja. O presidente destaca o legado de Raoni e avança na proteção das terras ancestrais dessas comunidades.", "titulo_pt": "Lula visita Raoni doente e reconhece terras indígenas kayapo e yudja", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 277659, "fonte_id": "taipei_times", "titulo": "Additional budget passes with no cuts", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/21/2003868118", "data_pub": "2026-11-21T00:00:00Z", "topico": "economia", "idioma": "en", "titulo_pt": "Orçamento adicional aprovado sem cortes", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 277661, "fonte_id": "taipei_times", "titulo": "TAIEX plunges almost 18% in worst week since 1991", "url": "https://www.ta const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
