rg/article/happy-snacking-dont-die-cookbook", "fonte_id": "science_news", "data_pub": "2026-09-22T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O livro é uma guia alegre para a coleta de plantas silvestres, tornando o processo mais acessível. O autor Alexis Nikole Nelson incorpora alegria em seu guia culinário, o que facilita a abordagem do assunto.", "titulo_pt": "‘Aproveite o biscoito, não morra!’ É um guia alegre para comer plantas silvestres", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 176514, "titulo": "New federal autism committee head has financial ties to leucovorin", "url": "https://www.statnews.com/2026/09/22/health-news-federal-autism-committee-head-has-financial-ties-to-leucovorin/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-22T11:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "John Gaitanis, um neurologista pediátrico, foi nomeado como novo chefe do Comitê Interagência de Autismo Federal. RFK Jr. fez essa nomeação, e Gaitanis tem ligações financeiras com leucovorina.", "titulo_pt": "Novo chefe do comitê federal de autismo tem ligações financeiras com leucovorina", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 176564, "titulo": "Mathematicians use AI to find mysterious symmetries, solving decades-old problem", "url": "https://www.scientificamerican.com/article/mathematicians-use-ai-to-find-mysterious-symmetries-solving-decades-old-problem/", "fonte_id": "scientific_american", "data_pub": "2026-09-22T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Matemáticos e amadores encontraram todas as 25.000 soluções para um problema 'inverse Galois' que havia sido desafiador há décadas.", "titulo_pt": "Matemáticos utilizam IA para descobrir simetrias misteriosas, resolvendo problema de décadas", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 176565, "titulo": "NASA Goddard’s shrinking workforce could stif son Initiative para 2026-2027", "veiculo": "The Paris Review", "pais": "EUA", "classe": "A"}, {"id": 175519, "titulo": "Quem é Rick, da dupla Rick e Renner, e como ele ajudou a renovar o sertanejo com letras bem-humoradas e sensuais", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/quem-e-rick-da-dupla-rick-e-renner-e-como-ele-ajudou-a-renovar-o-sertanejo-com-letras-bem-humoradas-e-sensuais.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-22T12:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rick, um cantor sertanejo que começou sua carreira cantando em bares de Brasília na infância, foi um dos membros da dupla Rick e Renner, conhecida por letras bem-humoradas e sensuais. Ele estava a bordo de um helicóptero que desapareceu em Santa Catarina na segunda-feira (21).", "titulo_pt": "Quem era Rick, da dupla Rick e Renner, e como ele ajudou a renovar o sertanejo com letras bem-humoradas e sensuais", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 175520, "titulo": "Perfil de Rick e Renner nas redes diz que todos seguem unidos e com esperança", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/perfil-de-rick-e-renner-nas-redes-diz-que-todos-seguem-unidos-e-com-esperanca.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-22T12:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em nota, o perfil oficial de Rick e Renner nas redes sociais informa que buscas pelo helicóptero desaparecido continuam na região de Santa Catarina. A postagem solicita cautela na divulgação de informações não oficiais sobre o caso.", "titulo_pt": "Perfil de Rick e Renner informa sobre buscas e pede cautela nas informações", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 175601, "titulo": "Maior violonista brasileiro, Dilermando Reis influenci anifestantes em Nova York projetaram imagens de Flávio Bolsonaro entregando a faixa presidencial do Brasil a Donald Trump, horas antes da sessão de discursos da 81ª Assembleia Geral da ONU.", "titulo_pt": "Protesto em Nova York mostra Flávio Bolsonaro entregando faixa presidencial a Trump", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 176364, "titulo": "Mother seeks justice 7 months after Thai-Swedish son’s fatal crash in Pattaya", "url": "https://www.scmp.com/week-asia/people/article/3368415/mother-seeks-justice-7-months-after-thai-swedish-sons-fatal-crash-pattaya?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-22T12:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A mãe de um adolescente de 15 anos, de origem tailandês-suédese, que faleceu após um acidente de moto que colidiu com um caminhão que estava reversando ilegalmente em direção oposta, pede justiça, acusando a polícia de não ter cumprido uma ordem de prisão contra o suposto motorista, um cidadão chinês, sete meses após o acidente fatal. Tommy Boulanger, um aspirante a jogador de futebol, entrou em coma após o acidente em fevereiro de 2023, na região de Nongpure, perto da cidade de resort de Pattaya, e nunca mais recuperou.", "titulo_pt": "Mãe pede justiça 7 meses após acidente fatal com moto de filho em Pattaya", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 175700, "titulo": "Com a NR-1, saúde mental virou risco legal: afastamentos já somam 440 mil por ano", "url": "https://exame.com/carreira/com-a-nr-1-saude-mental-virou-risco-legal-afastamentos-ja-somam-440-mil-por-ano/", "fonte_id": "exame", "data_pub": "2026-09-22T11:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A NR-1 estabeleceu novas exigências para a saúde mental no ambiente de trabalho, levando a um aumento significativo de afastamentos devido a problemas mentais. Empresas estão utilizando tecnologia para monitorar o c Nepal solicitou US$ 20 milhões ao fundo da ONU para 'perdas e danos' após as inundações devastadoras, mas essa quantia representa apenas 0,7% dos custos das inundações. O pedido abrange apenas uma pequena fração dos danos econômicos causados pelas inundações.", "titulo_pt": "Análise: solicitação de us$ 20 milhões do nepal para 'perdas e danos' cobre apenas 0,7% dos custos das inundações", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 176147, "titulo": "UN chief says fossil fuel majors treat atmosphere like 'open sewer'", "url": "https://www.lemonde.fr/en/international/article/2026/09/22/un-chief-says-fossil-fuel-majors-treat-atmosphere-like-open-sewer_6757817_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-22T14:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da ONU, Antonio Guterres, criticou a indústria energética durante a Assembleia Geral das Nações Unidas. Ele afirmou que as maiores empresas de combustíveis fósseis devem fazer muito mais para reparar o dano causado pela poluição.", "titulo_pt": "Chefe da ONU diz que maiores empresas de combustíveis fósfils tratam a atmosfera como 'esgoto aberto'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 175780, "titulo": "'Nunca tinha visto modelos apontarem uma área tão grande de risco': temporal que já deixou vítimas no RS agora ameaça Estado com enchentes", "url": "https://www.bbc.com/portuguese/articles/cw5y4ej510zko?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-22T13:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Inmet emitiu um alerta vermelho para 699 municípios do Sul do Brasil, incluindo o Rio Grande do Sul, devido a uma tempestade que já deixou vítimas e agora ameaça causar enchentes. A Defesa Civil confirmou mortes, feridos e desaparecidos, e informou que rios como Taquari, Caí e dos Sinos estão subindo na Serra Gaúcha.", "titulo_pt": "Nunca tinha visto modelos apontarem uma área tão grande de risco: temporal que deixou vítimas no RS ameaça com enchentes", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 176359, "titulo": "Indonesia breathing issues spike to over 170,000 cases amid wildfire haze", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3368420/indonesia-breathing-issues-spike-over-170000-cases-amid-wildfire-haze?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-22T13:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 170.000 casos de problemas respiratórios foram registrados em regiões afetadas pela névoa tóxica na Indonésia, de acordo com um oficial do Ministério da Saúde. Incêndios em Borneu, Sumatra e Papua continuam a espalhar a névoa tóxica por grande parte do arquipélago, incluindo Malásia e Singapura.", "titulo_pt": "Indonésia registra mais de 170.000 casos de problemas respiratórios em meio à névoa tóxica", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 175993, "titulo": "Poorer nations will be among the last to benefit if global emissions cut to net zero", "url": "https://www.theguardian.com/environment/2026/sep/22/climate-inequality-tropics-among-last-places-to-benefit-net-zero", "fonte_id": "guardian_world", "data_pub": "2026-09-22T11:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores descobriram que, mesmo se as emissões globais de gases de efeito estufa forem reduzidas para zero líquido, os países mais pobres e as áreas tropicais provavelmente serão os últimos a se beneficiar da redução da crise climática. As temperaturas aumentaram mais significativamente nas áreas tropicais do que em regiões mais a Norte, incluindo países mais ricos da Europa e América do Norte.", "titulo_pt": "Países mais pobres serão entre os últimos a se beneficiar com cortes de emissões para zero líquido", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 176433, "titulo": "Busan seeks ways to send stranded shark back to sea", "url": "https://www.koreaherald.com/article/10882530", "fonte_id": "korea_herald", "data_pub": "2026-09-22T08:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades de Busan estão buscando maneiras de guiar um tubarão de 3,5 metros que permanece próximo à costa em um parque costeiro de volta ao mar, após cinco dias consecutivos de sua presença na área. Uma reunião foi realizada entre representantes da Prefeitura de Busan, Guarda Costeira de Busan, Autoridade Portuária de Busan e Instituto Nacional de Pesquisa da Pesca para discutir estratégias de retorno do tubarão aos oceanos.", "titulo_pt": "Busan busca maneiras de devolver tubarão rescaldo à água do mar", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 174639, "titulo": "Ministry to revise indoor air quality regulations", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/22/2003864685", "fonte_id": "taipei_times", "data_pub": "2026-09-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério planeja revisar as regulamentações de qualidade do ar indoor. A intenção é melhorar as normas existentes.", "titulo_pt": "Ministério vai revisar regulamentos de qualidade do ar indoor", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 175816, "titulo": "ADEPA advierte sobre posibles impactos negativos para la libertad de prensa en el proyecto de ley de soberanía", "url": "https://www.lanacion.com.ar/politica/adepa-advierte-sobre-posibles-impactos-negativos-para-la-libertad-de-prensa-en-el-proyecto-de-ley-de-nid22092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-22T15:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ADEPA (Associação de Jornalistas da Argentina) enviou um análise aos legisladores sobre o projeto de lei de soberania, alertando sobre possí const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {

      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
