da. Os agressores fugiram em uma motocicleta.", "titulo_pt": "Mulher morre após ser baleada em frente a estabelecimento assistencial em Pedro Aguirre Cerda", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 251969, "titulo": "Senegal: Dakar surf school helps young Africans reclaim the waves", "url": "https://www.euronews.com/video/2026/11/09/senegal-dakar-surf-school-helps-young-africans-reclaim-the-waves", "fonte_id": "euronews", "data_pub": "2026-11-09T08:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Dakar, uma escola de surfe está tornando as ondas acessíveis a crianças locais. O fundador Ibra Samb, que aprendeu a surfar em plástico laminado, espera inspirar uma nova geração.", "titulo_pt": "Senegal: escola de surfe em dakar ajuda jovens africanos a dominar as ondas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 252176, "titulo": "For Korean moms, time off depends on where they work", "url": "https://www.koreaherald.com/article/10931011", "fonte_id": "korea_herald", "data_pub": "2026-11-09T07:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kim, uma funcionária de 37 anos em Seul que espera seu segundo filho em janeiro, notou que é mais fácil tirar um dia de folga quando seu filho precisa dela. Park, uma moradora de Seul com um filho de dois anos, também se sente mais à vontade com as novas políticas de licença parental.", "titulo_pt": "Para mães coreanas, as férias dependem do local de trabalho", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 252205, "titulo": "A doctor was murdered in South Korea. 8 years on, ‘nothing has changed’", "url": "https://www.scmp.com/week-asia/health-environment/article/3373762/doctor-was-murdered-south-korea-8-years-nothing-has-changed", "fonte_id": "scmp", "data_pub": "2026-11-09T06:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um psiquiatra foi morto em Seul, Coreia do Sul, há quase oito anos, levando à aprovação de uma lei que aumentou as penas para agressões a profissionais de saúde. No entanto, um ataque recente em um hospital da capital fez os médicos questionarem a segurança inadequada ainda existente nos hospitais do país.", "titulo_pt": "Médico foi morto na Coreia do sul há 8 anos; 'nada mudou'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 252245, "titulo": "92 safety, labor violations found at food service firm Ourhome", "url": "https://en.yna.co.kr/view/AEN20261109005900315", "fonte_id": "yonhap_news", "data_pub": "2026-11-09T06:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove2 casos de violações de segurança e padrões de trabalho foram encontrados em uma empresa de serviços alimentares chamada Ourhome.", "titulo_pt": "92 Violações de segurança e trabalho encontradas em empresa de serviços alimentares", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 251695, "titulo": "Dejaron su vida en Suiza, los llamaron locos y cuentan por qué eligieron el país: “Argentina sigue siendo el Far West”", "url": "https://www.lanacion.com.ar/lifestyle/dejaron-su-vida-en-suiza-los-llamaron-locos-y-cuentan-por-que-eligieron-el-pais-argentina-sigue-nid09112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-09T06:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um traumatólogo tucumano e uma radióloga suíça deixaram seus empregos confortáveis na Europa para trabalhar no norte da Argentina. Eles enfrentam desafios na adaptação, mas justificam sua decisão pelo ambiente de trabalho em um país que ainda apresenta características do 'Far West'.", "titulo_pt": "Eles deixaram a Suíça, foram chamados de loucos e contam por que escolheram o norte argentino: 'argentina ainda é o Far West'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 252088, "titulo": "Peer-support program for healthier aging gains ground in Sendai", "url": "https://www.japantimes.co.jp/news/2026/11/09/japan/society/frailty-prevention-peer-support/", "fonte_id": "japan_times", "data_pub": "2026-11-09T05:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um programa de apoio mútuo para envelhecimento saudável, focado na prevenção da frágil, foi lançado em 2015 em Sendai e agora está ativo em mais de 100 municípios no Japão.", "titulo_pt": "Programa de apoio mútuo para envelhecimento saudável ganha força em Sendai", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 251517, "titulo": "Horário de verão permanente pode trazer risco inesperado para as crianças", "url": "https://exame.com/ciencia/horario-de-verao-permanente-pode-trazer-risco-inesperado-para-as-criancas/", "fonte_id": "exame", "data_pub": "2026-11-09T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo prevê que pelo menos 2 bilhões de deslocamentos escolares adicionais ocorrerão à noite com o horário de verão permanente. Isso pode levar a possíveis impactos na segurança e no relógio biológico das crianças.", "titulo_pt": "Horário de verão permanente pode trazer risco inesperado para as crianças", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 252091, "titulo": "Private high schools remain out of reach for many despite tuition-free policy, survey finds", "url": "https://www.japantimes.co.jp/news/2026/11/09/japan/society/private-high-schools-costs/", "fonte_id": "japan_times", "data_pub": "2026-11-09T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Embora a educação em escolas privadas de ensino médio seja gratuita desde abril, as famílias ainda enfrentam um peso financeiro significativo devido a outros custos. Um levantamento mostrou que a política de ensino gratuito não resolveu completamente as dificuldades financeiras para muitas famílias.", "titulo_pt": "Escolas privadas de ensino médio gratuitas continuam fora do alcance para muitas famílias, aponta pesquisa", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 252211, "titulo": "Child abuse cases rise in Malaysia, Indonesia, Singapore. Why?", "url": "https://www.scmp.com/week-asia/health-environment/article/3373643/child-abuse-cases-rise-malaysia-indonesia-singapore-why", "fonte_id": "scmp", "data_pub": "2026-11-09T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os casos de abuso infantil aumentaram em Malásia, Indonésia e Singapura recentemente. No entanto, defensores de direitos da criança afirmam que isso pode indicar progresso, pois maior conscientização e melhor reporte levam a mais casos sendo notificados pelas autoridades.", "titulo_pt": "Crescem casos de abuso infantil em malásia, indonésia e singapura. Será um progresso?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 251784, "titulo": "Man accused of HungryPanda delivery rider’s stabbing murder yells and exposes himself in Melbourne court", "url": "https://www.theguardian.com/australia-news/2026/nov/09/man-charged-fatal-stabbing-hungrypanda-delivery-driver-jianming-feng-melbourne-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-09T03:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Roberto Urbano, de 51 anos, apareceu em uma audiência judicial por videoconferência após ser acusado do assassinato do entregador de comida Feng Jianming, de 47 anos, em Melbourne. Durante a aparição, Urbano despir-se e expôs-se no tribunal.", "titulo_pt": "Suspeito do assassinato do entregador de comida HungryPanda se expõe no tribunal de Melbourne", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 251785, "titulo": "‘Outrageous and racist’: premier responds to NSW One Nation candidate’s claim Australians are being ‘demographically replaced’", "url": "https://www.theguardian.com/australia-news/2026/nov/09/one-nation-stuart-bonds-slammed-immigration-comments-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-09T03:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O premier do Novo Sul da Áustrália e o Comissário Nacional de Discriminação Racial criticaram declarações de Stuart Bonds, líder do ticket do partido One Nation na Assembleia Legislativa do Novo Sul da Áustrália, que afirmou que os australianos estão enfrentando a substituição demográfica a menos que a imigração em massa seja controlada.", "titulo_pt": "Escândalo e racista: governador reage a comentários de candidato do One Nation sobre substituição demográfica na austrália", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 251541, "titulo": "A advocacia pública e o projeto constitucional antirracista", "url": "https://www.jota.info/opiniao-e-analise/colunas/advogadas-publicas-em-debate/a-advocacia-publica-e-o-projeto-constitucional-antirracista", "fonte_id": "jota", "data_pub": "2026-11-09T03:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As Procuradorias desempenham um papel na promoção da igualdade racial e no combate ao racismo, conforme estabelecido no projeto constitucional antirracista.", "titulo_pt": "A advocacia pública e o projeto constitucional antirracista", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 252115, "titulo": "Poland mourns six killed in mass shooting", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/09/2003867400", "fonte_id": "taipei_times", "data_pub": "2026-11-09T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Polônia lamenta seis mortos em tiroteio em massa.", "titulo_pt": "Polônia lamenta seis mortos em tiroteio em massa", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 251771, "titulo": "Una política de envejecimiento que no solo mire el cuerpo", "url": "https://www.ciperchile.cl/2026/11/08/una-politica-de-envejecimiento-que-no-solo-mire-el-cuerpo/?utm_source=rss&utm_medium=rss&utm_campaign=una-politica-de-envejecimiento-que-no-solo-mire-el-cuerpo", "fonte_id": "ciper_chile", "data_pub": "2026-11-08T23:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute uma política de envelhecimento que considere mais do que apenas o corpo das pessoas idosas.", "titulo_pt": "Uma política de envelhecimento que não apenas olhe para o corpo", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 251479, "titulo": "Clima: chuvas e temporais atingem várias regiões do Brasil nesta 2ª", "url": "https://www.metropoles.com/brasil/clima-chuvas-e-temporais-atingem-varias-regioes-do-brasil-nesta-2a", "fonte_id": "metropoles", "data_pub": "2026-11-09T09:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Instabilidades atmosféricas estão afetando principalmente o Sul, Centro-Oeste e Sudeste do Brasil. Oito estados e o Distrito Federal estão sob alerta amarelo para temporais.", "titulo_pt": "Clima: chuvas e temporais atingem várias regiões do Brasil nesta segunda-feira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 251967, "titulo": "Russia: HIV spreads beyond risk groups in 27 regions, epidemiologists say", "url": "https://www.euronews.com/2026/11/09/russia-hiv-spreads-beyond-risk-groups-in-27-regions-epidemiologists-say", "fonte_id": "euronews", "data_pub": "2026-11-09T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com os dados mais recentes do Rospotrebnadzor, o vírus HIV está se espalhando em 27 regiões da Federação Russa, atingindo a população em geral e não apenas grupos de risco. Pessoas infectadas estão transmitindo o vírus sem se dar conta de que estão infectadas.", "titulo_pt": "Rússia: HIV se espalha em 27 regiões, afetando a população em geral, dizem epidemiologistas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 251409, "titulo": "Bacia do Alto Paraguai perde milhões de hectares de vegetação em 40 anos", "url": "https://veja.abril.com.br/agenda-verde/bacia-do-alto-paraguai-perde-milhoes-de-hectares-de-vegetacao-em-40-anos/", "fonte_id": "veja", "data_pub": "2026-11-09T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um mapeamento do MapBiomas mostrou que 61% do bioma da Bacia do Alto Paraguai sofreu avanço de queimadas entre 1985 e 2025, resultando na perda de milhões de hectares de vegetação.", "titulo_pt": "Bacia do Alto Paraguai perde milhões de hectares de vegetação em 40 anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 251923, "titulo": "'A supersized El Niño is colliding with a planet already superheated': 2026 will be among hottest years on record", "url": "https://www.lemonde.fr/en/environment/article/2026/11/09/a-supersized-el-nino-is-colliding-with-a-planet-already-superheated-2026-will-be-among-hottest-years-on-record_6775606_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-09T08:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Supersíndice El Niño está colidindo com um planeta já superaquecido. O relatório anual do estado do clima da Organização Meteorológica Mundial foi lançado durante a COP31, que se abre na Turquia em 2026.", "titulo_pt": "A supersíndice El Niño colide com um planeta já superaquecido: 2026 será um dos anos mais quentes da história", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 252197, "titulo": "Cop31 leaders urge world to accelerate fight against global warming", "url": "https://www.scmp.com/news/world/article/3373785/cop31-leaders-urge-world-accelerate-fight-against-global-warming", "fonte_id": "scmp", "data_pub": "2026-11-09T08:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes do Cop31, um summit sobre clima, pediram para que o mundo acelerasse as ações contra o aquecimento global, diante do aumento das temperaturas e dos desastres climáticos que ameaçam vidas e a economia mundial. O evento, uma conferência anual das Nações Unidas, começou na Turquia e busca chamar a atenção dos governos para o clima, mesmo com outras crises internacionais competindo por atenção.", "titulo_pt": "Líderes do cop31 incentivam aceleração das ações contra o aquecimento global", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 252327, "titulo": "Q&A: What is the Belém-Antalya mechanism for a ‘just transition’?", "url": "https://www.carbonbrief.org/qa-what-is-the-belem-antalya-mechanism-for-a-just-transition", "fonte_id": "carbon_brief", "data_pub": "2026-11-09T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O COP31, que será realizado em Antalya, Turquia, espera-se que resulte no lançamento do Mecanismo Belém-Antalya para uma 'transição justa'. Este mecanismo visa promover a transição justa para países e comunidades afetadas pelas mudanças climáticas.", "titulo_pt": "Perguntas e respostas: o que é o mecanismo Belém-Antalya para uma 'transição justa'?", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 252023, "titulo": "Which countries and industries emit the most greenhouse gases?", "url": "https://www.aljazeera.com/news/2026/11/9/which-countries-and-industries-emit-the-most-greenhouse-gases?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-09T07:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos são os maiores emitentes de CO2 na história, enquanto a China é atualmente o maior emissor. Este artigo discute quais países e setores estão responsáveis pelas emissões globais de gases de efeito estufa.", "titulo_pt": "Quais países e setores são os maiores emissores de gases de efeito estufa?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 251693, "titulo": "“No quedó nada”: retiraron miles de vacas de una zona cercana a un gran humedal", "url": "https://www.lanacion.com.ar/economia/campo/no-quedo-nada-retiraron-miles-de-vacas-de-una-zona-cercana-a-un-gran-humedal-nid09112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-09T06:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Múltiplas fazendas na região de Villa Ocampo, Santa Fe, Argentina, transferiram suas vacas para pastos mais elevados antes que a água inundasse os alojamentos e cercas. Diante da escassez de propriedades disponíveis para aluguel, alguns produtores já começaram a vender parte de seus animais.", "titulo_pt": "Nada restou: milhares de vacas foram removidas de uma área próxima a um grande humedal", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 252031, "titulo": "Smog blankets New Delhi as Diwali firecrackers worsen air quality", "url": "https://www.aljazeera.com/news/2026/11/9/smog-blankets-new-delhi-as-diwali-firecrackers-worsen-air-quality?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-09T05:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A qualidade do ar em Nova Deli atingiu níveis severos devido às fogos de artifício de Diwali, colocando em risco a saúde de mais de 30 milhões de residentes da cidade.", "titulo_pt": "Nuvem de smog cobre nova deli com piora na qualidade do ar devido aos fogos de artifício de Diwali", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 252036, "titulo": "New Delhi blanketed in toxic smog after Diwali fireworks", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/9/new-delhi-blanketed-in-toxic-smog-after-diwali-fireworks?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-09T04:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cidade de Nova Deli foi coberta por uma camada de smog tóxico após as festividades de Diwali, que incluíram fogos de artifício durante a noite.", "titulo_pt": "Nova deli coberta por smog tóxico após fogos de artifício de Diwali", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 251288, "titulo": "Sede da COP31, Turquia quer zerar emissões de carbono em porto até 2031", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/sede-da-cop31-turquia-quer-zerar-emissoes-de-carbono-em-porto-ate-2031.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T03:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Turquia planeja zerar as emissões de carbono de um porto em Istambul até 2031 através da eletrificação de rebocadores. O objetivo é projetar o setor durante a COP31, a conferência das Nações Unidas sobre mudança climática que será realizada no país.", "titulo_pt": "Turquia quer zerar emissões de carbono em porto até 2031", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 251778, "titulo": "Banana producers in Latin America want better pay to cope with effects of climate crisis", "url": "https://www.theguardian.com/business/2026/nov/08/banana-producers-in-latin-america-want-better-pay-to-cope-with-effects-of-climate-crisis", "fonte_id": "guardian_world", "data_pub": "2026-11-08T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Farmers em países da América Latina estão enfrentando uma significativa redução na produção de bananas devido ao clima extremo durante o evento super El Niño. Eles estão pedindo melhores condições de pagamento para lidar com os efeitos da crise climática.", "titulo_pt": "Produtores de bananas na américa latina pedem melhores pagamentos para lidar com impactos da crise climática", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 251935, "titulo": "20 migrants die trying to reach Greece's Crete, authorities say", "url": "https://www.lemonde.fr/en/international/article/2026/11/09/20-migrants-die-trying-to-reach-greece-s-crete-authorities-say_6775672_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-09T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 28 sobreviventes e um corpo, todos nacionais do Sudão, foram resgatados por outro barco que passava por perto. A ilha de Creta é um destino principal para imigrantes que tentam chegar à Europa.", "titulo_pt": "20 Migrantes morrem tentando chegar a creta, Grécia, autoridades relatam", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 251787, "titulo": "French police officers face trial over beating of black man not wearing mask during Covid", "url": "https://www.theguardian.com/world/2026/nov/09/french-police-officers-face-trial-over-beating-of-black-man-not-wearing-mask-during-covid", "fonte_id": "guardian_world", "data_pub": "2026-11-09T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três policiais franceses irão se submeter a julgamento por terem batido em Michel Zecler, um produtor musical negro, em 2020, durante a pandemia de coronavírus. Este é um caso raro de violência policial que chegou ao tribunal, ocorrendo em um momento de tensões aumentadas.", "titulo_pt": "Policiais franceses enfrentarão julgamento por agressão a homem negro não usando máscara durante a pandemia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 251708, "titulo": "Al menos ocho migrantes muertos en un naufragio frente a las costas de Creta, Grecia", "url": "https://www.latercera.com/mundo/noticia/al-menos-ocho-migrantes-muertos-en-un-naufragio-frente-a-las-costas-de-creta-grecia/", "fonte_id": "la_tercera", "data_pub": "2026-11-09T08:21:00Z", "idioma": "es", "provavel_duplicata_de": 251650, "texto_pt": "Ao menos oito migrantes morreram em um naufrágio de uma embarcação que teria virado no dia anterior às costas de Creta, Grécia. Durante a noite de domingo para segunda-feira, os resgatistas localizaram a embarcação naufragada.", "titulo_pt": "Ao menos oito migrantes mortos em naufrágio frente às costas de Creta, Gréci function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">

    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

    document.getElementById('senha-erro').style.display = 'none';

}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {

    document.body.classList.add('modo-editorial');

  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
