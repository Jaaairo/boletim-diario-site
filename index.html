<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<script>
const D = {"gerado_em": "09/11/2026 19:18", "stats": {"noticias_novas": 624, "resumos_gerados": 241}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Lula indicou o juiz Fausto Mendanha Gonzaga para uma vaga no TRF-1, reafirmando sua influência na nomeação de juízes. O Ministério Público descobriu que o PCC está usando estratégias para enviar mensagens da cadeia para o exterior, o que levou a mandados de prisão e buscas. O dólar caiu para R$ 5,505 e o Ibovespa subiu 2,22%, refletindo a recuperação dos mercados internacionais e a avaliação dos sinais dados por Lula sobre as contas públicas. O presidente enfrenta críticas sobre a falta de ajuste fiscal, que o UBS afirma pode prejudicar as empresas brasileiras. Além disso, a reforma do Judiciário proposta pela OAB-SP ao Congresso e a proposta de voto distrital misto apresentada pelo deputado Domingos Neto são temas importantes na política brasileira. A reforma ministerial do quarto mandato de Lula deve reforçar a base no Senado, reduzindo a presença de senadores bolsonaristas e expor rachas no PT.", "mundo": "O presidente dos Estados Unidos, Donald Trump, declarou que, no momento, não há necessidade de ações militares no Irã, em um briefing surpresa na Casa Branca. As chances de um novo encontro entre Trump e o líder da Coreia do Norte, Kim Jong-un, aumentaram após as eleições legislativas nos Estados Unidos, conforme especialista. Além disso, o congressista republicano Thomas Massie apresentou artigos de impeachment contra o Secretário de Defesa Pete Hegseth, pressionando seu partido a decidir sobre o remanejamento de uma figura proeminente do governo Trump. Essa ação ocorre em meio a declarações de Trump questionando a integridade das eleições de meio de mandato. Em outro desenvolvimento, o judoca francês Teddy Riner anunciou sua candidatura à presidência da França em 2027, expressando preocupações com o crescimento do extremismo de direita no país. Na América Latina, o presidente do Paraguai, Santiago Peña, solicitou que ministros e outros funcionários em cargos de confiança renunciassem, nomeando três novos membros para o governo. A Deutsche Welle, emissora pública internacional da Alemanha, está com inscrições abertas para um programa de formação em jornalismo que começará em janeiro de 2028, com duração de 18 meses e 12 vagas disponíveis para candidatos do mundo inteiro.\n\nA geopolítica global enfrenta vários desafios e tensões. A Coreia do Norte exigiu reconhecimento como uma potência nuclear, o que pode atrapalhar o encontro entre Trump e Kim, conforme afirmou um ex-funcionário dos EUA. O Irã propôs enriquecimento de urânio, levando a uma queda significativa nos preços do petróleo. Durante a COP31 na Turquia, durante uma crise energética, os participantes buscam ações climáticas. O presidente dos EUA, Donald Trump, enfrenta pressão de líderes árabes e muçulmanos para evitar retomar hostilidades contra o Irã. A Ucrânia enfrenta ameaças diretas de ataques russos, com o presidente Zelenskyy alertando que os russos podem dividir o país. Além disso, a França acusa o Irã de ataques cibernéticos em supermercados, enquanto dados hackeados indicam que cerca de 400 mil russos morreram na Ucrânia. A Rússia limitou o fornecimento de combustível em resposta a novos ataques ucranianos a refinarias. A África do Sul detém estrangeiros suspeitos de se juntarem às forças russas na Ucrânia, e Gaza enfrenta condições climáticas severas durante o inverno.", "economia": "O Ibovespa fechou com uma alta de 2,2%, o maior ganho diário desde a reeleição de Lula, atingindo o patamar dos 172 mil pontos. O dólar permaneceu estável em R$ 5,506. A JBS registrou um lucro ajustado de US$ 164 milhões no terceiro trimestre, uma queda de 72% em comparação com o mesmo período do ano anterior, devido principalmente ao fim da cota chinesa, aumento do preço do gado e baixa produtividade do porco nos Estados Unidos. A Log registrou um lucro líquido de R$ 121,6 milhões no terceiro trimestre, com uma receita líquida de R$ 57,7 milhões e um Ebitda de R$ 179,1 milhões, após aumentar sua base de clientes de 7 mil para cerca de 90 mil. Além disso, a ANP suspendeu o processo de revisão das tarifas dos gasodutos brasileiros após ameaças de judicialização e corte de investimentos da Petrobras, o que expôs um conflito com a empresa petrolífera. O Banco Central do Brasil passou a divulgar uma lista de empresas autorizadas a operar com criptoativos, permitindo que o público verifique as instituições autorizadas. Por fim, as Filipinas suspenderam por 60 dias as importações de carne suína brasileira devido a uma investigação preliminar sobre o impacto das importações na produção local.", "tecnologia": "As ações da Nvidia caíram devido a acusações de espionagem envolvendo seu CEO, Jensen Huang, que admitiu um relacionamento com uma mulher suspeita de ser espiã do governo chinês. Este caso pode ter implicações significativas para a empresa e para a corrida global por tecnologia de inteligência artificial (AI), já que Huang não tem um claro sucessor para assumir o cargo de CEO. A Nvidia enfrenta críticas por não ter um plano claro de sucessão, o que expõe as vulnerabilidades de uma grande empresa depender de um único executivo. Além disso, a empresa está recebendo pedidos por sua tecnologia de energia geotermal no valor de US$ 12 bilhões, enquanto a concorrência entre Estados Unidos e China pela liderança em AI continua. Em outro desenvolvimento, a Msscorps está aproveitando a crescente demanda por AI, com as receitas da empresa aumentando rapidamente. A Saúde e o Instituto Einstein desenvolveram uma ferramenta de IA para identificar doenças de pele no SUS, enquanto a Fervo está com pedidos de US$ 12 bilhões para sua tecnologia de energia geotermal, reduzindo os custos de perfuração em sua fonte de 8,4 GW em Utah.", "ciencia": "A NASA está recrutando novos astronautas para a próxima promoção, um momento crucial em que o país retorna aos voos espaciais tripulados. As inscrições estão abertas e a missão visa preparar a próxima geração de astronautas para futuros voos espaciais e missões tripuladas. Paralelamente, pesquisas conduzidas pelo telescópio Chandra da NASA sobre surtos repetidos em uma estrela gigante e instável revelaram a existência de um objeto companheiro oculto. Este objeto suga material da estrela a cada 113 dias durante sua órbita, um descobrimento que tem implicações importantes para a compreensão do comportamento de estrelas gigantes e de surtos estelares. Além disso, estudos recentes sobre minerais de longa duração e suas implicações para a reconstrução de eventos de impacto em planetas, incluindo a Lua, destacam a importância desses minerais para a compreensão da evolução do sistema solar.", "cultura": "O Papa Leão XIV visitou o Cottolengo Don Orione, em Buenos Aires, onde se emocionou ao cumprimentar jovens e adultos. Ele percorreu os últimos 700 metros em papamóvel ao lado de fiéis. Durante sua missa, ele enfatizou o papel das religiões em reforçar a fé e a ação, fazendo menções a João Paulo II e Francisco. Em outro evento, o Getty contribuiu para a primeira conservação de uma igreja do século XVII danificada por terremoto nos Andes do Peru. A SP-Arte, a maior feira de arte da América do Sul, acordou com os galeristas para não aumentar os valores em 2027, após negociações com representantes das galerias mais influentes do país. A exposição 'Cortando Nuvens' no Museu Metropolitano de Arte explora os desafios técnicos de capturar nuvens na fotografia no início do século XIX, enquanto a marca de streetwear Supreme lança uma coleção inspirada no músico Elliott Smith. A partir de dezembro, a DC Studios terá uma nova liderança, com Jeremy Latcham assumindo a presidência e a direção criativa, após James Gunn e Peter Safran deixarem os cargos após quatro anos.", "sociedade": "O governo federal prorrogou o Auxílio Gás do Povo até 2031, beneficiando cerca de 15 milhões de famílias. Em contraste, um massacre em Cracóvia, na Polônia, deixou seis mortos após um homem de 24 anos abrir fogo em uma praça, abalando a sensação de segurança no país. Em outro incidente, um homem foi morto e uma mulher ficou ferida em um ataque com arma branca em um bar na região da Bela Vista, em São Paulo. O Ministério Público investigará um show realizado sem alvará em Paraisópolis, na zona Sul de São Paulo, que poderia ter atraído até 50 mil pessoas. Além disso, um psiquiatra foi morto em Seul, na Coreia do Sul, há oito anos, levando à aprovação de uma lei que aumentou as penas para agressões a profissionais de saúde. Um ataque recente em um hospital da capital fez os médicos questionarem a segurança inadequada ainda existente nos hospitais do país.", "meio_ambiente": "O evento mais importante é a COP31, a cúpula climática das Nações Unidas, que começou em Antalya, na Turquia, após um ano marcado por ondas de calor letais e inundações devastadoras. A Turquia planeja zerar as emissões de carbono de um porto em Istambul até 2031, através da eletrificação de rebocadores, projetando o setor durante a conferência. Outros países também demonstraram compromisso com a redução do desmatamento, como a Noruega, que investiu R$ 350 milhões no Fundo Amazônia. O clima extremo continua a afetar diversas regiões, com o Brasil registrando um aumento de 67,4% em perdas causadas por eventos climáticos extremos no primeiro semestre de 2026. O cientista Johan Rockström alerta para o acelerado aquecimento global e o risco de transformações irreversíveis na Amazônia brasileira. A Supersíndice El Niño está colidindo com um planeta já superaquecido, levando a preocupações sobre o futuro do clima global. Os líderes da COP31 pedem para que o mundo acelere as ações contra o aquecimento global, diante do aumento das temperaturas e dos desastres climáticos que ameaçam vidas e a economia mundial.", "direitos_humanos": "Os direitos humanos foram abordados em vários contextos nos artigos analisados. Primeiramente, a deportação de Jean Leonard Teganya, de 55 anos, de volta ao Ruanda após ser condenado por falsificar sua participação no genocídio de 1994, ilustra os desafios de lidar com casos de imigração e refugiados. Em seguida, o fechamento do jornal independente russo 'Novaya Gazeta' após pressão do Kremlin evidencia a censura e a limitação da liberdade de imprensa em alguns países. Em Senegal, uma organização de direitos humanos pediu ação do governo após um naufrágio fatal que resultou em milhares de mortes. Um naufrágio envolvendo a capotagem de uma embarcação transportando migrantes perto de Senegal levou ao naufrágio de 39 pessoas. A morte de Michel Zecler, um produtor musical negro, durante uma prisão policial em Paris, levou a um julgamento de três policiais, destacando a persistência da violência policial contra minorias étnicas. Por fim, a utilização de propriedades municipais por imigrantes para universidades nos Estados Unidos para fins de custos elevados de OPT (Prática Profissional Opcional) foi discutida, destacando as complexidades legais e econômicas envolvidas em questões de imigração."}, "resumo_do_dia": {"politica_nacional": [{"id": 253411, "titulo": "James Gunn e Safran deixam DC Studios; ex-Marvel assume", "url": "https://www.poder360.com.br/poder-midia/james-gunn-e-safran-deixam-dc-studios-ex-marvel-assume/", "fonte_id": "poder360", "data_pub": "2026-11-09T21:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "James Gunn e Safran deixaram a DC Studios. Jeremy Latcham assumirá o cargo em dezembro.", "titulo_pt": "Gunn e Safran deixam DC Studios; ex-marvel assume", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 253421, "titulo": "A estratégia do PCC para enviar recados para fora da cadeia, segundo investigação do MP", "url": "https://veja.abril.com.br/brasil/a-estrategia-do-pcc-para-enviar-recados-para-fora-da-cadeia-segundo-investigacao-do-mp/", "fonte_id": "veja", "data_pub": "2026-11-09T21:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investigações do Ministério Público descobriram uma estratégia do PCC para enviar mensagens da cadeia para o exterior. Mandados de prisão e busca e apreensão foram realizados em várias localidades, incluindo o Distrito Federal, Goiás, Maranhão e Rio de Janeiro.", "titulo_pt": "A estratégia do PCC para enviar recados para fora da cadeia, segundo investigação do MP", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 253554, "titulo": "Falta de ajuste fiscal “suga todo o oxigênio da sala”, diz o UBS", "url": "https://braziljournal.com/falta-de-ajuste-fiscal-suga-todo-o-oxigenio-da-sala-diz-o-ubs", "fonte_id": "brazil_journal", "data_pub": "2026-11-09T21:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O UBS afirma que a falta de um ajuste fiscal crível pode prejudicar os fundamentos das empresas brasileiras, já que a dívida alta, o déficit elevado e os juros elevados estão consumindo recursos essenciais. Alejo Czerwonko, o CIO para mercados emergentes nas Américas do UBS Global Wealth Management, fez essa declaração.", "titulo_pt": "Falta de ajuste fiscal 'suga todo o oxigênio da sala', diz o UBS", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 253384, "titulo": "Lula ignora nome apoiado por Kassio e indica juiz de Goiás ao TRF-1", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/lula-ignora-nome-apoiado-por-kassio-e-indica-juiz-de-goias-ao-trf-1.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-09T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula indicou o juiz Fausto Mendanha Gonzaga para uma vaga no TRF-1. Ele tomará posse na terça-feira.", "titulo_pt": "Lula indica juiz para TRF-1", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 253422, "titulo": "Com decisão sobre juíza da Lava-Jato, STF contrata nova crise entre ministros", "url": "https://veja.abril.com.br/politica/com-decisao-sobre-juiza-da-lava-jato-stf-contrata-nova-crise-entre-ministros/", "fonte_id": "veja", "data_pub": "2026-11-09T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) decidiu sobre um caso envolvendo uma juíza da Lava-Jato, o que gerou nova crise entre os ministros. No STF, alguns magistrados consideram que o caso deveria ser atribuído ao juiz Flávio Dino, que já atuou em processos semelhantes.", "titulo_pt": "Com decisão sobre juíza da Lava-Jato, STF enfrenta nova crise entre ministros", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 253413, "titulo": "Bets reanimam Exército do Lula, que perde alcance depois da eleição", "url": "https://www.poder360.com.br/poder-eleicoes-2026/bets-reanimam-exercito-do-lula-que-perde-alcance-depois-da-eleicao/", "fonte_id": "poder360", "data_pub": "2026-11-09T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mensagens contra apostas são compartilhadas 68% mais do que outras postagens. O canal de Janones registra uma queda de 90% nos repasses diários.", "titulo_pt": "Mensagens contra apostas reanimam Exército do Lula, que perde alcance após eleição", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 253423, "titulo": "Adiamento da maioridade penal gera atrito entre PT, Lula e oposição no Congresso", "url": "https://veja.abril.com.br/politica/adiamento-da-maioridade-penal-gera-atrito-entre-pt-lula-e-oposicao-no-congresso/", "fonte_id": "veja", "data_pub": "2026-11-09T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O adiamento da maioridade penal enfrenta atritos entre o PT, Lula e a oposição no Congresso. Um acordo entre Alcolumbre e Motta adiou a votação para o ano seguinte, enquanto o PT reafirma seu veto histórico e contrasta com as declarações de Lula.", "titulo_pt": "Adiamento da maioridade penal causa atritos entre PT, Lula e oposição no Congresso", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 253414, "titulo": "Dólar cai a R$ 5,505; Ibovespa sobe 2,22%", "url": "https://www.poder360.com.br/poder-economia/dolar-cai-a-r-5505-ibovespa-sobe-222/", "fonte_id": "poder360", "data_pub": "2026-11-09T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar caiu para R$ 5,505 e o Ibovespa subiu 2,22%, refletindo a recuperação dos mercados internacionais e a avaliação dos sinais dados por Lula sobre as contas públicas.", "titulo_pt": "Dólar cai a R$ 5,505; Ibovespa sobe 2,22%", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 253529, "titulo": "OAB-SP: Entregamos proposta de reforma do Judiciário ao Congresso", "url": "https://www.cnnbrasil.com.br/politica/oab-sp-entregamos-proposta-de-reforma-do-judiciario-ao-congresso/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-09T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OAB-SP entregou uma proposta de reforma do Judiciário ao Congresso após 15 meses de elaboração. O documento prevê a criação de um código de conduta, regras de impedimento e maior transparência no sistema judicial.", "titulo_pt": "OAB-SP: proposta de reforma do Judiciário entregue ao Congresso", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 253386, "titulo": "Gestão Nunes rescinde contrato milionário com ONG de produtora de 'Dark Horse'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/gestao-nunes-rescinde-contrato-milionario-com-ong-de-produtora-de-dark-horse.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-09T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Prefeitura de São Paulo rescindiu um contrato milionário com o Instituto Conhecer Brasil, de Karina Ferreira da Gama, após uma decisão do STF que paralisou os repasses à entidade.", "titulo_pt": "Gestão Nunes rescinde contrato milionário com ONG de produtora de 'Dark Horse'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 253391, "titulo": "Pix bate recorde e supera 319 milhões de transações em um dia", "url": "https://www.cartacapital.com.br/economia/pix-bate-recorde-e-supera-319-milhoes-de-transacoes-em-um-dia/", "fonte_id": "cartacapital", "data_pub": "2026-11-09T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Pix registrou 319 milhões de transações em um único dia, com um volume de R$ 180,5 bilhões movimentado. Este foi o segundo maior volume financeiro da história do sistema.", "titulo_pt": "Pix bate recorde e supera 319 milhões de transações em um dia", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 253387, "titulo": "Centro Knight oferece curso gratuito de jornalismo econômico", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/novo-em-folha/2026/11/centro-knight-oferece-curso-gratuito-de-jornalismo-economico.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-09T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Centro Knight de Jornalismo para as Américas, da Universidade do Texas, oferece gratuitamente um curso online sobre jornalismo econômico de 16 de novembro a 13 de dezembro. O curso, com apoio do Banco Mundial, ensinará a interpretar indicadores econômicos e a usar dados na produção de reportagens sobre a economia brasileira.", "titulo_pt": "Centro Knight oferece curso gratuito de jornalismo econômico", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 253436, "titulo": "Nova regra do CNJ pode travar operações com precatórios no mercado de capitais", "url": "https://veja.abril.com.br/economia/nova-regra-do-cnj-pode-travar-operacoes-com-precatorios-no-mercado-de-capitais/", "fonte_id": "veja", "data_pub": "2026-11-09T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma proposta que será votada nesta terça-feira amplia as exigências sobre créditos judiciais, o que pode preocupar investidores, fundos e securitizadoras. A nova regra do Conselho Nacional de Justiça (CNJ) pode impactar as operações com precatórios no mercado de capitais.", "titulo_pt": "Nova regra do CNJ pode travar operações com precatórios no mercado de capitais", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 253383, "titulo": "CLDF vota proposta que libera reeleição de membros da Mesa Diretora", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/cldf-vota-proposta-que-libera-reeleicao-de-membros-da-mesa-diretora", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-09T20:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara Legislativa do Distrito Federal (CLDF) vai votar, nesta terça-feira (10), uma proposta que permite a reeleição de membros da Mesa Diretora para o comando da Casa nos dois primeiros anos da próxima legislatura (2027-2029). Aprovada em primeiro turno em outubro, a Pelo nº 22/2026 deve ser votada em segundo turno na sessão de hoje.", "titulo_pt": "CLDF vota proposta que libera reeleição de membros da Mesa Diretora", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 253437, "titulo": "Diferenças e semelhanças entre Lula 1 e Lula 4 no caso do ajuste fiscal", "url": "https://veja.abril.com.br/politica/diferencas-e-semelhancas-entre-lula-1-e-lula-4-no-caso-do-ajuste-fiscal/", "fonte_id": "veja", "data_pub": "2026-11-09T20:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente fez promessas ao mercado para obter o poder em 2003, mas não para conquistar seu quarto mandato.", "titulo_pt": "Diferenças e semelhanças entre Lula 1 e Lula 4 no caso do ajuste fiscal", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 253362, "titulo": "Ex-vice presidente da Vale irá para a CSN", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/ex-vice-presidente-da-vale-ira-para-a-csn.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-09T20:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alexandre D'Ambrosio, ex-vice-presidente de assuntos corporativos e institucionais da Vale, assume agora a posição de vice-presidente na CSN (Companhia Siderúrgica Nacional). O convite partiu do novo presidente da CSN, Fabio Schvartsman.", "titulo_pt": "Ex-vice-presidente da Vale vai para a CSN", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 253834, "titulo": "Trump, al momento non sono necessarie azioni militari in Iran", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/09/trump-al-momento-non-sono-necessarie-azioni-militari-in-iran_631afe01-a772-431f-a995-7c8cd3c8ebd0.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-09T21:55:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, declarou em um briefing surpresa na Casa Branca que, no momento, não são necessárias ações militares no Irã.", "titulo_pt": "Trump: no momento não são necessárias ações militares no Irã", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 253854, "titulo": "(EDITORIAL from Korea
