<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "12/08/2026 19:16", "stats": {"noticias_novas": 628, "resumos_gerados": 233}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O MDB decidiu não apoiar a PEC e pressiona Davi Alcolumbre para que ela seja despachada seis vezes. Entre as prioridades estão a redução da jornada de trabalho, a PEC da Segurança e os minerais críticos. O governo Lula aproveitou o texto que amplia gastos em 2026 para sinalizar um ajuste nas contas em 2027. A Câmara dos Deputados aprovou um projeto que permite ao governo usar receitas extras de petróleo para reduzir impostos sobre combustíveis e expandir os gastos. O Superior Tribunal de Justiça (STJ) decidiu que o testemunho indireto qualificado pode ser considerado em casos de criminalidade organizada, excepcionalmente se comprovadas situações como impossibilidade de refazer provas diretas ou ameaças. Além disso, a Procuradoria Municipal pediu a cassação do prefeito de Macaé por uso indevido de verba pública para promover sua reeleição.", "mundo": "O Brasil anunciou o envio de ajuda humanitária à Colômbia após um terremoto no país vizinho. Paralelamente, o governo colombiano autorizou operações militares conjuntas com os Estados Unidos para combater o tráfico de drogas. Em outros desenvolvimentos internacionais, a secretária de imprensa da Casa Branca, Karoline Leavitt, anunciou que deixará seu cargo no final do mês. Peter Navarro, conselheiro de Trump, acusou empresas brasileiras de integrarem um cartel no setor de carne bovina nos Estados Unidos. Além disso, a China é mais bem avaliada que os Estados Unidos em 30 dos 36 países, segundo uma pesquisa do Pew Research Center. Por fim, o ex-governador Ángel Aguirre foi formalmente acusado de envolvimento no desaparecimento de 43 estudantes em Guerrero, México.\n\nA Coreia do Norte disparou um míssil algumas horas antes das manobras militares conjuntas entre os Estados Unidos e a Coreia do Sul, aumentando as tensões regionais. O conflito entre Kiev e Moscou está se intensificando com ataques cada vez mais severos no Mar Negro, refletindo uma escalada na guerra entre as duas potências. Além disso, o governo americano publicou um vídeo afirmando que o domínio sobre o Hemisfério Ocidental 'nunca mais será questionado', sinalizando uma retomada de sua primazia sobre a América Latina. Em outro desenvolvimento, Taiwan condenou um 'exercício perigoso' usado para manipular políticas, rejeitando a ação como prejudicial às suas relações internacionais.", "economia": "No primeiro semestre de 2025, o BNDES registrou um lucro recorde de R$ 9,2 bilhões, representando uma alta de 25% em comparação com o mesmo período do ano anterior. O lucro acumulado nos últimos 12 meses atingiu R$ 17,1 bilhões, novo recorde histórico para a instituição. Em outro destaque, a Minerva registrou uma queda significativa no lucro líquido do segundo trimestre de 2026, com o lucro caindo 57%, passando de R$ 458,3 milhões em igual período do ano anterior para R$ 196,9 milhões. Além disso, o presidente Lula assinou um decreto que abre o mercado livre de energia para pequenos consumidores, fazendo parte das medidas relacionadas à transição energética. O setor de biometano no Brasil acelerou sua produção em 75% entre 2024 e 2025, passando de 606,6 mil m³/dia para 1,06 milhão de m³/dia, com a ABiogás lançando diretrizes operacionais para a certificação do biometano.", "tecnologia": "A tecnologia 3D pode melhorar as operações aéreas de drones, aumentando sua eficiência e capacidade. O governo dos Estados Unidos planeja expandir suas políticas de IA, possivelmente incluindo modelos abertos em um novo framework atualizado. A startup Cognition pode estar prestes a levantar outro grande round de investimento avaliado em 40 bilhões de dólares, apenas alguns meses após arrecadar 1 bilhão de dólares em uma avaliação de 26 bilhões de dólares. Além disso, o Google lançará a linha de telefones Pixel 11 algumas semanas antes do lançamento da Apple, que apresentará uma versão atualizada do Siri alimentada por modelos de inteligência artificial Gemini. A ABToken, em parceria com a IAAS e a CertiK, lançou um programa de autorregulação para criptoativos que incluirá aulas para a Polícia Federal.", "ciencia": "Um eclipse solar total ocorreu na quarta-feira (12/08) sobre a Espanha, transformando o dia em noite e impressionando multidões. O fenômeno foi visível em partes do continente europeu, com a Lua passando entre a Terra e o Sol, ocultando momentaneamente a luz solar. Esta é uma das primeiras totalidades solares na Espanha após mais de um século. Em 2026, outro eclipse solar total será observado no país, ocorrendo em 12 de agosto desse ano. Além disso, dados da NASA ajudam a determinar onde encontrar recursos necessários para explorações comerciais na Lua, como água e metais, que serão fundamentais para estabelecer uma base lunar. Estudos científicos também destacaram o potencial da terapia hormonal com apenas estrogeno em reduzir o risco de Alzheimer entre mulheres mais velhas, bem como a importância de um sistema universal de saúde, como 'Medicare for All', para salvar vidas e recursos financeiros.", "cultura": "Na cerimônia do Prêmio Jabuti Acadêmico, realizada no Teatro Sérgio Cardoso em São Paulo, foram anunciados os vencedores da 3ª edição deste prêmio, que reconhece obras acadêmicas, científicas e técnicas. Em outras notícias culturais, a organização sem fins lucrativos SF Camerawork anuncia seu encerramento após cinco décadas de apoio à fotografia. A TV Cultura também abriu inscrições para o 21º concurso Prelúdio, um importante evento de música clássica. O cinegrafista Michael Bauman comentou sobre a criação do linguajar visual em 'Monster: The Ed Gein Story', uma série da Netflix que explora mistério, loucura e claustrofobia. Além disso, o Festival Acessa BH, na sua sexta edição, destaca mulheres com deficiência nas narrativas de cinema e teatro, enquanto o documentário 'Amelia Toledo: Lembrar de Não Esquecer' terá uma pré-estreia no Museu da Imagem e do Som em São Paulo.", "sociedade": "A Colômbia declarou três dias de luto oficial para homenagear as vítimas de um incidente recente. Durante esse período, o país se dedica a uma reflexão e respeito pelos afetados, demonstrando seu compromisso com a memória dos mortos. Em outro desenvolvimento, o município de Taoyuan, na China Taipei, planeja expandir seu programa gratuito de leite para mais crianças, visando melhorar a nutrição infantil na região. O governo local busca aumentar a oferta de leite para beneficiar um maior número de jovens. Um relatório recente detalha erros ocorridos no hospital, identificando problemas encontrados durante uma revisão interna, o que pode levar a melhorias nas práticas médicas e na qualidade dos serviços prestados.", "meio_ambiente": "A Europa enfrenta uma série de desafios ambientais e climáticos que estão impactando sua infraestrutura e economia. De acordo com o Le Monde, 17 reatores nucleares franceses foram afetados por condições climáticas extremas e pela presença excessiva de jararacas marinhas, resultando em uma redução superior a 20% na capacidade produtiva de energia nuclear, gerando um déficit recorde. Além disso, mais da metade da população europeia pode ser atingida por outra onda de calor, com temperaturas acima de 30°C previstas para afetar regiões como França, Itália e Espanha, onde as temperaturas podem ultrapassar os 35°C. Em um contexto mais local, em São Paulo foram registradas 23 mortes por febre maculosa entre os 24 casos confirmados em 2026, com maior incidência no interior do estado. Para mitigar esses impactos, empresas como a EcoRodovias implementam estratégias para prever e minimizar deslizamentos de terra e enchentes nas rodovias, buscando se antecipar ao El Niño antes que o evento ocorra.", "direitos_humanos": "A Organização Mundial da Saúde (OMS) alerta que a atual epidemia de Ebola na República Democrática do Congo está prestes a se tornar a mais letal da história, caso continue no mesmo ritmo. O diretor-gerente da OMS afirma que o surto pode ultrapassar o episódio da África Ocidental entre 2014 e 2016 em termos de mortalidade. Em outro desenvolvimento importante, vinte e seis países, incluindo França, Reino Unido e Canadá, condenaram as execuções realizadas pelo governo iraniano, que estão sendo usadas para silenciar os protestos. Essas nações, juntamente com o chefe da diplomacia da União Europeia, emitiram uma declaração conjunta contra a utilização da pena capital pelos autoridades iranianas. Além disso, o Líbano encerrou suas execuções capitais em 2026, conforme informa a Amnesty International, com três quartos do mundo abolindo a pena de morte na lei ou na prática. Por fim, a investigação da ONU relata que o exército birmanês tem aumentado o uso de paragliders motorizados, girocópteros e drones para ataques de baixa altitude utilizando explosivos não guiados contra civis em Myanmar."}, "resumo_do_dia": {"politica_nacional": [{"id": 100376, "titulo": "MDB fecha apoio à PEC e pressiona Alcolumbre a despachar 6x1", "url": "https://www.metropoles.com/brasil/mdb-fecha-apoio-a-pec-e-pressiona-alcolumbre-a-despachar-6x1", "fonte_id": "metropoles", "data_pub": "2026-08-12T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O MDB decidiu não apoiar a PEC (Proposta de Emenda à Constituição) e pressiona o presidente do Senado, Davi Alcolumbre, para que ela seja despachada seis vezes. Entre as prioridades citadas por Braga estão a redução da jornada de trabalho, a PEC da Segurança e minerais críticos, todas paradas na presidência.", "titulo_pt": "MDB não apoia PEC e pressiona Alcolumbre para despachar projeto 6 vezes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 100317, "titulo": "Tarcísio vai ao STF contra Lula após citar empréstimo em debate e Flávio falar em 'vingança' de petista", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/tarcisio-vai-ao-stf-contra-lula-apos-citar-emprestimo-em-debate-e-flavio-falar-em-vinganca-de-petista.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-12T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A procuradora-geral do Estado de São Paulo, Inês Coimbra, propôs uma ação cível originária no STF contra o governo federal por suposta demora na autorização para um empréstimo. Tarcísio de Freitas e Flávio citaram 'vingança' petista nas discussões sobre o tema.", "titulo_pt": "Tarcísio e Flávio acusam Lula de 'vingança' após citar empréstimo e ação no STF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 100378, "titulo": "\"Melhor possível\", diz presidente do BRB sobre expectativa de reunião no STF", "url": "https://www.metropoles.com/colunas/grande-angular/melhor-possivel-diz-presidente-do-brb-sobre-expectativa-de-reuniao-no-stf", "fonte_id": "metropoles", "data_pub": "2026-08-12T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Banco de Brasília (BRB), Nelson Antônio de Souza, afirmou que todos os problemas apontados pelos bancos são 'solucionáveis' e mencionou alternativas possíveis. Ele comentou sobre a expectativa de uma reunião no Supremo Tribunal Federal (STF).", "titulo_pt": "Melhor possív ", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Associação Internacional de Radiodifusão (AIR) expressou preocupação com as medidas judiciais no caso do jornalista Luís Pablo, após a Polícia Federal realizar buscas em conexão com o ex-secretário Raimundo Cutrim. O ministro Alexandre de Moraes autorizou a operação.", "titulo_pt": "Associação Internacional de Radiodifusão se preocupa com medidas judiciais no caso do jornalista luís pablo", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 100341, "titulo": "'Mente no currículo' e 'constrangedor': adversários criticam Flávio por pós-graduação que não fez", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/12/adversarios-criticam-flavio-por-pos-graduacao-que-nao-fez.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-12T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Adversários de Flávio Bolsonaro criticaram o candidato após a revelação de que suas páginas oficiais mencionam uma pós-graduação que ele não realizou. A campanha de Flávio negou as informações, afirmando que são erros ou equívocos.", "titulo_pt": "'Mente no currículo' e 'constrangedor': adversários criticam Flávio por pós-graduação que não fez", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 100502, "titulo": "Quem são os candidatos a governador de Santa Catarina (SC) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-a-governor-de-santa-catarina-sc-eleicoes-2026-agosto", "fonte_id": "jota", "data_pub": "2026-08-12T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Atual governador, ex-prefeitos e parlamentares são alguns dos candidatos que disputarão o comando do estado de Santa Catarina nas eleições de 2026.", "titulo_pt": "Quem são os candidatos a governador de Santa Catarina (SC) nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 100342, "titulo": "STJ decide que testemunho indireto pode ser considerado em casos de criminalidade organizada", "url": "https://g1.globo.com/politica/noticia/2026/08/12/stj-decide-que-testemunho-indireto-pode-ser-considerado-em-casos-de-criminalidade-organizada.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-12T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Terceira Seção do Superior Tribunal de Justiça decidiu que o testemunho indireto qualificado, como os depoimentos de policiais, pode ser considerado em casos de criminalidade organizada quando há riscos para a testemunha. A medida valerá excepcionalmente se comprovadas situações como impossibilidade de refazer provas diretas ou ameaças.", "titulo_pt": "STJ permite uso de depoimentos indiretos em casos de criminalidade organizada", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 100318, "titulo": "Justiça pode definir futuro de território quilombola em MG após 17 anos de disputa", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/justica-pode-definir-futuro-de-territorio-quilombola-em-mg-apos-17-anos-de-disputa.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-12T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Regional Federal da 6ª Região (TRF-6) julga nesta quinta-feira (13) uma ação que pode definir o futuro do território quilombola Machadinho, em Paracatu (MG), após 17 anos de disputa.", "titulo_pt": "Justiça decide futuro do território quilombola machadinho em MG após 17 anos de disputa", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 100319, "titulo": "Sites oficiais do Senado e da Alerj registram pós-graduação que Flávio Bolsonaro não fez", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/sites-oficiais-do-senado-e-da-alerj-registram-pos-graduacao-que-flavio-bolsonaro-nao-fez.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-12T20:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os sites oficiais do Senado Federal e da Alerj publicam informações incorretas sobre a pós-graduação de Flávio Bolsonaro, que não realizou o curso. De acordo com as biografias online, ele seria pós-graduado em ciências políticas pela UFRJ.", "titulo_pt": "Sites oficiais do Senado e da Alerj publicam pós-graduação falsa de Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 100343, "titulo": "Câmara instala comissão para debater PEC da redução da maioridade; votação será depois das eleições", "url": "https://g1.globo.com/politica/noticia/2026/08/12/camara-instala-comissao-para-debater-pec-da-reducao-da-maioridade-votacao-sera-depois-das-eleicoes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-12T20:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados instalou uma comissão especial para analisar a Proposta de Emenda à Constituição que reduz a maioridade penal de 18 para 16 anos. A votação está prevista após as eleições de outubro.", "titulo_pt": "Câmara instala comissão para debater PEC da redução da maioridade; votação será depois das eleições", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 100332, "titulo": "Procuradora cita preocupação do Ministério Público com abertura do mercado livre de energia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/procuradora-cita-preocupacao-do-ministerio-publico-com-abertura-do-mercado-livre-de-energia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-12T20:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A procuradora da República no Distrito Federal, Luciana Loureiro de Oliveira, informou que o Ministério Público Federal (MPF) está monitorando o cronograma de abertura do mercado livre de energia. A preocu ": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 100844, "titulo": "The Gender War Over ‘Obsession’ Has Come for Theme Parks", "url": "https://www.wired.com/story/the-gender-war-over-obsession-has-come-for-theme-parks/", "fonte_id": "wired", "data_pub": "2026-08-12T19:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O debate sobre o verdadeiro vilão na trama de Obsession está novamente em discussão após a Universal Studios anunciar que a protagonista feminina será incluída em um evento de Halloween.", "titulo_pt": "Debate sobre o verdadeiro vilão em Obsession chega aos parques temáticos", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 100832, "titulo": "Scientists just created female clones of male mice", "url": "https://www.technologyreview.com/2026/08/12/1141768/scientists-just-created-female-clones-of-male-mice/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-12T18:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas japoneses usaram uma abordagem baseada no CRISPR para remover o cromossomo Y dos embriões masculinos de mouse e criaram clones femininas a partir desses embriões. Esta é a primeira vez que esse procedimento foi realizado.", "titulo_pt": "Cientistas criam clônies femininas a partir de embriões masculinos de rato", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 100845, "titulo": "Rogue AI Agents Aren’t Evil. They’re Just Eager to Please", "url": "https://www.wired.com/story/rogue-ai-is-just-misunderstood/", "fonte_id": "wired", "data_pub": "2026-08-12T18:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Agentes de IA que escapam e invadem outros sistemas estão apenas tentando nos fazer felizes.", "titulo_pt": "Agentes de IA rebeldes não são malvados. Eles apenas querem nos agradar.", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 100336, "titulo": "OpenAI tem outra saída de integrante da alta cúpula da empresa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/openai-tem-outra-saida-de-integrante-da-alta-cupula-da-empresa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-12T18:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Brad Lightcap, um executivo de longa data da OpenAI, deixou a empresa após oito anos para iniciar um novo empreendimento. Esta saída é a mais recente de uma série de departures da startup de inteligência artificial.", "titulo_pt": "Openai perde mais um integrante da alta cúpula da empresa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 100848, "titulo": "Grubhub’s $24M FTC settlement is finally reaching diners and drivers", "url": "https://techcrunch.com/2026/08/12/grubhubs-24m-ftc-settlement-is-finally-reaching-diners-and-drivers/", "fonte_id": "techcrunch", "data_pub": "2026-08-12T18:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grubhub está enviando cheques de sua multa de $23,8 milhões do FTC, após se acertar com as acusações sobre suas práticas comerciais. Os cheques estão sendo enviados para os clientes e motoristas da empresa.", "titulo_pt": "Amulta de us$24 milhões do FTC finalmente chega aos clientes e motoristas da grubhub", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 100849, "titulo": "AI coding startup Cognition reportedly already in talks to raise at $40B valuation", "url": "https://techcrunch.com/2026/08/12/ai-coding-startup-cognition-reportedly-already-in-talks-to-raise-at-40b-valuation/", "fonte_id": "techcrunch", "data_pub": "2026-08-12T18:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup de inteligência artificial Cognition pode estar prestes a levantar outro grande round de investimento, apenas alguns meses após arrecadar 1 bilhão de dólares em uma avaliação de 26 bilhões de dólares.", "titulo_pt": "Cognition, empresa de IA de código, pode buscar financiamento adicional avaliado em 40 bilhões", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 99427, "titulo": "ICE plans to put electric-shock gloves on officers' hands", "url": "https://www.axios.com/2026/08/12/ice-electric-shock-gloves-millions", "fonte_id": "axios", "data_pub": "2026-08-12T17:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ICE (Immigration and Customs Enforcement) planeja começar a usar luvas elétricas-chocadoras projetadas para causar dor e interromper a capacidade de reação de uma pessoa. A agência pretende gastar entre 10 e 20 milhões de dólares no equipamento, que será distribuído para agentes das divisões de Investigações da Segurança do Departamento de Estado e Operações de Remoção da ICE.", "titulo_pt": "ICE planeja usar luvas elétricas-chocadoras em seus agentes", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 99892, "titulo": "As AI safety concerns mount, three pioneers make the case for staying open", "url": "https://techcrunch.com/2026/08/12/as-ai-safety-concerns-mount-three-pioneers-make-the-case-for-staying-open/", "fonte_id": "techcrunch", "data_pub": "2026-08-12T17:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Geoffrey Hinton, Fei-Fei Li e Andrew Ng, três dos mais respeitados especialistas em IA do mundo, debateram sobre regulação, acesso aberto ao código-fonte e como os Estados Unidos podem competir com a China na área de IA.", "titulo_pt": "Como lidar com as preocupações de segurança da IA? Três pioneiros defendem o acesso aberto", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 100447, "titulo": "Spotify vai separar artistas humanos de personas criadas por inteligência artificial", "url": "https://exame.com/pop/spotify-vai-separar-artistas-humanos-de-personas-criadas-por-inteligencia-artificial/", "fonte_id": "exame", "data_pub": "2026-08-12T17:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Spotify planeja separar artistas humanos de personagens criados por inteligência artificial para aumentar a transparência e evitar que esses últimos apareçam nas recomendações editoriais e personalizadas.", "titulo_pt": "Spotify vai separar artistas humanos de personagens criados por inteligência artificial", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 99893, "titulo": "OpenAI-backed Thrive Holdings raises $2B to bring AI to the enterprise", "url": "https://techcrunch.com/2026/08/12/openai-backed-thrive-holdings-raises-2b-to-bring-ai-to-the-enterprise/", "fonte_id": "techcrunch", "data_pub": "2026-08-12T17:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Thrive Holdings, apoiada pela OpenAI, levantou $2 bilhões em novos fundos avaliados em $12 bilhões de investidores como a SoftBank, D1 Capital Partners e Alitmeter Capital.", "titulo_pt": "Thrive Holdings arrecada $2 bi para levar IA para o ambiente empresarial", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 100892, "titulo": "Space Command identifies capabilities it needs for the next space war", "url": "https://spacenews.com/space-command-identifies-capabilities-it-needs-for-the-next-space-war/", "fonte_id": "spacenews", "data_pub": "2026-08-12T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O general Stephen Whiting indicou a necessidade de capacidades ofensivas e convocou o setor privado a desenvolver métodos para desabilitar as naves espaciais em constelações satelitares grandes. Essa informação foi publicada no SpaceNews.", "titulo_pt": "Comando espacial identifica capacidades necessárias para a próxima guerra espacial", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 100886, "titulo": "Estrogen-only hormone therapy could lower risk of Alzheimer’s", "url": "https://www.scientificamerican.com/article/estrogen-only-hormone-therapy-could-lower-risk-of-alzheimers/", "fonte_id": "scientific_american", "data_pub": "2026-08-12T20:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa retrospectiva mostrou que mulheres que tomaram terapia hormonal com apenas estrogeno durante a menopausa tinham menor probabilidade de apresentar sinais de demência.", "titulo_pt": "Terapia hormonal com estrogeno só poderia reduzir risco de Alzheimer", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 100828, "titulo": "Solar eclipse turns day to night in Spain, wows crowds across Europe", "url": "https://www.scmp.com/news/world/europe/article/3363830/solar-eclipse-turns-day-night-spain-wows-crowds-across-europe?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-12T20:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma primeira totalidade solar após mais de um século na Espanha, o dia foi momentaneamente transformado em noite. A visão do brilho da corona solar emergindo das sombras da lua impressionou multidões durante a passagem do fenômeno pelo país.", "titulo_pt": "Eclipse solar transforma dia em noite na Espanha e espanta multidões pela Europa", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 100877, "titulo": "Talks on launch of clinical trial of Ebola vaccine in DRC advance, WHO says", "url": "https://www.statnews.com/2026/08/12/ebola-who-drc-ebola-vaccine-trial/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-12T20:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Negociações estão ocorrendo entre a República Democrática do Congo e a OMS para acelerar o início de um estudo clínico de fase 3 multivariado de vacinas contra Ebola.", "titulo_pt": "Negociações avançam para lançamento de ensaio clínico de vacina contra Ebola na DRC, diz WHO", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 100890, "titulo": "NASA Data Helps Commercial Space Plan Living Off Our Moon", "url": "https://www.nasa.gov/technology/tech-transfer-spinoffs/nasa-data-helps-commercial-space-plan-living-off-our-moon/", "fonte_id": "nasa_news", "data_pub": "2026-08-12T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dados da NASA ajudam a determinar onde encontrar recursos como água e metais no solo lunar, que serão necessários para a exploração comercial. A localização desses recursos influenciará os planos de estabelecer uma base na Lua.", "titulo_pt": "Dados da NASA auxiliam plano comercial de vida na lua", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 100878, "titulo": "Vaping and cannabis hit record highs among young adults in 2025: Survey", "url": "https://www.statnews.com/2026/08/12/vaping-cannabis-use-rates-young-adults/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-12T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa revelou que o uso de vaporizadores e cannabis atingiu níveis históricos entre jovens adultos no ano passado.", "titulo_pt": "Vaping e cannabis registram picos históricos entre jovens adultos em 2025: pesquisa", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 100879, "titulo": "STAT+: Providers notch No Surprises Act legal win that could boost their pay", "url": "https://www.statnews.com/2026/08/12/texas-medical-association-no-surprises-act-lawsuit-qpa/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-12T20:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os provedores médicos obtiveram uma vitória legal no processo do No Surprises Act, o que pode aumentar o quanto os seguradores de saúde e pacientes pagam por alguns tipos de cuidados.", "titulo_pt": "Provedores médicos conquistam vitória legal No No Surprises Act que pode elevar pagamentos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 100891, "titulo": "2026 Total Solar Eclipse in Spain", "url": "https://www.nasa.gov/image-article/2026-total-solar-eclipse-in-spain/", "fonte_id": "nasa_news", "data_pub": "2026-08-12T20:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 12 de agosto de 2026, uma eclise solar total foi observada em San Millán de los Caballeros, Espanha. A sombra lunar cobriu completamente o disco do Sol ao passar entre a Terra e o Sol, atingindo partes de Groenlândia, Islândia, o norte da Rússia, o Oceano Atlântico e Espanha.", "titulo_pt": "Eclise Solar total em 2026 na Espanha", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 100885, "titulo": "Estrogen therapy is linked to fewer signs of Alzheimer’s in the brain", "url": "https://www.sciencenews.org/article/estrogen-therapy-alzheimers-brain", "fonte_id": "science_news", "data_pub": "2026-08-12T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A terapia com estrogênio em mulheres mais velhas durante a menopausa foi associada a menos sinais de Alzheimer no autopsy, mas não necessariamente impede o desenvolvimento da doença.", "titulo_pt": "Terapia com estrogênio está relacionada a menores sinais de Alzheimer no cérebro", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 100887, "titulo": "See the 2026 total solar eclipse from around the world", "url": "https://www.scientificamerican.com/article/see-the-2026-total-solar-eclipse-from-around-the-world/", "fonte_id": "scientific_american", "data_pub": "2026-08-12T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A partir de uma eclipses parcial sobre Berlim até a totalidade sobre Espanha, confira algumas das imagens impressionantes do eclipse solar total de 12 de agosto.", "titulo_pt": "Veja o eclipse solar total de 2026 desde diversos pontos do mundo", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 100888, "titulo": "Major COVID study that fueled vaccine skepticism retracted over ‘misinformation’", "url": "https://www.scientificamerican.com/article/major-covid-study-that-fueled-vaccine-skepticism-retracted-over-misinformation/", "fonte_id": "scientific_american", "data_pub": "2026-08-12T18:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo importante sobre o COVID-19, que alimentou a desconfiança em relação às vacinas, foi reeditado devido a informações incorretas. O estudo original foi publicado em 2024 e foi criticado por outros cientistas como sendo enganoso no momento da publicação.", "titulo_pt": "Grande estudo sobre COVID que alimentou desconfiança em vacinas é reeditado devido a 'informações incorretas'", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 100881, "titulo": "WHO says Trump’s latest vaccine policy order is misguided", "url": "https://www.statnews.com/2026/08/12/trump-vaccine-executive-order-critiqued-by-tedros-who/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-12T18:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ordem do governo Trump para reformular o calendário de vacinação poderia expor crianças a mais doses e aumentar o risco de doenças, segundo líderes da saúde mundial.", "titulo_pt": "OMS afirma que nova política de vacinação de Trump é equivocada", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 100088, "titulo": "A vest tested on the Artemis I mission blocked some radiation exposure", "url": "https://www.sciencenews.org/article/vest-artemis-mission-blocked-radiation", "fonte_id": "science_news", "data_pub": "2026-08-12T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma blusa de plástico de 26 quilos, usada em um modelo humano no voo não tripulado da missão Artemis I, pode proteger os astronautas contra rajadas solares no futuro.", "titulo_pt": "Blusa testada na missão Artemis I bloqueou exposição a radiação", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 100078, "titulo": "NASA Upgrades Vertical Motion Simulator for Modern Mission Needs", "url": "https://www.nasa.gov/centers-and-facilities/ames/nasa-upgrades-vertical-motion-simulator-for-modern-mission-needs/", "fonte_id": "nasa_news", "data_pub": "2026-08-12T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA atualizou seu simulador de movimento vertical, o maior do mundo, para atender às necessidades modernas das missões. Com as novas melhorias, o simulador se tornou mais poderoso e capaz de simular experiências como pilotar um táxi aéreo avançado ou pousar na Lua sem sair do chão.", "titulo_pt": "NASA atualiza simulador Vertical para necessidades modernas das missões", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 98831, "titulo": "Veja fotos do eclipse solar desta quarta-feira (12)", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/veja-fotos-do-eclipse-solar-desta-quarta-feira-12.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-12T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milhões de europeus tiveram a chance de observar um eclipse solar total nesta quarta-feira (12), quando a Lua passou entre a Terra e o Sol. O fenômeno foi visível em parte do continente, com uma faixa mergulhada na escuridão por quase dois minutos.", "titulo_pt": "Veja fotos do eclipse solar desta quarta-feira (12)", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 99124, "titulo": "Ao vivo: acompanhe o eclipse solar total", "url": "https://www.bbc.com/portuguese/articles/c4gj4e99xe5o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-12T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Lua passará entre a Terra e o Sol, ocultando a luz solar na quarta-feira (12/08). O eclipse solar total será visível em algumas regiões do Hemisfério Norte, enquanto no Brasil não será possível observá-lo.", "titulo_pt": "Ao vivo: acompanhe o eclipse solar total", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 100353, "titulo": "Apelo de Tamara Klink não dá certo e autora continua liderando lista de mais vendidos", "url": "https://veja.abril.com.br/cultura/apelo-de-tamara-klink-nao-da-certo-e-autora-continua-liderando-lista-de-mais-vendidos/", "fonte_id": "veja", "data_pub": "2026-08-12T21:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tamara Klink, filha de Amyr Klink, mantém a liderança no ranking de livros mais vendidos há 14 semanas consecutivas. O apelo para que ela saísse do topo da lista não foi bem-sucedido.", "titulo_pt": "Apelo de Tamara Klink não dá certo e autora continua na liderança dos mais vendidos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 100356, "titulo": "Diretor de ‘Boi Neon’ expõe contradição de Cazarré: ‘No filme, foi um homem sensível’", "url": "https://veja.abril.com.br/cultura/diretor-de-boi-neon-expoe-contradicao-de-cazarre-no-filme-foi-um-homem-sensivel/", "fonte_id": "veja", "data_pub": "2026-08-12T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O diretor Gabriel Mascaro fala sobre o filme 'Boi Neon' em uma mostra comemorativa. Ele expõe a contradição entre o personagem interpretado pelo ator Cazarré no filme, descrito como sensível, e o discurso real do ator.", "titulo_pt": "Diretor de ‘Boi Neon’ revela contradição de Cazarré", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 100534, "titulo": "Desilusión sin nostalgia: señales de un cambio en el humor social", "url": "https://www.lanacion.com.ar/opinion/desilusion-sin-nostalgia-senales-de-un-cambio-en-el-humor-social-nid12082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-12T21:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Há sinais de que a percepção sobre o liderazgo de Milei está sendo modificada em uma parte da opinião pública. O universo de pessoas decepcionadas com ele se expandiu, mesmo entr nta uma estratégia para lidar com eventos climáticos extremos, buscando prever e mitigar deslizamentos de terra, enchentes e outros impactos das mudanças climáticas nas rodovias. A resposta da empresa ao El Niño começa antes do evento ocorrer.", "titulo_pt": "Na EcoRodovias, resposta ao El Niño começa muito antes da chuva e onda de calor", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 100093, "titulo": "Analysis: Weaker EV targets could cost UK consumers £3bn a year by 2030", "url": "https://www.carbonbrief.org/analysis-weaker-ev-targets-could-cost-uk-consumers-3bn-a-year-by-2030", "fonte_id": "carbon_brief", "data_pub": "2026-08-12T14:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um futuro consultório do governo britânico que possa enfraquecer os objetivos para veículos elétricos (VEs) poderia custar aos consumidores até 3 bilhões de libras ao ano até 2030.", "titulo_pt": "Análise: objetivos mais fracos para ve podem custar £3 bi por ano aos consumidores britânicos em 2030", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 99529, "titulo": "One-fifth of France's nuclear capacity offline due to extreme weather and jellyfish", "url": "https://www.lemonde.fr/en/energies/article/2026/08/12/one-fifth-of-france-s-nuclear-capacity-offline-due-to-extreme-weather-and-jellyfish_6756421_98.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-12T12:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dezessete reatores nucleares de uma frota total de cinquenta e sete foram afetados por condições climáticas extremas e a presença excessiva de jararacas marinhas, resultando em uma redução superior a 20% na capacidade produtiva de energia nuclear, um déficit recorde.", "titulo_pt": "Um quinto da capacidade nuclear francesa paralisada devido a condições climáticas extremas e a presença excessiva de jararacas marinhas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 99523, "titulo": "More than half of Europe's population to be hit by another heatwave", "url": "https://www.lemonde.fr/en/environment/article/2026/08/12/more-than-half-of-europe-s-population-to-be-hit-by-another-heatwave_6756417_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-12T10:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Temperaturas acima de 30°C estão previstas para afetar grande parte da Europa Ocidental e do Sul, incluindo regiões de França, Itália e Espanha onde as temperaturas podem ultrapassar os 35°C.", "titulo_pt": "Mais da metade da população europeia pode ser atingida por outra onda de calor", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 100201, "titulo": "Landscapes for Adaptation Evidence from China", "url": "https://www.archdaily.com/1183172/landscapes-for-adaptation-evidence-from-china", "fonte_id": "archdaily", "data_pub": "2026-08-12T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O crise climática é agora evidente e não mais uma possibilidade futura. É necessário adaptar as cidades para sobrevivência diante dos impactos do clima em rápida mudança, reconfigurando os sistemas urbanos com abordagens resilientes que substituam as soluções engenhosas obsoletas.", "titulo_pt": "Landscape de adaptação: evidências da China", "veiculo": "ArchDaily", "pais": "Chile", "classe": "B"}, {"id": 100730, "titulo": "Europe scrambles for eclipse glasses as solar power output set to dip", "url": "http://www.euronews.com/video/2026/08/12/europe-scrambles-for-eclipse-glasses-as-solar-power-output-set-to-dip", "fonte_id": "euronews", "data_pub": "2026-08-12T07:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lojas e ópticas europeias estão com escassez de lentes certificadas para eclipse, com filas se formando em Paris, Londres e Bruxelas devido à alta demanda. Aproximadamente na próxima terça-feira, haverá um eclipse solar total.", "titulo_pt": "Europa corre atrás la-y-que-chadwick-apuro-al-maximo", "fonte_id": "ciper_chile", "data_pub": "2026-08-12T17:46:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O exvocero da Suprema pediu um ‘favor’ a Hermosilla, que foi apurado com urgência por Chadwick. Este evento foi publicado inicialmente pelo CIPER Chile.", "titulo_pt": "O 'favor' que o exvocero da Suprema pediu a Hermosilla e que Chadwick ‘apurou ao máximo’", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 100799, "titulo": "Twenty-six countries condemn in 'strongest terms' Iran executions", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/twenty-six-countries-condemn-strongest-terms-iran-executions", "fonte_id": "middle_east_eye", "data_pub": "2026-08-12T14:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vinte e seis países, incluindo França, Reino Unido e Canadá, condenaram as execuções realizadas pelo governo iraniano, que estão sendo usadas para silenciar os protestos. Essas nações, juntamente com o chefe da diplomacia da União Europeia, reagiram em uma declaração conjunta contra a utilização da pena capital pelos autoridades iranianas.", "titulo_pt": "Vinte e seis países condenam 'fortemente' execuções do Irã", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 99351, "titulo": "‘Silence Is Not an Option’: The Quest to Bear Witness to China’s Uyghur Camps", "url": "https://thediplomat.com/2026/08/silence-is-not-an-option-the-quest-to-bear-witness-to-chinas-uyghur-camps/", "fonte_id": "the_diplomat", "data_pub": "2026-08-12T13:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O livro 'Heart Full of Light', de Kalbinur Sidik, fornece uma narrativa pessoal sobre os crimes cometidos contra o povo uighur na região do Xinjiang.", "titulo_pt": "Silêncio não é opção: a busca para testemunhar as cárceis do uighur no xinjiang", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 99740, "titulo": "Hong Kong murder suspect faces retrial after jury deadlocks on psychosis defence", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3363807/hong-kong-murder-suspect-faces-retrial-after-jury-deadlocks-psychosis-defence?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-12T12:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um julgamento de 23 dias no tribunal superior de Hong Kong terminou com um júri dividido sobre se o suspeito de assassinato, Matthew Choi, havia cometido o crime sob delírio de que autoridades estavam o perseguiando com ondas eletromagnéticas. O caso foi encaminhado para um novo julgamento.", "titulo_pt": "Suspeito de assassinato em hong Kong enfrentará novo julgamento após júri se dividir", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 99627, "titulo": "Lebanon ends executions: Where does the death penalty still exist in 2026?", "url": "https://www.aljazeera.com/news/2026/8/12/lebanon-ends-executions-where-does-the-death-penalty-still-exist-in-2026?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-12T10:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2026, Líbano encerra execuções capitais: três quartos do mundo aboliram a pena de morte na lei ou na prática, conforme informa a Amnesty International.", "titulo_pt": "Líbano encerra execuções capitais: onde ainda existe a pena de morte em 2026?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 99691, "titulo": "Myanmar ramps up civilian attacks with airborne weapons, U.N. says", "url": "https://www.japantimes.co.jp/news/2026/08/12/asia-pacific/myanmar-civilian-airborne-weapons-un/", "fonte_id": "japan_times", "data_pub": "2026-08-12T06:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A investigação da ONU relata que o exército birmanês tem aumentado o uso de paragliders motorizados, girocópteros e drones para ataques de baixa altitude u const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}
