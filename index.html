026-08-26T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Samsung foi condenada a pagar R$ 59,8 milhões ao Grupo Swatch por permitir que aplicativos digitais de relógios de luxo fossem disponibilizados na loja de aplicativos de seus smartwatches, considerados prejudiciais à relojoaria suíça.", "titulo_pt": "Samsung é condenada a pagar R$ 59,8 milhões à Swatch por apps que copiavam relógios", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 125184, "titulo": "Inflação nos EUA continua elevada em julho; PIB do 2º trimestre permanece inalterado em 1,5%", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/inflacao-nos-eua-continua-elevada-em-julho-pib-do-2o-trimestre-permanece-inalterado-em-15.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T16:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inflação anual nos Estados Unidos permaneceu acima da meta de 2% do Fed pelo 65º mês consecutivo em julho. A pausa na queda em relação ao pico recente, influenciada pela guerra com o Irã, pode afetar a decisão do banco central americano sobre a taxa de juros.", "titulo_pt": "Inflação nos EUA mantém-se elevada em julho; pausa na queda pode influenciar decisão do fed sobre taxas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 125761, "titulo": "Meta settles social media addiction case with California, other states for $16.7 billion", "url": "https://www.cnbc.com/2026/08/26/meta-social-media-trial-settlement.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-26T16:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta chegou a um acordo com procuradores de estados americanos, incluindo a Califórnia, pagando 16,7 bilhões de dólares. O caso se concentrou em acusações de que a empresa subestimou os danos à saúde mental de crianças nas redes sociais.", "titulo_pt": "Meta resolve caso sobre adicção à mídia social com California e outros estados por 16,7 bilhões de dólares", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 125498, "titulo": "Casa JOTA debate o papel do microcrédito na economia nordestina", "url": "https://www.jota.info/coberturas-especiais/casa-jota-debate-o-papel-do-microcredito-na-economia-nordestina", "fonte_id": "jota", "data_pub": "2026-08-26T16:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O evento Casa JOTA discute o impacto do microcrédito no empreendedorismo, inovação e agricultura familiar no Nordeste brasileiro.", "titulo_pt": "Casa JOTA debate o papel do microcrédito na economia nordestina", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 125188, "titulo": "Impasse sobre dez áreas de urânio trava 1.168 processos minerários no país", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/impasse-sobre-dez-areas-de-uranio-trava-1168-processos-minerarios-no-pais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indefinição sobre o destino de dez áreas com urânio está impedindo a conclusão de 1.168 processos minerários de diversos minerais no país. Esses projetos incluem terras raras, níquel, ouro, ferro, cobre, manganês e bauxita.", "titulo_pt": "Impasse sobre dez áreas de urânio trava 1.168 processos minerários no país", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 125245, "titulo": "Campo de Búzios, da Petrobras, bate recordes de exportação de gás", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/campo-de-buzios-da-petrobras-bate-recordes-de-exportacao-de-gas", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-26T15:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O campo de Búzios, na Bacia de Santos, bateu recordes de exportação de gás natural em agosto, com uma média diária superior a 10 milhões de metros cúbicos. Este recorde mensal superou o anterior de março de 2026, que registrou 9,1 milhões de metros cúbicos por dia.", "titulo_pt": "Campo de Búzios, da Petrobras, bate recordes de exportação de gás", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 125189, "titulo": "Gol assume representação comercial da Avianca no mercado brasileiro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/gol-assume-representacao-comercial-da-avianca-no-mercado-brasileiro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T15:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Gol passou a representar comercialmente a Avianca no mercado brasileiro. O anúncio foi feito com a presença de executivos de agências de viagens e consolidadores e faz parte do processo de sinergia entre as duas companhias.", "titulo_pt": "Gol assume representação comercial da Avianca no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 125190, "titulo": "Intervenção de secretário de Trump em títulos coloca Tesouro dos EUA em colisão com Fed", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/intervencao-de-secretario-de-trump-em-titulos-coloca-tesouro-dos-eua-em-colisao-com-fed.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T15:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O secretário do Tesouro dos Estados Unidos, Scott Bessent, está intervindo no mercado de títulos de forma contrária às ações do Fed para combater a inflação, alertaram investidores antes do discurso de Kevin Warsh, presidente do Fed, em Jackson Hole, Wyoming.", "titulo_pt": "Intervenção do secretário do Tesouro americano colide com esforços do Fed contra a inflação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 125499, "titulo": "Qual o valor da Lei 14.133/2021 para o TCU?", "url": "https://www.jota.info/opiniao-e-analise/colunas/controle-publico/qual-o-valor-da-lei-14-133-2021-para-o-tcu", "fonte_id": "jota", "data_pub": "2026-08-26T15:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TCU (Tribunal de Contas da União) continua resistindo à adoção de limites percentuais para alterações consensuais em contratos. Isso significa que o TCU ainda não estabeleceu um limite específico para ajustes nos valores contratuais por meio de acordos entre as partes.", "titulo_pt": "Qual o valor da Lei 14.133/2021 para o TCU?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 125193, "titulo": "Argentinos têm dificuldade para pagar dívidas durante dolorosa reforma econômica de Milei", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/argentinos-tem-dificuldade-para-pagar-dividas-durante-dolorosa-reforma-economica-de-milei.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T14:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2025, Jonatan Verón, um motorista de Uber de 41 anos de La Plata, Argentina, tomou um empréstimo bancário de cerca de US$ 1.300 (R$ 6.700) para reparar seu carro quebrou. Isso reflete as dificuldades dos argentinos em pagar dívidas durante a reforma econômica de Milei.", "titulo_pt": "Argentinos enfrentam dificuldades para quitar dívidas durante reforma econômica de Milei", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 125194, "titulo": "Meta chega a acordo e aceita pagar até US$ 17,1 bi para estados dos EUA por redes sociais viciantes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/meta-chega-a-acordo-e-aceita-pagar-ate-us-171-bi-para-estados-dos-eua-por-redes-sociais-viciantes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T14:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meta chegou a um acordo com 47 estados, o Distrito de Columbia e territórios dos Estados Unidos, pagando até US$ 17,1 bilhões em multas e promovendo mudanças em seus produtos devido às acusações de colocar crianças em risco com plataformas viciantes de redes sociais.", "titulo_pt": "Meta chega a acordo e aceita pagar até US$ 17,1 bi para estados dos EUA por redes sociais viciantes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 125843, "titulo": "Mark Walter’s group insists there is no ‘fire sale’ and ‘no fraud’", "url": "https://www.ft.com/content/70949883-f543-4444-a330-503b8e4c141a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-26T14:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "TWG Global se defende contra múltiplas acusações que questionam seu império de investimentos, que possui participações em equipes esportivas de alto perfil.", "titulo_pt": "Grupo de mark Walter se defende contra múltiplas acusações", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 125883, "titulo": "Young people spending as much time online as employees at work: survey", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/27/2003863220", "fonte_id": "taipei_times", "data_pub": "2026-08-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que jovens estão passando o mesmo tempo online que os funcionários no trabalho. O estudo foi realizado recentemente e comparou o tempo de uso da internet entre diferentes grupos etários.", "titulo_pt": "Jovens passando o mesmo tempo online que funcionários no trabalho: pesquisa", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 125495, "titulo": "A inclusão que não veio: até onde a IA desceu a pirâmide social", "url": "https://www.jota.info/opiniao-e-analise/colunas/radar-de-evidencias/a-inclusao-que-nao-veio-ate-onde-a-ia-desceu-a-piramide-social", "fonte_id": "jota", "data_pub": "2026-08-26T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que 84,6% das pessoas nas classes D e E conhecem a inteligência artificial, mas apenas 16% delas a usam. A inclusão da IA na vida dessas camadas sociais ainda é limitada.", "titulo_pt": "A inclusão da IA que não chegou: até onde a inteligência artificial chegou nas classes d e e", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 125171, "titulo": "SpaceX construirá base para lançar foguete Starship de Louisiana, nos EUA", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/spacex-construira-base-para-lancar-foguete-starship-de-louisiana-nos-eua.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-26T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SpaceX planeja construir um complexo de lançamento de foguetes no sul da Louisiana, nos Estados Unidos, com um investimento de US$ 100 bilhões. O local servirá como base para lançamentos do Starship e de satélites de inteligência artificial.", "titulo_pt": "Spacex construirá base para lançar foguete Starship em Louisiana, EUA", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 125980, "titulo": "Candidates Are Signing a Pact Promising Action on Data Centers and AI Safety", "url": "https://www.wired.com/story/candidates-are-signing-a-pact-promising-action-on-data-centers-and-ai-safety/", "fonte_id": "wired", "data_pub": "2026-08-26T17:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 15 políticos de todo o país assinaram o Acordo sobre Inteligência Artificial, comprometendo-se a regulamentar centrais de dados e segurança da IA. O candidato ao Senado de Nebraska, Dan Osborn, afirma que é necessário acertar essa questão.", "titulo_pt": "Candidatos assinam acordo para regulamentar centrais de dados e segurança da IA", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 125947, "titulo": "Google’s new AI transcription edits out your ‘ums’ and ‘ahs’", "url": "https://www.theverge.com/tech/985186/google-gemini-3-5-transcribe-audio-ai", "fonte_id": "the_verge", "data_pub": "2026-08-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google atualizou o Gemini Audio com novas capacidades de transcrição que detectam jargões especializados e mais de 85 idiomas. O Gemini 3.5 Transcribe, uma nova adição à família Gemini, foi lançado após o lançamento do Gemini 3.5 Live Translate.", "titulo_pt": "Google atualiza transcrição do gemini audio", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 125688, "titulo": "Bill Gates believes the world is unprepared for AI", "url": "https://www.lemonde.fr/en/pixels/article/2026/08/26/bill-gates-believes-the-world-is-unprepared-for-ai_6756881_13.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-26T16:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bill Gates acredita que o mundo não está preparado para a inteligência artificial, citando perda permanente de empregos, poder de maus atores e privação de oportunidades para desenvolvimento de habilidades sociais para crianças como alguns dos maiores riscos.", "titulo_pt": "Bill Gates acredita que o mundo não está preparado para a inteligência artificial", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 125762, "titulo": "Bill Gates warns ‘there is no plan’ for the ‘upheaval’ AI will cause", "url": "https://www.cnbc.com/2026/08/26/bill-gates-ai-jobs-economic-upheaval.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-26T16:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bill Gates alertou que não há planos suficientes para lidar com os desafios causados pela inteligência artificial, como o deslocamento de trabalhadores, o estresse nas sistemas sociais e os riscos globais.", "titulo_pt": "Bill Gates avisa que não há plano para lidar com a revolução da IA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 125842, "titulo": "What businesses can learn from Dollynomics", "url": "https://www.ft.com/content/c36f89d0-0d53-41f6-a0eb-89c5921e14df?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-26T16:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dolly Parton foi lembrada principalmente por suas gravações, mas também foi uma empreendedora.", "titulo_pt": "O que as empresas podem aprender com Dollynomics", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 125187, "titulo": "Instagram terá 'modo escola' e veto a filtro de beleza para adolescentes após acordo nos EUA; veja o que muda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/instagram-tera-modo-escola-e-veto-a-filtro-de-beleza-para-adolescentes-apos-acordo-nos-eua-veja-o-que-muda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T16:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meta, que controla Facebook e Instagram, concordou em implementar várias mudanças em suas plataformas e pagou multas de US$ 16,68 bilhões para encerrar uma ação judicial movida por 29 estados americanos. As mudanças incluem o desenvolvimento de um 'modo escola' e o veto ao uso de filtros de beleza para adolescentes.", "titulo_pt": "Instagram terá 'modo escola' e proibição de filtro de beleza para adolescentes após acordo nos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 125839, "titulo": "Meta to pay up to $18bn to settle children’s social media harm case", "url": "https://www.ft.com/content/21dcbd96-ee57-445c-a9ba-0938c49b91c0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-26T16:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta está disposta a pagar até US$ 18 bilhões para resolver um caso relacionado a supostas falhas na proteção de crianças em redes sociais. O caso estava prestes a ser julgado em California.", "titulo_pt": "Meta disposta a pagar até us$ 18 bilhões para resolver caso de danos a crianças em redes sociais", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 125949, "titulo": "Volvo’s cars will warn one another about hazards in the road", "url": "https://www.theverge.com/transportation/985070/volvo-connected-safety-hazard-alert-animal-cyclist", "fonte_id": "the_verge", "data_pub": "2026-08-26T15:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Volvo está atualizando três de suas veículos elétricos com novas alertas de perigo para informar os motoristas sobre a presença de animais ou usuários vulneráveis na estrada. Essas novas funcionalidades de segurança conectada funcionam através do compartilhamento de informações entre os carros, em vez de sistemas de alerta baseados em dados coletados por aplicativos populares de navegação como o Google Maps e o Waze.", "titulo_pt": "Volvo atualiza seus carros elétricos com alertas de perigo entre veículos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 125322, "titulo": "Reuniões mais produtivas? Estas IAs transformam conversas em planos de ação", "url": "https://exame.com/inteligencia-artificial/reunioes-mais-produtivas-estas-ias-transformam-conversas-em-planos-de-acao/", "fonte_id": "exame", "data_pub": "2026-08-26T14:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ferramentas como Otter, Fireflies e Granola transcrevem conversas, identificam decisões e organizam tarefas para reduzir o trabalho após reuniões. Essas IAs auxiliam na criação de planos de ação durante a preparação e pós-reunião.", "titulo_pt": "Reuniões mais produtivas? Estas IAs transformam conversas em planos de ação", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 125950, "titulo": "Xbox announces disc-to-digital feature that digitizes your physical games", "url": "https://www.theverge.com/tech/984936/xbox-disc-to-digital-feature-official", "fonte_id": "the_verge", "data_pub": "2026-08-26T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft anunciou uma nova funcionalidade do Xbox que permitirá aos proprietários de consoles digitalizarem suas coleções de jogos físicos. Esta funcionalidade, que já foi revelada exclusivamente pelo The Verge, faz parte dos esforços da Microsoft para preservar jogos e preparar-se para o próximo geração de consoles Xbox.", "titulo_pt": "Xbox anuncia funcionalidade que digitaliza coleções de jogos físicos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 125676, "titulo": "Meta settles with states, sets new industry standards over child safety", "url": "https://www.axios.com/2026/08/26/meta-lawsuit-settlement-states-facebook", "fonte_id": "axios", "data_pub": "2026-08-26T14:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta concordou em pagar até US$ 16,7 bilhões aos estados americanos em um acordo histórico relacionado a alegações de que Facebook e Instagram podem causar danos a crianças. A empresa está pedindo que seus concorrentes adotem as mesmas medidas, afirmando que isso só funcionará se os principais players da indústria se unirem para implementar reformas abrangentes.", "titulo_pt": "Meta se acerta com estados e estabelece novos padrões de indústria para a segurança infantil", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 125906, "titulo": "Meta agrees to pay US$17 billion to settle teen social media addiction case in US", "url": "https://www.scmp.com/news/world/united-states-canada/article/3365364/meta-agrees-pay-us17-billion-settle-teen-social-media-addiction-case-us?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-26T14:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta Platforms concordou em pagar 17 bilhões de dólares e implementar medidas de segurança para crianças em suas plataformas Facebook e Instagram para encerrar um processo histórico sobre a adicção à mídia social entre adolescentes e concordar com as reclamações apresentadas por 47 estados americanos. O acordo evitou uma julgamento com a presença do CEO Mark Zuckerberg em um tribunal federal.", "titulo_pt": "Meta concorda em pagar 17 bilhões de dólares para encerrar processo sobre adicção a mídia social entre adolescentes nos EUA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 125981, "titulo": "Meta Will Pay Up to $16.7 Billion to Settle Its Social Media Harms Case—and That’s Not All", "url": "https://www.wired.com/story/meta-will-pay-up-to-dollar167-billion-to-settle-its-social-media-harms-case-and-thats-just-for-starters/", "fonte_id": "wired", "data_pub": "2026-08-26T14:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta vai pagar até US$ 16,7 bilhões para resolver o caso relacionado a danos na mídia social e fará alterações significativas em suas plataformas como parte de um acordo histórico.", "titulo_pt": "Meta fará pagamento de até us$ 16,7 bilhões e fará alterações em suas plataformas para resolver caso de danos na mídia Social", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 126022, "titulo": "Monkeys hunt small animals when fruit is scarce", "url": "https://www.sciencenews.org/article/monkeys-hunt-small-animals-fruit-scarce", "fonte_id": "science_news", "data_pub": "2026-08-26T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os capuchins caçam e comem pequenos vertebrados com mais frequência quando os alimentos vegetais se tornam escassos. Este comportamento pode nos ajudar a entender mais sobre a evolução dietética dos humanos no início.", "titulo_pt": "Macacos caçam pequenos animais quando os frutos são escassos", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 126103, "titulo": "Narwhals help researchers uncover unique data from the deepest East Greenland fjords", "url": "https://phys.org/news/2026-08-narwhals-uncover-unique-deepest-east.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Narwhais vivem em algumas das águas mais inacessíveis da Terra, onde as temperaturas do oceano ficam próximas do zero. Porque eles se movem por áreas que poucos humanos alcançam, foram capazes de auxiliar os pesquisadores em uma tarefa especial.", "titulo_pt": "Narwhais ajudam pesquisadores a coletar dados únicos dos fiordes mais profundos da groenlândia oriental", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126104, "titulo": "Chagas parasite's survival trick offers antimalarial-style target", "url": "https://phys.org/news/2026-08-chagas-parasite-survival-antimalarial-style.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da University of Cincinnati identificaram um potencial novo alvo para prevenir a propagação da doença de Chagas. Esta infecção parasitária é transmitida pelo picado de insetos conhecidos como baratas beijo em países da América Central e do Sul, e mais recentemente nos Estados Unidos.", "titulo_pt": "Truque parasitário da doença de chagas oferece alvo antimalárica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126105, "titulo": "Buried underwear shows land use is key to soil health", "url": "https://phys.org/news/2026-08-underwear-key-soil-health.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O solo é a base da nossa produção alimentar, armazenando água, carbono e nutrientes, além de abrigar uma grande parte da biodiversidade mundial. No entanto, a biodiversidade e, consequentemente, a saúde do solo estão diminuindo globalmente, com impactos na agricultura, segurança alimentar e no funcionamento de ecossistemas.", "titulo_pt": "Calças enterradas mostram que o uso do solo é crucial para a saúde do solo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126106, "titulo": "Did ocean motion carve Enceladus's tiger stripes?", "url": "https://phys.org/news/2026-08-ocean-motion-enceladus-tiger-stripes.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Saturno possui um satélite chamado Enceladus, que tem uma camada espessa de gelo ao redor de um oceano líquido. Quatro rachaduras paralelas, conhecidas como 'estrias de tigre', cortam o polo sul do Enceladus, cada uma com cerca de 500 metros de profundidade e 2 quilômetros de largura, emitindo vapor d'água e outros materiais diretamente para o espaço.", "titulo_pt": "As movimentações oceânicas criaram as estrias de tigre do Enceladus?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126107, "titulo": "Even protected Florida wetlands can't escape microplastic pollution", "url": "https://phys.org/news/2026-08-florida-wetlands-microplastic-pollution.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microplásticos foram encontrados em praticamente todos os ambientes, incluindo solos e sedimentos, mas ainda se conhece pouco sobre o que acontece quando eles entram em várzeas fluviais. Esses ecossistemas, frequentemente ignorados em favor de ambientes marinhos e costeiros, podem atuar como caminhos e armadilhas para microplásticos, possivelmente capturando e retenindo poluição.", "titulo_pt": "Mesmo as várzeas protegidas da flórida não escapam da poluição por microplásticos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126108, "titulo": "How high scores in an online brain teaser made mathematicians lie for three years", "url": "https://phys.org/news/2026-08-high-scores-online-brain-teaser.html", "fonte_id": "phys_org", "data_pub": "2026-08-26T17:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Digit Party é um jogo de acertar números que, embora não tenha a popularidade do Wordle, tem sido jogado por centenas de milhares de pessoas como um entretenimento casual durante o dia.", "titulo_pt": "Como altos pontuações em um quebra-cabeça online fizeram matemáticos mentirem por três anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 126007, "titulo": "The healthcare industry isn’t built for coming off medication", "url": "https://www.newscientist.com/article/2586235-__trashed-57/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Parar de usar medicamentos é mais difícil do que começar a tomar, pois o setor de saúde não tem grande interesse em ajudar os pacientes a descontinuar o uso de medicamentos, devido a questões de pesquisa e receita.", "titulo_pt": "A indústria de saúde não está preparada para que os pacientes parem de usar medicamentos", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 126008, "titulo": "Twisteddoodles on a brand-new type of robot", "url": "https://www.newscientist.com/article/2585926-twisteddoodles-on-a-brand-new-type-of-robot/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Esta semana, a Twisteddoodles apresentou um novo tipo de robô.", "titulo_pt": "Twisteddoodles apresenta um novo tipo de robô", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 126009, "titulo": "Tom Gauld on picking the right staff", "url": "https://www.newscientist.com/article/2585914-tom-gauld-on-picking-the-right-staff/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tom Gauld publica um desenho semanal em forma de quadrinho.", "titulo_pt": "Tom Gauld sobre a seleção de funcionários", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 126010, "titulo": "Can ‘quantum musical agents’ really make a melody better?", "url": "https://www.newscientist.com/article/2585882-can-quantum-musical-agents-really-make-a-melody-better/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo explora a 'teleportação quântica em sistemas de múltiplos agentes para música interativa', questionando se essas técnicas podem melhorar a melodia.", "titulo_pt": "Agentes quânticos podem melhorar a melodia musical?", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 125300, "titulo": "Câncer de pâncreas: EUA aprovam remédio que dobra tempo de vida de pacientes", "url": "https://veja.abril.com.br/saude/cancer-de-pancreas-eua-aprovam-remedio-que-dobra-tempo-de-vida-de-pacientes/", "fonte_id": "veja", "data_pub": "2026-08-26T16:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os EUA aprovaram um novo remédio que aumenta o tempo de vida dos pacientes com câncer de pâncreas em 90% dos casos. O medicamento atua em uma mutação presente em grande parte dos adenocarcinomas pancreáticos.", "titulo_pt": "Remédio aprovado nos EUA dobra a sobrevivência de pacientes com câncer de pâncreas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 126025, "titulo": "RTX’s Blue Canyon Technologies introduces new spacecraft mission enabler", "url": "https://spacenews.com/rtxs-blue-canyon-technologies-introduces-new-spacecraft-mission-enabler/", "fonte_id": "spacenews", "data_pub": "2026-08-26T16:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Blue Canyon Technologies, uma divisão da RTX responsável pela fabricação de satélites e serviços de missão, apresentou recentemente uma nova subsistema de satélite. A empresa opera com sede em Lafayette, Colorado.", "titulo_pt": "Rtx’s Blue Canyon Technologies apresenta novo subsistema de missão para satélites", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 125987, "titulo": "On the fence about a statin? In borderline cases, calcium scans could be a tiebreaker", "url": "https://www.statnews.com/2026/08/26/cac-scans-statin-use-prevent-calculator-heart-disease-risk/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-26T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos recentes indicam que a escaneagem de cálcio nas artérias coronárias, cada vez mais utilizada, é útil apenas em uma pequena proporção de casos para orientar o uso de estatinas.", "titulo_pt": "Em dúvida sobre estatinas? Exames de cálcio nas artérias podem ser decisivos em casos limítrofes", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 126023, "titulo": "Once upon a time, insects had 24 legs", "url": "https://www.sciencenews.org/article/insects-fossil-record-24-legs", "fonte_id": "science_news", "data_pub": "2026-08-26T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um inseto com muitas pernas do passado preenche um grande buraco no registro fóssil e sugere como as criaturas acabaram com seis pernas.", "titulo_pt": "Havia uma vez insetos com 24 pernas", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 125988, "titulo": "STAT+: FDA approves new pancreatic cancer drug expected to usher in new era of treatment", "url": "https://www.statnews.com/2026/08/26/pancreatic-cancer-drug-rasonque-approved/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-26T14:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA aprovou um tratamento que estende a vida para pacientes com câncer pancreático avançado — o primeiro medicamento desse tipo a atacar uma causa genética dessa malignidade altamente letal.", "titulo_pt": "FDA aprova novo tratamento para câncer pancreático avançado", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 126046, "titulo": "Major Exhibition of Pompeii Treasures Will Make Its US Debut", "url": "https://hyperallergic.com/major-exhibition-of-pompeii-treasures-will-make-its-us-debut/", "fonte_id": "hyperallergic", "data_pub": "2026-08-26T17:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 160 artefatos do Museu Arqueológico Nacional de Nápoles estarão em exposição no Museu de Arte de Dallas a partir de dezembro.", "titulo_pt": "Exposição major Exhibition of Pompeii Treasures Will Make Its US Debut será realizada com artefatos de nápoles", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 126099, "titulo": "Drone Metal Orthodox Priest Guitarist Responds to Fascism, Homophobia Accusations", "url": "https://pitchfork.com/story/drone-metal-orthodox-priest-guitarist-responds-to-fascism-homophobia-accusations/", "fonte_id": "pitchfork", "data_pub": "2026-08-26T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O padre Dionysios Tabakis, guitarrista de um metal drone, enfrentou críticas por posts religiosos que usaram linguagem homofóbica e por suas conexões com uma organização neo-nazi grega.", "titulo_pt": "Padre de Metal drone responde a acusações de homofobia e fascismo", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 126100, "titulo": "William Basinski Returns With Solo Piano Album", "url": "https://pitchfork.com/story/william-basinski-returns-with-solo-piano-album/", "fonte_id": "pitchfork", "data_pub": "2026-08-26T17:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "William Basinski lançou seu primeiro álbum solo de piano em seis anos, intitulado 'Passing the Cup of Sorrows'. O álbum pode ser ouvido em uma amostra.", "titulo_pt": "William Basinski lança álbum Solo de Piano após seis anos", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 125591, "titulo": "James McPhee, de la U. de Chile, sobre cambios al Fondecyt: “Es una oportunidad perdida de incorporar talento de alto nivel”", "url": "https://www.latercera.com/nacional/noticia/james-mcphee-de-la-u-de-chile-sobre-cambios-al-fondecyt-es-una-oportunidad-perdida-de-incorporar-talento-de-alto-nivel/", "fonte_id": "la_tercera", "data_pub": "2026-08-26T17:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O vicerreitor de Pesquisa e Desenvolvimento da Universidade de Chile, James McPhee, afirma que as mudanças no Fondecyt de Postdoctorados 2027 representam uma oportunidade perdida para incorporar talentos de alto nível. As alterações incluem a definição de áreas prioritárias de inscrição e a restrição do acesso a candidatos estrangeiros.", "titulo_pt": "James McPhee, da U. De Chile, sobre mudanças no Fondecyt: 'é uma oportunidade perdida de incorporar talento de alto nível'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 125592, "titulo": "Lo que callan las Humanidades y las Ciencias Sociales", "url": "https://www.latercera.com/opinion/noticia/lo-que-callan-las-humanidades-y-las-ciencias-sociales/", "fonte_id": "la_tercera", "data_pub": "2026-08-26T17:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute aspectos que as Humanidades e Ciências Sociais não abordam frequentemente. Não há um trecho específico para resumir, pois a citação fornecida é apenas o título e um número.", "titulo_pt": "O que as Humanidades e as ciências sociais não mencionam", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 125289, "titulo": "“Pessoa deslumbrante”: Taylor Swift faz homenagem emocionante à Dolly Parton", "url": "https://veja.abril.com.br/cultura/pessoa-deslumbrante-taylor-swift-faz-homenagem-emocionante-a-dolly-parton/", "fonte_id": "veja", "data_pub": "2026-08-26T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dolly Parton, uma veterana da música country, faleceu nesta terça-feira aos 80 anos. Taylor Swift fez uma homenagem emocionante à artista.", "titulo_pt": "Pessoa deslumbrante: taylor Swift faz homenagem emocionante à Dolly Parton", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 126044, "titulo": "Whimsical shortlist announced for Edinburgh comedy award 2026", "url": "https://www.theguardian.com/stage/2026/aug/26/whimsical-shortlist-announced-for-edinburgh-comedy-award-2026", "fonte_id": "guardian_culture", "data_pub": "2026-08-26T17:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um curioso shortlist foi anunciado para os prêmios de comédia de Edimburgo de 2026, com nomes como Lara Ricote concorrendo ao principal prêmio, além de veteranos e novos talentos com apresentações inusitadas.", "titulo_pt": "Lista cômica e cheia de criatividade anunciada para os prêmios de comédia de edimburgo 2026", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 126040, "titulo": "‘9 to 5? She was full-on round the clock!’ Dolly Parton celebrated by kd lang, Peggy Seeger, Annie Lennox and more", "url": "https://www.theguardian.com/music/2026/aug/26/9-to-5-she-was-full-on-round-the-clock-dolly-parton-celebrated-by-kd-lang-peggy-seeger-annie-lennox-and-more", "fonte_id": "guardian_culture", "data_pub": "2026-08-26T16:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Músicos e performers tributam à lendária cantora country Dolly Parton, que foi uma talentosa geração, uma empreendedora forte, uma filantropa dedicada e uma pessoa realmente gentil. Shirley Collins, cantora e compositora veram o maior impacto nos petroglyphs.", "titulo_pt": "Emissões históricas de sulfeto de dióxido provavelmente danificaram arte rupestre de Murujuga, novo estudo encontra", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 126101, "titulo": "Tim Curry, Rocky Horror Picture Show Star, Dies at 80", "url": "https://pitchfork.com/story/tim-curry-the-rocky-horror-picture-show-star-dies-at-80/", "fonte_id": "pitchfork", "data_pub": "2026-08-26T16:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tim Curry, ator conhecido por seu papel como Pennywise o Palhaço no filme 'It' de Stephen King, faleceu aos 80 anos. Curry também atuou como o protagonista em 'O Show do Rocha', um filme de culto dos anos 1970.", "titulo_pt": "Tim Curry, astro de 'o Show do rocha', morre aos 80 anos", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 125239, "titulo": "Artistas indianos tensionam os limites do corpo e evocam deuses ancestrais em mostra", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/artistas-indianos-tensionam-os-limites-do-corpo-e-evocam-deuses-ancestrais-em-mostra.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-26T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Artistas indianos exploram temas como corpos e divindades ancestrais em suas obras. T. Venkanna retrata homens em atos sexuais, mas a pintura não sugere prazer, com elementos fantasmagóricos e mistura de genitais masculinos e femininos.", "titulo_pt": "Artistas indianos expõem limites do corpo e invocam divindades ancestrais em mostra", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 126034, "titulo": "Interior Architects creates Craftsman-style office for AI company Notion in San Francisco", "url": "https://www.dezeen.com/2026/08/26/interior-architects-notion-craftsman-style-office-san-francisco/", "fonte_id": "dezeen", "data_pub": "2026-08-26T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Interior Architects projetou um escritório no estilo Craftsman para a companhia de inteligência artificial Notion em San Francisco, combinando detalhes desse estilo com uma aparência minimalista tecnológica. O projeto foi realizado em cinco andares do edifício Monadnock de 1907.", "titulo_pt": "Interior Architects cria escritório no estilo craftsman para empresa de IA Notion em San Francisco", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 126038, "titulo": "Tim Curry, star of The Rocky Horror Picture Show and Stephen King’s It, dies aged 80", "url": "https://www.theguardian.com/film/2026/aug/26/tim-curry-dies-rocky-horror-show-stephen-king-it-legend-film", "fonte_id": "guardian_culture", "data_pub": "2026-08-26T15:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tim Curry, ator conhecido por seu papel como Dr. Frank-N-Furter em 'The Rocky Horror Picture Show' e por suas performances em 'Legend', 'Clue' e 'It', faleceu aos 80 anos em seu lar.", "titulo_pt": "Tim Curry, estrela de 'The Rocky Horror Picture Show' e 'It', morre aos 80 anos", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 126045, "titulo": "Two women accuse former Fat White Family member Saul Adamczewski of physical and emotional abuse", "url": "https://www.theguardian.com/music/2026/aug/26/two-women-accuse-former-fat-white-family-member-saul-adamczweski-physical-emotional-abuse", "fonte_id": "guardian_culture", "data_pub": "2026-08-26T15:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois mulheres acusaram Saul Adamczewski, ex-membro da banda Fat White Family e atualmente do Insecure Men, de abusos físicos e emocionais. Após essas acusações, Adamczewski foi desligado de sua gravadora e suas datas de turnê foram canceladas.", "titulo_pt": "Dois mulheres acusam ex-membro da Fat White Family de abusos físicos e emocionais", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 125301, "titulo": "Justiça mantém preso motorista de aplicativo que abusou de jovem de 18 anos", "url": "https://www.metropoles.com/sao-paulo/justica-mantem-preso-motorista-de-aplicativo-que-abusou-de-jovem-de-18-anos", "fonte_id": "metropoles", "data_pub": "2026-08-26T17:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um motorista de aplicativo foi mantido em prisão preventiva após abusar de uma jovem de 18 anos durante uma corrida na madrugada de 25 de agosto no Guarujá. A Polícia Militar foi acionada pela amiga da vítima.", "titulo_pt": "Justiça mantém motorista de aplicativo preso após abusar de jovem de 18 anos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 125304, "titulo": "PM é preso após tentar assassinar policial civil com tiro na cabeça", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pm-e-preso-apos-tentar-assassinar-policial-civil-com-tiro-na-cabeca", "fonte_id": "metropoles", "data_pub": "2026-08-26T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um policial militar foi preso após tentar assassinar um policial civil com um tiro na cabeça. A prisão ocorreu no bairro Fazenda Grande do Retiro, em Salvador (BA), durante o cumprimento de um mandado de prisão preventiva.", "titulo_pt": "PM é preso após tentar assassinar policial civil com tiro na cabeça", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 125292, "titulo": "Motorista de aplicativo é preso por estuprar jovem durante corrida em Guarujá", "url": "https://veja.abril.com.br/brasil/motorista-de-aplicativo-e-preso-por-estuprar-jovem-durante-corrida-em-guaruja/", "fonte_id": "veja", "data_pub": "2026-08-26T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um motorista de aplicativo foi preso por estuprar uma jovem durante uma corrida em Guarujá. A Polícia Militar prendeu o suspeito após uma amiga suspeitar do carro parado durante a viagem, monitorada em tempo real.", "titulo_pt": "Motorista de aplicativo é preso por estuprar jovem durante corrida em Guarujá", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 125294, "titulo": "Secretária faz campanha para irmão enquanto Couto exige neutralidade no governo", "url": "https://veja.abril.com.br/politica/secretaria-faz-campanha-para-irmao-enquanto-couto-exige-neutralidade-no-governo/", "fonte_id": "veja", "data_pub": "2026-08-26T17:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A secretária de Cultura do Rio de Janeiro, Danielle Barros, participou de uma campanha política em favor do irmão, que concorre a deputado. O governador autorizou a atuação dela na campanha.", "titulo_pt": "Secretária faz campanha para irmão enquanto governador autoriza", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 125360, "titulo": "Vídeo: mulher agride PM com tapa no rosto durante Festival de Barretos", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/video-mulher-agride-pm-com-tapa-no-rosto-durante-festival-de-barretos/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-26T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher teria agredido uma vendedora com tapa antes de atacar um policial militar durante o Festival de Barretos. De acordo com o boletim de ocorrência, a mulher já havia cometido uma agressão anterior no evento.", "titulo_pt": "Vídeo: mulher agride PM com tapa no rosto durante Festival de Barretos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 125565, "titulo": "Flight attendant’s breast cancer was occupational disease, court rules", "url": "https://www.theguardian.com/society/2026/aug/26/flight-attendant-breast-cancer-occupational-disease", "fonte_id": "guardian_world", "data_pub": "2026-08-26T14:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma flight attendant francesa venceu uma causa legal que reconheceu sua câncer de mama como uma doença ocupacional, o primeiro caso do tipo na indústria aérea do país. O julgamento levou em consideração que ela trabalhou frequentemente à noite e foi exposta ao fumo passivo.", "titulo_pt": "Câncer de mama de flight attendant é considerado doença ocupacional, decide tribunal", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 125381, "titulo": "PM ocupa cinco comunidades do Complexo de Israel, no Rio", "url": "https://www.brasildefato.com.br/2026/08/26/pm-ocupa-cinco-comunidades-do-complexo-de-israel-no-rio/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-26T13:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Militar está ocupando por prazo indeterminado cinco comunidades do Complexo de Israel, na zona norte do Rio de Janeiro, com mais de 220 homens patrulhando 24 horas por dia. A área é comandada por Álvaro Malaquias Santos Rosa.", "titulo_pt": "PM ocupa cinco comunidades do Complexo de Israel, no Rio", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 125807, "titulo": "A teacher’s slap, student’s death revive India’s corporal punishment debate", "url": "https://www.aljazeera.com/news/2026/8/26/a-teachers-slap-students-death-revive-indias-corporal-punishment-debate?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-26T13:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O óbito de Teja reviveu o debate sobre a aplicação do castigo corporal nas escolas na Índia, uma prática que continua a afetar crianças mesmo após o banimento há mais de uma década.", "titulo_pt": "Morte de aluno reaviva debate sobre castigo corporal nas escolas na Índia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 125335, "titulo": "Gestão Sustentável: Desigualdade pode custar 0,8% do PIB", "url": "https://exame.com/bussola/gestao-sustentavel-desigualdade-pode-custar-08-do-pib/", "fonte_id": "exame", "data_pub": "2026-08-26T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo indica que a discriminação e a desigualdade econômica podem custar 0,8% do PIB, reduzindo a produtividade, excluindo trabalhadores e limitando a formação de capital humano.", "titulo_pt": "Gestão Sustentável: desigualdade pode custar 0,8% do PIB", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 125945, "titulo": "Police to reexamine 310,000 missing person cases closed in past 3 yrs", "url": "https://en.yna.co.kr/view/AEN20260826009100320", "fonte_id": "yonhap_news", "data_pub": "2026-08-26T10:26:00Z", "idioma": "en", "provavel_duplicata_de": 125932, "texto_pt": "A polícia planeja revisar de forma abrangente cerca de 310.000 casos de desaparecidos encerrados nos últimos três anos.", "titulo_pt": "Polícia planeja reexaminar 310.000 casos de desaparecidos fechados nos últimos 3 anos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 125206, "titulo": "Na praça de Burle Marx, o medo trava a caneta", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/mauricio-portugal-ribeiro/2026/08/na-praca-de-burle-marx-o-medo-trava-a-caneta.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na praça de Roberto Burle Marx, no Ibirapuera, um galpão antigo que já serviu para fabricar bondes e serraria de madeira hoje está abandonado, esperando por um novo destino. O local oferece um cenário calmo no meio do parque.", "titulo_pt": "Na praça de Burle Marx, o medo trava a caneta de transformar o antigo galpão em novo uso", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 125075, "titulo": "Interior minister orders nationwide review of missing person cases after Jeju scandal", "url": "https://www.koreaherald.com/article/10853301", "fonte_id": "korea_herald", "data_pub": "2026-08-26T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro do Interior da Coreia do Sul ordenou uma revisão nacional dos casos de pessoas desaparecidas após um escândalo em Jeju. Durante uma reunião de emergência com altos oficiais da polícia em Seul, Yun Ho-jung pediu que a polícia investigasse a suposta falsificação do fechamento de casos de desaparecidos em Jeju e revisasse como esses casos são tratados em todo o país.", "titulo_pt": "Ministro do interior ordena revisão nacional de casos de desaparecidos após escândalo em Jeju", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 124936, "titulo": "North Macedonia Sees Drop in New School Pupils amid Demographic Woes", "url": "https://balkaninsight.com/2026/08/26/north-macedonia-sees-drop-in-new-school-pupils-amid-demographic-woes/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-08-26T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "North Macedonia começa o novo ano letivo com cerca de 14.500 alunos matriculados no ensino fundamental, quase 38% menos do que há uma década. O declínio populacional e a emigração estão levando a encerramentos de escolas e turmas.", "titulo_pt": "Macedônia do norte registra diminuição de novos alunos no início do ano letivo", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 124564, "titulo": "Nueva ley de salud mental: qué cambios impulsan ahora para las internaciones y otros dos ejes clave del plan oficial", "url": "https://www.clarin.com/sociedad/nueva-ley-salud-mental-cambios-impulsan-ahora-internaciones-ejes-clave-plan-oficial_0_RhiTVAbMhM.html", "fonte_id": "clarin", "data_pub": "2026-08-26T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo tenta alcançar um consenso com as províncias sobre uma nova lei de saúde mental. Há ainda pontos em discussão antes do dictamen do projeto, que promove mudanças em internações, hospitais e o papel dos psiquiatras.", "titulo_pt": "Nova lei de saúde mental: quais mudanças estão sendo discutidas para internações e outros dois pilares do plano oficial", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 124909, "titulo": "‘Black smoke’ chokes Pakistan maternity ward as hospital fire kills 14 infants", "url": "https://www.japantimes.co.jp/news/2026/08/26/asia-pacific/pakistan-maternity-ward-fire/", "fonte_id": "japan_times", "data_pub": "2026-08-26T08:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio no terceiro andar do setor de maternidade e saúde infantil do principal hospital público da capital do Paquistão, o Pakistan Institute of Medical Sciences, resultou na morte de 14 bebês.", "titulo_pt": "Fumaça preta sufoca maternidade paquistanesa enquanto incêndio mata 14 bebês", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 124551, "titulo": "O que tabaco, álcool e ultraprocessados têm a ensinar sobre o vício digital", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-que-tabaco-alcool-e-ultraprocessados-tem-a-ensinar-sobre-o-vicio-digital", "fonte_id": "jota", "data_pub": "2026-08-26T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um caso nos Estados Unidos reviveu a discussão sobre a responsabilidade pelos vícios digitais. O caso destaca o paralelo entre o vício em plataformas digitais, tabaco, álcool e alimentos ultraprocessados.", "titulo_pt": "O que tabaco, álcool e ultraprocessados têm a ensinar sobre o vício digital?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 125456, "titulo": "Enchentes no Nepal e no Tibete: o que se sabe sobre a tragédia que deixou mortos e centenas de desaparecidos", "url": "https://www.bbc.com/portuguese/articles/ce3rz25qeqdo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-26T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma enxurrada repentina na fronteira entre Nepal e Tibete deixou ao menos 31 mortos e centenas de desaparecidos, incluindo quase 400 viajantes. Autoridades apontam terremoto seguido de avalanche como possível causa.", "titulo_pt": "Enchentes no Nepal e no Tibete: o que se sabe sobre a tragédia que deixou mortos e centenas de desaparecidos", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 125318, "titulo": "Autoridades alertam que há risco de uma segunda inundação no Nepal", "url": "https://www.metropoles.com/ciencia/autoridades-alertam-que-ha-risco-de-uma-segunda-inundacao-no-nepal", "fonte_id": "metropoles", "data_pub": "2026-08-26T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Autoridades alertam para o risco de uma segunda inundação no Nepal. O rio Himalaia ainda está bloqueado por pedras e gelo que caíram após um terremoto leve na região.", "titulo_pt": "Autoridades alertam para risco de inundação no Nepal", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 125363, "titulo": "O que se sabe sobre a enchente relâmpago que devastou o norte do Nepal", "url": "https://www.cnnbrasil.com.br/internacional/nepal-enchente-relampago/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-26T17:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Centenas de pessoas estão desaparecidas após uma inundação que atingiu assentamentos ribeirinhos no norte do Nepal, causando destruição em larga escala.", "titulo_pt": "O que se sabe sobre a enchente relâmpago que devastou o norte do Nepal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 125754, "titulo": "Hundreds missing as flash floods tear through Nepal", "url": "http://www.euronews.com/video/2026/08/26/hundreds-missing-as-flash-floods-tear-through-nepal", "fonte_id": "euronews", "data_pub": "2026-08-26T13:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas estão desaparecidas após enxurradas rápidas atingirem o rio Trishuli em Nepal, cobrindo as ruas com detritos. A polícia alerta para que os residentes fiquem atentos.", "titulo_pt": "Milhares desaparecidos em enxurradas no rio trishuli, Nepal", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 125925, "titulo": "China makes officials liable for environmental damage for life", "url": "https://www.scmp.com/news/china/politics/article/3365336/china-makes-officials-liable-environmental-damage-life?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-26T10:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China reforçou a responsabilidade dos seus funcionários públicos por danos ambientais graves durante seu mandato, vinculando os esforços ambientais mais estreitamente às avaliações de desempenho. As novas regras, publicadas pela Comunista Partido e pelo Conselho de Estado, podem levar a medidas disciplinares contra os responsáveis por danos ambientais significativos.", "titulo_pt": "China faz funcionários públicos responsáveis por danos ambientais pelo resto da vida", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 124342, "titulo": "Número de empresas que publicam dados sobre emissões de carbono bate recorde no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/numero-de-empresas-que-publicam-dados-sobre-emissoes-de-carbono-bate-recorde-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de empresas que divulgam informações sobre emissões de carbono ao Programa Brasileiro GHG Protocol atingiu um novo recorde. Este programa é considerado um dos maiores bancos de dados nacionais sobre gases de efeito estufa no contexto corporativo.", "titulo_pt": "Número de empresas que publicam dados sobre emissões de carbono bate recorde no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 124815, "titulo": "Haze from El Niño-fuelled wildfires threatens health of millions in Indonesia, ministry warns", "url": "http://www.euronews.com/2026/08/26/haze-from-el-nino-fuelled-wildfires-threatens-health-of-millions-in-indonesia-ministry-war", "fonte_id": "euronews", "data_pub": "2026-08-26T07:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério indonésio advertiu sobre a ameaça à saúde de milhões de pessoas devido a uma névoa de fuligem proveniente de incêndios florestais alimentados pelo El Niño. Entre janeiro e julho, os incêndios queimaram mais de 200.000 hectares de terra, uma área três vezes maior que a capital Jakarta.", "titulo_pt": "Névoa de fuligem de incêndios florestais ameaça saúde de milhões na indonésia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 124951, "titulo": "Vietnam’s Ho Chi Minh City plans low-emission zone to clear downtown air", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3365307/vietnams-ho-chi-minh-city-plans-low-emission-zone-clear-downtown-air?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-26T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ho Chi Minh, o centro comercial da Vietnam, está planejando restringir gradativamente veículos a gasolina e diesel em sua área central a partir de meados de 2027, como parte de uma zona de baixas emissões planejada. A iniciativa incluirá um período de teste a partir de julho de 2027 em áreas centrais e novas áreas urbanas, antes de expandir em 2029.", "titulo_pt": "Ho Chi Minh City, vietnã, planeja área de baixas emissões na área central", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 124916, "titulo": "Japan to end subsidies for solar panels", "url": "https://www.japantimes.co.jp/news/2026/08/26/japan/solar-panels-environment-ministry-subsidies/", "fonte_id": "japan_times", "data_pub": "2026-08-26T06:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Japão vai cessar os subsídios para painéis solares. Os custos de instalação permanecerão elegíveis para auxílio em princípio.", "titulo_pt": "Japão vai extinguir subsídios para painéis solares", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 124818, "titulo": "Fire kills 14 newborns at major hospital in Pakistan, officials say", "url": "http://www.euronews.com/2026/08/26/fire-kills-14-newborns-at-major-hospital-in-pakistan-officials-say", "fonte_id": "euronews", "data_pub": "2026-08-26T06:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio em um hospital majoritário no Paquistão resultou na morte de 14 bebês recém-nascidos. A baixa aplicação das regras de segurança construtiva no país é apontada como responsável pelo alto número de vítimas fatais em incêndios.", "titulo_pt": "Incêndio mata 14 recém-nascidos em hospital importante no paquistão, dizem autoridades", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 124445, "titulo": "Muro de Trump ameaça pinturas rupestres de até 5 mil anos na fronteira dos EUA", "url": "https://exame.com/mundo/muro-de-trump-ameaca-pinturas-rupestres-de-ate-5-mil-anos-na-fronteira-dos-eua/", "fonte_id": "exame", "data_pub": "2026-08-26T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O muro de Trump ameaça pinturas rupestres que podem ter entre 5.000 e 7.000 anos de idade, localizadas na fronteira dos Estados Unidos. O terreno necessário para o projeto abriga dezenas dessas pinturas, tão antigas quanto as pirâmides do Egito.", "titulo_pt": "Muro de Trump ameaça pinturas rupestres de até 5 mil anos na fronteira dos EUA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 124819, "titulo": "Next Atlantic tropical storm will be named Dolly but no connection to Parton's death", "url": "http://www.euronews.com/2026/08/26/next-atlantic-tropical-storm-will-be-named-dolly-but-no-connection-to-partons-death", "fonte_id": "euronews", "data_pub": "2026-08-26T05:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O próximo furacão no Oceano Atlântico será nomeado Dolly, conforme os procedimentos estabelecidos pela Organização Meteorológica Mundial. As listas de nomes são reutilizadas a cada seis anos.", "titulo_pt": "Próximo furacão no atlântico será nomeado Dolly, sem conexão com a morte de Parton", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 124851, "titulo": "Massive natural gas leak in Wisconsin puts community on alert", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/26/massive-natural-gas-leak-in-wisconsin-puts-community-on-alert?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-26T05:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um caminhão atingiu um pipeline de gás natural perto de Saxon, Wisconsin, levando a uma evacuação de moradores nas proximidades.", "titulo_pt": "Grande vazamento de gás natural em Wisconsin coloca comunidade em alerta", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 124788, "titulo": "'We can't water a forest': Switzerland is testing a forestry method to protect against wildfires", "url": "https://www.lemonde.fr/en/summer-reads/article/2026/08/26/we-can-t-water-a-forest-switzerland-is-testing-a-forestry-method-to-protect-against-wildfires_6756853_183.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-26T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suíça está testando uma técnica antiga que promove condições mais frescas e maior biodiversidade, em contraste com as florestas monosspecíficas e de corte total que predominam na Europa.", "titulo_pt": "Não podemos regar uma floresta: Suíça testa método antigo para proteger contra incêndios florestais", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 125685, "t function toggleDrill(id) {

  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });

});

    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
