<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "10/11/2026 15:29", "stats": {"noticias_novas": 1331, "resumos_gerados": 266}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Brasil enfrenta diversos desafios políticos e econômicos, conforme mostram os artigos. O governo está analisando a liberação de misturas de 20% de biodiesel no diesel a partir de 2027, após testes previstos. Em outro desenvolvimento, o encerramento do inquérito das fake news pelo ministro Edson Fachin, após sete anos, marca um ponto de virada no Supremo Tribunal Federal, embora o caso Master ainda esteja pendente, mantendo tensões internas. Além disso, a Polícia Federal prendeu Humberto Fontoura Pradera, ex-secretário do STJ, suspeito de ter vazado informações sigilosas a Willer Tomaz, amigo do senador Flávio Bolsonaro, em uma operação que envolveu o Superior Tribunal de Justiça. O Conselho Nacional de Justiça também aprovou novas regras para a venda de precatórios e um sistema para rastrear essas operações, visando maior transparência na política judicial. O cenário político também se movimenta, com debates sobre o comando do Senado após 2026 e a possibilidade de Flávio Bolsonaro concorrer à Presidência em 2030.", "mundo": "A situação financeira dos Estados Unidos é um dos principais temas abordados, com a autora Mona Chalabi explorando a insegurança financeira em diferentes faixas de renda. Na política internacional, as conversações entre os EUA e a Rússia sobre a guerra na Ucrânia são produtivas, mas os EUA acusam o Irã de realizar ataques cibernéticos em supermercados europeus. O ex-presidente dos Estados Unidos, Donald Trump, enfrenta críticas e possíveis impeachment, enquanto o Partido Democrata busca combater a corrupção. Na região do Oriente Médio, o Estreito de Ormuz continua sendo um ponto de tensão, com ataques a embarcações e a possibilidade de sanções contra o Irã. Na política interna, a Coreia do Sul considera a possibilidade de permitir que coreanos residentes no exterior votem eletronicamente, enquanto a Coreia do Norte continua sendo um assunto de discussão entre os Estados Unidos e a Coreia do Sul.\n\nA geopolítica global está em um momento crucial, com diversos eventos importantes em curso. Os Estados Unidos buscam um 'final definitivo' para a guerra na Ucrânia, durante conversações trilaterais em Abu Dhabi, que incluem uma proposta americana para uma 'arquitetura de segurança a longo prazo' entre Moscou e a Europa. Essas negociações são as primeiras desde fevereiro e ocorrem após ataques conjuntos dos EUA e Israel contra o Irã e após eleições legislativas nos EUA que enfraqueceram Donald Trump. Paralelamente, o Irã e os EUA retomaram conversações, mas há baixas expectativas de um avanço significativo, pois Vladimir Putin não demonstra intenção de interromper o conflito. Em outro front, Israel teria matado mais de 1.600 pessoas em Gaza desde o fim do cessar-fogo do ano passado, de acordo com o ministério de saúde do enclave. Além disso, a Coreia do Norte rejeitou, em 10 de novembro, o pedido do Secretário-Geral da ONU para um diálogo intercoreano após um acidente de mina. O conflito na Ucrânia também afeta a Europa, com pilotos europeus afirmando que protocolos de segurança aeronáutica não foram adequadamente considerados durante reações militares a ameaças de bombas em voos, o que teria colocado a aviação civil em risco em alguns casos.", "economia": "A inflação nos Estados Unidos aumentou 0,4% em outubro, acima das expectativas, levando o Federal Reserve a considerar um possível aumento de 0,5 ponto percentual na taxa de juros em dezembro. Essa decisão foi influenciada por uma ata do Fed que indicou que a inflação continua pressionada, mesmo com a desaceleração da economia brasileira. O preço do petróleo Brent caiu abaixo de US$ 90, beneficiando os mercados globais de ações. O Bradesco aumentou sua projeção de inflação para 2027, prevendo uma taxa de 5,3%, e a China superou um superávit comercial de US$ 1 trilhão nos primeiros dez meses do ano, refletindo um comércio exterior em forte crescimento. A Anthropic, uma start-up de inteligência artificial, enviou um pedido de IPO de US$ 1,4 trilhão, projetando uma captação de até US$ 64 bilhões, que pode se tornar o segundo maior lançamento de ações da história em Wall Street. Além disso, a Magalu aproveita a crise da Casas Bahia, ganhando market share e criando uma 'oportunidade histórica' de expansão.", "tecnologia": "O Porto de Santos implementou um plano de contingência após uma possível ação de hackers, mas a movimentação de cargas e navios não foi afetada. A empresa de inteligência artificial Anthropic lançou a Claude Sheets, uma ferramenta de planilhas com IA para assinantes, e anunciou que seu IPO pode valer até 1,4 trilhão de dólares. A Nvidia enfrenta problemas relacionados ao seu CEO, Jensen Huang, com uma empresária chinesa que seria uma espia de Pequim, o que facilitou o envio de chips para empresas chinesas no valor de pelo menos 7,5 bilhões de dólares. O primeiro-ministro japonês, Shigeru Ishiba, enfatizou a importância da cooperação internacional na inteligência artificial, que apresenta novos desafios de segurança. Além disso, a editora de jogos sul-coreana Krafton Inc. registrou uma queda superior a 35% no lucro operacional no terceiro trimestre, apesar de um aumento nas vendas.", "ciencia": "A NASA está realizando o processo seletivo para astronautas que participarão do programa Artemis, com o objetivo de estabelecer uma presença humana permanente na Lua. Este programa faz parte das futuras missões da agência espacial. Ao mesmo tempo, a empresa de anéis inteligentes Oura adquiriu a startup de inteligência artificial médica Counsel Health por 625 milhões de dólares, mostrando a crescente importância da inteligência artificial no cuidado à saúde. Este acordo pode levar a novas soluções tecnológicas no setor médico. Além disso, a redução nas emissões de CO2 provenientes de combustíveis fósseis em 2026, principalmente devido aos altos preços do petróleo, reflete a complexidade das mudanças climáticas e a influência econômica sobre a diminuição das emissões.", "cultura": "A GloboNews manteve-se como o canal de notícias líder no segmento de TV por assinatura de janeiro a outubro de 2026, de acordo com o Ibope, superando a CNN Brasil. Em outra notícia, a atriz Bella Campos tem priorizado trabalhos no streaming após experiências problemáticas na Globo, deixando possibilidades de trabalhos na emissora de lado. A novela 'Paraíso Perdido', exibida pelo Globoplay, tem a participação do ator Guilherme Fontes após três anos de ausência. No âmbito cultural, o artista Nelson Felix apresenta uma exposição que mistura idiomas e diferentes linguagens artísticas, explorando temas como matemática, espiritualidade e arte dos povos ameríndios. A série 'Os Anéis de Poder', baseada em 'O Senhor dos Anéis', retorna com a terceira temporada e busca alcançar o impacto dos filmes originais, com os quatro primeiros episódios lançados no Prime Video nesta quarta-feira, 11 de outubro de 2026.", "sociedade": "Um ex-boxeador foi preso após matar um vendedor em Santa Catarina, com golpes que continuaram mesmo após a vítima cair e ficar desacordada. Este incidente aconteceu na presença da esposa e do filho do agressor. Em outro caso, a justiça de São Paulo negou um pedido de ONGs para proibir a venda de animais em plataformas online, como Mercado Livre e OLX, argumentando que não há uma lei nacional que proíba o comércio online de pets. Essa situação ocorre em um contexto de desafios para a segurança pública, especialmente em relação ao comércio ilegal de cigarros, que é um problema significativo. Além disso, a cidade de Denver, nos Estados Unidos, está expandindo a capacidade de armazenamento de água de uma represa para abastecer 150.000 novos domicílios, enfrentando atrasos devido a recursos em tribunais.", "meio_ambiente": "A COP31 de clima, realizada em Antalya, na Turquia, reuniu mais de 92.000 participantes, tornando-a a maior conferência até o momento. Durante o evento, a Alemanha anunciou um investimento de 15 milhões de euros na proteção e preservação de terras indígenas no Brasil, gerido por entidades indígenas. Em outro contexto, pesquisadores do Rio Grande do Sul detectaram resíduos de medicamentos em um rio importante, indicando a necessidade de investimentos em saneamento. No Brasil, a fumaça em Parintins fechou escolas e ginásios, suspendeu a UTI aérea e aumentou o número de pacientes com sintomas respiratórios. Além disso, uma jaguatirica de dois anos e meio morreu atropelada em uma área protegida, reavivando preocupações sobre a reintrodução da espécie.", "direitos_humanos": "A entidade da ONU responsável pelos direitos humanos adiou a revisão regular do registro de direitos humanos dos Estados Unidos para janeiro, esperando convencer o governo Trump a participar. Os 47 membros do Conselho de Direitos Humanos votaram a favor do adiamento, citando a 'não cooperação contínua' do país. Em outro desenvolvimento, uma juíza federal ordenou a liberação de uma estudante da UC Berkeley que foi detida pelo ICE no aeroporto de San Francisco, alegando uma violação ao direito processual. A jovem colombiana poderá continuar seu processo de asilo em liberdade. Além disso, o número de denúncias sobre risco de exploração sexual de menores de não nacionalidade enviadas pela ex-Mejor Niñez à fiscalia aumentou 166% entre 2021 e 2024. Na Indonésia, prisões VIP revelam tratamento preferencial para condenados ricos, enquanto sistemas prisionais enfrentam superlotação. A situação das minorias em Bósnia também é preocupante, com o Tribunal Europeu de Direitos Humanos condenando a constituição do país por discriminar contra romenos, judeus e outras 15 minorias, sete anos após a sentença, essas comunidades ainda são impedidas de ocupar os cargos políticos mais altos no país. Finalmente, a UNICEF relatou sobre o impacto combinado de drones e seca em crianças no Sudão, descrevendo uma situação inédita, e três policiais são acusados de violência durante a prisão do produtor musical Michel Zecler em Paris em 2020, bem como de falsificação de registros públicos, mas não foi incluído o elemento agravante de motivação racista na sua denúncia."}, "resumo_do_dia": {"politica_nacional": [{"id": 254037, "titulo": "Governo avalia liberar mistura de 20% de biodiesel no diesel a partir de 2027", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/11/governo-avalia-liberar-mistura-de-20-de-biodiesel-no-diesel-a-partir-de-2027.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo brasileiro está avaliando a liberação de misturas de 20% de biodiesel no diesel a partir de 2027, após a conclusão dos testes previstos para março de 2017. A aprovação pode ocorrer em maio ou outubro de 2017, conforme informou Marlon Arraes, autoridade para biocombustíveis do Ministério de Minas e Energia.", "titulo_pt": "Governo projeta liberação de mistura de 20% de biodiesel no diesel a partir de 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 254346, "titulo": "Haddad e Tebet são cotados por diplomatas para chefiar o Itamaraty", "url": "https://www.metropoles.com/colunas/neila-guimaraes/haddad-e-tebet-sao-cotados-por-diplomatas-para-chefiar-o-itamaraty", "fonte_id": "metropoles", "data_pub": "2026-11-10T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Diplomatas sugerem que Haddad ou Tebet possam liderar o Itamaraty, valorizando um chanceler com força política para aumentar o orçamento. Um grupo associado a Celso Amorim está articulando o nome de um técnico para o cargo.", "titulo_pt": "Haddad e Tebet são considerados por diplomatas para comandar o Itamaraty", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 254271, "titulo": "Dino autoriza busca e apreensão contra familiares de deputado em investigação sobre emendas", "url": "https://www.jota.info/stf/do-supremo/dino-autoriza-busca-e-apreensao-contra-familiares-de-deputado-em-investigacao-sobre-emendas", "fonte_id": "jota", "data_pub": "2026-11-10T17:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Foram realizadas buscas em cinco domicílios de familiares de um deputado em três municípios da Bahia: Porto Seguro, Eunápolis e Itamaraju. O autorizante das buscas não foi mencionado no trecho fornecido.", "titulo_pt": "Dino autoriza buscas e apreensões contra familiares de deputado em investigação sobre emendas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 254272, "titulo": "O Senado depois de 2026: simetria, presidência e federação", "url": "https://www.jota.info/opiniao-e-analise/colunas/america-latina-democracia-incompleta/o-senado-depois-de-2026-simetria-presidencia-e-federacao", "fonte_id": "jota", "data_pub": "2026-11-10T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Com a oposição detendo a maior bancada no Senado, a eleição de 2026 reaviva o debate sobre a simetria entre as casas legislativas.", "titulo_pt": "O Senado após 2026: simetria, presidência e federação", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 253993, "titulo": "Livro de": null, "texto_pt": "Presidentes e líderes de partidos do centrão informaram ao presidente da Câmara dos Deputados, Hugo Motta, que suas bancadas se opuseram ao acordo para implementar o voto distrital misto a partir da eleição de 2034, devido à falta de votos necessários para aprovar a mudança no sistema eleitoral.", "titulo_pt": "Partidos do centrão informam a Hugo Motta falta de apoio para voto distrital misto", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 253996, "titulo": "Antifeminismo cresce nas redes com discurso cristão e clubes exclusivos; conheça perfis", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/antifeminismo-cresce-nas-redes-com-discurso-cristao-e-clubes-exclusivos-conheca-perfis.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-10T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Parlamentares como a deputada estadual Eduarda Campopiano, que ganhou destaque com um discurso antifeminista nas redes sociais, estão revelando um ecossistema digital de influenciadoras de extrema direita que atraem adeptas para o campo antifeminista.", "titulo_pt": "Antifeminismo nas redes cresce com discurso cristão e clubes exclusivos; conheça perfis", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 254082, "titulo": "PF vai refazer relatórios sobre ministros do STF citados no caso Master", "url": "https://g1.globo.com/politica/noticia/2026/11/10/pf-vai-refazer-relatorios-sobre-ministros-do-stf-citados-no-caso-master.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-10T15:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal vai refazer os relatórios sobre as menções a ministros do Supremo Tribunal Federal encontradas nas investigações do caso Master, de acordo com interlocutores da corporação. Os novos documentos irão apresentar as menções aos ministros em trocas de mensagens com o ex-banqueiro Daniel Vorcaro e os contextos em que elas aparecem.", "titulo_pt": "PF vai refazer relatórios sobre ministros do STF citados no caso Master", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 253997, "titulo": "Nunes prorroga intervenção em empresa de ônibus suspeita de elo com PCC", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/nunes-prorroga-intervencao-em-empresa-de-onibus-suspeita-de-elo-com-pcc.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-10T15:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A gestão de Ricardo Nunes prorrogou a intervenção na empresa de ônibus Transunião até pelo menos fevereiro de 2027. A empresa era suspeita de ser usada pelo PCC para lavagem de dinheiro, intermediada pelo vereador Senival Moura.", "titulo_pt": "Nunes prorroga intervenção em empresa de ônibus suspeita de ligação com PCC", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 254083, "titulo": "CNJ aprova novas regras para venda de precatórios e cria central nacional para tentar rastrear operações", "url": "https://g1.globo.com/politica/noticia/2026/11/10/cnj-aprova-novas-regras-para-venda-de-precatorios-e-cria-central-nacional-para-tentar-rastrear-operacoes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-10T14:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Nacional de Justiça (CNJ) aprovou uma resolução que estabelece regras para a venda de precatórios e cria uma central nacional para rastrear essas operações. A medida visa ampliar a transparência e fortalecer a governança da política judicial de precatórios.", "titulo_pt": "CNJ aprova regras para venda de precatórios e cria central nacional de rastreamento", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 253998, "titulo": "Fim do inquérito das fake news repercute na luta pelo comando do Senado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/dora-kramer/2026/11/fim-do-inquerito-das-fake-news-repercute-na-luta-pelo-comando-do-senado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-10T14:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Edson Fachin está gradualmente trazendo mais ordem ao Supremo Tribunal Federal sem grandes exibições de autoridade. O fim do inquérito sobre fake news tem impacto na disputa pelo comando do Senado.", "titulo_pt": "Fim do inquérito sobre fake news influencia na luta pelo comando do Senado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 254274, "titulo": "Triunfo de Fachin, fim do inquérito das fake news não será suficiente para pacificar STF", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-flavia-maia/triunfo-de-fachin-fim-do-inquerito-das-fake-news-nao-sera-suficiente-para-pacificar-stf", "fonte_id": "jota", "data_pub": "2026-11-10T14:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O encerramento da investigação sobre fake news não será suficiente para pacificar o Supremo Tribunal Federal (STF) devido ao caso Master, divisões internas e desgaste da presidência da Corte.", "titulo_pt": "Triunfo de Fachin, fim do inquérito das fake news não será suficiente para pacificar STF", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 253999, "titulo": "Ex-ministro diz que sugeriu a Lula meta de 4 milhões de unidades do Minha Casa no próximo mandato", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/ex-ministro-diz-que-sugeriu-a-lula-meta-de-4-milhoes-de-unidades-do-minha-casa-no-proximo-mandato.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-10T14:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro das Cidades Jader Filho (MDB-PA) afirmou ter sugerido ao presidente Lula a meta de 4 milhões de unidades do programa Minha Casa Minha Vida no próximo mandato. Filho, agora deputado federal, fez uma 'provocação' ao presidente para aumentar a quantidade de unidades entregues.", "titulo_pt": "Ex-ministro sugere meta de 4 milhões de unidades do Minha Casa no próximo mandato", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 254084, "titulo": "'Split payment': 98% das operações entre empresas devem estar cobertas a partir de outubro de 2027, estima confederação", "url": "https://g1.globo.com/economia/noticia/2026/11/10/split-payment-98percent-das-operacoes-devem-estar-cobertas-ate-outubro-de-2027-estima-confederacao-dos-bancos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-10T14:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A presidente da Confederação Nacional das Instituições Financeiras, Cristiane Coelho, estima que 98% das transações de pagamento entre empresas estejam cobertas pelo 'split payment' a partir de outubro de 2027. Este sistema visa reduzir a sonegação fiscal ao permitir o pagamento dos tributos sobre o consumo em tempo real para o governo, estados e municípios nas operações entre empresas.", "titulo_pt": "98% Das operações entre empresas devem estar cobertas pelo 'split payment' a partir de outubro de 2027, estima confederação", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 254054, "titulo": "Califórnia rejeita criação de imposto para bilionários, projeta imprensa dos EUA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/california-rejeita-criacao-de-imposto-para-bilionarios-projeta-imprensa-dos-eua.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T13:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os eleitores da Califórnia rejeitaram o projeto de imposto aos bilionários, apesar do crescente descontentamento com a desigualdade econômica. A decisão foi lia e casada com a dinastia Nehru-Gandhi, relata em seu novo livro e entrevista suas batalhas políticas e os assassinatos de seu marido e sogra.", "titulo_pt": "Em entrevista, Sonia Gandhi relembra amor e perdas na Índia", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 254312, "titulo": "Reação militar a ameaças de bomba em voos pôs aviação civil em risco, dizem pilotos na Europa", "url": "https://www.dw.com/pt-br/reação-militar-a-ameaças-de-bomba-em-voos-pôs-aviação-civil-em-risco-dizem-pilotos-na-europa/a-79912046?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-10T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pilotos europeus afirmam que protocolos de segurança aeronáutica não foram adequadamente considerados durante reações militares a ameaças de bombas em voos. Isso teria colocado a aviação civil em risco em alguns casos.", "titulo_pt": "Reações militares a ameaças de bomba em voos colocaram aviação civil em risco, dizem pilotos", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 254467, "titulo": "Why Pete Hegseth Faces Impeachment", "url": "https://www.theatlantic.com/national-security/2026/11/pete-hegseth-thomas-massie-impeachment/689353/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-10T17:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um deputado republicano está forçando um voto sobre o impeachment do secretário de Defesa com base em oito acusações.", "titulo_pt": "Por que Pete Hegseth propõe Impeachment", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 254788, "titulo": "Defiant Hegseth defends Iran war as he faces impeachment vote", "url": "https://www.ft.com/content/38100c3c-af0d-440b-8350-823c5e8c80d9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-10T17:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário de Defesa dos EUA se defende em relação a um possível impeachment, enquanto enfrenta uma votação sobre seu mandato após a derrota dos republicanos nas eleições de meia legislatura.", "titulo_pt": "Hegseth desafia impeachment após derrota republicana nas eleições", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 254494, "titulo": "Russian naval aggression prompts new defensive initiative with ‘beer-drinking nations’", "url": "https://www.theguardian.com/uk-news/2026/nov/10/russian-naval-aggression-defensive-initiative-beer-drinking-nations", "fonte_id": "guardian_world", "data_pub": "2026-11-10T17:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A atividade naval russa aumentou em 41% ao redor do Reino Unido nos primeiros nove meses do ano, levando o Reino Unido a formar uma aliança com países como os Países Baixos e os bálticos e nórdicos para reforçar a defesa marítima. O ministro da Defesa Readiness, Luke Pollard, justificou a criação de um novo programa de drones e navios de guerra com essa alianança, chamada de 'a liga dos países que beberam cerveja'.", "titulo_pt": "Agressividade naval russa leva reino unido a formar nova aliança defensiva com países nórdicos e bálticos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 255301, "titulo": "UN Court Rejects Bosnian Serb War Criminal’s Early Release Plea Again", "url": "https://balkaninsight.com/2026/11/10/un-court-rejects-bosnian-serb-war-criminals-early-release-plea-again/btj/", "fonte_id": "balkan_insight", "data_pub": "2026-11-10T17:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tribunal rejeitou novamente o pedido de liberdade antecipada do ex-ministro interno bósnio sérvio Mico Stanisic, que está cumprindo uma pena de 22 anos de prisão por crimes de guerra e não demonstrou suficientemente sua reabilitação.", "titulo_pt": "Tribunal rejeita novamente pedido de liberdade antecipada de criminoso de guerra sérvio da bósnia", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 254495, "titulo": "Russia-Ukraine talks ‘very productive,’ says US’s Rubio – as it happened", "url": "https://www.theguardian.com/world/live/2026/nov/10/ukraine-russia-war-us-talks-abu-dhabi-europe-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-11-10T17:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os EUA lideraram conversações em Abu Dhabi que duraram quatro horas e serão retomadas no dia seguinte, focando em questões humanitárias. O EUA buscam um fim definitivo à guerra entre Rússia e Ucrânia. O governo francês acusa o Irã de realizar ataques cibernéticos em supermercados europeus, causando danos significativos.", "titulo_pt": "Conversações entre EUA e Rússia e Ucrânia produtivas, diz Rubio – como foi", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 254468, "titulo": "Trump Has Been Corroded by Hate", "url": "https://www.theatlantic.com/ideas/2026/11/trump-hate-legacy/689362/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-10T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump tem sido corroído pelo ódio, e, por sua vez, tem corroído a essência do seu partido.", "titulo_pt": "Trump foi corroído pelo ódio", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 254496, "titulo": "US officials seek ‘final end’ to Russia-Ukraine war, as Abu Dhabi talks set to continue", "url": "https://www.theguardian.com/world/2026/nov/10/us-officials-russia-ukraine-war-abu-dhabi-talks", "fonte_id": "guardian_world", "data_pub": "2026-11-10T16:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estados Unidos buscam um 'final definitivo' para a guerra entre Rússia e Ucrânia durante conversações trilaterais em Abu Dhabi, que incluem uma proposta americana para uma 'arquitetura de segurança a longo prazo' entre Moscou e Europa. Essas negociações são as primeiras desde fevereiro e ocorrem após ataques conjuntos dos EUA e Israel contra a Irã e após eleições legislativas nos EUA que enfraqueceram Donald Trump.", "titulo_pt": "Estados unidos buscam fim definitivo à guerra entre Rússia e Ucrânia, com conversas em Abu Dhabi", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 254499, "titulo": "‘Sabotage’: Read Hegseth’s Fiery Speech Against His Impeachment", "url": "https://foreignpolicy.com/2026/11/10/hegseth-speech-impeachment-transcript-pentagon-full-text/", "fonte_id": "foreign_policy", "data_pub": "2026-11-10T16:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hegseth criticou o esforço como uma 'farsa' e um 'travessura'.", "titulo_pt": "'Sabotagem': leia o discurso feroz de Hegseth contra seu Impeachment", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 254973, "titulo": "U.N. chief candidate stresses mediation over S. Korea's concerns over peninsula tensions", "url": "https://en.yna.co.kr/view/AEN20261111000200315", "fonte_id": "yonhap_news", "data_pub": "2026-11-10T16:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um candidato ao cargo de Secretário-Geral das Nações Unidas enfatizou a mediação em sua campanha, ignorando as preocupações da Coreia do Sul sobre as tensões peninsulares.", "titulo_pt": "Candidato ao cargo de secretário-geral das nações unidas destaca mediação sobre preocupações sul-coreanas com tensões peninsulares", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 254644, "titulo": "Rubio hails 'very productive' Russia-Ukraine talks, wants Europe 'at the table'", "url": "https://www.lemonde.fr/en/international/article/2026/11/10/rubio-hails-very-productive-russia-ukraine-talks-wants-europe-at-the-table_6777026_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-10T16:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Marco Rubio destacou as negociações entre Rússia e Ucrânia como muito produtivas após participar da reunião de ministros de relações exteriores do G7 em Paris, onde seus colegas europeus enfatizaram a importância de estarem diretamente envolvidos nas conversas mediadas pelos Estados Unidos.", "titulo_pt": "Rubio comemora 'negociações muito produtivas' entre Rússia e Ucrânia e deseja que Europa esteja 'à mesa'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 254066, "titulo": "Reuters/Ipsos: 65% dos norte-americanos desaprovam Trump", "url": "https://www.cartacapital.com.br/mundo/reuters-ipsos-65-dos-norte-americanos-desaprovam-trump/", "fonte_id": "cartacapital", "data_pub": "2026-11-10T16:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "65% dos norte-americanos desaprovam Trump de acordo com uma pesquisa Reuters/Ipsos. A maioria também quer o fim da guerra no Irã.", "titulo_pt": "65% Dos norte-americanos desaprovam Trump, diz pesquisa", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 254815, "titulo": "Father, child among six Palestinians killed in Israeli attacks on Gaza", "url": "https://www.aljazeera.com/news/2026/11/10/israeli-attacks-kill-at-least-six-in-gaza-including-father-and-son?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-10T15:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel teria morto mais de 1.600 pessoas em Gaza desde o fim do ' cessar-fogo' do ano passado, de acordo com o ministério de saúde do enclave.", "titulo_pt": "Pai e filho entre seis palestinos mortos em ataques israelenses em Gaza", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 254269, "titulo": "CNJ aprova novas regras para cessão de precatórios e prevê ‘regime de transição’", "url": "https://www.jota.info/justica/cnj-aprova-novas-regras-para-cessao-de-precatorios-e-preve-regime-de-transicao", "fonte_id": "jota", "data_pub": "2026-11-10T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Nacional de Justiça (CNJ) aprovou novas regras para a cessão de precatórios e estabeleceu um 'regime de transição'. A Ordem dos Advogados do Brasil (OAB) identificou um risco de 'fragmentação' com o uso de um sistema provisório até a implantação de uma central nacional.", "titulo_pt": "CNJ aprova novas regras para cessão de precatórios e prevê 'regime de transição'", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 254790, "titulo": "Higher-than-expected October inflation sparks Treasury sell-off", "url": "https://www.ft.com/content/8b564134-dea6-4272-8ede-e0b12ef5aebd?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-10T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inflação mensal de 0,4% foi superior às expectativas, levando os traders a aumentarem suas apostas sobre uma possível elevação da taxa de juros pela Federação Reserve antes do fim do ano.", "titulo_pt": "Inflação de outubro superior às expectativas provoca venda na tesouro", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 254038, "titulo": "Inadimplência do cartão de crédito chega a 10% do terceiro trimestre de 2026", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/inadimplencia-do-cartao-de-credito-chega-a-10-do-terceiro-trimestre-de-2026.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A taxa de inadimplência do cartão de crédito atingiu 10% no terceiro trimestre de 2026, um aumento de 0,9 ponto percentual em comparação com o mesmo período do ano anterior, de acordo com dados da Abecs.", "titulo_pt": "Inadimplência do cartão de crédito chega a 10% no terceiro trimestre de 2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 254789, "titulo": "Oil falls below $90 as Trump pulls back from threat to strike Iran", "url": "https://www.ft.com/content/07bdb58c-4557-4def-b8cb-db9be304fd72?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-10T17:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O preço do petróleo caiu para abaixo de US$ 90, após o presidente dos Estados Unidos, Donald Trump, recuar de ameaças a Irã. As baixas nos preços do petróleo têm apoiado a recuperação dos mercados globais de ações após uma queda na semana passada.", "titulo_pt": "Petróleo cai abaixo de us$ 90 após Trump recuar ameaças a Irã", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 254039, "titulo": "Bradesco vê juros em queda e inflação mais alta em 2027, mas destaca incerteza do cenário", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/bradesco-ve-juros-em-queda-e-inflacao-mais-alta-em-2027-mas-destaca-incerteza-do-cenario.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Bradesco aumentou sua projeção de inflação para 2027, prevendo uma taxa de 5,3% no final do ano, contra 4,1% anteriormente. O banco destaca a incerteza relacionada ao efeito da reforma tributária e da escala 6x1 nos preços.", "titulo_pt": "Bradesco eleva expectativa de inflação para 2027 e destaca incerteza", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 254293, "titulo": "Brasil não deveria aumentar o salário mínimo, mas se livrar dele, diz o economista John Cochrane", "url": "https://www.bbc.com/portuguese/articles/c5pvgv1x940xo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-10T16:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O economista John Cochrane, da Universidade de Stanford, nos Estados Unidos, afirmou à BBC News Brasil que o Brasil não deveria aumentar o salário mínimo, mas sim eliminá-lo. No entanto, ele ressaltou que esse projeto dependeria de ajustes fiscais e mudanças em programas sociais.", "titulo_pt": "Economista dos EUA diz que Brasil não deve aumentar, mas sim eliminar o salário mínimo", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 254043, "titulo": "Dirigente do Fed defende considerar alta de 0,5 ponto nos juros em dezembro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/dirigente-do-fed-defende-considerar-alta-de-05-ponto-nos-juros-em-dezembro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T16:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um dos principais dirigentes do Federal Reserve defendeu a possibilidade de aumentar os juros em 0,5 ponto percentual em dezembro, se a inflação americana não desacelerar. Essa alta seria a primeira em quatro anos.", "titulo_pt": "Dirigente do Fed sugere alta de 0,5 ponto nos juros em dezembro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 254791, "titulo": "Top Fed official considers largest rate rise since 2022", "url": "https://www.ft.com/content/72abed21-6043-4b2b-81b1-f3a2547da5b7?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-10T16:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governador Christopher Waller considera a possibilidade de um aumento de taxa de juros de 50 pontos base se a inflação nos Estados Unidos não diminuir. Ele sugere que os policymaker devem ponderar essa opção.", "titulo_pt": "Topo da Fed considera maior elevação de juros desde 2022", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 254046, "titulo": "Petróleo Brent cai abaixo de US$ 90 pela primeira vez desde agosto", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/petroleo-brent-cai-abaixo-de-us-90-pela-primeira-vez-desde-agosto.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T15:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O barril de petróleo Brent, referência internacional, estava sendo negociado abaixo de US$ 90 (R$ 496) pela primeira vez desde agosto, devido à esperança de um acordo para pôr fim à guerra no Oriente Médio.", "titulo_pt": "Petróleo Brent cai abaixo de US$ 90 pela primeira vez desde agosto", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 254047, "titulo": "China supera US$ 1 trilhão em superávit comercial em dez meses", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/china-supera-us-1-trilhao-em-superavit-comercial-em-dez-meses.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T15:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China superou o superávit comercial de US$ 1 trilhão nos primeiros dez meses do ano, refletindo um comércio exterior em forte crescimento. O setor exportador do país permanece dinâmico.", "titulo_pt": "China atinge superávit comercial de US$ 1 trilhão em dez meses", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 254783, "titulo": "Goldman Sachs expects Anthropic revenue to exceed $600bn by 2030", "url": "https://www.ft.com/content/fd209548-d2df-470c-ab9a-caadbec08b58?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-10T14:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Goldman Sachs projeta que a start-up de inteligência artificial Anthropic tenha vendas que ultrapassem 600 bilhões de dólares até 2030, aumentando suas vendas 130 vezes e alcançando um fluxo de caixa positivo até o fim da década.", "titulo_pt": "Goldman Sachs espera que receita da Anthropic ultrapasse 600 bilhões de dólares até 2030", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 254273, "titulo": "Casa JOTA debate implementação e próximos passos da reforma tributária", "url": "https://www.jota.info/casa-jota/casa-jota-debate-implementacao-e-proximos-passos-da-reforma-tributaria", "fonte_id": "jota", "data_pub": "2026-11-10T14:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Integrantes do Comitê Gestor do IBS e da Receita Federal discutiram desafios operacionais e regulamentação do novo sistema tributário em 19 de novembro.", "titulo_pt": "Casa JOTA debate implementação e próximos passos da reforma tributária", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 254049, "titulo": "Mais de 70 entidades pedem prorrogação dos testes da reforma tributária", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/mais-de-70-entidades-pedem-prorrogacao-dos-testes-da-reforma-tributaria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T14:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sete quarenta entidades representativas de setores produtivos assinaram uma carta aberta pedindo a prorrogação da fase de testes da reforma tributária antes da implementação das novas regras. Elas argumentam que é inviável resolver os entraves atuais, testar e homologar as pendências até o fim do ano.", "titulo_pt": "Mais de 70 entidades pedem prorrogação dos testes da reforma tributária", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 254111, "titulo": "Ata do Copom indica que desaceleração da economia não conteve inflação", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/ata-do-copom-indica-que-desaceleracao-da-economia-nao-conteve-inflacao", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-10T14:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ata do Copom indica que a economia brasileira apresenta sinais de desaceleração, mas a inflação continua pressionada. Diante disso, o Banco Central prevê que a Selic permanecerá em nível restritivo por mais tempo.", "titulo_pt": "Ata do Copom mostra desaceleração econômica, mas inflação persiste", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 254051, "titulo": "Anthropic envia pedido de IPO de US$ 1,4 trilhão e projeta segundo maior lançamento da história", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/anthropic-envia-preco-de-ipo-para-bancos-mas-volta-atras-sem-explicacao-diz-agencia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T14:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic enviou um pedido de IPO de US$ 1,4 trilhão, projetando uma captação de até US$ 64 bilhões, que pode se tornar o segundo maior lançamento de ações da história em Wall Street.", "titulo_pt": "Anthropic envia pedido de IPO de US$ 1,4 trilhão e projeta segundo maior lançamento da história", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 254053, "titulo": "Inflação ao consumidor nos EUA sobe 0,4% em outubro, acima do esperado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/inflacao-ao-consumidor-nos-eua-sobe-04-em-outubro-acima-do-esperado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T14:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os preços ao consumidor nos Estados Unidos aumentaram 0,4% em outubro, acima das expectativas. Este aumento levou o Federal Reserve a considerar um possível aumento da taxa de juros no próximo mês.", "titulo_pt": "Inflação ao consumidor nos EUA avança 0,4% em outubro, acima do esperado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 254238, "titulo": "Porto de Santos adota plano de contingência após possível ataque hacker", "url": "https://www.cnnbrasil.com.br/infra/porto-de-santos-investiga-instabilidades-em-sistema-e-descarta-paralisacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-10T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Porto de Santos implementou um plano de contingência após uma possível ação de hackers. A movimentação de cargas e navios não foi afetada, mas há possibilidade de lentidão em processos administrativos.", "titulo_pt": "Porto de Santos adota plano de contingência após possível ataque hacker", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 255035, "titulo": "‘We Have to Take Over’: Far-Right Extremists Want to Seize Control of the GOP", "url": "https://www.wired.com/story/we-have-to-take-over-far-right-extremists-want-to-seize-control-of-the-gop/", "fonte_id": "wired", "data_pub": "2026-11-10T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Extremistas da direita afirmam que MAGA não foi suficiente e, após as perdas eleitorais nas eleições intermédiacas, vêem uma oportunidade para assumir o controle do GOP.", "titulo_pt": "‘Nós temos que tomar o controle’: extremistas da direita querem aprovar o GOP", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 254040, "titulo": "Mais da metade das empresas ainda não tem retorno mensurável com IA, aponta pesquisa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/mais-da-metade-das-empresas-ainda-nao-tem-retorno-mensuravel-com-ia-aponta-pesquisa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T16:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa realizada pela Amcham Brasil e pela Humanizadas com 662 executivos revelou que 52% das empresas ainda não conseguem mensurar o retorno dos investimentos em inteligência artificial.", "titulo_pt": "Mais da metade das empresas ainda não tem retorno mensurável com IA, aponta pesquisa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 254785, "titulo": "Alice Huang’s tangled web of connections", "url": "https://www.ft.com/content/3238d92b-4074-478d-a7f2-d78b9e154fc7?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-10T16:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alice Huang, executiva acusada de ser uma espia chinesa, teve um affair com o chefe da Nvidia e já havia construído uma carreira ao lado de uma pessoa com antecedentes de cruzar com reguladores.", "titulo_pt": "Rede complexa de alice Huang, executiva acusada de ser espia chinesa", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 255036, "titulo": "Kitchen Gear From Our Place Is Steeply Discounted", "url": "https://www.wired.com/story/our-place-sale-november-2026/", "fonte_id": "wired", "data_pub": "2026-11-10T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há descontos de até 30% em utensílios de cozinha, com um adicional de $60 para compras acima de $100.", "titulo_pt": "Utensílios de cozinha da nossa loja estão com desconto significativo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 254048, "titulo": "Relação de chefe da Nvidia com chinesa facilitou envio de chips à China, diz site", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/relacao-de-chefe-da-nvidia-com-chinesa-facilitou-envio-de-chips-a-china-diz-site.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T14:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente-executivo da Nvidia, Jensen Huang, teve uma relação com uma empresária chinesa que seria espiã de Pequim, o que facilitou o envio de chips da empresa para empresas chinesas no valor de pelo menos US$7,5 bilhões. Isso foi informado pelo The Information, com base em duas fontes.", "titulo_pt": "Relação de chefe da Nvidia com chinesa facilitou exportação de chips para China, diz site", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 254165, "titulo": "Anthropic lança Claude Sheets, ferramenta própria de planilhas com IA", "url": "https://exame.com/inteligencia-artificial/anthropic-lanca-claude-sheets-ferramenta-propria-de-planilhas-com-ia/", "fonte_id": "exame", "data_pub": "2026-11-10T14:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic lançou a Claude Sheets, uma ferramenta de planilhas com inteligência artificial destinada a assinantes pagos. A ferramenta permite que equipes trabalhem em orçamentos e projetos com a ajuda de um assistente.", "titulo_pt": "Anthropic lança Claude Sheets, ferramenta de planilhas com IA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 254167, "titulo": "Claude entra no Google Meet e começa a trabalhar antes de a reunião acabar", "url": "https://exame.com/inteligencia-artificial/claude-entra-no-google-meet-e-comeca-a-trabalhar-antes-de-a-reuniao-acabar/", "fonte_id": "exame", "data_pub": "2026-11-10T14:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Claude Meetings, em fase de teste para empresas, auxilia durante as reuniões, respondendo no chat e preparando planos e apresentações. O assistente de inteligência artificial entra no Google Meet antes do fim da reunião para auxiliar os participantes.", "titulo_pt": "Claude entra no Google Meet e começa a trabalhar antes do fim da reunião", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 254974, "titulo": "(LEAD) Financial Security Institute reports data leak following hacking attack", "url": "https://en.yna.co.kr/view/AEN20261110010651315", "fonte_id": "yonhap_news", "data_pub": "2026-11-10T14:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Instituto de Segurança Financeira, uma instituição estatal da Coreia do Sul, relatou um vazamento de dados após um ataque hacker.", "titulo_pt": "Instituto de segurança financeira relata vazamento de dados após ataque hacker", "veicu
