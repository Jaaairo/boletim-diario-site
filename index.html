arcerias entre Estado e iniciativa privada, visando aumentar a eficiência. A experiência demonstra como essa colaboração pode ser benéfica.", "titulo_pt": "Modelo regulatório do 5G no Brasil: inovação, paralelos internacionais e avaliação do TCU", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 206910, "titulo": "Cresce o número de brasileiros que vão à Justiça contra o INSS, e ações somam 4,5 milhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/cresce-o-numero-de-brasileiros-que-vao-a-justica-contra-o-inss-e-acoes-somam-45-milhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-10T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de brasileiros que recorreram à Justiça contra o INSS aumentou em 2026, com um total de 4,5 milhões de ações no Judiciário.", "titulo_pt": "Cresce número de brasileiros que vão à Justiça contra o INSS, totalizando 4,5 milhões de ações", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 206912, "titulo": "MBRF Pet inicia exportação aos EUA em busca do maior mercado global para rações de cães e gatos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/mbrf-pet-inicia-exportacao-aos-eua-em-busca-do-maior-mercado-global-para-racoes-de-caes-e-gatos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-10T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A MBRF Pet, divisão de ração para animais de estimação do grupo MBRF, iniciou exportações de alimentos úmidos de maior valor agregado para o mercado dos Estados Unidos. Esses produtos representam mais de 40% do faturamento global do setor.", "titulo_pt": "MBRF Pet inicia exportação aos EUA em busca do maior mercado global para rações de cães e gatos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 206913, "titulo": "Líder em blindagem, Grupo Carbon pede recuperação extrajudicial com dívida de R$ 371,5 mi", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/lider-em-blindagem-grupo-carbon-pede-recuperacao-extrajudicial-com-divida-de-r-3715-mi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-10T03:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Grupo Carbon, empresa líder em blindagem de veículos civis, protocolou um pedido de recuperação extrajudicial para renegociar R$ 371,5 milhões em dívidas no tribunal de São Paulo.", "titulo_pt": "Grupo Carbon pede recuperação extrajudicial com dívida de R$ 371,5 mi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 206914, "titulo": "Como reajuste pelo INCC pode virar armadilha para quem compra imóvel na planta", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/como-reajuste-pelo-incc-pode-virar-armadilha-para-quem-compra-imovel-na-planta.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-10T02:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ao comprar um imóvel na planta, o saldo devedor pode aumentar significativamente devido a reajustes pelo INCC, além da inflação, resultando em um preço final muito maior do que o esperado. Muitos consumidores não se atentam para esse detalhe, o que pode ser uma armadilha financeira.", "titulo_pt": "Como reajuste pelo INCC pode virar armadilha para quem compra imóvel na planta", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 206916, "titulo": "Pobreza também é potencial desperdiçado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/laura-machado/2026/10/pobreza-tambem-e-potencial-desperdicado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-10T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em Betânia do Piauí, moradores enfrentam a estiagem transformando seus quintais em áreas férteis. O município está localizado no semiárido, a cerca de 500 km de Teresina.", "titulo_pt": "Pobreza também é potencial desperdiçado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 206917, "titulo": "A reforma tributária que não foi feita", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/sergio-zimerman/2026/10/a-reforma-tributaria-que-nao-foi-feita.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-10T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há mais de 40 anos administrando empresas, o autor passou por diversas transformações econômicas no Brasil. Ele destaca que grandes mudanças econômicas requerem clareza de objetivo e planejamento. O autor critica a falta de uma reforma tributária efetiva no país.", "titulo_pt": "A reforma tributária que não aconteceu", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 207439, "titulo": "Humans Watched This Supernova Explode Nearly a Millennium Ago. Now You Can See It in High Definition", "url": "https://www.wired.com/story/humans-watched-this-supernova-explode-nearly-a-millennium-ago-now-you-can-see-it-in-high-definition/", "fonte_id": "wired", "data_pub": "2026-10-10T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova imagem não apenas é impressionante, mas também pode fornecer pistas sobre como essa estrela sobreviveu à própria explosão.", "titulo_pt": "Humanos assistiram a esta Supernova explodir há quase um milênio. Agora você pode ver ela em alta definição", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 207384, "titulo": "China unveils AI-powered robot designed to help farmers breed better strains of wheat", "url": "https://www.scmp.com/news/china/science/article/3370437/china-unveils-ai-powered-robot-designed-help-farmers-breed-better-strains-wheat?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-10T09:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China apresentou um protótipo de robô inteligente projetado para auxiliar na seleção de variedades de trigo, como parte de sua estratégia para avançar na tecnologia agrícola e fortalecer a segurança alimentar. O robô foi exibido recentemente em um seminário sobre melhoramento genético de trigo.", "titulo_pt": "China apresenta robô inteligente para auxiliar na seleção de variedades de trigo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 207153, "titulo": "La gran discusión sobre la IA: dónde se ubican los líderes de la industria", "url": "https://www.latercera.com/mundo/noticia/la-gran-discusion-sobre-la-ia-donde-se-ubican-los-lideres-de-la-industria/", "fonte_id": "la_tercera", "data_pub": "2026-10-10T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Após uma série de incidentes envolvendo agentes de IA de grandes empresas e renúncias de especialistas de Anthropic e OpenAI, o debate sobre a necessidade de desacelerar o desenvolvimento de novos modelos de IA ganhou novo impulso, com advertências existenciais. Líderes da indústria discutem se há a necessidade de controles especiais para esta tecnologia e quem deve assegurar a segurança dos novos desenvolvimentos.", "titulo_pt": "Grande debate sobre IA: onde se posicionam os líderes da tecnologia", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 207440, "titulo": "How This Tiny Startup Built the World’s Safest Bike Helmet", "url": "https://www.wired.com/story/how-this-tiny-startup-pikio-built-the-worlds-safest-bike-helmet/", "fonte_id": "wired", "data_pub": "2026-10-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pikio Labs, uma pequena startup de Vancouver, desenvolveu um novo tipo de capacete de bicicleta focado na proteção craniana. Inspirado em picheiros que se bateriam contra árvores, a empresa buscou uma abordagem inovadora para a proteção da cabeça.", "titulo_pt": "Esta pequena Startup construiu o capacete de bicicleta mais seguro do mundo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 207033, "titulo": "IA tem sentimentos? Claude poderá encerrar conversas “cruéis”", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/ia-tem-sentimentos-claude-podera-encerrar-conversas-crueis/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-10T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic atualizou sua política de uso para garantir o bem-estar da IA. A IA Claude pode encerrar conversas consideradas cruéis.", "titulo_pt": "IA tem sentimentos? Claude poderá encerrar conversas ‘cruéis’", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 207046, "titulo": "Jeff Bezos prevê semana de três dias de trabalho graças à inteligência artificial", "url": "https://www.infomoney.com.br/business/global/jeff-bezos-preve-semana-de-tres-dias-de-trabalho-gracas-a-inteligencia-artificial/", "fonte_id": "infomoney", "data_pub": "2026-10-10T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jeff Bezos, fundador da Amazon, prevê que a inteligência artificial pode aumentar a produtividade, reduzir a jornada de trabalho para uma semana de três dias e levar a uma maior prevalência de famílias com renda única.", "titulo_pt": "Jeff Bezos prevê semana de três dias de trabalho graças à inteligência artificial", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 207388, "titulo": "Can China’s dancing robots swing some new business partners in Africa?", "url": "https://www.scmp.com/news/china/diplomacy/article/3370299/can-chinas-dancing-robots-swing-some-new-business-partners-africa?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-10T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em eventos marcando o Dia Nacional da China na África em 1º de outubro, robôs proporcionaram entretenimento. Em Luanda, Angola, robôs dançantes agradaram aos convidados e o embaixador Zhang Bin considerou a indústria como uma pequena amostra da economia chinesa voltada para inovação e desenvolvimento de alta qualidade. Em Brazzaville, Congo, um cão robótico realizou uma apresentação para cerca de 400 convidados, incluindo oficiais congolese e representantes de negócios chineses.", "titulo_pt": "Poderão os robôs dançantes da China atrair novos parceiros de negócios na áfrica?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 206911, "titulo": "SpaceX avança para lançar serviço de operadora móvel da Starlink nos EUA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/10/spacex-avanca-para-lancar-servico-de-operadora-movel-da-starlink-nos-eua.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-10T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SpaceX adquiriu um portfólio de frequências de baixa faixa e está avançando com um serviço de operadora móvel da Starlink nos Estados Unidos, levando a uma queda de cerca de US$ 62 bilhões no valor de mercado combinado das maiores operadoras de telecomunicações do país.", "titulo_pt": "Spacex avança com serviço de operadora móvel Starlink nos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 207348, "titulo": "The world of one trade — AI", "url": "https://www.ft.com/content/3f54c442-c2b7-4876-a960-5229951c9a46?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-10T06:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores têm se tornado exageradamente dependentes das realizações de uma única aposta relacionada ao desenvolvimento de uma tecnologia incerta.", "titulo_pt": "O mundo de uma aposta — IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 207442, "titulo": "Phison posts record September revenue as AI tops half of sales", "url": "https://www.digitimes.com/news/a20261008PD250/phison-revenue-demand-data-medical.html", "fonte_id": "digitimes", "data_pub": "2026-10-10T06:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Phison Electronics registrou receita consolidada de setembro recorde de NT$30,639 bilhões (US$959 milhões), um aumento de 8% em relação a agosto e de 370% em comparação com o mesmo período do ano anterior. A empresa informou que aplicações relacionadas a inteligência artificial representaram mais de 50% das receitas, demonstrando como a demanda está expandindo em armazenamento, computação, networking e infraestrutura de inteligência artificial.", "titulo_pt": "Phison bate recorde em setembro com 50% das receitas provenientes de aplicações de IA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 207443, "titulo": "Trump awards science medal to Elon Musk, Jensen Huang", "url": "https://www.digitimes.com/news/a20261008PD232/ceo-donald-trump-award-nvidia-dell.html", "fonte_id": "digitimes", "data_pub": "2026-10-10T06:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, vai conceder a Medalha Nacional de Ciência a Jensen Huang, CEO da Nvidia, e a outros líderes tecnológicos. O evento, programado para o dia 8 de outubro, visa destacar executivos tecnológicos durante um momento de ênfase na liderança inovadora dos Estados Unidos.", "titulo_pt": "Trump concede medalha de ciência a Jensen Huang e outros líderes tecnológicos", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 207444, "titulo": "Huawei faces price reset as memory costs surge", "url": "https://www.digitimes.com/news/a20261008PD248/huawei-price-business-smartphone-sales.html", "fonte_id": "digitimes", "data_pub": "2026-10-10T06:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do grupo de negócios consumidor da Huawei, Richard Yu, afirmou que os custos crescentes dos componentes de memória estão adicionando mais de 200 dólares americanos ao custo de hardware de cada smartphone Huawei, aumentando a pressão sobre os preços dos telefones.", "titulo_pt": "Huawei enfrenta redefinição de preços devido ao aumento dos custos de memória", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 207445, "titulo": "Zhen Ding posts record September sales on mobile demand and AI applications", "url": "https://www.digitimes.com/news/a20261008PD249/zhen-ding-revenue-mobile-2026-communications.html", "fonte_id": "digitimes", "data_pub": "2026-10-10T06:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Zhen Ding Technology registrou receita consolidada de setembro de 2026 no valor de NT$26,358 bilhões (US$825,13 milhões), um aumento de 36,13% em comparação com o mesmo período do ano anterior e de 27,54% em relação a agosto. O resultado reflete pedidos fortes de produtos de comunicação móvel e o crescimento contínuo de suas operações de servidores, módulos ópticos e substratos de IC.", "titulo_pt": "Zhen Ding estabelece novo recorde em vendas de setembro com demanda móvel e aplicações de IA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 207446, "titulo": "TPCA Show 2026 to spotlight AI computing, Unimicron chair keynote", "url": "https://www.digitimes.com/news/a20261008PD253/tpca-2026-unimicron-demand-hardware.html", "fonte_id": "digitimes", "data_pub": "2026-10-10T06:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A demanda explosiva para computação de inteligência artificial está impulsionando mudanças na arquitetura de hardware. O Taiwan Printed Circuit Association (TPCA) está promovendo sua conferência anual, a 21ª International Microsystems, Packaging, Assembly and Circuits Technology Conference (IMPACT-IAAC 2026), que começará em 19 de outubro, seguida pela 27ª TPCA Show 2026 de 20 a 22 de outubro.", "titulo_pt": "TPCA Show 2026 destaca computação de inteligência artificial, com keynote da Unimicron", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 207447, "titulo": "Unified memory lifts AI PC ambitions as Chinese open models gain local-inference ground", "url": "https://www.digitimes.com/news/a20261008VL215/hardware-ai-pc-pc-market-windows.html?chid=10", "fonte_id": "digitimes", "data_pub": "2026-10-10T06:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O limite entre a IA em larga escala na nuvem e a inferência local está se tornando cada vez mais permeável, enquanto fabricantes de PCs expandem a capacidade de memória e plataformas de software tornam modelos abertos maiores mais fáceis de executar diretamente nos dispositivos. As modelos abertos chineses estão ganhando terreno na inferência local.", "titulo_pt": "Memória unificada eleva aspirações de pcs de IA enquanto modelos abertos chineses ganham espaço na inferência local", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 207448, "titulo": "Semco moves glass substrates to package-level testing", "url": "https://www.digitimes.com/news/a20261008VL220/semco-glass-substrate-testing-expansion.html", "fonte_id": "digitimes", "data_pub": "2026-10-10T06:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samsung Electro-Mechanics (Semco) concluiu testes iniciais de confiabilidade em substratos de vidro de 100mm e passou para a verificação do nível de pacote usando chips de clientes, avançando para a comercialização de tecnologia de embalagem avançada. Essa evolução ocorre enquanto a empresa expande seu negócio existente de substratos de semicondutores e enfrenta incertezas sobre o cronograma de comercialização dos substratos de vidro.", "titulo_pt": "Semco conclui testes iniciais de substratos de vidro de 100mm", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 206881, "titulo": "Neandertais utilizaram madeira para produzir armas e diversos utensílios domésticos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/neandertais-utilizaram-madeira-para-produzir-armas-e-diversos-utensilios-domesticos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores descobriram uma grande variedade de utensílios domésticos e armas feitos de madeira pelos neandertais que habitaram uma caverna na Catalunha, Espanha. Essa descoberta sugere uma versatilidade artesanal não comumente associada a esses primos humanos extintos.", "titulo_pt": "Neandertais utilizaram madeira para produzir armas e diversos utensílios domésticos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 207387, "titulo": "How DNA ‘fingerprinting’ is keeping Malaysia’s green turtles safe from poachers", "url": "https://www.scmp.com/week-asia/health-environment/article/3370371/how-dna-fingerprinting-keeping-malaysias-green-turtles-safe-poachers?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-10T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A lombada de areia de Mataking Island, no litoral leste de Sabah, é o ponto de partida para uma pequena tartaruga verde que se dirige para o mar em busca de uma jornada que pode percorrer milhares de quilômetros. Cada ano, dezenas de milhares de tartarugas verdes emergem nas praias de Sabah para desovar, incluindo a filha dessa tartaruga recém-nascida.", "titulo_pt": "Como a 'fingerprintagem' genética está protegendo tartarugas verdes de malásia contra caçadores ilegais", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 207458, "titulo": "APOD: 2026 October 10 – Lunar Farside", "url": "https://science.nasa.gov/image-article/apod-2026-october-10-lunar-farside/", "fonte_id": "nasa_news", "data_pub": "2026-10-10T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da APOD em 10 de outubro de 2026 mostra a face oculta da Lua. Tidally", "titulo_pt": "Imagem do dia: 10 de outubro de 2026 – face oculta da lua", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 207406, "titulo": "Chinese police crack real-life ‘Breaking Bad’ drug lab, arresting ex-chemistry professor", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3370405/chinese-police-crack-real-life-breaking-bad-drug-lab-arresting-ex-chemistry-professor?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-10T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Polícia chinesa desmantelou recentemente uma organização de tráfico de drogas internacional que supostamente envolvia um ex-professor de química e um graduado em mestrado na produção de drogas. O caso virou viral na China, onde os usuários de mídias sociais deram o título 'China's Breaking Bad' em referência à famosa série americana.", "titulo_pt": "Polícia chinesa desmantela laboratório de drogas real-life 'Breaking Bad'", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 207455, "titulo": "Mountaineer: 'Tenzing biopic made me wonder what he would think if he could return to the mountain today'", "url": "https://phys.org/news/2026-10-mountaineer-tenzing-biopic-mountain-today.html", "fonte_id": "phys_org", "data_pub": "2026-10-10T01:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Setenta e três anos atrás, Tenzing Norgay chegou ao topo do Monte Everest, conhecido como Chomolungma no tibetano, que significa aproximadamente 'Mãe Gêmea do Mundo'.", "titulo_pt": "Alpinista: 'biografia de tenzing me fez questionar o que ele pensaria se pudesse retornar ao monte hoje'}", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 207456, "titulo": "Geologists uncover evidence of a missing Late Cretaceous magmatic arc in northwestern Iran", "url": "https://phys.org/news/2026-10-geologists-uncover-evidence-late-cretaceous.html", "fonte_id": "phys_org", "data_pub": "2026-10-10T00:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Geólogos identificaram evidências de uma arco magmático continental do Cretáceo tardio que era anteriormente desconhecido na região norte-oeste da Irã. Montanhas preservam registros geológicos de oceanos antigos, continentes em movimento e processos tectônicos que moldaram a Terra ao longo de milhões de anos.", "titulo_pt": "Geólogos descobrem evidências de um arco magmático continental perdido do cretáceo tardio no norte-oeste da Irã", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 207457, "titulo": "Food testing reveals how diet can add to exposure to 'forever chemicals'", "url": "https://phys.org/news/2026-10-food-reveals-diet-exposure-chemicals.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T23:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Per- e polifluorocarbonos (PFAS), conhecidos como 'químicos eternos', são amplamente utilizados devido às suas propriedades não aderentes, repelentes à água e resistentes ao óleo. Esses químicos estão presentes em todo o ambiente devido à sua resistência à degradação.", "titulo_pt": "Testes de alimentos revelam como a dieta pode aumentar a exposição a 'químicos eternos'", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 206820, "titulo": "Three quantum-inspired cores leave opposite fingerprints on the ringing of black holes", "url": "https://phys.org/news/2026-10-quantum-cores-fingerprints-black-holes.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três núcleos inspirados pela quântica deixam impressões opostas no som do relógio de um buraco negro. A teoria de Einstein prediz que qualquer coisa que caia em um buraco negro é comprimida em um singularidade, um ponto de infinita densidade onde a teoria se desintegra. Os físicos esperam que a gravidade quântica substitua esse ponto por algo finito, mas o centro permanece oculto atrás do horizonte de eventos.", "titulo_pt": "Três núcleos inspirados pela quântica deixam impressões opostas no som do relógio de buracos negros", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 206651, "titulo": "Controversial vaccine trial touted by RFK Jr gets go-ahead in Guinea-Bissau", "url": "https://www.theguardian.com/society/2026/oct/09/vaccine-trial-guinea-bissau-rfk-jr", "fonte_id": "guardian_world", "data_pub": "2026-10-09T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo controverso que irá withhold a vacina contra hepatite B para alguns recém-nascidos africanos foi aprovado para prosseguir. O secretário dos EUA para Saúde e Serviços Humanos, Robert F Kennedy Jr, que é um oponente histórico da vacina, é um dos principais promotores deste estudo.", "titulo_pt": "Estudo controverso que withholds vacina contra hepatite b de recém-nascidos em guiné-bissau é aprovado", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 206390, "titulo": "Entenda por que nuvem de gelo gigante em Marte surge e desaparece diariamente; veja imagens", "url": "https://veja.abril.com.br/ciencia/entenda-por-que-nuvem-de-gelo-gigante-em-marte-surge-e-desaparece-diariamente-veja-imagens/", "fonte_id": "veja", "data_pub": "2026-10-09T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A nuvem de gelo gigante chamada Nuvem Alongada de Arsia Mons (AMEC) surge e desaparece diariamente em Marte. Ela tem quase o dobro do tamanho do Reino Unido.", "titulo_pt": "Entenda por que nuvem de gelo gigante em Marte surge e desaparece diariamente; veja imagens", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 206818, "titulo": "STAT+: Biotech leader, leading lab leak theorist no longer in consideration for top infectious disease role", "url": "https://www.statnews.com/2026/10/09/steven-quay-no-longer-in-consideration-for-top-infectious-disease-role/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-09T21:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Steven Quay, um executivo da biotecnologia sem formação em doenças infecciosas, não está mais sendo considerado para o cargo de diretor da National Institute for Allergy and Infectious Diseases.", "titulo_pt": "Líder da biotecnologia e principal teórico da fuga do laboratório não são mais em consideração para cargo de liderança em doenças infecciosas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 206834, "titulo": "Major earthquake strikes Panama—damage and injuries are expected", "url": "https://www.scientificamerican.com/article/major-earthquake-strikes-panama-damage-and-injuries-are-expected/", "fonte_id": "scientific_american", "data_pub": "2026-10-09T20:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de natureza de deslizamento lateral ocorreu em Panamá, e é esperado que possam seguir fortes réplicas.", "titulo_pt": "Grande terremoto atinge panamá—danos e feridos são esperados", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 206821, "titulo": "Aspens 'remember' past drought in their leaves, 3-year experiment finds", "url": "https://phys.org/news/2026-10-aspens-drought-year.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um experimento de três anos descobriu que aspenes podem criar 'memórias funcionais' das secas anteriores através da química de suas folhas. As secas aparecem como faixas finas em anéis de crescimento anuais dos árvores.", "titulo_pt": "Aspenes 'memorizam' secas passadas nas suas folhas, diz estudo de 3 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 206822, "titulo": "Plant-bacteria partnership reveals how roots access iron locked in soil", "url": "https://phys.org/news/2026-10-bacteria-partnership-reveals-roots-access.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa liderada por Paul Schulze-Lefert, do Instituto Max Planck para a Pesquisa de Crípsida Vegetal em Colônia, em colaboração com Ricardo F.H. Giehl, do Instituto Leibniz de Genética Vegetal e Pesquisa em Plantas de Culti, descobriu como as plantas Arabidopsis adaptam sua comunicação química com a microbiota bacteriana das raízes para maximizar a obtenção de ferro inutilizável do solo ácido ou calcário. O estudo foi publicado na revista Cell.", "titulo_pt": "Parceria planta-bactéria revela como as raízes acessam ferro preso no solo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 206833, "titulo": "PAHO assesses risk of measles spread as very high ahead of religious mass gatherings in the Americas", "url": "https://www.paho.org/en/news/9-10-2026-paho-assesses-risk-measles-spread-very-high-ahead-religious-mass-gatherings-americas", "fonte_id": "paho", "data_pub": "2026-10-09T20:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PAHO avaliou o risco de propagação da rubéola como muito alto antes das grandes reuniões religiosas na América. Essa avaliação foi feita em 9 de outubro de 2026.", "titulo_pt": "PAHO considera risco de propagação da rubéola muito alto antes das grandes reuniões religiosas na américa", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 206835, "titulo": "How Hurricane Isaias got so dangerously strong so fast", "url": "https://www.scientificamerican.com/article/how-hurricane-isaias-got-so-dangerously-strong-so-fast/", "fonte_id": "scientific_american", "data_pub": "2026-10-09T20:05:00Z", "idioma": "en", "Argentina", "classe": "B"}, {"id": 207127, "titulo": "Malvinas: la huella rural que une a las islas con la Patagonia", "url": "https://www.lanacion.com.ar/economia/campo/malvinas-la-huella-rural-que-une-a-las-islas-con-la-patagonia-nid10102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-10T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A relação entre as Ilhas Malvinas e a Patagônia se baseia no trabalho rural e na memória de pessoas que participaram de eventos cruciais para o caso argentino.", "titulo_pt": "Malvinas: o legado rural que une as ilhas à patagônia", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 207461, "titulo": "‘I just wasn’t going to give up’: the fight to free the longest-serving political prisoner in the US", "url": "https://www.theguardian.com/film/2026/oct/10/free-leonard-peltier-netflix-documentary", "fonte_id": "guardian_culture", "data_pub": "2026-10-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Leonard Peltier, um ativista indígena e líder do American Indian Movement, teve sua sentença de vida commutada após 49 anos de prisão em 20 de janeiro de 2025, por ordem do presidente Joe Biden. Peltier, considerado por muitos como o prisioneiro político mais longevidade dos EUA, foi acusado de ter matado dois agentes do FBI durante uma ação policial.", "titulo_pt": "‘Eu não IA desistir’: a luta para libertar o prisioneiro político mais antigo dos EUA", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 207157, "titulo": "Crítica de discos: Paul McCartney siempre vuelve, Gepe reencanta sus canciones y Fother Muckers es pura energía", "url": "https://www.latercera.com/culto/noticia/critica-de-discos-paul-mccartney-siempre-vuelve-gepe-reencanta-sus-canciones-y-fother-muckers-es-pura-energia/", "fonte_id": "la_tercera", "data_pub": "2026-10-10T08:58:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Paul McCartney, rancesa Sophie Adenot retornou à Terra após 235 dias na Estação Espacial Internacional, o período mais longo de permanência orbital consecutiva por um astronauta europeu.", "titulo_pt": "Astronauta francesa Sophie Adenot passou por 'todas as emoções humanas' durante missão de oito meses", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 207386, "titulo": "Guangdong yachts to sail into Hong Kong from Friday under southbound scheme", "url": "https://www.scmp.com/news/hong-kong/transport/article/3370436/guangdong-yachts-sail-hong-kong-friday-under-southbound-scheme?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-10T08:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A partir da próxima sexta-feira, barcos registrados na província de Guangdong poderão navegar nas águas de Hong Kong de acordo com um novo esquema de viagem. A secretária para Transportes e Logística de Hong Kong, Mable Chan, confirmou a cerimônia de estreia para o esquema de viagem de barcos sul-europeus será realizada no dia do lançamento.", "titulo_pt": "Yates de guangdong poderão navegar em Hong Kong a partir da próxima sexta-feira", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 207459, "titulo": "‘People forgot I existed’: Audrey Niffenegger on taking 14 years to write a sequel to The Time Traveler’s Wife", "url": "https://www.theguardian.com/books/2026/oct/10/people-forgot-i-existed-audrey-niffenegger-on-taking-14-years-to-write-a-sequel-to-the-time-travelers-wife", "fonte_id": "guardian_culture", "data_pub": "2026-10-10T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Audrey Niffenegger demorou 14 anos para escrever a sequência de seu best-seller 'O Viúvo do Tempo'. O novo romance aborda cenários políticos futuros, contrastando com o clima político positivo que prevalecia quando ela começou a escrever em 2012.", "titulo_pt": "Pessoas esqueceram que eu existo: audrey Niffenegger sobre ança, afirma que as atuais protestos estudantis não indicam um novo Maior de 68. Ele considera essa situação uma coyuntura política importante para o candidato izquierdista Jean-Luc Mélenchon, devido à afinidade entre seu eleitorado e uma parte da juventude mobilizada.", "titulo_pt": "Mathieu Gallard, diretor de estudos de Ipsos França: ‘as atuais protestos estudiantis não significam um novo maior de 68’", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 207201, "titulo": "‘We’re not asking for luxury’: school protesters in Paris suburb feel abandoned by French state", "url": "https://www.theguardian.com/world/2026/oct/10/school-protesters-sevran-paris-suburb-france", "fonte_id": "guardian_world", "data_pub": "2026-10-10T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alunos em Sevran, uma região suburbana pobre ao norte de Paris, relatam condições precárias nas escolas, com falta de mobiliário e superlotação, o que leva a continuarem as manifestações para poder retornar às aulas. Eles afirmam que não buscam conforto, mas condições adequadas para o ensino.", "titulo_pt": "Nós não estamos pedindo luxo: estudantes em sevran se sentem abandonados pelo estado francês", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 207007, "titulo": "Larvas na cabeça: pais presos por maus-tratos barraram assistente social", "url": "https://www.metropoles.com/distrito-federal/na-mira/larvas-na-cabeca-pais-presos-por-maus-tratos-barraram-assistente-social", "fonte_id": "metropoles", "data_pub": "2026-10-10T05:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A assistente social encontrou uma criança com larvas no couro cabelo e um bebê com marcas roxas. Os pais foram presos acusados de maus-tratos.", "titulo_pt": "Larvas na cabeça: pais presos por maus-tratos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 207269, "titulo": "Why French students are so angry about Parcoursup, the higher education access platform", "url": "https://www.lemonde.fr/en/campus/article/2026/10/10/why-french-students-are-so-angry-about-parcoursup-the-higher-education-access-platform_6758447_11.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-10T03:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A plataforma Parcoursup, responsável pelo acesso às instituições de ensino superior na França, é alvo de críticas dos estudantes, que estão em protesto pedindo sua reconsideração ou remoção total.", "titulo_pt": "Por que os estudantes franceses estão tão irritados com a plataforma Parcoursup de acesso ao ensino superior", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 207273, "titulo": "Denmark set to allow the return of 'physical force' to maintain order in schools", "url": "https://www.lemonde.fr/en/international/article/2026/10/10/denmark-set-to-allow-the-return-of-physical-force-to-maintain-order-in-schools_6758443_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-10T01:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Dinamarca permitirá que os professores usem força física para manter a ordem nas escolas a partir de agosto de 2027, permitindo que eles 'segurem, mantenham um aluno em lugar algum ou levem um aluno para outra sala' se o aluno perturbar a aula.", "titulo_pt": "Dinamarca planeja permitir o uso de força física para manter a ordem nas escolas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 207011, "titulo": "Governo da Bolívia censura estação de rádio comunitária Kausachun Coca", "url": "https://www.brasildefato.com.br/2026/10/09/governo-da-bolivia-censura-estacao-de-radio-comunitaria-kausachun-coca/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-10T00:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Autoridade de Regulação e Supervisão de Telecomunicações e Transportes da Bolívia revogou as licenças de seis frequências da rád ud", "url": "https://www.latercera.com/sustentabilidad/noticia/el-costo-de-no-anticiparse-a-los-riesgos-climaticos-en-el-sistema-de-salud/", "fonte_id": "la_tercera", "data_pub": "2026-10-10T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute os custos associados à falta de preparo para os riscos climáticos no sistema de saúde. Ele destaca como a não-anticipação pode impactar negativamente o sistema de saúde.", "titulo_pt": "O custo de não se antecipar aos riscos climáticos no sistema de saúde", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 207297, "titulo": "Life-threatening Hurricane Isaias makes landfall in Florida, bringing high winds and heavy rain", "url": "https://www.euronews.com/2026/10/10/life-threatening-hurricane-isaias-makes-landfall-in-florida-bringing-high-winds-and-heavy-", "fonte_id": "euronews", "data_pub": "2026-10-10T07:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Isaias atingiu a Flórida, trazendo ventos fortes e chuva intensa. O Serviço Meteorológico Nacional dos Estados Unidos advertiu sobre uma elevada onda costeira perigosa entre Dauphin Island, Alabama, e Suwannee, Flórida.", "titulo_pt": "Furacão Isaias atinge flórida, trazendo ventos fortes e chuva intensa", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 207041, "titulo": "Mudanças bruscas de clima impactam a circulação e o coração; entenda riscos", "url": "https://www.cnnbrasil.com.br/saude/mudancas-bruscas-de-clima-impactam-a-circulacao-e-o-coracao-entenda-riscos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-10T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mudanças bruscas de temperatura afetam a circulação e o coração, com o calor dilatando os vasos e baixando a pressão, enquanto o frio os contrai e eleva a frequência cardíaca. Crianças, idosos e pessoas com doenças crônicas são os grupos mais vulneráveis a esses efeitos.", "titulo_pt": "Mudanças bruscas de clima impactam a circulação e o coração; entenda riscos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 207407, "titulo": "Malaysia urged to police its firms in Indonesia as haze shuts schools", "url": "https://www.scmp.com/week-asia/health-environment/article/3370388/malaysia-urged-police-its-firms-indonesia-haze-shuts-schools?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-10T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Malásia enfrenta pressão para intensificar o controle sobre suas empresas em relação a supostas conexões com incêndios florestais no exterior, devido à neblina recorrente da Indonésia que continua interrompendo aulas e a vida cotidiana, apesar dos esforços regionais para resolver o problema há anos. As escolas em várias regiões do país foram fechadas e eventos esportivos no fim de semana foram cancelados.", "titulo_pt": "Malásia pressionada a monitorar empresas em razão da neblina na indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 206064, "titulo": "Environmental research academy honored by ARTDO", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/10/2003865726", "fonte_id": "taipei_times", "data_pub": "2026-10-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A acadêmica de pesquisa ambiental foi honrada pelo ARTDO.", "titulo_pt": "Academia de pesquisa ambiental homenageada pelo ARTDO", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 206580, "titulo": "Radares, mallas y piletas de contención: el plan para evitar otro aluvión destructivo en Chile ante la amenaza de El Niño", "url": "https://www.clarin.com/mundo/radares-mallas-piletas-contencion-plan-evitar-aluvion-destructivo-chile-amenaza-nino_0_OZsKEAZoeb.html", "fonte_id": "clarin", "data_pub": "2026-10-09T21:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo chileno está avaliando investimentos milionários para evitar efeitos de possíveis torrentes de barro e água, como ocorreu em Las Condes. A prefeita da principal comuna afetada reivindica que o orçamento deve ser alocado urgentemente.", "titulo_pt": "Radares, malhas e piscinas de contenção: o plano para evitar outro aluvão destrutivo no Chile diante da ameaça de El Niño", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 206397, "titulo": "Terremoto de magnitude 7,6 atinge o Panamá e alerta de tsunami é ativado", "url": "https://veja.abril.com.br/mundo/terremoto-de-magnitude-76-atinge-o-panama-e-alerta-de-tsunami-e-ativado/", "fonte_id": "veja", "data_pub": "2026-10-09T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 7,6 atingiu o Panamá, levando à suspensão de aulas, operações aeroportuárias e linhas de metrô. Há relatos de danos a edifícios e interrupção de energia em seis províncias.", "titulo_pt": "Terremoto de magnitude 7,6 atinge o Panamá e suspensão de atividades é decretada", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 206412, "titulo": "Chile decreta alerta vermelho depois de deslizamento em Santiago", "url": "https://www.poder360.com.br/poder-internacional/chile-decreta-alerta-vermelho-depois-de-deslizamento-em-santiago/", "fonte_id": "poder360", "data_pub": "2026-10-09T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Chile decretou um alerta vermelho após um deslizamento de terra em Santiago. A enxurrada de água e lama danificou casas e veículos, e as chuvas estão associadas ao fenômeno El Niño.", "titulo_pt": "Chile decretou alerta vermelho após deslizamento em Santiago", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 206456, "titulo": "Universitários inspirados por obra de arte cobrem geleira com manta gigante de lã – e acabam desacelerando em 50% seu derretimento", "url": "https://www.cnnbrasil.com.br/curiosidades/universitarios-inspirados-por-obra-de-arte-cobrem-geleira-com-manta-gigante-de-la-e-acabam-desacelerando-em-50-seu-derretimento/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-09T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Universitários inspirados por uma exposição de fotografia transformaram lãs que iriam para o lixo em uma manta gigante que cobriu uma geleira, resultando em uma redução de 50% no derretimento da geleira. O projeto, conhecido como 'snow farming', visa preservar a neve durante o verão.", "titulo_pt": "Universitários inspirados por obra de arte cobrem geleira com manta gigante de lã e desaceleram derretimento em 50%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 206771, "titulo": "Injured Orangutan rescued from Indonesia wildfires", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/9/injured-orangutan-rescued-from-indonesia-wildfires?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-09T19:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um jovem orangotango foi resgatado de incêndios florestais na Ilha de Borneu, na Indonésia.", "titulo_pt": "Orangotango jovem resgatado de incêndios na ilha de borneu, na indonésia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 205499, "titulo": "Furacão Isaías avança e traz mais pressões nos preços dos combustíveis dos EUA", "url": "https://www.infomoney.com.br/economia/furacao-isaias-avanca-e-traz-mais-pressoes-nos-precos-dos-combustiveis-dos-eua/", "fonte_id": "infomoney", "data_pub": "2026-10-09T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O furacão Isaías está se movendo em direção à produção e ao refino de petróleo dos Estados Unidos, o que pode aumentar as pressões sobre os preços dos combustíveis no país.", "titulo_pt": "Furacão Isaías avança e aumenta pressões sobre preços dos combustíveis nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 205483, "titulo": "Estudo da Fiocruz detecta cocaína em cinco rios do Rio de Janeiro", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/rj/estudo-da-fiocruz-detecta-cocaina-em-cinco-rios-do-rio-de-janeiro/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-09T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Fiocruz detectou cocaína em cinco rios do Rio de Janeiro, com contaminação que supera níveis encontrados em outros cinco países. Os ensaios indicaram que a substância causou mortes, deformações, alterações cardiovasculares e neurológicas em organismos aquáticos.", "titulo_pt": "Estudo da Fiocruz detecta cocaína em cinco rios do Rio de Janeiro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 206169, "titulo": "African antelopes spreading in New Mexico: How far could they go under climate change?", "url": "https://phys.org/news/2026-10-african-antelopes-mexico-climate.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gemsbok, antílopes africanos introduzidos no Novo México nos anos 1960 e 1970, se estendem mais de 100 quilômetros desde o ponto de introdução. Pesquisadores da Universidade de Illinois Urbana-Champaign atribuem isso às adaptações excepcionais desses animais para condições áridas, que eles prevêem se expandir significativamente devido ao aquecimento global.", "titulo_pt": "Gemsbok africanos se espalhando no novo México: como o aquecimento global poderia afetar sua expansão?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 205322, "titulo": "Menos de 5% das empresas cumprem lei de reciclagem de eletrônicos no Brasil, diz associação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/10/menos-de-5-das-empresas-cumprem-lei-de-reciclagem-de-eletronicos-no-brasil-diz-associacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": n az/", "fonte_id": "exame", "data_pub": "2026-10-09T06:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Navi Pillay se tornou a 21ª mulher a ganhar o Prêmio Nobel da Paz. A lista de mulheres vencedoras começa em 1905, com a austríaca Bertha von Suttner.", "titulo_pt": "Quem são as 21 mulheres que já ganharam o Prêmio Nobel da Paz", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 204839, "titulo": "Egyptian journalists plan weekend protest over detention of six colleagues", "url": "https://www.theguardian.com/global-development/2026/oct/09/egypt-six-journalists-matsadaash-protest-over-detentions", "fonte_id": "guardian_world", "data_pub": "2026-10-09T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jornalistas do Egito planejam uma nova protesto no fim de semana em Cairo após seis de seus colegas serem acusados de terrorismo e terem sido presos por supostamente trabalhar para o Irmão Muçulmano. Os funcionários do Matsadaash afirmam ter sofrido tortura e confissões forçadas durante a detenção.", "titulo_pt": "Jornalistas egípcios planejam protesto no fim de semana por detenção de seis colegas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 205029, "titulo": "Christa Pike case underscores prevalence of botched executions in US", "url": "https://www.aljazeera.com/news/2026/10/9/christa-pike-case-underscores-prevalence-of-botched-executions-in-us?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-09T02:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos afirmam que métodos como a injeção letal prometem uma forma mais humana de execução, mas são frequentemente comprometidos por erros. O caso de Christa Pike ilustra a prevalência de execuções mal-sucedidas nos Estados Unidos.", "titulo_pt": "Caso christa Pike evidencia a prevalência de execuções mal-sucedidas nos EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 205 s": "EUA", "classe": "B"}, {"id": 206625, "fonte_id": "nyt_world", "titulo": "Ukrainian Drones Close Moscow Airports as Putin Flies Back to Russia", "url": "https://www.nytimes.com/2026/10/09/world/europe/russia-putin-plane-ukraine.html", "data_pub": "2026-10-09T20:15:00Z", "topico": "politica_internacional", "idioma": "en", "titulo_pt": "Drones ucranianos perturbam aeroportos de moscou enquanto Putin retorna à Rússia", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}], "destaque": {"titulo_evento": "Nobel da Paz para Navi Pillay e Impactos Globais", "texto_pt": "Navi Pillay, ex-chefe das Nações Unidas para os direitos humanos, ganhou o Prêmio Nobel da Paz em 2026, reconhecendo seu trabalho em promover a paz e o direito internacional. A premiação levantou questões geopolíticas significativas, com os Estados Unidos impor sanções ao Tribunal Penal Internacional (TPI) após um ex-membro ganhar o prêmio. Essas sanções foram rejeitadas pela ONU e expressaram preocupação por parte de países como o Japão. O caso de Gaza foi um dos principais focos do trabalho de Pillay, com a comissão que ela liderou concluindo que Israel cometeu genocídio contra palestinos, uma afirmação rejeitada pelo governo israelense. Além disso, o prêmio também teve implicações econômicas e diplomáticas, com o TPI enfrentando sanções que afetaram sua capacidade operacional e credibilidade internacional. O reconhecimento de Pillay como defensora dos direitos humanos e da justiça internacional reforça a importância de instituições como o TPI em promover a responsabilização por crimes internacionais.", "data_edicao": "2026-10-10", "artigos": [{"id": 207285, "titulo": "Navanethem 'Navi' Pillay wins the Nobel Peace Prize", "url": "https://www.france24.com/en/video/20261010-navanethem-navi-pillay-wins-the-nobel-peace-prize", "fonte_id": "france24", "data_pub": "2026-10-10T09:25:00Z", "topico": "politica_internacional", "idioma": "en", "texto_resumo": "Navanethem 'Navi' Pillay, ex-chefe das Nações Unidas para os direitos humanos e juíza do Tribunal Internacional de Justiça, ganhou o Prêmio Nobel da Paz em Oslo, Noruega, nesta sexta-feira.", "titulo_pt": "Navi Pillay vence prêmio Nobel da paz", "texto_pt": "Navanethem 'Navi' Pillay, ex-chefe das Nações Unidas para os direitos humanos e juíza do Tribunal Internacional de Justiça, ganhou o Prêmio Nobel da Paz em Oslo, Noruega, nesta sexta-feira.", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 207268, "titulo": "Nobel Peace Prize: Navanethem Pillay, a tireless advocate for international justice", "url": "https://www.lemonde.fr/en/le-monde-africa/article/2026/10/10/nobel-peace-prize-navanethem-pillay-a-tireless-advocate-for-international-justice_6758438_124.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-09T22:18:00Z", "topico": "cultura", "idioma": "en", "texto_resumo": "Navanethem Pillay, juíza sul-africana de 85 anos que serviu no Tribunal Penal Internacional para Ruanda na década de 1990, recentemente presidiu a Comissão de Inquérito da Convenção dos Direitos Humanos das Nações Unidas, que concluiu que um 'genocídio' estava ocorrendo em Gaza.", "titulo_pt": "Prêmio nobel da paz: navanethem Pillay, uma defensora incansável da justiça internacional", "texto_pt": "Navanethem Pillay, juíza sul-africana de 85 anos que serviu no Tribunal Penal Internacional para Ruanda na década de 1990, recentemente presidiu a Comissão de Inquérito da Convenção dos Direitos Humanos das Nações Unidas, que concluiu que um 'genocídio' estava ocorrendo em Gaza.", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 207372, "titulo": "U.S. sanctions ICC after former judge wins Nobel Peace Prize", "url": "https://www.japantimes.co.jp/news/2026/10/10/world/icc-us-sanctions/", "fonte_id": "japan_times", "data_pub": "2026-10-09T22:02:00Z", "topico": "politica_internacional", "idioma": "en", "texto_resumo": "A ICC (Corte Penal Internacional) foi sanacionada pelos Estados Unidos após um ex-julgador ganhar o Prêmio Nobel da Paz. A ministra da diplomacia do Japão expressou sua preocupação, afirmando que a sanção é incompatível com a posição do país.", "titulo_pt": "EUA sanacionam ICC após ex-juiz vencer prêmio Nobel da paz", "texto_pt": "A ICC (Corte Penal Internacional) foi sanacionada pelos Estados Unidos após um ex-julgador ganhar o Prêmio Nobel da Paz. A ministra da diplomacia do Japão expressou sua preocupação, afirmando que a sanção é incompatível com a posição do país.", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 206420, "titulo": "ONU rechaça sanções de Trump contra TPI após juíza sul-africana ganhar Nobel da Paz", "url": "https://www.brasildefato.com.br/2026/10/09/onu-rechaca-sancoes-de-trump-contra-tpi-apos-juiza-sul-africana-ganhar-nobel-da-paz/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-09T21:29:00Z", "topico": "politica_internacional", "idioma": "pt", "texto_resumo": "O alto comissário da ONU para os Direitos Humanos, Volker Türk, considerou as sanções impostas pelo governo dos EUA contra o Tribunal Penal Internacional como inaceitáveis. Essas sanções foram uma resposta às premiações da ex-juíza Navi Pillay com o Nobel da Paz.", "titulo_pt": "ONU rechaça sanções de Trump contra TPI após juíza sul-africana ganhar Nobel da Paz", "texto_pt": "O alto comissário da ONU para os Direitos Humanos, Volker Türk, considerou as sanções impostas pelo governo dos EUA contra o Tribunal Penal Internacional como inaceitáveis. Essas sanções foram uma resposta às premiações da ex-juíza Navi Pillay com o Nobel da Paz.", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 206678, "titulo": "Nobel Peace Prize Goes to Former ICC Judge", "url": "https://foreignpolicy.com/2026/10/09/nobel-peace-prize-navi-pillay-icc-israel-genocide-gaza-us-trump-sanctions/", "fonte_id": "foreign_policy", "data_pub": "2026-10-09T20:51:00Z", "topico": "politica_internacional", "idioma": "en", "texto_resumo": "O Prêmio Nobel da Paz foi concedido a um ex-julgador da Corte Penal Internacional. Os Estados Unidos impuseram novas sanções à entidade internacional em resposta.", "titulo_pt": "Prêmio nobel da paz para ex-julgador da corte penal internacional", "texto_pt": "O Prêmio Nobel da Paz foi concedido a um ex-julgador da Corte Penal Internacional. Os Estados Unidos impuseram novas sanções à entidade internacional em resposta.", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 206765, "titulo": "Human rights veteran Navi Pillay wins 2026 Nobel Peace Prize", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/9/human-rights-veteran-navi-pillay-wins-2026-nobel-peace-prize?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-09T20:29:00Z", "topico": "cultura", "idioma": "en", "texto_resumo": "A jurista sul-africana Navanethem Pillay foi premiada com o Prêmio Nobel da Paz de 2026 por seu trabalho na promoção da paz.", "titulo_pt": "Veterana dos direitos humanos Navi Pillay ganha prêmio Nobel da paz de 2026", "texto_pt": "A jurista sul-africana Navanethem Pillay foi premiada com o Prêmio Nobel da Paz de 2026 por seu trabalho na promoção da paz.", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 205718, "titulo": "Navi Pillay, South African Jurist, Is Awarded the Nobel Peace Prize", "url": "https://www.nytimes.com/2026/10/09/world/europe/nobel-peace-prize-navi-pillay.html", "fonte_id": "nyt_world", "data_pub": "2026-10-09T17:55:00Z", "topico": "politica_internacional", "idioma": "en", "texto_resumo": "Navi Pillay, jurista sul-africana, foi premiada com o Prêmio Nobel da Paz. Sua nomeação gerou críticas de Israel devido à sua liderança de uma comissão da ONU que afirmou que o país cometeu genocídio contra os palestinos.", "titulo_pt": "Navi Pillay, jurista sul-africana, ganha prêmio Nobel da paz", "texto_pt": "Navi Pillay, jurista sul-africana, foi premiada com o Prêmio Nobel da Paz. Sua nomeação gerou críticas de Israel devido à sua lide or seus esforços em promover a paz e o direito internacional. Ela dedica o prêmio aos sobreviventes de crimes internacionais.", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 205952, "titulo": "‘Rogue court’: US sanctions ICC hours after ex-judge wins Nobel Prize", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/9/rogue-court-us-sanctions-icc-hours-after-ex-judge-wins-nobel-prize?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-09T15:59:00Z", "topico": "geopolitica", "idioma": "en", "texto_resumo": "O Secretário de Estado dos Estados Unidos, Marco Rubio, anunciou sanções contra o Tribunal Penal Internacional na sexta-feira. O anúncio ocorreu poucas horas após um ex-julgador do tribunal receber o Prêmio Nobel.", "titulo_pt": "‘Corte desafiadora’: EUA impõem sanções ao ICC horas após ex-membro ganhar prêmio Nobel", "texto_pt": "O Secretário de Estado dos Estados Unidos, Marco Rubio, anunciou sanções contra o Tribunal Penal Internacional na sexta-feira. O anúncio ocorreu poucas horas após um ex-julgador do tribunal receber o Prêmio Nobel.", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 205978, "titulo": "US sanctions ICC after former judge awarded Nobel Peace Prize", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/us-sanctions-international-criminal-court-after-former-judge-awarded", "fonte_id": "middle_east_eye", "data_pub": "2026-10-09T14:53:00Z", "topico": "geopolitica", "idioma": "en", "texto_resumo": "O governo Trump impôs sanções institucionais ao Tribunal Penal Internacional (TPI) após um de seus juízes fundadores ganhar o Prêmio Nobel de Paz. As medidas visam o tribunal como instituição em resposta a arrestos emitidos contra líderes israelenses em 2024.", "titulo_pt": "EUA imputam sanções ao tpi após ex-juiz ganhar prêmio Nobel de paz", "texto_pt": "O governo Trump impôs sanções institucionais ao Tribunal Penal Internacional (TPI) após um de seus juízes fundadores ganhar o Prêmio Nobel de Paz. As medidas visam o tribunal como instituição em resposta a arrestos emitidos contra líderes israelenses em 2024.", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 206083, "titulo": "US slaps sanctions on ICC, hours after ex-judge wins Nobel", "url": "https://www.scmp.com/news/world/united-states-canada/article/3370403/us-slaps-sanctions-icc-hours-after-ex-judge-wins-nobel?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-09T14:51:00Z", "topico": "geopolitica", "idioma": "en", "texto_resumo": "O governo dos Estados Unidos impôs sanções ao Tribunal Penal Internacional, poucas horas após um de seus ex-julgadores ganhar o Prêmio Nobel de Paz, levando Washington a colidir diplomática e politicamente com aliados europeus. O tribunal condenou o movimento como uma 'agressão à lei e à ordem jurídica internacional e pediu a seus 125 estados membros que tomassem medidas para defendê-lo.", "titulo_pt": "EUA imputam sanções ao ICC horas após ex-julgador ganhar prêmio Nobel", "texto_pt": "O governo dos Estados Unidos impôs sanções ao Tribunal Penal Internacional, poucas horas após um de seus ex-julgadores ganhar o Prêmio Nobel de Paz, levando Washington a colidir diplomática e politicamente com aliados europeus. O tribunal condenou o movimento como uma 'agressão à lei e à ordem jurídica internacional e pediu a seus 125 estados membros que tomassem medidas para defendê-lo.", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 205980, "titulo": "US sanctions International Criminal Court hours after former judge wins Nobel Peace Prize", "url": "https://www.middleeasteye.net/news/us-sanctions-international-criminal-court-major-escalation-after-former-judge-awarded-nobel", "fonte_id": "middle_east_eye", "data_pub": "2026-10-09T14:49:00Z", "topico": "geopolitica", "idioma": "en", "texto_resumo": "O governo dos Estados Unidos impôs sanções à Corte Penal Internacional (CPI) como instituição em s const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];

                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}

                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);

  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>

    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));

  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {

    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);

    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
