<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

const D = {"gerado_em": "17/11/2026 15:28", "stats": {"noticias_novas": 1054, "resumos_gerados": 250}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Lula apresentou uma nova estratégia política para tentar obter a maioria no Parlamento, diante das dificuldades de governar em minoria no Legislativo, que é predominantemente de centro e direita. Além disso, o projeto de ajuste fiscal do governo Lula para equilibrar as contas públicas deve ser votado ainda nesta terça-feira no Senado. Quatro mudanças possíveis devem ser decididas, com um impacto estimado de R$ 46 bilhões a R$ 56 bilhões no Orçamento de 2027. O ministro da Fazenda, Dario Durigan, afirmou que a reforma tributária pode ter um 'pequeno impacto' na inflação. Por outro lado, a Defensoria Pública da União e o Programa das Nações Unidas para o Desenvolvimento lançaram um atlas em Brasília que identifica as regiões onde as desigualdades entre brancos, negros, indígenas e quilombolas são mais evidentes no Brasil.", "mundo": "O presidente dos Estados Unidos, Donald Trump, iniciou uma viagem à Ásia com uma parada rápida em Manila, Filipinas, onde não expressou interesse em conquistas diplomáticas ou questões domésticas. Na cúpula do Quad, Trump se juntou a outros líderes em um encontro de dois anos, manifestando preocupações sobre a coerção econômica, incluindo restrições de exportação arbitrárias. Em outro desenvolvimento, o presidente sul-coreano, Yoon Suk-yeol, chegou a Shenzhen para participar da cúpula APEC, enquanto o Parlamento Francês confirmou que irá debater pluralismo e liberdade de expressão na mídia, mas não sobre a possibilidade de proibir o controverso canal CNews. Além disso, a Coreia do Sul chamou para uma cooperação entre países do Oriente Asiático para retomar o diálogo com a Coreia do Norte, e a China mostrou seus avanços tecnológicos a líderes estrangeiros como Trump e Putin, mas também enfrenta desafios sociais fora da cidade de Shenzhen, conhecida como 'cidade das maravilhas'.\n\nOs Estados Unidos e Israel enfrentam tensões geopolíticas significativas. Em Israel, há uma urgência por um novo governo após a guerra em Gaza, com relatos de perdas e medo entre a população. O país também lida com ações militares de israelitas contra palestinos, incluindo o assassinato de uma idosa palestiniana de 73 anos. Internamente, o presidente dos Estados Unidos, Donald Trump, advertiu o Irã sobre supostas ameaças de bombas sujas, mas o Irã negou as acusações. Em outro front, a China está expandindo sua influência militar na região, estabelecendo bases no Laos e Camboja, o que tem causado preocupação. Além disso, a ponte de Kerch, que liga a Crimeia à Ucrânia, foi parcialmente destruída em um ataque atribuído à Ucrânia, um ato simbólico de resistência contra a anexação russa. Na Europa, a rearmamentação está causando preocupações políticas, enquanto o conflito entre Rússia e Ucrânia continua, com a Rússia acusando a presença francesa na Ucrânia de participação direta na guerra. As tensões entre Israel e o Irã também estão em alta, com o Irã realizando ataques aéreos no Golfo Pérsico e o presidente dos Estados Unidos, Donald Trump, mantendo uma postura firme contra Teerã.", "economia": "O Senado deve concluir nesta terça-feira (17/11) a votação do PLP 299/2026, que tende a ser aprovado, com debates concentrados nas questões da Lei Kandir e das compensações tributárias. Outro destaque é que o dólar norte-americano atingiu níveis não vistos desde abril de 2025, devido a uma combinação de fatores positivos para a moeda, incluindo expectativas de taxas de juros mais altas. A reforma tributária pode levar a um pedido de reequilíbrio em aeroportos administrados pela Fraport Brasil, que acredita que o ajuste fiscal impactará negativamente o fluxo de caixa da empresa. Além disso, o CEO do Itaú Unibanco alertou que a dívida pública brasileira pode atingir 100% do PIB em quatro anos, a menos que medidas fiscais sejam adotadas.", "tecnologia": "A tecnologia enfrenta vários desafios e avanços neste período. Os Estados Unidos impuseram restrições à China, impedindo o acesso indireto a chips mais recentes, em um movimento para restringir a tecnologia avançada à China. A Nvidia, empresa líder em chips de inteligência artificial, formou uma comissão de controle de exportação em resposta às novas regulamentações. Jensen Huang, CEO da Nvidia, declarou que estaria 'honorado' em retornar à empresa, embora a diretoria não esteja considerando sua reinstalação atualmente. A empresa brasileira Pax ingressou em um programa restrito da OpenAI, obtendo acesso a ferramentas avançadas de inteligência artificial para melhorar seus sistemas. Além disso, a computação óptica emergiu como uma indústria em rápido crescimento, com uma avaliação de mercado de US$2,22 bilhões, representando um aumento significativo em comparação com 2022. A Apple enfrenta um julgamento na França por supostamente ter organizado a obsolescência programada de iPhones, dificultando reparos fora de estabelecimentos autorizados. A empresa de veículos elétricos Tesla oferece a reserva de táxis autônomos pessoais, levantando dúvidas sobre o futuro da propriedade de veículos.", "ciencia": "O setor de saúde e a ciência em geral foram os principais focos desta edição de notícias científicas. O Centro para o Controle e Prevenção de Doenças (CDC) divulgou um plano estratégico sobre o uso da inteligência artificial (IA) no setor de saúde, enquanto o evento HLTH apresentou notícias e tendências relacionadas à tecnologia na saúde. A variante PJ.2.1 do coronavírus aumentou os casos no Brasil, com a Organização Mundial da Saúde (OMS) incluindo-a em suas análises sobre vacinas. Outras notícias importantes incluem a morte da cientista Thereza Imanishi-Kari aos 83 anos, após enfrentar uma acusação injusta nos Estados Unidos, e a NASA lançando as primeiras imagens de sua Telescópio Nancy Grace Roman durante uma transmissão ao vivo no encontro anual da American Geophysical Union. As pesquisas sobre câncer de mama, terapia genética, imunoterapia, e a formação do Grand Canyon também foram destacadas, além de discussões sobre a influência da inteligência artificial em satélites e na escala de inteligência artificial, bem como na recuperação de minérios valiosos de resíduos industriais.", "cultura": "O Festival de Cannes condenou a perseguição judicial ao cineasta iraniano Jafar Panahi, pedindo mobilização internacional para garantir sua liberdade e direitos de expressão. Durante seu voo de volta a Roma, o Papa Francisco enfatizou a necessidade de superar a polarização e incentivou Javier Milei a considerar os mais necessitados. Na indústria cultural, Robert Pattinson foi escolhido para interpretar o próximo James Bond, enquanto a franquia 'Jogos Vorazes' retorna com um filme que não inova na fórmula já estabelecida. A Sotheby's confirmou um leilão de um quadro de Vincent van Gogh, contestado pelos herdeiros, que está previsto para a próxima quarta-feira. Ainda na agenda cultural, o New Order realiza dois shows em São Paulo, enquanto a Deezer anuncia um filtro para excluir músicas geradas por IA das buscas.", "sociedade": "Em Córdoba, Argentina, um médico foi agredido por um treinador de rugby, levantando preocupações sobre a violência no país. Em outro incidente, um professor foi espancado por criminosos após ter defendido uma mulher, refletindo a violência urbana. A OMS (Organização Pan-Americana de Saúde) pediu aos países para intensificarem esforços para prevenir surtos de sarampo e trabalharem para eliminá-lo nas Américas. Um estudo sobre igualdade de oportunidades no mercado de trabalho revelou que 66% das pessoas consideram que negros e brancos não têm as mesmas chances de emprego e renda. A violência policial também foi abordada, com 81% das pessoas acreditando que ela afeta principalmente os negros. Além disso, a polícia sul-coreana prendeu 86 pessoas suspeitas de participar de uma rede ilegal de drogas, enquanto a polícia da Costa Rica assassinou um jornalista independente que havia ligado traficantes de drogas a políticos.", "meio_ambiente": "A COP31, realizada em Belém, discutiu a transição energética justa e o financiamento para proteger oceanos e florestas, reunindo ministros, cientistas e lideranças indígenas. A programação abrangeu debates sobre investimentos, direitos territoriais e cooperação internacional. No entanto, o esforço para eletrificar o transporte, edificações e indústria enfrenta obstáculos nos debates globais sobre mudanças climáticas. Além disso, o Brasil registrou mais de 1.600 relatos de intoxicações por pesticidas fabricados na Europa, com um terço desses casos envolvendo produtos químicos proibidos na União Europeia. Em termos de emissões de CO2, um relatório do Carbon Brief revelou que a Rússia, Arábia Saudita e Austrália foram os maiores exportadores de dióxido de carbono em toda a história. Por outro lado, a Universidade Austral foi a única instituição argentina a melhorar sua posição no ranking QS de sustentabilidade, que avaliou o impacto ambiental, social e de governança de mais de 2.000 universidades ao redor do mundo. Finalmente, um novo sistema foi implementado para evitar que toneladas de lixo cheguem ao Rio Riachuelo, focando na limpeza de embalagens plásticas e resíduos flutuantes no local.", "direitos_humanos": "O Brasil enfrenta um julgamento histórico na Corte Interamericana de Direitos Humanos em um caso envolvendo a negação de cirurgia de redesignação sexual a uma mulher trans, Luiza Melinho. O julgamento, previsto para 2027, é o primeiro da Corte sobre o tema e reflete a luta pela igualdade de gênero no continente americano. Paralelamente, um pesquisador chinês foi demitido após ocultar a morte de uma menina durante um teste de edição genético, evidenciando as tensões entre ciência e ética nos direitos humanos. Em Israel, Chris Sidoti, membro da Comissão de Inquérito das Nações Unidas, acusa o país de atacar crianças em Gaza, alegando que não há cessar-fogo e que Israel está cometendo genocídio no território ocupado. Este caso destaca as preocupações internacionais com a situação dos direitos humanos na região."}, "resumo_do_dia": {"politica_nacional": [{"id": 269649, "titulo": "Ajuste fiscal: ala do PT tenta retirar investimentos do teto", "url": "https://www.metropoles.com/colunas/igor-gadelha/ajuste-fiscal-ala-do-pt-tenta-retirar-investimentos-do-teto", "fonte_id": "metropoles", "data_pub": "2026-11-17T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um grupo do Partido dos Trabalhadores que se opõe ao ajuste fiscal proposto por Lula busca incluir na votação do projeto do governo a retirada dos investimentos do teto de gastos.", "titulo_pt": "Ala petista contra ajuste fiscal quer retirar investimentos do teto de gastos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 269651, "titulo": "PF indicia 17 por fraude milionária na compra de respiradores na pandemia", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pf-indicia-17-por-fraude-milionaria-na-compra-de-respiradores-na-pandemia", "fonte_id": "metropoles", "data_pub": "2026-11-17T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal indiciou 17 pessoas por fraude milionária na compra de respiradores durante a pandemia. Os equipamentos seriam importados da China, mas não foram entregues.", "titulo_pt": "PF indica 17 por fraude na compra de respiradores na pandemia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 269516, "titulo": "Huang diz que se 'arrepende profundamente' de erros e que aceitaria volta à Nvidia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/huang-diz-que-se-arrepende-profundamente-de-erros-e-que-aceitaria-volta-a-nvidia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T17:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang anunciou que está disposto a voltar a ocupar os cargos de presidente e CEO da Nvidia se o conselho de administração pedir seu retorno, cinco dias após ter renunciado. No entanto, o conselho recusou-se a considerar sua proposta nesta segunda-feira.", "titulo_pt": "Huang diz que se arrepende profundamente e aceitaria retorno à Nvidia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 269652, "titulo": "Ministro sugere renomear pasta como Comunicações e Infraestrutura Digital", "url": "https://www.metropoles.com/colunas/matheus-leitao/ministro-sugere-renomear-pasta-como-comunicacoes-e-infraestrutura-digital", "fonte_id": "metropoles", "data_pub": "2026-11-17T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Frederico de Siqueira Filho propôs renomear a pasta para Comunicações e Infraestrutura Digital, enfatizando a importância dos investimentos na infraestrutura.", "titulo_pt": "Ministro sugere renomear pasta como Comunicações e Infraestrutura Digital", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 269507, "titulo": "Alcolumbre e Motta se reúnem com Moraes e pedem que ministro paute no STF lei que reduz penas de Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/alcolumbre-e-motta-se-reunem-com-moraes-e-pedem-que-ministro-paute-no-stf-lei-que-reduz-penas-de-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-17T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os presidentes do Senado, Davi Alcolumbre, e da Câmara dos Deputados, Hugo Motta, se reuniram com o ministro Alexandre de Moraes, do STF, e solicitaram que ele agilizasse a pauta da Lei da Dosimetria, que pode beneficiar o ex-presidente Jair Bolsonaro.", "titulo_pt": "Alcolumbre e Motta pedem a Moraes que paute lei para beneficiar Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 269517, "titulo": "Alíquota da CBS teve impacto de isenções propostas pelo STF, diz Durigan", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/aliquota-da-cbs-teve-impacto-de-isencoes-propostas-pelo-stf-diz-durigan.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Dario Durigan, da Fazenda, afirmou que decisões judiciais que ampliam o direito a isenções fiscais têm impacto sobre a alíquota da CBS (Contribuição sobre Bens e Serviços). Essas isenções propostas pelo STF afetam a primeira das duas contribuições previstas na reforma tributária a entrar em vigor.", "titulo_pt": "Decisões judiciais impactam alíquota da CBS, diz Durigan", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 269508, "titulo": "Defensoria da União e programa da ONU lançam atlas sobre desigualdades no Brasil", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/defensoria-da-uniao-e-programa-da-onu-lancam-atlas-sobre-desigualdades-no-brasil.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-17T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Defensoria Pública da União (DPU) e o Programa das Nações Unidas para o Desenvolvimento (Pnud) lançaram um atlas em Brasília que identifica as regiões onde as desigualdades entre brancos, negros, indígenas e quilombolas são mais evidentes no Brasil.", "titulo_pt": "Defensoria da União e programa da ONU lançam atlas sobre desigualdades no Brasil", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 269541, "titulo": "Alcolumbre e Motta cobram de Moraes julgamento da lei da dosimetria", "url": "https://g1.globo.com/politica/noticia/2026/11/17/alcolumbre-e-motta-cobram-de-moraes-julgamento-da-lei-da-dosimetria.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-17T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Davi Alcolumbre e Hugo Motta se reuniram com o ministro Alexandre de Moraes, do STF, para pleitear o julgamento das ações diretas de inconstitucionalidade da Lei da Dosimetria pelo plenário do STF. Os presidentes das Casas Legislativas argumentam que a lei foi aprovada há quase um ano pelo Congresso Nacional.", "titulo_pt": "Alcolumbre e Motta pedem julgamento da lei da dosimetria a Moraes", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 269542, "titulo": "Na expectativa de votar ajuste fiscal na Câmara, governo retira urgência de projeto sobre criminalização de bets", "url": "https://g1.globo.com/politica/noticia/2026/11/17/na-expectativa-de-votar-ajuste-fiscal-na-camara-governo-retira-urgencia-de-projeto-sobre-criminalizacao-de-bets.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-17T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula retirou a urgência do projeto que tipifica os crimes de exploração e divulgação de bets do plenário da Câmara. Esta ação permitiu a votação de outras propostas, incluindo a proposta de ajuste fiscal, nesta semana.", "titulo_pt": "Governo retira urgência de projeto sobre criminalização de bets na Câmara", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 269682, "titulo": "Durigan diz que reforma tributária pode ter “pequeno impacto” na inflação", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/durigan-diz-que-reforma-tributaria-pode-ter-pequeno-impacto-na-inflacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-17T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda participou de uma audiência pública na CAE do Senado para discutir o cálculo da alíquota de referência da CBS. Durigan afirmou que a reforma tributária pode ter um 'pequeno impacto' na inflação.", "titulo_pt": "Durigan diz que reforma tributária pode ter 'pequeno impacto' na inflação", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 269685, "titulo": "CNJ propõe unificar regras para emissão e pagamento de precatórios", "url": "https://www.cnnbrasil.com.br/politica/cnj-propoe-unificar-regras-para-emissao-e-pagamento-de-precatorios/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-17T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A conselheira Andréa Cunha Esmeraldo apresentou uma nova resolução para unificar as regras de emissão e pagamento de precatórios. O documento será analisado em um encontro posterior, onde colegas podem sugerir alterações.", "titulo_pt": "CNJ propõe unificar regras para emissão e pagamento de precatórios", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 269544, "titulo": "Durigan diz que reforma tributária pode ter 'pequeno impacto' na inflação e quer reduzir tributo sobre a folha de pagamentos", "url": "https://g1.globo.com/economia/noticia/2026/11/17/durigan-diz-que-reforma-tributaria-pode-ter-pequeno-impacto-na-inflacao-e-quer-reduzir-tributo-sobre-a-folha-de-pagamentos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-17T16:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, afirmou que a reforma tributária pode ter um 'pequeno impacto' na inflação. Durante uma audiência pública, ele explicou que isso está relacionado com o sistema não cumulativo do imposto sobre o consumo, que será aplicado a partir de janeiro.", "titulo_pt": "Durigan diz que reforma tributária pode ter 'pequeno impacto' na inflação", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 269808, "titulo": "Salomão dá 90 dias para Marco Buzzi desocupar apartamento funcional em Brasília", "url": "https://www.jota.info/justica/salomao-da-90-dias-para-marco-buzzi-desocupar-apartamento-funcional-em-brasilia", "fonte_id": "jota", "data_pub": "2026-11-17T16:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Salomão determinou que Marco Buzzi desocupe um apartamento funcional em Brasília em 90 dias. Buzzi foi punido com a sanção de disponibilidade e a proposta de perda do cargo devido a relatos de assédio sexual.", "titulo_pt": "Salomão dá 90 dias para Marco Buzzi desocupar apartamento funcional em Brasília", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 269617, "titulo": "UNE convoca ato na Faria Lima contra ajuste fiscal de Lula", "url": "https://veja.abril.com.br/coluna/faria-lima-news/une-convoca-ato-na-faria-lima-contra-ajuste-fiscal-de-lula/", "fonte_id": "veja", "data_pub": "2026-11-17T16:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Nacional dos Estudantes (UNE) convocou um ato contra o ajuste fiscal proposto por Lula, marcado para esta terça-feira às 17h, em frente à escultura da baleia localizada na Faria Lima, São Paulo.", "titulo_pt": "UNE convoca ato na Faria Lima contra ajuste fiscal de Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 269545, "titulo": "Reforma tributária: apuração 'assistida', a declaração pré-preenchida das empresas, será liberada nesta semana, diz Receita", "url": "https://g1.globo.com/economia/noticia/2026/11/17/reforma-tributaria-apuracao-assistida-a-declaracao-pre-preenchida-das-empresas-sera-liberada-nesta-semana-diz-receita.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-17T16:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O secretário da Receita Federal, Robinson Barreirinhas, anunciou que a 'apuração assistida' da reforma tributária, uma declaração pré-preenchida, será liberada para todas as empresas do país ainda nesta semana. Até o momento, o sistema está disponível apenas para 500 empresas em um ambiente de teste.", "titulo_pt": "Apuração assistida da reforma tributária será liberada para todas as empresas nesta semana, diz Receita", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 269524, "titulo": "Bancos buscam reduzir exposição a dívidas ligadas à inteligência artificial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/bancos-buscam-reduzir-exposicao-a-dividas-ligadas-a-inteligencia-artificial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T15:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bancos estão buscando reduzir sua exposição a dívidas relacionadas à inteligência artificial após a vitória dos democratas nas eleições de meio de mandato nos Estados Unidos, levando a um maior escrutínio sobre os riscos dessas investidas.", "titulo_pt": "Bancos buscam reduzir exposição a dívidas de inteligência artificial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 269647, "titulo": "Feridas abertas: com o peso da guerra em Gaza, Israel busca novo governo", "url": "https://www.metropoles.com/colunas/manoela-alcantara/feridas-abertas-com-o-peso-da-guerra-em-gaza-israel-busca-novo-governo", "fonte_id": "metropoles", "data_pub": "2026-11-17T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Israel busca formar um novo governo em meio aos traumas da guerra em Gaza e as destruições sofridas. Vítimas relatam perdas, medo e os desafios de reconstruir suas vidas.", "titulo_pt": "Feridas abertas: com o peso da guerra em Gaza, Israel busca novo governo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 270179, "titulo": "US Centcom commander expected in Saudi Arabia with dozens of air defence experts, sources say", "url": "https://www.middleeasteye.net/news/us-centcom-commander-expected-saudi-arabia-dozens-air-defence-experts-sources-say", "fonte_id": "middle_east_eye", "data_pub": "2026-11-17T17:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de trinta e seis oficiais militares dos Estados Unidos devem chegar a Arábia Saudita esta semana para aconselhar sobre a defesa aérea do país. O chefe da Centcom, almirante Brad Cooper, e o comandante das forças no Oriente Médio estão entre os que se encontrarão com especialistas em defesa aérea.", "titulo_pt": "Comandante da Centcom deve chegar à arábia saudita com dezenas de especialistas em defesa aérea", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 269918, "titulo": "Ecuadorean Fishermen Who Survived U.S. Boat Strike Sue Trump Administration", "url": "https://www.nytimes.com/2026/11/17/world/americas/trump-us-boat-strikes-lawsuit-ecuador-fishermen.html", "fonte_id": "nyt_world", "data_pub": "2026-11-17T17:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fishing boats do Equador que sobreviveram a um choque com um navio dos EUA estão processando o governo Trump. O primeiro processo visa uma campanha militar secreta dos EUA que já resultou em mais de 240 mortes.", "titulo_pt": "Pescadores ecuatorianos que sobreviveram ao choque com navio dos EUA processam governo Trump", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 269927, "titulo": "Anne Thurston Has Died. She Revealed Salacious Details of Mao’s Life.", "url": "https://www.nytimes.com/2026/11/17/world/asia/anne-thurston-dead.html", "fonte_id": "nyt_world", "data_pub": "2026-11-17T17:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anne Thurston, que escreveu sobre a vida pessoal de Mao Zedong e os traumas da Revolução Cultural, recebeu elogios acadêmicos, mas também críticas do governo chinês.", "titulo_pt": "Anne Thurston morreu. Ela revelou detalhes salaces da vida de Mao.", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 269926, "titulo": "President Trump Starts Asia Trip With Quick Manila Stopover", "url": "https://www.nytimes.com/2026/11/17/world/asia/17trump-summit-manila-asean-marcos.html", "fonte_id": "nyt_world", "data_pub": "2026-11-17T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Donald Trump fez uma breve parada em Manila durante sua viagem à Ásia, aparentemente sem demonstrar interesse em conquistas diplomáticas ou questões domésticas. Ele comentou: 'É vida'.", "titulo_pt": "Presidente Trump inicia viagem à ásia com parada rápida em Manila", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 270210, "titulo": "Il prezzo del gas poco mosso a 84,73 euro al megawattora", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/17/il-prezzo-del-gas-poco-mosso-a-8473-euro-al-megawattora_d36cb47d-1d7a-42f4-8f26-6bfb41483767.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-17T17:44:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "As cotações do gás natural em Amsterdam registraram uma queda de 0,03%. O preço do megawatt-hora do gás está em 84,73 euros.", "titulo_pt": "Preço do gás em amsterdam cai para 84,73 euros", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 270156, "titulo": "Religious ruling revives memories in Israel of Rabin assassination", "url": "https://www.aljazeera.com/news/2026/11/17/religious-ruling-revives-memories-in-israel-of-rabin-assassination?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-17T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A decisão religiosa reaviva memórias do assassinato de Rabin em Israel, alimentando temores de violência política de extrema direita em relação à participação palestina no governo israelense.", "titulo_pt": "Decisão religiosa reaviva memórias do assassinato de Rabin em Israel", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 270181, "titulo": "Saudi double-tap strike on factory in Yemen kills 14, Houthi health ministry says", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/saudi-double-tap-strike-factory-yemens-hodeida-kills-14-houthi-health", "fonte_id": "middle_east_eye", "data_pub": "2026-11-17T17:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque a duplo impacto da Arábia Saudita em uma fábrica de espuma em Hodeida, no oeste do Iêmen, resultou em 14 mortos e 10 feridos, segundo a ministra de saúde houthi. Em uma ação separada, dois pessoas morreram e quatro foram feridas em uma área do distrito de Kitaf, no norte da província de Saada.", "titulo_pt": "Ataque a duplo impacto da arábia saudita em fábrica no iêmen causa 14 mortos", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 270082, "titulo": "French Parliament to hold debate on press pluralism after million-signature petition to ban CNews", "url": "https://www.lemonde.fr/en/economy/article/2026/11/17/french-parliament-to-hold-debate-on-press-pluralism-after-million-signature-petition-to-ban-cnews_6782827_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-17T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Parlamento Francês confirmou que irá debater pluralismo e liberdade de expressão na mídia, mas não sobre a possibilidade de proibir o canal controverso CNews, propriedade do bilionário da extrema-direita Vincent Bolloré.", "titulo_pt": "Parlamento francês discutirá pluralismo na mídia, mas não banirá CNews", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 269908, "titulo": "Costa Rican journalist shot dead in first such killing in 25 years", "url": "https://www.theguardian.com/world/2026/nov/17/costa-rica-journalist-camilo-rodriguez-shot-dead", "fonte_id": "guardian_world", "data_pub": "2026-11-17T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O jornalista costarriquenhista Camilo Rodriguez foi morto a tiros em um incidente que marca o primeiro assassinato de jornalista no país em 25 anos. Sua morte ocorre em um momento em que o país enfrenta um aumento na violência relacionada ao tráfico de drogas, apesar de ter sido historicamente considerado um dos países mais pacíficos e estáveis da América Central.", "titulo_pt": "Jornalista costarriquenhista é morto a tiros, primeiro caso em 25 anos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 270255, "titulo": "Serbian Court Seeks Arrest of Kosovo Serb Kingpin Radoicic", "url": "https://balkaninsight.com/2026/11/17/serbian-court-seeks-arrest-of-kosovo-serb-kingpin-radoicic/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-17T17:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal sérvio solicitou à polícia o expediente de um mandado de prisão contra o empresário e político Radoicic, após ele não comparecer à delegacia – violando medidas impostas durante uma investigação sobre um tiroteio em 2023 na aldeia de Banjska/Banjske, na Kosovo.", "titulo_pt": "Tribunal sérvio solicita arresto de líder sérvio do Kosovo Radoicic", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 269964, "titulo": "The Iran War Has Slipped Into a Dangerous Limbo", "url": "https://www.theatlantic.com/national-security/2026/11/iran-war-trump-limbo/689471/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-17T17:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump optou por não realizar ataques nem iniciar negociações, deixando Estados Unidos e Irã em um impasse instável.", "titulo_pt": "A guerra iraniana encontrou-se em um perigoso estado de incerteza", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 270333, "titulo": "Lee arrives in Shenzhen for APEC summit", "url": "https://en.yna.co.kr/view/AEN20261117010600315", "fonte_id": "yonhap_news", "data_pub": "2026-11-17T17:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sul-coreano Lee Jae Myung chegou a Shenzhen para participar da cúpula APEC. A chegada ocorreu em 18 de novembro.", "titulo_pt": "Lee chega a Shenzhen para cúpula APEC", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 269960, "titulo": "European Rearmament Risks Political Peril", "url": "https://foreignpolicy.com/2026/11/17/europe-rearmament-russia-ukraine-defense-social-spending-protest/", "fonte_id": "foreign_policy", "data_pub": "2026-11-17T17:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns policymaker europeus estão desalinhados com a crise de custo de vida, como recentes manifestações demonstram.", "titulo_pt": "Aumento das forças armadas na Europa pode trazer perigos políticos", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 270107, "titulo": "Latest news bulletin | November 17th, 2026 – Evening", "url": "https://www.euronews.com/video/2026/11/17/latest-news-bulletin-november-17th-2026-evening", "fonte_id": "euronews", "data_pub": "2026-11-17T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram relatados os principais eventos da Europa e do mundo no dia 17 de novembro de 2026, abrangendo notícias gerais, notícias em tempo real, assuntos internacionais, negócios, entretenimento, política, cultura e viagens.", "titulo_pt": "Boletim de notícias mais importantes | 17 de novembro de 2026 – noite", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 270182, "titulo": "US attacks Iran's Qeshm island in Strait of Hormuz, official says", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/us-attacks-irans-qeshm-island-strait-hormuz-official", "fonte_id": "middle_east_eye", "data_pub": "2026-11-17T16:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com um oficial iraniano, os Estados Unidos realizaram vários ataques na ilha de Qeshm, localizada no Estreito de Ormuz, mas nenhum dano foi causado às áreas residenciais, comerciais ou infraestruturais. O oficial afirmou que a situação está sob controle.", "titulo_pt": "EUA realizam ataques na ilha de Qeshm, no estreito de Ormuz, diz oficial", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 269806, "titulo": "Destaques sobre Lei Kandir e compensação tributária concentram disputas no Senado antes de pacote fiscal seguir à Câmara", "url": "https://www.jota.info/legislativo/destaques-sobre-lei-kandir-e-compensacao-tributaria-concentram-disputas-no-senado-antes-de-pacote-fiscal-seguir-a-camara", "fonte_id": "jota", "data_pub": "2026-11-17T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado deve concluir nesta terça-feira (17/11) a votação do pacote do PLP 299/2026, que tende a ser aprovado. Destaques sobre a Lei Kandir e compensação tributária estão concentrando as disputas no Senado antes da proposta seguir para a Câmara.", "titulo_pt": "Destaques sobre Lei Kandir e compensação tributária concentram disputas no Senado antes de pacote fiscal seguir à Câmara", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 269518, "titulo": "SC flexibiliza restrições em granjas após controlar último foco de doença de Newcastle", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/11/sc-flexibiliza-restricoes-em-granjas-apos-controlar-ultimo-foco-de-doenca-de-newcastle.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Santa Catarina relaxou as restrições sanitárias relacionadas a granjas após controlar o último foco da doença de Newcastle. A medida foi tomada após a identificação de cinco focos da doença em três municípios do estado.", "titulo_pt": "SC relaxa restrições em granjas após controlar foco de doença de Newcastle", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 269519, "titulo": "Gasolina cara hoje, menos poluição amanhã", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/bernardo-guimaraes/2026/11/gasolina-cara-hoje-menos-poluicao-amanha.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em março, quando a guerra no Irã começou, o autor defendeu que o aumento no preço da gasolina incentivaria a produção e a compra de veículos mais limpos, como carros elétricos. O texto original foi publicado em 11/17/2026 às 14h28.", "titulo_pt": "Gasolina cara hoje, menos poluição amanhã", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 269520, "titulo": "Anglo diz que eventual veto da UE a acordo com MMG deve afetar fornecimento de ferroníquel", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/11/anglo-diz-que-eventual-veto-da-ue-a-acordo-com-mmg-deve-afetar-fornecimento-de-ferroniquel.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anglo American informou a seus principais clientes de ferroníquel que um possível veto da União Europeia à venda de seus negócios no Brasil para a MMG afetaria o fornecimento de ferro-níquel. A empresa advertiu sobre a possibilidade de impacto no abastecimento.", "titulo_pt": "Anglo avisa clientes que veto da UE no acordo com MMG pode afetar fornecimento de ferroníquel", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 269680, "titulo": "Bolsas da Europa caem com novas restrições dos EUA a chips", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/bolsas-da-europa-caem-com-novas-restricoes-dos-eua-a-chips/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-17T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As bolsas da Europa caíram após novas restrições dos EUA a chips e preocupações com o balanço da Nvidia no setor tecnológico. O FTSE 100 foi o índice mais afetado, com uma queda de 1,76%, seguido pelo DAX com 1,97% e CAC 40 com 1,62%.", "titulo_pt": "Bolsas da Europa caem com novas restrições dos EUA a chips", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 270205, "titulo": "Nvidia stopped disclosing Singapore sales as revenues hit $104bn", "url": "https://www.ft.com/content/dbde7a30-548c-4f9d-a4be-7898a0c24dcf?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-17T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia alterou seus métodos de relatório e parou de divulgar as vendas no Singapura, uma vez que as receitas através desse estado aumentaram 70%.", "titulo_pt": "Nvidia parou de divulgar vendas no singapura com receitas de us$ 104 bilhões", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 269521, "titulo": "Housi entra no mercado de estadias corporativas com a Onfly", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/housi-entra-no-mercado-de-estadias-corporativas-com-a-onfly.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T16:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Housi, plataforma de moradia flexível, formou uma parceria com a Onfly, empresa especializada em gestão de viagens a trabalho. O acord  IA antes de reunião entre Xi e Trump", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/presidente-de-gigante-chines-alerta-para-risco-de-bolha-na-ia-antes-de-reuniao-entre-xi-e-trump.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T15:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente-executivo do Baidu, uma gigante da internet chinesa, afirmou que a adoção da inteligência artificial não está aumentando os lucros da maioria das empresas. Essa declaração foi feita antes de uma reunião entre Xi Jinping e Donald Trump, que deve discutir os riscos associados à tecnologia.", "titulo_pt": "Presidente do baidu alerta para risco de bolha na IA antes de reunião entre Xi e Trump", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 269692, "titulo": "Documentos do Deutsche Bank ligam empresas de Trump a esquemas de lavagem de dinheiro", "url": "https://apublica.org/2026/11/documentos-do-deutsche-bank-ligam-empresas-de-trump-a-esquemas-de-lavagem-de-dinheiro/", "fonte_id": "agencia_publica", "data_pub": "2026-11-17T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os documentos do Deutsche Bank demonstram conexões entre empresas associadas ao presidente dos EUA e esquemas de lavagem de dinheiro relacionados à Rússia.", "titulo_pt": "Documentos do Deutsche Bank ligam empresas de Trump a esquemas de lavagem de dinheiro", "veiculo": "Agência Pública", "pais": "Brasil", "classe": "B"}, {"id": 269528, "titulo": "União Europeia adia votação e mantém veto a frango e mel importados do Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/11/uniao-europeia-adia-votacao-e-mantem-veto-a-frango-e-mel-importados-do-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T15:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Europeia adiou d", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 269712, "titulo": "O que os últimos leilões revelam sobre o preço da energia (e sobre o setor)", "url": "https://braziljournal.com/o-que-os-ultimos-leiloes-revelam-sobre-o-preco-da-energia-e-sobre-o-setor", "fonte_id": "brazil_journal", "data_pub": "2026-11-17T15:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os leilões de energia realizados pelo governo recentemente indicaram preços baixos para a aquisição de energia elétrica pelos distribuidores nos próximos três anos. O baixo deságio oferecido pelos vendedores e o perfil dos participantes chamaram a atenção do mercado.", "titulo_pt": "O que os últimos leilões revelam sobre o preço da energia e o setor", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 269531, "titulo": "CEO interina, Colette Kress, estreia no cargo em divulgação dos balanços da Nvidia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/ceo-interina-colette-kress-estreia-no-cargo-em-divulgacao-dos-balancos-da-nvidia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T15:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Colette Kress, a CEO interina da Nvidia, fará sua estreia no cargo nesta terça-feira (17) ao apresentar os balanços financeiros da empresa, buscando tranquilizar os investidores sobre o futuro do crescimento da empresa sem a presença do fundador Jensen Huang.", "titulo_pt": "CEO interina Colette Kress faz sua estreia no cargo em divulgação dos balanços da Nvidia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 270231, "titulo": "US blocks China’s indirect access to latest chips", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/18/2003867932", "fonte_id": "taipei_times", "data_pub": "2026-11-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos impediram que a China tivesse acesso indireto a chips mais recentes. A medida visa restringir a tecnologia avançada à China.", "titulo_pt": "EUA bloqueiam acesso indireto da China aos últimos chips", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 270254, "titulo": "Nvidia forms export control board committee after chip curbs", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/18/2003867919", "fonte_id": "taipei_times", "data_pub": "2026-11-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia formou uma comissão de controle de exportação após as restrições a chips. A empresa reagiu às novas regulamentações implementadas por governos para monitorar a exportação de tecnologia avançada.", "titulo_pt": "Nvidia forma comissão de controle de exportação após restrições a chips", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 270264, "titulo": "Hydropower hit record lows in the US Southwest this summer", "url": "https://www.technologyreview.com/2026/11/17/1148742/hydropower-drought-colorado-river/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-17T17:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O sudoeste dos Estados Unidos gerou 28% menos eletricidade através da hidrelétrica entre abril e agosto do que a média de 10 anos, de acordo com novos dados do Administrador de Informações Energéticas dos EUA. A geração de hidrelétrica depende da retenção de água em represas, que é liberada através de turbinas para gerar eletricidade conforme necessário.", "titulo_pt": "Hidrelétrica atinge baixos níveis históricos no sudoeste dos EUA neste verão", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 270318, "titulo": "Jensen Huang Says He’s Open to Coming Back to Nvidia", "url": "https://www.wired.com/story/jensen-huang-says-hes-open-to-coming-back-to-nvidia/", "fonte_id": "wired", "data_pub": "2026-11-17T17:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang declarou que estaria honrado em retornar como CEO da Nvidia se o conselho de administração apoiar essa decisão.", "titulo_pt": "Jensen Huang expressa interesse em retornar como ceo da Nvidia", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 269661, "titulo": "Pax, empresa brasileira de IA, entra em programa restrito da OpenAI", "url": "https://www.metropoles.com/brasil/pax-empresa-brasileira-de-ia-entra-em-programa-restrito-da-openai", "fonte_id": "metropoles", "data_pub": "2026-11-17T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa brasileira Pax ingressou em um programa restrito da OpenAI, que lhe proporcionará acesso a ferramentas avançadas de inteligência artificial para identificar falhas e proteger sistemas utilizados em investigações.", "titulo_pt": "Pax, empresa brasileira de IA, entra em programa restrito da OpenAI", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 270099, "titulo": "FAA pauses installation of new routers after ground stop", "url": "https://www.cnbc.com/2026/11/17/faa-ground-stop-routers.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-17T17:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Problemas com a tecnologia sobrecarregada fizeram a Agência de Aviação Federal (FAA) adiar a instalação de novos roteadores e emitir um raro aviso de parada de decolagens e aterrissagens em todo o país no mesmo dia.", "titulo_pt": "FAA pausa instalação de novos roteadores após aviso de parada de pousos e decolagens", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 270019, "titulo": "Jensen Huang agrees to face Congress over Nvidia scandal", "url": "https://www.axios.com/2026/11/17/nvidia-jensen-huang-congress-testify-dates", "fonte_id": "axios", "data_pub": "2026-11-17T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang, CEO da Nvidia, e Tim Teter, advogado geral da empresa, irão prestar depoimentos à Congresso americano em dezembro. O objetivo é esclarecer se os poderosos chips de IA da Nvidia foram comprometidos por inteligência estrangeira e se a empresa fez o suficiente para proteger tecnologia sensível americana.", "titulo_pt": "Jensen Huang concorda em comparecer ao congresso sobre escândalo da Nvidia", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 270020, "titulo": "Jensen Huang says he'd be \"honored\" to return as Nvidia CEO", "url": "https://www.axios.com/2026/11/17/jensen-huang-nvidia-ceo-return-earnings", "fonte_id": "axios", "data_pub": "2026-11-17T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang declarou que estaria 'honorado' em retornar como CEO da Nvidia. Huang recebeu pedidos de funcionários, investidores e parceiros de negócios para que retornasse à empresa, mas a diretoria não está atualmente considerando sua reinstate.", "titulo_pt": "Jensen Huang diz estar 'honorado' em retornar como CEO da Nvidia", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 270021, "titulo": "Tech leaders tell Fed chairman Warsh how AI could transform the economy", "url": "https://www.axios.com/2026/11/17/ai-fed-economic-growth-andreessen", "fonte_id": "axios", "data_pub": "2026-11-17T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Marc Andreessen, um venture capitalist que está co-liderando um grupo de trabalho do Federal Reserve sobre o impacto econômico da IA, argumentou que as visões extremas de otimismo tecnológico e pessimismo sobre a IA podem estar erradas. Este argumento pode influenciar como o Federal Reserve avaliará as consequências econômicas da IA, com implicações significativas para suas projeções de crescimento, inflação e taxas de juros.", "titulo_pt": "Líderes de tecnologia orientam o chairman do federal reserve sobre como a IA pode transformar a economia", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 270319, "titulo": "VSCO Is Gunning for Adobe Lightroom With Its New Desktop App", "url": "https://www.wired.com/story/vsco-is-gunning-for-adobe-lightroom-with-its-new-desktop-app/", "fonte_id": "wired", "data_pub": "2026-11-17T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A VSCO lançou uma nova aplicação para desktop macOS chamada Studio Pro, que oferece edição em lote rápida, suporte a RAW e mais de 200 pré-configurações, embora ainda faltam algumas ferramentas profissionais.", "titulo_pt": "VSCO alvo do Adobe Lightroom com novo App para Desktop", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 270206, "titulo": "How Jensen Huang’s family shaped Nvidia’s Megaspeed dealings", "url": "https://www.ft.com/content/65ff066f-a81c-4d24-95da-73c2d7b83a27?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-17T15:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A filha e genro de Jensen Huang estão sendo examinadas pela diretoria da Nvidia, que está investigando a empresa em relação a suas relações com a Megaspeed.", "titulo_pt": "Filha e genro de Jensen Huang são investigados pela Nvidia em relação a Megaspeed", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 270265, "titulo": "Research Reports", "url": "https://www.technologyreview.com/2026/11/17/1148203/research-reports/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-17T14:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Para acessar um relatório, clique na imagem correspondente abaixo.", "titulo_pt": "Relatórios", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 269627, "titulo": "A App Store caiu? Loja de apps da Apple tem instabilidade nesta terça-feira, 17", "url": "https://exame.com/tecnologia/app-store-caiu-instabilidade-apple/", "fonte_id": "exame", "data_pub": "2026-11-17T14:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A loja de aplicativos da Apple esteve com instabilidade nesta terça-feira, 17, com usuários relatando dificuldades para acessar a loja no iPhone. O problema com compras de assinaturas foi resolvido pela manhã.", "titulo_pt": "A App Store teve problemas? Loja de apps da Apple registra instabilidade nesta terça-feira", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 270347, "titulo": "AI Is Giving Optical Computing Another Shot", "url": "https://spectrum.ieee.org/optical-computing-ai", "fonte_id": "ieee_spectrum", "data_pub": "2026-11-17T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O conceito de computação com luz tem existido por mais de 70 anos, mas até recentemente permaneceu principalmente em pesquisa. Recentemente, a computação óptica emergiu como uma indústria em rápido crescimento, com uma avaliação de mercado de US $2,22 bilhões, um aumento significativo em comparação com US $0,4 bilhão em 2022.", "titulo_pt": "IA está dando uma nova chance à computação óptica", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 270341, "titulo": "Oracle to issue critical security patch update after vulnerabilities found in programming language Java", "url": "https://en.yna.co.kr/view/AEN20261117010800320", "fonte_id": "yonhap_news", "data_pub": "2026-11-17T13:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oracle Corp. anunciou que lançará uma atualização de patch de segurança crítica após encontrar vulnerabilidades no idioma de programação Java.", "titulo_pt": "Oracle lançará atualização de segurança crítica após encontrar vulnerabilidades no Java", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 269537, "titulo": "Apple será julgada na França por dificultar reparos de iPhones", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/11/apple-sera-julgada-na-franca-por-dificultar-reparos-de-iphones.shtml", "font "Brasil", "classe": "B"}, {"id": 269539, "titulo": "Thereza Imanishi-Kari, cientista inocentada de acusação nos EUA, morre aos 83 anos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/thereza-imanishi-kari-cientista-inocentada-de-acusacao-nos-eua-morre-aos-83-anos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-17T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Thereza Imanishi-Kari, uma cientista que enfrentou uma acusação injusta nos Estados Unidos por cerca de uma década, morreu aos 83 anos. Ela se mudou várias vezes e criou sua filha em um laboratório universitário.", "titulo_pt": "Thereza Imanishi-Kari, cientista inocentada de acusação nos EUA, morre aos 83 anos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 270438, "titulo": "Curiosity Blog, Sols 5072-5076: The Return of the Polygons", "url": "https://science.nasa.gov/blog/curiosity-blog-sols-5072-5076-the-return-of-the-polygons/", "fonte_id": "nasa_news", "data_pub": "2026-11-17T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Curiosity realizou várias operações de perfuração e análise dos amostras 'Basque Lakes' e 'Nazca' nas últimas semanas. Agora, é hora de avançar para outras áreas do terreno marciano.", "titulo_pt": "Blog curiosity, solos 5072-5076: o retorno das polígonos", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 270369, "titulo": "STAT+: Flagship opens biotech-creation outpost in the U.K.", "url": "https://www.statnews.com/2026/11/17/biotech-news-flagship-opens-biotech-creation-uk-outpost/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-17T17:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Flagship está investindo 100 milhões de libras para criar 'empresas de plataforma AI nativas' focadas em saúde humana e planeta no Reino Unido.", "titulo_pt": "Flagship abre base para criação de biotecnologia no reino unido", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 270437, "titulo": "How AI is pushing satellites to evolve", "url": "https://spacenews.com/how-ai-is-pushing-satellites-to-evolve/", "fonte_id": "spacenews", "data_pub": "2026-11-17T17:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante o primeiro dia do Space Tech Expo Europe, Mike Gruss, da SpaceNews, conversou com Pieter van Duijn, o chief technology officer da Loft Orbital, sobre o crescimento do nível de inteligência artificial e sua influência na evolução dos satélites.", "titulo_pt": "Como a IA está impulsionando a evolução dos satélites", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 270439, "titulo": "NASA Invites Media, Public to View Roman Telescope’s First Images", "url": "https://www.nasa.gov/news-release/nasa-invites-media-public-to-view-roman-telescopes-first-images/", "fonte_id": "nasa_news", "data_pub": "2026-11-17T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA vai lançar as primeiras imagens da sua Telescópio Nancy Grace Roman durante uma transmissão ao vivo no encontro anual da American Geophysical Union em São Francisco, nos Estados Unidos, no dia 7 de dezembro às 12:30 horário local (15:30 horário de Brasília). As imagens exibirão as capacidades científicas únicas do telescópio, que em breve capturará imagens profundas e panorâmicas inéditas.", "titulo_pt": "NASA convida imprensa e público a ver primeiras imagens do telescópio Roman", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 270440, "titulo": "Space Selfie", "url": "https://www.nasa.gov/image-article/space-selfie-2/", "fonte_id": "nasa_news", "data_pub": "2026-11-17T16:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O astronauta Anil Menon, da NASA, tirou uma selfie durante uma caminhada espacial em 29 de outubro de 2026, junto com o astronauta Joshua Kutryk, da CSA (Agência Canadense Espacial). Eles instalaram uma nova placa solar desdobrável na Estação Espacial Internacional.", "titulo_pt": "Autofoto no espaço", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 270377, "titulo": "The U.S. just lost its measles elimination status. What now?", "url": "https://www.sciencenews.org/article/measles-us-elimination-status-vaccine", "fonte_id": "science_news", "data_pub": "2026-11-17T16:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dados coletados desde janeiro de 2025 indicam que o vírus da rubéola está se estabelecendo no país, pois circula por mais de um ano. Isso significa que os Estados Unidos perderam seu status de eliminação da rubéola.", "titulo_pt": "Os estados unidos perderam seu status de eliminação da rubéola. O que agora?", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 270370, "titulo": "U.S. loses measles elimination status, marking embarrassing stain on its public health record", "url": "https://www.statnews.com/2026/11/17/us-loses-measles-elimination-status-public-health-victory-lost/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-17T16:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A eliminação da vírus da sarampo no território americano foi perdida, um fato que foi esperado mas que representa uma decepção na capacidade básica de saúde pública do país.", "titulo_pt": "Estados unidos perde status de eliminação do sarampo, marcando um vexame em seu registro de saúde pública", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 270371, "titulo": "STAT+: ‘Medicare for More’ gains traction", "url": "https://www.statnews.com/2026/11/17/democrats-new-health-policy-medicare-for-more-stephen-miller-embraces-maha/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-17T15:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os democratas se uniram em torno de uma nova política de saúde e derosas derivadas", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 270420, "titulo": "Betelgeuse and its ‘Betel-buddy’ could light up Earth’s skies", "url": "https://www.scientificamerican.com/article/betelgeuse-and-its-betel-buddy-could-light-up-earths-skies/", "fonte_id": "scientific_american", "data_pub": "2026-11-17T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Betelgeuse pode estar prestes a engolir uma estrela companheira, liberando uma explosão brilhante em algumas milénias. A estrela famosa Betelgeuse pode causar um fenômeno visível nos céus terrestres em alguns milhares de anos.", "titulo_pt": "Betelgeuse e sua 'companheira' estrelar podem iluminar os céus da terra", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 270374, "titulo": "STAT+: With $173 million, new startup takes aim at sickle cell", "url": "https://www.statnews.com/2026/11/17/new-startup-developing-novel-sickle-cell-anemia-infusion-no-gene-therapy/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-17T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo startup recebeu financiamento no valor de 173 milhões de dólares para desenvolver um tratamento para a doença do falcão semelhante à terapia genética, mas sem suas desvantagens. Um empreendedor acredita que pode ter encontrado uma solução.", "titulo_pt": "Com 173 milhões de dólares, nova startup almeja tratamento para a doença do falcão semelhante à terapia genética", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 269485, "titulo": "Festival de Cannes pede mobilização internacional em defesa de Jafar Panahi", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/festival-de-cannes-pede-mobilizacao-internacional-em-defesa-de-jafar-panahi.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-17T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Festival de Cannes condenou a perseguição judicial ao cineasta iraniano Jafar Panahi e pediu à comunidade internacional que pressione as autoridades do Irã para impedir sua prisão. O festival também exigiu o fim das restrições que impedem o diretor de viajar, trabalhar e se expressar livremente.", "titulo_pt": "Festival de Cannes pede mobilização internacional em defesa de Jafar Panahi", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 269753, "titulo": "El Papa a la Argentina: “Hay que cambiar el chip, no es necesario odiarnos ni usar un lenguaje tan violento”", "url": "https://www.lanacion.com.ar/el-mundo/el-papa-a-la-argentina-hay-que-cambiar-el-chip-no-es-necesario-odiarnos-ni-usar-un-lenguaje-tan-nid17112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-17T17:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Papa falou durante o voo de volta a Roma sobre a necessidade de superar a polarização e incentivou Leandro Milei a considerar mais os mais necessitados na sociedade.", "titulo_pt": "Papa à Argentina: 'é necessário mudar de atitude, não é preciso odiar ou usar linguagem violenta'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 269754, "titulo": "La transcripción completa de la conferencia de prensa del papa León XIV tras su viaje a Uruguay, la Argentina y Perú", "url": "https://www.lanacion.com.ar/el-mundo/la-transcripcion-completa-de-la-conferencia-de-prensa-del-papa-leon-xiv-tras-su-viaje-a-uruguay-la-nid17112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-17T17:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Papa Leão XIV relatou detalhes de seus encontros com Milei durante o voo de volta a Roma. Ele destacou a importância de atender aos setores mais vulneráveis e questionou a concentração da riqueza.", "titulo_pt": "Transcrição completa da conferência de imprensa do papa leão X
