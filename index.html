<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "01/09/2026 15:23", "stats": {"noticias_novas": 1021, "resumos_gerados": 244}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O ministro do STF, Alexandre de Moraes, está no centro de uma investigação que envolve o ex-banqueiro Daniel Vorcaro, do Banco Master. De acordo com relatórios da Polícia Federal, Moraes teve múltiplos encontros com Vorcaro e participou de decisões sobre a programação de um fórum jurídico em Londres. Além disso, Moraes foi acusado de ter vetado participações em eventos organizados pelo Banco Master. As mensagens trocadas entre Moraes e Vorcaro foram objeto de uma sessão presencial solicitada pelo ministro André Mendonça, do STF, para discutir as alegações de comunicação entre eles. Em outro desenvolvimento, a reeleição do ex-presidente Lula enfrenta desafios, com a hipótese de vitória no primeiro turno diminuindo. Por outro lado, Ronaldo Caiado, candidato à Presidência, pretende apresentar uma PEC para controlar gastos obrigatórios, enquanto Flávio Bolsonaro se recusou a revelar seu voto em relação ao projeto que termina com a escala 6x1 no Senado.", "mundo": "A Alemanha acusa a Rússia de ter fornecido um dron carregado com explosivos encontrado perto de um avião ucraniano em um aeroporto alemão há um mês, em meio a tensões entre as partes. A Rússia nega ter fornecido evidências à Alemanha. O presidente russo, Vladimir Putin, prometeu apoio ao Irã e reuniu líderes para desafiar os Estados Unidos durante um encontro de segurança regional na Cazaquistão. Putin sugeriu a possibilidade de uma reunião trilateral com Trump e Xi durante a próxima cúpula do APEC. Além disso, o presidente francês, Emmanuel Macron, defendeu a proibição de smartphones nas escolas, argumentando que eles são uma distração e um obstáculo ao aprendizado. No México, a presidente Claudia Sheinbaum defendeu em seu segundo relatório que o México avança para a prosperidade com um governo austero, focando no combate à corrupção e no impulso à economia, sob pressão dos Estados Unidos em relação à soberania mexicana.\n\nA tensão geopolítica na região do Oriente Médio atingiu níveis críticos, com ataques e contra-ataques entre Estados Unidos e Irã. A Agência Internacional de Energia Atômica (AIEA) relatou avanços em sua investigação sobre atividades nucleares secretas na Síria, mas não obteve progresso na investigação do Irã devido a ataques americanos e israelenses. Os Estados Unidos realizaram novos ataques no Estreito de Ormuz após ataques iranianos a navios e pessoal militar dos EUA, levando a um aumento nas cotações do petróleo e nos rendimentos dos títulos do Tesouro norte-americanos. O presidente dos Estados Unidos, Donald Trump, advertiu que o Irã enfrentará 'ações muito mais duras e intensas' se retaliar contra os ataques americanos. O Irã prometeu responder a essas novas agressões com uma reação 'várias vezes maior'. Além disso, a Rússia intensificou seus ataques na Ucrânia, matando pelo menos 12 pessoas em Kyiv durante a sexta noite consecutiva de ataques de drones, agravando a crise de água potável no norte de Gaza após a destruição de uma nova planta de dessalinização. A Alemanha acusa a Rússia de realizar um ataque com drones no aeroporto de Leipzig, e países europeus relatam um aumento nas tentativas e ataques de sabotagem atribuídos à Rússia.", "economia": "A China suspendeu as importações de carne bovina do Brasil, o que já está reduzindo os preços de alguns cortes nos supermercados. A economia brasileira deve crescer cerca de 2% em 2026, com o ritmo de crescimento anual diminuindo para 1,9% no último ano, o menor desde 2019 (exceto durante a pandemia). A inflação na zona do euro ultrapassou 3% em agosto, reforçando os argumentos para um novo aumento da taxa de juros pelo Banco Central Europeu. A Shein, gigante do fast-fashion, realizou uma oferta pública inicial (IPO) na Bolsa de Hong Kong, arrecadando US$ 1,7 bilhão, mas a estreia na bolsa teve uma leve queda de 0,1%. A inflação na zona do euro voltou a ficar acima de 3%, com expectativa de que a taxa de juros seja aumentada em setembro devido ao aumento dos custos energéticos na região devido à guerra na Ucrânia.", "tecnologia": "A tecnologia para o bem social foi destacada recentemente em um comunicado da IEEE, que enfatiza a importância de soluções interdisciplinares para resolver problemas comuns. Em outro desenvolvimento, a GoPro foi adquirida por 285 milhões de dólares e continuará a operar como uma empresa pública, com foco no desenvolvimento de infraestrutura de inteligência artificial. A Sonos anunciou a incorporação de inteligência artificial em seu software, introduzindo novas funcionalidades e um aplicativo atualizado. A Waymo acelerou sua expansão de táxis robóticos, lançando serviços em Denver, San Diego e Tampa, enquanto a Fambot desenvolveu um assistente de inteligência artificial para auxiliar famílias na organização de tarefas diárias. A SoundCloud está testando um novo recurso que permite às músicas serem vendidas diretamente, com o artista definindo o preço e recebendo 100% da receita líquida. Outras notícias incluem a introdução de novas funcionalidades no Google Find Hub, a integração do ChatGPT Health com o Epic, e a expansão da parceria Conecta entre a Bradesco Seguros e a Segura, que agora atende mais de 1.200 corretores através de inteligência artificial e atendimento especializado.", "ciencia": "Um projeto de sequenciamento genético em diatomés, conduzido por um grupo internacional de cientistas, revelou diferenças significativas entre essas microalgas, contribuindo para um melhor entendimento delas. Paralelamente, pesquisadores da Universidade de Cardiff apresentaram estudos na 2026 International Conference on Machine Learning (ICML 2026), explorando novas abordagens de inteligência artificial para a análise de dados biológicos complexos. No campo da astronomia, a formação de estrelas tem diminuído ao longo dos últimos 4,5 bilhões de anos, mas a quantidade de material necessário para isso não diminuiu, sugerindo que a redução não é simplesmente devida a uma crise de 'combustível'. Outros assuntos incluem a erupção do vulcão Sinabung na Indonésia, que elevou o nível de alerta, e a possível detecção de matéria escura por um dos maiores experimentos de busca dessa partícula, embora a natureza exata da partícula ainda seja incerta.", "cultura": "O Festival Internacional de Cinema de Busan, na sua 31ª edição, apresentou um line-up de 315 filmes, com 246 seleções oficiais de 59 países, incluindo 95 estreias mundiais, o que o torna o maior line-up desde 2019. Paralelamente, a 29ª edição do Festival de Cultura e Gastronomia de Tiradentes atraíu cerca de 70 mil pessoas em dez dias, explorando as conexões entre a cozinha mineira e portuguesa. A artista coreano-chinesa Woo Jin Joo criou obras inspiradas em criaturas mágicas e shamanismo, usando materiais descartados de Londres. A escritora Gladys González lançou um novo poemário chamado 'Animalito Salvaje', revisitando o processo de morte do seu avô e explorando o sofrimento associado à velhice e ao deterioramento.", "sociedade": "O Notting Hill Carnival, que comemora a cultura afro-caribenha britânica, retorna para sua 60ª edição no West London com música, dança e trajes coloridos. Em Hong Kong, a saúde mental é um tema de discussão, com a secretária de Educação anunciando uma campanha para melhorar o bem-estar dos alunos, focada em prevenir bullying. No Brasil, o Setembro Amarelo destaca a importância de combater a dismorfia corporal, enquanto a saúde mental é reconhecida como uma política de Estado, apesar da persistência da epidemia de ansiedade e vícios em jogos. Em Hong Kong, foi noticiada a expansão das categorias de subsídio de saúde, enquanto em São Paulo, um tenente da Polícia Militar foi preso por deixar o trabalho durante o horário de serviço, usando um bico como justificativa. No Brasil, a inovação no tratamento da epilepsia enfrenta desafios para ser implementada no SUS, enquanto a rubéola atinge altos níveis nos Estados Unidos, contrariando as autoridades locais.", "meio_ambiente": "Um desastre no Himalaia resultou em mais de mil mortes e quatro mil desaparecidos em Nepal e China, após o colapso de um glaciar que liberou grandes quantidades de rochas, gelo e água derretida para vales abaixo, causando fortes inundações. Em Manila, Filipinas, a fumaça proveniente de incêndios florestais na Indonésia cobriu o centro da cidade, levando a alertas de saúde pública e recomendações para o uso de máscaras N95. Na região autônoma do Tibete, um minuto de silêncio foi observado em memória das vítimas de um deslizamento de lama que matou cerca de mil pessoas e deixou milhares desaparecidos na fronteira entre China e Nepal. Na Nova Gales do Sul, Vitoria e Tasmânia, os invernos mais quentes na história foram registrados, com previsões de temperaturas acima da média para todo o país durante o outono. Além disso, a seca na Amazônia ameaça o agronegócio, com 57% da renda do setor no Brasil dependendo das chuvas nas Terras Indígenas da região, conforme alerta um especialista.", "direitos_humanos": "A Organização Mundial da Saúde (OMS) expressou preocupações sobre a qualidade da água deteriorada e a contaminação na Faixa de Gaza, com o risco de doenças aumentando. De janeiro a agosto deste ano, mais de 6.700 amostras de água foram testadas, e a contaminação microbiológica quase triplicou, passando de menos de 6% em janeiro para mais de 18% em agosto. Em outro desenvolvimento, o ex-procurador público no Japão que acusou seu chefe de estupro está pedindo reformas no escritório do procurador público, em resposta a uma série de escândalos relacionados à conduta imprópria de procuradores de elite. Além disso, a OMS também destacou a situação de garotas jovens vendidas por seus pais no Afeganistão, retratada em uma exposição de fotografia na festa Visa pour l'Image em Perpignan, na França, por Elise Blanchard. No Chile, o presidente Boric afirmou conhecer Cerimedo, mas nunca o contratou, enquanto a ex-ministra Steinert desistiu de solicitar uma reconsideração à Contraloria, e o governo apresentou uma agenda para fortalecer a proteção à infância."}, "resumo_do_dia": {"politica_nacional": [{"id": 137604, "titulo": "Mendonça pede a Fachin sessão do STF para discutir mensagens entre Vorcaro e Moraes apontadas pela PF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/mendonca-pede-a-fachin-sessao-do-stf-para-discutir-mensagens-entre-vorcaro-e-moraes-apontadas-pela-pf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-01T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça, do STF, solicitou uma sessão presencial para discutir mensagens que sugerem uma comunicação entre o ministro Alexandre de Moraes e o ex-banqueiro Daniel Vorcaro. Essas mensagens foram apontadas pela Polícia Federal.", "titulo_pt": "Mendonça pede sessão do STF para discutir mensagens entre Moraes e Vorcaro apontadas pela PF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 137627, "titulo": "Relatório da PF sobre mensagens de Vorcaro aponta vários encontros do dono do Master com Moraes", "url": "https://g1.globo.com/politica/noticia/2026/09/01/relatorio-da-pf-sobre-mensagens-de-vorcaro-aponta-varios-encontros-do-dono-do-master-com-moraes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-01T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório da Polícia Federal indica que o dono do Master, Daniel Vorcaro, teve vários encontros com o ministro Alexandre de Moraes entre março de 2024 e agosto de 2025, conforme consta em diálogos extraídos de seu celular. O documento foi divulgado após André Mendonça, relator do caso no STF, ter retirado o sigilo do relatório.", "titulo_pt": "Relatório da PF aponta encontros entre Vorcaro e Moraes", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 137867, "titulo": "Moraes no caso Master: o que mostram as mensagens entre o ministro do STF e Daniel Vorcaro", "url": "https://www.bbc.com/portuguese/articles/cr5024ngz39o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-01T17:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mensagens do celular do banqueiro Daniel Vorcaro mostram interações com o ministro do STF, Alexandre de Moraes, e com pessoas ligadas à sua família. Filhos de Moraes teriam recebido cartões de crédito do Banco Master.", "titulo_pt": "Moraes no caso Master: o que mostram as mensagens entre o ministro do STF e Daniel Vorcaro", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 137628, "titulo": "Inquérito aponta que Moraes vetou participações em eventos em Londres organiados pelo Banco Master; \"Alexandre morre se fizer isso\", disse Vorcaro", "url": "https://g1.globo.com/politica/noticia/2026/09/01/inquerito-aponta-que-moraes-vetou-participacoes-em-eventos-em-londres-organiados-pelo-banco-master-alexandre-morre-se-fizer-isso-disse-vorcaro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-01T17:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O inquérito da Polícia Federal revela que o ministro Alexandre de Moraes, do STF, participava das decisões sobre a programação e a lista de convidados de um fórum jurídico organizado pelo Banco Master em Londres. Foram encontrados registros de vetos atribuídos a Moraes e de sua participação na alteração da programação do evento.", "titulo_pt": "Mensagens indicam que Moraes vetou participações em fórum organizado pelo Banco Master em Londres", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 137629, "titulo": "Mensagens revelam tratativas para custeio de viagens de cúpula da PF, PGR e STF a Londres", "url": "https://g1.globo.com/politica/noticia/2026/09/01/mensagens-revelam-tratativas-para-custeio-de-viagens-a-londres.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-01T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Diálogos interceptados pela Polícia Federal detalham a organização de um fórum jurídico internacional em Londres, envolvendo o banqueiro Daniel Vorcaro e assessores. As tratativas incluem o custeio de viagens para o Procurador-Geral da República Paulo Gonet, seu filho Pedro Gonet, e o diretor-geral da Polícia Federal Andrei Passos.", "titulo_pt": "Mensagens mostram tratativas para custeio de viagens de cúpula da PF, PGR e STF a Londres", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 137768, "titulo": "Simples Nacional muda em 2027 e exigirá nova escolha de empresas", "url": "https://www.metropoles.com/brasil/simples-nacional-muda-em-2027-e-exigira-nova-escolha-de-empresas", "fonte_id": "metropoles", "data_pub": "2026-09-01T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir de 2027, as micro e pequenas empresas terão de escolher como recolher os novos tributos da reforma tributária. O sistema Simples Nacional será alterado nesse período.", "titulo_pt": "Simples Nacional muda em 2027 e exigirá nova escolha de empresas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 137630, "titulo": "Vorcaro reclamou a sócio que pagamento não foi feito para escritório de esposa de Moraes: 'Contrato mais importante que temos'", "url": "https://g1.globo.com/politica/noticia/2026/09/01/vorcaro-pagamento-escritorio-esposa-moraes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-01T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daniel Vorcaro, fundador do Banco Master, informou a um sócio que o pagamento ao escritório de Viviani Barci de Moraes, esposa do ministro Alexandre de Moraes, era o contrato mais importante da empresa. Vorcaro manifestou-se surpreso com o não pagamento e expressou preocupação com as consequências.", "titulo_pt": "Vorcaro reclamou a sócio sobre não pagamento ao escritório de esposa de Moraes", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 137605, "titulo": "Datafolha divulga nesta quinta (3) nova pesquisa sobre eleição presidencial", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/datafolha-divulga-nesta-quinta-3-nova-pesquisa-sobre-eleicao-presidencial.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-01T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa do Instituto Datafolha sobre a eleição presidencial será lançada nesta quinta-feira (3).", "titulo_pt": "Datafolha divulga nova pesquisa sobre eleição presidencial nesta quinta-feira", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 137606, "titulo": "Delator de irregularidades na compra de vacinas da Covid é quem mais doou para própria campanha", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/delator-de-irregularidades-na-compra-de-vacinas-da-covid-e-quem-mais-doou-para-propria-campanha.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-01T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luís Miranda, candidato a deputado distrital pelo Democrata-DF, é o delator que mais doou para a própria campanha, conforme dados do TSE. Ele lidera em doações de sua própria campanha em todo o país.", "titulo_pt": "Delator que mais doou para própria campanha é o candidato a deputado luís miranda", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 137607, "titulo": "Vorcaro negociou jatinho e helicóptero em 2º contrato de R$ 50 mi com escritório de esposa de Moraes", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/vorcaro-negociou-jatinho-e-helicoptero-em-2o-contrato-de-r-50-mi-com-escritorio-de-esposa-de-moraes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-01T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal investiga a negociação de cotas de um jatinho e de um helicóptero entre o ex-banqueiro Daniel Vorcaro e o escritório de Viviane Barci de Moraes, esposa do ministro Alexandre de Moraes, do STF, como pagamento por um segundo contrato no valor de R$ 50 milhões.", "titulo_pt": "Vorcaro negociou jatinho e helicóptero em segundo contrato de R$ 50 mi com escritório de esposa de Moraes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 137709, "titulo": "Vorcaro relatou a Moraes “informações informais e em confidência” do BC", "url": "https://www.cnnbrasil.com.br/politica/vorcaro-relatou-a-moraes-informacoes-informais-e-em-confidencia-do-bc/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dono do Banco Master relatou informações informais e em confidência ao ministro do STF, Alexandre Moraes. As mensagens obtidas pela PF indicam que ele tinha conhecimento das medidas contra a instituição.", "titulo_pt": "Vorcaro relatou a Moraes informações informais do BC", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 137846, "titulo": "Por que analistas desconfiam do saldo positivo que Lula prometeu no orçamento de 2027", "url": "https://veja.abril.com.br/economia/por-que-analistas-desconfiam-do-saldo-positivo-que-lula-prometeu-no-orcamento-de-2027/", "fonte_id": "veja", "data_pub": "2026-09-01T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo apresentou o projeto orçamentário para 2027, que prevê um superávit pela primeira vez em quatro anos. No entanto, analistas desconfiam do saldo positivo prometido.", "titulo_pt": "Por que analistas desconfiam do saldo positivo do orçamento de 2027", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 137608, "titulo": "Moraes e Vorcaro se encontraram pelo menos seis vezes, indicam mensagens", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/moraes-e-vorcaro-se-encontraram-pelo-menos-seis-vezes-indicam-mensagens.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-01T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daniel Vorcaro se encontrou com o ministro Alexandre de Moraes pelo menos seis vezes, conforme indicam mensagens obtidas pela Polícia Federal no celular de Vorcaro.", "titulo_pt": "Moraes e Vorcaro se encontraram pelo menos seis vezes, indicam mensagens", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 137631, "titulo": "Vorcaro diz a Moraes que tem 'dívida de vida' com ministro e agradece por 'tudo', aponta PF", "url": "https://g1.globo.com/politica/noticia/2026/09/01/vorcaro-diz-a-moraes-que-tem-divida-de-vida-com-ministro-e-agradece-por-tudo-aponta-pf.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-01T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-banqueiro Daniel Vorcaro afirmou à Polícia Federal que tem uma 'dívida de vida' com o ministro Alexandre de Moraes e agradeceu a ele em uma mensagem enviada no mesmo dia de um encontro entre os dois. A mensagem foi enviada por Vorcaro às ansa.it/sito/notizie/topnews/2026/09/01/fonti-ue-missili-in-scadenza-coprono-meta-delle-esigenze-di-kiev_ecad51ee-a67e-4009-b366-ec906e388cf4.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-01T17:55:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A União Europeia está informando que os mísseis em estoque podem durar até metade das necessidades de Kiev. Essa informação foi dada durante todo o inverno.", "titulo_pt": "Ue, 'mísseis em prazo de validade cobrirão metade das necessidades de Kiev'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 138280, "titulo": "IAEA reports progress in Syria investigation, none in Iran", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/iaea-reports-progress-syria-investigation-none-iran", "fonte_id": "middle_east_eye", "data_pub": "2026-09-01T17:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Agência Internacional de Energia Atômica (AIEA) relatou avanços em sua investigação sobre atividades nucleares secretas no passado na Síria sob o regime Assad, mas não houve progresso na investigação da Irã, devido à falta de acesso para verificar estoques de urânio desde ataques americanos e israelenses em junho de 2025.", "titulo_pt": "Aiea relata avanços na investigação da síria, mas nenhum progresso na Irã", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 137969, "titulo": "Israeli Raid in Gaza Kills 4, Palestinian Officials Say", "url": "https://www.nytimes.com/2026/09/01/world/middleeast/israel-gaza-hamas-leader.html", "fonte_id": "nyt_world", "data_pub": "2026-09-01T17:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um operação israelense em Gaza resultou na morte de quatro pessoas, conforme informaram os órgãos palestinos. Apesar de um cessar-fogo apoiado pelos Estados Unidos, os combates continuaram no enclave.", "titulo_pt": "Operação israelense em Gaza mata 4, dizem autoridades palestinas", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 138077, "titulo": "ICE says it has enough body cameras now, after series of deadly shootings", "url": "https://www.npr.org/2026/09/01/g-s1-141408/ice-body-cameras-immigration", "fonte_id": "npr_news", "data_pub": "2026-09-01T17:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ICE afirma ter agora suficientes câmeras corporais para reduzir preocupações sobre a transparência e a responsabilidade da agência após uma série de mais de duas dúzias de tiroteios envolvendo agentes imigratórios durante o governo Trump.", "titulo_pt": "ICE afirma ter câmeras corporais suficientes após série de tiroteios", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 138191, "titulo": "U.S. strikes Iran after new Hormuz Strait shipping attacks: Centcom", "url": "https://www.cnbc.com/2026/09/01/us-strikes-iran-after-new-hormuz-strait-shipping-attacks-centcom.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-01T17:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Central do Comando dos Estados Unidos anunciou novos ataques na área do Estreito de Ormuz após ataques iranianos a navios e pessoal militar dos EUA.", "titulo_pt": "Estados unidos realiza novas operações após ataques iranianos no estreito de Ormuz: centcom", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 138281, "titulo": "IRGC say US will 'regret' renewed attacks", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/irgc-say-us-will-regret-renewed-attacks", "fonte_id": "middle_east_eye", "data_pub": "2026-09-01T17:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Irã's Islamic Revolutionary Guard Corps (IRGC) afirmou que os EUA vão 'reagir' a novas agressões. O porta-voz Hossein Mohebi declarou que severas punições aguardam os agressores e que os EUA vão 'reagir' a essas novas agressões. A Tasnim news agency informou que o Irã responderá a ataques americanos com uma reação 'várias vezes maior'.", "titulo_pt": "IRGC diz que EUA vão 'reagir' a novas agressões", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 138271, "titulo": "I Pasdaran minacciano gli Usa, 'si pentiranno dei nuovi attacchi'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/01/i-pasdaran-minacciano-gli-usa-si-pentiranno-dei-nuovi-attacchi_da2bc4cc-2d75-4915-8ff1-2f84cc453ab4.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-01T17:48:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Os Pasdaran ameaçaram os Estados Unidos, afirmando que eles se arrependerão dos novos ataques. Uma punição severa está aguardando os agressores.", "titulo_pt": "Pasdaran ameaçam EUA: 'eles se arrependerão dos novos ataques'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 138214, "titulo": "US launches further strikes on Iran as conflict flares up", "url": "https://www.ft.com/content/c557ccc2-9fe7-4725-8a1c-c40a0948e8d3?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-01T17:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos realizaram novos ataques contra a Irã, aumentando a tensão entre os dois países. Isso levou a um aumento nas prices do petróleo e nos rendimentos das títulos do Tesouro norte-americanos, refletindo as preocupações com uma nova onda de inflação.", "titulo_pt": "EUA lançam novos ataques à Irã, agravando tensões", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 138282, "titulo": "Trump warns of 'much harder' action if Iran retaliates after strikes", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/trump-warns-much-harder-action-if-iran-retaliates-strikes", "fonte_id": "middle_east_eye", "data_pub": "2026-09-01T17:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, advertiu que a Irã enfrentará 'ações muito mais duras e intensas' se retaliar contra os ataques americanos, segundo ele 'justificados'. Trump afirmou que ainda há um ataque maior 'em espera' que, quando realizado, deixará 'muito pouco' do Irã.", "titulo_pt": "Trump ameaça resposta ainda mais dura à Irã em caso de retaliação", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 138283, "titulo": "US army secretary resigns amid signs of Pentagon unease with Iran war", "url": "https://www.middleeasteye.net/news/us-army-secretary-resigns-amid-signs-pentagon-unease-iran-war", "fonte_id": "middle_east_eye", "data_pub": "2026-09-01T17:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dan Driscoll, secretário do Exército dos Estados Unidos, apresentou sua demissão após relatos de tensões com o Secretário da Guerra Pete Hegseth. Essa decisão ocorre em meio a sinais de descontentamento do Pentágono com a guerra contra a Irã.", "titulo_pt": "Secretário do exército dos EUA se demite diante de sinais de descontentamento do pentágono com guerra contra a Irã", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 138202, "titulo": "US military says it struck IRGC targets in Iran after attacks on shipping in Strait of Hormuz", "url": "http://www.euronews.com/2026/09/01/us-military-says-it-struck-irgc-targets-in-iran-after-attacks-on-shipping-in-strait-of-hor", "fonte_id": "euronews", "data_pub": "2026-09-01T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos realizaram novas operações militares contra supostas forças do IRGC (Forças Revolucionárias Islâmicas do Irã) envolvidas em minagem no Estreito de Ormuz. As hostilidades retomaram após essas ações.", "titulo_pt": "Exército americano realiza novas operações contra alvos do IRGC no estreito de Ormuz", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 138246, "titulo": "The US military began striking targets in Iran, CENTCOM says", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/1/the-us-military-began-striking-targets-in-iran-centcom-says?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-01T17:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Exército dos Estados Unidos anunciou que começou a atacar alvos no Irã.", "titulo_pt": "Exército dos EUA inicia ataques a alvos no Irã", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 137874, "titulo": "Sheinbaum defiende en su segundo informe que México camina hacia la prosperidad con un Gobierno austero", "url": "https://elpais.com/mexico/2026-09-01/sheinbaum-defiende-en-su-segundo-informe-que-mexico-camina-hacia-la-prosperidad-con-un-gobierno-austero.html", "fonte_id": "elpais_america", "data_pub": "2026-09-01T17:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A presidente entra em seu terceiro ano de mandato com o combate à corrupção e o impulso à economia como prioridades, sob pressão dos Estados Unidos em relação à soberania mexicana. Sheinbaum defende em seu segundo relatório que o México avança para a prosperidade com um governo austero.", "titulo_pt": "Sheinbaum defende em seu segundo relatório que México avança para a prosperidade com governo austero", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 137968, "titulo": "Weeks After Failed Drone Attack, Germany Points Finger at Russia", "url": "https://www.nytimes.com/2026/09/01/world/europe/germany-russia-drone-airport.html", "fonte_id": "nyt_world", "data_pub": "2026-09-01T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Alemanha acusa Moscou de estar por trás de um dron carregado com explosivos encontrado perto de um avião ucraniano em um aeroporto alemão há um mês. A Rússia nega ter qualquer evidência fornecida pela Alemanha.", "titulo_pt": "Semana após ataque com Drone falhado, Alemanha atribui culpa à Rússia", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id":
