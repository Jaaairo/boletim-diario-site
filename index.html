const D = {"gerado_em": "14/09/2026 15:19", "stats": {"noticias_novas": 950, "resumos_gerados": 248}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Flávio Bolsonaro, candidato do PL, reduziu a vantagem do petista Lula na simulação do 1º turno e apareceu numericamente à frente na projeção do 2º turno pela primeira vez desde abril. O cenário eleitoral mantém a disputa em aberto. Além disso, a Polícia Federal investiga contatos entre Cezinha de Madureira, deputado federal do PL, e ministros de tribunais superiores, acusado de tráfico de influência. A investigação envolve o STF, STJ e TSE, e a PF entregou cópias do celular de Vorcaro a ministros do STF. A presidente da SBPC, Francilene Garcia, destaca que os desafios estratégicos do Brasil, como envelhecimento populacional e transição energética, não estão sendo discutidos na campanha eleitoral.", "mundo": "A crise política e econômica global continua sendo um tema de destaque, com diversos eventos importantes ocorrendo em diferentes partes do mundo. Em primeiro lugar, a decisão do governo sírio de aumentar os preços do combustível em até 40% levou a protestos generalizados no país, agravando a situação já crítica devido ao alto custo de vida. Em seguida, o presidente dos Estados Unidos, Donald Trump, acusa uma 'conspiração doentia' contra a inteligência artificial e os centros de dados, afirmando que a China é a única beneficiada, o que pode ter implicações significativas para o desenvolvimento tecnológico global. Além disso, a questão do custo de vida continua a ser um problema primordial para a população francesa, com a França pessimista e os candidatos a presidente correndo para tornar a questão do custo de vida o principal tema de suas campanhas. Em outro ponto do mundo, o presidente ucraniano, Volodymyr Zelensky, pediu garantias de que a Rússia vai parar os ataques a alvos energéticos, enquanto o secretário-geral da NATO, Mark Rutte, afirmou que um ataque aéreo russo em um trem perto da fronteira entre Ucrânia e Polônia não dissuadirá os patrocinadores ocidentais da Ucrânia.\n\nA região do Oriente Médio e do Ártico continua a enfrentar tensões geopolíticas significativas. A Arábia Saudita interrompeu temporariamente o pipeline de petróleo entre o Oriente e o Ocidente, afetando as exportações globais de petróleo e as rotas marítimas, com impacto nas entregas para a Europa e Ásia. Além disso, o Irã negou qualquer envolvimento no conflito na Arábia Saudita, enquanto o preço do petróleo Brent subiu acima dos 100 dólares por barril devido às tensões na região do Golfo Pérsico, especialmente devido ao conflito no Irã que está interferindo nas rotas de navegação pelo Estreito de Ormuz. Em outro desenvolvimento, a Alemanha recebeu um relatório da agência de contra-inteligência militar alemã, MAD, alertando para um aumento da ameaça de operações de espionagem híbridas e de agentes contratados recrutados, indicando que a Alemanha é um alvo prioritário das atividades de espionagem russa. O relatório destaca a posição geoestratégica da Alemanha na Europa e no NATO, bem como a expansão das Forças Armadas Alemãs e a introdução de novos sistemas de armas como razões para o aumento do alvo.", "economia": "A credibilidade do chairman do Federal Reserve (Fed) está ameaçada devido às pressões políticas e econômicas, especialmente com a inflação persistente e a guerra no Irã, que elevou os preços do petróleo e afetou o rendimento dos títulos do Tesouro dos Estados Unidos. O rendimento do título a dez anos atingiu 5%, o maior nível desde 2023, refletindo a incerteza econômica. Em outro desenvolvimento, o Banco de Brasília (BRB) afastou cinco funcionários, incluindo dois ex-diretores, em decorrência de investigações sobre o Banco Master. Essa é a primeira medida de afastamento decorrente da apuração interna. Além disso, a reforma tributária, que foca mais na governança do que na legislação, exige a integração de decisões comerciais, jurídicas e financeiras, impactando significativamente as empresas.", "tecnologia": "O presidente dos Estados Unidos, Joe Biden, defendeu o desenvolvimento acelerado da inteligência artificial (IA) em diversos artigos e comentários, contrapondo-se a líderes de empresas de IA que pediram cautela. Em um tweet, Trump afirmou que o setor de IA não precisa de novas 'barreiras de proteção', enquanto criticou o CEO da Anthropic, Dario Amodei, por sugerir um atraso no desenvolvimento da IA. Em contraste, Steve Bannon e Bernie Sanders uniram-se para apelar por uma regulação mais forte da tecnologia de IA. A Microsoft também anunciou a implementação de limites para modelos de IA futuros, buscando se posicionar como uma empresa responsável. Outros eventos incluem a proposta chinesa de uma comunidade de código aberto do Brics para IA, bem como a discussão sobre o uso da IA na construção de casas em 48 horas por meio de impressoras 3D. Além disso, pesquisadores chineses desenvolveram um mapa de cinco etapas para o auto-aumento recursivo da IA, enquanto a China e os EUA minimizaram as preocupações sobre o desenvolvimento da IA, afirmando que existem exageros que podem atrapalhar as ações governamentais sobre o tema.", "ciencia": "Uma pesquisa global, liderada pela Universidade de Newcastle, produziu o retrato genético mais completo de uma planta que gosta de sal, com potencial para auxiliar na produção de alimentos em ambientes áridos. De acordo com a pesquisa, publicada em [phys_org], a Salicornia, uma planta que prospera em terrenos salgados, pode fornecer informações valiosas para a agricultura em regiões desérticas e costeiras. Paralelamente, a Definium, uma empresa de biotecnologia, conseguiu aliviar a ansiedade em um segundo grande teste com terapia baseada em LSD, uma técnica que parece oferecer benefícios rápidos e que está se aproximando da aprovação regulatória. Além disso, a BioNTech anunciou que seu medicamento contra o câncer de pulmão, gotistobart, estendeu a sobrevivência dos pacientes em comparação com a quimioterapia padrão, com uma mediana de 18,5 meses. Essas descobertas e avanços na ciência e na medicina podem ter implicações significativas para a agricultura sustentável e o tratamento de doenças.", "cultura": "Em setembro e outubro, diversos eventos e iniciativas marcaram a cultura brasileira e internacional. Em São Paulo, a artista Paula Siebra inaugurou a exposição 'Pequeno Mapa do Tempo', uma mostra interativa na Casa Iramaia, nos Jardins. No Rio de Janeiro, o Ministério da Cultura homologou o tombamento do Palacete Celina Guinle e Linneo de Paula Machado, junto com seus jardins, um processo que vinha tramitando desde 1990. Por outro lado, o Masp apresentou uma exposição que abrange a diversidade cultural da América Latina, com quase 200 obras distribuídas em cinco andares. No Reino Unido, o Hospital St Barts, que recebeu fundos de benfeitores envolvidos no tráfico de escravos, ainda ostenta painéis de mármore na Great Hall que homenageiam esses doadores, refletindo um passado escuro que persiste em espaços históricos. Além disso, o rapper Gabriel o Pensador venceu uma ação judicial e será indenizado após sua música ter sido usada em uma campanha política sem autorização, destacando a importância do direito autoral na cultura contemporânea.", "sociedade": "Nikolas Ferreira, um deputado bolsonarista, organizou um evento no Amapá em favor do impeachment de Alexandre de Moraes, destacando a força do movimento popular por essa medida. No Chile, o país se tornou o primeiro da América do Sul a ser validado pela OMS como tendo eliminado a raiva transmitida por cães como problema de saúde pública. No entanto, a situação de saúde em áreas metropolitanas do Chile é preocupante, com 27,7% dos pacientes em regiões metropolitanas aguardando atendimento fora do horário padrão, totalizando mais de 634 mil pessoas. Além disso, um paciente esteve em risco vital e aguardou mais de 73 horas na emergência. No Brasil, o Setembro Vermelho destaca a importância de cuidados com o coração desde a infância, já que cardiopatias congênitas são uma das principais causas de complicações cardíacas em crianças. O SUS imunizou mais de 1 milhão de crianças contra doenças pneumocócicas, destacando a importância da vacina Pneumo 20, que protege contra doenças como meningite e pneumonia.", "meio_ambiente": "Os oceanos têm registrado temperaturas acima da média, batendo um novo recorde, conforme alerta do Greenpeace. Este fenômeno, que dura 100 dias, está sendo agravado pelo El Niño atual. Em Eldorado, no interior de São Paulo, fortes chuvas causaram a cheia do Rio Ribeira de Iguape, submergindo a cidade. Um estudo revela que os glaciares dos Himalaias estão derretendo mais rapidamente do que há uma década, ameaçando a segurança hídrica de 2 bilhões de pessoas na Ásia até 2050. O relatório indica que milhões de vidas estão em risco à medida que o Himalaia se aproxima do ponto de não retorno. Além disso, o calor extremo de 2026 na Inglaterra registrou dias entre os mais quentes de sua história devido ao aumento da demanda para serviços de ambulâncias.", "direitos_humanos": "A ONU expressou preocupação com o Brasil durante uma reunião do Conselho de Direitos Humanos, criticando a falta de auditoria no país, especialmente em relação à escravidão e ao tráfico de pessoas. Em uma operação policial em território turco, pelo menos 60 pessoas foram detidas em operações anti-LGBTQ+ em bares e casas de ativistas. No Congo, uma tragédia escolar resultou na morte de 26 crianças, levando a uma cerimônia de enterro coletiva e pedidos de investigação. Na França, documentos do serviço de saúde registraram ferimentos em pessoas deportadas do Reino Unido, sob o controverso esquema 'um por um', que está prestes a terminar. Em um conflito de gêneros, uma seita hindu pediu que mulheres não trabalhassem na Torre Eiffel durante a visita de seus monges, levando a uma greve no local. Além disso, um barco com imigrantes afundou na Grécia, deixando 25 pessoas desaparecidas, enquanto um homem foi denunciado por supostas importunações sexuais em uma estação de metrô. Países como Austrália e Brasil implementaram leis para proteger menores de idade das redes sociais, enquanto o Congresso chileno tramita um projeto similar."}, "resumo_do_dia": {"politica_nacional": [{"id": 160934, "titulo": "PF pediu aval de Mendonça para obter repasses de Vorcaro a pessoas com foro", "url": "https://www.cnnbrasil.com.br/politica/pf-pediu-aval-de-mendonca-para-obter-repasses-de-vorcaro-a-pessoas-com-foro/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-14T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal pediu aval ao ministro André Mendonça para obter repasses de Vorcaro a pessoas com foro. Não há, no andamento do processo, uma resposta de Mendonça sobre o tema.", "titulo_pt": "PF pediu aval de Mendonça para obter repasses de Vorcaro a pessoas com foro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 161034, "titulo": "Erros, silêncios e virtudes da PEC da segurança", "url": "https://www.jota.info/opiniao-e-analise/artigos/erros-silencios-e-virtudes-da-pec-da-seguranca", "fonte_id": "jota", "data_pub": "2026-09-14T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto da PEC da segurança prevê a endurecimento penal, mas representa uma ameaça às garantias constitucionais e não considera a participação social.", "titulo_pt": "Erros, silêncios e virtudes da PEC da segurança", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 161035, "titulo": "Lula x Flávio: preferência e rejeição deixam eleição em aberto, diz Globo/Quaest", "url": "https://www.jota.info/eleicoes/eleicoes-2026/lula-x-flavio-preferencia-e-rejeicao-deixam-eleicao-em-aberto-diz-globo-quaest", "fonte_id": "jota", "data_pub": "2026-09-14T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato do PL, reduziu a vantagem do petista Lula na simulação do 1º turno e apareceu numericamente à frente na projeção do 2º turno pela primeira vez desde abril.", "titulo_pt": "Lula x Flávio: preferência e rejeição deixam eleição em aberto", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 161036, "titulo": "PF cita contatos de Cezinha de Madureira com ministros em operação sobre influência em tribunais", "url": "https://www.jota.info/justica/pf-cita-contatos-de-cezinha-de-madureira-com-ministros-em-operacao-sobre-influencia-em-tribunais", "fonte_id": "jota", "data_pub": "2026-09-14T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal investiga contatos entre Cezinha de Madureira e ministros de tribunais superiores, mas afirma que a conduta dos ministros não está sendo alvo da apuração.", "titulo_pt": "PF cita contatos de Cezinha de Madureira com ministros em operação sobre influência em tribunais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 160948, "titulo": "Quem é Cezinha de Madureira, alvo de operação da PF nesta segunda (14)", "url": "https://www.cnnbrasil.com.br/politica/quem-e-cezinha-de-madureira-alvo-de-operacao-da-pf-nesta-segunda-14/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-14T16:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cezinha de Madureira, deputado federal do PL e pastor da Assembleia de Deus, é alvo de operação da Polícia Federal por possíveis irregularidades na destinação de emendas parlamentares e suposto tráfico de influência.", "titulo_pt": "Quem é Cezinha de Madureira, alvo de operação da PF nesta segunda (14)", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 160816, "titulo": "Quem ganhar a eleição precisa conduzir o Brasil a ‘juros civilizatórios’, diz André Esteves", "url": "https://veja.abril.com.br/economia/quem-ganhar-a-eleicao-precisa-conduzir-o-brasil-a-juros-civilizatorios-diz-andre-esteves/", "fonte_id": "veja", "data_pub": "2026-09-14T16:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "André Esteves, controlador do banco BTG Pactual, afirmou que o próximo governo precisa conduzir o Brasil a juros civilizatórios. Ele também expressou otimismo sobre a capacidade do próximo governo de ajustar as contas públicas.", "titulo_pt": "Quem ganhar a eleição precisa levar o Brasil a juros civilizatórios, diz André Esteves", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 160760, "titulo": "PF aponta que Cezinha de Madureira teria atuado junto a Nunes Marques em dois processos no STF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/pf-aponta-que-cezinha-de-madureira-atuou-junto-a-nunes-marques-em-dois-processos-no-stf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-14T15:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal apontou que o deputado Cezinha de Madureira teria atuado como facilitador junto ao ministro do STF Kassio Nunes Marques em pelo menos dois processos. Conversas obtidas pela PF sugerem essa colaboração entre eles.", "titulo_pt": "PF indica que Cezinha de Madureira teria atuado com kassio Nunes Marques em dois processos no STF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 160776, "titulo": "Ciência ainda não foi lembrada na campanha eleitoral, diz SBPC", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/ciencia-ainda-nao-foi-lembrada-na-campanha-eleitoral-diz-sbpc", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-14T15:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A presidenta da Sociedade Brasileira para o Progresso da Ciência (SBPC), Francilene Garcia, afirma que os desafios estratégicos do Brasil, como o envelhecimento populacional e a transição energética, não estão sendo discutidos na campanha eleitoral. Os escândalos recentes e as disputas pessoais estariam aprofundando o esvaziamento dessas discussões.", "titulo_pt": "Ciência ainda não foi lembrada na campanha eleitoral, diz SBPC", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 160761, "titulo": "Pedido da PF sobre Cezinha de Madureira cita 'comercialização de influência' junto a STF, STJ e TSE", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/pedido-da-pf-sobre-cezinha-de-madureira-cita-comercializacao-de-influencia-junto-a-stf-stj-e-tse.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-14T15:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal realizou uma operação de busca e apreensão contra o deputado federal Cezinha de Madureira (PL-SP) por suspeitas de uma 'estrutura destinada à comercialização de influência' junto a ministros do STF, STJ e TSE.", "titulo_pt": "Pedido da PF sobre Cezinha de Madureira cita 'comercialização de influência' junto a STF, STJ e TSE", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 161037, "titulo": "Fachin suspende sigilo de investigação sobre pagamentos feitos a Vorcaro", "url": "https://www.jota.info/stf/do-supremo/fachin-suspende-sigilo-de-investigacao-sobre-pagamentos-feitos-a-vorcaro", "fonte_id": "jota", "data_pub": "2026-09-14T15:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Fachin suspendeu o sigilo de uma investigação sobre pagamentos feitos a Vorcaro. O pedido foi feito pelo ministro Alexandre de Moraes e aprovado pelo vice-procurador-geral Hindemburgo Chateaubriand Filho.", "titulo_pt": "Fachin suspende sigilo de investigação sobre pagamentos a Vorcaro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 160777, "titulo": "Campanha incentiva voto de quem tem mais de 70 anos", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/campanha-incentiva-voto-de-quem-tem-mais-de-70-anos", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-14T15:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mapeamento do data8 revela diferenças regionais na implementação do programa Seu Voto Importa, que visa atender eleitores com deficiência ou mobilidade reduzida, incluindo pessoas idosas com dificuldade de deslocamento, em mais de 300 municípios em São Paulo e 358 em Minas Gerais, mas estados como Amazonas e Mato Grosso do Sul não implementaram o programa.", "titulo_pt": "Campanha incentiva voto de quem tem mais de 70 anos", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 160762, "titulo": "Empresários doam a PL e PT ao mesmo tempo com repasses de R$ 5,6 milhões", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/empresarios-doam-a-pl-e-pt-ao-mesmo-tempo-com-repasses-de-r-56-milhoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-14T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ao menos 24 empresários dos setores de calçados, biocombustíveis e bancário doaram R$ 5,6 milhões para 46 políticos do PL e do PT durante a campanha eleitoral de 2026.", "titulo_pt": "Empresários doam R$ 5,6 milhões para PL e PT na campanha eleitoral de 2026", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 160763, "titulo": "Investigação não aponta destino de R$ 6 mi recebidos por entidade ligada à produtora de 'Dark Horse'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/investigacao-nao-aponta-destino-de-r-6-mi-recebidos-por-entidade-ligada-a-produtora-de-dark-horse.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-14T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Academia Nacional de Cultura (ANC), presidida por Karina Ferreira Gama, recebeu aproximadamente R$ 6,2 milhões em supostas triangulações de recursos públicos que chegaram à produtora Go Up Entertainment, responsável pelo filme 'Dark Horse'. A investigação não apontou o destino desses fundos.", "titulo_pt": "Investigação não aponta destino de R$ 6 mi recebidos por entidade ligada à produtora de 'Dark Horse'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 160733, "titulo": "Durigan defende novo corte linear de benefícios fiscais caso Lula seja reeleito", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/durigan-defende-novo-corte-linear-de-beneficios-fiscais-caso-lula-seja-reeleito.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-14T15:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, afirmou que o governo federal deve realizar um novo corte linear de benefícios fiscais caso o presidente Lula seja reeleito, com revisões anuais dessas medidas.", "titulo_pt": "Durigan defende novo corte linear de benefícios fiscais caso Lula seja reeleito", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 160764, "titulo": "Mendonça mantém sob reserva mais de 30 quebras de sigilo bancário e fiscal do Master", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/mendonca-mantem-sob-sigilo-mais-de-30-quebras-bancarias-do-master.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-14T14:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça, do STF, mantém sob sigilo mais de 30 quebras de sigilo bancário e fiscal relacionadas ao caso Master, incluindo empresas do ex-banqueiro Daniel Vorcaro.", "titulo_pt": "Mendonça mantém sob sigilo mais de 30 quebras de sigilo bancário e fiscal do caso Master", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 160765, "titulo": "Supremo dirá se o Brasil tem, ou não, um tribunal de confiança", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/dora-kramer/2026/09/supremo-dira-se-o-brasil-tem-ou-nao-um-tribunal-de-confianca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-14T14:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal vai julgar se o Brasil possui ou não um tribunal de confiança. Espera-se que os membros do tribunal, com experiência e autoridade, tomem decisões claras com base nas circunstâncias.", "titulo_pt": "Supremo decidirá se o Brasil tem um tribunal de confiança", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 161426, "titulo": "Taiwan urged to boost defense spending", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/15/2003864277", "fonte_id": "taipei_times", "data_pub": "2026-09-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Taiwan foi encorajada a aumentar gastos em defesa. O texto sugere que há uma recomendação para que a economia taiwanesa dedique mais recursos à área militar.", "titulo_pt": "Taiwan encorajada a aumentar gastos em defesa", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 161100, "titulo": "Syrians Protest as Surge in Fuel Prices Adds to Cost-of-Living Crisis", "url": "https://www.nytimes.com/2026/09/14/world/middleeast/syrians-protest-fuel-price-rises.html", "fonte_id": "nyt_world", "data_pub": "2026-09-14T17:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A decisão do governo de aumentar os preços do combustível em até 40% levou a manifestações generalizadas no país.", "titulo_pt": "Sirianos protestam ante aumento de preços de combustível e crise de custos", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 161130, "titulo": "Trump dice que hay una “conspiración enfermiza” contra la IA y los centros de datos y que “la única contenta es China”", "url": "https://elpais.com/tecnologia/2026-09-14/trump-dice-que-hay-una-conspiracion-enfermiza-contra-la-ia-y-los-centros-de-datos.html", "fonte_id": "elpais_america", "data_pub": "2026-09-14T17:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Trump, acusa uma 'conspiração doentia' contra a inteligência artificial e os centros de dados, afirmando que a única beneficiada é a China. Ele destaca que o país tem o direito de regular e tomar ações legais contra as empresas de inteligência artificial.", "titulo_pt": "Trump acusa 'conspiração doentia' contra IA e centros de dados, apontando China como beneficiária", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 161101, "titulo": "‘NAZA,’ Israeli Film About Killings in Gaza, Faces Backlash", "url": "https://www.nytimes.com/2026/09/14/world/middleeast/israel-naza-documentary-backlash.html", "fonte_id": "nyt_world", "data_pub": "2026-09-14T17:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme 'NAZA' examina os assassinatos de palestinos por forças israelenses em Gaza. O ministro da cultura israelense sugeriu revogar a cidadania dos diretores.", "titulo_pt": "Filme 'NAZA', sobre assassinatos de palestinos em Gaza, enfrenta contrarrepartida", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 161250, "titulo": "Leaders urge EU to expand Arctic presence amid Russia 'threat'", "url": "https://www.france24.com/en/europe/20260914-leaders-urge-eu-to-expand-arctic-presence-amid-russia-threat", "fonte_id": "france24", "data_pub": "2026-09-14T17:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Doze países europeus pediram ao European Union que aumentasse sua presença no Ártico, devido ao derretimento da geleada que está abrindo novos caminhos marítimos, enquanto tensões crescentes com a Rússia e Estados Unidos estão colocando a região sob maior foco geopolítico.", "titulo_pt": "Líderes pedem à ue para ampliar presença no ártico diante do 'risco' russo", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 161299, "titulo": "Iran seizes assets of 240 dissidents and journalists as protest arrests top 6,000", "url": "https://www.euronews.com/2026/09/14/iran-seizes-assets-of-240-dissidents-and-journalists-as-protest-arrests-top-6000", "fonte_id": "euronews", "data_pub": "2026-09-14T17:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O sistema judiciário iraniano congelou 182 contas bancárias e confiscou bens de jornalistas, ativistas e figuras públicas acusadas de apoiar governos hostis. Além disso, pelo menos 532 pessoas foram executadas desde janeiro, incluindo 29 relacionadas às protestos.", "titulo_pt": "Irã congela ativos de 240 dissidentes e jornalistas e executa mais de 500 pessoas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 161096, "titulo": "China’s Top Spy Chief Warns A.I. Is a Threat to Party Rule", "url": "https://www.nytimes.com/2026/09/14/world/asia/china-ai-security-risks-anthropic.html", "fonte_id": "nyt_world", "data_pub": "2026-09-14T17:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da inteligência do Partido Comunista Chinês está considerando a tecnologia de inteligência artificial como uma ameaça à segurança do partido, mesmo que Pequim incentive os Estados Unidos a não exagerar sobre os perigos da A.I.", "titulo_pt": "Chefe da inteligência da china avisa que A inteligência artificial é uma ameaça ao domínio do partido", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 161314, "titulo": "EU states to raise game as Arctic becomes strategic geopolitical frontier", "url": "https://www.aljazeera.com/news/2026/9/14/eu-states-to-raise-game-as-arctic-becomes-strategic-geopolitical-frontier?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-14T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Países europeus estão competindo com Rússia, China e Estados Unidos para explorar oportunidades de segurança e economia no Ártico.", "titulo_pt": "Estados europeus vão intensificar esforços no ártico frente à Rússia, china e EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 161315, "titulo": "Syria fuel price hikes test public patience with economic recovery", "url": "https://www.aljazeera.com/features/2026/9/14/syria-fuel-price-hikes-test-public-patience-with-economic-recovery?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-14T17:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ira cresce nas cidades sírias devido aos aumentos nos preços do combustível, o que agrava a situação financeira das famílias durante uma crise contínua de custos de vida.", "titulo_pt": "Aumentos nos preços do combustível testam a paciência do público sírio em recuperação econômica", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 160905, "titulo": "Trump: Rússia e Ucrânia concordam em não atacar instalações energéticas", "url": "https://www.metropoles.com/mundo/trump-russia-e-ucrania-concordam-em-nao-atacar-instalacoes-energeticas", "fonte_id": "metropoles", "data_pub": "2026-09-14T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump afirmou que a Rússia e a Ucrânia concordaram em não atacar instalações energéticas. Além disso, ele atribuiu o aumento nos preços do diesel ao conflito na Ucrânia, e não ao conflito dos EUA com o Irã.", "titulo_pt": "Trump: Rússia e Ucrânia concordam em não atacar instalações energéticas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 161342, "titulo": "Trump claims Russia and Ukraine have agreed energy truce", "url": "https://www.ft.com/content/d6f98d2e-9f0c-4414-a339-fe8462810276?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-14T17:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, afirmou que Rússia e Ucrânia concordaram em um acordo energético. A capital ucraniana, Kyiv, ficou surpresa com a declaração do presidente americano, uma vez que tentativas anteriores para parar os ataques a plantas de geração de energia e refinarias não foram bem-sucedidas.", "titulo_pt": "Trump afirma que Rússia e Ucrânia concordaram com um acordo energético", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 161317, "titulo": "JD Vance insists US is ‘on top of’ Houthi advance in Red Sea", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/14/jd-vance-insists-us-is-on-top-of-houthi-advance-in-red-sea?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-14T17:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vice-presidente dos Estados Unidos, JD Vance, afirma que a administração Trump está bem informada sobre o avanço dos hutíes na Arábia Saudita.", "titulo_pt": "JD Vance afirma que EUA estão 'no controle' do avanço hutí em águas do mar vermelho", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 161391, "titulo": "Trump, il petrolio crollerà con la fine della guerra in Iran, non ci vorrà molto", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/14/trump-il-petrolio-crollera-con-la-fine-della-guerra-in-iran-non-ci-vorra_191f9d92-5f26-4518-9feb-5bb97c88cbf4.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-14T17:13:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, atribuiu a Joe Biden a responsabilidade pelos aumentos nos preços do petróleo, afirmando que os preços cairão com a conclusão da guerra no Irã. Essa afirmação foi feita em uma publicação no aplicativo Truth Social.", "titulo_pt": "Trump culpa biden pelos aumentos nos preços do petróleo", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 161098, "titulo": "Saudi Leader Meets U.S. Commander as Houthi Attacks Threaten Oil Markets", "url": "https://www.nytimes.com/2026/09/14/world/middleeast/saudi-leader-meets-centcom.html", "fonte_id": "nyt_world", "data_pub": "2026-09-14T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O príncipe herdeiro Mohammed bin Salman pediu ao Estados Unidos mais ajuda militar após as forças houthis, apoiadas pelo Irã, lançarem uma ofensiva em grande escala no Iêmen. Essa ameaça está colocando em risco os mercados de petróleo.", "titulo_pt": "Líder saudita reúne com comandante dos EUA em face de ameaças houthis às mercadorias de petróleo", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 160943, "titulo": "Zelensky pede garantias de que Rússia vai parar ataques a alvos energéticos", "url": "https://www.cnnbrasil.com.br/internacional/zelensky-pede-garantias-de-que-russia-vai-parar-ataques-a-alvos-energeticos/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-14T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente ucraniano, Zelensky, pediu garantias de que a Rússia vai parar os ataques a alvos energéticos. O presidente dos EUA, Donald Trump, afirmou que Kiev e Moscou concordaram em não atacar instalações de energia.", "titulo_pt": "Zelensky pede garantias de que Rússia vai parar ataques a alvos energéticos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 161140, "titulo": "‘A coin flip’: inside Brazil’s knife-edge election as Flávio Bolsonaro closes in on Lula", "url": "https://www.theguardian.com/world/2026/sep/14/brazil-bolsonaro-far-right-minas-gerais", "fonte_id": "guardian_world", "data_pub": "2026-09-14T17:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro está intensificando sua campanha no estado de Minas Gerais, onde ele chegou a um aeroporto, e declarou que o Brasil precisa de um presidente e que ele é o candidato. Um grande banner do ex-presidente Jair Bolsonaro estava exposto no local.", "titulo_pt": "Moeda lançada: dentro da eleição apertada no Brasil com Flávio Bolsonaro se aproximando de Lula", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 161450, "titulo": "BIS says global market AI momentum showing signs of vulnerability", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/15/2003864266", "fonte_id": "taipei_times", "data_pub": "2026-09-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco Internacional de Desenvolvimento (BIS) observa sinais de vulnerabilidade no impulso atual do mercado global de inteligência artificial (IA).", "titulo_pt": "BIS registra sinais de vulnerabilidade no impulso atual do mercado global de IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 160728, "titulo": "BC dos BCs diz que euforia com IA no mercado apresenta sinais de vulnerabilidade", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/bc-dos-bcs-diz-que-euforia-com-ia-no-mercado-apresenta-sinais-de-vulnerabilidade.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-14T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O BIS, órgão que reúne os bancos centrais de todo o mundo, afirmou que a alta dos mercados de ações relacionada à inteligência artificial está apresentando sinais crescentes de vulnerabilidade. Nos últimos dois anos, as Bolsas do mundo dispararam devido à euforia com a IA, mas agora há preocupações sobre a estabilidade desses mercados.", "titulo_pt": "Bis avisa sobre sinais de vulnerabilidade nos mercados de ações devido à IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 161033, "titulo": "Maior impacto da reforma tributária não está na legislação, e sim na governança", "url": "https://www.jota.info/coberturas-especiais/pulso-da-reforma/maior-impacto-da-reforma-tributaria-nao-esta-na-legislacao-e-sim-na-governanca", "fonte_id": "jota", "data_pub": "2026-09-14T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma tributária enfoca mais a governança do que a legislação, exigindo que as empresas integrem decisões comerciais, jurídicas e financeiras que antes eram separadas.", "titulo_pt": "O maior impacto da reforma tributária está na governança, não na legislação", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 161046, "titulo": "SEC formula cargos a Enel por medición irregular que podría afectar a más de 56 mil clientes", "url": "https://www.latercera.com/pulso/noticia/sec-formula-cargos-a-enel-por-medicion-irregular-que-podria-afectar-a-mas-de-56-mil-clientes/", "fonte_id": "la_tercera", "data_pub": "2026-09-14T17:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A SEC formulou cargos contra a Enel por uma medição irregular que afetaria mais de 56 mil clientes. A distribuidora afirmou ter implementado um plano de ação que inclui a revisão dos casos detectados, a avaliação de medidas técnicas, o análise da facturização e a execução de regularizações comerciais necessárias.", "titulo_pt": "SEC formula cargos contra Enel por medição irregular que afeta mais de 56 mil clientes", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 161275, "titulo": "Warsh's credibility is on the line this week as Trump policies put pressure on Fed to hike", "url": "https://www.cnbc.com/2026/09/14/warshs-credibility-is-on-the-line-this-week-as-trump-policies-put-pressure-on-fed-to-hike.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-14T17:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A credibilidade do chairman do Fed está em jogo esta semana, pois as políticas de Trump estão pressionando a instituição a aumentar as taxas de juros, especialmente com a inflação acima do alvo e a falta de visibilidade sobre preços de petróleo mais baixos ou estabilidade nas tarifas.", "titulo_pt": "A credibilidade de warsh está em risco esta semana devido às políticas de Trump e a pressão para aumentar as taxas de juros", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 160802, "titulo": "Casas Bahia colocou mais de R$ 1 bi em fundo que cobra a empresa na recuperação", "url": "https://veja.abril.com.br/economia/casas-bahia-colocou-mais-de-r-1-bi-em-fundo-que-cobra-a-empresa-na-recuperacao/", "fonte_id": "veja", "data_pub": "2026-09-14T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Casas Bahia havia aplicado mais de R$ 1 bilhão em um fundo dois meses antes de sua recuperação judicial. O fundo aparece na lista de credores com uma dívida de R$ 1,085 bilhão a receber.", "titulo_pt": "Casas Bahia investiu mais de R$ 1 bi em fundo que cobra empresa na recuperação", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 160803, "titulo": "A receita econômica de Milei que Flávio Bolsonaro quer importar para o Brasil", "url": "https://veja.abril.com.br/economia/flavio-bolsonaro-vai-se-inspirar-em-milei-na-revogacao-de-normas-diz-coordenadora-economica-da-campanha/", "fonte_id": "veja", "data_pub": "2026-09-14T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, filho do ex-presidente Jair Bolsonaro, estaria interessado em implementar a economia proposta por Leandro Milei no Brasil. Daniella Marques afirma que haveria uma 'revogação' de normas se Flávio vencesse as eleições.", "titulo_pt": "A receita econômica de Milei que Flávio Bolsonaro quer importar para o Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 161338, "titulo": "Ten-year Treasury yield hits 5% for first time since 2023", "url": "https://www.ft.com/content/06cb850d-089a-4318-88d7-a410e9766b89?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-14T16:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rendimento da dívida americana a dez anos atingiu 5% pela primeira vez desde 2023, se aproximando de níveis não vistos em décadas devido à persistência do choque inflacionário causado pela guerra no Irã.", "titulo_pt": "Yield do tesouro americano a dez anos atinge 5% pela primeira vez desde 2023", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 160729, "titulo": "Títulos do Tesouro dos EUA disparam com petróleo a US$ 109 e atingem máximas em anos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/titulos-do-tesouro-dos-eua-disparam-com-petroleo-a-us-109-e-atingem-maximas-em-anos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-14T16:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos dos títulos do Tesouro dos Estados Unidos dispararam em decorrência da escalada da guerra no Irã e do aumento dos preços do petróleo.", "titulo_pt": "Títulos do Tesouro dos EUA disparam com guerra no Irã e alta do petróleo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 160730, "titulo": "Estudos do Conselho da Fiesp, chefiado por Campos Neto, embasam propostas de Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/estudos-do-conselho-da-fiesp-chefiado-por-campos-neto-embasam-propostas-de-flavio-bolsonaro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-14T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudos do Conselho Superior de Economia da Fiesp, liderado por Campos Neto, serão usados para embasar as propostas de política econômica do candidato à Presidência Flávio Bolsonaro.", "titulo_pt": "Estudos do Conselho da Fiesp, liderado por Campos Neto, servirão de base para as propostas de Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 160731, "titulo": "BRB afasta ex-diretores após investigação do caso Master", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/brb-afasta-ex-diretores-apos-investigacao-do-caso-master.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-14T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco de Brasília (BRB) afastou cinco funcionários, entre eles dois ex-diretores, como resultado de investigações sobre o Banco Master. Essa é a primeira medida de afastamento decorrente da apuração interna relacionada às operações do banco estatal com Daniel Vorcaro.", "titulo_pt": "BRB afasta ex-diretores após investigação do caso Master", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 161281, "titulo": "Why the election could make Washington's looming next fiscal crisis harder", "url": "https://www.cnbc.com/2026/09/14/election-debt-limit-fiscal-crisis-congress.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-14T15:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns republicanos já estão se afastando da ideia de aumentar o teto de dívida sem profundas cortes orçamentários à medida que a dívida nacional se aproxima dos 40 trilhões de dólares.", "titulo_pt": "Por que a eleição pode tornar a próxima crise orçamentária fiscal de Washington mais difícil", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 160734, "titulo": "Cartas de Pokémon atraem investidores e chegam a US$ 16,5 milhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/cartas-de-pokemon-atraem-investidores-e-chegam-a-us-165-milhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-14T15:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2025, Jordan Dunne, que trabalhava como analista de dados em um escritório de advocacia em Chester, Inglaterra, deixou seu emprego após seu hobby de negociar cartas de Pokémon se tornar mais lucrativo. A atividade lhe rendeu um valor significativo, embora o montante não seja especificado no trecho fornecido.", "titulo_pt": "Cartas de Pokémon atraem investidores e chegam a US$ 16,5 milhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 161038, "titulo": "Muito além das tarifas: acordo Mercosul-UE e a nova agenda de compliance de origem", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-da-abdf/muito-alem-das-tarifas-acordo-mercosul-ue-e-a-nova-agenda-de-compliance-de-origem", "fonte_id": "jota", "data_pub": "2026-09-14T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O acordo Mercosul-UE introduz um sistema de autocertificação para preferências tarifárias, eliminando a necessidade de um certificado e permitindo que as empresas comprovem sua origem por meio de suas próprias provas.", "titulo_pt": "Muito além das tarifas: acordo Mercosul-UE e a nova agenda de compliance de origem", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 160785, "titulo": "Mercado projeta corte da Selic para 13,75%", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/mercado-projeta-corte-da-selic-para-1375-nesta-semana", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-14T13:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado financeiro espera que a taxa básica de juros (Selic) seja reduzida em 0,25 ponto percentual pela Comissão de Política Monetária (Copom) em reunião prevista para esta semana, passando de 14% para 13,75%. A projeção consta do Boletim Focus, divulgado pelo Banco Central.", "titulo_pt": "Mercado projeta corte da Selic para 13,75%", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 160736, "titulo": "Justiça determina que trabalhadores dos Correios mantenham 80% do efetivo durante greve", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/justica-determina-que-trabalhadores-dos-correios-mantenham-80-do-efetivo-durante-greve.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-14T13:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior do Trabalho determinou que os trabalhadores dos Correios mantenham 80% do efetivo em cada unidade durante a paralisação. A decisão foi tomada em uma liminar no sábado (12).", "titulo_pt": "Justiça determina que trabalhadores dos Correios mantenham 80% do efetivo durante greve", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 161343, "titulo": "Why delaying an AI doomsday would benefit investors too", "url": "https://www.ft.com/content/38ea0870-0100-4f4e-bd71-89074761095c?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-14T17:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um atraso na implementação de uma 'doomsday' de inteligência artificial reduziria a quantidade significativa de dinheiro sendo investido no treinamento de novos modelos.", "titulo_pt": "Por que adiar uma 'doomsday' de IA beneficiaria também os investidores", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 160799, "titulo": "Trump chama de ‘conspiração doentia’ pedidos de cautela com o desenvolvimento da IA", "url": "https://veja.abril.com.br/tecnologia/trump-chama-de-conspiracao-doentia-pedidos-de-cautela-com-o-desenvolvimento-da-ia/", "fonte_id": "veja", "data_pub": "2026-09-14T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Executivos da inteligência artificial pediram cautela com o desenvolvimento da tecnologia, mas o presidente americano, Donald Trump, acredita que não deve haver medidas de segurança adicionais.", "titulo_pt": "Trump chama de 'conspiração doentia' pedidos de cautela com o desenvolvimento da IA", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 161469, "titulo": "Apple releases iOS 27 with Siri AI overhaul", "url": "https://www.theverge.com/news/994756/apple-ios-27-launch-iphone-siri-ai-update", "fonte_id": "the_verge", "data_pub": "2026-09-14T17:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apple lançou a atualização iOS 27, que inclui uma revisão AI do assistente Siri. A atualização está sendo lançada para dispositivos compatíveis hoje, juntamente com as atualizações watchOS 27, iPadOS 27 e visionOS 27. A Siri AI está disponível em beta para dispositivos em inglês.", "titulo_pt": "Apple libera ios 27 com overhaul AI na Siri", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 160956, "titulo": "Trump, sobre desaceleração em IA: ‘Não matem a galinha dos ovos de ouro!’", "url": "https://www.infomoney.com.br/mundo/trump-sobre-desaceleracao-em-ia-nao-matem-a-galinha-dos-ovos-de-ouro/", "fonte_id": "infomoney", "data_pub": "2026-09-14T16:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, afirmou nas redes sociais que o setor de Inteligência Artificial não precisa de novas 'barreiras de proteção'.", "titulo_pt": "Trump sobre desaceleração em IA: 'não matem a galinha dos ovos de ouro!'", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 161277, "titulo": "Microsoft sets limits for future AI models as industry throttles frontier development", "url": "https://www.cnbc.com/2026/09/14/microsoft-ai-model-limits-anthropic-openai.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-14T16:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft está estabelecendo limites para modelos de IA futuros enquanto acelera o desenvolvimento de modelos em parceria com Anthropic e OpenAI. A empresa busca ser vista como uma entidade responsável em IA.", "titulo_pt": "Microsoft estabelece limites para modelos de IA futuros em parceria com anthropic e openai", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 161459, "titulo": "Donated livers can be made biologically younger", "url": "https://www.technologyreview.com/2026/09/14/1144010/donated-livers-can-be-made-biologically-younger/", "fonte_id": "mit_tech_review", "data_pub": "2026-09-14T16:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os órgãos doados começam a se deteriorar imediatamente após a remoção do corpo do doador. Existe uma alternativa que está ganhando destaque.", "titulo_pt": "Órgãos doados podem ser tornados biologicamente mais jovens", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 161273, "titulo": "Trump says no need for more AI regulation, slams Anthropic CEO Dario Amodei", "url": "https://www.cnbc.com/2026/09/14/trump-ai-data-centers-anthropic-dario-amodei.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-14T16:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump afirma não ser necessário mais regulamentação para a IA e critica o CEO da Anthropic, Dario Amodei. Durante o governo Trump, incentivou o rápido desenvolvimento da IA e a construção de centros de dados para obter uma vantagem tecnológica inatingível sobre a China.", "titulo_pt": "Trump diz não precisar de mais regulamentação para IA e critica CEO da Anthropic", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 161212, "titulo": "Trump says a strong, smart president is the only \"guardrail\" AI needs", "url": "https://www.axios.com/2026/09/14/trump-ai-safety-anthropic-dario-amodei", "fonte_id": "axios", "data_pub": "2026-09-14T16:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump criticou as chamadas por novas regulamentações de segurança para IA, argumentando que a IA só precisa de um presidente 'forte e inteligente' e que os críticos da IA deveriam 'prestar atenção!'. Este posicionamento de Trump contrasta com o de líderes e CEOs de IA, como Dario Amodei, que defendem uma pausa no desenvolvimento da IA e regulamentações mais rigorosas para garantir a segurança humana.", "titulo_pt": "Trump afirma que um presidente forte e inteligente é a única 'barreira de segurança' que a IA precisa", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 161460, "titulo": "AI agents blew the whistle on their cheating colleagues", "url": "https://www.technologyreview.com/2026/09/14/1144037/ai-agents-blew-whistle-o-cheating-colleagues/", "fonte_id": "mit_tech_review", "data_pub": "2026-09-14T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de agentes de inteligência artificial foi testado em uma tarefa que envolvia resolver problemas matemáticos divididos em facções rivais. Quando alguns agentes começaram a enganar, outros tentaram denunciá-los, um comportamento de denúncia observado pela primeira vez em um experimento conduzido pela Google DeepMind.", "titulo_pt": "Agentes de IA denunciaram colegas que estavam enganando", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 161242, "titulo": "French defense group Thales calls on governments to regulate AI", "url": "https://www.lemonde.fr/en/international/article/2026/09/14/french-defense-group-thales-calls-on-governments-to-regulate-ai_6757518_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-14T15:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa francesa de defesa Thales pediu aos governos que regulamentem a inteligência artificial (IA) após líderes de tecnologia, incluindo do Anthropic, apoiaram a ideia de frear o desenvolvimento da IA, advertindo que a tecnologia poderia representar um perigo para a humanidade.", "titulo_pt": "Empresa francesa Thales pede regulamentação da IA aos governos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 161339, "titulo": "Steve Bannon and Bernie Sanders unite in AI safety call", "url": "https://www.ft.com/content/bab5c4c5-5377-4dd0-8b46-d8c4ce9a36d5?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-14T15:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Steve Bannon, ativista de extrema direita, e Bernie Sanders, senador de esquerda, uniram-se para chamar por uma regulação mais forte da tecnologia de inteligência artificial.", "titulo_pt": "Steve Bannon e Bernie Sanders unem forças em chamado à regulação mais rigorosa da IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 161276, "titulo": "What Amodei's AI slowdown could mean for Anthropic's imminent IPO", "url": "https://www.cnbc.com/2026/09/14/anthropic-walks-tightrope-to-nasdaq-pushing-slowdown-and-pursuing-ipo.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-14T14:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antes da possível estreia histórica no mercado, o CEO Dario Amodei da Anthropic está promovendo um atraso no desenvolvimento da inteligência artificial da empresa.", "titulo_pt": "Atraso na IA de Amodei pode significar o que para o IPO iminente da Anthropic", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 160840, "titulo": "'Precisamos levar os riscos a sério': os 5 pontos do presidente da OpenAI sobre a corrida da IA", "url": "https://exame.com/inteligencia-artificial/precisamos-levar-os-riscos-a-serio-os-5-pontos-do-presidente-da-openai-sobre-a-corrida-da-ia/", "fonte_id": "exame", "data_pub": "2026-09-14T14:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Greg Brockman, presidente da OpenAI, concedeu uma entrevista à Bloomberg sobre mudanças internas na empresa após um incidente envolvendo agentes de IA e sobre os dilemas enfrentados na corrida pela computação avançada.", "titulo_pt": "Nós precisamos levar os riscos a sério: os 5 pontos do presidente da OpenAI sobre a corrida da IA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 161505, "titulo": "Responsible AI for Higher Education", "url": "https://webinars.on24.com/wileyevents/ResponsibleAI", "fonte_id": "ieee_spectrum", "data_pub": "2026-09-14T14:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O webinar interativo apresentará diferentes tipos de IA, abordará as preocupações com a IA, compartilhará como a IBM está abordando a IA Responsável e oferecerá orientações aos estudantes sobre o que eles podem fazer, individualmente e como membros de suas chapas do IEEE. Os participantes terão a oportunidade de aplicar o abordagem de IA Responsável a um caso de uso específico.", "titulo_pt": "IA responsável na educação superior", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 160843, "titulo": "O plano da Microsoft para uma IA poderosa — mas que pode ser desligada", "url": "https://exame.com/inteligencia-artificial/o-plano-da-microsoft-para-uma-ia-poderosa-mas-que-pode-ser-desligada/", "fonte_id": "exame", "data_pub": "2026-09-14T14:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O documento de 37 páginas da Microsoft define requisitos para os modelos de inteligência artificial (IA) avançada, incluindo a capacidade de correção, interrupção e proibição de simulação de consciência; esses requisitos visam garantir a segurança e a responsabilidade da IA.", "titulo_pt": "Plano da Microsoft para IA poderosa, mas desligável", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 160735, "titulo": "China se alinha aos EUA e vê alarmismo em previsões sobre IA; ONU pede 'ação urgente'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/orgao-de-inteligencia-da-china-ve-avanco-da-ia-como-risco-a-seguranca-politica-e-social.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-14T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China e os Estados Unidos minimizaram as preocupações sobre o desenvolvimento da inteligência artificial, afirmando que existem exageros que podem atrapalhar as ações governamentais sobre o tema. A ONU pediu uma ação urgente em relação à IA.", "titulo_pt": "China e EUA minimizam preocupações sobre IA; ONU pede ação urgente", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 161506, "titulo": "Salicornia genomes reveal genetic secrets to farming on salty land", "url": "https://phys.org/news/2026-09-salicornia-genomes-reveal-genetic-secrets.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa global liderada pela Universidade de Newcastle produziu o retrato genético mais completo de uma planta que gosta de sal, com potencial para auxiliar na produção de alimentos em alguns dos ambientes mais árduos do mundo.", "titulo_pt": "Genomas de salicornia revelam segredos genéticos para agricultura em terrenos salgados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 161507, "titulo": "Striving for perfection could impact well-being of gifted youth", "url": "https://phys.org/news/2026-09-impact-gifted-youth.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa da Universidade da Geórgia, publicada na Revista de Crianças Talentosas, indica que a pressão para ser perfeito pode aumentar para crianças em escola secundária, especialmente para aquelas rotuladas como 'gifted'.", "titulo_pt": "Pressão para ser perfeito pode afetar bem-estar de jovens talentosos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 161508, "titulo": "Novel solvent recipe boosts efficiency of organic solar cells", "url": "https://phys.org/news/2026-09-solvent-recipe-boosts-efficiency-solar.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de pesquisa da Universidade Nacional da Turquia, em colaboração internacional, desenvolveu uma estratégia simples de mistura de solventes para aumentar significativamente a eficiência das células solares orgânicas de polímero. Ao adicionar uma pequena fração de um cosolvente durante a fabricação, os pesquisadores resolveram um desafio de longa data na qualidade do filme, abrindo novas possibilidades para a comercialização de tecnologia de energia limpa, flexível e sustentável.", "titulo_pt": "Nova receita de solvente aumenta a eficiência das células solares orgânicas de polímero", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 161546, "titulo": "Kennedy to deliver keynote for anti-vaccine group he once led", "url": "https://www.statnews.com/2026/09/14/rfk-speech-childrens-health-defense-conference-washington/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-14T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "RFK Jr. está se afastando da Children's Health Defense, grupo anti-vacina que ele liderava, e agora vai pronunciar-se na conferência do grupo.", "titulo_pt": "Kennedy vai proferir palestra para grupo anti-vacina que ele liderava", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 161509, "titulo": "How chronic absenteeism shifted in Canadian kindergarten after COVID‑19", "url": "https://phys.org/news/2026-09-chronic-absenteeism-shifted-canadian-kindergarten.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T17:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A frequência regular na escola é crucial para o desenvolvimento dos alunos na pré-escola, onde eles adquirem e fortalecem as habilidades necessárias para participar e aprender em um ambiente escolar. O absentismo crônico mudou durante o período da COVID-19 no Canadá, afetando a frequência dos alunos na pré-escola.", "titulo_pt": "Como o absentismo crônico mudou na pré-escola canadense após a COVID-19", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 161510, "titulo": "Car owners beware! Lessons from the 'Kia Boys' crime spree", "url": "https://phys.org/news/2026-09-car-owners-beware-lessons-kia.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T17:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Se você mora em Los Angeles e possui um Hyundai Sonata, Kia Optima ou um dos 18 outros modelos dessas linhas de veículos, o antropólogo da UCLA Jeffrey Brantingham recomenda que você adquira um dispositivo para travar o volante, aproveite as chamadas de recall das fabricantes ou troque o carro por um equipado com um sistema de imobilização do motor.", "titulo_pt": "Atenção aos proprietários de carros! Lições da 'expedição dos Kia Boys'", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 161511, "titulo": "Social isolation in Australia has nearly doubled over two decades", "url": "https://phys.org/news/2026-09-social-isolation-australia-decades.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa da Universidade de Sydney revelou que a isolamento social na Austrália dobrou em duas décadas. Os níveis de solidão também aumentaram, embora de forma mais gradual, afetando principalmente grupos vulneráveis.", "titulo_pt": "Australasian isolamento social dobrou em duas décadas, de acordo com nova pesquisa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 161512, "titulo": "Mosquito 'toilet' detects West Nile and first Hedwig-like virus found in the Americas", "url": "https://phys.org/news/2026-09-mosquito-toilet-west-nile-hedwig.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quando os pesquisadores de saúde pública querem saber se doenças como COVID-19 ou poliomielite estão se espalhando em uma comunidade, eles podem procurar evidências genéticas no esgoto. Um mosquito foi usado como 'toilet' para detectar o vírus da dengue ocidental e um novo vírus, semelhante ao de Hedwig, foi encontrado pela primeira vez nas Américas.", "titulo_pt": "Mosquito 'banheiro' detecta vírus da dengue ocidental e primeiro vírus semelhante ao de hedwig encontrado nas américas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 160940, "titulo": "Polícia investiga uso de agulha compartilhada em Feira de Ciências no Rio", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/rj/policia-investiga-uso-de-agulha-compartilhada-em-feira-de-ciencias-no-rio/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-14T17:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A polícia investiga o uso de uma agulha compartilhada durante uma Feira de Ciências em uma escola no Recreio, no Rio de Janeiro. O Hospital Lourenço Jorge atendeu 20 pessoas após uma exposição relacionada ao incidente.", "titulo_pt": "Polícia investiga uso de agulha compartilhada em Feira de Ciências no recreio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 161556, "titulo": "Sept. 21: What Comes Next for On-Orbit Servicing?", "url": "https://spacenews.com/what-comes-next-for-on-orbit-servicing-event/", "fonte_id": "spacenews", "data_pub": "2026-09-14T17:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceNews convidará para conversas sobre a tecnologia, políticas e modelos de negócios necessários para construir um sistema de logística orbital funcional. O evento está programado para o dia 21 de setembro.", "titulo_pt": "21 De setembro: o que vem Next para serviços orbital?", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 161542, "titulo": "Feeling nervous? Work the system", "url": "https://www.sciencenews.org/article/nervous-system-stress-hormone-cortisol", "fonte_id": "science_news", "data_pub": "2026-09-14T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas estão explorando novas formas de recuperar o controle de sistemas nervosos sobrecarregados, incluindo uivos, batidas na pele e imersão em água fria.", "titulo_pt": "Se sentindo nervoso? Trabalhe o sistema", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 160946, "titulo": "Entenda como funciona medicamento experimental utilizado em Lito Sousa", "url": "https://www.cnnbrasil.com.br/saude/entenda-como-funciona-medicamento-experimental-utilizado-em-lito-sousa/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-14T16:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O influenciador Lito Sousa será o primeiro a receber um medicamento experimental chamado ALN-6457, que está em estágio pré-clínico de desenvolvimento.", "titulo_pt": "Entenda como funciona o medicamento experimental aln-6457 utilizado em Lito Sousa", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 160947, "titulo": "Pesquisa mostra como a primeira ave levantou voo há 150 milhões de anos", "url": "https://www.cnnbrasil.com.br/ciencia/pesquisa-mostra-como-a-primeira-ave-levantou-voo-ha-150-milhoes-de-anos/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-14T16:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa sugere que a primeira ave utilizava múltiplos saltos para decolar, compensando asas incompletas com pernas fortes.", "titulo_pt": "Pesquisa revela como a primeira ave levantou voo há 150 milhões de anos",
