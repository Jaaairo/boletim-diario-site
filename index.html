<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "31/08/2026 08:21", "stats": {"noticias_novas": 641, "resumos_gerados": 225}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Neste cenário eleitoral, uma pesquisa da Nexus/BTG indica um empate técnico entre Lula e Flávio Bolsonaro no segundo turno, com 46% e 45% das intenções de voto, respectivamente. Augusto Cury, do Avante, subiu 9 pontos percentuais em apenas uma semana e chegou a 11%, ocupando o terceiro lugar. Os candidatos estão realizando campanhas intensivas, com Flávio Bolsonaro designando o vice para a campanha no Nordeste e Lula intensificando a propaganda. Além disso, a pesquisa BTG/Nexus mostra que Lula e Flávio Bolsonaro estão tecnicamente empatados, enquanto Augusto Cury avançou 9 pontos em uma semana, ocupando o terceiro lugar. A campanha também enfrenta desafios, com Lula reclamando de vazamentos de informações da Polícia Federal e a propaganda da campanha de Lula que lista acusações contra Flávio Bolsonaro ter sido suspensa pelo TSE.", "mundo": "A situação geopolítica continua agitada, com destaque para as tensões entre Estados Unidos e Irã. O Irã negou as alegações de ataques à Ilha de Kharg feitas por Trump e reagiu com ataques a bases militares americanas, levando a ameaças de novas sanções financeiras por parte dos EUA. Em outro ponto crítico, a Coreia do Norte rejeitou a desnuclearização diante da postura 'hostil' dos Estados Unidos, afirmando que suas armas são uma garantia absoluta para a defesa de sua soberania. Além disso, a Organização de Cooperação de Shanghai reuniu-se com a presença de líderes chineses e russos, enquanto o Japão enfrenta desafios relacionados à construção de reatores nucleares por Pequim ou Moscou, que podem durar gerações. No Nepal, o Primeiro Ministro Khadga Prasad Sharma Oli, de 36 anos, enfrenta um desafio significativo com a recuperação das enchentes que afetaram o país. Em outro incidente, equipes de resgate nepalesas buscam centenas de trabalhadores presos em túneis hidrelétricos bloqueados por inundações. As tensões regionais continuam com a retomada das hostilidades entre EUA e Irã, enquanto a China prepara-se para enfrentar desastres naturais após medidas de proteção insuficientes.\n\nO conflito geopolítico no Oriente Médio intensificou-se pela primeira vez em um mês, após ataques americanos contra o Irã. Como resposta, o Irã lançou mísseis contra bases dos Estados Unidos na Jordânia. O Irã nega que a ilha de Kharg tenha sido 'reduzida a escombros', enquanto o presidente dos Estados Unidos, Donald Trump, publicou um vídeo de inteligência artificial (IA) afirmando o contrário. Essa escalada de tensões tem impactado os mercados financeiros e o preço do petróleo subiu após novos confrontos verbais entre os dois países. Os Estados Unidos e o Irã trocaram ataques após um mês de relativa calma, com um ataque americano contra uma ilha iraniana sendo respondido com disparos de mísseis contra a Jordânia, que foram interceptados pelas forças de defesa. A situação segue crítica, com o risco de uma escalada ainda maior no conflito.", "economia": "As negociações comerciais entre o Brasil e os Estados Unidos ganharam nova atenção, com o governo Lula retomando as negociações após um intervalo, temendo que tarifas adicionais possam se tornar permanentes se o impasse não for resolvido rapidamente. Em outro destaque, o petróleo abriu a semana em alta após novos ataques dos Estados Unidos ao Irã, com os preços do barril chegando a US$ 90, o valor mais alto em seis dias. Em um desenvolvimento econômico global, o iene pode estar prestes a atingir 164 por dólar, o que levou uma instituição bancária a questionar se todos os ganhos obtidos com intervenções podem ser perdidos. Além disso, a atividade manufatureira na China diminuiu por segundo mês consecutivo, pressionando Pequim a apoiar a economia diante da perda de velocidade do crescimento.", "tecnologia": "A crescente demanda por inteligência artificial (IA) está impulsionando o desenvolvimento de tecnologias e a expansão de capacidades em várias indústrias. A TSMC, líder global em tecnologia de semicondutores, prevê que a tecnologia Silicon Photonics (SiPh) se tornará mainstream em 2027, com uma participação de mercado superior a 50%. A empresa está aprimorando sua rota de fotônica em silício para abordar a crescente discrepância entre o crescimento do processamento de IA e o movimento de dados entre chips. Por outro lado, a Nvidia registrou um aumento de 106% em sua receita para o segundo trimestre do ano fiscal 2027, com uma forte expansão de 117% na receita do data center. A empresa projeta uma receita de US$108 bilhões para o terceiro trimestre do ano fiscal 2027 e um crescimento de aproximadamente 70% na receita para o ano fiscal 2028. Em um desenvolvimento geopolítico, a SK Hynix está explorando opções de produção e investimento no Japão para atender à alta demanda global por chips de memória motivada pela IA. Além disso, a Apple está se tornando uma presença inesperada em infraestruturas de IA, com o Mac mini e Mac Studio sendo adquiridos em grande escala pela OpenAI para aprendizado por reforço. A empresa de design de chip Agentrys, apoiada pela MediaTek, anunciou a obtenção de US$24,5 milhões em financiamento, com a utilização de ferramentas agêntes para o design de semicondutores.", "ciencia": "A NASA lançou o Telescópio Espacial Nancy Grace Roman, um equipamento avaliado em 4,3 bilhões de dólares, com o objetivo de explorar o universo em busca de informações sobre a energia e a matéria escura, bem como ajudar os astrônomos a investigar mistérios relacionados à energia escura. Este lançamento, que ocorreu no último domingo, foi um marco na exploração espacial, gerando grande interesse e sendo celebrado pelo presidente Trump, que havia tentado cancelar o projeto. Além disso, a confirmação da existência de uma atmosfera em torno de um exoplaneta rochoso chamado LHS 1140b, orbitando dentro da zona habitável de sua estrela-mãe, gerou grande interesse na comunidade astronômica. O LHS 1140b orbita uma anã vermelha localizada a cerca de 48 anos-luz da Terra. Outros avanços notáveis incluem a descoberta de marcas de um mamífero gigante, conhecido como 'rato-cão', que vivia há 130 milhões de anos na Formação Botucatu, no Brasil, bem como a discussão sobre a possibilidade de a ingestão de baixas doses de lítio para prevenir a demência. Estudos também mostram que as marés podem ser mapeadas de forma mais localizada utilizando imagens de satélite, enquanto o Telescópio Espacial Roman iniciou sua missão de mapear o céu no espectro visível e infravermelho para estudar a natureza da energia e da matéria escura, bem como a diversidade de exoplanetas em nossa galáxia.", "cultura": "A Sociedade Brasileira de Endocrinologia e Metabolismo (SBEM) e a Federação Brasileira de Ginecologia e Obstetrícia (Febrasgo) lançaram uma recomendação adaptada para o Brasil sobre a suplementação de iodo durante a gravidez e o exame de TSH, baseada em evidências da Associação Americana da Tireoide. De outro lado, o British Museum realizou uma exibição privada da Tapestra de Bayeux para o bilionário Peter Thiel, o que gerou preocupações entre os funcionários do museu devido à fragilidade da obra. Além disso, a Hengdian World Studios, maior estúdio de cinema e TV do mundo, permite que turistas filmem suas próprias dramatizações por cerca de 200 yuan (US$30) como uma resposta à recessão causada pela inteligência artificial. No âmbito cultural, o PM Gordon Brown lançou seu livro 'O Futuro Começa Conosco', argumentando que crises globais estão estreitamente ligadas ao modo como tratamos uns aos outros no nível local. Também foram lançadas várias publicações em formato de capa mole em setembro, incluindo estreias, segundas edições e novos trabalhos de autores consagrados.", "sociedade": "Luizão, ex-atacante da seleção brasileira, é suspeito de agredir sua namorada em Maresias, no litoral de São Paulo, após uma discussão motivada por ciúmes. O caso está sendo investigado pela Polícia Civil. No Japão, 35% das pessoas jovens e solteiras não têm desejo de se casar, preferindo se concentrar em hobbies. Em Seul, na Coreia do Sul, a cidade planeja criar contas de poupança a longo prazo para ajudar os residentes na meia-idade a superar um período potencialmente difícil entre o último salário e o primeiro pagamento de aposentadoria. No Nepal, a resposta à catástrofe de inundações inclui a exibição de centenas de cartazes com nomes de desaparecidos em um hospital, enquanto em Santa Catarina e Rio Grande do Sul, temporais causaram danos. A Enel, empresa brasileira, dobrou seu investimento socioambiental no Brasil, e em Lyon e Saint-Etienne, na França, canteens comunitários e lojas de solidariedade estão experimentando um programa de segurança alimentar inspirado na Sécurité sociale francesa.", "meio_ambiente": "Um flash flood na Fenda do Grande Cañão, nos Estados Unidos, deixou mais de 20 pessoas desaparecidas, enquanto a China alertou para o aumento do nível do lago causado por um deslizamento de terra devido às chuvas. O Nepal enfrenta uma grave situação com mais de 900 mortos após inundações devastadoras que também afetaram o Tibete. A Malásia enfrenta problemas de qualidade do ar devido a incêndios florestais na Indonésia, com a cidade de Serian registrando um índice de poluição do ar (API) de 476. O aquecimento global está alterando padrões climáticos, aumentando o risco de alagamentos e deslizamentos de terra, especialmente no Sul do Brasil. Além disso, a Suez Canal se tornou um caminho para espécies invasoras no Mediterrâneo, aumentando a preocupação sobre a biodiversidade marinha.", "direitos_humanos": "Um documento aprovado pela Comissão da ONU contra a Discriminação Racial visa fortalecer os argumentos para reparações abrangentes por escravidão, oferecendo um novo instrumento legal que apoia as reivindicações de indenizações relacionadas à discriminação racial. Em outro desenvolvimento, Israel ameaçou expulsar palestinos que voaram kites em Gaza, com o ministro de Defesa, Israel Katz, instruindo o exército a expulsar os envolvidos. Além disso, 235 crianças e adolescentes palestinos foram mortos pelas forças israelenses na Cisjordânia em dezesseis meses após outubro de 2023. Em outro contexto, a Comissão Internacional da Cruz Vermelha transferiu 13 detidos palestinos libertados da fronteira de Kerem Shalom para o Hospital Nasser em Gaza, ajudando na reunião deles com suas famílias. Ao mesmo tempo, a situação humanitária na cidade de El Obeid e nas duas acampamentos próximos para civis fugindo do conflito no Sudão se agravava, com mais de 15.000 famílias chegando desde julho."}, "resumo_do_dia": {"politica_nacional": [{"id": 134555, "titulo": "“Nada há nada de errado”, diz Flávio sobre financiamento de “Dark Horse”", "url": "https://www.poder360.com.br/poder-eleicoes-2026/nada-ha-nada-de-errado-diz-flavio-sobre-financiamento-de-dark-horse/", "fonte_id": "poder360", "data_pub": "2026-08-31T09:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Dino nega irregularidades no financiamento do filme 'Dark Horse', evitando apresentar a prestação de contas. O candidato se recusa novamente a mostrar os documentos que comprovariam o uso dos recursos recebidos de Daniel Vorcaro.", "titulo_pt": "Nada de errado no financiamento de 'Dark Horse', diz Flávio", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 134551, "titulo": "Pesquisa Nexus: Lula lidera e Augusto Cury sobe 9 pontos em uma semana", "url": "https://www.cartacapital.com.br/politica/pesquisa-nexus-lula-lidera-e-augusto-cury-sobe-9-pontos-em-uma-semana/", "fonte_id": "cartacapital", "data_pub": "2026-08-31T09:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury subiu 9 pontos percentuais em uma semana e agora ocupa o terceiro lugar nas pesquisas, ficando ainda distante de Lula e Flávio Bolsonaro.", "titulo_pt": "Pesquisa Nexus: lula lidera e Augusto Cury sobe 9 pontos em uma semana", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 134657, "titulo": "Nunca antes neste País… o brasileiro afogou tanto em dívidas", "url": "https://braziljournal.com/nunca-antes-neste-pais-o-brasileiro-afogou-tanto-em-dividas/", "fonte_id": "brazil_journal", "data_pub": "2026-08-31T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As famílias brasileiras estão comendendo uma elevada quantidade de dívidas, que representam 30% da renda disponível. Esta situação já durava quatro anos antes das eleições de 2022, quando Lula prometeu aliviar a carga de dívidas das famílias.", "titulo_pt": "Nunca antes neste País... O brasileiro afogou tanto em dívidas", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 134556, "titulo": "Vazamento de gás causa incêndio na casa de Nunes Marques", "url": "https://www.poder360.com.br/poder-justica/vazamento-de-gas-causa-incendio-na-casa-de-nunes-marques/", "fonte_id": "poder360", "data_pub": "2026-08-31T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um vazamento de gás causou um incêndio na casa do ministro Nunes Marques em Brasília. Os bombeiros controlaram as chamas e ninguém ficou ferido.", "titulo_pt": "Vazamento de gás causa incêndio na casa de Nunes Marques", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 134608, "titulo": "Nexus: Cury chega a 11% e é o 1º nome da terceira via a ter dois dígitos", "url": "https://www.cnnbrasil.com.br/eleicoes/nexus-cury-chega-a-11-e-e-1o-nome-da-terceira-via-a-ter-dois-digitos/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T09:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato do Avante, Cury, obteve 11% nas pesquisas Nexus, sendo o primeiro nome da terceira via a atingir dois dígitos. Ele aparece na terceira posição no primeiro turno, atrás apenas de Lula e Flávio.", "titulo_pt": "Cury chega a 11% e é o primeiro nome da terceira via a ter dois dígitos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 134609, "titulo": "Nexus/BTG: Lula tem empate técnico com Flávio e Caiado no 2º turno", "url": "https://www.cnnbrasil.com.br/eleicoes/nexus-btg-lula-tem-empate-tecnico-com-flavio-e-caiado-no-2o-turno/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T09:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto realizou uma pesquisa entre os dias 28 e 30 de agosto, entrevistando 2.005 eleitores, que mostrou um empate técnico entre Lula, Flávio e Caiado no segundo turno das eleições. A margem de erro é de 2 pontos percentuais.", "titulo_pt": "Nexus/BTG: lula, Flávio e Caiado empatam técnico no 2º turno", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 134611, "titulo": "Lula pede direito de resposta no JN após declarações de Flávio", "url": "https://www.cnnbrasil.com.br/eleicoes/lula-pede-direito-de-resposta-no-jn-apos-declaracoes-de-flavio/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T09:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A coligação do presidente Jair Bolsonaro acionou o Tribunal Superior Eleitoral (TSE) para contestar as declarações do senador Flávio Bolsonaro no Jornal Nacional sobre urnas, Pix e outros temas, pedindo direito de resposta.", "titulo_pt": "Lula pede direito de resposta no JN após declarações de Flávio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 134567, "titulo": "A nova pesquisa BTG/Nexus sobre a disputa Lula x Flávio Bolsonaro — e a surpresa Augusto Cury", "url": "https://veja.abril.com.br/politica/a-nova-pesquisa-btg-nexus-sobre-a-disputa-lula-x-flavio-bolsonaro-e-a-surpresa-augusto-cury/", "fonte_id": "veja", "data_pub": "2026-08-31T09:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury avançou nove pontos em uma semana e agora ocupa isoladamente o terceiro lugar nas pesquisas de intenção de voto para as eleições.", "titulo_pt": "Nova pesquisa BTG/Nexus: Cury avança nove pontos e assume terceiro lugar isolado", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 134568, "titulo": "Edson Fachin inaugura pauta coletiva no STF, com todos os ministros indicando processos", "url": "https://veja.abril.com.br/brasil/edson-fachin-inaugura-pauta-coletiva-no-stf-com-todos-os-ministros-indicando-processos/", "fonte_id": "veja", "data_pub": "2026-08-31T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Edson Fachin inaugurou a pauta coletiva no Supremo Tribunal Federal (STF), com todos os ministros indicando processos para julgamento em setembro. A lista de julgamentos foi construída com indicações dos gabinetes dos ministros.", "titulo_pt": "Edson Fachin inicia pauta coletiva no STF, com indicações de todos os ministros", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 134534, "titulo": "Dizer que há crise fiscal é fake news, diz coordenador do programa de Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/dizer-que-ha-crise-fiscal-e-fake-news-diz-coordenador-do-programa-de-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-31T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "José Sergio Gabrielli, coordenador do programa de governo de Lula, afirma que é 'fake news' dizer que o país enfrenta uma crise fiscal.", "titulo_pt": "Dizer que há crise fiscal é fake news, afirma coordenador do programa de Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 134697, "titulo": "CPI pode indiciar investigados no curso do inquérito parlamentar?", "url": "https://www.jota.info/opiniao-e-analise/artigos/cpi-pode-indiciar-investigados-no-curso-do-inquerito-parlamentar", "fonte_id": "jota", "data_pub": "2026-08-31T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indicação de investigados pode ser realizada pelo delegado de polícia, mas a Lei das CPIs permite que esse indiciamento ocorra no relatório final do processo.", "titulo_pt": "CPI pode indiciar investigados no relatório final?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 134597, "titulo": "MP das blusinhas tem 112 emendas: o que o Congresso quer pendurar no texto", "url": "https://www.metropoles.com/brasil/mp-das-blusinhas-tem-112-emendas-o-que-o-congresso-quer-pendurar-no-texto", "fonte_id": "metropoles", "data_pub": "2026-08-31T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei das blusinhas possui 112 emendas, abrangendo desde isenções fiscais maiores e benefícios para o varejo até alterações em bets, remédios e comércio na Amazônia.", "titulo_pt": "Pl das blusinhas tem 112 emendas: o que o Congresso quer pendurar no texto", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 134599, "titulo": "Dez anos do impeachment de Dilma: o marco da polarização que mudou o Brasil", "url": "https://www.metropoles.com/brasil/dez-anos-do-impeachment-de-dilma-o-marco-da-polarizacao-que-mudou-o-brasil", "fonte_id": "metropoles", "data_pub": "2026-08-31T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O impeachment de Dilma Rousseff ocorreu há dez anos e marcou uma mudança significativa na política brasileira que persiste até hoje, influenciando os eventos políticos subsequentes, desde as manifestações de 2013 até a eleição de Jair Bolsonaro em 2018.", "titulo_pt": "Dez anos do impeachment de Dilma: o marco da polarização que mudou o Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 134600, "titulo": "Viatura virava escolta de muamba após “acerto” com policiais, diz Gaeco", "url": "https://www.metropoles.com/colunas/alfredo-henrique/viatura-virava-escolta-de-muamba-apos-acerto-com-policiais-diz-gaeco", "fonte_id": "metropoles", "data_pub": "2026-08-31T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A investigação revelou que houve apreensões parciais, cobrança de propina e a Polícia Civil foi usada para escoltar mercadorias de descaminho. Isso sugere uma colaboração entre policiais para proteger mercadorias ilícitas.", "titulo_pt": "Viatura virava escolta de mercadorias após acordo com policiais, revela Gaeco", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 134601, "titulo": "Prefeitura sob André do Prado teve contratos julgados irregulares pelo TCE", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/prefeitura-sob-andre-do-prado-teve-contratos-julgados-irregulares-pelo-tce", "fonte_id": "metropoles", "data_pub": "2026-08-31T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal de Contas do Estado (TCE) julgou contratos e aditivos da Prefeitura de Guararema, sob a gestão de André do Prado (PL), como irregulares. O prefeito descarta qualquer 'conduta pessoal irregular'.", "titulo_pt": "TCE julgou contratos da prefeitura de guararema irregulares", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 134603, "titulo": "Confira as agendas dos candidatos à Presidência nesta segunda-feira (31/8)", "url": "https://www.metropoles.com/brasil/confira-as-agendas-dos-candidatos-a-presidencia-nesta-segunda-feira-31-8", "fonte_id": "metropoles", "data_pub": "2026-08-31T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Candidatos à Presidência realizam compromissos de campanha em diversos estados brasileiros, com entrevistas, reuniões e eventos.", "titulo_pt": "Confira as agendas dos candidatos à Presidência nesta segunda-feira (31/8)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 134875, "titulo": "Colombian rebel group say kidnapped French Foreign Legion soldier is still alive", "url": "https://www.france24.com/en/americas/20260831-colombian-rebel-group-say-kidnapped-french-foreign-legion-soldier-is-still-alive", "fonte_id": "france24", "data_pub": "2026-08-31T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rebelos do Comando Central, grupo principal derivado das antigas FARC da Colômbia, afirmaram ter sequestrado um soldado francês da Legião Estrangeira. Eles disseram que José Olger Melo Charry, supostamente em licença no país, está vivo e em perfeitas condições de saúde.", "titulo_pt": "Grupos rebeldes colombianos afirmam ter sequestrado soldado francês da legião estrangeira", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 134747, "titulo": "South Korea’s Unification Church Leader Gets 2 Years in Prison for Corruption", "url": "https://www.nytimes.com/2026/08/31/world/asia/south-korea-unification-church-leader-prison.html", "fonte_id": "nyt_world", "data_pub": "2026-08-31T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Han Hak-ja, viúva e sucessora do fundador da igreja conservadora, foi condenada a dois anos de prisão por irregularidades financeiras relacionadas ao ex-presidente e à primeira-dama, que também estão presos.", "titulo_pt": "Líder da igreja da unificação da Coreia do sul recebe 2 anos de prisão por corrupção", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 134916, "titulo": "Ailing Djokovic 'despised' every moment of US Open defeat", "url": "https://www.dw.com/en/ailing-djokovic-despised-every-moment-of-us-open-defeat/a-78572187?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-31T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novak Djokovic saiu na primeira rodada de um Grand Slam pela primeira vez em mais de duas décadas. A saúde ou o tempo podem estar afetando o lendário tenista sérvio.", "titulo_pt": "Djokovic 'desprezava' cada momento da derrota no US Open", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 134528, "titulo": "Trump publica vídeo de IA sobre ataque à ilha de Kharg, Irã nega e chama publicação de 'risível'", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/trump-publica-video-de-ia-sobre-ataque-a-ilha-de-kharg-ira-nega-e-chama-publicacao-de-risivel.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-31T09:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Donald Trump afirmou que o polo energético iraniano da Ilha de Kharg estaria sendo destruído, em uma publicação na sua rede Truth Social, acompanhada de um vídeo gerado por inteligência artificial. O Irã negou a afirmação e chamou a publicação de 'risível'.", "titulo_pt": "Trump publica vídeo de IA sobre ataque à ilha de Kharg, Irã nega e chama publicação de 'risível'", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 134745, "titulo": "For Nepal’s Young Leader, Flood Recovery Will Be a Herculean Task", "url": "https://www.nytimes.com/2026/08/31/world/asia/nepal-floods-balen-shah-gen-z.html", "fonte_id": "nyt_world", "data_pub": "2026-08-31T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Primeiro Ministro de Nepal, Balendra Shah, de 36 anos, subiu ao poder este ano graças à insatisfação da juventude em relação à corrupção e ao mau gerenciamento. Agora, seu governo recém-eleito enfrenta um desafio significativo com a recuperação das enchentes.", "titulo_pt": "Para o novo líder jovem do Nepal, a recuperação das enchentes será uma tarefa hercúlea", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 134876, "titulo": "US renews attack on Iran while threatening financial sanctions on Tehran allies", "url": "https://www.france24.com/en/us-renews-attack-on-iran-while-threatening-financial-sanctions-on-tehran-allies", "fonte_id": "france24", "data_pub": "2026-08-31T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hostilidades entre os EUA e Irã foram retomadas após um mês de pausa. O Irã retaliou atacando bases militares americanas em Jordânia, enquanto os EUA ameaçaram novas sanções financeiras contra bancos que fazem negócios com o Irã.", "titulo_pt": "EUA reatam ataques ao Irã e ameaçam sanções financeiras aos aliados do país", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 134610, "titulo": "Corrida contra o tempo busca trabalhadores presos em túneis no Nepal", "url": "https://www.cnnbrasil.com.br/internacional/corrida-contra-o-tempo-busca-trabalhadores-presos-em-tuneis-no-nepal/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-31T09:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Equipes de resgate e especialistas estrangeiros buscam desesperadamente trabalhadores que podem estar vivos e presos em túneis de usinas hidrelétricas no Nepal. A corrida contra o tempo é crucial para localizar os trabalhadores ainda em condições de sobrevivência.", "titulo_pt": "Corrida contra o tempo busca trabalhadores presos em túneis de usinas hidrelétricas no Nepal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 134877, "titulo": "Artificial Intelligence in Europe: does advanced AI have a glass ceiling?", "url": "https://www.france24.com/en/tv-shows/people-profit/20260831-artificial-intelligence-in-europe-does-advanced-ai-have-a-glass-ceiling", "fonte_id": "france24", "data_pub": "2026-08-31T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório encomendado pela Amazon Web Services indica que a adoção avançada de inteligência artificial na Europa está estagnada devido a escassez de habilidades e incertezas regulatórias, com 38% das startups europeias considerando se mudar para outros países.", "titulo_pt": "Inteligência artificial na Europa: quais são os custos de uma adoção limitada?", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 134648, "titulo": "Irã lança mísseis contra bases dos EUA na Jordânia em retaliação a ataque em Ormuz", "url": "https://www.infomoney.com.br/mundo/ira-lanca-misseis-contra-bases-dos-eua-na-jordania-em-retaliacao-a-ataque-em-ormuz/", "fonte_id": "infomoney", "data_pub": "2026-08-31T09:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Irã lançou mísseis contra bases dos Estados Unidos na Jordânia como retaliação ao ataque dos EUA em Ormuz.", "titulo_pt": "Irã lança mísseis contra bases dos EUA na Jordânia em retaliação a ataque em Ormuz", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 135088, "titulo": "They went to Nepal for a spiritual journey. Then an epic flood arrived.", "url": "https://www.washingtonpost.com/world/2026/08/30/families-those-missing-nepal-search-answers-after-devastating-flood/", "fonte_id": "washington_post_world", "data_pub": "2026-08-31T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 85 cidadãos dos Estados Unidos estão desaparecidos na Nepal e na Tibetia após um colapso de geleira causar inundações devastadoras.", "titulo_pt": "Eles foram à Nepal em busca de uma jornada espiritual. Então uma enérgica cheia chegou.", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 135130, "titulo": "Plan to consolidate Japan’s centrist opposition parties collapses", "url": "https://www.japantimes.co.jp/news/2026/08/31/japan/politics/cra-komeito/", "fonte_id": "japan_times", "data_pub": "2026-08-31T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O plano de consolidação das principais legendas centristas da oposição japonesa falhou, com o Komeito rejeitando a criação de um único grupo parlamentar e a fusão com o Partido Democrático Constitucional sendo desistida. O futuro de qualquer aliança continuada entre as legendas permanece incerto.", "titulo_pt": "Plano de consolidação das principais legendas centristas da oposição japonesa falha", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 134786, "titulo": "Corea del Norte descarta la desnuclearización ante la postura “hostil” de Estados Unidos: “Cada día es más peligroso”", "url": "https://www.latercera.com/mundo/noticia/corea-del-norte-descarta-la-desnuclearizacion-ante-la-postura-hostil-de-estados-unidos-cada-dia-es-mas-peligroso/", "fonte_id": "la_tercera", "data_pub": "2026-08-31T09:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Coreia do Norte rejeitou a desnuclearização em face da postura 'hostil' dos Estados Unidos, segundo um porta-voz do Ministério dos Negócios Estrangeiros. As armas do país são consideradas uma garantia absoluta para a defesa da sua soberania.", "titulo_pt": "Coreia do Norte rejeita desnuclearização diante da 'postura hostil' dos EUA", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 134878, "titulo": "Xi arrives for SCO summit, Putin meeting as regional bloc pushes back on US dominance", "url": "https://www.france24.com/en/tv-shows/business/20260831-xi-arrives-for-sco-summit-putin-meeting-as-regional-bloc-pushes-back-on-us-dominance", "fonte_id": "france24", "data_pub": "2026-08-31T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cúpula da Organização de Cooperação de Shanghai começa em Quirguistão com a presença dos líderes chineses e russos. Simultaneamente, os EUA sediam reuniões de ministros de finanças do G20 e enfrentam desafios relacionados à sua dívida elevada.", "titulo_pt": "Xi chega para cúpula do SCO e encontro com Putin, enquanto região se opõe ao domínio dos EUA", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 135131, "titulo": "Japan’s next security challenge: Who builds Asia’s nuclear reactors", "url": "https://www.japantimes.co.jp/commentary/2026/08/31/japan/building-asias-nuclear-reactors/", "fonte_id": "japan_times", "data_pub": "2026-08-31T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A construção de reatores nucleares por Pequim ou Moscou estabelece relações que podem durar gerações, conectando países através de fornecimento de combustível, financiamento, manutenção e laços políticos.", "titulo_pt": "Próximo desafio de segurança do Japão: quem constrói os reatores nucleares da ásia?", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 134863, "titulo": "Dolly Parton laid to rest alongside husband in Nashville", "url": "https://www.bbc.co.uk/news/articles/cew95ke74l7o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-31T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dolly Parton, falecida em 5 de setembro de 2023 aos 80 anos, teve um enterro privado em sua família. Ela foi sepultada ao lado do marido em Nashville.", "titulo_pt": "Dolly Parton sepultada ao lado do marido em Nashville", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 134746, "titulo": "China Prepared for One Kind of Himalayan Flood. Then a Different Disaster Struck.", "url": "https://www.nytimes.com/2026/08/31/world/asia/china-nepal-tibet-flood-himalayas-risk.html", "fonte_id": "nyt_world", "data_pub": "2026-08-31T09:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Após uma cheia glacial no ano anterior, autoridades chinesas reforçaram as defesas em um ponto de fronteira com o Nepal. No entanto, a última semana foi marcada por uma série de desastres que superaram essas medidas de proteção.", "titulo_pt": "China preparou-se para um tipo de cheia himalayana. Então, um diferente desastre chegou", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 134655, "titulo": "As duas obsessões da Minerva: diversificar e desalavancar", "url": "https://braziljournal.com/as-duas-obsessoes-da-minerva-diversificar-e-desalavancar/", "fonte_id": "brazil_journal", "data_pub": "2026-08-31T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da Minerva Foods, Fernando Queiroz, enfrenta desafios similares a outros executivos do setor frigorífico, especialmente em relação às tarifas impostas por Donald Trump. A empresa está focada em duas prioridades principais: diversificar sua operação e reduzir a dívida.", "titulo_pt": "As duas obsessões da Minerva: diversificar e desalavancar", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 134656, "titulo": "“Emergente sem AI” (e ainda sem reformas), Brasil continua sem fluxo", "url": "https://braziljournal.com/emergente-sem-ai-e-ainda-sem-reformas-brasil-continua-sem-fluxo/", "fonte_id": "brazil_journal", "data_pub": "2026-08-31T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil continua sem atrair investidores globais, mesmo sem conexão com a inteligência artificial. A indefinição política e o quadro fiscal desfavorável persistem, segundo David Beker do Bank of America.", "titulo_pt": "Emergente sem AI (e ainda sem reformas), Brasil continua sem investimentos", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 134650, "titulo": "Orçamento de 2027, Focus, dados da China e mais destaques desta segunda-feira (31)", "url": "https://www.infomoney.com.br/mercados/resultado-primario-focus-dados-china-agenda-31082026/", "fonte_id": "infomoney", "data_pub": "2026-08-31T09:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Foram incluídos no post desta segunda-feira (31) informações sobre o orçamento de 2027, o Focus econômico e dados da China, que devem influenciar os mercados.", "titulo_pt": "Orçamento de 2027, Focus, dados da China e outros destaques desta segunda-feira (31)", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 134514, "titulo": "Rendimentos de títulos públicos globais sobem com guerra no Irã e ampliam pressão fiscal no G7", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/rendimentos-de-titulos-publicos-globais-sobem-com-guerra-no-ira-e-ampliam-pressao-fiscal-no-g7.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos dos títulos globais subiram desde o início da guerra dos Estados Unidos com o Irã, em fevereiro, aumentando significativamente o custo dos empréstimos para as maiores economias desenvolvidas do mundo. Essa elevação pressiona a situação fiscal do G7.", "titulo_pt": "Rendimentos de títulos globais crescem com guerra no Irã e intensificam pressão fiscal no G7", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 134515, "titulo": "GM concede bônus no fim de agosto para tentar segurar avanço da BYD", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/eduardosodre/2026/08/gm-concede-bonus-no-fim-de-agosto-para-tentar-segurar-avanco-da-byd.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-31T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A General Motors concedeu bônus no fim de agosto para tentar reverter a liderança da BYD no mercado de veículos no Brasil. A chinesa BYD ultrapassou a GM no acumulado das vendas até o final da última semana de agosto.", "titulo_pt": "GM concede bônus no fim de agosto para tentar segurar avanço da BYD", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 135000, "titulo": "Hong Kong retail sales rise 4.5% in July, marking 15th straight month of growth", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3365836/hong-kong-retail-sales-rise-45-july-marking-15th-straight-month-growth?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-31T08:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O setor varejista de Hong Kong registrou crescimento pela 15ª vez consecutiva em julho, com uma elevação de 4,5% em comparação com o mesmo mês do ano anterior, apesar de condições climáticas adversas e a continuidade do turismo internacional dos residentes. As vendas no varejo no mês de julho atingiram HK$31 bilhões, enquanto as vendas no primeiro setor do ano aumentaram 8,9% em comparação com o mesmo período de 2025.", "titulo_pt": "Comércio varejista de hong Kong registra crescimento por 15 meses seguidos em julho", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 134694, "titulo": "O custo da promessa da ANTT", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-custo-da-promessa-da-antt", "fonte_id": "jota", "data_pub": "2026-08-31T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma resolução da ANTT que visava aumentar a concorrência no transporte rodoviário acabou reduzindo a oferta de serviços e aumentando os preços das passagens.", "titulo_pt": "O custo da promessa de concorrência da ANTT", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 134695, "titulo": "O ponto cego no debate sobre o fim do contencioso tributário", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-ponto-cego-no-debate-sobre-o-fim-do-contencioso-tributario", "fonte_id": "jota", "data_pub": "2026-08-31T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma promoverá uma simplificação que reduzirá significativamente o contencioso tributário, mas um fator crucial ainda não está sendo considerado no debate.", "titulo_pt": "O ponto cego no debate sobre a simplificação do contencioso tributário", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 134869, "titulo": "Iceland's rejection of EU accession talks seen as 'setback' in Brussels", "url": "https://www.lemonde.fr/en/international/article/2026/08/31/iceland-s-rejection-of-eu-accession-talks-seen-as-setback-in-brussels_6757004_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-31T08:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os líderes europeus responderam com reservas após a Islândia votar contra o reinício das negociações de adesão, um resultado que foi bem-vindo pelas partes extremistas anti-europeias.", "titulo_pt": "Rejeição da islândia às negociações de adesão à ue vista como 'revés' em bruxelas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 135144, "titulo": "Prices of 4,923 food and drink items set to rise in September, extending trend", "url": "https://www.japantimes.co.jp/business/2026/08/31/companies/food-price-rise-september/", "fonte_id": "japan_times", "data_pub": "2026-08-31T08:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O preço de 4.923 itens de alimentos e bebidas aumentará em setembro, estendendo a tendência de aumento. Este será o quarto maior aumento na história e o total mensal mais alto em 2026.", "titulo_pt": "Preços de 4.923 itens de alimentos e bebidas para aumentar em setembro, estendendo a tendência de elevação", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 134698, "titulo": "Normas de ESG nas transações tributárias: um novo passo na consensualidade", "url": "https://www.jota.info/opiniao-e-analise/colunas/advogadas-publicas-em-debate/normas-de-esg-nas-transacoes-tributarias-um-novo-passo-na-consensualidade", "fonte_id": "jota", "data_pub": "2026-08-31T08:00:00Z", "idioma": "pt", "provavel_duplicata_de":
