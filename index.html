.com/colunas/manoela-alcantara/justica-condena-vereador-coronel-ustra-por-transfobia-contra-atena-roveda", "fonte_id": "metropoles", "data_pub": "2026-11-28T06:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um vereador e a Rádio Auri Verde foram condenados a pagar R$ 15 mil por danos morais após a Justiça determinar a retirada de um trecho de vídeo que foi considerado transfóbico.", "titulo_pt": "Justiça condena vereador e rádio por transfobia contra Atena Roveda", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 292467, "titulo": "PCC avança sobre clínicas médicas e empresas de energia em São Paulo", "url": "https://www.metropoles.com/sao-paulo/pcc-avanca-sobre-clinicas-medicas-e-empresas-de-energia-em-sao-paulo", "fonte_id": "metropoles", "data_pub": "2026-11-28T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A facção criminosa PCC estendeu suas atividades para clínicas médicas e empresas de energia em São Paulo, buscando expandir sua influência para mercados lícitos e implementar métodos de lavagem de dinheiro. Os lucros provenientes do tráfico de drogas estão sendo ocultados por meio dessas atividades ilegais.", "titulo_pt": "PCC avança sobre clínicas médicas e empresas de energia em São Paulo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 292468, "titulo": "Ouça áudio de capitão da PM dizendo não querer trabalhar com mulheres", "url": "https://www.metropoles.com/colunas/rogerio-pagnan/ouca-audio-de-capitao-da-pm-dizendo-nao-querer-trabalhar-com-mulheres", "fonte_id": "metropoles", "data_pub": "2026-11-28T05:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A coluna revelou que o comando do Barro Branco está investigando um capitão da PM que teria afirmado não querer trabalhar com mulheres. O comando suspeita de falta grave no comportamento do oficial.", "titulo_pt": "Capitão da PM dizendo não querer trabalhar com mulheres é investigado", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 292771, "titulo": "Behind India’s IIT dream: Student suicides and gaps in support", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/28/behind-indias-iit-dream-student-suicides-and-gaps-in-support?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-28T04:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rishikesh Kumar foi aceito em uma IIT, mas morreu meses depois, em uma suposta suicídio, levantando novas questões sobre o apoio estudantil.", "titulo_pt": "Por trás do sonho indiano de IIT: suicídios de estudantes e lacunas no apoio", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 292430, "titulo": "Tabata Amaral: ‘Elite do serviço público recebe supersalários, enquanto o policial, o enfermeiro e o professor ganham muito mal’", "url": "https://veja.abril.com.br/politica/tabata-amaral-elite-do-servico-publico-recebe-supersalarios-enquanto-o-policial-o-enfermeiro-e-o-professor-ganham-muito-mal/", "fonte_id": "veja", "data_pub": "2026-11-28T01:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada Tabata Amaral do PSB argumenta que o serviço público tem supersalários entre os mais privilegiados, enquanto profissionais como policiais, enfermeiros e professores recebem baixos salários. Ela defende que o ajuste fiscal deve atingir esses privilégios, especialmente no Judiciário.", "titulo_pt": "Tabata Amaral: 'servidor público mais privilegiado recebe supersalários, enquanto policiais, enfermeiros e professores ganham mal, e ajuste fiscal deve atingir esses privilégios, especialmente no judiciário'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 291655, "titulo": "Sentences for caregivers in infant death case upheld", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/28/2003868545", "fonte_id": "taipei_times", "data_pub": "2026-11-28T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As sentenças para os cuidadores no caso da morte de um bebê foram mantidas. O caso envolveu a sentença de responsabilidade penal para as pessoas que cuidavam do bebê.", "titulo_pt": "Sentenças para cuidadores no caso de morte de bebê mantidas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 292438, "titulo": "Dia D contra a dengue ocorre neste sábado e campanha para evitar Aedes aegypti é lançada", "url": "https://veja.abril.com.br/saude/dia-d-contra-a-dengue-ocorre-neste-sabado-e-campanha-para-evitar-aedes-aegypti-e-lancada/", "fonte_id": "veja", "data_pub": "2026-11-27T22:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha Dia D contra a dengue ocorre neste sábado com o objetivo de combater o mosquito Aedes aegypti, transmissor da dengue, zika e chikungunya. O governo planeja enviar mensagens personalizadas pelo WhatsApp para aumentar a conscientização.", "titulo_pt": "Dia D contra a dengue ocorre neste sábado e campanha é lançada", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 292018, "titulo": "Grupo ligado a escândalo na SPTuris lidera decoração de Natal em SP", "url": "https://www.metropoles.com/colunas/demetrio-vecchioli/grupo-ligado-a-escandalo-na-spturis-lidera-decoracao-de-natal-em-sp", "fonte_id": "metropoles", "data_pub": "2026-11-27T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Prefeitura de São Paulo aceitou um contrato de R$ 90 mil como prova de capacidade técnica para realizar um evento de decoração de Natal com valor total de R$ 13,6 milhões. O grupo responsável pelo contrato está ligado a um escândalo envolvendo a SPTuris.", "titulo_pt": "Grupo envolvido em escândalo na SPTuris vence licitação para decoração de Natal em SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 291992, "titulo": "Presa na Rússia, atleta da seleção brasileira pede ajuda a Lula em carta", "url": "https://www.cnnbrasil.com.br/internacional/presa-na-russia-atleta-da-selecao-brasileira-pede-ajuda-a-lula-em-carta/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-27T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Letícia 'Lelê' Villar, jogadora de futebol de areia e ex-atleta da seleção brasileira, está detida na Rússia desde julho do ano passado. O caso está sendo acompanhado pelo Itamaraty.", "titulo_pt": "Atleta brasileira detida na Rússia pede ajuda a Lula em carta", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 291994, "titulo": "Escolas em Fortaleza diminuem tempo de aula em razão de calor extremo", "url": "https://www.cnnbrasil.com.br/educacao/escolas-em-fortaleza-diminuem-tempo-de-aula-em-razao-de-calor-extremo/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-27T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As escolas em Fortaleza reduziram o tempo de aulas em razão do calor extremo. A decisão foi aprovada pelo Conselho Municipal de Educação local nesta sexta-feira (27).", "titulo_pt": "Escolas em Fortaleza reduzem tempo de aula devido ao calor extremo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 292029, "titulo": "Esplanada, escola, feira e condomínio: veja onde se vacinar neste sábado", "url": "https://www.metropoles.com/distrito-federal/esplanada-escola-feira-e-condominio-veja-onde-se-vacinar-neste-sabado", "fonte_id": "metropoles", "data_pub": "2026-11-27T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A vacinação contra a gripe está disponível para crianças a partir de seis meses. O texto informa sobre locais de vacinação no Dia do Evangélico, mas não fornece detalhes específicos sobre esses locais.", "titulo_pt": "Esplanada, escola, feira e condomínio: veja onde se vacinar neste dia do evangélico", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 292010, "titulo": "Mpox dispara e novembro tem mais casos do que todos os outros meses juntos", "url": "https://www.cnnbrasil.com.br/saude/mpox-dispara-e-novembro-tem-mais-casos-do-que-todos-os-outros-meses-juntos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-27T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de casos de mpox no Brasil aumentou significativamente em novembro, com mais infecções registradas nesse mês do que em todos os outros meses do ano juntos. O Ministério da Saúde registrou 1.695 infecções confirmadas e um óbito até o momento.", "titulo_pt": "Mpox disparou e novembro teve mais casos do que todos os outros meses juntos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 292065, "titulo": "O que significa ser pobre e como a pobreza é medida?", "url": "https://www.dw.com/pt-br/o-que-significa-ser-pobre-e-como-a-pobreza-é-medida/a-80076347?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-27T20:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A DW analisa como governos e organizações globais monitoram a pobreza e suas diferentes metodologias. O presidente dos Estados Unidos, Donald Trump, afirma que a pobreza nos EUA está em um nível baixo recorde, mas isso tem sido questionado.", "titulo_pt": "O que significa ser pobre e como a pobreza é medida?", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 291913, "titulo": "Expectativa de vida para mulheres no Brasil ultrapassa 80 anos pela primeira vez, segundo IBGE", "url": "https://veja.abril.com.br/comportamento/expectativa-de-vida-para-mulheres-no-brasil-ultrapassa-80-anos-pela-primeira-vez-segundo-ibge/", "fonte_id": "veja", "data_pub": "2026-11-27T19:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os dados do Instituto Brasileiro de Geografia e Estatística indicam que a expectativa de vida para mulheres no Brasil atingiu pela primeira vez os 80 anos, conforme as Tábuas Completas de Mortalidade no Brasil.", "titulo_pt": "Expectativa de vida para mulheres no Brasil ultrapassa 80 anos pela primeira vez, de acordo com IBGE", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 292592, "titulo": "Cinco mitos de los negacionistas del cambio climático", "url": "https://www.latercera.com/nacional/noticia/cinco-mitos-de-los-negacionistas-del-cambio-climatico/", "fonte_id": "la_tercera", "data_pub": "2026-11-28T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute cinco mitos comumente utilizados por negacionistas do cambio climático, incluindo a ideia de que o clima sempre mudou e que os cientistas não concordam sobre o assunto.", "titulo_pt": "Cinco mitos dos negacionistas do cambio climático", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 292593, "titulo": "El clima feroz: un año entre incendios, lluvias intensas, aluviones y tornados en primavera", "url": "https://www.latercera.com/nacional/noticia/el-clima-feroz-un-ano-entre-incendios-lluvias-intensas-aluviones-y-tornados-en-primavera/", "fonte_id": "la_tercera", "data_pub": "2026-11-28T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O fenômeno El Niño mais intenso, ocorrendo em um planeta cada vez mais aquecido, sugere que o verão também pode trazer condições climáticas desafiadoras para o país. O texto indica que eventos climáticos extremos, como incêndios, chuvas intensas, aluviões e tornados, podem se repetir na primavera.", "titulo_pt": "O clima feroz: um ano entre incêndios, chuvas intensas, aluviões e tornados na primavera", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 292594, "titulo": "Francisca Toledo, ministra del Medio Ambiente: “Queremos mapear los lugares donde tener infraestructura pública para responder en adaptación”", "url": "https://www.latercera.com/nacional/noticia/francisca-toledo-ministra-del-medio-ambiente-queremos-mapear-los-lugares-donde-tener-infraestructura-publica-para-responder-en-adaptacion/", "fonte_id": "la_tercera", "data_pub": "2026-11-28T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Francisca Toledo, ministra do Meio Ambiente, enfatiza o mapeamento de locais para infraestrutura pública para adaptação. Após a falta de acordo na COP31, ela discute o futuro das negociações e os desafios enfrentados por Chile, incluindo fenômenos relacionados a El Niño e ao aquecimento global.", "titulo_pt": "Francisca Toledo, ministra do meio Ambiente: 'queremos mapear os locais para infraestrutura pública para responder à adaptação'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 292596, "titulo": "Descifra: 56% piensa que las acciones individuales contribuyen poco a la crisis climática", "url": "https://www.latercera.com/nacional/noticia/descifra-56-piensa-que-las-acciones-individuales-contribuyen-poco-a-la-crisis-climatica/", "fonte_id": "la_tercera", "data_pub": "2026-11-28T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Apesar de 56% das pessoas acreditarem que ações individuais têm pouco impacto na crise climática, 85% se declararam comprometidos com ações concretas, segundo a última edição do Termómetro de Descifra. O ahorro de energia em casa foi a medida mais citada pelos entrevistados.", "titulo_pt": "56% Acreditam que ações individuais têm pouco impacto na crise climática, mas 85% estão comprometidos com ações concretas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 292597, "titulo": "Las cuentas que El Niño le está pasando a las empresas", "url": "https://www.latercera.com/pulso/noticia/las-cuentas-que-el-nino-le-esta-pasando-a-las-empresas/", "fonte_id": "la_tercera", "data_pub": "2026-11-28T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Nos últimos relatórios financeiros e apresentações a reguladores e analistas, várias empresas nacionais e internacionais que operam no país revelaram os impactos econômicos da contingência climática em seus resultados, incluindo custos milionários por paralisações na mineração, pesca mais cara, pressão nas cadeias de suprimentos no agronegócio, ajustes de inventários no comércio e provisões na banca.", "titulo_pt": "As contas que o Niño está fazendo às empresas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 292599, "titulo": "El Niño: la historia del fenómeno que amenaza a Chile y al mundo", "url": "https://www.latercera.com/nacional/noticia/el-nino-la-historia-del-fenomeno-que-amenaza-a-chile-y-al-mundo/", "fonte_id": "la_tercera", "data_pub": "2026-11-28T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O fenômeno El Niño, originado nas costas do Peru no século XVI devido a fortes precipitações e temperaturas extremas, é atualmente usado para se referir a um evento climático que tem afetado a região este ano. O termo 'El Niño', inspirado no 'Menino Jesus' e na Navidade, foi adotado globalmente para descrever esse fenômeno meteorológico.", "titulo_pt": "El Niño: a história do fenômeno que ameaça Chile e o mundo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 292604, "titulo": "Tierras raras en el Biobío: la encrucijada de Penco", "url": "https://www.latercera.com/esto-es-chile/noticia/tierras-raras-en-el-biobio-la-encrucijada-de-penco/", "fonte_id": "la_tercera", "data_pub": "2026-11-28T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um projeto minero obteve sua autorização ambiental em junho e promete gerar 2.200 empregos em uma região com alto desemprego. No entanto, os moradores e o prefeito temem que Penco tenha que arcar com os custos ambientais da exploração sem receber os benefícios econômicos.", "titulo_pt": "Terrenos raros em Penco: a encruzilhada da transição energética", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 292606, "titulo": "La Patagonia aparece como la zona más amenazada en 2027", "url": "https://www.latercera.com/nacional/noticia/el-nino-amenaza-a-la-patagonia-con-una-severa-sequia-en-2027/", "fonte_id": "la_tercera", "data_pub": "2026-11-28T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa liderada pelo CR2 da Universidade de Chile alerta para a presença de um acoplamento entre o fenômeno climático e o Modo Anular do Sul, que reduzirá significativamente os volumes de água nos rios patagônicos no verão do próximo ano. A região central também deve experimentar temperaturas extremamente altas.", "titulo_pt": "Patagônia aparece como a zona mais ameaçada em 2027", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 292772, "titulo": "El Nino-linked deluges flood cities in Peru, Ecuador", "url": "https://www.aljazeera.com/news/2026/11/28/el-nino-linked-deluges-flood-cities-in-peru-ecuador?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-28T04:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças meteorológicas relacionadas ao El Niño afetaram cidades em Peru e Equador, causando inundações que afetaram 2.000 famílias no Peru e 47.000 pessoas no Equador, onde foram registradas 34 mortes.", "titulo_pt": "Inundações relacionadas ao el niño afetam cidades no Peru e equador", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 292688, "titulo": "Australia’s east coast deluged by storms as roads flood and damaging winds forecast for NSW and Victoria", "url": "https://www.theguardian.com/australia-news/2026/nov/28/australias-east-coast-deluged-by-storms-as-roads-flood-and-damaging-winds-forecast-for-nsw-and-victoria", "fonte_id": "guardian_world", "data_pub": "2026-11-28T02:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alertas de tempestades severas e de alagamentos estão em vigor na costa leste da Austrália, devido a uma frente de tempestades que se movimenta do Queensland central até NSW, Victoria e Tasmania. O fim de semana está prevendo mais chuva intensa, em um final de outono que já registra a chuva mais abundante para um ano El Niño.", "titulo_pt": "Chuvas intensas atingem a costa leste da austrália com alertas de tempestades e alagamentos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 292022, "titulo": "AMM chama de \"inaceitável\" corte de recursos para piso da enfermagem", "url": "https://www.metropoles.com/minas-gerais/amm-chama-de-inaceitavel-corte-de-recursos-para-piso-da-enfermagem", "fonte_id": "metropoles", "data_pub": "2026-11-27T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Associação dos Municípios de Minas Gerais (AMM) criticou o corte de 30% no repasse federal para o piso salarial da enfermagem, considerando a medida inaceitável. A entidade alerta para os riscos financeiros para as 853 cidades mineiras.", "titulo_pt": "AMM chama de 'inaceitável' corte de recursos para piso da enfermagem", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 292317, "titulo": "‘Sinking’ African megacities will expose seven million people to flooding by 2050", "url": "https://www.carbonbrief.org/sinking-african-megacities-will-expose-seven-million-people-to-flooding-by-2050", "fonte_id": "carbon_brief", "data_pub": "2026-11-27T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A elevação do nível do mar e o subsolo de cidades africanas costeiras podem expor mais de sete milhões de pessoas a inundações até 2050.", "titulo_pt": "Cidades africanas costeiras afundando exporão sete milhões de pessoas a inundações até 2050", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 291537, "titulo": "Uzbek teacher turns school recycling problem into an award-winning green education project", "url": "https://www.euronews.com/2026/11/27/uzbek-teacher-turns-school-recycling-problem-into-an-award-winning-green-education-project", "fonte_id": "euronews", "data_pub": "2026-11-27T17:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um professor uzbeque desenvolveu um projeto de educação ambiental que envolveu 25.000 pessoas em 25 escolas. O projeto venceu uma competição internacional com 369 inscrições de 94 países.", "titulo_pt": "Professor uzbeque transforma problema de reciclagem escolar em projeto vencedor de educação ambiental", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 290998, "titulo": "Emissões de data centers dos EUA já equivalem às de países inteiros, diz estudo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/emissoes-de-data-centers-dos-eua-ja-equivalem-as-de-paises-inteiros-diz-estudo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-27T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa indica que os maiores data centers dos Estados Unidos geram aproximadamente 25,7 milhões de toneladas métricas de dióxido de carbono por ano, equivalente às emissões de países como a Bolívia ou a Dinamarca.", "titulo_pt": "Emissões de data centers dos EUA já equivalem às de países inteiros, diz estudo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 291173, "titulo": "Vídeo: incêndio de grandes proporções atinge indústria química na Grande SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/video-incendio-de-grandes-proporcoes-atinge-industria-quimica-na-grande-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-27T16:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incêndio de grandes proporções atinge uma indústria química na Grande São Paulo, com pelo menos seis viaturas e 18 bombeiros envolvidos no combate às chamas. As chamas começaram em tambores contendo álcool e acetona.", "titulo_pt": "Vídeo: incêndio de grandes proporções atinge indústria química na Grande SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 291609, "titulo": "Gaza's children caught in the grip of a meningitis outbreak", "url": "https:// "fonte_id": "al_jazeera", "data_pub": "2026-11-27T21:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Famílias em áreas do norte da Yemen estão enfrentando dificuldades para acessar alimentos, mesmo com a disponibilidade de farinha e óleo no mercado devido aos altos custos e falta de trabalho e assistência humanitária.", "titulo_pt": "Por que famílias estão passando fome no norte da Yemen, mesmo com alimentos à venda?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 292062, "titulo": "Desfigurada aos 15 anos: as vidas devastadas por uma década de conflito em Camarões", "url": "https://www.bbc.com/portuguese/articles/cjlydlky7wl7o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-27T20:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de meio milhão de pessoas fugiram de suas casas desde que grupos separatistas passaram a reivindicar a independência das regiões anglófonas de Camarões. Essa situação levou a uma década de conflito que devastou muitas vidas.", "titulo_pt": "Desfigurada aos 15 anos: as vidas devastadas por uma década de conflito em Camarões", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 291575, "titulo": "Syria debates citizenship rights for children of foreign fighters", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/27/aje-onl-nf_syria-mulls-citizenship-children-foreign-fighters-271126?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-27T16:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Irã pode considerar modificar sua lei de nacionalidade para conceder cidadania a crianças de mães sírias e lutas estrangeiras.", "titulo_pt": "Síria debate direitos de cidadania para filhos de mulheres sírias e lutas estrangeiras", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 291334, "titulo": "Fiscalía va contra Jairo Vera por violación grupal en Cauquenes y pide 15 años de cárcel", "url": "https://www.latercera.com/nacional/noticia/fiscalia-va-contra-jairo-vera-por-violacion-grupal-en-cauquenes-y-pide-15-anos-de-carcel/", "fonte_id": "la_tercera", "data_pub": "2026-11-27T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A fiscalia apresentou acusações contra Jairo Vera por um caso de estupro coletivo ocorrido em Cauquenes em 1 de novembro de 2022, pedindo 15 anos de prisão. Steven Ortega também enfrenta acusações no caso. O julgamento oral está programado para o final de janeiro.", "titulo_pt": "Fiscalia move ação contra Jairo Vera por estupro coletivo em Cauquenes e pede 15 anos de prisão", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 291335, "titulo": "María José Cumplido: “La salud de un adolescente no puede ser moneda de cambio para evitar una acusación constitucional”", "url": "https://www.latercera.com/nacional/noticia/maria-jose-cumplido-la-salud-de-un-adolescente-no-puede-ser-moneda-de-cambio-para-evitar-una-acusacion-constitucional/", "fonte_id": "la_tercera", "data_pub": "2026-11-27T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A diretora executiva da Fundação Iguais alerta que ceder às pressões para proibir as terapias de hormonização poderia criar um precedente 'perigoso', permitindo que governos decidam sobre o acesso a tratamentos médicos com base em suas crenças, em vez de evidências científicas.", "titulo_pt": "María José Cumplido: 'saúde de adolescente não pode ser usado como barganha para evitar acusação constitucional'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 291331, "titulo": "Excomandante en jefe del Ejército Óscar Izurieta es condenado a cinco años y un día de cárcel efectiva por lavado de activos", "url": "https://www.latercera.com/nacional/noticia/excomandante-en-jefe-del-ejercito-oscar-izurieta-es-condenado-a-cinco-anos-y-un-dia-de-carcel-efectiva-por-lavado-de-activos/", "fonte_id": "la_tercera", "data_pub": " function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];

  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">

    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {

    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');

}

  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
