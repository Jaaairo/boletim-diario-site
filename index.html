    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "12/11/2026 19:17", "stats": {"noticias_novas": 625, "resumos_gerados": 239}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Supremo Tribunal Federal (STF) rejeitou recursos que buscavam ampliar o acordo sobre planos econômicos para indenizar poupadores, mantendo o prazo de adesão até julho de 2027. O STF também negou um pedido do PSD para restabelecer o segundo turno nas eleições no Rio de Janeiro, apesar do protesto da oposição. O governo Lula iniciou a votação do 'plano Moretti' de ajuste fiscal no Senado, enquanto o PT e aliados elaboraram um projeto alternativo focado na taxação dos mais ricos. O presidente Lula participou da cúpula da Associação de Nações do Sudeste Asiático (ASEAN) nas Filipinas, ampliando o mercado brasileiro na Ásia. O STF manteve o afastamento do ministro Marco Buzzi do STJ após acusação de assédio, mas não suspendeu o pagamento do salário dele. O Congresso Nacional aprovou 24 projetos com créditos suplementares para diversos ministérios, totalizando R$152,4 bilhões, com o maior valor destinado ao Ministério da Previdência.", "mundo": "A Guatemala recebeu as cinzas do escritor Miguel Ángel Asturias, vencedor do Prêmio Nobel de Literatura em 1967, após 52 anos de exílio. Asturias foi sepultado com quatro dias de homenagens oficiais e cerimônias mayas. Em contraste, o presidente ucraniano Volodymyr Zelensky terá uma reunião com os representantes da União Europeia após uma entrevista recente. A Noruega e a Finlândia proibiram atletas russos de competirem em seus territórios, especialmente durante os Campeonatos Mundiais de Patinação Artística, como resposta às ações da Rússia na Ucrânia.\n\nAs tensões geopolíticas continuam a se acentuar globalmente. No campo do comércio tecnológico, as restrições impostas pela Nvidia ao fornecimento de chips de IA para a China podem se intensificar, refletindo a corrida entre Estados Unidos e China pelo domínio da tecnologia avançada. Em uma questão regional, o presidente russo, Vladimir Putin, rejeitou a ideia de recuar em suas exigências territoriais na Ucrânia durante uma reunião com representantes de Donald Trump, reafirmando seu controle sobre quatro regiões ucranianas que Moscou afirma ter anexado. Além disso, os hutis, aliados do Irã, afirmaram ter atacado uma estação de bombagem em uma das linhas de petróleo da Arábia Saudita, embora a Arábia Saudita não tenha confirmado imediatamente a declaração. No cenário político, após as vitórias nas eleições médias americanas de 2022, a conferência democrata em Denver discutiu o futuro do partido e os desafios políticos internos, enquanto o presidente chinês, Xi Jinping, enfatizou que a reunificação da China e Taiwan é inevitável, considerando Taiwan uma província rebelde a ser reconquistada.", "economia": "O Nubank registrou um lucro líquido de R$ 5,7 bilhões no terceiro trimestre de 2026, impulsionado pelo crescimento nos empréstimos e nos cartões de crédito, conforme relatório publicado pela Folha de S.Paulo. O Banco do Brasil, por outro lado, estabeleceu uma parceria com o banco de desenvolvimento alemão KfW no valor de 100 bilhões de euros para financiar atividades na região amazônica, durante a COP 31, conforme informado pelo CNN Brasil. O Banco Central iniciou a liquidação de duas instituições financeiras: uma cooperativa de crédito e uma administradora de consórcios, informa o Jota. Além disso, o Ibovespa recuou influenciado pela situação fiscal no Brasil e pela elevação dos juros nos Estados Unidos, conforme relatório do Exame. A inflação na Argentina continuou a aumentar em outubro, atingindo o maior nível dos últimos seis meses, de acordo com o Instituto de Estatística (Indec).", "tecnologia": "Jensen Huang, CEO da Nvidia, continua na empresa apesar de revelações de dois casos de relacionamentos extraconjugais, incluindo um com uma suposta espiã chinesa. Essas revelações levantaram dúvidas sobre o futuro da indústria de inteligência artificial. Huang, que foi fundamental para o desenvolvimento da Nvidia, saiu em um momento em que a empresa enfrenta uma perda de mercado estimada em mais de um trilhão de dólares em menos de um mês. Em outro desenvolvimento, o Google anunciou que seu novo modelo Gemini 4 Hydrogen é capaz de fornecer respostas mais úteis para perguntas complexas, incluindo erros de digitação difíceis de entender ou pedidos muito específicos. A computação quântica enfrenta desafios na transição para aplicações reais, como segurança cibernética, tensões geopolíticas entre EUA e China e escassez de talentos, conforme abordado em uma mostra nacional de tecnologias quânticas no Reino Unido.", "ciencia": "A Agência Espacial Europeia recentemente lançou o telescópio espacial Euclid, que visa criar o maior e mais detalhado mapa do universo já realizado. Este avanço tecnológico promete significativos avanços na cosmologia. Paralelamente, pesquisadores da Universidade da Flórida descobriram que a biodiversidade marinha da região profunda do oceano pode estar em perigo, desafiando a ideia de que o fundo do mar seria imune a extinções. Além disso, um estudo publicado na revista Nature Communications estabeleceu um novo recorde mundial em profilometria, com uma nova tecnologia de imagens ultra-rápidas capaz de capturar imagens tridimensionais a uma taxa de até 150.000 quadros por segundo. Este avanço tecnológico pode ter implicações significativas em diversos campos, incluindo a medicina e a pesquisa científica. Por fim, cientistas identificaram pela primeira vez um cogumelo que contém simultaneamente uma substância psicodélica e uma toxina mortal, o Galerina indica, encontrado na Flórida, o que pode ter implicações importantes para a pesquisa em biologia e toxicologia.", "cultura": "O médico e escritor Drauzio Varella foi eleito novo membro da Academia Brasileira de Letras, ocupando a cadeira 32 deixada vaga pela morte de Zuenir Ventura. Sua posse está prevista para 2027. No mesmo contexto cultural, a novela 'Lá na Minha Terra', da Globo, passará por alterações após receber críticas de nordestinos sobre sua representação caricata do Nordeste. Em outro desenvolvimento, o Museu del Humor em Buenos Aires inaugurou sua nova sede no Casco Histórico de Buenos Aires, com direção artística de Tute. No cenário internacional, a Galeria Nacional de Arte anunciou a segunda fase do seu programa de empréstimos 'Across the Nation', trazendo obras-mestras para todo os Estados Unidos para comemorar o 250º aniversário dos Estados Unidos. Além disso, o prêmio Wolfgang Hahn no valor de 105.000 dólares foi concedido a Lorna Simpson, que visa apoiar a aquisição de obras pelo Museu Ludwig de Colônia.", "sociedade": "Um centenar de coletivos se mobilizou para bloquear a Autopista Acceso Sur, em Puente Alto, Chile, em apoio ao paro dos caminhoneiros contra os aumentos de combustível. A violência doméstica associada ao vício em apostas aumentou 75% em um ano, segundo um levantamento do Ministério da Justiça brasileiro. Em Nova York, Hochul abriu a possibilidade de aumentar os impostos para financiar cuidados infantis após sua reeleição. O Distrito Federal oferece 958 oportunidades de emprego com salários até R$ 5 mil, e um policial penal foi preso no Rio de Janeiro suspeito de estuprar uma mulher. A violência doméstica relacionada ao vício em apostas aumentou significativamente, enquanto um suspeito foi detido após um ataque a mulheres trans em Palermo, Argentina. Além disso, um levantamento revelou que o assédio sexual no Exército alemão é mais comum do que indicam os registros oficiais, e mulheres com maior pontuação em testes de inteligência são tratadas de forma pior pelos colegas, recebendo menos apoio. A subvariante XFG da Ômicron representava 90% das amostras testadas pela vigilância genômica do Ministério da Saúde até o final de outubro, associada ao aumento de casos de covid-19 no país.", "meio_ambiente": "A COP31 em Antalya, na Turquia, tem sido marcada por anúncios e debates importantes sobre o meio ambiente. O governo brasileiro anunciou um pacote de R$ 39 bilhões para projetos de transição climática e energética, com o apoio do BNDES, do Fórum de Parcerias do Clima (GCF) e de investidores privados. Em contraste, Greta Thunberg criticou os governos mundiais durante sua primeira aparição na conferência, afirmando que o planeta está sendo destruído. Durante a COP31, a ministra Marina Silva afirmou que não há contradição entre o petróleo e a transição energética. Um estudo publicado na revista Nature detectou microplásticos no sangue de animais da Amazônia, como tamanduás e antas, que vivem a até 100 km de instalações humanas, reforçando a urgência da preservação ambiental. Além disso, o governo do Pará decretou uma emergência ambiental e climática devido à influência do El Niño, que durará 120 dias, suspendendo todas as autorizações e concessões para o uso do fogo no estado.", "direitos_humanos": "Um relatório da organização de direitos humanos Ajuda à Igreja que Sofre (ACN) destaca a escalada da perseguição contra cristãos na África, com um aumento de ataques após o avanço do terrorismo. Em outro desenvolvimento, a mãe de um menino brasileiro que teve um dedo mutilado em Portugal contesta o resultado da investigação oficial, que classificou o caso como acidente. Além disso, a Amnistia Internacional acusa as Nações Unidas e oficiais sul-sudaneses de falhar em prevenir um massacre em um vilarejo, onde mais de 200 pessoas foram mortas. Na América Latina, a reunião do Papa Francisco no Peru sobre o machismo e a necessidade de enfrentar abusos ganha destaque, enquanto a Lambda Istanbul, a organização LGBTQ+ mais antiga da Turquia, teve seu escritório fechado pelas autoridades. Finalmente, em Gaza, Israel realizou ataques a hospitais palestinos, resultando em pelo menos sete mortes, incluindo cirurgiões e pacientes."}, "resumo_do_dia": {"politica_nacional": [{"id": 260482, "titulo": "STF rejeita recursos e manda encerrar ação sobre acordo dos planos econômicos", "url": "https://www.jota.info/stf/do-supremo/stf-rejeita-recursos-e-manda-encerrar-acao-sobre-acordo-dos-planos-economicos", "fonte_id": "jota", "data_pub": "2026-11-12T21:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) rejeitou os recursos e determinou o encerramento definitivo da ação sobre o acordo dos planos econômicos. O prazo de adesão foi mantido até julho de 2027.", "titulo_pt": "STF rejeita recursos e determina encerramento da ação sobre acordo dos planos econômicos", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 260204, "titulo": "STF nega ampliar alcance de acordo sobre planos econômicos para indenizar poupadores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/stf-nega-ampliar-alcance-de-acordo-sobre-planos-economicos-para-indenizar-poupadores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T21:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O STF rejeitou recursos que buscavam ampliar o alcance de um acordo entre bancos e poupadores para indenizar perdas causadas pelos planos econômicos Bresser, Verão e Collor 1 e 2. O tribunal manteve o status quo do acordo existente.", "titulo_pt": "STF nega ampliar acordo para indenizar poupadores afetados pelos planos econômicos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260324, "titulo": "Relator limita cortes do Executivo em ajuste fiscal e preserva Fundo do DF", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/relator-limita-cortes-do-executivo-em-ajuste-fiscal-e-preserva-fundo-do-df/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relator Eduardo Braga aceitou 20 emendas que limitam cortes de despesas do Executivo, protegem recursos de outros Poderes e ampliam as exceções aos benefícios fiscais.", "titulo_pt": "Relator limita cortes do Executivo em ajuste fiscal e preserva Fundo do DF", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 260206, "titulo": "Senado inicia votação do 'plano Moretti' de ajuste fiscal, apesar de protesto da oposição", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/senado-inicia-votacao-do-plano-moretti-de-ajuste-fiscal-apesar-de-protesto-da-oposicao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Davi Alcolumbre, iniciou a votação do plano de ajuste fiscal proposto pelo governo Lula. Um requerimento de urgência para o texto do 'plano Moretti' foi aprovado, e a votação do mérito da matéria está próxima.", "titulo_pt": "Senado inicia votação do 'plano Moretti' de ajuste fiscal, apesar de protesto da oposição", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260399, "titulo": "Cleitinho recorre a Janones e senadora eleita do PT para agendar reunião com Lula", "url": "https://veja.abril.com.br/politica/cleitinho-recorre-a-janones-e-senadora-eleita-do-pt-para-agendar-reuniao-com-lula/", "fonte_id": "veja", "data_pub": "2026-11-12T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O futuro governador de Minas Gerais, que apoiou Flávio Bolsonaro, está buscando renegociar os termos da dívida do estado com o governo federal. Cleitinho está recorrendo a Janones e à senadora eleita do PT para agendar uma reunião com Lula.", "titulo_pt": "Cleitinho busca reunião com Lula para renegociar dívida de minas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 260187, "titulo": "Zanin rejeita liminar pedida por PSD por segundo turno no RJ", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/zanin-rejeita-liminar-pedida-por-psd-por-segundo-turno-no-rj.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-12T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Cristiano Zanin, do STF, rejeitou uma liminar pedida pelo PSD para garantir um segundo turno no Rio de Janeiro entre Douglas Ruas e Eduardo Paes.", "titulo_pt": "Zanin rejeita liminar para segundo turno no rio de janeiro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 260281, "titulo": "Zanin nega pedido do PSD para restabelecer 2º turno no Rio de Janeiro", "url": "https://www.metropoles.com/colunas/manoela-alcantara/zanin-nega-pedido-do-psd-para-restabelecer-2o-turno-no-rio-de-janeiro", "fonte_id": "metropoles", "data_pub": "2026-11-12T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro responsável entendeu que o PSD ainda pode recorrer no processo eleitoral antes de levantar a discussão no Supremo Tribunal Federal (STF). Zanin negou o pedido do PSD para restabelecer o segundo turno no Rio de Janeiro.", "titulo_pt": "Zanin nega pedido do PSD para restabelecer segundo turno no Rio de Janeiro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 260208, "titulo": "Primeiro pacote de ajuste fiscal de Lula 4 gera resistências à esquerda e à direita", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/primeiro-pacote-de-ajuste-fiscal-de-lula-4-gera-resistencias-a-esquerda-e-a-direita.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O primeiro pacote de ajuste fiscal do governo Lula (PT) enfrenta resistências tanto à direita quanto à esquerda. A bancada do PT na Câmara e o empresariado estão trabalhando para modificar o texto do pacote, cada um à sua maneira.", "titulo_pt": "Primeiro pacote de ajuste fiscal de Lula enfrenta resistências de esquerda e direita", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260404, "titulo": "Por que julgamento de processo contra Xuxa foi adiado no STJ pela quarta vez", "url": "https://veja.abril.com.br/cultura/por-que-julgamento-de-processo-contra-xuxa-foi-adiado-no-stj-pela-quarta-vez/", "fonte_id": "veja", "data_pub": "2026-11-12T20:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O processo de plágio contra Xuxa, envolvendo Leo Soltz e os direitos autorais da Turma do Cabralzinho, está em andamento há 26 anos e pode resultar em uma indenização de R$ 80 milhões. O julgamento foi adiado pela quarta vez no STJ.", "titulo_pt": "Por que julgamento de processo contra Xuxa por plágio foi adiado pela quarta vez no STJ", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 260407, "titulo": "Por que STF acha que Lula não tem autoridade para cobrar ministros por suposto elo com Vorcaro", "url": "https://veja.abril.com.br/politica/por-que-stf-acha-que-lula-nao-tem-autoridade-para-cobrar-ministros-por-suposto-elo-com-vorcaro/", "fonte_id": "veja", "data_pub": "2026-11-12T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) considera que Lula não tem autoridade para exigir explicações dos ministros sobre supostas ligações com Vorcaro. Magistrados lembram que Lula também deve esclarecer episódios envolvendo Lulinha e uma lobista chamada Roberta Luchsinger.", "titulo_pt": "Por que STF acha que Lula não tem autoridade para cobrar ministros sobre supostas ligações com Vorcaro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 260484, "titulo": "Após fogo amigo, Planejamento atua para pacificar PLP do ajuste fiscal entre deputados petistas", "url": "https://www.jota.info/executivo/apos-fogo-amigo-planejamento-atua-para-pacificar-plp-do-ajuste-fiscal-entre-deputados-petistas", "fonte_id": "jota", "data_pub": "2026-11-12T20:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei orçamentário plurianual (PLP) do ajuste fiscal, enviado pela equipe econômica ao Congresso, foi criticado publicamente por parlamentares do Partido dos Trabalhadores (PT). O Planejamento atua para tentar pacificar a situação entre os deputados petistas.", "titulo_pt": "Após críticas, Planejamento busca pacificar PLP do ajuste fiscal entre deputados petistas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 260215, "titulo": "Receita e PF investigam fraudes tributárias que somam mais de R$ 185 milhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/receita-e-pf-investigam-fraudes-tributarias-que-somam-mais-de-r-185-milhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Receita Federal e a Polícia Federal realizaram a Operação Tax Mirage para investigar fraudes tributárias que ultrapassam R$ 185 milhões. A ação foi deflagrada nesta quinta-feira (12/12/2026).", "titulo_pt": "Receita e PF investigam fraudes tributárias que somam mais de R$ 185 milhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260188, "titulo": "PT e aliados articulam projeto alternativo ao ajuste fiscal, com taxação dos mais ricos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/pt-e-aliados-articulam-projeto-alternativo-ao-ajuste-fiscal-com-taxacao-dos-mais-ricos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-12T20:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PT e outros partidos de esquerda estão preparando um projeto alternativo ao ajuste fiscal proposto pelo governo Lula, focado na taxação dos mais ricos.", "titulo_pt": "PT e aliados planejam projeto alternativo ao ajuste fiscal, com foco na taxação dos mais ricos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 260217, "titulo": "Plano de ajuste do governo Lula retoma medida já rejeitada pelo Congresso", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/plano-de-ajuste-do-governo-lula-retoma-medida-ja-rejeitada-pelo-congresso.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula retomou um plano de ajuste que inclui uma medida anteriormente rejeitada pelo Congresso. Esta medida, criticada por empresários, foi inicialmente proposta no meio de 2024.", "titulo_pt": "Plano de ajuste do governo Lula retoma medida rejeitada pelo Congresso", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260189, "titulo": "Tarbell Center oferece bolsas para jornalistas cobrirem inteligência artificial", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/novo-em-folha/2026/11/tarbell-center-oferece-bolsas-para-jornalistas-cobrirem-inteligencia-artificial.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-12T20:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tarbell Center for AI Journalism está com inscrições abertas para seu programa de bolsas de 2027, voltado a jornalistas interessados na cobertura de inteligência artificial. As inscrições terminam em 22 de novembro de 2026.", "titulo_pt": "Tarbell Center oferece bolsas para jornalistas cobrirem inteligência artificial", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 260201, "titulo": "STF decide que norma que absolve crime patrimonial contra mulher é incompatível com a Constituição", "url": "https://g1.globo.com/politica/noticia/2026/11/12/stf-decide-que-norma-que-absolve-crime-patrimonial-contra-mulher-e-incompativel-com-a-constituicao.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-12T19:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal declarou, por unanimidade, que é incompatível com a Constituição Federal um dispositivo do Código Penal que isentava de pena o cometimento de crimes patrimoniais contra mulheres em contextos de violência doméstica e familiar. O artigo 181 do Código Penal, que previa essas escusas absolutórias, foi considerado inconstitucional.", "titulo_pt": "STF decide que norma que absolve crime patrimonial contra mulher em violência doméstica é incompatível com a Constituição", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 260489, "titulo": "Miguel Ángel Asturias vuelve a casa: Guatemala recibe con honores las cenizas del escritor que narró su alma", "url": "https://elpais.com/america/2026-11-12/miguel-angel-asturias-vuelve-a-casa-guatemala-recibe-con-honores-las-cenizas-del-escritor-que-narro-su-alma.html", "fonte_id": "elpais_america", "data_pub": "2026-11-12T21:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Guatemala recebeu as cinzas do escritor Miguel Ángel Asturias com quatro dias de homenagens oficiais e cerimônias mayas. Asturias, vencedor do Prêmio Nobel de Literatura em 1967, foi sepultado durante 52 anos em Paris após ser destituído do país por um golpe de Estado em 1954.", "titulo_pt": "Miguel Ángel Asturias retorna à pátria: guatemala celebra as cinzas do escritor que retratou sua alma com honras", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 260503, "titulo": "Army Officer Accused of Trying to Spy for Russia Is Afghan War Veteran", "url": "https://www.nytimes.com/2026/11/12/world/europe/army-britain-arrest-spy-russia.html", "fonte_id": "nyt_world", "data_pub": "2026-11-12T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um oficial do exército, que serviu em uma base da OTAN no Reino Unido, está previsto para ser acusado brevemente, segundo informações de duas fontes.", "titulo_pt": "Oficial do exército acusado de espionar para a Rússia é ex-veterano da guerra afegã", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 260563, "titulo": "Palantir’s CEO on why he’s ‘the most popular’ tech CEO", "url": "https://www.politico.com/video/2026/11/12/palantirs-ceo-on-why-hes-the-most-popular-tech-ceo-2228354", "fonte_id": "politico", "data_pub": "2026-11-12T21:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Palantir não explicou as razões pelas quais ele considera ser o 'mais popular' CEO de tecnologia, mas afirmou estar no cargo de forma significativa. A declaração foi feita em uma entrevista recente.", "titulo_pt": "CEO da palantir afirma ser o 'mais popular' CEO de tecnologia", "veiculo": "Politico", "pais": "EUA", "classe": "A"}, {"id": 260197, "titulo": "Parlamento da Espanha aprova 'decreto Maricarmen', que dificulta despejos, em meio à corrida eleitoral", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/11/parlamento-da-espanha-aprova-decreto-maricarmen-que-dificulta-despejos-em-meio-a-corrida-eleitoral.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-11-12T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Parlamento da Espanha aprovou um dos chamados 'decretos Maricarmen', que visa dificultar despejos, em meio à campanha para as eleições legislativas. Este decreto foi criado pelo governo após protestos por melhores condições para inquilinos no país.", "titulo_pt": "Parlamento da Espanha aprova 'decreto Maricarmen', que dificulta despejos, em meio à corrida eleitoral", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 260328, "titulo": "Restrições a chips de IA para China podem endurecer após saída na Nvidia", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/restricoes-a-chips-de-ia-para-china-podem-endurecer-apos-saida-na-nvidia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Restrições a chips de IA da Nvidia para a China podem se acentuar após a empresa deixar de fornecer componentes para o país. A Nvidia é crucial na corrida dos EUA contra a China para desenvolver sistemas de IA avançados, graças aos seus chips de IA avançados.", "titulo_pt": "Restrições a chips de IA para China podem endurecer após saída da Nvidia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 260598, "titulo": "Across Africa: Tunisians drawn into Russia's war with Ukraine", "url": "https://www.france24.com/en/across-africa-tunisians-drawn-into-russia-s-war-with-ukraine", "fonte_id": "france24", "data_pub": "2026-11-12T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório afirma que mais de 1.400 africanos, incluindo tunisianos, foram recrutados para combater na guerra da Rússia na Ucrânia desde 2023. Além disso, a África do Sul está correndo para se tornar a porta digital da África, mas enfrenta uma crescente oposição em Cape Town. Em Chad, a cidade de Abéché sediou um festival de arte que atraiu jovens espectadores.", "titulo_pt": "Em todo o continente: tunisianos recrutados para a guerra da Rússia na Ucrânia, oposição à digitalização na áfrica do sul e festival de arte em chad", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 260426, "titulo": "La Marina de México y la DEA capturan a alias “R2”, presunto líder del Cartel Jalisco Nueva Generación", "url": "https://www.lanacion.com.ar/estados-unidos/la-marina-de-mexico-y-la-dea-capturan-a-alias-r2-presunto-lider-del-cartel-jalisco-nueva-generacion-nid12112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-12T21:25:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Marinha do México e a DEA capturaram R2, suposto líder regional do Cartel Jalisco Nueva Generación. Estados Unidos solicitou a extradição do criminoso.", "titulo_pt": "Marinha do México e DEA capturam R2, suposto líder do cjng", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 260658, "titulo": "Nvidia chiude al Nasdaq a -4,34%, bruciati oltre 400 miliardi da inizio settimana", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/12/nvidia-chiude-al-nasdaq-a-434-bruciati-oltre-400-miliardi-da-inizio-settimana_b8399481-26a2-4d26-8801-253a2f2d0707.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-12T21:25:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O título da ação da Nvidia caiu 4,34% na bolsa de valores Nasdaq após as demissões do CEO Jensen Huang. A queda foi significativa, com perdas superando 400 bilhões de dólares desde o início da semana.", "titulo_pt": "Nvidia cai -4,34% na Nasdaq após demissão do ceo", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 260754, "titulo": "After meeting Putin, U.S. envoys say Europe to join talks on ending Ukraine war", "url": "https://www.washingtonpost.com/world/2026/11/12/after-meeting-putin-us-envoys-say-europe-join-talks-ending-ukraine-war/", "fonte_id": "washington_post_world", "data_pub": "2026-11-12T21:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os embaixadores dos Estados Unidos disseram após a reunião que a Europa pode participar nas negociações para terminar a guerra na Ucrânia. A Rússia havia se oposto a um papel europeu nas negociações e o presidente Vladimir Putin reiterou sua oposição a tropas de paz europeias.", "titulo_pt": "Depois de se encontrar com Putin, enviados dos EUA dizem que Europa pode se juntar às negociações para encerrar a guerra na Ucrânia", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 260642, "titulo": "Bethlehem Church of the Nativity priest denied visa to speak at US event", "url": "https://www.middleeasteye.net/news/bethlehem-church-nativity-priest-denied-us-visa-speak-washington-dc-event", "fonte_id": "middle_east_eye", "data_pub": "2026-11-12T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O pároco da Igreja da Natividade em Belém, Father Issa Thaljieh, teve seu pedido de vistou negado para falar em um evento nos Estados Unidos. Um pastor da Igreja Luterana de Natal, Munther Isaac, também teve seu vistou negado para um evento separado, apesar de ter visitado o país anteriormente.", "titulo_pt": "Pároco da igreja da natividade tem vistou negado para falar em evento nos EUA", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 260599, "titulo": "Ngo criticizes UN's response to massacre in South Sudan", "url": "https://www.france24.com/en/ngo-criticizes-un-s-response-to-massacre-in-south-sudan", "fonte_id": "france24", "data_pub": "2026-11-12T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amnesty International criticou o governo e as forças de paz da ONU por falhas na proteção de civis durante um massacre em South Sudan que resultou em mais de 200 mortos. Além disso, mais de mil pessoas foram processadas por mineração ilegal em Guiné. Finalmente, um rei malgaxe, morto há um século por tropas francesas coloniais, foi enterrado em seu país natal.", "titulo_pt": "Amnesty critica resposta da ONU a massacre em South Sudan", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 260610, "titulo": "Microsoft reports mass outages in US, impacting customer accessibility", "url": "https://www.dw.com/en/microsoft-reports-mass-outages-in-us-impacting-customer-accessibility/a-79935611?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-12T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft relatou falhas generalizadas em seus serviços Outlook e Teams nos Estados Unidos. Quase 130.000 usuários relataram interrupções nos serviços.", "titulo_pt": "Microsoft relata falhas generalizadas em outlook e teams nos EUA", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 260619, "titulo": "Deadly shooting in Washington DC", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/12/deadly-shooting-in-washington-dc?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-12T21:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia do Distrito de Columbia está investigando um tiroteio a aproximadamente um quilômetro do Palácio Vermelho que resultou em uma morte.", "titulo_pt": "Tiroletado letal no distrito de columbia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 260383, "titulo": "Meta exibe mais de 700 anúncios de bets proibidas, revela levantamento da BBC", "url": "https://www.bbc.com/portuguese/articles/cw4gnvzzdjr7o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-12T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A BBC identificou mais de 700 anúncios de apostas proibidas em plataformas da Meta. Um relatório interno do governo já havia apontado publicidade irregular nas mesmas plataformas antes da proibição.", "titulo_pt": "Meta exibe mais de 700 anúncios de apostas proibidas, revela levantamento da BBC", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 260643, "titulo": "Trump sidelines Vance from Iran talks, says no need to negotiate", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/trump-sidelines-vance-iran-talks-says-no-need-negotiate", "fonte_id": "middle_east_eye", "data_pub": "2026-11-12T21:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump afirmou que os EUA não estão interessados em negociações com a Irã e que não há necessidade de um acordo. Ele também parece ter marginalizado o vice-presidente JD Vance, que tentava se posicionar como mediador nas discussões sobre o Irã.", "titulo_pt": "Trump afasta Vance das negociações com a Irã e diz não haver necessidade de negociar", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 260659, "titulo": "A Dublino incontro tra Zelensky e gli sherpa dell'Ue degli E4", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/12/a-dublino-incontro-tra-zelensky-e-gli-sherpa-dellue-degli-e4_6673f9f3-7780-46ec-86b4-a8793893b030.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-12T21:10:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O líder ucraniano Zelensky terá uma reunião com Witkoff e Kushner imediatamente após essa entrevista.", "titulo_pt": "Encontro de Zelensky com os 'sherpa' da ue e EUA", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 260320, "titulo": "Nubank registra lucro de US$ 1,09 bilhão no 3° tri, avanço de 31%", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/nubank-registra-lucro-de-us-109-bilhao-no-3-tri-avanco-de-31/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nubank registrou um lucro de US$ 1,09 bilhão no terceiro trimestre, um aumento de 31% em comparação com o mesmo período anterior. A receita também atingiu US$ 6,26 bilhões, crescendo 37% em relação ao trimestre anterior.", "titulo_pt": "Nubank registra lucro de r$ 3,5 bilhões no 3° tri, avanço de 31%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 260321, "titulo": "BB fecha parceria de 100 bilhões de Euros com banco alemão para bioeconomia", "url": "https://www.cnnbrasil.com.br/agro/bb-fecha-parceria-de-100-bilhoes-de-euros-com-banco-alemao-para-bioeconomia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco do Brasil estabeleceu uma parceria com o banco de desenvolvimento alemão KfW no valor de 100 bilhões de euros para financiar atividades na região amazônica, durante a COP 31.", "titulo_pt": "BB fecha parceria de 100 bilhões de Euros com banco alemão para bioeconomia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 260483, "titulo": "PLP 299 dobra o aumento do lucro presumido e põe compensação tributária nas mãos do Executivo", "url": "https://www.jota.info/opiniao-e-analise/artigos/plp-299-dobra-o-aumento-do-lucro-presumido-e-poe-compensacao-tributaria-nas-maos-do-executivo", "fonte_id": "jota", "data_pub": "2026-11-12T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei prevê aumentar a arrecadação em até R$ 60 bilhões em 2027, mas amplia a tributação sobre o lucro presumido e restringe as compensações tributárias.", "titulo_pt": "PLP 299 duplica aumento do lucro presumido e transfere compensação tributária para o Executivo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 260205, "titulo": "Nubank vê lucro crescer para R$ 1,1 bilhão puxado por cartão de crédito", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/nubank-ve-lucro-crescer-para-r-11-bilhao-puxado-por-cartao-de-credito.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nubank registrou um lucro líquido de R$ 5,7 bilhões no terceiro trimestre de 2026, impulsionado pelo crescimento nos empréstimos e nos cartões de crédito.", "titulo_pt": "Nubank registra lucro de R$ 5,7 bilhões puxado por cartões de crédito", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260207, "titulo": "Inflação sobe pelo segundo mês consecutivo na Argentina", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/inflacao-sobe-pelo-segundo-mes-consecutivo-na-argentina.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inflação no índice de preços ao consumidor da Argentina continuou a aumentar em outubro, atingindo o maior nível dos últimos seis meses, conforme informado pelo Indec (Instituto de Estatística).", "titulo_pt": "Inflação sobe pelo segundo mês consecutivo na Argentina", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260209, "titulo": "Após anunciar compra da Warren, Cocos mira avanço no Brasil: '10 vezes o tamanho do mercado argentino'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/apos-comprar-warren-fintech-cocos-mira-avanco-no-brasil-10-vezes-o-tamanho-do-mercado-argentino.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A fintech argentina Cocos, que adquiriu a Warren Investimentos, recebeu um investimento de US$ 34 milhões e planeja expandir seu negócio no Brasil, onde espera a aprovação da compra pela autoridade monetária local.", "titulo_pt": "Cocos mira expansão no Brasil após investimento de us$ 34 milhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260210, "titulo": "BB usou crédito tributário gerado por perdas com empréstimos para evitar prejuízo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/bb-usou-credito-tributario-gerado-por-perdas-com-credito-para-evitar-prejuizo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco do Brasil incluiu créditos tributários futuros na contabilidade do terceiro trimestre para evitar um prejuízo líquido. O resultado operacional antes da tributação foi negativo em R$ 906 milhões.", "titulo_pt": "BB usou créditos tributários para evitar prejuízo no terceiro trimestre", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260338, "titulo": "Bitcoin cai a US$ 71 mil em meio a tensões e crise da Nvidia", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/bitcoin-cai-a-us-71-mil-em-meio-a-tensoes-e-crise-da-nvidia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Bitcoin caiu para US$ 71.529,08, recuando 3,8%, enquanto o Ethereum caiu para US$ 2.012,88, com uma queda de 3,12%, de acordo com a plataforma Coinbase.", "titulo_pt": "Bitcoin cai para US$ 71 mil em meio a tensões e crise da Nvidia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 260211, "titulo": "Acionistas querem o Banco Master na mira de auditoria na Oncoclínicas que adiou balanço", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/acionistas-querem-o-banco-master-na-mira-de-auditoria-na-oncoclinicas-que-adiou-balanco.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T21:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Acionistas pedem que a auditoria da Oncoclínicas, responsável por adiar a divulgação do balanço da empresa em recuperação extrajudicial, investigue as motivações dos investimentos no Banco Master por parte da gestão anterior.", "titulo_pt": "Acionistas querem auditoria focada em investimentos no Banco Master na Oncoclínicas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260212, "titulo": "Dividendos ou crescimento: qual estratégia deixou o investidor mais rico?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/11/dividendos-ou-crescimento-qual-estrategia-deixou-o-investidor-mais-rico.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto compara duas estratégias de investimento: o recebimento de dividendos imediatos ou a reinvestimento para potencializar o crescimento a longo prazo. Ambas as opções têm seus próprios benefícios e desafios.", "titulo_pt": "Dividendos ou crescimento: qual estratégia fez o investidor mais rico?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260622, "titulo": "US releases report on $12bn from Venezuelan oil, mineral resources", "url": "https://www.aljazeera.com/news/2026/11/12/us-releases-report-on-12bn-from-venezuelan-oil-mineral-resources?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-12T20:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório visa abordar preocupações sobre o manejo da administração Trump dos recursos financeiros mantidos em confiança para a Venezuela.", "titulo_pt": "EUA libera relatório sobre $12 bi de petróleo e minerais venezuelanos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 260266, "titulo": "Inflação da Argentina sobe 2,2% em outubro e 33,1% em 12 meses", "url": "https://www.poder360.com.br/poder-economia/inflacao-da-argentina-sobe-22-em-outubro-e-331-em-12-meses/", "fonte_id": "poder360", "data_pub": "2026-11-12T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inflação na Argentina aumentou 2,2% em outubro e chegou a 33,1% em 12 meses. O índice acelerou em comparação com setembro, quando a alta foi de 1,9%, devido principalmente aos reajustes nos preços do gás e combustíveis.", "titulo_pt": "Inflação na Argentina sobe 2,2% em outubro e 33,1% em 12 meses", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 260213, "titulo": "Burberry supera crise do luxo com foco em peças clássicas no exterior", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/burberry-supera-crise-do-luxo-com-foco-em-pecas-classicas-no-exterior.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Burberry manteve a recuperação das vendas devido à alta demanda por cachecóis e casacos trench coat, contrariando a deterioração dos resultados no setor de luxo.", "titulo_pt": "Burberry supera crise do luxo com foco em peças clássicas no exterior", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260214, "titulo": "Samsung aposta na tela inicial das TVs para anúncios", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/samsung-aposta-na-tela-inicial-das-tvs-para-anuncios.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Samsung está investindo na tela inicial das Smart TVs como um novo espaço para anúncios, apesar da existência de anúncios em outros formatos. O segmento de publicidade da empresa coreana, Samsung Ads, está promovendo essa estratégia.", "titulo_pt": "Samsung investe na tela inicial das TVs para anúncios", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260258, "titulo": "BB aponta recusa de produtores em renegociar dívidas do agro", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/bb-aponta-recusa-de-produtores-em-renegociar-dividas-do-agro", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-12T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A presidenta do Banco do Brasil, Tarciana Medeiros, informou que parte dos médios e grandes produtores rurais inadimplentes se recusaram a pagar dívidas, renegociar operações ou apresentar novas garantias, mesmo com programas de repactuação ofertados com condições facilitadas. Este comportamento tem agravado a inadimplência na carteira de agronegócios do banco.", "titulo_pt": "BB relata recusa de produtores em renegociar dívidas do agronegócio", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 260218, "titulo": "Seminário da Folha discute perspectivas para a macroeconomia brasileira", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/seminariosfolha/2026/11/seminario-da-folha-discute-perspectivas-para-a-macroeconomia-brasileira.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T19:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Folha de S.Paulo está promovendo um seminário em 23 de novembro para discutir as perspectivas da macroeconomia brasileira no ciclo 2027-2030, durante o quarto mandato do presidente Lula (PT).", "titulo_pt": "Seminário da Folha discute perspectivas para a macroeconomia brasileira", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 260704, "titulo": "Google’s new Gemini model is better at understanding complicated questions", "url": "https://www.theverge.com/ai-artificial-intelligence/1032505/google-search-ai-mode-gemini-4-hydrogen", "fonte_id": "the_verge", "data_pub": "2026-11-12T21:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Google anunciou que seu novo modelo Gemini 4 Hydrogen é capaz de fornecer respostas mais úteis para perguntas complexas, incluindo perguntas com várias partes, erros de digitação difíceis de entender ou pedidos muito específicos. O modelo pode descompor as perguntas e abordar cada parte em suas respostas, e está disponível a partir de hoje em busca, o aplicativo Gemini e em todas as tarifas do Google.", "titulo_pt": "Google lança novo modelo Gemini 4 hydrogen com capacidade de responder perguntas mais complexas", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 260716, "titulo": "Quantum computing faces security, geopolitical, talent hurdles", "url": "https://www.digitimes.com/news/a20261110PD249/quantum-uk-2026-talent-quantum-computing.html", "fonte_id": "digitimes", "data_pub": "2026-11-12T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A mostra nacional de tecnologias quânticas do Reino Unido, realizada em Londres em 2026, abordou os desafios enfrentados pela computação quântica na transição para aplicações reais, incluindo segurança cibernética, tensões geopolíticas entre EUA e China e escassez de talentos.", "titulo_pt": "Computação quântica enfrenta desafios de segurança, tensões geopolíticas e escassez de talentos", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 260607, "titulo": "Microsoft outage hits Outlook. AWS and Google users also report issues", "url": "https://www.cnbc.com/2026/11/12/microsoft-outage-outlook-aws-google.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-12T21:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft enfrentou um desligamento que afetou o Outlook. Usuários de Amazon Web Services e Google também relataram problemas.", "titulo_pt": "Microsoft interrupção afeta Outlook. Usuários de AWS e Google relatam problemas", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 260382, "titulo": "O que se sabe de falha na Microsoft que deixou fora do ar Outlook e afetou Teams, Microsoft 365 e outras plataformas", "url": "https://www.bbc.com/portuguese/articles/c6wy49w32epwo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-12T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Microsoft relatou falhas em seus servidores após relatos de problemas de conexão com serviços como Outlook, Microsoft 365 e Teams em todo o mundo.", "titulo_pt": "O que se sabe sobre falha na Microsoft que deixou Outlook e outros serviços fora do ar", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 260670, "titulo": "Nvidia’s hunt for Jensen Huang’s successor: insiders, rivals and a Trump pick", "url": "https://www.scmp.com/news/china/diplomacy/article/3374268/nvidias-hunt-jensen-huangs-successor-insiders-rivals-and-trump-pick", "fonte_id": "scmp", "data_pub": "2026-11-12T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nvidia está em busca de seu primeiro novo líder em 33 anos após Jensen Huang deixar a empresa na quinta-feira, com a interina Colette Kress, engenheiros experientes, membros da própria família de Huang e chefes de rivais de fabricantes de chips sendo mencionados como possíveis sucessores. A gigante de chips de IA ficou sem seu único líder quando Huang, com 63 anos, deixou a presidência, a chefia executiva e o cargo de membro do conselho de administração.", "titulo_pt": "Nvidia procura sucessor de Jensen Huang: interina, engenheiros, familiares e rivais", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 260696, "titulo": "Jensen Huang Didn’t Name His Own Replacement as One of Tech’s Most Powerful Women", "url": "https://www.wired.com/story/jensen-huang-colette-kress-replacement-powerful-women-in-tech/", "fonte_id": "wired", "data_pub": "2026-11-12T20:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma investigação recente da WIRED explorou a definição complexa de 'poder' para mulheres na indústria. As respostas de Jensen Huang agora parecem indicar seus pontos cegos.", "titulo_pt": "Jensen Huang não nomeou sua própria substituta entre as mulheres mais poderosas da tecnologia", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 260678, "titulo": "Nvidia privately confirmed it could track chips to fight smuggling, even as industry publicly questioned feasibility", "url": "https://www.technologyreview.com/2026/11/12/1148483/nvidia-chip-tracking/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-12T20:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nvidia informou ao representante Bill Foster de Illinois que seria tecnicamente possível implementar medidas antifurtos conforme propostas no Chip Security Act, mesmo enquanto um grupo da indústria afirmava que essas medidas seriam 'potencialmente infeasíveis'.", "titulo_pt": "Nvidia confirma tecnicamente possível rastrear chips para combater o contrabando, enquanto setor duvida", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 260590, "titulo": "Jensen Huang's implosion at Nvidia leaves trail of collateral damage", "url": "https://www.axios.com/2026/11/12/jensen-huang-nvidia-ceo-ai-resignation", "fonte_id": "axios", "data_pub": "2026-11-12T20:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang, líder singular da Nvidia, teve sua saída repentina, após relatos de múltiplos casos de infidelidade, causado um prejuízo de mais de 600 bilhões de dólares no valor de mercado da empresa. Sua saída tem potencial para envolver a diretoria da Nvidia e ameaçar o boom da IA.", "titulo_pt": "Colapso de jensen Huang na Nvidia causa danos colaterais", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 260697, "titulo": "Major Microsoft Outlook Outage Leaves People With Email Jobs Unable to Email", "url": "https://www.wired.com/story/major-microsoft-outlook-outage-hits-365-customers-north-america/", "fonte_id": "wired", "data_pub": "2026-11-12T20:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft está enfrentando problemas técnicos que afetam seus sistemas, particularmente os relacionados ao Outlook para clientes de negócios e corporativos. A empresa está trabalhando para resolver o problema o mais rápido possível.", "titulo_pt": "Grande interrupção no Outlook deixa clientes de negócios sem capacidade de envio de emails", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 260703, "titulo": "Binance says all asset losses from N. Korea-linked cyberattack covered", "url": "https://en.yna.co.kr/view/AEN20261113000200315", "fonte_id": "yonhap_news", "data_pub": "2026-11-12T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Binance, uma exchange global de criptomoedas, anunciou que todas as perdas de ativos resultantes de um ataque cibernético associado à Coreia do Norte foram cobertas.", "titulo_pt": "Binance afirma que todas as perdas de ativos de ataque cibernético relacionado à Coreia do norte foram cobertas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 260698, "titulo": "Climate Change Has Pushed the World's Ice Out of Its Safe Zone", "url": "https://www.wired.com/story/climate-change-abolishes-ice/", "fonte_id": "wired", "data_pub": "2026-11-12T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aquecimento global causado pelo uso de combustíveis fósseis tem colocado as áreas geladas do planeta em um risco maior de danos acelerados e, em parte, irreversíveis. A estabilidade do crioesfera tem sido crucial para o desenvolvimento humano.", "titulo_pt": "Mudanças climáticas empurraram as áreas geladas do planeta para uma zona de risco", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 260699, "titulo": "Jensen Huang’s $470 Billion Affair", "url": "https://www.wired.com/story/uncanny-valley-podcast-jensen-huangs-dollar470-billion-affair/", "fonte_id": "wired", "data_pub": "2026-11-12T18:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nesta semana, o programa 'Uncanny Valley' analisará o affair do CEO da Nvidia com uma suposta espiã chinesa e suas implicações para o setor de inteligência artificial.", "titulo_pt": "Affair do ceo da nvidia com suspeita de espiã chinesa", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 260638, "titulo": "Nvidia sends a painful message on how to value a CEO", "url": "https://www.ft.com/content/610fc69e-51ae-4f7a-8e48-c2ce42860ff4?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-12T18:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia enviou uma mensagem clara sobre a importância e o valor de um CEO, o que deve ajudar a esclarecer essas questões para todos. Mais clareza sobre por que os fundadores importam e quanto eles valerem deve beneficiar todos os envolvidos.", "titulo_pt": "Nvidia envia mensagem sobre valorização de um CEO", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 260221, "titulo": "IA continua sendo força dominante de investimentos empresariais nos EUA em 2027, diz Goldman Sachs", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/ia-continua-sendo-forca-dominante-de-investimentos-empresariais-nos-eua-em-2027-diz-goldman-sachs.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T18:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Goldman Sachs previu que os investimentos anuais em hardware e propriedade intelectual relacionados à inteligência artificial nos Estados Unidos atingirão US$ 1,4 trilhão até o fim de 2027, equivalente a quase 4% da economia americana.", "titulo_pt": "IA continua sendo força dominante de investimentos empresariais nos EUA em 2027, diz Goldman Sachs", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260224, "titulo": "Saída de Jensen Huang ameaça rede de financiamento da indústria de IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/saida-de-jensen-huang-ameaca-rede-de-financiamento-da-industria-de-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T18:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A saída de Jensen Huang pode ameaçar a rede de financiamento da indústria de IA, que antes era mantida por parte dos enormes lucros da Nvidia. Sob seu comando, a empresa destinava recursos para startups de inteligência artificial, fornecedores e clientes que compravam seus chips.", "titulo_pt": "Saída de Jensen Huang ameaça rede de financiamento da indústria de IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 260711, "titulo": "Oh, Palantir is ‘progressive’ now, is it?", "url": "https://www.theverge.com/ai-artificial-intelligence/1032126/alex-baby-you-were-recorded-on-video", "fonte_id": "the_verge", "data_pub": "2026-11-12T18:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alex Karp, CEO da Palantir, tentou se posicionar como mais progressista após as últimas eleições que favoreceram o lado direito.", "titulo_pt": "Oh, Palantir se tornou 'progressista' agora, não é?", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 259918, "titulo": "Groups unveil new obesity treatment guidelines", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/13/2003867669", "fonte_id": "taipei_times", "data_pub": "2026-11-13T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos apresentaram novas diretrizes para o tratamento da obesidade. Essas diretrizes visam fornecer orientações mais atualizadas e eficazes para a abordagem da obesidade.", "titulo_pt": "Grupos lançam novas diretrizes para tratamento da obesidade", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 259920, "titulo": "Taiwan researchers develop method to repurpose tea waste", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/13/2003867671", "fonte_id": "taipei_times", "data_pub": "2026-11-13T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores de Taiwan desenvolveram um método para reutilizar resíduos de chá. O método visa transformar o lixo de chá em produtos úteis.", "titulo_pt": "Investigadores de taiwan desenvolvem método para reutilizar resíduos de chá", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 260724, "titulo": "Wood stove experiment reveals how wildfire smoke helps sunlight regenerate nitrogen oxides", "url": "https://phys.org/news/2026-11-wood-stove-reveals-wildfire-sunlight.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O experimento com uma chaminé de lenha mostrou como as partículas de fuligem de incêndios florestais ajudam a regenerar óxidos de nitrogênio através da luz solar. As nuvens de fuligem de incêndios podem viajar por milhares de quilômetros, chegando a continentes e oceanos distantes.", "titulo_pt": "Experimento com chaminé de lenha revela como fumaça de incêndio ajuda a regenerar óxidos de nitrogênio", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 260725, "titulo": "Unrealistic emissions scenarios help AI climate models prepare for unfamiliar futures", "url": "https://phys.org/news/2026-11-unrealistic-emissions-scenarios-ai-climate.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da MIT desenvolveram uma técnica que agiliza a criação de modelos de inteligência artificial para previsão do clima, tornando-os mais rápidos, confiáveis e adaptáveis. Essas previsões precisas e atualizadas são cruciais para decisões de planejamento que aumentam a resiliência das redes de energia, protegem a saúde pública e maximizam os rendimentos agrícolas.", "titulo_pt": "Cenários de emissões irrealistas ajudam modelos de IA climático a se prepararem para futuros imprevisíveis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 260726, "titulo": "Want to be more productive at work? Show your boss this study", "url": "https://phys.org/news/2026-11-productive-boss.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cada dia de trabalho é uma negociação entre nosso corpo e nossa tarefa. Sentar por muito tempo pode causar dores nas costas e no pescoço, enquanto ficar de pé por muito tempo pode gerar desconforto nos pés.", "titulo_pt": "Quer ser mais produtivo no trabalho? Veja este estudo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 260424, "titulo": "Lanzan una aplicación gratuita para despertar la vocación científica entre los adolescentes", "url": "https://www.lanacion.com.ar/sociedad/lanzan-una-aplicacion-gratuita-para-despertar-la-vocacion-cientifica-entre-los-adolescentes-nid12112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-12T21:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A aplicação gratuita foi lançada pelo ITBA e desenvolvida em colaboração com universidades internacionais de prestígio, com financiamento da União Europeia. O objetivo é despertar a vocação científica entre os adolescentes.", "titulo_pt": "Lançada aplicação gratuita para despertar vocação científica entre os adolescentes", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 260727, "titulo": "Genetic data reveal hidden extinction risks in the deep sea", "url": "https://phys.org/news/2026-11-genetic-reveal-hidden-extinction-deep.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas pesquisas, lideradas por cientistas da Universidade da Flórida e publicadas na Nature Communications, indicam que a biodiversidade marinha da região profunda do oceano pode estar em perigo, desafiando a ideia de que o fundo do mar seria imune a extinções.", "titulo_pt": "Dados genéticos revelam riscos ocultos de extinção no fundo do mar", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 260728, "titulo": "Reusable molecular fabric could cut energy needed to separate industrial chemicals", "url": "https://phys.org/news/2026-11-reusable-molecular-fabric-energy-industrial.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas da UT Austin e Zhejiang University desenvolveram uma tecnicamente molecular reutilizável que pode reduzir a quantidade de energia necessária para separar químicos industriais, como os encontrados no processo de fabricação de nylons, pinturas, certos espumas usadas em móveis e até detergentes.", "titulo_pt": "Fabricante molecular reutilizável pode reduzir energia necessária para separar químicos industriais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 260729, "titulo": "Hubble offers cosmic sampler of targets for Roman", "url": "https://phys.org/news/2026-11-hubble-cosmic-sampler-roman.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Hubble Space Telescope capturou uma galeria de lentes gravitacionais que ilustra a diversidade deste fenômeno cósmico e prepara o terreno para observações subsequentes pela nova Telescópio Espacial Nancy Grace Roman.", "titulo_pt": "Hubble oferece amostra cosmic de alvos para Roman", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 260730, "titulo": "What a brewery can teach the chemical industry", "url": "https://phys.org/news/2026-11-brewery-chemical-industry.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quando o químico desejado é tóxico para o microrganismo que o produz, o que se faz? Esta é uma questão que limita o esforço de substituir a fabricação baseada em petróleo por biologia, e os pesquisadores do projeto Sustainable Commodity Chemicals through Enzyme Engineering and Design estão abordando o problema usando um princípio do cervejaria.", "titulo_pt": "O que uma cervejaria pode ensinar à indústria química", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 260731, "titulo": "Ultrafast 3D imaging captures fleeting motion at 150,000 frames per second", "url": "https://phys.org/news/2026-11-ultrafast-3d-imaging-captures-fleeting.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de pesquisa do Instituto Nacional de Pesquisas Científicas (INRS), sob a liderança do professor Jinyang Liang, desenvolveu uma nova tecnologia de imagens ultra-rápidas capaz de capturar imagens tridimensionais a uma taxa de até 150.000 quadros por segundo. Publicado na revista Nature Communications, o estudo estabelece um novo recorde mundial em profilometria.", "titulo_pt": "Imagem 3D ultra-rápida captura movimento em 150.000 quadros por segundo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 260196, "titulo": "Quando a música não é feita por humanos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/colunas/suzanaherculanohouzel/2026/11/quando-a-musica-nao-e-feita-por-humanos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-12T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um aposentado que era baterista profissional compõe músicas em seu tempo livre usando sintetizadores embutidos em software no laptop. Ele é fã de Frank Zappa.", "titulo_pt": "Quando a música não é feita por humanos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 260733, "titulo": "Space telescope Euclid sets the new standard for cosmology", "url": "https://phys.org/news/2026-11-space-telescope-euclid-standard-cosmology.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 1º de julho de 2023, a Agência Espacial Europeia (ESA) lançou o telescópio espacial Euclid. A missão do Euclid é criar o mapa do universo mais extenso e detalhado já realizado.", "titulo_pt": "Telescópio espacial Euclid estabelece novo padrão para cosmologia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 260780, "titulo": "This supernova impostor baffled astronomers for 15 years — until they found a hidden black hole feeding on an unstable star", "url": "https://www.space.com/astronomy/black-holes/this-supernova-impostor-baffled-astronomers-for-15-years-until-they-found-a-hidden-black-hole-feeding-on-an-unstable-star", "fonte_id": "space_com", "data_pub": "2026-11-12T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um buraco negro ou estrela de neutrons oculto como companheiro de uma estrela instável está causando a erupção da sistema em luz que imita uma explosão de supernova. Este fenômeno confundiu astrônomos por 15 anos até que foi identificado um buraco negro alimentando-se de uma estrela instável.", "titulo_pt": "Este impostor de supernova confundiu astrônomos por 15 anos — até que encontraram um buraco negro alimentando uma estrela instável", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 260734, "titulo": "Toxic Salton Sea dust may trigger lung inflammation and reduce gut microbial diversity", "url": "https://phys.org/news/2026-11-toxic-salton-sea-trigger-lung.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado na Scientific Reports examina a conexão surpreendente entre mudanças climáticas, poluição e os impactos negativos na saúde que comunidades marginalizadas enfrentam. O estudo sugere que poeira tóxica do Mar Salgado pode causar inflamação pulmonar e reduzir a diversidade microbiana no trato gastrointestinal.", "titulo_pt": "Poeira tóxica do mar salgado pode causar inflamação pulmonar e reduzir diversidade microbiana no intestino", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 260735, "titulo": "Despite falling enrollment, public schools haven't downsized", "url": "https://phys.org/news/2026-11-falling-enrollment-schools-havent-downsized.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de alunos em escolas públicas dos Estados Unidos diminuiu significativamente nos últimos anos, com uma queda superior a um milhão de alunos desde o início da pandemia de COVID-19. Essa redução acentuada aumentou a pressão financeira em muitas distritos, levando a debates públicos frequentemente contenciosos sobre fechamentos de escolas e demissões de funcionários.", "titulo_pt": "Embora a matrícula tenha caído, as escolas públicas não reduziram o tamanho", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 259931, "titulo": "Capitol reflections", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/13/2003867639", "fonte_id": "taipei_times", "data_pub": "2026-11-13T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto parece se referir a reflexões sobre o Capitólio, mas não fornece detalhes específicos. Portanto, o resumo é limitado às informações disponíveis.", "titulo_pt": "Reflexões sobre o capitólio", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 260228, "titulo": "Grammy Latino premia Urias por álbum alternativo; acompanhe os vencedores", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/grammy-latino-premia-criolo-na-categoria-de-mpb-acompanhe-os-vencedores.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-12T21:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Urias ganhou o Grammy Latino pelo álbum 'Carrança' durante a 27ª edição do prêmio em 2026. A cantora agradeceu a Liniker, vencedora do
