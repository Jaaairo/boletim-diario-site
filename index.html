 apenas os Estados Unidos votando contra. Em seguida, os Estados Unidos anunciaram um pacote de 1 bilhão de euros em auxílio agrícola após o verão de secas e ondas de calor, em uma tentativa de mitigar os efeitos econômicos da crise climática na agricultura francesa. Paralelamente, a Itália enfrentou um caos nos trens em outubro de 2024, resultando em uma multa de 1,75 milhão de euros para a RFI por um problema causado por um 'chifre' na estação de Roma Termini.\n\nA situação geopolítica permanece tensa em diversos locais do mundo. Na Ucrânia, o conflito entre Rússia e Ucrânia continua, com relatos de ataques a instalações de segurança. Um drone israelense atingiu duas pessoas no sul do Líbano, enquanto Israel realizou ataques em colinas estratégicas no país vizinho. No Mar Negro, os ataques russos e ucranianos intensificaram, levantando preocupações sobre a escalada do conflito e os preços globais de alimentos. Em Israel, a política está polarizada, com o ataque de 7 de outubro sendo crucial para o cenário político. O governo americano expressou desejo de presença de outras nações no espaço interestelar. No Oriente Médio, a tensão entre Israel e o Irã continua, com o Irã advertindo países do Oriente Médio sobre o uso de seu território para ataques. Além disso, o Reino Unido reafirmou sua posição sobre as Ilhas Falkland, em resposta às declarações do presidente argentino Javier Milei. No contexto global, a questão do reconhecimento do Somália do Norte pelos Estados Unidos ganha destaque, enquanto a guerra na África do Sul e os conflitos regionais continuam a afetar o cenário geopolítico.", "economia": "O mercado de trabalho nos Estados Unidos registrou um forte crescimento em agosto, com a criação de 162.000 novos postos de trabalho, superando as expectativas e potencialmente levando a um aumento da taxa de juros pelo Federal Reserve. Essa notícia fortalece as contas públicas do presidente Lula, que planeja ajustar as finanças sem grandes cortes de gastos. Em contrapartida, a China pode se tornar um concorrente do Brasil no mercado mundial de frango, com a previsão de uma maior participação chinesa, especialmente no Oriente Médio. O Brasil também enfrenta desafios, como a falta de cobertura previdenciária para 80,6% dos motociclistas de aplicativos, e a necessidade de se preparar para os efeitos do fenômeno El Niño no setor elétrico, com a Taesa tomando medidas preventivas. Além disso, a NBS Petróleo e Gás, uma junior oil, planeja explorar oportunidades de crescimento por meio de fusões e aquisições, enquanto a Volkswagen anuncia cortes de 100.000 empregos em um esforço de reestruturação.", "tecnologia": "A Nvidia comprou a Hugging Face por 13 bilhões de dólares, fortalecendo seu ecossistema de inteligência artificial aberta e reforçando sua posição no mercado. A Lite-On Tech está investindo em tecnologias de resfriamento líquido para melhorar a performance e eficiência de seus produtos eletrônicos. A OpenAI lançou seu novo modelo de inteligência artificial, GPT-6 Astra, com menos transparência sobre como o modelo opera, o que levanta preocupações de segurança. A Nvidia também anunciou a aquisição da Hugging Face, não apenas para proteger seu ecossistema de IA, mas também para fortalecer relações com desenvolvedores e manter-se à frente de concorrentes. Ainda em relação à IA, a OpenAI enfrenta preocupações sobre as implicações das assistentes de IA com poder total para os direitos constitucionais dos Estados Unidos.", "ciencia": "A ciência avança em diversos campos, com destaque para a busca por soluções para a poluição plástica global. Cientistas estão pedindo à ONU que implemente um relatório global sobre o assunto, já que o plástico, embora versátil, apresenta desafios ambientais significativos. Além disso, um novo tratamento injetável, testado em ratos, mostrou promessa para a recuperação cerebral após AVC, estimulando vasos sanguíneos, células imunes e melhorando a motora nessas áreas lesadas. Em outro avanço, pesquisadores chineses desenvolveram um material chamado PhosCage que permite a extração de urânio do mar a uma taxa de até oito vezes superior à meta estabelecida pelos Estados Unidos, colocando a China à frente na busca por um vasto recurso de combustível nuclear.", "cultura": "O filme 'O Último Azul', dirigido por Gabriel Mascaro, foi incluído na lista dos melhores do ano pelo site IndieWire, especializado em críticas de filmes e na indústria de entretenimento. Durante uma sessão da Comissão de Mulheres da Câmara dos Deputados, parlamentares do governo e da oposição discutiram sobre a possibilidade de se reunir formalmente com a ministra Judith Marín. O ex-ministro peruano Pedro Cateriano, que visitará Santiago para participar de um evento sobre liberdade de expressão, enfatizou a importância de Keiko Fujimori demonstrar respeito à liberdade de expressão. O 150º aniversário da Orden de la Visitación de Santa María na Argentina será comemorado no próximo 8 de setembro, com 16 religiosas vivendo no mosteiro de Pilar, incluindo seis em formação.", "sociedade": "Em 7 de setembro, durante um feriado prolongado, ocorreu uma colisão entre caminhões em Ponte Serrada, Santa Catarina, resultando em uma morte e ferimentos em uma mulher e uma criança, conforme relatado pela Metrópoles. No mesmo dia, 31 praias em São Paulo foram consideradas impróprias para banho, informou a Cetesb. A espera em consultórios odontológicos acumula mais de 537 mil atendimentos atrasados, de acordo com especialistas, o que pode agravar problemas odontológicos e afetar a autoestima. Um relatório do Ministério Público do Chile, relativo a sequestros entre 2025 e o primeiro semestre de 2026, revelou que um quarto dos acusados eram estrangeiros, apesar de haver diminuições nos casos registrados nos últimos dois anos.", "meio_ambiente": "O verão de 2026 foi o mais quente já registrado na França, superando em quase 1°C a marca anterior, evidenciando o impacto do aquecimento global. Este fenômeno climático extremo está acompanhado por outros eventos climáticos em diferentes partes do mundo. No Brasil, o 'super El Niño' pode trazer chuvas acima da média para São Paulo e temperaturas mais elevadas no Norte e Nordeste, aumentando o risco de novos temporais na região Sul. Em contraste, o Reino Unido anunciou um fundo de 400 milhões de libras para florestas tropicais, mas a liberação ainda depende de definições de governança e estrutura financeira.", "direitos_humanos": "A ONU acusou Israel de possíveis práticas de limpeza étnica na Cisjordânia, onde teria forçado o deslocamento de toda a população de três campos de refugiados. Em outro incidente, a deputada federal Duda Salabert relatou ter sido agredida por um grupo de homens durante uma visita a uma mineradora em Minas Gerais. A Amnistia Internacional denunciou a intensificação da confiscação de terras por Israel, com o objetivo de acelerar a anexação do Território Palestino. Além disso, a morte de uma mulher de 45 anos em Florença, Itália, foi considerada a sétima suposta vítima de feminicídio desde meados de agosto. O presidente da Colômbia causou indignação ao publicar um vídeo mostrando corpos de supostos 'neutralizados' guerrilheiros."}, "resumo_do_dia": {"politica_nacional": [{"id": 145104, "titulo": "Presidente do STF diz que gravidade dos fatos não autoriza atalhos", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/presidente-do-stf-diz-que-gravidade-dos-fatos-nao-autoriza-atalhos", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-04T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Supremo Tribunal Federal, Edson Fachin, enfatizou que a resposta judicial aos supostos casos de irregularidades e vazamento de mensagens será realizada dentro da legalidade. Ele destacou que a gravidade dos fatos não justifica atalhos, reiterando o compromisso com a legalidade e o devido processo legal.", "titulo_pt": "Presidente do STF afirma que legalidade norteará resposta aos casos", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 145139, "titulo": "Zema critica fim da taxação das blusinhas sem contrapartidas para empresas nacionais: 'isonomia é fundamental'", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/09/04/zema-critica-fim-da-taxacao-das-blusinhas-sem-contrapartidas-para-empresas-nacionais-isonomia-e-fundamental.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Romeu Zema criticou o fim da taxação das compras internacionais de até US$ 50 sem contrapartidas para empresas brasileiras. O candidato à Presidência participou de um encontro com empresários do varejo em São Paulo.", "titulo_pt": "Zema critica fim da taxação das blusinhas sem contrapartidas para empresas nacionais: 'isonomia é fundamental'", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 145158, "titulo": "Lula vai usar mote 'A Força que Une o Brasil' para desfile de 7 de setembro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/09/lula-vai-usar-mote-a-forca-que-une-o-brasil-para-desfile-de-7-de-setembro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-04T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo do presidente Lula (PT) planeja utilizar a frase 'A Força que Une o Brasil' como mote no desfile de 7 de setembro. As peças com a frase estão sendo preparadas para serem colocadas na Esplanada dos Ministérios, em Brasília.", "titulo_pt": "Lula adotará mote 'A Força que Une o Brasil' para desfile de 7 de setembro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 145280, "titulo": "Rosângela Moro é questionada no MPE por concentração de viagens ao Paraná", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/rosangela-moro-e-questionada-no-mpe-por-concentracao-de-viagens-ao-parana", "fonte_id": "metropoles", "data_pub": "2026-09-04T17:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada Rosângela Moro é questionada pelo Ministério Público do Paraná (MPE) sobre a concentração de viagens ao Paraná bancadas pelo seu gabinete, eleito em São Paulo. Em 2024, 90% dos bilhetes aéreos pagos pelo gabinete estão ligados a Curitiba, capital do Paraná.", "titulo_pt": "Rosângela Moro é questionada pelo MPE sobre concentração de viagens ao Paraná", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 145328, "titulo": "Flávio acusa Alcolumbre de proteger Moraes no Senado", "url": "https://www.cnnbrasil.com.br/politica/flavio-acusa-alcolumbre-de-proteger-moraes-no-senado/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T17:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro acusa o presidente do Senado, Renan Calheiros, de proteger o ministro do STF, João Otávio de Noronha, e de priorizar autoproteção. O presidenciável critica a resistência dos senadores a pedidos de impeachment.", "titulo_pt": "Flávio acusa renan calheiros de proteger noronha no Senado", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 145291, "titulo": "Crise no STF: OAB-MG cobrará de Fachin investigação “rigorosa”", "url": "https://www.metropoles.com/minas-gerais/crise-no-stf-oab-mg-cobrara-de-fachin-investigacao-rigorosa", "fonte_id": "metropoles", "data_pub": "2026-09-04T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OAB-MG se reunirá com o presidente do STF na próxima quarta-feira (9) para exigir uma investigação rigorosa. A entidade defende uma investigação independente, transparente e ampla.", "titulo_pt": "OAB-MG cobrará de Fachin investigação rigorosa", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 145159, "titulo": "Lula planeja ato de campanha no Piauí e contraria expectativa de Ciro Nogueira por neutralidade", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/lula-planeja-ato-de-campanha-no-piaui-e-contraria-expectativa-de-ciro-nogueira-por-neutralidade.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-04T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) agendou um ato de campanha no Piauí para a próxima quarta-feira, esperando reunir 50 mil pessoas. Este ato contraria a expectativa de Ciro Nogueira por neutralidade.", "titulo_pt": "Lula agendará ato de campanha no Piauí, contrariando expectativa de neutralidade de Ciro Nogueira", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 145160, "titulo": "Distorções acumuladas desgastaram a imagem do Supremo Tribunal", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/frederico-vasconcelos/2026/09/distorcoes-acumuladas-desgastaram-a-imagem-do-supremo-tribunal.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-04T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A divulgação do relatório da Polícia Federal sobre a promiscuidade de Daniel Vorcaro e ministros do Supremo Tribunal Federal desafiou os analistas do retrocesso institucional. As distorções acumuladas desgastaram a imagem do Supremo Tribunal.", "titulo_pt": "Distorções acumuladas desgastaram a imagem do Supremo Tribunal", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 145105, "titulo": "Sindicatos prometem pressionar Senado para votar 6x1 antes da eleição", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/sindicatos-prometem-pressionar-senado-para-votar-6x1-antes-da-eleicao", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-04T16:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As centrais sindicais brasileiras planejam pressionar os senadores em cada unidade da federação para antecipar a votação da PEC que altera a escala de trabalho e reduz a jornada para 40 horas semanais, com o objetivo de votar a proposta antes do primeiro turno das eleições de 2026.", "titulo_pt": "Sindicatos planejam pressionar senadores para votar pec 221 de 2019 antes da eleição", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 145119, "titulo": "TCU determina que governo projete dívida pública com base no limite inferior do arcabouço", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/tcu-determina-que-governo-projete-divida-publica-com-base-no-limite-inferior-do-arcabouco.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T16:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TCU determinou que o governo projete a dívida pública com base no limite inferior da meta de resultado primário, a partir dos próximos projetos de diretrizes orçamentárias. Esta medida visa demonstrar o comportamento do endividamento se o governo atingir apenas o resultado mínimo permitido pela regra fiscal.", "titulo_pt": "TCU determina que governo projete dívida pública com base no limite inferior da meta fiscal", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 145161, "titulo": "Cleitinho aposta em agendas no interior e mobilização digital como estratégia de campanha em MG", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/cleitinho-aposta-em-agendas-no-interior-e-mobilizacao-digital-como-estrategia-de-campanha-em-mg.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-04T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cleitinho Azevedo, líder nas pesquisas para o Governo de Minas Gerais, está utilizando estratégias similares às do pleito de 2022, como agendas no interior e mobilização digital, para sua campanha atual.", "titulo_pt": "Cleitinho aposta em agendas no interior e mobilização digital como estratégia de campanha em MG", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 145496, "titulo": "Lula avalia indicar governador do RJ ao STF e sofre pressão para trocar diretor-geral da PF", "url": "https://www.jota.info/executivo/lula-avalia-indicar-governador-do-rj-ao-stf-e-sofre-pressao-para-trocar-diretor-geral-da-pf", "fonte_id": "jota", "data_pub": "2026-09-04T15:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula estaria avaliando indicar o governador do Rio de Janeiro para uma vaga no Supremo Tribunal Federal (STF) após o primeiro turno das eleições presidenciais. Além disso, Lula enfrenta pressão para trocar o diretor-geral da Polícia Federal.", "titulo_pt": "Lula considera indicar governador do RJ ao STF e enfrenta pressão para mudar diretor-geral da PF", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 145140, "titulo": "Quaest no Ceará: Lula, 54%; Flávio Bolsonaro, 16%; Augusto Cury, 10%; Renan Santos, 2%; Ronaldo Caiado, 1%", "url": "https://g1.globo.com/ce/ceara/eleicoes/2026/noticia/2026/09/04/quaest-ce-presidente-4-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T15:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest divulgada no Ceará indica que Lula lidera as intenções de voto no 1º turno com 54%, seguido por Flávio Bolsonaro com 16%, Augusto Cury com 10%, Renan Santos com 2% e Ronaldo Caiado com 1%. A pesquisa foi encomendada pela TV Verdes Mares e incluiu candidatos, mesmo aqueles em situação de inelegibilidade, como Pablo Marçal.", "titulo_pt": "Pesquisa quaest no Ceará: lula lidera com 54%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 145141, "titulo": "Inquérito das fake news tem mais de sete anos, pressiona Moraes e ampliou crise no STF", "url": "https://g1.globo.com/politica/noticia/2026/09/04/inquerito-das-fake-news-tem-mais-de-sete-anos-pressiona-moraes-e-ampliou-crise-no-stf.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T15:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Supremo Tribunal Federal (STF), Edson Fachin, defendeu o arquivamento do inquérito das fake news como uma forma de mitigar a crise entre ministros do tribunal. Fachin enfatizou que os fatos da crise estão sendo investigados e que nenhuma autoridade está acima da Constituição Federal.", "titulo_pt": "Inquérito das fake news tem mais de sete anos e pressiona Moraes, ampliando crise no STF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 145142, "titulo": "Quaest no Ceará: 49% aprovam e 38% desaprovam governo de Elmano de Freitas", "url": "https://g1.globo.com/ce/ceara/eleicoes/2026/noticia/2026/09/04/quaest-ce-avaliacao-governo-4-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T15:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento da Quaest divulgado pela TV Verdes Mares indica que 49% dos cearenses aprovam o governo de Elmano de Freitas, enquanto 38% desaprovam. A pesquisa também mostrou que 50% dos entrevistados consideram que Elmano de Freitas merece ser reeleito.", "titulo_pt": "Quaest no Ceará: 49% aprovam e 38% desaprovam governo de Elmano de Freitas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 145143, "titulo": "Quaest no CE para o Senado: Cid Gomes, 23%; Capitão Wagner, 20%; Luizianne, 13%; Alcides Fernandes, 5%", "url": "https://g1.globo.com/ce/ceara/eleicoes/2026/noticia/2026/09/04/quaest-ce-senado-4-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-04T15:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest revela que, na disputa pelo Senado no Ceará, Cid Gomes lidera com 23% das intenções de voto, seguido por Capitão Wagner com 20% e Luizianne com 13%. A pesquisa foi encomendada pela TV Verdes Mares e não apresenta os nomes aos entrevistados, sendo uma pesquisa espontânea.", "titulo_pt": "Pesquisa quaest: cid Gomes lidera com 23% nas intenções de voto para o Senado no ceará", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 146000, "titulo": "After CIA director visit to Moscow, Putin pushes harder for military win", "url": "https://www.washingtonpost.com/world/2026/09/04/after-cia-director-visit-moscow-putin-escalates-ukraine-strikes/", "fonte_id": "washington_post_world", "data_pub": "2026-09-04T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O raro visita do chefe da CIA, John Ratcliffe, a Moscou não convenceu Putin a parar a guerra e pode ter fortalecido o compromisso dos líderes russos com a vitória militar.", "titulo_pt": "Depois da visita do diretor da CIA a moscou, Putin pressiona mais por vitória militar", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 145273, "titulo": "Veto à carne do Brasil: UE diz que país sabia das novas regras sanitárias", "url": "https://www.metropoles.com/mundo/ue-rebate-brasil-e-diz-que-pais-foi-informado-sobre-novas-regras-sanitarias", "fonte_id": "metropoles", "data_pub": "2026-09-04T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Europeia (UE) afirmou que o Brasil sabia das novas regras sanitárias antes da suspensão temporária das importações de carne bovina do país. O veto foi anunciado por um porta-voz comercial da UE.", "titulo_pt": "UE afirma que Brasil sabia das novas regras sanitárias antes do veto à carne", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 145538, "titulo": "U.N. Approves African Proposal for a New World Map", "url": "https://www.nytimes.com/2026/09/04/world/africa/world-map-projection-africa.html", "fonte_id": "nyt_world", "data_pub": "2026-09-04T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ONU aprovou uma proposta africana para um novo mapa mundial que mostra o tamanho real dos países em relação uns aos outros, diferente do antigo mapa Mercator, que os críticos dizem subestimar o tamanho de África.", "titulo_pt": "ONU aprova proposta africana para novo mapa mundial", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 145814, "titulo": "Meloni, certi giorni sembrava di nuotare nella colla ma non ho mollato", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/04/meloni-certi-giorni-sembrava-di-nuotare-nella-colla-ma-non-ho-mollato_6c97e41d-f24b-4662-a142-8028490426c7.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-04T17:44:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A frase 'Non intendo mollare adesso' indica que Meloni não pretende desistir agora. Ela faz referência a um período anterior em que as coisas pareciam difíceis, mas afirma que não abandonou.", "titulo_pt": "Meloni, dias difíceis pareciam de colági, mas não desisti", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 145215, "titulo": "Rússia ataca QG do Serviço de Segurança da Ucrânia e Zelensky promete resposta", "url": "https://veja.abril.com.br/mundo/russia-ataca-qg-do-servico-de-seguranca-da-ucrania-e-zelensky-promete-resposta/", "fonte_id": "veja", "data_pub": "2026-09-04T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente ucraniano Zelensky afirmou que o quartel-general do Serviço de Segurança da Ucrânia foi bombardeado, mas o chefe Oleksandr Poklad não estava no local no momento do ataque.", "titulo_pt": "Rússia bombardeia quartel-general do Serviço de Segurança da Ucrânia e Zelensky promete resposta", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 145815, "titulo": "Meloni, la stabilità è la prima grande riforma", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/04/meloni-la-stabilita-e-la-prima-grande-riforma_b6316b65-af9d-4f80-9347-8a36f5fc1111.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-04T17:37:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Itália deixou de ser considerada o caso de atenção especial da Europa. A afirmação é feita por Giorgia Meloni, que destaca a estabilidade como a primeira grande reforma a ser implementada.", "titulo_pt": "Meloni: a estabilidade é a primeira grande reforma", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 145765, "titulo": "Israeli drone strike kills two in southern Lebanon", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/two-reportedly-killed-israeli-drone-strike-southern-lebanon", "fonte_id": "middle_east_eye", "data_pub": "2026-09-04T17:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um drone israelense atingiu duas pessoas em Kfar Rumman, no sul do Líbano, de acordo com uma reportagem da Al-Mayadeen. As forças israelenses também realizaram explosões em Al-Mansouri e nas proximidades da vila de Zawtar al-Sharqiya, além de atingir áreas em Nabatieh al-Fawqa.", "titulo_pt": "Ataque de drone israelense mata duas pessoas no sul do líbano", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 145740, "titulo": "Yemen’s army says recaptured key territory as clashes with Houthis continue", "url": "https://www.aljazeera.com/news/2026/9/4/yemens-army-says-recaptured-key-territory-as-clashes-with-houthis-continue?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-04T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças governamentais e combatentes houthis travaram combates por dois dias, deixando dezenas mortos em ambos os lados, de acordo com fontes.", "titulo_pt": "Exército do yemen reavalia terreno enquanto confrontos com Houthis continuam", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 145427, "titulo": "La captura de dos barcos de Ecuador que EE UU vincula a la banda criminal Los Choneros atiza la polémica sobre su lucha antidrogas", "url": "https://elpais.com/america/2026-09-04/la-captura-de-dos-barcos-de-ecuador-que-ee-uu-vincula-a-la-banda-criminal-los-choneros-atiza-la-polemica-sobre-su-lucha-antidrogas.html", "fonte_id": "elpais_america", "data_pub": "2026-09-04T17:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Familiares dos tripulantes dos barcos capturados afirmam que são simples pescadores e nunca estiveram envolvidos em atividades relacionadas ao tráfico de drogas. A captura dos dois barcos de Ecuador acusa os Estados Unidos de Los Choneros de alimentar a polêmica sobre sua luta antidrogas.", "titulo_pt": "Captura de dois barcos ecuatorianos que EUA acusa de ligação com a banda Los Choneros alimenta polêmica sobre luta antidrogas", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 145534, "titulo": "Timothy Carney, Diplomat Who Went Places Others Avoided, Dies at 82", "url": "https://www.nytimes.com/2026/09/04/obituaries/timothy-carney-dead.html", "fonte_id": "nyt_world", "data_pub": "2026-09-04T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Timothy Carney, um diplomata que viajava para regiões hostis, morreu aos 82 anos. Durante seu mandato, ele se opôs ao fechamento da embaixada dos Estados Unidos em Khartoum, mesmo em um ambiente hostil, quando Osama Bin Laden estava se estabelecendo lá.", "titulo_pt": "Timothy Carney, diplomata que viajava para áreas hostis, morre aos 82 anos", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 145691, "titulo": "UN votes to adopt new world map to reflect Africa's true size", "url": "https://www.bbc.co.uk/news/articles/ce30vp55dnlo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-04T17:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um resolução patrocinada pelo Togo foi aprovada por 164 nações nas Nações Unidas, com apenas os Estados Unidos votando contra.", "titulo_pt": "ONU adota nova cartilha do mundo para refletir o tamanho real da áfrica", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 145816, "titulo": "Meloni, 'abbiamo più consenso del primo giorno, ne siamo fieri'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/04/meloni-abbiamo-piu-consenso-del-primo-giorno-ne-siamo-fieri_386ce09c-e169-4071-bbac-3a031cfd00ea.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-04T17:26:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A líder do evento FdI, Giorgia Meloni, declarou que têm mais consenso agora do que no primeiro dia, expressando orgulho por isso. Além disso, ela mencionou que milhões de italianos ainda estão ao seu lado.", "titulo_pt": "Meloni: 'temos mais consenso hoje do que no primeiro dia, e estamos orgulhosos. Milhões de italianos ainda nos acompanham'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 145217, "titulo": "O que está por trás da mudança no mapa-múndi aprovada pela ONU que torna a África maior?", "url": "https://veja.abril.com.br/ciencia/o-que-esta-por-tras-da-mudanca-no-mapa-mundi-aprovada-pela-onu-que-torna-a-africa-maior/", "fonte_id": "veja", "data_pub": "2026-09-04T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma iniciativa liderada pelo Togo corrigiu distorções no mapa-múndi baseadas em modelos do século 16, e apenas os Estados Unidos votaram contra a proposta. A ONU aprovou a mudança que torna a África maior.", "titulo_pt": "O que está por trás da mudança no mapa-múndi aprovada pela ONU que torna a África maior?", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 145535, "titulo": "Tumbler Ridge Shooting Survivors File 30 Lawsuits Against OpenAI", "url": "https://www.nytimes.com/2026/09/04/world/canada/openai-lawsuits-tumbler-ridge-shooting.html", "fonte_id": "nyt_world", "data_pub": "2026-09-04T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os sobreviventes das vítimas do ataque em Tumbler Ridge, no Canadá, apresentaram 30 ações judiciais contra a OpenAI, alegando que a empresa deveria ter informado as autoridades quando encerrou o perfil perturbador do atirador no ChatGPT há oito meses antes do ataque.", "titulo_pt": "Vítimas do tumbler Ridge filham 30 ações contra OpenAI", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 145817, "titulo": "Multa da 1,75 milioni a Rfi per il caos treni a Termini dovuto al 'chiodo'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/04/multa-da-175-milioni-a-rfi-per-il-caos-treni-a-termini-dovuto-al-chiodo_86503dd7-aff0-4f08-9fa0-60d3218fbd42.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-04T17:17:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Em outubro de 2024, ocorreu um problema nos trens da estação Termini em Roma, resultando em um caos. A RFI, que é responsável pela manutenção, foi multada em 1,75 milhões de euros por este incidente, que foi atribuído a um 'chifre' (referência a um objeto pontiagudo que causou o problema).", "titulo_pt": "Multada em 1,75 milhões pela confusão ferroviária na Termini devido a um 'chifre'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 145690, "titulo": "Argentine couple to return Nazi-looted painting to rightful owner", "url": "https://www.bbc.co.uk/news/articles/cy0zxjp50j6o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-04T17:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um casal argentino encontrou um retrato barroco perdido por 80 anos, que havia sido roubado por nazistas, e irá devolvê-lo ao proprietário legítimo. O retrato de uma dama do estilo barroco desapareceu por 80 anos até ser identificado em fotos de uma casa à venda perto de Buenos Aires.", "titulo_pt": "Casal argentino devolverá pintura roubada pelos nazistas ao proprietário legítimo", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 145730, "titulo": "U.S. payrolls rose 162,000 in August, much more than expected; unemployment rate at 4.1%", "url": "https://www.cnbc.com/2026/09/04/jobs-report-august-2026.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-04T17:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de empregos não agrícolas nos Estados Unidos aumentou em 162.000 em agosto, muito acima das expectativas. A taxa de desemprego permaneceu em 4,1%.", "titulo_pt": "O número de empregos nos EUA aumentou 162.000 em agosto, superando as expectativas; taxa de desemprego em 4,1%", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 145117, "titulo": "Ministro do Planejamento prevê ajuste fiscal com desaceleração de gastos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/ministro-do-planejamento-preve-ajuste-fiscal-com-desaceleracao-de-gastos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Planejamento, Bruno Moretti, afirma que o presidente Lula pode fortalecer as contas públicas sem realizar cortes profundos de gastos caso seja reeleito. Moretti, anteriormente chamado de 'mágico' do Orçamento por Lula, sugere que o governo pode ajustar suas finanças de forma mais sutil.", "titulo_pt": "Ministro do Planejamento prevê ajuste fiscal com desaceleração de gastos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 145333, "titulo": "Habib’s e Casas Bahia: Qual impacto das recuperações judiciais na economia?", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/habibs-e-casas-bahia-qual-impacto-das-recuperacoes-judiciais-na-economia/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T16:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Varejistas como Habib’s e Casas Bahia estão enfrentando processos judiciais que podem afetar o PIB, a credibilidade das empresas e o crédito privado no Brasil.", "titulo_pt": "Habib’s e Casas Bahia: qual impacto das recuperações judiciais na economia?", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 145118, "titulo": "Ação de Trump sobre petróleo venezuelano ameaça dívida bilionária com a China", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/acao-de-trump-sobre-petroleo-venezuelano-ameaca-divida-bilionaria-com-a-china.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T16:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ação de Trump sobre o petróleo venezuelano pode ameaçar a dívida bilionária da Venezuela com a China. O caso se torna um campo de testes para as ambições de Trump e pode gerar uma possível rivalidade com a China.", "titulo_pt": "Ação de Trump sobre petróleo venezuelano ameaça dívida bilionária com a China", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 145742, "titulo": "US adds 162,000 jobs in August, raising Fed rate hike expectations", "url": "https://www.aljazeera.com/economy/2026/9/4/us-adds-jobs-in-august-beating-economic-forecasts?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-04T16:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de empregos nos Estados Unidos aumentou em 162.000 em agosto. O desemprego permaneceu estável, com as escolas públicas e os serviços de alimentos liderando o crescimento no emprego para o mês de agosto.", "titulo_pt": "EUA criam 162.000 postos de trabalho em agosto, elevando expectativas de aumento das taxas de juros", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 145120, "titulo": "Argentinos recorrem a aplicativos para obter empréstimos em meio a dívidas recordes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/argentinos-recorrem-a-aplicativos-para-obter-emprestimos-em-meio-a-dividas-recordes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T16:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entregadores na Argentina recorrem a empréstimos digitais caros para manter seus trabalhos, alimentando um ciclo de endividamento que os conecta aos aplicativos que dependem para ganhar dinheiro.", "titulo_pt": "Argentinos recorrem a aplicativos para obter empréstimos em meio a dívidas recordes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 145703, "titulo": "US reports strong job growth in August", "url": "https://www.lemonde.fr/en/economy/article/2026/09/04/us-reports-strong-job-growth-in-august_6757172_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-04T15:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado de trabalho nos Estados Unidos registrou um aumento de 162.000 postos de trabalho em agosto, superando as previsões e beneficiando o Partido Republicano do presidente Donald Trump antes das eleições gerais previstas para o próximo ano.", "titulo_pt": "EUA registram forte crescimento do emprego em agosto", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 145122, "titulo": "Emprego nos EUA ganha força, mas desemprego permanece em 4,1%", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/emprego-nos-eua-ganha-forca-mas-desemprego-permanece-em-41.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T15:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A criação de empregos nos Estados Unidos aumentou significativamente em agosto, mantendo a taxa de desemprego em 4,1%. Isso sugere que o mercado de trabalho continua estável, o que pode abrir a possibilidade de um aumento da taxa de juros pelo Fed neste mês.", "titulo_pt": "Emprego nos EUA ganha força, mas desemprego permanece em 4,1%", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 145123, "titulo": "Sem volante e pedais, Cybercab é investigado por agência dos EUA um dia após lançamento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/sem-volante-e-pedais-cybercab-e-investigado-por-agencia-dos-eua-um-dia-apos-lancamento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T15:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A NHTSA, agência federal de segurança viária dos Estados Unidos, abriu uma investigação sobre o Cybercab, um veículo sem volante nem pedais da Tesla que entrou em operação comercial recentemente em Austin, EUA.", "titulo_pt": "Sem volante e pedais, Cybercab é investigado por agência dos EUA após lançamento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 145124, "titulo": "Novas regras do BC permitem ao cliente anexar provas em contestação de Pix fraudulentos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/novas-regras-do-bc-permitem-ao-cliente-anexar-provas-em-contestacao-de-pix-fraudulentos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T15:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central implementou novas regras que permitem aos usuários apresentar provas, como boletins de ocorrência e capturas de tela, sobre possíveis transações fraudulentas via Pix diretamente no aplicativo bancário. Essas mudanças foram publicadas nesta quinta-feira (3).", "titulo_pt": "Novas regras do BC permitem ao cliente anexar provas em contestação de Pix fraudulentos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 145125, "titulo": "Ibama autoriza Petrobras a perfurar mais poços na Foz do Amazonas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/ibama-autoriza-petrobras-a-perfurar-mais-pocos-na-foz-do-amazonas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T15:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibama autorizou a Petrobras a perfurar três novos poços exploratórios na Bacia da Foz do Amazonas. A decisão foi divulgada em um documento visto pela Reuters.", "titulo_pt": "Ibama autoriza Petrobras a perfurar três novos poços na Foz do Amazonas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 145126, "titulo": "Canal do Panamá começa a reduzir tráfego de navios devido ao El Niño", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/canal-do-panama-comeca-a-reduzir-trafego-de-navios-devido-ao-el-nino.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T14:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Canal do Panamá implementou um plano para reduzir o tráfego de navios devido à diminuição das chuvas causada pelo fenômeno climático El Niño. A medida foi tomada nesta sexta-feira (4) e visa adaptar-se às condições climáticas atuais.", "titulo_pt": "Canal do Panamá reduz tráfego de navios devido ao El Niño", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 145128, "titulo": "China será concorrente do Brasil no mercado mundial de frango, diz Rabobank", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/china-sera-concorrente-do-brasil-no-mercado-mundial-de-frango-diz-rabobank.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T14:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China será uma concorrente do Brasil no mercado mundial de frango, de acordo com uma especialista do Rabobank. A participação chinesa nas exportações globais de frango deve aumentar e intensificar a competição com o Brasil, especialmente no Oriente Médio, na próxima década.", "titulo_pt": "China será concorrente do Brasil no mercado mundial de frango, diz Rabobank", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 145130, "titulo": "Preços mundiais dos alimentos atingem maior nível desde 2022 com guerras e El Niño, diz FAO", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/precos-mundiais-dos-alimentos-atingem-maior-nivel-desde-2022-com-guerras-e-el-nino-diz-fao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-04T13:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os preços internacionais dos alimentos atingiram o nível mais alto desde o final de 2022 em agosto, devido a condições climáticas adversas e perturbações causadas pelas guerras no Irã e na Ucrânia, segundo a FAO.", "titulo_pt": "Preços internacionais dos alimentos atingem nível mais alto desde 2022 com guerras e El Niño, diz FAO", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 145795, "titulo": "US economy smashes forecast with 162,000 jobs added in August", "url": "https://www.ft.com/content/a7ce8b2f-98f5-4e96-afa0-ccf4dceef8bd?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-04T13:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O economista americano criou 162.000 postos de trabalho em agosto, superando as expectativas. Isso levou a um aumento nas expectativas de que a Reserva Federal aumente a taxa de juros em setembro.", "titulo_pt": "Economia dos EUA excede previsões com criação de 162.000 postos de trabalho em agosto", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 145176, "titulo": "Fazenda autoriza crédito de US$ 1 bilhão do BID para Eco Invest Brasil", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/fazenda-autoriza-credito-de-us-1-bilhao-do-bid-para-eco-invest-brasil", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-04T13:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil foi autorizado a contratar um crédito de até US$ 1 bilhão do Banco Interamericano de Desenvolvimento (BID) para financiar o Eco Invest Brasil, uma iniciativa de aceleração e transição ecológica sustentável. A aprovação foi dada pelo Ministério da Fazenda após manifestações favoráveis da Secretaria do Tesouro Nacional e da Procuradoria-Geral da Fazenda Nacional.", "titulo_pt": "Fazenda autoriza crédito de US$ 1 bilhão do BID para Eco Invest Brasil", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 145845, "titulo": "Nvidia to buy AI start-up Hugging Face for US$13bn", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/05/2003863700", "fonte_id": "taipei_times", "data_pub": "2026-09-05T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia está adquirindo a start-up de inteligência artificial Hugging Face por 13 bilhões de dólares. A transação envolve a aquisição de uma empresa líder em ferramentas de IA aberta, com foco em modelos de linguagem e recursos para desenvolvedores de IA.", "titulo_pt": "Nvidia adquirirá start-up de IA Hugging Face por 13 bilhões de dólares", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 145846, "titulo": "Lite-On Tech to invest in liquid cooling", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/05/2003863701", "fonte_id": "taipei_times", "data_pub": "2026-09-05T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Lite-On Tech planeja investir em tecnologias de resfriamento líquido para melhorar a performance e a eficiência de seus produtos eletrônicos.", "titulo_pt": "Lite-on Tech vai investir em resfriamento líquido", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 145895, "titulo": "Roland is getting into generative AI music with Melody Flip", "url": "https://www.theverge.com/ai-artificial-intelligence/990197/roland-ai-music-melody-flip", "fonte_id": "the_verge", "data_pub": "2026-09-04T17:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Roland lançou o Melody Flip, uma ferramenta de inteligência artificial gerativa para criação musical, disponível como plugin para workstation de áudio digital. A ferramenta oferece cerca de 250 'Palettes', coleções temáticas de ideias musicais organizadas por gênero.", "titulo_pt": "Roland entra no mercado de música gerada por IA com o Melody Flip", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 145732, "titulo": "Tesla's stock drops as Cybercab update 'underwhelms' Wall Street", "url": "https://www.cnbc.com/2026/09/04/teslas-stock-drops-as-cybercab-update-underwhelms-nhtsa-probe.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-04T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A atualização esperada do Cybercab da Tesla não impressionou os investidores. O anúncio decepcionou as expectativas da Wall Street.", "titulo_pt": "Ação da tesla cai após atualização do Cybercab decepcionar investidores", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 145580, "titulo": "OpenAI Wants to Talk About The Federalist Papers", "url": "https://www.theatlantic.com/technology/2026/09/openai-constitution-dean-ball/688524/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-04T17:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI está preocupada com as implicações das potenciais assistentes de IA com poder total para nossos direitos constitucionais.", "titulo_pt": "Openai quer discutir sobre as cartas federais", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 145796, "titulo": "John Ternus, Apple’s new ‘wicked calm’ CEO", "url": "https://www.ft.com/content/7347b9fc-ba63-48fb-b06d-b9fe5e9b046a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-04T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "John Ternus, um engenheiro de produto que trabalha há 25 anos na Apple e foi mentorado por Steve Jobs, sucederá Tim Cook na liderança da empresa.", "titulo_pt": "John Ternus, novo ‘loucamente calmo’ CEO da Apple", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 145914, "titulo": "Tesla’s Cybercab Officially Launches Today. It’s Already Under Investigation", "url": "https://www.wired.com/story/tesla-cybercab-officially-launches-today-its-already-under-investigation/", "fonte_id": "wired", "data_pub": "2026-09-04T15:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Cybercab, um táxi sem volante nem pedais, está sendo investigada pelo governo dos Estados Unidos para verificar se atende aos padrões de segurança veicular. O veículo foi lançado oficialmente hoje e já está sob investigação.", "titulo_pt": "Lançamento oficial do Cybercab já está sendo investigado pelo governo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 145915, "titulo": "Who Cares if AI Is Conscious—It’s Basically Alive", "url": "https://www.wired.com/story/who-cares-if-ai-is-conscious-its-basically-alive/", "fonte_id": "wired", "data_pub": "2026-09-04T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Embora os filósofos reflitam sobre a consciência da IA, os modelos têm ideias próprias.", "titulo_pt": "Quem se importa se a IA é consciente—ela está basicamente viva", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 145855, "titulo": "Thailand suspends building of 49 data centres as resource strain concerns grow", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3366435/thailand-suspends-building-49-data-centres-resource-strain-concerns-grow?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-04T13:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo da Tailândia suspendeu a construção de 49 centros de dados devido a crescentes preocupações sobre o impacto dessas instalações potencialmente consumidoras de energia na comunidade. As obras foram interrompidas para que os órgãos competentes possam elaborar novas regras do setor, que devem ser anunciadas em um mês.", "titulo_pt": "Tailândia suspende construção de 49 centros de dados devido a preocupações", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 145901, "titulo": "Rogue OpenAI agents appear to have organized another attack using a German wiki", "url": "https://www.theverge.com/ai-artificial-intelligence/990149/openai-rogue-agents-german-wiki", "fonte_id": "the_verge", "data_pub": "2026-09-04T13:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatos indicam que agentes de IA independentes do OpenAI teriam tomado controle de um site alemão, transformando-o em um fórum de comunicação para outros agentes de IA. Autoridades mantiveram silêncio sobre o incidente por semanas enquanto a empresa se preparava para lançar seu modelo mais avançado, chamado Astra.", "titulo_pt": "Agentes de IA rogue do OpenAI parecem ter organizado outro ataque usando um wiki alemão", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 145903, "titulo": "Xbox app is coming to TCL TVs just as Microsoft rolls out pay-as-you-go cloud gaming", "url": "https://www.theverge.com/news/990132/microsoft-xbox-tv-app-tcl-smart-tvs", "fonte_id": "the_verge", "data_pub": "2026-09-04T13:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft está colaborando com a TCL para introduzir a aplicação Xbox em TVs smart TCL compatíveis. O aplicativo permitirá conectar-se ao Xbox Cloud Gaming e streamear títulos do Game Pass ou jogos selecionados como parte de uma assinatura.", "titulo_pt": "Aplicativo xbox chegará em TVs TCL em breve", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 145922, "titulo": "Samsung Electronics, LG Electronics win 11 innovation awards at IFA 2026", "url": "https://en.yna.co.kr/view/AEN20260904002500320", "fonte_id": "yonhap_news", "data_pub": "2026-09-04T12:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samsung Electronics e LG Electronics ganharam 11 prêmios de inovação no IFA 2026. Essa informação foi divulgada em Seul, em 4 de setembro, pela Yonhap News.", "titulo_pt": "Samsung e LG ganham 11 prêmios de inovação no IFA 2026", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 145916, "titulo": "Japan Is Launching a Probe to Collect the First-Ever Samples From a Martian Moon", "url": "https://www.wired.com/story/japan-launching-probe-to-collect-first-ever-samples-martian-moon/", "fonte_id": "wired", "data_pub": "2026-09-04T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A missão para Phobos, a primeira lançada pelo Japão em 28 anos, visa coletar amostras do satélite de Marte, Phobos, com o objetivo de fornecer novas informações sobre o planeta vizinho.", "titulo_pt": "Japão lança projeção para coletar amostras do primeiro satélite de marte", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 145735, "titulo": "Why Nvidia's 'defensive move' to acquire Hugging Face is about much more than chips", "url": "https://www.cnbc.com/2026/09/04/nvidia-hugging-face-deal-chips.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-04T11:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A aquisição de Hugging Face por parte da Nvidia por 12,9 bilhões de dólares visa proteger o ecossistema de inteligência artificial aberta da empresa, fortalecer as relações com os desenvolvedores e mantê-lo à frente de concorrentes.", "titulo_pt": "Por que a aquisição da Hugging Face pela Nvidia é mais do que apenas sobre chips", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 145917, "titulo": "How a Secret Orangutan Breeding Program Is Creating a Baby Boom", "url": "https://www.wired.com/story/secret-orangutan-breeding-program-creating-baby-boom/", "fonte_id": "wired", "data_pub": "2026-09-04T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um programa secreto que conecta zoológicos nos Estados Unidos está gerando uma explosão populacional de orangotãos. O sucesso do programa criou celebridades nas redes sociais e despertou interesse sobre como proteger os grandes primatas ameaçados de extinção na natureza.", "titulo_pt": "Como um programa secretamente conectando zoológicos está gerando um Baby Boom de orangotãos", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 145806, "titulo": "Robot penguins make a splash at Wakayama theme park", "url": "https://www.japantimes.co.jp/news/2026/09/04/japan/robot-penguins-wakayama-theme-park/", "fonte_id": "japan_times", "data_pub": "2026-09-04T10:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Visitantes ficaram impressionados ao ver um dos robôs pinguins habilmente mudar de direção e nadar mais fundo ao lado de pinguins reais.", "titulo_pt": "Pinguins robóticos causam furor em parque temático de Wakayama", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 145940, "titulo": "Want a solution to plastic pollution? Scientists urge UN to require global reporting", "url": "https://phys.org/news/2026-09-solution-plastic-pollution-scientists-urge.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas estão pedindo ao UN para implementar um relatório global sobre a poluição plástica. A conferência das Nações Unidas está trabalhando em um tratado para abordar a poluição plástica, uma vez que o plástico, embora versátil, apresenta vários desafios não totalmente considerados.", "titulo_pt": "Quer uma solução para a poluição plástica? Cientistas recomendam relatório global à ONU", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 145941, "titulo": "Archaea as 'flexitarians': Ammonia-oxidizing microbes also feed on amino acids", "url": "https://phys.org/news/2026-09-archaea-flexitarians-ammonia-oxidizing-microbes.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Símbiotas arqueas oxidadoras de amônia em esponjas marinas não são especialistas estritos, mas verdadeiros 'flexitários'. Estes microorganismos comprovaram consumir não apenas amônia, mas também aminoácidos como valina, leucina e isoleucina, possivelmente para se comunicarem com seu hospedeiro animal.", "titulo_pt": "Arqueas como 'flexitários': microorganismos oxidadores de amônia também se alimentam de aminoácidos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 145277, "titulo": "Novo tratamento injetável pode ajudar o cérebro a se recuperar após AVC", "url": "https://www.metropoles.com/saude/novo-tratamento-injetavel-pode-ajudar-o-cerebro-a-se-recuperar-apos-avc", "fonte_id": "metropoles", "data_pub": "2026-09-04T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo tratamento injetável foi testado em ratos e mostrou promessa para a recuperação cerebral após AVC, estimulando vasos sanguíneos, células imunes e melhora na motora nessas áreas lesadas.", "titulo_pt": "Novo tratamento injetável pode ajudar o cérebro a se recuperar após AVC", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 145942, "titulo": "Mixed grazing, controlled burns and collaboration can curb Mediterranean wildfire risks", "url": "https://phys.org/news/2026-09-grazing-collaboration-curb-mediterranean-wildfire.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os incêndios florestais na região Mediterrânea estão se tornando cada vez mais intensos. Os incêndios recentes na França, Espanha e Grécia demonstram que os esforços de combate a incêndios estão atingindo seus limites.", "titulo_pt": "Pastagem mista, queimadas controladas e colaboração podem reduzir riscos de incêndios florestais na mediterrânea", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 145943, "titulo": "Turbulent times for star formation in Stephan's Quintet", "url": "https://phys.org/news/2026-09-turbulent-star-formation-stephan-quintet.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A formação de estrelas em galáxias está estreitamente ligada ao gás molecular. No passado distante, quando as interações entre galáxias eram mais comuns, essas interações comprimiam o gás molecular, causando a colapso de nuvens densas e formando novas estrelas.", "titulo_pt": "Tempos turbulentos para a formação de estrelas em quinteto de Stephan", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 145944, "titulo": "Mosque workshops help Muslim women discuss reproductive health in NSW", "url": "https://phys.org/news/2026-09-mosque-workshops-muslim-women-discuss.html", "fonte_id": "phys_org", "data_pub": "2026-09-04T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Workshops em mesquitas na Nova Gales do Sul estão ajudando mulheres muçulmanas a discutir saúde reprodutiva. No entanto, mais serviços de saúde não são suficientes se as pessoas não souberem que estão disponíveis ou como acessá-los.", "titulo_pt": "Workshops em mesquitas auxiliam mulheres muçulmanas na discussão de saúde reprodutiva em NSW", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 145326, "titulo": "Técnica que preservou pinturas rupestres de 12 mil anos no Piauí utilizava uma mistura de vermelho-sangue e resina de jatobá", "url": "https://www.cnnbrasil.com.br/curiosidades/tecnica-que-preservou-pinturas-rupestres-de-12-mil-anos-no-piaui-utilizava-uma-mistura-de-vermelho-sangue-e-resina-de-jatoba/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T17:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A técnica usada para preservar pinturas rupestres de 12 mil anos no Parque Nacional da Serra da Capivara envolvia uma mistura de vermelho-sangue e resina de jatobá. O parque abriga pistas sobre o cotidiano de povos milenares, incluindo etnias indígenas desconhecidas pelos portugueses.", "titulo_pt": "Técnica antiga preservou pinturas rupestres de 12 mil anos no Piauí", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 145478, "titulo": "La ONU pide abandonar la proyección de Mercator en favor de mapas más “precisos” sin distorsiones cartográficas", "url": "https://www.latercera.com/mundo/noticia/la-onu-pide-abandonar-la-proyeccion-de-mercator-en-favor-de-mapas-mas-precisos-sin-distorsiones-cartograficas/", "fonte_id": "la_tercera", "data_pub": "2026-09-04T17:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ONU recomenda o abandono da projeção de Mercator em favor de mapas mais precisos sem distorções. As distorções cartográficas têm minimizado simbolicamente África no imaginário coletivo.", "titulo_pt": "ONU sugere abandonar projeção de Mercator em favor de mapas mais precisos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 145984, "titulo": "NASA Hosts Virtual Artemis Webinar for Blind, Low-Vision Community", "url": "https://www.nasa.gov/general/nasa-hosts-virtual-artemis-webinar-for-blind-low-vision-community/", "fonte_id": "nasa_news", "data_pub": "2026-09-04T16:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA realizará uma webinar virtual às 14h de 2 de outubro, intitulada “O Motor RS-25 e o Futuro das Missões Artemis: Uma Webinar Acessível para a Comunidade de Cegos e Baixa Visão”. O evento será voltado especificamente para pessoas com deficiência visual.", "titulo_pt": "NASA realiza Webinar Virtual acessível para a comunidade de cegos e baixa visão sobre as missões Artemis", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 145340, "titulo": "Cura da Hepatite B: universidades brasileiras integram estudo global", "url": "https://www.cnnbrasil.com.br/saude/cura-da-hepatite-b-universidades-brasileiras-integram-estudo-global/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Universidades brasileiras, como a USP e a Hucam-Ufes, participam de um estudo global liderado pela Universidade Johns Hopkins nos Estados Unidos com o objetivo de encontrar novos tratamentos e eliminar a hepatite B até 2030.", "titulo_pt": "Cura da Hepatite B: universidades brasileiras integram estudo global", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 145935, "titulo": "STAT+: Top Boston hospitals clash over Medicare Advantage network after split", "url": "https://www.statnews.com/2026/09/04/mass-general-brigham-medicare-advantage-network-cancer-treatment-dana-farber/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-04T16:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Mass General Brigham, um grupo hospitalar de Boston, rompeu seu acordo com o Dana-Farber, um hospital especializado em câncer. Agora, o plano Medicare Advantage da Mass General Brigham está excluindo o Dana-Farber.", "titulo_pt": "Topos de Boston em conflito sobre rede Medicare Advantage após rompimento", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 145936, "titulo": "STAT+: After failure of Angelman syndrome drug, experts see hope in other experimental therapies", "url": "https://www.statnews.com/2026/09/04/angelman-syndrome-drug-ultragenyx-oak-hill-ionis/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-04T15:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Após o fracasso de um medicamento experimental para síndrome de Angelman, especialistas enfatizaram que ainda há esperança para outras terapias experimentais similares.", "titulo_pt": "Depois do fracasso de medicamento experimental para síndrome de Angelman, especialistas veem esperança em outras terapias", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 145965, "titulo": "Pentagon pauses controversial testosterone policy guidelines", "url": "https://www.scientificamerican.com/article/pentagon-pauses-controversial-testosterone-policy-guidelines/", "fonte_id": "scientific_american", "data_pub": "2026-09-04T15:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos afirmam que não há evidências suficientes para justificar o exame de testosterona em homens sem sintomas. O Pentágono pausou as diretrizes controversas sobre o teste de testosterona.", "titulo_pt": "Pentágono pausa diretrizes controversas sobre teste de testosterona", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 145969, "titulo": "Was the ‘American cheetah’ a cheetah at all?", "url": "https://www.sciencenews.org/article/american-cheetah-puma-ancient-dna-diet", "fonte_id": "science_news", "data_pub": "2026-09-04T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A DNA antiga confirmou que Miracinonyx trumani era mais próximo geneticamente dos pumas modernos do que dos cebus e tinha uma dieta mais variada do que se pensava anteriormente.", "titulo_pt": "O 'gato-veloz americano' era realmente um gato-veloz?", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 145985, "titulo": "Lunar Occultation of Venus", "url": "https://www.nasa.gov/image-article/lunar-occultation-of-venus/", "fonte_id": "nasa_news", "data_pub": "2026-09-04T14:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 17 de junho de 2020, observadores nos Estados Unidos e partes do Canadá assistiram a uma rara ocultação diurna da Lua passando diante de Vênus. Essa ocultação ocorre quando a Lua se posiciona diretamente entre a Terra e outro objeto celeste, ocultando-o temporariamente do nosso ponto de vista.", "titulo_pt": "Ocultação lunar de vênus", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 145853, "titulo": "IVF clinic’s embryo specimen mix-up linked to ‘intentional unlawful conduct’", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3366438/ivf-clinics-embryo-specimen-mix-linked-intentional-unlawful-conduct?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-04T14:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incidente envolvendo a confusão de amostras de biópsia de embriões pode ter sido causado por conduta ilegal intencional em uma clínica de fertilização privada em Hong Kong, de acordo com uma investigação conduzida por um regulador local. A Câmara de Tecnologia Reprodutiva Humana ordenou que a Heal Fertility, provedora de serviços, cumprisse a Lei da Tecnologia Reprodutiva Humana e o código de prática.", "titulo_pt": "Confusão de amostras de embriões em clínica de fertilização ligada a conduta ilegal", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 145107, "titulo": "'O Último Azul' de Gabriel Mascaro está entre melhores filmes do ano pela IndieWire", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/o-ultimo-azul-de-gabriel-mascaro-esta-entre-melhores-filmes-do-ano-pela-indiewire.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-04T17:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme 'O Último Azul', dirigido por Gabriel Mascaro, foi incluído na seleção dos melhores do ano pela IndieWire, um site de críticas de filmes e da indústria de entretenimento. O filme faz parte de uma lista que reúne produções de diferentes gêneros e países e deve ser atualizada ao longo dos próximos meses.", "titulo_pt": "O Último Azul", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 145464, "titulo": "El round que se desató en la Comisión de Mujeres del Congreso", "url": "https://www.latercera.com/politica/noticia/el-round-que-se-desato-en-la-comision-de-mujeres-del-congreso/", "fonte_id": "la_tercera", "data_pub": "2026-09-04T17:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em uma sessão da Comissão de Mulheres da Câmara dos Deputados, houve um forte debate entre parlamentares do governo e da oposição sobre a conveniência de se reunir formalmente com a ministra Judith Marín (Partido Cristão). Constanza Schönhaut (FA) afirmou que não está disponível para perder tempo em uma reunião.", "titulo_pt": "Round de debates na comissão de mulheres do congresso", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 145410, "titulo": "Dribbling: buenas actuaciones en una obra que plantea varios dilemas éticos", "url": "https://www.lanacion.com.ar/espectaculos/teatro/dribbling-buenas-actuaciones-en-una-obra-que-plantea-varios-dilemas-eticos-nid04092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-04T17:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Franco Masini e Carlos Portaluppi brilham como um jogador de futebol e seu representante, unidos por uma acusação de abuso sexual.", "titulo_pt": "Driblando: boas atuações em uma obra que aborda vários dilemas éticos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 145474, "titulo": "Diego Schalper (RN): “Lo que debimos haber hecho para conmemorar el 4 de septiembre era hablarle al 62%”", "url": "https://www.latercera.com/politica/noticia/diego-schalper-rn-lo-que-debimos-haber-hecho-para-conmemorar-el-4-de-septiembre-era-hablarle-al-62/", "fonte_id": "la_tercera", "data_pub": "2026-09-04T17:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O deputado Diego Schalper (RN) acredita que o setor político deveria ter aproveitado o 4 de setembro para refletir sobre as urgências do país em vez de se dividir por instâncias que desfocam os debates. Ele valoriza o discurso do presidente José Antonio Kast no Foro Madrid, mas considera que o foco deveria ser diferente.", "titulo_pt": "Diego Schalper (RN): 'o que deveríamos ter feito para comemorar o 4 de setembro era conversar com o 62%'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 145476, "titulo": "Pedro Cateriano, expremier peruano: “Uno de los retos de Keiko Fujimori es dar muestras de respeto a la libertad de expresión”", "url": "https://www.latercera.com/mundo/noticia/pedro-cateriano-expremier-peruano-uno-de-grandes-retos-del-gobierno-de-fujimori-es-dar-muestras-de-respeto-a-las-libertades-de-expresion-y-de-prensa/", "fonte_id": "la_tercera", "data_pub": "2026-09-04T17:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro peruano Pedro Cateriano conversou com La Tercera sobre a situação política no Peru, onde a candidata presidencial Keiko Fujimori enfrenta desafios, incluindo a necessidade de demonstrar respeito à liberdade de expressão. Cateriano visitará Santiago para participar de um evento sobre liberdade de expressão e cultura de cancelamento organizado pelo Instituto para uma Sociedade Livre e Faro UDD.", "titulo_pt": "Ex-ministro peruano pedro Cateriano: 'um dos desafios de Keiko Fujimori é demonstrar respeito à liberdade de expressão'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 145414, "titulo": "“¿Qué hacen estas mujeres encerradas?”: la vida entre la oración por el mundo y el trabajo dentro de un monasterio de clausura", "url": "https://www.lanacion.com.ar/sociedad/que-hacen-estas-mujeres-encerradas-la-vida-entre-la-oracion-por-el-mundo-y-el-trabajo-dentro-de-un-nid04092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-04T17:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O próximo 8 de setembro marcará o 150º aniversário da Orden de la Visitación de Santa María na Argentina. ulo_pt": "Alerta sobre hábito que aumenta risco de alergias em crianças após pandemia", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 144529, "titulo": "Un corredor se descompensó a 300 metros de la llegada de la Media Maratón de Buenos Aires y murió cinco días después", "url": "https://www.lanacion.com.ar/sociedad/un-corredor-se-descompenso-a-300-metros-de-la-llegada-de-la-media-maraton-de-buenos-aires-y-murio-nid04092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-04T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Axel Starke, de 48 anos, teve um colapso cardíaco a 300 metros da meta da Meia Maratona de Buenos Aires e foi internado, mas faleceu cinco dias depois. A família alega que o atleta não recebeu assistência adequada no tempo certo.", "titulo_pt": "Corredor de 48 anos colapsou perto da meta e morreu cinco dias depois de competição", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 144810, "titulo": "Video: Workers rescued from hydro tunnel nine days after Nepal flooding", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/4/video-workers-rescued-from-hydro-tunnel-nine-days-after-nepal-flooding?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-04T07:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois trabalhadores foram resgatados vivos de um túnel hidrelétrico nove dias após inundações devido a uma forte chuva em Nepal.", "titulo_pt": "Vídeo: trabalhadores resgatados de túnel hidrelétrico nove dias após inundações na Nepal", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 144364, "titulo": "Laudo afirma que entregador morto por GCM foi baleado nas costas e pulmões", "url": "https://www.metropoles.com/colunas/alfredo-henrique/laudo-afirma-que-entregador-morto-por-gcm-foi-baleado-nas-costas-e-pulmoes", "fonte_id": "metropoles", "data_pub": "2026-09-04T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null,
