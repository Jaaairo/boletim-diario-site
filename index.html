n à queixa-crime de Ratinho no STF por calúnia e difamação", "url": "https://veja.abril.com.br/brasil/a-resposta-de-erika-hilton-a-queixa-crime-de-ratinho-no-stf-por-calunia-e-difamacao/", "fonte_id": "veja", "data_pub": "2026-10-09T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Erika Hilton respondeu a uma queixa-crime apresentada por Ratinho no STF acusando-a de calúnia e difamação. Ratinho havia questionado declarações dela sobre trabalho escravo em uma fazenda e o envolvimento de seu filho com estupro.", "titulo_pt": "Resposta de Erika Hilton a queixa-crime de Ratinho no STF por calúnia e difamação", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 206566, "titulo": "David Tomé, cabrero de 19 años en Málaga: “A los 12 compré la primera y hoy tengo 200”", "url": "https://www.lanacion.com.ar/economia/campo/david-tome-cabrero-de-19-anos-en-malaga-a-los-12-compre-la-primera-y-hoy-tengo-200-nid09102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-09T21:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "David Tomé, de 19 anos, é um cabrero em Málaga, Espanha, que comprou sua primeira cabra aos 12 anos e hoje possui 200. Sem história de ganadismo familiar, ele economizou e trabalhou como garçom para financiar sua propriedade, que produz leite e ele planeja abrir uma quezíeria.", "titulo_pt": "David Tomé, cabreiro de 19 anos em Málaga: ‘comprei a primeira cabra aos 12 e hoje tenho 200’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 206652, "titulo": "Three men found guilty of murders of Australian surfer brothers and US friend in Mexico", "url": "https://www.theguardian.com/world/2026/oct/10/jake-callum-robinson-australian-surfers-carter-rhoad-mexico-murder-guilty-verdict-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-10-09T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três homens foram condenados pelo assassinato de dois irmãos australiano Lula é de Vorcaro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 206602, "titulo": "Santa Fe 2026: una actuación que obliga a mirar más allá del medallero", "url": "https://www.ciperchile.cl/2026/10/09/santa-fe-2026-una-actuacion-que-obliga-a-mirar-mas-alla-del-medallero/?utm_source=rss&utm_medium=rss&utm_campaign=santa-fe-2026-una-actuacion-que-obliga-a-mirar-mas-alla-del-medallero", "fonte_id": "ciper_chile", "data_pub": "2026-10-09T20:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a participação de Santa Fe em 2026, enfatizando que ela requer uma análise além do número de medalhas.", "titulo_pt": "Santa Fe 2026: uma atuação que exige olhar além do medallero", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 206610, "titulo": "Exministras de la Mujer de Bachelet y Boric buscan evitar cierre de Prodemu y ofrecen colaboración a gobierno de Kast", "url": "https://www.latercera.com/politica/noticia/exministras-de-la-mujer-de-bachelet-y-boric-buscan-evitar-cierre-de-prodemu-y-ofrecen-colaboracion-a-gobierno-de-kast/", "fonte_id": "la_tercera", "data_pub": "2026-10-09T19:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Ex-ministras da Mulher de Bachelet e Boric buscam evitar o fechamento da Prodemu e oferecem colaboração ao governo de Kast. Ex-subsecretárias da pasta e senadoras da oposição estão promovendo uma mesa de trabalho para tratar do assunto.", "titulo_pt": "Ex-ministras da mulher de Bachelet e Boric buscam evitar fechamento da Prodemu e oferecem colaboração ao governo de Kast", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 206611, "titulo": "Salud garantiza seguridad de agua potable en la RM y anuncia vacunación contra la hepatitis y tétanos en Las Condes", "url": "https://www.latercera.com/nacional/noticia/salud-garantiza-seguridad-de-agua-potable-en-la-rm-y-anuncia-vacunacion-contra-la-hepatitis-y-tetanos-en-las-condes/", "fonte_id": "la_tercera", "data_pub": "2026-10-09T19:35:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O subsecretário Julio Montt informou que dois pacientes foram transferidos da clínica UC Christus para o Hospital Metropolitano. A saúde assegurou a segurança da água potável na Região Metropolitana e anunciou a vacinação contra a hepatite e tétano em Las Condes.", "titulo_pt": "Saúde garante segurança da água e anuncia vacinação em Las Condes", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 205542, "titulo": "Sabará prevê R$ 10 milhões para saúde mental, mas planos de saúde limitam investimento", "url": "https://veja.abril.com.br/economia/sabara-preve-r-10-milhoes-para-saude-mental-mas-planos-de-saude-limitam-investimento/", "fonte_id": "veja", "data_pub": "2026-10-09T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A procura por atendimento psiquiátrico aumentou mais de três vezes em dez anos. No entanto, a incerteza sobre os pagamentos dos planos de saúde limitou o projeto a apenas dez vagas, prevendo um investimento de R$ 10 milhões para saúde mental.", "titulo_pt": "Sabará prevê R$ 10 milhões para saúde mental, mas planos de saúde limitam investimento", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 206346, "titulo": "INSS começa a pagar auxílio para vítimas de violência doméstica; veja quem tem direito e como pedir", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/inss-comeca-a-pagar-auxilio-para-vitimas-de-violencia-domestica-veja-quem-tem-direito-e-como-pedir.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T17:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mulheres vítimas de violência doméstica que tenham sido afastadas do trabalho por medida judicial já podem solicitar ao INSS o auxílio remunerado por até seis meses. O benefício está disponível a partir de 10 de setembro de 2026.", "titulo_pt": "INSS começa a pagar auxílio para vítimas de violência doméstica a partir de 10/09/2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 205475, "titulo": "Você não inveja o bilionário, mas se incomoda com a promoção do colega: entenda por que esse sentimento dói e só atinge o que está ao nosso alcance", "url": "https://www.cnnbrasil.com.br/curiosidades/voce-nao-inveja-o-bilionario-mas-se-incomoda-com-a-promocao-do-colega-entenda-por-que-esse-sentimento-doi-e-so-atinge-o-que-esta-ao-nosso-alcance/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-09T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudos em neurociência e filosofia indicam que o cérebro humano responde à proximidade social e ao sucesso alheio de maneira semelhante à percepção de dor física. Isso explica por que o sentimento de desconforto com a promoção de um colega não é a mesma coisa que invejar um bilionário.", "titulo_pt": "Você não inveja o bilionário, mas se incomoda com a promoção do colega: entenda por que esse sentimento dói e só atinge o que está ao nosso alcance", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 205627, "titulo": "Banco de Alimentos Buenos Aires: un puente para ayudar a quienes más lo necesitan", "url": "https://www.clarin.com/informacion-general/banco-alimentos-buenos-aires-puente-ayudar-necesitan_0_dZAleqqMC9.html", "fonte_id": "clarin", "data_pub": "2026-10-09T17:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "No Brasil, é mais comum jogar alimentos fora do que doá-los. Diante desse problema, o Banco de Alimentos Buenos Aires sugere uma mudança na abordagem para auxiliar as pessoas em maior necessidade.", "titulo_pt": "Banco de Alimentos Buenos Aires: uma ponte para ajudar quem mais precisa", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 205489, "titulo": "PF investiga desvios na saúde por empresa que recebeu mais de R$ 1 bi no CE", "url": "https://www.cnnbrasil.com.br/nacional/nordeste/ce/pf-investiga-desvios-na-saude-por-empresa-que-recebeu-mais-de-r-1-bi-no-ce/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-09T16:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal investiga possíveis desvios de verbas públicas federais relacionadas a uma empresa que recebeu mais de R$ 1 bilhão no estado do Ceará. Foram determinados sequestros de 38 imóveis e 82 veículos, bem como o bloqueio de sigilos bancário e fiscal dos investigados.", "titulo_pt": "PF investiga desvios na saúde por empresa que recebeu mais de R$ 1 bi no CE", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 205558, "titulo": "Soraya Thronicke terá que indenizar Alfredo Gaspar por acusação falsa de estupro", "url": "https://veja.abril.com.br/brasil/soraya-thronicke-tera-que-indenizar-alfredo-gaspar-por-acusacao-falsa-de-estupro/", "fonte_id": "veja", "data_pub": "2026-10-09T16:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada Soraya Thronicke terá que pagar R$ 50 mil a Alfredo Gaspar por ter acusado o deputado de estupro de forma falsa. O caso foi julgado pelo Senado.", "titulo_pt": "Soraya Thronicke terá que indenizar Alfredo Gaspar por acusação falsa de estupro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 205560, "titulo": "Justiça se manifesta após acusação de Soraya Thronicke contra vice na chapa de Flávio", "url": "https://veja.abril.com.br/politica/justica-se-manifesta-apos-acusacao-de-soraya-thronicke-contra-vice-na-chapa-de-flavio/", "fonte_id": "veja", "data_pub": "2026-10-09T16:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz decidiu que a acusação de estupro feita pela senadora Soraya Thronicke contra o vice na chapa de Flávio não tinha evidências suficientes e, portanto, revogou a imunidade parlamentar dela.", "titulo_pt": "Justiça se manifesta após acusação de Soraya Thronicke contra vice na chapa de Flávio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 205826, "titulo": "The surprising post-pandemic drop in income inequality", "url": "https://www.axios.com/2026/10/09/income-biden-pandemic-inflation", "fonte_id": "axios", "data_pub": "2026-10-09T15:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos ajustados pela inflação dos trabalhadores médios e baixos aumentaram durante os anos de Biden, enquanto os rendimentos dos altos rendimentos diminuíram. Essa é uma descoberta inesperada baseada nos dados mais detalhados sobre finanças domésticas americanas, divulgados pela Reserva Federal.", "titulo_pt": "A surpreendente queda da desigualdade de renda pós-pandemia", "veiculo": "Axios", "pais": "EUA", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 206064, "titulo": "Environmental research academy honored by ARTDO", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/10/2003865726", "fonte_id": "taipei_times", "data_pub": "2026-10-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A acadêmica de pesquisa ambiental foi honrada pelo ARTDO.", "titulo_pt": "Academia de pesquisa ambiental homenageada pelo ARTDO", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 206580, "titulo": "Radares, mallas y piletas de contención: el plan para evitar otro aluvión destructivo en Chile ante la amenaza de El Niño", "url": "https://www.clarin.com/mundo/radares-mallas-piletas-contencion-plan-evitar-aluvion-destructivo-chile-amenaza-nino_0_OZsKEAZoeb.html", "fonte_id": "clarin", "data_pub": "2026-10-09T21:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo chileno está avaliando investimentos milionários para evitar efeitos de possíveis torrentes de barro e água, como ocorreu em Las Condes. A prefeita da principal comuna afetada reivindica que o orçamento deve ser alocado urgentemente.", "titulo_pt": "Radares, malhas e piscinas de contenção: o plano para evitar outro aluvão destrutivo no Chile diante da ameaça de El Niño", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 206397, "titulo": "Terremoto de magnitude 7,6 atinge o Panamá e alerta de tsunami é ativado", "url": "https://veja.abril.com.br/mundo/terremoto-de-magnitude-76-atinge-o-panama-e-alerta-de-tsunami-e-ativado/", "fonte_id": "veja", "data_pub": "2026-10-09T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 7,6 atingiu o Panamá, levando à suspensão de aulas, operações aeroportuárias e linhas de metrô. Há relatos de danos a edifícios e interrupção de energia em seis províncias.", "titulo_pt": "Terremoto de magnitude 7,6 atinge o Panamá e suspensão de atividades é decretada", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 206412, "titulo": "Chile decreta alerta vermelho depois de deslizamento em Santiago", "url": "https://www.poder360.com.br/poder-internacional/chile-decreta-alerta-vermelho-depois-de-deslizamento-em-santiago/", "fonte_id": "poder360", "data_pub": "2026-10-09T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Chile decretou um alerta vermelho após um deslizamento de terra em Santiago. A enxurrada de água e lama danificou casas e veículos, e as chuvas estão associadas ao fenômeno El Niño.", "titulo_pt": "Chile decretou alerta vermelho após deslizamento em Santiago", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 206456, "titulo": "Universitários inspirados por obra de arte cobrem geleira com manta gigante de lã – e acabam desacelerando em 50% seu derretimento", "url": "https://www.cnnbrasil.com.br/curiosidades/universitarios-inspirados-por-obra-de-arte-cobrem-geleira-com-manta-gigante-de-la-e-acabam-desacelerando-em-50-seu-derretimento/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-09T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Universitários inspirados por uma exposição de fotografia transformaram lãs que iriam para o lixo em uma manta gigante que cobriu uma geleira, resultando em uma redução de 50% no derretimento da geleira. O projeto, conhecido como 'snow farming', visa preservar a neve durante o verão.", "titulo_pt": "Universitários inspirados por obra de arte cobrem geleira com manta gigante de lã e desaceleram derretimento em 50%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 206771, "titulo": "Injured Orangutan rescued from Indonesia wildfires", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/9/injured-orangutan-rescued-from-indonesia-wildfires?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-09T19:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um jovem orangotango foi resgatado de incêndios florestais na Ilha de Borneu, na Indonésia.", "titulo_pt": "Orangotango jovem resgatado de incêndios na ilha de borneu, na indonésia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 205499, "titulo": "Furacão Isaías avança e traz mais pressões nos preços dos combustíveis dos EUA", "url": "https://www.infomoney.com.br/economia/furacao-isaias-avanca-e-traz-mais-pressoes-nos-precos-dos-combustiveis-dos-eua/", "fonte_id": "infomoney", "data_pub": "2026-10-09T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O furacão Isaías está se movendo em direção à produção e ao refino de petróleo dos Estados Unidos, o que pode aumentar as pressões sobre os preços dos combustíveis no país.", "titulo_pt": "Furacão Isaías avança e aumenta pressões sobre preços dos combustíveis nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 205483, "titulo": "Estudo da Fiocruz detecta cocaína em cinco rios do Rio de Janeiro", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/rj/estudo-da-fiocruz-detecta-cocaina-em-cinco-rios-do-rio-de-janeiro/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-09T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Fiocruz detectou cocaína em cinco rios do Rio de Janeiro, com contaminação que supera níveis encontrados em outros cinco países. Os ensaios indicaram que a substância causou mortes, deformações, alterações cardiovasculares e neurológicas em organismos aquáticos.", "titulo_pt": "Estudo da Fiocruz detecta cocaína em cinco rios do Rio de Janeiro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 206169, "titulo": "African antelopes spreading in New Mexico: How far could they go under climate change?", "url": "https://phys.org/news/2026-10-african-antelopes-mexico-climate.html", "fonte_id": "phys_org", "data_pub": "2026-10-09T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gemsbok, antílopes africanos introduzidos no Novo México nos anos 1960 e 1970, se estendem mais de 100 quilômetros desde o ponto de introdução. Pesquisadores da Universidade de Illinois Urbana-Champaign atribuem isso às adaptações excepcionais desses animais para condições áridas, que eles prevêem se expandir significativamente devido ao aquecimento global.", "titulo_pt": "Gemsbok africanos se espalhando no novo México: como o aquecimento global poderia afetar sua expansão?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 205322, "titulo": "Menos de 5% das empresas cumprem lei de reciclagem de eletrônicos no Brasil, diz associação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/10/menos-de-5-das-empresas-cumprem-lei-de-reciclagem-de-eletronicos-no-brasil-diz-associacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-09T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lei que obriga as empresas a fazer a logística reversa de eletrônicos no Brasil é cumprida por apenas 4,8% das empresas envolvidas. Segundo a Abree, apenas 192 das aproximadamente 4.000 empresas que vendem ou importam produtos eletrônicos atendem à exigência.", "titulo_pt": "Menos de 5% das empresas cumprem lei de reciclagem de eletrônicos no Brasil, diz associação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 205895, "titulo": "Tornadoes sweep across Sicily, leaving flipped cars and damaged buildings", "url": "https://www.euronews.com/2026/10/09/tornadoes-sweep-across-sicily-leaving-flipped-cars-and-damaged-buildings", "fonte_id": "euronews", "data_pub": "2026-10-09T14:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tornados raramente observados formaram-se perto da costa de Marsala, na Sicília ocidental, em 9 de outubro, causando danos significativos quando se movimentaram para o interior.", "titulo_pt": "Tornados atingem sicília, causando danos significativos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 205896, "titulo": "Indonesia: Baby orangutan saved from Borneo wildfires as habitat destruction escalates", "url": "https://www.euronews.com/video/2026/10/09/indonesia-baby-orangutan-saved-from-borneo-wildfires-as-habitat-destruction-escalates", "fonte_id": "euronews", "data_pub": "2026-10-09T13:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma jovem orangotango, de três a quatro anos, foi resgatada de incêndios florestais na Borneu. A fêmea, chamada Novita, estava presa em um árvore em Kalimantan Central, com queimaduras nas mãos e pés após ter passado por fogo.", "titulo_pt": "Indonésia: jovem orangotango resgatada de incêndios florestais na borneu enquanto destruição do habitat aumenta", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 205578, "titulo": "Pré-COP termina com cobrança para destravar US$ 5 bi de financiamento climático para o Pacífico", "url": "https://exame.com/esg/pre-cop-termina-com-cobranca-para-destravar-us-5-bi-de-financiamento-climatico-para-o-pacifico/", "fonte_id": "exame", "data_pub": "2026-10-09T12:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O encontro em Fiji e Tuvalu anúncio de hegseth sobre transmissão ao vivo da execução surpreende até apoiadores da pena de morte", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 205946, "titulo": "Palestinians seek protection from violent settlers during olive harvest", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/9/palestinians-seek-protection-from-violent-settlers-during-olive-harvest?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-09T17:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pecuaristas palestinos na Cisjordânia Ocidental estão pedindo a ativistas internacionais para protegê-los durante a colheita de oliveiras. Eles buscam apoio para se defenderem de violência cometida por colonos israelenses.", "titulo_pt": "Palestinos buscam proteção de ativistas durante colheita de oliveiras", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 205464, "titulo": "Nobel da Paz vai para Navi Pillay, jurista que denunciou genocídio de Israel em Gaza", "url": "https://www.brasildefato.com.br/2026/10/09/nobel-da-paz-vai-para-navi-pillay-jurista-que-denunciou-genocidio-de-israel-em-gaza/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-09T14:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A jurista sul-africana Navi Pillay, de 85 anos, foi escolhida para receber o Prêmio Nobel da Paz de 2026. Sua atuação na defesa do direito internacional e na responsabilização por crimes contra a humanidade foi destacada.", "titulo_pt": "Nobel da Paz vai para Navi Pillay, jurista que denunciou genocídio de Israel em Gaza", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 205776, "titulo": "New spate of stabbings, overdoses and fires at Australian immigration detention centres run by ICE-linked US prison firm", "url": "https://www.theguardian.com/australia-news/2026/oct/09/australia-immigration-detention-centres-overdoses-fires-prison-ice-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-10-09T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Documentos internos revelam que novos casos de agressões, overdose e incêndios ocorreram nos centros de detenção imigratória australianos gerenciados pela empresa de prisões com ligações americanas ICE. Isso levanta questionamentos sobre a segurança e o cumprimento das leis que protegem os funcionários e os detidos pelo governo australiano.", "titulo_pt": "Nova onda de agressões, overdose e incêndios em centros de detenção imigratória australianos gerenciados por empresa com ligações americanas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 205966, "titulo": "Child flees as Israeli settlers hijack car during pogrom", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/9/child-flees-as-israeli-settlers-hijack-car-during-pogrom?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-09T13:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um garoto palestiniano foi visto fugindo após judeus settleres atacarem seu pai e roubarem seu carro em Ramallah.", "titulo_pt": "Menino palestiniano foge após judeus settleres atacarem seu pai e roubarem o carro", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 205900, "titulo": "‘I still want to verify this’: Nobel Peace Prize winner Navi Pillay’s first reaction", "url": "https://www.euronews.com/2026/10/09/i-still-want-to-verify-this-nobel-peace-prize-winner-navi-pillays-first-reaction", "fonte_id": "euronews", "data_pub": "2026-10-09T11:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Navi Pillay, de 85 anos, disse que inicialmente achou a notícia de que havia ganhado o Prêmio Nobel da Paz de 2026 uma piada. Ela afirmou que queria verificar a notificação antes de acreditar nela.", "titulo_pt": "‘Ainda quero verificar isto’: primeira reação da vencedora do prêmio nobel da paz Navi Pillay", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 205037, "titulo": "Nobel Peace Prize awarded to human rights ‘pioneer’ Navi Pillay", "url": "https://www.ft.com/content/3ae8dc9c-ee3a-4fe5-9749-b88390b5930b?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-09T09:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Navi Pillay, uma advogada dos direitos humanos sul-africana, recebeu o Prêmio Nobel da Paz por seus esforços para promover a paz e o direito internacional.", "titulo_pt": "Prêmio nobel da paz concedido à 'pioneira' Navi Pillay", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 204714, "titulo": "Quem são as 21 mulheres que já ganharam o Prêmio Nobel da Paz", "url": "https://exame.com/mundo/quem-sao-as-21-mulheres-que-ja-ganharam-o-premio-nobel-da-paz/", "fonte_id": "exame", "data_pub": "2026-10-09T06:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Navi Pillay se tornou a 21ª mulher a ganhar o Prêmio Nobel da Paz. A lista de mulheres vencedoras começa em 1905, com a austríaca Bertha von Suttner.", "titulo_pt": "Quem são as 21 mulheres que já ganharam o Prêmio Nobel da Paz", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 204839, "titulo": "Egyptian journalists plan weekend protest over detention of six colleagues", "url": "https://www.theguardian.com/global-development/2026/oct/09/egypt-six-journalists-matsadaash-protest-over-detentions", "fonte_id": "guardian_world", "data_pub": "2026-10-09T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jornalistas do Egito planejam uma nova protesto no fim de semana em Cairo após seis de seus colegas serem acusados de terrorismo e terem sido presos por supostamente trabalhar para o Irmão Muçulmano. Os funcionários do Matsadaash afirmam ter sofrido tortura e confissões forçadas durante a detenção.", "titulo_pt": "Jornalistas egípcios planejam protesto no fim de semana por detenção de seis colegas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 205029, "titulo": "Christa Pike case underscores prevalence of botched executions in US", "url": "https://www.aljazeera.com/news/2026/10/9/christa-pike-case-underscores-prevalence-of-botched-executions-in-us?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-09T02:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos afirmam que métodos como a injeção letal prometem uma forma mais humana de execução, mas são frequentemente comprometidos por erros. O caso de Christa Pike ilustra a prevalência de execuções mal-sucedidas nos Estados Unidos.", "titulo_pt": "Caso christa Pike evidencia a prevalência de execuções mal-sucedidas nos EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 205184, "titulo": "Indian man alleges abuse by Korean immigration officers during deportation", "url": "https://www.koreaherald.com/article/10897732", "fonte_id": "korea_herald", "data_pub": "2026-10-09T02:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um cidadão indiano acusa agentes de imigração de terem cometido abuso físico nele durante sua deportação, incluindo o uso de fita adesiva para cobrir a boca e sufocá-lo, conforme revelado por um parlamentar. O caso foi apresentado à Comissão Nacional de Direitos Humanos da Coreia.", "titulo_pt": "Indianos acusam agentes de imigração de abuso durante deportação", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 203589, "titulo": "Laws inadequate to fight transnational repression: MAC", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/09/2003865663", "fonte_id": "taipei_times", "data_pub": "2026-10-09T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Comando de Operações de Inteligência (MAC) afirmou que as leis atuais são insuficientes para combater a repressão transnacional. A instituição destacou a necessidade de reformas legais mais robustas.", "titulo_pt": "Leis insuficientes para combater repressão transnacional, afirma MAC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "direitos_humanos__eventos": [{"titulo": "Gaza, Ruanda, Darfur e Myanmar: a luta contra os genocídios de Navi Pillay, a Nobel de Paz 2026", "sumario": "Navi Pillay, jurista sul-africana e ex-comissária das Nações Unidas para os Direitos Humanos, foi declarada vencedora do Prêmio Nobel de Paz de 2026 por seus esforços em promover a paz e o direito internacional. Navi Pillay, jurista sul-africana, recebeu um prêmio por sua atuação em defesa do direito internacional e na responsabilização por crimes de guerra e genocídio. Navi Pillay, sul-africana, ganhou o Nobel da Paz de 2026.", "artigos": [{"id": 205695, "titulo": "Gaza, Ruanda, Darfur y Myanmar: La lucha contra los genocidios de Navi Pillay, la Nobel de la Paz 2026", "url": "https://www.latercera.com/mundo/noticia/gaza-ruanda-darfur-y-myanmar-la-lucha-contra-los-genocidios-de-navi-pillay-la-nobel-de-la-paz-2026/", "fonte_id": "la_tercera", "data_pub": "2026-10-09T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Navi Pillay, jurista sul-africana e ex-comissária das Nações Unidas para os Direitos Humanos, foi declarada vencedora do Prêmio Nobel de Paz de 2026 por seus esforços em promover a paz e o direito internacional. Ela dedica o prêmio aos sobreviventes de crimes internacionais.", "titulo_pt": "Gaza, Ruanda, Darfur e Myanmar: a luta contra os genocídios de Navi Pillay, a Nobel de Paz 2026", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 204713, "titulo": "Do combate ao apartheid ao Nobel da Paz de 2026: quem é Navi Pillay?", "url": "https://exame.com/mundo/do-combate-ao-apartheid-ao-nobel-da-paz-de-2026-quem-e-navi-pillay/", "fonte_id": "exame", "data_pub": "2026-10-09T06:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Navi Pillay, jurista sul-africana, recebeu um prêmio por sua atuação em defesa do direito internacional e na responsabilização por crimes de guerra e genocídio. Ela é conhecida por seu trabalho no combate ao apartheid na África do Sul e foi premiada em 2026.", "titulo_pt": "Da luta contra o apartheid ao Nobel da Paz de 2026: quem é Navi Pillay?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 204716, "titulo": "Navi Pillay ganha Nobel da Paz de 2026; saiba quem é a jurista", "url": "https://exame.com/mundo/navi-pillay-ganha-nobel-da-paz-de-2026-saiba-quem-e-a-jurista/", "fonte_id": "exame", "data_pub": "2026-10-09T06:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Navi Pillay, sul-africana, ganhou o Nobel da Paz de 2026. Ela atuou em tribunais internacionais, foi alta comissária da ONU para os Direitos Humanos e participou de julgamentos históricos.", "titulo_pt": "Navi Pillay vence Nobel da Paz de 2026; saiba quem é a jurista", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}]}]}, "noticias": [{"id": 206057, "fonte_id": "taipei_times", "titulo": "Strait war risk exaggerated: US official", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/10/2003865713", "data_pub": "2026-10-10T00:00:00Z", "topico": "geopolitica", "idioma": "en", "titulo_pt": "Risco de guerra no estreito de taiwan exagerado, diz oficial dos EUA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 206064, "fonte_id": "taipei_times", "titulo": "Environmental research academy honored by ARTDO", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/10/2003865726", "data_pub": "2026-10-10T00:00:00Z", "topico": "meio_ambiente", "idioma": "en", "titulo_pt": "Academia de pesquisa ambiental homenageada pelo ARTDO", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 206065, "fonte_id": "taipei_times", "titulo": "Overseas offices celebrate Double Ten", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/10/2003865727", "data_pub": "2026-10-10T00:00:00Z", "topico": "cultura"              <div class="meta">

               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
