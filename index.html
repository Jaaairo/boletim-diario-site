<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

Wall Street a se prepararem para um controle democrata. Este cenário poderia influenciar a direção de diversos assuntos, incluindo inteligência artificial e gastos públicos. Em Israel, após uma votação sem vencedor claro, a oposição liderada por Gadi Eisenkot se reuniu para formar um governo, mantendo a possibilidade de aliança com partidos árabes. A Alemanha enfrenta pressão para reconhecer o genocídio colonial cometido no início do século XX na Namíbia e reparar aos descendentes das vítimas. Além disso, a Primera Dama dos Estados Unidos, Melania Trump, se reúne com representantes ucranianos e russos na Casa Branca. Na Ásia, o Reino Unido e a União Europeia chegam a um acordo para eliminar as verificação aduaneiras em importações e exportações de alimentos e produtos animais, beneficiando exportadores britânicos.\n\nOs Estados Unidos realizaram ataques a alvos iranianos no Estreito de Ormuz, horas antes das eleições de meio de mandato, em um movimento que pode afetar o cenário político americano. Essa ação, vista como parte de uma guerra impopular contra o Irã, pode impactar os preços e ser um problema para o presidente Donald Trump e os republicanos. Em resposta, o Irã aumentou sua defesa e ameaçou retaliar, incluindo as bases de apoio dos EUA na Europa na lista de alvos potenciais. Além disso, a guerra no Irã aumentou significativamente o custo de vida nos Estados Unidos, com um aumento de quase R$ 12 mil por família, comprometendo uma promessa feita pelo presidente Trump durante a campanha eleitoral de 2024 de reduzir o alto custo de vida. Em outra frente geopolítica, Israel enfrenta um impasse político que coloca o futuro do primeiro-ministro Benjamin Netanyahu em suspenso, enquanto a Ucrânia espera que as conversas em Abu Dhabi possam levar a uma reunião com o presidente russo Vladimir Putin, apesar de a Rússia não ter se engajado seriamente nas tentativas de paz.", "economia": "O mercado de trabalho nos Estados Unidos registrou um aumento de 333 mil vagas de emprego em setembro, com uma redução nas demissões, fortalecendo a percepção de que o mercado está mais sólido. Em contraste, a economia brasileira enfrenta um cenário desafiador, com projeções para quatro anos de dificuldades econômicas, incluindo inflação, juros altos e desvalorização da moeda. A Aramco, a petrolífera saudita, registrou um aumento de 34,5% no lucro líquido do terceiro trimestre, principalmente devido ao aumento da receita e à saída de uma joint venture. Além disso, o Brasil enfrenta um aumento da inadimplência, com 84,2 milhões de inadimplentes, correspondendo a 51,1% da população adulta, o primeiro caso em que o índice passou de metade.", "tecnologia": "A tecnologia está em pleno desenvolvimento e transformação em diversos setores, conforme demonstrado por várias notícias. Por exemplo, a CrowdStrike adquiriu duas startups de inteligência artificial por cerca de 495 milhões de dólares, visando expandir o monitoramento e os testes de agentes de segurança de IA. Além disso, a empresa Google desativou silenciosamente uma campanha de botnet que estava usando 1,3 milhão de caixas de TV Android, demonstrando a importância da segurança em dispositivos inteligentes. Em outro aspecto, a Universidade de Aconcagua está utilizando simuladores 3D e ferramentas digitais para melhorar a qualidade da educação a distância. Porém, a primeira película totalmente gerada por IA da China não foi um sucesso, arrecadando apenas 1,7 milhão de yuan, apesar de ter sido elogiada por sua qualidade técnica. Esses eventos ilustram a variedade e a complexidade do impacto da tecnologia em diferentes áreas, desde a segurança cibernética até a educação e a produção cinematográfica.", "ciencia": "Em 29 de outubro de 2026, a NASA realizou uma caminhada espacial durante a qual o astronauta canadense Joshua Kutryk instalou uma nova placa solar desdobrável na Estação Espacial Internacional (ISS). A empresa tcheca Spacemanic e o líder belga em óptica Simera Sense anunciaram uma parceria para desenvolver uma nova solução de satélite dual-use, utilizando o xScape200 da Simera Sense. No mesmo ano, o primeiro medicamento genérico para prevenir o HIV foi aprovado nos Estados Unidos, sendo produzido pela Dr. Reddy’s Laboratories, permitindo a aplicação anual do medicamento em 120 países de baixa e média renda. Além disso, a China realizou seu primeiro acoplamento espacial histórico em 2011, marcando um passo importante para o desenvolvimento de sua estação espacial, e uma startup planeja voar aviões de carga sem passageiros no cockpit, buscando aprovação das reguladoras para os voos autônomos.", "cultura": "O Quilmes Rock 2027, programado para os dias 16, 17 e 18 de abril, reúne grandes nomes da música nacional, como Babasónicos, Fito Páez e Ratones Paranoicos, além de um tributo a Luis Alberto Spinetta. O evento destaca-se como um importante ponto de encontro cultural na Argentina. Paralelamente, RuPaul, a famosa drag queen americana, viajará a São Paulo no ano que vem para se apresentar como DJ, marcando sua primeira visita ao país em 20 anos. Esses eventos refletem a rica cena cultural do país, abrangendo desde a música até a performance artística.", "sociedade": "A sociedade enfrenta diversos desafios e incidentes em diferentes partes do mundo. Em Mato Grosso, no Brasil, a Secretaria de Saúde foi alvo de um ataque hacker em 2026, resultando na suspensão temporária dos sistemas das unidades administradas pela pasta. Este é o segundo ataque cibernético sofrido pela secretaria neste ano. Em Nova York, nos Estados Unidos, as taxas de creche e escola são tão elevadas que ter filhos se tornou um luxo para muitas famílias, com as taxas de creche representando 30% a 40% do orçamento familiar. Em Beitou, Taiwan, um acidente ocorreu quando uma estrutura de escadarias caiu, resultando em ferimentos a quatro pessoas. Em Singapura, uma organização de uma campanha de arrecadação de fundos para um menino cujos pais supostamente morreram em um acidente de trânsito prometeu transparência e agradeceu aos doadores, após debates sobre a autenticidade da campanha.", "meio_ambiente": "O Brasil lançou um plano de ação global para a transição energética, focado em conter o desmatamento e acelerar a descontinuação dos combustíveis fósforos, durante sua presidência no processo climático da ONU. Este plano foi apresentado durante o COP30 e propõe ações coordenadas para desacelerar a utilização de combustíveis fósforos e reverter a perda florestal até 2030. Paralelamente, o país registrou chuvas e temperaturas elevadas, com pancadas de chuva em várias regiões. Além disso, o aquecimento global acima de 1,5°C pode provocar a perda irreversível de geleiras, conforme um relatório da ONU e da ICCI.", "direitos_humanos": "A China propôs mudanças nas leis de repressão que podem levar a uma redução da liberdade de expressão e associação. Em outro desenvolvimento, a Associação de Mídia do Brasil pediu urgência na análise dos pedidos de refúgio de brasileiros na Argentina. A UNICEF emitiu uma declaração sobre relatos de crianças mortas e feridas em ataques aéreos em Myanmar, expressando preocupação com a situação e destacando a vulnerabilidade das crianças. Além disso, ataques aéreos estão interrompendo a educação de crianças na Ucrânia, afetando quase dois terços dos dias letivos nas escolas. Em outro desenvolvimento, seis ex-membros do Exército Sérvio da Bósnia foram condenados a uma pena total de 83 anos de prisão por assassinatos de 44 homens e deportação de mulheres e crianças de uma vila em Sokolac em 1992. Na Coreia do Sul, a cerimônia de memorial para vítimas de trabalho forçado no mineiro de Sado será realizada pela terceira vez consecutiva. Em Bangladesh, trabalhadores da indústria de vestuário realizaram manifestações para pedir aumentos salariais mais significativos, afirmando que os salários actuais são insuficientes para atender às suas necessidades básicas. Além disso, em Albania, jornalistas e vigilantes da mídia relataram dezenas de casos de abuso verbal e violência física contra profissionais de imprensa cobrindo protestos anti-governamentais."}, "resumo_do_dia": {"politica_nacional": [{"id": 242702, "titulo": "Guerra interna no PT por protagonismo no novo governo vira dilema para Lula", "url": "https://veja.abril.com.br/brasil/guerra-interna-no-pt-por-protagonismo-no-novo-governo-vira-dilema-para-lula/", "fonte_id": "veja", "data_pub": "2026-11-03T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Conflitos internos no Partido dos Trabalhadores (PT) sobre a distribuição de cargos e influência no novo governo estão se intensificando, antecipando disputas pelo poder após o fim do mandato de Lula, que termina em janeiro.", "titulo_pt": "Guerra interna no PT por protagonismo no novo governo vira dilema para Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 242746, "titulo": "Aliado de Nunes, João Jorge confirma disputa pelo comando da Câmara de SP", "url": "https://www.metropoles.com/sao-paulo/aliado-de-nunes-joao-jorge-confirma-disputa-pelo-comando-da-camara-de-sp", "fonte_id": "metropoles", "data_pub": "2026-11-03T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "João Jorge, aliado de Nunes, está buscando apoio de vereadores de diferentes bancadas para disputar a presidência da Câmara de SP, que será eleita em 15 de dezembro.", "titulo_pt": "Aliado de Nunes, João Jorge confirma disputa pelo comando da Câmara de SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 242749, "titulo": "Zambelli lança vaquinha de R$ 50 e diz que Moraes \"destruiu sua vida\"", "url": "https://www.metropoles.com/colunas/grande-angular/zambelli-lanca-vaquinha-de-r-50-e-diz-que-moraes-destruiu-sua-vida", "fonte_id": "metropoles", "data_pub": "2026-11-03T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Carla Zambelli, ex-deputada, lançou uma vaquinha pedindo R$ 50 e afirmou que o ministro do STF, Alexandre Moraes, 'destruiu sua vida', impedindo-a de abrir uma conta bancária e receber salário na Itália.", "titulo_pt": "Zambelli lança vaquinha de R$ 50 e acusa Moraes de destruir sua vida", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 242756, "titulo": "Cármen rejeita pedido para Moraes explicar declarações sobre Tagliaferro", "url": "https://www.metropoles.com/colunas/manoela-alcantara/carmen-rejeita-pedido-para-moraes-explicar-declaracoes-sobre-tagliaferro", "fonte_id": "metropoles", "data_pub": "2026-11-03T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ex-assessora do TSE acusou o ministro Moraes de fazer declarações ofensivas e pediu que ele esclarecesse as supostas declarações sobre a suposta fuga de Tagliaferro à Europa.", "titulo_pt": "Cármen rejeita pedido para Moraes explicar declarações sobre Tagliaferro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 242757, "titulo": "Moraes impõe bloqueio à mansão de Willer reclamada por Richarlison", "url": "https://www.metropoles.com/colunas/demetrio-vecchioli/moraes-impoe-bloqueio-a-mansao-de-willer-reclamada-por-richarlison", "fonte_id": "metropoles", "data_pub": "2026-11-03T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz Alexandre de Moraes impôs um bloqueio judicial à mansão de Willer Tomaz, amigo de Flávio Bolsonaro, que está em disputa com o atacante Richarlison.", "titulo_pt": "Moraes impõe bloqueio à mansão de Willer disputada com Richarlison", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 242619, "titulo": "Lula tem encontro com ministros antes de ir a SP para exames de rotina", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/lula-passara-por-exames-de-rotina-em-hospital-de-sp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-03T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula irá passar por exames de rotina em São Paulo nesta terça-feira (3). Antes de viajar, ele conversará com ministros.", "titulo_pt": "Lula terá reuniões com ministros antes de viajar para são paulo para exames", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 242712, "titulo": "No dia da eleição, Trump defende políticas impopulares que podem ter custado controle do Congresso", "url": "https://veja.abril.com.br/mundo/no-dia-da-eleicao-trump-defende-politicas-impopulares-que-podem-ter-custado-controle-do-congresso/", "fonte_id": "veja", "data_pub": "2026-11-03T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisas indicam que os democratas têm chances de assumir o controle da Câmara dos Representantes e possivelmente do Senado. Durante a campanha, Trump defendeu políticas que podem ter contribuído para o resultado adverso para os republicanos no Congresso.", "titulo_pt": "No dia da eleição, Trump defende políticas impopulares que podem ter custado controle do Congresso", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 242760, "titulo": "Presidente diz que Republicanos-DF receberia Michelle de braços abertos", "url": "https://www.metropoles.com/colunas/grande-angular/presidente-diz-que-republicanos-df-receberia-michelle-de-bracos-abertos", "fonte_id": "metropoles", "data_pub": "2026-11-03T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Republicanos-DF declarou que receber Michelle no partido seria uma 'honra', mas negou que existam conversas sobre a filiação dela. O partido Republicanos-DF afirmou que Michelle seria bem-vinda, mas não há discussões sobre seu possível ingresso no partido.", "titulo_pt": "Presidente do Republicanos-DF afirma que Michelle seria bem-vinda, mas não há conversas sobre filiação", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 242762, "titulo": "Nikolas associa a Lula fechamento de fábrica da Gerdau em Divinópolis", "url": "https://www.metropoles.com/minas-gerais/nikolas-associa-a-lula-fechamento-de-fabrica-da-gerdau-em-divinopolis", "fonte_id": "metropoles", "data_pub": "2026-11-03T17:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nikolas, assessor de Lula, associa o fechamento da fábrica de aço da Gerdau em Divinópolis a fatores como custo do minério, concorrência de importados e dificuldades de exportação.", "titulo_pt": "Nikolas associa fechamento da fábrica da Gerdau em Divinópolis a Lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 242793, "titulo": "Comissão aprova piso salarial para funcionários de apoio da educação básica", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/comissao-aprova-piso-salarial-para-funcionarios-de-apoio-da-educacao-basica/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-03T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A comissão aprovou um projeto que estabelece um piso salarial para funcionários de apoio na educação básica, equivalente a 75% do piso do magistério. O conselho nacional de ministros estima que o impacto anual para os municípios será de R$ 20,1 bilhões.", "titulo_pt": "Comissão aprova piso salarial para funcionários de apoio na educação básica", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 242795, "titulo": "Oposição apoiará PEC e manterá emenda sobre maioridade, dizem líderes", "url": "https://www.cnnbrasil.com.br/politica/oposicao-apoiara-pec-e-mantera-emenda-sobre-maioridade-dizem-lideres/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-03T17:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Líderes da oposição afirmam que apoiarão a Proposta de Emenda Constitucional (PEC) da Segurança Pública e manterão a emenda sobre a maioridade penal, mesmo que a emenda para reduzir a idade mínima de prisão seja rejeitada.", "titulo_pt": "Oposição apoiará PEC e manterá emenda sobre maioridade, dizem líderes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 242802, "titulo": "Durigan: Não tivemos espaço para falar com Lula sobre indicações para o BC", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/durigan-nao-tivemos-nem-espaco-de-falar-com-lula-sobre-novas-indicacoes-para-o-bc/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-03T16:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda disse que não houve oportunidade de conversar com Lula sobre possíveis indicações para o Banco Central. Futuros nomes para a autoridade monetária serão escolhidos com base em critérios técnicos.", "titulo_pt": "Durigan: não tivemos espaço para conversar com Lula sobre indicações para o BC", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 242637, "titulo": "Veja o que muda com as novas regras para vale-refeição e alimentação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/veja-o-que-muda-com-as-novas-regras-para-vale-refeicao-e-alimentacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-03T16:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir deste sábado (7), cartões de vale-refeição e vale-alimentação de diferentes operadoras deverão ser aceitos em todas as mesmas máquinas de pagamento, desde que os estabelecimentos aceitem esse tipo de pagamento. Os detalhes completos podem ser lidos na fonte original.", "titulo_pt": "Veja o que muda com as novas regras para vale-refeição e alimentação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 242889, "titulo": "Proibir ou regular as bets: qual o caminho mais eficiente?", "url": "https://www.jota.info/opiniao-e-analise/colunas/direito-economia-mercado/proibir-ou-regular-as-bets-qual-o-caminho-mais-eficiente", "fonte_id": "jota", "data_pub": "2026-11-03T16:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma medida provisória está levantando discussões sobre como abordar as apostas, focando em questões de arrecadação, fiscalização e possíveis consequências de uma proibição.", "titulo_pt": "Proibir ou regular as apostas: qual o caminho mais eficiente?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 242620, "titulo": "Com aval de Lula, presidente do PT atua para expulsar grupo apelidado de 'centrão' do partido", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/com-aval-de-lula-presidente-do-pt-atua-para-expulsar-grupo-apelidado-de-centrao-do-partido.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-03T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do PT, Edinho Silva, está planejando expulsar um grupo interno do partido conhecido como 'centrão petista'. Esta ação é parte de uma proposta de renovação partidária defendida pelo ex-presidente Lula.", "titulo_pt": "Com apoio de Lula, presidente do PT planeja expulsar 'centrão petista'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 242639, "titulo": "Após deixar o Madrona, Priscilla Carbone é a nova sócia do Abe Advogados", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/apos-deixar-o-madrona-priscilla-carbone-e-a-nova-socia-do-abe-advogados.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-03T15:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Priscilla Carbone, advogada com mais de 20 anos de experiência em direito do trabalho, deixou o escritório Madrona Advogados e se juntou ao Abe Advogados como sócia da área trabalhista. Ela já foi sócia do Madrona Advogados por mais de 11 anos.", "titulo_pt": "Priscilla Carbone se torna nova sócia do Abe Advogados", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 243275, "titulo": "Washington strikes Iranian targets in the Strait of Hormuz: US official", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/04/2003867115", "fonte_id": "taipei_times", "data_pub": "2026-11-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um oficial dos Estados Unidos confirmou que Washington atacou alvos iranianos no Estreito de Ormuz.", "titulo_pt": "Washington ataca alvos iranianos no estreito de Ormuz: oficial americano", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 242701, "titulo": "Em primeira reunião após impasse eleitoral, oposição promete derrubar Netanyahu em Israel", "url": "https://veja.abril.com.br/mundo/em-primeira-reuniao-apos-impasse-eleitoral-oposicao-promete-derrubar-netanyahu-em-israel/", "fonte_id": "veja", "data_pub": "2026-11-03T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma oposição liderada por Gadi Eisenkot se reuniu para formar um governo após uma votação sem vencedor claro em Israel. A aliança com partidos árabes permanece em aberto.", "titulo_pt": "Em primeira reunião após impasse eleitoral, oposição promete derrubar Netanyahu em Israel", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 242707, "titulo": "Toyota, GM e Volkswagen se unem para banir carros chineses dos EUA de vez", "url": "https://veja.abril.com.br/economia/toyota-gm-e-volkswagen-se-unem-para-banir-carros-chineses-dos-eua-de-vez/", "fonte_id": "veja", "data_pub": "2026-11-03T17:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As montadoras Toyota, GM e Volkswagen pretendem transformar as restrições comerciais e tecnológicas impostas aos carros chineses nos Estados Unidos em uma lei permanente. Essa união visa limitar ou eliminar a presença dos veículos chineses no mercado americano.", "titulo_pt": "Toyota, GM e Volkswagen unem-se para tornar restrições aos carros chineses nos EUA permanentes", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 242886, "titulo": "Corrupção estratégica e vulnerabilidade geopolítica do Brasil", "url": "https://www.jota.info/opiniao-e-analise/colunas/deixe-dados-falarem/corrupcao-estrategica-e-vulnerabilidade-geopolitica-do-brasil", "fonte_id": "jota", "data_pub": "2026-11-03T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A classe política brasileira é descrita como irresponsável, despreparada, antiética e barata em um contexto global corrupto e violento.", "titulo_pt": "Corrupção estratégica e vulnerabilidade geopolítica do Brasil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 242785, "titulo": "Guerra no Irã custou quase R$ 12 mil por família nos EUA, aponta estimativa", "url": "https://www.cnnbrasil.com.br/internacional/guerra-no-ira-custou-quase-r-12-mil-por-familia-nos-eua-aponta-estimativa/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-03T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estimativas indicam que a guerra no Irã aumentou significativamente o custo de vida nos Estados Unidos, com um aumento de quase R$ 12 mil por família. Isso comprometeu uma promessa feita pelo candidato Donald Trump durante a campanha eleitoral de 2024 de reduzir o alto custo de vida.", "titulo_pt": "Guerra no Irã aumentou custo de vida em quase R$ 12 mil por família nos EUA, aponta estudo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 242853, "titulo": "Trump anuncia fim de ajuda anual de US$ 4 bilhões a Israel", "url": "https://www.dw.com/pt-br/trump-anuncia-fim-de-ajuda-anual-de-us-4-bilhões-a-israel/a-79846151?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-03T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em um discurso no dia das eleições de meio de mandato, Trump anunciou o fim dos repasses anuais de 4 bilhões de dólares em ajuda militar e econômica para Israel. A comercialização de armamentos para o país continuará.", "titulo_pt": "Trump anuncia fim da ajuda anual de 4 bilhões de dólares a Israel", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 242633, "titulo": "Alemanha e Romênia relatam ataques hackers a supermercados; sobe para 11 o número de países atingidos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/11/alemanha-e-romenia-relatam-ataques-hackers-a-supermercados-sobe-para-11-o-numero-de-paises-atingidos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-03T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alemanha e Romênia relataram ataques de hackers em supermercados, elevando para 11 o número de países europeus afetados por ciberataques que expuseram a vulnerabilidade da rede de fornecimento de alimentos da União Europeia.", "titulo_pt": "Alemanha e Romênia relatam ataques hackers a supermercados; número de países afetados sobe para 11", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 243222, "titulo": "Russian strikes on Dnipro kill two, injure 20 others", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/3/russian-strikes-on-dnipro-kill-two-injure-20-others?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-03T17:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os bombardeios russos em Dnipro causaram danos em áreas residenciais e instalações médicas, resultando em duas mortes e 20 feridos.", "titulo_pt": "Bombardamentos russos em Dnipro deixam duas mortes e 20 feridos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 243223, "titulo": "South Carolina shrimpers weigh costs, vote in crucial US midterms", "url": "https://www.aljazeera.com/news/2026/11/3/south-carolina-shrimpers-weigh-costs-vote-in-crucial-us-midterms?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-03T17:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pescadores de camarão se preocupam com os cu ies, and more", "url": "https://www.statnews.com/pharmalot/2026/11/03/generic-hiv-prevention-shot-lonza-buying-facilities-in-us/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-03T14:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA concedeu uma aprovação provisória a Dr. Reddy’s Laboratories para produzir uma versão genérica de um medicamento revolucionário para a prevenção do HIV.", "titulo_pt": "Pharmalittle: recebemos aprovação provisória para genérico de medicamento revolucionário para prevenção do HIV", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 243446, "titulo": "Your voice can now say things you never said", "url": "https://www.sciencenews.org/article/voice-clone-deep-end-podcast", "fonte_id": "science_news", "data_pub": "2026-11-03T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vozes sintéticas podem restaurar a capacidade de falar, permitir fraudes e sobreviver aos seus proprietários. Essas aplicações levantam questões sobre confiança, consentimento e controle.", "titulo_pt": "Agora sua voz pode dizer coisas que você nunca disse", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 243447, "titulo": "A drug-free diabetes treatment? An implant lowers blood sugar in mice", "url": "https://www.sciencenews.org/article/diabetes-device-experiment-blood-sugar", "fonte_id": "science_news", "data_pub": "2026-11-03T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um implante sem medicamentos reduz os níveis de glicose no sangue de ratos e ajuda na perda de peso. Essa tecnologia poderia futuramente tratar diabetes e obesidade.", "titulo_pt": "Tratamento sem medicamentos para diabetes? Implante reduz glicose no sangue de ratos", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 243415, "titulo": "Child dies of measles in New York’s first such death in 30 years", "url": "https://www.statnews.com/2026/11/03/child-dies-measles-n  "metropoles", "data_pub": "2026-11-03T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Nacional de Meteorologia (Inmet) emitiu um alerta vermelho para a quarta-feira, 4 de novembro, para as cidades do Paraná devido a uma tempestade com potencialmente fortes ventos.", "titulo_pt": "Ciclone coloca cidades do Paraná sob alerta vermelho para tempestades", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 242854, "titulo": "Brasil lança plano de ação global para transição energética", "url": "https://www.dw.com/pt-br/brasil-lança-plano-de-ação-global-para-transição-energética/a-79845717?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-03T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil encerrou sua presidência no processo climático da ONU anunciando um plano de ação global para a transição energética, focado em conter o desmatamento e acelerar a descontinuação dos combustíveis fósseis, baseado em acordos já existentes.", "titulo_pt": "Brasil lança plano de ação global para transição energética", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 242798, "titulo": "Como saber se uma empresa cuida das pessoas e do meio ambiente", "url": "https://www.cnnbrasil.com.br/comportamento/casa-e-decoracao/como-saber-se-uma-empresa-cuida-das-pessoas-e-do-meio-ambiente/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-03T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Relatórios ASG, selos auditados e rankings independentes são ferramentas que ajudam a verificar a sustentabilidade ambiental e social de uma empresa através de indicadores verificáveis.", "titulo_pt": "Como saber se uma empresa cuida das pessoas e do meio ambiente", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 243463, "titulo": "UK climate minister Katie White: COP31 must respond to ‘really scary’ science", "url": "https://www.carbonbrief.org/uk-climate-minister-katie-white-cop31-must-respond-to-really-scary-science", "fonte_id": "carbon_brief", "data_pub": "2026-11-03T16:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ministra do Clima do Reino Unido, Katie White, afirmou que as próximas negociações climáticas COP31 em Antalya, Turquia, devem responder às últimas pesquisas sobre o aquecimento global, que são consideradas realmente assustadoras.", "titulo_pt": "Ministra do clima do reino unido: COP31 deve responder a ciência ‘realmente assustadora’ sobre o aquecimento global", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 242888, "titulo": "COP30 apresenta dois mapas do caminho para acelerar transição energética e combate ao desmatamento", "url": "https://www.jota.info/coberturas-especiais/matriz/cop30-apresenta-dois-mapas-do-caminho-para-acelerar-transicao-energetica-e-combate-ao-desmatamento", "fonte_id": "jota", "data_pub": "2026-11-03T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O COP30 apresentou dois mapas que propõem ações coordenadas para desacelerar a utilização de combustíveis fósseis no setor energético e para reverter a perda florestal até 2030.", "titulo_pt": "COP30 apresenta dois mapas para acelerar a transição energética e combater o desmatamento", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 243187, "titulo": "Flash floods devastate US Southwest, sweeping away homes and cars", "url": "https://www.euronews.com/video/2026/11/03/flash-floods-devastate-us-southwest-sweeping-away-homes-and-cars", "fonte_id": "euronews", "data_pub": "2026-11-03T14:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Inundações flash devastam o Sudoeste dos Estados Unidos, destruindo casas e deixando moradores isolados, obrigando centenas a evacuarem.", "titulo_pt": "Inundações em massa devastam sudoeste dos EUA, destruindo casas e forçando evacuações", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 243464, "titulo": "State of the climate: 2026 likely to tie with 2024 as the warmest year on record", "url": "https://www.carbonbrief.org/state-of-the-climate-2026-likely-to-tie-with-2024-as-the-warmest-year-on-record", "fonte_id": "carbon_brief", "data_pub": "2026-11-03T13:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com mais de três quartos do ano passados, é quase certo que 2026 será o ano mais quente ou o segundo mais quente na história. É altamente provável que 2026 se iguale ao ano de 2024 como o mais quente registrado.", "titulo_pt": "Estado do clima: 2026 provavelmente igualará 2024 como o ano mais quente da história", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 242980, "titulo": "Brazil publishes first global ‘roadmap’ for phasing out fossil fuels", "url": "https://www.theguardian.com/environment/2026/nov/03/brazil-first-global-roadmap-phasing-out-fossil-fuels", "fonte_id": "guardian_world", "data_pub": "2026-11-03T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Brasil lançou o primeiro roadmap global para a faseamento dos combustíveis fósseis, mostrando que os países podem iniciar a redução da dependência desses recursos sem aguardar novas tecnologias ou mudanças econômicas. O país, anfitrião da COP26 do ano anterior, apresentou o plano como parte de um esforço para passar do negociar para o implementar na conferência climática global.", "titulo_pt": "Brasil lança primeiro roadmap global para fasear combustíveis fósseis", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 242745, "titulo": "Entenda os mapas do caminho para fósseis e desmatamento apresentados pelo Brasil", "url": "https://exame.com/esg/entenda-os-mapas-do-caminho-para-fosseis-e-desmatamento-apresentados-pelo-brasil/", "fonte_id": "exame", "data_pub": "2026-11-03T12:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil apresentou mapas para atingir os compromissos de fósseis e desmatamento durante sua presidência da COP30. Esses documentos serão apresentados na COP31 na Turquia.", "titulo_pt": "Entenda os mapas do caminho para fósseis e desmatamento apresentados pelo Brasil", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 241973, "titulo": "Clima: país registra chuvas e temperaturas elevadas nesta terça; confira", "url": "https://www.metropoles.com/brasil/clima-pais-registra-chuvas-e-temperaturas-elevadas-nesta-terca-confira", "fonte_id": "metropoles", "data_pub": "2026-11-03T09:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Massas de ar úmido estão causando chuvas e temperaturas elevadas em várias regiões do país nesta terça-feira. Pancadas de chuva foram registradas em diversos pontos.", "titulo_pt": "Clima: país registra chuvas e temperaturas elevadas nesta terça; confira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 242285, "titulo": "Rhodes floods: Cars swept away after torrential rain in Greece", "url": "https://www.euronews.com/video/2026/11/03/rhodes-floods-cars-swept-away-after-torrential-rain-in-greece", "fonte_id": "euronews", "data_pub": "2026-11-03T07:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Águas de cheias levaram veículos e detritos pela cidade de Archangelos, em Rodas, danificando várias residências e estabelecimentos comerciais. Mais tempestades são esperadas.", "titulo_pt": "Cheias em rodas: veículos arrastados por enxurradas na Grécia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 242102, "titulo": "Overshoot: o aquecimento global acima de 1,5°C", "url": "https://www.jota.info/opiniao-e-analise/colunas/direito-e-clima/overshoot-o-aquecimento-global-acima-de-15c", "fonte_id": "jota", "data_pub": "2026-11-03T07:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O documento discute a meta de longo prazo do Acordo de Paris em relação ao aquecimento global. O título traduzido para português brasileiro é: 'O superaquecimento: o aquecimento global acima de 1,5°C'", "titulo_pt": "O superaquecimento: o aquecimento global acima de 1,5°C", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 241956, "titulo": "Aquecimento acima de 1,5°C pode provocar perda irreversível de geleiras, alerta estudo", "url": "https://exame.com/esg/aquecimento-acima-de-15c-pode-provocar-perda-irreversivel-de-geleiras-alerta-estudo/", "fonte_id": "exame", "data_pub": "2026-11-03T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo relatório da ONU e da ICCI indica que o derretimento das calotas polares está se acelerando, com a perda de gelo ocorrendo seis vezes mais rapidamente do que na década de 1990, mesmo que as temperaturas globais voltem a diminuir.", "titulo_pt": "Aquecimento acima de 1,5°C pode causar perda irreversível de geleiras, avisa estudo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 242257, "titulo": "'Super El Niño' continues to intensify: 'It has already reached unprecedented levels'", "url": "https://www.lemonde.fr/en/environment/article/2026/11/03/super-el-nino-continues-to-intensify-it-has-already-reached-unprecedented-levels_6769600_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-03T00:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O fenômeno natural cíclico 'Super El Niño' está intensificando e já atingiu níveis inéditos. Indicadores sugerem que uma grande ocorrência está por vir, com eventos climáticos extremos sendo disparados, como a declaração de estado de emergência no Bolívia no sábado.", "titulo_pt": "Super El Niño continua a intensificar: já atingiu níveis inéditos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 243279, "titulo": "Bureau outlines proposed changes to repression laws", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/04/200386 const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
