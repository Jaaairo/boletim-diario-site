</div>

<script>
const D = {"gerado_em": "28/10/2026 00:46", "stats": {"noticias_novas": 987, "resumos_gerados": 235}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Brasil retornou a uma situação considerada normal após Flávio Bolsonaro desistir de contestar o resultado das eleições. A direita, que perdeu por uma margem significativa, aceitou a derrota e voltou a se concentrar em outros assuntos. O presidente Lula venceu as eleições e agora precisa reconquistar a classe C, que optou por manter o presidente no cargo devido à rejeição ao adversário e à segurança de manter o status quo familiar. O governo Lula renovará o subsídio ao diesel no valor de R$ 2,12, medida que será a primeira a ser tomada sobre combustíveis após o resultado do segundo turno das eleições, sem alterar o impacto fiscal atual. Além disso, a sanção política preservada pelo STF na ADI 5.161 limitou a aplicação da multa, mas manteve a coerção, considerada incompatível com as garantias dos contribuintes. O setor de energias renováveis do Brasil espera uma retomada de investimentos em 2027 com o governo Lula, após enfrentar uma grave crise.", "mundo": "O Brasil assistiu à reeleição de Luiz Inácio Lula da Silva, que venceu a segunda volta das eleições presidenciais de forma inesperada, superando o candidato de extrema direita Flávio Bolsonaro. A bolsa de valores reagiu negativamente ao resultado, refletindo o impacto da vitória inesperada de Lula. Após a confirmação da reeleição, o número de brasileiros interessados em imigrar para os Estados Unidos aumentou significativamente. Em meio a essas notícias, Flávio Bolsonaro, derrotado nas eleições, viajou para os Estados Unidos, desobedecendo uma ordem judicial que determinava a entrega de seus passaportes. As eleições israelenses também foram históricas, com a aderência eleitoral atingindo o maior nível da história do país, e o bloco de Gadi Eisenkot liderando a oposição contra o bloco de Benjamin Netanyahu, sem uma clara vitória para nenhum dos lados. Além disso, o Reino Unido anunciou que o rei Charles irá discutir o legado da escravidão durante uma cúpula com líderes dos países do Commonwealth, iniciando uma visita ao Caribe.\n\nO Reino Unido registrou desenvolvimentos geopolíticos significativos, com dois homens sendo acusados de envolvimento com um incidente no RAF Fairford, supostamente relacionado ao Irã. No contexto mais amplo, o Canadá, sob a liderança do primeiro-ministro Mark Carney (não Justin Trudeau, que já deixou o cargo), busca fortalecer suas relações com a União Europeia, buscando um status de membro associado. Por outro lado, a China intensifica esforços para minar as relações entre Taiwan e os Estados Unidos. Taiwan, por sua vez, está intensificando medidas para evitar interferência chinesa nas eleições de 2026. O presidente dos Estados Unidos, Joe Biden, destacou a operação venezuelana durante um evento no Texas, enquanto o governo americano propôs a renovação das relações comerciais pós-guerra com a Rússia como parte das negociações para a paz na Ucrânia. A China também está utilizando a transferência da ilha de Taiwan para fins políticos e estratégicos, conforme relatado por um artigo. Além disso, o Irã e os países signatários do pacto de Mecca tiveram conversas consideradas muito produtivas, enquanto a Rússia e o Qatar chamaram pela diplomacia durante o conflito entre Estados Unidos e Irã.", "economia": "O Ibovespa registrou uma queda de 14,3% em dois dias, refletindo incertezas sobre a política econômica futura após a reeleição do presidente Luiz Inácio Lula da Silva. Durante a sessão, o dólar caiu 1%, mas a bolsa brasileira enfrentou uma forte correção. O Banco Central declarou que só intervirá no câmbio se identificar uma disfuncionalidade no mercado, reafirmando sua postura de não intervenção preventiva. O Tesouro Nacional anunciou a recompra de títulos do Tesouro Nacional Série B para conter as oscilações no mercado. Além disso, o relatório de estabilidade financeira do Banco Central destaca que o sistema financeiro mantém níveis confortáveis de capitalização e liquidez, apesar da deterioração dos indicadores de crédito das famílias.", "tecnologia": "A empresa Nvidia, liderada por Jensen Huang, participou recentemente do evento Nvidia AI Day em Seul, em 2026. A Nvidia intensificou sua presença na Coreia do Sul, focando em setores como robótica e manufatura. A SK hynix, empresa sul-coreana, registrou lucros recordes no terceiro trimestre, devido à alta demanda por chips de inteligência artificial, com suas ações subindo cerca de 6% na tarde de quarta-feira. O ex-presidente da Intel afirmou que a era da inteligência artificial durará mais de 20 anos, indicando que a tecnologia será uma força importante no cenário global por um período longo. Além disso, a Oracle está integrando o ChatGPT e o Codex da OpenAI em suas aplicações corporativas, enquanto a empresa Anthropic enfrenta pressões de investidores para realizar uma oferta inicial de ações (IPO) e manter sua missão central de desenvolver IA de maneira segura e para o benefício da humanidade.", "ciencia": "Um estudo computacional recriou os primeiros dois bilhões de anos do universo, oferecendo uma visão detalhada dos primeiros momentos após o Big Bang. O projeto, publicado em uma revista científica, produziu imagens e vídeos de alta qualidade que retratam a formação do cosmos. Em outro desenvolvimento, o Observatório Vera C. Rubin, localizado no Chile, pode ter descoberto o sexto planeta anão do sistema solar. Este achado poderia mudar nossa compreensão do sistema planetário. Além disso, a NASA convidou a mídia para participar do encerramento de uma simulação de missão à Marte, após 378 dias de isolamento. Quatro voluntários saíram de seu habitat no sábado, 31 de outubro. Os dados coletados podem auxiliar a agência espacial no desenvolvimento de métodos para futuras missões.", "cultura": "Ruy Castro conquistou seu segundo prêmio Jabuti consecutivo, tornando-se o primeiro autor a vencer a premiação duas vezes seguidas com 'Trincheira Tropical', que explora os efeitos da Segunda Guerra Mundial na vida dos cariocas. O The Pussycat Dolls realiza sua turnê 'PCD Forever' no Brasil, com apresentação agendada para o dia 30 no Nubank Parque. Em outro evento, Zeca Pagodinho, Alcione e Jorge Aragão se apresentam no estádio do Palmeiras em um show voltado ao samba. O Folha Gourmet Festival contará com uma área dedicada à degustação de queijos, azeites e embutidos produzidos por artesãos brasileiros, além de participação de 20 estabelecimentos gastronômicos renomados. O Prêmio Jabuti 2026 premiou autores em diversas categorias, incluindo uma nova categoria chamada Incentivo à Leitura - Cultura Digital, que reconhece criadores de conteúdo que promovem a leitura nas redes sociais. O documentário 'Moonage Daydream', dirigido por Brett Morgen, está remasterizando e exibindo em arenas gravações inéditas de dois shows do tour de 1978 de David Bowie, intitulado 'Moonage Daydream', que será apresentado em 2027. Tetsuya Chiba, lenda do mangá e autor de 'Ashita no Joe', faleceu aos 87 anos, deixando um legado duradouro para a indústria do mangá.", "sociedade": "Em Mato Grosso do Sul, indígenas denunciam ameaças e insultos discriminatórios após as eleições, com a Articulação dos Povos Indígenas do Brasil (APIB) apontando ações para impedir a votação. No estado de São Paulo, os pais de uma menina autista de 6 anos foram presos acusados de abandono de incapaz após a criança cair do 5º andar, ficando em estado grave. Em Corrientes, dois acusados foram colocados em prisão preventiva no caso do femicídio da docente Nanci Godoy. Na Zona Sul de São Paulo, um dentista denunciou importunação sexual em uma academia. No Chile, em Requínoa, o ministro Poduje visitou a área afetada por um tornado e anunciou um subsídio para as casas danificadas. A prefeita de Las Condes criticou o governo por sistemas de alerta e maquinaria insuficientes para enfrentar novas inundações. No Brasil, Penha e Alemão registraram mais de 1.800 tiroteios e 617 pessoas baleadas em dez anos, com a Operação Contenção em 2025 resultando em 122 mortos. No Chile, o Partido Verde pressiona o governo para alterar a legislação, permitindo um override humano no sistema de avaliação de cuidados para idosos. A Coreia do Sul revisará um manual utilizado para treinar trabalhadores migrantes após descobrir que aconselhava a 'evitar roupas reveladoras' para prevenir violência sexual. O presidente Lee Jae Myung sugeriu alternativas para acelerar o processo legislativo enquanto considera reduzir a idade de responsabilidade penal.", "meio_ambiente": "A seca na Amazônia, influenciada pelo fenômeno El Niño, está dificultando a navegação fluvial, levando os proprietários de navios a reduzir a quantidade de contêineres transportados. A Agência Nacional de Transportes Aquaviários (Antaq) registra restrições de navegação em vários trechos da região. Por outro lado, o governo dos Estados Unidos, sob a administração de Trump, planeja mudanças que enfraquecerão as regras de proteção contra vazamentos de metano, um gás de efeito estufa altamente potente, do setor de petróleo e gás natural. Em contraste, a geleira da Groenlândia registrou a 30ª perda consecutiva de gelo em um período de 12 meses, marcando a 30ª vez seguida de derretimento. No Reino Unido, as contas de energia têm continuado a aumentar, levantando debates sobre como reduzir essas tarifas. A ilha de Serua, na Fíji, rejeitou propostas de relocação devido ao perigo climático, enquanto o Bornéu enfrenta problemas de saúde respiratória devido a fumaça tóxica resultante de incêndios florestais.", "direitos_humanos": "Os direitos humanos à liberdade e à segurança pessoal estão sendo debatidos em vários casos ao redor do mundo. Em Esquel, na Argentina, Miguel Battista, de 71 anos, foi acusado de privação ilegítima de liberdade e abandono de pessoa, por ter mantido sua família em cárcere privado. Além disso, o cineasta iraniano Jafar Panahi foi condenado a cinco anos de prisão pelo Tribunal Revolucionário de Teerã, após lançar o filme 'Apenas um Acidente'. Em Gaza, Israel, um relatório da Comissão Independente Internacional de Inquérito da ONU afirma que o país continua a cometer genocídio no enclave após o cessar-fogo de outubro, brokerado pelos Estados Unidos. Estes casos refletem a violação contínua dos direitos humanos em diferentes partes do mundo, destacando a necessidade de uma vigilância constante e ações para proteger esses direitos fundamentais."}, "resumo_do_dia": {"politica_nacional": [{"id": 229920, "titulo": "Lula critica oponente e aliados falam em 'perseguição'", "url": "https://www.bbc.com/portuguese/articles/cm3vq7q59ne6o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-28T02:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados e oponentes de Flávio Bolsonaro, incluindo o presidente Lula, expressaram suas posições sobre a desaparição do senador. O presidente Lula criticou um oponente não especificado, enquanto outros falaram sobre uma possível perseguição.", "titulo_pt": "Lula critica oponente e aliados falam em 'perseguição'", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 229647, "titulo": "MPF arquiva denúncia de Nikolas Ferreira contra redator da lei das bets", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/mpf-arquiva-denuncia-de-nikolas-ferreira-contra-redator-da-lei-das-bets.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T02:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Nikolas Ferreira pediu ao Ministério Público Federal que investigasse o advogado José Francisco Manssur, autor da lei das apostas online, por suposto conflito de interesse. No entanto, a denúncia foi arquivada na última segunda-feira (26).", "titulo_pt": "MPF arquiva denúncia de Nikolas Ferreira contra redator da lei das bets", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 229931, "titulo": "A sanção política preservada pelo STF na ADI 5.161", "url": "https://www.jota.info/opiniao-e-analise/colunas/macrolitigancia-fiscal/a-sancao-politica-preservada-pelo-stf-na-adi-5-161", "fonte_id": "jota", "data_pub": "2026-10-28T02:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A interpretação conforme a lei limitou a aplicação da multa, mas manteve a coerção, considerada incompatível com as garantias dos contribuintes. O STF (Supremo Tribunal Federal) preservou a sanção política na ADI 5.161.", "titulo_pt": "A sanção política mantida pelo STF na ADI 5.161", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 229648, "titulo": "Câmara aprova ampliação de adicional de fronteira e eleva gasto do governo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/camara-aprova-ampliacao-de-adicional-de-fronteira-e-eleva-gasto-do-governo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T02:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados aprovou a ampliação do adicional de fronteira para novas carreiras públicas. O valor do adicional será reajustado de R$ 91 para R$ 191 por dia a partir de 2027.", "titulo_pt": "Câmara aprova ampliação do adicional de fronteira e aumenta gasto do governo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 229654, "titulo": "Bolsonaristas divulgam listas de boicote a empresas e falam em demitir petistas após reeleição de Lula", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/bolsonaristas-divulgam-listas-de-boicote-a-empresas-e-falam-em-demitir-petistas-apos-reeleicao-de-lula.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após a vitória de Lula nas eleições, bolsonaristas em redes sociais incentivaram a demissão de petistas e boicote a empresas que apoiaram Lula.", "titulo_pt": "Bolsonaristas incentivam demissões e boicote a empresas após vitória de Lula", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 229674, "titulo": "PT obtém melhor resultado no Sudeste desde 2010 e bolsonarismo perde força", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/pt-obtem-melhor-resultado-no-sudeste-desde-2010-e-bolsonarismo-perde-forca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PT obteve seu melhor desempenho para o segundo turno no Sudeste desde 2010. A vitória de Flávio Bolsonaro foi conquistada com uma margem menor de votos em comparação com eleições anteriores.", "titulo_pt": "PT obtém melhor resultado no segundo turno no Sudeste desde 2010 e bolsonarismo perde força", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 229675, "titulo": "O Brasil voltou ao normal", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/eliogaspari/2026/10/o-brasil-voltou-ao-normal.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil retornou a uma situação considerada normal após Flávio Bolsonaro desistir de contestar o resultado das eleições. A direita, que perdeu por uma margem significativa, parece ter aceitado a derrota e voltou a se concentrar em outros assuntos.", "titulo_pt": "Brasil retorna ao normal após desistência de flávio bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 229676, "titulo": "Esquerda internacional importa 'cartilha' de Janones e usa o 'L' como símbolo antiultradireita", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/esquerda-internacional-importa-cartilha-de-janones-e-usa-o-l-como-simbolo-antiultradireita.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Durante um comício da Frente Ampla em Madri antes do segundo turno, a catalã Ada Colau pediu ao público que levantasse o braço fazendo o símbolo do 'L' em apoio a Lula. A estratégia de utilizar o gesto, associada ao deputado brasileiro André Janones, tem sido adotada por setores da esquerda internacional como símbolo contra a ultradireita.", "titulo_pt": "Esquerda internacional importa cartilha de Janones e usa o 'L' como símbolo antiultradireita", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 229677, "titulo": "Abstenção cai em 80% dos municípios, com queda maior nas grandes cidades", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/abstencao-cai-em-80-dos-municipios-com-queda-maior-nas-grandes-cidades.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No último domingo, 4.442 municípios registraram queda na taxa de abstenção em comparação ao primeiro turno das eleições. O movimento representou um acréscimo de quase 3 milhões de eleitores que compareceram às urnas. Os votos adicionais vieram de diferentes origens, incluindo abstenções anteriores, votos brancos, nulos e eleitores de outros candidatos.", "titulo_pt": "Abstenção cai em 80% dos municípios, com queda maior nas grandes cidades", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 229678, "titulo": "Ministro do Trabalho rebate campanha por demissão de eleitores de Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/ministro-do-trabalho-rebate-campanha-por-demissao-de-eleitores-de-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Trabalho, Luiz Marinho, gravou um vídeo repudiando uma campanha de empresários que defendem a demissão de pessoas que votaram no presidente Lula.", "titulo_pt": "Ministro do Trabalho rebate campanha por demissão de eleitores de Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 229679, "titulo": "Fuga do Brasil dá base para prisão preventiva de Flávio Bolsonaro, dizem especialistas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/fuga-do-brasil-da-base-para-prisao-preventiva-de-flavio-bolsonaro-dizem-especialistas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas consultados pela Folha de São Paulo afirmam que a fuga de Flávio Bolsonaro do Brasil pode ser usado como base para a decretação de prisão preventiva. A informação foi publicada em 27 de outubro de 2026.", "titulo_pt": "Fuga do Brasil pode fundamentar prisão preventiva de Flávio Bolsonaro, dizem especialistas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 229680, "titulo": "Janones se diz estrategista digital por acaso e faz das redes e do caos sua sobrevivência na política", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/janones-se-diz-estrategista-digital-por-acaso-e-faz-das-redes-e-do-caos-sua-sobrevivencia-na-politica.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "André Janones, deputado federal eleito em 2018 pelo Avante, não entende como se tornou um estrategista digital, apesar de usar as redes sociais para auxiliar caminhoneiros durante uma greve.", "titulo_pt": "Janones se diz estrategista digital por acaso", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 229681, "titulo": "Rafael Fonteles, cotado para ministro, foi de prodígio da matemática a gestor pragmático da esquerda", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/rafael-fonteles-cotado-para-ministro-foi-de-prodigio-da-matematica-a-gestor-pragmatico-da-esquerda.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rafael Fonteles, reeleito governador do Piauí, comemorou sua vitória com bebida, dança e críticas ao adversário derrotado Ciro Nogueira. Ele é considerado um possível nome para um ministério da esquerda.", "titulo_pt": "Rafael Fonteles, cotado para ministro, foi de prodígio da matemática a gestor pragmático da esquerda", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 229682, "titulo": "Lula ganhou a eleição e agora precisa reconquistar a classe C", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/lula-ganhou-a-eleicao-e-agora-precisa-reconquistar-a-classe-c.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula venceu a eleição. Durante 25 anos, ele ouviu os brasileiros e percebeu que, mesmo descontentes com o governo, muitos da classe C optaram por manter o presidente em cargo. Isso ocorreu devido à rejeição ao adversário e à segurança de manter o status quo familiar.", "titulo_pt": "Lula venceu a eleição e agora precisa reconquistar a classe C", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 229849, "titulo": "Vídeo da CNN é adulterado com fake news sobre fim do Bolsa Família", "url": "https://www.cnnbrasil.com.br/eleicoes/video-da-cnn-e-adulterado-com-fake-news-sobre-fim-do-bolsa-familia/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-28T01:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um vídeo publicado em redes sociais distorceu uma reportagem da CNN Brasil sobre a regra de transição do Bolsa Família para famílias que aumentaram a renda.", "titulo_pt": "Vídeo publicado em redes sociais distorce reportagem sobre regra de transição do Bolsa Família", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 229804, "titulo": "Câmara aprova alta de 110% no adicional de fronteira pago a servidores", "url": "https://www.metropoles.com/brasil/camara-aprova-alta-de-110-no-adicional-de-fronteira-pago-a-servidores", "fonte_id": "metropoles", "data_pub": "2026-10-28T01:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A câmara dos deputados aprovou um aumento de 110% no adicional de fronteira pago a servidores públicos, elevando o valor da indenização de R$ 91 para R$ 191 por dia. A medida também amplia os beneficiários e precisa ser votada pelo Senado até o próximo dia 30 de outubro.", "titulo_pt": "Câmara aprova aumento de 110% no adicional de fronteira pago a servidores", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 230286, "titulo": "Netanyahu: Coalition with Arab parties would be ‘shameful’", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/28/netanyahu-coalition-with-arab-parties-would-be?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-28T02:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro israelense Benjamin Netanyahu classificou a possibilidade de formar uma coalizao governamental com partidos arabes como vergonhosa. A declaracao ocorre em meio a discussoes politicas sobre a formacao de um novo governo no pais.", "titulo_pt": "Netanyahu: coalizao com partidos arabes seria vergonhosa", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 230328, "titulo": "Two men charged in U.K. over RAF Fairford incident allegedly linked to Iran", "url": "https://www.japantimes.co.jp/news/2026/10/28/world/crime-legal/uk-raf-fairford-iran/", "fonte_id": "japan_times", "data_pub": "2026-10-28T02:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois homens foram acusados no Reino Unido em relação ao incidente de RAF Fairford, supostamente ligado à Irã. Um base militar havia sido usado por bombardeiros dos Estados Unidos para ataques na Irã, mas eles foram retirados imediatamente após a detenção de cinco homens britânicos perto da base.", "titulo_pt": "Dois homens são acusados no reino unido em relação ao incidente de RAF Fairford supostamente ligado à Irã", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 230329, "titulo": "Japan and U.S. defense chiefs discuss munitions production and ‘denial’ strategy", "url": "https://www.japantimes.co.jp/news/2026/10/28/japan/us-japan-koizumi-hegseth-asean/", "fonte_id": "japan_times", "data_pub": "2026-10-28T02:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da defesa dos Estados Unidos destacou investimentos crescentes, maior acesso, treinamento mais realista e uma produção mais robusta de munições necessárias para as forças.", "titulo_pt": "Chefe da defesa dos EUA e chefe de defesa do Japão discutem produção de munições e estratégia de 'denial'", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 229672, "titulo": "O Impa na China", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/colunas/marceloviana/2026/10/o-impa-na-china.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O autor descreveu uma viagem de mais de 24 horas que culminou no aeroporto internacional de Pequim em 19 de dezembro de 2026, às 6h da manhã, para uma visita de trabalho. Ele refletiu sobre as mudanças significativas que Pequim e a China experimentaram nas últimas três décadas desde a sua primeira visita ao país.", "titulo_pt": "O Impa na China", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 230418, "titulo": "Carney reshapes Canada’s alliances as US ties strain", "url": "https://www.koreaherald.com/article/10917354", "fonte_id": "korea_herald", "data_pub": "2026-10-28T01:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Canadá, Mark Carney, busca laços sem precedentes com a União Europeia durante uma cúpula nesta semana, incluindo a possível criação de um status de membro associado. A movimentação faz parte de um plano para reposicionar a posição geopolítica do Canadá no mundo em resposta às pressões do presidente dos Estados Unidos, Donald Trump.", "titulo_pt": "Carney remodela as alianças do canadá com o enfraquecimento dos laços com os EUA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 230187, "titulo": "India evacuates tens of thousands as Cyclone Arnab makes landfall", "url": "https://www.lemonde.fr/en/india/article/2026/10/28/india-evacuates-tens-of-thousands-as-cyclone-arnab-makes-landfall_6765642_168.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-28T01:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades indianas ordenaram que milhares de pessoas se mudassem para áreas mais seguras ou se abrigassem nos estados de Andhra Pradesh e Odisha em face do ciclone Arnab. Sri Lanka e Nepal também emitiram avisos meteorológicos.", "titulo_pt": "Índia evacua centenas de milhares ante o ciclone Arnab", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 230182, "titulo": "Israeli elections: Exit polls show no clear winner as Netanyahu and Eisenkot both vow to form a government", "url": "https://www.lemonde.fr/en/international/article/2026/10/28/israeli-elections-exit-polls-show-no-clear-winner-as-netanyahu-and-opposition-bloc-neck-and-neck_6765641_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-28T01:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As projeções sugerem que nem o bloco de Netanyahu nem seus adversários conseguiram uma maioria parlamentar. As maiores conquistas vieram das partidos árabes israelenses, cujos eleitores compareceram em grande número contra Netanyahu, potencialmente tornando-se os detentores do poder de decisão.", "titulo_pt": "Eleições israelenses: projeções indicam que nem Netanyahu nem seus adversários têm maioria clara", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 230438, "titulo": "Former USFK commanders raise concerns over command structure after OPCON transfer", "url": "https://en.yna.co.kr/view/AEN20261028003800315", "fonte_id": "yonhap_news", "data_pub": "2026-10-28T01:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois ex-comandantes das Forças Armadas dos Estados Unidos na Coreia do Sul expressaram preocupações sobre a estrutura de comando após a transferência de OPCON (Operational Control).", "titulo_pt": "Ex-comandantes das forças armadas dos EUA na Coreia do sul levantam preocupações sobre a estrutura de comando após a transferência de OPCON", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 230333, "titulo": "U.S. agency is again probing if Polymarket broke 2022 settlement, sources say", "url": "https://www.japantimes.co.jp/business/2026/10/28/tech/us-polymarket-2022-settlement/", "fonte_id": "japan_times", "data_pub": "2026-10-28T01:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência dos Estados Unidos está novamente investigando se a Polymarket violou o acordo de 2022, focando em seus controles para determinar a localização dos clientes e suas atividades publicitárias no país.", "titulo_pt": "Agência dos EUA investiga Polymarket por possível violação de acordo de 2022", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 230485, "titulo": "Manila speaks with 2 voices on China", "url": "https://www.scmp.com/opinion/asia-opinion/article/3372147/manila-speaks-2-voices-china", "fonte_id": "scmp", "data_pub": "2026-10-28T01:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 13 de outubro, Manila enviou mensagens contraditórias para Pequim: a vice-presidente afirmou que as relações diplomáticas e econômicas com China devem ser mantidas, enquanto o secretário de Defesa do Philippine rejeitou a ideia de comunicação militar com China, com o apoio público do Exército Filipino.", "titulo_pt": "Manila fala com duas vozes para beijing", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 230184, "titulo": "How Chinese 'toxic loans' fueled Zambia's debt spiral", "url": "https://www.lemonde.fr/en/les-decodeurs/article/2026/10/28/how-chinese-toxic-loans-fueled-zambia-s-debt-spiral_6765640_8.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-28T01:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Documentos bancários confidenciais revelam que empréstimos do Banco Industrial e Comercial da China sufocaram financeiramente a nação africana Zâmbia.", "titulo_pt": "Como empréstimos chineses 'tóxicos' alimentaram a escalada da dívida da zâmbia", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 230341, "titulo": "Kylian Mbappe issues apology amid fury in China over ‘dictator’ comment", "url": "https://www.japantimes.co.jp/sports/2026/10/28/soccer/mbappe-defuse-anger-china/", "fonte_id": "japan_times", "data_pub": "2026-10-28T00:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kylian Mbappé se retratou após causar fúria na China com um comentário sobre um ditador. O incidente evidenciou os riscos enfrentados por atletas e marcas no mercado lucrativo chinês, onde sátiras sobre Mao Zedong, líder fundador moderno da China, são proibidas.", "titulo_pt": "Kylian mbappé se retrata após comentário sobre ditador na China", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 230342, "titulo": "U.S. to give visa to Brazilian election loser Bolsonaro", "url": "https://www.japantimes.co.jp/news/2026/10/28/world/politics/us-visa-brazil-election-bolsonaro/", "fonte_id": "japan_times", "data_pub": "2026-10-28T00:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-candidato presidencial Jair Bolsonaro está em viagem para os Estados Unidos após sua derrota para o presidente em exercício Luiz Inácio Lula da Silva no Brasil.", "titulo_pt": "EUA concederá visto ao perdedor das eleições brasileiras Bolsonaro", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 229921, "titulo": "Relação entre Trump e Lula pode azedar mais com acolhimento ao senador?", "url": "https://www.bbc.com/portuguese/articles/cm3vq700565wo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-28T00:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um alto funcionário do governo Trump informou que o Departamento de Estado vai oferecer um visto a Flávio Bolsonaro e sua família. A relação entre Trump e Lula pode se deteriorar com essa decisão.", "titulo_pt": "Relação entre Trump e Lula pode se complicar com acolhimento de flávio bolsonaro?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 230443, "titulo": "Lee warns against 'irresponsible extremism' jeopardizing reforms", "url": "https://en.yna.co.kr/view/AEN20261028002000315", "fonte_id": "yonhap_news", "data_pub": "2026-10-28T00:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung advertiu contra o 'extremismo irresponsável' que pode comprometer as reformas em curso. A declaração foi feita em Seul no dia 28 de outubro.", "titulo_pt": "Lee alerta contra 'extremismo irresponsável' ameaçando reformas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 230183, "titulo": "France 2030: Macron's ambitious investment plan faces a 'budget wall,' Court of Auditors warns", "url": "https://www.lemonde.fr/en/economy/article/2026/10/28/france-2030-macron-s-ambitious-investment-plan-faces-a-budget-wall-court-of-auditors-warns_6765607_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-28T00:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O plano de desenvolvimento de destaque lançado em 2021 sem suficiente reflexão e implementado rapidamente está enfrentando severas restrições financeiras. Existem riscos de que os fundos públicos não sejam suficientes para viabilizar as inúmeras investidas já decididas.", "titulo_pt": "França 2030: plano ambicioso de investimento de macron enfrenta 'paredão orçamentário', avisa o tribunal de contas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 230268, "titulo": "Labubu-maker Pop Mart's shares extend declines as third-quarter sales plunge", "url": "https://www.cnbc.com/2026/10/28/labubu-pop-mart-third-quarter-earnings.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-28T02:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas trimestrais da Pop Mart, empresa que produz bonecos Labubu, caíram cerca de 45% a 50% em comparação com o mesmo período do ano anterior.", "titulo_pt": "Ações da Pop Mart continuam em baixa após queda significativa nas vendas trimestrais", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 230114, "titulo": "Australia’s inflation rate rises to 4.3%, fuelling fears of fifth interest rate hike this year", "url": "https://www.theguardian.com/australia-news/2026/oct/28/inflation-rate-australia-2026-number-data-consumer-price-index-cpi-release", "fonte_id": "guardian_world", "data_pub": "2026-10-28T02:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A taxa de inflação da Austrália aumentou para 4,3%, elevando as expectativas de um novo aumento de juros da Reserva da Austrália na próxima semana. O índice preferido de inflação chamado inflação subyacente, calculado pelo Banco Reservista da Austrália, registrou um aumento anual de 3,6% até setembro.", "titulo_pt": "Taxa de inflação da austrália sobe para 4,3%, aumentando expectativas de novo aumento de juros", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 229651, "titulo": "Correios obtêm garantia do Tesouro para novo empréstimo de R$ 7 bi", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/correios-obtem-garantia-do-tesouro-para-novo-emprestimo-de-r-7-bi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Fazenda aprovou a concessão de garantia do Tesouro Nacional para um empréstimo de R$ 7 bilhões solicitado pelos Correios. Essa garantia torna a operação mais atrativa para os bancos, pois a União se compromete a honrar os pagamentos em caso de inadimplência da estatal.", "titulo_pt": "Correios recebem garantia do Tesouro para empréstimo de R$ 7 bi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 229653, "titulo": "A nova fronteira das pequenas usinas nucleares", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/jerson-kelman/2026/10/a-nova-fronteira-das-pequenas-usinas-nucleares.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Depois do acidente de Fukushima, a indústria nuclear voltou à pauta devido ao interesse em fontes de energia que não emitam gases de efeito estufa e sejam despacháveis, como as usinas nucleares pequenas.", "titulo_pt": "A nova fronteira das pequenas usinas nucleares", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 230264, "titulo": "SK Hynix shares soar over 8% as profit beats, chipmaker to return $25 billion to investors", "url": "https://www.cnbc.com/2026/10/28/sk-hynix-third-quarter-profit.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-28T01:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da SK Hynix, fabricante sul-coreano de chips, subiram mais de 8% na sessão de terça-feira após o lucro do terceiro trimestre superar as estimativas. A empresa também anunciou que retornará US$ 25 bilhões aos investidores.", "titulo_pt": "Ações da SK Hynix sobem mais de 8% com lucro superior às estimativas e anúncio de retorno de us$ 25 bilhões aos investidores", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 229655, "titulo": "Bancada do Nordeste na Câmara salva MP do governo e emplaca R$ 270 mi em subvenção de cana-de-açúcar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/bancada-do-nordeste-na-camara-salva-mp-do-governo-e-emplaca-r-270-mi-em-subvencao-de-cana-de-acucar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T01:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados aprovou um projeto de lei que concede subvenção a produtores de cana-de-açúcar do Nordeste afetados pelo tarifaço dos Estados Unidos ou por eventos climáticos extremos. O texto será encaminhado ao Senado.", "titulo_pt": "Bancada do Nordeste na Câmara aprova subvenção de R$ 270 mi em cana-de-açúcar", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 230334, "titulo": "Hedge funds gear up for Japan’s $60 billion Topix revamp trade", "url": "https://www.japantimes.co.jp/business/2026/10/28/markets/hedge-funds-topix-revamp/", "fonte_id": "japan_times", "data_pub": "2026-10-28T01:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma reorganização que afetará mais de 700 ações está prevista para gerar cerca de 60 bilhões de dólares em negócios passivos na fechamento de quinta-feira.", "titulo_pt": "Hedge funds se preparam para negociação de 60 bilhões de dólares na revista do Topix", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 229656, "titulo": "Ministério da Agricultura identifica terceiro foco da doença de Newcastle em Santa Catarina", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/10/ministerio-da-agricultura-identifica-terceiro-foco-da-doenca-de-newcastle-em-santa-catarina.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T01:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Agricultura identificou um novo foco da doença de Newcastle em uma propriedade avícola em Nova Erechim, Santa Catarina. Este caso foi detectado dentro da área de emergência sanitária estabelecida na região.", "titulo_pt": "Ministério da Agricultura identifica terceiro foco da doença de Newcastle em Santa Catarina", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 229657, "titulo": "Caneta emagrecedora faz lucro da Hypera Pharma subir 16,1% no 3º trimestre", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/caneta-emagrecedora-faz-lucro-da-hypera-pharma-subir-161-no-3o-trimestre.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T00:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A farmacêutica Hypera Pharma registrou um lucro líquido de R$ 527 milhões no terceiro trimestre de 2026, aumento de 16,1% em comparação com o mesmo período do ano anterior.", "titulo_pt": "Caneta emagrecedora faz lucro da Hypera Pharma subir 16,1% no 3º trimestre", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 230373, "titulo": "CXMT reportedly prioritizes China demand, rejecting Apple's DRAM inquiry", "url": "https://www.digitimes.com/news/a20261027PD238/cxmt-apple-dram-demand-capacity.html", "fonte_id": "digitimes", "data_pub": "2026-10-28T00:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fabricante chinesa de memórias CXMT teria rejeitado uma consulta da Apple sobre a compra de DRAM, priorizando o fornecimento para clientes domésticos. Diante da escassez global de suprimentos de memória e da elevação dos preços, a alocação de capacidade da fabricante chinesa e os esforços das empresas para garantir o suprimento têm chamado atenção.", "titulo_pt": "CXMT teria rejeitado consulta da Apple sobre DRAM, priorizando clientes domésticos", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 230271, "titulo": "Chart: Anthropic's cash pile towers over nearly every U.S. company", "url": "https://www.cnbc.com/2026/10/27/anthropic-cash-investments-ipo.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-27T23:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A reserva de caixa da Anthropic é de US$ 131,7 bilhões, superando praticamente todas as empresas não-bancárias dos Estados Unidos, com exceção da Berkshire Hathaway e da Alphabet.", "titulo_pt": "Gráfico: pilha de caixa da anthropic supera quase todas as empresas não-bancárias dos EUA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 229660, "titulo": "Após forte alta, preço do trigo recua no mercado internacional", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/vaivem/2026/10/apos-forte-alta-preco-do-trigo-recua-no-mercado-internacional.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T23:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O preço do trigo está em queda no mercado internacional e no brasileiro após uma forte alta recente. Em Chicago, o contrato de dezembro do trigo caiu para US$ 6,10 por bushel, após atingir US$ 7,04. No Brasil, os preços mostram estabilidade, com a tonelada negociada a R$ 1.564 no Paraná.", "titulo_pt": "Preço do trigo recua após forte alta no mercado internacional e brasileiro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 229933, "titulo": "Aneel aprova editais dos primeiros leilões de baterias do Brasil", "url": "https://www.jota.info/energia/aneel-aprova-editais-dos-primeiros-leiloes-de-baterias-do-brasil", "fonte_id": "jota", "data_pub": "2026-10-27T22:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Aneel aprovou os editais para os primeiros leilões de baterias do Brasil, que terão contratos de 15 anos e começam em 1º de agosto de 2028. Os certames estão previstos para serem realizados em 2 e 4 de dezembro.", "titulo_pt": "Aneel aprova editais dos primeiros leilões de baterias do Brasil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 229662, "titulo": "Ações da Boeing despencam 10% após redução de meta de entregas do 737", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/25/6568-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post467992", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T22:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações da Boeing caíram 10%, atingindo o menor nível em 18 meses, após a empresa reduzir a meta de entregas do 737 devido a dificuldades na produção.", "titulo_pt": "Ações da Boeing despencam 10% após redução de meta de entregas do 737", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 230274, "titulo": "AI debt fears ease ahead of Oracle, Alphabet and Amazon updates. Here's what to watch.", "url": "https://www.cnbc.com/2026/10/27/ai-debt-hyperscaler-earnings.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-27T21:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As bolsas de crédito estarão atentas às atualizações de Oracle e outras grandes provedoras de serviços de nuvem na próxima semana. As empresas serão avaliadas em termos de suas estratégias e desempenho financeiro.", "titulo_pt": "Medos de dívidas com AI diminuem com atualizações de Oracle, Alphabet e Amazon", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 229768, "titulo": "Dólar cai quase 1%, e Ibovespa recua após tombo eleitoral", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/dolar-cai-quase-1-e-ibovespa-recua-apos-tombo-eleitoral", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-27T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar caiu quase 1% e o Ibovespa recuou cerca de 0,5% após a reeleição de Lula. A sessão foi marcada por correção cambial e perdas na bolsa devido à incerteza sobre a política econômica futura.", "titulo_pt": "Dólar cai e Ibovespa recua após reeleição de lula", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 230409, "titulo": "Nvidia's Madison Huang returns to Seoul amid physical AI push", "url": "https://www.koreaherald.com/article/10917506", "fonte_id": "korea_herald", "data_pub": "2026-10-28T02:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Madison Huang, diretora sênior de marketing de produto da Nvidia para Omniverse e robótica, visitara Seul no proximo mes. Ela participara do evento Nvidia AI Day Seoul 2026 em novembro e se reunira com lideres do setor. Esta sera a sua quarta visita a Coreia do Sul, refletindo o foco da empresa nos setores de robotica e manufatura.", "titulo_pt": "Madison Huang, da nvidia, retorna a seul em meio ao avanco da inteligencia artificial fisica", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 230436, "titulo": "Seoul stocks up nearly 6 pct Wed. morning on SK hynix earnings", "url": "https://en.yna.co.kr/view/AEN20261028005500320", "fonte_id": "yonhap_news", "data_pub": "2026-10-28T02:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações sul-coreanas subiram cerca de 6% na tarde de quarta-feira, impulsionadas pelos resultados financeiros do SK hynix.", "titulo_pt": "Ações sul-coreanas avançam 6% na tarde de quarta-feira, impulsionadas por resultados do SK hynix", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 230480, "titulo": "‘Chinese can actually fly’: man pilots homemade hoverboard over mountains, across Yangtze River", "url": "https://www.scmp.com/news/people-culture/china-personalities/article/3372367/chinese-can-actually-fly-man-pilots-homemade-hoverboard-over-mountains-across-yangtze-river", "fonte_id": "scmp", "data_pub": "2026-10-28T02:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um influenciador digital de 26 anos construiu artesanalmente um hoverboard tripulado na China. Ele aprendeu engenharia mecânica e controle de voo por conta própria para pilotar o dispositivo sobre montanhas e cruzar o rio Yangtze em um vídeo publicado em outubro.", "titulo_pt": "Chines realmente pode voar: homem pilota hoverboard artesanal sobre montanhas e cruza o rio Yangtze", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 230331, "titulo": "Mercedes’ investment in Kimi Antonelli paying off after Ferrari said no", "url": "https://www.japantimes.co.jp/sports/2026/10/28/more-sports/mercedes-antonelli-ferrari-loss/", "fonte_id": "japan_times", "data_pub": "2026-10-28T01:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kimi Antonelli está prestes a se tornar o primeiro campeão de Fórmula 1 da Itália em 73 anos. A Mercedes está obtendo bons resultados com sua investimento em Antonelli, após o Ferrari recusar-se a trabalhar com ele.", "titulo_pt": "Investimento da mercedes em Kimi Antonelli prestes a dar frutos após Ferrari recusar-se a trabalhar com ele", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 230439, "titulo": "(3rd LD) SK hynix logs record profit in Q3 on AI chip supercycle", "url": "https://en.yna.co.kr/view/AEN20261028001653320", "fonte_id": "yonhap_news", "data_pub": "2026-10-28T01:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SK hynix informou que registrou lucros recordes no terceiro trimestre devido a uma superciclo da demanda por chips de inteligência artificial. A empresa divulgou os resultados financeiros na cidade de Seul em 28 de outubro.", "titulo_pt": "SK hynix registra lucros recordes no terceiro trimestre devido à superciclo de chips de IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 230420, "titulo": "State arms agency completes development of homegrown Marine attack helicopter", "url": "https://www.koreaherald.com/article/10917312", "fonte_id": "korea_herald", "data_pub": "2026-10-28T01:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul concluiu o desenvolvimento de um helicóptero de ataque marítimo nacional, equipado com uma variedade de sistemas de armas, incluindo mísseis terra-ar, para operações amphibias multidimensionais. O helicóptero é baseado na versão naval do KUH-1 Surion, chamado MUH-1 Marineon, com novas características e sistemas de armas para combater ataques de helicópteros e drones inimigos.", "titulo_pt": "Agência de armas do estado conclui desenvolvimento de helicóptero de ataque marítimo nacional", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 230285, "titulo": "SK Hynix profits soar amid roaring AI chip demand", "url": "https://www.ft.com/content/44c35ed7-aa46-4d45-91f5-2773f00ae6be", "fonte_id": "financial_times", "data_pub": "2026-10-28T01:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SK Hynix, empresa sul-coreana, registrou lucro operacional superior às expectativas para o terceiro trimestre e anunciou a compra de ações. O aumento do pedido de chips para inteligência artificial contribuiu para os resultados positivos.", "titulo_pt": "Lucros da SK Hynix disparam diante da alta demanda por chips de IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 230442, "titulo": "(LEAD) Seoul stocks open sharply higher on revived AI optimism, SK hynix earnings", "url": "https://en.yna.co.kr/view/AEN20261028001851320", "fonte_id": "yonhap_news", "data_pub": "2026-10-28T00:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações sul-coreanas abriram com forte alta na sessão de terça-feira, impulsionadas pela recuperação da optimismo em relação à inteligência artificial e pelos resultados positivos da SK hynix.", "titulo_pt": "Seoul stocks abrem com forte alta com optimismo renovado em AI e resultados da SK hynix", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 230444, "titulo": "Personal data of some 38,000 customers at Daishin Securities leaked", "url": "https://en.yna.co.kr/view/AEN20261028002700320", "fonte_id": "yonhap_news", "data_pub": "2026-10-28T00:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foi revelada a informação pessoal de aproximadamente 38.490 clientes da Daishin Securities.", "titulo_pt": "Dados pessoais de cerca de 38.490 clientes da Daishin Securities vazados", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 230445, "titulo": "Gov't to carry out large-scale inspections into IT infrastructures amid recent hacking attacks", "url": "https://en.yna.co.kr/view/AEN20261028002100320", "fonte_id": "yonhap_news", "data_pub": "2026-10-28T00:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo planeja realizar inspeções em larga escala nas infraestruturas de tecnologia da informação devido a ataques recentes de hacking.", "titulo_pt": "Governo vai realizar inspeções em larga escala nas infraestruturas de tecnologia da informação após ataques de hacking", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 230398, "titulo": "Government studying ways to compensate creators whose work is used to train AI", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/28/2003866756", "fonte_id": "taipei_times", "data_pub": "2026-10-28T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo está estudando maneiras de compensar criadores cujo trabalho é usado para treinar inteligência artificial.", "titulo_pt": "Governo estuda compensar criadores cujo trabalho é usado para treinar IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 230404, "titulo": "AI cycle to last over 20 years: ex-Intel CEO", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/28/2003866718", "fonte_id": "taipei_times", "data_pub": "2026-10-28T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente da Intel afirmou que a era da inteligência artificial vai durar mais de 20 anos. Este pronunciamento sugere que a tecnologia de IA continuará a ser uma força importante no cenário tecnológico global por um período prolongado de tempo.", "titulo_pt": "Período de inteligência artificial durará mais de 20 anos, afirma ex-presidente da intel", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 230490, "titulo": "China’s battery factories could be sitting right on top of vast lithium deposits", "url": "https://www.scmp.com/news/china/science/article/3372325/chinas-battery-factories-could-be-sitting-right-top-vast-lithium-deposits", "fonte_id": "scmp", "data_pub": "2026-10-28T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo sugere que depósitos de litio formados por atividade vulcânica antiga podem existir sob partes do coração industrial de fabricação de baterias da China, especialmente na costa sudeste. Esses depósitos podem se sobrepor a clusters industriais de baterias em regiões leste e sudeste do país, o que poderia reduzir significativamente custos de transporte e riscos de cadeia de suprimentos.", "titulo_pt": "Fábricas de baterias da china podem estar sobre grandes depósitos de litio", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 229789, "titulo": "Trump anuncia que irá proibir o termo ‘Inteligência Artificial’; entenda", "url": "https://veja.abril.com.br/mundo/trump-anuncia-que-ira-proibir-o-termo-inteligencia-artificial-entenda/", "fonte_id": "veja", "data_pub": "2026-10-27T22:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos anunciou a intenção de proibir o uso do termo Inteligencia Artificial. Ele alega que a definicao Super Inteligencia e mais adequada para descrever a tecnologia. A medida foi divulgada recentemente.", "titulo_pt": "Trump anuncia que ira proibir o termo inteligencia Artificial; entenda", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 230448, "titulo": "China's top-secret spaceplane can't hide in low-Earth orbit", "url": "https://arstechnica.com/space/2026/10/chinas-top-secret-spaceplane-cant-hide-in-low-earth-orbit/", "fonte_id": "ars_technica", "data_pub": "2026-10-27T22:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório de avaliação de ameaças do DIA sugere que a China pode em breve colocar armas de energia direcionada no espaço.", "titulo_pt": "China's top-secret spaceplane can't hide em órbita baixa", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 230275, "titulo": "Walmart says AI training is boosting confidence with the technology among its 2.1 million associates", "url": "https://www.cnbc.com/2026/10/27/walmart-ai-training-workers.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-27T21:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Walmart afirmou que o treinamento em inteligencia artificial fornecido por empresas como OpenAI e Google esta aumentando a confianca de seus 2,1 milhoes de funcionarios. A iniciativa visa capacitar os trabalhadores no uso de ferramentas digitais e tecnologias avancadas no ambiente de trabalho.", "titulo_pt": "Walmart diz que treinamento em IA esta aumentando a confianca na tecnologia entre seus 2,1 milhoes de funcionarios", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 230529, "titulo": "New election forecast updates predictions every 10 minutes", "url": "https://phys.org/news/2026-10-election-minutes.html", "fonte_id": "phys_org", "data_pub": "2026-10-28T02:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A batalha pelo controle do Senado dos Estados Unidos está se desenrolando em 35 estados, desde o Alasca até o Texas. Um novo modelo de previsão eleitoral da Northwestern University está atualizando as previsões a cada 10 minutos.", "titulo_pt": "Novo modelo de previsão eleitoral atualiza previsões a cada 10 minutos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 230530, "titulo": "Halloween meets history in many ghostly tourism attractions. Is this a problem?", "url": "https://phys.org/news/2026-10-halloween-history-ghostly-tourism-problem.html", "fonte_id": "phys_org", "data_pub": "2026-10-28T02:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Halloween, feriado de outono e indústria com faturamento de $13,5 bilhões, se aproxima. Muitos destinos de turismo fantasmagórico combinam Halloween com a história local, criando atrações assustadoras e educativas.", "titulo_pt": "Halloween se encontra com a história em muitas atrações turísticas assustadoras. É um problema?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 230531, "titulo": "Brambles are a problem weed in South Africa, but researchers are closer to finding a natural enemy to manage them", "url": "https://phys.org/news/2026-10-brambles-problem-weed-south-africa.html", "fonte_id": "phys_org", "data_pub": "2026-10-28T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bramble ervas daninhas invasoras têm se espalhado pelo sul da África desde o início do século XX, vindo de Norte América e Europa. Essas ervas pertencem à gênero Rubus e são conhecidas como braam em afrikano, ijingijolo em isiZulu e monoko-metsi em seSotho.", "titulo_pt": "Bramble: um inimigo natural está mais próximo para controlar essas ervas daninhas na áfrica do sul", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 230532, "titulo": "Researchers produce urea in the field using system powered by biobatteries and solar energy", "url": "https://phys.org/news/2026-10-urea-field-powered-biobatteries-solar.html", "fonte_id": "phys_org", "data_pub": "2026-10-28T01:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O projeto CONFETI, coordenado pela Universitat Autònoma de Barcelona (UAB), concluiu três anos de pesquisa com a instalação de um sistema piloto capaz de produzir ureia, um fertilizante nitrogenado amplamente utilizado na agricultura, diretamente no campo usando energia renovável. A ureia é produzida a partir de dióxido de carbono (CO₂) e nitratos em um reator eletroquímico alimentado por energia de biobaterias e painéis solares.", "titulo_pt": "Pesquisadores produzem ureia no campo usando sistema alimentado por biobaterias e energia solar", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 230533, "titulo": "Researchers discover why some frogs have escaped the current amphibian mass extinction", "url": "https://phys.org/news/2026-10-frogs-current-amphibian-mass-extinction.html", "fonte_id": "phys_org", "data_pub": "2026-10-28T01:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os anfíbios enfrentam uma crise global de extinção, agravada por um fungo letal na América Central e do Sul. No entanto, a cadeia montanhosa da Sierra Nevada de Santa Marta, na Colômbia, abriga uma comunidade próspera de anfíbios, incluindo dezenas de espécies exclusivas da região que escaparam do declínio.", "titulo_pt": "Pesquisadores descobrem por que alguns sapos escaparam da atual extinção em massa de anfíbios", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 230535, "titulo": "Report indicates water, food and power at risk by strong El Niño", "url": "https://phys.org/news/2026-10-food-power-strong-el-nio.html", "fonte_id": "phys_org", "data_pub": "2026-10-28T00:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório recente aponta que o fenômeno El Niño poderá causar reduções de chuvas de até 80% e precipitações torrenciais na America Latina e no Caribe em 2027. Essas condições climáticas extremas colocam em risco os suprimentos de água, alimentos e energia na regiao. A Organizacao dos Estados Americanos instou os estados membros a fortalecerem a prevencao e a preparacao ainda no final de 2026.", "titulo_pt": "Relatório indica que água, alimentos e energia correm riscos devido a forte El Niño", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 230536, "titulo": "Cost overruns aren't just due to incompetence, bureaucracy and bad faith", "url": "https://phys.org/news/2026-10-overruns-due-incompetence-bureaucracy-bad.html", "fonte_id": "phys_org", "data_pub": "2026-10-28T00:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove em cada dez grandes projetos de transporte ultrapassam o orçamento inicial. Isso não é sempre devido à incompetência.", "titulo_pt": "Suborçamentos não são apenas devido à incompetência, burocracia e má fé", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 230537, "titulo": "Punishment alone won't help gang‑involved teens—a former child soldier explains why", "url": "https://phys.org/news/2026-10-wont-ganginvolved-teens-child-soldier.html", "fonte_id": "phys_org", "data_pub": "2026-10-28T00:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apenas a punição não ajudará os adolescentes envolvidos em gangues—a explicação de uma ex-soldado de infância. Antes, os Estados Unidos costumavam imaginar crianças usando rifles em campos de batalha distantes quando ouviam sobre soldados de infância.", "titulo_pt": "Apenas a punição não ajudará os adolescentes envolvidos em gangues—a explicação de uma ex-soldado de infância", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 230538, "titulo": "Climate health harms outpace action, prompting calls for global health emergency", "url": "https://phys.org/news/2026-10-climate-health-outpace-action-prompting.html", "fonte_id": "phys_org", "data_pub": "2026-10-28T00:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório de 2026 da Lancet Countdown sobre Saúde e Mudança Climática indica que muitos riscos e danos à saúde causados pela mudança climática cresceram mais rápido na década desde o acordo de Paris (2016-2025) do que na década anterior (2006-2015). Isso levou a chamados por uma emergência global de saúde.", "titulo_pt": "Riscos à saúde climática superam ações, impulsionando chamado para emergência global", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 230382, "titulo": "Drug-resistant bacteria alarming researchers", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/28/2003866735", "fonte_id": "taipei_times", "data_pub": "2026-10-28T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores estão alarmados com a crescente resistência das bactérias a antibióticos, o que representa um grave desafio à saúde pública.", "titulo_pt": "Bactérias resistentes a antibióticos alarmam pesquisadores", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 230539, "titulo": "Decoding the loopy physics of hula hooping with high-tech earthquake sensors", "url": "https://phys.org/news/2026-10-decoding-loopy-physics-hula-hooping.html", "fonte_id": "phys_org", "data_pub": "2026-10-27T23:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A física por trás do hula hoop é tão complexa que cientistas gastaram décadas tentando entender como o círculo de metal parece defiar a gravidade. O hula hoop, apesar de ser uma atividade simples, apresenta desafios teóricos significativos.", "titulo_pt": "Decifrando a física enredada do hula hoop com sensores de sismologia de alta tecnologia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 230540, "titulo": "We studied 1,584 data centers—and found the buildings full of machines are tied to modest local job growth", "url": "https://phys.org/news/2026-10-centers-full-machines-modest-local.html", "fonte_id": "phys_org", "data_pub": "2026-10-27T23:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudamos 1.584 centros de dados e constatamos que, apesar de requererem grandes investimentos em terra, edifícios, equipamentos de computador e infraestrutura de energia, eles tendem a empregar apenas algumas dúzias de pessoas em funções como técnicos de TI, engenheiros e guardas de segurança. Com bilhões de dólares sendo investidos em novos centros de dados nos Estados Unidos, as comunidades questionam o que poderão obter em troca.", "titulo_pt": "Estudamos 1.584 centros de dados - e encontramos edifícios cheios de máquinas com crescimento local de empregos modesto", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 229784, "titulo": "A simulação científica que recriou os primeiros dois bilhões de anos do Universo", "url": "https://veja.abril.com.br/ciencia/a-simulacao-cientifica-que-recriou-os-primeiros-dois-bilhoes-de-anos-do-universo/", "fonte_id": "veja", "data_pub": "2026-10-27T23:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo gerou vídeos e imagens de alta qualidade que ilustram os primeiros momentos após o 'Big Bang', retratando os primeiros dois bilhões de anos do Universo.", "titulo_pt": "Simulação científica recria os primeiros dois bilhões de anos do Universo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 230557, "titulo": "2,500-Year-Old Mesoamerican Observatory Discovered in Sierra Norte Mountains of Mexico", "url": "https://www.artnews.com/art-news/news/mesoamerican-observatory-discovered-sierra-norte-mountains-mexico-1234804059/", "fonte_id": "artnews", "data_pub": "2026-10-27T21:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foi descoberta uma estrutura de 2.500 anos de idade que faz parte do sítio arqueológico Teteles de Ávila Castillo na Sierra Norte, México.", "titulo_pt": "Observatório mesoamericano de 2.500 anos descoberto nas montanhas de Sierra Norte do México", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 230525, "titulo": "The Vera C. Rubin Observatory may have just discovered our solar system’s sixth dwarf planet", "url": "https://www.scientificamerican.com/article/the-vera-c-rubin-observatory-may-have-just-discovered-our-solar-systems-sixth-dwarf-planet/", "fonte_id": "scientific_american", "data_pub": "2026-10-27T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A observatória Vera C. Rubin pode ter descoberto o sexto planeta anão do sistema solar, localizado além da distância de Plutão e escondido pela luz das estrelas da Via Láctea.", "titulo_pt": "A observatória Vera C. Rubin pode ter descoberto o sexto planeta anão do sistema solar", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 230523, "titulo": "Ukrainian startup, GomSpace test satellite for future communications network", "url": "https://spacenews.com/ukrainian-startup-gomspace-test-satellite-for-future-communications-network/", "fonte_id": "spacenews", "data_pub": "2026-10-27T20:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ukrainian startup GomSpace lançou um satélite experimental em 1º de outubro com o objetivo de testar uma futura rede de comunicações. O satélite pode levar ao desenvolvimento de um sistema de satélites controlado pela Ucrânia.", "titulo_pt": "Startup ucraniana, GomSpace, testa satélite para rede de comunicações futura", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 229716, "titulo": "Ruy Castro tem vitória inédita no Jabuti e Eliana Alves Cruz ganha melhor romance literário", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/premio-jabuti-comeca-a-anunciar-livros-vencedores-de-2026-acompanhe.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-28T02:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ruy Castro venceu o prêmio Jabuti pela segunda vez consecutiva com o livro-reportagem 'Trincheira Tropical', se tornando o primeiro autor a conquistar essa dobradinha no prêmio.", "titulo_pt": "Ruy Castro conquista vitória inédita no Jabuti e Eliana Alves Cruz ganha melhor romance literário", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 229717, "titulo": "The Pussycat Dolls estreia no Brasil com a turnê 'PCD Forever'; veja agenda", "url": "https://redir.folha.com.br/redir/online/ilustrada "}, {"id": 230423, "titulo": "Katseye to headline Lollapalooza India", "url": "https://www.koreaherald.com/article/10917302", "fonte_id": "korea_herald", "data_pub": "2026-10-28T01:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Katseye será uma das atrações principais do Lollapalooza India 2027, no segundo dia do festival em Mumbai, no dia 24 de janeiro. A banda também fará uma apresentação em Boston como parte da turnê 'The Wildworld Tour'.", "titulo_pt": "Katseye comandará Lollapalooza India 2027", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 229720, "titulo": "Ruy Castro ganha segundo prêmio Jabuti consecutivo por 'Trincheira Tropical'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/ruy-castro-ganha-segundo-premio-jabuti-consecutivo-por-trincheira-tropical.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-28T01:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ruy Castro, biógrafo e colunista da Folha, ganhou seu segundo prêmio Jabuti consecutivo pelo livro 'Trincheira Tropical', que explora os efeitos da Segunda Guerra Mundial na vida dos cariocas e sua participação no conflito europeu.", "titulo_pt": "Ruy Castro vence segundo prêmio Jabuti consecutivo por 'Trincheira Tropical'", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 229721, "titulo": "Influenciador Bookster ganha primeiro Jabuti de incentivo à leitura digital", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/influenciador-bookster-ganha-primeiro-premio-jabuti-de-incentivo-a-leitura-digital.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-28T01:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O influenciador Pedro Pacífico, conhecido como Bookster, venceu o prêmio Jabuti na categoria incentivo à leitura de cultura digital
