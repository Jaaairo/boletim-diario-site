026/08/23/climate-change/tokyo-summer-climate-shock/", "fonte_id": "japan_times", "data_pub": "2026-08-23T08:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Após três meses vivendo na capital quente do Japão, o autor percebeu que a chave para sobreviver ao verão japonês não é combater o calor, mas adaptar-se a ele.", "titulo_pt": "O que um verão no tóquio ensinou a este neozelandês sobre choque climático", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 119183, "titulo": "Curiosity Blog, Sols 4982–4987: Back to Our Regularly Scheduled Programming", "url": "https://science.nasa.gov/blog/curiosity-blog-sols-4982-4987-back-to-our-regularly-scheduled-programming/", "fonte_id": "nasa_news", "data_pub": "2026-08-23T07:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A missão Curiosity retornou aos seus planos regulares de operações após uma breve detonação para investigar uma superfície erosional. Os rover está voltando a subir a Montanha Sharp.", "titulo_pt": "Curiosity Blog, Sols 4982–4987: retorno à programação regular", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 119159, "titulo": "Nuclear reactors unaffected after minor earthquakes in Haenam", "url": "https://www.koreaherald.com/article/10849121", "fonte_id": "korea_herald", "data_pub": "2026-08-23T07:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 3.1 ocorrido no domingo na região de Haenam, Jeonnam-Gwangju, não afetou as usinas nucleares do país, segundo autoridades nucleares. O terremoto foi considerado de baixa intensidade, comparado a uma magnitude 3 que a US Geological Survey descreve como semelhante às vibrações causadas por um caminhão passando.", "titulo_pt": "Reatores nucleares não foram afetados após terremoto leve em Haenam", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 119173, "titulo": "EuBiologics secures WHO prequalification for typhoid vaccine", "url": "https://www.koreaherald.com/article/10849076", "fonte_id": "korea_herald", "data_pub": "2026-08-23T05:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A EuBiologics recebeu a pré-qualificação da Organização Mundial da Saúde para seu vacina contra tifoides, permitindo que a fabricante coreana concorra para programas de compra internacional de vacinas. Este é o segundo vacina da EuBiologics a ser pré-qualificada pela OMS, após a sua vacina contra cólera.", "titulo_pt": "Eubiologics obtém pré-qualificação da OMS para vacina contra tifoides", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 118854, "titulo": "El Telescopio Hubble resuelve el misterio sobre el origen de la Vía Láctea: qué dijo la NASA", "url": "https://www.lanacion.com.ar/ciencia/el-telescopio-hubble-resuelve-el-misterio-sobre-el-origen-de-la-via-lactea-que-dijo-la-nasa-nid23082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-23T05:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Telescopio Hubble descobriu como a Via Láctea se formou, resolvendo um mistério antigo. A NASA, com sede em Maryland, liderou esta pesquisa astronômica.", "titulo_pt": "Telescopio Hubble responde sobre o nascimento da via Láctea: o que a NASA disse", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 119181, "titulo": "Black holes keep tearing these stars apart, but they survive", "url": "https://www.sciencedaily.com/releases/2026/08/260822015119.htm", "fonte_id": "science_daily", "data_pub": "2026-08-23T04:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobriram estrelas que passam repetidamente perto de buracos negros supermassivos, sobrevivendo a cada encontro e gerando novos burburinhos de luz. Em alguns sistemas, esses burburinhos se extinguem gradualmente a cada retorno.", "titulo_pt": "Buracos negros continuam arrancando estas estrelas, mas elas sobrevivem", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 119182, "titulo": "This shark can live 400 years. Its eyes barely seem to age", "url": "https://www.sciencedaily.com/releases/2026/08/260821012232.htm", "fonte_id": "science_daily", "data_pub": "2026-08-23T03:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa revelou que os tubarões da Groenlândia podem viver até 400 anos sem sofrer o tipo de deterioração retiniana comum à idade. A pesquisa encontrou tecido ocular saudável e proteínas ativas adaptadas para ver luz azul nas profundezas escasamente iluminadas do Ártico.", "titulo_pt": "Este tubarão pode viver 400 anos e sua visão quase não envelhece", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 119180, "titulo": "Quitting alcohol may prime the brain for relapse", "url": "https://www.sciencedaily.com/releases/2026/08/260822015148.htm", "fonte_id": "science_daily", "data_pub": "2026-08-23T02:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ratos que desenvolveram consumo compulsivo de álcool após o abandono do álcool apresentaram mais de dobro a atividade em uma região do cérebro associada ao estresse e à adicção. A atividade neural apareceu antes que eles comessem novamente, o que sugere que ela poderia eventualmente ajudar a prever quem está mais em risco de recaída.", "titulo_pt": "Parar de beber pode preparar o cérebro para uma recaída", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 119190, "titulo": "S. Korea's top pharmaceutical firms spend over 100 bln won each in H1 for R&D: data", "url": "https://en.yna.co.kr/view/AEN20260823001000320", "fonte_id": "yonhap_news", "data_pub": "2026-08-23T02:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As principais empresas farmacêuticas da Coreia do Sul gastaram mais de 100 bilhões de won cada uma no primeiro semestre para pesquisa e desenvolvimento.", "titulo_pt": "Grandes empresas farmacêuticas da Coreia do sul investem mais de 100 bilhões de won em pesquisa e desenvolvimento no primeiro semestre", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 118710, "titulo": "Sobre calotes implícitos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/samuelpessoa/2026/08/sobre-calotes-implicitos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-23T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A coluna anterior abordou artigos que relatam diversos casos de calote de dívida pública denominada em moeda local.", "titulo_pt": "Sobre calotes implícitos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 119179, "titulo": "How we found Haida Gwaii's first marbled murrelet nest in more than 30 years", "url": "https://phys.org/news/2026-08-haida-gwaii-marbled-murrelet-years.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T23:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores escrutinaram vegetação densa na escuridão, passando entre majestosos cedros vermelhos do norte de Haida Gwaii. Antes, estavam navegando em um barco aberto através das ondas do Oceano Pacífico perto da Entrada de Dixon.", "titulo_pt": "Como encontramos o ninho do murreleiro-estrelado em Haida Gwaii após mais de 30 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118682, "titulo": "Computer models pinpoint catalysts for replacing fossil-fueled ammonia production", "url": "https://phys.org/news/2026-08-catalysts-fossil-fueled-ammonia-production.html", "fonte_id": "phys_org", "data_pub": "2026-08-22T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A amônia é uma das químicas mais importantes produzidas no mundo, sendo a segunda mais produzida anualmente, após a ácida sulfúrica. Sua produção representa até 2% da consumação energética global e cerca de 1,5% das emissões de gases de efeito estufa, o que tem motivado a busca por métodos mais sustentáveis de produção.", "titulo_pt": "Modelos computacionais identificam catalisadores para substituir a produção de amônia fósil", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 118491, "titulo": "Terremoto de magnitude 5,9 sacode leste do Japão; não há alerta de tsunami", "url": "https://www.infomoney.com.br/mundo/terremoto-de-magnitude-59-sacode-leste-do-japao-nao-ha-alerta-de-tsunami/", "fonte_id": "infomoney", "data_pub": "2026-08-22T20:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 5,9 sacudiu o leste do Japão, mas não há alerta de tsunami. A TV pública NHK mostrou o tráfego nas estradas próximas, incluindo Mito e Saitama, aparentemente normal.", "titulo_pt": "Terremoto de magnitude 5,9 sacode leste do Japão; não há alerta de tsunami", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 118843, "titulo": "Devórame otra vez: de Darwin al presente, las plantas carnívoras siguen revelándose como un prodigio natural", "url": "https://www.lanacion.com.ar/salud/devorame-otra-vez-de-darwin-al-presente-las-plantas-carnivoras-siguen-revelandose-como-un-prodigio-nid23082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-23T09:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As plantas carnívoras continuam impressionando a imaginação infantil devido à sua semelhança com criaturas de ficção científica. Elas são consideradas um prodígio natural que evoluiu para capturar insetos e outros pequenos animais.", "titulo_pt": "Devora-me novamente: de Darwin ao presente, as plantas carnívoras permanecem como um prodígio natural", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 118845, "titulo": "La ofensiva diplomática de Lula para blindarse ante una elección que promete ser feroz", "url": "https://www.lanacion.com.ar/el-mundo/la-ofensiva-diplomatica-de-lula-para-blindarse-ante-una-eleccion-que-promete-ser-feroz-nid23082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-23T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente brasileiro Lula está intensificando suas negociações com líderes internacionais devido à crescente preocupação em Brasília com um possível resultado apertado nas eleições e uma eventual intervenção externa em favor de Flávio Bolsonaro.", "titulo_pt": "A ofensiva diplomática de Lula para se proteger em eleição prometida como feroz", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 119197, "titulo": "‘So many people say things about my appearance – it’s not normal’: Jorja Smith on burnout, body-shaming and finding freedom", "url": "https://www.theguardian.com/music/2026/aug/23/jorja-smith-what-are-the-odds-interview", "fonte_id": "guardian_culture", "data_pub": "2026-08-23T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jorja Smith, uma cantora reconhecida pela Brit Awards, Grammys e Drake, está voltando com um novo álbum após um período de descompressão. O álbum foi criado para ser tocado em festas e reflete sua busca por liberdade devido a pressões relacionadas à sua aparência e ao sucesso.", "titulo_pt": "Jorja Smith sobre esgotamento, chacota corporal e encontrar liberdade", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 118768, "titulo": "Cultura do “eu mereço”: como o cansaço está mudando a relação com o consumo", "url": "https://www.cnnbrasil.com.br/comportamento/cultura/a-cultura-do-eu-mereco-o-cansaco-esta-mudando-a-relacao-com-o-consumo/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-23T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cultura do 'eu mereço' está influenciando a forma como os brasileiros gastam dinheiro, especialmente em busca de conforto e alívio após um período de trabalho intenso. Isso está mudando a maneira como os con .com/brasil/rj-entregador-preso-por-morte-de-ciclista-confundido-com-ladrao-confessa-agressoes", "fonte_id": "metropoles", "data_pub": "2026-08-22T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um entregador foi preso por ter cometido a morte de um ciclista, que ele havia confundido com um ladrão. Durante a prisão, o entregador confessou ter agredido a vítima, mas afirmou ter deixado o local por medo de que a segurança, descontrolada, matasse o ciclista.", "titulo_pt": "RJ: entregador preso por morte de ciclista confundido com ladrão confessa agressões", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 118438, "titulo": "Professor de robótica é investigado por assédio a três alunas em SP", "url": "https://www.metropoles.com/sao-paulo/professor-de-robotica-e-investigado-por-assedio-a-tres-alunas-em-sp", "fonte_id": "metropoles", "data_pub": "2026-08-22T19:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um professor de robótica foi ouvido pela Polícia Militar, negou as acusações de assédio a três alunas e foi liberado. Ele será investigado pela Polícia Civil.", "titulo_pt": "Professor de robótica é investigado por assédio a três alunas em SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 118501, "titulo": "Como a falta de mulheres na China faz homens caírem em golpes de falsas noivas e perderem milhões", "url": "https://www.bbc.com/portuguese/articles/cp9evj7mdr9o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-22T19:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A falta de mulheres na China está levando homens a caírem em golpes de falsas noivas, refletindo uma crise demográfica prolongada no país. Estes 'casamentos relâmpago' são um sintoma extremo dessa situação.", "titulo_pt": "Como a escassez de mulheres na China faz homens caírem em golpes de falsas noivas e perderem milhões", "veiculo": "BBC Brasil", "pais": "Reino Unido", "cl tulo": "Customs seizes endangered turtles and parrots in 2 cases, arrests woman", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3364924/customs-seizes-endangered-turtles-and-parrots-2-cases-arrests-woman?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-22T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Alfândega de Hong Kong apreendeu tartarugas e papagaios em dois casos de contrabando separados, resultando na prisão de uma mulher. Foram encontradas 17 tartarugas vivas em uma embalagem declarada como contendo um casaco que chegou do Aeroporto Internacional de Hong Kong dos Estados Unidos.", "titulo_pt": "Alfândega apreende tartarugas e papagaios e prende mulher em dois casos de contrabando", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 117241, "titulo": "“Super El Niño”: ONG avalia risco para moradias vulneráveis no Brasil", "url": "https://www.cnnbrasil.com.br/ciencia/super-el-nino-ong-avalia-risco-para-moradias-vulneraveis-no-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-22T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Organização Não-Governamental Habitat para a Humanidade Brasil alerta para o risco de aumento de eventos como enchentes, deslizamentos de terra, estiagens e queimadas devido à elevação das temperaturas e mudanças nas chuvas associadas ao fenômeno 'Super El Niño'.", "titulo_pt": "Super El Niño: ONG avalia risco para moradias vulneráveis no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 117547, "titulo": "Climatologist Jean Jouzel: 'None of France's presidential candidates truly grasp the reality of global warming'", "url": "https://www.lemonde.fr/en/environment/article/2026/08/22/climatologist-jean-jouzel-none-of-france-s-presidential-candidates-truly-grasp-the-reality-of-global-warming_6756754_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-22T03:00:00Z", "idioma": "en", "prov function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">

    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
