ssor de jiu-jitsu é flagrado agredindo adolescente autista", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/professor-de-jiu-jitsu-e-flagrado-agredindo-adolescente-autista", "fonte_id": "metropoles", "data_pub": "2026-07-29T20:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um professor de jiu-jitsu foi flagrado agredindo um adolescente autista no Amazonas. Ele alegou nas redes sociais que estava protegendo um cachorro do jovem.", "titulo_pt": "Professor de jiu-jitsu é flagrado agredindo adolescente autista", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 79331, "titulo": "Após desastre de 2024, Porto Alegre entra novamente em alerta por avanço das chuvas", "url": "https://veja.abril.com.br/brasil/apos-desastre-de-2024-porto-alegre-entra-novamente-em-alerta-por-avanco-das-chuvas/", "fonte_id": "veja", "data_pub": "2026-07-29T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Porto Alegre está novamente sob alerta devido ao avanço das chuvas, após um desastre ocorrido em 2024. O diretor do Dmae informou que as ações de planejamento agora consideram os níveis observados durante a enchente mais grave da história do estado.", "titulo_pt": "Porto Alegre entra em alerta novamente após desastre de 2024", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 79395, "titulo": "Gabinete de crise é enviado ao litoral de SP após ventos de 100 km/h", "url": "https://www.metropoles.com/sao-paulo/gabinete-de-crise-e-enviado-ao-litoral-de-sp-apos-ventos-de-100-km-h", "fonte_id": "metropoles", "data_pub": "2026-07-29T19:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um gabinete de crise foi enviado ao litoral de São Paulo para acompanhar a situação após ventos de 100 km/h causarem estragos e resultarem em uma morte.", "titulo_pt": "Gabinete de crise é enviado ao litoral de SP após ventos de 100 km/h", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 79332, "titulo": "O que se sabe sobre transplante inédito que devolveu visão a italiana cega", "url": "https://veja.abril.com.br/saude/o-que-se-sabe-sobre-transplante-inedito-que-devolveu-visao-a-italiana-cega/", "fonte_id": "veja", "data_pub": "2026-07-29T19:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pela primeira vez, médicos transplantaram a mácula de um olho para o outro da mesma paciente na Itália. Este caso é considerado extremamente raro.", "titulo_pt": "O que se sabe sobre transplante inédito que devolveu visão a italiana cega", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 79397, "titulo": "Homem é preso após esfaquear ex-cunhada em terminal no ES", "url": "https://www.metropoles.com/brasil/homem-e-preso-apos-esfaquear-ex-cunhada-em-terminal-no-es", "fonte_id": "metropoles", "data_pub": "2026-07-29T19:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem foi detido após esfaquear a ex-cunhada de 27 anos. De acordo com a polícia, o suspeito admitiu que pretendia matar também sua ex-esposa.", "titulo_pt": "Homem é preso após esfaquear ex-cunhada em terminal no ES", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 79512, "titulo": "Venganza fatal en Rosario: la trama detrás del crimen por el que detuvieron a padre e hijo, dos ex policías", "url": "https://www.clarin.com/policiales/venganza-fatal-rosario-trama-detras-crimen-detuvieron-padre-hijo-ex-policias_0_3JDvTeRw3w.html", "fonte_id": "clarin", "data_pub": "2026-07-29T19:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Pedro e Cristian Bascoy, dois ex-policiais, foram detidos por assassinar Andrés Lisandro Saavedra (24) e fazer com que seu corpo desaparecesse. De acordo com a justiça, Saavedra roubou uma licuadora e duas torneiras antes de ser emboscado e morto pelos acusados.", "titulo_pt": "Vingança fatal em rosário: trama por trás do crime que levou à prisão de pai e filho, ex-policiais", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 79343, "titulo": "A foto que virou símbolo da histórica onda de incêndios na Europa", "url": "https://veja.abril.com.br/mundo/a-foto-que-virou-simbolo-da-historica-onda-de-incendios-na-europa/", "fonte_id": "veja", "data_pub": "2026-07-29T18:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma foto capturada por um editor da AFP durante férias na França se tornou viral nas redes sociais, mostrando chamas destruindo uma área equivalente a 430 campos de futebol como resultado dos incêndios históricos na Europa.", "titulo_pt": "A foto que virou símbolo das históricas ondas de incêndios na Europa", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 79366, "titulo": "DF: Movimentos sociais prestam solidariedade à Venezuela após terremoto com 5 mil vítimas", "url": "https://www.brasildefato.com.br/2026/07/29/df-movimentos-sociais-prestam-solidariedade-a-venezuela-apos-terremoto-que-deixou-5-mil-vitimas/", "fonte_id": "brasil_de_fato", "data_pub": "2026-07-29T16:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cerca de 50 pessoas se reuniram na tarde de terça-feira (28) em frente à Embaixada da Venezuela, em Brasília, para homenagear as vítimas do terremoto que atingiu o país no último dia 24 de junho. Os presentes levaram rosas brancas e prestaram condolências.", "titulo_pt": "DF: movimentos sociais prestam solidariedade à Venezuela após terremoto com 5 mil vítimas", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 79668, "titulo": "Rural America’s Maternal-Health Crisis Is About to Get Much Worse", "url": "https://www.theatlantic.com/ideas/2026/07/giving-birth-rural-hospitals-danger-mortality/688091/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-07-29T11:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A situação de saúde materna no interior dos Estados Unidos ficará ainda mais crítica, com menor oferta de cuidados, distâncias maiores para deslocamentos e situações de alto risco mais propensas a ter resultados trágicos.", "titulo_pt": "A crise maternal do interior dos EUA vai agravar", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 78680, "titulo": "Desde Atacama hasta Magallanes: cuáles son las 13 regiones chilenas bajo alerta sanitaria por hantavirus tras 18 muertes", "url": "https://www.lanacion.com.ar/sociedad/desde-atacama-hasta-magallanes-cuales-son-las-13-regiones-chilenas-bajo-alerta-sanitaria-por-nid29072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-29T11:24:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Saúde do Chile implementou uma alerta sanitária para 13 regiões, incluindo Atacama e Magallanes, devido a um aumento na letalidade do hantavirus, que chegou a 39% dos casos. A medida também prevê precauções contra influenza aviar e dengue e será válida até julho de 2027.", "titulo_pt": "Das Atacama às Magallanes: quais são as 13 regiões chilenas sob alerta sanitário por hantavirus após 18 mortes", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 78554, "titulo": "Três pessoas são mortas a tiros dentro de fazenda em Goiás", "url": "https://www.metropoles.com/distrito-federal/na-mira/tres-pessoas-sao-mortos-a-tiros-dentro-de-fazenda-em-goias", "fonte_id": "metropoles", "data_pub": "2026-07-29T11:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Três pessoas foram mortas a tiros dentro de uma fazenda em Goiatuba, Goiás. Após o crime, o suspeito tentou se suicidar. A Polícia Civil de Goiás está investigando as motivações dos assassinatos.", "titulo_pt": "Três pessoas são mortas a tiros dentro de fazenda em Goiás", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 78567, "titulo": "Servidor é acusado de cobrar R$ 500 por enterro em cemitério de MG", "url": "https://www.metropoles.com/minas-gerais/servidor-e-acusado-de-cobrar-r-500-por-enterro-em-cemiterio-de-mg", "fonte_id": "metropoles", "data_pub": "2026-07-29T10:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um servidor do cemitério de Senhora dos Remédios, em Minas Gerais, é acusado de exigir um pagamento via Pix no valor de R$ 500 para realizar o sepultamento. O Ministério Público de Minas Gerais fez a denúncia.", "titulo_pt": "Servidor é acusado de cobrar R$ 500 por enterro em cemitério de MG", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 78577, "titulo": "Inspiradas pela ‘Mãe da Pátria’, mulheres negras na Argentina reivindicam pautas históricas", "url": "https://www.brasildefato.com.br/2026/07/29/inspiradas-pela-mae-da-patria-mulheres-negras-na-argentina-reivindicam-pautas-historicas/", "fonte_id": "brasil_de_fato", "data_pub": "2026-07-29T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na Argentina, María Remedios del Valle, uma mulher negra, é reconhecida como a Mãe da Pátria e teve seu papel na independência do país celebrado com o estampamento de sua imagem em 2024.", "titulo_pt": "Mulheres negras na Argentina reivindicam histórias inspiradas pela ‘Mãe da Pátria’", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 79119, "titulo": "Victim and perpetrator of sexual harassment end up at same Coast Guard workplace", "url": "https://www.koreaherald.com/article/10824781", "fonte_id": "korea_herald", "data_pub": "2026-07-29T08:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Corpo de Guardas Costeiros da Coreia permitiu que um de seus membros, acusado de assédio sexual, retornasse ao seu posto original após ser transferido, resultando em ambos trabalharem na mesma estação. Em 2024, um subordinado havia acusado um inspetor sênior da Estação Pyeongtaek do Corpo de Guardas Costeiros em 2022 de fazer comentários inapropriados, considerados assédio sexual.", "titulo_pt": "Vítima e agressor de assédio sexual trabalham na mesma estação da guarda costeira", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 78639, "titulo": "O desafio do poder público para contratar bons serviços de segurança pública", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-desafio-do-poder-publico-para-contratar-bons-servicos-de-seguranca-publica", "fonte_id": "jota", "data_pub": "2026-07-29T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Instituições precisam questionar modelos inadequados e avançar para contratações modernas para alcançar bons resultados. O desafio do poder público está em reformular suas abordagens na contratação de serviços de segurança pública.", "titulo_pt": "O desafio do poder público para contratar bons serviços de segurança pública", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 79383, "titulo": "Rio é contaminado e captação de água proibida após explosão de caminhão em GO", "url": "https://www.metropoles.com/distrito-federal/entorno/rio-e-contaminado-e-captacao-de-agua-proibida-apos-explosao-de-caminhao-em-go", "fonte_id": "metropoles", "data_pub": "2026-07-29T20:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Houve uma explosão envolvendo um caminhão que transportava químicos perigosos na cidade de Professor Jamil, Goiás. Como resultado, a captação de água foi proibida e a empresa foi notificada para conter os danos ambientais.", "titulo_pt": "Rio é contaminado e captação de água proibida após explosão com caminhão em GO", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 79848, "titulo": "More than half of England 'officially in drought', UK Environment agency says", "url": "http://www.euronews.com/2026/07/29/more-than-half-of-england-officially-in-drought-uk-environment-agency-says", "fonte_id": "euronews", "data_pub": "2026-07-29T18:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais da metade da Inglaterra está oficialmente em estado de seca, segundo o Agência Ambiental do Reino Unido. O órgão relata baixos níveis nos rios, colheitas antecipadas por agricultores e aumento do risco de incêndios florestais, além de milhões de pessoas vivendo sob restrições no uso d'água.", "titulo_pt": "Mais da metade da inglaterra está oficialmente em seca", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 79654, "titulo": "Australians value batteries and EVs, but renewables industry must earn trust of regions, summit told", "url": "https://www.theguardian.com/australia-news/2026/jul/30/australians-value-batteries-and-evs-but-renewables-industry-must-earn-trust-of-regions-summit-told", "fonte_id": "guardian_world", "data_pub": "2026-07-29T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um levantamento sobre a transição para energias limpas na Austrália revelou que os australianos valorizam baterias e veículos elétricos, mas o setor de renováveis precisa ganhar a confiança das regiões. Campanhas organizadas contra energia eólica e solar foram particularmente eficazes em diminuir o apoio comunitário para essas tecnologias.", "titulo_pt": "Austrália valoriza baterias e veículos elétricos, mas setor de renováveis precisa ganhar confiança das regiões", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 79656, "titulo": "Bird flu is spreading locally and Australia faces more wildlife deaths. How bad could it get?", "url": "https://www.theguardian.com/world/2026/jul/30/bird-flu-australia-h5n1-how-will-it-affect-wildlife", "fonte_id": "guardian_world", "data_pub": "2026-07-29T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades confirmaram a transmissão local do vírus da gripe aviária H5N1 entre aves na Austrália do Sul, indicando um novo estágio no enfrentamento à infecção. O ministério da Agricultura, Pesca e Floresta anunciou 11 novas detecções suspeitas.", "titulo_pt": "Gripe aviária h5n1 se espalha localmente na austrália do sul; país entra em nova fase", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 80131, "titulo": "World falling short on 22 of 23 nature targets for 2030, says draft UN report", "url": "https://www.carbonbrief.org/world-falling-short-on-22-of-23-nature-targets-for-2030-says-draft-un-report", "fonte_id": "carbon_brief", "data_pub": "2026-07-29T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório preliminar da ONU indica que o mundo não atingirá 22 de seus 23 objetivos ambientais para 2030. A meta global de conter e revertar a perda da natureza até 2030 não será alcançada a menos que as ações dos países se acelerem.", "titulo_pt": "Mundo falha em 22 de 23 objetivos ambientais para 2030, diz relatório preliminar da ONU", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 80132, "titulo": "Climate change is driving a ‘shift’ in childhood malaria risk across Africa", "url": "https://www.carbonbrief.org/climate-change-is-driving-a-shift-in-childhood-malaria-risk-across-africa", "fonte_id": "carbon_brief", "data_pub": "2026-07-29T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As altas temperaturas estão redistribuindo o risco de malária infantil na África subsaariana, criando áreas de 'novo risco'. Este fenômeno é impulsionado pelo aquecimento global.", "titulo_pt": "Mudanças climáticas estão provocando uma 'relocalização' do risco de malária infantil na áfrica subsaariana", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 79961, "titulo": "15 elephants die from suspected poisoning in Kenyan park", "url": "https://www.scmp.com/news/world/africa/article/3362295/15-elephants-die-suspected-poisoning-kenyan-park?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-29T13:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ao menos 15 elefantes morreram devido a uma suspeita de intoxicação no Parque Nacional Amboseli, na região sul do Quênia, entre 24 de junho e 24 de julho. O Serviço de Vida Selvagem da Quênia (KWS) relatou que 10 dos animais apresentavam sintomas semelhantes.", "titulo_pt": "Pelo menos 15 elefantes morrem por suspeita de intoxicação em parque nacional do quênia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 79855, "titulo": "France veterinary team treats pets of wildfire evacuees", "url": "http://www.euronews.com/video/2026/07/29/france-veterinary-team-treats-pets-of-wildfire-evacuees", "fonte_id": "euronews", "data_pub": "2026-07-29T12:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de veterinários francês em Bordeaux está cuidando dos animais domésticos dos evacuados das chamas no Gironde, fornecendo comida, tratamento e apoio enquanto as famílias aguardam para retornar para suas casas.", "titulo_pt": "Equipe veterinária francesa auxilia pets de evacuados por incêndios no gironde", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 79964, "titulo": "France battles wildfire 4 times the size of Paris", "url": "https://www.scmp.com/news/world/europe/article/3362292/france-battles-wildfire-4-times-size-paris?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-29T12:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogoiros lutavam contra um incêndio florestal não controlado na região sudoeste da França, cuja área era quatro vezes maior que Paris. As temperaturas previstas chegariam a 40 graus Celsius, o que poderia reativar focos de calor oculto e espalhar cinzas além das áreas protegidas.", "titulo_pt": "França enfrenta incêndio quatro vezes maior que Paris", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 80133, "titulo": "Q&A: What does China’s 15th ‘five-year plan’ for renewables mean for climate change?", "url": "https://www.carbonbrief.org/qa-what-does-chinas-15th-five-year-plan-for-renewables-mean-for-cl   const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
