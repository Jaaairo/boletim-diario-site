<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

tecnologia chinesa. Em um desenvolvimento geopolítico significativo, o presidente ucraniano Zelensky anunciou que Trump concordou em fornecer licenças para mísseis Patriot à Ucrânia, apesar das preocupações de uma possível interferência na eleição presidencial americana. Paralelamente, no Japão um terremoto deixou pelo menos 13 mortos e 100 feridos, enquanto a Bolívia detém um ex-ministro por distribuição irregular de gasolina. Em meio a esses eventos, a influência do Irã se intensifica com ataques contra bases americanas em Jordânia, levando ao aumento dos preços do petróleo e à escalada das tensões regionais.\n\nOs Estados Unidos afirmaram ter interceptado um suposto ataque de mísseis surpresa do Irã, encerrando uma pausa nas operações aéreas diretas. Em resposta, o Corpo de Guerra Revolucionário Islâmico (IRGC) declarou ter atacado uma base aérea e um centro da Central de Comando dos Estados Unidos na Jordânia usando mísseis balísticos, prometendo resistência enquanto as ameaças contra a República Islâmica do Irã persistirem. A Arábia Saudita e os Estados Unidos realizaram ataques contra grupos apoiados pelo Irã no Iraque, intensificando as tensões na região. O conflito incerto no Oriente Médio está mostrando sinais de se espalhar e tornar mais complexo, levando a preocupações sobre o impacto nas cadeias de suprimento globais, alertou Han Seong-sook, primeira-ministra da Coreia do Sul. Além disso, a Ucrânia se transformou em um dos principais fornecedores de tecnologia militar para a Europa e Oriente Médio após ter resistido à Rússia com o apoio ocidental.", "economia": "A inflação na Austrália caiu para 3,8%, o que reduz as chances de um aumento da taxa Selic. Em contraste, a Coreia do Sul viu suas bolsas despencarem com fortes quedas nas ações de fabricantes de chips, refletindo a pressão no setor tecnológico. A Shein, empresa chinesa de moda online, está prestes a estrear na Bolsa de Valores de Hong Kong e pode intensificar a concorrência no varejo brasileiro. A Apple atingiu brevemente o valor de mercado de US$ 5 trilhões pela primeira vez, enquanto a Petrobras registrou recordes de refino e reduziu as importações em meio à guerra no Irã. O café enfrenta desafios com a chuva excessiva na safra atual, mas apresenta uma produção recorde. A Petrobras também bateu recordes de refino e reduziu as importações de combustíveis no segundo trimestre, em resposta aos aumentos dos preços causados pela guerra no Irã.", "tecnologia": "O governo dos Estados Unidos intensificou suas medidas de controle sobre a importação de tecnologia chinesa, proibindo novos robôs humanóides e inversores de energia produzidos no país asiático. Essas restrições visam proteger o desenvolvimento da inteligência artificial (IA) americana e relocalizar setores industriais em rápido crescimento, conforme informou a administração Trump em um comunicado. Em Hong Kong, as autoridades estão implementando novas regulamentações para a IA, com o objetivo de garantir a segurança dos sistemas e promover o desenvolvimento responsável da tecnologia. Essas medidas são esperadas impactar positivamente o local econômico ao fomentar a inovação e atrair investimentos em pesquisa e desenvolvimento. No entanto, há preocupações sobre o possível efeito negativo nas exportações locais devido à restrição do acesso ao mercado chinês para produtos tecnológicos. Empresas como SK hynix registraram lucros recordes no segundo trimestre devido à alta demanda por chips de inteligência artificial, enquanto outras companhias investiram em IA para melhorar sua competitividade no comércio eletrônico e otimizar a aplicação da tecnologia.}", "ciencia": "A NASA divulgou imagens de um agujero negro 'huérfano' que devorou uma estrela, um descobrimento que pode revolucionar a busca por agujeres negros no universo. Em outro desenvolvimento importante, cientistas sul-coreanos resolveram um mistério de 250 anos sobre o funcionamento do cérebro em relação à demência, fornecendo insights valiosos para o tratamento das doenças cerebrais. A Europa está aquecendo duas vezes mais rápido que a média global, levando a eventos climáticos extremos como ondas de calor e temporadas de furacões recordistas. Estes avanços científicos e climáticos representam significativos progressos na compreensão do universo e das mudanças climáticas.", "cultura": "O Festival de Música da Rádio Nacional bateu um novo recorde com 1.512 inscrições, crescendo 42% em relação à edição anterior, mostrando o interesse crescente no evento. Em outro destaque cultural, a atriz Drica Moraes interpreta uma juíza que enfrenta conflitos éticos na peça 'Inter Alia', estrelando no Teatro Vivo em São Paulo. Sobre desafios éticos, a Associação de Imprensa Estrangeira em Hollywood processou a Penske Media por supostamente organizar um boicote ao Globo de Ouro para adquirir a premiação por um preço menor e monopolizar o mercado de premiações. Esses eventos refletem os variados aspectos da cultura, desde as artes cênicas até questões jornalísticas e industriais do entretenimento.", "sociedade": "Um carabinero faleceu durante a entrega de armamento na 6ª Comisaría Las Compañías, em La Serena, no Chile. A investigação da Fiscalía Militar está sendo realizada para esclarecer as circunstâncias do incidente. Paralelamente, autoridades chilenas discutiram medidas para melhorar a proteção social, focando em nascimentos, velhice e emprego formal, reconhecendo que ainda há muito trabalho a ser feito para alcançar os objetivos desejados. No Brasil, mulheres freelancers ganham cerca de 26% menos do que os homens, segundo um estudo recente, refletindo uma disparidade salarial significativa entre gêneros no mercado de trabalho independente. Além disso, jovens vulneráveis enfrentam dificuldades ao deixar abrigos após completarem 18 anos, sem o apoio adequado do Estado, enquanto a Anmat autorizou a venda livre de dez medicamentos que anteriormente exigiam receita médica, após cinco anos no mercado sem relatos de efeitos adversos graves.", "meio_ambiente": "Incêndios florestais continuam sendo um problema significativo na Europa. Na França, o fogo no departamento de Var afetou 4.500 hectares e destruiu 31 casas, com os bombeiros trabalhando dia e noite para conter as chamas. Em Madrid, na Espanha, incêndios se espalham pela região. Na cidade francesa de Le Porge, um fogo destruiu pelo menos 170 casas. Paralelamente, a Alemanha registrou uma vez que a energia eólica e solar superaram a proveniente dos combustíveis fósseis em termos de produção. No entanto, muitos países ainda não atingiram o prazo de 2025 para identificar subsídios prejudiciais à biodiversidade.", "direitos_humanos": "Nos últimos meses, os direitos humanos continuaram sendo violados em diversos contextos. Primeiramente, a situação dos refugiados no Chade é alarmante, com famílias que fugiram da guerra e dos crimes no Sudão enfrentando escassez de água nos seus acampamentos, o que aumenta suas dificuldades para retornar às suas casas. Além disso, milhares de crianças e seus patrocinadores foram detidos pela ICE nos Estados Unidos após informações fornecidas pelo Escritório de Residência de Refugiados, refletindo preocupações sobre a pressão crescente sobre os sistemas de asilo. Em Gaza, médicos relatam um aumento significativo de abortos relacionados ao trauma da guerra e à blockada israelense. No entanto, uma notícia positiva é que o Montenegro implementou uma lei que oferece licença pagada para mulheres com dores menstruais, um passo importante em direitos humanos."}, "resumo_do_dia": {"politica_nacional": [{"id": 77318, "titulo": "A praga da diplomacia carcerária", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/eliogaspari/2026/07/a-praga-da-diplomacia-carceraria.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2019, Alberto Fernández visitou Lula na prisão durante uma campanha presidencial, marcando o início da diplomacia carcerária. Em 2025, Lula visitou Cristina Kirchner em seu apartamento após ela ter sido presa.", "titulo_pt": "A praga da diplomacia carcerária", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 77319, "titulo": "Carro com placa de gabinete de deputado do PL é visto em convenção de Flávio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/carro-com-placa-de-gabinete-de-deputado-do-pl-e-visto-em-convencao-de-flavio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um carro Corolla prata com uma placa oficial do gabinete do deputado Paulo Bilynskyj (PL-SP) foi notado durante a convenção do PL que confirmou a candidatura de Flávio Bolsonaro à Presidência.", "titulo_pt": "Carro com placa do gabinete de deputado é visto na convenção de Flávio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 77320, "titulo": "Datafolha: Para 59%, Moraes agiu mal ao proibir visita de Flávio a Jair Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/datafolha-para-59-moraes-agiu-mal-ao-proibir-visita-de-flavio-a-jair-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "59% dos eleitores consideram que o ministro Alexandre de Moraes, do STF, agiu mal ao proibir a visita do senador Flávio Bolsonaro ao ex-presidente Jair Bolsonaro.", "titulo_pt": "Para 59%, Moraes agiu mal ao impedir visita de Flávio à prisão domiciliar de Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 77384, "titulo": "Uma agenda econômica para 2027", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/bernardo-guimaraes/2026/07/uma-agenda-economica-para-2027.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-29T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As convenções partidárias estão definindo os candidatos para as próximas eleições, que ocorrerão em pouco mais de dois meses. É oportuno discutir as propostas dos candidatos ao Executivo e Legislativo.", "titulo_pt": "Agenda econômica para 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 77321, "titulo": "Fachin prepara norma contra conflito de interesses e avalia obrigar juízes a declarar atividades privadas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/fachin-prepara-norma-contra-conflito-de-interesses-e-avalia-obrigar-juizes-a-declarar-atividades-privadas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T01:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, Edson Fachin, está preparando uma proposta de resolução para prevenir conflitos de interesse entre os juízes. A medida visa aumentar a transparência no Judiciário e já gerou crises internas na corte.", "titulo_pt": "Fachin prepara norma contra conflito de interesses e avalia obrigar juízes a declararem atividades privadas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 77322, "titulo": "Moraes manda Bolsonaro explicar se autorizou uso de imagem de IA em convenção do PL", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/moraes-manda-bolsonaro-explicar-se-autorizou-uso-de-imagem-de-ia-em-convencao-do-pl.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T01:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do STF, determinou que a defesa de Jair Bolsonaro explique o uso de um vídeo feito por inteligência artificial exibido na convenção do PL. O prazo para explicação é de 48 horas.", "titulo_pt": "Moraes obriga Bolsonaro a explicar uso de imagem de IA em convenção do PL", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 77434, "titulo": "Moraes manda Bolsonaro explicar vídeo de IA — e clã pode ter problemas independentemente da resposta", "url": "https://veja.abril.com.br/politica/moraes-manda-bolsonaro-explicar-video-de-ia-e-cla-pode-ter-problemas-independentemente-da-resposta/", "fonte_id": "veja", "data_pub": "2026-07-29T01:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Moraes concedeu 48 horas para a defesa de Jair Bolsonaro se manifestar sobre um vídeo envolvendo inteligência artificial exibido durante uma convenção do filho dele, Flávio Bolsonaro. A família pode enfrentar problemas independentemente da resposta dada.", "titulo_pt": "Moraes dá prazo para Bolsonaro explicar vídeo de IA e clã pode ter problemas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 77457, "titulo": "Moraes dá 48h para defesa de Bolsonaro esclarecer se autorizou IA na convenção de Flávio", "url": "https://www.metropoles.com/colunas/manoela-alcantara/moraes-da-48h-para-defesa-de-bolsonaro-esclarecer-se-autorizou-ia-na-convencao-de-flavio", "fonte_id": "metropoles", "data_pub": "2026-07-29T01:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os advogados de Jair Bolsonaro têm 48 horas para esclarecer se o presidente autorizou o uso da imagem e voz dele em um vídeo de inteligência artificial exibido durante a convenção do Partido Liberal (PL).", "titulo_pt": "Moraes dá prazo de 48 horas para defesa de Bolsonaro esclarecer sobre autorização para uso de IA na convenção do pl", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 77294, "titulo": "Moraes dá 48h para defesa de Bolsonaro informar se ex-presidente autorizou vídeo com imagem e voz geradas por IA", "url": "https://g1.globo.com/politica/noticia/2026/07/28/moraes-da-48h-para-defesa-de-bolsonaro-explicar-se-uso-de-imagem-e-voz-do-ex-presidente-foram-autorizados-para-video-feito-por-ia.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-29T01:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do Supremo Tribunal Federal (STF), determinou que a defesa de Jair Bolsonaro informe se o ex-presidente autorizou o uso da sua imagem e voz em um vídeo gerado por inteligência artificial (IA) durante a convenção nacional do PL. O vídeo foi exibido na convenção e afirma que o ex-presidente está 'preso e calado' e pede apoio para Flávio Bolsonaro.", "titulo_pt": "Moraes dá 48h para defesa de Bolsonaro informar sobre uso de vídeo com IA", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 77385, "titulo": "Lula fala em buscar recursos 'por fora do arcabouço fiscal' para pesquisa em tecnologia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/lula-fala-em-buscar-recursos-por-fora-do-arcabouco-fiscal-para-pesquisa-em-tecnologia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-29T01:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula declarou que pretende incluir na sua campanha para a reeleição uma proposta de investimento em pesquisa científica e tecnológica, utilizando recursos 'por fora do arcabouço fiscal'.", "titulo_pt": "Lula quer investir em pesquisa com recursos 'fora do orçamento'", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 77460, "titulo": "Alckmin chama ataques de Milei de “lamentáveis” e critica ingerência", "url": "https://www.metropoles.com/brasil/alckmin-ataques-milei-lamentaveis", "fonte_id": "metropoles", "data_pub": "2026-07-29T00:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vice-presidente Alckmin classificou os ataques de Milei como 'lamentáveis' e criticou a ingerência do presidente argentino. Alckmin também afirmou que o presidente argentino presta 'desserviço' ao próprio país, mas que a crise não afetará o Mercosul.", "titulo_pt": "Alckmin chama ataques de Milei de ‘lamentáveis’ e critica ingerência do presidente argentino", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 77534, "titulo": "Não sou louco de brigar com China e EUA; não tenho o tanque deles, diz Lula", "url": "https://www.cnnbrasil.com.br/politica/nao-sou-louco-de-brigar-com-china-e-eua-nao-tenho-o-tanque-deles-diz-lula/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T00:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula afirmou que não faria sentido entrar em conflito com China e Estados Unidos, devido à falta de recursos militares comparáveis. Ele destacou a necessidade do Brasil expandir suas pesquisas em diversas áreas, com ênfase na exploração de minerais raros.", "titulo_pt": "Não sou louco de brigar com China e EUA; não tenho o tanque deles, diz Lula", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 77295, "titulo": "Federação PSDB-Cidadania lança Soninha Francine ao Senado por SP e confirma apoio a Tarcísio", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/07/28/federacao-psdb-cidadania-lanca-soninha-francine-ao-senado-por-sp-e-confirma-apoio-a-tarcisio.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-29T00:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A federação PSDB-Cidadania lançou Soninha Francine ao Senado pelo estado de São Paulo e confirmou o apoio a Tarcísio de Freitas para reeleição como governador. A convenção conjunta dos dois partidos também anunciou 95 candidatos a deputado estadual e 71 a deputado federal.", "titulo_pt": "Federação PSDB-Cidadania lança Soninha Francine ao Senado e apoia Tarcísio para governador", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 77315, "titulo": "Diretor da OMS diz que Brasil é exemplo mundial por sistema de saúde", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-07/diretor-da-oms-diz-que-brasil-e-exemplo-mundial-por-sistema-de-saude", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-07-28T23:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O diretor-geral da OMS, Tedros Adhanom Ghebreyesus, elogiou o Sistema Único de Saúde (SUS) do Brasil por sua ampla cobertura e universalidade. Segundo ele, poucos países possuem um sistema público com tal alcance.", "titulo_pt": "Diretor da OMS considera sus exemplo mundial", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 77297, "titulo": "Mendonça autoriza pedido da PF para autoridades internacionais rastrearem bens ligados ao Master no exterior", "url": "https://g1.globo.com/politica/noticia/2026/07/28/mendonca-autoriza-pedido-da-pf-para-autoridades-internacionais-rastrearem-bens-ligados-ao-master-no-exterior.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-28T22:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Andre Mendonça, do STF, autorizou a Polícia Federal a solicitar cooperação internacional para rastrear bens potencialmente vinculados à fraude no Banco Master. A PF busca localizar ativos como um supostamente valoroso iate ligado ao suspeito Daniel Vorcaro.", "titulo_pt": "Mendonça autoriza pedido da PF para rastrear bens do Master no exterior", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 77389, "titulo": "Governo Trump proíbe novos robôs humanoides chineses para proteger desenvolvimento da IA nos EUA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/07/governo-trump-proibe-novos-robos-humanoides-chineses-para-proteger-desenvolvimento-da-ia-nos-eua.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-28T22:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Trump proibiu a importação de novos robôs humanoides chineses e inversores de energia para proteger o desenvolvimento da inteligência artificial nos Estados Unidos. A medida visa à segurança nacional e ao retorno de indústrias-chave.", "titulo_pt": "Governo Trump proíbe novos robôs humanoides chineses para proteger o desenvolvimento da IA nos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 78120, "titulo": "Trump’s diversity crackdown reverberates through U.S. boardrooms", "url": "https://www.japantimes.co.jp/business/2026/07/29/companies/trump-diversity-us-boardrooms/", "fonte_id": "japan_times", "data_pub": "2026-07-29T02:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As nomeações de mulheres e minorias raciais para os conselhos de administração das empresas da S&P 500 atingiram o nível mais baixo em mais de uma década.", "titulo_pt": "Repressão de trump à diversidade impacta salas de diretoria nos EUA", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 77891, "titulo": "Trump administration bans new Chinese humanoid robots", "url": "https://www.bbc.co.uk/news/articles/cp9e2ex3ekyo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-29T02:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A administração Trump proibiu a entrada de novos robôs humanoides chineses nos Estados Unidos. O país está em uma corrida com China para liderar o desenvolvimento de robótica e inteligência artificial.", "titulo_pt": "Administração trump proíbe novos robôs humanoides chineses", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 78086, "titulo": "US says it intercepted ‘surprise’ Iranian missile attack", "url": "https://www.ft.com/content/509a6a94-8342-49c1-965f-66abff88b977?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-29T02:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos afirmam ter interceptado um suposto ataque de mísseis surpresa da Irã. Este incidente encerra uma pausa prolongada nas operações aéreas diretas.", "titulo_pt": "EUA dizem ter interceptado 'surpresa' de ataque de mísseis iraniano", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 77340, "titulo": "A obsessão com a decadência é a antecâmara do autoritarismo", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/colunas/rui-tavares/2026/07/a-obsessao-com-a-decadencia-e-a-antecamara-do-autoritarismo.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-07-29T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há cem anos, o mundo descobriu que um livro de 600 páginas escritas por um ex-professor e acadêmico frustrado era extremamente influente na Alemanha após a Primeira Guerra Mundial. O autor usou sua herança para explicar toda a história sem analisar documentos.", "titulo_pt": "A obsessão com a decadência é o antecâmara do autoritarismo", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 77518, "titulo": "Trump concorda em dar à Ucrânia licenças para mísseis Patriot, diz Zelensky", "url": "https://www.cnnbrasil.com.br/internacional/trump-concorda-em-dar-a-ucrania-licencas-para-misseis-patriot-diz-zelensky/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T01:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente ucraniano Zelensky afirmou que Trump concordou em fornecer licenças para mísseis Patriot à Ucrânia. Durante uma entrevista à Fox News, Zelensky mencionou que se reuniu com representantes da indústria americana após a reunião na Casa Branca.", "titulo_pt": "Trump concorda em fornecer licenças para mísseis Patriot à Ucrânia, diz Zelensky", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 78106, "titulo": "Giappone, il bilancio del terremoto sale ad almeno 13 morti e 100 feriti", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/29/giappone-il-bilancio-del-terremoto-sale-ad-almeno-13-morti-e-100-feriti_a4359258-ec22-4675-a66d-5df8d8e5f2a7.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-29T01:48:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O balanço do terremoto no Japão aumentou para pelo menos 13 mortos e 100 feridos. Há pessoas ainda deslocadas devido aos desabamentos.", "titulo_pt": "Japão, o balanço do terremoto chega a pelo menos 13 mortos e 100 feridos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 78067, "titulo": "IRGC claims attacks on US facilities in Jordan", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/irgc-claims-attacks-us-facilities-jordan", "fonte_id": "middle_east_eye", "data_pub": "2026-07-29T01:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Corpo de Guerra Revolucionário Islâmico (IRGC) afirmou ter atacado uma base aérea e um centro da Central de Comando dos Estados Unidos em Jordania usando mísseis balísticos. Segundo o IRGC, a resistência continuará enquanto as ameaças contra a República Islâmica do Irã e as ações ilegais americanas persistirem.", "titulo_pt": "IRGC afirma ter atacado instalações dos EUA em jordânia", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 77946, "titulo": "Senate confirms Clayton as Trump intelligence chief", "url": "https://www.lemonde.fr/en/international/article/2026/07/29/senate-confirms-clayton-as-trump-intelligence-chief_6755941_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-29T01:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jay Clayton foi confirmado como chefe da inteligência do governo Trump, em um momento de preocupação sobre a interferência das agências de segurança nacional na tentativa do presidente de reabrir o pleito presidencial de 2020. Ele substitui Bill Pulte, um fiel seguidor de Trump sem experiência relevante no cargo.", "titulo_pt": "Senado confirma Clayton como chefe de inteligência de Trump", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 78027, "titulo": "Saudi Arabia, US carry out strikes on Iran-backed groups in Iraq", "url": "https://www.aljazeera.com/news/2026/7/29/saudi-arabia-us-carry-out-strikes-on-iran-backed-groups-in-iraq?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-29T01:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Arábia Saudita e os Estados Unidos realizaram ataques contra grupos apoiados pela Irã no Iraque, conforme informou Riad. As operações foram executadas em coordenação com a força militar dos EUA.", "titulo_pt": "Arábia saudita e EUA realizam ataques em grupos iranianos no iraque", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 78125, "titulo": "UEFA hits out as FIFA plans minority stake sale", "url": "https://www.japantimes.co.jp/sports/2026/07/29/soccer/world-cup/fifa-minority-stake-sale/", "fonte_id": "japan_times", "data_pub": "2026-07-29T01:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A proposta imediatamente recebeu forte críticas da UEFA, que governante europeu do futebol, afirmando que 'transcende um limite que as instituições de governo do futebol nunca deveriam ultrapassar'.", "titulo_pt": "UEFA se opõe enquanto FIFA planeja venda de participação minoritária", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 77655, "titulo": "Detenido el exministro de Hidrocarburos de Bolivia por la distribución de gasolina adulterada", "url": "https://elpais.com/america/2026-07-29/detenido-el-exministro-de-hidrocarburos-de-bolivia-por-la-distribucion-de-gasolina-adulterada.html", "fonte_id": "elpais_america", "data_pub": "2026-07-29T01:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um ex-ministro de Hidrocarburos boliviano foi detido por distribuição de gasolina adulterada. Uma investigação oficial apontou que a flexibilização dos controles de combustível nos governos de Arce e Paz resultou em danos a 66.000 veículos.", "titulo_pt": "Ex-ministro de Hidrocarburos de bolívia é detido por distribuição de gasolina adulterada", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 78107, "titulo": "Attacco dell'Iran su una base Usa in Giordania, il petrolio balza del 3% in Asia", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/29/attacco-delliran-su-una-base-usa-in-giordania-il-petrolio-balza-del-3-in-asia_3a208b66-d175-4663-8a9b-716ee21a231f.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-29T01:13:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Missiles launched by Iran against a US base in Jordan were all intercepted. O preço do petróleo Brent atingiu cerca de 85 dólares por barril na Ásia.", "titulo_pt": "Ataque do Irã contra uma base dos EUA em jordânia: preços do petróleo sobem", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 77720, "titulo": "Houthis Claim Strike on Another Saudi Oil Tanker", "url": "https://www.nytimes.com/2026/07/28/world/middleeast/houthis-strike-saudi-tanker.html", "fonte_id": "nyt_world", "data_pub": "2026-07-29T01:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O grupo hutí no Iêmen afirma ter atacado outro navio de petróleo saudita na Baía Vermelha. Com o apoio da Irã que está bloqueando o Estreito de Ormuz, os hutís estão intensificando sua suposta blockada à navegação saudita em uma via marítima crucial.", "titulo_pt": "Hutís afirmam atacar outro navio de petróleo saudita", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 78031, "titulo": "Protests in Lima as Keiko Fujimori sworn in as Peru president", "url": "https://www.aljazeera.com/video/newsfeed/2026/7/29/protests-in-lima-as-keiko-fujimori-sworn-in-as-peru-president?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-29T01:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Keiko Fujimori foi juramentada como presidente do Peru em meio a protestos e prometeu endurecer a luta contra o crime.", "titulo_pt": "Protestos em Lima ao juramento de Keiko Fujimori como presidenta do Peru", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 77652, "titulo": "Estados Unidos asegura haber frustrado un ataque sorpresa de Teherán con misiles balísticos contra sus bases en Jordania", "url": "https://elpais.com/internacional/2026-07-29/estados-unidos-asegura-haber-frustrado-un-ataque-sorpresa-de-teheran-con-misiles-balisticos-contra-sus-bases-en-jordania.html", "fonte_id": "elpais_america", "data_pub": "2026-07-29T01:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos afirmam ter impedido um suposto ataque surpresa de Teerã com mísseis balísticos contra suas bases em Jordânia. O incidente reflete a incerteza em torno do novo cenário sem hostilidades anunciado por Trump.", "titulo_pt": "EUA afirmam ter frustrado suposto ataque surpresa de teerã com mísseis balísticos contra suas bases em jordânia", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 78127, "titulo": "India’s cockroach party threatens new protest after court order", "url": "https://www.japantimes.co.jp/news/2026/07/29/asia-pacific/politics/india-cockroach-party-court-order/", "fonte_id": "japan_times", "data_pub": "2026-07-29T01:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A corte superior do país contrariou a garantia dada pelo governo federal indiano de que todas as denúncias policiais contra os protestantes seriam retiradas. Isso pode levar a novos protestos.", "titulo_pt": "Partida de escorpiões no Índia ameaça nova protesto após decisão judicial", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 77733, "titulo": "Australia news live: inflation eases to 3.8%, reducing chance of rate hike; Icac hears of ‘shit sheet’ on former NSW Liberal minister", "url": "https://www.theguardian.com/australia-news/live/2026/jul/29/ben-carroll-victoria-premier-jacinta-allan-labor-abs-inflation-data-nsw-icac-inquiry-antisemitism-royal-commission-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-07-29T02:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inflação na Austrália caiu para 3,8%, reduzindo as chances de aumento da taxaSelic. Um Airbus A350 especial completou um voo de 24 horas e chegou a França antes de entrar no fleet da Qantas.", "titulo_pt": "Notícias em tempo real: inflação cai para 3,8%, diminuindo chances de elevação dos juros; avião airbus realiza vôo histórico", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 78121, "titulo": "Firms in central Japan suspected of condo repair bid-rigging", "url": "https://www.japantimes.co.jp/business/2026/07/29/companies/condominium-repair-ftc-bid-rigging/", "fonte_id": "japan_times", "data_pub": "2026-07-29T02:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Concorrência da Japan Fair Trade Commission realizou inspeções presenciais em mais de 20 empresas nas prefecturas de Aichi, Gifu e Mie. Essas empresas são suspeitas de terem praticado suborno para a atribuição de contratos de reparos de prédios.", "titulo_pt": "Empresas no centro do Japão suspeitas de fraudar licitações de reforma de condomínios", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 77382, "titulo": "Shein pode se tornar um incômodo maior para varejo brasileiro depois do IPO", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/shein-pode-se-tornar-um-incomodo-maior-para-varejo-brasileiro-depois-do-ipo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-29T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Shein, uma empresa de moda online chinesa, está aguarda istopher Nolan, recebeu críticas positivas da especialidade, mas não agradou uma tradutora da obra original de Homero.", "titulo_pt": "A crítica ácida de tradutora de 'A Odisseia' sobre A versão de Christopher Nolan no cinema", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 77369, "titulo": "'Quem Ama Cuida': Autores mudam história e Iuri passa a ser aliado de Adriana", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/07/quem-ama-cuida-autores-mudam-historia-e-iuri-passa-a-ser-aliado-de-adriana.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-28T18:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na novela 'Quem Ama Cuida', o personagem Iuri, interpretado por José Loreto, passará a ser aliado de Adriana (Letícia Colin) na sua vingança contra Pilar (Isabel Teixeira).", "titulo_pt": "Novo aliado para Adriana em 'quem Ama Cuida'", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 77370, "titulo": "'Splatoon Raiders' aposta na repetição e é mais pálido que suas cores", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/07/splatoon-raiders-aposta-na-repeticao-e-e-mais-palido-que-suas-cores.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-28T18:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Splatoon Raiders destaca-se pela falta de cores vibrantes que são características da série, apresentando uma paisagem nebulosa com hélices de helicóptero. O jogo parece repetir elementos do multiplayer original sem a mesma intensidade cromática.", "titulo_pt": "Splatoon Raiders chama atenção pela paleta de cores mais escassa", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 77371, "titulo": "Novo disco dos Strokes arrisca soar exagerado para fugir do passado", "url": "https://redir.folha.com.br/redir igo oferece orientações sobre como proceder se um migrante for abordado pelo ICE em aeroportos dos Estados Unidos em julho de 2026. Os leitores são instruídos sobre quais documentos mostrar e quando falar, bem como os cinco passos essenciais a seguir.", "titulo_pt": "Cinco passos para se guiar caso o ICE aborde um migrante em aeroportos nos EUA em julho 2026", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 77849, "titulo": "Con foco en nacimientos, vejez y empleo formal: autoridades discuten medidas para mejorar la protección social en Chile", "url": "https://www.latercera.com/pulso/noticia/con-foco-en-nacimientos-vejez-y-empleo-formal-autoridades-discuten-medidas-para-mejorar-la-proteccion-social-en-chile/", "fonte_id": "la_tercera", "data_pub": "2026-07-29T01:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Autoridades chilenas discutiram medidas para melhorar a proteção social, focando em nascimentos, velhice e emprego formal. O evento foi marcado pelo reconhecimento de que ainda há muito a ser feito para alcançar os objetivos desejados.", "titulo_pt": "Com foco em nascimentos, velhice e emprego formal: autoridades discutem medidas para melhorar a proteção social no Chile", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 77851, "titulo": "La urgencia del desempleo juvenil", "url": "https://www.latercera.com/cartas-al-director/noticia/la-urgencia-del-desempleo-juvenil/", "fonte_id": "la_tercera", "data_pub": "2026-07-29T00:56:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a urgência do problema do desemprego jovem, destacando as necessidades urgentes de soluções para esta questão social.", "titulo_pt": "A urgência do desemprego juvenil", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 77858, "titulo": "Grandes y medianas empresas estarán obligadas a informar sobre sus políticas de equidad de género", "url": "https://www.latercera.com/pulso/noticia/grandes-y-medianas-empresas-estaran-obligadas-a-informar-sobre-sus-politicas-de-equidad-de-genero/", "fonte_id": "la_tercera", "data_pub": "2026-07-29T00:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As empresas com mais de 200 funcionários terão a obrigação de informar anualmente sobre suas políticas de equidade de gênero. Para setores específicos, como mineração, pesquisa e desenvolvimento, finanças, energia, transporte e construção, essa exigência começa para empresas com mais de 50 empregados.", "titulo_pt": "Grandes e médias empresas terão de relatar políticas de equidade de gênero", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 77861, "titulo": "El otro drama de los temporales: 15 mil personas se mantienen aisladas hace casi una semana", "url": "https://www.latercera.com/nacional/noticia/el-otro-drama-de-los-temporales-15-mil-personas-se-mantienen-aisladas-hace-casi-una-semana/", "fonte_id": "la_tercera", "data_pub": "2026-07-29T00:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um sistema frontal mantém grande parte do país sob alerta, com tornados, chuvas intensas e ventos fortes na região centro-sul. Em Atacama e Coquimbo, milhares de pessoas permanecem isoladas há cerca de uma semana, recebendo alimentos e insumos médicos por meio de lançamentos aéreos.", "titulo_pt": "Outro drama dos temporais: 15 mil pessoas se mantêm isoladas há quase uma semana", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 77792, "titulo": "The Horrible Rise of the Makeout Police", "url": "https://www.theatlantic.com/family/2026/07/make-out-public-display-affection/688087/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-07-28T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ano após o incidente com Coldplay, outra dupla está se tornando viral por seus atos de afeto público.", "titulo_pt": "A ascensão horível da polícia dos beijos", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 77450, "titulo": "Denúncias de 20 pacientes com sequelas levam polícia a interditar clínica no Rio", "url": "https://veja.abril.com.br/brasil/denuncias-de-20-pacientes-com-sequelas-levam-policia-a-interditar-clinica-no-rio/", "fonte_id": "veja", "data_pub": "2026-07-28T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Policiais interditaram uma clínica estética em São João de Meriti, na Baixada Fluminense, após denúncias de 20 pacientes que relataram sequelas. A dona do estabelecimento é suspeita de usar substâncias proibidas e está foragida.", "titulo_pt": "Denúncias de 20 pacientes com sequelas levam polícia a interditar clínica no Rio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 77632, "titulo": "No Brasil, mulheres freelancers ganham quase 26% menos do que os homens, aponta estudo", "url": "https://www.jota.info/trabalho/no-brasil-mulheres-freelancers-ganham-quase-26-menos-do-que-os-homens-aponta-estudo", "fonte_id": "jota", "data_pub": "2026-07-28T13:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No Brasil, mulheres que trabalham como freelancers ganham cerca de 26% menos do que os homens. Essa taxa é superior à média global, que registra uma diferença salarial de gênero entre freelancers de 19%.", "titulo_pt": "Mulheres freelancers no Brasil ganham quase 26% menos do que os homens, aponta estudo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 77582, "titulo": "A socorrista que trabalhou 18 dias seguidos em área mais atingida pelo terremoto na Venezuela: 'Sinto que nunca vou me livrar deste cheiro de morte'", "url": "https://www.bbc.com/portuguese/articles/c151nw89kn8o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-28T13:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daniela Villarroel, uma socorrista que trabalhou 18 dias seguidos na área mais afetada pelo terremoto na Venezuela, relata ainda s e-levou-a-morte-de-estudante/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-28T10:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um pesquisador da Universidade de São Paulo (USP) foi condenado por estupro que resultou na morte de uma estudante. A vítima faleceu devido a uma infecção generalizada após o abuso sexual ocorrido em um alojamento estudantil.", "titulo_pt": "Pesquisador da USP é condenado por estupro que levou à morte de estudante", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 76546, "titulo": "PMs acusados de morte de jovem rendido em Paraisópolis vão a júri em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/pms-acusados-de-morte-de-jovem-rendido-em-paraisopolis-vao-a-juri-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-28T09:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os policiais militares Renato Torquatto e Robson Noguchi vão a júri no dia 28 de março para responder por homicídio qualificado após o caso envolvendo Igor Oliveira em julho de 2025.", "titulo_pt": "Pms acusados de morte de jovem rendido em Paraisópolis vão a júri em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 76676, "titulo": "Um mundo em que o tabagismo no Brasil atinge seu nível mais baixo", "url": "https://www.jota.info/opiniao-e-analise/artigos/um-mundo-em-que-o-tabagismo-no-brasil-atinge-seu-nivel-mais-baixo", "fonte_id": "jota", "data_pub": "2026-07-28T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O consumo de tabaco no Brasil aumentou, levantando dúvidas sobre a eficácia das políticas públicas nesse campo.", "titulo_pt": "Um mundo em que o tabagismo no Brasil atinge seu nível mais baixo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 77693, "titulo": "Diez años después: la Ley de Etiquetado no cambió a las personas, cambió lo que les ofrecíamos", "url": "https://www.ciperchile.cl/2026/07/28/diez-anos-despues-la-ley-de-etiquetado-no-cambio-a-las-personas-cambio-lo-que-les-ofreciamos/?utm_source=rss&utm_medium=rss&utm_campaign=diez-anos-despues-la-ley-de-etiquetado-no-cambio-a-las-personas-cambio-lo-que-les-ofreciamos", "fonte_id": "ciper_chile", "data_pub": "2026-07-28T08:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A lei de etiquetamento não mudou as pessoas, mas alterou o que elas tinham à disposição. Este artigo foi publicado inicialmente no CIPER Chile.", "titulo_pt": "Dez anos depois: a lei de etiquetagem não mudou as pessoas, mudou o que elas tinham acesso", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 77941, "titulo": "France's Gros-Bessillon wildfire is 'under control,' leaving firefighters exhausted: 'It's been nonstop for eight days'", "url": "https://www.lemonde.fr/en/environment/article/2026/07/29/france-s-gros-bessillon-wildfire-is-under-control-leaving-firefighters-exhausted-it-s-been-nonstop-for-eight-days_6755940_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-29T01:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "70 homens e três mulheres estão trabalhando dia e noite em Correns, na região sudeste do departamento de Var, para conter as chamas que devastaram 4.500 hectares de matas secas desde o dia 21 de julho e destruíram 31 casas.", "titulo_pt": "Chama da grande incêndio de Gros-Bessillon está sob controle, mas bombeiros estão exaustos: 'foram oito dias sem parar'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 77726, "titulo": "Kenya investigating unexpected deaths of 15 elephants in national park", "url": "https://www.theguardian.com/world/2026/jul/29/elephant-deaths-kenya-amboseli-national-park", "fonte_id": "guardian_world", "data_pub": "2026-07-29T00:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ocorreram 15 mortes de elefantes em um período de um mês no Parque Nacional Amboseli, na Kenya. As autoridades detectaram possíveis substâncias tóxicas nos animais e estão investigando o incidente.", "titulo_pt": "Kenya investiga mortes inesperadas de 15 elefantes no parque nacional amboseli", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 77438, "titulo": "Empresas viram corresponsáveis pelas embalagens plásticas a partir de agosto", "url": "https://veja.abril.com.br/agenda-verde/empresas-viram-corresponsaveis-pelas-embalagens-plasticas-em-agosto/", "fonte_id": "veja", "data_pub": "2026-07-28T23:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir de agosto, as empresas passarão a ser corresponsáveis pela logística reversa e pelo uso do plástico reciclado. O prazo para adaptação das novas regras federais terminou.", "titulo_pt": "Empresas se tornam corresponsáveis pelas embalagens plásticas a partir de agosto", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 78156, "titulo": "France, Spain make headway against wildfires but new heatwave looms", "url": "https://www.scmp.com/news/world/europe/article/3362177/france-spain-make-headway-against-wildfires-new-heatwave-looms?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-28T16:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais estão sendo controlados por bombeiros na França e Espanha, após evacuações massivas de pessoas. A região já foi afetada por um verão extremamente quente e seco, e uma nova onda de calor está prevista para chegar a partir da próxima terça-feira.", "titulo_pt": "França e Espanha fazem progresso contra incêndios, mas nova onda de calor se aproxima", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 77981, "titulo": "Rescue teams evacuate flooded villages in Sheikhupura Pakistan", "url": "http://www.euronews.com/video/2026/07/28/rescue-teams-evacuate-flooded-villages-in-sheikhupura-pakistan", "fonte_id": "euronews", "data_pub": "2026-07-28T14:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Equipes de resgate evacuam moradores por barco nas aldeias afetadas pelos inundações monçônicas em Sheikhupura, Paquistão. As casas foram submergidas e as comunidades ficaram sem suprimentos básicos.", "titulo_pt": "Equipes de resgate evacuam aldeamentos afetados por inundações em Sheikhupura, paquistão", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 77728, "titulo": "Past fires suggest effects of Europe and North America wildfires may linger for years", "url": "https://www.theguardian.com/world/2026/jul/28/wildfires-europe-north-america-effects", "fonte_id": "guardian_world", "data_pub": "2026-07-28T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três anos após os incêndios no Havaí, muitas pessoas ainda enfrentam consequências biológicas, emocionais e sociais. Uma série de intensos incêndios florestais na América do Norte e Europa, agravados pelo clima crisis, estão devastando casas e florestas e forçando milhares de pessoas a se mudarem. Estudos anteriores indicam que os efeitos desses incêndios podem persistir por anos.", "titulo_pt": "Fogos do passado sugerem que efeitos dos incêndios na Europa e américa do norte podem durar anos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 77982, "titulo": "Tsunami alert follows powerful earthquake in southwest Japan", "url": "http://www.euronews.com/video/2026/07/28/tsunami-alert-follows-powerful-earthquake-in-southwest-japan", "fonte_id": "euronews", "data_pub": "2026-07-28T12:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um alerta de tsunami foi emitido após um terremoto de magnitude 7,1 ocorrer na região de Kyushu no sul da Japan, causando danos a edifícios, interrompendo o fornecimento de energia e levantando esforços de resposta emergencial.", "titulo_pt": "Alerta de tsunami após forte terremoto na parte sudoeste do Japão", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 77983, "titulo": "Aerial footage shows wildfires spreading across Spain's Madrid region", "url": "http://www.euronews.com/video/2026/07/28/aerial-footage-shows-wildfires-spreading-across-spains-madrid-region", "fonte_id": "euronews", "data_pub": "2026-07-28T12:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais estão se espalhando pela região de Madrid, na Espanha. Bombeiros estão lutando para conter as chamas com a ajuda de aeronaves que transportam água.", "titulo_pt": "Vídeo aerial mostra incêndios se alastrando pela região de Madrid, na Espanha", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 77984, "titulo": "Many feared dead after quake leaves shoppers trapped in Japanese mall", "url": "http://www.euronews.com/2026/07/28/tsunami-warning-lifted-in-southern-japan-after-71-quake", "fonte_id": "euronews", "data_pub": "2026-07-28T11:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foi relatado um possível acidente de explosão no shopping Aeon Mall na região de Kumamoto, no Japão. No entanto, as autoridades policiais não forneceram informações sobre danos materiais ou vítimas.", "titulo_pt": "Muitos temem mortes após terremoto deixar compradores presos em shopping japonês", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 78357, "titulo": "Analysis: Wind and solar power overtake fossil fuels in Germany for first time ever", "url": "https://www.carbonbrief.org/analysis-wind-and-solar-power-overtake-fossil-fuels-in-germany-for-first-time-ever", "fonte_id": "carbon_brief", "data_pub": "2026-07-28T11:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2025, a eletricidade gerada por eólica e solar ultrapassou pela primeira vez a energia proveniente de combustíveis fósseis na Alemanha.", "titulo_pt": "Análise: energia eólica e solar superam combustíveis fósseis na Alemanha pela primeira vez", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 78358, "titulo": "Analysis: 84% of nations miss deadline to identify ‘nature-harming’ subsidies by 2025", "url": "https://www.carbonbrief.org/analysis-84-of-nations-miss-deadline-to-identify-nature-harming-subsidies-by-2025", "fonte_id": "carbon_brief", "data_pub": "2026-07-28T11:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "84% dos países não atingiram o prazo de 2025 para identificar todas as subsídios que podem ser prejudiciais à biodiversidade. A maioria das nações falhou em cumprir esse objetivo.", "titulo_pt": "Análise: 84% dos países não cumprem prazo para identificar subsídios danosos à natureza até 2025", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 76708, "titulo": "Una masa de aire antártico traerá temperaturas de hasta -20°C al sur del país: ¿puede llegar a Buenos Aires?", "url": "https://www.lanacion.com.ar/sociedad/una-masa-de-aire-antartico-traera-temperaturas-de-hasta-20c-al-sur-del-pais-puede-llegar-a-buenos-nid28072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-28T11:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Serviço Meteorológico Nacional prevê um forte decréscimo térmico na Patagonia até o fim da semana, com nevadas e mínimas muito baixas; as temperaturas podem chegar a -20°C. Este fenômeno antártico pode afetar outras regiões do país.", "titulo_pt": "Massa de ar antártico trará temperaturas de até -20°C à patagonia: impacto sobre o resto do país?", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 76715, "titulo": "Hay alerta roja y amarilla por frío extremo, tormentas y vientos para este martes 28 de julio: las provincias afectadas", "url": "https://www.lanacion.com.ar/sociedad/hay-alerta-roja-y-naranja-por-frio-extremo-tormentas-y-vientos-para-este-martes-28-de-julio-las-nid28072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-28T10:58:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Serviço Meteorológico Nacional emitiu alertas vermelho e amarelo para frio extremo, tormentas e ventos nesta terça-feira, 28 de julho. A máxima prevista na Cidade Autônoma de Buenos Aires será de 16°C.", "titulo_pt": "Há alerta vermelho e amarelo por frio extremo, tempestades e ventos para esta terça-feira 28 de julio: quais as províncias afetadas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 76926, "titulo": "Wildfire in southwest France highlights Seveso sites' vulnerability to forest fires", "url": "https://www.lemonde.fr/en/economy/article/2026/07/28/wildfire-in-southwest-france-highlights-seveso-sites-vulnerability-to-forest-fires_6755920_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-28T10:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais na região sul da França exigiram medidas de proteção em instalações industriais que utilizam ou armazenam materiais inflamáveis ou explosivos. Pelo menos sete dessas instalações, listadas no departamento do Gironde, estavam próximas ao fogo ou localizadas em cidades evacuadas.", "titulo_pt": "Incêndio florestal na França destaca vulnerabilidade de sites Seveso", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 76951, "titulo": "Wildfires burn nearly 300,000 acres in France and Spain as heat wave looms", "url": "https://www.cnbc.com/2026/07/28/france-spain-wildfires-heat-wave.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-28T10:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais estão queimando quase 300 mil acres na França e Espanha, enquanto temperaturas elevadas são esperadas na região. As chamas já afetaram áreas da Espanha e os bombeiros lutam para controlar as fogueiras.", "titulo_pt": "Incêndios florestais queimam quase 300 mil acres na França e Espanha com onda de calor iminente", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 76629, "titulo": "Terremoto de magnitude 7,1 atinge o Japão; shopping desaba e deixa pessoas presas nos escombros", "url": "https://www.bbc.com/portuguese/articles/cp8x5wzp7wzo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-28T10:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 7,1 atingiu o Japão, causando a desabamento de um shopping e deixando pessoas presas nos escombros. A primeira-ministra Sanae Takaichi informou que o tremor também resultou em colapsos de edifícios e incêndios.", "titulo_pt": "Terremoto de magnitude 7,1 atinge o Japão; shopping desaba e pessoas ficam presas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 78028, "titulo": "After fleeing Sudan’s war, refugees battle thirst in Chad’s camps", "url": "https://www.aljazeera.com/news/2026/7/29/after-fleeing-sudans-war-refugees-battle-thirst-in-chads-camps?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-29T01:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Familias que fugiram da guerra e dos crimes em Sudão agora enfrentam escassez de água e perdas de esperança de retornar a suas casas no acampamento do Chade.", "titulo_pt": "Depois de fugirem da guerra no sudão, refugiados lutam contra a escassez d'água nos acampamentos do chade", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 77689, "titulo": "Sergio Jadue es sobreseído en Chile; MOP anuncia inversión de US$15.000 millones en proyectos de infraestructura pública, y formalizan a exseremi de Salud por presunta violación", "url": "https://www.ciperchile.cl/2026/07/28/radar-28-07-26/?utm_source=rss&utm_medium=rss&utm_campaign=radar-28-07-26", "fonte_id": "ciper_chile", "data_pub": "2026-07-29T00:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Sergio Jadue foi sobreseído no Chile; o MOP anunciou u
