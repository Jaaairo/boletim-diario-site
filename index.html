<html lang="pt-BR">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

óculos inteligentes. O presidente francês Emmanuel Macron pediu à União Europeia que tomassem medidas imediatas para reduzir os preços da energia. Em relação a negociações internacionais, a Coreia do Sul, Estados Unidos e Japão reafirmaram o objetivo de desnuclearização da Coreia do Norte e incentivaram o diálogo. Durante a Assembleia Geral das Nações Unidas, a inteligência artificial foi discutida, com diplomatas, autoridades e especialistas debatendo os riscos e oportunidades da IA. No Brasil, o presidente Lula criticou a postura do presidente dos EUA, Joe Biden, descrevendo-o como um 'imperador' que age com a 'lei do mais forte', durante a Assembleia Geral das Nações Unidas em Nova York.\n\nO Estreito de Taiwan foi transitado temporariamente por dois navios da Marinha da Nova Zelândia, um evento geopolítico que reforça a presença estrangeira na região, tradicionalmente um assunto de disputa entre China e Taiwan. Em outro desenvolvimento, a Assembleia Geral das Nações Unidas em 2026 será dominada pelo conflito entre Estados Unidos e Israel contra o Irã, com o presidente dos Estados Unidos, Joe Biden, planejando fazer uma declaração na assembleia. O conflito entre Estados Unidos e Israel contra o Irã também afetou a popularidade de Trump, que viu sua aprovação cair para 32% devido à guerra e à alta dos custos. Além disso, a China está promovendo a construção de infraestrutura no sul da Ásia usando ferramentas de inteligência artificial, enquanto a Rússia pratica guerra híbrida na Europa, levando a críticas de líderes europeus. O Irã também enfrenta pressões, com a Coreia do Sul, Estados Unidos e Japão reafirmando seu compromisso com a desnuclearização do país e pedindo para que ele retome diálogos.", "economia": "As bolsas da Europa subiram em resposta às expectativas positivas sobre um encontro entre Estados Unidos e China, o que contribuiu para um aumento do apetite dos investidores por riscos. A atividade econômica no Brasil está mostrando sinais de desaceleração, com o PIB indicando um enfraquecimento do mercado de trabalho e do consumo. Diante disso, o Bradesco prevê que a taxa Selic deve cair para 13,25% ao ano até o fim do ano. A Vale adquiriu 30% da empresa Ligga com o objetivo de dobrar a produção de minérios na região de Carajás, no Pará, enquanto a BP planeja estabelecer um polo de petróleo e gás no Brasil, focando em descobertas no campo de Santos. Além disso, a China está aumentando seus investimentos em inteligência artificial, enquanto a economia do país desacelera. O Brasil pode alcançar uma nova safra recorde de grãos em 2026/2027, com o potencial produtivo continuando a crescer anualmente. A Caixa Econômica Federal rejeitou a proposta de negociação dos bancários, resultando em uma paralisação por tempo indeterminado. A Evertec, uma empresa de tecnologia, oferece um programa de bolsas de estudo chamado Becas, que já investiu US$ 1,5 milhão.", "tecnologia": "O Reino Unido planeja se encontrar pessoalmente com o presidente dos Estados Unidos, Donald Trump, durante a reunião da ONU em Nova York, para discutir a necessidade de um esforço global para controlar os riscos associados à inteligência artificial (IA). O primeiro-ministro britânico também abordará a questão durante a reunião. Paralelamente, o CEO da OpenAI, Sam Altman, apresentará a Segurança das Nações Unidas com novas propostas de rastreamento de riscos de desalinhamento de IA. Essas propostas incluem o desenvolvimento de padrões globais de IA para orientar o alinhamento, sugeridos pela OpenAI. Além disso, o agente de inteligência artificial pessoal Muse, desenvolvido pela Meta, atingiu 730.000 downloads em cinco dias e 2,5 milhões em 13 dias após o lançamento, superando o ChatGPT em termos de downloads e usuários diários ativos nos Estados Unidos e no Canadá. A empresa Kairos Power firmou um acordo com a Samsung C&T para construir sua primeira usina nuclear de 50 megawatts, que fornecerá energia nuclear para o Google no futuro.", "ciencia": "A Albânia se juntou à comunidade internacional da exploração espacial ao assinar os Acordos Artemis, tornando-se a 73ª signatária desses acordos. Esta iniciativa da NASA, que reuniu parceiros em Houston, visa preparar a próxima geração de trabalhadores espaciais. Em outro avanço, cientistas da King Abdullah University of Science and Technology desenvolveram a ferramenta de inteligência artificial Unify, que compara tipos celulares entre espécies distantes, ajudando a entender a evolução humana. A descoberta de uma nova espécie de gato na Bolívia, após análise genética, chama a atenção para a biodiversidade ainda desconhecida. Além disso, pesquisas em nanotecnologia e biotecnologia apresentam novas abordagens para o tratamento de doenças, desde endometriose até gliomas, enquanto a NASA continua explorando o espaço com o rover Perseverance, que capturou imagens panorâmicas de uma área geológica conhecida como 'Turquesa Bay' em Marte.", "cultura": "A França comemora o bicentenário da fotografia com exposições temáticas, destacando a história e a importância da fotografia em um contexto dominado por imagens digitais. Em Buenos Aires, uma exposição apresenta um lado menos conhecido de Francisco Goya, antes de seu período mais sombrio, retratando tapetes decorativos para a realeza. A retrospectiva 'The Book of Alison Knowles' explora o uso do livro na obra abrangente de Alison Knowles e seu impacto na arte americana. Na Argentina, Arnold Schwarzenegger, de 79 anos, mantém seu corpo impressionante através de uma rotina de exercícios diárias, recomendando exercícios básicos e mencionando um método histórico. Além disso, o governo argentino anunciou um feriado regional em Magallanes no dia 21 de setembro, reconhecendo a história da região. O conde Charles Spencer lançou um livro contendo acusações sobre a reação do Rei Carlos III após a morte de Diana em 1997.", "sociedade": "A maioria dos brasileiros se considera saudável, mas estudos mostram que 63% estão acima do peso e 42% nunca praticam atividade física, alerta um estudo. Em Gaza, centenas de milhares de crianças voltaram às aulas presenciais após três anos, apesar de escolas danificadas. No Chile, 18 membros de um grupo mapuche radical foram condenados a mais de mil anos de prisão por um ataque armado. Em Minas Gerais, a greve de professores de escolas particulares continua sem acordo, com uma nova assembleia marcada para discutir os próximos passos. Além disso, a ONU estima que a gravidez e a maternidade na adolescência custam R$ 6 bilhões ao Brasil, impactando educação, mercado de trabalho, renda, saúde e arrecadação pública.", "meio_ambiente": "Políticos de vários países se reúnem em Nova York para a Assembleia Geral da ONU, onde discutem a crise climática. Este ano, as temperaturas extremas e os eventos climáticos recordes têm causado preocupação. O fenômeno El Niño continua a causar impactos significativos, como seca, dengue e inundações, especialmente na América Latina. A Organização Pan-Americana da Saúde emitiu um alerta para a região. O Brasil foi mencionado devido à deterioração da qualidade do ar. Além disso, o 'super El Niño' de 2015-2016 está entrando em território de recordes, com temperaturas superficiais do oceano no Pacífico tropical igualando os maiores valores registrados. O Fundo Vale conseguiu mobilizar R$ 5,9 bilhões para projetos florestais a partir do investimento inicial de R$ 1 bilhão, transformando-se em um estruturador de blended finance.", "direitos_humanos": "Um relator especial do Conselho de Direitos Humanos da ONU afirmou que ataques americanos a barcos suspeitos de tráfico de drogas no Pacífico e Caribe, desde setembro de 2025, podem constituir crimes contra a humanidade, resultando em mais de 230 mortes. Em outro desenvolvimento, o Parlamento francês está debatendo uma nova lei contra violência de gênero e sexual, que poderia afetar plataformas digitais de pornografia como OnlyFans. Além disso, a guerra israelense na Gaza está desestruturando famílias, com as mulheres se tornando cabeças de família em aproximadamente um quarto dos lares. Elas buscam ajuda e abrigo em um ambiente perigoso. Magdalena Browne, presidente da ComunidadeMujer, destaca que os cuidados são um tema de política pública, não um assunto doméstico, abordando a realidade chilena e a tramitação do projeto de sala cuna. Também foi noticiado que um homem foi condenado após disparar contra três estudantes palestinos em Vermont em 2023, enquanto pesquisas mostram que as mulheres consideram o combate ao feminicídio como a área da segurança pública mais importante para ser melhorada. Por fim, o processo de acesso à Casa Branca de jornalistas dos canais banidos por Trump foi iniciado após proibições de Donald Trump, destacando a importância de uma democracia livre de discriminação por ponto de vista."}, "resumo_do_dia": {"politica_nacional": [{"id": 175022, "titulo": "Análise: Flávio quer reduzir vantagem de Lula no Nordeste", "url": "https://www.cnnbrasil.com.br/eleicoes/analise-flavio-quer-reduzir-vantagem-de-lula-no-nordeste/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-21T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diferença entre Lula e Flávio Bolsonaro no Nordeste diminuiu desde 2022. Flávio Bolsonaro tem investido em uma agenda para essa região.", "titulo_pt": "Análise: flávio quer reduzir vantagem de Lula no Nordeste", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 174911, "titulo": "O bolsonarismo é uma péssima opção", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/michael-franca/2026/09/o-bolsonarismo-e-uma-pessima-opcao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-21T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "É possível votar contra o bolsonarismo sem ser necessariamente progressista ou aderir a projetos políticos alternativos. O bolsonarismo é considerado prejudicial ao Brasil, segundo a fonte.", "titulo_pt": "O bolsonarismo é uma péssima opção", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 175235, "titulo": "Milhas aéreas: o mesmo roteiro da bagagem se repete no Congresso", "url": "https://www.jota.info/opiniao-e-analise/artigos/milhas-aereas-o-mesmo-roteiro-da-bagagem-se-repete-no-congresso", "fonte_id": "jota", "data_pub": "2026-09-21T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O setor de milhas aéreas promete oferecer passagens mais baratas, mas justifica essa medida com o confisco de pontos e milhas. Isso sugere que as regras para o uso dessas milhas podem estar se tornando mais restritivas.", "titulo_pt": "Milhas aéreas: o mesmo roteiro da bagagem se repete no Congresso", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 174892, "titulo": "TSE forma maioria para manter suspensa campanha de Deltan Dallagnol ao Senado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/tse-forma-maioria-para-manter-suspensa-campanha-de-deltan-dallagnol-ao-senado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-21T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TSE formou maioria para manter suspensa a campanha de Deltan Dallagnol ao Senado pelo Paraná. Esta decisão ocorreu nesta segunda-feira (21).", "titulo_pt": "TSE mantém suspensa campanha de Deltan Dallagnol ao Senado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 174902, "titulo": "Quaest: cai parcela que diz que caso Master afeta 'todos'; 21% citam família Bolsonaro; 16%, o STF; e 11%, o governo Lula", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/21/quaest-impactos-do-caso-master-e-crise-no-stf.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-21T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest mostrou que 37% das pessoas acreditam que o escândalo do Banco Master afeta 'todos' de forma generalizada, uma redução em comparação à pesquisa anterior. Houve um aumento nas menções à Família Bolsonaro (21%), ao Supremo Tribunal Federal (16%) e ao governo Lula (11%).", "titulo_pt": "Quaest: parcela que afirma que caso Master afeta 'todos' cai; 21% citam família Bolsonaro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 174903, "titulo": "Fio do Professor Felipe Nunes: análise da pesquisa Quaest para presidente de 21 de setembro", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/21/fio-do-professor-felipe-nunes-quaest-21-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-21T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na pesquisa Quaest para o primeiro turno, Lula e Flávio Bolsonaro aparecem tecnicamente empatados com 37% e 33% dos votos, respectivamente, enquanto Cury e Caiado somam 6% e 4%. Os outros candidatos somam 9%, e 8% dos entrevistados são indecisos ou não pretendem votar.", "titulo_pt": "Análise da pesquisa Quaest para presidente de 21 de setembro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 174914, "titulo": "Lula diz que Uruguai cedeu ao Brasil cota de carne para China; efeito será limitado em 2026", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/09/lula-diz-que-uruguai-cedeu-ao-brasil-cota-de-carne-para-china-efeito-sera-limitado-em-2026.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-21T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva afirmou que o Uruguai cedeu parte de sua cota de exportação de carne bovina para a China ao Brasil, uma vez que os frigoríficos brasileiros já atingiram a cota nacional de embarques em 2026.", "titulo_pt": "Lula diz que Uruguai cedeu ao Brasil cota de carne para China; efeito será limitado em 2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 174927, "titulo": "Escolas privadas fora de locais de votação terão aulas normais no DF", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/escolas-privadas-fora-de-locais-de-votacao-terao-aula-no-df", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-21T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo do Distrito Federal alterou um decreto que suspendia as aulas nas escolas privadas no período das eleições, permitindo agora que as escolas que não forem requisitadas para votação mantenham suas atividades normais. A mudança foi publicada no Diário Oficial do DF.", "titulo_pt": "Escolas privadas sem locais de votação podem manter aulas normais no DF", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 174894, "titulo": "Assessora de Flávio Bolsonaro negociou liberação de emendas com miliciano condenado no caso Marielle", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/assessora-de-flavio-bolsonaro-negociou-liberacao-de-emendas-com-miliciano-condenado-no-caso-marielle.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-21T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2023, uma assessora de Flávio Bolsonaro negociou a liberação de emendas parlamentares com Robson Calixto, conhecido como 'Peixe', que foi condenado pelo STF por envolvimento no assassinato de Marielle Franco.", "titulo_pt": "Assessora de Flávio Bolsonaro negociou emendas com miliciano condenado no caso Marielle", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 174906, "titulo": "Quaest: 50% desaprovam governo Lula e 44% aprovam", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/21/quaest-aprova-desaprova-governo-21-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-21T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest divulgada em 21 de fevereiro mostrou que 50% dos entrevistados desaprovam o governo Lula e 44% aprovam. Há uma semana, os índices eram semelhantes, com 50% desaprovando e 43% aprovando.", "titulo_pt": "50% Desaprovam governo Lula e 44% aprovam, mostra pesquisa", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 174907, "titulo": "Haddad defende mudanças em concessões, diz que Faria Lima terá de 'esperar um pouquinho' e critica ausência de Tarcísio em debate", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/09/21/haddad-defende-mudancas-em-concessoes-diz-que-faria-lima-tera-de-esperar-um-pouquinho-e-critica-ausencia-de-tarcisio-em-debate.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-21T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fernando Haddad, candidato do PT a governador de São Paulo, criticou a ausência de Tarcísio de Freitas, governador e candidato à reeleição pelo Republicanos, em um debate organizado pela Record. Haddad defendeu mudanças nas concessões e afirmou que a Faria Lima terá de 'esperar um pouquinho'.", "titulo_pt": "Haddad critica ausência de Tarcísio em debate e defende mudanças em concessões", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 174895, "titulo": "Na reta final, campanha de Lula reforça atos de rua e presença do presidente nos estados", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/na-reta-final-campanha-de-lula-reforca-atos-de-rua-e-presenca-do-presidente-nos-estados.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-21T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na fase final da campanha antes do primeiro turno, a campanha de Lula promete realizar mais atos de rua com o objetivo de mobilizar eleitores, especialmente aqueles com menor renda, que tendem a ter maior probabilidade de abstenção.", "titulo_pt": "Na reta final, campanha de Lula prevê mais atos de rua para mobilizar eleitores", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 174918, "titulo": "Governo Lula quer obrigar redes sociais a verificar contratantes de anúncios de serviços financeiros", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/governo-lula-quer-obrigar-redes-sociais-a-verificar-contratantes-de-anuncios-de-servicos-financeiros.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-21T20:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula pretende estabelecer regras para fiscalizar anúncios e conteúdos nas plataformas digitais, com foco especial na publicidade de serviços financeiros. Serão exigidas medidas como a identificação dos contratantes de anúncios e a manutenção de dados por pelo menos um ano.", "titulo_pt": "Governo Lula quer fiscalizar anúncios de serviços financeiros em redes sociais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [{"titulo": "Lula tem 37%, e Flávio Bolsonaro, 33% no 1º turno; candidatos empatam no 2º turno", "sumario": "A pesquisa Quaest divulgada nesta segunda-feira (21) indica que Lula, do PT, tem 37% das intenções de voto no primeiro turno, enquanto Flávio Bolsonaro, do PL, tem 33%. Uma pesquisa Quaest, encomendada pela Globo e pelo jornal O Globo, revelou que Flávio Bolsonaro (PL) tem 42% das intenções de voto contra 41% de Lula (PT) em um eventual 2º turno, estabelecendo um empate técnico. Na pesquisa Quaest divulgada em 21 de novembro, Lula (PT) lidera com 37% nas intenções de voto no 1º turno, seguido por Flávio Bolsonaro (PL) com 33%.", "artigos": [{"id": 174893, "titulo": "Quaest: Lula tem 37%, e Flávio Bolsonaro, 33% no 1º turno; candidatos empatam no 2º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/quaest-lula-tem-37-e-flavio-bolsonaro-33-no-1o-turno-candidatos-empatam-no-2o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-21T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest divulgada nesta segunda-feira (21) indica que Lula, do PT, tem 37% das intenções de voto no primeiro turno, enquanto Flávio Bolsonaro, do PL, tem 33%. No segundo turno, os candidatos empataram com os mesmos percentuais.", "titulo_pt": "Lula tem 37%, e Flávio Bolsonaro, 33% no 1º turno; candidatos empatam no 2º turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 174904, "titulo": "Quaest, 2º turno: Flávio Bolsonaro, 42%; Lula, 41%", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/21/quaest-presidente-2o-turno-21-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-21T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest, encomendada pela Globo e pelo jornal O Globo, revelou que Flávio Bolsonaro (PL) tem 42% das intenções de voto contra 41% de Lula (PT) em um eventual 2º turno, estabelecendo um empate técnico. A margem de erro é de dois pontos percentuais.", "titulo_pt": "Quaest, 2º turno: flávio Bolsonaro, 42%; Lula, 41%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 174905, "titulo": "Quaest, 1º turno: Lula, 37%; Flávio Bolsonaro, 33%; Cury, 6%; Caiado, 4%; Renan, 3%; Zema, 1%", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/21/quaest-presidente-1o-turno-21-setembro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-21T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na pesquisa Quaest divulgada em 21 de novembro, Lula (PT) lidera com 37% nas intenções de voto no 1º turno, seguido por Flávio Bolsonaro (PL) com 33%. Em cenário de 2º turno, os dois candidatos estão empatados dent sui OpenAI pelo tiro no escola rural", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 175319, "titulo": "UK: Man charged over suspected role in Rwanda genocide", "url": "https://www.dw.com/en/uk-man-charged-over-suspected-role-in-rwanda-genocide/a-79364493?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-21T21:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um suspeito foi acusado de ter direcionado e incitado atos de assassinato e genocídio cometidos por outros no Ruanda.", "titulo_pt": "Reino unido: suspeito acusado no possível papel no genocídio ruandês", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 175397, "titulo": "(EDITORIAL from Korea Herald on Sept. 22)", "url": "https://en.yna.co.kr/view/AEN20260922000700315", "fonte_id": "yonhap_news", "data_pub": "2026-09-21T21:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo sul-coreano estaria em favor de uma proposta de lei que permitiria a coreanos.", "titulo_pt": "EDITORIAL sobre proposta de lei sul-coreana", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 174890, "titulo": "Líder interina da Venezuela faz 1ª visita aos EUA e avança em série de negociações", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/lider-interina-da-venezuela-faz-1a-visita-aos-eua-e-avanca-em-serie-de-negociacoes.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-21T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A líder interina da Venezuela, Delcy Rodríguez, iniciou negociações com representantes dos EUA sobre temas relacionados a energia, dívida e mineração durante a Assembleia Geral das Nações Unidas. Esta foi a primeira visita oficial dela aos Estados Unidos.", "titulo_pt": "Líder interina da Venezuela faz primeira visita aos EUA e avança em negociações", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 175377, "titulo": "Canada’s British Columbia sues OpenAI in US court over school shooting", "url": "https://www.scmp.com/news/world/united-states-canada/article/3368310/canadas-british-columbia-sues-openai-us-court-over-school-shooting?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-21T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A província canadense de British Columbia processou a OpenAI nos Estados Unidos por não informar à autoridade local sobre atividades violentas no serviço ChatGPT antes do tiroteio em uma escola no mês de fevereiro. A promotora de justiça Nik Sharma havia anunciado em julho intenções de ação legal contra a empresa por sua suposta conexão com o incidente violento em Tumbler Ridge, uma pequena cidade minadora.", "titulo_pt": "British Columbia processa OpenAI por não informar sobre atividades violentas no chatgpt", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 175243, "titulo": "Australia news live: Albanese signs declaration with world leaders urging human control over AI; city of Sydney bans smartglasses", "url": "https://www.theguardian.com/australia-news/live/2026/sep/22/anthony-albanese-new-york-united-nations-intergenerational-report-coalition-one-nation-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-09-21T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O líder australiano Anthony Albanese assinou uma declaração com líderes mundiais sobre o controle humano da IA. A cidade de Sydney proibiu o uso de óculos inteligentes. A ministra Tanya Plibersek destacou a necessidade de usar todos os sistemas disponíveis para identificar e combater violência doméstica mais precocemente.", "titulo_pt": "Notícias ao vivo da austrália: albanese assina declaração sobre controle humano da IA; Sydney proíbe óculos inteligentes; plibersek enfatiza a importância de usar todos os sistemas para combater a violência doméstica", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 175204, "titulo": "Joaquín Villarino: “No hay recesión minera, sí un llamado de atención”", "url": "https://www.latercera.com/videos/noticia/joaquin-villarino-no-hay-recesion-minera-si-un-llamado-de-atencion/", "fonte_id": "la_tercera", "data_pub": "2026-09-21T21:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Joaquín Villarino, presidente executivo do Consejo Minero, afirma que a mineradora chilena não está em recesão, mas sim enfrenta uma queda de produção devido a fatores naturais do ciclo do cobre. Ele destaca que há muitas investidas pendentes de aprovação, o que tem retardado novos projetos.", "titulo_pt": "Joaquín Villarino: 'não há recesão minera, mas um alerta sobre projetos em espera'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 175375, "titulo": "France calls on EU to take immediate action to lower energy prices", "url": "https://www.ft.com/content/07c05f00-5c05-4b6d-837b-17118b266ecd?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-21T21:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente francês Emmanuel Macron pede à União Europeia que tome medidas imediatas para reduzir os preços da energia e ao Comissariado Europeu que adie a implementação de novas regras sobre metano por um ano.", "titulo_pt": "França solicita ação rápida da ue para baixar preços da energia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 175434, "titulo": "Saudi Arabia cancels star-studded film fest amid Middle East war", "url": "https://www.washingtonpost.com/world/2026/09/21/saudi-arabia-cancels-star-studded-film-fest-amid-middle-east-war/", "fonte_id": "washington_post_world", "data_pub": "2026-09-21T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Festival Internacional do Mar Vermelho de Cinema cancelou sua edição, que contaria com a presença de celebridades do Hollywood como Emily Blunt, Adrien Brody, Gwyneth Paltrow e Michael Caine.", "titulo_pt": "Cancellação do festival de cinema de alto perfil no mar vermelho devido à guerra no oriente médio", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 175376, "titulo": "Gulf states urge reset with Iran as conflict drags on", "url": "https://www.ft.com/content/2a0d724d-b2be-4539-a4ab-30ba919cd253?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-21T21:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Emirados Árabes Unidos e Qatar estão pressionando para que haja uma nova abordagem na relação com Irã, enquanto o conflito persiste. Eles propõem uma nova perspectiva mental e um quadro de segurança regional, respectivamente.", "titulo_pt": "Países do golfo incentivam redefinição das relações com o Irã diante de conflito prolongado", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 174963, "titulo": "Trump prepara pacote de sanções contra o Tribunal Penal Internacional, diz WSJ: o que o republicano pode fazer?", "url": "https://www.brasildefato.com.br/2026/09/21/trump-prepara-pacote-de-sancoes-contra-o-tribunal-penal-internacional-diz-wsj-o-que-o-republicano-pode-fazer/", "fonte_id": "brasil_de_fato", "data_pub": "2026-09-21T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Donald Trump está preparando um pacote de sanções contra o Tribunal Penal Internacional, de acordo com informações do Wall Street Journal. As medidas poderiam paralisar o funcionamento da corte, dependendo do grau de sanção aplicado.", "titulo_pt": "Trump prepara pacote de sanções contra o Tribunal Penal Internacional, diz jornal", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 175230, "titulo": "Spectre of Rogue A.I. Looms Over U.N. Talks on Digital Cooperation", "url": "https://www.nytimes.com/2026/09/21/world/un-general-assembly-ai.html", "fonte_id": "nyt_world", "data_pub": "2026-09-21T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Diplomatas, autoridades e especialistas em tecnologia se reuniram durante a Assembleia Geral das Nações Unidas para discutir como abordar os riscos e aproveitar o potencial da inteligência artificial.", "titulo_pt": "Sombra de inteligência artificial descontrolada paira sobre discussões da ONU sobre cooperação Digital", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 175398, "titulo": "(3rd LD) Top S. Korean, U.S., Japanese diplomats reaffirm N.K. denuclearization goal, urge dialogue", "url": "https://en.yna.co.kr/view/AEN20260922000253315", "fonte_id": "yonhap_news", "data_pub": "2026-09-21T21:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe das diplomacias de Coreia do Sul, Estados Unidos e Japão reafirmaram o objetivo de desnuclearização da Coreia do Norte e incentivaram o diálogo. Essa reunião ocorreu em Washington no dia 21 de setembro.", "titulo_pt": "Topes sul-coreanos, americanos e japoneses reafirmam objetivo de desnuclearização da Coreia do norte e pressionam por diálogo", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 175229, "titulo": "Iraq’s Prime Minister Al-Zaidi Vows to Disarm Iran-backed Militias", "url": "https://www.nytimes.com/2026/09/21/world/middleeast/iraq-prime-minister-interview-disarm-militias.html", "fonte_id": "nyt_world", "data_pub": "2026-09-21T21:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ali al-Zaidi, o novo primeiro-ministro do Iraque, pretende desarmar as milícias apoiadas pelo Irã. Ele estabeleceu um prazo ambicioso, mas que pode ser difícil de ser cumprido.", "titulo_pt": "Novo primeiro-ministro do iraque promete desarmar milícias apoiadas pelo Irã", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 175020, "titulo": "BP planej "BC abre consulta sobre critérios de demonstrações financeiras", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 174650, "titulo": "US and China consider making AI channel", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/22/2003864652", "fonte_id": "taipei_times", "data_pub": "2026-09-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Estados Unidos e a China estão considerando a criação de um canal de comunicação sobre inteligência artificial. As negociações estão em andamento para estabelecer um diálogo entre os dois países sobre o tema.", "titulo_pt": "EUA e China consideram criar canal de comunicação sobre IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 175021, "titulo": "Apesar de apelos, empresas continuarão avançando com a IA, diz especialista", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/apesar-de-apelos-empresas-continuarao-avancando-com-a-ia-diz-especialista/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-21T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um especialista da FGV afirma que, apesar de apelos para pausar o desenvolvimento da inteligência artificial, as grandes empresas continuarão avançando com a tecnologia.", "titulo_pt": "Apesar de apelos, empresas continuarão com a IA, diz especialista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 175329, "titulo": "Meta's Muse AI agent downloads are surging. Here's how it compares to ChatGPT, Grok and Claude", "url": "https://www.cnbc.com/2026/09/21/meta-muse-personal-ai-agent-downloads.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-21T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O agente de inteligência artificial pessoal Muse, desenvolvido pela Meta, atingiu 730.000 downloads em um período de cinco dias e 2,5 milhões de downloads em um período de 13 dias após o  o desenvolvimento de padrões globais de IA para orientar a alinhamento. Um post de Jacob Coxon há quase duas semanas sobre Anthropic e OpenAI 'jogarem com nossas vidas' desencadeou um debate global sobre a segurança da IA.", "titulo_pt": "Openai sugere desenvolvimento de padrões globais de IA para orientar alinhamento", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 175389, "titulo": "California tightens rules on AI data center energy and water use", "url": "https://www.theverge.com/ai-artificial-intelligence/998453/california-ai-data-center-bills", "fonte_id": "the_verge", "data_pub": "2026-09-21T20:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governador da Califórnia, Gavin Newsom, assinou sete leis que visam impedir que centrais de dados de inteligência artificial passem custos de energia e água para os residentes. As leis exigem que a Comissão de Utilidades Públicas da Califórnia crie uma nova classificação tarifária para centrais de dados e force as empresas a financiar melhorias.", "titulo_pt": "Califórnia endurece regras sobre uso de energia e água por centrais de dados de IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 175390, "titulo": "OpenAI forms math advisory group as its AI resolves more than 100 open problems", "url": "https://techcrunch.com/2026/09/21/openai-forms-math-advisory-group-as-its-ai-resolves-more-than-100-open-problems/", "fonte_id": "techcrunch", "data_pub": "2026-09-21T20:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI formou um conselho consultivo matemático para resolver mais de 100 problemas matemáticos abertos. O grupo não terá liberdade para retardar ou redirecionar a pesquisa matemática em andamento da OpenAI.", "titulo_pt": "Openai forma conselho matemático para resolver problemas abertos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 175285, "titulo": "Trump inaudible during White House TV pool blackout", "url": "https://www.axios.com/2026/09/21/trump-white-house-pool-tv-ban-audio", "fonte_id": "axios", "data_pub": "2026-09-21T20:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante uma conferência de imprensa, o presidente Trump foi inaudível após a suspensão da cobertura da TV pool, com a vídeo fornecido pela Casa Branca não apresentando áudio útil de suas declarações. Isso ocorreu imediatamente após a proibição de CNN, MS NOW e Politico por parte do presidente, que ele chamou de 'FAKE NEWS'.", "titulo_pt": "Trump inaudível durante blackout de TV pool na casa branca", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 175391, "titulo": "Discover what’s next: 5 days left to save up to $200 on your TechCrunch Disrupt 2026 ticket", "url": "https://techcrunch.com/2026/09/21/discover-whats-next-5-days-left-to-save-up-to-200-on-techcrunch-disrupt-2026/", "fonte_id": "techcrunch", "data_pub": "2026-09-21T19:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Faltam cinco dias para obter até $200 de desconto em ingressos para o TechCrunch Disrupt 2026, com 50% de desconto em um segundo ingresso. O evento ocorrerá em São Francisco, no Moscone West, de 13 a 15 de outubro. Os descontos terminam às 23h59 do dia 25 de setembro (PDT).", "titulo_pt": "Descubra o que vem por aí: 5 dias restantes para economizar até $200 em ingresso para o TechCrunch Disrupt 2026", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 175392, "titulo": "Meta’s Muse is outpacing ChatGPT’s early mobile launch", "url": "https://techcrunch.com/2026/09/21/metas-muse-is-outpacing-chatgpts-early-mobile-launch/", "fonte_id": "techcrunch", "data_pub": "2026-09-21T19:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta's novo agente de inteligência artificial, Muse, obteve mais downloads e usuários diários ativos nos Estados Unidos e no Canadá do que ChatGPT durante o mesmo período após o lançamento móvel do ChatGPT, de acordo com novas estimativas da Appfigures.", "titulo_pt": "Muse da meta supera ChatGPT em lançamento inicial móvel", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 175393, "titulo": "Kairos Power gets up to $100M from Samsung group to build nuclear reactor for Google", "url": "https://techcrunch.com/2026/09/21/kairos-power-gets-up-to-100m-from-samsung-group-to-build-nuclear-reactor-for-google/", "fonte_id": "techcrunch", "data_pub": "2026-09-21T18:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Kairos Power, que fornecerá energia nuclear para o Google no futuro, firmou um acordo com a Samsung C&T para construir sua primeira usina nuclear de 50 megawatts.", "titulo_pt": "Kairos Power recebe até $100M da Samsung para construir reator nuclear para o Google", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 174703, "titulo": "Meta’s AI agent has been blocked from using Amazon.com", "url": "https://techcrunch.com/2026/09/21/metas-ai-agent-has-been-blocked-from-using-amazon-com/", "fonte_id": "techcrunch", "data_pub": "2026-09-21T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O agente de inteligência artificial Muse não está mais autorizado a fazer compras no Amazon.com.", "titulo_pt": "Agente de IA da meta não pode mais fazer compras no Amazon.Com", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 174704, "titulo": "X will now tell users when governments have forced it to limit their posts", "url": "https://techcrunch.com/2026/09/21/x-will-now-tell-users-when-governments-have-forced-it-to-limit-their-posts/", "fonte_id": "techcrunch", "data_pub": "2026-09-21T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A plataforma X está expandindo sua ferramenta de transparência 'Under the Hood' para informar aos usuários quando suas postagens foram baixadas ou reprimidas em resposta a leis locais e exigências governamentais, incluindo o país que fez a solicitação.", "titulo_pt": "X agora informará aos usuários quando governos o compeliram a limitar suas postagens", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 174682, "titulo": "Paramount settles lawsuit blocking $110 billion Warner Bros. merger", "url": "https://www.theverge.com/entertainment/998302/paramount-warner-bros-discovery-merger-settlement", "fonte_id": "the_verge", "data_pub": "2026-09-21T17:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Paramount chegou a um acordo com a Califórnia e com 11 outros estados que ajuizaram uma ação para impedir a fusão de sua empresa com a Warner Bros. Discovery por $110 bilhões. O acordo remove um obstáculo importante para a grande fusão mediática.", "titulo_pt": "Paramount chega a acordo para permitir a fusão de $110 bilhões com Warner Bros. Discovery", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 174274, "titulo": "Motorola y Bang & Olufsen anuncian alianza para llevar audio de alta gama a sus próximos smartphones", "url": "https://www.latercera.com/tecnologia/noticia/motorola-bang-olufsen-alianza-audio-alta-gama/", "fonte_id": "la_tercera", "data_pub": "2026-09-21T17:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Motorola e Bang & Olufsen anunciaram uma aliança para desenvolver novas experiências de som de alta qualidade em futuros smartphones da Motorola. A colaboração visa melhorar a qualidade do som, introduzir novos modos de áudio e integrar mais profundamente o som de alta gama em seus dispositivos premium.", "titulo_pt": "Motorola e Bang & Olufsen anunciam parceria para trazer som de alta qualidade aos próximos smartphones", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 175402, "titulo": "New study reveals gaps in bison parasite management", "url": "https://phys.org/news/2026-09-reveals-gaps-bison-parasite.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Parásitos gastrointestinais podem causar problemas de saúde sérios em bisões norte-americanos, mas os medicamentos usados para controlá-los podem perder eficácia se forem aplicados com excesso ou sem saber se os animais necessitam de tratamento.", "titulo_pt": "Novo estudo revela lacunas na gestão de parasitas em bisões", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 175403, "titulo": "Two new large stick insect species discovered in Australia's backyards and rainforests", "url": "https://phys.org/news/2026-09-large-insect-species-australia-backyards.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Sydney descobriram duas novas espécies de insetos palha em áreas bem estudadas da Austrália, incluindo quintais e florestas tropicais. Essas novas espécies incluem uma com ovos únicos com", "titulo_pt": null, "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 175429, "titulo": "NASA Welcomes Albania as Newest Artemis Accords Signatory", "url": "https://www.nasa.gov/organizations/oiir/nasa-welcomes-albania-as-newest-artemis-accords-signatory/", "fonte_id": "nasa_news", "data_pub": "2026-09-21T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A República da Albânia assinou os Acordos Artemis em uma cerimônia realizada pela NASA em sua sede em Washington. Isso a torna a 73ª signatária dos Acordos Artemis, juntando-se a um grupo de países com ideais semelhantes para a exploração espacial responsável e transparente.", "titulo_pt": "NASA bem-vinda a albânia como novo assinante dos acordos Artemis", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 175404, "titulo": "Sequencing genomes from museum collections could transform scientific inquiry", "url": "https://phys.org/news/2026-09-sequencing-genomes-museum-scientific-inquiry.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Museus ao redor do mundo possuem mais de um bilhão de espécimes, abrangendo diversos tempos e locais. Esses espécimes incluem espécies extintas ou provenientes de áreas que sofreram transformações significativas, oferecendo dados únicos que não podem ser encontrados em nenhum outro lugar.", "titulo_pt": "Sequenciamento de genomas de coleções museológicas poderia transformar a pesquisa científica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 175437, "titulo": "UNGA81: Robust laboratory systems key to preventing, detecting and responding to health threats", "url": "https://www.paho.org/en/news/21-9-2026-unga81-robust-laboratory-systems-key-preventing-detecting-and-responding-health", "fonte_id": "paho", "data_pub": "2026-09-21T21:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O sistema laboratorial robusto é crucial para prevenir, detectar e responder a ameaças à saúde. Essa é uma declaração feita durante a 81ª Assembleia Geral das Nações Unidas.", "titulo_pt": "81ª assembleia geral das nações unidas: sistemas laboratoriais robustos são essenciais para enfrentar ameaças à saúde", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 175406, "titulo": "Student-led missions deploy free-flying light sails from CubeSats in low Earth orbit", "url": "https://phys.org/news/2026-09-student-missions-deploy-free-flying.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudantes do Space Systems Design Studio da Cornell University lançaram duas experiências únicas com velas solares livres-float, que são ligeiramente maiores que uma pizza e usam a momentum de fótons para acelerar a alta velocidade. Estas velas são dobradas origami para serem lançadas como CubeSats e se separam completamente quando são despejadas, permitindo que sejam muito menores e leves em comparação com as velas solares tradicionais.", "titulo_pt": "Missões lideradas pelos alunos lançam velas solares livres-float de CubeSats em órbita baixa da terra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 175430, "titulo": "NASA Kicks Off Nationwide Effort to Prepare Tomorrow’s Space Workforce", "url": "https://www.nasa.gov/learning-resources/nasa-kicks-off-nationwide-effort-to-prepare-tomorrows-space-workforce/", "fonte_id": "nasa_news", "data_pub": "2026-09-21T21:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 15 de setembro de 2026, a NASA lançou a iniciativa de Hubs Estaduais para Formação de uma Força de Trabalho Técnico Qualificado, com parceiros em Houston. A agência reuniu os parceiros para alinhar estratégias e construir momentum, enfocando em parcerias, engajamento com pequenas empresas e passos seguintes.", "titulo_pt": "NASA inicia iniciativa nacional para preparar a força de trabalho espacial do futuro", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 175407, "titulo": "Inclusion is central to England's education policy—but what it means is changing", "url": "https://phys.org/news/2026-09-inclusion-central-england-policy.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inclusão se tornou um dos conceitos mais proeminentes na política educacional contemporânea na Inglaterra. O departamento de Educação tem enfatizado a inclusão ao promover a criação de 'bases de inclusão', espaços que apoiam estudantes com necessidades adicionais em escolas mainstream.", "titulo_pt": "Inclusão é central na política educacional da inglaterra - mas o que ela significa está mudando", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 175408, "titulo": "AI tool compares 125 cell types across 700 million years of evolution", "url": "https://phys.org/news/2026-09-ai-tool-cell-million-years.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time liderado pela King Abdullah University of Science and Technology (KAUST) criou uma ferramenta de inteligência artificial chamada Unify, que permite comparar tipos celulares semelhantes entre espécies distantes. Este método pode auxiliar os cientistas a avaliar quais descobertas de estudos em animais são mais relevantes para a saúde humana.", "titulo_pt": "Ferramenta de IA compara 125 tipos celulares ao longo de 700 milhões de anos de evolução", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 175409, "titulo": "Plasma technology could help plant-based packaging replace plastic", "url": "https://phys.org/news/2026-09-plasma-technology-based-packaging-plastic.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa descobriu uma tecnologia sustentável e escalável para melhorar a durabilidade dos pacotes de base vegetal; a tecnologia de plasma avançado foi usada para aplicar camadas protetoras nas superfícies de filmes de fibras celulósicas (CNF), reduzindo a absorção d'água e aumentando a resistência à umidade.", "titulo_pt": "Tecnologia de plasma pode ajudar embalagens vegetais a substituírem o plástico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 175410, "titulo": "As cities prepare for 2026's super El Niño, some crucial blind spots can't be ignored", "url": "https://phys.org/news/2026-09-cities-super-el-nio-crucial.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este ano, o El Niño pode ser um dos mais intensos da história, com evidências de seu impacto aparecendo em todo o mundo. As cidades estão se preparando para enfrentar as consequências deste fenômeno climático em 2026, mas alguns pontos cruciais ainda não foram considerados.", "titulo_pt": "As cidades se preparam para o super El Niño de 2026, mas pontos importantes não são levados em consideração", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 175411, "titulo": "Early Mars rocks reveal at least three separate water episodes", "url": "https://phys.org/news/2026-09-early-mars-reveal-episodes.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A rotação do rover Perseverance na borda interna do Crater Jezero em setembro de 2023 revelou um local geológico chamado 'Margin Unit', que surpreendeu os cientistas pela presença de rochas sedimentares, incluindo carbonatos, em vez das camadas de areia esperadas.", "titulo_pt": "Rochas antigas de marte indicam pelo menos três períodos de água separados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 175412, "titulo": "Parents of children with special educational needs face 'lonely and uncertain journey' accessing childcare", "url": "https://phys.org/news/2026-09-parents-children-special-lonely-uncertain.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Famílias de bebês e crianças pequenas com necessidades educacionais especiais e deficiências enfrentam sistemas de apoio complexos e fragmentados ao tentar encontrar cuidados infantis adequados, frequentemente com um alto custo emocional.", "titulo_pt": "Pais de crianças com necessidades educacionais especiais enfrentam 'viagem sofrida e incerta' para acessar cuidados infantis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 175413, "titulo": "Engineered nanoparticles sensitize gliomas to radiotherapy", "url": "https://phys.org/news/2026-09-nanoparticles-sensitize-gliomas-radiotherapy.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gliomas são uma das principais causas de mortes relacionadas ao câncer em adultos jovens. Uma mutação genética comum afeta uma enzima chamada isocitrate dehydrogenase 1 (mIDH1), que pode produzir uma molécula que reprograma tanto as células tumorais quanto o ambiente em que elas crescem.", "titulo_pt": "Nanopartículas engenhosas sensibilizam gliomas para a radioterapia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 175221, "titulo": "Qué se sabe del inédito descubrimiento de una nueva especie de gato en Bolivia", "url": "https://www.latercera.com/tendencias/noticia/que-se-sabe-del-inedito-descubrimiento-de-una-nueva-especie-de-gato-en-bolivia/", "fonte_id": "la_tercera", "data_pub": "2026-09-21T20:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Foi identificada uma nova espécie de gato nos bosques nubosos da região dos Yungas em Bolivia, após análise genética.", "titulo_pt": "Novo descobrimento de espécie de gato em bolívia", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 175414, "titulo": "Definition of dyslexia updated for first time in 20 years", "url": "https://phys.org/news/2026-09-definition-dyslexia-years.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um pesquisador da Universidade do Texas em Austin contribuiu para a primeira atualização significativa da definição internacional de dislexia em mais de 20 anos. A nova definição, que reflete avanços recentes na pesquisa sobre dislexia, pode influenciar como escolas, políticas públicas e outros identificam e apoiam alunos com dificuldades de aprendizagem.", "titulo_pt": "Definição de dislexia atualizada pela primeira vez em 20 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 175440, "titulo": "The Worst National Pavilions at the Venice Biennale", "url": "https://hyperallergic.com/the-worst-national-pavilions-at-the-venice-biennale/", "fonte_id": "hyperallergic", "data_pub": "2026-09-21T21:59:00Z", "idioma": "en", "provavel_duplicat ção, mercado de trabalho, renda, saúde e arrecadação pública.", "titulo_pt": "Gravidez e maternidade na adolescência custam R$ 6 bilhões no Brasil, diz ONU", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 175125, "titulo": "Chile: imponen más de mil años de prisión para 18 miembros de un grupo radical mapuche por un atentado en 2022", "url": "https://www.clarin.com/mundo/chile-imponen-mil-anos-prision-18-miembros-grupo-radical-mapuche-atentado-2022_0_dUWS9uRCRc.html", "fonte_id": "clarin", "data_pub": "2026-09-21T21:04:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Chile condenou 18 membros de um grupo mapuche radical, a Resistência Mapuche Lafkenche (RML), a mais de mil anos de prisão por um ataque armado em 2022 ao Molino Grollmus, um complexo industrial no sul do país. Eles foram considerados culpados de incêndio, roubo com violência, homicídio calificado em grau de frustrado e posse ilegal de munições.", "titulo_pt": "Chile condena 18 membros de grupo mapuche a mais de mil anos de prisão por ataque em 2022", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 175438, "titulo": "Health Ministers of the Americas to meet in Washington to address the Region’s leading public health challenges", "url": "https://www.paho.org/en/news/21-9-2026-health-ministers-americas-meet-washington-address-regions-leading-public-health", "fonte_id": "paho", "data_pub": "2026-09-21T19:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ministros de Saúde da América se reunirão em Washington para abordar os principais desafios de saúde pública da região. A reunião visa discutir e propor soluções para as principais questões de saúde enfrentadas pela região.", "titulo_pt": "Ministros de saúde da américa se reunirão em Washington para abordar os principais desafios de saúde pública", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 174138, "titulo": "Morador de rua é morto a facadas dentro de restaurante comunitário no DF", "url": "https://www.metropoles.com/distrito-federal/morador-de-rua-e-morto-a-facadas-dentro-de-restaurante-comunitario-no-df", "fonte_id": "metropoles", "data_pub": "2026-09-21T17:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um morador de rua foi morto a facadas dentro de um restaurante comunitário no Distrito Federal. De acordo com a PMDF, a vítima e a autora também viviam na situação de rua e teriam se desentendido antes do ataque.", "titulo_pt": "Morador de rua é morto a facadas dentro de restaurante comunitário no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 174140, "titulo": "Soldado da PMDF que morreu afogado no Lago tinha curso avançado de mergulho", "url": "https://www.metropoles.com/distrito-federal/soldado-da-pmdf-que-morreu-afogado-no-lago-tinha-curso-avancado-de-mergulho", "fonte_id": "metropoles", "data_pub": "2026-09-21T17:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O soldado da PMDF faleceu por barotrauma, uma lesão causada pela diferença de pressão entre o ambiente externo e o corpo. Ele estava realizando um curso avançado de mergulho.", "titulo_pt": "Soldado da PMDF que morreu afogado no Lago tinha curso avançado de mergulho", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 175005, "titulo": "Capacitação é o caminho para mulheres chegarem ao C-level", "url": "https://exame.com/carreira/capacitacao-e-o-caminho-para-mulheres-chegarem-ao-c-level/", "fonte_id": "exame", "data_pub": "2026-09-21T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Apenas 4,8% das maiores empresas do mundo têm mulheres em posições de liderança executiva. A qualificação aparece como um caminho para as mulheres alcançarem esses cargos de alto nível.", "titulo_pt": "Capacitação é o caminho para mulheres chegarem aos cargos de liderança executiva", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 174253, "titulo": "Femicidio en Villa Devoto: procesaron al carnicero que apuñaló a su mujer delante de su hija de 8 años", "url": "https://www.lanacion.com.ar/seguridad/femicidio-en-villa-devoto-procesaron-al-carnicero-que-apunalo-a-su-mujer-y-le-supendieron-la-nid21092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-21T17:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um carnicero chamado Walter Verón foi processado por matar sua mulher em Villa Devoto, na presença de sua filha de 8 anos. O juiz Darío Bonanno suspendeu provisoriamente a responsabilidade parental de Verón em relação à menina.", "titulo_pt": "Femicídio em Villa Devoto: carnicero é processado por matar mulher na presença da filha de 8 anos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 174639, "titulo": "Ministry to revise indoor air quality regulations", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/22/2003864685", "fonte_id": "taipei_times", "data_pub": "2026-09-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério planeja revisar as regulamentações de qualidade do ar indoor. A intenção é melhorar as normas existentes.", "titulo_pt": "Ministério vai revisar regulamentos de qualidade do ar indoor", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 174912, "titulo": "Implantação global de energia renovável precisa dobrar para cumprir meta de 2030, diz relatório", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/09/implantacao-global-de-energia-renovavel-precisa-dobrar-para-cumprir-meta-de-2030-diz-relatorio.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-21T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A implantação global de energia renovável precisa aumentar significativamente para atingir as metas climáticas estabelecidas para 2030, apesar de ter alcançado um nível recorde no ano anterior. Um relatório divulgado por organizações do setor destaca a necessidade de um crescimento acelerado na adoção de energias renováveis.", "titulo_pt": "Implantação global de energia renovável precisa crescer para cumprir meta de 2030, diz relatório", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 175244, "titulo": "World leaders address climate crisis before UN meet amid record-breaking El-Niño", "url": "https://www.theguardian.com/environment/2026/sep/21/world-leaders-climate-crisis-el-nino", "fonte_id": "guardian_world", "data_pub": "2026-09-21T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Políticos de vários países estão se reunindo em Nova York para a Assembleia Geral da ONU, onde alguns estão discutindo a crise climática. Este ano, a Semana do Clima ocorre após meses de temperaturas extremamente altas e eventos climáticos extremos em várias regiões do mundo.", "titulo_pt": "Líderes mundiais abordam crise climática antes da reunião da ONU em meio ao el niño recorde", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 174956, "titulo": "El Niño: Opas emite alerta sobre impactos do fenômeno na região das Américas", "url": "https://veja.abril.com.br/saude/el-nino-opas-emite-alerta-sobre-impactos-do-fenomeno-na-regiao-das-americas/", "fonte_id": "veja", "data_pub": "2026-09-21T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Organização Pan-Americana da Saúde emitiu um alerta sobre os impactos do fenômeno El Niño na região das Américas, destacando seca, dengue e inundações como problemas de saúde. O Brasil foi mencionado devido à deterioração da qualidade do ar.", "titulo_pt": "El Niño: opas emite alerta sobre impactos na região das Américas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 174262, "titulo": "Avanza el ICE: qué se sabe del operativo masivo con 500 inmigrantes detenidos en Florida", "url": "htt const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>

           </div>`;
         }).join("")}
       </div>`
    : "";
