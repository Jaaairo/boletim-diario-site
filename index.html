<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

  </div>
</div>

<script>
const D = {"gerado_em": "16/11/2026 07:24", "stats": {"noticias_novas": 707, "resumos_gerados": 242}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Após uma semana fora do país, o presidente Lula retorna a Brasília com o objetivo de definir o novo governo. Ele intensificará as articulações políticas para formar seu novo ministério. O projeto de ajuste fiscal será finalizado no Senado e enviado para a Câmara dos Deputados, com a expectativa de que o processo seja agilizado. Além disso, a justiça determinou que o governo federal deve investir R$ 597 milhões em Canudos para reparar danos causados em um sítio arqueológico e para a reconstrução do arraial de Belo Monte. Nesse contexto, o termo 'tesouraço' ganha força como crítica ao corte orçamentário proposto, com críticas surgindo tanto da esquerda quanto da direita.", "mundo": "O Papa Leão XIV está se recuperando bem após a cirurgia no pulmão realizada em outubro e continua com sua agenda, incluindo uma viagem programada à América do Sul. Em outro desenvolvimento, o presidente sul-coreano Lee Jae Myung realizou uma cúpula com o presidente filipino Ferdinand Marcos em Manila, expressando esperança pelo fortalecimento das relações com a Tailândia. Na América do Sul, o Chile participou da APEC na China, enfrentando desafios relacionados à segurança econômica. Em um evento importante, o presidente de Cabo Verde, José Maria Neves, foi reeleito com 63,8% dos votos. Além disso, o exército jordaniano sentenciou três homens à pena de morte por ataques a uma igreja grega ortodoxa. Na África, centenas de milhares de pessoas protestaram contra as reformas do governo czeque em relação à mídia pública, o maior protesto desde as revoluções de 1989. Por fim, o Príncipe Harry visitou a Ucrânia e declarou aos soldados que eles irão vencer a guerra contra a Rússia, reforçando a solidariedade britânica com o país em conflito.\n\nA geopolítica global está em destaque com uma série de eventos significativos. Na Rússia, a possibilidade de uma reunião entre Putin, Xi e Trump levantou comparações com a Conferência de Yalta de 1945, sugerindo uma nova dinâmica na cena internacional. Em outro desenvolvimento, a Estônia anunciou que fechará os pontos de passagem na fronteira com a Rússia após um suposto tentativa de sabotagem contra uma empresa de drones, reforçando a tensão regional. As ameaças de bomba na Europa também ganharam destaque, com analistas alertando para a necessidade de uma resposta mais coordenada do bloco europeu. Além disso, a situação no Oriente Médio continua volátil, com o Irã negando envolvimento em ilícitos de exportação de petróleo e hutitas avançando para o centro provisório do governo em Aden.", "economia": "A economia global enfrenta diversos desafios, com destaque para a desaceleração econômica na China, que registrou crescimento industrial abaixo das expectativas e vendas no varejo fracas. A produção industrial na China cresceu 4,8% em outubro, abaixo das estimativas, enquanto as vendas no varejo avançaram apenas 0,4%, metade do que era esperado. Em consonância com essa tendência, a China decidiu acelerar os gastos orçamentários para combater a fraca expansão econômica. A Coreia do Sul também não atingiu as estimativas em termos de atividade industrial e vendas no varejo. No cenário doméstico, o 13º salário deve injetar R$ 399 bilhões na economia em 2026, estimou o Dieese, beneficiando 99,7 milhões de brasileiros. O pacote fiscal apresentado pelo governo Lula, que inclui a criação de um piso de contingenciamento e a possibilidade de congelar verbas e revisar benefícios tributários de empresas até 2025, deve ser analisado com cuidado, alertou o Jota. Além disso, o Banco do Brasil busca negociar com o Banco Central e o Ministério da Fazenda uma regra mais flexível para contabilizar as perdas esperadas com calotes nas operações de crédito do agronegócio. A reforma tributária, por sua vez, pode aumentar o custo do streaming de séries e filmes, pois há uma linha tênue entre a prestação de serviço e a circulação de mercadorias, o que pode afetar a tributação.", "tecnologia": "A tecnologia está em destaque com diversos desenvolvimentos e desafios em várias áreas. A Nvidia enfrenta uma série de desafios, tendo perdido cerca de US$ 192 bilhões em valor de mercado. No entanto, há sinais de que o CEO Jensen Huang continua liderando a empresa, com pressões de executivos de tecnologia e principais acionistas. Em outro desenvolvimento, a Kakao Bank da Coreia do Sul introduziu o Apple Pay, se tornando a segunda instituição financeira na região a oferecer o serviço. Na área de inteligência artificial, a Anthropic está intensificando sua concorrência com a Nvidia, com seu CEO enfatizando a segurança e a cultura da empresa durante uma apresentação antes da oferta inicial de ações. Além disso, a TSMC, uma das principais fabricantes de chips, obteve um financiamento recorde para expandir suas operações, refletindo o crescimento das operações da empresa. No campo de aplicativos práticos, a Apple está realizando pesquisas para melhorar o uso de ferramentas de saúde baseadas em inteligência artificial, enquanto a China avança no desenvolvimento de inteligência artificial para uso científico, competindo com rivais americanos.", "ciencia": "O Serviço Geológico Brasileiro está planejando uma campanha de pesquisa sem precedentes para explorar áreas do país com potencial para minerais críticos, como cobre, lítio, nióbio, urânio e terras raras. O objetivo é aumentar o conhecimento geológico do país, que hoje abrange menos da metade das áreas com potencial para esses recursos. Paralelamente, a NASA planeja que a Voyager 1 alcance uma marca histórica ao se distanciar a uma distância equivalente a um dia de viagem de luz da Terra, se distanciando cerca de 26 bilhões de quilômetros desde seu lançamento em 1977. No campo da medicina, a Akeso, empresa listada na Bolsa de Valores de Hong Kong, viu suas ações cairem até 31,8% após o FDA dos EUA rejeitar a aplicação do seu medicamento contra o câncer ivonescimab, um dos medicamentos mais esperados da China. Além disso, a NASA também revelou que estrelas velhas podem sofrer uma diminuição repentina de luminosidade, enquanto pesquisadores da UBC descobriram 15.000 novos possíveis lentes gravitacionais fortes, o maior conjunto desses instrumentos cósmicos usados para investigar a matéria escura.", "cultura": "A cerimônia de entrega dos prêmios honorários à atriz Glenn Close e ao diretor Ridley Scott, realizada em Hollywood, foi destaque na cultura norte-americana, com a presença de celebridades. O Prêmio São Paulo de Literatura divulgou a lista de finalistas, com maioria de mulheres. No Chile, o Barrio Italia comemorou o primeiro ano de sua classificação como Patrimônio Cultural da Humanidade com uma celebração promovida pela Embaixada da Itália e pelo Instituto Italiano de Cultura. Em Santiago, uma pintura de Georgia O'Keeffe, esquecida por décadas, será leiloada com um lance estimado em até R$ 28 milhões. No Brasil, o cantor Seal retorna para quatro shows, revisitando seus maiores sucessos. No Japão, a partir de 23 de novembro, o Castelo de Shuri, em Okinawa, terá sua câmara principal aberta ao público após cerimônia de conclusão. Acompanhando a tendência de K-dramas, atores coreanos interpretam personagens de realeza europeia em novas produções, misturando fantasia medieval ocidental com dramas coreanos. Além disso, a série Midnight Diner, da Netflix, estreou sua sexta temporada com um tom calmo e pensativo, focando na rotina de um restaurante que opera de meia-noite às 7h, após um hiato de sete anos.", "sociedade": "Uma mulher de 53 anos, que trabalhava para o Metrô-DF como terceirizada, faleceu após ser atropelada na BR-020 neste domingo (15/11). A Polícia Civil do Distrito Federal está investigando o caso, que envolve a fuga dos ocupantes do veículo envolvido. Em São Paulo, um pintor esfaqueou sua companheira e genro após uma briga relacionada ao uso de drogas, com os ferimentos mais graves registrados no dia seguinte. O ministro da Educação relatou ataques de hackers no Instituto Nacional de Estudos e Pesquisas Educacionais (Inep) no dia anterior ao Exame Nacional do Ensino Médio (Enem). Na capital baiana, um policial militar identificado como Marco Antônio Ramos da Silva foi morto após ser baleado na cabeça durante uma ação de policiamento no bairro de Nova Brasília, em Salvador. O primeiro óbito por mpox no Brasil foi confirmado no Rio de Janeiro, em um contexto de aumento do número de casos do vírus no país. Além disso, Zacarias da Silva Filho, um engenheiro de 75 anos, participa do Enem no Distrito Federal com a intenção de atualizar seus conhecimentos e buscar uma vaga no curso de direito.", "meio_ambiente": "O Papa Leão condenou a 'exploração irresponsável' da floresta amazônica durante uma visita à uma cidade ameaçada por desmatamento, durante sua viagem pela América do Sul. O Brasil enfrenta novas regras da União Europeia que podem afetar suas exportações devido à nova lei antidesmatamento. O Canadá anunciou um investimento bilionário de 400 milhões de dólares ao Fundo de Proteção de Florestas, em um esforço conjunto com o Brasil para preservar as florestas tropicais. Em Tailândia, um incêndio atingiu um edifício, resultando em 11 mortes, suspeitas de um curto-circuito. Na China, há avanços na redução de emissões de poluentes e na expansão das energias renováveis. No Brasil, a previsão indica temperaturas acima de 30°C até o fim de novembro, especialmente nas regiões Norte, Nordeste e Centro-Oeste.", "direitos_humanos": "O Papa Leão XIV visitou a região amazônica peruana e reiterou sua preocupação com o desmatamento e a morte de defensores ambientais, recebendo o apoio de uma multidão. Em um contexto global, a Albânia debate a eficácia de uma proposta de lei que visa proteger jornalistas de ações judiciais abusivas. Em Hong Kong, a segurança cibernética é um grande desafio, com dados pessoais de aproximadamente 5.000 pessoas da Universidade Metropolitana de Hong Kong (HKMU) possivelmente comprometidos. Em outro ponto, as mulheres no Irã enfrentam crescentes pressões para rejeitar o uso do hijab, com o regime mirando em boicotes sociais. Na Tailândia, idosos estão sendo mantidos em gaiolas em um lar para idosos. Além disso, a questão do assédio sexual nas Forças Armadas brasileiras é abordada, com o Ministério Público Militar investigando seis casos e criando um aplicativo para proteger novas recrutas."}, "resumo_do_dia": {"politica_nacional": [{"id": 266726, "titulo": "Imprensa fala em ‘polarização’, mas 93% dos casos de violência nas eleições miraram apoiadores de Lula", "url": "https://www.intercept.com.br/2026/11/16/imprensa-fala-em-polarizacao-violencia-contra-apoiadores-de-lula/", "fonte_id": "intercept_brasil", "data_pub": "2026-11-16T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O levantamento indica que 93% das vítimas de violência durante as eleições apoiavam Lula e o PT. A imprensa destaca mais a 'polarização' do que a real situação das vítimas.", "titulo_pt": "Imprensa fala em 'polarização', mas 93% dos casos de violência nas eleições miraram apoiadores de Lula", "veiculo": "The Intercept Brasil", "pais": "Brasil", "classe": "B"}, {"id": 266550, "titulo": "Carf dente do Senado", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 266396, "titulo": "Tarcísio promete não se envolver em disputa do PL por presidência da Assembleia", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/tarcisio-promete-nao-se-envolver-em-disputa-do-pl-por-presidencia-da-assembleia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-16T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador de São Paulo, Tarcísio de Freitas (Republicanos), declarou a aliados que não pretende participar da disputa pelo comando da Assembleia Legislativa pelo partido PL a partir do próximo ano.", "titulo_pt": "Tarcísio de freitas não se envolverá na disputa pelo comando da Assembleia legislativa", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 266430, "titulo": "Comunicação preditiva orienta os negócios, diz sócio da FSB", "url": "https://www.poder360.com.br/conteudo-de-marca/comunicacao-preditiva-orienta-os-negocios-diz-socio-da-fsb/", "fonte_id": "poder360", "data_pub": "2026-11-16T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alexandre Loures, sócio da FSB, afirma que a comunicação preditiva deve ocupar um lugar nos conselhos de empresas para proteger e aumentar o valor de mercado dessas empresas.", "titulo_pt": "Comunicação preditiva deve estar nos conselhos para proteger e valorizar empresas, diz sócio da FSB", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 266431, "titulo": "Entenda em infográficos como queda da abstenção ajudou Lula a vencer", "url": "https://www.poder360.com.br/poder-eleicoes-2026/entenda-em-infograficos-como-queda-da-abstencao-ajudou-lula-a-vencer/", "fonte_id": "poder360", "data_pub": "2026-11-16T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O comparecimento às urnas aumentou em todas as faixas etárias durante o segundo turno da eleição. A alta foi particularmente significativa entre os idosos, que não são obrigados a votar.", "titulo_pt": "Entenda em infográficos como a elevação da abstenção no 2º turno beneficiou Lula", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 266432, "titulo": "Atraso em sistema do CNJ dificulta fiscalizar prazos da Maria da Penha", "url": "https://www.poder360.com.br/poder-justica/atraso-em-sistema-do-cnj-dificulta-fiscalizar-prazos-da-maria-da-penha/", "fonte_id": "poder360", "data_pub": "2026-11-16T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O sistema do Conselho Nacional de Justiça (CNJ) tem enfrentado atrasos, dificultando o monitoramento dos prazos estabelecidos pela Lei Maria da Penha. Os dados mostram que seis Tribunais de Justiça demoram mais de dois dias em média para decidir sobre medidas protetivas.", "titulo_pt": "Atraso no sistema do CNJ dificulta fiscalizar prazos da lei Maria da Penha", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 266454, "titulo": "Superlotação, fome e sede: o que está por trás da camiseta de preso pedindo por direitos humanos em presídio de SP", "url": "https://www.brasildefato.com.br/2026/11/16/superlotacao-fome-e-sede-o-que-esta-por-tras-da-camiseta-de-preso-pedindo-por-direitos-humanos-em-presidio-de-sp/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-16T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em novembro, dois detentos subiram em uma caixa d'água no Complexo Prisional de Pinheiros para protestar sobre a superlotação, fome e sede no presídio. Este incidente revelou a grave crise humanitária enfrentada pelos presos no local.", "titulo_pt": "Superlotação, fome e sede: o que está por trás da camiseta de preso pedindo por direitos humanos em presídio de SP", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 266457, "titulo": "O dream team escalado por Lula para construir e blindar PLP do ajuste fiscal", "url": "https://veja.abril.com.br/politica/o-dream-team-escalado-por-lula-para-construir-e-blindar-plp-do-ajuste-fiscal/", "fonte_id": "veja", "data_pub": "2026-11-16T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei do pacote de ajuste fiscal será analisado pelo Senado nesta terça-feira e deve ser avaliado pelos deputados ainda nesta semana. O presidente Lula escalou um 'dream team' para construir e blindar o projeto.", "titulo_pt": "Dream team escalado por Lula para projeto de ajuste fiscal", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 266503, "titulo": "Fim do Inquérito das Fake News é chance de criar “regras claras” na defesa da democracia", "url": "https://apublica.org/2026/11/fim-do-inquerito-das-fake-news-e-chance-de-criar-regras-claras/", "fonte_id": "agencia_publica", "data_pub": "2026-11-16T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A advogada Camila Torres César sugere que o fim do inquérito das fake news oferece uma oportunidade para o STF estabelecer regras claras na defesa da democracia, focando em mecanismos de controle e transparência, e buscando diversidade.", "titulo_pt": "Fim do Inquérito das Fake News é chance de criar 'regras claras' na defesa da democracia", "veiculo": "Agência Pública", "pais": "Brasil", "classe": "B"}, {"id": 266519, "titulo": "Lula vai conseguir emplacar 4 ministros no STF ou ficará refém de Senado bolsonarista?", "url": "https://www.bbc.com/portuguese/articles/c5n49ln0l4xeo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-16T08:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente terá que buscar nomes com apoio forte do Centrão para emplacar ministros no STF, em vez de nomes próximos como Flávio Dino e Cristiano Zanin. A análise sugere que o sucesso na indicação dependerá do apoio do Centrão.", "titulo_pt": "Lula terá que buscar apoio do centrão para indicar ministros no STF", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 266433, "titulo": "Trecho da BR-040 entre RJ e Minas terá pedágio free flow", "url": "https://www.poder360.com.br/poder-infra/trecho-da-br-040-entre-rj-e-minas-tera-pedagio-free-flow/", "fonte_id": "poder360", "data_pub": "2026-11-16T08:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Começará nesta segunda-feira o sistema free flow de pedágio no trecho da BR-040 entre Simão Pereira (MG) e o Rio de Janeiro, com tarifa de R$ 21 e prazo de 30 dias para pagamento.", "titulo_pt": "Trecho da BR-040 entre RJ e Minas terá pedágio free flow", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 266434, "titulo": "Justiça de Minas Gerais confirma vazamento de arquivos após invasão", "url": "https://www.poder360.com.br/poder-justica/justica-de-minas-gerais-confirma-vazamento-de-arquivos-apos-invasao/", "fonte_id": "poder360", "data_pub": "2026-11-16T07:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal de Justiça de Minas Gerais confirmou o vazamento de arquivos após uma invasão. O tribunal não informou quantas pessoas foram afetadas, mas os sistemas judiciais e administrativos continuaram funcionando.", "titulo_pt": "Justiça de Minas Gerais confirma vazamento de arquivos após invasão", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 266446, "titulo": "Ao voltar a Brasília, Lula definirá desenho do novo governo. Veja cotados", "url": "https://www.metropoles.com/brasil/de-volta-a-brasilia-lula-vai-definir-desenho-do-novo-governo-veja-cotados", "fonte_id": "metropoles", "data_pub": "2026-11-16T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Depois de uma semana fora do país, o presidente Lula deve intensificar as articulações para definir o desenho do novo governo. Vários nomes estão sendo cotados para as principais pastas.", "titulo_pt": "Ao voltar a Brasília, Lula definirá desenho do novo governo. Veja cotados", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 266447, "titulo": "Ricardo Nunes planeja minirreforma no secretariado para o início de 2027", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/ricardo-nunes-planeja-minirreforma-no-secretariado-para-o-inicio-de-2027", "fonte_id": "metropoles", "data_pub": "2026-11-16T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O prefeito Ricardo Nunes está planejando mudanças no secretariado em áreas como Direitos Humanos, Educação, Comunicação e Habitação para o início de 2027.", "titulo_pt": "Ricardo Nunes planeja mudanças no secretariado para o início de 2027", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 266940, "titulo": "Lee approves confirmation hearing requests for justice minister, tax agency chief nominees", "url": "https://en.yna.co.kr/view/AEN20261116009100320", "fonte_id": "yonhap_news", "data_pub": "2026-11-16T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung aprovou pedidos para as sessões de confirmação dos nomes para o ministro da Justiça e o chefe da Agência Tributária.", "titulo_pt": "Lee aprova pedidos para sessões de confirmação de nomes para ministro da justiça e chefe da agência tributária", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 266660, "titulo": "Pope Leo, Weeks After Surgery, Holds Up Well on South America Trip", "url": "https://www.nytimes.com/2026/11/16/world/europe/pope-leo-peru-health.html", "fonte_id": "nyt_world", "data_pub": "2026-11-16T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Papa Leão XIV se recupera bem após a cirurgia no pulmão realizada em outubro. A sua viagem programada à América do Sul ocorre sem problemas até o momento.", "titulo_pt": "Papa leão xiv, semanas após cirurgia, realiza viagem à américa do sul com boa recuperação", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 266763, "titulo": "Breaking taboos: Egypt's sexual revolution takes to social media", "url": "https://www.france24.com/en/tv-shows/focus/20261116-breaking-taboos-egypt-s-sexual-revolution-takes-to-social-media", "fonte_id": "france24", "data_pub": "2026-11-16T09:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em_egito, uma_revolução_sexual_está_se_desenvolvendo_no_rede_social. Contas_com_mais_de_100mil_seguidores_estão_abordando_tópicos_de_sexy,_incluindo_a_prática_extensamente_relatada_de_cirurgia_genital_feminina, Educação_sexual_e_prazer_sexual.", "titulo_pt": "Quebrando tabus: a revolução sexual do egito toma as redes sociais", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 266469, "titulo": "Encontro de Putin, Xi e Trump é comparado à conferência da Segunda Guerra", "url": "https://www.cnnbrasil.com.br/internacional/encontro-de-putin-xi-e-trump-e-comparado-a-conferencia-da-segunda-guerra/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-16T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A possibilidade de uma reunião entre Putin, Xi e Trump levantou comparações, principalmente na Rússia, com a Conferência de Yalta de 1945.", "titulo_pt": "Encontro de Putin, Xi e Trump é comparado à conferência de yalta", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 266812, "titulo": "Bankitalia, a settembre il debito sale ancora a 3.211,6 miliardi", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/16/bankitalia-a-settembre-il-debito-sale-ancora-a-3.2116-miliardi_ea910b14-6cb1-4837-9d07-5ca91dee8422.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-16T09:45:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O débito da Bankitalia aumentou em 10,8 bilhões, totalizando 321,16 bilhões nos primeiros nove meses. As receitas totais durante o período chegaram a 429,5 bilhões, crescendo 2,6% em comparação ao mesmo período anterior.", "titulo_pt": "Bankitalia, em setembro, o débito sobe para 3,2116 trilhões", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 266549, "titulo": "Fim da 6×1: entre melhorias históricas e a autofagia da salvaguarda protetiva", "url": "https://www.jota.info/opiniao-e-analise/artigos/fim-da-6x1-entre-melhorias-historicas-e-a-autofagia-da-salvaguarda-protetiva", "fonte_id": "jota", "data_pub": "2026-11-16T09:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A necessidade humana vai além da subsistência, incluindo tempo livre, lazer e cultura como elementos essenciais para uma vida digna. A vida não se restringe apenas ao trabalho.", "titulo_pt": "Fim da 6×1: entre melhorias históricas e a autofagia da salvaguarda protetiva", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 266521, "titulo": "Quem é o 1º senador negro do Mississippi em 140 anos e por que tão poucos foram eleitos nos EUA?", "url": "https://www.bbc.com/portuguese/articles/cwe9kj4xmy2po?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-16T09:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Scott Colom venceu a corrida para o Senado no Mississippi e se tornou o primeiro senador negro do estado desde o século 19. Até agora, apenas 14 senadores negros foram eleitos na história dos Estados Unidos.", "titulo_pt": "Quem é o 1º senador negro do Mississippi em 140 anos e por que tão poucos foram eleitos nos EUA?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 266941, "titulo": "S. Korea's Lee holds summit with Philippine President Marcos", "url": "https://en.yna.co.kr/view/AEN20261116009000315", "fonte_id": "yonhap_news", "data_pub": "2026-11-16T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sul-coreano Lee Jae Myung realizou uma cúpula com o presidente filipino Ferdinand Marcos em Manila. A reunião ocorreu em 16 de novembro.", "titulo_pt": "Cúpula entre presidentes sul-coreano e filipino em manila", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 266696, "titulo": "Albanese treads tightrope in upcoming Trump meeting, wanting Indo-Pacific engagement and end to Iran and Ukraine wars", "url": "https://www.theguardian.com/australia-news/2026/nov/16/albanese-treads-tightrope-in-upcoming-trump-meeting-wanting-indo-pacific-engagement-and-end-to-iran-and-ukraine-wars", "fonte_id": "guardian_world", "data_pub": "2026-11-16T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthony Albanese tentará manter um equilíbrio delicado na sua relação com Donald Trump durante sua reunião, pedindo uma resolução rápida dos conflitos na Índia e Ucrânia e incentivando os Estados Unidos a se envolver no Pacífico Oriental. Esta será a primeira reunião de Trump como presidente, tanto na primeira quanto na segunda presidência dele.", "titulo_pt": "Albanese navega em delicado equilíbrio na reunião com Trump, buscando engajamento no pacífico oriental e fim das guerras na Índia e Ucrânia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 266659, "titulo": "A Year On, Mark Carney of Canada Returns to Asia a Political Star", "url": "https://www.nytimes.com/2026/11/16/world/canada/carney-china-xi-trump-putin-trade.html", "fonte_id": "nyt_world", "data_pub": "2026-11-16T09:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mark Carney, ex-gerente do Banco Central do Canadá, está voltando à Ásia, com foco maior em China, onde compartilhará palco com líderes como Xi Jinping, Vladimir Putin e Donald Trump.", "titulo_pt": "Ano após ano, Mark Carney do canadá retorna à ásia como estrela política", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 266805, "titulo": "NATO member Estonia to close Russia border after attempted 'sabotage' of drone maker", "url": "https://www.cnbc.com/2026/11/16/nato-estonia-russia-border-ukraine-war.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-16T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Estonia anunciou que fechará os pontos de passagem na fronteira com a Rússia após um suposto tentativa de sabotagem contra uma empresa de drones. A medida visa restringir atividades hostis e a circunvenção de sanções.", "titulo_pt": "Estonia fechará fronteira com Rússia após tentativa de 'sabotagem' em empresa de drones", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 266882, "titulo": "U.S. allies are afraid, very afraid, of those American F-35s", "url": "https://www.japantimes.co.jp/commentary/2026/11/16/world/us-allies-american-f-35s/", "fonte_id": "japan_times", "data_pub": "2026-11-16T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alies estão preocupados com suas alianças militares com os Estados Unidos, incluindo sua dependência de armas e tecnologia americanas.", "titulo_pt": "Alies temem as F-35 americanas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 266906, "titulo": "Monday Briefing from the Balkans: November 16, 2026", "url": "https://balkaninsight.com/2026/11/16/monday-briefing-from-the-balkans-november-16-2026/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-16T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O resumo da semana passada na região dos Bálcãs, fornecido pelo Balkan Insight, abrange os principais desenvolvimentos ocorridos nos países da região durante o fim de semana.", "titulo_pt": "Briefing semanal dos bálcãs: 16 de novembro de 2026", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 266474, "titulo": "Europa corre para responder à onda de ameaças de bomba no continente", "url": "https://www.cnnbrasil.com.br/internacional/europa-corre-para-responder-a-onda-de-ameacas-de-bomba-no-continente/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-16T09:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Analistas afirmam que as falsas ameaças de bomba expõem a vulnerabilidade da infraestrutura pública europeia a mensagens anônimas e difíceis de rastrear, destacando a necessidade de uma resposta mais coordenada do bloco.", "titulo_pt": "Europa enfrenta ameaças fictícias e busca resposta coordenada", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 266520, "titulo": "'A pessoa que não pode se manifestar continua sendo uma pessoa': o alerta após exposição de FHC", "url": "https://www.bbc.com/portuguese/articles/c8p3v923q2y4o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-16T09:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma advogada e especialista em bioética alerta que a exposição de pessoas vulneráveis deve ser debatida, apesar de já ser considerada normal. Ela afirma que é necessário discutir os limites dessa prática.", "titulo_pt": "A pessoa que não pode se manifestar continua sendo uma pessoa: o alerta após exposição de FHC", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 266724, "titulo": "Israel Is Losing America", "url": "https://www.foreignaffairs.com/israel/israel-losing-america", "fonte_id": "foreign_affairs", "data_pub": "2026-11-16T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel precisa mudar sua abordagem, caso contrário, pode perder a América.", "titulo_pt": "Israel está perdendo a américa", "veiculo": "Foreign Affairs", "pais": "EUA", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 266516, "titulo": "A rodada da Nova, que turbina o crédito conectando cartões e contas", "url": "https://braziljournal.com/a-rodada-da-nova-que-turbina-o-credito-conectando-cartoes-e-contas", "fonte_id": "brazil_journal", "data_pub": "2026-11-16T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A fintech A Nova, que oferece uma carteira digital para pagamentos de boletos e Pix usando cartão de crédito, acaba de fechar uma rodada de captação de US$ 24 milhões, liderada pela gestora americana Canaan e com a participação da Propel Ventures. O objetivo é escalar a solução e lançar novas funcionalidades no mercado competitivo de fintechs.", "titulo_pt": "Rodada de us$ 24 milhões para a fintech a Nova, que conecta cartões e contas", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 266429, "titulo": "Produção industrial e vendas no varejo da China frustram expectativas", "url": "https://www.poder360.com.br/poder-china/producao-industrial-e-vendas-no-varejo-da-china-frustram-expectativas/", "fonte_id": "poder360", "data_pub": "2026-11-16T09:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A produção industrial na China cresceu 4,8% em outubro, abaixo das expectativas de 5,3%. As vendas no varejo avançaram 0,4%, metade da estimativa do mercado.", "titulo_pt": "Produção industrial e vendas no varejo da China frustram expectativas", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 266471, "titulo": "Dólar impulsiona soja e milho, mas negócios e exportações limitam altas", "url": "https://www.cnnbrasil.com.br/agro/dolar-impulsiona-soja-e-milho-mas-negocios-e-exportacoes-limitam-altas/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-16T09:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar está impulsionando os preços da soja e do milho, mas as exportações desses produtos ainda não estão registrando altas significativas. A soja em Paranaguá atingiu seu maior valor nominal desde março de 2023, enquanto os embarques de milho da safra 2025/26 ainda não deslancharam.", "titulo_pt": "Dólar impulsiona soja e milho, mas exportações limitam altas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 267002, "titulo": "BeOne, Hengrui top list of China’s most powerful drugmakers", "url": "https://www.statnews.com/2026/11/16/beone-hengrui-top-list-of-chinas-most-powerful-drugmakers/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-16T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O índice STAT-WireScreen classificou as empresas biotecnológicas mais valiosas da China em bolsa. A BeOne foi a empresa que ocupou a primeira posição na lista.", "titulo_pt": "Beone lidera lista das principais empresas farmacêuticas chinesas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 266804, "titulo": "‘Standing on one leg’: IMF chief warns about global economy as AI circular financing hits $1 trillion", "url": "https://www.cnbc.com/2026/11/16/imf-georgieva-warning-ai-circular-financing.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-16T09:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A chefe do FMI, Kristalina Georgieva, alertou sobre o estado da economia global, citando que o financiamento cíclico entre empresas de IA atingiu mais de um trilhão de dólares, com dois terços sendo dívida. O entusiasmo dos investidores está diminuindo.", "titulo_pt": "‘Ficar de pernas para o ar’: chefe do fmi avisa sobre a economia global enquanto financiamento cíclico de IA atinge us$ 1 trilhão", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 266551, "titulo": "O PL das Milhas e o risco de um experimento jurídico sem precedentes", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-pl-das-milhas-e-o-risco-de-um-experimento-juridico-sem-precedentes", "fonte_id": "jota", "data_pub": "2026-11-16T08:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei 3.083/2026 deve ser analisado com cuidado antes de ser convertido em lei, pois os problemas associados a ele são considerados significativos.", "titulo_pt": "O PL das Milhas e o risco de um experimento jurídico sem precedentes", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 266478, "titulo": "13º salário deve injetar R$ 399 bilhões na economia em 2026, estima Dieese", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/13o-salario-deve-injetar-r-399-bilhoes-na-economia-em-2026-estima-dieese/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-16T08:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Dieese estima que o 13º salário deve injetar R$ 399 bilhões na economia em 2026. O benefício será recebido por 99,7 milhões de brasileiros, com um pagamento médio de R$ 3.720 por pessoa.", "titulo_pt": "13º salário deve injetar R$ 399 bilhões na economia em 2026, estima Dieese", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 266381, "titulo": "Podcast explica 'plano Moretti', pacote de ajuste fiscal para o governo Lula 4", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/podcasts/2026/11/podcast-explica-plano-moretti-pacote-de-ajuste-fiscal-para-o-governo-lula-4.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-16T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado discute novamente nesta semana um pacote fiscal apresentado pelo governo Lula, que inclui medidas como a criação de um piso de contingenciamento e a possibilidade de congelar verbas e revisar benefícios tributários de empresas até 2025.", "titulo_pt": "Podcast explica 'plano Moretti', pacote de ajuste fiscal para o governo Lula", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 266950, "titulo": "(2nd LD) Seoul stocks dip over 3 pct on tech losses amid lingering Nvidia jitters", "url": "https://en.yna.co.kr/view/AEN20261116006152320", "fonte_id": "yonhap_news", "data_pub": "2026-11-16T07:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações sul-coreanas caíram mais de 3% na semana, principalmente devido a perdas no setor tecnológico, em meio a incertezas persistentes relacionadas à Nvidia.", "titulo_pt": "Seul: ações caem mais de 3% devido a perdas tecnológicas e incertez xto_pt": "O Banco do Brasil busca negociar com o Banco Central e o Ministério da Fazenda uma regra mais flexível para contabilizar as perdas esperadas com calotes nas operações de crédito do agronegócio, devido à grave crise enfrentada pelo setor.", "titulo_pt": "Banco do Brasil quer negociar regra mais flexível para contabilizar perdas com agro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 266610, "titulo": "Apagão mundial acontece nesta terça, 17 de novembro? O que se sabe sobre os 90 dias sem energia", "url": "https://exame.com/ciencia/apagao-mundial-acontece-nesta-terca-17-de-novembro-o-que-se-sabe-teoria-dos-90-dias-sem-energia/", "fonte_id": "exame", "data_pub": "2026-11-16T06:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Publicações associam um teste de emergência nos Estados Unidos, planejamento militar e um episódio de 'Os Simpsons' à previsão de 90 dias sem energia.", "titulo_pt": "Apagão mundial de 90 dias? O que se sabe sobre a previsão", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 266892, "titulo": "Peak Energy eyes South Korea green projects as war upends fuel flows", "url": "https://www.japantimes.co.jp/environment/2026/11/16/energy/energy-korea-green-projects-war-fuel/", "fonte_id": "japan_times", "data_pub": "2026-11-16T06:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Peak Energy possui projetos de $250 milhões na Coreia do Sul e planeja outros de $100 milhões para 2027. Estes projetos estão alinhados com iniciativas verdes no país.", "titulo_pt": "Peak Energy mira projetos verdes na Coreia do sul diante da guerra", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 266612, "titulo": "O céu é o limite para o dólar se o ajuste fiscal decepcionar, diz economista do UBS", "url": "https://exame.com/invest/mercados/o-ceu-e-o-limite-para-o-dolar-se-o-ajuste-fiscal-decepcionar-diz-economista-do-ubs/", "fonte_id": "exame", "data_pub": "2026-11-16T06:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um economista do UBS afirma que a recessão prevista para 2027 ganhará força se os ajustes fiscais não forem suficientes. A economista Solange Srour sugere que a taxa de juros não cairá, limitando o potencial de recuperação econômica.", "titulo_pt": "O céu é o limite para o dólar se ajustes fiscais decepcionarem, diz economista do UBS", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 266872, "titulo": "The perfect sell-off", "url": "https://www.ft.com/content/a61f1fe9-55d9-498e-9ecc-c3a66980d63a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-16T06:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto menciona a possibilidade de acelerar a oferta pública inicial de ações (IPO) da empresa Anthropic.", "titulo_pt": "Venda perfeita", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 266802, "titulo": "The tech world's calls for Jensen Huang to return to Nvidia are growing", "url": "https://www.cnbc.com/2026/11/16/nvidia-jensen-huang-return-tech.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-16T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pressão por volta de Jensen Huang como CEO da Nvidia está aumentando, com executivos de tecnologia e principais acionistas apoiando uma possível retorno após sua demissão.", "titulo_pt": "Chamados para retorno de Jensen Huang como ceo da Nvidia crescem", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 267036, "titulo": "Barcelona-based Stark Future motors to unicorn status", "url": "https://tech.eu/2026/11/16/barcelona-based-stark-future-motors-to-unicorn-status/", "fonte_id": "tech_eu", "data_pub": "2026-11-16T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma startup baseada em Barcelona que projeta, fabrica e vende motocicletas elétricas se tornou a primeira empresa de motocicletas elétricas unicórnio da Europa. A Stark Future já levantou mais de 15 milhões de euros.", "titulo_pt": "Startup de barcelona se torna unicórnio na indústria de motocicletas elétricas", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 266883, "titulo": "Gulliver visited our AI world 300 years ago. He left in disgust.", "url": "https://www.japantimes.co.jp/commentary/2026/11/16/world/gulliver-visited-ai-world-300-years-ago/", "fonte_id": "japan_times", "data_pub": "2026-11-16T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O terceiro volume da obra-prima de Swift se concentrou em 'regiões distantes do mundo' sob o domínio de cientistas, tecnologistas e 'projectors'. Gulliver visitou o mundo da IA há 300 anos e saiu desgostoso.", "titulo_pt": "Gulliver visitou o nosso mundo de IA há 300 anos e saiu desgostoso", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 267011, "titulo": "Chinese game developer Youzu lands US$214.6 million flash memory order", "url": "https://www.digitimes.com/news/a20261116PD229/flash-shenzhen-subsidiary-2026-revenue.html", "fonte_id": "digitimes", "data_pub": "2026-11-16T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A desenvolvedora chinesa de jogos Youzu Interactive informou em 16 de novembro que sua subsidiária, Shenzhen Zhichun Heying, recebeu uma ordem de flash memory no valor de 1,428 bilhões de yuanes (US$214,6 milhões) de um cliente não identificado. O acordo de compra de dois anos, assinado em novembro de 2026, marcou a entrada da Youzu no ramo de distribuição de memória, mas a empresa disse que o negócio não deve afetar significativamente as receitas ou outros dados financeiros.", "titulo_pt": "Desenvolvedora chinesa de jogos Youzu conquista encomenda de US$214,6 milhões em memória flash", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 266966, "titulo": "Kakao Bank offers Apple Pay", "url": "https://www.koreaherald.com/article/10938929", "fonte_id": "korea_herald", "data_pub": "2026-11-16T08:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Kakao Bank introduziu o Apple Pay, se tornando a segunda instituição financeira na Coreia a oferecer o serviço, mais de três anos após o lançamento inicial no país. A funcionalidade foi habilitada para as cartões de débito da instituição, permitindo que clientes maiores de 14 anos adicionem seus cartões mini da Kakao Bank ao Apple Wallet.", "titulo_pt": "Kakao Bank oferece Apple Pay", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 267012, "titulo": "US utilities test Anthropic's Mythos AI to find power system vulnerabilities", "url": "https://www.digitimes.com/news/a20261116PD233/anthropic-microsoft-testing-software-cybersecurity.html", "fonte_id": "digitimes", "data_pub": "2026-11-16T08:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas de energia dos Estados Unidos, incluindo a Duke Energy, estão testando o modelo de inteligência artificial Mythos, desenvolvido pela Anthropic, para identificar vulnerabilidades no software dos sistemas de energia e fortalecer as defesas contra ataques cibernéticos. O projeto começou após a Anthropic lançar o modelo em abril, através da iniciativa de segurança cibernética Project Glasswing, que oferece acesso selecionado à tecnologia.", "titulo_pt": "Empresas de energia dos EUA testam AI da Anthropic para identificar vulnerabilidades em sistemas de energia", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 266915, "titulo": "Why Singapore’s wave of data breaches signals ‘new era’ of cyber threats", "url": "https://www.scmp.com/week-asia/economics/article/3374584/why-singapores-wave-data-breaches-signals-new-era-cyber-threats", "fonte_id": "scmp", "data_pub": "2026-11-16T08:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Steven Wong, um aposentado de 71 anos em Singapura, ficou preocupado com a quantidade de informações pessoais expostas após receber chamadas de estranhos que o conheciam por nome. Como resultado, ele evita transações online com cartão de crédito e ignora mensagens indesejadas.", "titulo_pt": "Por que a onda de violações de dados em singapura sinaliza uma 'nova era' de ameaças cibernéticas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 266948, "titulo": "S. Korea's Lee proposes initiative with ASEAN to ensure AI benefits for all", "url": "https://en.yna.co.kr/view/AEN20261116008000315", "fonte_id": "yonhap_news", "data_pub": "2026-11-16T08:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sul-coreano Lee Jae Myung propôs uma iniciativa com a ASEAN para garantir que os benefícios da inteligência artificial beneficiem todos. Essa proposta foi feita em Manila no dia 16 de novembro.", "titulo_pt": "S. Korea's Lee propõe iniciativa com a ASEAN para garantir benefícios da IA para todos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 266482, "titulo": "Veja quais as medidas de segurança do Inter para pagamentos por Pix", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/veja-quais-as-medidas-de-seguranca-do-inter-para-pagamentos-por-pix/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-16T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Medidas de segurança como autenticação, biometria, monitoramento e bloqueio preventivo são utilizadas para proteger transações por Pix, mas a conferência dos dados pelo usuário continua sendo essencial.", "titulo_pt": "Veja quais as medidas de segurança do Inter para pagamentos por Pix", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 266484, "titulo": "China e EUA travam corrida por desenvolvimento de IA", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/china-e-eua-travam-corrida-por-desenvolvimento-de-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-16T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nvidia perdeu cerca de US$ 192 bilhões em valor de mercado após uma investigação envolvendo Jensen Huang e suspeitas de espionagem chinesa. A China e os Estados Unidos estão em uma corrida pelo desenvolvimento de inteligência artificial (IA).", "titulo_pt": "China e EUA travam corrida por desenvolvimento de IA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 266919, "titulo": "China’s Moonshot AI puts Kimi models into race for scientific discoveries", "url": "https://www.scmp.com/tech/article/3374568/chinas-moonshot-ai-puts-kimi-models-race-science-discoveries", "fonte_id": "scmp", "data_pub": "2026-11-16T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup chinesa de inteligência artificial Moonshot AI, responsável pelo desenvolvimento dos modelos Kimi, está focando em descobertas científicas, competindo com rivais americanos para transformar a IA em um motor de pesquisa. A empresa, com sede em Beijing, está explorando aplicativos que exigem capacidades de raciocínio avançado de IA, incluindo pesquisas em biologia, química e farmacologia.", "titulo_pt": "China’s Moonshot AI busca descobertas científicas com seus modelos Kimi", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 266920, "titulo": "Japanese forecasters find AI beats traditional models at tracking typhoons", "url": "https://www.scmp.com/news/asia/east-asia/article/3374570/japanese-forecasters-find-ai-beats-traditional-models-tracking-typhoons", "fonte_id": "scmp", "data_pub": "2026-11-16T07:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Modelos de inteligência artificial estão superando as modelos físicos tradicionais na previsão do percurso de furacões no Japão. Uma empresa privada de meteorologia e a agência meteorológica do país estão explorando o uso de AI, mas especialistas apontam que ainda há desafios, como a previsão da intensidade dos furacões.", "titulo_pt": "Previsões de furacões por IA superam modelos tradicionais no Japão", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 266894, "titulo": "Japan planning to build network to share disaster information across Asia", "url": "https://www.japantimes.co.jp/news/2026/11/16/japan/disaster-information-share-network-asia/", "fonte_id": "japan_times", "data_pub": "2026-11-16T06:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo japonês planeja construir uma rede para compartilhar informações sobre desastres naturais em toda a Ásia, com o objetivo de incentivar os países a implementarem sistemas de alerta precoce que analisem dados antes que os desastres ocorram.", "titulo_pt": "Japão planeja construir rede para compartilhar informações sobre desastres em toda a ásia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 266971, "titulo": "Samsung, SK hynix-linked ELS raises fear of further market volatility", "url": "https://www.koreaherald.com/article/10938789", "fonte_id": "korea_herald", "data_pub": "2026-11-16T06:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Equidade vinculada a Samsung Eletrônica e SK hynix pode aumentar a volatilidade do mercado devido a fortes quedas nas ações dessas empresas, o que pode levar a vendas de underlying por parte de corretoras para gerenciar exposição de hedge. Com alguns produtos prestes a vencer a partir do próximo mês, mais quedas podem acarretar pressão adicional para baixo.", "titulo_pt": "Equidade vinculada a samsung e SK hynix pode ampliar a volatilidade do mercado", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 266955, "titulo": "Kakao Bank offers Apple Pay service in Korea", "url": "https://en.yna.co.kr/view/AEN20261116006500320", "fonte_id": "yonhap_news", "data_pub": "2026-11-16T06:32:00Z", "Um estudo da Universidade de Nova Gales do Sul notou diferenças no movimento dos braços de pessoas que posteriormente foram diagnosticadas com Parkinson. Essas diferenças poderiam indicar sinais precoces da doença.", "titulo_pt": "Este sinal ao caminhar poderia antecipar indícios precoces de Parkinson, de acordo com um estudo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 266395, "titulo": "Humanos caçavam hipopótamos no interior saudita há 125 mil anos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/humanos-cacavam-hipopotamos-no-interior-saudita-ha-125-mil-anos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-16T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há 125 mil anos, na localidade saudita de Mundafan, que hoje é uma vasta área de areia e pedras, existia um grande lago com hipopótamos e antílopes, provavelmente caçados por humanos que haviam saído do continente africano.", "titulo_pt": "Humanos caçavam hipopótamos no interior saudita há 125 mil anos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 267047, "titulo": "The end of the universe could emerge suddenly from nothing", "url": "https://www.newscientist.com/article/2598817-the-end-of-the-universe-could-emerge-suddenly-from-nothing/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-16T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um bubble de nada absoluto – espaço vazio verdadeiramente vazio – poderia existir no universo. A colunista Leah Crane explora como isso poderia existir e as ameaças que isso representa.", "titulo_pt": "O fim do universo poderia surgir repentinamente de nada", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 266884, "titulo": "WHO sounds the alarm on antimicrobial resistance threat", "url": "https://www.japantimes.co.jp/news/2026/11/16/world/who-alarm-antimicrobial-resistance/", "fonte_id": "japan_times", "data_pub": "2026-11-16T08:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OMS alertou que o progresso na prevenção, diagnóstico e uso apropriado de antibióticos é insuficiente para atingir os objetivos globais estabelecidos.", "titulo_pt": "OMS emite alerta sobre ameaça de resistência antimicrobiana", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 266972, "titulo": "Why Korea’s push to regulate hidden cameras stalled", "url": "https://www.koreaherald.com/article/10938783", "fonte_id": "korea_herald", "data_pub": "2026-11-16T06:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2017, a Coreia do Sul propôs rastrear a venda de câmeras escondidas para combater a filmagem ilegal. Um projeto de lei que exigiria a registro desses dispositivos por lojas e proprietários expirou. Agora, após um candidato aprovado no exame nacional de contabilidade ser acusado de usar uma câmera microscópica e inteligência artificial gerativa para trapaça, o governo está reconsiderando a regulamentação desses dispositivos.", "titulo_pt": "Por que a Coreia do sul pausou na regulamentação de câmeras escondidas?", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 266617, "titulo": "Corvos tomam decisões mais rápido que humanos? Teste revela diferença surpreendente", "url": "https://exame.com/ciencia/corvos-tomam-decisoes-mais-rapido-que-humanos-teste-revela-diferenca-surpreendente/", "fonte_id": "exame", "data_pub": "2026-11-16T06:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um experimento demonstrou que corvos respondem em cerca de 235 milissegundos, revelando uma diferença surpreendente em relação ao tempo de resposta humano. O teste também identificou semelhanças no processamento cerebral das aves e dos primatas.", "titulo_pt": "Corvos respondem mais rápido que humanos? Teste mostra diferença surpreendente", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 266619, "titulo": "Goma de mascar contra HPV? Estudo aponta redução de até 93%", "url": "https://exame.com/ciencia/goma-de-mascar-contra-hpv-estudo-aponta-reducao-de-ate-93/", "fonte_id": "exame", "data_pub": "2026-11-16T06:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo mostrou que a tecnologia da goma de mascar reduziu em até 93% a presença do HPV em amostras de pacientes. Além disso, a tecnologia também eliminou duas bactérias nocivas sem afetar os microrganismos benéficos da boca.", "titulo_pt": "Goma de mascar contra HPV? Estudo aponta redução de até 93%", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 266405, "titulo": "Nova montagem comemora os 60 anos de 'Dois Perdidos Numa Noite Suja', de Plínio Marcos", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/nova-montagem-comemora-os-60-anos-de-dois-perdidos-numa-noite-suja-de-plinio-marcos.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-16T09:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova montagem da peça 'Dois Perdidos Numa Noite Suja', de Plínio Marcos, está sendo realizada em São Paulo para comemorar os 60 anos de sua estreia, em 1966.", "titulo_pt": "Nova montagem comemora os 60 anos de 'Dois Perdidos Numa Noite Suja', de Plínio Marcos", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 266573, "titulo": "Cebada: las sorpresas de un octubre nublado y frío", "url": "https://www.lanacion.com.ar/economia/campo/cebada-las-sorpresas-de-un-octubre-nublado-y-frio-nid16112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-16T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "No sudeste e sudoeste da província de Buenos Aires, as baixas temperaturas, a falta de radiação e as ch
