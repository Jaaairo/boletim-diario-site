<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "28/10/2026 07:18", "stats": {"noticias_novas": 613, "resumos_gerados": 238}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Brasil voltou à normalidade após Flávio Bolsonaro aceitar o resultado das eleições, conforme informou a Folha de São Paulo. A direita, que perdeu por uma margem significativa, parece ter aceito a derrota e voltou a se concentrar em outros assuntos. O presidente Lula venceu a eleição com o PT obtendo seu melhor desempenho no segundo turno no Sudeste desde 2010, conforme informado pela Folha de São Paulo. Além disso, especialistas consultados pela Folha em 27 de outubro de 2026 sugeriram que a fuga de Flávio Bolsonaro do Brasil pode ser usada como base para a decretação de prisão preventiva. Por outro lado, o deputado federal Nikolas Ferreira pediu ao Ministério Público Federal que investigasse o advogado José Francisco Manssur, autor da lei das apostas online, por suposto conflito de interesse, mas a denúncia foi arquivada na última segunda-feira (26).", "mundo": "Israel enfrenta dificuldades para formar um governo após as eleições, pois nem o bloco de Benjamin Netanyahu nem a oposição liderada por Gadi Eisenkot conseguiram maioria no parlamento. A ideia de formar uma coalizão com partidos árabes foi rejeitada por Netanyahu, que a considera vergonhosa. Na América do Sul, Jair Bolsonaro, derrotado nas eleições, fugiu do Brasil e chegou à Flórida, nos Estados Unidos, onde seu filho Flávio Bolsonaro também está. A decisão do governo Trump de oferecer um visto a Flávio Bolsonaro e sua família pode agravar as relações entre o ex-presidente Jair Bolsonaro e o presidente Donald Trump.\n\nIsrael continua enfrentando tensões significativas em seu conflito com o Hamas em Gaza, com ataques israelenses resultando em mortes e feridos. Novas operações eleitorais estão alterando o cenário político local. Segundo o Ministério da Saúde de Gaza, pelo menos 74.564 palestinos foram mortos desde outubro de 2023, com 1.568 mortes registradas desde 11 de outubro de 2025. Um ataque israelense em Khan Younis feriu duas pessoas, enquanto a contagem de votos da eleição parlamentar continuava. Benjamin Netanyahu lidera as pesquisas eleitorais, mas ainda não atingiu a maioria necessária. O conflito regional também se estende a outros países, com a Rússia buscando alianças em África e a China tentando manter a paz nas fronteiras com a Índia. Além disso, a Coreia do Sul e os Estados Unidos se preparam para discutir assuntos bilaterais em Washington, enquanto a Coreia do Norte é pressionada a participar de discussões sobre o limite fronteiriço intercoreano.", "economia": "A economia brasileira enfrenta diversos desafios, com destaque para a decisão do Itaú de investir em uma nova startup após sete anos, sinalizando a continuidade das transformações digitais no setor bancário. Na Petrobras, os conselheiros discutiram aumentos nos preços dos combustíveis logo após as eleições, demonstrando a pressão imediata sobre a empresa nesse tema. O Tesouro Direto registrou um dos maiores aumentos de taxas de juros desde 2005, refletindo eventos como a pandemia, o caso Joesley Batista e a eleição presidencial. Internamente, o governo Lula enfrenta desafios financeiros, com a alta do dólar ameaçando lucros e endividamento rural, enquanto a safra recorde do Brasil enfrenta custos elevados. A Coreia do Sul planeja investir em turismo regional para atrair mais visitantes estrangeiros, enquanto a LG Chem planeja vender uma participação em sua unidade de baterias para aumentar o valor para os acionistas. A SK Hynix, fabricante de chips sul-coreana, registrou lucros superiores às expectativas e anunciou o retorno de US$ 25 bilhões aos investidores. A Coreia do Sul também relatou recordes de lucro operacional na OCI, impulsionada por vendas de materiais de semicondutores e carbono negro, enquanto as ações da Jio Platforms, apoiada por Meta e Google, subiram mais de 21% em seu IPO recorde.", "tecnologia": "A empresa Anthropic está buscando equilibrar os interesses dos investidores com o impacto positivo para a humanidade na área de inteligência artificial, conforme mostrou um estudo da própria empresa. Nele, analistas profissionais escolheram opções que coincidiam com as preferências de um assistente de inteligência artificial 86% do tempo. Além disso, a comunidade de segurança cibernética esteve preparada para uma possível catástrofe após a descoberta de falhas críticas no código fundamental da web por meio da inteligência artificial. No entanto, as tentativas automatizadas de ataques não deram o resultado esperado, apesar de a defesa empreendida por muitas empresas ter ajudado a mitigar os efeitos dessas vulnerabilidades. A comunicação de empresas como a Google e a Apple foi multada pela Comissão de Comunicações e Telecomunicações da Coreia por limitar as opções de pagamento dos desenvolvedores de aplicativos através de suas políticas de pagamento dentro da aplicação, o que levou à criação de um site para coletar pistas sobre o grupo de hackers que realizou ataques cibernéticos.", "ciencia": "Um estudo computacional recriou os primeiros dois bilhões de anos do universo, oferecendo uma visão detalhada dos primeiros momentos após o Big Bang. O projeto, publicado em uma revista científica, produziu imagens e vídeos de alta qualidade que retratam a formação do cosmos. Em outro desenvolvimento, o Observatório Vera C. Rubin, localizado no Chile, pode ter descoberto o sexto planeta anão do sistema solar. Este achado poderia mudar nossa compreensão do sistema planetário. Além disso, a NASA convidou a mídia para participar do encerramento de uma simulação de missão à Marte, após 378 dias de isolamento. Quatro voluntários saíram de seu habitat no sábado, 31 de outubro. Os dados coletados podem auxiliar a agência espacial no desenvolvimento de métodos para futuras missões.", "cultura": "O evento mais importante dos artigos é a celebração do tercecentésimo aniversário do livro 'Gulliver's Travels', de Jonathan Swift, que foi publicado em 1726. Em Dublin, várias atividades estão sendo organizadas para comemorar este marco cultural significativo. No campo da arquitetura, a Ópera Nacional da Coreia inicia uma jornada de quatro anos para produzir 'O Anel dos Nibelungos', de Richard Wagner, um projeto ambicioso que marca a primeira vez que a Coreia tentará montar todas as quatro óperas do ciclo. No entanto, os eventos culturais não se limitam a esses: Jay-Z foi nomeado como headliner para o show do meio do jogo da Super Bowl, uma escolha que confere credibilidade à NFL. Além disso, a atriz neozelandesa Melanie Lynskey será a protagonista e co-executiva produtora de uma nova série limitada chamada 'Mushroom Murders', que será exibida no Paramount+ em 2027. A série se baseia no caso de crime real australiano envolvendo Erin Patterson, acusada de servir fungos venenosos em um almoço em 2023.", "sociedade": "A Polícia Civil do Estado do Rio de Janeiro (PCERJ) realizou uma operação para investigar uma rede de escravidão sexual envolvendo menores, com suspeitos que produziam vídeos de abusos para ameaçar as vítimas. Um ponto importante foi a discussão sobre o saneamento e seu impacto no desenvolvimento social, que foi tema de um encontro. A atriz Teca Pereira, conhecida por seu papel em 'Feito Pipa', relatou ter pensado em desistir da carreira devido à falta de representatividade na indústria audiovisual. Em Mato Grosso do Sul, indígenas denunciaram ameaças e insultos discriminatórios após as eleições, com o Ministério dos Povos Indígenas solicitando a apuração da Polícia Federal. No Brasil, a cidade de Penha e Alemão registrou mais de 1.800 tiroteios e 617 pessoas baleadas em dez anos, com a Operação Contenção em 2025 resultando em 122 mortos. Em Itaewon, na Coreia do Sul, Rached Rached, cuja filha morreu na tragédia em 2022, ainda sente dor e critica o governo por não ter melhorado a situação desde então. O presidente Lee Jae Myung pediu ao governo que agilizasse ações para prevenir mortes evitáveis, no dia anterior ao quarto aniversário da tragédia.", "meio_ambiente": "A seca na Amazônia, influenciada pelo El Niño, está limitando a navegação e exigindo que os proprietários de navios reduzam a carga de contêineres, conforme informou a Antaq. Em outro desenvolvimento, a Irena anunciou que o mundo adicionará menos capacidade de energia renovável em 2026 pela primeira vez em cinco anos, devido a problemas nas redes de transmissão e barreiras comerciais. No Reino Unido, uma contabilização questionável de 2 bilhões de libras foi crucial para o país atingir seu objetivo de fornecer 11,6 bilhões de libras de ajuda climática para países em desenvolvimento até 2026. Além disso, a geleira do Groenlândia registrou a 30ª perda consecutiva de gelo em um período de 12 meses. No Pantanal de Mato Grosso do Sul, um vídeo registrou uma sucuri-amarela enrolando o corpo em um jacaré dentro de um lago. No Japão, três pessoas foram presas suspeitas de conspirar para introduzir três tartarugas-estrela indianas e 13 caranguejos-rosa no Japão pelo Aeroporto Internacional de Kansai, em Osaka. No Brasil, hóteis estão incorporando práticas climáticas aos negócios do setor hoteleiro, investindo em energia limpa e eficiência energética para reduzir a pegada de carbono. Nos Estados Unidos, a administração Trump está planejando anunciar mudanças que enfraquecerão as regras que protegem contra vazamentos de metano, um gás de efeito estufa potente.", "direitos_humanos": "Um blogueiro chinês, famoso por investigar fraudes em telecomunicações, foi assassinado por criminosos contratados online, levando a pedidos de maiores punições. Em Tóquio, a família de um homem kurdo que faleceu durante a custódia acionou o governo local em uma ação judicial, denunciando falta de conscientização sobre os direitos humanos na polícia. O cineasta iraniano Jafar Panahi foi condenado a cinco anos de prisão após lançar o filme 'Apenas um Acidente', além de proibição de viajar e atividades nas redes sociais por dois anos. Em Gaza, os palestinos expressaram pouca esperança em mudanças políticas israelenses após as eleições, enquanto um relatório da ONU afirma que Israel continuou a cometer violações graves contra os direitos humanos no Gaza após o cessar-fogo. Além disso, Kylian Mbappé se desculpou após uma montagem que o associou ao ditador chinês Mao Zedong, resultando em perda de patrocínios e proibição de usar o aplicativo chinês de redes sociais."}, "resumo_do_dia": {"politica_nacional": [{"id": 230641, "titulo": "Erika Hilton deixará o PSOL e migrará para o PT em janeiro, afirmam correligionários", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/erika-hilton-deixara-o-psol-e-migrara-para-o-pt-em-janeiro-afirmam-correligionarios.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada federal Erika Hilton, reeleita pelo PSOL-SP, deve deixar o partido e se alinhar ao PT a partir de janeiro, conforme informam correligionários dela pertencentes à Primavera Socialista, corrente do PSOL.", "titulo_pt": "Erika Hilton deixará o PSOL e migrará para o PT em janeiro, afirmam correligionários", "veiculo": "Folh
