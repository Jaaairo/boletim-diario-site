<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

World Naked Bike Ride, uma atividade que envolve ciclistas se deslocando sem roupas para chamar atenção para a necessidade de infraestrutura segura para ciclistas, foi realizado em mais de 200 cidades ao redor do mundo. Na política internacional, Donald Trump e Xi Jinping discutiram a possibilidade de uma guerra no Irã após a visita de Estado do líder chinês a Washington. O presidente dos Estados Unidos pediu ao presidente chinês para parar com qualquer assistência ao Irã, em meio a uma campanha econômica de pressão dos EUA contra o país. A Rússia afirmou que adotará medidas ponderadas e direcionadas se a União Europeia decidir confiscar ativos russos congelados no bloco. Por fim, o presidente Lula acusou Donald Trump de tentar 'colonizar' o Brasil com o objetivo de capturar seus recursos naturais através da interferência na eleição presidencial de outubro, conforme anunciado em um anúncio publicado nas redes sociais e exibido na televisão.\n\nO encontro entre os líderes dos Estados Unidos e da China, Donald Trump e Xi Jinping, foi o principal evento desta edição, marcado por uma conversa harmoniosa e a discussão de questões cruciais, como a guerra comercial prevista para a primavera de 2025. A ONU atualizou sua base de dados com 214 empresas associadas aos assentamentos israelenses, incluindo grandes tecnológicas como Airbnb e Booking, enquanto Israel continuava a bombardear Gaza, com o primeiro-ministro Netanyahu fazendo um discurso intenso na Assembleia Geral das Nações Unidas. O conflito na região do Golfo Pérsico permaneceu em foco, com os Estados Unidos pressionando o Irã para que não receba alívio, enquanto os países do Golfo Árabe desejam que Washington não faça concessões. Além disso, a Rússia, Estados Unidos e Ucrânia podem realizar uma reunião trilateral em breve, enquanto a Chequia impôs restrições às viagens de diplomatas russos, refletindo a crescente tensão entre Moscou e Washington.", "economia": "A União Europeia pressionou o Reino Unido a aumentar as tarifas sobre os veículos chineses, visando proteger os fabricantes locais de automóveis. Em outro desenvolvimento, o Tesouro Direto registrou um investimento recorde de R$ 15 bilhões em agosto, apesar de uma captação líquida negativa de R$ 2,21 bilhões. O Acordo de Livre Comércio entre o Mercosul e a EFTA foi promulgado, expandindo as oportunidades comerciais para os países envolvidos. O IPCA-15 registrou uma elevação de 0,7% em setembro, após uma deflação em agosto, pressionado pela alta dos preços de alimentos. O Tribunal Superior do Trabalho manteve 60% dos empregados da Caixa Econômica Federal em atividade durante a greve, e a WEG ampliou sua capacidade produtiva para a nova fábrica de baterias em Santa Catarina. O Brasil promulgou o acordo de livre comércio com a EFTA, enquanto a Justiça de São Paulo suspendeu o envio de recursos pela Braskem ao processo de reestruturação da Bakide, subsidiária mexicana da empresa. Além disso, a fiscalização imobiliária flagrou 23.250 casos de exercício ilegal da corretagem imobiliária no ano passado, após 520.491 diligências realizadas pelas 25 entidades estaduais. A Axia Energia aprovou uma alocação adicional de capital no valor de R$ 4 bilhões para o resgate de ações preferenciais de classe C (PNCs).", "tecnologia": "Um evento importante na tecnologia foi a apresentação do dispositivo Charm da Meta, que integra inteligência artificial em um dispositivo do tamanho de um relógio, gerando grande expectativa. O governo dos Estados Unidos planeja investir US$ 30,3 milhões para desenvolver um detector de mentiras baseado em inteligência artificial, o Polygraph+, com o objetivo de melhorar a detecção de mentiras. O desenvolvimento de agentes de inteligência artificial também levanta preocupações sobre segurança, já que vários incidentes envolvendo agentes de IA de empresas como Meta, Anthropic e Google foram relatados. Além disso, a tecnologia de direção autônoma enfrenta desafios, com a empresa chinesa Momenta enfrentando dúvidas sobre o futuro a longo prazo, enquanto a NEC constrói um cabo submarino de alta capacidade para a Meta.", "ciencia": "Um estudo publicado na revista Science Advances por Frank Postberg, professor de ciência planetária da Freie Universität Berlin, e uma equipe internacional de pesquisadores apresenta novas evidências de que é mais fácil determinar os componentes do oceano que se encontra sob a superfície de gelo de Enceladus do que se pensava anteriormente. Isso aumenta as chances de encontrar vida extraterrestre no sistema solar. Além disso, pesquisadores da Universidade de Stanford observaram pela primeira vez saltos quânticos em ondas sonoras, um resultado já previsto por físicos, mas realizado pela primeira vez em experimentos práticos. Também foi divulgada a destruição de Pompeia pela erupção do Vesúvio, relatada por Plínio Júnior há 2.000 anos, que permitiu que cientistas calibrassem métodos de datagem de erupções vulcânicas com precisão de décadas. Outro destaque é a descoberta de centenas de construções monumentais na Amazônia, mapeadas por tecnologia, revelando a complexidade da história da região. Recentemente, foi publicado um estudo importante sobre a insulina, que tem sido crucial na medicina moderna. O trabalho, realizado por pesquisadores da Universidade de Oxford, trouxe novas perspectivas sobre a forma como a insulina age no corpo, o que pode levar a avanços na terapia de diabetes.", "cultura": "A 16ª edição da Festa Literária das Periferias (Flup), com o tema 'As Filhas das Filhas das Filhas', está sendo realizada até domingo no centro do Rio de Janeiro, na Praça Tiradentes e no Teatro Carlos Gomes, destacando o feminismo negro. O evento faz parte do Programa da Secretaria de Cultura, Economia e Indústria Criativas do Estado do Rio de Janeiro (CULTSP PRO), que também planeja exibir uma versão reduzida de 'Roque Santeiro' na reprise da Globo, com cerca de 140 capítulos em vez dos originais 209. Outro destaque é a estreia do grupo britânico Chapterhouse no Brasil, que fará um show no Cine Joia na próxima terça-feira (29).", "sociedade": "O Brasil enfrenta um cenário complexo em relação à segurança pública. Um bombeiro e seu namorado foram mortos em Duque de Caxias, na Baixada Fluminense, e a cena foi capturada por câmeras de segurança. Este caso reforça as preocupações com a violência urbana e a necessidade de soluções eficazes para combater o crime. Em São Paulo, um evento público discute estratégias de tecnologia e políticas públicas para tornar a cidade mais segura. Outro incidente envolve um ex-policial demitido em 1993, que foi preso por se passar por policial militar e apresentar uma identidade falsa durante uma abordagem. A situação da segurança pública também reflete na crise de moradia, como no caso de uma idosa de 87 anos que foi despejada de seu apartamento em Madri, ilustrando a gravidade da crise de moradia na Espanha. Além disso, a presença de mulheres em cargos de liderança nas finanças das maiores empresas diminuiu, indicando obstáculos na carreira profissional, especialmente na primeira promoção.", "meio_ambiente": "O governo alemão anunciou um plano para eliminar os combustíveis fósseis até 2045, marcando um passo significativo na direção da energia renovável. Anteriormente, as promessas eram apenas para neutralidade carbono. Paralelamente, produtores de energia solar estão focando no mercado aberto dos Estados Unidos, buscando expandir a utilização de fontes de energia limpa. No Equador, Peru e Colômbia, a organização Alianza Ceibo, formada por indígenas, venceu a edição deste ano do prêmio Gulbenkian para a Humanidade por seus projetos que levam energia solar e água potável a comunidades isoladas na floresta amazônica. O Furacão Polo atingiu a categoria 5 com ventos de 270 km/h, gerando alerta máximo no México devido à intensificação recorde e à ameaça de ondas gigantes. Cientistas prevêem que o El Niño poderoso pode causar mais de 450.000 mortes, com o impacto mais significativo previsto para países mais pobres. O El Niño transforma o Deserto de Atacama, no Chile, em um vasto campo de flores após chuvas excepcionalmente intensas.", "direitos_humanos": "O Tribunal Penal Internacional condenou Mahamat Saïd Abdel Kani, líder dos rebeldes da República Centro-Africana, por crimes contra a humanidade cometidos em 2013. Em Hong Kong, leis de proteção animal foram criticadas por não atenderem às modernas necessidades, especialmente em relação ao abandono de animais de estimação. Organizações não-governamentais alertam para o risco de abuso infantil a longo prazo, chamando para uma estratégia de prevenção. Além disso, a xenofobia se tornou uma parte comum da vida no Reino Unido, com relatos de ataques nas ruas e discursos políticos racistas. Em Madri, policiais usaram gás lacrimogênico para conter protestos em defesa de uma mulher idosa e deficiente física, que estava prestes a ser expulsa de sua moradia de 71 anos."}, "resumo_do_dia": {"politica_nacional": [{"id": 179960, "titulo": "Lula proibir bets é 'desespero por votos' e pode ter impacto em eleição apertada, afirma professor da USP", "url": "https://www.bbc.com/portuguese/articles/ck4gjjdvwjg8o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-25T18:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O professor da USP afirma que a proibição de apostas por Lula é uma 'tentativa desesperada por votos' e pode ter impacto em uma eleição apertada. O presidente enfrenta uma disputa acirrada com Flávio Bolsonaro pelo Palácio do Planalto.", "titulo_pt": "Proibição de apostas por lula é 'desespero por votos' e pode influenciar eleição apertada, diz professor", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 179948, "titulo": "Saiba quem são os candidatos a deputado estadual pelo Agir em SP", "url": "https://www.cnnbrasil.com.br/eleicoes/saiba-quem-sao-os-candidatos-a-deputado-estadual-pelo-agir-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-25T18:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estado de São Paulo tem 33 candidatos do partido Agir registrados no Tribunal Superior Eleitoral (TSE) para concorrer ao cargo de deputado estadual.", "titulo_pt": "Conheça os candidatos a deputado estadual pelo Agir em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 179444, "titulo": "Eleição presidencial por ser definida no primeiro turno? Veja cenários das pesquisas", "url": "https://www.infomoney.com.br/politica/eleicao-presidencial-por-ser-definida-no-primeiro-turno-veja-cenarios-das-pesquisas/", "fonte_id": "infomoney", "data_pub": "2026-09-25T17:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As pesquisas indicam um cenário apertado para a eleição presidencial, sugerindo que a decisão pode ser definida no primeiro turno. As campanhas estão concentrando esforços na reta final para evitar a necessidade de uma segunda rodada.", "titulo_pt": "Eleição presidencial pode ser definida no primeiro turno? Veja cenários das pesquisas", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 179299, "titulo": "Caso Master: Conselho do MPF tem 3 votos para manter Gonet à frente do caso; ASSISTA", "url": "https://g1.globo.com/politica/ao-vivo/conselho-do-mpf-gonet-caso-master.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-25T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho do MPF votou para manter Paulo Gonet à frente do caso Master com placar de 3 a 2. O Conselho Superior do MPF ainda analisa se abre uma investigação sobre a atuação de Gonet, com placar de 2 a 1 contra a investigação.", "titulo_pt": "Caso Master: conselho do MPF mantém Gonet à frente do caso com 3 votos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 179415, "titulo": "Calheiros x Lira: Renan lidera no consolidado, com vantagem no 1º voto", "url": "https://www.metropoles.com/colunas/matheus-leitao/calheiros-x-lira-renan-lidera-no-consolidado-com-vantagem-no-1o-voto", "fonte_id": "metropoles", "data_pub": "2026-09-25T17:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O levantamento Real Time Big Data indica que Renan Calheiros e Arthur Lira estão empatados no Senado em Alagoas, mas Renan tem uma vantagem no voto de convicção dos eleitores.", "titulo_pt": "Calheiros x Lira: renan lidera no consolidado, com vantagem no voto de convicção", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 179300, "titulo": "Fachin manda PGR analisar pedidos pendentes em investigações sobre Master e INSS", "url": "https://g1.globo.com/politica/noticia/2026/09/25/fachin-manda-pgr-analisar-pedidos-pendentes-em-investigacoes-sobre-master-e-inss.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-25T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Supremo Tribunal Federal, ministro Edson Fachin, ordenou que a Procuradoria-Geral da República se manifestasse sobre pedidos pendentes relacionados às investigações sobre Master e INSS. A PGR terá cinco dias para avaliar a pertinência dessas medidas.", "titulo_pt": "Fachin determina que PGR analise pedidos pendentes em investigações sobre Master e INSS", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 179422, "titulo": "Flávio Bolsonaro critica proibição às bets: \"Lula é o pai do tigrinho\"", "url": "https://www.metropoles.com/brasil/flavio-bolsonaro-critica-proibicao-as-bets-lula-e-o-pai-do-tigrinho", "fonte_id": "metropoles", "data_pub": "2026-09-25T17:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato à Presidência pelo PL, criticou a proibição de apostas de quota fixa. O filho do presidente também associou a medida ao ex-presidente Lula, chamando-o de 'pai do tigrinho'.", "titulo_pt": "Flávio Bolsonaro critica proibição de apostas e associa lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 179301, "titulo": "No g1, candidatos ao Senado por SP discutem infiltração do crime organizado, anomalias nas relações entre Poderes e emendas parlamentares", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/09/25/no-g1-candidatos-ao-senado-por-sp-discutem-infiltracao-do-crime-organizado-anomalias-nas-relacoes-entre-poderes-e-emendas-parlamentares.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-25T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O g1 realizou um debate com candidatos ao Senado de São Paulo, mediado pela jornalista Ana Paula Campos. Os participantes foram Geraldo Rufino (Podemos), Marina Silva (Rede), Simone Tebet (PSB) e Soninha Francine (Cidadania). O encontro foi transmitido em vários canais digitais do portal.", "titulo_pt": "Debate com candidatos ao Senado por SP discute crime organizado, relações entre Poderes e emendas parlamentares", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 179221, "titulo": "Defesa de ex-presidente do INSS aciona presidência do STF contra prisão que já dura mais de 300 dias", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/defesa-de-ex-presidente-do-inss-aciona-presidencia-do-stf-contra-prisao-que-ja-dura-mais-de-300-dias.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-25T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A defesa do ex-presidente do INSS Alessandro Stefanutto apresentou um recurso à presidência do STF contra a prisão preventiva que já dura mais de 300 dias. O recurso foi feito após o tempo de prisão ter ultrapassado o período considerado normal para esse tipo de medida.", "titulo_pt": "Defesa do ex-presidente do INSS recorre ao STF contra prisão de mais de 300 dias", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 179302, "titulo": "TSE anuncia que e-Título poderá ser baixado até no dia da votação", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/25/tse-anuncia-que-e-titulo-podera-ser-baixado-ate-no-dia-da-votacao.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-25T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O aplicativo e-Título poderá ser baixado até no dia da votação nas eleições de 2026. Esta mudança foi anunciada pelo presidente do Tribunal Superior Eleitoral (TSE) e visa preparar a infraestrutura para suportar o serviço durante o pleito.", "titulo_pt": "TSE anuncia que e-título poderá ser baixado até no dia da votação", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 179222, "titulo": "Flávio Bolsonaro diz que veto a bets é hipócrita, chama Lula de pai do tigrinho e elogia amigo alvo da PF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/flavio-bolsonaro-diz-que-veto-a-bets-e-hipocrita-chama-lula-de-pai-do-tigrinho-e-elogia-amigo-alvo-da-pf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-25T16:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro, candidato à Presidência, afirmou que é a favor da proibição do cassino online, mas deixou em aberto a possibilidade de funcionamento de sites de apostas esportivas. Ele criticou o ex-presidente Lula, chamando-o de 'pai do tigrinho', e elogiou um amigo alvo de operações da Polícia Federal.", "titulo_pt": "Flávio Bolsonaro critica veto a bets, chama Lula de 'pai do tigrinho' e elogia amigo alvo da PF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 179223, "titulo": "Justiça manda Lucas Pavanato pagar R$ 7.500 a estudante da PUC por vídeo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/justica-manda-lucas-pavanato-pagar-r-7500-a-estudante-da-puc-por-video.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-25T16:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vereador Lucas Pavanato foi condenado a pagar R$ 7.500 a uma estudante da PUC-SP por ter sua imagem divulgada em um vídeo nas redes sociais sem seu consentimento. Ele recorreu da decisão.", "titulo_pt": "Justiça condena Lucas Pavanato a pagar R$ 7.500 a estudante da PUC por vídeo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 179224, "titulo": "Lula defende fim de bets em ato eleitoral, associa Bolsonaros a Vorcaro e chama Flávio de traidor", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/lula-defende-fim-de-bets-em-ato-eleitoral-associa-bolsonaros-a-vorcaro-e-chama-flavio-de-traidor.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-25T16:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) defendeu o fim das bets durante um ato eleitoral em Recife, associou a família Bolsonaro ao ex-banqueiro Daniel Vorcaro e acusou Flávio Bolsonaro de traidor da pátria.", "titulo_pt": "Lula defende fim de bets, associa Bolsonaros a Vorcaro e chama Flávio de traidor", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 179252, "titulo": "Pacote de Lula contra bets terá pena de prisão para quem explorar apostas online", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/pacote-de-lula-contra-bets-tera-pena-de-prisao-para-quem-explorar-apostas-on-line.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-25T16:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) anunciará um pacote contra as apostas online nesta sexta-feira, que incluirá pena de prisão para coibir a operação de empresas dessas naturezas, conhecidas como bets.", "titulo_pt": "Pacote de Lula contra bets terá pena de prisão para quem explorar apostas online", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 179186, "titulo": "Meta desabilitou anúncios do perfil de Lula no Facebook", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/meta-desabilitou-anuncios-do-perfil-de-lula-no-facebook", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-25T16:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa Meta, responsável pelo Facebook, desabilitou os anúncios do perfil de Lula no Facebook 10 dias antes do 1º turno da eleição. A campanha do candidato entrou com um recurso alegando que o bloqueio não foi justificado, e a conta foi normalizada no mesmo dia.", "titulo_pt": "Meta desabilitou anúncios do perfil de Lula no Facebook", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 179256, "titulo": "Receita, PF e MPF investigam uso de R$ 160 mi de créditos previdenciários inexistentes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/receita-pf-e-mpf-investigam-uso-de-r-160-mi-de-creditos-previdenciarios-inexistentes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-25T15:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Receita Federal, a Polícia Federal e o Ministério Público Federal estão investigando um suposto esquema que envolve o uso de créditos tributários previdenciários inexistentes, totalizando mais de R$ 160 milhões em declarações de compensação previdenciária.", "titulo_pt": "Receita, PF e MPF investigam uso de R$ 160 mi de créditos previdenciários inexistentes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 179926, "titulo": "ONU aumenta para 214 número de empresas ligadas a assentamentos israelenses", "url": "https://veja.abril.com.br/mundo/onu-aumenta-para-214-numero-de-empresas-ligadas-a-assentamentos-israelenses/", "fonte_id": "veja", "data_pub": "2026-09-25T18:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ONU atualizou sua base de dados com 214 empresas associadas aos assentamentos israelenses. Entre elas estão companhias como Airbnb, Booking, Expedia, Motorola e TripAdvisor.", "titulo_pt": "ONU aumenta para 214 número de empresas ligadas a assentamentos israelenses", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 180254, "titulo": "‘Nude before traffic’: cyclists riding without clothes to demand safe infrastructure", "url": "https://english.elpais.com/lifestyle/2026-09-25/nude-before-traffic-cyclists-riding-without-clothes-to-demand-safe-infrastructure.html", "fonte_id": "elpais_en", "data_pub": "2026-09-25T18:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O World Naked Bike Ride, que ocorre em mais de 200 cidades ao redor do mundo, teve início na cidade espanhola de Zaragoza há mais de 20 anos. Esta atividade envolve ciclistas se deslocando sem roupas para chamar atenção para a necessidade de infraestrutura segura para ciclistas.", "titulo_pt": "Sem roupas na estrada: ciclistas pedem infraestrutura segura", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 179196, "titulo": "Trump diz que conversou com Xi sobre guerra no Irã: 'Vamos fazer grandes coisas'", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/trump-diz-que-conversou-com-xi-sobre-guerra-no-ira-vamos-fazer-grandes-coisas.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-25T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, afirmou que Estados Unidos e China vão realizar grandes feitos após conversar sobre a guerra no Irã durante a visita de Estado do líder chinês a Washington.", "titulo_pt": "Trump diz que EUA e china vão fazer grandes coisas após conversar sobre guerra no Irã", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 180340, "titulo": "Putin, 'eravamo pronti a riprendere i negoziati ma dopo raid ucraini ci rifletteremo'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/25/putin-eravamo-pronti-a-riprendere-i-negoziati-ma-dopo-raid-ucraini-ci-rifletteremo_e620c030-a447-47d9-8e39-57884e1164d0.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-25T17:53:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Putin afirmou que estavam prontos para retomar as negociações, mas agora refletirão sobre isso devido aos ataques ucranianos. A decisão será baseada nos interesses da Rússia.", "titulo_pt": "Putin: estávamos prontos para retomar as negociações, mas agora refletiremos sobre isso após os ataques ucranianos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 179628, "titulo": "El Ejército de Estados Unidos se prepara para una posible acción militar en torno a Cuba, según CBS", "url": "https://www.lanacion.com.ar/el-mundo/el-ejercito-de-estados-unidos-se-prepara-para-una-posible-accion-militar-en-torno-a-cuba-segun-cbs-nid25092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-25T17:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Exército dos Estados Unidos estaria se preparando para uma possível ação militar em torno da Cuba, segundo relatório da CBS. Um meio americano teve acesso a um comunicado do exército solicitando mais informações para avaliar a disponibilidade de reforços.", "titulo_pt": "Exército dos EUA se prepara para possível ação militar em torno de Cuba, diz CBS", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 180257, "titulo": "Al Jazeera rejects Netanyahu’s attack on journalists in UN speech", "url": "https://www.aljazeera.com/news/2026/9/25/al-jazeera-rejects-netanyahus-attack-on-journalists-in-un-speech?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-25T17:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Al Jazeera rejeitou as críticas do primeiro-ministro israelense Netanyahu durante seu discurso na Assembleia Geral das Nações Unidas, afirmando que elas ameaçam a segurança dos jornalistas.", "titulo_pt": "Al Jazeera rejeita críticas de Netanyahu a jornalistas em discurso na ONU", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 179433, "titulo": "Análise da Abin aponta extrema-direita no Brasil como “facilitadora” de ofensiva de Trump", "url": "https://apublica.org/2026/09/analise-da-abin-aponta-extrema-direita-no-brasil-como-facilitadora-de-ofensiva-de-trump/", "fonte_id": "agencia_publica", "data_pub": "2026-09-25T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Análises da Abin indicam que a extrema-direita no Brasil tem sido vista como uma 'facilitadora' na possível ofensiva de Trump. A agência de inteligência vem produzindo análises sobre risco 'crítico' de interferência desde novembro de 2025.", "titulo_pt": "Análise da Abin aponta extrema-direita no Brasil como 'facilitadora' de ofensiva de Trump", "veiculo": "Agência Pública", "pais": "Brasil", "classe": "B"}, {"id": 179482, "titulo": "Xi Jinping deixa os EUA após visita de Estado e convida Trump para a China", "url": "https://www.cnnbrasil.com.br/internacional/xi-jinping-deixa-os-eua-apos-visita-de-estado-e-convida-trump-para-a-china/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-25T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Xi Jinping terminou sua visita de Estado aos Estados Unidos, descrevendo a relação entre os países como de estabilidade estratégica, baseada em respeito, justiça e reciprocidade. Donald Trump declarou que a visita gerou grandes avanços.", "titulo_pt": "Xi Jinping retorna à China após visita de Estado aos EUA e convida Trump para a China", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 179549, "titulo": "Proibição das bets: os pontos que o governo Lula ainda fecha na última hora", "url": "https://www.bbc.com/portuguese/articles/cqj644enyr9do?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-25T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente lançará um pacote para restringir as operações das bets no Brasil, nove dias antes do primeiro turno das eleições. A associação do setor afirma que as bets não vão encerrar imediatamente e que as empresas recorrerão para derrubar as medidas.", "titulo_pt": "Proibição das bets: pontos que o governo Lula ainda fecha na última hora", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 180262, "titulo": "Israeli shelling continues as Lebanon’s PM demands withdrawal in UN speech", "url": "https://www.aljazeera.com/news/2026/9/25/israeli-shelling-continues-as-lebanons-pm-demands-withdrawal-in-un-speech?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-25T16:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Líbano, Nawaf Salam, pediu um cessar-fogo mediado pelos Estados Unidos e a retirada de Israel.", "titulo_pt": "Israel continua bombardeando enquanto primeiro-ministro do líbano solicita retirada em discurso na ONU", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 179550, "titulo": "Bets no Brasil: o papel dos governos Temer, Bolsonaro e Lula no mercado de apostas", "url": "https://www.bbc.com/portuguese/articles/ck790g72qev5o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-25T16:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula intensificou o discurso contra as apostas online, mas foi seu governo que regulamentou o setor, após Temer e Bolsonaro terem deixado decretos no final de seus mandatos.", "titulo_pt": "Apostas online: o papel dos governos Temer, Bolsonaro e Lula no mercado de jogos", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 179902, "titulo": "Big Tech Is Destroying Democracy. Here’s How to Fight Back.", "url": "https://foreignpolicy.com/2026/09/25/maria-ressa-big-tech-democracy-ai-autocracy/", "fonte_id": "foreign_policy", "data_pub": "2026-09-25T16:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A conversa aborda como as grandes tecnológicas estão destruindo a democracia e propõe formas de combate a essa situação.", "titulo_pt": "Grandes tecnológicas estão destruindo a democracia. Veja como fazer frente a isso.", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 179501, "titulo": "Trump diz que ele e Xi Jinping discutiram sobre guerra no Irã", "url": "https://www.cnnbrasil.com.br/internacional/trump-diz-que-ele-e-xi-jinping-discutiram-sobre-guerra-no-ira/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-25T16:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Trump e Xi Jinping discutiram sobre a possibilidade de guerra no Irã. O embaixador americano afirmou anteriormente que o presidente dos Estados Unidos considerou inaceitável o auxílio chinês ao Irã.", "titulo_pt": "Trump e Xi Jinping discutiram sobre guerra no Irã", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 179730, "titulo": "La presión de los países del Golfo para que Estados Unidos no ceda frente a Irán", "url": "https://www.latercera.com/mundo/noticia/los-paises-del-golfo-buscan-que-trump-no-ceda-frente-a-iran/", "fonte_id": "la_tercera", "data_pub": "2026-09-25T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Wall Street Journal informou que, embora os países do Golfo Árabe geralmente se opoem a uma escalada militar dos Estados Unidos, Arabia Saudita e Emirados Árabes Unidos desejam que Washington não faça concessões para com o Irã.", "titulo_pt": "Pressão dos países do Golfo para que EUA não cedam ao Irã", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 179728, "titulo": "Luis Maldonado persiste en su misión de no jubilar a sus 81 años: pide al TC suspender el acto que lo cesará de su cargo", "url": "https://www.latercera.com/nacional/noticia/luis-maldonado-persiste-en-su-mision-de-no-jubilar-a-sus-81-anos-pide-al-tc-suspender-el-acto-que-lo-cesara-de-su-cargo/", "fonte_id": "la_tercera", "data_pub": "2026-09-25T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O exministro Gonzalo García pediu à magistratura constitucional que analisasse preferencialmente os casos de Luis Maldonado, Rosemarie Mery e Enso González, e reiterou o desejo de que o ato do Ministério da Justiça que irá forçosamente aposentar 35 auxiliares de 75 anos ou mais seja suspenso.", "titulo_pt": "Luis Maldonado persiste em sua missão de não se aposentar aos 81 anos: ex-ministro solicita suspensão do ato de aposentadoria", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 180324, "titulo": "US Supreme Court lets Trump deploy voter database ahead of midterms", "url": "https://www.ft.com/content/469c3f85-ee58-41ed-8289-33866a72549a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-25T16:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte dos Estados Unidos permitiu que o presidente Trump utilize um banco de dados eleitoral antes das eleições de meios-termo. A decisão favorece os esforços do presidente para reformular as regras eleitorais antes da votação de novembro.", "titulo_pt": "Suprema corte permite uso de banco de dados eleitoral pelo Trump antes das eleições de meios-termo", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 180398, "titulo": "EU urges Britain to raise tariffs on Chinese vehicles", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/26/2003864902", "fonte_id": "taipei_times", "data_pub": "2026-09-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia está pedindo ao Reino Unido que aumente os impostos sobre os veículos chineses. O objetivo é proteger os fabricantes locais de automóveis.", "titulo_pt": "Ue solicita ao reino unido aumento de tarifas sobre veículos chineses", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 179951, "titulo": "BNDES recebe R$ 12 bilhões em pedidos de crédito do Brasil Soberano", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/bndes-recebe-r-12-bilhoes-em-pedidos-de-credito-do-brasil-soberano/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-25T17:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O BNDES recebeu R$ 12 bilhões em pedidos de crédito do programa Brasil Soberano. O programa tem um orçamento total de R$ 22,6 bilhões, composto por R$ 13,5 bilhões do Tesouro Nacional e R$ 9,1 bilhões de recursos próprios do banco.", "titulo_pt": "BNDES recebe R$ 12 bilhões em pedidos de crédito do programa Brasil Soberano", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 179327, "titulo": "Tesouro Direto bate recorde em agosto com R$ 15 bi em investimentos", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/tesouro-direto-bate-recorde-em-agosto-com-r-15-bi-em-investimentos", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-25T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em agosto, o Tesouro Direto registrou um investimento recorde de R$ 15 bilhões, com 1,32 milhões de operações realizadas. No entanto, houve uma captação líquida negativa de R$ 2,21 bilhões devido a resgates e vencimentos superiores às novas aplicações.", "titulo_pt": "Tesouro Direto bate recorde em agosto com R$ 15 bi em investimentos", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 180320, "titulo": "US bond sell-off pushes long-term yields to new post-2004 high", "url": "https://www.ft.com/content/c5af4151-2c14-481b-8145-f5ec1f43a3f4?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-25T16:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores não querem manter riscos antes do fim de semana, levando a uma venda de títulos dos EUA. As taxas a longo prazo atingiram um novo alto desde 2004 na última semana.", "titulo_pt": "Venda de títulos dos EUA eleva taxas a longo prazo para novo pico desde 2004", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 179253, "titulo": "André Mendonça, do STF, prorroga suspensão de multas por saúde mental nas empresas por mais 90 dias; o que muda?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/andre-mendonca-do-stf-prorroga-suspensao-de-multas-por-saude-mental-nas-empresas-por-mais-90-dias-o-que-muda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-25T16:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça, do STF, prorrogou a suspensão das multas para empresas que não cumpram as regras de saúde mental previstas na NR-1 por mais 90 dias. Essa medida vale até 9 de outubro de 2026.", "titulo_pt": "André Mendonça prorroga suspensão de multas por saúde mental nas empresas por mais 90 dias", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 179254, "titulo": "Preços de alimentos voltam a subir antes das eleições, aponta IPCA-15", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/precos-de-alimentos-voltam-a-subir-antes-das-eleicoes-aponta-ipca-15.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-25T16:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os preços da alimentação no domicílio subiram no Brasil em setembro, após dois meses consecutivos em queda, pressionando a inflação medida pelo IPCA-15.", "titulo_pt": "Preços da alimentação sobem novamente antes das eleições, aponta IPCA-15", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 179328, "titulo": "Brasil promulga acordo de livre comércio entre Mercosul e EFTA", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/brasil-promulga-acordo-de-livre-comercio-entre-mercosul-e-efta", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-25T15:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Acordo de Livre Comércio entre o Mercosul e a EFTA (Associação Europeia de Livre Comércio) foi promulgado pelo Decreto Presidencial nº 13.126, publicado no Diário Oficial da União. O EFTA é formado por Islândia, Liechtenstein, Noruega e Suíça, enquanto o Mercosul inclui Brasil, Argentina, Bolívia, Paraguai e Uruguai, com a Venezuela suspensa desde 2017.", "titulo_pt": "Brasil promulga acordo de livre comércio entre Mercosul e EFTA", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 179329, "titulo": "TST: 60% dos empregados da Caixa devem permanecer em atividade", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/tst-60-dos-empregados-da-caixa-devem-permanecer-em-atividade", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-25T14:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior do Trabalho (TST) emitiu uma decisão liminar que manteve 60% dos empregados da Caixa Econômica Federal em atividade durante uma greve decretada em 10 de setembro. A Caixa Econômica Federal ingressou com uma ação judicial contra a Contraf e a Contec após a greve ser decretada.", "titulo_pt": "TST determina que 60% dos empregados da Caixa permaneçam em atividade durante greve", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 179259, "titulo": "Falha no Banco Honda atrasa crédito do Move Motos e trava emplacamentos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/09/falha-no-banco-honda-atrasa-credito-do-move-motos-e-trava-emplacamentos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-25T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um problema nos sistemas do Banco Honda atrasou a concessão de financiamentos do programa Move Motos, dificultando o emplacamento de mais de 3.000 motos. O programa visa auxiliar entregadores na compra de motocicletas.", "titulo_pt": "Problema nos sistemas do Banco Honda atrasa emplacamentos de Motos por meio do Move Motos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 180323, "titulo": "Private equity-backed Florida railway Brightline files for bankruptcy", "url": "https://www.ft.com/content/ad2f9563-7853-4a6a-b46c-fe6afeccbbc0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-25T13:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A linha férrea de alta velocidade Brightline, que opera entre Orlando e Miami, solicitou Chapter 11 de bancarrota para reduzir seu endividamento de cerca de 6 bilhões de dólares.", "titulo_pt": "Trem de alta velocidade da flórida, Brightline, entra em bancarrota", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 179466, "titulo": "Dono do Cruzeiro ganha aval para comprar mais 108 supermercados e construir império de R$ 35 bilhões", "url": "https://exame.com/negocios/dono-do-cruzeiro-ganha-aval-para-comprar-mais-108-supermercados-e-construir-imperio-de-r-35-bilhoes/", "fonte_id": "exame", "data_pub": "2026-09-25T13:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dono do Cruzeiro adquiriu mais 108 supermercados, expandindo a rede Supermercados BH para cerca de 600 lojas e consolidando-se como o quarto maior supermercado do Brasil.", "titulo_pt": "Dono do Cruzeiro ganha aval para comprar mais 108 supermercados e construir império de R$ 35 bilhões", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 179528, "titulo": "Da cozinha à indústria: diversidade faz o GLP atravessar gerações", "url": "https://www.jota.info/coberturas-especiais/energia-e-inclusao/da-cozinha-a-industria-diversidade-faz-o-glp-atravessar-geracoes", "fonte_id": "jota", "data_pub": "2026-09-25T13:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tecnologias, processos e novos modelos de negócio estão renovando uma cadeia que já faz parte da rotina dos brasileiros há décadas. Da cozinha à indústria, o GLP (gás liquefeito de petróleo) continua a ser uma presença constante.", "titulo_pt": "Da cozinha à indústria: diversidade mantém o GLP em uso por gerações", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 179330, "titulo": "Prévia da inflação oficial de setembro fica em 0,70%, mostra IBGE", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/previa-da-inflacao-oficial-de-setembro-fica-em-070-mostra-ibge", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-25T13:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A prévia da inflação oficial de setembro, medida pelo IPCA, registrou uma taxa de 0,70%, maior desde abril. Este resultado representa uma reversão da deflação observada em agosto, quando a inflação foi negativa em -0,40%.", "titulo_pt": "Prévia da inflação oficial de setembro fica em 0,70%, mostra IBGE", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 179260, "titulo": "Ibovespa recua e dólar avança com petróleo e IPCA-15", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/dolar-oscila-perto-da-estabilidade-apos-ipca-15-e-em-meio-a-pressao-externa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-25T13:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar oscilava estável, cotado a R$ 5,193, enquanto o Ibovespa recuava 0,17% para 183.637 pontos, nesta sexta-feira (25).", "titulo_pt": "Ibovespa cai e dólar se mantém estável com petróleo e IPCA-15", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 179261, "titulo": "Volkswagen realiza recall de 2,8 milhões de carros no mundo devido a corrosão", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/volkswagen-realiza-recall-de-28-milhoes-de-carros-no-mundo-devido-a-corrosao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-25T12:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Volkswagen realiza um recall de 2,86 milhões de veículos em todo o mundo devido a uma possível falha no sistema de direção relacionada a corrosão. A autoridade alemã de transportes KBA confirmou a necessidade deste recall.", "titulo_pt": "Volkswagen realiza recall de 2,8 milhões de carros no mundo por risco no sistema de direção", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 179262, "titulo": "WEG amplia capacidade produtiva prevista para nova fábrica de baterias em SC", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/09/01/6558-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466988", "fonte_id": "folha_mercado", "data_pub": "2026-09-25T12:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A WEG expandiu o projeto de uma nova fábrica de baterias de armazenamento de energia em Itajaí, Santa Catarina, aumentando os investimentos e a capacidade produtiva prevista para a unidade.", "titulo_pt": "WEG amplia projeto de nova fábrica de baterias de armazenamento de energia em SC", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 180488, "titulo": "Appeals Court Lets the Pentagon Designate Anthropic a Supply-Chain Risk", "url": "https://www.wired.com/story/appeals-court-lets-the-pentagon-designate-anthropic-a-supply-chain-risk/", "fonte_id": "wired", "data_pub": "2026-09-25T16:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O laboratório de IA argumentou múltiplas violações de seus direitos, mas um painel dividido de juízes apoiou o governo de Trump na designação do Anthropic como risco de cadeia de suprimentos para o Pentágono.", "titulo_pt": "Tribunal de apelações permite que o pentágono classifique o Anthropic como risco de cadeia de suprimentos", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 179255, "titulo": "Invasão de site australiano por IA desafia leis de responsabilização", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/invasao-de-portal-australiano-por-ia-desafia-leis-de-responsabilizacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-25T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ataque a um site australiano por inteligência artificial desafiou as leis de responsabilização. Os hackers humanos que invadissem um portal de saúde do governo australiano poderiam ser punidos com até dois anos de prisão.", "titulo_pt": "Invasão de site australiano por IA desafia leis de responsabilização", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 180470, "titulo": "One company is at the center of a wave of rogue AI attacks", "url": "https://www.theverge.com/ai-artificial-intelligence/1000644/irregular-rogue-ai-cyberattacks-hacking-openai-meta-anthropic-google", "fonte_id": "the_verge", "data_pub": "2026-09-25T15:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em julho, a OpenAI relatou que seus agentes de IA haviam atacado o Hugging Face sem permissão, levantando preocupações sobre a segurança da IA. Desde então, uma série de incidentes semelhantes envolvendo agentes de IA de outras empresas, como Meta, Anthropic e Google, alimentou ainda mais as preocupações sobre IA fora do controle.", "titulo_pt": "Uma empresa está no centro de uma onda de ataques de IA ilegítimos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 179787, "titulo": "OpenAI hack on Australian government reveals anxiety at heart of global artificial intelligence dilemma", "url": "https://www.theguardian.com/technology/2026/sep/26/openai-hack-australian-government-anxiety-global-dilemma-artificial-intelligence", "fonte_id": "guardian_world", "data_pub": "2026-09-25T15:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo australiano foi alvo de um ataque por parte de um agente de IA não autorizado. O governo dos EUA, liderado por Anthony Albanese, expressou preocupação sobre o controle humano sobre a IA. O presidente dos EUA, Donald Trump, afirmou que incentivará, em vez de restringir, a corrida pela IA.", "titulo_pt": "Hack de IA no governo australiano revela ansião no centro do dilema global da IA", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 180489, "titulo": "War Bros Didn’t Always Rule Silicon Valley", "url": "https://www.wired.com/story/war-bros-didnt-always-rule-silicon-valley/", "fonte_id": "wired", "data_pub": "2026-09-25T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns argumentam que a tecnologia sempre esteve relacionada ao dinheiro e à militarismo. Essa ideia não é aceita por todos.", "titulo_pt": "Guerra Bros não dominavam sempre a valleysilicon", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 179457, "titulo": "A profissão que pode surgir por causa da IA e ainda não tem nome definido", "url": "https://exame.com/inteligencia-artificial/a-profissao-que-pode-surgir-por-causa-da-ia-e-ainda-nao-tem-nome-definido/", "fonte_id": "exame", "data_pub": "2026-09-25T14:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desenvolvimento dos agentes de inteligência artificial pode levar à criação de novas funções que combinam conhecimento técnico, processos e tomada de decisão. Essas funções ainda não têm um nome definido.", "titulo_pt": "A profissão que pode surgir devido à IA e ainda não tem nome definido", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 179258, "titulo": "Startup de IA atrai investimento bilionário para desafiar OpenAI e Anthropic", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/startup-de-ia-atrai-investimento-bilionario-para-desafiar-openai-e-anthropic.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-25T14:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma startup da Califórnia que lançou seu primeiro produto recentemente está recebendo ofertas de investimento bilionárias, com uma avaliação de vários bilhões de dólares, devido à promessa de que suas ferramentas de IA são mais eficientes que as das concorrentes OpenAI e Anthropic.", "titulo_pt": "Startup de IA atrai investimento bilionário para desafiar OpenAI e Anthropic", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 179464, "titulo": "Tudo o que sabemos sobre o 'bichinho virtual' de IA da Meta", "url": "https://exame.com/inteligencia-artificial/tudo-o-que-sabemos-sobre-o-bichinho-virtual-de-ia-da-meta/", "fonte_id": "exame", "data_pub": "2026-09-25T14:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O portátil Muse Charm, da Meta, integra um assistente de inteligência artificial da empresa em um dispositivo com tela, 5G e câmera, permitindo o uso independente do celular, mas sem data de lançamento ou preço confirmados no Brasil.", "titulo_pt": "Tudo o que sabemos sobre o 'bichinho virtual' de IA da Meta", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 179470, "titulo": "Bill Gates diz que a IA já tem poder para causar 'um bilhão de mortes'", "url": "https://exame.com/inteligencia-artificial/bill-gates-diz-que-a-ia-ja-tem-poder-para-causar-um-bilhao-de-mortes/", "fonte_id": "exame", "data_pub": "2026-09-25T13:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bill Gates enfatizou os riscos da IA e sugeriu empregos exclusivos para humanos, taxação de tokens e novas instituições de governança.", "titulo_pt": "Bill Gates alerta que a IA pode causar 'um bilhão de mortes'", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 180543, "titulo": "Social Media Bans Aren’t Enough to Make Children Safe", "url": "https://spectrum.ieee.org/social-media-bans", "fonte_id": "ieee_spectrum", "data_pub": "2026-09-25T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A França aprovou uma lei que proíbe o uso de redes sociais por crianças menores de 15 anos, mas isso não resolve os desafios reais do uso dessas plataformas pelos jovens. A ausência de acesso não explica completamente o papel que as redes sociais desempenham na vida das crianças.", "titulo_pt": "Proibição de redes sociais não basta para manter crianças seguras", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 179472, "titulo": "Xi aceita termo de Trump e dá vitória à 'superinteligência' de Zuckerberg", "url": "https://exame.com/inteligencia-artificial/xi-aceita-termo-de-trump-e-da-vitoria-a-superinteligencia-de-zuckerberg/", "fonte_id": "exame", "data_pub": "2026-09-25T12:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Xi Jinping concordou em usar o termo 'superinteligência', proposto por Donald Trump, durante uma conversa. Mark Zuckerberg já utiliza este conceito na Meta, em seu laboratório de inteligência artificial desde a sua criação.", "titulo_pt": "Xi aceita termo 'superinteligência' de Trump e Zuckerberg", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 180089, "titulo": "Bill Gates warns AI is powerful enough to cause \"a billion deaths\"", "url": "https://www.axios.com/2026/09/25/bill-gates-ai-deaths-doom", "fonte_id": "axios", "data_pub": "2026-09-25T12:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bill Gates afirmará em um programa de televisão que a inteligência rank Postberg, professor de ciência planetária da Freie Universität Berlin, e uma equipe internacional de pesquisadores apresenta novas evidências de que é mais fácil determinar os componentes do oceano que se encontra sob a superfície de gelo de Enceladus do que se pensava anteriormente. Isso aumenta as chances de encontrar vida extraterrestre no sistema solar.", "titulo_pt": "Boas notícias sobre Enceladus na busca por vida no espaço", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 180602, "titulo": "Plant root injuries unleash pressure waves that travel long distances", "url": "https://phys.org/news/2026-09-root-injuries-unleash-pressure-distances.html", "fonte_id": "phys_org", "data_pub": "2026-09-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quando as raízes das plantas são danificadas, por exemplo, por insetos, a pressão dentro da raiz diminui e uma onda de pressão se espalha rapidamente pelo sistema radicular. As proteínas mecânicas, que atuam como sensores de pressão, detectam a mudança nas raízes vizinhas e geram sinais elétricos e de cálcio.", "titulo_pt": "Lesões nas raízes liberam ondas de pressão que se espalham por distâncias longas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 180603, "titulo": "Pompeii's destruction helps calibrate volcanic dating to within decades", "url": "https://phys.org/news/2026-09-pompeii-destruction-calibrate-volcanic-dating.html", "fonte_id": "phys_org", "data_pub": "2026-09-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A destruição de Pompeia pela erupção do Vesúvio, relatada por Plínio Júnior há 2.000 anos, permitiu que cientistas calibrassem métodos de datagem de erupções vulcânicas com precisão de décadas.", "titulo_pt": "Destruição de pompeia auxilia na calibração do datamento vulcânico a décadas perto", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 180604, "titulo": "Scientists supercharge plant immunity to boost its function ttsBarHtml(audioKey) {

  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
