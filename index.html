<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<script>
const D = {"gerado_em": "27/07/2026 20:50", "stats": {"noticias_novas": 1100, "resumos_gerados": 259}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Em 2026, o Brasil enfrenta diversos desafios políticos e eleitorais. Um dos principais é a disputa pelo Senado no Rio de Janeiro entre Benedita da Silva e Marcelo Crivella. O ministro da Previdência, Carlos Lupi, está discutindo os impactos da pejotização na Justiça Suprema Federal (STF). A diplomacia também enfrenta tensões entre Jair Bolsonaro, Luiz Inácio Lula da Silva e Miguel Ángel Milei. Durante a visita do presidente sul-coreano Lee Jae-Myung à capital brasileira, Lula anuncia um grupo de trabalho para avançar o acordo entre Mercosul e Coreia do Sul. A campanha presidencial ganha novo candidato: Romeu Zema, oficializado pelo Novo partido após críticas ao discurso de Milei na convenção do PL. O MDB libera seus diretórios estaduais para decidirem autonomamente sobre apoios presidenciais. As atitudes dos candidatos refletem também nas campanhas eleitorais, como a ironia usada por Lula em resposta às declarações de Milei.", "mundo": "O governo dos Estados Unidos, sob a liderança de Donald Trump, pediu à Suprema Corte que aprovasse medidas para limitar o voto por correspondência antes das eleições parlamentares nacionais. Em outro desenvolvimento, o presidente ucraniano Volodymyr Zelensky visitou o Reino Unido para conversar com Keir Starmer, novo primeiro-ministro britânico, antes de se encontrar com Trump. Paralelamente, a Coreia do Sul e o Brasil acordaram avançar com um acordo comercial que incluirá o Mercosul. No Japão, uma pequena cidade enfrenta desafios relacionados à construção da primeira mesquita local, refletindo as complexidades culturais do país. Além disso, a China apoiou o Brasil em sua luta pela preservação da soberania nacional, diante das pressões de Trump e do presidente argentino Javier Milei.\n\nO preço do barril de petróleo Brent caiu mais de 13%, atingindo US$ 85, após a suspensão dos ataques entre Irã e Estados Unidos no Médio Oriente. Este movimento reflete o alívio das tensões geopolíticas que afetaram os mercados de commodities. Em outro desenvolvimento, o Alto Comissariado da ONU condenou as expansões das colônias israelenses na Cisjordânia como uma 'violação clara' do direito internacional, em meio a um aumento da violência. Além disso, Donald Trump continua intensificando barreiras comerciais contra produtos brasileiros, impulsionando uma crise diplomática entre Brasil e Argentina com a convocação do embaixador. A guerra entre EUA e Irã diminuiu, mas ambos os lados dão uma chance à diplomacia através de mediadores regionais. Por fim, o conflito na Ucrânia continua, com turistas ainda frequentando a cidade de Odessa apesar dos bombardeios diários, enquanto a China se prepara para um confronto político no Brasil envolvendo o atual presidente aliado à Beijing e seu adversário proponente da aliança com Washington.", "economia": "O Brasil e a Coreia do Sul assinaram um acordo para ampliar a cooperação na área energética, focando na transição energética e no uso de energias renováveis. O dólar fechou a segunda-feira (27) em seu maior valor em duas semanas, impulsionado pela queda do petróleo, enquanto o Ibovespa encerrou o dia em alta apesar da pressão da Petrobras. A Apple ultrapassou a Nvidia como a empresa mais valiosa do mundo no fechamento do dia, e as ações da Embraer subiram mais de 5% após um aumento de 16% na carteira de pedidos no segundo trimestre em comparação com o mesmo período do ano anterior. A confiança dos consumidores brasileiros caiu em julho, atingindo seu nível mais baixo em quatro meses, refletindo uma piora na percepção sobre a situação atual. O IPCA (Índice Nacional de Preços ao Consumidor Amplo) foi projetado pelo mercado para 5,12% em 2026, com redução das expectativas de inflação. Além disso, o minidólar pode ser influenciado pela tensão global nesta segunda-feira (27), enquanto a Megalink recebeu um financiamento do BNDES para implementar um projeto de inclusão digital em escolas públicas nos estados do Piauí e Maranhão.", "tecnologia": "As autoridades de Taiwan alertaram sobre o uso de inteligência artificial (IA) no cometimento de crimes cibernéticos, enfatizando a necessidade de vigilância e combate. Um desenvolvimento importante para o setor de tecnologia é que a Nvidia está em negociações com a OpenAI para fornecer um aluguel de data center avaliado em 250 bilhões de dólares, visando fortalecer as ambições da OpenAI na infraestrutura de IA. O aplicativo X, desenvolvido pelo empresário Elon Musk, está sendo lançado nos Estados Unidos e oferece serviços bancários como parte de sua missão para transformar o aplicativo em uma plataforma 'de tudo'. No entanto, crescem preocupações políticas nos EUA sobre a construção de novos centros de dados, com investimentos massivos em IA levando a temores crescentes sobre segurança cibernética e riscos potencialmente catastróficos.", "ciencia": "O Brasil vai assinar um acordo para produzir profilaxia oral contra HIV e também avaliar a incorporação de duas profilaxias injetáveis de longo prazo, conforme informou [jota]. Em outro avanço científico, fósseis com 2 bilhões de anos foram identificados em amostras de mármore pela UFMG pelo pesquisador Kennedy Martinez, ressaltando a importância desses microrganismos na oxigenação da atmosfera terrestre. A NASA planeja realizar três caminhadas espaciais na Estação Espacial Internacional em agosto para atualizar placas solares e conectar cabos de energia e dados. Além disso, o astronauta Chris Williams retornou à Terra após uma missão de 8 meses no espaço, contribuindo com pesquisas científicas durante sua estadia.", "cultura": "A Unesco declarou o Theatro da Paz, em Belém (PA), e o Teatro Amazonas, em Manaus (AM), Patrimônio Mundial Cultural na madrugada de segunda-feira (27). Este reconhecimento celebra a cultura amazônica e reforça a importância desses espaços artísticos para a preservação cultural. Em outro destaque, a 24ª Festa Literária Internacional de Paraty (Flip) recebeu 40 mil pessoas em 2026, um aumento de 14% em relação ao ano anterior, com sucesso no Centro Histórico e nas ruas de Paraty, apesar do investimento privado ter diminuído. A Flip continua sendo um importante evento cultural que promove a literatura e o pensamento crítico.", "sociedade": "Um pesquisador da USP foi condenado por estupro que resultou na morte de uma aluna, revertendo a decisão original que o absolveu. O ministro das Relações Institucionais, Padilha, anunciou a inclusão do cabotegravir injetável no SUS para prevenção do HIV. Em Brasília, um curso gratuito ensina idosos a usar celulares e evitar golpes, já emitindo mais de 740 certificados.", "meio_ambiente": "Os incêndios florestais na França e Espanha estão causando grandes preocupações. Mais de 300 mil pessoas foram evacuadas nos dois países. Segundo relatos, as condições ventosas e a combinação de um inverno úmido seguido de baixa precipitação desde o início do verão, juntamente com ondas recorde de calor, estão alimentando a temporada explosiva de incêndios na região. Em particular, a cidade de Bordeaux, na França, está em alerta, com um grande incêndio se aproximando dos subúrbios ocidentais da cidade. O presidente francês, Emmanuel Macron, advertiu que as próximas semanas serão difíceis devido aos incêndios e que o país e Espanha estão se preparando para enfrentar temperaturas extremamente altas, enquanto os incêndios continuam a se espalhar.", "direitos_humanos": "O coronel aposentado Nelson Haase Mazzei foi condenado após 53 anos por assassinar o cantor folk chileno Víctor Jara, um caso emblemático de violações dos direitos humanos durante o regime ditatorial de Pinochet. Em outro desenvolvimento importante, uma medida cautelar suspendeu um decreto do governo que proibia menores de 18 anos de acessarem tratamentos de mudança de gênero, garantindo a continuidade desses cuidados por parte das obras sociais e hospitais públicos. No Brasil, foi criado um cadastro distrital no Distrito Federal para condenados por violência contra a mulher, contendo informações como nome, foto, CPF, RG, endereço e detalhes da condenação, com acesso restrito às autoridades. Estes eventos refletem os desafios enfrentados em diferentes partes do mundo na garantia dos direitos humanos."}, "resumo_do_dia": {"politica_nacional": [{"id": 75463, "titulo": "Quaest: Benedita e Crivella lideram disputa pelo Senado no Rio", "url": "https://veja.abril.com.br/brasil/quaest-benedita-e-crivella-lideram-disputa-pelo-senado-no-rio/", "fonte_id": "veja", "data_pub": "2026-07-27T22:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Oito candidatos estão tecnicamente empatados na terceira posição da disputa pelo Senado no Rio de Janeiro. Benedita da Silva e Marcelo Crivella lideram a corrida eleitoral para o Senado no estado.", "titulo_pt": "Benedita e Crivella lideram disputa pelo Senado no Rio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 75650, "titulo": "Ministro da Previdência se diz disposto a procurar ministros do STF para apontar impactos da pejotização", "url": "https://www.jota.info/executivo/ministro-da-previdencia-se-diz-disposto-a-procurar-ministros-do-stf-para-apontar-impactos-da-pejotizacao", "fonte_id": "jota", "data_pub": "2026-07-27T22:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Previdência, Wolney Queiroz, afirmou estar disposto a procurar ministros do STF para discutir os impactos da pejotização na Previdência e nos trabalhadores. Queiroz considera que o modelo penaliza esses setores e descreveu como uma 'epidemia no país'.", "titulo_pt": "Ministro da Previdência disposto a procurar ministros do STF sobre pejotização", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 75414, "titulo": "Nunes Marques será relator de ação do PT contra Flávio e PL por vídeo de Bolsonaro feito com IA exibido na convenção", "url": "https://g1.globo.com/politica/noticia/2026/07/27/nunes-marques-sera-relator-de-acao-do-pt-contra-contra-flavio-e-pl-por-video-de-bolsonaro-feito-com-ia-exibido-na-convencao.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-27T22:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Kássio Nunes Marques, presidente do Tribunal Superior Eleitoral, será o relator de uma ação movida pelo PT, PCdoB e PV contra o PL e Flávio Bolsonaro por supostas irregularidades na exibição de um vídeo com inteligência artificial durante a convenção do PL.", "titulo_pt": "Nunes Marques será relator da ação do PT contra PL e Flávio Bolsonaro por uso de vídeo com IA", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 75555, "titulo": "Trump leva à Suprema Corte batalha para endurecer regras do voto pelo correio", "url": "https://www.infomoney.com.br/mundo/trump-leva-a-suprema-corte-batalha-para-endurecer-regras-do-voto-pelo-correio/", "fonte_id": "infomoney", "data_pub": "2026-07-27T22:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo republicano dos Estados Unidos apresentou uma petição à Suprema Corte para suspender uma decisão que proibiu um decreto presidencial relacionado ao voto postal em 23 estados. A juíza que tomou a decisão entendeu que o presidente não tem autoridade para alterar as regras eleitorais estaduais.", "titulo_pt": "Trump leva à Suprema Corte batalha para endurecer regras do voto pelo correio", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 75632, "titulo": "Análise: Crise entre Milei e Lula ultrapassa diferenças ideológicas", "url": "https://www.cnnbrasil.com.br/internacional/analise-crise-entre-milei-e-lula-ultrapassa-diferencas-ideologicas/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-27T22:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A tensão diplomática entre os países de Miguel Ángel Milei e Jair Bolsonaro, e Luiz Inácio Lula da Silva, ultrapassa as diferenças ideológicas. A analista Fernanda Magnotta comentou sobre a crise na CNN 360º.", "titulo_pt": "Análise: crise entre Milei e Lula vai além das divergências ideológicas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 75364, "titulo": "Augusto Cury tenta dobradinha com Aldo, que também considera concorrer a deputado ou apoiar Caiado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/augusto-cury-tenta-dobradinha-com-aldo-que-tambem-considera-concorrer-a-deputado-ou-apoiar-caiado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-27T22:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury, pré-candidato pelo Avante, tenta formar uma aliança com o DC, onde ele seria candidato a presidente e Aldo Rebelo vice. Este último também considera concorrer como deputado ou apoiar Geraldo Caiado.", "titulo_pt": "Augusto Cury busca dobradinha com Aldo para presidência; político também pensa em deputado ou apoio a Caiado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 75576, "titulo": "STF suspende decisão que obrigava SP a nomear 22 policiais em delegacia", "url": "https://www.metropoles.com/sao-paulo/stf-suspende-decisao-que-obrigava-sp Milei", "url": "https://g1.globo.com/politica/noticia/2026/07/27/quem-e-esse-cara-diz-lula-ao-ser-questionado-sobre-milei.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-27T20:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) ironizou a crise com o presidente da Argentina, Javier Milei, ao ser questionado por jornalistas. Lula respondeu 'Quem é esse cara?' em referência às declarações de Milei.", "titulo_pt": "Lula ironiza crise com Milei", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 75366, "titulo": "MDB libera diretórios estaduais e não apoiará nenhum presidenciável", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/mdb-libera-diretorios-estaduais-e-nao-apoiara-nenhum-presidenciavel.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-27T20:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O MDB anunciou que ficará neutro nas eleições presidenciais de 2026 e não apoiará nenhum candidato. Os diretórios estaduais do partido terão liberdade para decidir com quem se aliar localmente.", "titulo_pt": "MDB anuncia neutralidade e não apoiará candidatos à presidência em 2026", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 75349, "titulo": "Novo oficializa a candidatura de Romeu Zema à presidência da República", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-07/novo-oficializa-candidatura-de-romeu-zema-presidencia-da-republica", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-07-27T20:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido Novo oficializou a candidatura de Romeu Zema, ex-governador de Minas Gerais, à presidência da República. A convenção do partido ocorreu em Brasília e contou com a presença do presidente nacional Eduardo Ribeiro e do senador Eduardo Girão.", "titulo_pt": "Novo oficializa candidatura de Romeu Zema à presidência", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 75416, "titulo": "Moraes cobra explicações de secretaria de presídios de SP sobre supostas falhas em tornozeleira de 'Débora do Batom'", "url": "https://g1.globo.com/sp/sao-paulo/noticia/2026/07/27/moraes-cobra-explicacoes-de-secretaria-de-presidios-de-sp-sobre-supostas-falhas-em-tornozeleira-de-debora-do-batom.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-27T20:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do Supremo Tribunal Federal (STF), solicitou esclarecimentos à Secretaria de Administração Penitenciária de São Paulo sobre supostas falhas no monitoramento eletrônico da ré Débora Rodrigues dos Santos. O prazo dado para a secretaria responder é de cinco dias.", "titulo_pt": "Moraes pede esclarecimentos sobre supostas falhas na tornozeleira eletrônica de 'Débora do Batom'", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 75654, "titulo": "PT aciona STF e TSE contra vídeo de IA de Bolsonaro", "url": "https://www.jota.info/eleicoes/eleicoes-2026/pt-aciona-stf-e-tse-contra-video-de-ia-de-bolsonaro", "fonte_id": "jota", "data_pub": "2026-07-27T20:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PT acionou o STF e o TSE contra um vídeo de inteligência artificial do ex-presidente Bolsonaro, alegando descumprimento de regras na prisão, propaganda antecipada e uso de deep fake.", "titulo_pt": "PT denuncia vídeo de IA de Bolsonaro ao STF e TSE", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 75367, "titulo": "PSDB de MG fará convenção sem definição sobre candidatura de Aécio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/psdb-de-mg-fara-convencao-sem-definicao-sobre-candidatura-de-aecio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-27T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PSDB de Minas Gerais realizará sua convenção eleitoral nesta terça-feira, mas ainda não definiu uma candidatura ao Senado do deputado federal Aécio Neves.", "titulo_pt": "PSDB de MG fará convenção sem definição sobre candidatura de Aécio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 75369, "titulo": "Zema critica fala de Milei em evento de Flávio e diz que argentino foi deselegante", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/zema-critica-fala-de-milei-em-evento-de-flavio-e-diz-que-e-tentativa-de-interferir-no-brasil.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-27T19:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato à Presidência Romeu Zema (Novo) criticou o discurso do presidente da Argentina, Javier Milei, na convenção do PL, considerando-o 'deselegante' por ter criticado o presidente Lula e o ministro Alexandre de Moraes.", "titulo_pt": "Zema critica fala de Milei em evento de Flávio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 75849, "titulo": "Australia news live: Labor MPs gather before Victorian leadership challenge; PM praises outgoing ACTU ‘giants’", "url": "https://www.theguardian.com/australia-news/live/2026/jul/28/jacinta-allan-victoria-labor-leadership-spill-ben-carroll-challenge-antisemitism-royal-commission-nsw-icac-inquiry-queensland-estimates-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-07-27T22:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vice-presidente do Victoria, Ben Carroll, desafiou a primeira-ministra Jacinta Allan. Michele O’Neil, presidente da Australian Council of Trade Unions (ACTU), anunciou sua saída juntamente com Sally McManus e afirmou que é o momento de renovação para o movimento sindical, citando mudanças significativas nas direitos trabalhistas.", "titulo_pt": "Notícias da austrália em tempo real: desafio à liderança no victoria; presidente do ACTU anuncia saída", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 75750, "titulo": "India’s ‘Cockroach’ Protesters Disperse, But Questions Remain on Education and Dissent", "url": "https://www.nytimes.com/2026/07/27/world/asia/india-protests-cjp-education-modi.html", "fonte_id": "nyt_world", "data_pub": "2026-07-27T22:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O movimento 'Caramelo' dispersou, afirmando que suas demandas foram atendidas, mas questões sobre o sistema educacional indiano e o futuro da dissidência permanecem.", "titulo_pt": "Movimento ‘caramelo’ se dispersiona, mas questões sobre educação e dissidência permanecem", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 75627, "titulo": "Governo Trump pede que Suprema Corte autorize restrições a voto por correio", "url": "https://www.cnnbrasil.com.br/internacional/governo-trump-pede-que-suprema-corte-autorize-restricoes-a-voto-por-correio/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-27T22:38:00Z", "idioma": "pt", "provavel_duplicata_de": 75581, "texto_pt": "O governo Trump solicitou à Suprema Corte que autorize restrições ao voto por correspondência. A medida, que pode endurecer as regras para essa modalidade de votação, foi proposta a poucos meses das eleições de meio de mandato.", "titulo_pt": "Governo Trump pede à Suprema Corte autorização para restrições ao voto por correio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 75962, "titulo": "Yemen says ready for Houthi escalation after rebels target Saudi Arabia", "url": "https://www.france24.com/en/middle-east/20260727-yemen-says-ready-for-houthi-escalation-after-rebels-target-saudi-arabia", "fonte_id": "france24", "data_pub": "2026-07-27T22:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Iêmen advertiu que está preparado para uma escalada dos rebeldes hutíes, que intensificaram ataques contra infraestrutura petroquímica saudita e impuseram um bloqueio marítimo. Essas ações do grupo apoiado pelo Irã podem abrir um novo fronte na conflito regional mais amplo e ameaçar o tráfego marítimo no Mar Vermelho.", "titulo_pt": "Iêmen alerta para escalada dos hutíes após ataques a arábia saudita", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 75749, "titulo": "Wildfires Live Updates: New Heat Wave Could Worsen France and Spain’s ‘Unprecedented’ Fire Season", "url": "https://www.nytimes.com/live/2026/07/27/world/france-spain-wildfires-evacutions", "fonte_id": "nyt_world", "data_pub": "2026-07-27T22:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais continuam sendo controlados por bombeiros e voluntários. A crise já obrigou centenas de milhares a evacuarem nas regiões centrais da Espanha e no sul-oeste da França.", "titulo_pt": "Atualizações sobre incêndios: nova onda quente poderia agravar a 'incrível' temporada de fogos na França e Espanha", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 75916, "titulo": "A Japanese town wrestles with identity after protests over its first mosque", "url": "https://www.bbc.co.uk/news/articles/c36d79nd5w8o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-27T22:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pequena cidade japonesa está enfrentando questões de identidade após protestos contra o primeiro mosque na área. Com a crescente dependência do Japão de trabalhadores estrangeiros, o país também está lidando com como integrar novas culturas e religiões.", "titulo_pt": "Uma cidade japonesa se debate com sua identidade após protestos por um primeiro mosque", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 75532, "titulo": "Governo Lula colocou limite na tentativa de os EUA interferirem nas eleições brasileiras, avalia especialista", "url": "https://www.brasildefato.com.br/2026/07/27/governo-lula-colocou-limite-na-tentativa-de-os-eua-interferirem-nas-eleicoes-brasileiras-avalia-especialista/", "fonte_id": "brasil_de_fato", "data_pub": "2026-07-27T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Itamaraty negou o visto a dois diplomatas dos Estados Unidos que seriam enviados para questionar o sistema eleitoral brasileiro durante as eleições de outubro. O governo federal considerou essa medida como uma tentativa de interferência nas eleições.", "titulo_pt": "Governo Lula rejeitou entrada de diplomatas americanos com intuito de interferir nas eleições brasileiras, diz especialista", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 75840, "titulo": "Los incendios de Madrid, Ávila y Toledo obligan a evacuar o confinar a más de 90.000 personas: “Es una situación endemoniada”", "url": "https://elpais.com/espana/2026-07-27/los-incendios-de-madrid-avila-y-toledo-afectan-ya-a-77000-hectareas-y-obligan-a-evacuar-o-confinar-a-90000-personas.html", "fonte_id": "elpais_america", "data_pub": "2026-07-27T21:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Incêndios em Madrid, Ávila e Toledo obrigaram a evacuar ou confinar mais de 90.000 pessoas. O fogo em Ávila é o maior e 'mais agressivo' da história do país, segundo relatos.", "titulo_pt": "Incêndios em madri, Ávila e Toledo obrigam a evacuar ou confinar mais de 90.000 pessoas: 'é uma situação demoníaca'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 76096, "titulo": "Jindal conferma impegno per l'acquisizione dell'ex Ilva di Taranto", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/27/jindal-conferma-impegno-per-lacquisizione-dellex-ilva-di-taranto_79f5d7b5-eadf-42b5-b6fe-24b2fbeb5722.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-27T21:46:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O empresário Mukesh Jindal confirmou seu compromisso com a aquisição da antiga empresa Ilva de Taranto. O projeto inclui a construção de um forno livre de carvão para ambas as áreas, quente e fria.", "titulo_pt": "Jindal confirma intenção de compra do ex-ilva de Taranto", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 75640, "titulo": "Tarcísio atua por aliança entre Republicanos e Flávio Bolsonaro", "url": "https://www.cnnbrasil.com.br/eleicoes/tarcisio-atua-por-alianca-entre-republicanos-e-flavio-bolsonaro/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-27T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entraves estaduais, principalmente no Mato Grosso, estão dificultando a formação de aliança entre o Republicanos e o candidato do PL à Presidência, Flávio Bolsonaro. A informação é do analista político da CNN Pedro Venceslau.", "titulo_pt": "Tarcísio atua em aliança entre Republicanos e Flávio Bolsonaro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 75753, "titulo": "15 Sailors Still Missing After Vietnamese Cargo Ship Sank in South China Sea", "url": "https://www.nytimes.com/2026/07/27/world/asia/vietnam-south-china-sea-ship-sink.html", "fonte_id": "nyt_world", "data_pub": "2026-07-27T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um navio-cargas afundou em águas altamente disputadas do Mar da China Meridional, deixando 15 pessoas desaparecidas. A China informou que resgatou 47 pessoas a bordo.", "titulo_pt": "15 Marinheiros continuam desaparecidos após navio-cargas afundar nas águas do mar da China meridional", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 75918, "titulo": "US singer D4vd to go on trial for murder in death of teen", "url": "https://www.bbc.co.uk/news/articles/c70gkg62w0ro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-27T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O cantor americano D4vd será julgado por assassinato no caso da morte de Celeste Rivas Hernandez, cujo corpo foi encontrado em um Tesla que estava registrado sob seu endereço.", "titulo_pt": "Artista norte-americano D4vd enfrentará julgamento por assassinato no caso de jovem", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 75813, "titulo": "Petróleo se derrumba luego que Irán y Estados Unidos suspendieran ataques en Medio Oriente", "url": "https://www.latercera.com/pulso/noticia/el-petroleo-se-derrumba-tras-anuncio-de-iran-de-suspender-ataques-mientras-eeuu-mantenga-pausa-en-hostilidades/", "fonte_id": "la_tercera", "data_pub": "2026-07-27T21:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O preço do barril de petróleo Brent, referência para o Chile, caiu mais de 13%, atingindo US$ 85. Este movimento ocorreu após Irã e Estados Unidos suspenderem ataques no Médio Oriente.", "titulo_pt": "Petroleo cai após Irã e EUA suspendirem ataques no médio Oriente", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 75351, "titulo": "Trump pede à Suprema Corte para aplicar restrições ao voto antes das midterms", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/07/trump-pede-a-suprema-corte-para-aplicar-restricoes-ao-voto-antes-das-midterms.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-07-27T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Donald Trump solicitou à Suprema Corte dos Estados Unidos que permita a implementação do decreto presidencial sobre regras para votação por correio antes das eleições de meio de mandato em novembro.", "titulo_pt": "Trump pede à Suprema Corte aprovação para restrições ao voto por correspondência antes das midterms", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 76042, "titulo": "UN slams Israel’s expansion of illegal settlements in occupied West Bank", "url": "https://www.aljazeera.com/news/2026/7/27/un-slams-israels-expansion-of-illegal-settlements-in-occupied-west-bank?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-27T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe da ONU, Guterres, declarou que as expansões das colônias israelenses são uma 'violação clara' do direito internacional, em meio a um aumento na violência.", "titulo_pt": "ONU condena expansão de colônias ilegais israelenses no ocupado território ocidental", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 75645, "titulo": "Brasil e Coreia do Sul concordam em avançar acordo com Mercosul", "url": "https://www.cnnbrasil.com.br/economia/macroeconomia/brasil-e-coreia-do-sul-concordam-em-avancar-acordo-com-mercosul/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-27T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil e a Coreia do Sul concordaram em avançar com um acordo comercial que visa incluir o Mercosul. O Brasil busca expandir seus negócios como forma de diversificar o comércio afetado pelas tarifas impostas pelos Estados Unidos.", "titulo_pt": "Brasil e Coreia do Sul acordam em avançar acordo com Mercosul", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 75625, "titulo": "Brasil e Coreia do Sul assinam acordo para ampliar cooperação energética", "url": "https://www.cnnbrasil.com.br/infra/brasil-e-coreia-do-sul-assinam-acordo-para-ampliar-cooperacao-energetica/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-27T22:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil e a Coreia do Sul assinaram um acordo para ampliar a cooperação na área energética, focando principalmente na transição energética e no uso de energias renováveis.", "titulo_pt": "Brasil e Coreia do Sul assinam acordo para ampliar cooperação em energia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 75438, "titulo": "Empreender na terceira idade triplica renda, mostra estudo do Sebrae", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/empreender-na-terceira-idade-triplica-renda-mostra-estudo-do-sebrae", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-27T22:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo do Sebrae, baseado nos dados da PNAD Contínua do IBGE, indica que os empreendedores na terceira idade podem triplicar a renda ao formalizar seus negócios. No quarto trimestre de 2025, esses empreendedores 60+ atingiram o maior rendimento médio da série histórica iniciada em 2012.", "titulo_pt": "Empreender na terceira idade pode triplicar a renda", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 75651, "titulo": "iFood, MetLife e INSS devem garantir atendimento previdenciário a entregadores, decide juíza", "url": "https://www.jota.info/trabalho/ifood-metlife-e-inss-devem-garantir-atendimento-previdenciario-a-entregadores-decide-juiza", "fonte_id": "jota", "data_pub": "2026-07-27T22:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma juíza determinou que o iFood, MetLife e INSS devem garantir atendimento previdenciário a entregadores. Essa decisão veio de uma ação civil pública proposta pelo Ministério Público do Trabalho.", "titulo_pt": "Ifood, MetLife e INSS devem garantir atendimento previdenciário a entregadores, decide juíza", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 75389, "titulo": "Keeta pede dados do iFood em contratos para pagar multas de restaurantes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/07/keeta-pede-dados-do-ifood-em-contratos-para-pagar-multas-de-restaurantes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-27T22:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A plataforma Keeta está incluindo na contratação de restaurantes a exigência de informações internas do iFood, em troca de pagar multas aos estabelecimentos que romperem a exclusividade com o principal concorrente no Brasil. Essa prática busca obter vantagens competitivas sobre o iFood.", "titulo_pt": "Keeta exige dados do ifood para pagar multas de restaurantes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 75631, "titulo": "Wall Street fecha sem direção única com investidores focados no setor tech", "url": "https://www.cnnbrasil.com.br/economia/mercado/wall-street-fecha-sem-direcao-unica-com-investidores-focados-no-setor-tech/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-27T22:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O S&P 500 teve uma variação positiva de 0,02%, enquanto o Nasdaq Composite registrou uma queda de 0,16%. Os investidores se concentraram no setor tecnológico durante as negociações na Wall Street.", "titulo_pt": "Wall Street fecha com variações mistas, com destaque para o setor tech", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 76114, "titulo": "A tale of two markets: Wall Street cheers record highs while Beijing deflates bubbles", "url": "https://www.scmp.com/business/banking-finance/article/3362000/tale-two-markets-wall-street-cheers-record-highs-while-beijing-deflates-bubbles?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-27T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No início de julho, os índices S&P 500, Nasdaq e Dow Jones atingiram novos recordes. Enquanto isso, o presidente dos Estados Unidos, Donald Trump, comemorou essas altas como prova da recuperação econômica americana.", "titulo_pt": "Uma história de dois mercados: wall Street celebra máximos históricos enquanto Beijing desinfla bolhas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 75390, "titulo": "Estudos mostram como liderança feminina transforma política e empresas; veja vídeo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/econometria-facil/2026/07/estudos-mostram-como-lideranca-feminina-transforma-politica-e-empresas-veja-video.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-27T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudos demonstram como a liderança feminina transforma tanto a política quanto as empresas. O voto feminino e sua influência na sociedade também são abordados.", "titulo_pt": "Como a liderança feminina e o voto feminino afetam a sociedade?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 75439, "titulo": "Dólar fecha no maior valor em duas semanas com queda no petróleo", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/dolar-fecha-no-maior-valor-em-duas-semanas-com-queda-no-petroleo", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-27T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar fechou a segunda-feira (27) no maior valor em duas semanas, impulsionado pela queda do petróleo. A bolsa também avançou, com destaque para as ações de bancos e mineradoras.", "titulo_pt": "Dólar fecha na maior cotação em duas semanas com queda no petróleo", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 75653, "titulo": "É justo um delay para os bancos, diz ministro sobre corte nos juros do INSS", "url": "https://www.jota.info/executivo/e-justo-um-delay-para-os-bancos-diz-ministro-sobre-corte-nos-juros-do-inss", "fonte_id": "jota", "data_pub": "2026-07-27T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro afirmou que um delay para os bancos sobre o corte nos juros do INSS é justo. A indicação é de que o teto do consignado não seja reduzido na próxima reunião.", "titulo_pt": "Justo delay para os bancos, diz ministro sobre corte nos juros do INSS", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 76001, "titulo": "Apple ends day as world's most valuable company, passing Nvidia", "url": "https://www.cnbc.com/2026/07/27/apple-most-valuable-company-nvidia.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-27T21:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple ultrapassou a Nvidia como a empresa mais valiosa do mundo no fechamento do dia. A Nvidia havia ocupado esse posto desde junho de 2025, quando superou a Microsoft.", "titulo_pt": "Apple supera Nvidia e se torna a empresa mais valiosa do mundo", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 75392, "titulo": "Ações da Embraer sobem mais de 5% após aumento de pedidos no 2º trimestre", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/07/01/6533-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466659", "fonte_id": "folha_mercado", "data_pub": "2026-07-27T20:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações da Embraer subiram mais de 5% após o anúncio de um aumento de 16% na carteira de pedidos no segundo trimestre em comparação com o mesmo período do ano anterior.", "titulo_pt": "Ações da Embraer ganham mais de 5% com aumento de pedidos no 2º trimestre", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 75396, "titulo": "Hapvida lançará NotreDame como plano de saúde premium", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/monicabergamo/2026/07/hapvida-lancara-notredame-como-plano-de-saude-premium.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-27T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Grupo Hapvida lançará a marca NotreDame Saúde como sua linha premium de planos de saúde. Este é um dos primeiros movimentos estratégicos do novo CEO da companhia, Luccas Adib.", "titulo_pt": "Hapvida lançará
