.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/preco-do-diesel-no-brasil-dispara-com-retomada-da-guerra-no-ira-e-ameaca-as-exportacoes-dos-eua.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T18:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O preço do diesel S-10 aumentou nas estações de serviço brasileiras nas últimas semanas, com uma elevação de 7% em um mês, ou R$ 0,47 por litro, refletindo aumentos de custos repassados por importadores privados.", "titulo_pt": "Preço do diesel no Brasil sobe com aumento de custos por importadores", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 196803, "titulo": "Setor de serviços no Brasil volta a registrar contração em setembro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/servicos-do-brasil-voltam-a-contrair-em-setembro-aponta-pmi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T18:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O setor de serviços no Brasil registrou contração em setembro, com a retração da demanda levando a novas quedas na atividade e no emprego. O PMI divulgado indicou a contração mais forte em quase um ano.", "titulo_pt": "Setor de serviços no Brasil registra contração em setembro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 197121, "titulo": "O que o gás de cozinha não conta sobre o GLP", "url": "https://www.jota.info/coberturas-especiais/energia-e-inclusao/o-que-o-gas-de-cozinha-nao-conta-sobre-o-glp", "fonte_id": "jota", "data_pub": "2026-10-05T18:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que os brasileiros estão cientes das diversas aplicações do gás de cozinha, incluindo a produção de alimentos, indústria, agronegócio e setor de saúde.", "titulo_pt": "O que o gás de cozinha não conta sobre o GLP", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 195537, "titulo": "Rolls-Royce aposta em exclusividade em carro que pode chegar a US$ 5 milhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/rolls-royce-aposta-em-exclusividade-em-carro-que-pode-chegar-a-us-5-milhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Rolls-Royce apresentou em abril um novo modelo concebido para competir com os carros mais luxuosos do mercado. O carro, conhecido como Project Nightingale, é um veículo de motor elétrico com dois assentos, muito longo e projetado para oferecer uma experiência de exclusividade extremada, sem preocupações com praticidade.", "titulo_pt": "Rolls-royce investe em exclusividade com carro que pode custar até 5 milhões de dólares", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 195538, "titulo": "BNDES pede liberação de R$ 6,5 bilhões para créditos do programa Brasil Soberano", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/bndes-pede-liberacao-de-r-65-bilhoes-para-creditos-do-programa-brasil-soberano.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O BNDES solicitou ao governo federal a liberação de R$ 6,5 bilhões para o programa Brasil Soberano, que oferece empréstimos a empresas afetadas pelas tarifas dos Estados Unidos e pela instabilidade internacional.", "titulo_pt": "BNDES pede liberação de R$ 6,5 bilhões para créditos do programa Brasil Soberano", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 195539, "titulo": "Para entender a euforia do mercado com Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/viniciustorres/2026/10/para-entender-a-euforia-do-mercado-com-flavio-bolsonaro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado financeiro demonstra entusiasmo com a possibilidade de Flávio Bolsonaro vencer as eleições, refletido no comportamento do dólar e da Bolsa, enquanto as taxas de juros estão em queda. Este movimento indica uma expectativa positiva para a economia sob a eventual administração de Flávio Bolsonaro.", "titulo_pt": "Para entender a euforia do mercado com Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 196337, "titulo": "TotalEnergies boss hails ‘opportunities’ created by global market turmoil", "url": "https://www.ft.com/content/ae67bb6f-f227-4679-949f-2e79e2dc33e2?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-05T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Patrick Pouyanné, o CEO da TotalEnergies, celebra as oportunidades criadas pela turbulência do mercado global, mesmo a empresa francesa sendo uma das mais afetadas pelo conflito no Oriente Médio.", "titulo_pt": "Ceo da totalenergies celebra oportunidades criadas pela turbulência do mercado", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 196464, "titulo": "Cyber official plans AI testing", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/06/2003865480", "fonte_id": "taipei_times", "data_pub": "2026-10-06T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um oficial de cybersegurança está planejando testes de inteligência artificial. Os detalhes específicos do plano não foram fornecidos.", "titulo_pt": "Oficial de cybersegurança planeja testes de IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 197334, "titulo": "Lucid Motors’ EV output falls to lowest level in almost two years", "url": "https://techcrunch.com/2026/10/05/lucid-motors-ev-output-falls-to-lowest-level-in-almost-two-years/", "fonte_id": "techcrunch", "data_pub": "2026-10-05T21:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lucid Motors está limitando intencionalmente a produção de seus veículos elétricos após anos de dificuldades para encontrar uma demanda de massa para seus modelos.", "titulo_pt": "Produção de veículos elétricos da lucid Motors atinge nível mais baixo em quase dois anos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 197322, "titulo": "Reverse-engineered games: All the news on video game decomps, recomps, VR and web and 3D ports", "url": "https://www.theverge.com/games/1004869/reverse-engineered-games-all-the-news-on-video-game-decomps-recomps-vr-and-web-and-3d-ports", "fonte_id": "the_verge", "data_pub": "2026-10-05T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "É um tempo incerto para jogos retro. Graças a decompilações e recompilações de títulos clássicos, esses jogos estão sendo liberados de seu código proprietário e hardware original para serem portados para novos dispositivos ou atualizados de maneira a completamente transformar o jogo original. Exemplos incluem skateboarding em Call of Duty ou jogar o original Halo.", "titulo_pt": "Jogos retro: tudo sobre decompilações, recompilações, VR e portas para web e 3D", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 197323, "titulo": "The Matic is the first robovac to get an FCC ban waiver, not that it needs it", "url": "https://www.theverge.com/policy/1004926/matic-fcc-ban-waiver-conditional-approval", "fonte_id": "the_verge", "data_pub": "2026-10-05T21:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Matic é o robô aspirador e escovador de chão favorito dos editores, e agora é o primeiro a receber uma exceção da proibição da FCC, embora não tenha sido banido no início. A FCC adicionou o modelo original do Matic e seu dock de carregamento aos produtos proibidos em 2 de outubro.", "titulo_pt": "O Matic é o primeiro robô aspirador a obter uma exceção da proibição da FCC, embora não tenha sido banido inicialmente", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 197335, "titulo": "OpenAI will start watermarking ChatGPT’s text in the EU", "url": "https://techcrunch.com/2026/10/05/openai-will-start-watermarking-chatgpts-text-in-the-eu/", "fonte_id": "techcrunch", "data_pub": "2026-10-05T20:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI vai adicionar marcas d'água ao texto gerado pelo ChatGPT e Codex na União Europeia para se conformar com a AI Act. A empresa afirma que a edição pode dificultar a detecção dessas marcas invisíveis.", "titulo_pt": "Openai vai marcar texto do ChatGPT e codex na ue", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 197330, "titulo": "Texas city demands $2M for public records on Flock usage", "url": "https://arstechnica.com/tech-policy/2026/10/texas-city-demands-2m-for-public-records-on-flock-usage/", "fonte_id": "ars_technica", "data_pub": "2026-10-05T20:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cidade de Texas exige o pagamento de $2 milhões por registros públicos que rastreiam o uso de Flock por policiais. Os preços dos registros aumentaram à medida que a reação negativa cresceu.", "titulo_pt": "Cidade de texas solicita $2 milhões em registros públicos sobre uso de Flock por policiais", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 197353, "titulo": "[Miao Yanliang] Will AI reverse renminbi’s rise?", "url": "https://www.koreaherald.com/article/10893380", "fonte_id": "korea_herald", "data_pub": "2026-10-05T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O renminbi tem experimentado uma recuperação notável em relação ao dólar desde a segunda metade de 2025, levantando novas discussões sobre o potencial de sua valorização futura. Alguns associam essa apreciação à melhoria da produtividade nos setores exportáveis da China, como veículos elétricos, equipamentos renováveis e construção naval.", "titulo_pt": "AI vai reverter a ascensão do renminbi?", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 197336, "titulo": "Etched fields funding offers at $40B+ valuation, sources say", "url": "https://techcrunch.com/2026/10/05/etched-fields-funding-offers-at-40b-valuation-sources-say/", "fonte_id": "techcrunch", "data_pub": "2026-10-05T20:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup de chip de inteligência artificial recebeu propostas de investimento avaliadas em mais de 40 bilhões de dólares, segundo fontes relatadas ao TechCrunch. A empresa, que recentemente realizou uma rodada de financiamento, já está sendo oferecida a um valor dobrado ou maior do que seu valor atual.", "titulo_pt": "Campos etchados oferece financiamento a valuation superior a 40 bilhões de dólares, dizem fontes", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 197324, "titulo": "This startup is issuing AI-generated acne prescriptions", "url": "https://www.theverge.com/ai-artificial-intelligence/1005075/nolla-health-acne-ai-prescriptions", "fonte_id": "the_verge", "data_pub": "2026-10-05T20:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pacientes em Utah podem agora usar inteligência artificial para obter uma prescrição para tratamento de acne. A startup de saúde Nolla Health lançou um aplicativo que permite que os usuários escaneiem suas faces, e o sistema AI analise a severidade da acne e gere a prescrição sozinho.", "titulo_pt": "Esta startup está emitindo prescrições de acne geradas por IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 197341, "titulo": "Elon Musk’s Exes Are the Most Damning Part of a Massive New Documentary", "url": "https://www.wired.com/story/elon-musks-exes-are-the-most-damning-part-of-a-massive-new-documentary/", "fonte_id": "wired", "data_pub": "2026-10-05T19:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A documentário de quase quatro horas apresenta entrevistas com ex-esposas de Elon Musk, retratando o bilionário como caprichoso e cruel, mesmo com as pessoas mais próximas dele.", "titulo_pt": "Ex-esposas de Musk são os elementos mais críticos de novo documentário extenso", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 197337, "titulo": "After Factory’s public spat with Khosla, Menlo proudly invests", "url": "https://techcrunch.com/2026/10/05/after-factorys-public-spat-with-khosla-menlo-proudly-invests/", "fonte_id": "techcrunch", "data_pub": "2026-10-05T19:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Menlo Ventures investiu na empresa Factory Days após Vinod Khosla ter criticado a empresa, chamando-a de um concorrente fracassado. A Menlo publicou um post positivo sobre a investida.", "titulo_pt": "Depois da discussão pública com Khosla, Menlo investe na Factory", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 197338, "titulo": "Reflection debuts Beam, an open-weight AI model to rival Chinese models at lower compute cost", "url": "https://techcrunch.com/2026/10/05/reflection-debuts-beam-a-open-weight-ai-model-to-rival-chinese-models-at-lower-compute-cost/", "fonte_id": "techcrunch", "data_pub": "2026-10-05T19:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Reflection lançou o modelo de IA Beam, projetado para competir com modelos chineses de IA, oferecendo um custo computacional mais baixo. O objetivo é direcionar Beam e futuros modelos para empresas e nações soberanas, permitindo que as instituições criem seus próprios sistemas de IA personalizados e locais através do treinamento dos modelos de IA da Reflection com seus próprios dados proprietários.", "titulo_pt": "Reflection lança Beam, modelo de IA aberto para competir com chineses a baixo custo computacional", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 197325, "titulo": "All the drama around AI’s takeover of mathematics", "url": "https://www.theverge.com/ai-artificial-intelligence/1004933/ai-math-openai-breakthrough-solution", "fonte_id": "the_verge", "data_pub": "2026-10-05T19:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Neste ano, laboratórios como OpenAI e Anthropic anunciaram avanços significativos em problemas matemáticos de longa data, em alguns casos excedendo as expectativas dos pesquisadores sobre as capacidades atuais dos sistemas de IA. No estilo clássico da Silicon Valley, esses laboratórios estão avançando rapidamente e correndo riscos.", "titulo_pt": "Todas as drama em torno do domínio da IA na matemática", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 197331, "titulo": "Command-line tool quickly removes Apple Intelligence from macOS 27", "url": "https://arstechnica.com/apple/2026/10/command-line-tool-quickly-removes-apple-intelligence-from-macos-27/", "fonte_id": "ars_technica", "data_pub": "2026-10-05T19:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ferramenta de linha de comando pode liberar mais de 12GB de armazenamento em macOS. O tool remove o Apple Intelligence do sistema.", "titulo_pt": "Ferramenta de linha de comando libera mais de 12gb em macos", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 197326, "titulo": "Wikipedia operator says OpenAI’s ‘rogue’ bots may be linked to a May outage", "url": "https://www.theverge.com/news/1004929/wikipedia-openai-rogue-bots-wikimedia-foundation-outage", "fonte_id": "the_verge", "data_pub": "2026-10-05T19:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Wikimedia Foundation, responsável por hospedar o Wikipedia, confirmou a detecção de atividades realizadas por 'agentes rebeldes' do OpenAI em suas plataformas. Essas atividades incluíram edições em wikis do Wikimedia e tentativas não bem-sucedidas de explorar o Etherpad, uma ferramenta de anotação.", "titulo_pt": "Operador do wikipedia afirma que 'agentes rebeldes' do OpenAI podem estar relacionados a um problema de maio", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 197339, "titulo": "Instinct brings its AI agent to group chats, even for friends without an account", "url": "https://techcrunch.com/2026/10/05/instinct-brings-its-ai-agent-to-group-chats-even-for-friends-without-an-account/", "fonte_id": "techcrunch", "data_pub": "2026-10-05T18:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Instinct lançou chats grupais que permitem que amigos usem seu agente de inteligência artificial para tarefas como planejar viagens, organizar caronas e coordenar eventos. As contas pessoais permanecem separadas e a compartilhamento de informações ou ação por parte dos agentes requer permissão.", "titulo_pt": "Instinct traz seu agente de IA para chats grupais, mesmo para amigos sem conta", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 196455, "titulo": "Nobel medicine prize goes to US, German scientists", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/06/2003865466", "fonte_id": "taipei_times", "data_pub": "2026-10-06T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O prêmio Nobel de Medicina foi concedido a cientistas dos Estados Unidos e da Alemanha.", "titulo_pt": "Prêmio nobel de medicina para cientistas dos EUA e Alemanha", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 197355, "titulo": "Forests are dying along North Carolina's coast—and it's speeding up", "url": "https://phys.org/news/2026-10-forests-dying-north-carolina-coast.html", "fonte_id": "phys_org", "data_pub": "2026-10-05T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo revela que a perda de florestas costeiras na Península de Albemarle-Pamlico, na Carolina do Norte, começou a acelerar após 2010. Entre 1985 e 2021, a Carolina do Norte perdeu mais de 20% de suas florestas costeiras.", "titulo_pt": "Florestas costeiras estão morrendo na península de albemarle-pamlico, na Carolina do norte, e a perda está acelerando", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 197356, "titulo": "An iced coffee won't predict job performance—but it might reveal hiring bias", "url": "https://phys.org/news/2026-10-iced-coffee-wont-job-reveal.html", "fonte_id": "phys_org", "data_pub": "2026-10-05T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O título traduzido seria: 'Um café gelado não prevê o desempenho no trabalho, mas pode revelar viés na contratação.' O artigo discute a possibilidade de pequenos detalhes, como o tipo de bebida que um candidato traz para uma entrevista, indicarem viés na tomada de decisões de contratação, mesmo quando as qualificações são idênticas.", "titulo_pt": "Um café gelado não prevê o desempenho no trabalho, mas pode revelar viés na contratação", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 197135, "titulo": "What you should know about the Russian “plague lab”", "url": "https://www.vox.com/today-explained-newsletter/505220/what-you-should-know-about-the-russian-plague-lab", "fonte_id": "vox", "data_pub": "2026-10-05T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um técnico de laboratório de 28 anos morreu de pneumonia severa em uma instalação na Sibéria, o que levou a atenção do White House. A morte do técnico não é geralmente motivo para monitoramento pelo White House, mas o incidente ocorreu em um laboratório biológico.", "titulo_pt": "O que você precisa saber sobre o suposto 'laboratório da praga' russo", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 197384, "titulo": "NASA to Stream SpaceX Crew-12 Return, Splashdown Live", "url": "https://www.nasa.gov/news-release/nasa-to-stream-spacex-crew-12-return-splashdown-live/", "fonte_id": "nasa_news", "data_pub": "2026-10-05T21:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA e a SpaceX programaram a descolagem do foguete de retorno da missão Crew-12, com previsão para não antes das 8:05 de 7 de outubro de 2021, dependendo das condições meteorológicas. Os astronautas Jessica Meir e Jack Hathaway, a astronauta Sophie Adenot e o cosmonauta Andrey Fedyaev serão transportados de volta à Terra.", "titulo_pt": "NASA vai transmitir descolamento do Crew-12 da estação espacial internacional em tempo real", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 197357, "titulo": "Rare insect discovery reveals a new species from the dinosaur age", "url": "https://phys.org/news/2026-10-rare-insect-discovery-reveals-species.html", "fonte_id": "phys_org", "data_pub": "2026-10-05T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um inseto raro, pertencente a uma espécie desconhecida até então, ficou preso em resina de árvore há aproximadamente 99 milhões de anos, durante o período dos dinossauros. O fósseis preservado em amaranto permitiu que uma equipe de pesquisadores da Escola de Zoologia e do Museu Steinhardt de História Natural identificasse e descrevessem uma nova espécie: Cretodorus noonoo, ou 'Noo-Noo'.", "titulo_pt": "Descoberta rara de inseto revela nova espécie do tempo dos dinossauros", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 197358, "titulo": "How psychopathic traits shape language", "url": "https://phys.org/news/2026-10-psychopathic-traits-language.html", "fonte_id": "phys_org", "data_pub": "2026-10-05T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa recente da Universidade do Mississippi descobriu que o idioma associado a traços psicopáticos é mais complexo do que frequentemente imaginado. A cultura popular tende a retratar os psicopatas como frios e sem emoção.", "titulo_pt": "Como traços psicopáticos moldam o uso da linguagem", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 196950, "titulo": "Optogenética: entenda técnica que levou cientistas a ganharem prêmio Nobel", "url": "https://www.cnnbrasil.com.br/saude/optogenetica-entenda-tecnica-que-levou-cientistas-a-ganharem-premio-nobel/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-05T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A técnica de optogenética permite decodificar o funcionamento interno do cérebro e pode auxiliar na identificação dos circuitos neurais envolvidos em doenças mentais ou neurológicas. O método foi responsável pelo ganho de prêmio Nobel por parte de cientistas.", "titulo_pt": "Optogenética: entenda técnica que levou cientistas a ganharem prêmio Nobel", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 197077, "titulo": "Nobel de Medicina 2026: optogenética, la técnica que empezó con una microalga y luego revolucionó el estudio del cerebro", "url": "https://www.lanacion.com.ar/sociedad/nobel-de-medicina-2026-una-tecnica-que-revoluciono-el-estudio-del-cerebro-y-de-los-trastornos-nid05102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-05T21:06:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores vencedores do Nobel de Medicina em 2026 desenvolveram a técnica de optogenética, que permite ativar células neurais e observar os comportamentos associados a diferentes circuitos cerebrais. Esta técnica teve seu início com a utilização de microalgas e posteriormente transformou o estudo do cérebro.", "titulo_pt": "Nobel de Medicina 2026: optogenética, a técnica que começou com uma microalga e revolucionou o estudo do cérebro", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 196996, "titulo": "Nobel de Medicina premia pesquisa sobre funcionamento do cérebro", "url": "https://braziljournal.com/nobel-de-medicina-premia-pesquisa-sobre-funcionamento-do-cerebro/", "fonte_id": "brazil_journal", "data_pub": "2026-10-05T20:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Nobel de Medicina foram concedidos a Karl Deisseroth, Peter Hegemann e Georg Nagel por suas contribuições na compreensão do funcionamento do cérebro. Este reconhecimento reflete avanços significativos nas pesquisas sobre o órgão nos últimos 20 anos.", "titulo_pt": "Nobel de Medicina premia pesquisa sobre funcionamento do cérebro", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 197136, "titulo": "The Supreme Court is looking for a way to kill climate lawsuits", "url": "https://www.vox.com/politics/505195/supreme-court-suncor-boulder-climate-change-exxon", "fonte_id": "vox", "data_pub": "2026-10-05T20:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal está considerando como lidar com uma série de ações climáticas que poderiam custar bilhões de dólares à indústria do petróleo. O juiz-chefe John Roberts tem duas personalidades: uma conservadora que defende os interesses empresariais e outra que se opõe a ações climáticas que poderiam causar prejuízos significativos.", "titulo_pt": "O supremo está buscando uma maneira de extinguir ações climáticas", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 197380, "titulo": "STAT+: Judges skewer HHS arguments in hearing over Medicare Advantage audits lawsuit", "url": "https://www.statnews.com/2026/10/05/humana-medicare-advantage-radv-audits-lawsuit-hearing/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-05T20:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Juízes federais questionaram as argumentações do governo em um caso envolvendo auditorias de Medicare Advantage.", "titulo_pt": "Juízes questionam argumentos do governo em caso sobre auditorias de Medicare Advantage", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 197381, "titulo": "STAT+: Nobel-winning optogenetics research has led to experimental treatments for blindness and Alzheimer’s", "url": "https://www.statnews.com/2026/10/05/2026-nobel-prize-winning-optogenetics-research-explained/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-05T20:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A optogenética é agora a base para o entendimento do funcionamento do cérebro. O pesquisado premiado com o Nobel resultou em tratamentos experimentais para cegueira e Alzheimer.", "titulo_pt": "Pesquisa premiada com o nobel levou ao desenvolvimento de tratamentos experimentais para cegueira e Alzheimer através da optogenética", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 196795, "titulo": "Curiosidade sobre como algas vão em direção à luz gerou pesquisa laureada com o Nobel", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/curiosidade-sobre-como-algas-vao-em-direcao-a-luz-gerou-pesquisa-laureada-com-o-nobel.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-05T19:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Karl Deisseroth, Peter Hegemann e Georg Nagel foram laureados com o Nobel de Medicina por sua descoberta de canais de íon fotossensíveis em algas unicelulares, que revolucionaram a área da optogenética e hoje têm aplicações terapêuticas para a cegueira causada pela retinite pigmentosa.", "titulo_pt": "Curiosidade sobre como algas se movem em direção à luz rendeu Nobel de medicina", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 197383, "titulo": "Resource competition intensifies with surge in megaconstellations", "url": "https://spacenews.com/resource-competition-intensifies-with-surge-in-megaconstellations/", "fonte_id": "spacenews", "data_pub": "2026-10-05T19:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amazon deseja colocar mais de 5.000 satélites em órbita. Blue Origin propôs o lançamento de 5.400 satélites. Empresas chinesas planejam constelações muito maiores. Elon Musk tem discutido constelações com uma grande quantidade de satélites.", "titulo_pt": "Concorrência por recursos intensifica com aumento de megaconstelações", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 197375, "titulo": "New saber-toothed predator from Argentina suggests its lineage survived longer than believed", "url": "https://phys.org/news/2026-10-saber-toothed-predator-argentina-lineage.html", "fonte_id": "phys_org", "data_pub": "2026-10-05T18:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2014, fósseis de um predador antigo, datando do fim do Plioceno ou início do Pleistoceno, foram encontrados em uma falésia litorânea na Pampa argentina. Os fósseis pertenciam a um grande predador, mas a identidade do animal permanecia incerta, pois acredita-se que a linhagem dos parentes dos marsupiais com dentes de sabre tivesse se extinguido há mais tempo.", "titulo_pt": "Novo predador de dentes de sabre da Argentina sugere que sua linhagem sobreviveu mais tempo do que se acreditava", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 197073, "titulo": "Choque generacional: el cruce entre Zuchovicki y Sbdar por cómo cambió la forma de ahorrar", "url": "https://www.lanacion.com.ar/economia/choque-generacional-el-cruce-entre-zuchovicki-y-sbdar-por-como-cambio-la-forma-de-ahorrar-nid05102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-05T21:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A desconfiança geracional em relação às crises econômicas e ao sistema bancário se confronta com uma nova geração que se sente mais confiante em operar e investir no país.", "titulo_pt": "Choque geracional: o conflito entre Zuchovicki e Sbdar sobre como mudou a forma de poupar", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 196829, "titulo": "Globo tira Ana Castela e Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 197396, "titulo": "Pope Leo Calls to Save Art From AI", "url": "https://hyperallergic.com/pope-leo-calls-to-save-art-from-ai/", "fonte_id": "hyperallergic", "data_pub": "2026-10-05T20:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Papa Francisco fez um discurso recente apelando para a preservação da arte contra a inteligência artificial, argumentando que os algoritmos carecem de uma chama humana, enquanto a cultura e a arte autênticas mantêm essa chama.", "titulo_pt": "Papa francisco chama para salvar a arte da inteligência artificial", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 197386, "titulo": "The British Museum Will Extend Its Hours Amid ‘Extraordinary’ Demand for Bayeux Tapestry", "url": "https://www.artnews.com/art-news/news/bayeux-tapestry-british-museum-announces-changes-visitor-experience-hours-audio-guide-1234801086/", "fonte_id": "artnews", "data_pub": "2026-10-05T20:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O British Museum vai estender suas horas de funcionamento devido à 'demanda extraordinária' pela Tapestra de Bayeux. O museu também planeja fornecer um guia auditivo como parte do aplicativo da exposição, uma mudança em relação ao uso inicial de apenas tours auto-dirigidos.", "titulo_pt": "Museu britânico estenderá horários e oferecerá guia auditivo para tapestra de Bayeux", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 197387, "titulo": "In Vatican Address, Pope Leo Denounces AI-Generated Art: ‘The Church Needs Artists’", "url": "https://www.artnews.com/art-news/news/in-vatican-address-pope-leo-denounces-ai-generated-art-the-church-needs-artists-1234801079/", "fonte_id": "artnews", "data_pub": "2026-10-05T20:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O papa Léo denunciou a arte gerada por inteligência artificial em uma palestra no Vaticano, afirmando que a Igreja precisa 0Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme 'Homem-Aranha: Um Novo Dia', a nova aventura do herói da Marvel com Tom Holland, Zendaya, Sadie Sink e John Bernthal, está disponível nas lojas. Este é o maior fenômeno de bilheteria global deste ano.", "titulo_pt": "Homem-aranha: um Novo Dia: o filme do ano chega às lojas", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 197404, "titulo": "Emily Blunt Returning for Third ‘Sicario’ Movie Alongside Josh Brolin and Benicio Del Toro", "url": "https://www.indiewire.com/news/breaking-news/emily-blunt-returning-sicario-3-1235220252/", "fonte_id": "indiewire", "data_pub": "2026-10-05T20:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Emily Blunt está retornando para a terceira produção da franquia 'Sicário', ao lado de Josh Brolin e Benicio Del Toro. Padraic McKinley dirige 'The Weight' e está à frente desta saga sobre o combate ao tráfico de drogas, que teve seu início em 2015.", "titulo_pt": "Emily Blunt de volta para terceira 'sicário' ao lado de Josh Brolin e Benicio Del Toro", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 197394, "titulo": "New York Art Fair Organizer Independent Acquired by Global Conglomerate Informa", "url": "https://www.artforum.com/news/global-conglomerate-informa-acquires-new-york-independent-1234760855/", "fonte_id": "artforum", "data_pub": "2026-10-05T20:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Independent, organizadora de feiras de arte independentes em Nova York, foi adquirida pela conglomerada global Informa. Esta aquisição marca o primeiro investimento da Informa em uma marca de arte baseada em Nova York.", "titulo_pt": "Organizadora de feiras de arte independente de nova York adquirida por conglomerado Global", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 196831, "titulo": "'Um Banho de Vida' retrata alcoolismo sem heroísmo nem glamour", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/blogs/vida-de-alcoolatra/2026/10/um-banho-de-vida-retrata-alcoolismo-sem-heroismo-nem-glamour.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-05T20:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A comédia dramática francesa 'Um Banho de Vida' segue um grupo de homens de meia-idade que estão em situações de vida incertas. O filme não exagera em elementos de heroísmo ou glamour para retratar o alcoolismo.", "titulo_pt": "Um Banho de Vida", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 197397, "titulo": "Turning Turner’s Legacy", "url": "https://hyperallergic.com/turning-turners-legacy/", "fonte_id": "hyperallergic", "data_pub": "2026-10-05T20:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O projeto 'Turner e o Comércio de Escravos' redefine a relação do romantismo com o pintura de paisagens, transformando-a em um meio para apropriação colonial.", "titulo_pt": "Turner e o comércio de escravos", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 197417, "titulo": "What to read after you see the Bayeux Tapestry.", "url": "https://lithub.com/what-to-read-after-you-see-the-bayeux-tapestry/", "fonte_id": "lithub", "data_pub": "2026-10-05T19:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Exposição da Tapestra de Bayeux está atualmente aberta no Museu Britânico, em Londres, e é o ingresso mais cobiçado da cidade. A tapestra, que é quase um século antiga, é uma obra de arte em tecido que está causando grande interesse entre os visitantes.", "titulo_pt": "O que ler após ver a tapestra de Bayeux", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 197418, "titulo": "Inside the ALA’s list of the 150 most banned books of the last 35 years.", "url": "https://lithub.com/inside-the-alas-list-of-the-150-most-banned-books-of-the-last-35-years/", "fonte_id": "lithub", "data_pub": "2026-10-05T19:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em homenagem à Semana dos Livros Proibidos, a American Library Association (ALA) publicou uma lista dos 150 livros mais desafiados entre 1990 e 2025. O ALA’s Office for Intellectual Freedom registrou 4.235 títulos desafiados no ano passado, o segundo ano com o maior número de registros.", "titulo_pt": "Dentro da lista dos 150 livros mais desafiados da ALA nos últimos 35 anos", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}], "cultura__eventos": [], "sociedade": [{"id": 196465, "titulo": "Kuai Kuai workers set to vote on ending strike today", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/06/2003865481", "fonte_id": "taipei_times", "data_pub": "2026-10-06T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os trabalhadores da Kuai Kuai estão prestes a votar sobre encerrar a greve hoje. A decisão pode levar ao fim do conflito atual.", "titulo_pt": "Trabalhadores da Kuai Kuai devem votar hoje sobre fim da greve", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 196891, "titulo": "Tutores encaram temporal e aguardam atendimento no Hvet sob tenda furada", "url": "https://www.metropoles.com/distrito-federal/tutores-encaram-temporal-e-aguardam-atendimento-no-hvet-sob-tenda-furada", "fonte_id": "metropoles", "data_pub": "2026-10-05T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tutores enfrentaram um temporal e aguardaram atendimento no Hvet sob uma tenda danificada, onde alguns pacientes ficaram expostos. A estrutura não foi capaz de proteger todos os usuários.", "titulo_pt": "Tutores enfrentam temporal e aguardam atendimento no Hvet sob tenda danificada", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 196903, "titulo": "Homem é preso em flagrante por atirar na ex-mulher na Estrutural", "url": "https://www.metropoles.com/distrito-federal/na-mira : "Brasil", "classe": "B"}, {"id": 195688, "titulo": "Negros conquistam menos de um terço das vagas nas assembleias e na CLDF", "url": "https://www.metropoles.com/brasil/pessoas-negras-ocupam-menos-de-um-terco-das-cadeiras-nas-assembleias", "fonte_id": "metropoles", "data_pub": "2026-10-05T17:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O levantamento analisou a autodeclaração de candidatos eleitos para assembleias legislativas e a Câmara Legislativa de Washington, D.C. (CLDF), e constatou que negros ocuparam menos de um terço dessas vagas. Alagoas e Santa Catarina não elegeram nenhum candidato negro para esses cargos.", "titulo_pt": "Negros conquistam menos de um terço das vagas nas assembleias e na CLDF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 195695, "titulo": "Suspeito de integrar o alto escalão do PCC é preso no litoral de São Paulo", "url": "https://www.metropoles.com/sao-paulo/suspeito-de-integrar-o-alto-escalao-do-pcc-e-preso-no-litoral-de-sao-paulo", "fonte_id": "metropoles", "data_pub": "2026-10-05T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um suspeito de integrar o alto escalão do PCC foi preso pelo Comando e Operações Especiais da Polícia Militar no litoral de São Paulo. O indivíduo era conhecido pelo apelido de 'pato rouco'.", "titulo_pt": "Suspeito de integrar o alto escalão do PCC é preso no litoral de São Paulo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 195766, "titulo": "Proibição de bisnagas de molhos em lanchonetes de SP é adiada para 2027", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/proibicao-de-bisnagas-de-molhos-em-lanchonetes-de-sp-e-adiada-para-2027/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-05T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proibição da utilização de bisnagas de molhos em lanchonetes no estado de São Paulo foi adiada para o ano de 2027, dando aos estabelecimentos mais tempo para se adaptarem às novas regras que exigem condimentos em embalagens individuais.", "titulo_pt": "Proibição de bisnagas de molhos em lanchonetes de SP é adiada para 2027", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 195707, "titulo": "Mulher é morta a facadas em casa na Bahia; polícia busca ex-namorado", "url": "https://www.metropoles.com/brasil/mulher-e-morta-a-facadas-em-casa-na-bahia-policia-busca-ex-namorado", "fonte_id": "metropoles", "data_pub": "2026-10-05T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cristina Ribeiro dos Santos, de 47 anos, foi morta a facadas em sua casa na Bahia. Ela foi socorrida, mas não sobreviveu aos ferimentos.", "titulo_pt": "Mulher de 47 anos é morta a facadas em casa na Bahia; ex-namorado é procurado", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 196050, "titulo": "Nearly 200 students injured in French schools protests as clashes with police continue – as it happened", "url": "https://www.theguardian.com/world/live/2026/oct/05/europe-spain-pedro-sanchez-election-housing-france-school-protests-ukraine-russia-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-10-05T15:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitas escolas em França permanecem fechadas devido a protestos planejados. O Partido Popular Conservador expressou satisfação com a situação. O primeiro-ministro espanhol Pedro Sánchez convocou eleições antecipadas para 29 de novembro, após partidos de direita bloquearem medidas emergenciais sobre aluguel em meio a protestos generalizados.", "titulo_pt": "Quase 200 estudantes feridos em protestos nas escolas francesas e eleições antecipadas na Espanha - como aconteceu", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 196190, "titulo": "French teenager loses hand picking up police grenade in high school protests", "url": "https://www.lemonde.fr/en/france/article/2026/10/05/french-teenager-loses-hand-picking-up-police-grenade-in-high-school-protests_6758269_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-05T15:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudante de 15 anos ficou ferido ao pegar uma granada de pimenta disparada pela polícia durante protestos em uma escola no norte da França. O incidente ocorre quando o governo enfrenta críticas por sua resposta a uma movimentação de estudantes, às vezes violenta, que questiona as condições de sala de aula e que agora entra em sua terceira semana.", "titulo_pt": "Estudante de 15 anos fica ferido ao pegar granada de pimenta durante protestos em escola na França", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 196051, "titulo": "France braces for national day of school protests as boy loses hand", "url": "https://www.theguardian.com/world/2026/oct/05/schoolboy-loses-hand-police-stun-grenade-french-school-protests", "fonte_id": "guardian_world", "data_pub": "2026-10-05T15:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Franceses se preparam para um dia nacional de protestos e bloqueios de escolas secundárias, em meio a crescentes preocupações sobre a resposta policial. Um adolescente de 15 anos teve a mão decepada durante um protesto em Lens, norte do país.", "titulo_pt": "França se prepara para dia nacional de protestos escolares após jovem perder mão", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 196428, "titulo": "2 killed, including student, in ‘horrific’ school bus crash in Florida", "url": "https://www.scmp.com/news/world/united-states-canada/article/3369833/2-killed-including-student-horrific-school-bus-crash-florida?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-05T15:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ônibus escolar capotou durante um acidente multivéhicular no centro da Flórida, matando duas pessoas, incluindo uma estudante de 10º ano, e ferindo vários outros. O ônibus, com cerca de 39 passageiros a caminho da Escola Secundária Winter Haven, foi atingido por um carro que invadiu a faixa contrária, de acordo com o delegado do condado de Polk, Grady Judd.", "titulo_pt": "Dois mortos, incluindo estudante, em acidente ‘horroroso’ de ônibus escolar na flórida", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 196432, "titulo": "France school protests: teenager’s hand blown off after picking up grenade", "url": "https://www.scmp.com/news/world/europe/article/3369829/france-school-protests-teenagers-hand-blown-after-picking-grenade?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-05T14:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um adolescente de 15 anos perdeu uma mão ao pegar uma granada policial durante protestos em escolas francesas. Os estudantes exigem melhorias nas condições das salas de aula em uma onda de protestos que durou vários dias e afetou centenas de escolas, causando incêndios e barricadas em algumas delas.", "titulo_pt": "Protestos em escolas da França: adolescente perde mão ao pegar granada policial", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 196189, "titulo": "French high school protests: The risk of a united front of discontent", "url": "https://www.lemonde.fr/en/opinion/article/2026/10/05/french-high-school-protests-the-risk-of-a-united-front-of-discontent_6758264_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-05T13:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com o apoio de organizações profissionais unidas com estudantes de ensino médio e universitários em uma demonstração na terça-feira, o movimento de protesto está entrando em uma nova fase. No entanto, o déficit público e a dívida da França limitam as possibilidades de manobra do governo.", "titulo_pt": "Protestos nas escolas francesas: risco de uma frente unificada de insatisfação", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 196365, "titulo": "Teenager loses hand in blast amid French school protest clashes", "url": "https://www.aljazeera.com/news/2026/10/5/students-continue-to-protest-in-france-as-hundreds-of-schools-close?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-05T12:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um adolescente perdeu uma mão em uma explosão em Lens durante confrontos em uma escola francesa. Uma investigação está sendo realizada pela vigilância policial. As manifestações contra a falta de professores e as condições das escolas continuam por terceira semana consecutiva em todo o país.", "titulo_pt": "Adolescente perde mão em explosão durante protestos em escola na França", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 196901, "titulo": "\"Espantalhos flutuantes\" ajudam a evitar morte de milhares de aves marinhas", "url": "https://www.metropoles.com/ciencia/espantalhos-flutuantes-ajudam-a-evitar-morte-de-milhares-de-aves-marinhas", "fonte_id": "metropoles", "data_pub": "2026-10-05T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas do Reino Unido desenvolveram um dispositivo que reduziu em 95 mil a morte de aves marinhas por ano. Este dispositivo, conhecido como 'espantalhos flutuantes', ajuda a prevenir a morte desses animais.", "titulo_pt": "Espantalhos flutuantes reduzem mortes de aves marinhas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 197216, "titulo": "Romanian president signs law regulating bear population cull", "url": "https://www.euronews.com/2026/10/05/romanian-president-signs-law-regulating-bear-population-cull", "fonte_id": "euronews", "data_pub": "2026-10-05T21:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A presidente da Romênia assinou uma lei que regula a cativeira da população de urus. Nos últimos anos, o número de urus avistados em cidades e vilas romenas aumentou, bem como o número de ataques a esses animais.", "titulo_pt": "Presidente da romênia assina lei regulando cativeiro da população de urus", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 197109, "titulo": "Conaf condena extracción de plantas endémicas en la Reserva Nacional La Chimba durante el desierto florido", "url": "https://www.latercera.com/nacional/noticia/conaf-condena-extraccion-de-plantas-endemicas-en-la-reserva-nacional-la-chimba-durante-el-desierto-florido/", "fonte_id": "la_tercera", "data_pub": "2026-10-05T20:15:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Conaf condenou a extração de plantas endêmicas na Reserva Nacional La Chimba durante o período conhecido como 'deserto florido'. Segundo a Asociación Socioambiental Raíces Endémicas, visitantes extraíram espécies como Cleome chilensis e Cistanthe grandiflora.", "titulo_pt": "Conaf condena extração de plantas endêmicas na Reserva Nacional La Chimba durante o deserto florido", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 196911, "titulo": "Fumaça de incêndios desaparece, mas outro risco invisível pode permanecer no ar", "url": "https://exame.com/ciencia/fumaca-de-incendios-desaparece-mas-outro-risco-invisivel-pode-permanecer-no-ar/", "fonte_id": "exame", "data_pub": "2026-10-05T18:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ozônio proveniente de incêndios pode persistir no ar, afetando áreas distantes além da fumaça visível e aumentando os impactos da poluição do ar sobre a saúde.", "titulo_pt": "Fumaça dos incêndios pode desaparecer, mas ozônio invisível pode continuar a ameaçar a saúde", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 195704, "titulo": "Incêndio atinge depósito de recicláveis e assusta moradores em BH", "url": "https://www.metropoles.com/minas-gerais/incendio-atinge-deposito-de-reciclaveis-e-assusta-moradores-em-bh", "fonte_id": "metropoles", "data_pub": "2026-10-05T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incêndio atingiu um depósito de recicláveis no bairro Nova Granada, Belo Horizonte, na madrugada desta segunda-feira (5/10). Os bombeiros conseguiram controlar as chamas sem registrar vítimas.", "titulo_pt": "Incêndio atinge depósito de recicláveis e assusta moradores em BH", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 196164, "titulo": "The Iran war is hitting America's school buses — and kids are paying the price", "url": "https://www.axios.com/2026/10/05/iran-war-diesel-fuel-costs-school-bus", "fonte_id": "axios", "data_pub": "2026-10-05T15:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A guerra do Irã está aumentando os custos do diesel, que são utilizados nas escolas para transportar milhões de crianças. Isso, somado à escassez crônica de motoristas de ônibus escolares, está causando dificuldades financeiras para as distritos escolares.", "titulo_pt": "Guerra do Irã está afetando os ônibus escolares e as crianças estão pagando o preço", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 196509, "titulo": "Mass quarantine issued in Russia after unexplained death of plague researcher", "url": "https://arstechnica.com/health/2026/10/researchers-death-from-undisclosed-illness-sparks-mass-quarantine-in-russia/", "fonte_id": "ars_technica", "data_pub": "2026-10-05T15:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma quarentena em massa foi ordenada na Rússia após a morte inesperada de um pesquisador da peste. Há relatos não confirmados de que houve um acidente no laboratório.", "titulo_pt": "Quarentena em massa emitiu na Rússia após morte inesperada de pesquisador da peste", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 196288, "titulo": "Belgian city’s historic canals turn green after record-hot summer", "url": "https://www.euronews.com/video/2026/10/05/belgian-citys-historic-canals-turn-green-after-record-hot-summer", "fonte_id": "euronews", "data_pub": "2026-10-05T08:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma camada espessa de plâncton verde chamado duckweed cobriu os canais históricos de Gante, interrompendo as embarcações turísticas e levantando novas preocupações sobre o aquecimento global na Bélgica.", "titulo_pt": "Canais históricos de gante ficam verdes após verão extremamente quente", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 196290, "titulo": "Floods leave streets and roads submerged across Catalonia", "url": "https://www.euronews.com/video/2026/10/05/floods-leave-streets-and-roads-submerged-across-catalonia", "fonte_id": "euronews", "data_pub": "2026-10-05T07:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Floods in Catalunha deixaram duas pessoas mortas e outra desaparecida. Ocorreram mais de 1.500 chamadas às equipes de bombeiros devido à forte chuva.", "titulo_pt": "Inundações causam duas mortes e uma pessoa desaparecida em catalunha", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 196201, "titulo": "Persistent drought puts pressure on France's drinking water networks", "url": "https://www.lemonde.fr/en/environment/article/2026/10/05/persistent-drought-puts-pressure-on-france-s-drinking-water-networks_6758251_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-05T03:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As reservas de água que abastecem os sistemas de distribuição na França estão sob pressão devido a uma deficiência significativa de precipitação.", "titulo_pt": "Secas persistentes pressionam redes de água da França", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 197269, "titulo": "Freed Syrians recount torture in Israeli detention centre", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/5/freed-syrians-recount-torture-in-israeli-detention-centre?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-05T19:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Prisioneiros sírios libertados relataram abusos sofridos em centros de detenção israelenses.", "titulo_pt": "Sírios libertados relatam tortura em centros de detenção israelenses", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 196346, "titulo": "Rohingya activist says it’s unfair to send refugees back to Myanmar", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/5/rohingya-activist-says-its-unfair-to-send-refugees-back-to-myanmar?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-05T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ativista rohingya afirma que é injusto enviar refugiados de volta para Myanmar.", "titulo_pt": "Ativista rohingya diz que é injusto enviar refugiados de volta para Myanmar", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 196192, "titulo": "North Korean refugee describes life caught between capitalist hustle and socialist repression", "url": "https://www.lemonde.fr/en/international/article/2026/10/05/north-korean-refugee-describes-life-caught-between-capitalist-hustle-and-socialist-repression_6758270_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-05T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A vigilância mais rígida nas fronteiras dificulta a fuga dos norte-coreanos para o sul. Kang Gyu-ri, de 25 anos, conseguiu fugir de seu país no outono de 2023, usando uma embarcação.", "titulo_pt": "Refugiado norte-coreano descreve vida entre o dinamismo capitalista e a repressão socialista", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 196191, "titulo": "Paris trial opens for Rohan Rane, 'fascist' and masculinist student accused of sexually torturing minors", "url": "https://www.lemonde.fr/en/france/article/2026/10/05/paris-trial-opens-for-rohan-rane-fascist-and-masculinist-student-accused-of-sexually-torturing-minors_6758268_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-05T15:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudante liderava uma comunidade online de jovens homens obsedados com violência brutal. Ele poderia ser condenado à prisão perpétua por forçar garotas adolescentes a se autolesionarem ou a realizar atos sexuais extremamente violentos.", "titulo_pt": "Processo em paris para Rohan Rane, estudante acusado de torturar sexualmente menores e fascista", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 196037, "titulo": "Guardian readers fund life-changing surgery for Somali boy injured in US airstrike", "url": "https://www.theguardian.com/global-development/2026/oct/05/guardian-readers-fundraising-somalian-boy-injured-in-us-strike-surgery-abdiqadir-salah", "fonte_id": "guardian_world", "data_pub": "2026-10-05T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Após uma investigação do The Guardian que descobriu um ataque a drone que matou 12 civis e feriu muitos outros na vila somali de Jamaame, o menino Abdiqadir Salah, de sete anos, passou por uma operação vital em Mogadishu. Durante o trajeto de rickshaw até o hospital, a mãe do menino, Marian Haji Abdi Guled, sentiu uma mistura de alegria e preocupação, pois aquele era o dia esperado para a cirurgia do filho, que havia sido gravemente ferido há quase um ano.", "titulo_pt": "Leitores do guardian financiam cirurgia transformadora para menino Somali ferido em ataque de drone dos EUA", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 195936, "titulo": "Lo que Chile debería aprender del gobierno carcelario del PCC", "url": "https://www.ciperchile.cl/2026/10/05/lo-que-chile-deberia-aprender-del-gobierno-carcelario-del-pcc/?utm_source=rss&utm_medium=rss&utm_campaign=lo-que-chile-deberia-aprender-del-gobierno-carcelario-del-pcc", "fonte_id": "ciper_chile", "data_pub": "2026-10-05T11:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute o modelo de governança aplicado pelo Partido Comunista da China (PCC) nas prisões e sugere que o Chile poderia aprender com essa abordagem.", "titulo_pt": "O que o Chile poderia aprender com o governo carcelarista do PCC", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 196200, "titulo": "Two men die trying to cross Channel to UK", "url": "https://www.lemonde.fr/en/france/article/2026/10/05/two-men-die-trying-to-cross-channel-to-uk_6758256_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-05T08:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois homens morreram tentando cruzar o Canal da Inglaterra para o Reino Unido. Duas mulheres foram hospitalizadas com queimaduras após uma embarcação transportar 120 pessoas, deixando cerca de 20 migrantes à deriva no mar.", "titulo_pt": "Dois homens morrem tentando cruzar o canal da inglaterra para o reino unido", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 197310, "titulo": "Norwegian Charged in Greece Rues Trial’s ‘Chilling’ Effect on Migrants’ Rights Defenders", "url": "https://balkaninsight.com/2026/10/05/norwegian-charged-in-greece-rues-trials-chilling-effect-on-rights-defenders/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-10-05T05:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tommy Olsen, um trabalhador humanitário norueguês, afirma que seu julgamento na Grécia visa desencorajar outras pessoas de auxiliarem refugiados e migrantes que chegam à Europa. Olsen diz que o julgamento tem um efeito 'gelado' sobre os defensores dos direitos dos migrantes.", "titulo_pt": "Norueguês acusado em Grécia diz que julgamento 'desanimador' para defensores dos direitos dos migrantes", "veiculo": "Balkan Insight (BIRN)", const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
