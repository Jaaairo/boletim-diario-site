deficiência trabalham no Brasil, e renda é menor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 169277, "titulo": "Família acusa polícia de levar à morte suspeito de empurrar mulher na frente de ônibus em 2017 em Londres", "url": "https://www.bbc.com/portuguese/articles/ckzdz8mrj2ezo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-18T11:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Irmãs de Nicholas Brandram afirmam que seu irmão não poderia ser o suspeito de empurrar uma mulher para a frente de um ônibus na ponte de Putney, em Londres, em 2017. Elas forneceram à BBC uma lista de razões para apoiar essa afirmação.", "titulo_pt": "Família acusa polícia de levar à morte suspeito de empurrar mulher na frente de ônibus em 2017 em Londres", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 169558, "titulo": "Psychiatrist dismantles PTSD defense in Paris trial over killing of Argentine rugby star", "url": "https://www.lemonde.fr/en/france/article/2026/09/18/psychiatrist-dismantles-ptsd-defense-in-paris-trial-over-killing-of-argentine-rugby-star_6757669_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-18T10:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma especialista informou ao tribunal que Loïk Le Priol, acusado do assassinato do jogador de rugby argentino Federico Martin Aramburu, não apresentava julgamento prejudicado devido a transtorno de estresse pós-traumático no momento do crime. Ela também afirmou que ele ainda representa uma ameaça criminal.", "titulo_pt": "Psiquiatra desmonta defesa de PTSD no julgamento parisiense sobre o assassinato do jogador de rugby argentino", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 167643, "titulo": "Ataque a tiros em escola nas Filipinas deixa 3 estudantes mortos", "url": "https://www.cnnbrasil.com.br/internacional/ataque-a-tiros-em-escola-nas-filipinas-deixa-3-estudantes-mortos/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-18T09:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ataque a tiros em uma escola nas Filipinas deixou três estudantes mortos. O suspeito, um jovem de 16 anos, feriu outros oito alunos e depois se suicidou.", "titulo_pt": "Ataque a tiros em escola nas Filipinas deixa três estudantes mortos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 167727, "titulo": "Quase 50 pessoas morrem na Nigéria após ingerirem bebida com metanol", "url": "https://www.metropoles.com/mundo/quase-50-pessoas-morrem-na-nigeria-apos-ingerirem-bebida-com-metanol", "fonte_id": "metropoles", "data_pub": "2026-09-18T09:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quase 50 pessoas morreram na Nigéria após ingerirem uma bebida contendo metanol. Outras 100 pessoas que consumiram a bebida estão recebendo tratamento.", "titulo_pt": "Quase 50 pessoas morrem na Nigéria após ingerirem bebida com metanol", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 167999, "titulo": "Geolocalização e busca domiciliar nas favelas", "url": "https://www.jota.info/opiniao-e-analise/artigos/geolocalizacao-e-busca-domiciliar-nas-favelas", "fonte_id": "jota", "data_pub": "2026-09-18T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A geolocalização pode aumentar a eficácia das investigações criminais nas favelas, mas também pode reduzir a intervenção sobre os direitos fundamentais dos moradores.", "titulo_pt": "Geolocalização e busca domiciliar nas favelas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 168000, "titulo": "Assédio institucional na era digital: integridade pública começa antes da denúncia", "url": "https://www.jota.info/opiniao-e-analise/colunas/gestao-politica-sociedade/assedio-institucional-na-era-digital-integridade-publica-comeca-antes-da-denuncia", "fonte_id": "jota", "data_pub": "2026-09-18T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Corregedorias devem focar mais na prevenção para combater assédio moral, sexual e digital no setor público. Integridade pública deve ser priorizada antes da ocorrência de denúncias.", "titulo_pt": "Assédio institucional na era digital: integridade pública começa antes da denúncia", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 168629, "titulo": "Parent files child abuse complaint after fifth grader attacks teacher", "url": "https://www.koreaherald.com/article/10878592", "fonte_id": "korea_herald", "data_pub": "2026-09-18T05:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O pai de uma aluna de quinto ano, que foi filmada agredindo sua professora de sala de aula em Cheongju, no Norte da Provinha Chungcheong, apresentou uma queixa de abuso infantil contra três funcionários da escola, incluindo a professora e o vice-diretor. O incidente ocorreu após cinco agressões contra a mesma professora.", "titulo_pt": "Pai apresenta queixa de abuso infantil após aluna agredir professora pela quinta vez", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 169157, "titulo": "Queimadas ameaçam fornecimento de energia na região Norte, aponta Aneel", "url": "https://www.cnnbrasil.com.br/infra/queimadas-ameacam-fornecimento-de-energia-na-regiao-norte-aponta-aneel/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-18T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Setembro é o mês com maior número histórico de interrupções de energia causadas por queimadas, e o Pará liderou o ranking nacional em 2025 com 48,8 mil interrupções.", "titulo_pt": "Queimadas ameaçam fornecimento de energia na região Norte, aponta Aneel", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 169618, "titulo": "Japan tests mobile robotic rubbish bins at Shinjuku Station", "url": "https://www.euronews.com/video/2026/09/18/japan-tests-mobile-robotic-rubbish-bins-at-shinjuku-station", "fonte_id": "euronews", "data_pub": "2026-09-18T14:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estação de trem mais movimentada do Japão está testando lixeiras robóticas móveis em Tóquio com o objetivo de aliviar o trabalho dos trabalhadores de limpeza.", "titulo_pt": "Japão testa lixeiras robóticas móveis na estação Shinjuku", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 169619, "titulo": "Torrential rain and flooding slam Tunis, forcing schools to close", "url": "https://www.euronews.com/video/2026/09/18/torrential-rain-and-flooding-slam-tunis-forcing-schools-to-close", "fonte_id": "euronews", "data_pub": "2026-09-18T14:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças de chuva torrencial e tempestades severas atingiram Túnis em 17 de setembro, alagando ruas, interrompendo o tráfego e forçando as escolas e universidades a suspenderem as aulas da tarde a partir das 15h locais.", "titulo_pt": "Força da chuva torrencial e tempestades severas castigam túnis, obrigando a fechar escolas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 169032, "titulo": "Exploração de petróleo no Amapá divide moradores entre esperança e temor", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/09/exploracao-de-petroleo-no-amapa-divide-moradores-entre-esperanca-e-temor.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T14:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cacique indígena Wagner Karipuna expressa preocupação com a possibilidade de um vazamento de petróleo nas águas próximas à sua aldeia no Amapá, na Amazônia brasileira. Ele teme que um acidente ambiental afete sua comunidade.", "titulo_pt": "Exploração de petróleo no Amapá divide moradores entre esperança e temor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 167723, "titulo": "Clima: tempo volta a fechar no Sul, com chuvas fortes, ventanias e granizo", "url": "https://www.metropoles.com/brasil/clima-tempo-volta-a-fechar-no-sul-com-chuvas-fortes-ventanias-e-granizo", "fonte_id": "metropoles", "data_pub": "2026-09-18T09:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O tempo volta a fechar no Sul do Brasil, com chuvas fortes, ventanias e granizo. As áreas de instabilidade devem causar novas pancadas e temporais na região, incluindo o Sudeste e parte do Centro-Oeste.", "titulo_pt": "Clima: tempo volta a fechar no Sul, com chuvas fortes, ventanias e granizo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 167824, "titulo": "Deben llegar al país vacunas del Covid de Pfizer por casi US$ 100 millones y como no se usan evalúan otro plan", "url": "https://www.clarin.com/sociedad/deben-llegar-pais-vacunas-covid-pfizer-us-100-millones-usan-evaluan-plan_0_pCRrh33Zqz.html", "fonte_id": "clarin", "data_pub": "2026-09-18T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O país ainda deve pagar por contratos de cerca de 8 milhões de doses de vacinas da Pfizer até 2027, mas há discussões sobre substituir essas vacinas por outros medicamentos. A demanda pela vacina diminuiu e há um alto descarte de medicamentos comprados pelo Estado.", "titulo_pt": "Vacinas da Pfizer custam quase 100 milhões e podem ser substituídas por outros medicamentos", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 168288, "titulo": "Trump administration moves to cut protections for endangered species", "url": "https://www.euronews.com/2026/09/18/trump-administration-moves-to-cut-protections-for-endangered-species", "fonte_id": "euronews", "data_pub": "2026-09-18T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos propôs cortes nas proteções para espécies em risco de extinção. Essa medida, segundo Brett Hartl, diretor de assuntos governamentais do Center for Biological Diversity, viola o Espécie Ameaçada em Ação americano, permitindo a morte de algumas das espécies mais amadas do país.", "titulo_pt": "Administração trump propõe cortar proteções para espécies em risco de extinção", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 168553, "titulo": "Torrential rain in Vietnam leaves 3 dead, 16,000 homes flooded", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3367958/torrential-rain-vietnam-leaves-3-dead-16000-homes-flooded?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-18T05:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chuvas intensas causaram alagamentos e deslizamentos de terra no norte da Vietnã, deixando três mortos e danificando mais de 16.000 casas e 22.000 hectares de cultivo. A região tem enfrentado fortes precipitações desde segunda-feira, com algumas áreas recebendo até 653mm de chuva.", "titulo_pt": "Chuvas intensas no norte do vietnã deixam três mortos e deixam 16.000 casas alagadas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 168524, "titulo": "More extreme heat days likely by end of century", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/18/2003864478", "fonte_id": "taipei_times", "data_pub": "2026-09-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos indicam que o número de dias extremamente quentes deve aumentar significativamente até o final do século. As projeções climáticas sugerem um aumento no número de dias de alta temperatura em todo o mundo.", "titulo_pt": "Mais dias extremamente quentes prováveis até o final do século", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 168525, "titulo": "Groups urge more green energy use at TSMC fabs", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/18/2003864479", "fonte_id": "taipei_times", "data_pub": "2026-09-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos estão incentivando o uso de mais energia verde nas fábricas da TSMC. A TSMC é uma das principais empresas de fabricação de chips do mundo.", "titulo_pt": "Grupos incentivam maior uso de energia verde nas fábricas da TSMC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 167833, "titulo": "Mariana, latina de 24 años: declaró tener ciudadanía estadounidense para votar y ahora el Uscis denuncia fraude", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/mariana-latina-de-24-anos-declaro-tener-ciudadania-estadounidense-para-votar-y-ahora-el-uscis-nid15092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-18T09:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mariana Dewey, uma peruana de 24 anos, foi acusada de declarar ter cidadania americana para se registrar e votar nas eleições de 2024. O Uscis (Serviço de Ciudadania e Immigração dos EUA) denunciou supostos fraudes relacionadas a sua candidatura.", "titulo_pt": "Mariana, peruana de 24 anos: acusada de declarar cidadania americana para votar e agora o Uscis denuncia fraude", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 168364, "titulo": "‘This is a war’: South Africa battles femicide as women’s bodies pile up", "url": "https://www.aljazeera.com/news/2026/9/18/this-is-a-war-south-africa-battles-femicide-as-womens-bodies-pile-up?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-18T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove mulheres foram encontradas mortas em uma área de Johannesburgo em dois meses, aumentando as preocupações sobre a segurança das mulheres na África do Sul.", "titulo_pt": "Esta é uma guerra: áfrica do sul luta contra o feminicídio com corpos de mulheres se acumulando", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 168030, "titul const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint

    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>

         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>

    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
