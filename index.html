 operacionais primeiro.", "titulo_pt": "Hong Kong adia lei de direitos autorais para IA para emitir diretrizes primeiro", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 183243, "titulo": "Entreguei minha vida ao agente de IA da Meta e fiquei impressionado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/entreguei-minha-vida-ao-agente-de-ia-da-meta-e-fiquei-impressionado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-27T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na semana passada, o autor atendeu a uma ligação de um número desconhecido que se apresentou como um agente de IA da Meta e conseguiu transferir a chamada para a Anthem Dental.", "titulo_pt": "Entreguei minha vida ao assistente de IA da Meta e fiquei impressionado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 183244, "titulo": "IA avança em escritórios de advocacia nos EUA, e clientes exigem descontos em honorários", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/ia-avanca-em-escritorios-de-advocacia-nos-eua-e-clientes-exigem-descontos-em-honorarios.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-27T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nos Estados Unidos, os maiores escritórios de advocacia estão adotando a inteligência artificial para melhorar seus serviços. Os clientes estão exigindo descontos nos honorários devido à presença da tecnologia.", "titulo_pt": "IA avança em escritórios de advocacia nos EUA, e clientes exigem descontos em honorários", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 183690, "titulo": "Hong Kong tech chief sets June deadline for Hetao cross-border talent flow", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3368934/hong-kong-tech-chief-sets-june-deadline-hetao-cross-border-talent-flow?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-27T06:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário para Inovação, Tecnologia e Indústria de Hong Kong, Sun Dong, estabeleceu um prazo de junho de 2024 para a implementação das flutuações de talentos entre a Hetao Inovação Hub. O chefe de Hong Kong também prometeu permitir o livre movimento de dados até o final deste ano.", "titulo_pt": "Secretário de hong Kong estabelece prazo de junho de 2024 para flutuações de talentos na Hetao inovação hub", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 183289, "titulo": "Quem responde quando um agente de IA toma uma decisão errada sozinho?", "url": "https://exame.com/inteligencia-artificial/quem-responde-quando-um-agente-de-ia-toma-uma-decisao-errada-sozinho/", "fonte_id": "exame", "data_pub": "2026-09-27T06:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A IA ganha mais autonomia nas tarefas, aumentando a necessidade de definir quem controla, monitora e responde pelas decisões tomadas.", "titulo_pt": "Quem responde quando um agente de IA toma uma decisão errada sozinho?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 183294, "titulo": "Por que empresas estão trocando modelos gigantes de IA por versões menores e mais baratas", "url": "https://exame.com/inteligencia-artificial/por-que-empresas-estao-trocando-modelos-gigantes-de-ia-por-versoes-menores-e-mais-baratas/", "fonte_id": "exame", "data_pub": "2026-09-27T05:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas estão adotando modelos de inteligência artificial menores e mais econômicos, que consomem menos recursos e oferecem maior controle sobre os dados e as operações.", "titulo_pt": "Por que empresas estão optando por modelos de IA menores e mais econômicos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 183726, "titulo": "Kakao Pay Insurance bucks digital insurer retreat", "url": "https://www.koreaherald.com/article/10885242", "fonte_id": "korea_herald", "data_pub": "2026-09-27T04:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Coreia do Sul, enquanto duas das primeiras seguradoras digitais independentes estão retornando a suas companhias-mãe tradicionais após anos de prejuízos, a Kakao Pay Insurance está expandindo rapidamente, reduzindo suas perdas e ampliando seu portfólio de produtos. As abordagens das duas empresas para o setor de seguros digitais foram significativamente diferentes.", "titulo_pt": "Kakao Pay Insurance contraria recuo de seguradoras digitais", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 183729, "titulo": "LG Electronics named Nvidia partner for AI data center cooling", "url": "https://www.koreaherald.com/article/10885239", "fonte_id": "korea_herald", "data_pub": "2026-09-27T04:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "LG Electronics foi nomeada parceira preferencial na rede oficial de parceiros da Nvidia para resfriamento de centrais de dados de IA, fortalecendo sua relação com a gigante dos chips americanos. A empresa sul-coreana ingressou na rede Nvidia Partner Network (NPN) como parceira preferencial na categoria de energia e resfriamento.", "titulo_pt": "LG eletrônicos é parceira preferencial da Nvidia para resfriamento de centrais de dados de IA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 183640, "titulo": "Big companies warn lack of ‘AI openness’ could hit investment in Europe", "url": "https://www.ft.com/content/aeabd0d5-be0e-4270-987e-0b119b24b355?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-27T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grandes empresas estão avaliando a abordagem de países europeus em relação à IA antes de planejar expansões. Executivos afirmam que a falta de transparência na IA pode afetar as investidas na Europa.", "titulo_pt": "Grandes empresas alertam sobre falta de transparência na IA e seu impacto nas investidas na Europa", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 183641, "titulo": "South Korea bets big on AI for all", "url": "https://www.ft.com/content/2c5e6862-65b6-4569-8c03-464e686ea88e", "fonte_id": "financial_times", "data_pub": "2026-09-27T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vice-prime minister de South Korea é um fervoroso apoiador da tecnologia da inteligência artificial, mesmo que alguns temam que ela possa representar riscos catastróficos.", "titulo_pt": "South Korea aposta alto na IA para todos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 183252, "titulo": "Após sucesso de projeto no Vale do Ribeira, em SP, biólogos estudam jiboia mais rara do mundo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/apos-sucesso-de-projeto-no-vale-do-ribeira-em-sp-biologos-estudam-jiboia-mais-rara-do-mundo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em outubro de 2016, após um trabalho de comunicação com moradores, os biólogos localizaram uma jiboia rara no Vale do Ribeira, em São Paulo. O Projeto Jiboia do Ribeira, cofundado por Bruno Rocha, teve sucesso na localização da cobra buscada.", "titulo_pt": "Após sucesso de projeto no Vale do Ribeira, biólogos estudam jiboia mais rara do mundo", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 183318, "titulo": "Um sinal de rádio do exoplaneta β Pictoris b foi captado na Terra por cientistas; o que sabemos da frequência vinda de fora do Sistema Solar", "url": "https://www.cnnbrasil.com.br/ciencia/um-sinal-de-radio-do-exoplaneta-%ce%b2-pictoris-b-foi-captado-na-terra-por-cientistas-o-que-sabemos-da-frequencia-vinda-de-fora-do-sistema-solar/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T06:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas usaram o radiotelescópio MeerKAT para capturar um sinal de rádio do exoplaneta β Pictoris b, permitindo pela primeira vez medir o campo magnético desse planeta fora do Sistema Solar.", "titulo_pt": "Sinal de rádio de exoplaneta β Pictoris b captado pela Terra", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 183287, "titulo": "Células têm 'plano B' para sobreviver — e câncer pode tirar proveito disso", "url": "https://exame.com/ciencia/celulas-tem-plano-b-para-sobreviver-e-cancer-pode-tirar-proveito-disso/", "fonte_id": "exame", "data_pub": "2026-09-27T06:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um mecanismo desconhecido nas células desafia a ideia de que elas têm apenas um plano para sobreviver, o que pode abrir caminhos para investigar melhor a resistência de tumores a tratamentos.", "titulo_pt": "Células têm 'plano B' para sobreviver — e câncer pode tirar proveito disso", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 183290, "titulo": "Mistério de Stonehenge: estudo explica como pedra de 6 toneladas viajou 700 km", "url": "https://exame.com/ciencia/misterio-de-stonehenge-estudo-explica-como-pedra-de-6-toneladas-viajou-700-km/", "fonte_id": "exame", "data_pub": "2026-09-27T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores sugerem que antigas geleiras transportaram a rocha da Escócia até uma área hoje submersa antes de parte do trajeto ser feita por humanos. O estudo explica como uma pedra de 6 toneladas viajou 700 km para chegar ao local da Stonehenge.", "titulo_pt": "Mistério de Stonehenge: estudo explica como pedra de 6 toneladas viajou 700 km", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 183692, "titulo": "Hong Kong can offer AI governance solutions for major economies: Paul Chan", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3368931/hong-kong-can-offer-ai-governance-solutions-major-economies-paul-chan?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-27T05:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Paul Chan Mo-po, secretário financeiro de Hong Kong, afirmou que a cidade pode oferecer soluções confiáveis em governança de inteligência artificial (IA) para economias maiores, aproveitando suas forças únicas, como o sistema de direito comum, padrões internacionalmente conectados e serviços profissionais. Segundo Chan, Hong Kong pode contribuir com 'regras' e 'confiança' nas discussões sobre governança de IA, dados, conformidade e gestão de riscos.", "titulo_pt": "Hong Kong pode oferecer soluções de governança de IA para grandes economias, diz paul Chan", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 183291, "titulo": "Quanto tempo você passa em sono REM? Estudo encontra ligação com 83 doenças", "url": "https://exame.com/ciencia/quanto-tempo-voce-passa-em-sono-rem-estudo-encontra-ligacao-com-83-doencas/", "fonte_id": "exame", "data_pub": "2026-09-27T05:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo acompanhou mais de 95 mil pessoas por cerca de nove anos, analisando diferentes estágios e padrões do sono. O pesquisador descobriu uma conexão com 83 doenças.", "titulo_pt": "Quanto tempo você passa em sono REM? Estudo encontra ligação com 83 doenças", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 183293, "titulo": "O que é síndrome de Cotard, condição rara que faz pessoa acreditar que está morta?", "url": "https://exame.com/ciencia/o-que-e-sindrome-de-cotard-condicao-rara-que-faz-pessoa-acreditar-que-esta-morta/", "fonte_id": "exame", "data_pub": "2026-09-27T05:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A síndrome de Cotard é uma condição rara que faz com que as pessoas acreditem estar mortas ou que partes do seu corpo não existam. O delírio pode estar associado à depressão e à esquizofrenia.", "titulo_pt": "O que é a síndrome de Cotard, condição rara que faz a pessoa acreditar estar morta?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 183295, "titulo": "Não foi só a gravidade: meteorito revela força que ajudou a formar o Sistema Solar", "url": "https://exame.com/ciencia/nao-foi-so-a-gravidade-meteorito-revela-forca-que-ajudou-a-formar-o-sistema-solar/", "fonte_id": "exame", "data_pub": "2026-09-27T04:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Grãos microscópicos de um meteorito preservaram evidências dos primeiros 200 mil anos da formação do Sistema Solar por bilhões de anos. Essas evidências podem ajudar a entender melhor os processos iniciais que moldaram o sistema planetário.", "titulo_pt": "Não foi só a gravidade: grãos microscópicos revelam os primeiros 200 mil anos da formação do Sistema Solar", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 183727, "titulo": "Beyond WHO approval, EuBiologics targets global typhoid vaccine market", "url": "https://www.koreaherald.com/article/10885241", "fonte_id": "korea_herald", "data_pub": "2026-09-27T04:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "EuBiologics, uma fabricante sul-coreana de vacinas conhecida como maior fornecedora de vacinas orais contra a cólera para programas de saúde globais em países menos desenvolvidos, está preparando sua vacina contra a febre tifoide conjugada, EuTYPH-C, para aquisições internacionais. A vacina foi pré-qualificada pela Organização Mundial da Saúde em agosto, tornando-se a primeira vacina a obter essa aprovação com base em investimentos de pesquisa.", "titulo_pt": "Além da aprovação da OMS, EuBiologics almeja o mercado global de vacinas contra tifoide", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 183753, "titulo": "APOD: 2026 September 27 – Andromeda Before and After Photoshop", "url": "https://science.nasa.gov/image-article/apod-2026-september-27-andromeda-before-photoshop/", "fonte_id": "nasa_news", "data_pub": "2026-09-27T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da APOD em 27 de setembro de 2026 mostra a constelação de Andrômeda antes e depois de um processo de edição de fotos. O objetivo é comparar a aparência original da galáxia com uma versão modificada.", "titulo_pt": "APOD: 27 de setembro de 2026 – andrômeda antes e depois de edição", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 183751, "titulo": "Why AI has trouble predicting the fury of hurricane intensity", "url": "https://phys.org/news/2026-09-ai-fury-hurricane-intensity.html", "fonte_id": "phys_org", "data_pub": "2026-09-27T00:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial tem revolucionado a previsão do tempo em apenas alguns anos, com modelos globais de IA de meteorologia agora capazes de produzir previsões que competem com alguns dos melhores sistemas de previsão baseados em física.", "titulo_pt": "Por que a IA tem dificuldade em prever a intensidade dos hurricanes?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 182785, "titulo": "Risk of dementia higher for early retirees: research", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/27/2003864971", "fonte_id": "taipei_times", "data_pub": "2026-09-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que há um risco maior de demência para pessoas que se aposentam precocemente. O estudo examinou a relação entre a idade de aposentadoria e o risco de desenvolver demência.", "titulo_pt": "Risco maior de demência para quem se aposenta precocemente, pesquisa indica", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 183752, "titulo": "NEET with a disability: What's holding back visually impaired young people who want to work", "url": "https://phys.org/news/2026-09-neet-disability-visually-impaired-young.html", "fonte_id": "phys_org", "data_pub": "2026-09-26T22:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor acompanhou 80 jovens com baixa visão por 11 anos, registrando suas transições da escola para a vida adulta e conversando regularmente com eles para entender os desafios e os sucessos de suas carreiras.", "titulo_pt": "Jovens com deficiência visual que não trabalham: o que os impede?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 183765, "titulo": "Blood test could gauge if a baby has a dangerous infection in 15 minutes", "url": "https://www.newscientist.com/article/2590894-blood-test-could-gauge-if-a-baby-has-a-dangerous-infection-in-15-minutes/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-26T22:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um teste de sangue pode determinar em 15 minutos se um bebê com febre tem uma infecção bacteriana grave ou viral, o que poderia evitar o uso desnecessário de antibióticos.", "titulo_pt": "Teste de sangue pode identificar infecções em bebês em 15 minutos", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 183063, "titulo": "Científicos lograron reconstruir cómo era el rostro del primer Homo sapiens, un humano que vivió hace 315 mil años", "url": "https://www.lanacion.com.ar/ciencia/cientificos-lograron-reconstruir-como-era-el-rostro-del-primer-homo-sapiens-un-humano-que-vivio-hace-nid26092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-26T21:41:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Cientistas utilizaram fósiles encontrados no Marrocos para reconstruir o rosto de um dos primeiros Homo sapiens, que viveu há 315 mil anos. A reconstrução foi feita em 3D com base nos restos fósiles localizados em Jebel Irhoud.", "titulo_pt": "Cientistas reconstruíram o rosto do primeiro Homo sapiens, que vivia há 315 mil anos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 183041, "titulo": "María Carrillo, experta en Alzheimer: \"Cambiar el estilo de vida no sólo mejora los riesgos para la salud individual sino que garantiza dos a tres años de salud cerebral\"", "url": "https://www.clarin.com/sociedad/maria-carrillo-experta-alzheimer-cambiar-estilo-vida-solo-mejora-riesgos-salud-individual-garantiza-anos-salud-cerebral_0_SFJ9N1NDcd.html", "fonte_id": "clarin", "data_pub": "2026-09-26T21:06:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "María Carrillo, diretora científica e responsável pelos assuntos médicos da Alzheimer's Association, explica que mudanças de estilo de vida não apenas melhoram os riscos para a saúde individual, mas também garantem dois a três anos de saúde cerebral. Ela dá orientações sobre como prevenir a doença e as prioridades que o país deve ter.", "titulo_pt": "María Carrillo, especialista em Alzheimer: 'mudar o estilo de vida beneficia tanto a saúde individual quanto a cerebral'", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}], "ciencia__eventos": [], "cultura": [{"id": 183417, "titulo": "Elis Mendoza, arquitecta: “La arquitectura forense es un reclamo contra el monopolio de la verdad del Estado o el poder”", "url": "https://www.latercera.com/nacional/noticia/elis-mendoza-arquitecta-la-arquitectura-forense-es-un-reclamo-contra-el-monopolio-de-la-verdad-del-estado-o-el-poder/", "fonte_id": "la_tercera", "data_pub": "2026-09-27T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Elis Mendoza, arquiteta mexicana e fundadora do Patio Lab, usa mapas, fotografias satelitais e reconstruções 3D para investigar violações de direitos humanos. Ela participou de um seminário na Faculdade de Arquitetura UC, questionando a neutralidade da arquitetura e destacando como o espaço pode exercer violência e se tornar um testemunho disso.", "titulo_pt": "Elis Mendoza, arquiteta: 'a arquitetura forense é um pedido contra o monopólio da verdade do Estado ou do poder'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 183371, "titulo": "Carlos Alonso: todo lo que una fotografía dice sobre la pintura", "url": "https://www.lanacion.com.ar/cultura/carlos-alonso-todo-lo-que-una-fotografia-dice-sobre-la-pintura-nid27092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-27T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute detalhes de uma fotografia relacionada a uma pintura. Não há informações adicionais sobre o conteúdo específico da fotografia ou da pintura.", "titulo_pt": "Carlos Alonso: tudo que uma fotografia revela sobre a pintura", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 183374, "titulo": "Crónica de una prenda que comenzó con una tela inventada en 1879 y que usaron los soldados en la Primera Guerra", "url": "https://www.lanacion.com.ar/conversaciones-de-domingo/cronica-de-una-prenda-que-comenzo-con-una-tela-inventada-en-1879-y-que-usaron-los-soldados-en-la-nid27092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-27T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Museu Victoria and Albert de Londres exibe uma exposição dedicada ao trench coat Burberry para comemorar os 170 anos da casa. A mostra celebra a história deste item de vestuário, que teve origem em uma tela inventada em 1879 e foi usado por soldados na Primeira Guerra.", "titulo_pt": "Crônica de uma prenda que começou com uma tela inventada em 1879 e que usaram os soldados na primeira Guerra", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 183427, "titulo": "La última batalla (casi perdida) de la generación intermedia del PC", "url": "https://www.latercera.com/politica/noticia/la-ultima-batalla-casi-perdida-de-la-generacion-intermedia-del-pc/", "fonte_id": "la_tercera", "data_pub": "2026-09-27T08:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Ex-ministros e ex-authoridades comunistas tentarão disputar com a ala mais dura do partido a posição crítica à administração Boric. A luta é vista como difícil e pode afetar uma possível candidatura presidencial de Boric.", "titulo_pt": "Última batalha (quase perdida) da geração intermediária do PC", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 183658, "titulo": "How students in Japan strive to escape the international school bubble", "url": "https://www.japantimes.co.jp/community/2026/09/27/our-lives/international-school-student-bubble/", "fonte_id": "japan_times", "data_pub": "2026-09-27T08:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudantes em escolas internacionais passam sua vida fora do sistema público de ensino e, por isso, enfrentam dificuldades para se integrar à sociedade japonesa mais ampla.", "titulo_pt": "Como estudantes em escolas internacionais lutam para escapar do buraco de escorpião da escola internacional", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 183685, "titulo": "A Hong Kong professor’s sexist views have been laid bare. That’s good", "url": "https://www.scmp.com/opinion/hong-kong-opinion/article/3368803/hong-kong-professors-sexist-views-have-been-laid-bare-thats-good?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-27T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um economista da Universidade de Hong Kong, Terence Chong Tai-leung, proferiu uma palestra onde sugeriu que mulheres devem se casar por dinheiro em vez de se dedicarem a carreiras acadêmicas. Ele recomendou que as estudantes não busquem doutorado.", "titulo_pt": "Apostas sexistas de um professor de Hong Kong são expostas. Isso é bom", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 183215, "titulo": "'Tradwives' vão ao cinema e à literatura em retratos ácidos de mulheres submissas", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/tradwives-vao-ao-cinema-e-a-literatura-em-retratos-acidos-de-mulheres-submissas.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-27T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A influenciadora Virgínia, cristã e conservadora, ensina mulheres a cuidarem da casa, do marido e dos filhos nas redes sociais, ganhando dinheiro com suas ideias. Ela promove um estilo de vida submisso para as mulheres.", "titulo_pt": "Mulheres tradicionais vão ao cinema e à literatura em retratos ácidos de mulheres submissas", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 183216, "titulo": "'Escândalo e Intriga' leva libertinagem de 'Ligações Perigosas' à dinastia Joseon", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/blogs/k-cultura/2026/09/escandalo-e-intriga-leva-libertinagem-de-ligacoes-perigosas-a-dinastia-joseon.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-27T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um nobre libertino e uma viúva cristã estão deitados no chão, nuas, em uma cena de tirar a virgindade. Esta é uma cena de uma série que adapta elementos de 'Ligações Perigosas' para a dinastia Joseon.", "titulo_pt": "Escândalo e Intriga levam libertinagem de Ligações Perigosas à dinastia Joseon", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 183217, "titulo": "'Virtuosas' faz sátira afiada do conservadorismo a partir do terror", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/virtuosas-faz-satira-afiada-do-conservadorismo-a-partir-do-terror.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-27T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme 'Virtuosas' é uma sátira afiada do conservadorismo através do gênero terror. O longa faz parte da programação da 49ª Mostra Internacional de São Paulo e finalmente estreia em circuito comercial.", "titulo_pt": "Virtuosas faz sátira afiada do conservadorismo a partir do terror", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 183543, "titulo": "A Hindu temple outside Paris has become a source of tension", "url": "https://www.lemonde.fr/en/religions/article/2026/09/27/a-hindu-temple-outside-paris-has-become-a-source-of-tension_6757998_63.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-27T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um templo hindu construído na Esplanada das Religiões e Culturas, em uma cidade ao leste de Paris, gerou várias controvérsias desde sua inauguração recente com grande celebração. Isso é incomum neste local inter-religioso, onde a unidade e a harmonia são consideradas princípios orientadores.", "titulo_pt": "Templo Hindu fora de Paris causa tensões", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 183662, "titulo": "China sends two giant pandas to U.S.", "url": "https://www.japantimes.co.jp/news/2026/09/27/asia-pacific/china-us-pandas/", "fonte_id": "japan_times", "data_pub": "2026-09-27T06:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China enviou dois pandas gigantes para os Estados Unidos. A transferência havia sido previamente acordada e foi anunciada durante a visita do líder chinês Xi Jinping a Washington.", "titulo_pt": "China envia dois pandas gigantes para os estados unidos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 183663, "titulo": "Japan’s booming tourism industry struggling to improve sustainability", "url": "https://www.japantimes.co.jp/environment/2026/09/27/sustainability/tourism-sustainability-measures-japan/", "fonte_id": "japan_times", "data_pub": "2026-09-27T06:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria de turismo no Japão, embora em crescimento, enfrenta desafios para melhorar sua sustentabilidade, com emissões de alta poluição impactando os objetivos climáticos do país. Alguns destinos estão buscando soluções climáticas próprias para superar esses desafios.", "titulo_pt": "Indústria de turismo do Japão em crescimento enfrenta desafios para melhorar a sustentabilidade", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 183764, "titulo": "TV tonight:Eva Longoria laps up butter on a French foodie tour", "url": "https://www.theguardian.com/tv-and-radio/2026/sep/27/tv-tonighteva-longoria-laps-up-butter-on-a-french-foodie-tour", "fonte_id": "guardian_culture", "data_pub": "2026-09-27T05:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Eva Longoria embarca em uma aventura culinária que começa em Paris. O programa inclui também a exibição de Apocalypse, um reality show ridículo, mas adictivo.", "titulo_pt": "Eva Longoria degusta manteiga em tour culinário francês", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 183721, "titulo": "Koo Jaha accepts Ibsen Award, the first Asian and youngest winner", "url": "https://www.koreaherald.com/article/10885253", "fonte_id": "korea_herald", "data_pub": "2026-09-27T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Koo Jaha, um criador de teatro coreano, recebeu o Prêmio Internacional Ibsen, o primeiro artista asiático e o mais jovem a ganhar o prêmio, na National Theatre em Oslo, Noruega. O prêmio, estabelecido em 2007 em homenagem ao dramaturgo norueguês Henrik Ibsen, foi concedido a Koo Jaha, que tem 42 anos.", "titulo_pt": "Koo Jaha vence prêmio internacional Ibsen, primeiro artista asiático e mais jovem a ganhar o prêmio", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 183722, "titulo": "Korea's regional districts turn local culture into tourism destinations", "url": "https://www.koreaherald.com/article/10885252", "fonte_id": "korea_herald", "data_pub": "2026-09-27T04:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Regiões da Coreia do Sul estão transformando suas culturas locais em destinos turísticos, com foco em práticas culinárias, ruas históricas e monumentos culturais. O programa, liderado pelo Serviço de Pequenas Empresas e Serviços de Mercado, visa revitalizar economias locais e atraír visitantes internacionais além de Seul.", "titulo_pt": "Regiões da Coreia do sul transformam cultura local em destinos turísticos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 183393, "titulo": "Las implacables notas del cuadernito negro", "url": "https://www.lanacion.com.ar/editoriales/las-implacables-notas-del-cuadernito-negro-nid27092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-27T03:09:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Argentina não crescerá se o equilíbrio fiscal e a confiança na moeda forem colocados em risco, conforme percebe um observador experiente.", "titulo_pt": "As implacáveis notas do caderno preto", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "cultura__eventos": [], "sociedade": [{"id": 183370, "titulo": "Cuando la salud se vuelve una obsesión: cómo darse cuenta que la sufrís y cuánto pesa la hipervigilancia de los biomarcadores", "url": "https://www.lanacion.com.ar/salud/cuando-la-salud-se-vuelve-una-obsesion-como-darse-cuenta-y-cuanto-pesa-la-hipervigilancia-de-los-nid27092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-27T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Com o uso de relógios e anéis inteligentes, surge uma nova realidade onde as pessoas ficam atentas aos marcadores biológicos, como sono, saturação de oxigênio, ritmo cardíaco e consumo de calorias. Embora alguns casos sejam úteis, outros podem causar preocupação excessiva, o que pode ser negativo.", "titulo_pt": "Quando a saúde se torna uma obsessão: como identificar quando você sofre e quanto a hipervigilância de biomarcadores pesa", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 183267, "titulo": "São Paulo tem três hospitais municipais em rankings internacionais", "url": "https://www.metropoles.com/conteudo-especial/sao-paulo-hospitais-municipais", "fonte_id": "metropoles", "data_pub": "2026-09-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os hospitais municipais Vila Santa Catarina e M’Boi Mirim estão entre os 50 melhores da América Latina em rankings internacionais. O Hospital Municipal Menino Jesus também foi incluído em um ranking de excelência.", "titulo_pt": "São Paulo tem três hospitais municipais em rankings internacionais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 183301, "titulo": "Dia da Doação de Órgãos: veja como vidas são transformadas por transplantes", "url": "https://www.cnnbrasil.com.br/saude/dia-da-doacao-de-orgaos-veja-como-vidas-sao-transformadas-por-transplantes/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No Brasil, a autorização para doação de órgãos é feita pelos familiares após a morte. A campanha Setembro Verde promove conversas entre familiares sobre a intenção de doação de órgãos.", "titulo_pt": "Dia da Doação de Órgãos: veja como vidas são transformadas por transplantes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 183441, "titulo": "Redução da maioridade penal: política criminal ou resposta ao clamor social?", "url": "https://www.jota.info/opiniao-e-analise/artigos/reducao-da-maioridade-penal-politica-criminal-ou-resposta-ao-clamor-social", "fonte_id": "jota", "data_pub": "2026-09-27T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A tramitação da Proposta de Emenda à Constituição (PEC) 171/1993 é questionada sobre se a medida visa uma política criminal ou responde a um clamor social.", "titulo_pt": "Redução da maioridade penal: política criminal ou resposta ao clamor social?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 183545, "titulo": "Protestors in Madrid demand better tenant protection", "url": "https://www.lemonde.fr/en/international/article/2026/09/27/protestors-in-madrid-demand-better-tenant-protection_6758000_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-27T08:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A expulsão de Maricarmen Abascal, uma idosa de 87 anos, de sua residência em Madri após a polícia arrombar sua porta e a levar em uma maca, reavivou o debate sobre a proteção dos locadores e mobilizou os protestos.", "titulo_pt": "Protestos em madri exigem melhor proteção para inquilinos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 183659, "titulo": "South Africa police hunt suspects after 27 killed in two separate shootings", "url": "https://www.japantimes.co.jp/news/2026/09/27/world/crime-legal/south-africa-shooting/", "fonte_id": "japan_times", "data_pub": "2026-09-27T08:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A polícia sul-africana está buscando suspeitos após dois tiroteios que resultaram em 27 mortes. A violência de gangues e o crime organizado são problemas significativos no país, que possui uma das taxas de homicídio per capita mais altas do mundo.", "titulo_pt": "Polícia sul-africana procura suspeitos após 27 mortos em dois tiroteios", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 183486, "titulo": "At least 27 dead after two mass shootings in South Africa, police say", "url": "https://www.theguardian.com/world/2026/sep/27/mass-shootings-south-africa-johannesburg-cape-town", "fonte_id": "guardian_world", "data_pub": "2026-09-27T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dezenas de pessoas morreram em dois atos de tiroteio em massa em South Africa. Em Johannesburg, 17 pessoas foram mortas e 15 ficaram feridas em um ataque a um bar. Em Cape Town, 10 pessoas foram mortas em um incidente separado em um local de churrasco.", "titulo_pt": "Pelo menos 27 mortos após dois atos de tiroteio em massa na áfrica do sul, polícia relata", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 183444, "titulo": "Crime organizado: entre novas leis e a integração institucional", "url": "https://www.jota.info/opiniao-e-analise/artigos/crime-organizado-entre-novas-leis-e-a-integracao-institucional", "fonte_id": "jota", "data_pub": "2026-09-27T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Leis contra a facção criminosa, decretos e Proposta de Emenda à Constituição (PEC) estão avançando, mas a implementação de uma governança integrada para uma política de Estado ainda é necessária.", "titulo_pt": "Crime organizado: entre novas leis e a integração institucional", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 183278, "titulo": "Caso Isabelle Caracristi: o que falta esclarecer sobre a morte da jovem", "url": "https://www.metropoles.com/brasil/caso-isabelle-caracristi-o-que-falta-esclarecer-sobre-a-morte-da-jovem", "fonte_id": "metropoles", "data_pub": "2026-09-27T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A investigação sobre a morte da estudante Isabelle Caracristi se concentra em áudios enviados por ela antes de morrer, na ausência de câmeras no terraço onde supostamente ocorreu o incidente e no celular do namorado da vítima, que não foi localizado.", "titulo_pt": "Caso Isabelle Caracristi: o que falta esclarecer sobre a morte da jovem", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 183319, "titulo": "‘Ambulância aérea’ faz 50 transportes mensais e atende 6,8 milhões de vidas", "url": "https://www.cnnbrasil.com.br/saude/ambulancia-aerea-faz-50-transportes-mensais-e-atende-68-milhoes-de-vidas/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T06:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 'ambulância aérea' realiza cerca de 50 transportes mensais no Brasil, atendendo a 6,8 milhões de pessoas. O serviço é fundamental para o transporte de órgãos e tecidos, onde o tempo é crucial, com mais de 54 mil itens transportados desde 2014.", "titulo_pt": "‘Ambulância aérea’ faz 50 transportes mensais e atende 6,8 milhões de vidas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 183321, "titulo": "Mais de 37 mil brasileiros aguardam transplante de córnea; entenda cirurgia", "url": "https://www.cnnbrasil.com.br/saude/mais-de-37-mil-brasileiros-aguardam-transplante-de-cornea-entenda-cirurgia/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T06:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A fila de espera para transplantes de córnea no Brasil aumentou em 24% nos últimos seis meses. A cirurgia é realizada apenas com doações de tecidos após a morte do doador.", "titulo_pt": "Mais de 37 mil brasileiros aguardam transplante de córnea; entenda a cirurgia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 183719, "titulo": "Over 10,000 students left Korea’s top universities without graduating: data", "url": "https://www.koreaherald.com/article/10885255", "fonte_id": "korea_herald", "data_pub": "2026-09-27T05:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 10.700 alunos deixaram três das universidades mais prestigiadas da Coreia do Sul — Seul National University, Korea University e Yonsei University — sem concluir seus estudos nos últimos cinco anos, segundo dados do sistema de divulgação de educação superior da Coreia.", "titulo_pt": "Mais de 10.000 alunos deixaram universidades coreanas sem formar", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 183720, "titulo": "Domestic violence reports surge during Chuseok", "url": "https://www.koreaherald.com/article/10885254", "fonte_id": "korea_herald", "data_pub": "2026-09-27T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de denúncias de violência doméstica às autoridades policiais aumentou 42,4% durante o feriado de Chuseok em comparação com o nível diário médio atual. O aumento foi ainda mais significativo em relação ao feriado anterior, com um aumento de 13%.", "titulo_pt": "Relatos de violência doméstica aumentam durante o feriado de Chuseok", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 183701, "titulo": "In Malaysia, a mother’s love offers her trans daughter refuge", "url": "https://www.scmp.com/week-asia/people/article/3368824/malaysia-mothers-love-offers-her-trans-daughter-refuge?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-27T01:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma aldeia no entorno de Kota Bharu, no estado conservador de Kelantan, na nordeste de Malásia, Rozi, de 58 anos, tem aprendido a ignorar as críticas sobre sua filha transgênero, Hana. Rozi lutou para aceitar a transição de Hana, que retornou à casa após estudar e vive agora publicamente como uma mulher.", "titulo_pt": "Em malásia, o amor de uma mãe oferece refúgio à sua filha trans", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 182916, "titulo": "Tiro e sangue: dupla tenta executar rival próximo a creche no DF", "url": "https://www.metropoles.com/distrito-federal/tiro-e-sangue-dupla-tenta-matar-rival-proximo-a-creche-no-df", "fonte_id": "metropoles", "data_pub": "2026-09-26T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Segundo a corporação, uma dupla em moto efetuou tiros contra uma vítima perto de uma creche no Distrito Federal. A vítima conseguiu fugir e foi socorrida por moradores.", "titulo_pt": "Tiro e sangue: dupla em moto tenta executar rival perto de creche no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 182919, "titulo": "Mulher diz que é errado levar café em entrevista de emprego e revolta gen Z", "url": "https://www.metropoles.com/vida-e-estilo/mulher-diz-que-e-errado-levar-cafe-em-entrevista-de-emprego-e-revolta-gen-z", "fonte_id": "metropoles", "data_pub": "2026-09-26T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher afirmou em um vídeo viral que é incorreto levar café em entrevistas de emprego, gerando debate entre os jovens da geração Z. A declaração revoltou muitos membros da geração Z que questionam a atitude.", "titulo_pt": "Mulher diz que é errado levar café em entrevistas de emprego e revolta gen Z", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 183542, "titulo": "Thousands march for climate across France: 'I wish there were more of us, after the summer we've just had'", "url": "https://www.lemonde.fr/en/environment/article/2026/09/27/thousands-march-for-climate-across-france-i-wish-there-were-more-of-us-after-the-summer-we-ve-just-had_6757999_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-27T07:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em diversas cidades francesas, desde Bordéus até Paris, ocorreram 260 manifestações envolvendo 120 mil pessoas em prol do clima, da vida, da paz e da justiça social.", "titulo_pt": "Milhares marcham por clima em toda França: 'gostaria que houvessem mais de nós, depois do verão que passamos'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 183320, "titulo": "Onda de calor sufocante pode fazer temperatura passar dos 40ºC em 8 estados", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/onda-de-calor-sufocante-pode-fazer-temperatura-passar-dos-40oc-em-8-estados/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T06:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma onda de calor intensa está afetando 8 estados brasileiros, com previsão de temperatura acima dos 40ºC até a próxima quarta-feira (30). O fenômeno começou no sábado (26) e deve durar até o próximo dia 30, conforme previsão do Instituto Nacional de Meteorologia (Inmet).", "titulo_pt": "Onda de calor sufocante pode fazer temperatura passar dos 40ºc em 8 estados", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 183671, "titulo": "Nepal’s hydropower ambitions face climate reality check", "url": "https://www.japantimes.co.jp/environment/2026/09/27/energy/nepal-hydropower-focus/", "fonte_id": "japan_times", "data_pub": "2026-09-27T03:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 90% da eletricidade de Nepal vem da hidropotência, mas danos extensos aos seus projetos fluviais levantaram dúvidas sobre a segurança energética do país.", "titulo_pt": "Ambições de hidropotência de nepal enfrentam veredito da realidade climática", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 182461, "titulo": "Visitante tirou a proteção da colmeia para não perder pólen e soltou 26 enxames africanos, alterando a ecologia das Américas", "url": "https://www.cnnbrasil.com.br/curiosidades/visitante-tirou-a-protecao-da-colmeia-para-nao-perder-polen-e-soltou-26-enxames-africanos-alterando-a-ecologia-das-americas/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-26T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 1957, um visitante retirou a proteção de uma colmeia para coletar pólen, resultando na liberação de 26 enxames africanos. Essa ação alterou significativamente a ecologia das Américas, levando ao surgimento das abelhas africanizadas.", "titulo_pt": "Visitante retirou proteção de colmeia para coletar pólen e soltou 26 enxames africanos, mudando a ecologia das Américas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 182577, "titulo": "Amplían perímetro de seguridad en Nevados de Chillán por aumento de actividad volcánica", "url": "https://www.latercera.com/nacional/noticia/amplian-perimetro-de-seguridad-en-nevados-de-chillan-por-aumento-de-actividad-volcanica/", "fonte_id": "la_tercera", "data_pub": "2026-09-26T17:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O perímetro de segurança em torno dos Nevados de Chillán foi ampliado devido ao aumento da atividade volcânica, conforme informado pelo Senapred. A alerta técnica permanece em nível amarelo para o complexo volcânico.", "titulo_pt": "Aumento do perímetro de segurança em Nevados de Chillán devido à atividade volcânica", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 182548, "titulo": "Mientras se aguarda El Niño: sorpresa porque en la principal región agrícola hay un 70% de escasez y sequía", "url": "https://www.lanacion.com.ar/economia/campo/mientras-se-aguarda-el-nino-sorpresa-porque-en-la-principal-region-agricola-hay-un-70-de-escasez-y-nid25092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-26T17:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A região agrícola mais importante sofre com uma escassez e sequiça que afeta 70% das áreas, impactando os cultivos de trigo em desenvolvimento. De acordo com a Bolsa de Comércio de Rosario, a situação já está prejudicando as culturas.", "titulo_pt": "Enquanto se aguarda El Niño: surpresa pela escassez e sequiça na principal região agrícola", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 182403, "titulo": "Ary Fontoura pede ato emergencial na Amazônia após série de incêndios", "url": "https://www.metropoles.com/celebridades/ary-fontoura-pede-ato-emergencial-na-amazonia-apos-serie-de-incendios", "fonte_id": "metropoles", "data_pub": "2026-09-26T16:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ator Ary Fontoura utilizou as redes sociais para solicitar medidas emergenciais em face do aumento significativo de incêndios na Amazônia.", "titulo_pt": "Ary Fontoura pede ato emergencial na Amazônia após série de incêndios", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 182415, "titulo": "Outubro terá calor acima da média e chuvas irregulares em grande parte do Brasil", "url": "https://exame.com/brasil/outubro-tera-calor-acima-da-media-e-chuvas-irregulares-em-grande-parte-do-brasil/", "fonte_id": "exame", "data_pub": "2026-09-26T14:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A previsão do Inmet indica temperaturas até 2 °C acima da média em áreas do Centro-Oeste e Sudeste e chuvas irregulares em regiões produtoras.", "titulo_pt": "Outubro terá calor acima da média e chuvas irregulares em grande parte do Brasil", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 182432, "titulo": "Descoberta de caracóis com proteção incomum alerta para biodiversidade ameaçada em Montenegro", "url": "https://exame.com/ciencia/descoberta-de-caracois-com-protecao-incomum-alerta-para-biodiversidade-ameacada-em-montenegro/", "fonte_id": "exame", "data_pub": "2026-09-26T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pequenos caracóis de apenas 6 mm foram descobertos em Montenegro com um mecanismo incomum de proteção. Essa descoberta alerta para a biodiversidade ameaçada na região.", "titulo_pt": "Descoberta de caracóis com proteção incomum alerta para biodiversidade ameaçada em Montenegro", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 181657, "titulo": "A natureza que virou ativo nos imóveis de alto padrão", "url": "https://veja.abril.com.br/economia/a-natureza-que-virou-ativo-nos-imoveis-de-alto-padrao/", "fonte_id": "veja", "data_pub": "2026-09-26T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Imóveis de alto padrão estão incluindo pequenas florestas no projeto arquitetônico para reduzir o calor, absorver a água das chuvas e tornar as cidades mais agradáveis para se viver.", "titulo_pt": "A natureza que se tornou ativo nos imóveis de alto padrão", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 181683, "titulo": "Super El Niño e ondas de calor aumentam risco de encontros com serpentes; especialista ensina como reagir", "url": "https://www.cnnbrasil.com.br/ciencia/super-el-nino-e-ondas-de-calor-aumentam-risco-de-encontros-com-serpentes-especialista-ensina-como-reagir/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-26T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eventos climáticos extremos, como o Super El Niño, aumentam o risco de encontros com serpentes em áreas urbanas e rurais devido às mudanças no habitat dos animais. O calor intensificado também contribui para essa situação.", "titulo_pt": "Super El Niño e ondas de calor aumentam risco de encontros com serpentes; especialista ensina como reagir", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 182015, "titulo": "Climate rallies to be held across France on Saturday after record-breaking summer", "url": "https://www.lemonde.fr/en/environment/article/2026/09/26/climate-rallies-to-be-held-across-france-on-saturday-after-record-breaking-summer_6757975_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-26T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 260 manifestações estão programadas para todo o país no sábado, pedindo um plano de ação climática de emergência. Inicialmente organizadas por ativistas ambientais, essas protestos agora contam com o apoio de organizações sem fins lucrativos, sindicatos e partidos políticos.", "titulo_pt": "Rallys climáticos marcados para sábado em toda França após verão recorde", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 181712, "titulo": "Onda de calor no Brasil: como proteger a saúde durante o El Niño", "url": "https://exame.com/ciencia/onda-de-calor-no-brasil-como-proteger-a-saude-durante-o-el-nino/", "fonte_id": "exame", "data_pub": "2026-09-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "É necessário tomar cuidados além de beber água para proteger a saúde durante as ondas de calor, especialmente em períodos de El Niño. O artigo sugere maneiras de reduzir os riscos associados ao calor extremo.", "titulo_pt": "Onda de calor no Brasil: como proteger a saúde durante o El Niño", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 181714, "titulo": "Recicle perto de você: encontre as estações que pagam por recicláveis em São Paulo", "url": "https://exame.com/esg/recicle-perto-de-voce-encontre-as-estacoes-que-pagam-por-reciclaveis-em-sao-paulo/", "fonte_id": "exame", "data_pub": "2026-09-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Green Mining é uma iniciativa que já pagou R$ 6,8 milhões a mais de 6 mil trabalhadores da cadeia do lixo em São Paulo e em Embu das Artes. Ela possui sete unidades na capital paulista e uma em Embu das Artes, permitindo a localização das estações mais próximas no mapa.", "titulo_pt": "Recicle perto de você: encontre as estações que pagam por recicláveis em São Paulo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 182096, "titulo": "Disaster zone declared across Bangkok as heavy rain triggers flooding", "url": "https://www.aljazeera.com/news/2026/9/26/disaster-zone-declared-across-bangkok-as-heavy-rain-triggers-flooding?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-26T07:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cidade de Bangkok está sob estado de calamidade devido a chuvas constantes desde quinta-feira, que inundaram as ruas e canais, invadindo casas e estabelecimentos comerciais.", "titulo_pt": "Área de desastre declarada em Bangkok devido a fortes chuvas e inundações", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "meio_amb                 const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
