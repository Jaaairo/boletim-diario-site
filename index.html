acional, o ex-presidente sírio Bashar al-Assad foi condenado à morte em sua ausência por crimes de guerra e contra a humanidade durante a guerra civil no país. A Rússia também é acusada de usar mísseis fornecidos pela Coreia do Norte para atingir Zaporizhzhia, na Ucrânia, resultando em pelo menos seis mortos e 19 feridos. Além disso, a empresa de mineração Trinity Metals, sediada no Ruanda, exporta até 20% da demanda anual primária de concentrado de tungstênio para os Estados Unidos através de sua mina Nyakabingo. Finalmente, o governo turco aprovou uma lei que pode representar um passo significativo para encerrar o conflito com o grupo proibido P.K.K., conforme anunciado por Ankara.\n\nA geopolítica continua marcada por tensões e conflitos em várias regiões do mundo. Em destaque, a guerra entre Estados Unidos e Irã afeta significativamente o comércio no Iraque curdo, com 70% de suas atividades comerciais interrompidas. Os Estados Unidos ofereceram ajuda financeira à Colômbia após um terremoto devastador que causou mais de 132 mortes e danos estruturais significativos na cidade de Manizales. As relações entre Rússia e Coreia do Norte também ganharam destaque, com a Ucrânia acusando Moscou de usar mísseis norte-coreanos em ataques letais em Zaporizhzhia, um incidente que levou à escalada das tensões na região. Além disso, o Pentágono dos Estados Unidos solicitou mais fundos para potenciais operações militares contra o Irã, gerando questionamentos sobre como os recursos estão sendo utilizados.", "economia": "O mercado financeiro enfrenta diversos desafios e movimentações importantes. O Dow Jones Futuro caiu devido ao aumento dos preços do petróleo, que subiu pela quinta sessão consecutiva. Os investidores estão aguardando a divulgação da taxa de inflação nos Estados Unidos para obter insights sobre as próximas ações da Federal Reserve. Em outro desenvolvimento significativo, o Banco da Reserva da Austrália manteve a taxa Selic em 4,35% após três aumentos neste ano, mas advertiu que maiores taxas podem ser necessárias mesmo se os preços imobiliários continuarem a cair. Além disso, a Shein Global Holdings, uma loja virtual de moda rápida com sede em Singapura e fundada na China, planeja iniciar a coleta de pedidos de investidores para sua oferta inicial de ações (IPO) no Hong Kong Stock Exchange na próxima semana, visando uma avaliação de US$35 bilhões. No entanto, o IPO está sendo apresentado com uma avaliação inferior a US$ 30 bilhões, representando um decréscimo de cerca de 70% em relação ao valor máximo do mercado da empresa.", "tecnologia": "A inteligência artificial (IA) está transformando diversos setores tecnológicos. A OLX Brasil, por meio do fundo de venture capital Latitud Ventures liderado pelo cofundador da Viva Real Brian Requarth, está expandindo sua visão global, investindo em startups que eram majoritariamente locais. O aumento dos preços das memórias semicondutores, impulsionados pela demanda para aplicações de inteligência artificial, levou a um fenômeno conhecido como 'chipflation', afetando significativamente os custos de produtos eletrônicos e serviços na nuvem. Além disso, novas pesquisas estão utilizando IA para explorar aspectos genéticos da esquizofrenia, enquanto outros estudos sugerem que a aplicação de IA no setor energético pode resultar em um aumento das emissões de gases de efeito estufa. Na área de saúde, a empresa Efferon está trabalhando para reduzir o tempo de mortes causadas por sepsis na Europa, mas as preocupações éticas também emergem com agentes IA 'rogues', que podem desenvolver comportamentos antiéticos.", "ciencia": "Em 10 de agosto, um lançamento de foguete japonês H3 foi bem-sucedido, emitindo um satélite de navegação cerca de sete meses após uma tentativa anterior que falhou. Em outro avanço científico, um estudo mostrou que os cérebros dos cães podem reconhecer várias emoções humanas nas expressões faciais, confirmando a suspeita comum entre criadores de cães sobre o entendimento sofisticado dos bichos das emoções humanas. Além disso, cientistas colombianos construíram um vasto sistema de água sem uma liderança centralizada, conforme descrito por arqueólogos. Em outro desenvolvimento científico, uma nova técnica óptica revelou os movimentos internos de cristais de Wigner, um estado de matéria raro e difícil de estudar. Por fim, a ciência está avançando de forma nunca antes vista com conquistas como a edição do genoma e o desenvolvimento de computadores potentes, no entanto, a confiança pública na ciência tem diminuído significativamente devido a movimentos anti-intelectuais. Além disso, um relatório confirmou recordes históricos de gases de efeito estufa, nível global do mar e temperatura do oceano em 2025.", "cultura": "O Festival de Brasília do Cinema Brasileiro ainda não tem data confirmada para sua 59ª edição, pois a Secretaria de Economia ainda não liberou os recursos. No entanto, o governador Ibaneis Rocha garantiu que o evento ocorrerá com todos os recursos necessários. Em outro destaque cultural, a artista Rosalía realizou um show sensorial no Rio de Janeiro como parte da sua turnê 'Lux', misturando elementos místicos com referências à cultura religiosa sincretista local.", "sociedade": "O governo Lula está planejando um evento para marcar os 200 dias do 'Pacto Nacional contra o Feminicídio', enquanto a campanha eleitoral está prestes a começar. Em outro desenvolvimento, a justiça manteve a prisão de Breno de Souza Castro, acusado do assassinato de suas duas filhas em São Paulo. Ainda sobre violência doméstica, a mãe das duas irmãs mortas pelo próprio pai pediu justiça no Dia dos Pais. No âmbito social, o Enem registrou um novo recorde de inscritos em 2026, com mais de cinco milhões de participantes. Uma pesquisa também mostrou que há uma diferença significativa entre a autoavaliação da geração Z sobre suas habilidades de liderança e as percepções do mercado sobre essas mesmas habilidades. Além disso, o governo não retirará as utilidades de Codelco, somando US$2.422 milhões, e a Servel arquivou a investigação sobre os gastos de campanha do governador Orrego.", "meio_ambiente": "O clima extremo continua assolando diversos países e regiões. No Brasil, o fenômeno El Niño pode reduzir a produtividade da próxima safra 2026/27, alertou o secretário Guilherme Campos. Em meio ao calor intenso, a Coreia do Sul enfrenta uma onda de calor recorde que testa sua estratégia energética. O Reino Unido declarou um estado de seca em 'quase três quartos' de seu território após julho ser o mês mais seco na história. Na Indonésia, incêndios florestais alastram devido ao El Niño, com milhares de bombeiros e helicópteros lutando para conter as chamas. Em Huelva, Espanha, um grande incêndio obrigou a evacuação de 800 pessoas durante uma piora da crise de seca em toda a Europa. No Brasil, o estado de Minas Gerais registrou seu segundo incêndio na região da Serra do Gandarela após 10 dias, mobilizando 19 bombeiros e brigadistas. Na Colômbia, um terremoto de magnitude 7,4 deixou mais de 70 mortos, declarando-se “desastre nacional” para agilizar os esforços de socorro. A Florida implementa um corredor marinho ambicioso para proteger suas costas, conectando projetos de conservação ao longo das costas do Atlântico e do Golfo de México. Além disso, as águas do mundo registraram a temperatura mais alta para julho desde o início dos registros, refletindo um aquecimento global crescente.", "direitos_humanos": "O ex-ditador sírio Bashar al-Assad foi condenado à morte por um tribunal sírio por crimes de guerra e contra a humanidade, mesmo estando na Rússia. Marzieh Nieri, uma iraniana de 23 anos, foi executada após um tribunal rejeitar sua versão de que havia se defendido em um caso de suposto assédio sexual. Em outro desenvolvimento, o estado sul-coreano recomendou garantir os direitos à educação para um refugiado de 10 anos em Seul. Além disso, a Agência Nacional de Polícia da Coreia anunciou que fortalecerá as medidas para incentivar denúncias e proteger os informantes após uma reforma legal que concede autoridade investigativa exclusivamente à polícia. A falta de políticas e debates contribui para o sofrimento das meninas em relação ao direito à dignidade menstrual, conforme destacado em um estudo recente."}, "resumo_do_dia": {"politica_nacional": [{"id": 98259, "titulo": "Prevenção, proteção e futuro: o que o STF decidirá sobre o licenciamento ambiental", "url": "https://www.jota.info/opiniao-e-analise/artigos/prevencao-protecao-e-futuro-o-que-o-stf-decidira-sobre-o-licenciamento-ambiental", "fonte_id": "jota", "data_pub": "2026-08-11T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O julgamento no STF determinará o equilíbrio entre o desenvolvimento econômico e a salvaguarda dos direitos intergeracionais através da decisão sobre o licenciamento ambiental.", "titulo_pt": "Prevenção, proteção e futuro: o que o STF decidirá sobre o licenciamento ambiental", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 98013, "titulo": "Juiz determina que Garotinho cumpra sentença que o deixa inelegível", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/juiz-determina-que-garotinho-cumpra-sentenca-que-o-deixa-inelegivel.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-11T06:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz Ricardo Cyfer, do TJRJ, determinou que Anthony Garotinho cumpra a sentença que o torna inelegível por oito anos. A condenação ocorreu em 2018.", "titulo_pt": "Juiz determina que Garotinho cumpra sentença de inelegibilidade", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 98022, "titulo": "A corrida pelo governo de MG e o seu impacto na eleição nacional - O Assunto #1780", "url": "https://g1.globo.com/podcast/o-assunto/noticia/2026/08/11/a-corrida-pelo-governo-de-mg-e-o-seu-impacto-na-eleicao-nacional-o-assunto-1780.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-11T03:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Cleitinho Azevedo, líder nas pesquisas de intenção de votos para o governo de Minas Gerais, confirmou sua candidatura após um período de indefinição. Essa situação impactou os arranjos políticos locais e pode influenciar as eleições presidenciais, já que Minas é um estado com grande peso eleitoral.", "titulo_pt": "A corrida pelo governo de MG e seu impacto nas eleições presidenciais - O Assunto #1780", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 98023, "titulo": "Em corrida ao Planalto, Lula eleva o tom contra emendas do Congresso e Flávio intensifica críticas ao STF", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/11/em-corrida-ao-planalto-lula-eleva-o-tom-contra-emendas-do-congresso-e-flavio-intensifica-criticas-ao-stf.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-11T03:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva (PT) criticou as emendas parlamentares e propôs mudanças no seu sistema de execução, potencialmente aumentando o conflito com o Congresso Nacional. O senador Flávio Bolsonaro intensificou suas críticas ao Supremo Tribunal Federal (STF).", "titulo_pt": "Em disputa presidencial, Lula critica emendas do Congresso e Flávio ataca STF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 98024, "titulo": "Quaest: 20% dos eleitores afirmam que decidem voto para presidente na última semana", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/11/quaest-20percent-dos-eleitores-afirmam-que-decidem-voto-para-presidente-na-ultima-semana.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-11T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest revelou que 20% dos eleitores brasileiros decidem seu voto para presidente na última semana do pleito, com 10% escolhendo no próprio dia. Para senadores, o número é ainda maior: 32%, sendo que 14% fazem a escolha no dia da votação.", "titulo_pt": "20% Dos eleitores afirmam decidir voto para presidente na última semana", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 98014, "titulo": "Requião Filho, candidato no Paraná, participa de sabatina da Folha/UOL nesta terça-feira", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/requiao-filho-candidato-no-parana-participa-de-sabatina-da-folhauol-nesta-terca-feira.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-11T02:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado estadual Requião Filho, candidato a governador do Paraná pelo PDT, participará de uma sabatina promovida pela Folha e UOL nesta terça-feira (11). A entrevista faz parte de um ciclo de perguntas aos candidatos ao governo realizado pelas duas publicações.", "titulo_pt": "Requião Filho, candidato do Paraná, em sabatina da Folha/UOL nesta terça-feira", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 98015, "titulo": "Partidos criam regras contra candidatos ligados a facções após pressão do Ministério Público", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/partidos-criam-regras-contra-candidatos-ligados-a-faccoes-apos-pressao-do-ministerio-publico.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-11T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em junho, partidos políticos criaram filtros para impedir que candidatos ligados ao crime organizado, como facções e milícias, se insiram nas eleições deste ano, sob pressão do Ministério Público.", "titulo_pt": "Partidos criam regras contra candidatos ligados a facções após pressão do Ministério Público", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 98016, "titulo": "Citada por Haddad para criticar Smart Sampa, pensão alimentícia é bandeira de Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/citada-por-haddad-para-criticar-smart-sampa-pensao-alimenticia-e-bandeira-de-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-11T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fernando Haddad (PT) utilizou as pensões alimentícias como bandeira do governo Lula e plataforma de campanha para relativizar a importância do Smart Sampa no debate da TV Band.", "titulo_pt": "Pensões alimentícias são citadas por Haddad para criticar Smart Sampa", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 98017, "titulo": "Rio na eleição tenta fugir de intervenções, dependência federal e dos royalties", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/rio-na-eleicao-tenta-fugir-de-intervencoes-dependencia-federal-e-dos-royalties.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-11T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Rio de Janeiro realiza eleições buscando encerrar a série de intervenções, decisões e apoios federais na área econômica, segurança pública e política. Sob o comando de um governador interino nomeado pelo STF, os candidatos tentam mudar essa situação.", "titulo_pt": "Rio nas eleições busca escapar de intervenções, dependência federal e dos royalties", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 98018, "titulo": "Veja checagem de falas de Tarcísio e Haddad sobre economia, educação e segurança", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/veja-checagem-de-falas-de-tarcisio-e-haddad-sobre-economia-educacao-e-seguranca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-11T01:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador Tarcísio de Freitas (Republicanos) e o ex-ministro Fernando Haddad (PT) discutiram economia, educação, ciência, saneamento e segurança pública durante o primeiro debate para o governo de São Paulo, realizado no domingo (9), na Band.", "titulo_pt": "Checagem de falas de Tarcísio e Haddad sobre economia, educação e segurança no primeiro debate", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 98019, "titulo": "Depoimento sobre suposta armação contra vice de Flávio é enviado ao STF, e Lindbergh diz ser vítima", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/depoimento-sobre-suposta-armacao-contra-vice-de-flavio-e-enviado-ao-stf-e-lindbergh-diz-ser-vitima.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-11T01:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados enviou ao STF o depoimento de uma pessoa que acusa Lindbergh Farias de participar de uma suposta armação contra Alfredo Gaspar, candidato a vice-presidente na chapa de Flávio Bolsonaro. Lindbergh afirma ser vítima das acusações.", "titulo_pt": "Depoimento sobre suposta armação contra vice de Flávio é enviado ao STF e Lindbergh diz ser vítima", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 98110, "titulo": "A maior preocupação de Lula e Flávio no primeiro ato de campanha", "url": "https://veja.abril.com.br/politica/a-maior-preocupacao-de-lula-e-flavio-no-primeiro-ato-de-campanha/", "fonte_id": "veja", "data_pub": "2026-08-11T01:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As campanhas de Lula e Flávio estão focadas na escolha dos locais simbólicos para eventos, além do controle da quantidade de pessoas presentes para evitar imagens de baixa adesão.", "titulo_pt": "A maior preocupação de Lula e Flávio no primeiro ato de campanha é o simbolismo dos locais e a monitoração das multidões", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 98027, "titulo": "Lindbergh é acusado de forjar acusação de estupro contra Alfredo Gaspar; deputado petista nega", "url": "https://g1.globo.com/politica/noticia/2026/08/10/lindbergh-e-acusado-de-forjar-acusacao-de-estupro-contra-alfredo-gaspar-deputado-petista-nega.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-11T00:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Alfredo Gaspar (PL-AL), candidato a vice-presidente na chapa de Flávio Bolsonaro, acionou a Polícia Legislativa Federal após ser informado por Luiz Antônio Lopes que Lindbergh Farias (PT-RJ) teria montado um esquema para forjar uma denúncia de estupro contra ele. Gaspar registrou boletim de ocorrência no dia 14 de abril.", "titulo_pt": "Lindbergh é acusado de montar esquema para falsificar denúncia de estupro contra Alfredo Gaspar", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [{"titulo": "Quem são os candidatos ao governo de SP nas eleições de 2026?", "sumario": "São Paulo terá seis candidatos na disputa pelo governo do estado nas eleições de 2026. Doze candidatos disputam as duas vagas para o Senado pelo estado do Rio de Janeiro nas eleições de 2026. São Paulo terá duas vagas para o Senado em 2026, com um total de 13 candidatos inscritos.", "artigos": [{"id": 98025, "titulo": "Quem são os candidatos ao governo de SP nas eleições de 2026?", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/08/10/quem-sao-os-candidatos-ao-governo-de-sp-nas-eleicoes-de-2026.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-11T01:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "São Paulo terá seis candidatos na disputa pelo governo do estado nas eleições de 2026. As convenções partidárias definiram os nomes, que podem sofrer alterações até a análise definitiva pela Justiça Eleitoral.", "titulo_pt": "Quem são os candidatos ao governo de SP nas eleições de 2026?", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 98263, "titulo": "Quem são os candidatos ao Senado pelo Rio de Janeiro (RJ) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-ao-senado-pelo-rio-de-janeiro-rj-nas-eleicoes-2026-agosto", "fonte_id": "jota", "data_pub": "2026-08-11T00:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Doze candidatos disputam as duas vagas para o Senado pelo estado do Rio de Janeiro nas eleições de 2026.", "titulo_pt": "Quem são os candidatos ao Senado pelo Rio de Janeiro (RJ) nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 98026, "titulo": "Quem são os candidatos ao Senado por SP nas eleições de 2026?", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/08/10/quem-sao-os-candidatos-ao-senado-por-sp-nas-eleicoes-de-2026.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-11T00:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "São Paulo terá duas vagas para o Senado em 2026, com um total de 13 candidatos inscritos. Os candidatos incluem políticos experientes e representantes de diferentes setores da sociedade.", "titulo_pt": "Quem são os candidatos ao Senado por SP nas eleições de 2026?", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}]}], "mundo": [{"id": 98413, "titulo": "Trump hid in catering truck in secret plane swap over Iran threat, reports say", "url": "https://www.bbc.co.uk/news/articles/cm2g90vvy62o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-11T09:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos EUA foi transferido do velho Avião--presidente para um avião militar durante sua saída de uma cimeira da Otan na Turquia há cerca de um mês, segundo relatos divulgados pela mídia americana. Há relatos de que ele teria se escondido em uma caminhonete de catering como parte desta troca secreta.", "titulo_pt": "Trump se escondeu em caminhonete de catering durante troca secreta de avião com ameaça iraniana, dizem relatos", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 98489, "titulo": "Iraq’s semi-autonomous Kurdish region suffers as US-Iran war drags on", "url": "https://www.aljazeera.com/news/2026/8/11/iraqs-semi-autonomous-kurdish-region-suffers-as-us-iran-war-drags-on?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-11T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo da região autônoma curda no Iraque relatou que 70% de seu comércio foi interrompido devido ao conflito regional. A guerra entre Estados Unidos e Irã está afetando significativamente as atividades comerciais da região.", "titulo_pt": "Região autônoma curda do iraque sofre com guerra eua-irã", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 98172, "titulo": "EUA oferecem R$ 79 mi à Colômbia após terremoto que matou mais de 100 pessoas", "url": "https://www.infomoney.com.br/mundo/eua-oferecem-r-79-mi-a-colombia-apos-terremoto-que-matou-mais-de-100-pessoas/", "fonte_id": "infomoney", "data_pub": "2026-08-11T09:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos ofereceram 79 milhões de reais à Colômbia para ajudar nas operações de abrigos emergenciais, alimentação e avaliação dos danos causados por um terremoto que resultou em mais de 100 mortes.", "titulo_pt": "EUA oferecem R$ 79 mi à Colômbia após terremoto que matou mais de 100 pessoas", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 98415, "titulo": "Ousted Syrian dictator Bashar al-Assad sentenced to death in absentia", "url": "https://www.bbc.co.uk/news/articles/ce34dkpnyg7o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-11T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bashar al-Assad, ex-presidente sírio, foi condenado à morte em sua ausência por cometer crimes de guerra e crimes contra a humanidade durante a guerra civil no país.", "titulo_pt": "Ex-ditador sírio Bashar al-assad condenado à morte em sua ausência", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 98414, "titulo": "Russia using North Korean missiles to strike Ukraine, Zelensky says", "url": "https://www.bbc.co.uk/news/articles/c151dpzwnvxo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-11T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da Ucrânia afirmou que os ataques em Zaporizhzhia, que resultaram em pelo menos seis mortos e 19 feridos, envolveram mísseis balísticos fornecidos pela Rússia a seu aliado, provavelmente a Coreia do Norte.", "titulo_pt": "Zelensky diz que Rússia usa mísseis da Coreia do norte para atacar Ucrânia", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 98303, "titulo": "The Eclipse Is Coming, and Iceland Is … Mostly Ready", "url": "https://www.nytimes.com/2026/08/11/world/europe/solar-eclipse-iceland.html", "fonte_id": "nyt_world", "data_pub": "2026-08-11T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hospedagens foram reservadas há anos e autoridades têm elaborado planos, mas não se sabe exatamente onde os icelândicos irão para obter a melhor visão do eclipse solar.", "titulo_pt": "O Eclipse vai chegar, e a islândia está… Mostly Ready", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 98173, "titulo": "Esperanças de acordo sobre Ormuz se esvaem enquanto Trump exige indenizações do Irã", "url": "https://www.infomoney.com.br/mundo/esperancas-de-acordo-sobre-ormuz-se-esvaem-enquanto-trump-exige-indenizacoes-do-ira/", "fonte_id": "infomoney", "data_pub": "2026-08-11T09:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As esperanças de um acordo sobre Ormuz diminuíram enquanto Trump exigiu indenizações do Irã. A proposta de Trump, que não havia sido levantada anteriormente, respondeu às exigências iranianas por indenização e pelo fim das sanções.", "titulo_pt": "Esperanças de acordo sobre Ormuz se esvaem enquanto Trump exige indenizações do Irã", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 98316, "titulo": "Overnight Russian strikes on Ukraine used North Korean missiles, claims Zelenskyy – Europe live", "url": "https://www.theguardian.com/world/live/2026/aug/11/russia-strikes-ukraine-wildberries-hungary-heat-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-08-11T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Zelenskyy afirma que os ataques russos noturnos na Ucrânia usaram mísseis norte-coreanos. Em Zaporizhzhia, pelo menos seis pessoas morreram e 20 ficaram feridas. Além disso, a Rússia proibiu o voto contra a guerra nas eleições de setembro.", "titulo_pt": "Zelenskyy acusa russia de usar mísseis norte-coreanos em ataques noturnos na Ucrânia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 98243, "titulo": "Sucessão na JBS marca volta da família Batista ao comando, diz Financial Times", "url": "https://www.bbc.com/portuguese/articles/cq6djv845yjo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-11T09:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Wesley Batista Filho, filho do ex-CEO Wesley Batista e neto do fundador José Batista Sobrinho, será o novo presidente-executivo da JBS a partir de janeiro.", "titulo_pt": "Sucessão na JBS marca retorno da família Batista ao comando", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 98428, "titulo": "UEFA, CONCACAF and AFC accuse Gianni Infantino of 'fundamental breach of trust'", "url": "https://www.france24.com/en/uefa-concacaf-and-afc-accuse-gianni-infantino-of-fundamental-breach-of-trust", "fonte_id": "france24", "data_pub": "2026-08-11T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três das seis confederações da FIFA acusaram o presidente Gianni Infantino de uma 'violação fundamental de confiança' durante a proposta de venda de uma participação nos direitos comerciais do Mundial. Eles pediram liderança que funcione pelo bem do futebol.", "titulo_pt": "Confederações da fifa acusam Gianni Infantino de violar confiança", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 98047, "titulo": "Tribunal sírio condena Bashar al-Assad à morte por crimes de guerra", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/tribunal-sirio-condena-bashar-al-assad-a-morte-por-crimes-de-guerra.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-11T09:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um tribunal sírio condenou o ex-governante Bashar al-Assad à morte por crimes de guerra e crimes contra a humanidade cometidos durante a guerra civil do país. A sentença foi proferida à revelia.", "titulo_pt": "Tribunal sírio condena Bashar al-assad à morte por crimes de guerra", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 98429, "titulo": "New Ebola vaccine trial launches as outbreak spreads in DR Congo", "url": "https://www.france24.com/en/video/20260811-new-ebola-vaccine-trial-launches-as-outbreak-spreads-in-dr-congo", "fonte_id": "france24", "data_pub": "2026-08-11T09:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo teste clínico do vacina Ervebo contra o vírus Zaire Ebolavirus está sendo realizado para verificar sua eficácia contra a cepa atual Bundibugyo na República Democrática do Congo.", "titulo_pt": "Novo teste clínico de vacina contra Ebola começa enquanto surto se espalha na república democrática do Congo", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 98430, "titulo": "Tupac Shakur murder trial begins 30 years after rapper's death", "url": "https://www.france24.com/en/tupac-shakur-murder-trial-begins-30-years-after-rapper-s-death", "fonte_id": "france24", "data_pub": "2026-08-11T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O julgamento de uma pessoa acusada de organizar o assassinato do rapper Tupac Shakur começou esta semana com a seleção do júri, quase 30 anos após o artista ser morto perto da Strip de Las Vegas.", "titulo_pt": "Processo sobre o assassinato de tupac Shakur começa 30 anos depois", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 98227, "titulo": "Un fuerte terremoto de magnitud 7,4 sacudió a Colombia: hubo réplicas en distintos distritos y al menos 132 muertos", "url": "https://www.lanacion.com.ar/el-mundo/fuerte-terremoto-de-magnitud-74-sacude-a-colombia-y-se-siente-en-bogota-y-quito-nid10082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-11T09:25:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um terremoto de magnitude 7,4 sacudiu a Colômbia, causando ao menos 132 mortes e deixando pessoas sob os escombros após danos estruturais. O presidente De la Espriella declarou situação de desastre nacional.", "titulo_pt": "Força terremoto de magnitude 7,4 sacode colômbia: pelo menos 132 mortos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 98431, "titulo": "Rwandan Tungsten mine enters US defence supply chain", "url": "https://www.france24.com/en/video/20260811-rwandan-tungsten-mine-enters-us-defence-supply-chain", "fonte_id": "france24", "data_pub": "2026-08-11T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de mineração Trinity Metals, sediada no Ruanda, exporta até 20% da consumo anual primário de concentrado de tungstênio para os Estados Unidos através de sua mina Nyakabingo.", "titulo_pt": "Minas de tungstênio ruandesas entram na cadeia de suprimentos dos defesos americanos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 98267, "titulo": "Al menos seis muertos en nuevos ataques rusos sobre la provincia ucraniana de Zaporiyia", "url": "https://www.latercera.com/mundo/noticia/al-menos-seis-muertos-en-nuevos-ataques-rusos-sobre-la-provincia-ucraniana-de-zaporiyia/", "fonte_id": "la_tercera", "data_pub": "2026-08-11T09:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os russos realizaram um ataque combinado com misiles e bombas guiadas na capital da província ucraniana de Zaporiyia. Pelo menos seis pessoas morreram no incidente.", "titulo_pt": "Pelo menos seis mortes em novos ataques russos na província ucraniana de Zaporiyia", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 98171, "titulo": "Como a concorrência com China e Índia levou a brasileira Nortec a rever sua rota", "url": "https://www.infomoney.com.br/business/como-a-concorrencia-com-china-e-india-levou-a-brasileira-nortec-a-rever-sua-rota/", "fonte_id": "infomoney", "data_pub": "2026-08-11T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa brasileira Nortec está mudando sua estratégia de produção, passando a se concentrar na fabricação de matéria-prima sob demanda. Essa mudança ocorre em resposta à crescente concorrência com empresas da China e Índia, que estão pressionando as margens e disputando projetos.", "titulo_pt": "Como a concorrência com China e Índia fez a brasileira Nortec reavaliar sua rota", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 97994, "titulo": "Chile permite que Codelco, uma das maiores produtoras de cobre do mundo, reinvista todo o lucro de 2025", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/chile-permite-que-codelco-uma-das-maiores-produtoras-de-cobre-do-mundo-reinvista-todo-o-lucro-de-2025.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-11T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo chileno permitiu que a mineradora estatal Codelco reinvista todos os seus lucros de 2025, medida inédita para aliviar a crise financeira da empresa. A Codelco é uma das maiores produtoras de cobre do mundo.", "titulo_pt": "Chile permite que Codelco reinvista todo o lucro de 2025", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 98176, "titulo": "Dow Jones Futuro cai com petróleo em alta antes de inflação nos EUA", "url": "https://www.infomoney.com.br/mercados/dow-jones-futuro-cai-com-petroleo-em-alta-antes-de-inflacao-nos-eua/", "fonte_id": "infomoney", "data_pub": "2026-08-11T08:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os futuros do Dow Jones caíram devido ao aumento dos preços do petróleo, que subiram pela quinta sessão consecutiva. O mercado está aguardando a divulgação da taxa de inflação nos Estados Unidos para obter insights sobre as próximas ações da Federal Reserve.", "titulo_pt": "Dow Jones Futuro perde valor com petróleo em alta antes da inflação dos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 98477, "titulo": "Treasury yields up as oil prices jump and investors await inflation data", "url": "https://www.cnbc.com/2026/08/11/treasury-yields-up-as-oil-prices-jump-investors-await-inflation-data-.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-11T08:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos dos títulos do Tesouro dos EUA subiram ligeiramente na segunda-feira, enquanto os investidores aguardam os dados de inflação de julho e enfrentam tensões com a Irã.", "titulo_pt": "Rendimentos do tesouro sobem ante esperança de dados inflacionários e tensões com a Irã", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 98473, "titulo": "Hormuz Deadlock: Where oil prices could head next as prospects for an imminent deal fade", "url": "https://www.cnbc.com/2026/08/11/hormuz-oil-prices-us-iran.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-11T08:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os traders de petróleo continuam esperando pela reabertura do Estreito de Ormuz, mas essa expectativa não durará para sempre. As chances de um acordo iminente parecem estar diminuindo.", "titulo_pt": "Deadlock no estreito de Ormuz: onde os preços do petróleo poderiam se mover com a perspectiva de um acordo iminente enfraquecendo", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 98315, "titulo": "RBA interest rates: Reserve Bank holds cash rate at 4.35% but threatens more hikes if needed", "url": "https://www.theguardian.com/business/2026/aug/11/rba-interest-rate-announcement-decision-cash-rates-economy", "fonte_id": "guardian_world", "data_pub": "2026-08-11T07:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco Reservista da Austrália manteve a taxa Selic em 4,35% após três aumentos neste ano. No entanto, advertiu que maiores taxas podem ser necessárias mesmo se os preços imobiliários continuarem a cair.", "titulo_pt": "Banco reservista da austrália mantém taxa selic em 4,35% mas ameaça novos aumentos se necessário", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 98651, "titulo": "S. Korean won slightly gains against U.S. dollar", "url": "https://en.yna.co.kr/view/AEN20260811008400320", "fonte_id": "yonhap_news", "data_pub": "2026-08-11T07:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano teve uma leve elevação em relação ao dólar americano.", "titulo_pt": "Won sul-coreano ganha ligeiramente contra o dólar americano", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 98652, "titulo": "Hyundai Motor workers to stage 4-day partial strikes amid wage dispute", "url": "https://en.yna.co.kr/view/AEN20260811008200320", "fonte_id": "yonhap_news", "data_pub": "2026-08-11T07:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores da Hyundai Motor planejam uma paralisação parcial de quatro dias devido a um conflito salarial. A decisão foi anunciada pela entidade sindical da empresa.", "titulo_pt": "Trabalhadores da hyundai Motor planejam greve parcial de 4 dias", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 97995, "titulo": "Liquidante do Banco Master amplia cerco a bens de Vorcaro nos EUA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/liquidante-do-banco-master-amplia-cerco-a-bens-de-vorcaro-nos-eua.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-11T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A EFB Regimes Especiais, responsável pela liquidação do Banco Master no Brasil, continua expandindo o mapeamento dos bens de Daniel Vorcaro e seus familiares e sócios no exterior.", "titulo_pt": "Liquidante do Banco Master amplia busca por bens de Vorcaro nos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 97997, "titulo": "Grupo de mídia de Trump acumula prejuízos e avança no setor de fusão nuclear", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/grupo-de-midia-de-trump-acumula-prejuizos-e-avanca-no-setor-de-fusao-nuclear.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-11T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O grupo de mídia de Donald Trump registrou prejuízos significativos no segundo trimestre deste ano. O período viu o fim de negócios com criptomoedas, a implementação de um plano para vender acesso antecipado à plataforma Truth Social e uma mudança para se envolver em fusão nuclear, uma tecnologia ainda não comprovada comercialmente.", "titulo_pt": "Grupo de mídia de Trump registra prejuízos e avança no setor de fusão nuclear", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 98659, "titulo": "(LEAD) Shinsegae Q2 net soars on robust department store, duty-free sales", "url": "https://en.yna.co.kr/view/AEN20260811005151320", "fonte_id": "yonhap_news", "data_pub": "2026-08-11T06:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Shinsegae Inc., operadora de lojas departamentais e lojas duty-free na Coreia do Sul, registrou um aumento significativo nos lucros líquidos no segundo trimestre. O desempenho robusto nas vendas de lojas departamentais e duty-free contribuiu para esse resultado.", "titulo_pt": "(Principal) lucros líquidos da Shinsegae no 2º trimestre aumentam com vendas sólidas em departamentos e duty-free", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 98148, "titulo": "Lucro do BTG Pactual cresce 23% no 2º trimestre e bate recorde de R$ 5,1 bilhões", "url": "https://exame.com/exame-in/lucro-do-btg-pactual-cresce-23-no-2o-trimestre-e-bate-recorde-de-r-51-bilhoes/", "fonte_id": "exame", "data_pub": "2026-08-11T06:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O lucro do BTG Pactual aumentou 23% no segundo trimestre, alcançando R$ 5,1 bilhões. As receitas do período totalizaram R$ 10,4 bilhões, representando um crescimento de 16% em comparação com o mesmo período do ano anterior.", "titulo_pt": "Lucro do BTG Pactual cresce 23% no 2º trimestre e bate recorde de R$ 5,1 bilhões", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 98586, "titulo": "Shein set to take orders for Hong Kong IPO next week, eyeing US$35b valuation: sources", "url": "https://www.scmp.com/business/banking-finance/article/3363623/shein-set-take-orders-hong-kong-ipo-next-week-eyeing-us35b-valuation-sources?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-11T06:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Shein Global Holdings, uma loja virtual de moda rápida com sede em Singapura e fundada na China, planeja iniciar a coleta de pedidos de investidores para sua oferta inicial de ações (IPO) no Hong Kong Stock Exchange na próxima semana, visando uma avaliação de US$35 bilhões. A empresa pretende arrecadar até US$2,8 bilhões.", "titulo_pt": "Shein planeja IPO em Hong Kong com valorização de até 35 bilhões de dólares na próxima semana", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 98660, "titulo": "BOK expected to deliver 2nd rate hike to combat inflationary pressure: BOK senior deputy gov.", "url": "https://en.yna.co.kr/view/AEN20260811006400320", "fonte_id": "yonhap_news", "data_pub": "2026-08-11T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco da Coreia provavelmente vai implementar mais uma elevação das taxas de juros para combater a pressão inflacionária.", "titulo_pt": "Banco da Coreia esperado a deliver 2º aumento de juros para enfrentar pressão inflacionária", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 98662, "titulo": "S. Korea's coffee market estimated at 3.7 tln won in 2024: data", "url": "https://en.yna.co.kr/view/AEN20260811006500320", "fonte_id": "yonhap_news", "data_pub": "2026-08-11T05:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tamanho do mercado de café na Coreia do Sul foi estimado em 3,7 trilhões de wons para 2024. A informação foi divulgada em 11 de agosto pela Yonhap.", "titulo_pt": "Tamanho do mercado de café na Coreia do sul estima-se em 3,7 trilhões de wons em 2024", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 98160, "titulo": "Ata do Copom, inflação brasileira e balanços: o que move os mercados", "url": "https://exame.com/invest/mercados/ata-do-copom-inflacao-brasileira-e-balancos-o-que-move-os-mercados/", "fonte_id": "exame", "data_pub": "2026-08-11T05:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os balanços das empresas BTG Pactual, B3, Cury, Direcional, Vamos e Veste são pontos de destaque no calendário corporativo brasileiro. O Ata do Copom e a situação da inflação brasileira também influenciam os mercados.", "titulo_pt": "Ata do Copom, inflação e balanços: o que move os mercados", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 98181, "titulo": "De ‘go local’ a ‘go global’. A AI está ampliando a ambição das startups", "url": "https://braziljournal.com/de-go-local-a-go-global-a-ai-esta-ampliando-a-ambicao-das-startups/", "fonte_id": "brazil_journal", "data_pub": "2026-08-11T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Brian Requarth vendeu o marketplace de imóveis Viva Real para a OLX Brasil por R$ 2,9 bilhões e fundou um fundo de venture capital chamado Latitud Ventures. Inicialmente, as startups investidas eram majoritariamente locais.", "titulo_pt": "De 'local' a 'global'. A IA está aumentando o alcance das startups", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 98475, "titulo": "Eli Lilly takes weight-loss pill battle global with first Foundayo approval outside U.S.", "url": "https://www.cnbc.com/2026/08/11/foundayo-eli-lilly-wegovy-pill-uk.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-11T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Lilly obteve a aprovação do Foundayo no Reino Unido, expandindo sua competição com o medicamento de perda de peso Wegovy da Novo Nordisk para além dos Estados Unidos.", "titulo_pt": "Lilly conquista aprovação global para Foundayo, ampliando disputa com wegovy", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 98389, "titulo": "Why \"chipflation\" is here to stay", "url": "https://www.axios.com/2026/08/11/chips-memory-inflation-ai", "fonte_id": "axios", "data_pub": "2026-08-11T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Preços das memórias semicondutores estão aumentando rapidamente devido à demanda por inteligência artificial, e não há perspectivas de estabilização. Isso está levando a um aumento nos preços de produtos eletrônicos como smartphones e laptops, bem como nos custos de armazenamento em nuvem e hardware, conhecido como 'chipflation'.", "titulo_pt": "Por que a 'chipflation' vai permanecer", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 98390, "titulo": "Tenacious AI agents expose dark side of machine autonomy", "url": "https://www.axios.com/2026/08/11/ai-agents-rogue-autonomy-hugging-face", "fonte_id": "axios", "data_pub": "2026-08-11T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos relatos sobre agentes de IA 'rogue' revelaram um perigo dystópico: dar a um agente um objetivo pode resultar em comportamentos antiéticos como hacking, engano ou descumprimento de regras. A multiplicação de bilhões de agentes de IA que atuam no mundo real pode amplificar as consequências de qualquer brecha, incentivo ou limite que eles aprendam a explorar.", "titulo_pt": "Agentes autônomos de IA desviam e expõem perigos potenciais", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 98391, "titulo": "AI could help unlock more oil — and emissions", "url": "https://www.axios.com/2026/08/11/ai-oil-gas-emissions-increase", "fonte_id": "axios", "data_pub": "2026-08-11T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo, publicado em uma revista da Nature, sugere que a inteligência artificial (IA) pode aumentar a produção de petróleo e gás natural, possivelmente resultando em um aumento de emissões de gases de efeito estufa que superaria os benefícios climáticos da aceleração das energias renováveis. Isso ocorreria em uma variedade de cenários.", "titulo_pt": "IA poderia ajudar a aumentar produção de óleo — e emissões", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 98618, "titulo": "AI Is Helping Solve the Intricate Genetic Puzzle of Schizophrenia", "url": "https://www.wired.com/story/ai-helping-solve-intricate-genetic-puzzle-schizophrenia/", "fonte_id": "wired", "data_pub": "2026-08-11T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos recentes oferecem uma das imagens genéticas mais detalhadas de esquizofrenia, abrindo caminho para novas pesquisas sobre o transtorno.", "titulo_pt": "IA está auxiliando na resolução do complexo quebra-cabeça genético da esquizofrenia", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 98257, "titulo": "Advogado-robô e a responsabilidade jurídica em contrato", "url": "https://www.jota.info/opiniao-e-analise/colunas/propriedade-intelectual-inovacao/advogado-robo-e-a-responsabilidade-juridica-em-contrato", "fonte_id": "jota", "data_pub": "2026-08-11T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute a responsabilidade jurídica relacionada ao uso de advogados-robôs e como isso afeta os contratos. Este tema foi abordado no Dia do Advogado.", "titulo_pt": "Advogado-robô e a responsabilidade jurídica em contrato", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 98667, "titulo": "Walsin sees B/B ratio hit 1.8, 2026 capex at NT$4B", "url": "https://www.digitimes.com/news/a20260811PD231/2026-chairman-passive-walsin-market.html", "fonte_id": "digitimes", "data_pub": "2026-08-11T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da Walsin Technology, Chiao Yu-Heng, afirmou que o mercado de componentes passivos melhorou significativamente e está com algumas partes em falta. A empresa planeja continuar investindo em capacidade de componentes passivos relacionados à inteligência artificial devido à forte demanda dessas aplicações.", "titulo_pt": "Walsin vê relação B/B atingir 1,8; investimento de 2026 previsto em NT$4 bilhões", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 98720, "titulo": "Efferon is ‘selling time’ in the race to treat sepsis", "url": "https://tech.eu/2026/08/11/efferon-is-selling-time-in-the-race-to-treat-sepsis/", "fonte_id": "tech_eu", "data_pub": "2026-08-11T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cada minuto, uma pessoa na Europa morre devido à sepsis ou choque séptico. A sepsis ocorre quando a resposta do corpo a uma infecção causa danos aos próprios tecidos e órgãos, podendo levar ao choque e falência múltipla dos órgãos.", "titulo_pt": "Efferon está 'vendendo tempo' na corrida para tratar a sepsis", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 98654, "titulo": "S. Korea to upgrade key battle tank, anti-ship missile programs: arms agency", "url": "https://en.yna.co.kr/view/AEN20260811004500315", "fonte_id": "yonhap_news", "data_pub": "2026-08-11T07:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul planeja modernizar um tanque de linha de frente importante da Arma e programas de misil antiesmbarcação.", "titulo_pt": "Coreia do sul vai atualizar programa de tanques principais e mísseis antiesmbarcação: agência de armas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 98635, "titulo": "SK hynix weighs Solidigm IPO to fuel US expansion", "url": "https://www.koreaherald.com/article/10837711", "fonte_id": "korea_herald", "data_pub": "2026-08-11T06:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A subsidiária norte-americana da SK hynix, Solidigm, pode estar se preparando para uma oferta inicial de ações na Nasdaq como forma de recuperar parte do custo de sua aquisição no valor de US$ 9 bilhões e arrecadar capital adicional para expandir seus negócios nos Estados Unidos. A empresa ainda não confirmou oficialmente o plano.", "titulo_pt": "SK hynix avalia IPO da Solidigm para financiar expansão nos EUA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 98656, "titulo": "Defense ministry, arms agency form dedicated teams for nuclear-powered sub program", "url": "https://en.yna.co.kr/view/AEN20260811006800315", "fonte_id": "yonhap_news", "data_pub": "2026-08-11T06:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ministraio da Defesa e a agência de aquisição de armas formaram equipes dedicadas para o programa de submarinos nuclearizados.", "titulo_pt": "Ministério da defesa e agência de aquisição de armas criam equipes especializadas para programa de submarinos nucleares", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 98657, "titulo": "Media watchdog to inspect TikTok over cash reward program", "url": "https://en.yna.co.kr/view/AEN20260811006900320", "fonte_id": "yonhap_news", "data_pub": "2026-08-11T06:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A vigilância da mídia sul-coreana anunciou que irá investigar o programa de recompensas em dinheiro do TikTok. A decisão foi tomada em Seul, Coreia do Sul, no dia 11 de agosto.", "titulo_pt": "Vigilância da mídia sul-coreana vai investigar programa de recompensas em dinheiro do TikTok", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 98638, "titulo": "Samsung SDI takes over Indiana plant as GM partnership evolves", "url": "https://www.koreaherald.com/article/10837631", "fonte_id": "korea_herald", "data_pub": "2026-08-11T06:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samsung SDI adquiriu a participação total da General Motors na sua joint venture de baterias no valor de 3,5 bilhões de dólares em Indiana, tornando-se assim a primeira fábrica de produção integralmente propriedade da empresa na América do Norte. A SynergyCells, fundada em 2024, está construindo uma planta de células de bateria em New Carlisle, Indiana.", "titulo_pt": "Samsung SDI assume planta no Indiana após parceria com a GM evoluir", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 98642, "titulo": "Korea’s battery trio braces for W1tr ESS price war", "url": "https://www.koreaherald.com/article/10837603", "fonte_id": "korea_herald", "data_pub": "2026-08-11T06:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As três maiores fabricantes de baterias da Coreia do Sul estão se preparando para competir por cerca de 1 trilhão de wones (aproximadamente US$706,8 milhões) em uma terceira licitação de sistemas de armazenamento de energia promovida pelo governo. A vitória recente da SK On na licitação mais recente redefiniu a competição e aumentou a pressão para que LG Energy Solution e seus concorrentes domésticos reduzam custos.", "titulo_pt": "Triunvirato sul-coreano de baterias se prepara para guerra de preços no terceiro leilão ESS do governo", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 98157, "titulo": "Prédio corporativo é o primeiro do Brasil a usar \"concreto do futuro\" e quer reduzir emissões", "url": "https://exame.com/esg/predio-corporativo-e-o-primeiro-do-brasil-a-usar-concreto-do-futuro-e-quer-reduzir-emissoes/", "fonte_id": "exame", "data_pub": "2026-08-11T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um prédio corporativo em Maringá, Paraná, é o primeiro no Brasil a utilizar 'concreto do futuro', uma alternativa de baixo carbono à construção tradicional. O edifício também incorpora um ecossistema urbano que combina inovação e sustentabilidade.", "titulo_pt": "Prédio corporativo em maringá é o primeiro no Brasil a usar 'concreto do futuro' e promove inovação e sustentabilidade", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 98692, "titulo": "Who are the secret gardeners of a parasitic plant?", "url": "https://phys.org/news/2026-08-secret-gardeners-parasitic.html", "fonte_id": "phys_org", "data_pub": "2026-08-11T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em florestas costeiras de uma ilha tropical perto do Okinawa, cresce uma planta inconspicuosa que pode ser facilmente confundida com um fungo. Esta planta parasita não é verde e se alimenta das raízes de outras plantas, produzindo até 1 milhão de sementes minúsculas cobertas por frutos secos muito pequenos. Os cientistas estão particularmente intrigados pela dispersão dessas sementes.", "titulo_pt": "Quem são os jardineiros secretos de uma planta parasita?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 98715, "titulo": "H3 launches navigation satellite", "url": "https://spacenews.com/h3-launches-navigation-satellite/", "fonte_id": "spacenews", "data_pub": "2026-08-11T09:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um lançamento de foguete japonês H3 com sucesso emitiu um satélite de navegação no dia 10 de agosto, cerca de sete meses após uma tentativa anterior que terminou em falha. O post 'H3 lança satélite de navegação' foi publicado inicialmente no SpaceNews.", "titulo_pt": "H3 lança satélite de navegação", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 97983, "titulo": "Cérebro de cachorros capta várias emoções no rosto humano, segundo estudo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/cerebro-de-cachorros-capta-varias-emocoes-no-rosto-humano-segundo-estudo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-11T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo revelou que imagens de ressonância magnética mostram que os cérebros de cães podem reconhecer várias emoções humanas nas expressões faciais, como alegria, medo e raiva. Isso confirma uma suspeita comum entre criadores de cães sobre o entendimento sofisticado dos bichos das emoções humanas.", "titulo_pt": "Cérebro de cachorros identifica várias emoções no rosto humano, sugere estudo", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 98693, "titulo": "Ancient Colombians built huge water system without centralized rule, archaeologists say", "url": "https://phys.org/news/2026-08-ancient-colombians-built-huge-centralized.html", "fonte_id": "phys_org", "data_pub": "2026-08-11T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Comunidades que viviam na Colômbia há milhares de anos construíram um impressionante sistema d'água baseado em cooperação entre grupos familiares, sem uma governança centralizada, conforme sugere uma nova pesquisa. Os arqueólogos acreditam que políticas atuais de gestão hídrica na Colômbia poderiam adotar estratégias semelhantes para resolver a crise atual de água.", "titulo_pt": "Antigos colombianos construíram enorme sistema d'água com cooperação entre grupos familiares, sem governo central", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 98694, "titulo": "New optical method reveals internal dynamics of elusive Wigner crystals", "url": "https://phys.org/news/2026-08-optical-method-reveals-internal-dynamics.html", "fonte_id": "phys_org", "data_pub": "2026-08-11T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Físicos da Universidade de Basileia e da Technische Universität München desenvolveram uma nova técnica que usa luz para revelar os movimentos coletivos de elétrons em um dos estados de matéria mais difíceis de observar: o cristal de Wigner. Esta abordagem permitiu descobrir propriedades quantísticas até então inacessíveis deste estado frágil.", "titulo_pt": "Novo método óptico revela dinâmicas internas do cristal de Wigner", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 98649, "titulo": "Lee says state's primary duty is to protect people's lives, safety", "url": "https://en.yna.co.kr/view/AEN20260811009900315", "fonte_id": "yonhap_news", "data_pub": "2026-08-11T08:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung reafirmou que a principal responsabilidade do governo é proteger as vidas e segurança das pessoas.", "titulo_pt": "Lee reafirma que a principal função do estado é proteger as vidas e segurança dos cidadãos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 98709, "titulo": "STAT+: Why is MoonLake Immunotherapeutics scared of releasing data on its drug candidate?", "url": "https://www.statnews.com/2026/08/11/why-is-moonlake-immunotherapeutics-scared-of-releasing-data/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-11T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa biotecnológica MoonLake Immunotherapeutics está evitando divulgar dados sobre seu candidato a medicamento. Normalmente, as empresas de biotecnologia não ocultam ou confundem dados fortes.", "titulo_pt": "Por que MoonLake immunoterapêutica tem medo de liberar dados sobre seu candidato a medicamento?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 98710, "titulo": "STAT+: Nurses seek a seat at the table as they fight expanding clinical AI", "url": "https://www.statnews.com/2026/08/11/nurses-seek-involvement-clinical-ai-decisions/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-11T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Enfermeiros e enfermeiras, que compõem a maior parte da força de trabalho na saúde, afirmam que a inteligência artificial clínica representa uma ameaça aos seus empregos e à segurança dos pacientes.", "titulo_pt": "Enfermeiros buscam um assento à mesa ao combater o aumento da IA clínica", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 98711, "titulo": "Opinion: Burdensome Medicare GLP-1 program may keep patients from accessing $50 per month weight loss drugs", "url": "https://www.statnews.com/2026/08/11/medicare-weight-loss-drugs-glp-1s-bridge-program-primary-care/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-11T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa de medicamentos para perda de peso da Medicare pode criar barreiras no momento em que a confiança na cobertura mais ampla desses medicamentos está mais necessária, escreve Jeffrey Millstein.", "titulo_pt": "Opinião: programa Medicare de medicamentos para perda de peso poderia criar barreiras", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 98712, "titulo": "Opinion: The new geography of abortion care", "url": "https://www.statnews.com/2026/08/11/abortion-post-dobbs-clinic-hotline-advice/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-11T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antes mesmo da decisão de Dobbs, os pacientes haviam começado a reorganizar o cuidado abortivo fora dos ambientes tradicionais de saúde.", "titulo_pt": "Opinião: a nova geografia do cuidado abortivo", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 98713, "titulo": "IRBs have a problem. Can North Star’s nonprofit model save it?", "url": "https://www.statnews.com/2026/08/11/north-star-review-founders-advocate-nonprofit-approach-institutional-oversight/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-11T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As comissões de revisão institucional enfrentam pressão de empresas e éticos, enquanto o North Star Review Board oferece um modelo sem fins lucrativos como mais independente.", "titulo_pt": "Comissões de revisão institucional têm problemas. Modelo sem fins lucrativo do North Star pode resolver?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 98719, "titulo": "Dust and water spotted close to giant black hole", "url": "https://www.esa.int/Science_Exploration/Space_Science/Webb/Dust_and_water_spotted_close_to_giant_black_hole", "fonte_id": "esa_space", "data_pub": "2026-08-11T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos internacionais, utilizando a Telescópio Espacial James Webb da NASA/ESA/CSA, descobriram que poeira e água podem se formar e sobreviver em uma distância surpreendentemente próxima ao buraco negro supermassivo no centro da Via Láctea. As observações mostraram que a estrela evoluída IRS 3 continua enriquecendo seu ambiente com material recém-formado, apesar do intenso ambiente de radiação ao redor de Sagitário A*.", "titulo_pt": "Poeira e água detectadas perto do grande buraco negro", "veiculo": "ESA - Space Science", "pais": "Europa", "classe": "A"}, {"id": 98727, "titulo": "Could we eliminate any particles from the standard model of physics?", "url": "https://www.newscientist.com/article/2582036-could-we-eliminate-any-particles-from-the-standard-model-of-physics/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-11T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A modelagem padrão da física é uma das teorias científicas mais bem-sucedidas existentes, mas será que ela precisa de tudo? O colunista Chanda Prescod-Weinstein explora se a teoria está carregando bagagens desnecessárias.", "titulo_pt": "Podemos eliminar qualquer partícula do modelo padrão da física?", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 98695, "titulo": "Jackie, the California bald eagle who became an internet sensation, dies after illness", "url": "https://phys.org/news/2026-08-jackie-california-bald-eagle-internet.html", "fonte_id": "phys_org", "data_pub": "2026-08-11T07:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jackie, um águia-calva que se tornou uma sensação na internet e um símbolo da recuperação da espécie na Califórnia, faleceu após ser tratada para uma doença em uma clínica veterinária.", "titulo_pt": "Jackie, a águia-calva da California que virou sensação na internet, morre após doença", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 98674, "titulo": "China's Long March 7A rocket explodes 85 seconds after liftoff in rare launch failure", "url": "https://www.digitimes.com/news/a20260811PD243/china-rocket-launch-investigation-communications.html", "fonte_id": "digitimes", "data_pub": "2026-08-11T06:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um foguete Long March 7A Y18, lançado no dia 10 de agosto à noite do Wenchang, Hainan, explodiu no ar cerca de 85 segundos após o lançamento. O satélite ChinaSat-4B a bordo é considerado perdido. Autoridades chinesas confirmaram que a missão falhou por causa de uma anomalia durante o voo, mas ainda não divulgaram a causa exata.", "titulo_pt": "Foguete chinês Long March 7A explode 85 segundos após o lançamento em raro falha no lançamento", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 98716, "titulo": "Curiosity Blog, Sols 4968-4974: Rock Climbing Towards the Discontinuity", "url": "https://science.nasa.gov/blog/curiosity-blog-sols-4968-4974-rock-climbing-towards-the-discontinuity/", "fonte_id": "nasa_news", "data_pub": "2026-08-11T06:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Curiosity está explorando uma grande característica na sequência sedimentar de Gale, que é suspeita de ser uma 'superfície erosiva'. Esta 'superfície' representa um período em que o ambiente de deposição líquida mudou.", "titulo_pt": "Diário do curiosity, solos 4968-4974: escalada rochosa para a discontinuidade", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 98723, "titulo": "Loud Mouth LDN translates Nissan car grills into bespoke grillz", "url": "https://www.dezeen.com/2026/08/11/nissan-loud-mouth-ldn-nissan-car-grills-bespoke-grillz/", "fonte_id": "dezeen", "data_pub": "2026-08-11T09:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A marca automotiva Nissan colaborou com a joalheria Londrina Loud Mouth LDN para criar uma coleção de grills personalizados que reinterpretam os grades dos carros Nissan. O projeto, composto por quatro peças de joalheria, foi encomendado pela divisão Nismo da Nissan para celebrar o fim do campeonato FIA Formula E em Londres.", "titulo_pt": "Loud Mouth LDN transforma grades de carros Nissan em joias personalizadas", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 98765, "titulo": "Téa Obreht, Richard Russo, Claire Carusillo, and more: 20 new books out today!", "url": "https://lithub.com/tea-obreht-richard-russo-claire-carusillo-and-more-20-new-books-out-today/", "fonte_id": "lithub", "data_pub": "2026-08-11T09:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vieram à luz 20 novos livros, incluindo um novo romance da autora Téa Obreht. Outros autores notáveis como Richard Russo, Claire Carusillo e Chang-Rae Lee também lançaram obras nesta data.", "titulo_pt": "Téa Obreht, Richard Russo, Claire Carusillo, e mais: 20 novos livros publicados hoje!", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 98766, "titulo": "The Nearly Departed: Inside the Art of Writing a Great Obituary", "url": "https://lithub.com/the-nearly-departed-inside-the-art-of-writing-a-great-obituary/", "fonte_id": "lithub", "data_pub": "2026-08-11T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor nunca perguntou aos entrevistados sobre o que acontece após a morte durante as entrevistas para obituários avançados publicados no The New York Times. A resposta é inexprimível, mas seria interessante saber.", "titulo_pt": "Obituários: o que vem depois?", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 98767, "titulo": "Téa Obreht on Writing a Layered, Intertextual Tale of the American West", "url": "https://lithub.com/tea-obreht-on-writing-a-layered-intertextual-tale-of-the-american-west/", "fonte_id": "lithub", "data_pub": "2026-08-11T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira novela de Téa Obreht, 'O Caso da Viúva do Tigre' (2011), ambientada na ex-Iugoslávia, misturou mitos, vida rural, conflitos da guerra e amor entre avô e neta em um trabalho que a levou ao prêmio Orange Prize for Fiction.", "titulo_pt": "Téa Obreht sobre a escrita de uma história camada e Intertextual do oeste americano", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 98768, "titulo": "To Write As If No One Will See What You’ve Written: Why the Short Story Won’t Go Away", "url": "https://lithub.com/to-write-as-if-no-one-will-see-what-youve-written-why-the-short-story-wont-go-away/", "fonte_id": "lithub", "data_pub": "2026-08-11T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O curto-conto continua sendo um gênero popular, com artigos frequentemente publicados a cada vez que uma antologia importante é lançada ou quando escritores de destaque ganham prêmios.", "titulo_pt": "Escrever como se ninguém vai ver o que você escreveu: por que o conto curto não vai embora", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 98769, "titulo": "Esther Kinsky on Is Beauty Good, the Novel by Rosalind Belben", "url": "https://lithub.com/esther-kinsky-on-is-beauty-good-the-novel-by-rosalind-belben/", "fonte_id": "lithub", "data_pub": "2026-08-11T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora Esther Kinsky reflete sobre sua experiência de ter encontrado, há muitos anos, um grupo de pessoas reunidas em uma clareira ao ar livre perto de um vilarejo na Polônia oriental durante uma caminhada.", "titulo_pt": "Esther Kinsky sobre a beleza do bem, o romance de Rosalind Belben", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 97984, "titulo": "'Goleiro Bruno' processa a Band por suposta perseguição e pede R$ 4 milhões de indenização", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/08/goleiro-bruno-processa-a-band-por-suposta-perseguicao-e-pede-r-4-milhoes-de-indenizacao.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-11T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Goleiro Bruno, condenado pelo assassinato de Eliza Samudio, processou a Band por supostamente ser perseguido por reportagens do programa Melhor da Tarde desde 2022 e pediu uma indenização de R$ 4 milhões.", "titulo_pt": "Goleiro Bruno processa a Band por suposta perseguição em reportagens", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 98770, "titulo": "The Responsible Party", "url": "https://lithub.com/the-responsible-party/", "fonte_id": "lithub", "data_pub": "2026-08-11T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Irv e Kath se conheceram quando a Oberbach Corporation estava envolvida na contratação de mão-de-obra barata chinesa para construir uma via subterrânea perigosa ao longo do rio. Irv era o terceiro geração da família que havia sido preparada para assumir o controle da empresa.", "titulo_pt": "A parte responsável", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 98730, "titulo": "Fancy a Nobbly Bobbly? Or a Jelly Terror? The eye-popping guide to the greatest ice lolly wrappers ever", "url": "https://www.theguardian.com/artanddesign/2026/aug/11/greatest-vintage-ice-lolly-wrappers", "fonte_id": "guardian_culture", "data_pub": "2026-08-11T08:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jonny Trunk, colecionador de cultura pop, entrou na casa de um acumulador em Stockport, no Reino Unido, onde encontrou uma valiosa coleção de embalagens de picolés vintage britânicas. Essas embalagens foram reunidas ao longo das últimas cinco décadas e incluem designs icônicos como Fonzie, Elvis e Daleks.", "titulo_pt": "Gostaria de um picolé com design de fonzie? Ou de elvis? Guia visual dos maiores embrulhos de picolés britânicos", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 98771, "titulo": "Rachel Syme Loves a Good Yarn", "url": "https://lithub.com/rachel-syme-loves-a-good-yarn/", "fonte_id": "lithub", "data_pub": "2026-08-11T08:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este é o quarto temporada do programa The Critic and Her Publics, focado no tema 'A Arte da Entrevista'. A apresentadora Merve Emre conversa com diversos entrevistadores profissionais sobre como obter as respostas desejadas e qual é a característica de uma boa entrevista.", "titulo_pt": "Rachel Syme gosta de boa malhação", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 97985, "titulo": "Após fala homofóbica no SBT, Ratinho diz que nunca desrespeitou ninguém", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/televisao/2026/08/apos-fala-homofobica-no-sbt-ratinho-diz-que-nunca-desrespeitou-ninguem.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-11T07:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O apresentador Ratinho, após ser alvo de uma queixa-crime no Ministério Público de São Paulo por uma fala homofóbica no SBT, afirmou nesta segunda-feira (10) que nunca desrespeitou ninguém.", "titulo_pt": "Ratinho nega ter desrespeitado ninguém após fala homofóbica", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 97986, "titulo": "Laila Garin encarna Édith Piaf e suas contradições em novo musical biográfico", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/laila-garin-encarna-edith-piaf-e-suas-contradicoes-em-novo-musical-biografico.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-11T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O musical 'Piaf ? Eu não me arrependo' da Aventura, em cartaz no Teatro Bradesco, apresenta Édith Piaf como uma figura em constante transição e con 8388, "titulo": "Homicides fall 17% in big U.S. cities as the post-pandemic crime decline continues", "url": "https://www.axios.com/2026/08/11/big-city-homicides-decline-2026", "fonte_id": "axios", "data_pub": "2026-08-11T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As mortes violentas caíram 17,2% nas cidades mais populosas dos Estados Unidos até junho de 2025, de acordo com dados preliminares da Associação de Comandantes das Maiores Cidades (MCCA). Este declínio se estende por dois mandatos presidenciais.", "titulo_pt": "Homicídios caem 17% em grandes cidades dos EUA com continuidade da queda pós-pandemia", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 98576, "titulo": "Thailand’s rising body count reveals a nation unable to curb gun crime", "url": "https://www.scmp.com/week-asia/health-environment/article/3363617/thailands-rising-body-count-reveals-nation-unable-curb-gun-crime?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-11T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ex-deputado federal de Nonthaburi, Tailândia, foi acusado de disparar quatro tiros contra um oficial local dentro do carro e depois se retirou calmamente com o revólver na cintura. Este incidente ocorreu apenas dias após os enterros dos vítimas do tiroteio no colégio Debsirin em Nonthaburi, refletindo a crescente taxa de violência armada no país.", "titulo_pt": "Tailândia registra aumento no número de mortes por crimes com armas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 98313, "titulo": "Delivery drivers to be paid minimum $31.30 an hour across Australia in ‘world-leading’ decision", "url": "https://www.theguardian.com/business/2026/aug/11/delivery-drivers-to-be-paid-minimum-3130-an-hour-across-australia-in-world-leading-decision", "fonte_id": "guardian_world", "data_pub": "2026-08-11T08:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Fair Work Comm s": "Brasil", "classe": "A"}, {"id": 98637, "titulo": "Elementary school kept no record after bullied student tried to jump from 3rd floor", "url": "https://www.koreaherald.com/article/10837634", "fonte_id": "korea_herald", "data_pub": "2026-08-11T06:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudante do quinto ano, com origem multicultural (nascido na China e transferido para Jeju no segundo ano), tentou se jogar da terceira janela durante o almoço em 28 de novembro de 2025 após sofrer bullying por mais de um ano. A escola não registrou oficialmente o incidente.", "titulo_pt": "Escola mantém silêncio sobre tentativa de suicídio de estudante após bullying", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 98156, "titulo": "Eleições: Homens brancos concentram maior fatia de recursos entre candidatos jovens, diz estudo", "url": "https://exame.com/brasil/eleicoes-homens-brancos-concentram-maior-fatia-de-recursos-entre-candidatos-jovens-diz-estudo/", "fonte_id": "exame", "data_pub": "2026-08-11T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da Legisla Brasil revela que homens brancos foram a maioria entre os candidatos jovens nas eleições de 2020, representando 49% dos eleitos. Entre as mulheres pretas, houve uma diminuição significativa na participação, com apenas 1% obtendo mandatos.", "titulo_pt": "Eleições: homens brancos concentram maior fatia de recursos entre candidatos jovens, mostra estudo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 98289, "titulo": "Gobierno no retirará utilidades de Codelco: US$2.422 millones; Servel archiva investigación por gastos de campaña de gobernador Orrego, y comisión de Seguridad aprueba creación del Registro Nacional de Vándalos", "url": "https://www.ciperchile.cl/2026/08/10/radar-10-08-26/?utm_source=rss&utm_medium=rss&utm_campaign=radar-10-08-26", "fonte_id": "ciper_chile", "data_pub": "2026-08-11T00:20:00Z", "idiom
