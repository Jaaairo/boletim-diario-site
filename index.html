29T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa recente com neuroimagens descobriu que a psilocibina pode, de fato, tornar a atividade cerebral mais conectada com o ambiente ao redor. Isso vai contra a ideia comum de que psicodelícios desconectam a pessoa da realidade.", "titulo_pt": "Psilocibina poderia fazer seu cérebro vivenciar o momento", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 131636, "titulo": "Regular a IA é disputar quem organiza o nosso futuro", "url": "https://www.jota.info/opiniao-e-analise/artigos/regular-a-ia-e-disputar-quem-organiza-o-nosso-futuro", "fonte_id": "jota", "data_pub": "2026-08-29T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil pode desenvolver uma regulação de inteligência artificial que não se baseie exclusivamente em modelos estrangeiros, mas que dialogue com esses modelos a partir da realidade nacional.", "titulo_pt": "Regular a IA é discutir quem organiza o nosso futuro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 131558, "titulo": "Anthropic vai permitir que IA opere dispositivos físicos", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/anthropic-vai-permitir-que-ia-opere-dispositivos-fisicos/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A plataforma Anthropic permitirá que inteligência artificial opere dispositivos físicos, com aplicações potenciais na descoberta de novos medicamentos e em computadores quânticos.", "titulo_pt": "Anthropic permitirá que IA opere dispositivos físicos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 131426, "titulo": "Soberania digital não é autossuficiência nem isolamento tecnológico, diz Esther Dweck", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/soberania-digital-nao-e-autossuficiencia-nem-isolamento-tecnologico-diz-esther-dweck.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-29T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo brasileiro busca reduzir riscos relacionados a sanções internacionais e aumentar a autonomia no desenvolvimento e regulação de tecnologias, como inteligência artificial, através de seu plano de soberania digital.", "titulo_pt": "Soberania digital não é autossuficiência nem isolamento tecnológico", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 131581, "titulo": "A função pouco conhecida que permite à IA continuar de onde parou numa conversa de semanas atrás", "url": "https://exame.com/inteligencia-artificial/a-funcao-pouco-conhecida-que-permite-a-ia-continuar-de-onde-parou-numa-conversa-de-semanas-atras/", "fonte_id": "exame", "data_pub": "2026-08-29T06:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ChatGPT possui uma função de memória que permite à ferramenta utilizar informações de conversas anteriores para personalizar novas interações, sem exigir que o usuário explique tudo novamente.", "titulo_pt": "Função desconhecida do chatgpt permite continuar conversas anteriores", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 131582, "titulo": "Como os data centers podem definir as eleições dos EUA — e o futuro de Trump", "url": "https://exame.com/mundo/como-os-data-centers-podem-definir-as-eleicoes-dos-eua-e-o-futuro-de-trump/", "fonte_id": "exame", "data_pub": "2026-08-29T06:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Trump, um defensor dos data centers, apóia a implementação desses complexos, mas seu entusiasmo não se reflete na política.", "titulo_pt": "Como os data centers podem definir as eleições dos EUA — e o futuro de Trump", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 132001, "titulo": "AI can make China’s political language sound more threatening, scholar warns", "url": "https://www.scmp.com/news/china/diplomacy/article/3365635/ai-can-make-chinas-political-language-sound-more-threatening-scholar-warns?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-29T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo sugere que a China deve utilizar tradutores humanos para refinar as traduções de AI de sua mensagem política, para evitar que o idioma pareça mais ameaçador para o exterior. O objetivo é melhorar a compreensão internacional das políticas e intenções chinesas.", "titulo_pt": "AI pode tornar a linguagem política chinesa mais ameaçadora, alerta pesquisador", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 132002, "titulo": "China leverages short-video ecosystem, lower costs to carve out lead in AI video", "url": "https://www.scmp.com/tech/tech-trends/article/3365605/china-leverages-short-video-ecosystem-lower-costs-carve-out-lead-ai-video?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-29T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas de inteligência artificial chinesas estão se destacando sobre as americanas em geração de vídeo, aproveitando grandes ecossistemas de vídeos curtos, regras de direitos autorais mais flexíveis e preços agressivos. Este cenário contrasta com a liderança dos gigantes tecnológicos americanos em modelos de linguagem de grande porte fechados, enquanto as empresas chinesas se tornam competitivas na área de inteligência artificial para vídeo.", "titulo_pt": "China se destaca em inteligência artificial para vídeo, aproveitando ecossistemas de vídeos curtos e preços agressivos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 131889, "titulo": "Meta’s $18 billion settlement puts TikTok and YouTube on notice. Who's next on the firing line?", "url": "https://www.cnbc.com/2026/08/29/meta-settlement-tiktok-youtube-snap-teen-safety.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-29T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta buscou garantir que seus concorrentes também cumpram as mesmas regras após pedir que rivais protejam crianças online. A empresa anunciou um acordo de US$ 18 bilhões relacionado ao TikTok e YouTube foi noticiado como um sinal de advertência para outros serviços de mídia social.", "titulo_pt": "Acordo de us$ 18 bilhões da meta coloca TikTok e YouTube em alerta. Quem será o próximo?", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 132047, "titulo": "Motorola Coupon Code for September 2026", "url": "https://www.wired.com/story/motorola-coupon-code/", "fonte_id": "wired", "data_pub": "2026-08-29T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Promoções da Motorola oferecem descontos para atualização de smartphones, frete grátis e descontos sazonais exclusivos em setembro de 2026.", "titulo_pt": "Cupom motorola para setembro de 2026", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 131895, "titulo": "Did AI write this? It’s getting harder to tell", "url": "https://www.ft.com/content/f100c90b-c138-4125-aaa7-853b77690db9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-29T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Software de detecção de conteúdo gerado por IA oferece respostas rápidas, mas o risco de falsos positivos e a stigmas associados a ser acusado estão levando à desconfiança social em relação ao conteúdo escrito.", "titulo_pt": "AI escreveu isso? É cada vez mais difícil de saber", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 131899, "titulo": "Airbus seeks US space unit sale as it shifts to European-built satellites", "url": "https://www.ft.com/content/130a5c43-f7cd-4317-95b8-fe7bc446ec51?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-29T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Airbus está buscando vender sua unidade espacial nos Estados Unidos enquanto se dirige para a produção de satélites construídos na Europa. O potencial venda ocorre após a empresa anunciar um acordo com a Leonardo e a Thales.", "titulo_pt": "Airbus busca vender unidade espacial nos EUA após acordo com leonardo e thales", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 131900, "titulo": "Nasa to launch $4.3bn space telescope to scan universe", "url": "https://www.ft.com/content/cb0e3db3-0d28-423e-9313-0615bf749e1b?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-29T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA lançará uma telescópio espacial com um orçamento de $4,3 bilhões para escanear o universo, ajudando a explicar a matéria escura e descobrindo milhares de planetas além do nosso sistema solar.", "titulo_pt": "Nasa lançará telescópio espacial de $4,3 bilhões para escanear o universo", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 132009, "titulo": "China tests GJ-21 stealth drone as Sichuan Type 076 warship carries out sea trials", "url": "https://www.scmp.com/news/china/military/article/3365654/china-tests-gj-21-stealth-drone-sichuan-type-076-warship-carries-out-sea-trials?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-29T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China realizou testes com o GJ-21, um grande drone de ataque oculto naval, enquanto seu primeiro navio de assalto amfíbio Tipo 076, que será usado para lançar o drone, entra em suas últimas provas de mar. O GJ-21, uma versão naval do GJ-11, apareceu pela primeira vez em um desfile militar em setembro do ano passado e tem feito poucas aparições públicas desde então.", "titulo_pt": "China testa drone GJ-21 oculto enquanto navio tipo 076 entra em testes", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 131973, "titulo": "Math’s AI crisis has a lesson for the rest of us", "url": "https://www.japantimes.co.jp/commentary/2026/08/29/world/maths-ai-crisis/", "fonte_id": "japan_times", "data_pub": "2026-08-29T01:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O campo das matemáticas pode precisar estabelecer novos padrões para lidar com a inteligência artificial.", "titulo_pt": "A crise da IA nas matemáticas tem uma lição para o resto de nós", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 131460, "titulo": "Estudo faz o retrato mais completo dos sacrifícios humanos no Império Inca", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/estudo-faz-o-retrato-mais-completo-dos-sacrificios-humanos-no-imperio-inca.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-29T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 1450, três jovens indígenas foram sacrificados pelo Império Inca em montanhas do Chile. Uma pesquisa combinou análises químicas e anatômicas para reconstruir os últimos meses de vida dessas crianças e adolescentes, indicando que as mortes ocorreram durante uma peregrinação cerimonial com o objetivo de fortalecer o domínio imperial sobre regiões sul-americanas.", "titulo_pt": "Estudo faz o retrato mais completo dos sacrifícios humanos no Império Inca", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 132053, "titulo": "STAT+: A Novartis drug cut inflammation. Can it improve heart outcomes?", "url": "https://www.statnews.com/2026/08/29/novartis-pacibekitug-inflammation-il6-tourmaline-heart-disease/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-29T07:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo medicamento adquirido pela Novartis reduziu sinais de inflamação. A pergunta é se essa redução pode melhorar a saúde cardíaca dos pacientes.", "titulo_pt": "Novo medicamento da Novartis reduz sinais de inflamação. Mas será que isso melhora a saúde cardíaca?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 132031, "titulo": "Masks, test kits back on shopping lists amid signs of COVID-19 resurgence", "url": "https://www.koreaherald.com/article/10855778", "fonte_id": "korea_herald", "data_pub": "2026-08-29T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As infecções por COVID-19 estão aumentando, fazendo com que as compras de máscaras e kits de testes sejam novamente comuns. As vendas desses produtos em três grandes redes de conveniência sul-coreanas registraram uma elevação significativa nas últimas semanas.", "titulo_pt": "Máscaras e kits de teste voltam às listas de compras com sinais de ressurgimento da COVID-19", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 132054, "titulo": "Many cities buried urban streams. Here's how to bring them back", "url": "https://phys.org/news/2026-08-cities-urban-streams.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T02:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitas cidades enterraram rios urbanos que antigamente corriam à superfície para dar lugar à infraestrutura crescente. No entanto, com a intensificação da precipitação e das condições climáticas extremas, bem como a deterioração da infraestrutura, esses rios enterrados podem se tornar parte da solução.", "titulo_pt": "Muitas cidades enterraram rios urbanos. Aqui está como trazê-los de volta", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132055, "titulo": "Rethinking bluegreen aphid control as insecticide resistance spreads", "url": "https://phys.org/news/2026-08-rethinking-bluegreen-aphid-insecticide-resistance.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T01:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa identificou populações resistentes de áfidos azuis-verdes na Austrália do Sul, demonstrando que a dependência repetida de inseticidas de espectro amplo não é mais sustentável. O fracasso de aplicações de inseticidas não deve ser atribuído apenas a condições de aplicação.", "titulo_pt": "Reconsiderando o controle de áfidos azuis-verdes diante da resistência aos inseticidas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132056, "titulo": "How AI‑powered policing is endangering the public's trust in police", "url": "https://phys.org/news/2026-08-aipowered-policing-endangering-police.html", "fonte_id": "phys_org", "data_pub": "2026-08-29T00:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde o lançamento do ChatGPT em 2022, a inteligência artificial tem dominado o cenário cultural. Sua adoção em diversos setores, incluindo a polícia, ocorreu rapidamente sem a implementação de políticas ou leis efetivas para regulamentar seu uso.", "titulo_pt": "Como a policialização da inteligência artificial está ameaçando a confiança do público na polícia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132057, "titulo": "Climate policy could learn from people who already live within the limits of sufficiency", "url": "https://phys.org/news/2026-08-climate-policy-people-limits-sufficiency.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T23:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tina Nyfors, que recentemente defendeu sua tese na Universidade de Helsinki, estudou a suficiência, um modo de vida e um princípio para organizar a sociedade que permite permanecer dentro dos limites ambientais enquanto assegura que as pessoas tenham o necessário. Nyfors destaca pessoas cujo rastro de carbono já está em conformidade com a suficiência, chamando-as de classe de suficiência.", "titulo_pt": "A política climática pode aprender com as pessoas que já vivem dentro dos limites da suficiência", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 131980, "titulo": "Chance of huge quake hitting western Japan in the next 30 years as high as 60%", "url": "https://www.japantimes.co.jp/news/2026/08/29/japan/earthquake-kinki-japan-prediction/", "fonte_id": "japan_times", "data_pub": "2026-08-28T23:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um painel governamental avaliou que há uma chance de 60% de um terremoto de grande magnitude atingir a região ocidental do Japão nos próximos 30 anos, com base em 45 falhas ativas no e na região do Kinki.", "titulo_pt": "Chance de grande terremoto na região ocidental do Japão nos próximos 30 anos pode chegar a 60%", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 132058, "titulo": "The discovery of the Great Barrier Reef's whale maternity ward", "url": "https://phys.org/news/2026-08-discovery-great-barrier-reef-whale.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T23:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A descoberta da área de parto de baleias-habia no Grande Arquipélago de Coral ocorreu 17 anos após uma mensagem incentivadora. Hoje, a região de Whitsundays oferece uma das melhores proteções para as baleias-habia migrantes.", "titulo_pt": "A descoberta do parto de baleias-habia no grande arquipélago de coral", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 132071, "titulo": "What time will SpaceX launch NASA's Roman Space Telscope on Aug. 30? (Full mission timeline)", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-roman-space-telescope-falcon-heavy-launch-what-time", "fonte_id": "space_com", "data_pub": "2026-08-28T22:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX lançará a Telescópio Espacial Nancy Grace Roman, a próxima grande observatória da NASA, em um foguete Falcon Heavy no dia 30 de agosto. A hora exata do lançamento ainda não foi divulgada.", "titulo_pt": "Qual será o horário do lançamento da telescópio espacial nancy grace Roman pela SpaceX no dia 30 de agosto?", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 132061, "titulo": "NASA’s Artemis II Crew Receives Congressional Space Medal of Honor", "url": "https://www.nasa.gov/image-article/nasas-artemis-ii-crew-receives-congressional-space-medal-of-honor/", "fonte_id": "nasa_news", "data_pub": "2026-08-28T22:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os astronautas Victor Glover e Christina Koch, do NASA, Jeremy Hansen, do CSA (Agência Espacial Canadense), e Reid Wiseman, do NASA, receberam a Medalha Espacial Congresional dos EUA em 28 de agosto de 2026, por suas contribuições durante a missão Artemis II.", "titulo_pt": "Equipe da Artemis II recebe medalha espacial congresional", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 132059, "titulo": "Galápagos corals show El Niño events are more extreme now than in past 1,000 years", "url": "https://phys.org/news/2026-08-galpagos-corals-el-nio-events.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T22:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Temperaturas no Oceano Pacífico Equatorial aumentaram dramaticamente em 2026, indicando o início de um El Niño forte e potencialmente histórico. A intensidade recente desses eventos está causando preocupação de que, à medida que as temperaturas globais aumentam, eles podem estar se tornando mais intensos e destrutivos.", "titulo_pt": "Corais dos galápagos mostram que eventos El Niño são mais extremos agora do que nos últimos 1.000 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 131367, "titulo": "Earlier swathing opens a new pathway for subterranean clover seed harvest", "url": "https://phys.org/news/2026-08-earlier-swathing-pathway-subterranean-clover.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A capacidade da trevo subterrâneo de enterrar suas sementes suporta a persistência de pastagens, mas dificulta a colheita comercial de sementes. A indústria depende de arvessores de ventilação de Horwood-Bagshaw (HB) antigos, que coletam sementes de culturas completamente secas após várias passadas de arvessagem e arrancamento.", "titulo_pt": "Colheita antecipada abre um novo caminho para a coleta de sementes de trevo subterrâneo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 131376, "titulo": "NASA Awards First Prize in Phase 2 of Agency’s LunaRecycle Challenge", "url": "https://www.nasa.gov/directorates/stmd/prizes-challenges-crowdsourcing-program/centennial-challenges/nasa-awards-first-prize-in-phase-2-of-agencys-lunarecycle-challenge/", "fonte_id": "nasa_news", "data_pub": "2026-08-28T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A equipe do Massachusetts Institute of Technology (MIT) foi declarada vencedora do primeiro prêmio da fase 2 do desafio LunaRecycle da NASA, que buscava soluções para reduzir o lixo em missões à Lua ou espaço profundo através do reciclagem de materiais comuns, como tecidos, plásticos, espuma e metais. Os estudantes do MIT receberam um total de $775,000 em prêmios.", "titulo_pt": "NASA premia equipe do mit como vencedora do LunaRecycle Challenge", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 131368, "titulo": "Diverse portfolio of protected areas key to Mexican conservation efforts", "url": "https://phys.org/news/2026-08-diverse-portfolio-areas-key-mexican.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2020, México se juntou a 150 nações que comprometeram-se a proteger 30% de seu território até 2030 como parte do iniciativa global 30x30. Até agora, há debates em andamento sobre como expandir efetivamente as áreas protegidas para atingir esse objetivo ambicioso.", "titulo_pt": "Portfólio diversificado de áreas protegidas é crucial para os esforços de conservação mexicanos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 131366, "titulo": "Juul gets OK to sell updated vaping device with age-gating technology", "url": "https://www.statnews.com/2026/08/28/juul-fda-clearance-updated-ecigarette-age-gating-technology/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-28T19:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Juul obteve a aprovação da FDA para vender uma versão atualizada de seu dispositivo eletrônico de nicotina, que inclui um sistema opcional de verificação de idade projetado para prevenir o uso por menores de idade.", "titulo_pt": "Juul recebe aprovação para vender dispositivo atualizado com sistema de verificação de idade", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 131461, "titulo": "Como será o show de Péricles no Rock in Rio, com tributo à black music da Motown", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/como-sera-o-show-de-pericles-no-rock-in-rio-com-tributo-a-black-music-da-motown.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-29T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Péricles, acompanhado pelo maestro Maurício Piassarollo, esteve em ensaios para o seu show no Rock in Rio, previsto para o dia 7 de setembro. O show incluirá um tributo à black music da Motown.", "titulo_pt": "Como será o show de Péricles no Rock in Rio com tributo à black music da Motown", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 132074, "titulo": "How to make a bestseller: insiders reveal the tricks of the book trade", "url": "https://www.theguardian.com/books/ng-interactive/2026/aug/29/how-to-make-a-bestseller-insiders-reveal-the-tricks-of-the-book-trade", "fonte_id": "guardian_culture", "data_pub": "2026-08-29T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Publicações exploram as estratégias utilizadas pelos editores, como o design da capa, a colocação nas prateleiras e parcerias com influenciadores, para promover livros que serão lançados no outono. As decisões de compra dos leitores são influenciadas por uma série de táticas, desde recomendações até a colocação estratégica de livros nas lojas.", "titulo_pt": "Como fazer um best-seller: insider revela truques do mercado editorial", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 131462, "titulo": "Ney Matogrosso, com turnê aos 85, diz que idade não é obstáculo e rebate Xuxa", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/ney-matogrosso-com-turne-aos-85-diz-que-idade-nao-e-obstaculo-e-rebate-xuxa.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-29T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ney Matogrosso, aos 85 anos, anunciou uma turnê em estádios pelo Brasil em 2027, marcando seu retorno às multidões após mais de 50 anos. O cantor, conhecido por sua popularidade nos anos 1970 com os Secos e Molhados, afirmou que a idade não é um obstáculo para sua carreira.", "titulo_pt": "Ney Matogrosso, com turnê aos 85, rebate Xuxa", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 132032, "titulo": "Bruno Mars to bring 'The Romantic Tour' to Seoul in May", "url": "https://www.koreaherald.com/article/10855606", "fonte_id": "korea_herald", "data_pub": "2026-08-29T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bruno Mars realizará uma turnê em Seul em maio de 2027, como parte da 'The Romantic Tour', com quatro shows programados para os dias 21, 22, 25 e 26 de maio. Os ingressos serão vendidos a partir de 14 de setembro através do site oficial Nol.", "titulo_pt": "Bruno Mars trará 'The Romantic Tour' a seul em maio de 2027", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 132033, "titulo": "She took pansori to Avignon. France called her a 'rock star'", "url": "https://www.koreaherald.com/article/10854370", "fonte_id": "korea_herald", "data_pub": "2026-08-29T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A performer de pansori, Lee Ja-ram, foi reconhecida por funcionários de uma loja de souvenirs durante o Festival de Avignon na França. O público local assistiu à apresentação de sua versão de 'Neige, Neige, Neige', uma reimagem da história 'Mestre e o Homem' de Tolstói.", "titulo_pt": "Ela levou o pansori a Avignon. França a chamou de 'estrela rock'", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 132034, "titulo": "When in Korea, crack the banana milk code", "url": "https://www.koreaherald.com/article/10854273", "fonte_id": "korea_herald", "data_pub": "2026-08-29T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O método mais popular para beber a geleada de banana com leite flavorizado na Coreia não foi inventado por cafés. Estrangeiros descobriram a receita enquanto esperavam em caixas de conveniência, combinando a geleada de banana com um café au lait de amêndoas em um copo de gelo. O prato se popularizou apenas após ser compartilhado nas redes sociais pelos turistas.", "titulo_pt": "Quando na Coreia, descubra o código da geleada de banana com leite", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 132035, "titulo": "Chuncheon Makguksu and Dakgalbi Festival is back with bigger ambitions", "url": "https://www.koreaherald.com/article/10854187", "fonte_id": "korea_herald", "data_pub": "2026-08-29T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cidade de Chuncheon, na província de Gangwon, está realizando a sua tradicional festa gastronômica de cinco dias, que inclui a Makguksu e Dakgalbi. O evento, que ocorre de 14 a 18 de outubro no Gongjicheon, é gratuito, com os alimentos sendo vendidos separadamente. O festival atraíu mais de 300.000 visitantes em sua primeira edição no novo local, e os organizadores expandiram o evento adicionando um dia e aumentando as atividades.", "titulo_pt": "Festival de Makguksu e Dakgalbi de chuncheon retorna com programação estendida", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 132079, "titulo": "‘In walked this big bundle of energy’: the day Dolly Parton came to Rotherham", "url": "https://www.theguardian.com/music/2026/aug/29/dolly-parton-rotherham-visit-imagination-library-launch", "fonte_id": "guardian_culture", "data_pub": "2026-08-29T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em dezembro de 2007, a estrela country Dolly Parton visitou a cidade de Rotherham, no Reino Unido, para o lançamento do Imagination Library, seu programa de doação de livros. Shane Jarman, então vice-diretor de uma escola na cidade, foi chamado ao hospital para receber uma surpresa inesperada.", "titulo_pt": "Dolly Parton visita Rotherham para lançar programa de doação de livros", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 132076, "titulo": "The Trials of Magnus Coffinkey review – time stands still at 3.43am in fringe fairytale", "url": "https://www.theguardian.com/stage/2026/aug/29/the-trials-of-magnus-coffinkey-review-summerhall-edinburgh", "fonte_id": "guardian_culture", "data_pub": "2026-08-29T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A peça 'The Trials of Magnus Coffin' de Angele e Malcolm Galea explora a tristeza e a angústia de um herói que se vê preso em um purgatório. A história, inspirada na perda de uma gravidez, é um conto de fadas que não encontra um final feliz.", "titulo_pt": "Audiência: 'as provas de Magnus coffin' - a dilema da história que não tem um final feliz", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 132078, "titulo": "From Dalliance to Billy Strings: the week in rave reviews", "url": "https://www.theguardian.com/culture/2026/aug/29/from-dalliance-to-billy-strings-the-week-in-rave-reviews", "fonte_id": "guardian_culture", "data_pub": "2026-08-29T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hugo Weaving protagoniza uma dramatização agradável sobre as provações e desafios de amigos da mesma idade, enquanto Billy Strings lança um novo álbum impressionante.", "titulo_pt": "De dádiva a Billy Strings: a semana em resenhas de rave", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 131771, "titulo": "ATTITUDE: el tributo más grande a Guns N’ Roses de Latinoamérica se toma Sala Omnium", "url": "https://www.latercera.com/publirreportajes/noticia/attitude-el-tributo-mas-grande-a-guns-n-roses-de-latinoamerica-se-toma-sala-omnium/", "fonte_id": "la_tercera", "data_pub": "2026-08-29T04:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A banda argentina ATTITUDE, que tem se apresentado com sucesso em vários países da América do Sul, chega ao Brasil no dia 3 de outubro para homenagear a era dourada da banda Guns N' Roses (1988-1993), com uma produção que imita os shows originais.", "titulo_pt": "ATTITUDE: o maior tributo a Guns N' Roses da américa latina se apresenta na Sala Omnium", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 131767, "titulo": "‘The butcher may be gone, but to many he is a hero’: victims condemn glorification of Mladić", "url": "https://www.theguardian.com/world/2026/aug/29/bosnia-reaction-death-ratko-mladic", "fonte_id": "guardian_world", "data_pub": "2026-08-29T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gen Ratomko Mladić, conhecido como o 'Boucher da Bósnia', morreu em prisão, mas vítimas e sobreviventes dos genocídios cometidos durante a desintegração da Iugoslávia nos anos 90, ainda consideram sua ideologia muito presente. Apesar de seu título, a crueldade e horror causados por Mladić são considerados insuficientemente retratados.", "titulo_pt": "O matador pode ter partido, mas muitos consideram-no um herói: vítimas condenam glorificação de Mladić", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 132007, "titulo": "Malaysian police arrest 7 Yemeni men in Kuala Lumpur after dangerous road stunt goes viral", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3365682/malaysian-police-arrest-7-yemeni-men-kuala-lumpur-after-dangerous-road-stunt-goes-viral?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-29T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sete homens iemenitas foram presos em Kuala Lumpur, Malásia, após supostamente realizar manobras perigosas com dois veículos na Avenida Sungai Besi. O incidente foi noticiado após um vídeo do ocorrido viralizar nas redes sociais.", "titulo_pt": "Polícia malasiana prende sete homens iemenitas após stunts perigosos viralizarem na internet", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 132072, "titulo": "The best music of autumn 2026: Johnny Marr, Phoebe Bridgers, Rachel Chinouriri and more", "url": "https://www.theguardian.com/culture/ng-interactive/2026/aug/29/best-music-autumn-2026-johnny-marr-phoebe-bridgers", "fonte_id": "guardian_culture", "data_pub": "2026-08-29T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gilla Band, Two Shell e a banda The Big Moon lançaram novos álbuns. Bob Dylan e Kelela estão em turnê. O Guardian também destaca a melhor música de jazz, global e clássica para a temporada de outono de 2026.", "titulo_pt": "Melhores músicas do outono de 2026: johnny Marr, Phoebe Bridgers, Rachel Chinouriri e mais", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 132077, "titulo": "‘It’s easier when nobody’s watching’: inside the secretive and sublime freak-folk of @", "url": "https://www.theguardian.com/music/2026/aug/29/at-band-interview-victoria-rose-stone-rosenberg", "fonte_id": "guardian_culture", "data_pub": "2026-08-29T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A dupla art-folk Victoria Rose e Stone Filipczak tem um nome difícil de encontrar na internet, em contraste com a natureza sublime de sua música. Elas são beekeepers e a propolis no carro não é um problema para elas.", "titulo_pt": "‘É mais fácil quando ninguém está olhando’: dentro do folk estranho e sublime da dupla secreta @", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 131463, "titulo": "Justiça proíbe Cinemateca de cobrar custos do depósito legal de obras feitas até 2025", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/justica-proibe-cinemateca-de-cobrar-custos-do-deposito-legal-de-obras-feitas-ate-2025.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-29T02:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça Federal proibiu a Cinemateca Brasileira de cobrar pelos serviços de avaliação técnica e emissão de laudo para obras de depósito legal enviadas até o início de 2023. Essa decisão vale até o início de 2025.", "titulo_pt": "Justiça proíbe Cinemateca de cobrar por serviços de depósito legal até 2025", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 131708, "titulo": "Por que o Brasil ainda não sabe quantos entregadores se acidentam no trabalho?", "url": "https://www.bbc.com/portuguese/articles/c5y4klql8k9o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-29T09:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil enfrenta dificuldades em medir a quantidade de entregadores que se acidentam no trabalho devido à falta de dados oficiais que permitam confirmar se a pessoa estava trabalhando no momento do acidente.", "titulo_pt": "Por que o Brasil ainda não sabe quantos entregadores se acidentam no trabalho?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 131548, "titulo": "Jovens buscam formas atípicas para se sustentar em Nova York", "url": "https://www.cnnbrasil.com.br/internacional/jovens-buscam-formas-atipicas-de-arcar-com-os-custos-de-vida-em-nova-york/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-29T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jovens em Nova York estão buscando formas não convencionais de moradia para reduzir custos, como viver com freiras ou dividir casas com idosos.", "titulo_pt": "Jovens buscam formas atípicas para se sustentar em Nova York", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 131634, "titulo": "Europa lidera casos de violência doméstica contra brasileiras no exterior", "url": "https://www.metropoles.com/mundo/europa-lidera-casos-de-violencia-domestica-contra-brasileiras-no-exterior", "fonte_id": "metropoles", "data_pub": "2026-08-29T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Consulados brasileiros registraram 1.631 casos de violência doméstica e de gênero contra brasileiras no exterior em 2024, sendo que a Europa concentra 45% desses casos.", "titulo_pt": "Europa lidera casos de violência doméstica contra brasileiras no exterior", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 131635, "titulo": "Violência doméstica: 93,6% das vítimas estão fora dos registros oficiais", "url": "https://www.metropoles.com/brasil/violencia-domestica-936-das-vitimas-estao-fora-dos-registros-oficiais", "fonte_id": "metropoles", "data_pub": "2026-08-29T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estima-se que 93,6% das vítimas de violência doméstica não estejam registradas oficialmente. Além disso, três em cada dez brasileiras foram vítimas de violência doméstica ou familiar nos últimos 12 meses.", "titulo_pt": "Violência doméstica: 93,6% das vítimas não estão nos registros oficiais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 131964, "titulo": "What happens if you give everyone $700? A local economy thrives", "url": "https://www.japantimes.co.jp/business/2026/08/29/direct-cash-transfer-experiment/", "fonte_id": "japan_times", "data_pub": "2026-08-29T06:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um experimento em Kamala, no sul de Malawi, está mostrando como a futura assistência poderia funcionar ao fornecer $700 a todos. O resultado tem sido o fortalecimento da economia local.", "titulo_pt": "O que acontece se você der $700 a todo mundo? Uma economia local prospera", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 131773, "titulo": "Prisión preventiva para delincuentes venezolanos que robaron y retuvieron a matrimonio de adultos mayores en Quillón", "url": "https://www.latercera.com/nacional/noticia/prision-preventiva-para-delincuentes-venezolanos-que-robaron-y-retuvieron-a-matrimonio-de-adultos-mayores-en-quillon/", "fonte_id": "la_tercera", "data_pub": "2026-08-29T03:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Dois idosos, com 74 e 69 anos, foram amarrados e ameaçados com armas de fogo por criminosos venezolanos que registraram sua casa. Os delinquentes levaram as vítimas a mais de 100 quilômetros para forçar o homem a sacar dinheiro de um banco.", "titulo_pt": "Prisão preventiva para criminosos venezolanos que roubaram e retiveram casal de idosos em Quillón", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 131779, "titulo": "Salud en tiempos de estrechez fiscal", "url": "https://www.latercera.com/cartas-al-director/noticia/salud-en-tiempos-de-estrechez-fiscal/", "fonte_id": "la_tercera", "data_pub": "2026-08-29T00:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute a situação da saúde ambios na educação superior", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 130996, "titulo": "A proposta de Romário para democratizar o teste de Alzheimer no SUS", "url": "https://veja.abril.com.br/brasil/a-proposta-de-romario-para-democratizar-o-teste-de-alzheimer-no-sus/", "fonte_id": "veja", "data_pub": "2026-08-28T20:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um projeto de lei proposto por Romário visa incluir exames de sangue no SUS para o diagnóstico precoce do Alzheimer, visando democratizar o acesso a esse teste.", "titulo_pt": "Proposta de Romário para democratizar o teste de Alzheimer no SUS", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 131002, "titulo": "Servidora do MP manteve material de exploração sexual infantil em e-mail particular", "url": "https://veja.abril.com.br/brasil/servidora-do-mp-manteve-material-de-exploracao-sexual-infantil-em-e-mail-particular/", "fonte_id": "veja", "data_pub": "2026-08-28T20:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma servidora do Ministério Público mantinha material relacionado a exploração sexual infantil em um e-mail particular. Ela afirmou que usava a conta para fins pessoais e profissionais, auxiliando em procedimentos investigativos.", "titulo_pt": "Servidora do MP mantinha material de exploração sexual infantil em e-mail particular", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 130241, "titulo": "Motociclista resiste à prisão, entra em luta com PM e deixa militar ferido", "url": "https://www.metropoles.com/distrito-federal/motociclista-resiste-a-prisao-entra-em-luta-com-pm-e-deixa-militar-ferido", "fonte_id": "metropoles", "data_pub": "2026-08-28T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um suspeito foi parado durante uma blitz da PMDF com uma motocicleta com chassi suprimido. Ao ser informado que teria de comparecer à delegacia, ele entrou em luta corporal com os policiais e deixou um militar ferido.", "titulo_pt": "Motociclista resiste à prisão, entra em luta com PM e deixa militar ferido", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 131638, "titulo": "A biodiversidade entrou no compliance", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-biodiversidade-entrou-no-compliance", "fonte_id": "jota", "data_pub": "2026-08-29T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A biodiversidade está se integrando na compliance corporativo com o Marco Global da Biodiversidade e o TNFD (Taskforce on Nature-related Financial Disclosures) incentivando as empresas a serem mais transparentes e a gerir os riscos relacionados à natureza.", "titulo_pt": "A biodiversidade entrou no compliance", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 131761, "titulo": "Plug-in solar panels could save households up to $370 a year – if Australia made them legal as in the UK", "url": "https://www.theguardian.com/environment/2026/aug/29/plug-in-solar-panels-could-save-households-370-a-year-and-experts-say-australia-should-copy-the-uk-in-legalising-them", "fonte_id": "guardian_world", "data_pub": "2026-08-29T05:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A instalação de kits solares plugáveis, que custam aproximadamente $1.000, pode pagar-se em três anos, de acordo com um especialista. Uma organização de advocacy sugere que a legalização desses kits no Australia, como no Reino Unido, poderia economizar até $370 por ano nas contas de energia dos australianos e ajudar no combate às mudanças climáticas.", "titulo_pt": "Kit solar plugável poderia economizar até $370 por ano para os australianos se a austrália legalizasse como no reino unido", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 132004, "titulo": "US families hold out hope for relatives lost in Nepal floods", "url": "https://www.scmp.com/news/asia/south-asia/article/3365688/us-families-hold-out-hope-relatives-lost-nepal-floods?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-29T05:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mukti Patel está reunida com familiares e amigos em sua casa em Richmond, Virginia, desde que seu pai, irmã e outras duas relações desapareceram nas cheias catastróficas perto da fronteira entre Nepal e China. Ela ainda não fala em passado, pois não há informações sobre o paradeiro deles.", "titulo_pt": "Famílias americanas mantêm esperança por parentes desaparecidos nas cheias no Nepal", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 131765, "titulo": "‘Winter panic’: EU gas stores at their lowest level in 13 years", "url": "https://www.theguardian.com/business/2026/aug/29/european-gas-stores-lowest-13-years-eu-price", "fonte_id": "guardian_world", "data_pub": "2026-08-29T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Europa está prestes a entrar no inverno com seus estoques de gás em níveis historicamente baixos, com 63% de capacidade no final de agosto, abaixo da média de 80% registrada nos últimos anos. Especialistas advertiram que essa situação pode causar 'pânico de inverno' entre os comerciantes de energia.", "titulo_pt": "Pânico de inverno: estoques de gás da Europa estão nos níveis mais baixos em 13 anos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 132038, "titulo": "Flood devastation", "url": "https://www.koreaherald.com/article/10856068", "fonte_id": "korea_herald", "data_pub": "2026-08-29T03:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um desastre de enxurrada catastrófica atingiu a região Himalayense da fronteira entre Nepal e Tibet em 26 de agosto, causando mais de 600 mortes, destruindo casas, estradas e pontes, e deixando milhares de pessoas desaparecidas, incluindo mais de 500 estrangeiros de mais de 30 países.", "titulo_pt": "Desastre de enxurrada", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 131777, "titulo": "Cifra de desaparecidos tras inundaciones en Nepal aumenta significativamente hasta casi 2.000", "url": "https://www.latercera.com/mundo/noticia/cifra-de-desaparecidos-tras-inundaciones-en-nepal-aumenta-significativamente-hasta-casi-2000/", "fonte_id": "la_tercera", "data_pub": "2026-08-29T01:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A autoridade nepalesa de gestão e redução de riscos de desastres informou que o número de desaparecidos após as inundações aumentou para quase 2.000, incluindo 933 funcionários de centrais hidroeléctricas e 622 turistas estrangeiros.", "titulo_pt": "Cifra de desaparecidos após inundações em Nepal aumenta para quase 2.000", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 131979, "titulo": "Nepal’s flood is a warning of tragedies to come", "url": "https://www.japantimes.co.jp/editorials/2026/08/29/jt-editorial-nepal-flood/", "fonte_id": "japan_times", "data_pub": "2026-08-29T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A mudança climática garantirá que desastres semelhantes à cheia no Nepal ocorram com maior frequência no futuro.", "titulo_pt": "Inundações no nepal são advertência de tragédias por vir", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 131837, "titulo": "In Nepal and Tibet, stunned survivors and desperate families search for missing loved ones after floods", "url": "https://www.lemonde.fr/en/environment/article/2026/08/29/i-was-sure-i-was-going-to-die-after-floods-in-nepal-and-tibet-stunned-survivors-and-desperate-families-searching-for-missing-loved-ones_6756952_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-28T23:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hospitais em Katmandu estão recebendo constantemente pessoas buscando informações sobre parentes desaparecidos após as inundações que causaram pelo menos 584 mortes e deixaram quase 2.500 pessoas desaparecidas em Nepal e Tibet.", "titulo_pt": "Em Nepal e Tibet, sobreviventes estupefatos e famílias desesperadas buscam parentes desaparecidos após inundações", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 131030, "titulo": "Inmet emite alerta de perigo para chuva e ventos intensos na Região Sul", "url": "https://www.cnnbrasil.com.br/nacional/sul/inmet-emite-alerta-de-perigo-para-chuva-e-ventos-intensos-na-regiao-sul/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Inmet emitiu um alerta para perigo de chuva e ventos intensos na Região Sul. A previsão é de ventos de até 100km/h, precipitação de 50 a 100 mm/dia e queda de granizo.", "titulo_pt": "Inmet emite alerta de perigo para chuva e ventos intensos na Região Sul", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 131312, "titulo": "Number of missing in Nepal floods passes 2,400 as UNICEF says 17,000 children need aid", "url": "http://www.euronews.com/2026/08/28/number-of-missing-in-nepal-floods-passes-2400-as-unicef-says-17000-children-need-aid", "fonte_id": "euronews", "data_pub": "2026-08-28T19:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de desaparecidos nos desastres de cheias no Nepal ultrapassou 2.400, enquanto 17.000 crianças necessitam de assistência humanitária. Equipes de resgate continuam trabalhando em meio a lama, recuperando corpos e enfrentando o risco de novas cheias, com alguns mortos sendo levados pelas águas até o Nepal vizinho, Índia.", "titulo_pt": "Número de desaparecidos nos desastres de cheias no Nepal ultrapassa 2.400 e 17.000 crianças precisam de ajuda", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 130336, "titulo": "Os mapas e gráficos que mostram a magnitude e o impacto da avalanche no Nepal e Tibete", "url": "https://www.bbc.com/portuguese/articles/c1dlp6wp9xyo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-28T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma avalanche ocorreu na região do Himalaia, afetando grandes áreas da fronteira entre Nepal e Tibete, deixando quase 600 mortos e 2 mil desaparecidos.", "titulo_pt": "Mapas e gráficos mostram a magnitude e o impacto da avalanche no Nepal e Tibete", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 130253, "titulo": "Incêndio atinge vegetação ao lado do trilho do metrô em Águas Claras", "url": "https://www.metropoles.com/distrito-federal/trem-passa-ao-lado-de-chamas-que-avancam-perto-da-linha-do-metro-df", "fonte_id": "metropoles", "data_pub": "2026-08-28T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incêndio ocorreu próximo ao trilho do Metrô em Águas Claras, Distrito Federal, sem danificar estruturas nem interromper a circulação dos trens.", "titulo_pt": "Incêndio atinge vegetação ao lado do trilho do metrô em Águas Claras", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 130415, "titulo": "At least 93,000 ‘in great need’ after Nepal-Tibet flash floods, says Red Cross", "url": "https://www.theguardian.com/world/2026/aug/28/nepal-tibet-flash-floods-red-cross-rescuers-death-toll", "fonte_id": "guardian_world", "data_pub": "2026-08-28T15:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Federação da Cruz Vermelha e do Crescente Vermelho Internacional informou que pelo menos 93.000 pessoas podem ter sido afetadas pelas cheias que ocorreram na fronteira entre Nepal e Tibet, resultando em cerca de 600 mortos e 1.900 desaparecidos. Um grande esforço de resgate está sendo realizado, mas está sendo dificultado por temores de novos alagamentos.", "titulo_pt": "Ao menos 93.000 'em grande necessidade' após cheias na fronteira Nepal-Tibet, diz cruz vermelha", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 130803, "titulo": "Why a newly formed lake is sparking fears of more flooding along the Nepal-China border", "url": "https://phys.org/news/2026-08-newly-lake-nepal-china-border.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades alertaram que um novo lago formado e em sobrefluência poderia causar mais inundações na fronteira entre Nepal e China, enquanto resgatadores trabalhavam em áreas devastadas por uma enxurrada catastrófica.", "titulo_pt": "Por que um novo lago formado está causando medo de mais inundações na fronteira entre nepal e china", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 129220, "titulo": "PF faz operação contra extração ilegal de madeira em área indígena", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pf-faz-operacao-contra-extracao-ilegal-de-madeira-em-area-indigena", "fonte_id": "metropoles", "data_pub": "2026-08-28T09:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal realizou uma operação em Rondônia contra a extração ilegal de madeira em uma área indígena. Durante a ação, duas pessoas foram presas em flagrante por posse ilegal de armas de fogo e munições.", "titulo_pt": "PF realiza operação contra extração ilegal de madeira em área indígena", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 129494, "titulo": "Overflowing lake halts rescue efforts as Nepal-Tibet flood death toll hits 474", "url": "https://www.theguardian.com/world/2026/aug/28/flash-flood-risk-halt-rescue-tibet-nepal-death-toll-china-lake-burst", "fonte_id": "guardian_world", "data_pub": "2026-08-28T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Equipes de resgate nas enchentes flash na fronteira entre Nepal e Tibet foram obrigadas a recuar devido ao risco de rompimento de um dique de detritos. Os moradores do distrito de Rasuwa, no Nepal, estão fugindo para as colinas para se protegerem de uma possível inundação do rio.", "titulo_pt": "Lago cheio interrompe esforços de resgate enquanto mortes por inundações flash na fronteira Nepal-Tibet chegam a 474", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 131927, "titulo": "Refugees International president trashes Israel's Gaza food claims", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/refugees-international-president-trashes-israels-gaza-nutrition-claims", "fonte_id": "middle_east_eye", "data_pub": "2026-08-29T06:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da Refugees International, Jeremy Konyndyk, criticou as afirmações israelenses sobre a melhora nas estatísticas de malnutrição em Gaza, afirmando que isso não invalida a declaração de fome do ano anterior. Konyndyk explicou que a melhora nos níveis de malnutrição ocorreu porque Israel levantou o bloqueio de ajuda alimentar após a declaração de fome.", "titulo_pt": "Presidente da refugees International critica declarações israelenses sobre Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 131718, "titulo": "El fallo del TC: que no pague la gente", "url": "https://www.ciperchile.cl/2026/08/28/el-fallo-del-tc-que-no-pague-la-gente/?utm_source=rss&utm_medium=rss&utm_campaign=el-fallo-del-tc-que-no-pague-la-gente", "fonte_id": "ciper_chile", "data_pub": "2026-08-29T02:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O título refere-se a uma decisão judicial que determina que as pessoas não devem pagar algo. Não há detalhes adicionais sobre o conteúdo da decisão.", "titulo_pt": "A decisão do TC: que não haja pagamento", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 132060, "titulo": "UNICEF welcomes the release of women and children in Kenscoff and calls for stronger protection of children in Haiti", "url": "https://www.unicef.org/press-releases/unicef-welcomes-release-women-and-children-kenscoff-and-calls-stronger-protection-0", "fonte_id": "unicef", "data_pub": "2026-08-29T01:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A UNICEF comemorou a libertação de mulheres e crianças em Kenscoff e apelou por uma proteção mais forte para as crianças na Haiti.", "titulo_pt": "UNICEF comemora libertação de mulheres e crianças em Kenscoff e pede maior proteção para crianças na Haiti", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 131986, "titulo": "A candle against Hong Kong’s growing darkness", "url": "https://www.japantimes.co.jp/commentary/2026/08/29/world/jto-clifford-hong-kong-darkness/", "fonte_id": "japan_times", "data_pub": "2026-08-28T23:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chow Hang-tung, uma das presidiárias políticas mais proeminentes de Hong Kong, está cumprindo mais de cinco anos de prisão e agora enfrenta uma sentença adicional de 10 anos.", "titulo_pt": "Uma vela contra a crescente escuridão em Hong Kong", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 131320, "titulo": "8-year-old Nepal flood survivor reunited with mother after rescue", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/28/8-year-old-nepal-flood-survivor-reunited-with-mother-after-rescue?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-28T21:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um sobrevivente de inundações na Nepal, com 8 anos de idade, foi reunião com sua mãe após o resgate.", "titulo_pt": "Menino de 8 anos reunido com mãe após resgate em inundações na Nepal", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 131321, "titulo": "Forced birth control in Greenland violated women’s rights, experts find", "url": "https://www.aljazeera.com/news/2026/8/28/forced-birth-control-in-greenland-violated-womens-rights-experts-find?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-28T20:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma comissão de verdade será estabelecida após dois relatórios de especialistas falharem em concordar se o esquema de controle reprodutivo em massa constituiu genocídio.", "titulo_pt": "Controle reprodutivo forçado em groenlândia violou direitos das mulheres, especialistas constatam", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 131344, "titulo": "'My whole world stopped': How a routine ICE check-in upended a Syrian-American family", "url": "https://www.middleeasteye.net/news/us-ice-check-in-devastated-syrian-american-family", "fonte_id": "middle_east_eye", "data_pub": "2026-08-28T19:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Zena Saifo levou seu pai, Iemad Saifo, a uma consulta do ICE em Nova Jersey, esperando uma verificação rotineira. No entanto, o encontro desencadeou uma série de eventos que colocaram a família, que é sírio-americana, em uma situação de potencial deportação.", "titulo_pt": "Meu mundo inteiro parou: como uma consulta rotineira do ICE perturou uma família sírio-americana", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 130152, "titulo": "ONU diz que 160 mil mulheres e meninas foram afetadas por enchente no Nepal", "url": "https://www.cnnbrasil.com.br/internacional/onu-diz-que-160-mil-mulheres-e-meninas-foram-afetadas-por-enchente-no-nepal/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T17:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ONU relatou que 160 mil mulheres e meninas foram afetadas por uma enchente no Nepal. As mulheres enfrentam riscos maiores de violência, exploração e empobrecimento, além de assumirem tarefas domésticas e buscar água em proporções desproporcionais.", "titulo_pt": "ONU diz que 160 mil mulheres e meninas foram afetadas por enchente no Nepal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 130747, "titulo": "Dutch court jails man for life over role in Rwanda genocide", "url": "https://www.scmp.com/news/world/europe/article/3365618/dutch-court-jails-man-life-over-role-rwanda-genocide?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-28T10:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal holandês condenou um homem de 66 anos a prisão perpétua por seu papel no massacre de 3.000 tutsis durante o genocídio ruandês de 1994. O juiz afirmou que o homem impediu os tutsis de escapar do estádio e atirou uma granada na multidão.", "titulo_pt": "Juiz holandês condena homem a prisão perpétua por genocídio em ruanda", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 129395, "titulo": "Ataques de Trump mostram que direitos humanos não são mais um consenso", "url": "https://www.intercept.com.br/2026/08/28/ataques-trump-direitos-humanos-nao-sao-consenso/", "fonte_id": "intercept_brasil", "data_pub": "2026-08-28T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo destaca que os ataques de Trump à ideia de direitos humanos revelam que esses direitos não são mais um consenso. A extrema direita americana está abandonando a aparência humanitária para avançar sobre o Brasil, mostrando que as garantias mínimas não são suficientes para lidar com as desigualdades atuais.", "titulo_pt": "Ataques de Trump mostram que direitos humanos não são mais um consenso", "veiculo": "The Intercept Brasil", "pais": "Brasil", "classe": "B"}, {"id": 129789, "titulo": "Hong Kong lawyer warns against doxxing after AIA staff suspended over mall brawl", "url": "https://www.scmp.com/news/hong-kong/society/article/3365603/hong-kong-lawyer-warns-against-doxxing-after-aia-staff-suspended-over-mall-brawl?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-28T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um advogado em Hong Kong alertou os usuários da internet contra a divulgação de informações pessoais de outras pessoas nas redes sociais, a fim de evitar o crime de doxxing. Isso ocorreu após uma empresa de seguros suspenso um funcionário que foi associado a uma briga entre três mulheres em um centro comercial.", "titulo_pt": "Advogado em hong Kong alerta contra doxxing após funcionário de seguradora suspenso por briga em shopping", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 129927, "titulo": "Four children killed as separate attacks destroy humanitarian supplies and damage critical water infrastructure in Gaza", "url": "https://www.unicef.org/press-releases/four-children-killed-separate-attacks-destroy-humanitarian-supplies-and-damage", "fonte_id": "unicef", "data_pub": "2026-08-28T08:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quatro crianças morreram em ataques separados que destruíram suprimentos humanitários e danificaram infraestrutura crítica de água no Gaza.", "titulo_pt": "Quatro crianças mortas em ataques que destruíram suprimentos humanitários e danificaram infraestrutura de água no Gaza", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 132062, "fonte_id": "washington_post_world", "titulo": "Sliman Mansour has died. His art became a symbol of Palestinian resilience.", "url": "https://www.washingtonpost.com/obituaries/2026/08/29/sliman-mansour-towering-figure-palestinian-art-dies-79/", "data_pub": "2026-08-29T10:00:00Z", "topico": "politica_internacional", "idioma": "en", "titulo_pt": "Sliman Mansour faleceu. Sua arte se tornou símbolo da resiliência palestina.", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 131990, "fonte_id": "scmp", "titulo": "Russian drone strike near Kyiv kills at least 27", "url": "https://www.scmp.com/news/world/europe/article/3365705/russian-drone-strike-near-kyiv-kills-least-27?utm_source
