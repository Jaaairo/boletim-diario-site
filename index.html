<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "21/08/2026 09:32", "stats": {"noticias_novas": 835, "resumos_gerados": 246}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Tribunal Superior Eleitoral (TSE) deve definir a candidatura de Pablo Marçal em setembro, após ele ter sido proibido de acessar o fundo eleitoral e participar de debates. Em outro desenvolvimento, o TSE formou uma equipe para mitigar os efeitos de eventos climáticos extremos nas eleições, enquanto permitiu que Marcelo Crivella concorra nas eleições, após ter sido declarado inelegível. A disputa pelo governo do Rio Grande do Sul está empatada entre o Partido Liberal (PL) e o Partido Democrático Trabalhista (PDT). O caso Lulinha, filho do presidente Lula, continua em investigação no Supremo Tribunal Federal (STF), com a Procuradoria-Geral da República (PGR) solicitando que os inquéritos sejam encaminhados para a primeira instância. Além disso, o número de candidaturas a deputado federal para as eleições de 2026 caiu 28% em relação às eleições de 2022, de acordo com dados do TSE.", "mundo": "A segurança internacional enfrenta diversos desafios em diferentes regiões do mundo. Na África do Sul, duas cidadãs mexicanas foram detidas durante uma operação policial que descobriu uma grande fábrica de metanfetamina. Em um conflito diplomático, o governo ucraniano planeja impor sanções contra a série de desenhos animados 'Masha e o Urso', considerada uma forma de propaganda russa para crianças. O Irã prometeu responder 'devastadoramente' a novas ameaças dos Estados Unidos, que prometeram impor sanções financeiras 'mais severas da história'. Por outro lado, na Europa, as receitas fiscais da Espanha aumentaram em 10,4%, enquanto na Itália o aumento foi de 2,1%. Na Ásia, o governo sul-coreano manteve as cotações do combustível em agosto, diante das tensões no Oriente Médio, e o presidente Lee Jae Myung nomeou o oficial de comércio sênior Park Jung-sung como novo ministro do Comércio e negociador-chefe para negociações comerciais.\n\nO Irã enfrenta diversos desafios geopolíticos, incluindo execuções de manifestantes e sanções econômicas. O Pentágono informou que mais de 750 militares americanos foram feridos durante operações contra o Irã, mas não detalhou os incidentes. O país também sofre com pressões econômicas, com novas sanções prometidas pelos Estados Unidos, que pediram apoio chinês. Paralelamente, a Romênia mobilizou caças F-16 para destruir um drone perto de um projeto de gás crucial, em resposta a ameaças de drones russos. O Japão planeja aumentar seu orçamento de defesa em 56 bilhões de dólares para enfrentar crescentes ameaças regionais, enquanto o Irã realiza testes de mísseis próximos às ilhas disputadas com os Emirados Árabes Unidos. Esses eventos refletem a crescente tensão na região e o aumento das atividades militares e econômicas de potências globais.", "economia": "O Bitcoin registrou uma semana de ganhos significativos, com uma perspectiva de alta de até 20%, impulsionado por diversos fatores. A Braskem está avaliando medidas de proteção e intensificando negociações com credores, enquanto a Pop Mart enfrenta uma queda nas ações devido a uma redução nas vendas fora da China. O governo sul-coreano anunciou que manterá os limites de preço do combustível inalterados por mais quatro semanas devido às tensões no Oriente Médio. O comércio varejista eliminou 45,9 mil vagas com carteira assinada no primeiro semestre de 2026, o maior corte para um primeiro semestre desde a pandemia, enquanto o BNDES desembolsou R$ 75,6 bilhões em crédito, um aumento de 31,2% em comparação com o mesmo período do ano anterior. A Coreia do Sul monitorará de perto o impacto das taxas de juros das dívidas soberanas globais em seu mercado de títulos governamentais, e a Doosan Enerbility venceu um contrato de 930 bilhões de ienes para construir uma planta de gás em Omã. Além disso, a Samsung planeja devolver um recorde de 80 bilhões de dólares aos acionistas, enquanto a Airbus flexibilizou suas políticas sobre trabalho remoto após uma série de greves.", "tecnologia": "O presidente dos Estados Unidos, Joe Biden, assinou uma diretriz para aumentar os lançamentos espaciais no país, com o objetivo de revitalizar a liderança americana no transporte espacial. Paralelamente, o presidente Lula anunciou investimentos de R$ 2,3 bilhões em inteligência artificial, sem detalhar as regiões beneficiadas. Na área de tecnologia, a empresa francesa Mistral AI anunciou que começará a oferecer modelos de outras empresas em sua plataforma, enquanto busca criar uma infraestrutura europeia para inteligência artificial soberana. A Fujifilm expandiu a produção de materiais-chave para chips para atender à crescente demanda de inteligência artificial. A China e os EUA adotam abordagens diferentes para gerenciar os riscos associados à tecnologia, buscando mecanismos de proteção. Em relação à privacidade, entidades de defesa do consumidor e direitos digitais pediram uma investigação ao MPF sobre os riscos à privacidade dos óculos inteligentes da Meta, especialmente para mulheres e crianças. Por fim, a empresa de biotecnologia Insilico Medicine anunciou que um medicamento promissor para fibrose pulmonar havia sido 'descoberto por' seu sistema de inteligência artificial gerativa. A Galaxy Corp., uma empresa de tecnologia de entretenimento sul-coreana, abriu um parque robótico em Seul que inclui apresentações de K-pop, destacando a integração de robótica e entretenimento pop sul-coreano.", "ciencia": "Em 2027, o El Niño está prestes a se tornar o mais forte da história, possivelmente fazendo desse o ano mais quente já registrado, de acordo com cientistas do Serviço Meteorológico Britânico. Paralelamente, a China está lançando uma missão lunar para procurar água congelada. Em outro desenvolvimento, uma estudante de doutorado da Universidade de Staffordshire recebeu reconhecimento nacional por sua pesquisa, que poderia transformar a análise de evidências de manchas de sangue nos locais de crime. Arqueólogos descobriram 11 setas marcadas antigas em Tepecik-Çiftlik, na Anatolia Neolítica Central, cada uma com um design único gravado em sua superfície escura de obsidiana há cerca de 9.000 anos. Além disso, um tratamento para a doença do amarelo da laranja, baseado em mais de uma década de pesquisa no Texas A&M AgriLife Research, alcançou um marco no caminho para a disponibilidade comercial. Finalmente, uma nova ferramenta desenvolvida por uma equipe da Universidade de Basileia pode fornecer imagens precisas das estruturas escondidas dentro de grandes conjuntos de dados altamente dimensionais em biologia moderna.", "cultura": "O 29º Festival de Gastronomia de Tiradentes, que começa nesta sexta-feira (21/8), promete atraír 35 mil pessoas nos primeiros dias e é um importante evento cultural. O festival celebra a rica culinária local, mostrando como a gastronomia pode ser um meio para promover a cultura e o turismo. Em outra novidade, o ator Anthony Hopkins estreou-se como compositor em um álbum intitulado 'Vida é Sonho', dirigido por Gustavo Dudamel, abordando temas cinematográficos e familiares. A obra retrata a vida como um sonho e foi criada em um contexto de reflexão pessoal e artística. Além disso, o Festival de Histórias, que ocorre neste sábado no Nubank Parque, em São Paulo, reúne grandes nomes do sertanejo de diferentes gerações, como Chitãozinho & Xororó e Zezé Di Camargo & Luciano, em um evento que celebra a música e a cultura sertaneja.", "sociedade": "Em Belo Horizonte, moradores da ocupação Kasa Invisível foram despejados e realizaram um ato público para protestar contra a remoção. O local funcionava desde 2013 como moradia, centro social e cultural, oferecendo serviços como uma biblioteca e cooperativas. Em Caballito, Buenos Aires, mais de 3.400 pessoas buscaram emprego em uma feira de empregos, com 30 empresas recebendo currículos e realizando entrevistas para mais de 600 vagas, com metade das buscas voltadas para pessoas com mais de 45 anos.", "meio_ambiente": "A República Democrática do Congo enfrenta uma grave epidemia de Ebola, que está se espalhando rapidamente, conforme alertou a ONU. O país está em estado de emergência sanitária, com a maior epidemia de Ebola na história do país. Paralelamente, a Vale firmou um novo acordo após quase 11 anos sobre a tragédia de Mariana, em um processo de mediação conduzido pelo Tribunal Regional Federal da 6ª Região. No Distrito de Inovação em Porto Alegre, o foco está na resiliência climática para atrair investimentos, com investimentos previstos de R$ 1 bilhão até 2027. Além disso, um ambicioso projeto busca descontaminar o Lago Villarrica em 15 anos, com investimento estimado de US$ 56 milhões, visando reduzir a proliferação de algas e o impacto das embarcações com motor. A Hungria enfrenta uma grave crise hídrica devido a um período prolongado de calor e seca, com níveis de água em lagos e rios em recordes baixos. Por fim, a falta de fontes de energia com baixo teor de carbono pode dissuadir investimentos em projetos de energia, conforme informou o Taipei Times.", "direitos_humanos": "Uma série de eventos em diferentes partes do mundo destaca questões importantes sobre direitos humanos. Em Hong Kong, dois ativistas pró-democracia, Lee Cheuk-yan e Chow Hang-tung, foram condenados por organizar vigílias anuais em memória do massacre de Tiananmen, sentenciados a penas que podem chegar a 10 anos de prisão. Em Gaza, a Organização das Nações Unidas alertou que 94% da população, cerca de 2,1 milhões de pessoas, enfrentam níveis críticos ou catastróficos de fome. Além disso, em Somalia, muitas instalações de saúde e nutrição foram fechadas, agravando a crise infantil no país. No Brasil, a ex-ministra Damares Alves afirmou que as mortes de Yanomamis representam uma das maiores crises humanitárias do país, com uma comissão solicitando investigação sobre a verba destinada à assistência aos indígenas. No Distrito Federal, uma mulher foi condenada por ter fingido seu próprio sequestro, exigindo um resgate de R$ 5 mil. No Chile, as oficinas do Senado foram alvo de uma investigação por supostas coimas relacionadas à Junaeb, enquanto a Cepal revisou para 1,6% a previsão de crescimento para o país, e sete em cada dez mortes por influenza não haviam sido vacinadas. Estes casos ilustram a variedade de desafios que os direitos humanos enfrentam em diferentes contextos globais."}, "resumo_do_dia": {"politica_nacional": [{"id": 114960, "titulo": "Vice de Flávio, Alfredo Gaspar terá papel estratégico na propaganda eleitoral", "url": "https://veja.abril.com.br/brasil/vice-de-flavio-alfredo-gaspar-tera-papel-estrategico-na-propaganda-eleitoral/", "fonte_id": "veja", "data_pub": "2026-08-21T12:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alfredo Gaspar será o vice de Flávio e terá papel importante na propaganda eleitoral, especialmente nas agendas e reuniões no Nordeste. Ele também será representado por Gaspar em determinados compromissos na região.", "titulo_pt": "Vice de Flávio, Gaspar terá papel estratégico na propaganda eleitoral", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 114990, "titulo": "TSE deve definir candidatura de Pablo Marçal em setembro", "url": "https://www.cnnbrasil.com.br/eleicoes/tse-deve-definir-candidatura-de-pablo-marcal-em-setembro/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T11:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) deve definir a candidatura de Pablo Marçal em setembro. O empresário foi proibido de acessar fundo eleitoral e participar de debates.", "titulo_pt": "TSE deve definir candidatura de Pablo Marçal em setembro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 115086, "titulo": "Mansão usada por Lulinha foi alugada por testemunha da Lava Jato", "url": "https://www.metropoles.com/brasil/mansao-usada-por-lulinha-foi-alugada-por-testemunha-da-lava-jato", "fonte_id": "metropoles", "data_pub": "2026-08-21T11:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A casa em Brasília que era usada pelo filho do ex-presidente Lula, conhecida como Lulinha, foi alugada por uma testemunha da Lava Jato. A propriedade era utilizada para receber visitas e realizar reuniões.", "titulo_pt": "Casa usada por Lulinha foi alugada por testemunha da Lava Jato", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 115020, "titulo": "TSE cria equipe para proteger eleições de eventos climáticos extremos", "url": "https://www.infomoney.com.br/politica/tse-cria-equipe-para-proteger-eleicoes-de-eventos-climaticos-extremos/", "fonte_id": "infomoney", "data_pub": "2026-08-21T11:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) formou uma equipe para mitigar os efeitos de eventos climáticos extremos nas eleições. O grupo será responsável por avaliar riscos logísticos que possam afetar os locais de votação.", "titulo_pt": "TSE cria equipe para proteger eleições de eventos climáticos extremos", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 115021, "titulo": "TSE libera Marcelo Crivella para concorrer nas eleições", "url": "https://www.infomoney.com.br/politica/tse-libera-marcelo-crivella-para-concorrer-nas-eleicoes/", "fonte_id": "infomoney", "data_pub": "2026-08-21T11:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) permitiu que Marcelo Crivella concorra nas eleições. Ele havia sido declarado inelegível por abuso de poder político e econômico.", "titulo_pt": "TSE libera Marcelo Crivella para concorrer nas eleições", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 114897, "titulo": "Presidentes de OAB-SP e AASP e diretora da USP falam em seminário da Folha; assista", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/seminariosfolha/2026/08/presidentes-de-oab-sp-e-aasp-e-diretora-da-usp-falam-em-seminario-da-folha-assista.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-21T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O seminário 'O Judiciário em Debate: Integridade, Eficiência e Acesso à Justiça', promovido pela Folha, continuará na segunda-feira (24) com discussões sobre acesso efetivo à Justiça e digitalização do Direito. Participarão presidentes de OAB-SP e AASP e a diretora da USP.", "titulo_pt": "Presidentes de OAB-SP e AASP e diretora da USP participam de seminário sobre acesso à justiça e digitalização do direito", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 114892, "titulo": "“Game of Thrones” no STF, caso Lulinha e Master atravessam a eleição de 2026", "url": "https://g1.globo.com/politica/blog/andreia-sadi/post/2026/08/21/game-of-thrones-no-stf-caso-lulinha-e-master-atravessam-a-eleicao-de-2026.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-21T10:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O caso Lulinha, envolvendo o filho do ex-presidente Lula, Fábio Luís Lula da Silva, em três inquéritos do Supremo Tribunal Federal (STF), é uma questão de grande incerteza para o governo, especialmente em relação a possíveis impactos nas eleições de 2026. As investigações surgiram a partir da Operação Sem Desconto, que apura fraudes com descontos em benefícios do INSS.", "titulo_pt": "Game of Thrones no STF, caso Lulinha e Master e eleições de 2026", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 114898, "titulo": "Deputado do PT cobra que Flávio dê transparência sobre recursos para filme sobre o pai", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/deputado-do-pt-cobra-que-flavio-de-transparencia-sobre-recursos-para-filme-sobre-o-pai.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-21T10:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido dos Trabalhadores (PT) pressionou o deputado Flávio Bolsonaro para que ele divulgue as contas dos recursos destinados à produção do filme 'Dark Horse', que retrata a vida do presidente Jair Bolsonaro. O banqueiro Daniel Vorcaro teria fornecido os fundos para a realização do filme.", "titulo_pt": "Deputado do PT cobra transparência sobre recursos para filme sobre o pai", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 114978, "titulo": "Pesquisa: disputa pelo governo gaúcho está empatada entre PL e PDT", "url": "https://veja.abril.com.br/brasil/pesquisa-disputa-pelo-governo-gaucho-esta-empatada-entre-pl-e-pdt/", "fonte_id": "veja", "data_pub": "2026-08-21T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa do Instituto Paraná Pesquisas, divulgada nesta sexta-feira, 21, indica que a disputa pelo governo do Rio Grande do Sul está empatada entre os partidos Progressistas (PL) e Democratas (PDT).", "titulo_pt": "Pesquisa: disputa pelo governo do rio grande do sul está empatada entre PL e PDT", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 114979, "titulo": "As descobertas da PF nas investigações sobre Lulinha", "url": "https://veja.abril.com.br/politica/as-descobertas-da-pf-nas-investigacoes-sobre-lulinha/", "fonte_id": "veja", "data_pub": "2026-08-21T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal realizou investigações sobre Lulinha, o filho mais velho do presidente Lula, suspeito de envolvimento em tráfico de influência. Os inquéritos foram acessados pela revista VEJA.", "titulo_pt": "Descobertas da PF nas investigações sobre Lulinha", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 114899, "titulo": "Sindicato denuncia uso de estrutura de escolas para candidato aliado de Paes", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/sindicato-denuncia-uso-de-estrutura-de-escolas-para-candidato-aliado-de-paes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Sindicato Estadual dos Profissionais de Educação do Rio de Janeiro (Sepe-RJ) apresentou uma representação ao Ministério Público Eleitoral (MPE) para investigar o suposto uso de estruturas escolares na campanha do candidato a deputado federal Renan Ferreirinha (PSD).", "titulo_pt": "Sindicato denuncia uso de estrutura de escolas para candidato aliado de Paes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 115133, "titulo": "Investigações contra Lulinha devem continuar no STF?", "url": "https://www.bbc.com/portuguese/articles/cqjx5zp427go?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-21T08:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República (PGR) solicitou que os inquéritos relacionados a Lulinha sejam encaminhados para a primeira instância. Esse pedido chamou a atenção de um advogado criminalista e professor de Direito e é considerado atípico.", "titulo_pt": "Investigações contra Lulinha devem continuar no STF?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 115126, "titulo": "A quebra do sigilo da fonte no caso Flávio Dino", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-do-davi-tangerino/a-quebra-do-sigilo-da-fonte-no-caso-flavio-dino", "fonte_id": "jota", "data_pub": "2026-08-21T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute três questões constitucionais relacionadas: liberdade de expressão, sigilo de fonte e a legitimidade das decisões judiciais no caso Flávio Dino.", "titulo_pt": "A quebra do sigilo da fonte no caso Flávio Dino", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 115127, "titulo": "O julgamento que pode colocar em risco o transporte rodoviário de passageiros no país", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-julgamento-que-pode-colocar-em-risco-o-transporte-rodoviario-de-passageiros-no-pais", "fonte_id": "jota", "data_pub": "2026-08-21T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O julgamento no STF sobre o fretamento em circuito aberto pode colocar em risco o modelo de transporte rodoviário de passageiros, especialmente para cidades do interior.", "titulo_pt": "Julgamento no stf pode ameaçar transporte rodoviário de passageiros para cidades do interior", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 115033, "titulo": "Apartamento de Eduardo Bolsonaro no Rio é comprado por R$ 788 mil em leilão da Caixa", "url": "https://exame.com/mercado-imobiliario/apartamento-de-eduardo-bolsonaro-no-rio-e-comprado-por-r-788-mil-em-leilao-da-caixa/", "fonte_id": "exame", "data_pub": "2026-08-21T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um apartamento de Eduardo Bolsonaro, localizado em Botafogo, foi comprado por R$ 788 mil em um leilão da Caixa após inadimplência no financiamento. O lance inicial foi de R$ 644 mil, com um desconto de 36%.", "titulo_pt": "Apartamento de Eduardo Bolsonaro no Rio é comprado por R$ 788 mil em leilão da Caixa", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 115128, "titulo": "Cartilha do CNJ sobre penduricalhos é útil, mas insuficiente", "url": "https://www.jota.info/opiniao-e-analise/artigos/cartilha-do-cnj-sobre-penduricalhos-e-util-mas-insuficiente", "fonte_id": "jota", "data_pub": "2026-08-21T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cartilha do Conselho Nacional de Justiça (CNJ) sobre penduricalhos define indenizações, mas reconhece que a classificação jurídica dessas verbas ainda é objeto de debate. O documento é considerado útil, mas insuficiente para resolver todas as questões envolvendo penduricalhos.", "titulo_pt": "Cartilha do CNJ sobre penduricalhos é útil, mas insuficiente", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 115346, "titulo": "Two Mexicans arrested as police uncover big meth lab on South African farm", "url": "https://www.bbc.co.uk/news/articles/c80n8d4xz1eo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-21T11:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Duas pessoas mexicanas foram detidas durante uma operação policial que descobriu uma grande fábrica de metanfetamina em uma propriedade na África do Sul. A operação ocorreu perto da fronteira com o Zimbabwe.", "titulo_pt": "Dois mexicanos detidos em operação que desmantelou grande laboratório de metanfetamina na áfrica do sul", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 114949, "titulo": "Ucrânia anuncia sanções contra o desenho russo ‘Masha e o Urso’", "url": "https://www.cartacapital.com.br/mundo/ucrania-anuncia-sancoes-contra-o-desenho-russo-masha-e-o-urso/", "fonte_id": "cartacapital", "data_pub": "2026-08-21T11:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo ucraniano planeja impor sanções contra a série de desenhos animados 'Masha e o Urso', considerando-a uma forma de propaganda russ  Google, Ding, cidadão chinês, teve uma parte de sua condenação anulada após ser considerado culpado em janeiro por sete acusações de espionagem econômica.", "titulo_pt": "EUA anula parte da condenação de ex-engenheiro do Google por roubo de segredos de IA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 114942, "titulo": "Irã promete resposta devastadora após EUA ameaçarem impor sanções mais severas da história", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/ira-promete-resposta-devastadora-apos-eua-ameacarem-impor-sancoes-mais-severas-da-historia.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-21T11:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Irã declarou que responderá 'devastadoramente' a quaisquer novas ameaças dos Estados Unidos, que prometeram impor sanções financeiras 'mais severas da história' com o objetivo de derrubar o regime iraniano.", "titulo_pt": "Irã promete resposta devastadora após EUA ameaçarem sanções mais severas da história", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 115326, "titulo": "Top Iran official says US focus on economic warfare shows it has failed militarily", "url": "https://www.npr.org/2026/08/21/nx-s1-5940610/iran-us-threat-economic-warfare", "fonte_id": "npr_news", "data_pub": "2026-08-21T11:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um alto funcionário iraniano afirmou que a ênfase dos Estados Unidos na guerra econômica demonstra a falha militar americana. O regime iraniano descartou as ameaças de Trump de sufocar a economia do país, argumentando que as sanções americanas há anos não tiveram sucesso.", "titulo_pt": "Alto funcionário iraniano diz que foco americano na guerra econômica mostra falha militar", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 115239, "titulo": "Iran Must Plan to Overcome ‘Unjust’ U.S. Sanctions, Top Tehran Official Says", "url": "https://www.nytimes.com/2026/08/21/world/middleeast/iran-sanctions-united-states-ghalibaf.html", "fonte_id": "nyt_world", "data_pub": "2026-08-21T11:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mohammad Bagher Ghalibaf, principal negociador das conversas com Washington, afirmou que o Irã precisa planejar como superar as sanções americanas consideradas 'injustas'. Após isso, o presidente Trump prometeu uma 'D-Day econômica' contra o Irã.", "titulo_pt": "Irã deve planejar como superar sanções 'injustas' dos EUA, diz negociador", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 115476, "titulo": "Volano le entrate fiscali spagnole (+10,4%), Italia distaccata a +2,1%", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/21/volano-le-entrate-fiscali-spagnole-104-italia-distaccata-a-21_a912acc9-2972-49fc-a59a-107ecdb0aac1.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-21T11:35:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "As receitas fiscais da Espanha aumentaram em 10,4%, enquanto na Itália o aumento foi de 2,1%. O FiscoOggi destaca as medidas para conter o aumento dos preços da energia.", "titulo_pt": "Fiscoitaliano: entradas fiscais da Espanha crescem 10,4%, enquanto na Itália é de 2,1%", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 115341, "titulo": "Rosenberg: Shortage of petrol but not patriotism as Russians feel growing impact of war", "url": "https://www.bbc.co.uk/news/articles/c4gknzgje7go?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-21T11:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Motoristas estão formando filas por horas em postos de gasolina, enquanto Moscou se prepara para comemorar o Dia da Bandeira Russa.", "titulo_pt": "Rosenberg: falta de combustível, mas não de patriotismo, enquanto russos enfrentam o impacto da guerra", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 115477, "titulo": "La scorta per Harry e Meghan potrebbe costare 5 milioni, è polemica in Gb", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/21/la-scorta-per-harry-e-meghan-potrebbe-costare-5-milioni-e-polemica-in-gb_80bda1b1-3a34-4db1-8a2d-b41599082f0a.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-21T11:30:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A escolta pessoal para Harry e Meghan pode custar cerca de 5 milhões de libras, causando polêmica no Reino Unido. A duquesa de Sussex está pronta para retomar suas atividades públicas após o recente transferimento.", "titulo_pt": "Custos da escolta de Harry e Meghan causam polêmica no reino unido; Meghan pronta para voltar às atividades", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 115453, "titulo": "Closure of al-Makha port leaves workers and traders fearing for the future", "url": "https://www.aljazeera.com/economy/2026/8/21/houthi-attacks-on-mokha-port-forced-it-to-suspend-operations-leaving-workers-jobless?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-21T11:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As operações do porto de al-Makha foram interrompidas devido a ataques hutíos, deixando os trabalhadores sem emprego e os comerciantes preocupados com o futuro.", "titulo_pt": "Fechamento do porto de al-makha deixa trabalhadores e comerciantes em situação incerta", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 115385, "titulo": "Europeans pressure Israel over West Bank settlements, citing 'unprecedented levels of violence'", "url": "https://www.lemonde.fr/en/international/article/2026/08/21/europeans-pressure-israel-over-west-bank-settlements-citing-unprecedented-levels-of-violence_6756732_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-21T11:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Países europeus como França, Reino Unido, Alem
