o": "Americas face growing need for long-term care as populations age", "url": "https://www.paho.org/en/news/28-10-2026-americas-face-growing-need-long-term-care-populations-age", "fonte_id": "paho", "data_pub": "2026-10-28T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A América enfrenta uma crescente necessidade de cuidados a longo prazo à medida que a população envelhece.", "titulo_pt": "América enfrenta crescente necessidade de cuidados a longo prazo à medida que a população envelhece", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 232055, "titulo": "Students on hunger strike in India demand restoration of student union", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/28/students-on-hunger-strike-in-india-demand-restoration-of-student-union?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-28T18:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudantes da Universidade Jamia Millia Islamia, em Nova Deli, estão em greve de fome exigindo a restauração da união estudantil.", "titulo_pt": "Estudantes em greve de fome na Índia exigem reconstituição da união estudantil", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 231448, "titulo": "Prevenção e cuidado contínuo: o que precisa mudar para os brasileiros envelhecerem melhor", "url": "https://exame.com/esg/envelhecer-com-vitalidade-a-estrategia-do-fleury-para-o-cuidado-continuo/", "fonte_id": "exame", "data_pub": "2026-10-28T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CEO do Grupo Fleury discute no Longevidade & Wellness as mudanças necessárias para que o aumento da expectativa de vida seja acompanhado de mais saúde, autonomia e capacidade cognitiva.", "titulo_pt": "Prevenção e cuidado contínuo: o que precisa mudar para os brasileiros envelhecerem melhor", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 231927, "titulo": "Dolores Huerta, pioneering labor activist, dies at 96", "url": "https://www.axios.com/2026/10/28/dolores-huerta-dies-96-united-farm-workers", "fonte_id": "axios", "data_pub": "2026-10-28T16:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dolores Huerta, uma organizadora de trabalhadores pioneira que co-fundou os Trabalhadores Agrícolas Unidos e cunhou a expressão 'Sí, se puede', faleceu aos 96 anos. Ela foi uma lendária defensora dos direitos civis que liderou greves e boicotes, lutou para expandir os direitos dos hispânicos americanos e se tornou uma influente figura política.", "titulo_pt": "Dolores Huerta, pioneira na organização de trabalhadores, falece aos 96 anos", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 231552, "titulo": "Dia do Servidor Público: a melhor homenagem é aprimorar a gestão de pessoas", "url": "https://www.jota.info/opiniao-e-analise/artigos/dia-do-servidor-publico-a-melhor-homenagem-e-aprimorar-a-gestao-de-pessoas", "fonte_id": "jota", "data_pub": "2026-10-28T16:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal, estados e municípios comemoram o servidor público ao assegurar as condições necessárias para o bom desempenho do serviço público.", "titulo_pt": "Dia do Servidor Público: a melhor homenagem é aprimorar a gestão de pessoas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 232615, "titulo": "Clima: temporais atingem Centro-Oeste e Sudeste nesta quinta (29/10)", "url": "https://www.metropoles.com/brasil/clima-temporais-atingem-centro-oeste-e-sudeste-nesta-quinta-29-10", "fonte_id": "metropoles", "data_pub": "2026-10-29T09:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Temporais atingem o Centro-Oeste e o Sudeste, com pancadas fortes e trovoadas previstas para Goiás, Mato Grosso, São Paulo e Minas Gerais. No interior do Nordeste, as temperaturas podem chegar a 39ºC.", "titulo_pt": "Clima: temporais atingem Centro-Oeste e Sudeste nesta quinta (29/10)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 232761, "titulo": "Guías para un clima que ya cambió", "url": "https://www.latercera.com/opinion/noticia/guias-para-un-clima-que-ya-cambio/", "fonte_id": "la_tercera", "data_pub": "2026-10-29T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute orientações para lidar com um clima que já se transformou. Aborda medidas e estratégias adaptativas já que as condições climáticas mudaram.", "titulo_pt": "Guias para um clima que já mudou", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 233135, "titulo": "Analysis: China’s clean-tech exports in 2026 to avoid as much CO2 as Brazil emits in a year", "url": "https://www.carbonbrief.org/analysis-chinas-clean-tech-exports-in-2026-to-avoid-as-much-co2-as-brazil-emits-in-a-year", "fonte_id": "carbon_brief", "data_pub": "2026-10-29T07:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações de tecnologias limpas da China em 2026, como painéis solares, baterias e veículos elétricos, estão programadas para evitar a emissão de CO2 equivalente às emissões anuais do Brasil.", "titulo_pt": "Análise: exportações de tecnologias limpas da china em 2026 evitarão emissões de CO2 equivalentes às do Brasil em um ano", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 232639, "titulo": "Mudanças climáticas devem ser declaradas emergência global de saúde, diz relatório", "url": "https://exame.com/esg/mudancas-climaticas-devem-ser-declaradas-emergencia-global-de-saude-diz-relatorio/", "fonte_id": "exame", "data_pub": "2026-10-29T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório anual da Lancet Countdown afirma que as mudanças climáticas devem ser declaradas emergência global de saúde. A publicação estima que o calor extremo foi responsável por quase 3 milhões de mortes no mundo entre 2016 e 2023.", "titulo_pt": "Mudanças climáticas devem ser declaradas emergência global de saúde, diz relatório", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 231502, "titulo": "Brasil perdeu 45% da vegetação e ‘fragmentou’ florestas nos últimos 38 anos", "url": "https://www.cnnbrasil.com.br/nacional/brasil/brasil-perdeu-45-da-vegetacao-e-fragmentou-florestas-nos-ultimos-38-anos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-29T01:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo realizado pelo MapBiomas indica que o Brasil perdeu 45% de sua vegetação e fragmentou florestas nos últimos 38 anos, com redução no tamanho médio das áreas conservadas e avanço do desmembramento do território por lavouras e urbanização. O relatório foi divulgado durante a COP17 da Biodiversidade.", "titulo_pt": "Brasil perdeu 45% da vegetação e 'fragmentou' florestas nos últimos 38 anos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 231595, "titulo": "Los Ángeles pone fin a la producción de petroleo después de más de una década de lucha", "url": "https://www.clarin.com/estados-unidos/los-angeles-pone-fin-a-la-produccion-de-petroleo-despues-de-mas-de-una-decada-de-lucha_0_EiGuHw3rAI.html", "fonte_id": "clarin", "data_pub": "2026-10-29T01:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O conselho municipal de Los Angeles votou unânimemente para proibir a extração de petróleo, afetando mais de 1.800 poços ativos e inativos. A medida visa proteger a saúde pública e alcançar a neutralidade de carbono para 2035, após anos de pressão comunitária.", "titulo_pt": "Los angeles encerra produção de petróleo após década de luta", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 232142, "titulo": "Advocates call for protecting grassland for owls in Shalun science park project", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/29/2003866820", "fonte_id": "taipei_times", "data_pub": "2026-10-29T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Advogados estão pedindo a proteção de pastos para abrigar búfalos-pé-de-galinha no projeto de parque científico Shalun. O objetivo é garantir um habitat adequado para essas aves.", "titulo_pt": "Advogados pleiteiam proteção de pastos para búfalos-pé-de-galinha no projeto do parque científico Shalun", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 231765, "titulo": "Menindee Lakes water levels drop to lowest in five years as experts warn of mass fish deaths", "url": "https://www.theguardian.com/australia-news/2026/oct/28/menindee-lakes-water-levels-drop-mass-fish-death-fears", "fonte_id": "guardian_world", "data_pub": "2026-10-28T23:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os níveis d'água nos Lagos Menindee, na Austrália Ocidental, atingiram o nível mais baixo em cinco anos, levando o governo do estado a implementar restrições de uso d'água. Especialistas alertam para o risco potencial de mortes em massa de peixes durante o verão.", "titulo_pt": "Níveis de água nos lagos menindee caem a nível mais baixo em cinco anos, com alerta de mortes em massa de peixes", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 231807, "titulo": "Bangladesh Measles Outbreak Is a ‘Warning Sign’", "url": "https://foreignpolicy.com/2026/10/28/bangladesh-measles-outbreak-vaccination-crisis-health/", "fonte_id": "foreign_policy", "data_pub": "2026-10-28T22:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório de especialistas alerta sobre a crise vacinal no Bangladesh. O surto de sarampo no país é considerado um sinal de advertência.", "titulo_pt": "Surto de sarampo no bangladesh é um 'sinal de advertência'", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 232417, "titulo": "UK budget 2026: Key climate and energy announcements", "url": "https://www.carbonbrief.org/uk-budget-2026-key-climate-and-energy-announcements", "fonte_id": "carbon_brief", "data_pub": "2026-10-28T18:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Chancellor John Healey anunciou uma 'nova direção no energy' para o Reino Unido, com foco em manter as contas baixas diante dos desafios atuais. O orçamento de 2026 inclui importantes declarações sobre clima e energia.", "titulo_pt": "Orçamento do reino unido de 2026: anúncios-chave sobre clima e energia", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 231771, "titulo": "Second fatal train collision this year casts doubt over Spain’s high-speed rail network", "url": "https://www.theguardian.com/world/2026/oct/28/analysis-fatal-collision-doubt-over-spain-high-speed-rail", "fonte_id": "guardian_world", "data_pub": "2026-10-28T16:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Houve um segundo acidente fatal de trem na Espanha este ano, levantando dúvidas sobre a segurança do seu extenso sistema de trem de alta velocidade, o mais amplo da Europa e o segundo maior do mundo após a China. No incidente, ocorrido em Toledo, pelo menos 68 pessoas morreram quando um trem de alta velocidade colidiu com outro que estava parado nas trilhas, resultando na deriva de vários vagões.", "titulo_pt": "Segundo acidente fatal de trem neste ano abala segurança da malha ferroviária de alta velocidade da Espanha", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 231588, "titulo": "Cientistas pedem que crise climática seja declarada emergência de saúde global", "url": "https://www.dw.com/pt-br/cientistas-pedem-que-crise-climática-seja-declarada-emergência-de-saúde-global/a-79785180?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-28T15:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo mostra que mortes por calor, secas e insegurança alimentar estão aumentando mais rápido do que há uma década. Cientistas de 30 países estão pedindo uma ação coordenada em relação à crise climática.", "titulo_pt": "Cientistas pedem que crise climática seja declarada emergência de saúde global", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 231972, "titulo": "Trump rolls back methane rules for US oil and gas industry", "url": "https://www.euronews.com/2026/10/28/trump-rolls-back-methane-rules-for-us-oil-and-gas-industry", "fonte_id": "euronews", "data_pub": "2026-10-28T13:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump está buscando reduzir os custos energéticos antes das eleições gerais da próxima semana, em meio a uma frustração crescente dos eleitores devido a preços de petróleo que aumentaram devido à guerra do Irã.", "titulo_pt": "Trump revoga regras sobre metano para a indústria de petróleo e gás dos EUA", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 231940, "titulo": "Climate change: Scientists call for declaration of 'global health emergency' after new report", "url": "https://www.lemonde.fr/en/environment/article/2026/10/28/climate-change-scientists-call-for-declaration-of-global-health-emergency-after-new-report_6765877_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-28T11:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O 10º relatório da Lancet Countdown mostra que os impactos da elevação da temperatura global na saúde, como mortes relacionadas ao calor, pioraram significativamente desde a assinatura do Acordo de Paris em 2015.", "titulo_pt": "Clima: cientistas pedem declaração de 'emergência global de saúde' após novo relatório", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 231973, "titulo": "Spain: First footage reveals wreckage of deadly high-speed train crash", "url": "https://www.euronews.com/video/2026/10/28/spain-first-footage-reveals-wreckage-of-deadly-high-speed-train-crash", "fonte_id": "euronews", "data_pub": "2026-10-28T11:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tren tômbio de alta velocidade colidiu com outro perto de Toledo, Espanha, causando pelo menos 10 mortes. Duas carragens tombaram, e os resgatistas estão buscando nas ruínas, com o número de vítimas fatais possivelmente aumentando.", "titulo_pt": "Espanha: primeira imagens revelam destroços do trágico acidente ferroviário de alta velocidade", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 231975, "titulo": "First aerial images show scene of deadly train crash in Toledo, Spain", "url": "https://www.euronews.com/2026/10/28/first-aerial-images-show-scene-of-deadly-train-crash-in-toledo-spain", "fonte_id": "euronews", "data_pub": "2026-10-28T11:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imagens aéreas mostram o cenário após um acidente envolvendo duas trens de alta velocidade perto de Urda, na província de Toledo, Espanha, enquanto equipes de emergência continuam as operações de resgate e resposta.", "titulo_pt": "Primeiras imagens aéreas mostram cenário do trágico acidente ferroviário em Toledo, Espanha", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 232931, "titulo": "North Koreans being recruited into forced labour in Russia, report says", "url": "https://www.aljazeera.com/economy/2026/10/29/north-koreans-being-recruited-into-forced-labour-in-russia-report-says?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-29T08:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Global Rights Compliance afirma que uma rede de broqueiros russos está recrutando trabalhadores norte-coreanos usando vistos de estudante. Os norte-coreanos seriam empregados em trabalho forçado na Rússia.", "titulo_pt": "Norte-coreanos estariam sendo recrutados para trabalho forçado na Rússia, relata", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 232626, "titulo": "Ativista canadense que resgatava animais morre em bombardeio na Ucrânia", "url": "https://www.metropoles.com/mundo/ativista-canadense-que-resgatava-animais-morre-em-bombardeio-na-ucrania", "fonte_id": "metropoles", "data_pub": "2026-10-29T08:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jesse Adams, um ativista canadense que trabalhava voluntariamente resgatando animais nas zonas de conflito na Ucrânia, morreu em um bombardeio.", "titulo_pt": "Ativista canadense que resgatava animais morre em bombardeio na Ucrânia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 232973, "titulo": "Politician ordered to pay ¥1.1 million for outing author as transgender", "url": "https://www.japantimes.co.jp/news/2026/10/29/japan/crime-legal/transgender-outing-rulinig/", "fonte_id": "japan_times", "data_pub": "2026-10-29T08:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal de Tóquio determinou que o político deve pagar 1,1 milhão de ienes por revelar sem consentimento o gênero atribuído ao nascimento da autora, considerando que isso foi uma invasão ilegal da privacidade.", "titulo_pt": "Político ordenado a pagar 1,1 milhão de ienes por revelar gênero da autora sem consentimento", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 233071, "titulo": "(LEAD) Seoul mulling co-sponsoring U.N. resolution on N. Korean human rights", "url": "https://en.yna.co.kr/view/AEN20261029007251315", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T07:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Unificação está em conversas com entidades relevantes sobre a possibilidade de cosancionar uma resolução da ONU sobre os direitos humanos na Coreia do Norte.", "titulo_pt": "Seul considera cosancionar resolução da ONU sobre direitos humanos na Coreia do norte", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 232814, "titulo": "Cambodian police and soldiers helped guard abusive scam compounds, Amnesty alleges", "url": "https://www.theguardian.com/world/2026/oct/29/cambodian-police-scam-compounds-amnesty-international", "fonte_id": "guardian_world", "data_pub": "2026-10-29T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Segundo um relatório da Amnesty Internacional, sobreviventes relataram que policiais e soldados servidores trabalharam como guardas em compêndios de estelionato onde milhares eram forçados a trabalhar na indústria de fraudes online. Os guardas teriam usado choques elétricos e espancamentos para manter as pessoas presas.", "titulo_pt": "Polícias e militares ajudaram a proteger compêndios de estelionato abusivos, acusa Amnesty", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 233059, "titulo": "Hong Kong teen jailed for 8 years for acid attack on Singaporean tourist", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3372525/hong-kong-teen-jailed-8-years-acid-attack-singaporean-tourist", "fonte_id": "scmp", "data_pub": "2026-10-29T04:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um adolescente com ligações a trios foi condenado a 8 anos de prisão por atacar uma turista de Singapura com líquido corrosivo em Hong Kong, em junho de 2025. A vítima, uma mulher de 36 anos, sofreu queimaduras de segundo grau e o ataque teve um impacto permanente em sua vida.", "titulo_pt": "Jovem de hong Kong condenado a 8 anos por ataque ácido a turista de singapura", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 232893, "titulo": "Ten years after the Calais 'jungle' was dismantled, migrants still wait in makeshift camps hoping to reach Britain", "url": "https://www.lemonde.fr/en/france/article/2026/10/29/ten-years-after-the-calais-jungle-was-dismantled-migrants-still-wait-in-makeshift-camps-in-hopes-of-reaching-britain_6766564_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-29T02:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde o desmantelamento, em 2016, da 'jungle' de Calais, que era então a maior área de acampamentos precários da Europa, pequenos acampamentos improvisados surgiram ao longo da costa norte da França, onde as organizações de ajuda relatam condições de vida insalubres. Migrantes continuam a esperar nestes acampamentos, esperando chegar ao Reino Unido.", "titulo_pt": "Dez anos após a 'jungle' de Calais ser desmantelada, migrantes ainda aguardam em acampamentos improvisados na costa francesa, esperando chegar ao reino unido", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 232201, "titulo": "Rights commission calls for leniency for ex-Coupang workers indicted in 'blacklist' case", "url": "https://en.yna.co.kr/view/AEN20261029003300315", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T01:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Anticorrupção e de Direitos Civis pediu clemência para os ex-funcionários da Coupang acusados no caso da 'lista negra'.", "titulo_pt": "Comissão de direitos civis pede clemência para ex-funcionários da coupang acusados no caso da 'lista negra'", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 231768, "titulo": "Albania imposes $6,000 fine for demonstrators present at a protest that turns violent", "url": "https://www.theguardian.com/world/2026/oct/29/albania-protest-attendance-fine-law", "fonte_id": "guardian_world", "data_pub": "2026-10-29T00:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Albânia introduziu multas de mais de $6.000 para demonstrantes que participam de protestos violentos, mesmo que não cometam atos violentos pessoais. A medida visa reprimir as manifestações que exigem o renúncia do primeiro-ministro, após meses de protestos anti-governo na capital Tirana que recentemente se deterioraram em confrontos entre forças de segurança e manifestantes.", "titulo_pt": "Albânia impõe multa de mais de $6.000 para demonstrantes em protestos violentos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 232042, "titulo": "UN experts sound alarm at excessive use of force in French student protests", "url": "https://www.aljazeera.com/news/2026/10/28/un-experts-sound-alarm-at-excessive-use-of-force-in-french-student-protests?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-28T22:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Obras-úteis das Nações Unidas condenaram as repressão policial excessiva durante as manifestações estudantis na França, advertindo que isso desestimula os manifestantes de exercerem seus direitos.", "titulo_pt": "Obras-úteis das nações unidas alertam sobre uso excessivo de força nas manifestações estudantis na França", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 232099, "titulo": "Seven Israeli attacks against West Bank farmers in 12 hours reported", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/seven-israeli-attacks-against-west-bank-farmers-12-hours-reported", "fonte_id": "middle_east_eye", "data_pub": "2026-10-28T18:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Colonização e Resistência ao Muro (CWRC) relatou sete ataques israelenses contra agricultores no último dia, em 12 horas, em quatro governos do Vale do Jordão. Os ataques incluíram derrubada de terras agrícolas, arrancamento de árvores, demolição de estruturas e destruição de tanques de água, detenção de agricultores e negação do acesso à terra, além do lançamento de animais em pomares de oliveira.", "titulo_pt": "Sete ataques israelenses contra agricultores palestinos no vale do jordão em 12 horas", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 231758, "titulo": "Egypt fines prominent editor Lina Attalah and shuts independent news outlet Mada Masr", "url": "https://www.theguardian.com/world/2026/oct/28/egypt-lina-attalah-mada-masr-press-freedom-clampdown", "fonte_id": "guardian_world", "data_pub": "2026-10-28T14:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A editora-chefe Lina Attalah, de destaque no Egito, foi solta após ser condenada por administrar um site não licenciado, e a sua publicação Mada Masr foi fechada por um tribunal. Isso ocorre num contexto de intensificação da repressão ao jornalismo independente no país.", "titulo_pt": "Egito condena editora-chefe e fecha jornal independente", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 231103, "titulo": "Chinese anti-scam blogger killed by contractors hired online to silence his work", "url": "https://www.scmp.com/news/china/politics/article/3372403/chinese-anti-scam-blogger-killed-contractors-hired-online-silence-his-work", "fonte_id": "scmp", "data_pub": "2026-10-28T06:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um blogueiro investigativo chinês, conhecido por expor fraudes em telecomunicações e outras atividades ilegais, foi morto por criminosos contratados online. O corpo de Wu Kai, que usava o nome 'Huijian' nas redes sociais, foi encontrado em novembro de 2024. A morte dele levou a pedidos por maiores punições para o caso.", "titulo_pt": "Blogueiro chinês contra-fraude morto por contratantes online", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 231076, "titulo": "Bereaved family of Kurdish man who died in custody sues Tokyo government", "url": "https://www.japantimes.co.jp/news/2026/10/28/japan/crime-legal/kurdish-man-custody-lawsuit/", "fonte_id": "japan_times", "data_pub": "2026-10-28T05:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A família do homem kurdo que faleceu em custódia acionou o governo de Tóquio em uma ação judicial. O advogado da família afirma que a morte reflete uma profunda falta de conscientização sobre os direitos humanos dentro da organização policial.", "titulo_pt": "Família do homem kurdo que morreu em custódia processa governo de tóquio", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 229961, "titulo": "\"Tuve más afecto en prisión que por parte de mis vecinos\": habló el bioquímico de Esquel detenido por mantener encerrada a su familia", "url": "https://www.clarin.com/sociedad/afecto-prision-parte-vecinos-hablo-bioquimico-esquel-detenido-mantener-encerrada-familia_0_KyzhvxOaHv.html", "fonte_id": "clarin", "data_pub": "2026-10-28T01:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Miguel Battista, de 71 anos, foi imputado em Esquel por privação ilegítima de liberdade e abandono de pessoa, acusado de ter mantido sua família em cárcere privado. Ele foi transferido para uma comisaria em Trevelin.", "titulo_pt": "Tive mais afeto em prisão que com meus vizinhos", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 229724, "titulo": "Jafar Panahi, que disputou Oscar, é condenado a cinco anos de prisão pelo Irã", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/jafar-panahi-que-disputou-oscar-e-condenado-a-cinco-anos-de-prisao-pelo-ira.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-28T00:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cineasta iraniano Jafar Panahi foi condenado a cinco anos e um mês de prisão pelo Tribunal Revolucionário de Teerã. Além da sentença, ele foi proibido de usar redes e viajar durante dois anos e teve seus bens confiscados.", "titulo_pt": "Jafar Panahi, vencedor do Oscar iraniano, é condenado a cinco anos de prisão", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 233085, "fonte_id": "the_verge", "titulo": "AI has come for Arizona’s water", "url": "https://www.theverge.com/cs/features/1016650/arizona-water-data-cen              <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
