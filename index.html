<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 27/10/2026 14:00 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">
      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>
      <option value="erro_traducao">Erro de tradução</option>
      <option value="classificacao_errada">Classificação errada</option>
      <option value="resumo_impreciso">Resumo impreciso</option>
      <option value="outro">Outro</option>
    </select>
    <label for="flag-nota">Nota (opcional)</label>
    <textarea id="flag-nota" placeholder="Descreva o problema..."></textarea>
    <div class="modal-btns">
      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "27/10/2026 14:00", "stats": {"noticias_novas": 1215, "resumos_gerados": 243}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Brasil enfrenta uma série de desafios políticos e econômicos, com destaque para a possível prisão do senador Flávio Bolsonaro e as medidas do governo Lula para proteger consumidores e empreendedores. Aliados do senador consideram a decisão do ministro Alexandre de Moraes precipitada e temem que ela fortaleça o discurso de perseguição política. O governo Lula também prorrogou o subsídio ao diesel por mais 30 dias, enquanto o ministro da SRI, José Guimarães, afirmou que um pacote de ajuste fiscal não é prioridade até o fim do ano. A reeleição de Lula em 2026 levantou questões sobre alianças políticas e a possibilidade de implementar uma agenda digital mais ambiciosa.", "mundo": "Luiz Inácio Lula da Silva venceu a segunda volta das eleições presidenciais no Brasil, superando o candidato de extrema direita Flávio Bolsonaro. Esta surpreendente vitória levou à queda da bolsa de valores. A vitória de Lula interrompeu a tendência de vitórias eleitorais da direita na América Latina, que vinha predominando desde o retorno de Donald Trump ao poder nos Estados Unidos em 2025. Em outro desenvolvimento, Israel realizou eleições históricas com a maior aderência eleitoral da sua história, enquanto a Coreia do Sul sediou uma conferência sobre a estabilidade financeira global em Seul. Além disso, a Rússia e a Ucrânia continuaram a negociar paz, com líderes nórdicos tendo conversas diretas com o presidente russo Vladimir Putin, enquanto o governo israelense reconheceu a vitória de Lula.\n\nAs tensões geopolíticas continuam a marcar a cena internacional, com foco especial na Ucrânia e no Oriente Médio. Em Oleshky, um cessar-fogo local foi brokerado por Melania Trump, enquanto forças russas continuaram a atacar cidades ucranianas, incluindo Kyiv, levando a preocupações sobre a escalada da guerra. Na Ásia, a China está buscando contornar tarifas de veículos elétricos na Europa através de estratégias industriais, enquanto o Japão e a Índia exploram a possibilidade de usar testes de lançamento indianos para seus próprios sistemas de armas. No âmbito político, o novo Ministro da Defesa do Reino Unido, John Healey, enfrenta a necessidade de envolver forças britânicas no Oriente Médio para proteger a infraestrutura de petróleo da Arábia Saudita, refletindo a complexidade das relações internacionais.", "economia": "O presidente do Banco Central, Gabriel Galípolo, afirmou que o BC só intervirá no mercado de câmbio se identificar uma disfunção. O ministro da Fazenda, Fernando Haddad, declarou que o governo buscará cumprir a meta fiscal por meio de diálogo com os agentes do mercado. O Banco Central informou que não há risco significativo para a estabilidade financeira do país, mesmo com a deterioração dos indicadores de crédito das famílias. A Novartis registrou despesas de US$ 2,2 bilhões relacionadas a fracassos em testes clínicos, mas elevou suas projeções de lucro para o ano. A Porsche declarou que não planeja produzir seus veículos nos Estados Unidos, enquanto a Nvidia e a Meta firmaram um acordo de investimento de US$ 3 bilhões. O gestor de hedge fund americano Rob Citrone aproveitou a queda da Bolsa para comprar ações em empresas brasileiras. O Brasil enfrenta desafios em termos de previsibilidade jurídica, o que impacta os investimentos no país. A Coreia do Sul superou as previsões de crescimento, embora a contração do consumo tenha destacado uma expansão cada vez mais desigual.", "tecnologia": "A tecnologia de inteligência artificial (IA) continua a dominar o cenário global, com destaque para a oferta inicial de ações (IPO) da Anthropic, que pode valer US$ 235 bilhões, refletindo a crescente importância da IA para a economia americana. A empresa apresentou um prospecto de IPO de 335 páginas, mas enfrenta riscos significativos, especialmente relacionados à China, conforme detalhados em seu documento de 93 páginas. O Departamento do Interior do Reino Unido usou a IA para processar solicitações de asilo, o que levou a uma investigação por preocupações sobre a precisão e a falta de transparência. Em outro desenvolvimento, a Vivo lançou serviços de telefonia via satélite no Brasil em parceria com a Starlink, oferecendo uma alternativa para áreas remotas. Além disso, a IA está ganhando terreno no comércio de ações de tecnologia, com as ações de empresas de IA como a Anthropic e a Meta avançando, seguindo o movimento de alta nos mercados asiáticos após o envio do pedido de IPO da Anthropic.", "ciencia": "A delegação de planejamento de viagens para agências de inteligência artificial (IA) está se tornando cada vez mais comum entre viajantes, independentemente de sua experiência, conforme relatado por [phys_org]. Em um desenvolvimento científico notável, duas soluções de IA de empresas diferentes resolveram problemas significativos em matemática, física e ciência da computação, mas já são controversas, conforme [scientific_american]. Um fungo gigante chamado Dianjunus rex foi descoberto na província de Yunnan, na China, com cogumelos que podem chegar a meio metro de altura, revelando novos aspectos da biologia e ecologia, conforme [science_news]. Além disso, a descoberta de um local de sepultamento abaixo da Basílica do Santo Sepulcro em Jerusalém, correspondendo às contas bíblicas do local onde Jesus foi sepultado, foi feita por arqueólogos italianos, conforme [euronews]. O uso de citações geradas por IA deve ser considerado conduta de pesquisa inadequada, conforme [nature_news], e a premiação Nobel de economia enfrenta um problema sério de gênero, conforme [nature_news].", "cultura": "Em 2027, o ano promete ser marcado por importantes eventos culturais. Um dos destaques será o show no intervalo do Super Bowl, que acontecerá em 14 de fevereiro no estádio SoFi em Inglewood, Califórnia. O rapper Jay-Z será o headliner do evento. Na mesma data, será exibido o documentário 'Moonage Daydream', dirigido por Brett Morgen, que trará em exibição gravações inéditas de dois shows do tour de 1978 de David Bowie. Além disso, será lançado nos cinemas o novo longa-metragem 'O Bosque Selvagem', em stop-motion, que destaca-se por sua abordagem artesanal. Na indústria de jogos da China, jogos como 'Phantom Blade Zero' estão ganhando reconhecimento internacional e competindo com grandes lançamentos de estúdios internacionais. A música clássica do compositor Leonardo Martinelli continua a se expandir, com trabalhos que integram cinema e poesia. A obra de Tetsuya Chiba, lendário autor de 'Ashita no Joe', será homenageada com a publicação de suas obras em um novo álbum.", "sociedade": "Nos últimos dez anos, a região de Penha e Alemão registrou mais de 1.800 tiroteios e 617 pessoas baleadas, com mais de um terço dos incidentes ocorrendo durante operações policiais. A Operação Contenção de 2025 resultou em 122 mortos. Em outro caso, a prefeita de Las Condes, no Chile, criticou o governo por sistemas de alerta insuficientes e falta de equipamentos para lidar com inundações. No Brasil, um dentista sofreu importunação sexual em uma academia na zona sul de São Paulo, com o suspeito ainda em liberdade. No Chile, o ministro Poduje visitou áreas afetadas por um tornado e anunciou subsídios para as casas danificadas. No sistema de cuidados para idosos, o Partido Verde pressiona para a introdução de uma avaliação humana na avaliação dos cuidados, após um relatório crítico da ombudsman. Na Coreia do Sul, um manual para trabalhadores migrantes será revisado após conter aconselhamento sobre evitar roupas reveladoras, que foi considerado inadequado. Finalmente, o presidente Lee Jae Myung sugere alternativas para acelerar o processo legislativo enquanto considera reduzir a idade de responsabilidade penal.", "meio_ambiente": "O gelo da geleira do Groenlândia registrou a 30ª perda consecutiva em 12 meses, marcando uma tendência preocupante. Em outro desenvolvimento, o chefe da Agência Internacional de Energia Renovável, Francesco la Camera, informou que o mundo adicionará menos capacidade de energia renovável em 2026 pela primeira vez em cinco anos, devido a problemas nas redes de transmissão e barreiras comerciais. A situação ambiental na região das Dolomitas também se agita, com o exército italiano removendo e desativando 250 explosivos presos na geleira por mais de 100 anos, após relatos de hikers. Em Fiji, os residentes da Ilha Serua rejeitam a ideia de relocação, querendo proteger sua casa ancestral e a cultura associada, enquanto Borneo luta contra a poluição do ar causada por incêndios florestais, que afetaram mais de 300 mil pessoas em sete províncias da Indonésia entre agosto e outubro.", "direitos_humanos": "Um relatório da Comissão Independente Internacional de Inquérito da ONU acusa Israel de cometer genocídio no enclave de Gaza após o cessar-fogo de outubro, brokerado pelos Estados Unidos. Israel, no entanto, rejeita essa acusação. Em outro evento, Kylian Mbappé se desculpou após uma montagem que o associou ao ditador chinês Mao Zedong, levando a perda de patrocínios e proibição de usar o aplicativo chinês de redes sociais. Em Paris, milhares se reuniram para homenagens após o assassinato de Pengo Bossio Wangi, refletindo a indignação compartilhada e as divisões políticas. Em Amman, famílias de vítimas negam qualquer ligação com o ataque à igreja, enquanto três ex-funcionários do governo recorrem ao Supremo Tribunal em apelação contra condenações por terem forçosamente repatriado dois pescadores norte-coreanos em 2019."}, "resumo_do_dia": {"politica_nacional": [{"id": 228571, "titulo": "Flávio em fuga? Dá para entender: o Estado de Direito não é pleno no Brasil", "url": "https://www.metropoles.com/colunas/mario-sabino/flavio-em-fuga-da-para-entender-o-estado-de-direito-nao-e-pleno-no-brasil", "fonte_id": "metropoles", "data_pub": "2026-10-27T16:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tudo indica que Flávio Bolsonaro está envolvido em alguma situação. Se a Polícia Federal e o Supremo Tribunal Federal estiverem realmente movendo uma ação premeditada, isso poderia classificar o senador como um perseguido político.", "titulo_pt": "Flávio em fuga? O Estado de Direito não é pleno no Brasil", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 228552, "titulo": "Governo Milei rejeita comentar vitória eleitoral de Lula", "url": "https://veja.abril.com.br/mundo/governo-milei-rejeita-comentar-vitoria-eleitoral-de-lula/", "fonte_id": "veja", "data_pub": "2026-10-27T15:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Milei na Argentina rejeitou comentar a vitória eleitoral de Lula no Brasil. A Casa Rosada argumentou que o presidente brasileiro não parabenizou o argentino em 2023, embora Lula tenha desejado 'sucesso' à gestão de Milei.", "titulo_pt": "Governo Milei ignora vitória eleitoral de Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 228432, "titulo": "Polícia Federal cancela passaportes de Flávio Bolsonaro", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/policia-federal-cancela-passaportes-de-flavio-bolsonaro", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-27T15:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal cancelou os passaportes do senador Flávio Bolsonaro após ele não entregar os documentos conforme determinação judicial. A PF vai informar o ministro Alexandre de Moraes sobre o não cumprimento da decisão.", "titulo_pt": "Polícia Federal cancela passaportes de Flávio Bolsonaro", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 228632, "titulo": "BC prevê novas medidas para proteger consumidor do endividamento", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/bc-preve-novas-medidas-para-proteger-consumidor-do-endividamento/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-27T15:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na semana passada, a autoridade monetária aprovou medidas que visam combater ofertas inadequadas ou abusivas de crédito e aumentar a transparência antes da contratação de operações de crédito. Essas ações buscam proteger os consumidores de endividamento excessivo.", "titulo_pt": "BC planeja novas medidas para proteger consumidores do endividamento", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 228452, "titulo": "Ofensiva de Trump contra energia eólica ameaça acordo sobre licenciamento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/10/ofensiva-de-trump-contra-energia-eolica-ameaca-acordo-sobre-licenciamento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T15:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo americano solicitou a revisão das autorizações para parques eólicos marítimos em Rhode Island, Maryland e Massachusetts, alegando falta de consideração dos impactos ambientais. As petições foram apresentadas à Justiça federal e pedem que os projetos sejam devolvidos ao Departamento do Interior.", "titulo_pt": "Ofensiva de Trump contra energia eólica ameaça acordo sobre licenciamento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 228555, "titulo": "A legião de aliados de Lula que perderam nas urnas e podem ganhar um ministério em 2027", "url": "https://veja.abril.com.br/brasil/a-legiao-de-aliados-de-lula-que-perderam-nas-urnas-e-podem-ganhar-um-ministerio-em-2027/", "fonte_id": "veja", "data_pub": "2026-10-27T15:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula pode ter até quarenta ministros em seu quarto mandato presidencial. O futuro dos ex-ministros Haddad, Tebet e Marina Silva é incerto.", "titulo_pt": "A legião de aliados de Lula que perderam nas urnas e podem ganhar um ministério em 2027", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 228453, "titulo": "Ministro da articulação política diz que ajuste fiscal não está em discussão e não é prioridade de Lula", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/ministro-da-articulacao-politica-diz-que-ajuste-fiscal-nao-esta-em-discussao-e-nao-e-prioridade-de-lula.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T15:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da SRI, José Guimarães, afirmou que um pacote de ajuste fiscal não é prioridade até o fim do ano e não está sendo discutido pelo governo. Este posicionamento foi dado durante uma entrevista à imprensa realizada em 27 de outubro de 2026.", "titulo_pt": "Ministro da articulação política diz que ajuste fiscal não está em pauta e não é prioridade", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 228513, "titulo": "Governo prorroga por um mês subvenção de R$ 2,12 ao diesel", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/governo-prorroga-por-um-mes-subvencao-de-r-212-ao-diesel", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-27T15:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal prorrogou por mais um mês a subvenção de R$ 2,12 por litro ao óleo diesel. A medida será formalizada por meio de uma portaria a ser publicada no Diário Oficial da União.", "titulo_pt": "Governo prorroga por um mês subvenção de R$ 2,12 ao diesel", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 228580, "titulo": "Moraes deve decretar prisão de Flávio em breve, apostam aliados do senador", "url": "https://www.metropoles.com/colunas/igor-gadelha/moraes-deve-decretar-prisao-de-flavio-em-breve-apostam-aliados-do-senador", "fonte_id": "metropoles", "data_pub": "2026-10-27T15:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados do senador Flávio Bolsonaro apostam que o ministro do STF Alexandre de Moraes decretará uma prisão preventiva contra ele após o senador não entregar os passaportes solicitados.", "titulo_pt": "Moraes deve decretar prisão de Flávio em breve, dizem aliados", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 228490, "titulo": "Flávio Bolsonaro descumpre determinação de Moraes e não entrega passaporte à PF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/flavio-bolsonaro-descumpre-determinacao-de-moraes-e-nao-entrega-passaporte-a-pf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-27T15:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro não entregou os passaportes à Polícia Federal até o prazo determinado pelo ministro Alexandre de Moraes, do STF. A entrega foi exigida por determinação judicial, mas não ocorreu até as 11h desta terça-feira (27).", "titulo_pt": "Flávio Bolsonaro não entrega passaporte à PF como determinou Moraes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 228583, "titulo": "Ministros de Lula culpam Moraes por possível fuga de Flávio Bolsonaro", "url": "https://www.metropoles.com/colunas/milena-teixeira/ministros-de-lula-culpam-moraes-por-possivel-fuga-de-flavio-bolsonaro", "fonte_id": "metropoles", "data_pub": "2026-10-27T15:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ministros do governo Lula atribuem a decisão de apreender o passaporte de Flávio Bolsonaro ao juiz federal Sergio Moraes. Eles consideram a medida como precipitada e temem que ela fortaleça o discurso de perseguição política contra o filho do presidente.", "titulo_pt": "Ministros de Lula atribuem apreensão de passaporte de Flávio Bolsonaro a Moraes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 228721, "titulo": "Tarcísio ‘zerou o jogo’ com a família Bolsonaro, avaliam aliados do governador", "url": "https://www.jota.info/eleicoes/eleicoes-2026/tarcisio-zerou-o-jogo-com-a-familia-bolsonaro-avaliam-aliados-do-governador", "fonte_id": "jota", "data_pub": "2026-10-27T15:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tarcísio, afilhado político de Jair Bolsonaro, ajudou Flávio Bolsonaro e agora está livre para concorrer em 2030, segundo seus interlocutores.", "titulo_pt": "Tarcísio 'zerou o jogo' com a família Bolsonaro, avaliam aliados do governador", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 228491, "titulo": "Piloto diz que funcionário de aeroporto relatou presença de Flávio na lista de passageiros de jato", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/piloto-diz-que-funcionario-de-aeroporto-relatou-presenca-de-flavio-na-lista-de-passageiros-de-jato.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-27T15:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O piloto Mauro Mattosinho afirmou ter recebido a informação de que o nome do senador Flávio Bolsonaro consta na lista de passageiros de um voo executivo em Puerto Iguazú, na Argentina. Este voo estaria ligado a um jato de propriedade privada.", "titulo_pt": "Piloto relata presença de Flávio bolsonaro na lista de passageiros de jato executivo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 228492, "titulo": "Kassab libera PSD para integrar governo Lula 4", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/kassab-libera-psd-para-integrar-governo-lula-4.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-27T14:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do PSD, Gilberto Kassab, declarou que membros do partido podem participar do governo de Luiz Inácio Lula da Silva, mas o partido manterá sua independência. A liberação ocorreu após a reeleição de Lula.", "titulo_pt": "Kassab autoriza PSD a integrar governo Lula 4", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 228515, "titulo": "Governo vai enviar MP do Imposto Seletivo e renova subvenção ao diesel", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/governo-enviara-mp-do-imposto-seletivo-e-renova-subvencao-ao-diesel", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-27T14:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, informou que o governo federal planeja enviar uma Medida Provisória (MP) para o Congresso Nacional estabelecendo as alíquotas do Imposto Seletivo (IS), que será aplicado a partir de 2027.", "titulo_pt": "Governo enviará MP do Imposto Seletivo e renovará subvenção ao diesel", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 228705, "titulo": "O hino composto por dom Pedro 1º que Lula transformou em canção da vitória", "url": "https://www.bbc.com/portuguese/articles/cjkge16rnzpqo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-27T14:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O hino original composto por Dom Pedro 1º foi adaptado por Lula para se tornar uma canção de vitória. A canção celebra a força do povo nacional, enfatizando que ele não deve ser submisso a interesses estrangeiros.", "titulo_pt": "O hino de dom Pedro 1º transformado em canção de vitória por Lula", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 229239, "titulo": "Israeli voter: 'A vote against fear, terror and inequality'", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-voter-vote-against-fear-terror-and-inequality", "fonte_id": "middle_east_eye", "data_pub": "2026-10-27T16:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma eleitora israelense de 77 anos, Fatima Hassan Bakri, considerou que as eleições atuais em Israel são decisivas, expressando que votou contra o medo, a terrorismo e a desigualdade. Ela apelou para que as mulheres saiam e votem com seus filhos.", "titulo_pt": "Voto contra medo, terrorismo e desigualdade", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 228888, "titulo": "Reader Q&A: After Lula’s sensational victory in Brazil’s presidential election, the Guardian’s Latin America correspondent answers your questions", "url": "https://www.theguardian.com/world/live/2026/oct/27/brazil-election-reader-questions-lula-bolsonaro", "fonte_id": "guardian_world", "data_pub": "2026-10-27T16:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva venceu de forma surpreendente a segunda volta das eleições presidenciais do Brasil, superando o rival de extrema direita Flávio Bolsonaro. A bolsa de valores caiu após o resultado, refletindo o impacto da vitória inesperada de Lula.", "titulo_pt": "Perguntas do leitor: como será o futuro do Brasil após A vitória surpreendente de Lula nas eleições presidenciais?", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 228897, "titulo": "Oleshky truce appears to hold as two European leaders have ‘frank’ call with Putin", "url": "https://www.theguardian.com/world/2026/oct/27/oleshky-truce-ukraine-russia-putin", "fonte_id": "guardian_world", "data_pub": "2026-10-27T16:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um cessar-fogo local em Oleshky, uma cidade ucraniana ocupada pela Rússia no sul do país, parece estar em vigor, com ambos os lados cessando ataques com drones, antes de uma possível evacuação de cerca de 2.000 civis presos. O cessar-fogo começou às 3h de ontem.", "titulo_pt": "Cessar-fogo em oleshky parece estar em vigor após conversa 'franca' com Putin", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 228898, "titulo": "Kyiv hopes for ‘new momentum’ in peace talks after Finnish and Norwegian leaders’ call with Putin – Europe live", "url": "https://www.theguardian.com/world/live/2026/oct/27/russia-ukraine-oleshky-serbia-france-europe-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-10-27T15:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Finnish e norueguês líderes tiveram conversas substanciais com Putin sobre negociações de paz, mas receberam reações céticas de alguns líderes europeus. Defensor britânico alertou que Putin está testando a determinação da Otan e advertiu sobre ameaças híbridas e terrorismo estatal russo.", "titulo_pt": "Kyiv espera por 'novo impulso' nas negociações de paz após conversas de líderes finlandeses e noruegueses com Putin – Europa em tempo real", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 229158, "titulo": "Israel turnout highest on record in historic election", "url": "https://www.ft.com/content/87d81352-5086-44bd-a5bb-797582e2d07c?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-27T15:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As urnas abertas em um histórico processo eleitoral israelense, com a aderência eleitoral sendo a mais alta da história do país. O voto se opõe a uma coalizão de direita liderada por Netanyahu contra um bloco de oposição em um embate próximo.", "titulo_pt": "Votação histórica com aderência eleitoral recorde em israel", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 228699, "titulo": "Por que Flávio Bolsonaro foi intimado a entregar os passaportes?", "url": "https://www.bbc.com/portuguese/articles/ck054vvj66g5o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-27T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro foi intimado a entregar seus passaportes em um processo relacionado a suspeitas de lavagem de dinheiro envolvendo o advogado Willer Tomaz. O senador negou qualquer intenção de deixar o país.", "titulo_pt": "Por que Flávio Bolsonaro foi intimado a entregar os passaportes?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 229244, "titulo": "UN inquiry finds Israel committed age-based persecution of Palestinian children in West Bank", "url": "https://www.middleeasteye.net/news/un-inquiry-finds-israel-committed-age-based-persecution-palestinian-children-west-bank", "fonte_id": "middle_east_eye", "data_pub": "2026-10-27T15:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma investigação da ONU concluiu que Israel cometeu perseguição baseada em idade contra crianças palestinas na Cisjordânia Ocidental. A investigação também menciona que o genocídio em Gaza continua e que há ataques generalizados e sistemáticos contra civis palestinos por parte das autoridades e forças israelenses.", "titulo_pt": "Investigação da ONU encontra que Israel cometeu perseguição baseada em idade contra crianças palestinas na cisjordânia ocidental", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 229000, "titulo": "Iraqi court jails French nationals for belonging to IS", "url": "https://www.lemonde.fr/en/international/article/2026/10/27/iraqi-court-jails-french-nationals-for-belonging-to-is_6765411_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-27T15:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sete cidadãos franceses foram condenados por um tribunal iraquiano por pertencerem a um grupo de 47 cidadãos franceses transferidos da Síria no ano anterior.", "titulo_pt": "Iraquiano condena cidadãos franceses por pertencerem ao estado islâmico", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 228701, "titulo": "Pesquisas erraram resultado da eleição? O que elas podem não ter captado, segundo especialistas", "url": "https://www.bbc.com/portuguese/articles/cq073jg7v3xeo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-27T15:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A abstenção foi menor do que previsto nas eleições. Especialistas afirmam que as pesquisas podem não ter capturado a mobilização nos últimos dias da campanha.", "titulo_pt": "Pesquisas erraram resultado da eleição? O que elas podem não ter captado, segundo especialistas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 228709, "titulo": "Como um movimento de estudantes nascido de uma tragédia acabou com 14 anos de domínio político na Sérvia", "url": "https://www.bbc.com/portuguese/articles/cqkg5lmdd33zo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-27T14:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um movimento de estudantes, que surgiu após dois anos de protestos e campanhas, venceu as eleições gerais na Sérvia com candidatos de uma lista que eles mesmos prepararam.", "titulo_pt": "Como um movimento de estudantes nascido de uma tragédia acabou com 14 anos de domínio político na Sérvia", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 229152, "titulo": "Putin speaks with Norwegian and Finnish leaders", "url": "https://www.ft.com/content/a384acd1-c90c-4b71-bf7d-6c6e00bf9822?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-27T14:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Putin conversou com líderes noruegueses e finlandeses. Esta é a primeira contato desse nível entre as partes em mais de um ano, enquanto Rússia e Ucrânia se preparam para negociações de paz mediadas pelos Estados Unidos.", "titulo_pt": "Putin fala com líderes noruegueses e finlandeses", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 228999, "titulo": "COP17 on biodiversity: 'Harmful subsidies' to nature take center stage at negotiations", "url": "https://www.lemonde.fr/en/environment/article/2026/10/27/cop17-on-biodiversity-harmful-subsidies-to-nature-take-center-stage-at-negotiations_6765376_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-27T14:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A presidência da Armênia na COP17 destacou o objetivo estabelecido em 2022 em Montreal, que visa reduzir subsídios prejudiciais à biodiversidade em pelo menos 500 bilhões de dólares por ano.", "titulo_pt": "COP17 sobre biodiversidade: 'subsídios prejudiciais' à natureza ganham destaque nas negociações", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 228723, "titulo": "Onde está Flávio Bolsonaro?", "url": "https://www.jota.info/eleicoes/eleicoes-2026/onde-esta-flavio-bolsonaro", "fonte_id": "jota", "data_pub": "2026-10-27T14:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal está investigando se a informação publicada pelo site argentino Infobae, de que Flávio Bolsonaro teria fugido, é verdadeira.", "titulo_pt": "Onde está Flávio Bolsonaro?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 228493, "titulo": "Órgão de migração e membro do governo Milei negam que Flávio Bolsonaro esteja na Argentina", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/orgao-de-migracao-e-membro-do-governo-milei-negam-que-flavio-bolsonaro-esteja-na-argentina.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-27T14:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O órgão de migração da Argentina e um funcionário do governo Javier Milei negaram que Flávio Bolsonaro esteja na Argentina. Flávio Bolsonaro foi derrotado nas eleições presidenciais pelo candidato do PT, Luiz Inácio Lula da Silva.", "titulo_pt": "Órgão de migração e membro do governo Milei negam que Flávio Bolsonaro esteja na Argentina", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 229294, "titulo": "EU Commission Unveils Reforms to Beef Up Border Agency", "url": "https://balkaninsight.com/2026/10/27/eu-commission-unveils-reforms-to-beef-up-border-agency/rd/", "fonte_id": "balkan_insight", "data_pub": "2026-10-27T14:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Europeia anunciou reformas para fortalecer a Agência Frontex, que passará a ser uma agência de retorno europeia integral, com a capacidade de intervenção em emergências fronteiriças e expansão de suas operações além da Europa.", "titulo_pt": "Comissão europeia revela reformas para fortalecer agência frontex", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 229305, "titulo": "Taiwan vows vigilance as Beijing releases detailed satellite imagery of island landmarks", "url": "https://www.scmp.com/news/china/military/article/3372328/taiwan-vows-vigilance-beijing-releases-detailed-satellite-imagery-island-landmarks", "fonte_id": "scmp", "data_pub": "2026-10-27T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Defesa de Taiwan declarou que manterá a vigilância após Pequim divulgar imagens de alta resolução de pontos turísticos da ilha, gerando preocupações sobre a capacidade de vigilância crescente. O ministro da Defesa, Wellington Koo Li-hsiung, afirmou que a vigilância não será reduzida em relação a todas essas imagens de satélite e atividades de coleta de inteligência direcionadas a Taiwan.", "titulo_pt": "Taiwan promete vigilância após pequim liberar imagens de satélite detalhadas do território", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 228451, "titulo": "BC só vai atuar no câmbio em caso de disfuncionalidade do mercado, diz Galípolo após alta do dólar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/bc-so-vai-atuar-no-cambio-em-caso-de-disfuncionalidade-do-mercado-diz-galipolo-apos-alta-do-dolar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T16:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Banco Central, Gabriel Galípolo, afirmou que o BC só intervirá no mercado de câmbio se identificar disfuncionalidade no mercado. Segundo ele, não haverá intervenção preventiva mesmo com a recente alta do dólar.", "titulo_pt": "BC só intervirá no câmbio em caso de disfuncionalidade do mercado, diz Galípolo após alta do dólar", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 228512, "titulo": "Governo buscará cumprir meta fiscal com diálogo, diz Durigan", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/governo-buscara-cumprir-meta-fiscal-com-dialogo-diz-durigan", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-27T16:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, afirmou que o governo federal buscará cumprir a meta fiscal por meio de diálogo com agentes do mercado financeiro e do setor privado. O compromisso do governo é com a responsabilidade fiscal e a estabilidade financeira.", "titulo_pt": "Governo buscará cumprir meta fiscal com diálogo, diz Durigan", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 228720, "titulo": "Banco Central ainda vai detalhar nova regra de parcerias do Open Finance", "url": "https://www.jota.info/tributos-e-empresas/mercado/banco-central-ainda-vai-detalhar-nova-regra-de-parcerias-do-open-finance", "fonte_id": "jota", "data_pub": "2026-10-27T15:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central ainda não detalhou completamente as novas regras para parcerias do Open Finance, mas deve especificar as regras para a prestação de informações em breve.", "titulo_pt": "Banco Central ainda vai detalhar novas regras para parcerias do Open Finance", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 228455, "titulo": "Gestora Advent capta US$ 30 bilhões e amplia 'poder de fogo' para investir no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/gestora-advent-capta-us-30-bilhoes-e-amplia-poder-de-fogo-para-investir-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T15:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A gestora de private equity Advent captou US$ 30 bilhões para seu mais recente conjunto de fundos, garantindo capital para investir em empresas de médio porte no Brasil. O movimento amplia o 'poder de fogo' da empresa.", "titulo_pt": "Gestora Advent captura US$ 30 bilhões e expande 'poder de fogo' para investir no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 228516, "titulo": "Banco Central diz que estabilidade financeira não está em risco", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/banco-central-diz-que-estabilidade-financeira-nao-esta-em-risco", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-27T14:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central informou que não há risco significativo para a estabilidade financeira do país, mesmo com a deterioração dos indicadores de crédito das famílias. O relatório de estabilidade financeira destaca que o sistema financeiro mantém níveis confortáveis de capitalização e liquidez, além de capacidade de resistir a cenários adversos.", "titulo_pt": "Banco Central afirma que estabilidade financeira não está em risco", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 228456, "titulo": "Durigan autoriza nova recompra de títulos pelo Tesouro após turbulência no mercado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/durigan-autoriza-nova-recompra-de-titulos-pelo-tesouro-apos-turbulencia-no-mercado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T14:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, autorizou o Tesouro Nacional a realizar uma nova rodada de recompra de títulos da dívida pública, caso seja necessário para controlar a turbulência no mercado financeiro após a reeleição do presidente Lula.", "titulo_pt": "Durigan autoriza nova recompra de títulos pelo Tesouro após turbulência no mercado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 228457, "titulo": "Novartis tem despesas de US$ 2,2 bilhões após fracassos em testes clínicos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/novartis-tem-despesas-de-us-22-bilhoes-apos-fracassos-em-testes-clinicos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T14:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Novartis registrou despesas de aproximadamente US$ 2,2 bilhões relacionadas a dois medicamentos que falharam em testes clínicos avançados. Mesmo com essas despesas, a empresa elevou suas projeções de lucro para o ano inteiro na terça-feira.", "titulo_pt": "Novartis registra despesas de US$ 2,2 bilhões após fracassos em testes clínicos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 228458, "titulo": "Axia Energia prevê financiamento de até R$ 680 milhões para transmissão", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/axia-energia-preve-financiamento-de-ate-r-680-milhoes-para-transmissao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T13:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Axia Energia firmou uma carta-mandato com o IDB Invest para estruturar um financiamento potencial de até R$ 680 milhões para investimentos em transmissão. O anúncio foi divulgado na terça-feira (27).", "titulo_pt": "Axia Energia assina carta-mandato para financiamento de até R$ 680 milhões para transmissão", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 228459, "titulo": "Boeing tem dívida líquida de US$ 25,2 bilhões no terceiro trimestre", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/boeing-tem-divida-liquida-de-us-252-bilhoes-no-terceiro-trimestre.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T13:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Boeing registrou um prejuízo maior do que o esperado no terceiro trimestre, devido a desafios na cadeia de suprimentos e atrasos na produção de aviões comerciais. A empresa também apresentou margens mais altas em outras áreas, mas isso não foi suficiente para compensar as perdas.", "titulo_pt": "Boeing registra dívida líquida de US$ 25,2 bilhões no terceiro trimestre", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 229161, "titulo": "Lula faces a fiscal reckoning after Brazil’s market rout", "url": "https://www.ft.com/content/0231b234-14dc-4ff0-8263-e1063b0a25d5?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-27T13:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Lula enfrenta pressões financeiras após uma forte depreciação da moeda brasileira, a pior desde há mais de 25 anos. Essas preocupações estão relacionadas à gestão da economia do país.", "titulo_pt": "Lula enfrenta crise fiscal após colapso do mercado financeiro no Brasil", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 228725, "titulo": "Apesar de desaceleração, ABFintechs vê espaço para consignado CLT crescer, diz líder de GT", "url": "https://www.jota.info/tributos-e-empresas/mercado/apesar-de-desaceleracao-abfintechs-ve-espaco-para-consignado-clt-crescer-diz-lider-de-gt", "fonte_id": "jota", "data_pub": "2026-10-27T13:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O líder de grupo de trabalho (GT) da ABFintechs, Jonatas Giovinazzo, afirma que há espaço para o consignado CLT crescer, mesmo diante de uma desaceleração. Ele destaca fatores como custo de capital, comportamento do mercado de trabalho e efetividade das garantias.", "titulo_pt": "Apesar da desaceleração, líder de GT da ABFintechs vê potencial para consignado CLT crescer", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 228461, "titulo": "TCU apura licitação de R$ 2 bi dos programas de microcrédito do Banco do Nordeste", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/tcu-apura-licitacao-de-r-2-bi-dos-programas-de-microcredito-do-banco-do-nordeste.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TCU pretende julgar, nas próximas semanas, se há irregularidades em licitações de cerca de R$ 2 bilhões realizadas pelo Banco do Nordeste para contratar operadores de dois programas de microcrédito.", "titulo_pt": "TCU vai julgar licitações de R$ 2 bi dos programas de microcrédito do Banco do Nordeste", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 228462, "titulo": "Sete números para entender os negócios da Anthropic", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/sete-numeros-para-entender-os-negocios-da-anthropic.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic, empresa de San Francisco por trás do Claude, divulgou seus dados financeiros pela primeira vez na segunda-feira (26) como parte da preparação para uma oferta inicial de ações bilionária que pode ocorrer no próximo mês.", "titulo_pt": "Sete números para entender os negócios da Anthropic", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 228463, "titulo": "BC registra 99 incidentes cibernéticos até setembro e já supera total de 2025", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/bc-registra-99-incidentes-ciberneticos-ate-setembro-e-ja-supera-total-de-2025.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T12:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central registrou 99 incidentes cibernéticos até setembro de 2026, número que já superou o total contabilizado em 2025, quando foram 76 casos. Em 2024, foram registrados 59 episódios cibernéticos.", "titulo_pt": "Banco central registra 99 incidentes cibernéticos até setembro e já supera total de 2025", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 228464, "titulo": "Tesouro cancela leilão de título prefixado e recompra papéis de longo prazo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/tesouro-cancela-leilao-de-titulo-prefixado-e-recompra-papeis-de-longo-prazo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T12:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tesouro Nacional cancelou o leilão de Letras Financeiras do Tesouro (LFT) programado para a terça-feira. A instituição também realizou a recompra de papéis de longo prazo.", "titulo_pt": "Tesouro cancela leilão de títulos prefixados e faz recompra de papéis de longo prazo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 228466, "titulo": "Dólar e juros futuros recuam após disparada com vitória de Lula; Bolsa oscila", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/dolar-abre-em-queda-apos-disparada-com-vitoria-de-lula-juros-futuros-recuam.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T12:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar e os juros futuros recuam nesta terça-feira após a forte alta registrada na véspera, influenciados pela reeleição do presidente Lula. A bolsa também oscila.", "titulo_pt": "Dólar e juros futuros recuam após disparada com vitória de Lula; Bolsa oscila", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 229354, "titulo": "Google’s next Genie AI model generates more realistic experiences", "url": "https://www.theverge.com/tech/1019076/google-genie-4-ai-model", "fonte_id": "the_verge", "data_pub": "2026-10-27T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google lançou o Genie 4, um modelo de IA que gera experiências interativas mais realistas. O modelo inclui atualizações que permitem a criação de mundos mais realistas, a atualização em tempo real com prompts de linguagem natural, a geração de áudio e a utilização do Gemini 3.8 Flash por trás das cortinas.", "titulo_pt": "Google anuncia o Genie 4, modelo de IA para gerar experiências interativas mais realistas", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 228821, "titulo": "La IA puede potenciar o hundir su negocio: su liderazgo es crítico", "url": "https://www.latercera.com/opinion/noticia/la-ia-puede-potenciar-o-hundir-su-negocio-su-liderazgo-es-critico/", "fonte_id": "la_tercera", "data_pub": "2026-10-27T15:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial pode fortalecer ou fragilizar o negócio de uma empresa, dependendo do seu liderado. O sucesso na implementação da IA depende crucialmente da liderança da empresa.", "titulo_pt": "A IA pode potencializar ou afundar seu negócio: seu liderado é crucial", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 229377, "titulo": "UK Home Office May Face Investigation Over Use of OpenAI Tools", "url": "https://www.wired.com/story/uk-home-office-may-face-investigation-over-use-of-openai-tools/", "fonte_id": "wired", "data_pub": "2026-10-27T15:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um órgão de vigilância governamental está considerando uma investigação sobre o uso da tecnologia ChatGPT pelo Departamento do Interior do Reino Unido para processar solicitações de asilo, devido às preocupações sobre a precisão dos ferramentas e a falta de transparência em seu uso.", "titulo_pt": "Órgão de vigilância do reino unido pode investigar uso de ferramentas do chatgpt", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 228933, "titulo": "Space Junk Is a Problem We Know How to Solve", "url": "https://foreignpolicy.com/2026/10/27/outer-space-junk-satellites-problem-solutions/", "fonte_id": "foreign_policy", "data_pub": "2026-10-27T14:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Satélites em megaconstelações estão transformando nossos céus noturnos. É hora de preencher os vazios na governança.", "titulo_pt": "Lixo espacial é um problema que sabemos como resolver", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 229157, "titulo": "Anthropic and the AI cluster effect in fundraising", "url": "https://www.ft.com/content/689a2114-57c5-4391-a335-dc97e5716610", "fonte_id": "financial_times", "data_pub": "2026-10-27T14:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta planeja uma oferta pública inicial de ações no valor de $95 bilhões, enquanto uma rival realiza uma oferta inicial de ações, demonstrando o efeito Hotelling no financiamento de inteligência artificial.", "titulo_pt": "Anthropic e o efeito de clusterização da IA em financiamento", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 229378, "titulo": "UK Politician Jess Asato Got Deepfaked. Now She’s Taking xAI to Court", "url": "https://www.wired.com/story/the-big-interview-podcast-jess-asato/", "fonte_id": "wired", "data_pub": "2026-10-27T13:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A deputada do Parlamento britânico Jess Asato se tornou vítima de um escândalo de deepfakes após sua campanha pública contra abuso online. Ela agora está processando a empresa Grok por essa abusiva prática.", "titulo_pt": "Deputada britânica Jess Asato processa empresa por escândalo de deepfakes", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 229159, "titulo": "Tech stocks gain as AI trade revives", "url": "https://www.ft.com/content/a4f9f81e-df30-4669-9eca-865d9d14e441?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-27T13:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ações de tecnologia ganham terreno com a renovação do comércio de investidores de inteligência artificial. A Ásia segue os mercados norte-americanos em alta após o envio do pedido de IPO do Anthropic.", "titulo_pt": "Ações de tecnologia avançam com reaquecimento do comércio de IA; ásia segue wall street", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 229309, "titulo": "How China ‘risk factors’ loom over Anthropic’s hotly anticipated IPO filing", "url": "https://www.scmp.com/tech/big-tech/article/3372329/how-china-risk-factors-loom-over-anthropics-hotly-anticipated-ipo-filing", "fonte_id": "scmp", "data_pub": "2026-10-27T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O prospecto de IPO do start-up de IA Anthropic menciona mais de uma dúzia de riscos relacionados à China, incluindo modelos de peso aberto, tensões entre China e EUA e a situação de Taiwan. Esses riscos são principalmente detalhados na seção de 'fatores de risco' de 93 páginas no documento apresentado à Comissão de Valores Mobiliários dos EUA.", "titulo_pt": "Como os riscos associados à China pairam sobre o IPO esperado do Anthropic", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 229464, "titulo": "I Used AI to Fake a Scientific Paper. Here’s What Happened", "url": "https://spectrum.ieee.org/ai-generated-scientific-papers", "fonte_id": "ieee_spectrum", "data_pub": "2026-10-27T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O spam científico está se tornando um problema em comunicações acadêmicas, com uma grande quantidade de conteúdo de baixa qualidade gerado por IA. Até 2025, cerca de 57% das publicações acadêmicas apresentaram evidências de influência de modelos de linguagem de grande porte, um aumento significativo em comparação com 12% em 2023.", "titulo_pt": "Eu usei IA para falsificar um artigo científico. E isso aconteceu", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 228465, "titulo": "Vivo lança telefonia via satélite no Brasil em parceria com a Starlink", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/vivo-lanca-telefonia-via-satelite-no-brasil-em-parceria-com-a-starlink.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-27T12:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Vivo começou a oferecer serviços de telefonia via satélite no Brasil em parceria com a function renderSecao(topico) {

function toggleDrill(id) {
  const el = document.getElementById(id);

  const aberta = el.classList.toggle("aberta");

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;

  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

    btn.textContent = ativo ? '⚑' : '⚐';
