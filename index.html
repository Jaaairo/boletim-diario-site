ists unveil skeletal remains believed to be ritual offering in Peru", "url": "https://phys.org/news/2026-08-archaeologists-unveil-skeletal-believed-ritual.html", "fonte_id": "phys_org", "data_pub": "2026-08-19T08:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Arqueólogos apresentaram os restos mortais de um adulto, que eles acreditam ter sido enterrado como oferenda perto da base da Huaca Pucllana, uma antiga pirâmide de adobe na capital do Peru, Lima.", "titulo_pt": "Arqueólogos revelam restos mortais considerados oferta ritual no Peru", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 111727, "titulo": "Alumni relationships can affect court rulings between judges and lawyers", "url": "https://phys.org/news/2026-08-alumni-relationships-affect-court-lawyers.html", "fonte_id": "phys_org", "data_pub": "2026-08-19T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos econômicos recentes revelam que os relacionamentos entre ex-alunos podem influenciar decisões judiciais entre juízes e advogados. Isso indica uma tendência de favoritismo em favor de membros do mesmo grupo, mesmo em um ambiente onde a imparcialidade é altamente valorizada.", "titulo_pt": "Relações de ex-alunos podem afetar decisões judiciais entre juízes e advogados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 111783, "titulo": "Behind the Lens: Meet NASA Johnson’s Photographers", "url": "https://www.nasa.gov/centers-and-facilities/johnson/behind-the-lens-meet-nasa-johnsons-photographers/", "fonte_id": "nasa_news", "data_pub": "2026-08-19T05:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fotógrafos da NASA no Centro Espacial Johnson em Houston registraram alguns dos momentos mais significativos da viagem humana ao espaço. Eles capturam treinamento de astronautas, testes de engenharia, operações de controle de missão e celebrações de marcos, preservando a história da exploração e retratando as pessoas e equipes por trás das missões que moldam a próxima era.", "titulo_pt": "Trás as câmeras: conheça os fotógrafos do centro espacial Johnson da NASA", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 111802, "titulo": "The Kristi Noem Statue Nobody Asked For", "url": "https://hyperallergic.com/the-kristi-noem-statue-nobody-asked-for/", "fonte_id": "hyperallergic", "data_pub": "2026-08-19T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hoje, duas visões distintas da vida cívica: a manutenção da Medina Triennial e uma escultura em homenagem a uma ex-secretária de Segurança Nacional desagrada a muitos.", "titulo_pt": "A estatua de Kristi Noem, que ninguém pediu", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 111078, "titulo": "Shakira anuncia US$ 1 mi para escolas após terremoto na Colômbia", "url": "https://www.poder360.com.br/poder-internacional/shakira-anuncia-us-1-mi-para-escolas-apos-terremoto-na-colombia/", "fonte_id": "poder360", "data_pub": "2026-08-19T09:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cantora Shakira anunciou uma doação de 1 milhão de dólares para a reconstrução de escolas na Colômbia após um terremoto. Além disso, a fundação de Howard Buffett vai construir 10 escolas no estado de Chocó.", "titulo_pt": "Shakira anuncia doação de 1 milhão para reconstrução de escolas após terremoto na Colômbia", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 111790, "titulo": "The Mythic, Mutable Worlds of Elizabeth Glaessner", "url": "https://www.artnews.com/art-in-america/columns/mythic-mutable-elizabeth-glaessner-painting-ppow-perrotin-1234794960/", "fonte_id": "artnews", "data_pub": "2026-08-19T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As pinturas de Elizabeth Glaessner apresentam mundos mitológicos e mutáveis, com personagens que evoluem ao longo do tempo.", "titulo_pt": "Os mundos mitológicos e mutáveis de Elizabeth Glaessner", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 111797, "titulo": "‘Jim Crow must go’: the artists and everyday heroes who fought injustice – in pictures", "url": "https://www.theguardian.com/artanddesign/gallery/2026/aug/19/turn-the-volume-up-nasher-museum-of-art", "fonte_id": "guardian_culture", "data_pub": "2026-08-19T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A exposição Turn the Volume Up! no Museu Nasher da Universidade Duke destaca a luta contra a injustiça realizada por pessoas comuns. O nome da exposição foi inspirado pelo rapper KRS-One, cuja música deu o mote para a celebração da ação coletiva e da resistência.", "titulo_pt": "Jim Crow deve sair: artistas e heróis cotidianos que lutaram contra a injustiça - em imagens", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 111799, "titulo": "Tivoli creates theme park Japanese neighbourhood in central Copenhagen", "url": "https://www.dezeen.com/2026/08/19/tivoli-theme-park-japanese-hikari-copenhagen/", "fonte_id": "dezeen", "data_pub": "2026-08-19T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O parque de diversões tivoli, em Copenhague, lançou a área Hikari, inspirada nas cidades do Japão, com arte de Takashi Murakami e respeito genuíno à sua origem. A área de 2.000 metros quadrados está localizada em uma parte do Tivoli que já tinha um jardim japonês e uma pagoda.", "titulo_pt": "Tivoli cria bairro temático japonês no centro de copenhague", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 111791, "titulo": "Shapes and ladders: Edinburgh fringe’s dance shows reach for the sky", "url": "https://www.theguardian.com/stage/2026/aug/19/edinburgh-fringe-dance-shows-circus", "fonte_id": "guardian_culture", "data_pub": "2026-08-19T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este ano, o programa de dança e circo do Edinburgh Fringe apresenta espetáculos com grande ambição e espírito de união, combinando força bruta, beleza, truques de partido e revelações pessoais. As dançarinas Donna Carnow e Gina Alm, em seu espetáculo Dusk/Night/Dawn, impressionam com técnicas avançadas usando apenas uma viga de pole dance, executando movimentos que parecem impossíveis.", "titulo_pt": "Formas e escadas: os espetáculos de dança do edinburgh fringe ousam e se unem", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 111682, "titulo": "Cicadas vanish before they can fly at Seoul's park. City responds with banners, patrols", "url": "https://www.koreaherald.com/article/10845770", "fonte_id": "korea_herald", "data_pub": "2026-08-19T08:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Seoul, cicadinhas jovens estão sendo coletadas antes de poderem voar, especialmente em um parque ecologico ao lado de um rio. Em resposta, a prefeitura colocou faixas informativas no local.", "titulo_pt": "Cicadinhas são coletadas antes de voar em parque de seul; cidade reage com faixas", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 111794, "titulo": "David Shrigley London exhibition will find the funny side of old masters", "url": "https://www.theguardian.com/artanddesign/2026/aug/19/david-shrigley-dulwich-picture-gallery-old-masters", "fonte_id": "guardian_culture", "data_pub": "2026-08-19T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "David Shrigley, um artista britânico contemporâneo, realizará uma exposição solo em Londres que apresentará suas obras ao lado de pinturas de mestres holandeses e flamencos do século XVII. O artista explorará as pinturas do século 17 com novas obras suas que interagem e respondem às obras originais de artistas como Jan Steen, Adriaen Brouwer, David Teniers o Júnior, Adriaen van Ostade e Pieter Brueghel o Júnior.", "titulo_pt": "Exposição de david Shrigley em londres encontrará o lado cômico dos mestres holandeses e flamencos", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 111800, "titulo": "IKEA's most recent collection is an \"entry point\" for young collectors", "url": "https://www.dezeen.com/2026/08/19/ikea-konstrunda-collection-collectible-design-art/", "fonte_id": "dezeen", "data_pub": "2026-08-19T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de móveis IKEA lançou a coleção limitada Konstrunda, que reinterpreta designs coletíveis de designers como Andu Masebo e outros, com preços acessíveis. A coleção inclui 22 peças criadas por sete designers.", "titulo_pt": "Ikea lança coleção konstrunda como 'ponto de entrada' para jovens colecionadores", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 111063, "titulo": "Por que Odisseu virou Ulisses e, depois, personagem moderno de James Joyce", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/caetano-w-galindo/2026/08/por-que-odisseu-virou-ulisses-e-depois-personagem-moderno-de-james-joyce.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A história de Odisseu se tornou conhecida como 'Odisseia'. O nome do épico grego veio a ser transliterado para 'Ulisses' na língua latina e, posteriormente, adaptado para 'Ulysses' em inglês. Este personagem evoluiu para se tornar um personagem moderno em obras literárias, como a 'Ulysses' de James Joyce.", "titulo_pt": "Por que Odisseu se tornou Ulisses e, mais tarde, um personagem moderno de James Joyce", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 111064, "titulo": "'Túmulo dos Vagalumes' volta aos cinemas com retrato sensível da guerra", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/tumulo-dos-vagalumes-volta-aos-cinemas-com-retrato-sensivel-da-guerra.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-19T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reestreia de 'Túmulo dos Vagalumes', de 1988, um clássico da animação japonesa produzido pelo Studio Ghibli, está sendo promovida pela rede Cinemark. Muitos fãs do estúdio vão comemorar o retorno do filme aos cinemas.", "titulo_pt": "Túmulo dos Vagalumes retorna aos cinemas com novo lançamento", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 111792, "titulo": "Where Are the Kings by Donal Ryan review – a timeless tale of family sorrows and joys", "url": "https://www.theguardian.com/books/2026/aug/19/where-are-the-kings-by-donal-ryan-review-a-timeless-tale-of-family-sorrows-and-joys", "fonte_id": "guardian_culture", "data_pub": "2026-08-19T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O livro 'Where Are the Kings' de Donal Ryan é uma história emocionante sobre a adolescência e a perda traumática da mãe, ambientada em uma região rural da Irlanda. O livro aborda temas de tristeza e alegria familiares.", "titulo_pt": "Onde estão os reis por Donal Ryan: uma história eterna de dores e alegrias familiares", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 111798, "titulo": "The digital child: how tech is changing play – in pictures", "url": "https://www.theguardian.com/artanddesign/gallery/2026/aug/19/wendy-mcmurdo-digital-child-tech-computers-internet", "fonte_id": "guardian_culture", "data_pub": "2026-08-19T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Wendy McMurdo, uma fotógrafa que desde os primórdios da computação e internet incorporou a tecnologia em seu trabalho, está exibindo sua maior exposição até agora. Nela, ela explora o impacto da tecnologia na geração futura.", "titulo_pt": "A criança digital: como a tecnologia está mudando o jogo - em imagens", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 111795, "titulo": "John Irvin, British film-maker who directed Tinker Tailor Soldier Spy, dies aged 86", "url": "https://www.theguardian.com/film/2026/aug/19/john-irvin-dead-british-director-tinker-tailor-soldier-spy-hamburger-hill", "fonte_id": "guardian_culture", "data_pub": "2026-08-19T04:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "John Irvin, diretor britânico conhecido por dirigir a minissérie Bafta vencedora Tinker Tailor Soldier Spy e filmes como Hamburger Hill, The Dogs of War e Raw Deal, faleceu aos 86 anos em 11 de agosto, em seu lar, cercado pela família.", "titulo_pt": "John Irvin, diretor britânico que dirigiu Tinker Tailor Soldier Spy, morre aos 86 anos", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 111065, "titulo": "SBT resgata episódios raros de Chaves para comemorar 45 anos da emissora", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/televisao/2026/08/sbt-resgata-episodios-raros-de-chaves-para-comemorar-45-anos-da-emissora.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-19T02:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O SBT está comemorando seus 45 anos com a exibição de episódios raros de 'Chaves', que foram resgatados de seu acervo, restaurados e tratados com tecnologia. Esses episódios serão exibidos para os fãs do seriado mexicano.", "titulo_pt": "SBT resgata episódios raros de Chaves para comemorar 45 anos", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 111066, "titulo": "Além de Carlos Cesare, relembre outros artistas que interpretaram Pablo no 'Qual é a Música'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/televisao/2026/08/alem-de-carlos-cesare-relembre-outros-artistas-que-interpretaram-pablo-no-qual-e-a-musica.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-19T02:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Carlos Cesare, um dos intérpretes do personagem Pablo no programa 'Qual é a Música', faleceu aos 60 anos no último fim de semana em São José dos Campos, interior de São Paulo. Ao longo das diferentes fases do quadro, outros quatro artistas também interpretaram o papel de Pablo.", "titulo_pt": "Além de Carlos Cesare, relembre outros artistas que interpretaram Pablo no 'Qual é a Música'", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 111647, "titulo": "Bangladesh launches women-only Pink Bus service in Dhaka", "url": "https://www.scmp.com/news/asia/south-asia/article/3364568/bangladesh-launches-women-only-pink-bus-service-dhaka?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-19T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bangladesh lançou um serviço de ônibus exclusivo para mulheres chamado 'Pink Bus' em Dhaka, com 14 ônibus operando, todos pilotados e conduzidos por mulheres. O programa visa fornecer uma opção de transporte dedicada e segura para as mulheres, com dez ônibus já em operação na capital e dois em cada uma das cidades de Chittagong e Bogra.", "titulo_pt": "Bangladesh lança serviço de ônibus rosa exclusivo para mulheres em Dhaka", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 111110, "titulo": "Ex-padrasto suspeito de matar adolescente de 14 anos é preso", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/ex-padrasto-suspeito-de-matar-adolescente-de-14-anos-e-preso", "fonte_id": "metropoles", "data_pub": "2026-08-19T09:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alice Nitz, uma adolescente de 14 anos, foi encontrada morta com marcas de esfaqueamento na segunda-feira, 17 de agosto. O ex-padrasto dela foi preso na noite da terça-feira, 18 de agosto.", "titulo_pt": "Ex-padrasto suspeito de matar adolescente de 14 anos é preso", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 111219, "titulo": "'O feminicídio gera órfãos como eu todos os dias': como irmãos que viram mãe ser assassinada e foram baleados pelo próprio pai lutaram durante 20 anos por Justiça", "url": "https://www.bbc.com/portuguese/articles/cy9w01pd0vwo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-19T09:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Maristela Just foi assassinada pelo seu ex-marido, que só foi preso após 23 anos. Os filhos, baleados pelo pai, lutaram por justiça durante 20 anos. Zaldo Just, um dos filhos, lançou um livro sobre a tragédia familiar e a superação de traumas.", "titulo_pt": "O feminicídio gerou órfãos como eu todos os dias: como irmãos que viram a mãe ser assassinada e foram baleados pelo próprio pai lutaram durante 20 anos por Justiça", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 111709, "titulo": "(LEAD) Activist group says will halt subway protest on gov't pledge to review disability rights budget", "url": "https://en.yna.co.kr/view/AEN20260819004251320", "fonte_id": "yonhap_news", "data_pub": "2026-08-19T07:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de ativistas anunciou que vai encerrar as manifestações de embarque na estação de metrô, após o governo se comprometer a revisar o orçamento relacionado aos direitos das pessoas com deficiência.", "titulo_pt": "Grupo de ativistas anunciará fim de protestos de metrô após promessa do governo de revisar orçamento de direitos das pessoas com deficiência", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 111372, "titulo": "Con homenaje a San Alberto Hurtado: La Moneda se ilumina por el Día de Nacional la Solidaridad", "url": "https://www.latercera.com/nacional/noticia/con-homenaje-a-san-alberto-hurtado-la-moneda-se-ilumina-por-el-dia-de-nacional-la-solidaridad/", "fonte_id": "la_tercera", "data_pub": "2026-08-19T04:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A noite do martes, uma projeção de uma peça visual em homenagem ao santo chileno San Alberto Hurtado foi realizada no frontispício do Palácio La Moneda. Este evento marcou o Dia Nacional da Solidariedade.", "titulo_pt": "Em homenagem a San Alberto Hurtado: la Moneda iluminado no dia Nacional da solidariedade", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 111373, "titulo": "Igualdad ante la ley y juego online: el informe que cuestiona la coherencia del Estado", "url": "https://www.latercera.com/publirreportajes/noticia/igualdad-ante-la-ley-y-juego-online-el-informe-que-cuestiona-la-coherencia-del-estado/", "fonte_id": "la_tercera", "data_pub": "2026-08-19T04:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um relatório do Instituto Res Publica examina o tratamento regulatório das casas de apostas em Chile, considerando a igualdade ante a lei, a liberdade de empreendedorismo e a não discriminação arbitrária. O documento sugere que todas as opções em discussão, incluindo a manutenção do esquema atual que regula os cassinos presenciais mas não legaliza as plataformas digitais, devem apresentar uma justificativa objetiva, razoável e proporcional.", "titulo_pt": "Igualdade perante a lei e jogos online: relatório questiona coerência do Estado", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 111128, "titulo": "‘Ajuda, SOS’: o grito de socorro dos agricultores afetados pelo terremoto na Colômbia", "url": "https://www.brasildefato.com.br/2026/08/18/ajuda-sos-o-grito-de-socorro-dos-agricultores-afetados-pelo-terremoto-na-colombia/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-19T00:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em áreas rurais do município de Ansermanuevo, na Colômbia, bandeiras com a mensagem 'Ajuda, SOS' alertam adas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 110578, "titulo": "Primeiros sinais do Super El Niño já começam a aparecer no Brasil", "url": "https://www.cnnbrasil.com.br/ciencia/primeiros-sinais-do-super-el-nino-ja-comecam-a-aparecer-no-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-18T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Chuvas no Rio Grande do Sul que afetaram mais de 84 mil pessoas são compatíveis com o padrão esperado do Super El Niño. O fenômeno já está apresentando sinais no Brasil.", "titulo_pt": "Primeiros sinais do Super El Niño já começam a aparecer no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 109888, "titulo": "Alerta roja en Antofagasta: evacúan seis sectores de Tocopilla por activación de quebradas", "url": "https://www.latercera.com/nacional/noticia/alerta-roja-en-antofagasta-evacuan-seis-sectores-de-tocopilla-por-activacion-de-quebradas/", "fonte_id": "la_tercera", "data_pub": "2026-08-18T17:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Prefeitura de Antofagasta emitiu um alerta vermelho e evacuou seis áreas de Tocopilla devido à atividade de quebradas. Os sectores afetados foram Pacífico Norte, Tres Marías, 5 de Outubro, 18 de Setembro, Almirante Riveros e O'Higgins.", "titulo_pt": "Alerta vermelho em Antofagasta: seis áreas de Tocopilla são evacuadas devido à atividade de quebradas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 109595, "titulo": "O que esperar do Super El Niño: fenômeno extremo pode virar clima do Brasil de cabeça para baixo", "url": "https://veja.abril.com.br/agenda-verde/o-que-esperar-do-super-el-nino-fenomeno-extremo-pode-virar-clima-do-brasil-de-cabeca-para-baixo/", "fonte_id": "veja", "data_pub": "2026-08-18T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Super El Niño, um fenômeno climático que ganha força no Pacífico, pode superar recorde e causar aumen , "texto_pt": "Um grupo não lucrativo que defende dietas vegetarianas ajuizou uma ação contra o governo de Trump por considerar que o processo das diretrizes alimentares foi manipulado por um 'painel secreto' de cientistas. A alegação é de que o Departamento de Saúde e Serviços Humanos (HHS) e o Departamento de Agricultura dos EUA (USDA) usaram esse painel para alterar as diretrizes alimentares.", "titulo_pt": "Grupo não lucrativo ajuiza ação contra governo de Trump por processos das diretrizes alimentares", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 111315, "titulo": "Cuando matar vuelve a ser solución", "url": "https://www.ciperchile.cl/2026/08/18/cuando-matar-vuelve-a-ser-solucion/?utm_source=rss&utm_medium=rss&utm_campaign=cuando-matar-vuelve-a-ser-solucion", "fonte_id": "ciper_chile", "data_pub": "2026-08-19T02:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O título original indica que o conteúdo aborda a volta da matança como uma solução possível. O texto original foi publicado inicialmente no CIPER Chile.", "titulo_pt": "Quando matar volta a ser solução", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 111316, "titulo": "Críticas transversales a estado de excepción de seguridad pública de reforma constitucional del gobierno; decretan estado de catástrofe en Tocopilla, y Clark e imputados en Caso Sartor quedan en prisión preventiva", "url": "https://www.ciperchile.cl/2026/08/18/radar-18-08-26/?utm_source=rss&utm_medium=rss&utm_campaign=radar-18-08-26", "fonte_id": "ciper_chile", "data_pub": "2026-08-18T23:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo implementou medidas de exceção de segurança pública e reforma constitucional. Em Tocopilla, foi decretado estado de catástrofe. Clark e outros envolvidos no Caso Sartor foram colocados em prisão preventiva.", "titulo_pt": "Críticas transversais ao estado de exceção de segurança pública da reforma constitucional do governo; Tocopilla decreta estado de catástrofe e Clark e imputados no Caso Sartor ficam em prisão preventiva", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 110557, "titulo": "MPF processa Renan Santos por discurso de ódio contra indígenas", "url": "https://www.metropoles.com/brasil/mpf-processa-renan-santos-por-discurso-de-odio-contra-indigenas", "fonte_id": "metropoles", "data_pub": "2026-08-18T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Federal (MPF) processou Renan Santos e o Movimento Renovação Liberal, que é responsável pelo Movimento Brasil Livre (MBL), por supostos discursos de ódio contra indígenas.", "titulo_pt": "MPF processa Renan Santos por discurso de ódio contra indígenas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 110854, "titulo": "'Afghan women fight and invent strategies to survive': A women's radio station and underground schools offer glimmers of hope", "url": "https://www.lemonde.fr/en/summer-reads/article/2026/08/18/afghan-women-fight-and-invent-strategies-to-survive-a-women-s-radio-station-and-underground-schools-offer-glimmers-of-hope_6756645_183.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-18T18:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estação de rádio Radio Begum, feita por mulheres para mulheres, é a única conexão com o mundo exterior para muitas mulheres afegãs. É um dos projetos que ajudam jovens garotas a acessarem a educação sob o regime do Talibã.", "titulo_pt": "Vozes de mulheres afegãs", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 109916, "titulo": "What Really Happens If China Wins the AI Race?", "url": "https://www.theatlantic.com/technology/2026/08/what-if-china-wins-ai-race/688256/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-08-18T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria de tecnologia tem retratado o desenvolvimento de inteligência artificial da China como uma ameaça existencial. No entanto, a realidade não é tão simples como isso.", "titulo_pt": "O que realmente acontece se a China vence a corrida da IA?", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 110208, "titulo": "Syrian court sentences detained Assad cousin to death for crimes against humanity", "url": "https://www.scmp.com/news/world/middle-east/article/3364452/syrian-court-sentences-detained-assad-cousin-death-crimes-against-humanity?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-18T11:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal sírio condenou Wassim al-Assad, primo do presidente Bashar al-Assad, à morte por crimes contra a humanidade, por múltiplos assassinatos e por assassinatos acompanhados de tortura e brutalidade durante a guerra civil que durou quase 14 anos.", "titulo_pt": "Cousinho de Assad condenado à morte por crimes contra a humanidade", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 109921, "titulo": "Islamophobia Has Corroded American Values", "url": "https://www.theatlantic.com/ideas/2026/08/muslim-experience-islamaphobia-united-states/688277/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-08-18T11:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mesmo imediatamente após o 11 de Setembro, os muçulmanos não eram tratados desta maneira.", "titulo_pt": "O islamofobia ameaçou os valores americanos", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 109859, "titulo": "‘Migration has been weaponised’: Italy’s security law criticised after death of Moroccan man in police restraint", "url": "https://www.theguardian.com/world/2026/aug/18/italy-security-law-death-moroccan-man-police-custody-abderrahim-fakir", "fonte_id": "guardian_world", "data_pub": "2026-08-18T10:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem marroquino chamado Abderrahim Fakir morreu durante uma retenção policial em Bologna, Itália, após a aprovação de uma lei de segurança que protege os policiais. O caso foi o primeiro em que a lei foi aplicada.", "titulo_pt": "Imigração armada: lei de segurança italiana criticada após morte de homem marroquino", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 109886, "titulo": "How the Supreme Court remade religious liberty in the Christian right’s image", "url": "https://www.vox.com/politics/499586/supreme-court-religion-republicans-win", "fonte_id": "vox", "data_pub": "2026-08-18T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal dos EUA, com uma maioria republicana, decidiu em uma das decisões religiosas mais significativas nos últimos decênios, na primeira votação significativa da ministra Amy Coney Barrett, sobre se as igrejas estavam incluídas nas exceções de emergência à restrição de aglomeração durante a pandemia.", "titulo_pt": "Como o supremo tribunal remodelou a liberdade religiosa à imagem do direito cristão", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 109104, "titulo": "Iran detains two artists who met with French diplomats", "url": "https://www.lemonde.fr/en/international/article/2026/08/18/iran-detains-two-artists-who-met-with-french-diplomats_6756616_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-18T08:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois artistas iranianos, Aria Kasaei e Elly Naghilou, foram detidos após se encontrar com diplomatas franceses para discutir um projeto cultural em 19 de julho. O caso e a forma como os diplomatas foram tratados causaram tensões entre Teerã e Paris.", "titulo_pt": "Irã detém dois artistas que se encontraram com diplomatas franceses", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 109206, "titulo": "Thousands mourn Jason Arday in London, blaming ‘racist’ press for his death", "url": "https://www.aljazeera.com/features/2026/8/18/tens-of-thousands-mourn-jason-arday-in-london-blaming-press-for-his-death?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-18T03:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas se lamentaram pela morte do ex-professor da Universidade de Cambridge, Jason Arday, em Londres. Os participantes acusaram a mídia de intensa e 'racista' de ter contribuído para sua morte.", "titulo_pt": "Milhares lamentam morte de Jason Arday em londres, acusando mídia 'racista'", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 111248, "fonte_id": "jota", "titulo": "Salomão assume a presidência do STJ em meio a investigações envolvendo outros ministros", "url": "https://www.jota.info/justica/salomao-assume-a-presidencia-do-stj-em-meio-a-investigacoes-envolvendo-outros-ministros", "data_pub": "2026-08-19T10:00:00Z", "topico": "politica_nacional", "idioma": "pt", "titulo_pt": "Salomão assume a presidência do STJ em meio a investigações", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 111422, "fonte_id": "npr_news", "titulo": "Striking hospital employees sound alarm over workplace violence", "url": "https://www.npr.org/2026/08/19/nx-s1-5930385/nurses-strike-hospital-workplace-violence-patient-attacks", "data_pub": "2026-08-19T10:00:00Z", "topico": "politica_internacional", "idioma": "en", "titulo_pt": "Grevistas de hospitais alertam sobre violência dos pacientes", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 111699, "fonte_id": "techcrunch", "titulo": "Relativity Networks raises $22 million to bring a faster kind of fiber to data centers", "url": "https://techcrunch.com/2026/08/19/relativity-networks-raises-22-million-to-bring-a-faster-kind-of-fiber-to-data-centers/", "data_pub": "2026-08-19T10:00:00Z", "topico": "tecnologia", "idioma": "en", "titulo_pt": "Relativity Networks arreca               ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
