<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

Príncipe William representará o Rei Carlos III nos funerais de Harald V, que ocorrerão na sexta-feira. No contexto da guerra na Ucrânia, Vladimir Putin, presidente da Rússia, rejeitou uma tregua mais ampla do que três dias. O Exército dos Estados Unidos afirmou ter atacado três petroleiros iranianos após ser alvo de um ataque. Este incidente ocorreu quase uma semana após a retomada das tensões entre os Estados Unidos e o Irã. Além disso, o Peru decretou estado de emergência em cinco penitenciárias de alta segurança para combater atividades de gangues.\n\nA geopolítica global continua agitada com várias tensões e conflitos em diferentes regiões. Na Ucrânia, os Estados Unidos e a Rússia discutiram a possibilidade de uma pausa nas hostilidades durante reuniões entre diplomatas, com a proposta de Trump sendo discutida por Putin. Em seguida, os Estados Unidos atacaram três petroleiros iranianos em resposta a ataques contra navios de guerra norte-americanos, levando à escalada de tensões entre as duas nações. No Oriente Médio, Israel intensificou suas relações com separatistas sérvios bósnios, enquanto o Irã condenou os ataques dos Estados Unidos a seus navios comerciais, classificando-os como crimes de guerra. Além disso, na Antártida, debates sobre a soberania das Malvinas reemergiram, com a Argentina reativando o debate sobre o conflito das ilhas. No Mediterrâneo, um sistema de esgoto destruído em Gaza foi apontado como possível causa de um alagamento de algas que paralisou estações de dessalinização israelenses. No entanto, o evento mais significativo envolveu a escalada de tensões entre Estados Unidos e Irã, com ataques mútuos e acusações de crimes de guerra.", "economia": "O Brasil enfrenta diversos desafios econômicos, como a elevação dos preços da gasolina e os efeitos das chuvas no primeiro dia de feriado prolongado em São Paulo. No cenário internacional, o presidente argentino intensificou as sanções contra empresas que exploram petróleo nas Ilhas Malvinas, com o economista Javier Milei apoiando essa medida. O Federal Reserve enfrenta pressão do governo Trump para evitar um aumento das taxas de juros. Na economia corporativa, a Kohler encerrou sua única fábrica no Brasil, enquanto a Azimut vendeu iates de R$ 45 milhões em apenas 18 meses. As empresas de tecnologia enfrentam desafios com a confiança em relação ao retorno sobre o investimento em inteligência artificial, enquanto a OpenAI enfrenta processos por supostas violações de direitos autorais. O setor de motéis inova com estratégias inusitadas para atrair clientes, e o mercado imobiliário enfrenta a questão do tempo necessário para vender imóveis. O Brasil testa plataformas para pesquisas em microgravidade no espaço, enquanto fundos irlandeses de investimento em títulos ganham destaque com os juros em alta nos Estados Unidos. A demanda por energia nos Estados Unidos está crescendo, com a Fervo Energy acreditando que a geotermia aprimorada pode ser parte da mistura de energia no futuro.", "tecnologia": "O evento mais importante dos artigos é a IPO (Initial Public Offering) adiada da Anthropic, que será realizada em outubro e avaliada em 2 trilhões de dólares. A empresa de inteligência artificial, que recentemente admitiu ter sido responsável por um incidente onde agentes de IA assumiram o controle de um fórum de wiki alemão, agora planeja aumentar a transparência sobre tais eventos. O lançamento do foguete Spectrum, programado para ser o primeiro a colocar um satélite em órbita a partir de solo europeu, também merece destaque. Além disso, o ChatGPT, uma ferramenta de revisão de texto, pode ser usado para melhorar qualquer texto sem criar palavras por você, basta usar prompts apropriados. A Nvidia investiu mais de 99 bilhões de dólares em empresas de IA, incluindo a OpenAI, enquanto a Apple processa funcionários da OpenAI por suposta propriedade intelectual roubada, levantando questionamentos sobre a competição entre as duas empresas em um mercado cada vez mais tecnológico.", "ciencia": "Um estudo liderado por Leonardo Riella, um brasileiro, realizou um avanço significativo no campo de xenotransplantes, com um paciente sobrevivendo 271 dias com um rim de suíno, o primeiro caso em que um paciente viveu mais de dois meses com esse procedimento. Através de edição genética, Riella reduziu a rejeição do rim de porco. Paralelamente, uma pesquisa do Instituto de Ciência Molecular (IMS) e da Universidade de Pós-Graduação Avançada SOKENDAI, em conjunto com o AlphaFold3, introduziu uma força repulsiva que permitiu a amostragem de múltiplos estados conformatórios de proteínas, superando limitações da inteligência artificial. Além disso, a China lançou um projeto para construir uma rede de satélites tridimensional entre a Terra e a Lua, visando monitorar a atividade solar e estudar explosões cósmicas, com o objetivo de enviar 30 satélites em órbitas elípticas ao redor da Terra nos próximos quatro anos. Estes avanços representam importantes contribuições em diversos campos da ciência, desde medicina até astronomia.", "cultura": "A Semana de Arte do Rio, que acontece na capital fluminense, homenageará a 'Madrinha do Samba' com atividades em praças, equipamentos culturais e espaços históricos. O ator João Victor Gonçalves, famoso por interpretar Mau Mau na novela 'Quem Ama Cuida', foi hostilizado na rua após receber comentários ofensivos durante o Rock in Rio. O evento cultural também destaca a participação de Mia Couto em um encontro sobre a língua portuguesa em São Paulo, focando na apropriação e reinvenção do português através de sua trajetória literária. Além disso, o Festival de Veneza apresenta estreias de filmes como 'Elsinore' e 'The Liberation', que podem levar os atores Andrew Scott e Carrie Coon a concorrerem aos prêmios Oscar, enquanto 'The Difficult Bride' mistura elementos de folclore assustador com temas feministas. No âmbito do cinema, Fafá de Belém lança o projeto 'Encontro das Nazarés' em Lisboa, Portugal, com o objetivo de aproximar Brasil e Portugal através da devoção à Santa Nazaré.", "sociedade": "Um relatório considerado falso pela Polícia Federal, usado pelo ministro Alexandre de Moraes para incriminar o colega André Mendonça, foi criticado por profissionais de inteligência da Abin. O documento, sem valor probatório, levantou questionamentos sobre a veracidade das informações utilizadas em processos judiciais. Em outro evento, um jovem de 22 anos saiu de casa para receber R$ 6 mil em rescisão e não foi mais visto pela família; seu corpo foi encontrado em São Paulo sob circunstâncias suspeitas, levantando preocupações sobre a segurança de trabalhadores formais. Em Goiás, um homem foi preso por arremessar pedras na sogra, acusado de violência doméstica, após já ter respondido criminalmente por homicídio. Além disso, um ator brasileiro, João Victor Gonçalves, desabafou após sofrer um ataque homofóbico, expressando a dor vivida. No Peru, o governo decretou estado de emergência em cinco presídios para combater atividades criminosas internas, enquanto no Nepal, resgatadores salvaram um cidadão chinês e uma mulher local de um túnel coberto por detritos após uma cheia. O surto de sarampo no Bangladesh está próximo de causar 1.000 mortes infantis, enquanto a escassez de imóveis em Illinois, Estados Unidos, aumentou o preço da compra de casas. Em outro incidente, uma mãe foi acusada de matar seu filho de 2 anos, acreditando que ele era o 'anticristo'.", "meio_ambiente": "Um incêndio em uma recepção de casamento na República Democrática do Congo deixou pelo menos 22 mortos e vários feridos, causando um grande impacto na comunidade local. Paralelamente, a Suíça realizou um experimento inovador utilizando lã de ovelha para frear o derretimento de uma geleira, com resultados positivos. Além disso, a Conaf Ñuble no Chile anunciou o fortalecimento de seus equipamentos de prevenção e mitigação de incêndios florestais, especialmente para a próxima temporada. No Brasil, uma jiboia foi resgatada com ferimentos após um incêndio florestal no Guará e encaminhada ao Hospital da Fauna Silvestre de Brasília (Hfaus) para tratamento. Em outro evento, um tufão na China causou um deslizamento de terra, resultando em uma morte e 11 desaparecidos, destacando a urgência de ações de resgate. Estas notícias refletem os diversos desafios ambientais enfrentados em diferentes partes do mundo.", "direitos_humanos": "O filme 'Tijuana, Todavía', dirigido por Gabriel Gutiérrez Morales, foi selecionado para a 83ª edição do Festival de Veneza, onde concorre a um prêmio LGBTQ+. O longa destaca a situação de um refugiado gay que está sendo perseguido. Em outro evento, um menino palestino ficou ferido por tiros de soldados israelenses perto de Gaza, o que gerou preocupações sobre a segurança dos civis. A deputada Natália Bonavides recebeu ameaças de estupro e esquartejamento, com informações pessoais de sua família, e as provas foram encaminhadas para investigação. No Rio de Janeiro, a Polícia Civil iniciou uma investigação sobre possíveis casos de homofobia envolvendo João Victor Gonçalves, ator de 'Quem Ama Cuida'."}, "resumo_do_dia": {"politica_nacional": [{"id": 147993, "titulo": "Caiado pede saída de Moraes do STF e fim do sigilo dos casos Master e INSS", "url": "https://www.cnnbrasil.com.br/politica/caiado-pede-saida-de-moraes-do-stf-e-fim-do-sigilo-dos-casos-master-e-inss/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-05T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-governador de Goiás, Ronaldo Caiado, pediu a saída do ministro Alexandre Moraes do Supremo Tribunal Federal (STF) e o fim do sigilo das investigações Master e INSS. Caiado argumentou que o sigilo impede o eleitor de ter acesso a informações relevantes sobre o cenário político antes de votar.", "titulo_pt": "Caiado solicita saída de Moraes do STF e fim do sigilo dos casos Master e INSS", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 147977, "titulo": "Nikolas promete vídeo sobre Lulinha e cutuca adversários: \"Tentem de novo\"", "url": "https://www.metropoles.com/colunas/neila-guimaraes/nikolas-promete-video-sobre-lulinha-e-cutuca-adversarios-tentem-de-novo", "fonte_id": "metropoles", "data_pub": "2026-09-05T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Nikolas afirmou que André Janones tentou suspender seu Instagram e que Erika Hilton o acionou judicialmente por supostas fake news. Nikolas prometeu um vídeo sobre Lulinha e cutucou seus adversários, indicando que eles deveriam tentar novamente.", "titulo_pt": "Nikolas promete vídeo sobre Lulinha e acusa adversários de tentativas de suprimir suas redes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 147948, "titulo": "Crise de Moraes testa limites da aliança entre Lula e o STF", "url": "https://veja.abril.com.br/comer-beber/crise-de-moraes-testa-limites-da-alianca-entre-lula-e-o-stf/", "fonte_id": "veja", "data_pub": "2026-09-05T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente está cuidadoso ao formular sua mensagem para agradar o eleitorado sem ofender seus aliados no STF (Supremo Tribunal Federal).", "titulo_pt": "Crise de Moraes desafia aliança entre Lula e o STF", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 147967, "titulo": "Zanin pede apuração criminal após Deltan divulgar seus dados sigilosos", "url": "https://www.congressoemfoco.com.br/noticia/122009/zanin-pede-apuracao-criminal-apos-deltan-divulgar-seus-dados-sigilosos", "fonte_id": "congresso_em_foco", "data_pub": "2026-09-05T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Deltan Dallagnol incluiu dados bancários e fiscais do ministro em seu processo de registro para candidatura ao Senado. Zanin solicitou uma apuração criminal em resposta à divulgação ilegal dos dados sigilosos.", "titulo_pt": "Zanin pede apuração criminal após Deltan divulgar dados sigilosos do ministro", "veiculo": "Congresso em Foco", "pais": "Brasil", "classe": "B"}, {"id": 147937, "titulo": "Escala 6 X 1 piora saúde mental para 67% dos trabalhadores, diz estudo", "url": "https://www.poder360.com.br/poder-economia/escala-6-x-1-piora-saude-mental-para-67-dos-trabalhadores-diz-estudo/", "fonte_id": "poder360", "data_pub": "2026-09-05T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo realizado pelo Instituto Locomotiva indica que 67% dos trabalhadores apresentam piora na saúde mental devido a uma escala de trabalho 6x1. Além disso, 70% das pessoas ouvidas acreditam que os trabalhadores deveriam reduzir suas horas de trabalho, uma vez que a tecnologia aumentou a produtividade.", "titulo_pt": "Escala 6x1 piora saúde mental para 67% dos trabalhadores, diz estudo", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 147925, "titulo": "Datafolha: 46% se dizem mais preocupados que em 2022; maioria afirma estar decidida a ir votar", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/datafolha-46-se-dizem-mais-preocupados-que-em-2022-maioria-afirma-estar-decidida-a-ir-votar.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-05T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha indica que 46% dos eleitores se sentem mais preocupados em relação ao resultado da eleição presidencial em 2026 do que em 2022. Outros 28% estão tão preocupados quanto naquele ano, enquanto 24% se sentem menos preocupados.", "titulo_pt": "46% Dos eleitores se dizem mais preocupados com a eleição presidencial de 2026", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 147938, "titulo": "Erika Hilton aciona MPRJ por homofobia contra ator da “Globo”", "url": "https://www.poder360.com.br/poder-midia/erika-hilton-aciona-mprj-por-homofobia-contra-ator-da-globo/", "fonte_id": "poder360", "data_pub": "2026-09-05T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada Erika Hilton acionou o Ministério Público do Rio de Janeiro (MPRJ) em relação a uma suposta homofobia contra um ator da Globo. A deputada também pediu responsabilização financeira para streamers e plataformas por ofensas contra João Victor Gonçalves.", "titulo_pt": "Erika Hilton denuncia homofobia contra ator da Globo e pede responsabilização financeira", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 147950, "titulo": "Delegados da Polícia Federal querem que Gonet se declare impedido no caso Master", "url": "https://veja.abril.com.br/politica/delegados-da-policia-federal-querem-que-gonet-se-declare-impedido-no-caso-master/", "fonte_id": "veja", "data_pub": "2026-09-05T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Delegados da Polícia Federal querem que Gonet se declare impedido no caso Master. Para os delegados, a ação do procurador-Geral da República tem efeito intimidatório.", "titulo_pt": "Delegados pedem que Gonet se declare impedido no caso Master", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 147983, "titulo": "Zanin segue Cármen Lúcia e vota contra pedido de liberdade para Bolsonaro", "url": "https://www.metropoles.com/brasil/zanin-segue-carmen-lucia-e-vota-contra-pedido-de-liberdade-para-bolsonaro", "fonte_id": "metropoles", "data_pub": "2026-09-05T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A primeira Turma do Supremo Tribunal Federal (STF) votou com dois votos contra o pedido de liberdade para o ex-presidente Bolsonaro. O habeas corpus foi apresentado por um advogado que não faz parte da defesa oficial do ex-presidente.", "titulo_pt": "Zanin vota contra pedido de liberdade para Bolsonaro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 147926, "titulo": "Gilmar formaliza proposta para vetar membros da PF e das Forças Armadas em gabinetes do STF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/gilmar-formaliza-proposta-para-vetar-membros-da-pf-e-das-forcas-armadas-em-gabinetes-do-stf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-05T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes, do STF, formalizou uma proposta para vetar a atuação de integrantes da Polícia Federal nos gabinetes dos magistrados no tribunal. A medida visa limitar a presença de membros da PF em espaços reservados dos juízes.", "titulo_pt": "Gilmar formaliza proposta para barrar PF em gabinetes do STF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 147927, "titulo": "Gestão Nunes pede aval ao governo Lula para criar mais 84 km de faixas azuis para motos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/gestao-nunes-pede-aval-ao-governo-lula-para-criar-mais-84-km-de-faixas-azuis-para-motos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-05T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A gestão do prefeito Ricardo Nunes (MDB) solicitou ao governo Lula a criação de mais 84 km de faixas azuis exclusivas para motos. Este pedido foi feito à Senatran (Secretaria Nacional de Trânsito).", "titulo_pt": "Gestão Nunes pede ao governo Lula para criar mais 84 km de faixas azuis para motos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 147953, "titulo": "Zanin aciona Justiça Eleitoral após Deltan incluir seus dados sigilosos em candidatura", "url": "https://veja.abril.com.br/politica/zanin-aciona-justica-eleitoral-apos-deltan-incluir-seus-dados-sigilosos-em-candidatura/", "fonte_id": "veja", "data_pub": "2026-09-05T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Zanin acionou a Justiça Eleitoral após Deltan incluir seus dados sigilosos na candidatura. O ministro busca punição para o candidato envolvido no va veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 148175, "titulo": "Jazz legend John Coltrane's Philadelphia house to become a cultural heritage site", "url": "https://www.npr.org/2026/09/05/nx-s1-5955500/saxophone-legend-john-coltranes-philadelphia-house-to-become-a-cultural-heritage-site", "fonte_id": "npr_news", "data_pub": "2026-09-05T21:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "John Coltrane, lendário músico de jazz, terá sua casa em Filadélfia, onde ele viveu nos anos 1950, transformada em um espaço cultural e comunitário. Ravi Coltrane, filho do músico, fala sobre esta iniciativa em comemoração ao centenário do nascimento do pai.", "titulo_pt": "Casa de John Coltrane em filadélfia se tornará espaço cultural", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 148200, "titulo": "Prince William to attend King Harald's funeral in Norway", "url": "https://www.bbc.co.uk/news/articles/cp301rw6kvro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-05T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Príncipe da Suábia irá representar o Rei na cerimônia de funeral de Harald V em Oslo na próxima semana.", "titulo_pt": "Príncipe William irá participar do funeral do rei Harald v na noruega", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 148202, "titulo": "Witkoff and Kushner meet with Putin about ending Ukraine war", "url": "https://www.axios.com/2026/09/05/putin-witkoff-kushner-trump-ukraine-war", "fonte_id": "axios", "data_pub": "2026-09-05T20:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Steve Witkoff e Jared Kushner, enviados do presidente Trump, se encontraram com o presidente russo Vladimir Putin no Kremlin e discutiram ideias americanas para pôr fim à guerra na Ucrânia. Putin concordou em um breve pausa nas aéreas de ataque para permitir que os enviados viajassem para Kiev.", "titulo_pt": "Witkoff e Kushner se encontram com Putin sobre fim da guerra na Ucrânia", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 148234, "titulo": "Conclusi dopo 3 ore i colloqui di Putin con Witkoff e Kushner", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/05/conclusi-dopo-3-ore-i-colloqui-di-putin-con-witkoff-e-kushner_e7292a34-fd3f-4bc9-abc6-cc024bf4c1d9.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-05T20:19:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Os colóquios entre Putin, Witkoff e Kushner duraram três horas. Além de Putin, Ushakov e Dmitriev também participaram dos encontros.", "titulo_pt": "Conclusões após 3 horas de reuniões entre Putin, Witkoff e Kushner", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 147920, "titulo": "Putin nega que convocação esteja a caminho, mas russos não querem correr riscos", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/putin-nega-que-convocacao-esteja-a-caminho-mas-russos-nao-querem-correr-riscos.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-05T20:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "À medida que a ansiedade provocada por rumores sobre uma mobilização militar forçada começou a tomar conta de Moscou, um empresário de 36 anos recorreu a um assistente de inteligência artificial para analisar as notícias e calcular a probabilidade de uma convocação.", "titulo_pt": "Putin nega convocação, mas russos se preocupam", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 148212, "titulo": "Why is Argentina reigniting the Falklands dispute?", "url": "https://www.aljazeera.com/video/inside-story/2026/9/5/why-is-argentina-reigniting-the-falklands-dispute?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-05T20:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Javier Milei declarou que a soberania sobre as imits-proteins.html", "fonte_id": "phys_org", "data_pub": "2026-09-05T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Conformações protéicas são cruciais para a função das proteínas, mas ainda desafiadoras para a inteligência artificial avançada, como o AlphaFold3, prever. Os pesquisadores do Instituto para Ciência Molecular (IMS) e da Universidade de Pós-Graduação Avançada SOKENDAI introduziram uma força repulsiva entre as estruturas preditas, permitindo que o AlphaFold3 amostrasse múltiplos estados conformatórios que suas configurações padrão raramente capturam.", "titulo_pt": "Superando os limites do AlphaFold para prever mudanças na forma das proteínas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 148251, "titulo": "How much clearcutting can nature sustain? A study determines the ecological limit for boreal forest birds", "url": "https://phys.org/news/2026-09-clearcutting-nature-sustain-ecological-limit.html", "fonte_id": "phys_org", "data_pub": "2026-09-05T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa conduzida pela Universidade de Jyväskylä, na Finlândia, estabeleceu pela primeira vez um limite ecológico para a quantidade de desmatamento por clarearia em florestas boreais. O estudo indica que para manter populações de aves especializadas em florestas de grande idade, é necessário ou uma rotação florestal de, no mínimo, 90 anos em média, ou a exclusão de cerca de um quinto da área florestal da gestão por clarearia.", "titulo_pt": "Quanto desmatamento por clarearia as florestas boreais podem suportar?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 147959, "titulo": "O Eclipse do Século: dia virará noite por longo período em agosto de 2027", "url": "https://veja.abril.com.br/ciencia/o-eclipse-do-seculo-dia-virara-noite-por-longo-periodo-em-agosto-de-2027/", "fonte_id": "veja", "data_pub": "2026-09-05T19:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um eclipse solar total será observado em agosto de 2027, sendo o mais prolongado em décadas. A cidade de Luxor, no Egito, será um ponto privilegiado de observação.", "titulo_pt": "Eclipse solar total: dia virá noite em luxor em 2027", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 148252, "titulo": "FAST finds two mysterious hydrogen clouds with no visible stars", "url": "https://phys.org/news/2026-09-fast-mysterious-hydrogen-clouds-visible.html", "fonte_id": "phys_org", "data_pub": "2026-09-05T18:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobriram duas nuvens de hidrogênio próximas à Galáxia do Pinhão que parecem conter quase nenhum astro visível. As nuvens, encontradas com o telescópio radioelétrico FAST da China, contêm aproximadamente 3 milhões de vezes a massa do Sol em hidrogênio, mas não têm correspondente óptico detectável.", "titulo_pt": "FAST encontra duas nuvens misteriosas de hidrogênio sem estrelas visíveis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 148253, "titulo": "Views from a physician and veterinarian: How to improve barriers to pet care when owners are hospitalized", "url": "https://phys.org/news/2026-09-views-physician-veterinarian-barriers-pet.html", "fonte_id": "phys_org", "data_pub": "2026-09-05T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pet owners might delay or skip medical treatment or leave a healthcare facility against medical advice if they have no one to care for their pet at home. Um artigo de perspectiva publicado na New England Journal of Medicine explica que a abordagem de cuidados para tutores de animais de estimação pode precisar ser diferente quando estes estão hospitalizados.", "titulo_pt": "Visões de um médico e veterinário: como melhorar as barreiras ao cuidado de pets quando seus donos estão hospitalizados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 147852, "titulo": "US study tests psilocybin to fight u-271-dias-com-rim-suino-em-estudo-liderado-por-brasileiro/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-05T16:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um paciente sobreviveu 271 dias com um rim de suíno em um estudo liderado por um brasileiro, representando um avanço na realização de xenotransplantes. Este é o primeiro caso em que um paciente viveu mais de dois meses com esse procedimento.", "titulo_pt": "Paciente sobreviveu 271 dias com rim suíno em estudo brasileiro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 147854, "titulo": "Tree species diversity protects forests from climate extremes, study finds", "url": "https://phys.org/news/2026-09-tree-species-diversity-forests-climate.html", "fonte_id": "phys_org", "data_pub": "2026-09-05T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa analisou 88.116 parcelas florestais nos Estados Unidos e descobriu que a diversidade de espécies de árvores pode ser crucial na proteção das florestas contra eventos climáticos extremos, como secas e calor extremo ocorrendo simultaneamente.", "titulo_pt": "Diversidade de espécies de árvores protege florestas de eventos climáticos extremos, estudo mostra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 148027, "titulo": "Eclipse solar raro vai escurecer 8 países por mais de 6 minutos; veja quando", "url": "https://exame.com/ciencia/eclipse-solar-raro-vai-escurecer-8-paises-por-mais-de-6-minutos-veja-quando/", "fonte_id": "exame", "data_pub": "2026-09-05T15:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um eclipse solar raro ocorrerá em agosto de 2027, escurecendo 8 países por mais de 6 minutos. O evento terá sua totalidade máxima no Egito e a faixa de sombra terá 258 quilômetros de extensão.", "titulo_pt": "Eclipse solar raro escurecerá 8 países por mais de 6 minutos em agosto de 2027; veja quando", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 148029, "titulo": "Açúcar alto no sangue pode ajudar câncer a 'escapar' do sistema imunológico", "url": "https://exame.com/ciencia/acucar-alto-no-sangue-pode-ajudar-cancer-a-escapar-do-sistema-imunologico/", "fonte_id": "exame", "data_pub": "2026-09-05T15:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo demonstrou que a hiperglicemia pode ajudar as células tumorais a escapar do sistema imunológico ao engrossar a camada que as camufla. Este achado pode indicar um novo alvo para o desenvolvimento de tratamentos.", "titulo_pt": "Açúcar alto no sangue pode ajudar câncer a escapar do sistema imunológico", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 147876, "titulo": "Venus is disappearing from the evening sky — here's how to see it while you can", "url": "https://www.space.com/stargazing/venus-is-disappearing-from-the-evening-sky-heres-how-to-see-it-while-you-can", "fonte_id": "space_com", "data_pub": "2026-09-05T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vênus está se movendo para baixo no horizonte pôr do sol em setembro, mas ainda será visível durante o anoitecer por algum tempo.", "titulo_pt": "Vênus está desaparecendo do céu noturno - aqui está como vê-lo enquanto ainda pode", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 147819, "titulo": "Hong Kong’s first astronaut Lai Ka-ying to give live lecture from space", "url": "https://www.scmp.com/news/hong-kong/education/article/3366497/hong-kongs-first-astronaut-lai-ka-ying-give-live-lecture-space?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-05T14:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lai Ka-ying, astronauta da primeira missão de Hong Kong, e seus dois companheiros de equipe dos tripulantes da missão Shenzhou-23, irão realizar uma aula ao vivo do espaço para estudantes e professores de Hong Kong e Macau. A atividade, organizada conjuntamente pelo governo de Hong Kong, Macau e a izaciones-de-flotas-pesqueras-extranjeras-que-operan-cerca-de-rapa-nui/", "fonte_id": "la_tercera", "data_pub": "2026-09-05T17:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Na sexta-feira, a Marinha realizou voo de detecção para identificar uma frota de 70 barcos operando na área sob responsabilidade chilena e próxima à Ilha de Rapa Nui.", "titulo_pt": "Marinha realiza fiscalizações de flotas pesqueiras estrangeiras que operam perto de Rapa Nui", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 147276, "titulo": "Ambientalistas e setor de infraestrutura cobram agilidade na análise da lei do licenciamento pelo STF", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/ambientalistas-e-setor-de-infraestrutura-cobram-agilidade-na-analise-da-lei-do-licenciamento-pelo-stf.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-05T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Organizações ambientalistas e representantes do setor de infraestrutura estão pressionando o STF para que se manifeste rapidamente sobre a validade constitucional de trechos da nova lei do licenciamento ambiental. Essa solicitação visa agilizar o processo e garantir a aplicação da lei de forma mais eficiente.", "titulo_pt": "Ambientalistas e setor de infraestrutura cobram agilidade na análise da lei do licenciamento pelo STF", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 148023, "titulo": "Suíça tenta frear derretimento de geleira com lã de ovelha — e o teste dá resultado", "url": "https://exame.com/ciencia/suica-tenta-frear-derretimento-de-geleira-com-la-de-ovelha-e-o-teste-da-resultado/", "fonte_id": "exame", "data_pub": "2026-09-05T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um experimento na geleira Tsanfleuron na Suíça comparou mantas biodegradáveis feitas de lã de ovelha com coberturas sintéticas usadas para proteger o gelo. O teste mostrou resultados positivos.", "titulo_pt": "Suíça testa lã de ovelha para frear derretimento de geleira e o resultado é positivo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 147655, "titulo": "Nepal demands greater climate justice amid staggering flood costs", "url": "https://www.lemonde.fr/en/economy/article/2026/09/05/nepal-demands-greater-climate-justice-amid-staggering-flood-costs_6757198_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-05T16:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Nepal sofreu grandes danos financeiros devido a uma avalanche de lama, detritos e gelo em 26 de agosto, com estimativas de dano entre 4 e 5 bilhões de dólares. O desastre afetou setores-chave do país, como o turismo e a energia hidrelétrica.", "titulo_pt": "Nepal pede por maior justiça climática diante dos custos astronômicos das cheias", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 147429, "titulo": "Tufão Saudel provoca deslizamento na China; 1 morre e 11 desaparecem", "url": "https://www.infomoney.com.br/mundo/tufao-saudel-deslizamento-china-morto-desaparecidos/", "fonte_id": "infomoney", "data_pub": "2026-09-05T15:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Chuvas torrenciais na província de Jiangxi, na China, causaram deslizamentos de terra. Um pessoa morreu e 11 desapareceram.", "titulo_pt": "Tufão Saudel causa deslizamento de terra na China; 1 morto e 11 desaparecidos", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 147631, "titulo": "De cara a la temporada de incendios forestales: Conaf Ñuble anuncia fortalecimiento de sus equipos de prevención y mitigación", "url": "https://www.latercera.com/nacional/noticia/de-cara-a-la-temporada-de-incendios-forestales-conaf-nuble-anuncia-fortalecimiento-de-sus-equipos-de-prevencion-y-mitigacion/", "fonte_id": "la_tercera", "data_pub": "2026-09-05T15:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Conaf Ñuble anunciou o fortalecimento de seus equipamentos de prevenção e mitigação de incêndios florestais. A planificação técnica leva em consideração os antecedentes de incêndios na região, incluindo a catástrofe de janeiro de 2026.", "titulo_pt": "Diante da temporada de incêndios florestais: conaf Ñuble fortalece equipes de prevenção e mitigação", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 148031, "titulo": "Amazônia tem 1,79 milhão de hectares em terras indígenas com potencial de restauração", "url": "https://exame.com/esg/amazonia-tem-179-milhao-de-hectares-em-terras-indigenas-com-potencial-de-restauracao/", "fonte_id": "exame", "data_pub": "2026-09-05T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da TNC indica que 1,79 milhão de hectares de terras indígenas na Amazônia têm potencial para serem restaurados. Quase um milhão desses hectares, predominantemente ocupados por pastagens degradadas, estão localizados no bioma amazônico.", "titulo_pt": "Amazônia possui 1,79 milhão de hectares de terras indígenas com potencial de restauração", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 147686, "titulo": "Two people pulled alive by Nepal's search and rescue team 10 days after devastating flash floods", "url": "http://www.euronews.com/2026/09/05/two-people-pulled-alive-by-nepals-search-and-rescue-team-10-days-after-devastating-flash-f", "fonte_id": "euronews", "data_pub": "2026-09-05T12:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove dias após as inundações devastarem Nepal, uma mulher e um homem foram resgatados vivos em operações de busca e resgate separadas. Mais de 5.000 pessoas ainda estão desaparecidas e pelo menos 1.300 morreram.", "titulo_pt": "Dois sobreviventes resgatados 10 dias após devastadoras inundações no Nepal", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 147081, "titulo": "Orangutan mother and infant const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">

    </div>
    ${renderPodcast()}

    ${D.topicos.map(renderSecao).join("")}`;

  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">

        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>

      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
