<html lang="pt-BR">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "01/09/2026 07:24", "stats": {"noticias_novas": 863, "resumos_gerados": 246}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva está determinado a realizar o 7 de Setembro de forma 'simplificada', com um desfile de atletas em vez do tradicional desfile militar, conforme anunciado pela Advocacia-Geral da União (AGU). Além disso, o governo federal reservou R$ 97,9 bilhões para novos empréstimos subsidiados em 2027, com um custo estimado de R$ 20,5 bilhões para a dívida. Na área política, Augusto Cury, do partido Avante, tem ganhado força nas pesquisas de intenção de voto, reacendendo a possibilidade de uma terceira via em um cenário eleitoral polarizado. O Tribunal Superior Eleitoral (TSE) começa a julgar o uso de inteligência artificial em campanhas eleitorais, analisando um vídeo de Jair Bolsonaro feito por IA, o que pode definir os critérios para identificar deepfakes nas eleições de 2026.", "mundo": "Em agosto, a Rússia intensificou o uso de drones na guerra contra a Ucrânia, lançando mais de 2.800 unidades em direção ao país, conforme relatos da France24. Além disso, a Rússia intensificou os ataques noturnos em Kiev e sua região, resultando em dezenas de mortes e feridos. Em outra notícia, o U.S.S. Abraham Lincoln, um navio de guerra dos Estados Unidos, deve chegar à Tailândia em Pattaya na próxima terça-feira, conforme informou o prefeito local. O navio, que esteve em missão há mais de 270 dias, será recebido com medidas de segurança aprimoradas. No âmbito político, o ex-primeiro-ministro interino da Bulgária, Andrey Gyurov, confirmou sua candidatura presidencial, se tornando um dos principais adversários da atual presidente Iliana Iotova. Além disso, o primeiro-ministro da Índia, Narendra Modi, pediu ao presidente russo, Vladimir Putin, que encerre a guerra na Ucrânia e pare com o fornecimento de petróleo russo para os Estados Unidos, que ameaçou impor tarifas sobre o petróleo russo.\n\nOs ataques da Rússia na Ucrânia continuam com intensidade, causando mortes e feridos em várias regiões, incluindo a capital Kiev, onde pelo menos 12 pessoas foram mortas em ataques aéreos na terça-feira, estendendo-se por seis dias consecutivos. O conflito persiste como uma das maiores crises geopolíticas na Europa desde a Segunda Guerra Mundial. O ministro das Relações Exteriores sul-coreano planeja uma visita ao Estados Unidos para discutir questões diplomáticas com o secretário Rubio. Em contraste, o Irã declarou que uma guerra adicional não está em seu interesse, sinalizando uma possível busca por um desengavetamento das tensões regionais. No entanto, a região do Mar da China Meridional continua sendo um ponto de tensão, com as Filipinas e o Reino Unido negociando um acordo que permitiria a troca de tropas, refletindo a crescente preocupação sobre segurança marítima no oceano. Além disso, a China enfrenta desafios na região do Himalaia, com mais de 4.500 pessoas desaparecidas após um colapso glacial que devastou comunidades no Nepal, enquanto o conflito na Ucrânia pressiona a Polônia a expandir suas forças armadas e produzir defesa nacional, tornando-se o maior exército da Europa.", "economia": "Os rendimentos das dívidas globais caíram significativamente, refletindo preocupações com a inflação e tensões geopolíticas, como as entre Estados Unidos e Irã. A inflação na zona do euro subiu para 3,3% em agosto, levando o Banco Central Europeu a considerar aumentos nas taxas de juros. O iene atingiu seu nível mais baixo em 30 anos, pressionando os rendimentos japoneses. No Brasil, o PIB e dados como PMIs e Jolts serão divulgados, sendo importantes para os mercados financeiros. A Shein, empresa de moda rápida, viu suas ações cair em seu IPO na Hong Kong, refletindo preocupações com a avaliação da empresa. A dívida pública brasileira atingiu 82,5% do PIB, levantando preocupações sobre as contas públicas. A União Europeia suspendeu as importações de carne bovina e de aves de corral do Brasil devido a preocupações sanitárias. No setor de tecnologia, o mercado de chips deve ultrapassar 2 trilhões de dólares até 2030, de acordo com a SEMI. Por fim, a BYD vendeu mais veículos no exterior do que no mercado chinês pela primeira vez, indicando um centro de gravidade global para a empresa.", "tecnologia": "Tim Cook, CEO da Apple, está apostando na inteligência artificial (IA) baseada em modelos de outras empresas, de acordo com o Axios. No entanto, a Apple se tornou dependente do Google para algumas de suas capacidades de IA mais importantes, o que poderia ser um ponto fraco em um cenário competitivo. O relatório também destaca que a Apple enfrenta uma queda nas vendas devido a paralisações parciais, mas as vendas de agosto aumentaram 9,4% devido a fortes exportações, conforme informou a GM Korea. Em outro desenvolvimento, a LS Cable & System firmou um memorando de entendimento com o consórcio AI Factory Frontier para desenvolver projetos de data centers de IA, planejando usar sistemas supercondutores para redes externas e dutos e fibras ópticas para a infraestrutura, informou o Korea Herald. Além disso, a Apple acusa a empresa detrás do ChatGPT de roubar segredos industriais confidenciais, alegando que a inteligência artificial OpenAI está usando material confidencial da Apple e destruindo evidências, conforme relatado no Japan Times.", "ciencia": "Em 1 de setembro de 2026, ocorrerá um eclipses lunar planejado, conforme anunciado pelo APOD. Um avanço recente na ciência mostrou que a formação de estrelas tem diminuído ao longo dos últimos 4,5 bilhões de anos, mas a quantidade de material necessário para a formação de estrelas não diminuiu significativamente. Isso sugere que a redução na formação de estrelas não é simplesmente devida a uma crise de 'combustível'. Em um projeto de conservação de ursos, a cientista Akiko Takii capturou um jovem urso asiático em uma armadilha, visando mostrar que a coexistência, não o cativeiro, pode prevenir ataques de ursos. Além disso, a Universidade da Virgínia e a NASA estão utilizando drones equipados com sensores de calor e luz para medir a saúde das plantações em um estudo de agricultura sustentável.", "cultura": "John Galliano, renomado designer britânico, se retirou da apresentação do Met Gala após ter sido condenado por discursos de ódio antissemita e anti-asiático. No Festival Internacional de Cinema de Busan, serão exibidos 315 filmes em sua 31ª edição, com 246 seleções oficiais de 59 países, incluindo 95 estreias mundiais. A cidade de Busan receberá o K-Music Festival, que apresentará música folclórica, hip-hop, jazz e trilhas sonoras de jogos, com performances de uma orquestra do National Gugak Center. Em setembro de 2026, o mês promete lançamentos de livros infantis, ficção científica e fantasia, além de novos poemas. O Jota Quest comemorará seus 30 anos de carreira tocando músicas de Tim Maia no Rock in Rio. A artista Kat Wong, fundadora de Oh Yeah, debate a importância da criatividade como forma de combater a desesperança em tempos de incerteza. O escritor e ambientalista Wendell Berry, nascido em Kentucky, faleceu aos 92 anos, deixando uma obra que celebrava as comunidades agrícolas e alertava contra os erros de uma sociedade industrializada. Além disso, o Festival de Verão de 2026 destacará uma obra-prima costurada que preserva a invasão normanda da Grã-Bretanha em 1066, criada pela arte feminina anglo-saxônica com lã colorida. Em Barcelona, a filósofa Marina Garces inspira a criação de ações modestas que promovem a esperança em espaços públicos.", "sociedade": "Um homem de 66 anos, galiciano e aposentado, foi diagnosticado com câncer e decidiu parar de trabalhar. Após se aposentar, ele comprou um barco por 85.000 euros. Em Hong Kong, os alunos das escolas primárias voltaram às aulas com misto de excitação e ansiedade, e uma campanha foi implementada para melhorar o bem-estar dos alunos. Em Cerro Navia, uma menina de 5 anos ficou gravemente ferida após ser atingida por uma bala em um local de jogos. A polícia está investigando o caso. No Japão, 35% das pessoas jovens e solteiras não têm desejo de se casar, preferindo se concentrar em hobbies. A Receita Federal pagou o quarto lote de restituição do Imposto de Renda 2026, totalizando R$ 1,2 bilhão para 521.935 contribuintes. O Ministério da Saúde de Hong Kong expandiu as categorias de subsídio de saúde, incluindo novos serviços e tratamentos no programa. Em Seul, a Coreia do Sul planeja criar contas de poupança a longo prazo para ajudar os residentes na meia-idade a superar um período potencialmente difícil entre o último salário e o primeiro pagamento de aposentadoria.", "meio_ambiente": "Ciclones extratropicais causaram ventos intensos no centro-sul do país. No Distrito Federal, um lobo-guará foi resgatado dentro de uma casa e devolvido à natureza. No Nepal, mais de mil pessoas morreram e cerca de 4 mil desapareceram devido às inundações na fronteira com a China. A China registrou 16 mortos e 546 desaparecidos em um deslizamento de lama na região do posto fronteiriço de Gyirong. Além disso, o Nepal enfrenta o aumento do nível do lago formado após o deslizamento devido às chuvas. Em outro evento, dados de 40 anos mostram como a seca na Amazônia ameaça o setor agrícola, alerta um especialista.", "direitos_humanos": "O Irã condenou mulheres à morte por sua participação em manifestações contra o governo, uma ação que reflete uma grave violação dos direitos humanos no país. Em contraste, a NAACP nos Estados Unidos está pedindo que atletas negros boicote escolas nos estados do sul que estão revogando direitos de voto, mas os atletas da era do Name-Left-In-Legal-Name (NIL) estão relutantes em se envolver em protestos, mostrando uma discrepância entre os métodos de protesto de 1960 e os atuais. Em outro desenvolvimento, o Comitê da ONU contra a Discriminação Racial apresentou um documento que prevê um novo instrumento legal para reparações abrangentes relacionadas à discriminação racial e à escravidão, reafirmando a obrigação legal dos países a considerar indenizações pelo comércio transatlântico de escravos. Estes eventos abrangem desde a execução de mulheres no Irã até o debate sobre reparações históricas, passando por protestos de atletas e ações internacionais contra a discriminação racial."}, "resumo_do_dia": {"politica_nacional": [{"id": 136712, "titulo": "Vencedora de licitação da iluminação pública denuncia advogado de rival à gestão Nunes", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/vencedora-de-licitacao-da-iluminacao-publica-denuncia-advogado-de-rival-a-gestao-nunes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-01T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa Ilumina SP, vencedora da licitação de iluminação pública em São Paulo, solicitou à gestão do prefeito Ricardo Nunes que investigue um possível conflito de interesses envolvendo o advogado da empresa concorrente Walks.", "titulo_pt": "Vencedora de licitação denuncia possível conflito de interesses envolvendo advogado do rival", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 136857, "titulo": "Pulse Abarth Scorpionissima: conceito pode indicar novos caminhos no país", "url": "https://www.cnnbrasil.com.br/auto/pulse-abarth-scorpionissima-conceito-pode-indicar-novos-caminhos-no-pais/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Pulse Abarth Scorpionissima foi apresentado no Festival de Interlagos 2026 e tem design inspirado no estilo europeu. Pode ser que o modelo seja lançado no Brasil no futuro.", "titulo_pt": "Pulse Abarth Scorpionissima: conceito pode indicar novidades para o Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 136887, "titulo": "Na mira da AGU, Lula fará 7 de Setembro \"sóbrio\" e com desfile de atletas", "url": "https://www.metropoles.com/colunas/milena-teixeira/na-mira-da-agu-lula-fara-7-de-setembro-sobrio-e-com-desfile-de-atletas", "fonte_id": "metropoles", "data_pub": "2026-09-01T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula planeja realizar o 7 de Setembro de forma 'sóbria' e com um desfile de atletas, em vez do tradicional desfile militar. A Advocacia-Geral da União (AGU) está acompanhando os preparativos para garantir que as atividades estejam alinhadas com as diretrizes governamentais, incluindo mensagens contra a violência à mulher.", "titulo_pt": "Lula fará 7 de Setembro 'sóbrio' e com desfile de atletas sob olhar da AGU", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 136713, "titulo": "Governo de Sergipe assina contratos de mais de R$ 70 milhões com empresa ligada a político aliado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/governo-de-sergipe-assina-contratos-de-mais-de-r-70-milhoes-com-empresa-ligada-a-politico-aliado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-01T07:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Governo de Sergipe assinou contratos de mais de R$ 70 milhões com uma empresa controlada pela filha de um político aliado do governador Fábio Mitidieri (PSD). Foram oito acordos em serviços como terceirização de mão de obra e aluguel de equipamentos.", "titulo_pt": "Governo de Sergipe assina contratos de mais de R$ 70 milhões com empresa ligada a político aliado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 136729, "titulo": "Entenda como a taxa das blusinhas, que pode ser derrubada nesta terça, afeta o varejo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/entenda-como-a-taxa-das-blusinhas-que-pode-ser-derrubada-nesta-terca-afeta-o-varejo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Congresso Nacional debate nesta terça-feira (1º) a manutenção de uma medida provisória que eliminou a chamada taxa das blusinhas, implementada pelo governo Lula em maio. Esta taxa afetava o varejo e poderia ser derrubada se não for mantida a MP.", "titulo_pt": "Entenda como a taxa das blusinhas, que pode ser derrubada nesta terça, afeta o varejo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 136730, "titulo": "Idade mínima igual para mulheres e fim do auxílio pago pelo INSS; veja mudanças propostas para a Previdência", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/idade-minima-igual-para-mulheres-e-fim-do-auxilio-pago-pelo-inss-veja-mudancas-propostas-para-a-previdencia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "É proposto um novo grupo de estudiosos, liderado pelo economista Paulo Tafner, que sugere mudanças nas regras da aposentadoria, incluindo a igualdade da idade mínima para homens e mulheres e o fim do auxílio pago pelo INSS. Essas propostas podem ser implementadas em menos de dez anos.", "titulo_pt": "Idade mínima igual para homens e mulheres e fim do auxílio INSS propostos para a Previdência", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 136731, "titulo": "Veja regras para trabalho e folga no dia 7 de setembro e lista com os próximos feriados", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/veja-regras-para-trabalho-e-folga-no-dia-7-de-setembro-e-lista-com-os-proximos-feriados.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O feriado da Independência do Brasil será celebrado na próxima segunda-feira (7 de setembro), mas não todos terão folga no trabalho. A matéria também lista os próximos feriados.", "titulo_pt": "Veja regras para trabalho e folga no dia 7 de setembro e lista com os próximos feriados", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 136891, "titulo": "Augusto Cury cresce nas pesquisas e reacende 3ª via em eleição polarizada", "url": "https://www.metropoles.com/brasil/augusto-cury-pesquisas-folego", "fonte_id": "metropoles", "data_pub": "2026-09-01T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury tem ganhado força nas pesquisas de intenção de voto, reacendendo a possibilidade de uma terceira via em um cenário eleitoral polarizado. Seu desempenho nas redes sociais, debates e sabatinas, juntamente com seu discurso moderado, contribuem para essa subida no cenário político.", "titulo_pt": "Augusto Cury cresce nas pesquisas e reacende 3ª via em eleição polarizada", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 136972, "titulo": "Lula amarra apoio do Centrão no Congresso, mas isso garante votos na eleição?", "url": "https://www.bbc.com/portuguese/articles/cly7ny7r5pno?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-01T07:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lideranças do Centrão indicam apoio a Lula, mas ainda não formalizaram alianças. O pragmatismo do bloco pode dar lugar a ideologias com a liberação do orçamento para emendas parlamentares.", "titulo_pt": "Lula conquista apoio do Centrão, mas alianças formais ainda não foram feitas?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 136863, "titulo": "TSE começa a julgar hoje limites para uso de IA em campanhas eleitorais", "url": "https://www.cnnbrasil.com.br/eleicoes/tse-comeca-a-julgar-hoje-limites-para-uso-de-ia-em-campanhas-eleitorais/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T07:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) começa a julgar hoje o uso de inteligência artificial em campanhas eleitorais, analisando um vídeo de Jair Bolsonaro feito por IA. A decisão pode definir os critérios para identificar deepfakes nas eleições de 2026.", "titulo_pt": "TSE começa a julgar hoje limites para uso de IA em campanhas eleitorais", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 136734, "titulo": "Lula promete a empresários fazer o possível para reduzir juros e reclama de descrença sobre questão fiscal", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/lula-promete-a-empresarios-fazer-o-possivel-para-reduzir-juros-e-reclama-de-descrenca-sobre-questao-fiscal.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T03:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva afirmou a empresários que fará tudo o que estiver ao seu alcance para reduzir a taxa de juros no país. Ele reafirmou que não abrirá mão de compromissos sociais.", "titulo_pt": "Lula promete reduzir juros e mantém compromissos sociais aos empresários", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 136757, "titulo": "Augusto Cury: a candidatura que entrou no radar das redes sociais - O Assunto #1795", "url": "https://g1.globo.com/podcast/o-assunto/noticia/2026/09/01/augusto-cury-a-candidatura-que-entrou-no-radar-das-redes-sociais-o-assunto-1795.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-01T03:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury, candidato pelo partido Avante, ganhou visibilidade nas redes sociais, aumentando seu número de seguidores no Instagram e o número de menções a ele em uma semana. Antes das candidaturas oficiais, seu desempenho nas pesquisas de intenção de voto era baixo.", "titulo_pt": "Augusto Cury: a candidatura que ganhou destaque nas redes sociais", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 136758, "titulo": "VÍDEO: Por que o mandato de senador dura 8 anos, e o de presidente e deputados, 4?", "url": "https://g1.globo.com/politica/eleicoes/2026/videos/noticia/2026/09/01/video-tempo-de-mandato-senador-deputado-presidente.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-01T03:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mandato de um senador dura oito anos, enquanto o de presidente e deputados é de quatro anos. Esse prazo não é aleatório, mas sim projetado para garantir a estabilidade política e representatividade no Congresso.", "titulo_pt": "Por que o mandato de senador dura 8 anos, e o de presidente e deputados, 4?", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 136759, "titulo": "TSE começa a julgar nesta terça ação que vai definir regras sobre ‘deepfake’", "url": "https://g1.globo.com/politica/noticia/2026/09/01/tse-comeca-a-julgar-nesta-terca-acao-que-vai-definir-regras-sobre-deepfake.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-01T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) vai julgar nesta terça-feira uma ação que determinará as regras sobre o uso de deepfakes nas campanhas eleitorais. Deepfakes são vídeos ou áudios gerados por inteligência artificial que podem enganar o eleitor, pois são realistas.", "titulo_pt": "TSE julga nesta terça ação sobre deepfakes nas eleições", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 136760, "titulo": "Decisão do TSE sobre deepfakes nas eleições pode afetar mais de 50 ações na Justiça Eleitoral", "url": "https://g1.globo.com/politica/noticia/2026/09/01/decisao-do-tse-sobre-deepfakes-nas-eleicoes-pode-afetar-mais-de-50-acoes-na-justica-eleitoral.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-01T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça Eleitoral tem mais de 50 ações que podem ser afetadas pela decisão do Tribunal Superior Eleitoral sobre a proibição de deepfakes nas campanhas. Esses casos incluem montagens de apoio político, divulgação de pesquisas fictícias e diálogos simulados de candidatos.", "titulo_pt": "Decisão do TSE sobre deepfakes nas eleições pode afetar mais de 50 ações na Justiça Eleitoral", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 136761, "titulo": "Água gratuita, freio ao cambismo e taxa visível: veja o que muda nos ingressos com novo decreto sobre shows", "url": "https://g1.globo.com/politica/noticia/2026/09/01/agua-gratuita-freio-ao-cambismo-e-taxa-visivel-veja-o-que-muda-nos-ingressos-com-novo-decreto-sobre-shows.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-01T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva assinou um decreto que visa regular a venda e transferência de ingressos para shows e eventos online, com o objetivo de combater práticas abusivas e garantir transparência nos preços. O decreto estabelece medidas para prevenir a aquisição massiva ou especulativa de ingressos, inclusive por meio de sistemas automatizados.", "titulo_pt": "Água gratuita, freio ao cambismo e taxa visível: veja o que muda nos ingressos com novo decreto sobre shows", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 136839, "titulo": "Trump diz ser cedo para falar sobre eventual campanha presidencial de Hegseth em 2028", "url": "https://www.infomoney.com.br/mercados/trump-diz-ser-cedo-para-falar-sobre-eventual-campanha-presidencial-de-hegseth-em-2028/", "fonte_id": "infomoney", "data_pub": "2026-09-01T09:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Trump afirmou que é prematuro discutir uma eventual campanha presidencial de Hegseth em 2028, considerando que Hegseth está realizando um trabalho excelente no momento.", "titulo_pt": "Trump diz ser cedo para falar sobre eventual campanha presidencial de Hegseth em 2028", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 137167, "titulo": "Russia fired over 2,800 drones at Ukraine in August amid war tactic change", "url": "https://www.france24.com/en/russia-fired-over-2-800-drones-at-ukraine-in-august-amid-war-tactic-change", "fonte_id": "france24", "data_pub": "2026-09-01T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em agosto, a Rússia lançou mais de 2.800 droness a jato em direção à Ucrânia, um tipo de drone mais difícil de ser abatido. A Ucrânia afirma que os novos modelos são enviados para o front quase imediatamente após saírem da fábrica, indicando um aumento significativo no uso de drones na guerra.", "titulo_pt": "Rússia lançou mais de 2.800 drones a jato na Ucrânia em agosto, com novo modelo entrando em operação rapidamente", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 137198, "titulo": "Apple's new CEO John Ternus makes AI top priority", "url": "https://www.dw.com/en/apple-s-new-ceo-john-ternus-makes-ai-top-priority/a-78575898?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-01T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "John Ternus, o terceiro CEO da Apple em 30 anos, prioriza a correção da estratégia de IA da empresa para manter sua posição como líder em tecnologia.", "titulo_pt": "Novo CEO da apple, John Ternus, torna a IA sua prioridade principal", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 136842, "titulo": "Bessent diz que não haverá alívio econômico à Rússia até fim da guerra na Ucrânia", "url": "https://www.infomoney.com.br/mundo/bessent-diz-que-nao-havera-alivio-economico-a-russia-ate-fim-da-guerra-na-ucrania/", "fonte_id": "infomoney", "data_pub": "2026-09-01T09:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bessent se reuniu com Siluanov durante uma reunião dos líderes financeiros do G20 em Asheville, Carolina do Norte, onde afirmou que não haverá alívio econômico para a Rússia até o fim da guerra na Ucrânia.", "titulo_pt": "Bessent diz que não haverá alívio econômico para a Rússia até o fim da guerra na Ucrânia", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 137260, "titulo": "Istat, a luglio +2mila occupati su mese, +307mila su anno", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/01/istat-a-luglio-2mila-occupati-su-mese-307mila-su-anno_7d2d0caf-cf11-4c86-9001-9d21eb76bd82.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-01T09:46:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O índice de desemprego caiu para 5,8%. Em julho, houve uma diminuição de 2.000 pessoas desocupadas em comparação com o mês anterior, e uma redução de 307.000 pessoas em relação ao mesmo período do ano anterior.", "titulo_pt": "Istat: desemprego em julho -2.000 em mês, -307.000 em ano", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 137037, "titulo": "U.S.S. Abraham Lincoln to Dock in Thailand on Wednesday, Pattaya Mayor Says", "url": "https://www.nytimes.com/2026/09/01/world/asia/uss-lincoln-pattaya-thailand.html", "fonte_id": "nyt_world", "data_pub": "2026-09-01T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A frota do U.S.S. Abraham Lincoln chegará à Tailândia na próxima terça-feira, conforme informou o prefeito de Pattaya. O navio se tornou um símbolo dos desafios da guerra para a força militar dos Estados Unidos.", "titulo_pt": "U.S.S. Abraham Lincoln chegará à tailândia na terça-feira, diz prefeito de Pattaya", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 137261, "titulo": "Pillon, per i bimbi del bosco rientri diurni immediati a Palmoli", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/01/pillon-per-i-bimbi-del-bosco-rientri-diurni-immediati-a-palmoli_862543b4-062a-4cfd-9373-f9ceaaabe7e9.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-01T09:41:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Os advogados da família estão permitindo que os menores passeiem diariamente pelo bosque de Palmoli. Até outubro, os pais passavam o fim de semana na residência familiar.", "titulo_pt": "Pillon: horas diárias no bosque para crianças em Palmoli immediatas", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 137212, "titulo": "Tehran urges return to June deal, oil prices rise as Trump vows to hit Iran 'hard'", "url": "https://www.cnbc.com/2026/09/01/us-iran-war-trump-hormuz-tanker-attack-shipping-sanctions-.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-01T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Irã pede retorno ao acordo de junho e os preços do petróleo aumentam após Trump afirmar que vai atingir o Irã fortemente. O Irã atacou duas bases americanas em Jordânia em resposta ao ataque dos Estados Unidos à ilha de Larak.", "titulo_pt": "Téhrã incentiva retorno ao acordo de junho e preços do petróleo subiram após Trump ameaçar o Irã", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 137056, "titulo": "At least 12 people killed in Russian overnight attacks on Ukraine – Europe live", "url": "https://www.theguardian.com/world/live/2026/sep/01/ukraine-russia-strikes-attacks-odesa-zelenskyy-putin-eu-defence-europe-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-09-01T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 12 pessoas foram mortas em ataques noturnos da Rússia na região de Odesa na Ucrânia, segundo o presidente ucraniano Zelenskyy. Além disso, dezenas ficaram feridas e milhares ficaram sem energia elétrica. A Alemanha confirmou que ouvirá seus ministros de interior e externos sobre o incidente com drones em Leipzig, supostamente relacionado à Rússia.", "titulo_pt": "Pelo menos 12 mortos em ataques noturnos da Rússia na Ucrânia; Alemanha investiga incidente com drones", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 137168, "titulo": "Russia targets Kyiv and its region for sixth consecutive night of attacks", "url": "https://www.france24.com/en/russia-targets-kyiv-and-its-region-for-sixth-consecutive-night-of-attacks", "fonte_id": "france24", "data_pub": "2026-09-01T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ao menos nove pessoas morreram e 14 ficaram feridas em ataques russos a Kiev e região durante a noite. As forças russas atingiram uma estação ferroviária em Kiev e infraestruturas na região de Odesa do sul. A Rússia intensificou os ataques nas cidades ucranianas recentemente, interrompendo a rotina de milhões de pessoas e causando até 12 alertas de bombardeio aéreo por dia.", "titulo_pt": "Rússia ataca kiev e região pela sexta noite consecutiva", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 137169, "titulo": "Netanyahu's wife shares conspiracy claim that opposition leader knew of Oct 7 attacks in advance", "url": "https://www.france24.com/en/middle-east/20260901-netanyahu-s-wife-shares-conspiracy-that-opposition-leader-had-early-knowledge-of-oct-7-attacks", "fonte_id": "france24", "data_pub": "2026-09-01T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A esposa do primeiro-ministro de Israel, Sara Netanyahu, compartilhou uma teoria da conspiração sugerindo que o líder da oposição centrista, Yair Golan, tinha conhecimento antecipado dos ataques realizados pelo Hamas em 7 de outubro de 2023. Isso ocorre enquanto Israel se prepara para eleições parlamentares previstas para outubro, que devem ser muito disputadas.", "titulo_pt": "Esposa de netanyahu afirma que oposição teria antecipado conhecimento sobre ataques de outubro", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 137303, "titulo": "Bulgaria’s Former Interim PM Andrey Gyurov Confirms Presidential Bid", "url": "https://balkaninsight.com/2026/09/01/bulgarias-former-interim-pm-andrey-gyurov-confirms-presidential-bid/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-09-01T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andrey Gyurov, ex-prime minister interino da Bulgária, confirmou sua candidatura presidencial, o que o tornará provavelmente o principal adversário de Iliana Iotova nas eleições previstas para outubro.", "titulo_pt": "Ex-primeiro ministro interino da bulgária confirma candidatura presidencial", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 137033, "titulo": "China or the U.S.? Two Meetings Offer Competing Showcases of Global Power.", "url": "https://www.nytimes.com/2026/09/01/world/asia/g20-meeting-china-trump-bishkek.html", "fonte_id": "nyt_world", "data_pub": "2026-09-01T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Xi Jinping se reuniu com os líderes da Rússia e do Irã, enquanto a Europa desafiou o governo dos Estados Unidos no G20, exibindo um panorama da mudança na distribuição do poder global.", "titulo_pt": "China ou EUA? Duas reuniões oferecem exibições competitivas de poder Global", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 137352, "titulo": "UK-Philippines troop deal to boost Nato’s South China Sea reach", "url": "https://www.scmp.com/week-asia/politics/article/3365984/uk-philippines-troop-deal-boost-natos-south-china-sea-reach?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T09:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Philipinas e o Reino Unido estão negociando um acordo que permitiria tropas treinarem e operarem temporariamente umas nas terras das outras. Este acordo representa um sinal do desejo da Manila de atrair mais potências europeias e outras compartilhando preocupações sobre segurança no Mar da China Meridional e no fluxo contínuo de mercadorias pelas águas vitais.", "titulo_pt": "Acordo de tropas entre philipinas e reino unido amplia presença de Nato no mar da China meridional", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 137170, "titulo": "Former gang member found guilty of murdering rapper Tupac Shakur", "url": "https://www.france24.com/en/former-gang-member-found-guilty-of-murdering-rapper-tupac-shakur", "fonte_id": "france24", "data_pub": "2026-09-01T09:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um júri declarou Duane 'Keffe D' Davis culpado de organizar o assassinato do rapper Tupac Shakur em 1996, após décadas de especulação. Davis pode ser condenado à prisão perpétua. O caso havia mantido os fãs de hip-hop e a sociedade em geral ansiosos por décadas.", "titulo_pt": "Ex-membro de gangue condenado pelo assassinato do rapper Tupac Shakur", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 137284, "titulo": "Israeli strikes pound Gaza, killing at least two children", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-strikes-pound-gaza-killing-least-two-children", "fonte_id": "middle_east_eye", "data_pub": "2026-09-01T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos dois crianças palestinas foram mortas em novos ataques israelenses em Gaza, de acordo com a agência de notícias Wafa. As explosões intensas foram relatadas em áreas densamente povoadas, incluindo al-Kateeba, fazendo um hospital de campo e uma escola serem evacuadas.", "titulo_pt": "Israel realiza ataques em Gaza, matando pelo menos duas crianças", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 137211, "titulo": "Global bond yields soar to multi-decade highs as Middle East turmoil reignites inflation fears", "url": "https://www.cnbc.com/2026/09/01/bond-yields-iran-inflation-treasurys-japan-uk.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-01T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos das dívidas globais subiram para níveis multidescendentes desde que tensões entre Estados Unidos e Irã renovaram preocupações com os riscos energéticos e inflacionários. Em particular, os rendimentos do Japão e do Reino Unido atingiram máximos multidescendentes.", "titulo_pt": "Rendimentos das dívidas globais atingem máximos multidescendentes devido a tensões entre EUA e Irã", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 137226, "titulo": "Eurozone inflation rises to 3.3% in August", "url": "https://www.ft.com/content/1b4d308c-3d49-4794-8280-187615c21876?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-01T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inflação na zona do euro subiu para 3,3% em agosto. O Banco Central Europeu (BCE) está previsto para aumentar as taxas de juros na próxima semana devido aos preços mais altos do energia.", "titulo_pt": "Inflação na zona do euro sobe para 3,3% em agosto", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 137225, "titulo": "Global bond sell-off deepens amid inflation fears", "url": "https://www.ft.com/content/e6f5f97a-b199-444e-aaec-b8199359b08e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-01T09:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os custos de empréstimo do Reino Unido atingiram o nível mais alto desde 2008 devido às preocupações com a inflação, enquanto os rendimentos do Japão chegaram a níveis não vistos desde os anos 1990.", "titulo_pt": "Venda de títulos globais se aprofunda diante das preocupações com a inflação", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 137232, "titulo": "Shein shares slide as much as 10% in Hong Kong debut", "url": "https://www.ft.com/content/06e22622-3e92-46a5-842f-bfa269687aaa?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-01T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Shein, uma varejista de moda rápida, caíram até 10% em sua estreia na bolsa de Hong Kong. A IPO da empresa foi realizada com uma avaliação bem abaixo do esperado.", "titulo_pt": "Ações da shein caem até 10% em estreia na bolsa de Hong Kong", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 136845, "titulo": "PIB do Brasil, PMIs, Jolts nos EUA e mais destaques desta terça-feira", "url": "https://www.infomoney.com.br/mercados/pib-brasil-pmis-jolts-eua-agenda-01092026/", "fonte_id": "infomoney", "data_pub": "2026-09-01T09:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Serão divulgados o PIB do Brasil, índices PMIs e Jolts nos Estados Unidos nesta terça-feira. Estes dados são considerados importantes para os mercados financeiros.", "titulo_pt": "PIB do Brasil, PMIs, Jolts nos EUA e outros destaques desta terça-feira", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 136728, "titulo": "Open Finance chega a 240 milhões de consentimentos ativos no Brasil, diz estudo da Zetta", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/open-finance-chega-a-240-milhoes-de-consentimentos-ativos-no-brasil-diz-estudo-da-zetta.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Open Finance no Brasil conta com 240 milhões de consentimentos ativos cinco anos após o lançamento, envolvendo cerca de 800 instituições. Esses dados estão disponíveis no estudo 'Open Finance no Brasil - Cinco anos de transformação e uma agenda para o futuro', da Zetta, com dados da AtlasIntel.", "titulo_pt": "Open Finance atinge 240 milhões de consentimentos ativos no Brasil, revela estudo da Zetta", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 137192, "titulo": "French rail start-up wins license to compete on high-speed lines", "url": "https://www.lemonde.fr/en/france/article/2026/09/01/french-rail-start-up-wins-license-to-compete-on-high-speed-lines_6757041_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-01T08:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A start-up francesa Velvet, fundada por um ex-executivo da SNCF, obteve permissão para operar trens TGV de próxima geração em quatro rotas na região ocidental da França, ligando Paris, Bordeaux, Nantes e Angers, a partir de 2028.", "titulo_pt": "Start-up francesa vence licença para competir em linhas de alta velocidade", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 137215, "titulo": "Japanese borrowing costs hit 30-year high as Bessent says Tokyo may intervene to boost yen", "url": "https://www.cnbc.com/2026/09/01/japan-bonds-yen-intervention-bessent.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-01T08:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O iene enfraqueceu para 160 por dólar, atingindo seu nível mais baixo em 30 anos, enquanto os rendimentos das dívidas japonesas estavam sob pressão, com investidores observando a possibilidade de um aumento das taxas de juros pelo Banco do Japão. O presidente do Banco de Investimentos Bessent sugeriu que o governo japonês pode intervir para fortalecer o iene.", "titulo_pt": "Custos de empréstimos japoneses atingem nível recorde de 30 anos e Bessent sugere intervenção para fortalecer iene", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 137234, "titulo": "Partners Group replaces chief executive as pressure grows on flagship fund", "url": "https://www.ft.com/content/0d5b67bd-a07f-47da-9e9b-505df1b4ff33?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-01T08:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Partners Group, gestor suíço de private equity, está substituindo seu CEO devido a uma elevada quantidade de solicitações de resgate que estão afetando o preço das ações da empresa. David Layton está deixando seu cargo.", "titulo_pt": "Partners Group troca ceo diante da pressão crescente sobre seu fundo principal", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 136928, "titulo": "Maturidade regulatória: quando adotar instrumentos já não basta", "url": "https://www.jota.info/opiniao-e-analise/colunas/mulheres-na-regulacao/maturidade-regulatoria-quando-adotar-instrumentos-ja-nao-basta", "fonte_id": "jota", "data_pub": "2026-09-01T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desafio das agências reguladoras não é mais conhecer as ferramentas de governança, mas sim usá-las de forma integrada. Isso implica na necessidade de uma maturidade regulatória mais avançada.", "titulo_pt": "Maturidade regulatória: quando adotar instrumentos já não basta", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 136929, "titulo": "O custo invisível dos leilões da ANP: litígios, passivos e incoerência climática", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-custo-invisivel-dos-leiloes-da-anp-litigios-passivos-e-incoerencia-climatica", "fonte_id": "jota", "data_pub": "2026-09-01T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Leilões de blocos de petróleo e gás sem garantia de licenciamento ambiental podem gerar litígios, passivos e riscos fiscais para o país.", "titulo_pt": "O custo invisível dos leilões da ANP: litígios, passivos e risco fiscal", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 136848, "titulo": "Boomers controlam US$ 90 trilhões e ditam o ritmo da “economia em G” nos EUA", "url": "https://www.infomoney.com.br/business/global/boomers-controlam-us-90-trilhoes-e-ditam-o-ritmo-da-economia-em-g-nos-eua/", "fonte_id": "infomoney", "data_pub": "2026-09-01T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A geração de baby boomers controla US$ 90 trilhões e detém 52% da riqueza das famílias americanas, influenciando fortemente a economia americana. Enquanto isso, os jovens enfrentam desafios mais significativos no mercado de trabalho e na aquisição de imóveis.", "titulo_pt": "Baby boomers controlam US$ 90 trilhões e impulsionam a 'economia em G' nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 136931, "titulo": "STF e o limite da retroatividade nas compensações tributárias", "url": "https://www.jota.info/opiniao-e-analise/artigos/stf-e-o-limite-da-retroatividade-nas-compensacoes-tributarias", "fonte_id": "jota", "data_pub": "2026-09-01T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O limite da retroatividade nas compensações tributárias requer respeito à segurança jurídica, garantindo que atos praticados com base em decisões já transitadas em julgado não sejam afetados negativamente por mudanças posteriores.", "titulo_pt": "STF e o limite da retroatividade nas compensações tributárias", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 137322, "titulo": "Japan’s 10-year government bond hits 3% for first time in three decades", "url": "https://www.japantimes.co.jp/business/2026/09/01/economy/japan-government-bond-3-percent/", "fonte_id": "japan_times", "data_pub": "2026-09-01T07:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A taxa de juros do título do governo japonês a 10 anos atingiu 3% pela primeira vez em três décadas, refletindo preocupações com a inflação e a situação fiscal, mesmo após intervenções e apoio verbal dos órgãos governamentais.", "titulo_pt": "Japão atinge taxa de juros de 10 anos de 3% pela primeira vez em três décadas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 136732, "titulo": "Empresas do Simples Nacional podem fazer opção da reforma tributária a partir desta terça (1º)", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/empresas-do-simples-nacional-podem-fazer-opcao-da-reforma-tributaria-a-partir-desta-terca-1o.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Começa nesta terça-feira (1º) o prazo de 30 dias para que as micro e pequenas empresas do Simples Nacional escolham qual regime irão adotar em relação à reforma tributária. O prazo termina no dia 30 de janeiro de 2026.", "titulo_pt": "Empresas do Simples Nacional têm até 30 dias para escolher regime tributário", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 137049, "titulo": "Shein shares slide on fast-fashion retailer’s stock market debut", "url": "https://www.theguardian.com/business/2026/sep/01/shein-shares-slide-fast-fashion-retailer-stock-market-debut-hong-kong", "fonte_id": "guardian_world", "data_pub": "2026-09-01T07:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Shein, uma marca de fast-fashion com sede em Singapura, fez sua estreia no mercado de ações em Hong Kong, valendo aproximadamente 26 bilhões de dólares. O valor inicial da empresa, que chegou a ser avaliada em cerca de 100 bilhões de dólares, caiu até 10% no primeiro dia de negociação.", "titulo_pt": "Shein registra queda nas ações em sua estreia no mercado de hong kong", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 137426, "titulo": "If space data centers feel far-fetched, why not interstellar travel?", "url": "https://techcrunch.com/2026/09/01/if-space-data-centers-feel-far-fetched-why-not-interstellar-travel/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time por trás dos centros de dados orbitais Starcloud está desenvolvendo um novo projeto de alto risco: enviar uma sonda para Alpha Centauri. Este projeto representa uma abordagem ousada para a exploração espacial além da órbita da Terra.", "titulo_pt": "Se os centros de dados espaciais parecem improváveis, eis um projeto de viagem interestelar", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 136973, "titulo": "Como detectar um deepfake?", "url": "https://www.bbc.com/portuguese/articles/cgk40xgng8jo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-01T09:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Vídeos e imagens criados por inteligência artificial estão se tornando mais realistas; o artigo oferece dicas e estratégias para identificar deepfakes antes de compartilhar.", "titulo_pt": "Como identificar um deepfake?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 137354, "titulo": "As Chinese chipmakers snap up local gear, self-sufficiency drive faces commercial test", "url": "https://www.scmp.com/tech/big-tech/article/3365976/chinese-chipmakers-snap-local-gear-self-sufficiency-drive-faces-commercial-test?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas chinesas de semicondutores estão estabelecendo objetivos cada vez mais ambiciosos para a aquisição de equipamentos locais, aumentando a pressão sobre as empresas locais de equipamentos para desenvolver máquinas confiáveis para produção em massa de wafers. Várias novas fábricas de fabricação de wafers estão definindo metas explícitas de localização.", "titulo_pt": "Empresas chinesas de chips compram equipamentos locais, mas autossuficiência enfrenta teste comercial", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 137433, "titulo": "Dyson’s Next Act Is an Electric Toothbrush With a Camera", "url": "https://www.wired.com/story/dyson-camerajet-electric-toothbrush-and-flosser/", "fonte_id": "wired", "data_pub": "2026-09-01T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Dyson, famosa por aspiradores de pó e secadores de cabelo, lançou um escova dental elétrica com câmera chamada CameraJet, que custa $499. O produto usa uma câmera microscópica para direcionar jatos de líquido de limpeza entre os dentes.", "titulo_pt": "Dyson lança escova dental elétrica com câmera", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 137132, "titulo": "Tim Cook's legacy hinges on Apple's AI bet", "url": "https://www.axios.com/2026/09/01/tim-cooks-legacy-hinges-on-apples-ai-bet", "fonte_id": "axios", "data_pub": "2026-09-01T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tim Cook's legacy está dependente da aposta da Apple em estratégias de inteligência artificial (IA) baseadas em modelos de outras empresas. No curto prazo, essa abordagem pode economizar recursos significativos para a Apple, mas a empresa ficou dependente do Google para algumas de suas capacidades de IA mais importantes.", "titulo_pt": "Herança de Cook depende da aposta da Apple em IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 137134, "titulo": "How golden was Tim Cook's Apple?", "url": "https://www.axios.com/2026/09/01/apple-ceo-cook-stock", "fonte_id": "axios", "data_pub": "2026-09-01T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tim Cook, CEO da Apple, passou 15 anos à frente da empresa, encerrando seu mandato em 2023. Durante esse período, a ação da Apple valorizou 2.272%, atingindo um capital de mercado de $4,7 trilhões, um aumento significativo desde os $347 bilhões de 2011.", "titulo_pt": "Quão ouro foi o reinado de Tim Cook na Apple?", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 137375, "titulo": "How engineered microbes could help feed the world’s crops", "url": "https://www.technologyreview.com/2026/09/01/1143195/microbe-fertilizer-switch-bioworks/", "fonte_id": "mit_tech_review", "data_pub": "2026-09-01T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A utilização de microorganismos geneticamente modificados pode auxiliar na nutrição das plantações, oferecendo nitrôgenio essencial para o crescimento, como alternativa ao uso de fertilizantes químicos, que consomem grande quantidade de energia e geram emissões de gases de efeito estufa.", "titulo_pt": "Como microorganismos engenhados podem auxiliar na nutrição das plantações", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 137376, "titulo": "Taiwan carbon fee joins UK CBAM qualifying list", "url": "https://www.digitimes.com/news/a20260901PD233/taiwan-uk-carbon-pricing-government-price.html", "fonte_id": "digitimes", "data_pub": "2026-09-01T08:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A taxa de carbono da Taiwan foi formalmente incluída na lista de Esquemas de Precificação do Carbono Qualificáveis (QCPS) do mecanismo de Ajuste do Limiar de Carbono do Reino Unido (CBAM), junto com sistemas de precificação do carbono principais da União Europeia, Japão, Coreia do Sul e Singapura. Esta inclusão mostra que o quadro de precificação do carbono da Taiwan está alinhado com os sistemas internacionais e ajudará as indústrias exportadoras a se adaptarem às medidas globais de limiar de carbono nas fronteiras mantendo a competitividade.", "titulo_pt": "Taxa de carbono da taiwan é incluída na lista do CBAM do reino unido", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 137377, "titulo": "Taoyuan eyes northern AIDC hub, touts Tatan and LNG cooling edge", "url": "https://www.digitimes.com/news/a20260901PD209/taiwan-aidc-cooling-data-center-demand.html", "fonte_id": "digitimes", "data_pub": "2026-09-01T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Taiwan está se posicionando como uma base demonstrativa de centrais de dados de inteligência artificial (AIDC) no norte do país, com a cidade de Taoyuan destacando sua planta de energia Tatan e o terminal de recepção de gás natural liquefeito (LNG) da CPC Corp. como vantagens estratégicas. A escassez de energia e a dependência de importações tornam a energia um recurso estratégico precioso na era do processamento de dados.", "titulo_pt": "Taoyuan almeja se tornar hub de AIDC no norte, destacando vantagens de Tatan e terminal LNG", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 137378, "titulo": "SK Hynix touts up to 5.15x inference gains with custom HBM", "url": "https://www.digitimes.com/news/a20260901VL220/sk-hynix-hbm-capacity-performance-ai-agent-semicon-taiwan.html", "fonte_id": "digitimes", "data_pub": "2026-09-01T08:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SK Hynix afirma que uma arquitetura de HBM personalizada, que coloca funções de cálculo no die de base, pode melhorar o desempenho de inferência de modelos de linguagem de grande porte em até 5,15 vezes, devido à crescente restrição causada pelo movimento de dados.", "titulo_pt": "SK Hynix destaca ganhos de até 5,15 vezes na inferência com arquitetura HBM personalizada", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 137410, "titulo": "LS Cable targets AI data center infrastructure with superconducting technology", nte_id": "yonhap_news", "data_pub": "2026-09-01T07:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas de agosto da GM Korea, uma unidade sul-coreana da General Motors, aumentaram 9,4% devido a fortes exportações.", "titulo_pt": "Vendas de agosto da GM Korea aumentam 9,4% com forte exportação", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 137216, "titulo": "Hugging Face's new duck robot is selling fast. A Chinese chip powers it", "url": "https://www.cnbc.com/2026/09/01/hugging-faces-new-duck-robot-is-selling-fast-a-chinese-chip-powers-it.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-01T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O robô colorido 'Microduck', da subsidiária francesa Pollen Robotics do Hugging Face, já vendeu mais de 10.000 unidades desde seu lançamento na quinta-feira. Um chip chinês alimenta o robô.", "titulo_pt": "Novo robô de pato colorido da hugging Face vende rapidamente, com chip chinês na base", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 137443, "titulo": "Kia's global sales rise 5 pct in Aug. on SUV sales", "url": "https://en.yna.co.kr/view/AEN20260901010400320", "fonte_id": "yonhap_news", "data_pub": "2026-09-01T07:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas globais da Kia aumentaram 5% em agosto, devido ao bom desempenho das picapes.", "titulo_pt": "Vendas globais da kia crescem 5% em agosto, impulsionadas por picapes", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 137090, "titulo": "Inside a quest to learn about the ocean’s mysterious “deep reefs”", "url": "https://www.vox.com/the-highlight/500853/inside-a-quest-to-learn-about-the-oceans-mysterious-deep-reefs", "fonte_id": "vox", "data_pub": "2026-09-01T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em maio, na ilha do Palau,
