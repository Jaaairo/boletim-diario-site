<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

omo favorito, mas o partido de extrema-direita Vox também é uma força a ser considerada. No cenário econômico, a bolsa de Milão registrou uma forte alta, com os principais índices europeus também em alta. Ainda na área política, o presidente alemão urgiu as empresas alemães a investirem na África, enquanto Trump exigiu uma investigação sobre dados do PIB divulgados antes das eleições de meios-termos. Em relação ao clima, a Terra permaneceu acima dos dois graus de aquecimento global por uma semana consecutiva, refletindo a falha na Conferência do Clima. Além disso, a Coreia do Norte limitou o envio de novos soldados para a Ucrânia, mas manteve seu apoio à Rússia fornecendo armas e munições.\n\nA Lituânia ameaça revogar o status de representação de Taiwan para melhorar suas relações com a China, enquanto a China intensifica suas atividades militares, incluindo um ataque aéreo no Kuwait que resultou em duas mortes. Em outro desenvolvimento geopolítico, a Rússia intensificou suas operações militares na Ucrânia, lançando mísseis e drones, o que levou as defesas aéreas ucranianas a interceptarem 87 mísseis e drones russos. As tensões entre a China e os Estados Unidos continuam, com mais de 50% dos americanos acreditando que a China já ultrapassou ou eventualmente superará os Estados Unidos em tecnologia, força econômica e poder militar. Além disso, a China anunciou uma visita do líder norte-coreano Kim Jong Un a instalações nucleares, reforçando as preocupações sobre o programa nuclear do país.", "economia": "Pablo Hernández de Cos, economista espanhol, foi escolhido para presidir o Banco Central Europeu (BCE), substituindo Christine Lagarde, após o governo holandês retirar seu apoio ao rival Klaas Knot. Em outro destaque, a White Martins expandiu sua fábrica de gases industriais em Pernambuco para acompanhar o crescimento industrial do Nordeste. O Banco Central do Brasil implementou medidas para reduzir o endividamento dos clientes, afetando até 20 milhões de pessoas. A Embraer planeja insistir no argumento econômico para evitar novas tarifas de 10% sobre aeronaves acabadas dos Estados Unidos. A Grécia reduziu drasticamente sua dívida pública e busca acelerar os pagamentos, enquanto a Itália volta a ser o país mais endividado da zona do euro. O Quênia se tornou um importante destino para as exportações chinesas de componentes solares e para as exportações de painéis solares para os Estados Unidos. Além disso, a Lukoil vendeu seus ativos internacionais a um grupo liderado por investidores americanos por US$ 10 bilhões. O Japão registrou que cerca de 59% das empresas estão sentindo que os efeitos negativos das taxas de juros mais altas superam os positivos, indicando que as medidas de aumento das taxas de juros estão começando a ter impacto significativo na economia empresarial japonesa.", "tecnologia": "Andrew Bailey, supervisor do Banco da Inglaterra, expressou preocupações sobre modelos de inteligência artificial não divulgados que levantaram questões sobre a criptografia, alertando para potenciais riscos à segurança dos dados nos sistemas financeiros. Em outro desenvolvimento, os desenvolvedores de aplicativos para Android estão preocupados com a nova política da Google, que exige a divulgação de endereços e números de telefone a partir de 2024, em cumprimento às regulamentações europeias do Digital Services Act. Elon Musk prometeu duas missões espaciais da SpaceX para cada criança dos EUA em uma campanha para apoiar a inteligência artificial, buscando apoio público para seus negócios de satélites e IA durante um período de escrutínio público e político. Além disso, a empresa chinesa Z.AI está atrasada no lançamento de seu próximo modelo de IA devido a restrições de acesso à capacidade computacional no exterior, enquanto a concorrente Moonshot AI pode dobrar o intervalo entre lançamentos devido a essas mesmas limitações.", "ciencia": "Uma pesquisa recente da NASA revelou a descoberta do quasar mais distante conhecido, formado há cerca de 630 milhões de anos após o Big Bang, estabelecendo um novo recorde. Este achado, feito por cientistas, fornece importantes insights sobre a formação e evolução das galáxias no universo. Em outro desenvolvimento, a NASA está recrutando astronautas para viver na Lua, oferecendo um salário anual de US$ 164 mil. Este programa visa a construção de uma base no polo sul lunar, onde os astronautas enfrentarão condições extremas. Além disso, um estudo publicado na Phys.org mostrou que algumas proteínas miniaturizadas Cas12m podem cortar DNA, uma descoberta que esclarece as diferenças estruturais entre estados ativos e inativos dessas proteínas, potencialmente avançando a engenharia genômica.", "cultura": "O evento mais importante dos artigos publicados é a nomeação da primeira mulher árabe para a curadoria da Bienal de Veneza, com a nomeação de Hoor al-Qasimi. Este é um marco histórico para a representatividade cultural árabe no cenário internacional. Em seguida, destaca-se a aprovação da segunda temporada da série 'Jogada de Risco' pela Globo, que estreará no Globoplay em 2028. Na área de cultura, a novela 'Lá na Minha Terra', protagonizada por Dira Paes, se destaca como a mais vista no Globoplay, superando sucessos como 'Quem Ama Cuida' e 'Por Você'. Outro destaque é a exposição 'Visões Cotidianas do Brasil Moderno', que será realizada na Caixa Cultural Fortaleza, apresentando obras de artistas do modernismo brasileiro. A novela 'Avenida Brasil 2' traz de volta a história de Jorginho e Nina, que retornarão ao bairro do Divino no Rio de Janeiro para superar um trauma. Também merecem destaque a nomeação de Hélio Moretti como relator do projeto que pode ampliar o corte na Lei Rouanet, impactando o setor cultural, e a reclassificação do reality show 'MasterChef Profissionais' para não recomendado para menores de 12 anos devido a palavrões. O filme 'Yellow Cake', que se passa no sertão brasileiro e aborda a temática da dengue, também chama atenção, além de outros eventos como a reestreia do filme 'Homem-Aranha: Um Novo Dia' com versão estendida em dezembro, e a apresentação do quarteto The Damned, que celebra 50 anos de carreira.", "sociedade": "As autoridades estão investigando instalações de cuidados de longo prazo no país devido a suspeitas de abuso, com foco em estabelecimentos que cuidam de idosos e pessoas com deficiências. Em outro desenvolvimento, uma empresa brasileira de reciclagem recebeu um investimento de um Nobel da Paz para desenvolver ferramentas digitais para catadores e recicladores autônomos. A Metrópoles noticiou que uma escola em Santa Catarina multou uma professora que postou uma foto fazendo a letra 'L' com sua turma. As câmeras de segurança registraram a fuga de um suspeito após ele matar um pastor em uma igreja, com as imagens mostrando o suspeito caminhando em um posto de gasolina alguns minutos após o crime. Uma família no Pará está pedindo esclarecimentos sobre a morte de um soldado em um quartel, com as explicações oficiais do Exército ainda não sendo consideradas suficientes. A investigação está em andamento para apurar se o furto de um crânio de uma menina em Minas Gerais para rituais ocultistas envolveu outras pessoas. O ministro do Meio Ambiente, Murray Watt, reconheceu as preocupações levantadas por cientistas e celebridades, incluindo Hugh Jackman, sobre um projeto de gás offshore na costa norte da Austrália Ocidental. Em outro caso, um estudante de ensino médio foi suspenso e transferido para outra classe após ser flagrado urinando em uma garrafa térmica de uma colega, com a vítima deixando a escola. Protestos ocorreram em diversos países dos Bálcãs em celebração ao Dia Internacional para a Eliminação da Violência Contra as Mulheres, exigindo mais proteção para mulheres e maior responsabilidade oficial. Os indicadores econômicos negativos indicam que os dias poderão ser difíceis para o deputado argentino Matías Milei e seu projeto de reeleição. A diabetes pode levar a fraturas ósseas devido à glicemia elevada, que fragiliza os ossos silenciosamente, mas é possível investigar e tratar o problema antes que ocorram danos. Um encontro será realizado em Brasília para discutir a implementação de políticas públicas em favor dos animais. O casal Obama realizou uma visita inesperada a uma ONG comunitária em Chicago, onde ajudou no preparo de caixas com alimentos frescos para serem distribuídos a famílias carentes. Trabalhadores sindicalizados da Korea Railroad Corp. (KORAIL) lançaram uma campanha de trabalho regrado, resultando no cancelamento de três serviços ferroviários. A investigação do Senado descobriu que o programa Support at Home, lançado em novembro de 2025, tem burocracia confusa e limita o acesso a cuidados, levando muitos idosos a morrerem sem acesso a suporte domiciliar, a pagar altos valores e a serem encaminhados para hospitais ou casas de repouso antes do necessário. Um estudo destaca que a falta de políticas para a vida adulta de pessoas com deficiência aumenta a vulnerabilidade dessas pessoas e que o peso do cuidado geralmente recai sobre as famílias. No Japão, há pessoas que trabalham após os 100 anos, motivadas pela necessidade econômica e pelo conceito de ikigai. A meningite está causando preocupação em Gaza, devido ao sobrepovoamento e ao sistema de saneamento danificado, que estão colocando as crianças em risco. Menos jovens sul-coreanos estão bebendo álcool, mas entre as meninas o consumo de álcool em doses altas aumentou 2,5 pontos percentuais para 54,5% este ano. Um levantamento revelou que mais de 40% dos distritos escolares do Japão têm pelo menos um café comunitário para crianças. O número total de cafeterias comunitárias para crianças atingiu um recorde de 13.800. Funcionários jovens de Kumamoto estão utilizando as lições aprendidas com o terremoto de 2016 para auxiliar na atual assistência às vítimas. A política de licenças parentais para educadores foi ampliada, oferecendo mais tempo de licença para os educadores que se tornam pais ou mães.", "meio_ambiente": "A seca na Amazônia tem levantado preocupações ambientais e sociais, com o governo federal considerando fornecer um auxílio emergencial para cerca de 400 mil pescadores artesanais afetados. Em outro desenvolvimento, um navio-tanque com aproximadamente 7 mil toneladas de diesel virou perto da ilha de Ibiza, na Espanha, levando autoridades a avaliar os possíveis danos ambientais. Além disso, um incêndio em uma fábrica de doces na Indonésia resultou em 26 mortos e cerca de 30 desaparecidos, levantando questões sobre a aplicação das regulamentações de segurança no trabalho no país.", "direitos_humanos": "Um ano após o grande incêndio em Hong Kong que deixou 168 mortos e cerca de 4.600 desalojados, sobreviventes estão pressionando por justiça. Essa situação é retratada na cobertura do DW Brasil. Em outro caso, a senadora Campillai apresentou uma denúncia judicial contra ex-comandantes da Carabineros do Chile, acusando-os de ter conhecimento de violações aos direitos humanos durante os protestos sociais e de não terem agido para impedir essas violações. O Le Monde relatou que Emilie König, uma mãe de cinco filhos repatriada da Síria, enfrenta julgamento em Paris por disseminar propaganda do grupo Estado Islâmico. Além disso, o tribunal de apelações de Paris manteve a decisão de julgamento contra Gérard Depardieu, de 77 anos, acusado de estupro, e o Le Monde revelou que Jordan Bardella, presidente do partido de Marine Le Pen, fez comentários antissemitas, contrariamente às suas negações. O Conselho de Direitos Humanos da ONU pede que o Vietnã explique a 'abdução' de ativistas, enquanto o Reino Unido enviou um refugiado sri lankês para Eswatini, onde ele se suicidou, como parte de um acordo secreto, conforme investigação da BBC. O Reino Unido também enfrenta críticas por novas leis de defesa que podem ter 'significativas' implicações para os direitos humanos, segundo inquérito do Partido Laborista. A Nepal iniciou o processo legal de declarar mortos milhares de pessoas desaparecidas três meses após as inundações catastróficas de verão, enquanto a ONU relata que cerca de 47.000 mulheres e meninas foram mortas intencionalmente por parceiros íntimos ou familiares no ano passado. A esposa do jornalista japonês Yuki Imai, detido na Rússia sob acusações de espionagem, pede por sua liberdade. A detenção do estudante de doutorado Eva Yi Xie e outros por ICE é criticada como uma demonstração do aumento da repressão do governo Trump a instituições acadêmicas americanas. Além disso, a educação jurídica antirracista é discutida no artigo do Ciper Chile sobre as Mirabal e os direitos das mulheres, enquanto o uso de estunadores em protestos em França causa lesões severas a pessoas."}, "resumo_do_dia": {"politica_nacional": [{"id": 288867, "titulo": "Macron diz que carne brasileira é 'dopada' e gera revolta de representantes do agro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/11/macron-diz-que-carne-e-dopada-e-gera-revolta-de-representantes-do-agro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-26T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ABPA e a Abiec criticaram uma declaração do presidente da França, Emmanuel Macron, que classificou a carne brasileira como 'dopada'.", "titulo_pt": "Macron diz que carne brasileira é 'dopada' e gera revolta do agronegócio", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 289098, "titulo": "Dino insiste para que Fachin dê explicações sobre julgamento do aborto", "url": "https://www.jota.info/stf/do-supremo/dino-insiste-para-que-fachin-de-explicacoes-sobre-julgamento-do-aborto", "fonte_id": "jota", "data_pub": "2026-11-26T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Dino pressiona o ministro Fachin para que ele forneça explicações sobre o julgamento do caso de aborto em 2025. Os detalhes envolvem atos que permitiram o voto do ministro aposentado Luís Roberto Barroso nessa data.", "titulo_pt": "Dino pressiona Fachin por explicações sobre julgamento do aborto", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 289100, "titulo": "Fórum JOTA Visão 2030 debate os rumos do Brasil até o fim da década", "url": "https://www.jota.info/coberturas-especiais/forum-jota/forum-jota-visao-2030-debate-os-rumos-do-brasil-ate-o-fim-da-decada", "fonte_id": "jota", "data_pub": "2026-11-26T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Fórum JOTA Visão 2030, realizado em Brasília no dia 3 de dezembro, reuniu a ministra Esther Dweck e os senadores Rogério Marinho e Helder Barbalho para discutir os rumos do Brasil até o final da década, com transmissão ao vivo pelo YouTube.", "titulo_pt": "Fórum JOTA Visão 2030 debate os rumos do Brasil até o fim da década", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 289101, "titulo": "STF AO VIVO – Reajuste do piso salarial nacional do magistério – 26/11/2026", "url": "https://www.jota.info/stf/do-supremo/stf-ao-vivo-reajuste-do-piso-salarial-nacional-do-magisterio-26-11-2026", "fonte_id": "jota", "data_pub": "2026-11-26T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) discutirá se os reajustes do piso salarial nacional do magistério exigem uma lei específica para incluir professores estaduais e municipais.", "titulo_pt": "STF AO VIVO - Reajuste do piso salarial nacional do magistério - 26/11/2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 289094, "titulo": "Cleitinho debate com Lula a renegociação da dívida de MG: \"Quero pagar\"", "url": "https://www.metropoles.com/brasil/cleitinho-debate-com-lula-a-renegociacao-da-divida-de-mg-quero-pagar", "fonte_id": "metropoles", "data_pub": "2026-11-26T17:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula recebeu o governador eleito de Minas Gerais para discutir a renegociação da dívida estadual, que chega a aproximadamente R$ 180 bilhões.", "titulo_pt": "Cleitinho debate com Lula sobre renegociação da dívida de minas gerais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 288891, "titulo": "Número de pedidos para primeira CNH cresce 193% em 2026, segundo Ministério dos Transportes", "url": "https://g1.globo.com/carros/noticia/2026/11/26/numero-de-pedidos-para-primeira-cnh-cresce-193percent-em-2026-segundo-ministerio-dos-transportes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-26T16:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de pedidos para obtenção da primeira Carteira Nacional de Habilitação (CNH) aumentou 193,3% em 2026, com 8,59 milhões de processos abertos até novembro, de acordo com o Ministério dos Transportes. Houve também uma emissão de 2,7 milhões de CNHs, com alta de 16,8% em comparação com o mesmo período do ano anterior.", "titulo_pt": "Número de pedidos para primeira CNH cresce 193% em 2026, de acordo com Ministério dos Transportes", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 288892, "titulo": "TSE: Estela Aranha relata ataques misóginos e cobra solidariedade de colegas; ministros rebatem", "url": "https://g1.globo.com/politica/noticia/2026/11/26/tse-estela-aranha-relata-ataques-misoginos-e-cobra-solidariedade-de-colegas-ministros-rebatem.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-26T16:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra Estela Aranha do Tribunal Superior Eleitoral (TSE) relatou que não recebeu solidariedade de colegas após sofrer ataques misóginas durante as eleições. Ela cobra apoio institucional do tribunal na apuração dos fatos.", "titulo_pt": "Estela Aranha relata ataques misóginos e cobra solidariedade de colegas; ministros rebatem", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 288860, "titulo": "Entidades articulam mobilização popular por ministra negra no STF diante de Senado hostil a Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/entidades-articulam-mobilizacao-popular-por-ministra-negra-no-stf-diante-de-senado-hostil-a-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-26T16:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Movimentos negros e entidades estão mobilizando apoio popular para a indicação de uma ministra negra para o STF, diante de uma postura hostil do Senado em relação ao governo Lula. Embora reconheçam os desafios, essas organizações acreditam que a pressão popular pode dificultar acordos de bastidores e aumentar o custo de um possível veto.", "titulo_pt": "Entidades articulam mobilização popular por ministra negra no STF diante de Senado hostil a Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 288893, "titulo": "Reforma tributária: sem benefícios a produtos e setores, imposto do governo cairia de 11,3% para 7% em 2027, estima órgão do Senado", "url": "https://g1.globo.com/economia/noticia/2026/11/26/reforma-tributaria-sem-beneficios-a-produtos-e-setores-imposto-do-governo-cairia-de-113percent-para-7percent-em-2027-estima-orgao-do-senado.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-26T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Instituição Fiscal Independente (IFI), do Senado Federal, estimou que a alíquota do imposto de consumo federal cairia para 7% em 2027, sem os benefícios fiscais para produtos e setores. Isso representa uma redução em relação aos 8,5% estimados pela Receita Federal sem essas exceções.", "titulo_pt": "Reforma tributária: sem benefícios, imposto do governo cairia para 7% em 2027, estima ifi", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 288861, "titulo": "Centrão escolhe nomes 'coringa' para ministérios enquanto espera Lula distribuir pastas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/centrao-escolhe-nomes-coringa-para-ministerios-enquanto-espera-lula-distribuir-pastas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-26T15:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Partidos do Centrão estão alinhando internamente os nomes dos eventuais indicados para ministérios do governo Lula (PT) enquanto aguardam a definição das pastas para cada legenda.", "titulo_pt": "Centrão alinha nomes para ministérios enquanto aguarda Lula definir pastas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 288894, "titulo": "Cleitinho se reúne com Lula, convida petista para posse e defende 'pacificação' do país", "url": "https://g1.globo.com/politica/noticia/2026/11/26/cleitinho-se-reune-com-lula-convida-petista-para-posse-e-defende-pacificacao-do-pais.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-26T15:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador eleito de Minas Gerais, Cleitinho Azevedo, se reuniu com o presidente Lula no Palácio da Alvorada para convidar Lula para a sua posse e discutir a dívida do estado com a União.", "titulo_pt": "Cleitinho convida Lula para posse e discute dívida do estado", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 288895, "titulo": "Governo dá 10 dias para que Google amplie informações sobre anúncios e fixa multa de R$ 200 mil em caso de descumprimento", "url": "https://g1.globo.com/economia/noticia/2026/11/26/governo-da-10-dias-para-que-google-amplie-informacoes-sobre-anuncios-e-fixa-multa-diaria-de-r-200-mil-em-caso-de-descumprimento.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-26T15:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Senacon, do Ministério da Justiça, determinou que o Google Brasil amplie as informações em sua Central de Transparência de Anúncios e fixou uma multa diária de R$ 200 mil em caso de descumprimento. O prazo para cumprimento das exigências é de 10 dias.", "titulo_pt": "Governo determina que Google amplie informações sobre anúncios e fixa multa de R$ 200 mil", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 289102, "titulo": "Ministra do TSE relata ataques e diz que atuais colegas não se solidarizaram: ‘ninguém se importa’", "url": "https://www.jota.info/justica/ministra-do-tse-relata-ataques-e-diz-que-atuais-colegas-nao-se-solidarizaram-ninguem-se-importa", "fonte_id": "jota", "data_pub": "2026-11-26T15:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estela Aranha, ministra do TSE, relatou ataques sofridos e afirmou que não recebeu apoio institucional dos colegas. Ela também sugeriu que a defesa de mulheres em tribunais é meramente retórica.", "titulo_pt": "Ministra do TSE relata ataques e falta de apoio dos colegas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 288862, "titulo": "Tarcísio mantém no cargo secretária de Esportes para o segundo mandato", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/tarcisio-mantem-no-cargo-secretaria-de-esportes-para-o-segundo-mandato.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-26T15:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador de São Paulo, Tarcísio de Freitas (Republicanos), decidiu manter a secretária estadual de Esportes, Cláudia Carletto, em seu cargo para o segundo mandato.", "titulo_pt": "Tarcísio mantém secretária de Esportes para o segundo mandato", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 288992, "titulo": "Alckmin chama novas tarifas dos EUA de ‘irrazoáveis’; governo Lula diz que Brasil não cederá a ameaças", "url": "https://www.brasildefato.com.br/2026/11/26/alckmin-chama-novas-tarifas-dos-eua-de-irrazoaveis-governo-lula-diz-que-brasil-nao-cedera-a-ameacas/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-26T15:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vice-presidente Geraldo Alckmin considerou as novas tarifas dos Estados Unidos contra produtos brasileiros como 'irrazoáveis'. O governo Lula expressou indignação e afirmou que o Brasil não se submeterá a ameaças.", "titulo_pt": "Alckmin considera tarifas dos EUA 'irrazoáveis'; governo Lula se posiciona contra ameaças", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 288876, "titulo": "Durigan fala em combater supersalários e mudar aposentadoria de militares em novo pacote fiscal", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/durigan-fala-em-combater-supersalarios-e-mudar-aposentadoria-de-militares-em-novo-pacote-fiscal.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-26T15:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, afirmou que está discutindo a revisão de privilégios e injustiças no Orçamento público para o próximo pacote de medidas fiscais, a ser enviado ao Congresso Nacional. O pacote incluirá a combate a supersalários e a reforma da aposentadoria dos militares.", "titulo_pt": "Durigan fala em combater supersalários e reformar aposentadoria de militares em novo pacote fiscal", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 289530, "titulo": "Lithuania threatens to revoke Taiwan office status to fix China ties", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/27/2003868491", "fonte_id": "taipei_times", "data_pub": "2026-11-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Lituânia ameaça revogar o status da representação da Taiwan para corrigir as relações com a China. A medida visa melhorar as relações diplomáticas com o país asiático.", "titulo_pt": "Lituânia ameaça revog ex-candidato à liderança da oposição, anunciou seu retorno à Venezuela. Ele se encontrará com Machado para comemorar as celebrações da Virgem de Coromoto.", "titulo_pt": "Ex-candidato à liderança da oposição anuncia retorno à Venezuela", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 289650, "titulo": "As he races to unseat Netanyahu, Eisenkot reaches deal with left-wing party", "url": "https://www.washingtonpost.com/world/2026/11/26/he-races-unseat-netanyahu-eisenkot-reaches-deal-with-left-wing-party/", "fonte_id": "washington_post_world", "data_pub": "2026-11-26T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gadi Eisenkot, líder do partido Yashar, chegou a um acordo com um partido da esquerda para formar uma coalizão que detém 48 dos 120 assentos do Knesset, o parlamento israelense, ainda distante dos 61 necessários para derrubar Benjamin Netanyahu.", "titulo_pt": "Em race para derrubar Netanyahu, Eisenkot chega a acordo com partido da esquerda", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 289461, "titulo": "Netanyahu’s corruption trial: Is it really all over?", "url": "https://www.aljazeera.com/news/2026/11/26/netanyahus-corruption-trial-is-it-really-all-over?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-26T17:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A recomendação do tribunal voltou a colocar em foco o julgamento do líder israelense, seu futuro político e esforços para evitar aProsecução.", "titulo_pt": "Processo de corrupção de netanyahu: será mesmo tudo resolvido?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 289408, "titulo": "Saudi pop music is thriving — but for the right reasons?", "url": "https://www.dw.com/en/saudi-pop-music-is-thriving-but-for-the-right-reasons/a-80036013?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-26T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cena musical saudita evoluiu significativamente como parte da Vision 2030, graças ao financiamento e apoio do governo. Músicos e DJs locais estão otimistas. No entanto, eles podem estar apenas auxiliando a manter um estado autoritário.", "titulo_pt": "A música pop saudita está prosperando — mas por quais razões?", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 289462, "titulo": "Syrian children continue learning amid the ruins of war in Idlib", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/26/syrian-children-continue-learning-amid-the-ruins-of-war-in-idlib?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-26T17:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Escolas em Idlib, Síria, foram reabertas, apesar do estado destruído delas. Os alunos continuam estudando em ambientes que ainda mostram os efeitos da guerra.", "titulo_pt": "Crianças sírias continuam estudando em escolas destruídas em Idlib", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 289099, "titulo": "Quem controla a informação controla as eleições?", "url": "https://www.jota.info/opiniao-e-analise/colunas/constituicao-empresa-e-mercado/quem-controla-a-informacao-controla-as-eleicoes", "fonte_id": "jota", "data_pub": "2026-11-26T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A necessidade de igualdade entre os candidatos e a prevenção de favorecimentos injustos pelas plataformas digitais são aspectos importantes a serem considerados no controle da informação durante as eleições.", "titulo_pt": "Quem controla a informação controla as eleições?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 289197, "titulo": "Elecciones España 2026, EN VIVO: debate presidencial hoy, las últimas encuestas y las noticias del 29-N", "url": "https://www.lanacion.com.ar/el-mundo/elecciones-espana-2026-en-vivo-que-dicen-las-encuestas-y-las-ultimas-noticias-h u.", "titulo_pt": "Mélenchon viaja para berlim, onde sua retórica anti-alemã inquieta até mesmo seus 'parceiros'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 289409, "titulo": "On his last Africa trip, Steinmeier urges German firms to invest and take risks as China pushes ahead", "url": "https://www.dw.com/en/on-his-last-africa-trip-steinmeier-urges-german-firms-to-invest-and-take-risks-as-china-pushes-ahead/a-80067717?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-26T17:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente alemão em seu último tour pela África incentivou as empresas alemãs a serem mais ousadas e a aproveitarem as oportunidades continentais, enquanto a China avança em suas investidas.", "titulo_pt": "No último tour africano, Steinmeier incentiva empresas alemãs a investirem e assumirem riscos", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 289651, "titulo": "Two Italians killed in Kuwait as a strained Iran ramps up attacks", "url": "https://www.washingtonpost.com/world/2026/11/26/two-italians-killed-kuwait-strained-iran-ramps-up-attacks/", "fonte_id": "washington_post_world", "data_pub": "2026-11-26T17:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois italianos foram mortos em Kuwait enquanto as tensões entre Irã e outros países aumentam. Os trabalhadores eram técnicos de uma empresa de defesa alemã, Rheinmetall, e os ataques do Irã recentemente afetaram Bahrain e Kuwait.", "titulo_pt": "Dois italianos mortos em Kuwait com aumento de ataques do Irã", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 289486, "titulo": "Famiglia De Gennaro, rendere pubblica integralmente la sua lettera aperta", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/26/famiglia-de-gennaro-rendere-pubblica-integralmente-la-sua-lettera-aperta_5b2f8968-f565-4de1-b394-14bd18814890.html", "fonte_id": "a lário-montadoras-alemãs-pressionam-trabalhadores/a-80065740?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-26T16:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Funcionários das montadoras alemãs que obtiveram benefícios durante os anos de crescimento da indústria estão sendo forçados a renunciar a conquistas anteriores para manter seus empregos. As empresas pressionam os trabalhadores a aceitarem salários e condições de trabalho menores.", "titulo_pt": "Mais trabalho, mesmo salário: montadoras alemãs pressionam trabalhadores", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 289031, "titulo": "Endividamento: Veja medidas do BC que podem afetar 20 milhões de clientes", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/endividamento-veja-medidas-do-bc-que-podem-afetar-20-milhoes-de-clientes/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-26T16:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As medidas do Banco Central visam aumentar a proteção dos clientes bancários e intensificar as restrições de crédito sem garantia a partir de 2027. Estas ações podem afetar 20 milhões de clientes.", "titulo_pt": "Endividamento: veja medidas do BC que podem afetar 20 milhões de clientes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 289137, "titulo": "Imigração líquida no Reino Unido cai ao menor nível em quase três décadas", "url": "https://www.dw.com/pt-br/imigração-líquida-no-reino-unido-cai-ao-menor-nível-em-quase-três-décadas/a-80066307?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-26T16:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A imigração líquida no Reino Unido atingiu o menor nível em quase três décadas em 2026, com uma diferença de 77 mil entre entradas e saídas, menos da metade do registrado no ano anterior.", "titulo_pt": "Imigração líquida no Reino Unido cai ao menor nível em quase três décadas", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 289454, "titulo": "Pablo Hernández de Cos: the ‘consensus-builder’ taking over the ECB", "url": "https://www.ft.com/content/1fda901a-222a-4b3e-8e20-ea80c3fbf1d2?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-26T16:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pablo Hernández de Cos, economista espanhol, é percebido como um habilidoso diplomata com uma combinação única de habilidades diplomáticas e rigor acadêmico.", "titulo_pt": "Pablo Hernández de Cos: o ‘construtor de consensos’ assumindo a presidência do bce", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 289138, "titulo": "Após 20 anos, Grécia vai deixar de ser país mais endividado da zona do euro", "url": "https://www.dw.com/pt-br/após-20-anos-grécia-vai-deixar-de-ser-país-mais-endividado-da-zona-do-euro/a-80062995?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-26T15:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Grécia reduz drasticamente sua dívida pública e busca acelerar os pagamentos, enquanto a Itália volta a ser o país mais endividado da zona do euro, ocupando novamente o posto que tinha em 2006.", "titulo_pt": "Após 20 anos, Grécia deixa de ser o país mais endividado da zona do euro", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 288872, "titulo": "Medidas do BC contra endividamento vão afetar até 20 mi de pessoas, diz diretor", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/medidas-do-bc-contra-endividamento-vao-afetar-ate-20-mi-de-pessoas-diz-diretor.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-26T15:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central implementou medidas para reduzir o endividamento dos clientes em cartão de crédito e em operações de crédito sem garantia, afetando até 20 milhões de pessoas, conforme informou o diretor de Regulação, Gilneu Vivan.", "titulo_pt": "Medidas do BC contra endividamento afetarão até 20 milhões de pessoas, diz diretor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 288873, "titulo": "Dólar alto traz incerteza, mas Latam mantém planos de expansão para 2027", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/dolar-alto-traz-incerteza-mas-latam-mantem-planos-de-expansao-para-2027.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-26T15:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A volatilidade do dólar aumenta as incertezas para o planejamento da Latam em 2027, mas a empresa mantém a expectativa de crescimento no Brasil. A companhia ainda avaliará o ritmo de expansão para o próximo ano, considerando a pressão cambial sobre os custos e o possível impacto da alta das passagens sobre a demanda.", "titulo_pt": "Dólar alto traz incerteza, mas Latam mantém planos de expansão para 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 288875, "titulo": "Lukoil venderá ativos no exterior a grupo americano por US$ 10 bilhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/lukoil-vendera-ativos-no-exterior-a-grupo-americano-por-us-10-bilhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-26T15:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um grupo liderado por investidores americanos assinou um acordo de US$ 10 bilhões para adquirir os ativos internacionais da Lukoil, uma das maiores empresas petrolíferas da Rússia. A transação faz parte de um plano de negócios promovido pelo governo Trump como parte das negociações de paz com o Kremlin.", "titulo_pt": "Lukoil venderá ativos internacionais a grupo americano por US$ 10 bilhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 289449, "titulo": "Hawkish Fed poised to raise rates despite stock market turmoil", "url": "https://www.ft.com/content/3890f725-66dd-4613-8a60-d9e3ea38d25a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-26T14:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os membros da Federal Reserve estão mais preocupados com a inflação do que com o recente colapso do mercado de tecnologia, mesmo que isso possa indicar preocupações econômicas.", "titulo_pt": "Fed agressivo prevê aumento das taxas apesar da volatilidade do mercado de ações", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 288880, "titulo": "Rumo é autuada por ANTT após furtos e depredação na Ferrovia Malha Oeste", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/11/rumo-e-autuada-por-antt-apos-furtos-e-depredacao-na-ferrovia-malha-oeste.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-26T14:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ferrovia Malha Oeste, operada pela Rumo, enfrentou furtos e depredações em suas instalações menos de dois meses após a empresa assinar um acordo com o governo federal para manter a vigilância e a conservação da malha até sua devolução à União.", "titulo_pt": "Rumo é autuada por ANTT após furtos e depredação na Ferrovia Malha Oeste", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 289455, "titulo": "Andrew Bailey says unreleased AI models have raised encryption concerns", "url": "https://www.ft.com/content/450920b9-82b8-4a66-960b-5740aa7f94ae?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-26T17:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andrew Bailey expressou preocupações sobre modelos de inteligência artificial não divulgados que levantaram questões sobre a criptografia. Avanços matemáticos têm alimentado temores de que os dados nos sistemas financeiros estejam em risco.", "titulo_pt": "Andrew Bailey menciona preocupações com modelos de IA não divulgados e avanços matemáticos na criptografia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 289591, "titulo": "Android app developers will soon have to share their address publicly", "url": "https://www.theverge.com/tech/1043228/android-play-store-google-developer-address-eu", "fonte_id": "the_verge", "data_pub": "2026-11-26T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desenvolvedores de aplicativos para Android estão preocupados com sua privacidade após a Google anunciar que a partir do próximo ano, muitos deles terão que compartilhar seu número de telefone e endereço publicamente. A mudança na política visa atender às regulamentações europeias do Digital Services Act.", "titulo_pt": "Desenvolvedores de apps para android terão que compartilhar endereço e número de telefone publicamente", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 289011, "titulo": "Musk promete 2 ações da SpaceX para cada criança dos EUA em ofensiva por apoio à IA", "url": "https://www.infomoney.com.br/mercados/musk-promete-2-acoes-da-spacex-para-cada-crianca-dos-eua-em-ofensiva-por-apoio-a-ia/", "fonte_id": "infomoney", "data_pub": "2026-11-26T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Musk oferece duas ações da SpaceX para cada criança dos EUA em uma campanha para apoiar a IA. O objetivo é conquistar apoio público para seus negócios de satélites e IA durante um período de intenso escrutínio público e político sobre a tecnologia.", "titulo_pt": "Musk promete duas ações da SpaceX para cada criança dos EUA em campanha por apoio à IA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 289027, "titulo": "Artistas estão desistindo do Instagram por medo de que IA roube suas obras", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/artistas-estao-desistindo-do-instagram-por-medo-de-que-ia-roube-suas-obras/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-26T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Artistas estão deixando o Instagram devido a preocupações com a possibilidade de inteligência artificial (IA) utilizar suas obras. Mudanças nos termos de serviço das plataformas da Meta estão gerando exclusão de perfis e protestos entre criadores independentes.", "titulo_pt": "Artistas estão desistindo do Instagram por medo de IA roubar suas obras", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 289587, "titulo": "A month with the iPhone Duo has changed how I use my phone", "url": "https://techcrunch.com/2026/11/26/a-month-with-the-iphone-duo-has-changed-how-i-use-my-phone/", "fonte_id": "techcrunch", "data_pub": "2026-11-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O uso de um iPhone dobrável durante um mês mudou as rotinas diárias do usuário, incluindo a leitura de livros e a quebra de hábitos de rolagem inconsciente.", "titulo_pt": "Um mês com o iphone dobrável alterou minhas rotinas diárias", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 289592, "titulo": "Federal judge blocks the FCC from reviewing ABC’s licenses early", "url": "https://www.theverge.com/policy/1043116/fcc-disney-abc-broadcast-licenses-review-early-judge-block", "fonte_id": "the_verge", "data_pub": "2026-11-26T16:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz federal dos Estados Unidos impôs uma injunção preliminar que bloqueia a Comissão Federal de Comunicações de realizar uma revisão antecipada dos licenciamentos de transmissão da ABC. O juiz rejeitou os esforços da FCC para descartar a ação judicial da ABC baseada na Primeira Emenda, que acusa a agência de violar seus direitos à liberdade de expressão e de ter conduzido uma 'campanha retaliatória' contra a emissora.", "titulo_pt": "Juiz federal bloqueia revisão antecipada de licenças de transmissão da ABC pela FCC", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 289588, "titulo": "As Anthropic IPOs, Grand Theft Auto VI proves why efficiency isn’t a virtue", "url": "https://techcrunch.com/2026/11/26/as-anthropic-ipos-grand-theft-auto-vi-proves-why-efficiency-isnt-a-virtue/", "fonte_id": "techcrunch", "data_pub": "2026-11-26T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthropic realizou sua oferta inicial de ações no mesmo dia em que Grand Theft Auto VI se tornou um dos lançamentos de entretenimento mais bem-sucedidos de todos os tempos.", "titulo_pt": "Oferta inicial de ações da Anthropic e o lançamento de Grand Theft Auto VI", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 289451, "titulo": "Bringing data to the Thanksgiving table", "url": "https://www.ft.com/content/1c91974e-8b52-4bd6-a9c3-fb42c1d02cf4?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-26T15:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo questiona se os Estados Unidos realmente enfrentam uma crise de acessibilidade à comida.", "titulo_pt": "Trazendo dados para a mesa do Thanksgiving", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 289427, "titulo": "Anthropic chief denies wanting humans to 'surrender' free will to AI", "url": "https://www.euronews.com/2026/11/26/anthropic-chief-denies-wanting-humans-to-surrender-free-will-to-ai", "fonte_id": "euronews", "data_pub": "2026-11-26T15:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dario Amodei, CEO da Anthropic, negou que a empresa deseje que os humanos cedam sua liberdade de escolha para os sistemas de inteligência artificial. Este debate surge em um momento em que se discute como manter a autonomia humana frente a sistemas de IA superinteligentes.", "titulo_pt": "Ceo da anthropic nega desejo de ceder liberdade humana para IA", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 288922, "titulo": "Identificar os erros da inteligência artificial exige esforço mental extra", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/identificar-os-erros-da-inteligencia-artificial-exige-esforco-mental-extra.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-26T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A utilização de assistentes de inteligência artificial frequentemente resulta em respostas imprecisas ou desatualizadas. Usuários precisam dedicar tempo adicional para verificar a precisão das informações fornecidas por esses sistemas, já que muitos problemas já foram encontrados.", "titulo_pt": "Identificar os erros da inteligência artificial exige esforço mental extra", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 288879, "titulo": "Regras americanas podem atrasar modelos de IA de empresas chinesas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/regras-americanas-podem-atrasar-modelos-de-ia-de-empresas-chinesas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-26T14:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa chinesa Z.AI está atrasada no lançamento de seu próximo modelo de inteligência artificial principal, enquanto a concorrente Moonshot AI pode dobrar o intervalo entre os lançamentos de seus modelos, passando de seis meses para um ano ou mais, caso perca o acesso à capacidade computacional no exterior.", "titulo_pt": "Regras americanas podem atrasar modelos de IA de empresas chinesas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 289053, "titulo": "Pesquisador da OpenAI usa GPT-6 Astra para propor teoria da gravidade quântica", "url": "https://exame.com/inteligencia-artificial/pesquisador-da-openai-usa-gpt-6-astra-para-propor-teoria-da-gravidade-quantica/", "fonte_id": "exame", "data_pub": "2026-11-26T14:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um pesquisador da OpenAI usou o GPT-6 Astra para propor uma teoria da gravidade quântica, abordando um dos maiores desafios da física. No entanto, a proposta matemática ainda precisa ser avaliada independentemente.", "titulo_pt": "Pesquisador da OpenAI usa GPT-6 Astra para propor teoria da gravidade quântica", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 289055, "titulo": "O problema da liderança é antigo. Suas competências também", "url": "https://exame.com/carreira/o-problema-da-lideranca-e-antigo-suas-competencias-tambem/", "fonte_id": "exame", "data_pub": "2026-11-26T14:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O afastamento de funcionários devido a problemas de saúde mental e sobrecarga de trabalho tem aumentado nas empresas. De acordo com Rogério Chér, é necessário que os líderes aprendam a gerir a capacidade das equipes, não apenas a cobrar resultados.", "titulo_pt": "O problema da liderança é antigo. Suas competências também", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 289566, "titulo": "The Download: Better bionic hands and AI’s natural-gas boom", "url": "https://www.technologyreview.com/2026/11/26/1149934/the-download-better-bionic-hands-ai-natural-gas-boom/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-26T13:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Avi Davidson, que perdeu a mão esquerda na adolescência, está testando a próxima geração de braços biónicos que oferecem sensação. Este é o tema do The Download, a newsletter diária sobre tecnologia.", "titulo_pt": "Download: próximos braços biónicos e a expansão do AI no gás natural", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 289572, "titulo": "Draining peatlands is responsible for a few percent of our global warming", "url": "https://arstechnica.com/science/2026/11/draining-peatlands-is-responsible-for-a-few-percent-of-our-global-warming/", "fonte_id": "ars_technica", "data_pub": "2026-11-26T12:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo detalhado que remonta ao ano de 1800 estima quantos quilogramas de carbono estão sendo liberados devido ao dessecamento de pântanos. Essa atividade é responsável por uma pequena porcentagem do aquecimento global.", "titulo_pt": "Dessecamento de pântanos é responsável por alguns porcentos do aquecimento global desde 1800", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 289573, "titulo": "From minimalist to maximalist: Ars staffers show off their home offices", "url": "https://arstechnica.com/features/2026/11/from-minimalist-to-maximalist-ars-staffers-show-off-their-home-offices/", "fonte_id": "ars_technica", "data_pub": "2026-11-26T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os escritórios de casa dos funcionários da Ars Tecnica variam de minimalistas a 'por favor, explique-se'.", "titulo_pt": "De minimalista a maximalista: funcionários da ars tecnica exibem seus escritórios de casa", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 289654, "titulo": "The ‘bare-knuckled’ future of life in space with Tim Marshall", "url": "https://spacenews.com/the-bare-knuckled-future-of-life-in-space-with-tim-marshall/", "fonte_id": "spacenews", "data_pub": "2026-11-26T17:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mike Gruss conversou com o jornalista e autor best-seller Tim Marshall sobre como a guerra na Ucrânia serviu como um despertar para a Europa e os Estados Unidos sobre o futuro da vida espacial.", "titulo_pt": "O 'luta-suja' futuro da vida no espaço com Tim Marshall", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 289085, "titulo": "Suplemento de ácido hialurônico pode reduzir marcadores de inflamação", "url": "https://www.metropoles.com/saude/suplemento-de-acido-hialuronico-pode-reduzir-marcadores-de-inflamacao", "fonte_id": "metropoles", "data_pub": "2026-11-26T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ensaio com 150 adultos saudáveis mostrou uma redução nos marcadores de inflamação após 12 semanas de suplementação diária com 120 mg de ácido hialurônico.", "titulo_pt": "Suplemento de ácido hialurônico pode diminuir marcadores de inflamação", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 289600, "titulo": "5G interference can alter high-impact weather forecasts", "url": "https://phys.org/news/2026-11-5g-high-impact-weather.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de pesquisadores dos estados norte-americanos de Nova Jersey e Maryland expressou preocupação sobre a possibilidade de interferências de redes 5G futuras afetarem as medições meteorológicas por satélite e potencialmente alterarem as previsões climáticas.", "titulo_pt": "Interferência de 5g pode alterar previsões meteorológicas de alto impacto", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 289601, "titulo": "Thailand tests find high lead, arsenic in river shellfish", "url": "https://phys.org/news/2026-11-thailand-high-arsenic-river-shellfish.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades tailandesas detectaram níveis perigosos de arsênico e chumbo em moluscos e outras espécies em rios contaminados por poluição supostamente proveniente de mineração na vizinha Birma.", "titulo_pt": "Testes na tailândia revelam altos níveis de arsênico e chumbo em caranguejos de rios", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 289686, "titulo": "Venus shines at its brightest in the predawn sky this week. Here's where to look", "url": "https://www.space.com/stargazing/venus-shines-at-its-brightest-in-the-predawn-sky-this-week-heres-where-to-look-nov-27-2026", "fonte_id": "space_com", "data_pub": "2026-11-26T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vênus atinge sua máxima brilhante no céu da madrugada esta semana. É possível observá-lo nesse período.", "titulo_pt": "Vênus brilha mais neste início de semana", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 289687, "titulo": "On this day in space! Nov. 26, 2011: NASA's 2-ton nuclear-powered Curiosity rover launches to Mars", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-26-2026", "fonte_id": "space_com", "data_pub": "2026-11-26T16:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 26 de novembro de 2011, a NASA lançou o rover Curiosity para Marte. Este evento foi significativo devido à sua missão nuclear e ao seu peso de 2 toneladas.", "titulo_pt": "Neste dia na space: 26 de novembro de 2011: nasa lança o rover nuclear 2 toneladas Curiosity para marte", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 289603, "titulo": "God-faced rings may have identified Mesoamerica's long-distance merchants", "url": "https://phys.org/news/2026-11-god-mesoamerica-distance-merchants.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 1.000 anos atrás, um mercador da Mesoamérica pode ter viajado por terras estrangeiras. Ao chegar ao destino, ele exibiu um anel com a face de um deus, mas qual era o propósito desse anel?", "titulo_pt": "Anéis com rosto de deus podem ter identificado mercadores da mesoamérica em viagens longas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 289604, "titulo": "Global maritime trade set for zero growth in 2026: UN", "url": "https://phys.org/news/2026-11-global-maritime-growth.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A marítima global de comércio, que transporta mais de 80% dos bens do mundo, deve estagnar em 2026 devido a interrupções de navegação e incertezas comerciais resultantes da guerra no Oriente Médio, conforme informou a ONU.", "titulo_pt": "Comércio marítimo global previsto para não crescer em 2026: ONU", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 289689, "titulo": "Rocket Lab sending Japanese satellite to orbit on Thanksgiving Day launch: Watch it live", "url": "https://www.space.com/space-exploration/launches-spacecraft/rocket-lab-sending-japanese-satellite-to-orbit-on-thanksgiving-day-launch-watch-it-live", "fonte_id": "space_com", "data_pub": "2026-11-26T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Rocket Lab lançará um satélite japonês no dia de Ação de Graças, sendo esta a 14ª missão para o cliente mais grande da empresa, a Synspective, sediada em Tóquio.", "titulo_pt": "Rocket Lab lança satélite japonês no dia de ação de graças: assista ao vivo", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 289148, "titulo": "Em áudio | Como novos vírus criados por IA podem mudar a ciência (apesar de causarem preocupação)", "url": "https://www.bbc.com/portuguese/listen/cwvg20pgg394o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-26T15:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas criaram 16 vírus sintéticos cujo código genético foi projetado por ferramentas de inteligência artificial. Essa inovação pode alterar a ciência, apesar das preocupações geradas.", "titulo_pt": "Como novos vírus criados por IA podem mudar a ciência (apesar de causarem preocupação)", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 289605, "titulo": "Protein redesign boosts DNA insertion activity and reveals how molecular machinery selects targets", "url": "https://phys.org/news/2026-11-protein-redesign-boosts-dna-insertion.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas da St. Jude Children's Research Hospital descobriram as mecanismos envolvidos na integração precisa do DNA em locais genômicos específicos usando CRISPR-associated transposases (CASTs). Essas descobertas oferecem insights sobre como essa família de CASTs realiza a integração de DNA com sucesso em locais de alvo precisos, o que pode auxiliar em futuros avanços na engenharia genômica.", "titulo_pt": "Redesenho de proteínas aumenta a atividade de inserção de DNA e revela como a maquinaria molecular seleciona alvos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 289606, "titulo": "Do all groups drift toward rule by the few? Not when time is on their side", "url": "https://phys.org/news/2026-11-groups-drift-side.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo sugere que, ao longo do século XX, Robert Michels propôs a ideia de que, com o passar do tempo, todas as grupos políticos tendem a ser dominados por uma minoria. Essa ideia, conhecida como lei de ferro da oligarquia, questiona o ideal democrático de igualdade de poder entre os grupos.", "titulo_pt": "Todas as agrupações se tornam dominadas por uma minoria com o tempo? Não necessariamente, segundo estudo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 289607, "titulo": "Learning facts out of interest may take less mental effort than learning them for money", "url": "https://phys.org/news/2026-11-facts-mental-effort-money.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As pessoas podem ser motivadas por motivos intrínsecos, quando fazem algo porque acham interessante, ou por motivos extrínsecos, quando o objetivo é obter uma recompensa, como dinheiro. O estudo sugere que aprender fatos por interesse pode exigir menos esforço mental do que aprender por recompensa.", "titulo_pt": "Aprender fatos por interesse pode exigir menos esforço mental do que por recompensa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 289690, "titulo": "Cosmic 'betta fish' glows in spectacular nebula portrait | Space photo of the day for Nov. 26, 2026", "url": "https://www.space.com/astronomy/cosmic-betta-fish-glows-in-spectacular-nebula-portrait-space-photo-of-the-day-for-nov-26-2026", "fonte_id": "space_com", "data_pub": "2026-11-26T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova imagem da Camera de Energia Escura capturou a vibrante cor azul da Nuvem de Peixe Betta, destacando-se em um novo retrato cósmico.", "titulo_pt": "Peixe betta brilha em impressionante retrato de nebulosa | imagem do dia do espaço para 26 de novembro de 2026", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 289608, "titulo": "Two mechanisms of amino acid transport in a rare disease-associated protein revealed", "url": "https://phys.org/news/2026-11-mechanisms-amino-acid-rare-disease.html", "fonte_id": "phys_org", "data_pub": "2026-11-26T14:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Células precisam trocar constantemente aminoácidos com o ambiente para produzir proteínas e suportar diversos processos corporais. Para isso, possuem transportadores especializados localizados em suas membranas.", "titulo_pt": "Dois mecanismos de transporte de aminoácidos em uma proteína associada a uma doença rara revelados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 289691, "titulo": "Prepare for Avengers: Doomsday and catch the entire MCU on Disney+ — now only $4.99/month", "url": "https://www.space.com/entertainment/space-movies-shows/prepare-for-avengers-doomsday-and-catch-the-entire-mcu-on
