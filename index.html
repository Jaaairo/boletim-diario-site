w1.folha.uol.com.br/mercado/2026/11/bitcoin-cai-para-o-menor-nivel-em-mais-de-dois-anos-com-derrocada-dos-mercados-globais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-21T16:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O bitcoin atingiu o nível mais baixo em mais de dois anos. A moeda digital passou de ser considerada uma 'queridinha' do mercado cripto para se tornar uma vítima da queda geral das apostas especulativas.", "titulo_pt": "Bitcoin cai para nível mais baixo em mais de dois anos com derrocada dos mercados globais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 279409, "titulo": "Anthropic’s record IPO collides with tech’s worst week on Wall Street since 2020", "url": "https://www.cnbc.com/2026/11/21/anthropic-ipo-tech-selloff.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-21T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anthropic realizou sua estreia histórica no Nasdaq um dia antes que a ação da Nvidia encerrasse sua pior semana na bolsa desde 2008, marcada por perdas contínuas.", "titulo_pt": "IPO histórico da anthropic enfrenta pior semana da tecnologia na Wall Street desde 2020", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 279432, "titulo": "Navy budget pick has family investments in Trump Jr-linked contractor", "url": "https://www.ft.com/content/145e6fab-d93a-412d-8670-0554064fdf98?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-21T16:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Congresso Democrata prometeu levantar questões sobre supostas conflitos de interesse envolvendo funcionários do governo quando assumirem o poder. Um indicado para o orçamento da Marinha tem investimentos familiares em uma empresa ligada ao filho de Donald Trump.", "titulo_pt": "Indicado para orçamento da marinha tem investimentos familiares em empresa ligada a Trump jr.", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 278995, "titulo": "União Europeia e Indonésia assinam acordo comercial após 10 anos de negociações", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/uniao-europeia-e-indonesia-assinam-acordo-comercial-apos-10-anos-de-negociacoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-21T16:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Europeia e a Indonésia assinaram dois acordos: um comercial e um de proteção de investimentos. Este acordo veio após dez anos de negociações.", "titulo_pt": "Ue e Indonésia assinam acordos comerciais após 10 anos de negociações", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 278996, "titulo": "Empresas não ocupam vagas para pessoas com deficiência, mesmo sobrando candidatos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/empresas-nao-ocupam-vagas-para-pessoas-com-deficiencia-mesmo-sobrando-candidatos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-21T16:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil tem 7,35 milhões de pessoas com deficiência em idade apta para trabalhar, mas apenas 57% das vagas exigidas pela Lei de Cotas estavam ocupadas até setembro. Isso equivale a sete vezes o mínimo de postos exigido, que é de 1,04 milhão.", "titulo_pt": "Empresas não preenchem vagas para pessoas com deficiência, mesmo com sobra de candidatos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 278997, "titulo": "Lula ataca 'yuppies da Faria Lima' e diz que mercado financeiro não vai ensiná-lo a governar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/lula-ataca-yuppies-da-faria-lima-e-diz-que-mercado-financeiro-nao-vai-ensina-lo-a-governar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-21T15:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula criticou o mercado financeiro e os 'yuppies da Faria Lima', afirmando que não se deixará influenciar por bancos e investidores na condução da política econômica de seu governo.", "titulo_pt": "Lula ataca 'yuppies da Faria Lima' e diz que mercado financeiro não vai ensiná-lo a governar", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 279150, "titulo": "UE propõe imposto de 3% sobre faturamento de big techs para financiar orçamento", "url": "https://veja.abril.com.br/economia/ue-propoe-imposto-de-3-sobre-faturamento-de-big-techs-para-financiar-orcamento/", "fonte_id": "veja", "data_pub": "2026-11-21T14:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Europeia propôs um imposto de 3% sobre o faturamento das grandes empresas de tecnologia, que incidirá sobre receitas de publicidade online, serviços de intermediação digital e dados de usuários entre 2028 e 2034.", "titulo_pt": "UE propõe imposto de 3% sobre faturamento de grandes empresas de tecnologia para financiar orçamento", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 279065, "titulo": "Vitória democrata eleva pressão regulatória sobre mercados de previsão nos EUA", "url": "https://exame.com/mundo/vitoria-democrata-eleva-pressao-regulatoria-sobre-mercados-de-previsao-nos-eua/", "fonte_id": "exame", "data_pub": "2026-11-21T14:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A vitória democrata nas eleições aumentou a pressão regulatória sobre os mercados de previsão nos Estados Unidos. Luana Lopes Lara deve comparecer a um tribunal em Utah em 4 de dezembro.", "titulo_pt": "Vitória democrata aumenta pressão regulatória sobre mercados de previsão nos EUA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 279066, "titulo": "França tem sexto sábado seguido de protestos contra o custo de vida", "url": "https://exame.com/mundo/franca-tem-sexto-sabado-seguido-de-protestos-contra-o-custo-de-vida/", "fonte_id": "exame", "data_pub": "2026-11-21T14:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A França está enfrentando seu sexto sábado consecutivo de protestos contra o aumento do custo de vida. Espanha, Portugal, Grécia e Alemanha também participaram de manifestações similares.", "titulo_pt": "França tem sexto sábado seguido de protestos contra o custo de vida", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 279561, "titulo": "Elon Musk revisits Tesla Shanghai factory after 3 years, praises China manufacturing", "url": "https://www.digitimes.com/news/a20261120PD247/tesla-shanghai-elon-musk-manufacturing-ceo.html", "fonte_id": "digitimes", "data_pub": "2026-11-21T14:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Tesla, Elon Musk, realizou uma breve visita de 24 horas à China em 19 de novembro, após concluir atividades relacionadas às reuniões APEC em Shenzhen. Musk visitou a fábrica de Shanghai Gigafactory e elogiou as capacidades de fabricação e execução da equipe asiática-pacífica e chinesa, sem fornecer atualizações sobre o cronograma para expandir o acesso ao Full Self-Driving (FSD) no país.", "titulo_pt": "Elon Musk retorna à fábrica de Shanghai gigafactory após 3 anos e elogia capacidades de fabricação chinesas", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 279493, "titulo": "Indonesia, EU sign ‘ambitious’ trade deal", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3375341/indonesia-eu-sign-ambitious-trade-deal", "fonte_id": "scmp", "data_pub": "2026-11-21T13:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia e a Indonésia assinaram oficialmente um acordo comercial em Bruxelas no sábado, abrindo seus mercados e estabelecendo um acordo projetado para aumentar as exportações da União Europeia para a maior economia da ASEAN em quase 40% nos próximos 15 anos. O acordo, considerado um dos mais ambiciosos, foi assinado por Ursula von der Leyen, chefe da União Europeia, e Airlangga Hartarto, ministro do Planejamento e Investimentos da Indonésia.", "titulo_pt": "Ue e indonésia assinam acordo comercial ambicioso", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 279411, "titulo": "State and federal battle over prediction markets regulation heats up after midterms", "url": "https://www.cnbc.com/2026/11/21/prediction-market-regulation-kalshi-cftc.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-21T13:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A disputa entre estados, Congresso e CFTC sobre a regulamentação de mercados de previsão está intensificando após as eleições de meados de mandato.", "titulo_pt": "Conflito sobre regulamentação de mercados de previsão aquece após as eleições de meios de mandato", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 279174, "titulo": "Como montar um PC completo para rodar modelos de IA localmente", "url": "https://canaltech.com.br/hardware/como-montar-pc-para-rodar-ia-localmente/", "fonte_id": "canaltech", "data_pub": "2026-11-21T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rodar modelos de inteligência artificial diretamente em um PC pessoal se tornou uma realidade, não sendo mais uma curiosidade experimental. Para montar uma máquina dedicada à IA local em 2026, a configuração do hardware deve priorizar a capacidade de memória e largura de banda, especialmente da memória de vídeo, diferentemente do foco em altas taxas de quadros em PCs gamers.", "titulo_pt": "Como montar um PC completo para rodar modelos de IA localmente", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 279525, "titulo": "The FBI and USDA were reportedly hacked", "url": "https://www.theverge.com/tech/1039543/fbi-usda-hacked", "fonte_id": "the_verge", "data_pub": "2026-11-21T17:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foi relatado que tanto o USDA (Departamento de Agricultura dos EUA) quanto o FBI foram hackeados. Este é o segundo ataque ao FBI nos últimos meses, desta vez contra o NCIC (National Crime Information Center), uma base de dados usada por órgãos de segurança federal, estadual e local.", "titulo_pt": "FBI e USDA seriam vítimas de hackers", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 279164, "titulo": "Anthropic e o paradoxo do IPO bilionário", "url": "https://olhardigital.com.br/2026/11/21/pro/anthropic-e-o-paradoxo-do-ipo-bilionario/", "fonte_id": "olhar_digital", "data_pub": "2026-11-21T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A maior oferta pública inicial (IPO) da história movimentou US$ 93,5 bilhões, mas as ações da Anthropic caíram após a estreia na bolsa, refletindo a cautela dos investidores com empresas de inteligência artificial.", "titulo_pt": "Anthropic e o paradoxo do IPO bilionário", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 279435, "titulo": "Amazon closes in on $7.5bn deal to buy AI start-up Decart", "url": "https://www.ft.com/content/dc7749dc-0f40-44a6-80bc-7f747d383616?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-21T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Amazon está perto de fechar um acordo de aquisição de uma start-up de inteligência artificial por cerca de 7,5 bilhões de dólares. A aquisição ajudaria o AWS a competir com a Nvidia na corrida pela potência de processamento computacional.", "titulo_pt": "Amazon encerra acordo por 7,5 bi para adquirir start-up de IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 279176, "titulo": "8 melhores adaptações de games lançadas em 2026", "url": "https://canaltech.com.br/entretenimento/melhores-adaptacoes-games-lancadas-2026/", "fonte_id": "canaltech", "data_pub": "2026-11-21T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A organização do The Game Awards 2026 anunciou os indicados para a premiação, incluindo um prêmio para a melhor adaptação de videogame lançada nos últimos doze meses. Em 2026, 17 adaptações de jogos foram lançadas, incluindo filmes e séries.", "titulo_pt": "8 Melhores adaptações de games lançadas em 2026", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 279430, "titulo": "Alice Huang’s links to the chip underworld", "url": "https://www.ft.com/content/f3ad8a81-3890-4a8a-8853-ff0a94b08ba9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-21T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alice Huang, uma executiva chinesa, estava em um relacionamento romântico com Jensen Huang, ex-CEO da Nvidia. Ela teve ligações com o lucrativo comércio de chips que enviava componentes para a China.", "titulo_pt": "Relação romântica entre executiva chinesa e ex-ceo da nvidia envolvida com comércio de chips para china", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 279165, "titulo": "Países não chegam a acordo na ONU sobre armas autônomas", "url": "https://olhardigital.com.br/2026/11/21/robotica/paises-nao-chegam-a-acordo-na-onu-sobre-armas-autonomas/", "fonte_id": "olhar_digital", "data_pub": "2026-11-21T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Países não chegaram a um consenso na ONU sobre o início das negociações para regulamentar armas autônomas que selecionam e atacam alvos sem intervenção humana. A reunião em Genebra terminou sem um acordo.", "titulo_pt": "Países não chegam a acordo na ONU sobre armas autônomas", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 279178, "titulo": "É verdade que furar sinal vermelho de madrugada não dá multa?", "url": "https://canaltech.com.br/carros/e-verdade-que-furar-sinal-vermelho-de-madrugada-nao-da-multa/", "fonte_id": "canaltech", "data_pub": "2026-11-21T16:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Avançar o sinal vermelho, mesmo durante a madrugada, é proibido e resulta em multa de acordo com o Código de Trânsito Brasileiro. A prática, embora comum em certas circunstâncias, não está isenta de penalidades.", "titulo_pt": "É verdade que furar sinal vermelho de madrugada não dá multa?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 279166, "titulo": "SpaceX vai aposentar primeira Starship capturada por braços mecânicos", "url": "https://olhardigital.com.br/2026/11/21/ciencia-e-espaco/spacex-vai-aposentar-primeira-starship-capturada-por-bracos-mecanicos/", "fonte_id": "olhar_digital", "data_pub": "2026-11-21T15:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SpaceX não planeja reutilizar a Starship Ship 42, a primeira Starship capturada por braços mecânicos, e pretende manter a nave para exposição pública.", "titulo_pt": "Spacex vai aposentar primeira Starship capturada por braços mecânicos", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 279535, "titulo": "Alaska, your next governor is a Wikipedia nerd", "url": "https://techcrunch.com/2026/11/21/alaska-your-next-governor-is-a-wikipedia-nerd/", "fonte_id": "techcrunch", "data_pub": "2026-11-21T15:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jonathan Kreiss-Tomkins, o governador eleito do Alaska, fez mais de 13.000 edições no Wikipedia.", "titulo_pt": "Alaska, seu próximo governador é um nerd do Wikipedia", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 279167, "titulo": "União Europeia propõe imposto de 3% sobre receitas de big techs", "url": "https://olhardigital.com.br/2026/11/21/pro/uniao-europeia-propoe-imposto-de-3-sobre-receitas-de-big-techs/", "fonte_id": "olhar_digital", "data_pub": "2026-11-21T14:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Europeia propôs um imposto anual de 3% sobre as receitas digitais de grandes empresas para financiar o orçamento entre 2028 e 2034.", "titulo_pt": "União Europeia propõe imposto de 3% sobre receitas de big techs", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 279168, "titulo": "Voyager 1 e os 350 anos da velocidade da luz", "url": "https://olhardigital.com.br/2026/11/21/colunistas/voyager-1-e-os-350-anos-da-velocidade-da-luz/", "fonte_id": "olhar_digital", "data_pub": "2026-11-21T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Voyager 1 atingiu a distância de um dia-luz da Terra, um marco histórico em sua jornada pelo espaço. A espaçonave, lançada nos anos 70, levou quase 50 anos para percorrer essa distância.", "titulo_pt": "Voyager 1 e os 350 anos da velocidade da luz", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 279181, "titulo": "Como assistir ao Youtube sem anúncios? Veja truque na URL", "url": "https://canaltech.com.br/apps/truque-da-url-para-assistir-youtube-sem-anuncios/", "fonte_id": "canaltech", "data_pub": "2026-11-21T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Existem anúncios em vídeos do YouTube, mas há uma alternativa: usar o site youtube-nocookie.com. Este site permite assistir aos vídeos sem anúncios, sem a necessidade de assinar o YouTube Premium.", "titulo_pt": "Como assistir ao Youtube sem anúncios? Veja truque na URL", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 279183, "titulo": "Governança de IA: 5 que falhas podem comprometer adoção da tecnologia em empresas", "url": "https://canaltech.com.br/inteligencia-artificial/governanca-de-ia-5-que-falhas-podem-comprometer-adocao-da-tecnologia-em-empresas/", "fonte_id": "canaltech", "data_pub": "2026-11-21T13:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial já está presente nas operações de muitas empresas, mas a governança de IA é essencial para garantir que a adoção da tecnologia seja segura, coordenada e alinhada aos objetivos do negócio. Este processo passa a ser uma preocupação não apenas da área de tecnologia, mas de toda a organização.", "titulo_pt": "Governança de IA: 5 falhas que podem comprometer a adoção da tecnologia em empresas", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 279537, "titulo": "The Outages Are Just Getting Started", "url": "https://www.wired.com/story/brace-yourself-for-years-of-outage-chaos/", "fonte_id": "wired", "data_pub": "2026-11-21T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial está impulsionando as empresas a corrigirem seus sistemas mais rapidamente, já que os atacantes buscam explorar vulnerabilidades recentemente descobertas. Bem-vindo ao inferno das interrupções de internet.", "titulo_pt": "Os apagões estão só começando", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 279381, "titulo": "Anthropic: The ever more dizzying gamble of AI", "url": "https://www.lemonde.fr/en/opinion/article/2026/11/21/anthropic-the-ever-more-dizzying-gamble-of-ai_6786133_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-21T12:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estreia impressionante na bolsa de valores da empresa por trás do assistente de IA Claude foi seguida pela queda abrupta do preço das ações no dia seguinte, refletindo tanto o potencial imenso quanto as dúvidas persistentes sobre o modelo de negócios da inteligência artificial. A implementação da IA dependerá da aceitação social à medida que a oposição ao crescimento dos centros de dados aumenta.", "titulo_pt": "Anthropic: a aposta cada vez mais desequilibrada da IA", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 279514, "titulo": "FEATURE: Farmer revives climate-resilient oil millet", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/22/2003868185", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um agricultor está revitalizando o cultivo de milheto de óleo, uma cultura resistente ao clima. Este cultivo pode oferecer uma alternativa sustentável para alimentos e óleos vegetais.", "titulo_pt": "Agricultor revive cultivo de milheto de óleo resistente ao clima", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 279092, "titulo": "Réptil de 156 milhões de anos com 'chifres' é encontrado nos EUA", "url": "https://www.metropoles.com/ciencia/reptil-de-156-milhoes-de-anos-com-chifres-e-encontrado-nos-eua", "fonte_id": "metropoles", "data_pub": "2026-11-21T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tomografias revelaram uma nova espécie de réptil com chifres nos Estados Unidos. O animal, com 45 cm de comprimento, recebeu o nome em homenagem ao death metal.", "titulo_pt": "Novo réptil de 156 milhões de anos com 'chifres' é encontrado nos EUA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 279587, "titulo": "On this day in space! Nov. 21, 1676: Danish astronomer discovers speed of light — by accident — while observing Jupiter's moon Io", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-21-2026", "fonte_id": "space_com", "data_pub": "2026-11-21T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 21 de novembro de 1676, o astrônomo dinamarquês Ole Rømer descobriu a velocidade da luz ao observar a lua de Júpiter Io. Este achado ocorreu por acaso durante seus estudos astronômicos.", "titulo_pt": "21 De novembro de 1676: astrônomo dinamarquês descobre a velocidade da luz — por acaso — ao observar a lua de júpiter Io", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 279548, "titulo": "Babies in ancient Greek colony started solid food at 3 months but nursed for nearly 4 years, chemical signatures suggest", "url": "https://phys.org/news/2026-11-babies-ancient-greek-colony-solid.html", "fonte_id": "phys_org", "data_pub": "2026-11-21T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Himera, uma colônia grega habitada por sicilianos locais, fenícios e gregos há mais de 2.500 anos, começou a amamentar seus bebês com sólidos aos três meses, mas continuou por quase 4 anos, independentemente de suas diferentes origens culturais.", "titulo_pt": "Bebês na colônia grega antiga de himera começaram a alimentação sólida aos 3 meses, mas amamentaram por quase 4 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 279552, "titulo": "AI may not work like the human brain after all, scientists discover", "url": "https://www.sciencedaily.com/releases/2026/11/261120075701.htm", "fonte_id": "science_daily", "data_pub": "2026-11-21T15:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram que a inteligência artificial pode não pensar como o cérebro humano, mesmo que modelos de IA prevejam atividade cerebral de forma semelhante. Essa descoberta questiona a confiabilidade dessas modelos na pesquisa neurociêntifica.", "titulo_pt": "A inteligência artificial pode não pensar como o cérebro humano, revela nova descoberta", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 279588, "titulo": "This Week In Space podcast: Episode 237 — A Fond Farewell", "url": "https://www.space.com/entertainment/space-movies-shows/this-week-in-space-podcast-episode-237-a-fond-farewell", "fonte_id": "space_com", "data_pub": "2026-11-21T15:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Neste episódio do Podcast This Week In Space, Tariq Malik e Rod Pyle se despedem temporariamente, abordando notícias espaciais, piadas espaciais e uma recapitulação de alguns dos momentos mais engraçados do programa.", "titulo_pt": "Episódio 237 do podcast this Week In Space: uma saudade sentida", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 279553, "titulo": "Time may be far stranger than we realize. Scientists have a way to test it", "url": "https://www.sciencedaily.com/releases/2026/11/261120075558.htm", "fonte_id": "science_daily", "data_pub": "2026-11-21T15:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores propuseram um método para detectar relógios experimentando múltiplas fluxos de tempo simultaneamente, utilizando relógios atômicos com sensibilidade aprimorada. Este teste poderia revelar um efeito quântico nunca observado, alterando nossa compreensão do tempo e da gravidade.", "titulo_pt": "O tempo pode ser muito mais estranho do que imaginamos. Cientistas propõem um jeito de detectar múltiplos fluxos de tempo simultaneamente", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 279007, "titulo": "Trabalhadores fizeram greve há mais de 3.000 anos no Egito antigo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/trabalhadores-fizeram-greve-ha-mais-de-3000-anos-no-egito-antigo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-21T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Durante o reinado de Ramsés 3º, entre 1184 a 1153 a.C., os trabalhadores responsáveis pela construção dos túmulos reais realizaram uma greve devido à instabilidade política e econômica no Egito antigo. Este episódio ilustra as dificuldades enfrentadas durante esse período.", "titulo_pt": "Trabalhadores fizeram greve há mais de 3.000 anos no Egito antigo", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 279379, "titulo": "The likely solution to the Riemann hypothesis by AI marks a turning point for mathematics", "url": "https://www.lemonde.fr/en/science/article/2026/11/21/the-likely-solution-to-the-riemann-hypothesis-by-ai-marks-a-turning-point-for-mathematics_6786232_10.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-21T14:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um matemático da Anthropic, Levent Alpöge, em colaboração com o assistente de inteligência artificial Claude da empresa, alega ter resolvido uma das conjecturas mais famosas da matemática. A hipótese de Riemann, proposta em 1859 por Bernhard Riemann, permite que os matemáticos caracterizem o comportamento dos números primos.", "titulo_pt": "Solução provável para a hipótese de Riemann por IA marca ponto de virada para a matemática", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 279554, "titulo": "A giant star swallowed another star. James Webb reveals the aftermath", "url": "https://www.sciencedaily.com/releases/2026/11/261120075556.htm", "fonte_id": "science_daily", "data_pub": "2026-11-21T14:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos observaram uma colisão cósmica no galáxia da Andrômeda, onde uma pequena estrela se aproximou de uma gigante 18.000 vezes mais brilhante do que o Sol, causando uma erupção violenta. O telescópio espacial James Webb da NASA capturou a cena 47 dias após o evento, revelando detalhes sobre a fusão de duas estrelas em uma única.", "titulo_pt": "Uma estrela gigante engoliu outra estrela. O james Webb registra os efeitos", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 279556, "titulo": "Who was buried in Westminster Abbey's Roman coffin? A 150-year mystery may be solved", "url": "https://www.sciencedaily.com/releases/2026/11/261119194553.htm", "fonte_id": "science_daily", "data_pub": "2026-11-21T14:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um esqueleto encontrado em uma sarcófago romano na Abadia de Westminster pode ser identificado após mais de 150 anos. Novas evidências de datação sugerem que os restos mortais pertencem a um abade medieval de alta posição que foi enterrado dentro de um antigo sarcófago romano reciclado há séculos.", "titulo_pt": "Quem foi enterrado no sarcófago romano da abadia de Westminster? Mistério de 150 anos pode ser resolvido", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 279558, "titulo": "A 50-year-old theory about evolution may have been wrong all along", "url": "https://www.sciencedaily.com/releases/2026/11/261119194538.htm", "fonte_id": "science_daily", "data_pub": "2026-11-21T14:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma análise extensa de mutações em bactérias e levaduras não encontrou evidências de que os genes essenciais mutam com menor frequência do que outros genes. Isso desafia uma teoria de 50 anos que sugeriu que a evolução protege seus genes mais importantes de mutações.", "titulo_pt": "Teoria de 50 anos sobre evolução pode ter estado errada", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 279549, "titulo": "An ancient failed rift is reawakening inside one of Africa's oldest landmasses", "url": "https://phys.org/news/2026-11-ancient-rift-reawakening-africa-oldest.html", "fonte_id": "phys_org", "data_pub": "2026-11-21T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em abril de 2017, um terremoto de magnitude 6,5 atingiu a região central do Kalahari Craton, em Botswana. Este craton é uma das partes mais antigas da África, com blocos de crosta que datam de até 3,7 bilhões de anos. Geólogos consideram que regiões tão antigas são muito frias, grossas e rígidas para se romperem.", "titulo_pt": "Um antigo rachadura fracassada está se reanimando em um dos mais antigos territórios da áfrica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 279559, "titulo": "Scientists say the human family tree may need a radical rewrite", "url": "https://www.sciencedaily.com/releases/2026/11/261118074039.htm", "fonte_id": "science_daily", "data_pub": "2026-11-21T13:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos estudos da Monash University sugerem que a árvore genealógica humana pode precisar de uma reescrita radical. A pesquisa propõe que espécies como Australopithecus e Paranthropus sejam reclassificadas no gênero Homo, desafiando a classificação tradicional dos antepassados humanos.", "titulo_pt": "Ciêntistas sugerem reescrita radical da árvore genealógica humana", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 279550, "titulo": "Fermi's 14-year all-sky map bridges astronomy's elusive 'MeV gap'", "url": "https://phys.org/news/2026-11-fermi-year-sky-bridges-astronomy.html", "fonte_id": "phys_org", "data_pub": "2026-11-21T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo, publicado na The Astrophysical Journal Supplement Series, identificou 450 fontes cósmicas no espectro de 20 a 200 MeV usando o Telescópio de Área Grande da Missão Fermi, ajudando a preencher o que era conhecido como 'MeV gap' na astronomia. Este trabalho fornece a visão mais clara de raios gama de baixa energia já obtida.", "titulo_pt": "Mapa do céu de 14 anos do fermi preenche 'buraco de MeV' na astronomia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 279590, "titulo": "SpaceX will retire 1st Starship upper stage ever caught by 'chopsticks,' Elon Musk says", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-will-retire-1st-starship-upper-stage-ever-caught-by-chopsticks-elon-musk-says", "fonte_id": "space_com", "data_pub": "2026-11-21T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira etapa superior do Starship que SpaceX conseguiu recuperar com sucesso não vai voar novamente. Em vez disso, ela será exposta como um objeto de museu, conforme informado pelo fundador e CEO da empresa, Elon Musk.", "titulo_pt": "Spacex vai retirar a primeira etapa superior do Starship recuperada, Elon Musk diz", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 279517, "titulo": "Veteran Taiwanese poet Xiang Ming dies, leaving literary legacy", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/22/2003868188", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O poeta taiwanês de longa data Xiang Ming faleceu, deixando uma herança literária. Ele era conhecido por suas contribuições na literatura taiwanesa.", "titulo_pt": "Poeta taiwanês Xiang Ming falece, deixando herança literária", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 279239, "titulo": "Kidd Voodoo se convierte en el primer chileno en ganar en Los40 Music Awards", "url": "https://www.latercera.com/culto/noticia/kidd-voodoo-se-convierte-en-el-primer-chileno-en-ganar-en-los40-music-awards/", "fonte_id": "la_tercera", "data_pub": "2026-11-21T17:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artista chileno Kidd Voodoo ganhou o prêmio de 'Melhor Artista ou Grupo Revelação de la Categoría Global Latina' nos Los40 Music Awards. Ele afirmou sentir-se honrado, pois é o primeiro chileno a vencer este prêmio.", "titulo_pt": "Kidd Voodoo se torna o primeiro chileno a ganhar nos Los40 Music Awards", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 279265, "titulo": "Condecoraron en la embajada de Francia a las científicas argentinas Alicia Dickenstein y Denise Sciammarella", "url": "https://www.lanacion.com.ar/cultura/condecoraron-en-la-embajada-de-francia-a-las-cientificas-argentinas-alicia-dickenstein-y-denise-nid21112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-21T17:27:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Alicia Dickenstein e Denise Sciammarella receberam condecorações na embaixada francesa. O embajador Romain Nadal destacou-as como exemplo para jovens que se interessam pela ciência.", "titulo_pt": "Cientistas argentinas são condecoradas na embaixada francesa", "veiculo": "La Na __eventos": [], "meio_ambiente": [{"id": 279503, "titulo": "Temperatures could drop to 11°C in low areas: CWA", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/22/2003868168", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A previsão indica que as temperaturas podem baixar para 11°C em áreas baixas. Essa informação foi fornecida pelo CWA (Centro Weather Administration).", "titulo_pt": "Temperaturas podem cair para 11°C em baixas áreas: CWA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 279201, "titulo": "Un británico cruza Ormuz a nado para alertar del impacto ambiental de la guerra", "url": "https://www.clarin.com/estados-unidos/un-britanico-cruza-ormuz-a-nado-para-alertar-del-impacto-ambiental-de-la-guerra_0_uYofTPg1oo.html", "fonte_id": "clarin", "data_pub": "2026-11-21T17:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um nadador britânico de 56 anos percorreu o Estreito de Ormuz em três dias para chamar a atenção para o impacto ambiental causado pelo conflito entre Irã e Estados Unidos. Ele enfatizou a beleza natural do local e pediu para que as hostilidades parassem e a contaminação fosse limpa para preservar o ecossistema.", "titulo_pt": "Um britânico nageia o estreito de Ormuz para alertar sobre o impacto ambiental da guerra", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 279380, "titulo": "French protesters rally for sixth weekend over living costs, public services, inequality", "url": "https://www.lemonde.fr/en/france/article/2026/11/21/french-protesters-rally-for-sixth-weekend-over-living-costs-public-services-inequality_6786265_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-21T15:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os protestos na França continuaram por uma sexta semana consecutiva, iniciados por estudantes em setembro, contra aumentos de preços, serviços públicos insuficientes e violência policial.", "titulo_pt": "Protestos franceses por sexta semana seguida contra custos de vida, serviços públicos e violência policial", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 279190, "titulo": "COP31 avança além do prazo e segue sem consenso sobre combustíveis fósseis", "url": "https://www.dw.com/pt-br/cop31-avança-além-do-prazo-e-segue-sem-consenso-sobre-combustíveis-fósseis/a-80010347?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-21T15:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As delegações continuam sem chegar a um consenso após o prazo oficial, e divergências sobre recursos para adaptação climática e a linguagem do texto final aumentam o risco de fracasso das negociações. O COP31 avança além do prazo oficial e segue sem consenso sobre combustíveis fósseis.", "titulo_pt": "COP31 avança além do prazo e segue sem consenso sobre combustíveis fósseis", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 279253, "titulo": "Armada advierte aumento de marejadas durante la temporada estival por fenómeno de El Niño", "url": "https://www.latercera.com/nacional/noticia/armada-advierte-aumento-de-marejadas-durante-la-temporada-estival-por-fenomeno-de-el-nino/", "fonte_id": "la_tercera", "data_pub": "2026-11-21T15:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A marinha advertiu que haverá um aumento significativo das marés durante a estação veraniega devido ao fenômeno El Niño. As marejadas podem começar a se intensificar desde novembro, não apenas a partir do dia 15 de dezembro.", "titulo_pt": "Marinha avisa sobre aumento de marejadas durante a estação veraniega devido ao fenômeno El Niño", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 278702, "titulo": "China commits to low-carbon electrification and help for others to improve", "url": "https://www.theguardian.com/environment/2026/nov/21/china-commits-low-carbon-electrification-help-others-improve", "fonte_id": "guardian_world", "data_pub": "2026-11-21T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China está incentivando a electrificação rápida de sua economia através de fontes de energia de baixo carbono e prometendo ajudar outros países a fazerem o mesmo. Isso foi dito por um membro sênior da delegação chinesa no Cop31, um evento da ONU sobre clima.", "titulo_pt": "China se compromete com eletrificação de baixo carbono e assistência a outros países", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 278603, "titulo": "La cumbre ambiental COP31 y las diferencias entre Brasil y Argentina", "url": "https://www.clarin.com/rural/cumbre-ambiental-cop31-diferencias-brasil-argentina_0_asZHbwqT4A.html", "fonte_id": "clarin", "data_pub": "2026-11-21T09:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Lula destacou as ações já implementadas, como a adoção de uma gasolina com 30% de etanol a partir de agosto de 2025. A demora na atualização da legislação no Brasil resulta em prejuízos para a sociedade, afetando investimentos e a mitigação de problemas de saúde e meio ambiente.", "titulo_pt": "COP31 e as diferenças entre Brasil e Argentina", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 278799, "titulo": "Fossil fuel row sees COP31 talks spill into overtime", "url": "https://www.euronews.com/2026/11/21/fossil-fuel-row-sees-cop31-talks-spill-into-overtime", "fonte_id": "euronews", "data_pub": "2026-11-21T08:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias nações, incluindo França e Panamá, enviaram uma carta na sexta-feira, reiterando a necessidade de um acordo que inclua uma transição clara e firme das energias fósseis.", "titulo_pt": "Disputa sobre combustíveis fósseis faz COP31 estender os debates", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 278511, "titulo": "El Niño em SP: até quando paulistas devem sentir os efeitos do fenômeno?", "url": "https://www.metropoles.com/sao-paulo/el-nino-em-sp-ate-quando-paulistas-devem-sentir-os-efeitos-do-fenomeno", "fonte_id": "metropoles", "data_pub": "2026-11-21T05:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas explicam os efeitos do El Niño em todo o estado de São Paulo e fornecem previsões para os próximos meses. O fenômeno está afetando diversas regiões do estado e as previsões indicam que os efeitos podem se manter por algum tempo.", "titulo_pt": "El Niño em SP: até quando os paulistas devem sentir os efeitos do fenômeno?", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 278771, "titulo": "California's coastal cities battered by rising sea levels and vanishing beaches", "url": "https://www.lemonde.fr/en/international/article/2026/11/21/california-s-coastal-cities-battered-by-rising-sea-levels-and-vanishing-beaches_6785837_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-21T03:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cidades costeiras da Califórnia do Sul enfrentam danos devido a níveis de mar elevados e praias que desaparecem. Em um ano marcado por uma El Niño particularmente poderosa, residências danificadas, inundações, deslizamentos de terra e estradas fechadas são comuns.", "titulo_pt": "Cidades costeiras da califórnia do sul atingidas por níveis de mar elevados e praias que desaparecem", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 279522, "titulo": "Asian American women face fallout of Nvidia affair scandal", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/22/2003868154", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As asiáticas americanas enfrentam consequências do escândalo envolvendo a Nvidia. O incidente tem afetado a comunidade a a foto que mostrava mulheres e crianças dentro de uma prisão feminina. Ele decidiu explorar essa realidade pouco conhecida ao criar a obra 'Inherited'.", "titulo_pt": "Uma iraniana grávida para evitar execução em 'Inherited': situação no Irã se torna 'cada vez mais complexa'", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 278667, "titulo": "Avanza el ICE en Texas: un nuevo condado firmó un acuerdo de colaboración con la agencia migratoria", "url": "https://www.lanacion.com.ar/estados-unidos/texas/avanza-el-ice-en-texas-un-nuevo-condado-firmo-un-acuerdo-de-colaboracion-con-la-agencia-migratoria-nid20112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-21T09:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O condado de Travis, no Texas, assinou um acordo com o ICE, permitindo que um oficial carcelário execute ordens migratórias civis dentro da prisão. Mais um condado se juntou à colaboração com a agência de imigração.", "titulo_pt": "Avanço do ICE no Texas: novo condado firma acordo de colaboração com a agência migratória", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 278496, "titulo": "O Brasil racista", "url": "https://www.metropoles.com/blog-do-noblat/enquetes/o-brasil-racista", "fonte_id": "metropoles", "data_pub": "2026-11-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A enquete discute o tema do racismo no Brasil. O título original 'O Brasil racista' sugere que o questionário aborda questões relacionadas à discriminação racial no país.", "titulo_pt": "O Brasil racista", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 278888, "titulo": "French Senate approves police shootings law dubbed ‘licence to kill’ by critics", "url": "https://www.scmp.com/news/world/europe/article/3375320/french-senate-approves-police-shootings-law-dubbed-licence-kill-critics", "fonte_id": "scmp", "data_pub": "2026-11-21T06:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Senado francês aprovou uma lei que presume que policiais que usam armas estão agindo legalmente, com votos de 205 a 110. A proposta, que foi criticada por parlamentares de esquerda, concede aos policiais um benefício de dúvida no caso de mortes por disparos, a menos que haja provas contrárias.", "titulo_pt": "Senado francês aprova lei que presume legalidade de disparos policiais, chamada de 'licença para matar' pelos críticos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 278832, "titulo": "Three French police officers sentenced over racist assault on Black man", "url": "https://www.aljazeera.com/news/2026/11/21/three-french-police-officers-sentenced-over-racist-assault-on-black-man?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-21T03:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três policiais franceses foram condenados por um ataque racista contra o produtor musical Michel Zecler em 2020. O tribunal criminal de Paris considerou que o racismo foi um fator agravante no caso.", "titulo_pt": "Três policiais franceses condenados por ataque racista a produtor musical", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 278774, "titulo": "La Suprema desmantela la “doctrina Rabat”", "url": "https://www.ciperchile.cl/2026/11/20/la-suprema-desmantela-la-doctrina-rabat/?utm_source=rss&utm_medium=rss&utm_campaign=la-suprema-desmantela-la-doctrina-rabat", "fonte_id": "ciper_chile", "data_pub": "2026-11-21T02:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte desmontou a 'doctrina Rabat'. O título original foi publicado inicialmente no CIPER Chile.", "titulo_pt": "A Suprema desmonta a 'doctrina Rabat'", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 278767, "titulo": "Police beating of Black music producer: Court recognizes racist nature of violence, sentences officers to prison, raising hopes for new legal precedent", "url": "https://www.lemonde.fr/en/france/article/2026/11/21/police-beating-of-black-music-producer-court-recognizes-racist-nature-of-violence-sentences-officers-to-prison-raising-hopes-for-new-legal-precedent_6785803_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-21T01:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um produtor musical negro foi agredido pela polícia em 2020, fora de seu estúdio de música, e os policiais relataram posteriormente que ele os atacou. Entretanto, a gravação de segurança contradiz essa versão dos fatos.", "titulo_pt": "Agressão policial contra produtor musical negro: tribunal reconhece natureza racista da violência, sentenciando policiais a prisão", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 278862, "titulo": "Myanmar genocide judgment may bolster Gaza case against Israel", "url": "https://www.japantimes.co.jp/news/2026/11/21/world/crime-legal/myanmar-ruling-bolster-gaza-case/", "fonte_id": "japan_times", "data_pub": "2026-11-21T01:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O julgamento que estabeleceu que intenção genocida pode coexistir com um objetivo militar pode fortalecer o caso de Gaza contra Israel. Especialistas em direito acreditam que esse julgamento estabelece um precedente importante.", "titulo_pt": "Julgamento sobre genocídio pode fortalecer caso de Gaza contra Israel", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 279501, "fonte_id": "taipei_times", "titulo": "FSC announces measures after stock market losses", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/22/2003868166", "data_pub": "2026-11-22T00:00:00Z", "topico": "economia", "idioma": "en", "titulo_pt": "FSC anuncia medidas após perdas no mercado de ações", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 279502, "fonte_id": "taipei_times", "titulo": "COP31 const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
