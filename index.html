<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "03/11/2026 19:22", "stats": {"noticias_novas": 647, "resumos_gerados": 235}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O quarto governo de Lula busca reinventar a democracia brasileira, conforme afirmam os especialistas. O presidente Luiz Inácio Lula da Silva viajará a São Paulo para realizar exames de rotina, sob a supervisão de médicos especializados. Durante esse período, o Senado está debatendo a Proposta de Emenda à Constituição (PEC) que trata da Segurança Pública. Embora possa ser votada hoje, a sessão foi adiada devido a um impasse sobre a redução da maioridade penal. Além disso, a Assembleia Legislativa de São Paulo (Alesp) terá 40 novos deputados em sua próxima legislatura, que se estenderá de 2027 a 2031, o que deve intensificar as tensões ideológicas. O ministro Luiz Fux, do Supremo Tribunal Federal (STF), rebateu críticas e defendeu a proibição das apostas online. Por outro lado, o Superior Tribunal de Justiça (STJ) manteve a proibição de partidos políticos na Plataforma WhatsApp Business. Ainda assim, a Polícia Federal investiga ameaças e ataques racistas contra a deputada Talíria Petrone, após ela e sua família terem recebido mensagens ameaçadoras e de cunho racista e misógino por meio da internet.", "mundo": "As eleições para meio de mandato nos Estados Unidos estão em curso, com milhões de eleitores votando para renovar a Câmara dos Representantes, um terço do Senado e definir os governadores de 36 estados. As pesquisas indicam uma 'onda azul', ou seja, a vitória de candidatos democratas, que devem perder a Câmara dos Representantes e podem perder o Senado. O presidente dos Estados Unidos, Joe Biden, anunciou o fim da assistência militar anual de 4 bilhões de dólares a Israel, que começará no final do ano. Em outro desenvolvimento, o ministro dos Transportes da Espanha, Oscar Puente, renunciou após um trágico acidente ferroviário que resultou em 69 mortes, e decidiu se retirar da próxima eleição geral. Além disso, a política de imigração do Reino Unido foi endurecida, exigindo que estrangeiros com status legal aguardem 10 anos para se tornarem residentes permanentes, com exceções para altos rendimentos e refugiados que chegaram em 'pequenas embarcações', que precisam ter residido no país por pelo menos 20 anos.\n\nOs Estados Unidos realizaram um ataque militar no Estreito de Ormuz contra alvos iranianos, em resposta a ações anteriores do Irã. Em resposta, o Irã afirmou que não pretende retomar a guerra, a menos que seja benéfico para todos. Em outro desenvolvimento, Israel enfrenta um impasse político, com Benjamin Netanyahu e seu partido, o Likud, liderando as eleições gerais, mas sem clareza sobre como formar um governo. No contexto regional, a Coreia do Norte indicou que ainda existe a possibilidade de dialogar com os Estados Unidos, mas qualquer conversa deve servir aos interesses nacionais. A Ucrânia investiga possíveis tentativas de manipulação russa em conflitos recentes. As relações entre as potências mundiais continuam tensas, com a China enfrentando dificuldades econômicas, especialmente na indústria de inteligência artificial, e a Rússia intensificando ataques em Dnipro, resultando em vítimas civis.", "economia": "O Banco Central brasileiro pode ajustar a taxa Selic para um dígito, possivelmente para a taxa simples, em uma futura reunião de política monetária, conforme indicado pelo rumo para a Selic. O Itaú Unibanco registrou um lucro líquido recorrente de R$ 12,617 bilhões no terceiro trimestre de 2026, priorizando o crédito imobiliário e consignado. A Walt Disney planeja demitir milhares de funcionários e reduzir custos em 20%. A Caixa anunciou que o prêmio da Mega da Virada deste ano deve ultrapassar R$ 1 bilhão. Sob um cenário adverso, a dívida bruta atingiria 100% do PIB em 2033, com déficits prolongados, baixo crescimento e juros elevados, conforme prevê o Tesouro. Além disso, a Organização Internacional do Trabalho (OIT) relata que as mulheres têm ganhado espaço nas posições de gestão mais altas nas empresas, mas ainda existem desigualdades em outros níveis de gestão.", "tecnologia": "A Ballistic Ventures, especializada em segurança cibernética, está buscando levantar $360 milhões para um novo fundo principal e $130 milhões para um veículo de investimento separado, em um cenário de boom na segurança cibernética impulsionado pela inteligência artificial. O Google anunciou que, a partir do início do próximo ano, desativará as ferramentas de inteligência artificial em seus softwares educacionais a menos que os administradores escolares permitam sua utilização. A Binance, a maior exchange de criptomoedas do mundo, acusa a Coreia do Norte de ter usado entrevistas falsas e uma ferramenta de inteligência artificial para roubar US$ 6 bilhões em criptomoedas. A startup Fal, especializada em inferência de inteligência artificial, dobrou sua avaliação para US$ 16 bilhões com a alta demanda, levantando US$ 1,3 bilhão em uma rodada liderada pela Bessemer Venture Partners. Além disso, a Netflix lançou uma nova aba chamada AI Discover, que oferece recomendações de conteúdo com base no humor do usuário, enquanto a Apple introduziu atualizações que permitem que o assistente de inteligência artificial Siri acesse funcionalidades de aplicativos de terceiros.", "ciencia": "Um novo parque científico está sendo planejado para ser construído em Tainan, Taiwan, conforme anunciado pelo ministro do NSTC. De outro lado, pesquisadores do Instituto de Saúde e Tecnologia Médica dos Institutos Físicos de Hefei, da Academia Chinesa de Ciências, desenvolveram um fluxo de trabalho padronizado para analisar a metilação do DNA em células individuais, combinando um procedimento laboratorial com uma ferramenta de análise de dados automatizada. Um estudo publicado na Strategic Management Journal indica que a fortalecimento da proteção de segredos comerciais fez com que empresas de alta tecnologia reduzissem a compartimentalização de seus inventores e conectassem os inventores de forma mais ampla, resultando em inovações com maior impacto tecnológico. Além disso, um método de escrita direta com laser foi adaptado para 'desenhar' propriedades supercondutivas em um material, oferecendo uma nova maneira de programar localmente o comportamento de um supercondutor. Uma pesquisa liderada pela geneticista Mayana Zatz examina os genes que influenciam a longevidade extrema, focando em pessoas que chegam aos 110 anos de idade.", "cultura": "A exposição 'Todos os Tipos de Experimentos: Legados do Grupo de Arte Moderna de Bagdá', curada por Nada Shabout, está em exibição no Galeria de Arte NYU Abu Dhabi até 3 de janeiro de 2027. A mostra explora a história do Grupo de Arte Moderna de Bagdá dos anos 1950, integrando fotos, materiais descartáveis e panfletos à história da cultura jovem chicanx dos anos 90, retratando tanto uma jornada pessoal quanto coletiva de crescimento. Paralelamente, a série 'Dom de Iludir', da Netflix, se baseia em um caso real de crime que ocorreu no Rio de Janeiro, envolvendo um apartamento de cinema, obras de arte valiosas e uma quadrilha buscando dinheiro. A série retrata a vida do boxeador Muhammad Ali desde a juventude até se tornar um dos maiores nomes do esporte, explorando seus conflitos familiares e políticos em um contexto de segregação racial nos Estados Unidos. Além disso, a Itália está considerando uma nova lei que criaria um processo formal para devolver obras de arte e bens culturais roubados pelos nazistas e autoridades italianas sob Benito Mussolini durante a Segunda Guerra Mundial. A lei foi apresentada por um membro do partido Brothers of Italy, liderado por Giorgia Meloni.", "sociedade": "Um cuidador foi agredido fisicamente, drogado e estuprado por membros de uma família em Taipei, Taiwan, levantando preocupações sobre a violência doméstica. Em Goiás, um homem se entregou à Polícia Civil de Goiás (PCGO) após matar sua namorada e arrastar seu corpo com um caminhão, gerando debate sobre a aplicação da lei. No Rio de Janeiro, um jovem foi morto a tiros durante uma discussão de trânsito, destacando a violência urbana. A Secretaria da Mulher do Distrito Federal transferiu suas atividades para a nova sede, o Centrad, em Taguatinga. Em Minas Gerais, a Smart Fit foi condenada a pagar R$ 10 mil a um aluno que se machucou durante uma aula, reforçando a importância do cumprimento de normas de segurança em estabelecimentos de fitness. A Coreia do Sul selecionou 43 regiões para uma nova iniciativa de reforma educacional, com o objetivo de melhorar as oportunidades educacionais em comunidades com uma população estudantil em declínio.", "meio_ambiente": "O Brasil lançou um plano de ação global para a transição energética durante sua presidência no processo climático da ONU, focado em conter o desmatamento e acelerar a descontinuação dos combustíveis fósseis, baseado em acordos já existentes. Este plano faz parte de uma série de iniciativas internacionais que buscam combater o aquecimento global, incluindo o lançamento de dois mapas pelo COP30 que propõem ações coordenadas para desacelerar a utilização de combustíveis fósseis e reverter a perda florestal até 2030. Paralelamente, a Tailândia, Brasil e Estados Unidos registraram um aumento de 122% na utilização de óleos vegetais como biocombustível desde 2020, atingindo 34,3 milhões de toneladas, refletindo a crescente demanda por alternativas sustentáveis. No Brasil, o plantio da soja na safra 2026/27 está avançado, com a previsão de chuvas cruciais para o desenvolvimento das lavouras. Em outros países, inundações flash devastaram o Sudoeste dos Estados Unidos, destruindo casas e isolando moradores, enquanto cheias em Rodas, Grécia, causaram danos significativos. O fenômeno Super El Niño está intensificando, atingindo níveis inéditos, com indicadores apontando para eventos climáticos extremos futuros. Além disso, um novo relatório da ONU e da ICCI alerta que o aquecimento acima de 1,5°C pode provocar a perda irreversível de geleiras, com o derretimento das calotas polares se acelerando de forma significativa.", "direitos_humanos": "O ministro Gilmar Mendes solicitou que órgãos informassem sobre casos de violência contra indígenas após as eleições, em uma ação que visa investigar episódios documentados de violência. Esta medida surge no contexto de uma comitiva do governo Lula que esteve na região recentemente. Paralelamente, a UNICEF emitiu uma declaração sobre relatos de crianças mortas e feridas em ataques aéreos em Myanmar, destacando a vulnerabilidade das crianças nesses incidentes. Além disso, a Coreia do Sul realizará uma cerimônia de memorial separada para vítimas de trabalho forçado no mineiro de Sado pela terceira vez consecutiva, enquanto trabalhadores da indústria de vestuário em Bangladesh realizaram manifestações para pedir aumentos salariais mais significativos. Estes eventos refletem a variedade de desafios relacionados a direitos humanos ao redor do mundo, desde violência contra indígenas até trabalho forçado e violência contra mulheres. Na China, autoridades realizaram uma investigação sobre a morte de um funcionário público durante uma reunião de negócios, enquanto a Albânia enfrentou críticas após a morte de um jovem durante um protesto, levando à instalação de uma comissão de inquérito. Esses incidentes demonstram a complexidade dos desafios de direitos humanos em diferentes partes do mundo."}, "resumo_do_dia": {"politica_nacional": [{"id": 243562, "titulo": "Defesa de Vorcaro pede a Fachin perícia oficial em celular apreendido", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/11/defesa-de-vorcaro-pede-a-fachin-pericia-oficial-em-celular-apreendido.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-03T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A defesa de Daniel Vorcaro solicitou a Edson Fachin uma perícia oficial sobre o celular apreendido do ex-dono do Banco Master. O advogado Sérgio Leonardo foi recebido pelo gabinete do ministro para tratar dos pedidos ainda sem decisão.", "titulo_pt": "Defesa de Vorcaro pede perícia oficial no celular do ex-dono do banco master a Fachin", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 243718, "titulo": "Zambelli lança vaquinha de R$ 50 e critica Moraes: “Destruiu a minha vida”", "url": "https://www.cnnbrasil.com.br/politica/zambelli-lanca-vaquinha-de-r-50-e-critica-moraes-destruiu-a-minha-vida/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-03T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ex-deputada federal Carla Zambelli está na Itália há mais de um ano e lançou uma vaquinha online pedindo R$ 50. Ela criticou o ministro Alexandre Moraes, responsável por sua condenação no STF por invasão ao sistema do CNJ.", "titulo_pt": "Zambelli pede doações e critica Moraes por condenação", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 243630, "titulo": "Economista dos EUA cita preocupação com proposta de Lara Resende", "url": "https://www.poder360.com.br/poder-economia/economista-dos-eua-cita-preocupacao-com-proposta-de-lara-resende/", "fonte_id": "poder360", "data_pub": "2026-11-03T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O economista americano John Cochrane expressou preocupação com a proposta de criação de um conselho fiscal no Brasil, afirmando que não há precedentes históricos para isso. Além disso, ele comentou que a desvalorização do real após a eleição de Lula não é um sinal de confiança.", "titulo_pt": "Economista americano critica proposta de conselho fiscal e desvalorização do real", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 243544, "titulo": "Alckmin recebe jovens deputados eleitos para agradecer apoio no 2º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/alckmin-recebe-jovens-deputados-eleitos-para-agradecer-apoio-no-2o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-03T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Geraldo Alckmin recebe jovens deputados federais e estaduais de primeiro mandato na vice-presidência nesta quarta-feira (4). A reunião foi solicitada por Alckmin.", "titulo_pt": "Alckmin recebe jovens deputados eleitos para agradecer apoio no 2º turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 243843, "titulo": "STJ mantém proibição a partidos políticos na Plataforma WhatsApp Business", "url": "https://www.jota.info/justica/stj-mantem-proibicao-a-partidos-politicos-na-plataforma-whatsapp-business", "fonte_id": "jota", "data_pub": "2026-11-03T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Superior Tribunal de Justiça (STJ) manteve a proibição de partidos políticos usar a Plataforma WhatsApp Business, após uma decisão que havia excluído a conta do Podemos para evitar disparos em massa de mensagens.", "titulo_pt": "STJ mantém proibição de partidos políticos na Plataforma WhatsApp Business", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 243545, "titulo": "Após serem alvo de listas de boicote, Judeus pela Democracia esperam pacificação da comunidade", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/apos-serem-alvo-de-listas-de-boicote-judeus-pela-democracia-esperam-pacificacao-da-comunidade.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-03T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Judeus pela Democracia, uma organização que enfrentou listas de boicote, espera por uma pacificação da comunidade. Uma lista com mais de 1.300 nomes, incluindo artistas, jornalistas, professores, editores e políticos judeus, foi divulgada, lembrando a tragédia do Holocausto.", "titulo_pt": "Judeus pela Democracia esperam pacificação após serem alvo de listas de boicote", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 243737, "titulo": "Trump reúne aliados na Casa Branca para acompanhar eleições", "url": "https://www.cnnbrasil.com.br/internacional/trump-reune-aliados-na-casa-branca-para-acompanhar-eleicoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-03T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente americano se reuniu na Casa Branca com membros do gabinete e aliados republicanos para acompanhar as Eleições de Meio de Mandato. Equipes da Casa Branca e do MAGA também monitorarão os resultados.", "titulo_pt": "Trump reúne aliados na Casa Branca para acompanhar eleições", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 243741, "titulo": "STM aceita denúncia contra Roberto Jefferson por suposto documento falso", "url": "https://www.cnnbrasil.com.br/politica/stm-aceita-denuncia-contra-roberto-jefferson-por-suposto-documento-falso/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-03T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal de Segunda Instância (STM) aceitou por unanimidade uma denúncia contra Roberto Jefferson relacionada a supostos documentos falsos. A acusação envolve declarações entregues ao Exército para manter o registro de um Conselho de Administração de Companhia (CAC).", "titulo_pt": "STM aceita denúncia contra Roberto Jefferson por suposto documento falso", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 243586, "titulo": "ASSISTA: Senado discute a PEC da Segurança Pública; texto pode ser votado ainda hoje", "url": "https://g1.globo.com/politica/ao-vivo/pec-seguranca-publica-senado.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-03T20:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado está debatendo a Proposta de Emenda à Constituição (PEC) da Segurança Pública. O texto prevê o 'SUS da Segurança' e o fim da 'saidinha' de presos, mas a votação foi adiada devido a um impasse sobre a redução da maioridade penal.", "titulo_pt": "Senado discute PEC da Segurança Pública; texto pode ser votado ainda hoje", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 243576, "titulo": "Entenda o que está em jogo no STF sobre a proibição das bets", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/entenda-o-que-esta-em-jogo-no-stf-sobre-a-proibicao-das-bets.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-03T20:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Audiência pública no STF discutirá a medida provisória que vetou as apostas online proposta pelo governo Lula. O evento ocorre nesta terça-feira (3).", "titulo_pt": "Entenda o que está em jogo no STF sobre a proibição das bets", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 243546, "titulo": "Com 40 novos deputados, Alesp deve reviver tensão da chegada do bolsonarismo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/com-40-novos-deputados-alesp-deve-reviver-tensao-da-chegada-do-bolsonarismo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-03T19:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Assembleia Legislativa de São Paulo (Alesp) terá 40 novos deputados em sua próxima legislatura, prevista para 2027-2031, o que deve intensificar as tensões ideológicas.", "titulo_pt": "Com 40 novos deputados, Alesp deve reviver tensão da chegada do bolsonarismo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 243578, "titulo": "Senador Eduardo Braga será o relator do Orçamento para 2027", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/senador-eduardo-braga-sera-o-relator-do-orcamento-para-2027.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-03T18:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Eduardo Braga (MDB-AM) será o relator do Projeto de Lei Orçamentária Anual (PLOA) para 2027 na Comissão Mista de Orçamento. O texto passará por esta comissão antes de ser votado pelos plenários da Câmara e do Senado.", "titulo_pt": "Senador Eduardo Braga será relator do Orçamento para 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 243579, "titulo": "Entenda o que é o Imposto Seletivo, previsto na reforma tributária", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/entenda-o-que-e-o-imposto-seletivo-previsto-na-reforma-tributaria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-03T18:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal pretende enviar uma medida provisória ao Congresso Nacional nesta terça-feira (3) estabelecendo as alíquotas do Imposto Seletivo, um tributo criado pela reforma tributária para desestimular o consumo de produtos prejudiciais à saúde ou ao meio ambiente.", "titulo_pt": "Entenda o que é o Imposto Seletivo, previsto na reforma tributária", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 243583, "titulo": "Lula vai a São Paulo para fazer exames de rotina nesta terça-feira", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/lula-vai-sao-paulo-para-fazer-exames-de-rotina-nesta-terca-feira", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-03T18:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva viajará a São Paulo para realizar exames de rotina na noite desta terça-feira, sob a coordenação dos médicos Roberto Kalil Filho e Ana Helena Germoglio. A viagem já estava pré-agendada para após a eleição.", "titulo_pt": "Lula viaja a São Paulo para fazer exames de rotina nesta terça-feira", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 243584, "titulo": "PF apura ameaças e ataques racistas contra deputada Talíria Petrone", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/pf-apura-ameacas-e-ataques-racistas-contra-deputada-taliria-petrone", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-03T18:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal iniciou uma operação para investigar crimes de ameaça, injúria racial e racismo contra a deputada Talíria Petrone, após a parlamentar e sua família receberem mensagens ameaçadoras e ataques de cunho racista e misógino por meio da internet. A investigação foi aberta em agosto de 2026.", "titulo_pt": "PF investiga ameaças e ataques racistas contra deputada Talíria Petrone", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 243849, "titulo": "Vitória de Lula impõe a tarefa de reinventar a democracia brasileira", "url": "https://www.jota.info/opiniao-e-analise/colunas/democracia-em-transe/vitoria-de-lula-impoe-a-tarefa-de-reinventar-a-democracia-brasileira", "fonte_id": "jota", "data_pub": "2026-11-03T18:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O quarto governo de Lula terá como tarefa aprofundar a democracia brasileira. A vitória do presidente impõe essa necessidade.", "titulo_pt": "Vitória de Lula impõe a tarefa de aprofundar a democracia brasileira", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 243275, "titulo": "Washington strikes Iranian targets in the Strait of Hormuz: US official", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/04/2003867115", "fonte_id": "taipei_times", "data_pub": "2026-11-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um oficial dos Estados Unidos confirmou que Washington atacou alvos iranianos no Estreito de Ormuz.", "titulo_pt": "Washington ataca alvos iranianos no estreito de Ormuz: oficial americano", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 243278, "titulo": "Kinmen County troops conduct live-fire exercises", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/04/2003867124", "fonte_id": "taipei_times", "data_pub": "2026-11-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças militares da County de Kinmen realizaram exercícios de tiro ao vivo.", "titulo_pt": "Forças militares de kinmen realizam exercícios de tiro ao vivo", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 243952, "titulo": "NTSB says crucial plane parts found three miles from Florida crash site", "url": "https://www.bbc.co.uk/news/articles/c9e8lk5dpj7no?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-03T21:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NTSB informou que peças importantes do avião foram encontradas a três milhas do local do acidente, sugerindo que elas caíram antes do impacto.", "titulo_pt": "NTSB diz que peças cruciais do avião foram encontradas a três milhas do local do acidente em Florida", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 244055, "titulo": "Eisenkot accusa Netanyahu di 'pogrom contro la democrazia'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/03/eisenkot-accusa-netanyahu-di-pogrom-contro-la-democrazia_7c9f10e1-065e-4681-a4eb-f352f944df12.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-03T21:50:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Eisenkot acusa Netanyahu de planejar um 'pogrom contra a democracia'. O general afirma que os acusados e o Likud pretendem levar o país a uma crise constitucional através de intrigas árabes.", "titulo_pt": "Eisenkot acusa Netanyahu de 'pogrom contra a democracia'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 243894, "titulo": "La “ola azul” y los escenarios posibles tras las “midterms”", "url": "https://www.latercera.com/mundo/noticia/la-ola-azul-y-los-escenarios-posibles-tras-las-midterms/", "fonte_id": "la_tercera", "data_pub": "2026-11-03T21:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As pesquisas indicam uma 'onda azul', ou seja, a vitória de candidatos democratas em vários distritos. Os republicanos devem perder a Câmara dos Representantes, e também podem perder o Senado.", "titulo_pt": "A ‘onda azul’ e os cenários possíveis após as ‘midterms’", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 243957, "titulo": "Spain's transport minister resigns after deadly train crash that killed 69 people", "url": "https://www.lemonde.fr/en/international/article/2026/11/03/spain-s-transport-minister-resigns-after-deadly-train-crash-that-killed-69-people_6770821_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-03T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro dos Transportes da Espanha, Oscar Puente, renunciou após um trágico acidente ferroviário que resultou em 69 mortes. Além disso, Puente decidiu se retirar da próxima eleição geral, com o primeiro-ministro Pedro Sánchez em desvantagem nas pesquisas de opinião.", "titulo_pt": "Ministro dos transportes da Espanha renuncia após acidente ferroviário que deixou 69 mortos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 243653, "titulo": "Eleições nos EUA: primeiras urnas começam a fechar às 20h desta terça", "url": "https://www.metropoles.com/mundo/eleicoes-nos-eua-primeiras-urnas-comecam-a-fechar-as-20h-desta-terca", "fonte_id": "metropoles", "data_pub": "2026-11-03T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Millhões de eleitores dos Estados Unidos votam para renovar a Câmara, um terço do Senado e definir os governadores de 36 estados.", "titulo_pt": "Eleições nos EUA: primeiras urnas começam a fechar às 20h desta terça", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 243566, "titulo": "Plano de 'imposto de saída' da Itália assusta expatriados ricos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/plano-de-imposto-de-saida-da-italia-assusta-expatriados-ricos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-03T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Consultores patrimoniais alertaram que o plano da primeira-ministra italiana, Giorgia Meloni, de implementar um 'imposto de saída' a partir do próximo ano pode afastar expatriados ricos que se instalaram em cidades como Milão.", "titulo_pt": "Plano de 'imposto de saída' da Itália assusta expatriados ricos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 244066, "titulo": "China’s new nightmare: a Japanese containment arc in the Indo-Pacific", "url": "https://www.scmp.com/opinion/asia-opinion/article/3372983/chinas-new-nightmare-japanese-containment-arc-indo-pacific", "fonte_id": "scmp", "data_pub": "2026-11-03T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Após os presidentes dos Estados Unidos e da China mencionarem sua aliança de guerra na Casa Branca, o exercício militar Keen Sword 27 realizou testes de armas antissubmarino e de defesa aérea nos arredores de Taiwan. A operação envolveu sistemas dos EUA e novos mísseis japoneses.", "titulo_pt": "China’s new nightmare: uma arquitetura de conter o Japão no indo-pacífico", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 244071, "titulo": "(URGENT) N. Korea's Kim Yo-jong says dialogue with U.S. remains option for peace but suggests must serve Pyongyang's national interest", "url": "https://en.yna.co.kr/view/AEN20261104000800315", "fonte_id": "yonhap_news", "data_pub": "2026-11-03T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kim Yo-jong, irmã do líder norte-coreano, afirmou que a Coreia do Norte ainda considera a possibilidade de dialogar com os Estados Unidos para alcançar a paz, mas ressaltou que qualquer diálogo deve servir aos interesses nacionais do país.", "titulo_pt": "N. Coreia de Kim Yo-jong mantém diálogo com EUA como opção para paz, mas com condicionantes", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 244033, "titulo": "Netanyahu’s eight-seat problem", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/3/netanyahus-eight-seat-problem?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-03T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Netanyahu e seu bloco liderado pelo Likud ganharam a maior número de assentos nas eleições gerais, mas formar um governo será um desafio adicional.", "titulo_pt": "O problema das oito assentos de netanyahu", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 244034, "titulo": "Palestinian families return home after Israeli siege of Hebron", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/3/palestinian-families-return-home-after-israeli-siege-of-hebron?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-03T21:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Famílias palestinas retornaram às suas casas após o bloqueio israelense em Hebron.", "titulo_pt": "Famílias palestinas retornam às suas casas após bloqueio israelense em Hebron", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 243751, "titulo": "Governo Lula impõe sigilo a documentos do 'pacote de bondades' lançado nas eleições", "url": "https://www.bbc.com/portuguese/articles/cmz654z66gplo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-03T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula negou acesso à BBC News Brasil a documentos que suportaram o 'pacote de bondades' lançado durante as eleições, justificando com sigilo 'advogado-cliente'. Especialistas questionam a justificativa e afirmam que a decisão permite um 'sigilo eterno' sobre o material usado nas medidas.", "titulo_pt": "Governo Lula nega acesso a documentos do 'pacote de bondades' por sigilo 'advogado-cliente'", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 243954, "titulo": "Trump says US military aid to Israel will be 'cut off at the end of the year'", "url": "https://www.lemonde.fr/en/international/article/2026/11/03/trump-says-us-military-aid-to-israel-will-be-cut-off-at-the-end-of-the-year_6770788_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-03T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em dia de eleições intermunicipais, o presidente dos Estados Unidos, Trump, declarou em entrevista à Fox News que pretende interromper, no final do ano, o apoio militar anual de 3,8 bilhões de dólares ao Israel.", "titulo_pt": "Trump anuncia intenção de cortar auxílio militar dos EUA para Israel", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 243585, "titulo": "Nos EUA, Flávio Bolsonaro registra presença em sessão do Senado que discute a PEC da Segurança Pública", "url": "https://g1.globo.com/politica/noticia/2026/11/03/nos-eua-flavio-bolsonaro-registra-presenca-em-sessao-do-senado.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-03T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, senador derrotado pelo presidente eleito Luiz Inácio Lula da Silva, registrou presença em uma sessão do Senado dos Estados Unidos que discutiu a PEC da Segurança Pública. Ele chegou aos EUA após a eleição presidencial no Brasil e participou da sessão do Senado nesta terça-feira.", "titulo_pt": "Flávio Bolsonaro registra presença em sessão do Senado dos EUA sobre PEC da Segurança Pública", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 243956, "titulo": "UK tightens policy on legal immigration", "url": "https://www.lemonde.fr/en/international/article/2026/11/03/uk-tightens-policy-on-legal-immigration_6770755_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-03T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A política de imigração legal do Reino Unido foi endurecida, exigindo que estrangeiros com status legal aguardem 10 anos para se tornarem residentes permanentes, com exceções para altos rendimentos e refugiados que chegaram em 'pequenas embarcações', que precisam ter residido no país por pelo menos 20 anos.", "titulo_pt": "Reino unido endurece política de imigração legal", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 243295, "titulo": "GlobalWafers to issue US$500m in bonds to Micron", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/04/2003867096", "fonte_id": "taipei_times", "data_pub": "2026-11-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A GlobalWafers planeja emitir US$500 milhões em títulos para a Micron. Esta ação visa provavelmente fortalecer a posição financeira das empresas no setor de semicondutores.", "titulo_pt": "Globalwafers vai emi  "fonte_id": "yonhap_news", "data_pub": "2026-11-03T20:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hyundai Motor America relatou vendas recorde em outubro nos Estados Unidos devido à alta demanda por veículos híbridos e SUVs.", "titulo_pt": "Hyundai Motor registra vendas recorde em outubro nos EUA, impulsionadas por híbridos e suvs", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 244081, "titulo": "Apple starts giving Siri AI access to third-party apps", "url": "https://www.theverge.com/tech/1025694/apple-siri-ai-third-party-apps", "fonte_id": "the_verge", "data_pub": "2026-11-03T20:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apple introduziu atualizações que permitem que o assistente de inteligência artificial Siri acesse funcionalidades de aplicativos de terceiros. Com a atualização iOS 27.3, os desenvolvedores podem integrar novas funcionalidades do Siri em todos os aplicativos, permitindo que o assistente utilize contexto pessoal do usuário, processe prompts de linguagem natural e tenha consciência da tela.", "titulo_pt": "Apple permite que Siri utilize aplicativos de terceiros", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 244013, "titulo": "Apple warns of risks related to AI agents behaving in 'unintended or unpredictable' ways", "url": "https://www.cnbc.com/2026/11/03/apple-warns-of-ai-agents-behave-in-unintended-or-unpredictable-ways.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-03T20:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple alerta em seu relatório anual sobre os riscos associados aos agentes de inteligência artificial (IA) que podem exceder as permissões concedidas, resistir às instruções ou realizar ações difíceis de desfazer.", "titulo_pt": "Apple avisa sobre riscos de agentes de IA agirem de maneiras 'inesperadas ou imprevisíveis'", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 244075, "titulo": "Hyundai E&C partners with FANCO of U.S. for next-gen nuclear reactor project", "url": "https://en.yna.co.kr/view/AEN20261104000500315", "fonte_id": "yonhap_news", "data_pub": "2026-11-03T19:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa sul-coreana Hyundai Engineering &amp; Construction (E&amp;C) formou uma parceria com a FANCO dos Estados Unidos para um projeto de reator nuclear avançado.", "titulo_pt": "Hyundai E&amp;C se associa à FANCO dos EUA em projeto de reator nuclear avançado", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 243272, "titulo": "New science park to rise in Tainan: NSTC minister", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/04/2003867112", "fonte_id": "taipei_times", "data_pub": "2026-11-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo parque científico está sendo planejado para ser construído em Tainan. O ministro do NSTC anunciou esta iniciativa.", "titulo_pt": "Novo parque científico para ser construído em Tainan: ministro do NSTC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 244110, "titulo": "Researchers develop method for single-cell DNA methylation analysis", "url": "https://phys.org/news/2026-11-method-cell-dna-methylation-analysis.html", "fonte_id": "phys_org", "data_pub": "2026-11-03T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores desenvolveram um fluxo de trabalho padronizado para analisar a metilação do DNA em células individuais, combinando uma melhor procedimento laboratorial com uma ferramenta de análise de dados automatizada. O estudo, publicado na Nature Protocols, foi liderado por pesquisadores do Instituto de Saúde e Tecnologia Médica dos Institutos Físicos de Hefei da Academia Chinesa de Ciências.", "titulo_pt": "Pesquisadores desenvolvem método para análise de metilação do DNA em células individuais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244112, "titulo": "Study finds stronger trade secret protection leads firms to break down innovation silos", "url": "https://phys.org/news/2026-11-stronger-secret-firms-silos.html", "fonte_id": "phys_org", "data_pub": "2026-11-03T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos estudos publicados na Strategic Management Journal indicam que a fortalecimento da proteção de segredos comerciais fez com que empresas de alta tecnologia reduzissem a compartmentalização de seus inventores e conectassem os inventores de forma mais ampla, resultando em inovações com maior impacto tecnológico.", "titulo_pt": "Estudo encontra que maior proteção de segredos comerciais leva empresas a descompartimentalizar inovação", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244113, "titulo": "A laser can draw superconductivity at the nanoscale", "url": "https://phys.org/news/2026-11-laser-superconductivity-nanoscale.html", "fonte_id": "phys_org", "data_pub": "2026-11-03T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investigadores da ICMAB-CSIC, o Politecnico di Milano e a Université de Liège adaptaram uma técnica de escrita direta com laser que permite 'desenhar' propriedades supercondutivas em um material. O método oferece uma nova maneira de programar localmente o comportamento de um supercondutor, ajustando-o com extraordinária precisão de um estado supercondutor completo para um estado isolante.", "titulo_pt": "Um laser pode desenhar supercondutividade na nanosscale", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244114, "titulo": "Plant-inspired natural coatings can beat forever chemicals", "url": "https://phys.org/news/2026-11-natural-coatings-chemicals.html", "fonte_id": "phys_org", "data_pub": "2026-11-03T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Polífluorocarbonetos (PFAS) são conhecidos como 'químicos eternos' devido ao seu impacto ambiental e na saúde humana. A fabricação moderna depende desses compostos para embalagens seguras, proteção contra incêndios e revestimentos impermeáveis.", "titulo_pt": "Revêtimentos naturais inspirados em plantas podem superar químicos eternos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244115, "titulo": "Cold storage can extend shelf life of platelets for dogs facing life-threatening bleeding", "url": "https://phys.org/news/2026-11-cold-storage-shelf-life-platelets.html", "fonte_id": "phys_org", "data_pub": "2026-11-03T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A armazenagem fria pode estender a vida útil dos plaquetos em cães que enfrentam complicações hemorrágicas potencialmente letais. Os veterinários frequentemente têm acesso limitado a um dos métodos mais eficazes para controlar essas complicações.", "titulo_pt": "Armazenamento frio pode alongar a vida útil de plaquetos em cães com hemorragia grave", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244116, "titulo": "Nearly 7 in 10 professors report being bullied, often by students over grades", "url": "https://phys.org/news/2026-11-professors-bullied-students-grades.html", "fonte_id": "phys_org", "data_pub": "2026-11-03T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo internacional, conduzido em colaboração com Zahra Moradi e Deborah Circo, revelou que quase 70% dos professores relataram ser vítimas de bullying, com os alunos sendo um dos principais agentes de bullying, especialmente em relação a notas.", "titulo_pt": "Quase 7 em 10 professores relatam ser vítimas de bullying, muitas vezes por alunos em relação a notas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244117, "titulo": "More power, less payoff: Study reveals a bottleneck in cleaner methanol production", "url": "https://phys.org/news/2026-11-power-payoff-reveals-bottleneck-cleaner.html", "fonte_id": "phys_org", "data_pub": "2026-11-03T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aumento da potência nas reações químicas alimentadas por eletricidade não garante maior eficiência, conforme sugere um novo estudo. Este achado aproxima os pesquisadores dos melhores condições para a produção sustentável de metanol limpo.", "titulo_pt": "Mais potência, menos retorno: estudo revela um gargalo na produção mais limpa de metanol", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244170, "titulo": "Ancient star collisions could explain mysterious Little Red Dots and 'impossible' black holes", "url": "https://www.space.com/astronomy/stars/ancient-star-collisions-could-explain-mysterious-little-red-dots-and-impossible-black-holes", "fonte_id": "space_com", "data_pub": "2026-11-03T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Colisões entre estrelas no início do universo eram comuns e podem explicar o crescimento de buracos negros supermassivos e a existência de estranhas Manchas Vermelhas observadas pelo Telescópio Espacial James Webb.", "titulo_pt": "Colisões estelares antigas podem explicar manchas vermelhas e buracos negros impossíveis", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 244135, "titulo": "STAT+: Servier’s $1.55 billion muscular dystrophy drug fails first major test", "url": "https://www.statnews.com/2026/11/03/becker-muscular-dystrophy-servier-edgewise-sevasemten-fail/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-03T20:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Servier relata um contratempos inesperado para um medicamento em teste para uma forma de distrofia muscular sem tratamento.", "titulo_pt": "Servier enfrenta contratempos em teste de medicamento para distrofia muscular", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 244171, "titulo": "Voting in space: NASA astronauts cast ballots from International Space Station", "url": "https://www.space.com/space-exploration/international-space-station/voting-in-space-nasa-astronauts-cast-ballots-from-international-space-station", "fonte_id": "space_com", "data_pub": "2026-11-03T20:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três astronautas americanos estavam a bordo da Estação Espacial Internacional e votaram nas eleições intermédiadas.", "titulo_pt": "Votação no espaço: astronautas americanos votam da estação espacial internacional", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 244118, "titulo": "A single measurement makes quantum bits more reliable", "url": "https://phys.org/news/2026-11-quantum-bits-reliable.html", "fonte_id": "phys_org", "data_pub": "2026-11-03T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Regensburg e seus parceiros internacionais descobriram uma maneira de reduzir significativamente os erros em bits quânticos. Eles demonstraram que uma medição adicional antes de uma série de operações quânticas pode reduzir a taxa de erro em mais de metade.", "titulo_pt": "Uma única medição torna bits quânticos mais confiáveis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244119, "titulo": "Wherever there are people, there is also wildlife—though not necessarily at the same time", "url": "https://phys.org/news/2026-11-people-wildlife-necessarily.html", "fonte_id": "phys_org", "data_pub": "2026-11-03T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A intervenção humana global atingiu um nível sem precedentes, alterando permanentemente os habitats e comunidades de animais silvestres através do uso intensivo da terra e da perda de espécies. Uma estudante de doutorado, Kathi Kasper, e outros pesquisadores se interessaram pela questão de como predadores conseguem se adaptar em paisagens fortemente moldadas pelo homem e estabelecer seu nicho.", "titulo_pt": "Onde há pessoas, há também vida selvagem — embora não necessariamente no mesmo tempo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244136, "titulo": "STAT+: Amid Mass General Brigham layoffs, CEO pens vague letter, stirring staff anxiety", "url": "https://www.statnews.com/2026/11/03/mass-general-brigham-layoffs-ceo-letter-staff-anxiety/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-03T20:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO do sistema de saúde Mass General Brigham enviou um e-mail vago para os funcionários menos de duas semanas após cortes de pessoal, causando ansiedade entre os empregados.", "titulo_pt": "CEO do Mass General Brigham envia e-mail vago, aumentando ansiedade entre os funcionários", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 244120, "titulo": "As it gets harder to figure out what to eat, some Americans are turning to religion for answers", "url": "https://phys.org/news/2026-11-harder-figure-americans-religion.html", "fonte_id": "phys_org", "data_pub": "2026-11-03T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os americanos estão encontrando cada vez mais dificuldade em decidir o que comer. As redes sociais abrangem uma série de preocupações relacionadas à alimentação, como custos, nutrientes e processos de produção.", "titulo_pt": "À medida que se torna mais difícil decidir o que comer, alguns americanos estão buscando respostas na religião", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 244121, "titulo": "Reading single vesicles reveals clues to the origin of chronic inflammation", "url": "https://phys.org/news/2026-11-vesicles-reveals-clues-chronic-inflammation.html", "fonte_id": "phys_org", "data_pub": "2026-11-03T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova técnica de diagnóstico de inflamação crônica, desenvolvida na Universidade de Nagoya, pode ler informações da superfície e dentro de vesículas extracelulares individuais presentes no sangue e na urina. Esta técnica pode ser usada para desenvolver testes não invasivos que não apenas detectem inflamação crônica, mas também fornecem informações sobre as regiões tecidulares onde ela ocorre.", "titulo_pt": "Leitura de vesículas individuais revela pistas sobre a origem da inflamação crônica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 244174, "titulo": "Simon Denny Commissioned by New York Magazine to Create Portraits of ‘New AI Elite’ for Power Issue", "url": "https://www.artnews.com/art-news/news/simon-denny-ai-portraits-new-york-magazine-power-issue-1234804625/", "fonte_id": "artnews", "data_pub": "2026-11-03T21:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artista berlinesês Simon Denny foi contratado pela New York Magazine para criar retratos do que ele chama de 'nova élite da IA' para a edição de poder. As ilustrações foram feitas usando AI e têm um aspecto áspero e saturado, similar a fitas VHS antigas.", "titulo_pt": "Simon Denny comissionado pela New York Magazine para criar retratos da 'nova Elite da IA' para a edição de poder", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 244141, "titulo": "Exhibition as Living Archive: the 1950s Baghdad Modern Art Group in the UAE Today", "url": "https://hyperallergic.com/exhibition-as-living-archive-the-1950s-baghdad-modern-art-group-in-the-uae-today/", "fonte_id": "hyperallergic", "data_pub": "2026-11-03T21:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A exposição 'Todos os Tipos de Experimentos: Legados do Grupo de Arte Moderna de Bagdá' foi curada por Nada Shabout e está em exibição no Galeria de Arte NYU Abu Dhabi até 3 de janeiro de 2027.", "titulo_pt": "Exposição como arquivo vivo: o grupo de arte moderna de bagdá nos anos 1950 na árabe do egito hoje", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 244142, "titulo": "Guadalupe Rosales’s Portable Archive of East LA", "url": "https://hyperallergic.com/guadalupe-rosaless-portable-archive-of-east-la/", "fonte_id": "hyperallergic", "data_pub": "2026-11-03T21:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em dois novos livros, a artista Guadalupe Rosales integra sua arquitetura de fotos, materiais descartáveis e panfletos à história da cultura jovem chicanx dos anos 90, retratando tanto uma jornada pessoal quanto coletiva de crescimento.", "titulo_pt": "Arquivo portátil de East LA de guadalupe Rosales", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 243794, "titulo": "Tres nuevas esculturas de artistas consagrados se suman al circuito cultural a cielo abierto de Pinamar", "url": "https://www.lanacion.com.ar/cultura/tres-nuevas-esculturas-de-artistas-consagrados-se-suman-al-circuito-cultural-a-cielo-abierto-de-nid03112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-03T21:22:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A primeira edição da plataforma Pinamar Contemporáneo apresenta três novas esculturas de artistas consagrados. Estas obras foram concebidas em resposta ao paisaje local.", "titulo_pt": "Três novas esculturas de artistas consagrados compõem o circuito cultural ao ar livre de Pinamar", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 244175, "titulo": "Fair Warning to Auction Major Yoshitomo Nara Painting for Up to $15 M.", "url": "https://www.artnews.com/art-news/news/yoshitomo-nara-fair-warning-auction-loic-gouzer-1234804618/", "fonte_id": "artnews", "data_pub": "2026-11-03T21:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A obra de pintura de Yoshitomo Nara será leiloada por até 15 milhões de dólares. O artista comparou a relação entre artista e galeria a uma nota musical e um instrumento musical, sugerindo que a mudança de galeria pode alterar a percepção da obra.", "titulo_pt": "Aviso aos leiloei taque hacker; sistemas foram suspensos", "url": "https://www.cnnbrasil.com.br/nacional/centro-oeste/mt/secretaria-de-saude-de-mt-e-alvo-de-ataque-hacker-sistemas-foram-suspensos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-03T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Secretaria de Saúde de Mato Grosso foi alvo de um ataque hacker em 2026, resultando na suspensão temporária dos sistemas das unidades ligadas à pasta. Este é o segundo ataque cibernético sofrido pela secretaria neste ano.", "titulo_pt": "Secretaria de Saúde de MT é alvo de ataque hacker; sistemas suspensos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 243143, "titulo": "In New York, child care and school fees are so exorbitant that starting a family has become a luxury", "url": "https://www.lemonde.fr/en/economy/article/2026/11/03/in-new-york-child-care-and-school-fees-are-so-exorbitant-that-having-a-family-has-become-a-luxury_6770425_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-03T14:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No Nova York, as taxas de creche e as taxas escolares são tão elevadas que ter filhos se tornou um luxo para muitas famílias. A creche para crianças pequenas pode representar 30% a 40% do orçamento familiar, e a maioria das famílias recorre a programas de assistência pública que só existem há 12 anos.", "titulo_pt": "Fora do alcance nos estados unidos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 243287, "titulo": "Flu epidemic might end this week, CDC reports", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/04/2003867133", "fonte_id": "taipei_times", "data_pub": "2026-11-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com o CDC, uma epidemia de gripe no Taiwan pode ter chegado ao fim esta semana.", "titulo_pt": "Epidemia de gripe pode terminar esta semana, armest-year-on-record", "fonte_id": "carbon_brief", "data_pub": "2026-11-03T13:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com mais de três quartos do ano passados, é quase certo que 2026 será o ano mais quente ou o segundo mais quente na história. É altamente provável que 2026 se iguale ao ano de 2024 como o mais quente registrado.", "titulo_pt": "Estado do clima: 2026 provavelmente igualará 2024 como o ano mais quente da história", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 242980, "titulo": "Brazil publishes first global ‘roadmap’ for phasing out fossil fuels", "url": "https://www.theguardian.com/environment/2026/nov/03/brazil-first-global-roadmap-phasing-out-fossil-fuels", "fonte_id": "guardian_world", "data_pub": "2026-11-03T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo do Brasil lançou o primeiro roadmap global para a faseamento dos combustíveis fósseis, mostrando que os países podem iniciar a redução da dependência desses recursos sem aguardar novas tecnologias ou mudanças econômicas. O país, anfitrião da COP26 do ano anterior, apresentou o plano como parte de um esforço para passar do negociar para o implementar na conferência climática global.", "titulo_pt": "Brasil lança primeiro roadmap global para fasear combustíveis fósseis", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 242745, "titulo": "Entenda os mapas do caminho para fósseis e desmatamento apresentados pelo Brasil", "url": "https://exame.com/esg/entenda-os-mapas-do-caminho-para-fosseis-e-desmatamento-apresentados-pelo-brasil/", "fonte_id": "exame", "data_pub": "2026-11-03T12:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil apresentou mapas para atingir os compromissos de fósseis e desmatamento durante sua presidência da COP30. Esses documentos serão apresentados na COP31 na Turquia.", "titulo_pt": "Entenda os mapas do caminho para fósseis e desmatamento apresentados pelo Brasil", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 241973, "titulo": "Clima: país registra chuvas e temperaturas elevadas nesta terça; confira", "url": "https://www.metropoles.com/brasil/clima-pais-registra-chuvas-e-temperaturas-elevadas-nesta-terca-confira", "fonte_id": "metropoles", "data_pub": "2026-11-03T09:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Massas de ar úmido estão causando chuvas e temperaturas elevadas em várias regiões do país nesta terça-feira. Pancadas de chuva foram registradas em diversos pontos.", "titulo_pt": "Clima: país registra chuvas e temperaturas elevadas nesta terça; confira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 242285, "titulo": "Rhodes floods: Cars swept away after torrential rain in Greece", "url": "https://www.euronews.com/video/2026/11/03/rhodes-floods-cars-swept-away-after-torrential-rain-in-greece", "fonte_id": "euronews", "data_pub": "2026-11-03T07:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Águas de cheias levaram veículos e detritos pela cidade de Archangelos, em Rodas, danificando várias residências e estabelecimentos comerciais. Mais tempestades são esperadas.", "titulo_pt": "Cheias em rodas: veículos arrastados por enxurradas na Grécia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 242102, "titulo": "Overshoot: o aquecimento global acima de 1,5°C", "url": "https://www.jota.info/opiniao-e-analise/colunas/direito-e-clima/overshoot-o-aquecimento-global-acima-de-15c", "fonte_id": "jota", "data_pub": "2026-11-03T07:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O documento discute a meta de longo prazo do Acordo de Paris em relação ao aquecimento global. O título traduzido para português brasileiro é: 'O superaquecimento: o aquecimento global acima de 1,5°C'", "titulo_pt": "O superaquecimento: o aquecimento global acima de 1,5°C", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 241956, "titulo": "Aquecimento acima de 1,5°C pode provocar perda irreversível de geleiras, alerta estudo", "url": "https://exame.com/esg/aquecimento-acima-de-15c-pode-provocar-perda-irreversivel-de-geleiras-alerta-estudo/", "fonte_id": "exame", "data_pub": "2026-11-03T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo relatório da ONU e da ICCI indica que o derretimento das calotas polares está se acelerando, com a perda de gelo ocorrendo seis vezes mais rapidamente do que na década de 1990, mesmo que as temperaturas globais voltem a diminuir.", "titulo_pt": "Aquecimento acima de 1,5°C pode causar perda irreversível de geleiras, avisa estudo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 243279, "titulo": "Bureau outlines proposed changes to repression laws", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/04/2003867125", "fonte_id": "taipei_times", "data_pub": "2026-11-04T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O bureau apresentou propostas para alterar as leis de repressão. As mudanças sugeridas visam modificar o sistema legal existente.", "titulo_pt": "Bureau apresenta propostas para alterar leis de repressão", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 243844, "titulo": "Gilmar Mendes manda intimar órgãos para informarem sobre violência contra indígenas após as eleições", "url": "https://www.jota.info/stf/do-supremo/gilmar-mendes-manda-intimar-orgaos-para-informarem-sobre-violencia-contra-indigenas-apos-as-eleicoes", "fonte_id": "jota", "data_pub": "2026-11-03T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes ordenou que órgãos informassem sobre casos de violência contra indígenas após as eleições. Uma comitiva do governo Lula esteve na região no fim de semana.", "titulo_pt": "Gilmar Mendes intimará órgãos sobre viol Sérvia", "classe": "A"}, {"id": 242454, "titulo": "S. Korea to hold separate memorial for Sado mine forced labor victims for 3rd straight year", "url": "https://en.yna.co.kr/view/AEN20261103009600315", "fonte_id": "yonhap_news", "data_pub": "2026-11-03T06:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul realizará uma cerimônia de memorial separada para vítimas de trabalho forçado no mineiro de Sado pela terceira vez consecutiva.", "titulo_pt": "Coreia do sul realizará memorial separado para vítimas do trabalho forçado no mineiro de Sado pela terceira vez consecutiva", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 242319, "titulo": "‘Going hungry’: Garment workers in Bangladesh say wages barely cover needs", "url": "https://www.aljazeera.com/news/2026/11/3/going-hungry-garment-workers-in-bangladesh-say-wages-barely-cover-needs?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-03T05:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores da indústria de vestuário em Bangladesh, um dos principais exportadores mundiais de vestuário, realizaram manifestações para pedir aumentos salariais mais significativos. Eles afirmam que os salários actuais são insuficientes para atender às suas necessidades básicas.", "titulo_pt": "Faminto: trabalhadores da indústria de vestuário em Bangladesh exigem salários melhores", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 242256, "titulo": "Depression: Gender inequality is at the root of women's vulnerability", "url": "https://www.lemonde.fr/en/france/article/2026/11/03/depression-gender-inequality-is-at-the-root-of-women-s-vulnerability_6769666_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-03T01:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma relatório publicado pelo Alto Conselho para a Igualdade entre Mulheres e Homens na França, divulgado em 2 de novembro, ind function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
