<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

o Tribunal Constitucional de Kosovo estabeleceu um prazo até 6 de outubro para que os parlamentares elejam um novo presidente, sob pena de novas eleições. No Reino Unido, o governo está prestes a reconsiderar o acordo sobre Chagos após críticas do governo dos Estados Unidos, que havia ordenado a prisão de Maduro. Em um discurso na Assembleia Geral da ONU, o presidente francês Emmanuel Macron posicionou-se como o oposto de Trump, defendendo o multilateralismo e o direito internacional. O encontro entre Trump e Maduro também gerou críticas, com Trump criticando o acordo sobre Chagos durante a reunião, representando o maior desafio diplomático para o primeiro-ministro britânico Rishi Sunak, que está em seu sexto mandato em 10 anos.\n\nNesta edição, o discurso de Javier Milei na ONU sobre as Malvinas ocupadas pelo Reino Unido e as declarações do presidente sírio Ahmed al-Sharaa sobre o Golan Heights permanecendo sob a soberania síria destacam tensões geopolíticas em disputas territoriais. O ex-ministro chileno Hernán Fernández acusou o atual governo de negligência, alertando para potenciais intervenções militares dos Estados Unidos. Durante uma sessão da ONU, o presidente dos Estados Unidos, Donald Trump, ameaçou aniquilar o Irã, mas o Irã negou essas ameaças como propaganda. A visita de Xi Jinping a Washington para conversar com Trump sobre a estabilização das relações entre as duas nações também é um ponto crucial. A China criticou as sanções dos EUA à aviação iraniana e o conflito comercial entre EUA e China persistiu. A competição geopolítica intensificou, levando a uma adaptação necessária na política da União Europeia para os Bálcãs Ocidentais e preocupações sobre a integração de inteligência artificial na campanha eleitoral albanesa.", "economia": "O dólar subiu mais de 1% nesta quarta-feira (23), influenciado pela cautela dos investidores diante da guerra no Irã e do preço do petróleo próximo dos US$ 100. O petróleo atingiu US$ 100 por barril, contribuindo para a valorização do dólar, que manteve-se estável na bolsa. A OCDE revisou para cima a projeção do PIB do Brasil para 2026, prevendo um crescimento de 2% ao ano, apesar de projetar uma inflação de 5,1%. O aumento das compras em sites estrangeiros também chamou atenção, com um crescimento de 67% nos meses de junho, julho e agosto de 2026 em comparação ao mesmo período do ano anterior, após a eliminação da 'taxa das blusinhas'. Em outro movimento, a Airtel Money, empresa de pagamentos controlada por um bilionário indiano, planeja uma oferta inicial de ações (IPO) de US$ 9 bilhões em Londres, em um movimento que pode revitalizar o mercado acionário britânico.", "tecnologia": "O presidente sul-coreano Yoon Suk Yeol apresentou um plano ambicioso para dobrar a produção de chips em cinco anos e garantir a construção de cadeias de suprimento de inteligência artificial (IA) sem interrupções. Este anúncio surge em um momento em que a China avança rapidamente com a IA, descrevendo o progresso como 'velocidade chinesa'. Em um desenvolvimento relacionado, um dos ministros do Indústria e Tecnologia da Informação da China, Li Lecheng, foi nomeado secretário do Comitê Permanente do Partido em Anhui, uma província-chave para a indústria de semicondutores. Outros avanços tecnológicos incluem a apresentação de uma bateria de carro elétrico chinesa que pode ser carregada em menos de cinco minutos, bem como a expansão do mercado de óculos com inteligência artificial, com a Meta dominando 94% do mercado. Além disso, a startup Tekever, uma empresa europeia de tecnologia de drones, alcançou uma avaliação de 6,4 bilhões de dólares, em meio à campanha de reequipamento de defesa de países da região devido à guerra na Ucrânia.", "ciencia": "A NASA comemorou o marco de 200.000 órbitas do telescópio espacial Hubble, que completou 36 anos de operação com mais de 1,7 milhão de observações e uma viagem de 5 bilhões de milhas. Este feito reflete a importância contínua do Hubble na nossa compreensão do universo. Em outro avanço científico, a empresa de biotecnologia Flagship Pioneering recebeu um contrato do Departamento de Defesa para desenvolver tecnologias contra ameaças biológicas. Um estudo brasileiro sobre Thor questiona a associação moderna do deus nórdico com o trovão, sugerindo que essa conexão é mais uma influência da cultura pop. Além disso, a recuperação de uma baleia-jubarte no Parque Nacional Marinho de Abrolhos evidencia a importância da ciência na conservação marinha.", "cultura": "Alessandra Negrini retorna à Globo para protagonizar a próxima novela das sete, intitulada 'Elas que Lutem', que estreará em março de 2027. Um evento cultural importante acontece em Paris, onde foi descoberta uma parede gallo-romana que pode confirmar o local do primeiro assentamento da cidade, conforme anunciado pelo Ministério da Cultura francês. A série brasileira 'Habeas Corpus', inspirada em 'How to Get Away with Murder', estreia na Netflix, abordando temas de racismo nos tribunais. Entre as novidades artísticas, destaque para a versão em português da canção 'What's Going On' de Marvin Gaye, intitulada 'Sangue Bom', lançada por Paulo Ricardo e Seu Jorge. Também foram divulgados novos projetos artísticos, como a adaptação de 'Romeu e Julieta' por Robert Eggers, a exposição de esculturas criadas com objetos descartáveis por Magali Reus, e a homenagem ao centenário de John Coltrane no programa 'Jazz Livre', da Rádio MEC.", "sociedade": "As crianças no Irã voltaram às aulas após sete meses, lembrando-se do recente bombardeio que deixou 120 estudantes mortos. Em contraste, a geração Z está reduzindo o uso de aplicativos de relacionamento, com o Tinder perdendo usuários pagantes e o Hinge ganhando popularidade. Por outro lado, jovens australianos estão ficando mais tempo em casa devido aos altos custos imobiliários e ao estresse financeiro. A inteligência emocional se tornou a habilidade profissional mais buscada no Brasil, enquanto a PAHO e o Africa CDC pedem investimentos contínuos e cooperação entre as regiões para a preparação de futuras pandemias.", "meio_ambiente": "O Furacão Polo atingiu a categoria 5 com ventos de 270 km/h, colocando o litoral do México em alerta máximo. Além disso, a estratégia de Xàbia de enviar cabras para prevenir incêndios florestais continua a ser uma abordagem inovadora. O El Niño transforma o Deserto de Atacama, no Chile, em um cenário de flores em massa devido a chuvas excepcionalmente intensas.", "direitos_humanos": "O Tribunal Penal Internacional condenou Mahamat Saïd Abdel Kani por crimes contra a humanidade, enquanto ele comandava uma unidade policial especial no início da guerra civil na República Centro-Africana em 2013. O Supremo Tribunal Federal do Brasil enfrenta uma crise que exige medidas para proteger a igualdade racial no país, com o desafio de garantir a eficácia prática das ações afirmativas raciais. Além disso, uma mulher idosa e deficiente física de 87 anos foi expulsa de seu apartamento em Madri, com policiais usando gás lacrimogênico para dispersar os protestos. Em Myanmar, direitos humanos relatam que presas femininas estão enfrentando tortura e negligência desde o golpe militar de fevereiro de 2021, em um contexto de guerra civil prolongada na nação do Sudeste Asiático."}, "resumo_do_dia": {"politica_nacional": [{"id": 176870, "titulo": "Os números da pesquisa Atlas/Estadão sobre a eleição no Rio de Janeiro", "url": "https://veja.abril.com.br/politica/os-numeros-da-pesquisa-atlas-estadao-sobre-a-eleicao-no-rio-de-janeiro/", "fonte_id": "veja", "data_pub": "2026-09-23T15:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Atlas/Estadão analisou cenários eleitorais no Rio de Janeiro, tanto com quanto sem a participação do candidato Garotinho.", "titulo_pt": "Os números da pesquisa Atlas/Estadão sobre a eleição no Rio de Janeiro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 176776, "titulo": "Fala de Lula à ONU fez referência a livro de e ": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 176779, "titulo": "Propaganda de TV de Haddad critica ausência de Tarcísio de debate", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/propaganda-de-tv-de-haddad-critica-ausencia-de-tarcisio-de-debate.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-23T12:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A propaganda eleitoral do candidato Fernando Haddad (PT) critica a ausência do governador de São Paulo, Tarcísio de Freitas (Republicanos), de um debate promovido pela TV Record. A propaganda será exibida nesta quarta-feira (23).", "titulo_pt": "Propaganda de TV de Haddad critica ausência de Tarcísio em debate", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 176809, "titulo": "Crise no STF domina campanha eleitoral e esvazia debate sobre proposta", "url": "https://g1.globo.com/politica/blog/andreia-sadi/post/2026/09/23/crise-stf-campanha-eleitoral.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-23T12:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A crise no Supremo Tribunal Federal está dominando a campanha eleitoral e reduzindo o espaço para debates sobre propostas. O desgaste do tribunal está afetando as estratégias dos candidatos, especialmente beneficiando Flávio Bolsonaro.", "titulo_pt": "Crise no STF domina campanha e esvazia debate sobre propostas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 176780, "titulo": "Tarcísio grava com Flávio e diz querer ver Bolsonaro subir a rampa do Planalto com o filho", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/tarcisio-grava-com-flavio-e-diz-querer-ver-bolsonaro-subir-a-rampa-do-planalto-com-o-filho.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-23T12:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador de São Paulo, Tarcísio de Freitas, declarou que deseja ver Jair Bolsonaro e seu filho, Flávio Bolsonaro, candidato à Presidência, subirem juntos a rampa do Palácio do Planalto.", "titulo_pt": "Tarcísio quer ver Bolsonaro e Flávio subirem a rampa do Planalto", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 177129, "titulo": "Cristiano Zanin, do STF, rejeita pedido para instalar CPI do Banco Master", "url": "https://www.jota.info/stf/do-supremo/cristiano-zanin-do-stf-rejeita-pedido-para-instalar-cpi-do-banco-master", "fonte_id": "jota", "data_pub": "2026-09-23T12:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Cristiano Zanin, do Supremo Tribunal Federal (STF), rejeitou um pedido para instalar uma Comissão Parlamentar de Inquérito (CPI) sobre o Banco Master. Segundo ele, não há comprovação de omissão do presidente do Senado.", "titulo_pt": "Zanin, do STF, rejeita pedido para CPI sobre Banco Master", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 177634, "titulo": "Kosovo Court Orders MPs to Elect President by October 6", "url": "https://balkaninsight.com/2026/09/23/kosovo-court-orders-mps-to-elect-president-by-october-6/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-09-23T15:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Constitucional de Kosovo estabeleceu uma prazo até 6 de outubro para que os parlamentares elejam um novo presidente, caso contrário, terão que realizar novas eleições parlamentares precipitadas.", "titulo_pt": "Tribunal constitucional de kosovo determina prazo para eleição do novo presidente até 6 de outubro", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 177101, "titulo": "En un clima tenso con el Reino Unido, Javier Milei da su discurso en la ONU para reforzar el reclamo por las Malvinas", "url": "https://www.lanacion.com.ar/politica/en-un-clima-tenso-con-el-reino-unido-javier-milei-da-su-discurso-en-la-onu-para-reforzar-el-reclamo-nid23092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-23T14:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O discurso do presidente Javier Milei na Assembleia Geral da ONU foi adiado alguns minutos. Ele se pronunciou após o premier Burnham mencionar o diferendo com a Argentina sobre as Malvinas.", "titulo_pt": "Em clima tenso com o Reino Unido, Milei se pronuncia sobre as Malvinas na ONU", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 177279, "titulo": "US delegation walks out as Iran’s Pezeshkian angrily responds to Trump at UN General Assembly - live", "url": "https://www.theguardian.com/world/live/2026/sep/23/united-nations-general-assembly-unga-zelenksyy-trump-xi-china-ukraine-russia-europe-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-09-23T14:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um delegado dos Estados Unidos saiu da sessão do Conselho de Segurança das Nações Unidas, enquanto o líder iraniano respondeu com raiva a declarações do presidente americano, afirmando que os EUA os descreveram como terroristas. Essas acusações ocorrem horas antes da fala do presidente ucraniano Volodymyr Zelenskyy na Assembleia Geral das Nações Unidas.", "titulo_pt": "Delegação dos EUA sai enquanto líder iraniano responde a Trump na assembleia geral das nações unidas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 177106, "titulo": "Habla Javier Milei en la ONU, EN VIVO: “Las Malvinas están ilegalmente ocupadas por Reino Unido”, anticipó el Gobierno", "url": "https://www.lanacion.com.ar/politica/javier-milei-y-sus-medidas-en-vivo-el-canciller-quirno-se-refirio-a-malvinas-y-dijo-que-estan-nid23092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-23T14:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Javier Milei fez uma declaração na ONU sobre as Malvinas, afirmando que estão ilegalmente ocupadas pelo Reino Unido. O governo argentino fez essa declaração.", "titulo_pt": "Javier Milei fala na ONU sobre as Malvinas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 177581, "titulo": "Al-Sharaa: Occupied Golan Heights to ‘remain Syrian territory’", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/23/al-sharaa-occupied-golan-heights-to-remain-syrian?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-23T14:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sírio Ahmed al-Sharaa exigiu o retirada das forças israelenses das terras ocupadas de Golan.", "titulo_pt": "Al-sharaa: terras ocupadas de Golan vão manter-se como território sírio", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 177438, "titulo": "Azerbaijan pardons Frenchman after EU lifts sanctions on Russian billionaire", "url": "https://www.bbc.co.uk/news/articles/cwp84rrrymd0o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-23T14:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Martin Ryan, um francês, teve sua pena de prisão por suposto espionagem commutada após meses de condenação. Um segundo francês ainda permanece preso.", "titulo_pt": "Azerbaijão anula pena de francês após união europeia levantar sanções a bilionário russo", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 177212, "titulo": "Escudo de la Américas: excanciller Fernández acusa omisión de Kast y advierte que EE.UU. podría terminar pidiendo “ingreso de tropas”", "url": "https://www.latercera.com/politica/noticia/escudo-de-la-americas-excanciller-fernandez-acusa-omision-de-kast-y-advierte-que-eeuu-podria-terminar-pidiendo-ingreso-de-tropas/", "fonte_id": "la_tercera", "data_pub": "2026-09-23T14:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro chileno de Relações Exteriores, Hernán Fernández, acusou o atual governo de Chile, liderado por Gabriel Kast, de negligência e advertiu que os Estados Unidos poderiam eventualmente pedir a Chile um acordo para o ingresso de tropas norte-americanas com imunidade.", "titulo_pt": "Escudo das Américas: ex-ministro chileno acusa governo de Kast e avisa sobre possível entrada de tropas americanas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 176958, "titulo": "Trump recupera o colonialismo de saque e pilhagem", "url": "https://www.brasildefato.com.br/2026/09/23/trump-recupera-o-colonialismo-de-saque-e-pilhagem/", "fonte_id": "brasil_de_fato", "data_pub": "2026-09-23T14:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No discurso da Assembleia da ONU, Trump expressou um discurso de violência e neocolonialismo, afirmando a superioridade dos Estados Unidos. O presidente americano defendeu a ideia de que os EUA têm direito a recursos e influência de outros países por serem superiores.", "titulo_pt": "Trump defende neocolonialismo de saque e pilhagem", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 177516, "titulo": "Al-Sharaa vows Golan Heights will remain Syrian in UN speech", "url": "https://www.euronews.com/2026/09/23/al-sharaa-vows-golan-heights-will-remain-syrian-in-un-speech", "fonte_id": "euronews", "data_pub": "2026-09-23T14:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sírio Al-Sharaa declarou em uma palestra para a ONU que o Alto Golan permanecerá sob soberania síria. No dia anterior, em um painel do Atlantic Council, o presidente sírio teria afirmado publicamente a Trump que não tinha direito de reconhecer a soberania israelense sobre o Golan, brincando que o presidente americano deveria oferecer Nova Jersey para Israel em vez disso.", "titulo_pt": "Al-sharaa afirma que o alto Golan permanecerá sírio em discurso para a ONU", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 177455, "titulo": "'We can feel the RN wave coming': A traditional stronghold of French conservatives shifts right", "url": "https://www.lemonde.fr/en/international/article/2026/09/23/we-can-feel-the-rn-wave-coming-a-traditional-stronghold-of-french-conservatives-shifts-right_6757863_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-23T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No departamento rural de Seine-et-Marne, próximo a Paris, eleitores de direita têm se movido gradualmente para o partido de Marine Le Pen, o Rassemblement National, graças a uma estratégia cuidadosa de base. O avanço do extremismo de direita na Europa está se estabelecendo, com o Rassemblement National ganhando terreno em uma região historicamente conservadora.", "titulo_pt": "Podemos sentir a onda RN chegando: região tradicionalmente conservadora de França vê avanço dos direitistas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 177585, "titulo": "Can flurry of New York diplomacy lead to US-Iran diplomatic breakthrough?", "url": "https://www.aljazeera.com/news/2026/9/23/flurry-of-diplomacy-trumps-fiery-threats-us-iran-war-deal-still-elusive?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-23T13:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Analistas afirmam que um acordo entre Estados Unidos e Irã nesta semana é improvável, pois as diferenças fundamentais entre Washington e Teerã ainda não foram resolvidas.", "titulo_pt": "Pode haver uma diplomacia intensa em nova York, mas acordo entre EUA e Irã nesta semana é improvável", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 177588, "titulo": "Syria’s al-Sharaa answers questions on Israel’s violations in Syria", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/23/syrias-al-sharaa-answers-questions-on-israels-violations-in-syria?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-23T13:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sírio Ahmed al-Sharaa afirmou que o presidente americano Donald Trump deveria oferecer o estado de Nova Jersey para Israel, em vez das Alturas de Golan.", "titulo_pt": "Síria propõe que trump dê nova jersey para Israel", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 177626, "titulo": "Iran’s president addresses UN after Trump threatens ‘annihilation’", "url": "https://www.ft.com/content/31a27312-8032-4957-be69-ba32561e8db3", "fonte_id": "financial_times", "data_pub": "2026-09-23T13:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O delegado americano deixou a sala durante a palestra do presidente iraniano Masoud Pezeshkian. Antes disso, o presidente dos Estados Unidos havia ameaçado a 'aniquilação' do Irã.", "titulo_pt": "Presidente iraniano se dirige à ONU após Trump ameaçar 'aniquilação'", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 177057, "titulo": "Por que é tão relevante o encontro entre Trump e presidente da Venezuela a 15 km de onde Maduro está preso", "url": "https://www.bbc.com/portuguese/articles/cqm2mrpndjpjo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-23T13:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Houve um encontro entre o presidente dos Estados Unidos e o presidente da Venezuela durante a Assembleia Geral da ONU, apesar de o presidente venezuelano estar preso. Este encontro tem vários significados, conforme analisado por especialistas.", "titulo_pt": "Por que é tão relevante o encontro entre Trump e presidente da Venezuela a 15 km de onde Maduro está preso", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 177463, "titulo": "In the West Bank, a Palestinian attacker risks the death penalty after killing a settler", "url": "https://www.lemonde.fr/en/international/article/2026/09/23/in-the-west-bank-a-palestinian-attacker-risks-the-death-penalty-after-killing-a-settler_6757856_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-23T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um atacante palestiniano foi condenado à pena de morte após matar um colonizador israelense, em um momento em que o direito israelense está buscando implementar uma lei controversa que prevê a pena capital para assassinatos terroristas cometidos por palestinos.", "titulo_pt": "Na cisjordânia, atacante palestiniano corre risco de pena de morte após matar um colonizador", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 177269, "titulo": "Delcy Rodríguez poses with Trump in New York as Maduro languishes in jail nearby", "url": "https://www.theguardian.com/world/2026/sep/23/venezuela-delcy-rodriguez-meeting-donald-trump-new-york", "fonte_id": "guardian_world", "data_pub": "2026-09-23T12:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A presidente interina da Venezuela, Delcy Rodríguez, se reuniu com o ex-presidente dos Estados Unidos, Donald Trump, em Nova York, onde eles posaram para uma foto. Esta reunião ocorreu cerca de nove meses após Trump ordenar a prisão de Maduro, o antigo líder da Venezuela que agora está detido em uma prisão em Brooklyn.", "titulo_pt": "Delcy Rodríguez se reúne com Trump em nova York enquanto Maduro cumpre prisão", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 176726, "titulo": "TikTok se prepara para MP que pode restringir anúncios de apostas antes do primeiro turno", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/tiktok-se-prepara-para-mp-que-pode-restringir-anuncios-de-apostas-antes-do-primeiro-turno.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-23T15:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TikTok está se preparando para uma possível perda de receita com a restrição de anúncios de apostas e cassinos online, devido a uma medida provisória que pode ser editada pelo governo federal antes do primeiro turno das eleições, que ocorre em 11 dias. Outras plataformas também estão monitorando o movimento em Brasília.", "titulo_pt": "Tiktok se prepara para perda de receita com restrição de anúncios de apostas antes do primeiro turno das eleições", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 177123, "titulo": "TCU restringe conversão de multas ambientais", "url": "https://www.jota.info/opiniao-e-analise/colunas/controle-publico/tcu-restringe-conversao-de-multas-ambientais", "fonte_id": "jota", "data_pub": "2026-09-23T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal de Contas da União (TCU) limitou a conversão de multas ambientais, considerando que essa prática desobedece à regra orçamentária. A decisão entende que a conversão indireta constitui uma burla às normas estabelecidas.", "titulo_pt": "TCU restringe conversão indireta de multas ambientais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 177556, "titulo": "10-year Treasury yield leaps to fresh 19-year high after hot economic readings", "url": "https://www.cnbc.com/2026/09/23/treasury-yields-oil-inflation-fed.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-23T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos das obrigações do Tesouro dos EUA subiram para um novo pico de 19 anos após dados robustos dos setores de serviços e manufatura aumentarem as preocupações com futuros aumentos das taxas de juros pela Federal Reserve.", "titulo_pt": "Rendimentos das obrigações do tesouro atingem novo pico de 19 anos após dados econômicos quentes", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 176727, "titulo": "Diretores de empresas elevam projeção de inflação e veem juros com preocupação, di const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  }).join("");
  return `<div>

    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
