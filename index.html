<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "26/07/2026 09:31", "stats": {"noticias_novas": 647, "resumos_gerados": 210}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O ex-governador Ronaldo Caiado lançou sua candidatura à Presidência com o objetivo de se distanciar do bolsonarismo e atrair votos úteis. A convenção do PSD para oficializar essa candidatura acontece em um momento crucial, já que Caiado busca melhorar suas chances nas pesquisas. O PT confirmou que será cabeça de chapa em 12 estados e no Distrito Federal, além de formar alianças com outros partidos para apoiar candidatos em mais quatro estados. Em Minas Gerais, Lula terá de superar a falta de apoio do centro político e o legado ruim do PT, após escolher Patrus Ananias como seu vice-candidato no estado. Paralelamente, Flávio Bolsonaro participou da convenção do PL sem apoio direto de seu pai, enquanto o partido declarou-se neutro, aberto a um entendimento com outros candidatos, incluindo Lula.", "mundo": "Em Berlim, uma busca policial está em andamento após um suspeito colidir deliberadamente com seu carro contra uma multidão durante o evento de Pride na capital alemã no sábado à noite. A investigação se concentra em uma possível ação terrorista e a polícia local afirma que o suspeito tem ligações com grupos islâmicos locais. Paralelamente, incêndios florestais atingem vastas áreas na Europa, com mais de 330 mil pessoas evacuadas perto de Bordeaux, França, e as condições climáticas difíceis complicam os esforços dos bombeiros para conter as chamas. No Sudão, a situação em El Obeid está se agravando, com organizações de direitos humanos alertando para possíveis atrocidades em massa e crianças traumatizadas que não ousam ir à escola. Além disso, o Irã anunciou que vai parar com os ataques retaliatórios após os Estados Unidos terem suspendido as operações de raide.\n\nA tensão geopolítica na região do Oriente Médio continua a ser um foco de preocupação. Os Estados Unidos anunciaram uma pausa nos ataques aéreos contra o Irã, após os ataques iranianos terem sido suspensos nas últimas duas noites. No entanto, a escalada militar não foi interrompida completamente: relatos indicam que rebeldes houthis do Iêmen anunciaram novos ataques com mísseis e drones contra a Arábia Saudita. Em outro desenvolvimento, a Ucrânia atacou navios iranianos no Mar Cáspio, enquanto Israel realizou um ataque aéreo em Gaza que resultou em duas mortes e sete feridos. As tensões continuam a se espalhar: o Irã acusou a Ucrânia de uma 'invasão criminosa' e o Reino Unido de realizar ataques contra alvos houthis apoiados pelo Irã no Iêmen.", "economia": "A economia brasileira enfrenta diversos desafios. De acordo com dados do IEDI, a indústria caiu para o 69º lugar entre 90 países no ranking industrial. O governo está implementando estímulos pré-eleitorais em resposta à desaceleração econômica, após um crescimento de 1,1% do PIB nos primeiros três meses de 2026. A indústria enfrenta pressão dos chineses e a crescente venda de veículos elétricos, levando a Volkswagen a planejar cortes para tentar reverter a situação. As férias escolares proporcionaram uma oportunidade de crescimento para pequenos negócios, gerando movimento local e fortalecendo a economia das cidades. Além disso, o Brasil está se beneficiando da proibição de exportação de lítio crasso na Zâmbia, que busca processar seus recursos localmente. A Samsung também fechou contratos bilionários para fornecer chips à americana Broadcom, visando aumentar sua participação no mercado de infraestrutura de inteligência artificial.", "tecnologia": "As empresas de tecnologia dos Estados Unidos têm enfrentado uma onda significativa de demissões, cortando quase 140 mil postos de trabalho desde o início de 2026, mesmo com um aumento no investimento em inteligência artificial (IA). Este fenômeno destaca a complexidade do setor tecnológico e as incertezas econômicas que permeiam suas operações. Além disso, a China tem demonstrado uma crescente cautela na diplomacia de IA, com maiores empresas chinesas ignorando recentemente uma delegação do Congresso dos EUA durante uma visita, privando os visitantes de um insight valioso sobre o avanço da tecnologia na China. Este episódio reflete a abordagem mais seletiva adotada por Pequim em relação à diplomacia de IA.", "ciencia": "A NASA realizou o retorno do astronauta Chris Williams e dois cosmonautas russos da Estação Espacial Internacional após uma missão científica de oito meses. Essa missão contribuiu para avanços na pesquisa espacial, destacando a importância contínua das operações da Estação Espacial Internacional. Paralelamente, pesquisadores identificaram um possível ponto de virada que pode prever o desenvolvimento de demência em indivíduos com alterações relacionadas à Alzheimer no cérebro, oferecendo novas possibilidades terapêuticas. Em outro avanço científico, cientistas descobriram uma grande diversidade genética nas serpentes-aranha-cinzentas de Guam, que pode ter ajudado essa população a sobreviver à inbreedagem e se adaptar ao novo ambiente. Além disso, estudos sobre a origem dos olhos humanos foram realizados, identificando um antepassado com apenas um olho vivido há quase 600 milhões de anos como possível precursor de todos os olhos vertebrados, incluindo o humano.", "cultura": "O evento mais significativo da lista é a 24ª edição da Festa Literária Internacional de Paraty (Flip), que encerra com várias atividades. A programação principal, curada por Rita Palmeira e em homenagem à Orides Fontela, inclui uma mesa-redonda sobre morte com Ana Claudia Quintana Arantes e Camila Appel, além de um evento com a ativista e escritora Angela Davis, em celebração ao Dia da Mulher Negra Latino-Americana. A Flip também apresenta o musical 'Matilda Jr.', montado por 62 artistas em apenas uma semana, como uma das atrações mais aguardadas desta edição. Outros assuntos abordados incluem a literatura japonesa e seu sucesso nas livrarias britânicas, bem como a transformação de um antigo porco-eiro na República Tcheca em uma casa de férias moderna. Ainda há discussões sobre procedimentos estéticos masculinos, a popularidade da cão Maria Antonieta na novela 'Quem Ama Cuida', e o fim do tabu dos homens em buscar tratamentos estéticos.", "sociedade": "A evidência genética foi crucial na condenação de Sebastián Figueroa, um marplatense de 40 anos, a 30 anos de prisão por abusos sexuais cometidos entre 2010 e 2015. A decisão judicial destaca o papel da ciência forense no combate à criminalidade. Em outro desenvolvimento, a Fundação de Apoio à Escola Técnica do Rio oferece 15 mil vagas para cursos gratuitos pela internet, com as inscrições encerrando neste domingo (26). No entanto, limitações de mão-de-obra em alguns centros de cuidados após as aulas em Hong Kong impedem que todas as famílias elegíveis tenham acesso ao programa. Além disso, a longevidade está transformando a dinâmica familiar no Brasil, com avós assumindo mais responsabilidades e gastos com os netos, conforme relatado por Izede Zago, de 77 anos, que cuida do neto Theo. Por fim, municípios brasileiros têm enfrentado resistência ao aprovar leis para derrubar a cobrança da taxa do lixo, também conhecida como conta de lixo, demonstrando o descontentamento com essa medida fiscal.", "meio_ambiente": "Milhares de pessoas foram afetadas por incêndios florestais na França e Espanha, com cerca de 250 mil habitantes evacuados perto de Bordeaux. No Brasil, o desmatamento na Amazônia diminuiu nos primeiros seis meses do ano, com 588 áreas protegidas mantendo sua integridade entre janeiro e junho. Na China, fortes chuvas e ventos após o tifão Noul atingiram a província de Guangdong, levando à evacuação de mais de 340 mil pessoas e interrompendo serviços públicos temporariamente.", "direitos_humanos": "Em Minab, no Irã, um ataque devastador resultou na morte de 120 crianças e deixou muitos feridos. Uma professora local e uma mãe relataram a trágica história que ainda causa choque e dor há cinco meses após o incidente. Em Berlim, Alemanha, um veículo branco invadiu uma parada LGBTQIA+ durante um ataque, deixando um morto e vários feridos. A polícia está realizando uma operação de busca para localizar os suspeitos envolvidos no incidente. Por fim, Donald Trump criticou LeBron James, afirmando que ele 'talvez seja racista', em comparação com Michael Jordan, durante um questionamento sobre escolher entre os dois jogadores famosos. Estes eventos ilustram a variedade de desafios enfrentados pelos direitos humanos em diferentes partes do mundo."}, "resumo_do_dia": {"politica_nacional": [{"id": 72954, "titulo": "LeBron vai aos 76ers e aceita corte salarial de 93%", "url": "https://www.poder360.com.br/poder-sportsmkt/lebron-vai-aos-76ers-e-aceita-corte-salarial-de-93/", "fonte_id": "poder360", "data_pub": "2026-07-26T11:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "LeBron James trocou de equipe, passando dos Lakers para os 76ers e aceitou um corte significativo no salário, de US$ 52,6 milhões para US$ 3,8 milhões na próxima temporada.", "titulo_pt": "Lebron vai para os 76ers e reduz salário em 93%", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 72955, "titulo": "Diamante superprofundo revela como água pode ir mais fundo na Terra", "url": "https://www.poder360.com.br/poder-sustentavel/diamante-superprofundo-revela-como-agua-pode-ir-mais-fundo-na-terra/", "fonte_id": "poder360", "data_pub": "2026-07-26T11:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo indica que a goethita pode transportar água até as rochas da região do manto inferior. Este achado reforça a hipótese de que a água pode ir mais profundamente na Terra.", "titulo_pt": "Diamante superprofundo revela como água pode ir mais fundo na Terra", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 72966, "titulo": "Ausências na convenção de Caiado revelam pragmatismo eleitoral", "url": "https://veja.abril.com.br/politica/ausencias-na-convencao-de-caiado-revelam-pragmatismo-eleitoral/", "fonte_id": "veja", "data_pub": "2026-07-26T11:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Paes, Raquel Lyra e Mateus Simões, apesar de filiados ao PSD, apoiam candidatos diferentes à Presidência. O governador Tarcísio também não deve participar da convenção.", "titulo_pt": "Ausências na convenção de Caiado refletem apoios eleitorais", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 72987, "titulo": "Lindbergh critica convenção de Flávio: \"Completamente fracassada\"", "url": "https://www.metropoles.com/brasil/lindbergh-critica-convencao-de-flavio-completamente-fracassada", "fonte_id": "metropoles", "data_pub": "2026-07-26T11:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio lançou sua candidatura à presidência sem vice na convenção deste sábado, com a presença de Milei e aliados. Lindbergh criticou a convenção como completamente fracassada.", "titulo_pt": "Lindbergh critica convenção de Flávio: 'completamente fracassada'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 72956, "titulo": "Espécies exóticas de moluscos no Brasil aumentam 215% em 15 anos", "url": "https://www.poder360.com.br/poder-sustentavel/especies-exoticas-de-moluscos-n : "https://veja.abril.com.br/politica/caiado-lanca-candidatura-com-desafio-de-atacar-bolsonarismo-e-buscar-voto-util/", "fonte_id": "veja", "data_pub": "2026-07-26T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-governador de Goiás lançou sua candidatura à Presidência com o objetivo de atacar o bolsonarismo e buscar o 'voto útil'. A confirmação da candidatura será feita em uma convenção partidária neste domingo.", "titulo_pt": "Caiado lança candidatura contra bolsonarismo e busca voto útil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 73003, "titulo": "Energia limpa para quem? Debate questiona a narrativa dominante sobre os impactos ambientais de megaempreendimentos", "url": "https://www.brasildefato.com.br/2026/07/26/energia-limpa-para-quem-debate-questiona-a-narrativa-dominante-sobre-os-impactos-ambientais-de-megaempreendimentos/", "fonte_id": "brasil_de_fato", "data_pub": "2026-07-26T10:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O debate sobre os impactos ambientais de megaempreendimentos, promovido pelo Intervozes – Coletivo Brasil de Comunicação Social, ocorreu nesta quinta-feira. O evento questiona a narrativa dominante sobre a energia limpa.", "titulo_pt": "Energia limpa para quem? Debate questiona a narrativa dominante sobre os impactos ambientais de megaempreendimentos", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 72961, "titulo": "Estudos contestam associação entre testosterona e masculinidade", "url": "https://www.poder360.com.br/poder-saude/estudos-contestam-associacao-entre-testosterona-e-masculinidade/", "fonte_id": "poder360", "data_pub": "2026-07-26T10:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudos sugerem que variáveis como treinamento, sono e ambiente social têm maior impacto na força física e no comportamento do que a testosterona. Os fatores ambientais parecem desempenhar um papel mais significativo.", "titulo_pt": "Estudos contestam associação entre testosterona e masculinidade", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 72962, "titulo": "BB simplifica abertura de contas eleitorais para 2026", "url": "https://www.poder360.com.br/poder-eleicoes-2026/bb-simplifica-abertura-de-contas-eleitorais-para-2026/", "fonte_id": "poder360", "data_pub": "2026-07-26T10:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos poderão abrir os registros financeiros para as eleições de 2026 pelo aplicativo da estatal sem a necessidade de comparecer presencialmente às agências.", "titulo_pt": "BB simplifica abertura de contas eleitorais para 2026", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 72994, "titulo": "Lula foca em aumentar aprovação do governo antes do início da campanha", "url": "https://www.metropoles.com/colunas/igor-gadelha/lula-foca-em-aumentar-aprovacao-do-governo-antes-do-inicio-da-campanha", "fonte_id": "metropoles", "data_pub": "2026-07-26T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula está concentrado no aumento da aprovação do governo para iniciar a campanha com mais espaço. O objetivo é apresentar propostas e defender seu legado de maneira mais eficaz.", "titulo_pt": "Lula foca em aumentar aprovação antes da campanha", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 72922, "titulo": "Parente de Maluf se candidata a deputado reciclando marcas do ex-prefeito", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/parente-de-maluf-se-candidata-a-deputado-reciclando-marcas-do-ex-prefeito.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Albertinho Maluf, candidato a deputado estadual pelo partido PP, fará campanha usando símbolos e projetos associados ao parente famoso Paulo Maluf, ex-prefeito e ex-governador.", "titulo_pt": "Parente de Maluf se candidata a deputado reciclando marcas do ex-prefeito", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 73499, "titulo": "Iran says halts Middle East attacks as US holds fire", "url": "https://www.koreaherald.com/article/10820607", "fonte_id": "korea_herald", "data_pub": "2026-07-26T11:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Irã declarou que suspendeu suas retaliatórias contra aliados dos Estados Unidos no Oriente Médio após Washington ter paralisado seus ataques nas últimas duas noites. Os Estados Unidos pausaram a guerra, que se aproxima de seu quinto mês, e relatos indicam que a escassez de munições está restringindo planos para uma escalada adicional.", "titulo_pt": "Irã anuncia fim de ataques após EUA suspenderem suas operações", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 73258, "titulo": "Europe wildfires: ‘Difficult hours lie ahead’ in battle to contain fires, says Pedro Sanchez as more than 300,000 flee homes in France and Spain", "url": "https://www.theguardian.com/world/live/2026/jul/26/europe-wildfires-spain-france-bordeaux-madrid-evacuations", "fonte_id": "guardian_world", "data_pub": "2026-07-26T11:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 300 mil pessoas tiveram que deixar suas casas devido a incêndios na França e Espanha. O primeiro-ministro espanhol, Pedro Sánchez, disse que as horas difíceis estão pela frente na luta para conter os incêndios. Os cientistas atribuem esses eventos extremos ao aquecimento global, que está acelerando o ritmo de deslocamento de pessoas e operações de evacuação civil em larga escala.", "titulo_pt": "Incêndios na Europa: ‘tempo difícil se aproxima’ na batalha contra as chamas, diz Pedro sánchez com mais de 300 mil pessoas deixando suas casas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 73305, "titulo": "Firefighters battle wildfire as tens of thousands evacuated near Bordeaux", "url": "https://www.bbc.co.uk/news/articles/clyj8k4nn5jo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-26T11:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 330 mil pessoas foram evacuadas devido a incêndios florestais na França e Espanha. Os bombeiros estão lutando contra um grande incêndio perto de Bordeaux.", "titulo_pt": "Bombeiros combatem incêndio em massa perto de Bordeaux enquanto 330 mil são evacuados", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 73025, "titulo": "EUA suspendem ataques aéreos ao Irã, mas tensão permanece em meio a negociações", "url": "https://www.infomoney.com.br/mundo/eua-suspendem-ataques-aereos-ao-ira-mas-tensao-permanece-em-meio-a-negociacoes/", "fonte_id": "infomoney", "data_pub": "2026-07-26T11:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos suspenderam os ataques aéreos contra o Irã, mas a tensão na região persiste. No sábado, rebeldes houthis do Iêmen anunciaram novos ataques com mísseis e drones contra a Arábia Saudita.", "titulo_pt": "EUA suspendem ataques aéreos ao Irã, mas tensão permanece em meio a negociações", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 73304, "titulo": "What we know so far about the Berlin Pride ramming attack", "url": "https://www.bbc.co.uk/news/articles/cevmdxz4872o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-26T11:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma busca policial está em andamento após um suspeito colidir deliberadamente com um carro contra uma multidão durante um evento de Pride na capital alemã no sábado à noite.", "titulo_pt": "O que sabemos até agora sobre o ataque de ramificação durante o evento Pride em berlim", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 73416, "titulo": "Le spiagge della Normandia del D-Day iscritte nel patrimonio Unesco", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/26/le-spiagge-della-normandia-del-d-day-iscritte-nel-patrimonio-unesco_b8d68bd7-6fae-4495-a5d1-8bd4e00f896b.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-26T11:24:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "As praias da Normandia usadas no D-Day foram inscritas no patrimônio Unesco. Este é o culminar de um projeto que começou há quase 20 anos.", "titulo_pt": "Praias da Normandia do D-Day inscritas no patrimônio Unesco", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 73378, "titulo": "Anti-war protesters demand end to US use of UK airbase to strike Iran", "url": "https://www.aljazeera.com/video/newsfeed/2026/7/26/anti-war-protesters-demand-end-to-us-use-of-uk-airbase-to-strike-iran?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-26T11:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestantes anti-guerra se manifestaram perto de uma base aérea britânica contra o uso das instalações por forças americanas para bombardear Irã.", "titulo_pt": "Manifestantes anti-guerra exigem fim do uso da base aérea britânica pelos EUA para atacar o Irã", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 73223, "titulo": "Live Updates: Extreme Heat and Strong Winds Fuel Wildfires in France and Spain", "url": "https://www.nytimes.com/live/2026/07/26/world/france-spain-wildfires-evacutions", "fonte_id": "nyt_world", "data_pub": "2026-07-26T11:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Incêndios estão sendo combatidos enquanto outros foram controlados, e centenas de milhares de pessoas foram obrigadas a se mudar. Um novo período de calor previsto para Europa pode piorar as condições.", "titulo_pt": "Atualizações em tempo real: calor extremo e vientos fortes agravam incêndios na França e Espanha", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 73426, "titulo": "Japan, Philippines and the U.S. complete exercises in South China Sea", "url": "https://www.japantimes.co.jp/news/2026/07/26/japan/south-china-sea-military-exercise/", "fonte_id": "japan_times", "data_pub": "2026-07-26T11:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças armadas japonesas, filipinas e americanas realizaram exercícios no Mar do Sul da China. Os exercícios demonstram o comprometimento das Filipinas em garantir a liberdade de navegação e voo nessa área.", "titulo_pt": "Japão, filipinas e estados unidos concluem exercícios no mar do sul da China", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 73417, "titulo": "Zuppi su caso Fakir, valutare errori è nell'interesse della polizia", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/26/zuppi-su-caso-fakir-valutare-errori-e-nellinteresse-della-polizia_668b5c24-4c24-41c2-a990-f7d642a089b1.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-26T11:09:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O cardíneo Zuppi discursou sobre o caso Fakir, enfatizando a importância de avaliar os erros cometidos pela polícia. Ele destacou que este é um interesse compartilhado da polícia.", "titulo_pt": "Zuppi sobre caso Fakir: avaliar erros é interesse da polícia", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 73347, "titulo": "Ukraine strikes Russian Iran-bound cargo as Iran war widens", "url": "http://www.euronews.com/2026/07/26/ukraine-strikes-russian-iran-bound-cargo-as-iran-war-widens", "fonte_id": "euronews", "data_pub": "2026-07-26T11:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ucrânia afirma ter atacado rotas de longo alcance transportando equipamentos militares russos destinados ao Irã, enquanto Zelensky afirma que Moscou forneceria dados satelitais para ataques a instalações americanas no Oriente Médio.", "titulo_pt": "Ucrânia ataca rotas de longo alcance com equipamentos militares russos destinados ao Irã, diz zelensky", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 73418, "titulo": "Il Papa, preoccupato per l'inasprirsi della violenza in Terra Santa", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/26/il-papa-preoccupato-per-linasprirsi-della-violenza-in-terra-santa_afaf4f06-de10-42df-b6be-a9f1e9cb31e6.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-26T11:05:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O Papa expressou preocupação com o agravamento da violência na Terra Santa. Ele considerou que a solução não reside apenas nas ações militares e decisões unilaterais.", "titulo_pt": "O Papa se preocupa com o aumento da violência na Terra Santa", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 73363, "titulo": "US says it will maintain Iran naval blocakade, redirects 12 vessels", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/us-says-it-will-maintain-iran-naval-blocakade-redirects-12-vessels", "fonte_id": "middle_east_eye", "data_pub": "2026-07-26T11:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos confirmaram que manterão o bloqueio naval contra a Irã, redirecionando 12 navios comerciais e desabilitando dois que não se submeteram. A força americana também interveio em um navio que tentou violar o bloqueio perto do Estreito de Ormuz no fim de semana.", "titulo_pt": "EUA confirmam manutenção do bloqueio naval contra a Irã e redirecionam 12 embarcações", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 72959, "titulo": "Empresariado negocia com qualquer país, diz setor de minerais críticos", "url": "https://www.poder360.com.br/poder-economia/empresariado-negocia-com-qualquer-pais-diz-setor-de-minerais-criticos/", "fonte_id": "poder360", "data_pub": "2026-07-26T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O empresariado de minerais críticos negocia com qualquer país, segundo o setor. Empresas mineradoras estão abertas a investimentos tanto dos Estados Unidos e da União Europeia quanto da China.", "titulo_pt": "Empresariado de minerais críticos negocia com qualquer país", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 73413, "titulo": "US pauses Iran strikes as Oman pursues Hormuz transit deal", "url": "https://www.ft.com/content/ffdeacf0-91b8-48fd-9ff8-d8d134ef5f11?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-26T10:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nem lado nem outro realiza ataques por segunda noite consecutiva, enquanto mediadores buscam evitar o retorno a uma guerra total. As duas partes continuam em um estado de tensão moderada.", "titulo_pt": "EUA pausam ataques iranianos enquanto omã busca acordo para transito pelo estreito de Ormuz", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 73101, "titulo": "Quem são os funcionários americanos que tiveram visto negado pelo Itamaraty", "url": "https://www.bbc.com/portuguese/articles/cn9n112x9v5o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-26T10:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo americano declarou que a missão era uma 'visita de rotina' e considerou as acusações como 'mentiras sem fundamento'.", "titulo_pt": "Quem são os funcionários americanos cujos vistos foram negados pelo Itamaraty", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 73024, "titulo": "IA muda o research, mas fator humano ganha peso", "url": "https://www.infomoney.com.br/advisor/ia-muda-research-mas-fator-humano-ganha-peso/", "fonte_id": "infomoney", "data_pub": "2026-07-26T11:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas afirmam que algoritmos automatizam tarefas e aceleram a análise, mas a interpretação, contexto e confiança continuam sendo fatores decisivos no mercado financeiro. A postagem original foi publicada em InfoMoney.", "titulo_pt": "IA altera pesquisa, mas o fator humano ganha peso", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 73026, "titulo": "Após resistência em 2022, Janja muda postura e busca aproximação com evangélicos", "url": "https://www.infomoney.com.br/politica/apos-resistencia-em-2022-janja-muda-postura-e-busca-aproximacao-com-evangelicos/", "fonte_id": "infomoney", "data_pub": "2026-07-26T11:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Janja, primeira-dama do estado de São Paulo, está mudando sua postura após a resistência em 2022 e agora busca aproximar-se dos evangélicos. No entanto, seus posicionamentos, como a defesa da aprovação do projeto que criminaliza a misoginia, ainda são considerados obstáculos.", "titulo_pt": "Após resistência em 2022, Janja muda postura e busca aproximação com evangélicos", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 72976, "titulo": "Pressionada pelos chineses e pela revolução dos elétricos, Volkswagen enfrenta crise inédita", "url": "https://veja.abril.com.br/economia/pressionada-pelos-chineses-e-pela-revolucao-dos-eletricos-volkswagen-enfrenta-crise-inedita/", "fonte_id": "veja", "data_pub": "2026-07-26T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Volkswagen enfrenta uma crise inédita devido à pressão dos chineses e ao avanço das vendas de veículos elétricos. A empresa está implementando um plano de cortes para tentar reverter a situação.", "titulo_pt": "Volkswagen enfrenta crise inédita pressionada pelos chineses e pela revolução dos elétricos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 73027, "titulo": "FIIs de renda urbana ainda têm muito espaço para crescer, diz gestor do RBVA11", "url": "https://www.infomoney.com.br/onde-investir/fiis-de-renda-urbana-ainda-tem-muito-espaco-para-crescer-diz-gestor-do-rbva11/", "fonte_id": "infomoney", "data_pub": "2026-07-26T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os fundos imobiliários de renda urbana têm potencial para crescer significativamente, segundo o gestor do RBVA11. Esses FIIs devem desempenhar um papel importante na expansão da indústria de fundos imobiliários.", "titulo_pt": "Fiis de renda urbana ainda têm muito espaço para crescer, diz gestor", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 73037, "titulo": "Sanidade animal se torna diferencial econômico para pecuária brasileira", "url": "https://www.cnnbrasil.com.br/agro/sanidade-animal-se-torna-diferencial-economico-para-pecuaria-brasileira/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-26T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O reconhecimento internacional e os investimentos em prevenção sanitária fortalecem a competitividade da carne brasileira, que enfrenta um mercado cada vez mais exigente.", "titulo_pt": "Sanidade animal se torna diferencial econômico para a pecuária brasileira", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 73038, "titulo": "Juro alto e produtividade pesam na indústria, diz professor", "url": "https://www.cnnbrasil.com.br/economia/macroeconomia/juro-alto-e-produtividade-pesam-na-industria-diz-professor/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-26T10:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indústria brasileira caiu para a 69ª posição entre 90 países no ranking industrial, segundo dados do IEDI. Este é o segundo ano consecutivo que o país registra uma posição decrescente.", "titulo_pt": "Juro alto e produtividade pesam na indústria, diz professor", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 73153, "titulo": "La baja de tasas impulsada por el Gobierno le llegó a las empresas, pero todavía no a las familias", "url": "https://www.lanacion.com.ar/economia/la-baja-de-tasas-impulsada-por-el-gobierno-le-llego-a-las-empresas-pero-todavia-no-a-las-familias-nid26072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-26T10:21:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos do sistema financeiro diminuíram de 35% em janeiro para cerca de 20% em julho, e o custo dos empréstimos para empresas caiu para 25,6%, mas os empréstimos pessoais apenas reduziram de 68% a 64,8%. A mora das famílias permanece alta em 12,8%", "titulo_pt": "A baixa nas taxas governamentais beneficiou empresas, mas não as famílias", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 73028, "titulo": "Private equity da América Latina gera valor mais rápido, mas tropeça em IA", "url": "https://www.infomoney.com.br/business/private-equity-da-america-latina-gera-valor-mais-rapido-mas-tropeca-em-ia/", "fonte_id": "infomoney", "data_pub": "2026-07-26T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da FTI Consulting indica que os líderes do private equity na América Latina estão gerando valor mais rapidamente através de conversão de caixa e otimização do capital de giro no portfólio. No entanto, eles enfrentam desafios relacionados à inteligência artificial.", "titulo_pt": "Private equity da América Latina gera valor mais rápido, mas encontra obstáculos com IA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 73104, "titulo": "Carf limita dedução de juros pagos pela Braskem a empresa na Holanda por regime privilegiado", "url": "https://www.jota.info/tributos/carf-limita-deducao-de-juros-pagos-pela-braskem-a-empresa-na-holanda-por-regime-privilegiado", "fonte_id": "jota", "data_pub": "2026-07-26T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho de Contribuintes (CARF) proibiu a dedução de juros pagos pela Braskem à empresa na Holanda através do regime privilegiado. Isso afeta o abatimento das despesas da ba eligencia-artificial/o-erro-humano-por-tras-da-fuga-de-modelos-da-openai/", "fonte_id": "exame", "data_pub": "2026-07-26T06:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um erro humano deixou uma conexão aberta que permitiu aos sistemas da OpenAI acessarem a internet e explorarem outras plataformas. A origem do problema pode estar relacionada a falhas humanas.", "titulo_pt": "O erro humano por trás da fuga de modelos da OpenAI", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 73077, "titulo": "Por que usar IA custa dinheiro mesmo depois que ela já foi treinada?", "url": "https://exame.com/inteligencia-artificial/por-que-usar-ia-custa-dinheiro-mesmo-depois-que-ela-ja-foi-treinada/", "fonte_id": "exame", "data_pub": "2026-07-26T06:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mesmo após o treinamento, os modelos de inteligência artificial continuam requerendo grande consumo de energia e recursos computacionais a cada solicitação dos usuários. Isso significa que o custo operacional persiste mesmo depois da fase de treinamento.", "titulo_pt": "Por que usar IA ainda custa dinheiro após o treinamento?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 73514, "titulo": "Lee touts S. Korea's growth potential in Silicon Valley", "url": "https://www.koreaherald.com/article/10820470", "fonte_id": "korea_herald", "data_pub": "2026-07-26T05:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sul-coreano Lee Jae Myung enfatizou o potencial de sinergia entre a Coreia do Sul e os Estados Unidos, sugerindo que uma colaboração poderia gerar novas empresas de grande porte como asSamsung e Hyundai. Essa possibilidade se baseia na habilidade tecnológica das empresas sul-coreanas, sua capacidade de execução rápida, infraestrutura digital avançada, talento humano e cultura.", "titulo_pt": "Lee destaca potencial de crescimento da Coreia do sul em Silicon Valley", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 73411, "titulo": "Why workers are nostalgic for life before AI", "url": "https://www.ft.com/content/2ddef625-df80-4690-9475-f3ce86171593?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-26T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitos profissionais de classe média superior se preocupam com a tecnologia inibindo a criatividade e cometendo erros.", "titulo_pt": "Por que trabalhadores sentem saudade da era antes do AI", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 73148, "titulo": "Qué significa realmente que un producto diga “Made in USA”: la FTC cuestiona etiquetas de varias empresas", "url": "https://www.lanacion.com.ar/estados-unidos/que-significa-realmente-que-un-producto-diga-made-in-usa-la-ftc-cuestiona-etiquetas-de-varias-nid26072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-26T11:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A FTC (Comissão de Comércio Federal) questiona as etiquetas de várias empresas sobre o que significa realmente quando um produto diz 'Made in USA'. O objetivo é evitar fraudes comerciais e garantir que as exigências estabelecidas pela FTC sejam cumpridas para validar o verdadeiro origem do produto.", "titulo_pt": "O que significa realmente ‘feito nos EUA’: FTC questiona etiquetas de várias empresas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 73260, "titulo": "Why it took so long to talk about perimenopause", "url": "https://www.vox.com/health/496667/perimenopause-womens-health-history", "fonte_id": "vox", "data_pub": "2026-07-26T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A medicina avançou significativamente, prolongando a expectativa de vida e eliminando doenças que eram consideradas fatais. No entanto, há um grande vácuo no cuidado à saúde feminina.", "titulo_pt": "Por que demorou tanto para discutir a perimenopausa?", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 73534, "titulo": "NASA Astronaut Chris Williams, Crewmates Return from Space Station", "url": "https://www.nasa.gov/news-release/nasa-astronaut-chris-williams-crewmates-return-from-space-station/", "fonte_id": "nasa_news", "data_pub": "2026-07-26T10:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O astronauta Chris Williams, da NASA, e dois cosmonautas russos, Sergey Kud-Sverchkov e Sergei Mikaev, concluíram uma missão científica de oito meses na Estação Espacial Internacional e retornaram à Terra em 30 de setembro de 2023.", "titulo_pt": "Astronauta Chris Williams e equipe retornam da estação espacial", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 73524, "titulo": "As wildfires grip France and Spain, what are the risks from the smoke?", "url": "https://phys.org/news/2026-07-wildfires-france-spain.html", "fonte_id": "phys_org", "data_pub": "2026-07-26T10:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fumaça proveniente das queimadas apresenta várias ameaças à saúde, especialmente para pessoas com doenças respiratórias pré-existentes. As pessoas mais vulneráveis incluem crianças, idosos e indivíduos com condições médicas específicas.", "titulo_pt": "Queimadas atingem França e Espanha: quais são os riscos da fumaça?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 73529, "titulo": "A hidden Alzheimer’s tipping point may decide who gets dementia", "url": "https://www.sciencedaily.com/releases/2026/07/260726015257.htm", "fonte_id": "science_daily", "data_pub": "2026-07-26T10:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas identificaram um possível ponto de virada que pode determinar se as mudanças relacionadas à Alzheimer no cérebro levam ao demência. A resposta das células imunológicas do cérebro às placas e tau pode ser o fator chave, oferecendo uma nova possibilidade para alvos terapêuticos.", "titulo_pt": "Um ponto de virada oculto do Alzheimer pode decidir quem desenvolve demência", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 73548, "titulo": "I'm not an astronaut, but I went to the International Space Station (sort of)", "url": "https://www.space.com/space-exploration/international-space-station/im-not-an-astronaut-but-i-went-to-the-international-space-station-sort-of", "fonte_id": "space_com", "data_pub": "2026-07-26T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto destaca a importância da existência e continuidade da Estação Espacial Internacional, sugerindo que ela merece admiração.", "titulo_pt": "Eu não sou astronauta, mas fui à estação espacial internacional (na verdade, sortida)", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 73525, "titulo": "Scotland declares 'major' wildfire in Cairngorms national park", "url": "https://phys.org/news/2026-07-scotland-declares-major-wildfire-cairngorms.html", "fonte_id": "phys_org", "data_pub": "2026-07-26T09:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais estão ocorrendo em uma escala 'maior' no Parque Nacional Cairngorms, na Escócia. Autoridades recomendaram que os residentes evacuassem as áreas afetadas.", "titulo_pt": "Escócia declara 'major' incêndio florestal no parque nacional Cairngorms", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 73526, "titulo": "Thousands crowd shelters as wildfires force exodus in France, Spain", "url": "https://phys.org/news/2026-07-thousands-crowd-wildfires-exodus-france.html", "fonte_id": "phys_org", "data_pub": "2026-07-26T09:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas se abrigaram em instalações de emergência na França e Espanha após incêndios florestais forçarem mais de 300 mil a deixar suas casas e locais de férias.", "titulo_pt": "Milhares se abrigam em refúgios enquanto incêndios causam desalojamento na França e Espanha", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72920, "titulo": "Idiomas podem ter alcançado pico de diversidade no mundo há 3.000 anos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/07/idiomas-podem-ter-alcancado-pico-de-diversidade-no-mundo-ha-3000-anos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diversidade linguística do planeta aumentou rapidamente após a domesticação de animais e plantas, e começou a declinar apenas com o surgimento dos primeiros grandes impérios. A diversidade linguística atingiu seu pico há aproximadamente 3.000 anos.", "titulo_pt": "Idiomas podem ter alcançado pico de diversidade no mundo há 3.000 anos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 73530, "titulo": "Inside the Backrooms: The internet’s creepiest place is becoming a tourist attraction", "url": "https://www.sciencedaily.com/releases/2026/07/260726015254.htm", "fonte_id": "science_daily", "data_pub": "2026-07-26T08:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Backrooms começou como uma única imagem assustadora de salas amarelas vazias, mas usuários da internet transformaram-no em um vasto mundo fictício que se sente estranhamente real. Através de vídeos, jogos, mapas e guias de sobrevivência nas redes sociais, os espectadores não apenas assistem ao horror se desenrolar, mas também contribuem para a construção e exploração deste espaço.", "titulo_pt": "Dentro dos Backrooms: o lugar mais assustador da internet está se tornando um destino de turismo virtual", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 73070, "titulo": "Como um escudo de plasma pode proteger a Terra de tempestades solares", "url": "https://exame.com/ciencia/como-um-escudo-de-plasma-pode-proteger-a-terra-de-tempestades-solares/", "fonte_id": "exame", "data_pub": "2026-07-26T07:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto visa satélites que criariam uma barreira de plasma para proteger redes elétricas, satélites e sistemas de comunicação da Terra contra tempestades solares.", "titulo_pt": "Como um escudo de plasma pode proteger a Terra de tempestades solares", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 73531, "titulo": "Hidden genetic diversity helped inbred brown tree snakes conquer guam", "url": "https://www.sciencedaily.com/releases/2026/07/260726015236.htm", "fonte_id": "science_daily", "data_pub": "2026-07-26T07:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores descobriram mais de 19.000 diferenças genéticas significativas nos serpentes-aranha-cinzentas, muitas delas relacionadas ao sistema imunológico e ao olfato. Essa diversidade genética oculta pode ter ajudado a população dessas serpentes, fundada por apenas algumas indivíduos, a sobreviver à inbreedagem e se adaptar ao novo ambiente em Guam.", "titulo_pt": "Diversidade genética escondida auxiliou as serpentes-aranha-cinzentas a conquistarem guam", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 73083, "titulo": "Além da perda de peso: estudo aponta efeito de Ozempic e Mounjaro nos cabelos", "url": "https://exame.com/ciencia/alem-da-perda-de-peso-estudo-aponta-efeito-de-ozempic-e-mounjaro-nos-cabelos/", "fonte_id": "exame", "data_pub": "2026-07-26T06:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo comparou quase 40 mil pacientes e constatou um aumento discreto no risco de calvície entre os usuários de medicamentos GLP-1, como Ozempic e Mounjaro.", "titulo_pt": "Além da perda de peso: estudo aponta efeito de Ozempic e Mounjaro nos cabelos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 73532, "titulo": "Scientists trace the shocking origin of human eyes to an ancient “cyclops”", "url": "https://www.sciencedaily.com/releases/2026/07/260725105554.htm", "fonte_id": "science_daily", "data_pub": "2026-07-26T05:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores identificaram um antepassado com apenas um olho, que viveu há quase 600 milhões de anos, como o possível precursor de todos os olhos vertebrados, incluindo o humano. Acredita-se que a estrutura ocular central deste ancestral persista hoje na glândula pineal, responsável por sincronizar nosso ciclo de sono com a luz do dia.", "titulo_pt": "Ciclope ancestral pode ter dado origem aos olhos humanos", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 73533, "titulo": "NASA and ESA facilities avoid major damage from wildfires in Spain", "url": "https://spacenews.com/nasa-and-esa-facilities-avoid-major-damage-from-wildfires-in-spain/", "fonte_id": "spacenews", "data_pub": "2026-07-26T02:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Instalações de solo operadas pela NASA e ESA na Espanha evitaram danos significativos causados por grandes incêndios florestais no país.", "titulo_pt": "NASA e ESA evitam danos graves em instalações na Espanha devido a incêndios", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 73527, "titulo": "'I can't work in the farce of climate change cruise tourism anymore': Why Antarctic guides quit their dream jobs", "url": "https://phys.org/news/2026-07-farce-climate-cruise-tourism-anymore.html", "fonte_id": "phys_org", "data_pub": "2026-07-26T00:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antigos guias de turismo antártico relataram que, durante suas viagens, observavam a derivaça de grandes geleiras, o que os deixava tristes. No entanto, os passageiros estavam felizes e os guias questionavam-se se não deveriam perceber as implicações ambientais.", "titulo_pt": "Eu não posso mais trabalhar na comédia da turismo antárctico em relação ao clima: por que os guias deixaram seus sonhos profissionais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 73146, "titulo": "Los riesgos de fanatizarse con entrenar y los 5 errores más comunes", "url": "https://www.lanacion.com.ar/salud/los-riesgos-de-fanatizarse-con-entrenar-y-los-5-errores-mas-comunes-nid26072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-26T11:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A fatiga crônica e a alteração do sono indicam estresse por sobrecarga de treinamento. Há cinco erros comuns na alimentação que podem comprometer o desempenho no treinamento.", "titulo_pt": "Riscos de se fanatizar com o treinamento e os 5 erros mais comuns", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 72942, "titulo": "'Quem Ama Cuida': Maria Antonieta, carismática cachorrinha da vilã, vira xodó nacional", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/televisao/2026/07/quem-ama-cuida-maria-antonieta-carismatica-cachorrinha-da-vila-vira-xodo-nacional.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-26T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A novela 'Quem Ama Cuida', exibida pela Globo, tem sido bem recebida pelo público. Um personagem em destaque é Meg, um cachorro que interpreta Maria Antonieta, a cães da vilã Pilar, ganhando popularidade.", "titulo_pt": "Quem Ama Cuida': cachorrinha carismática vira xodó nacional", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 72973, "titulo": "Fim de um tabu: homens exibem e assumem procedimentos estéticos", "url": "https://veja.abril.com.br/comportamento/fim-de-um-tabu-homens-exibem-e-assumem-procedimentos-esteticos/", "fonte_id": "veja", "data_pub": "2026-07-26T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O uso de procedimentos estéticos não se limita mais ao público feminino, com homens também exibindo e assumindo essas práticas. Este é o fim de um tabu que historicamente restringia tais tratamentos a mulheres.", "titulo_pt": "Fim do tabu: homens adotam procedimentos estéticos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 73537, "titulo": "From author to anime hero: the unlikely revival of a Japanese literary star", "url": "https://www.theguardian.com/books/2026/jul/26/from-author-to-anime-hero-the-unlikely-revival-of-a-japanese-literary-star", "fonte_id": "guardian_culture", "data_pub": "2026-07-26T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de setenta anos após sua publicação, os romances sombrios de Osamu Dazai se tornaram um fenômeno editorial, atraindo uma nova geração de leitores com seu pessimismo, humor e genialidade. A literatura japonesa tem sido um dos maiores sucessos nas livrarias britânicas recentemente, com quase metade dos títulos mais vendidos em 2024 sendo de ficção japonesa traduzida.", "titulo_pt": "Do autor ao herói do anime: o improvável renascimento de uma estrela literária japonesa", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 73538, "titulo": "Luke Combs review – regular Joe megastar brings the arena-sized party home", "url": "https://www.theguardian.com/music/2026/jul/26/luke-combs-review-regular-joe-megastar-brings-the-arena-sized-party-home", "fonte_id": "guardian_culture", "data_pub": "2026-07-26T10:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Luke Combs, o maior artista country em vendas de todos os tempos, realizou um show no Murrayfield Stadium em Edimburgo. Embora ele mantenha uma postura humilde, sua voz potente e hits impactantes garantiram duas horas de entretenimento para a multidão.", "titulo_pt": "Resenha de luke Combs – megastar do country traz a festa do estádio para casa", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 73543, "titulo": "Lenka Milerová Architektka transforms stone pigsty in Czech Republic into holiday home", "url": "https://www.dezeen.com/2026/07/26/lenka-milerova-architektka-panosi-ujezd-summer-house/", "fonte_id": "dezeen", "data_pub": "2026-07-26T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estúdio local Lenka Milerová Architektka transformou um antigo porco-eiro na República Tcheca em uma casa de férias chamada Panoší Újezd Summer House, complementando as paredes de pedra rústicas com adições em concreto exposto. A residência foi criada para o proprietário da casa adjacente e está nomeada após o vilarejo próximo.", "titulo_pt": "Lenka Milerová arquiteta transforma porco-eiro na república tcheca em casa de verão", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 73428, "titulo": "How foreign workers became an essential part of Japan’s ubiquitous konbini", "url": "https://www.japantimes.co.jp/community/2026/07/26/convenience-stores-foreign-workers/", "fonte_id": "japan_times", "data_pub": "2026-07-26T09:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Embora a maioria dos trabalhadores estrangeiros seja relativamente nova no Japão, funcionários das lojas de conveniência afirmam que eles exibem habilidades impressionantes em língua e atendimento ao cliente.", "titulo_pt": "Como os trabalhadores estrangeiros se tornaram uma parte essencial dos ubiquitous konbini do Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 73321, "titulo": "The Strokes lose themselves in a sea of auto-tune on 'Reality Awaits'", "url": "https://www.lemonde.fr/en/culture/article/2026/07/26/the-strokes-lose-themselves-in-a-sea-of-auto-tune-on-reality-awaits_6755846_30.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No seu sétimo álbum, a banda nova-iorquina The Strokes se afunda em artifícios sintéticos, apesar de apresentar duas faixas fortes.", "titulo_pt": "The Strokes se perdem em um mar de auto-tune no 'Reality Awaits'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 73535, "titulo": "‘Andy Burnham can grow a moustache!’: SNL UK’s Paddy Young on breakout stardom – and impersonating the new PM", "url": "https://www.theguardian.com/tv-and-radio/2026/jul/26/paddy-young-comedian-saturday-night-live-interview", "fonte_id": "guardian_culture", "data_pub": "2026-07-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Paddy Young, um comediante do Saturday Night Live UK, teve seu show cancelado após se ferir gravemente na mão. Apesar disso, ele continuou a subir no mundo das comedias e logo terá o papel de parodiar o novo primeiro-ministro em suas apresentações semanais.", "titulo_pt": "'Andy Burnham pode crescer uma barba!': Paddy Young do SNL UK sobre sua ascensão estelar - e imitar o novo PM", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 73539, "titulo": "Keith David on his incredible career: ‘I want you to understand Black men as full-scope human beings’", "url": "https://www.theguardian.com/film/2026/jul/26/keith-david-president-curtis-actor-interview", "fonte_id": "guardian_culture", "data_pub": "2026-07-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Keith David, um ator cênico trabalhador com mais de 400 créditos de tela, incluindo The Thing, Platoon e Rick and Morty, continua sua carreira sem planos de parar. Sua voz profunda e melódica o acompanha em papéis variados, desde guerreiros até personagens animados.", "titulo_pt": "Keith David sobre sua impressionante carreira: 'eu quero que você entenda os homens negros como seres humanos completos'", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 73544, "titulo": "Eight unique patios that beckon to the outdoors", "url": "https://www.dezeen.com/2026/07/26/patios-indoor-outdoor-lookbooks/", "fonte_id": "dezeen", "data_pub": "2026-07-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo destaca oito varandas únicas que conectam internamente e externamente, criando espaços ideais para relaxar ao ar livre. Essas varandas permitem uma transição suave entre a casa e o exterior, especialmente durante as férias de verão.", "titulo_pt": "Oito varandas únicas que convidam para o exterior", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 72943, "titulo": "Marvel anuncia 'Pantera Negra 3' e Motoqueiro Fantasma' com Ryan Gosling", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/07/marvel-anuncia-pantera-negra-3-e-motoqueiro-fantasma-com-ryan-gosling.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-07-26T08:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Marvel Studios anunciou 'Pantera Negra 3' e o filme 'Motoqueiro Fantasma', estrelado por Ryan Gosling e dirigido por Shawn Levy, durante a San Diego Comic-Con na Califórnia.", "titulo_pt": "Marvel anuncia Pantera Negra 3 e Motoqueiro Fantasma com Ryan Gosling", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 73164, "titulo": "Luigi Ferrucci, gerontólogo en EE.UU.: “La disminución de la fuerza muscular es una causa principal de pérdida de movilidad”", "url": "https://www.lanacion.com.ar/lifestyle/cuidado-cuerpo-belleza/luigi-ferrucci-gerontologo-en-eeuu-la-disminucion-de-la-fuerza-muscular-es-una-causa-principal-de-nid26072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-26T08:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A diminuição da força muscular é uma causa principal da perda de mobilidade, conforme apontado por um estudo do gerontólogo Luigi Ferrucci. O trabalho identificou alterações na longevidade relacionadas à perda muscular.", "titulo_pt": "Luigi Ferrucci, gerontologista
