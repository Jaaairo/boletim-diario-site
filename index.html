<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 02/10/2026 19:20 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">
      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>
      <option value="erro_traducao">Erro de tradução</option>
      <option value="classificacao_errada">Classificação errada</option>
      <option value="resumo_impreciso">Resumo impreciso</option>
      <option value="outro">Outro</option>
    </select>
    <label for="flag-nota">Nota (opcional)</label>
    <textarea id="flag-nota" placeholder="Descreva o problema..."></textarea>
    <div class="modal-btns">
      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "02/10/2026 19:20", "stats": {"noticias_novas": 1019, "resumos_gerados": 243}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "No próximo domingo, ocorrerá o primeiro turno das eleições presidenciais no Brasil, com candidatos como Lula e Flávio Bolsonaro liderando as pesquisas. O presidente Lula propôs debates em 'séries A, B ou C' para a eleição, criticando o formato atual. A discussão sobre a Proposta de Emenda Constitucional (PEC) que acaba com a escala 6x1 será levada ao plenário do Senado na próxima terça-feira, após o primeiro turno das eleições. As distribuidoras de energia elétrica estão preparadas para garantir o fornecimento durante a votação e a apuração. O Ibovespa atingiu seu maior nível desde abril, subindo 2,63% em uma sessão pré-eleição. A movimentação das bets diminuiu em 31%, com o saldo nas contas caindo de R$ 2,1 bilhões para R$ 1,453 bilhões desde 26 de setembro, após a proibição das apostas de quota fixa. O Ministério Público do Trabalho recebeu 884 denúncias de assédio eleitoral, dez vezes mais do que no primeiro turno de 2022. A votação começa às 8h00 e termina às 17h00, seguindo o horário de Brasília, e os eleitores terão até o dia das eleições para baixar o aplicativo do e-título.", "mundo": "As eleições presidenciais no Brasil em 2026 estão sendo focalizadas, com pesquisas apontando um cenário disputado entre Flávio Bolsonaro e Luiz Inácio Lula da Silva. O presidente Lula liderou um grande evento político antes da votação deste domingo, reafirmando sua intenção de evitar que a família Bolsonaro retorne ao poder. O Brasil enfrenta pressões diplomáticas, com os Estados Unidos e a Austrália suspendendo serviços consulares no país devido a preocupações de segurança. Em meio a essas tensões, Donald Trump afirmou que está monitorando de perto as eleições brasileiras, enquanto o governo brasileiro investiga uma 'possível ameaça' mencionada pelos Estados Unidos como justificativa para a suspensão do atendimento na embaixada norte-americana. O Irã foi autorizado a realizar 40 voos diários para Najaf no Iraque, após uma exceção dos Estados Unidos, enquanto a Rússia intensificou seus ataques a pontes vitais em Kiev, capital ucraniana, em sua guerra contra o país.\n\nO G-7 decidiu liberar 100 milhões de barris de diesel dos estoques estratégicos para combater a elevação dos preços e a ameaça de cortes de exportações de diesel dos Estados Unidos. Este passo visa aliviar a pressão no mercado de combustíveis, especialmente na Europa. Em outro desenvolvimento, a Coreia do Sul ameaçou retaliar a Coreia do Norte por seu envio de tropas. Por sua vez, Taiwan recebeu suas primeiras aeronaves F-16V Block 70, parte de uma venda de armas dos Estados Unidos. Além disso, a Guarda Costeira de Taiwan usou um canhão d'água para afastar duas embarcações de pesca chinesas das águas próximas às Ilhas Dongsha. Na América do Sul, a Polícia Federal realiza operações contra suspeitos de planejar ataques à embaixada dos Estados Unidos, em um contexto de preocupações sobre a segurança dos postos diplomáticos.", "economia": "As chuvas excessivas no centro-sul do Brasil prejudicaram a colheita de cana-de-açúcar e os embarques de açúcar, afetando a produção na região. A Embraer registrou um recorde de entregas de aeronaves no terceiro trimestre, com 66 aeronaves, um aumento de 6% em comparação com o mesmo período do ano anterior, impulsionada pela demanda por aeronaves militares. A Petrobras iniciou uma parada programada de manutenção na Refinaria Presidente Getúlio Vargas no Paraná, com investimentos estimados em R$ 800 milhões. A inflação nos países da zona do euro atingiu seu nível mais alto em três anos, registrando 3,8% em setembro, impulsionada por aumentos nos preços da energia. A Tesla entregou 486.532 veículos no terceiro trimestre, superando as expectativas do mercado. A Novartis firmou um acordo com o laboratório chinês Abogen para desenvolver medicamentos de RNA, com um valor potencial de até US$ 7,75 bilhões. A Ultrapar, dona da Ipiranga, mira 2031 com planos de 'capital paciente', focado na criação de valor a longo prazo. O índice de medo da Bolsa atingiu um recorde de 32,39 pontos, indicando expectativas de oscilações mais intensas nos próximos 30 dias.", "tecnologia": "A tecnologia continua sendo um tema central nas últimas notícias, com destaque para o aumento do valor de mercado da Nvidia, que se aproxima dos 6 trilhões de dólares, refletindo o crescimento da indústria de inteligência artificial (IA). A empresa está enfrentando críticas por novas restrições em seu sistema operacional, que visam limitar o acesso total ao disco em resposta aos riscos associados aos agentes de IA. Em um desenvolvimento político, o governo dos Estados Unidos rebrandou o AI como 'super inteligência' através de um decreto executivo, com a Casa Branca obtendo a assinatura de um compromisso de segurança em IA. Além disso, a China está intensificando seus investimentos em IA, criando novas academias militares para treinar especialistas em tecnologias avançadas, enquanto analistas alertam sobre possíveis restrições dos Estados Unidos na exportação de peças aeronáuticas para a China, afetando o projeto do C919, um jato comercial chinês.", "ciencia": "Um estudo conduzido pela Universidade de Ottawa mostrou que reduzir a poda e o uso de herbicidas nas margens de estradas rurais pode aumentar em 45% o número de polinizadores e em 23% o número de espécies nessas áreas, evidenciando a importância de práticas mais sustentáveis. Além disso, os cientistas identificaram o primeiro supercondutor do tipo I com propriedades de simetria do tempo quebradas, adicionando uma característica incomum aos supercondutores já conhecidos por conduzir eletricidade sem resistência. Em outras notícias, o NIH lançou um novo site simplificado para facilitar a busca de informações pelo público, enquanto a NASA está aceitando candidaturas para a próxima classe de diretores de voo em missão control no Centro Espacial Johnson em Houston, crucial para manter a liderança americana na exploração espacial.", "cultura": "O evento mais importante dos artigos é a quarta edição do Fórum Varanda da Amazônia, dedicada ao tema das mulheres. O evento ocorrerá na Caixa Cultural e será patrocinado pela primeira vez pela própria Caixa Cultural. Criado por Fafá de Belém, o festival Hacktudo, que acontece em São Paulo, apresentará experiências com inteligência artificial, realidade virtual, robótica, drones, jogos e instalações interativas. Além disso, Claire Keegan leu alguns de seus contos mais emblemáticos em um evento no MALBA, como parte do FILBA. A mostra Retrospectiva Ruy Guerra – Uma Vida de Cinema, na Caixa Cultural do Rio de Janeiro, exibirá 17 longas-metragens e dois documentários do diretor, abrangendo sua carreira de quase sete décadas.", "sociedade": "Protestos de estudantes se espalharam pela França, enfrentando confrontos com a polícia. Inicialmente focados em melhorias no ensino médio em Paris, os protestos se expandiram para 735 escolas, resultando em 1.747 pessoas presas. Em outro evento, uma brasileira é suspeita de ter assassinado sua filha nos Estados Unidos após perder uma disputa judicial sobre a guarda da criança. Além disso, um homem foi condenado a pagar R$ 456 mil a sua ex-namorada por estelionato amoroso. No Brasil, um idoso ficou ilhado em uma ponte em Goiás após o carro que ele estava dirigindo apagar durante uma tentativa de cruzar um córrego transbordado. Em outro caso, um homem foi preso com um fuzil e 1 tonelada de maconha escondidos em um banheiro em São José, Santa Catarina. Ainda no Brasil, mais de 400 escolas na França foram fechadas devido a protestos de estudantes contra a precarização do ensino, com o governo francês enviando policiais de choque às escolas.", "meio_ambiente": "A Alemanha inaugurou um novo aerogerador de 365 metros de altura em Schipkau, que se tornou o mais alto do mundo. O equipamento está programado para entrar em operação em novembro, representando um avanço significativo na geração de energia eólica. Por outro lado, a Argentina registrou um inverno muito nevado, com neve 40% acima da média anual, e o Rio Mendoza teve 29% mais água do que em um ano normal. No entanto, os cientistas alertam que este alívio pode ser temporário devido ao fenômeno El Niño. Em relação às condições climáticas na Europa, um relatório do Copernicus mostrou que as temperaturas do ar na superfície no verão europeu de 2023 foram 2,5°C acima da média decenal, com mais de metade da Europa ocidental atingindo temperaturas muito quentes que superaram 38°C. Além disso, o verão foi marcado por ondas de calor extremas e perdas na colheita, pintando um quadro sombrio para o futuro.", "direitos_humanos": "A condenada Christa Pike, cuja execução falhou nos Estados Unidos, permanece hospitalizada e conectada a um respirador. O incidente levanta dúvidas sobre o sistema de execuções penais no país. No Brasil, o programa 'Sim, Eu Posso', desenvolvido em Cuba e implementado aqui, alfabetizou mais de 11 milhões de pessoas, destacando a importância do acesso à educação como meio de conquistar direitos. O UNICEF também chamou a atenção para a necessidade de proteger as crianças no processo de recuperação do Líbano, enfatizando a importância do bem-estar infantil. O governo do Chile reduziu o orçamento do Programa Sitios de Memória em 25,3% para 2027, enquanto relatórios alertam sobre as ameaças digitais que afetam a América Latina, incluindo vigilância, censura e filtragem de dados. Em outro contexto, ativistas poloneses usaram máquinas de locker para obter remédios abortivos, uma solução tecnológica para o acesso restrito ao aborto no país. No Brasil, a lei do crime de violência política contra a mulher foi discutida, com um aumento significativo no número de casos desse tipo nos últimos quatro anos. Finalmente, ativistas planejam ajuizar uma ação legal contra a proibição da polícia australiana de entrar em uma área de segurança designada durante o Expo Land Forces, um evento de armas em Perth, Austrália Ocidental."}, "resumo_do_dia": {"politica_nacional": [{"id": 191814, "titulo": "Alcolumbre marca para a próxima semana discussão da PEC que acaba com escala 6×1", "url": "https://veja.abril.com.br/economia/alcolumbre-marca-para-a-proxima-semana-discussao-da-pec-que-acaba-com-escala-6x1/", "fonte_id": "veja", "data_pub": "2026-10-02T21:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proposta de emenda constitucional (PEC) prevê a discussão para a próxima semana e a redução gradual da jornada de trabalho, passando de 44 para 40 horas semanais. O presidente do Senado, Senador Rodrigo Pacheco, não é mencionado, mas o Senador Alessandro Alcolumbre marca a discussão.", "titulo_pt": "Alcolumbre agendou para próxima semana discussão da PEC que reduzirá a jornada de trabalho", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 192033, "titulo": "O número que pode definir a eleição presidencial em primeiro turno — e os fatores que apontam contra isso", "url": "https://www.bbc.com/portuguese/articles/cv0lrly138rko?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-02T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula e Flávio Bolsonaro afirmam que irão vencer a eleição no primeiro turno. Embora a maioria dos analistas continue acreditando que haverá segundo turno, a possibilidade de vitória no primeiro turno deixou de ser apenas uma hipótese teórica.", "titulo_pt": "Número que pode definir a eleição presidencial em primeiro turno", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 192071, "titulo": "Quem são todos os candidatos a governador de Sergipe (SE) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-todos-os-candidatos-a-governador-de-sergipe-se-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-10-02T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O atual governador de Sergipe será candidato à reeleição e enfrentará outros três políticos na disputa pelo cargo de governador nas eleições de 2026.", "titulo_pt": "Quem são todos os candidatos a governador de Sergipe (SE) nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 191910, "titulo": "Lula defende divisão de debates em “séries A, B ou C”", "url": "https://www.cnnbrasil.com.br/eleicoes/lula-defende-divisao-de-debates-em-series-a-b-ou-c/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-02T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Luiz Inácio Lula da Silva defendeu o formato proporcional de debates em entrevista a um podcast, criticando o modelo atual com muitos candidatos.", "titulo_pt": "Lula defende debates em séries A, B ou C", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 191725, "titulo": "Alcolumbre leva PEC do fim da escala 6x1 ao plenário do Senado na terça-feira", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/alcolumbre-marca-votacao-da-pec-da-escala-6x1-para-terca-feira-6.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Davi Alcolumbre (União Brasil-AP), agendou para a próxima terça-feira (6) o início da tramitação da PEC que acaba com a escala 6x1. A sessão será realizada após o primeiro turno das eleições, que ocorre neste domingo (4).", "titulo_pt": "Alcolumbre agendará PEC do fim da escala 6x1 para a terça-feira no Senado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 191897, "titulo": "“O Brasil precisa do voto de quem tem 70 anos”, pede Lula em ato em BH", "url": "https://www.metropoles.com/minas-gerais/o-brasil-precisa-do-voto-de-quem-tem-70-anos-pede-lula-em-ato-em-bh", "fonte_id": "metropoles", "data_pub": "2026-10-02T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula participou de um ato na Praça da Liberdade, em Belo Horizonte, onde chamou a atenção para o voto dos brasileiros com mais de 70 anos. Ele destacou que essa faixa etária contribuiu para o desenvolvimento do país e incentivou sua participação nas eleições.", "titulo_pt": "Brasil precisa do voto de quem tem 70 anos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 192072, "titulo": "Quem são todos os candidatos a governador do Rio Grande do Norte (RN) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-todos-os-candidatos-a-governador-do-rio-grande-do-norte-rn-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-10-02T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Oito candidatos disputam o cargo de governador do Rio Grande do Norte nas eleições de 2026. O texto lista e descreve cada um dos candidatos.", "titulo_pt": "Quem são todos os candidatos a governador do Rio Grande do Norte nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 191902, "titulo": "\"Piá de bosta\": Janja xinga Nikolas durante ato de Lula em Belo Horizonte", "url": "https://www.metropoles.com/minas-gerais/pia-de-bosta-janja-xinga-nikolas-durante-ato-de-lula-em-belo-horizonte", "fonte_id": "metropoles", "data_pub": "2026-10-02T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ato político de Lula em Belo Horizonte incluiu uma agressão verbal entre Janja, filha do ex-presidente, e Nikolas, que xingou Nikolas com a frase 'Piá de bosta'. O evento começou com uma concentração na Praça da Liberdade e seguiu com uma caminhada até a Praça Tiradentes.", "titulo_pt": "‘Piá de bosta’: janja xinga Nikolas durante ato de Lula em Belo Horizonte", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 191903, "titulo": "Alcolumbre ligou para Lula antes de anunciar que pautaria a PEC da 6x1", "url": "https://www.metropoles.com/colunas/milena-teixeira/alcolumbre-pauta-fim-da-escala-6x1-para-votacao-no-senado-na-proxima-terca", "fonte_id": "metropoles", "data_pub": "2026-10-02T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Renan Calheiros, telefonou com o ex-presidente Luiz Inácio Lula da Silva antes de decidir sobre a pauta que incluiria a Proposta de Emenda Constitucional (PEC) da 6x1. A PEC estabeleceria dois dias de descanso por semana e seria analisada no plenário do Senado Federal dois dias após o primeiro turno das eleições.", "titulo_pt": "Alcolumbre ligou para Lula antes de decidir sobre pauta com PEC da 6x1", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 191904, "titulo": "Alcolumbre pauta fim da 6x1 para dois dias depois do primeiro turno", "url": "https://www.metropoles.com/brasil/alcolumbre-pauta-fim-da-6x1-dois-dias-depois-do-primeiro-turno", "fonte_id": "metropoles", "data_pub": "2026-10-02T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Alcolumbre, programou a primeira sessão de discussão da PEC para 6 de outubro, com mais três sessões na mesma semana. O objetivo é concluir a tramitação em dois dias após o primeiro turno das eleições.", "titulo_pt": "Alcolumbre pauta fim da 6x1 para dois dias depois do primeiro turno", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 192073, "titulo": "MPT recebe dez vezes mais denúncias de assédio eleitoral do que no primeiro turno de 2022", "url": "https://www.jota.info/eleicoes/eleicoes-2026/mpt-recebe-dez-vezes-mais-denuncias-de-assedio-eleitoral-do-que-no-primeiro-turno-de-2022", "fonte_id": "jota", "data_pub": "2026-10-02T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público do Trabalho (MPT) recebeu 884 denúncias de assédio eleitoral até esta sexta-feira, sendo que este número é dez vezes maior do que no primeiro turno das eleições de 2022. O MPT e os tribunais trabalhistas estarão de plantão neste fim de semana.", "titulo_pt": "MPT recebe dez vezes mais denúncias de assédio eleitoral do que no primeiro turno de 2022", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 191967, "titulo": "Ibovespa salta 2,63% e bate máxima desde abril em sessão pré-eleição; só 4 ações caem", "url": "https://www.infomoney.com.br/mercados/ibovespa-payroll-rouba-a-cena-e-indice-sobe-forte-em-ultima-sessao-pre-eleicao/", "fonte_id": "infomoney", "data_pub": "2026-10-02T20:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa subiu 2,63% e atingiu a maior cotação desde abril em uma sessão pré-eleição. Apenas quatro ações registraram quedas.", "titulo_pt": "Ibovespa salta 2,63% e bate máxima desde abril em sessão pré-eleição; só 4 ações caem", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 191729, "titulo": "Durigan afirma que MP do 'imposto do pecado' não será enviada agora e deve ficar para depois da eleição", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/durigan-afirma-que-mp-do-imposto-do-pecado-nao-sera-enviada-agora-e-deve-ficar-para-depois-da-eleicao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, declarou que a medida provisória do Imposto Seletivo não será enviada imediatamente e deve ser tratada após as eleições.", "titulo_pt": "Durigan diz que MP do 'imposto do pecado' não será enviada agora e deve ficar para depois da eleição", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 191730, "titulo": "O reajuste do Bolsa Família e a degradação institucional", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/marcos-mendes/2026/10/o-reajuste-do-bolsa-familia-e-a-degradacao-institucional.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T20:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O reajuste do Bolsa Família foi anunciado poucos dias antes da eleição, demonstrando a fragilidade dos pesos e contrapesos necessários para a qualidade das políticas públicas.", "titulo_pt": "Reajuste do Bolsa Família e fragilidade dos pesos e contrapesos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 191802, "titulo": "Distribuidoras se preparam para garantir energia no dia da eleição", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/distribuidoras-se-preparam-para-garantir-energia-no-dia-da-eleicao", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-02T20:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As distribuidoras de energia elétrica devem implementar planos especiais de atendimento para garantir o fornecimento durante a votação e a apuração das eleições gerais no próximo domingo. A Agência Nacional de Energia Elétrica (Aneel) emitiu ofícios para esse fim.", "titulo_pt": "Distribuidoras se preparam para garantir energia no dia da eleição", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 192075, "titulo": "Campanha de Renan Santos comemora resultado de ‘não debate’ da Globo", "url": "https://www.jota.info/eleicoes/eleicoes-2026/campanha-de-renan-santos-comemora-resultado-de-nao-debate-da-globo", "fonte_id": "jota", "data_pub": "2026-10-02T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato Renan Santos, da legenda Missão, registrou 35 milhões de interações no Instagram após o cancelamento do debate presidencial previsto pela Globo.", "titulo_pt": "Campanha de Renan Santos celebra resultado de ‘não debate’ da Globo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 192487, "titulo": "Taiwan receives first 2 F-16V Block 70s", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/03/2003865308", "fonte_id": "taipei_times", "data_pub": "2026-10-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Taiwan recebeu suas primeiras 2 aeronaves F-16V Block 70. Este lote de armamento é parte de uma venda de armas realizada pelos Estados Unidos.", "titulo_pt": "Taiwan recebe primeiro lote de 2 F-16V Block 70s", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 192491, "titulo": "South Korea threatens action against Ukraine over transfer of North Koreans", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/03/2003865312", "fonte_id": "taipei_times", "data_pub": "2026-10-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul ameaçou tomar medidas contra a Ucrânia em relação ao envio de norte-coreanos.", "titulo_pt": "Coreia do sul ameaça ação contra Ucrânia por transferência de norte-coreanos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 192505, "titulo": "US to put anti-ship missiles on island near Taiwan for drill", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/03/2003865333", "fonte_id": "taipei_times", "data_pub": "2026-10-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos vão instalar mísseis antiesmbarque em uma ilha próxima a Taiwan para um exercício militar.", "titulo_pt": "EUA vão instalar mísseis antiesmbarque em ilha perto de Taiwan para exercício", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 191834, "titulo": "PF faz buscas para investigar risco a consulados e embaixada dos EUA", "url": "https://www.poder360.com.br/poder-internacional/pf-faz-buscas-para-investigar-risco-a-consulados-e-embaixada-dos-eua/", "fonte_id": "poder360", "data_pub": "2026-10-02T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal realiza buscas em São Paulo e no Distrito Federal para investigar possíveis riscos à segurança dos consulados e embaixada dos EUA. As buscas ocorrem no mesmo dia em que os postos foram fechados.", "titulo_pt": "PF realiza buscas para investigar risco a consulados e embaixada dos EUA", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 192064, "titulo": "Elecciones Brasil 2026, EN VIVO: encuestas, dónde voto en Argentina y las últimas noticias este viernes 2 de octubre", "url": "https://www.lanacion.com.ar/el-mundo/elecciones-brasil-2026-en-vivo-encuestas-donde-voto-en-argentina-y-las-ultimas-noticias-este-viernes-nid02102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-02T21:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As últimas pesquisas apontam um cenário disputado entre Flávio Bolsonaro e Luiz Inácio Lula da Silva para as eleições presidenciais do Brasil em 2026. As eleições estão marcadas para o dia 4 de outubro.", "titulo_pt": "Eleições Brasil 2026, ao VIVO: pesquisas, onde votar em Argentina e as últimas notícias desta sexta-feira 2 de outubro", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 192355, "titulo": "A 28-year-old British man charged with preparing acts of terrorism against UK far-right leader Nigel Farage", "url": "https://www.lemonde.fr/en/international/article/2026/10/02/a-28-year-old-british-man-charged-with-preparing-acts-of-terrorism-against-uk-far-right-leader-nigel-farage_6758197_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-02T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem britânico de 28 anos foi acusado de preparar atos de terrorismo contra o líder do partido de extrema-direita Nigel Farage no Reino Unido. Kerry já foi acusado do assassinato de outro político britânico e está sendo acusado de preparar atos de terrorismo há dois anos.", "titulo_pt": "Homem britânico de 28 anos acusado de preparar atos de terrorismo contra líder do partido de extrema-direita Nigel Farage", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 191844, "titulo": "Qualquer semelhança não é mera coincidência: o que o caso Espriella na Colômbia ensina aos brasileiros sobre interferência eleitoral?", "url": "https://www.brasildefato.com.br/2026/10/02/qualquer-semelhanca-nao-e-mera-coincidencia-o-que-o-caso-espriella-na-colombia-ensina-aos-brasileiros-sobre-interferencia-eleitoral/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-02T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um especialista em desinformação descreveu como os Estados Unidos interferiram diretamente nas eleições presidenciais da Colômbia. O caso Espriella é citado como exemplo de como a interferência eleitoral pode ocorrer.", "titulo_pt": "Qualquer semelhança não é mera coincidência: o caso Espriella na Colômbia e a interferência eleitoral", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 191727, "titulo": "Rotas marítimas do Ártico ganham força com guerra no Golfo e aquecimento global", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/rotas-maritimas-do-artico-ganham-forca-com-guerra-no-golfo-e-aquecimento-global.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O transporte marítimo pelo Ártico atingiu recordes devido ao derretimento do gelo polar e à pressão sobre rotas estratégicas globais. Armadores estão buscando alternativas nessas rotas.", "titulo_pt": "Rotas marítimas do Ártico ganham força com derretimento do gelo e pressão sobre rotas globais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 192401, "titulo": "Israeli general: Gaza captives could have been freed a year earlier", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/2/israeli-general-gaza-captives-could-have-been-freed-a-year-earlier?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-02T21:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O general israelense Nitzan Alon afirmou em um fórum do Washington Institute que todos os reféns do Gaza poderiam ter sido libertados há um ano atrás.", "titulo_pt": "General israelense diz que reféns do gaza poderiam ter sido libertados há um ano", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 191700, "titulo": "Trump evita falar de Flávio Bolsonaro e volta a dizer que está acompanhando 'eleições de perto'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/trump-evita-falar-de-flavio-bolsonaro-e-volta-a-dizer-que-esta-acompanhando-eleicoes-de-perto.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-02T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Donald Trump afirmou que está acompanhando as eleições brasileiras de perto. O presidente dos Estados Unidos não comentou sobre Flávio Bolsonaro.", "titulo_pt": "Trump diz acompanhar eleições brasileiras de perto, sem mencionar Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 192174, "titulo": "Brazil’s Lula says only he can stop rise of fascism under Bolsonaro’s son", "url": "https://www.theguardian.com/world/2026/oct/02/brazil-lula-stop-fascism-bolsonaro-son", "fonte_id": "guardian_world", "data_pub": "2026-10-02T21:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva liderou um grande evento político em Rio de Janeiro antes da eleição deste domingo, considerada a mais importante em décadas. Lula afirmou que é o único capaz de impedir que a família do seu rival de direita, Flávio Bolsonaro, retorne ao poder.", "titulo_pt": "Lula diz ser a única barreira contra a ascensão do fascismo com o filho de Bolsonaro no poder", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 192031, "titulo": "PF investiga suposto plano de atacar embaixada dos EUA: o que se sabe e como o governo brasileiro avalia", "url": "https://www.bbc.com/portuguese/articles/cmx2dn8v9lgyo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-02T21:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Representantes da embaixada dos Estados Unidos no Brasil informaram autoridades brasileiras sobre supostos riscos à segurança da embaixada. A Polícia Federal está investigando possíveis planos de ataque.", "titulo_pt": "PF investiga suposto plano de ataque à embaixada dos EUA: o que se sabe", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 192158, "titulo": "PF realiza operação contra suspeitos de planejar ação contra Embaixada dos EUA", "url": "https://www.cartacapital.com.br/justica/pf-realiza-operacao-contra-suspeitos-de-planejar-acao-contra-embaixada-dos-eua/", "fonte_id": "cartacapital", "data_pub": "2026-10-02T21:04:00Z", "idioma": "pt", "provavel_duplicata_de": 191788, "texto_pt": "A Polícia Federal realizou uma operação contra suspeitos de planejar uma ação contra a Embaixada dos Estados Unidos. Os mandados foram cumpridos em São Paulo e em Águas Lindas, no Entorno do Distrito Federal.", "titulo_pt": "PF realiza operação contra suspeitos de planejar ação contra Embaixada dos EUA", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 192446, "titulo": "US justice department will not reopen criminal probe of Fed’s Jay Powell", "url": "https://www.ft.com/content/887e90a5-8456-4eba-9ed0-205c873d4846?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-02T21:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O procurador-geral dos Estados Unidos, Todd Blanche, declarou que o departamento de justiça não vai reabrir uma investigação criminal contra Jay Powell em relação a um projeto de reforma do banco central que custou 2,5 bilhões de dólares. Ele argumentou que não ter supervisão sobre o projeto não constitui necessariamente um crime.", "titulo_pt": "Procurador-geral dos EUA não reabrirá investigação criminal contra Jay Powell", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 192233, "titulo": "G-7 Agrees to Release 100 Million Barrels of Reserve Diesel", "url": "https://foreignpolicy.com/2026/10/02/g7-release-emergency-diesel-crude-stockpiles-fuel-prices-trump/", "fonte_id": "foreign_policy", "data_pub": "2026-10-02T21:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O G-7 concordou em liberar 100 milhões de barris de diesel reservas. O governo dos Estados Unidos ameaçou proibir as exportações de diesel americanas se a Europa não aumentasse suas próprias exportações.", "titulo_pt": "G-7 decidirá liberação de 100 milhões de barris de reservas de Diesel", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 191966, "titulo": "AO VIVO | Eleições 2026: acompanhe em tempo real a votação e a apuração do 1º turno", "url": "https://www.infomoney.com.br/politica/ao-vivo-eleicoes-gerais-primeiro-turno-2026/", "fonte_id": "infomoney", "data_pub": "2026-10-02T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Acompanhe em tempo real as eleições 2026, incluindo a votação e a apuração do 1º turno. As principais notícias do processo eleitoral estarão disponíveis para todo o Brasil.", "titulo_pt": "AO VIVO | Eleições 2026: acompanhe em tempo real a votação e a apuração do 1º turno", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 191726, "titulo": "Chuvas prejudicam colheita de cana e embarques de açúcar no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/10/chuvas-prejudicam-colheita-de-cana-e-embarques-de-acucar-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As usinas brasileiras enfrentam dificuldades para colher cana-de-açúcar devido a chuvas excessivas no centro-sul do país, o que também afeta os embarques nos principais portos.", "titulo_pt": "Chuvas prejudicam colheita de cana e embarques de açúcar no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 191963, "titulo": "Justiça dos EUA não reabrirá investigação criminal contra Powell por reforma do Fed", "url": "https://www.infomoney.com.br/mundo/justica-dos-eua-nao-reabrira-investigacao-criminal-contra-powell-por-reforma-do-fed/", "fonte_id": "infomoney", "data_pub": "2026-10-02T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral dos Estados Unidos declarou que não haverá reabertura da investigação criminal contra Powell em relação à reforma do Fed, uma vez que o relatório não encontrou indícios de crime. No entanto, o Departamento de Justiça poderá agir se novas auditorias revelarem irregularidades.", "titulo_pt": "Justiça dos EUA não reabrirá investigação criminal contra Powell por reforma do Fed", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 191803, "titulo": "Embraer tem alta de 6% nas entregas no terceiro trimestre", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/embraer-tem-alta-de-6-nas-entregas-no-terceiro-trimestre", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-02T19:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Embraer entregou 66 aeronaves no terceiro trimestre de 2026, um aumento de 6% em comparação com o mesmo período de 2025. A maioria das vendas foi de modelos de aviação executiva.", "titulo_pt": "Embraer registra alta de 6% nas entregas no terceiro trimestre", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 191732, "titulo": "Monzo busca fundos de private equity após Nubank desistir de aquisição", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/monzo-busca-fundos-de-private-equity-apos-nubank-desistir-de-aquisicao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T19:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O banco digital britânico Monzo está buscando investidores de private equity após a desistência da fintech brasileira Nubank de adquirir a empresa, que pretendia avaliar a Monzo em até dez bilhões de libras.", "titulo_pt": "Monzo procura investidores de private equity após Nubank desistir de compra", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 191805, "titulo": "Brasil amplia Margem Equatorial com base em decisão da ONU; entenda", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/brasil-amplia-margem-equatorial-com-base-em-decisao-da-onu-entenda", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-02T19:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência Nacional do Petróleo, Gás Natural e Biocombustíveis (ANP) expandiu a Margem Equatorial com 11 novos setores exploratórios, totalizando 380 mil quilômetros quadrados. Essa ampliação foi baseada em uma decisão da Organização das Nações Unidas (ONU) que aumentou a plataforma continental brasileira.", "titulo_pt": "Brasil amplia Margem Equatorial com base em decisão da ONU; entenda", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 191734, "titulo": "Mercados emergentes superam desenvolvidos com agravamento da venda de títulos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/mercados-emergentes-superam-desenvolvidos-com-agravamento-da-venda-de-titulos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T18:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os mercados emergentes estão resistindo melhor às vendas de títulos globais do que os mercados desenvolvidos, enquanto investidores acreditam que muitos países emergentes agora são menos vulneráveis ao risco de juros mais altos nos Estados Unidos atraírem capital para fora de suas economias.", "titulo_pt": "Mercados emergentes superam desenvolvidos com agravamento da venda de títulos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 192444, "titulo": "Low-profile hedge fund smashes record for New York office rent", "url": "https://www.ft.com/content/17762862-bdb7-44d0-a0d0-d2285bedbd2d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-02T18:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A gestora de fundos de investimento Castle Hook pagará até US$ 21,2 milhões ao ano por 53.000 pés quadrados de espaço no penthouse do novo edifício da Madison Avenue, desenvolvido pela Related.", "titulo_pt": "Gestora de fundos de investimento de baixo perfil quebra recorde de aluguel para escritório em nova York", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 191735, "titulo": "Tesla entrega quase meio milhão de veículos no mundo no 3º trimestre", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/01/6562-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post467081", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Tesla entregou 486.532 veículos no terceiro trimestre, superando as expectativas do mercado, que eram de cerca de 461 mil unidades.", "titulo_pt": "Tesla entrega quase meio milhão de veículos no mundo no 3º trimestre", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 192036, "titulo": "O que deu errado para a Nike? Como gigante mundial de artigos esportivos perdeu 'brilho'", "url": "https://www.bbc.com/portuguese/articles/cqrk3kkn406no?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-02T16:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nike cometeu diversos erros que a custaram caro nos últimos anos. Como maior marca de roupas esportivas do mundo, a empresa perdeu parte do seu 'brilho'.", "titulo_pt": "O que deu errado para a Nike?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 191741, "titulo": "Novartis fecha acordo de até US$ 7,75 bi com chinesa Abogen para desenvolver medicamentos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/novartis-fecha-acordo-de-ate-us-775-bi-com-chinesa-abogen-para-desenvolver-medicamentos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T16:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A farmacêutica suíça Novartis firmou um acordo com o laboratório chinês Abogen Biosciences para desenvolver medicamentos de RNA, incluindo um possível tratamento para doenças autoimunes. O valor do acordo pode chegar a até US$ 7,75 bilhões.", "titulo_pt": "Novartis fecha acordo de até US$ 7,75 bi com Abogen para desenvolver medicamentos de rna", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 191742, "titulo": "Encomendas à
