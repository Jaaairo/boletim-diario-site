const D = {"gerado_em": "14/09/2026 19:15", "stats": {"noticias_novas": 626, "resumos_gerados": 240}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva assinou a lei que torna permanente o programa Move Brasil, que oferece linhas de crédito para motoristas de aplicativos, taxistas, entregadores e motoristas de transporte escolar. Em outro desenvolvimento, o Supremo Tribunal Federal (STF) realizou uma sessão plenária extraordinária para decidir se deve ser aberta uma investigação contra o ministro Alexandre de Moraes, após a divulgação de mensagens com o ex-dono do Banco Master, Daniel Vorcaro. De acordo com uma pesquisa da Quaest, 67% dos brasileiros não consideram a crise no STF influente na escolha do candidato para a presidência. O STF também divulgou o rito do julgamento para determinar se haverá uma investigação contra Alexandre de Moraes, com o ministro Fachin sendo o primeiro a votar. Além disso, o programa Move Brasil Táxi e Aplicativos foi prorrogado, oferecendo R$ 30 bilhões em crédito para aquisição de veículos novos e seminovos. A Caixa Econômica Federal desistiu de entrar com dissídio coletivo no TST contra a greve dos bancários, que continua por tempo indeterminado.", "mundo": "A aprovação de Donald Trump subiu ligeiramente após atingir seu valor mais baixo histórico, conforme pesquisa da Reuters/Ipsos. Em outro desenvolvimento, o Exército Espacial dos Estados Unidos confirmou pela primeira vez a posse de armas em órbita, refletindo a crescente importância do domínio espacial. O governo israelense é acusado por um grupo de direitos humanos de tentar aniquilar a existência dos palestinos no Território Ocupado, através de cinco tácticas, incluindo limpeza étnica e restrições de movimento. O Brasil e os Estados Unidos marcam uma reunião presencial para discutir tarifas, enquanto o presidente americano minimiza a inteligência artificial como uma conspiração. O Reino Unido pede ao Canadá que fortifique um acordo comercial e desenvolva relações mais estreitas com a União Europeia, enquanto o Canadá busca alinhar-se com a Europa em face das ações do presidente americano.\n\nA geopolítica global enfrenta uma série de desafios e mudanças significativas. A Rússia apoia as aspirações de Cuba para ingressar nos Brics como membro pleno, refletindo a crescente influência do país na arena internacional. Em outro desenvolvimento, a Finlândia se juntou ao escudo nuclear da França, uma medida que ocorre em meio à incerteza causada pela guerra na Ucrânia. A Finlândia se uniu a outros nove países europeus que já aderiram ao programa, visando 'ajudar a prevenir uma escalada' das tensões. Além disso, a Turquia suspendeu suas operações em Angola devido a problemas com o novo aeroporto de Luanda. Em um contexto de tensões geopolíticas, a Turquia removeu permanentemente Luanda de suas rotas aéreas, impactando o fluxo de passageiros. A guerra no Iêmen continua a afetar a região, com os hutíes reorganizando o setor comercial e arrecadando bilhões de dólares em meio a uma crise humanitária. No entanto, a situação na Ucrânia permanece um dos principais focos da geopolítica atual, com a Otan se comprometendo a aumentar o apoio à Ucrânia após os ataques russos perto da Polônia. Estes eventos refletem a complexidade e a volatilidade da atual cena geopolítica global.", "economia": "O Banco Internacional de Desenvolvimento (BIS) notou sinais de vulnerabilidade no mercado global de inteligência artificial (IA) após dois anos de alta nas ações relacionadas. Em outro desenvolvimento, o Ibovespa desvalorizou influenciado pelos preços do petróleo e pela Superquarta, com o dólar se aproximando dos R$ 5,15, refletindo a aversão global aos riscos. A confiança da indústria recuou em setembro, mantendo 21 meses de pessimismo. O governo Trump anunciou a retirada das tarifas sobre o uísque irlandês, enquanto o Brasil e os Estados Unidos devem se reunir no final de setembro para discutir tarifas, durante a reunião do G20 em Milwaukee. O Banco Central Europeu, liderado por Christine Lagarde, alertou sobre o risco de a Europa ficar isolada em relação à IA, enfatizando a necessidade de a Europa se tornar produtora de tecnologia de IA para preservar sua autonomia e alcançar ganhos de eficiência. Além disso, as seguradoras sul-coreanas sofreram perdas no negócio de seguro automóvel em seu primeiro semestre, enquanto o rendimento da dívida americana a dez anos atingiu 5%, seu nível mais alto desde 2023. A Nestlé venceu uma 'batalha do pedágio' no STJ, mantendo uma decisão que relativiza a aplicação de uma multa milionária cobrada por uma transportadora após anos recebendo pedágios por reembolso.", "tecnologia": "Executivos das empresas Anthropic, OpenAI, SpaceX e Google DeepMind concordaram sobre os riscos das inteligências artificiais que se tornaram cada vez mais poderosas, levantando a possibilidade de uma pausa no desenvolvimento da IA. Jensen Huang, CEO da Nvidia, afirmou que não permitirá um atraso no desenvolvimento de IA, contrariando as posições de Elon Musk e Sam Altman, que apoiaram as chamadas de Dario Amodei para diminuir o ritmo do desenvolvimento de IA. A União Europeia planeja proibir redes sociais e inteligência artificial para menores de 15 anos, enquanto a Assembleia Geral das Nações Unidas realizará uma reunião do Conselho de Segurança sobre inteligência artificial na próxima semana, devido à crescente preocupação internacional sobre o risco associado à rápida evolução da tecnologia. A Apple lançou a versão iOS 27 e macOS Golden Gate 27, que incluem melhorias no Siri e no Liquid Glass, e a OpenAI adquiriu a Glass Imaging, uma empresa de câmeras para smartphones fundada por ex-engenheiros da Apple, por 300 milhões de dólares. Além disso, a China desenvolveu o primeiro padrão internacional para inteligência artificial que interpreta sinais cerebrais, enquanto a Europa deve desenvolver sua própria tecnologia de inteligência artificial para evitar ser cortada do mercado pelos EUA ou China.", "ciencia": "Um estudo recente da Universidade de Newcastle apresentou o perfil genético mais detalhado de Salicornia, uma planta que se adapta bem a ambientes salgados. Isso oferece possibilidades para a agricultura em terras áridas. Paralelamente, a NASA selecionou 12 novos projetos para apoiar os astronautas, com foco em produção de alimentos e impactos da exploração espacial na saúde dos astronautas. Outro destaque é um estudo que sugere que a pressão para ser perfeito pode aumentar para crianças rotuladas como 'gifted' em escolas secundárias, abordando questões de bem-estar psicológico. Além disso, a polícia investiga o uso de uma agulha compartilhada durante uma Feira de Ciências em uma escola no Rio de Janeiro, levando a um atendimento médico para 20 pessoas no Hospital Lourenço Jorge.", "cultura": "O Festival de Brasília inaugurou com a exibição do filme 'Pequenas Tragédias', dirigido por Daniel Nolasco, que retrata a vida queer em Catalão, Goiás. No Rio de Janeiro, Cesar Camargo Mariano comemorou seu aniversário com dois shows no Soberano Jazz Club, em Itaipava, após oito anos de ausência. Em Nova York, a International Studio & Curatorial Program (ISCP) realizará uma visita guiada e conversas com os artistas do programa Ground Floor no dia 30 de setembro. O British Museum enfrentou protestos de ativistas pró-palestinos durante a abertura da exposição da Tapeçaria de Bayeux, relacionados à longa relação do museu com a British Petroleum e à colaboração com o bilionário Igor Tulchinsky. Além disso, a Escola de Artes Visuais de Nova York encerra seu programa de Mestrado em Fotografia, Vídeo e Mídia Relacionada, que foi lançado em 1988, permitindo que os alunos atuais concluam seus estudos.", "sociedade": "Os trabalhadores da Kuai Kuai realizaram um protesto contra a venda de terrenos, exigindo compensação. Isso refletiu preocupações com a possível perda de empregos e o atraso nas melhorias planejadas para a área. Em Eldorado, no estado de São Paulo, a cidade enfrenta alagamentos e receberá ajuda emergencial do governo, incluindo reforço no resgate com barcos e helicópteros, abrigos, medicamentos e assistência a agricultores. No Paraná, o governador Ratinho Jr. visitou áreas afetadas por fortes chuvas, percorrendo rodovias danificadas por temporais.", "meio_ambiente": "Um estudo publicado no jornal The Japan Times alerta que o Himalaia está se aproximando do ponto de não retorno, com geleiras em recuo e risco para milhões de pessoas que dependem da água desses glaciares. Paralelamente, o calor extremo, que atingiu um recorde de 100 dias, ameaça a segurança hídrica na região, conforme denuncia o Greenpeace. No Brasil, a cidade de Eldorado, no interior de São Paulo, ficou submersa devido às fortes chuvas que causaram a cheia do Rio Ribeira de Iguape. No exterior, a revogação das restrições de emissões de usinas de energia fóssil por parte do governo Trump pode ter efeitos devastadores no combate ao aquecimento global. A Allianz, por sua vez, lançou uma plataforma gratuita para avaliar os riscos de eventos climáticos extremos baseada na localização do imóvel no Brasil, sendo o primeiro país da América Latina a ter acesso a essa ferramenta.", "direitos_humanos": "A situação humanitária em Djibouti piorou com a chegada de refugiados yemenitas, conforme relata o Al Jazeera. Em outro desenvolvimento, a ONU expressou preocupação com o Brasil durante uma reunião do Conselho de Direitos Humanos, destacando a persistência da escravidão e do tráfico de pessoas, apesar de compromissos anteriores. Em um evento sombrio, 26 crianças morreram em um incêndio em uma escola em Bukavu, na República Democrática do Congo, levando a uma cerimônia de enterro coletiva. Além disso, a The Diplomat informa que uma seita hindu, próxima ao partido governante BJP da Índia, pediu que mulheres não trabalhassem no Eiffel Tower durante a visita de seus monges, resultando em uma greve no local. Estas notícias abrangem diversos aspectos da questão dos direitos humanos, desde a proteção de crianças até a violência contra mulheres em locais de trabalho."}, "resumo_do_dia": {"politica_nacional": [{"id": 162007, "titulo": "Presidente do TST defende nova legislação para proteger trabalhadores de plataformas", "url": "https://www.jota.info/trabalho/presidente-do-tst-defende-nova-legislacao-para-proteger-trabalhadores-de-plataformas", "fonte_id": "jota", "data_pub": "2026-09-14T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luiz Philippe Vieira de Mello Filho, presidente do TST, defendeu a necessidade de uma nova legislação para proteger trabalhadores de plataformas digitais. Ele afirmou que a CLT não atende mais às novas relações de trabalho e que é necessário diálogo na criação de novas regras.", "titulo_pt": "Presidente do TST defende nova legislação para proteger trabalhadores de plataformas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 161732, "titulo": "Programa que dá crédito a motoristas de app se torna permanente", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/programa-que-da-credito-motoristas-de-app-se-torna-permanente", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-14T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva sancionou a lei que torna permanente o programa Move Brasil, que oferece linhas de crédito para veículos novos para motoristas de aplicativo, taxistas, entregadores, motoapps e agora também para motoristas de transporte escolar. O programa passa a ser um benefício contínuo.", "titulo_pt": "Programa de crédito para motoristas de app se torna permanente", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 161707, "titulo": "Master-BRB: Defesa de Vorcaro pede adiamento de depoimento à PF marcado para esta terça", "url": "https://g1.globo.com/politica/noticia/2026/09/14/defesa-de-vorcaro-pede-para-adiar-depoimento-a-pf-marcado-para-a-proxima-terca.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-14T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A defesa do ex-banqueiro Daniel Vorcaro solicitou o adiamento de seu depoimento à Polícia Federal, marcado para a próxima terça-feira (15), devido à falta de acesso aos documentos anexados aos autos. O depoimento está agendado na mesma data em que o plenário do Supremo Tribunal Federal realiza uma sessão extraordinária.", "titulo_pt": "Defesa de Vorcaro pede adiamento de depoimento à PF", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 161708, "titulo": "Eleições 2026: David Almeida participa de entrevista e propõe transformar Manaus em sede de grandes eventos esportivos", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/14/eleicoes-2026-david-almeida-participa-de-entrevista-e-propoe-transformar-manaus-em-sede-de-grandes-eventos-esportivos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-14T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "David Almeida, candidato ao Governo do Amazonas pelo Avante, participou de uma entrevista em Manaus nesta segunda-feira (14). Durante a entrevista, ele propôs transformar Manaus em sede de grandes eventos esportivos e fortalecer o turismo na capital e no interior do estado.", "titulo_pt": "David Almeida participa de entrevista e propõe transformar Manaus em sede de grandes eventos esportivos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 161915, "titulo": "Caso Moraes-Vorcaro: o que está em jogo no STF e quem fala primeiro na sessão", "url": "https://www.bbc.com/portuguese/articles/cqdr7npp6v4xo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-14T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ministros do Supremo Tribunal Federal (STF) devem decidir sobre a possibilidade de abrir uma investigação contra Alexandre de Moraes. Há incertezas sobre os detalhes da sessão.", "titulo_pt": "Caso Moraes-Vorcaro: o que está em jogo no STF e quem falará primeiro na sessão", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 161697, "titulo": "A crise do Supremo não termina com as urnas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/voto-a-voto/2026/09/a-crise-do-supremo-nao-termina-com-as-urnas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-14T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há cerca de três décadas, juízes constitucionais agem politicamente, conforme mostrado pelo campo de 'judicial politics'. Negar esse comportamento pode levar a falsas esperanças no Judiciário.", "titulo_pt": "A crise do Supremo não termina com as urnas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 161698, "titulo": "Candidata ao Senado por MT indica como suplente lobista investigado por fraudes do INSS", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/candidata-ao-senado-por-mt-indica-como-suplente-lobista-investigado-por-fraudes-do-inss.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-14T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada estadual e candidata ao Senado por Mato Grosso, Janaína Riva (MDB), indicou como primeiro suplente o empresário Danilo Trento, que é apontado como lobista envolvido em um esquema de fraudes do INSS.", "titulo_pt": "Candidata ao Senado por MT indica lobista investigado como suplente", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 161822, "titulo": "TRE-RJ suspende julgamento após formar maioria a favor de Rebeca Ramagem", "url": "https://www.metropoles.com/colunas/grande-angular/tre-rj-suspende-julgamento-apos-formar-maioria-a-favor-de-rebeca-ramagem", "fonte_id": "metropoles", "data_pub": "2026-09-14T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Regional Eleitoral do Rio de Janeiro (TRE-RJ) suspendeu o julgamento após formar maioria a favor da candidatura de Rebeca Ramagem. O relator votou contra a candidatura, mas quatro desembargadores votaram a favor. A sessão foi interrompida antes do resultado final por um pedido de vista.", "titulo_pt": "TRE-RJ suspende julgamento após formar maioria a favor de Rebeca Ramagem", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 161688, "titulo": "Trump minimiza alerta de líderes de IA e diz que EUA já têm controle sobre setor", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/trump-minimiza-alerta-de-lideres-de-ia-e-diz-que-eua-ja-tem-controle-sobre-setor.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-14T21:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, afirmou que o país já possui medidas de segurança para regulamentar e processar judicialmente empresas de inteligência artificial. Ele minimizou as preocupações expressas por líderes do setor sobre o uso indevido da IA no fim de semana.", "titulo_pt": "Trump minimiza alertas sobre IA e afirma controle americano", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 161709, "titulo": "Quaest: 37% avaliam que Mendonça age de forma correta na crise do STF; 16% defendem Moraes", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/14/quaest-parte-defende-mendonca-age-de-forma-correta-na-crise-do-stf.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-14T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest revela que 37% dos brasileiros consideram que o ministro André Mendonça age corretamente na crise do STF, enquanto 16% acreditam que Alexandre de Moraes está agindo corretamente. O levantamento ouviu 2.001 pessoas.", "titulo_pt": "37% Avaliam que Mendonça age corretamente na crise do STF; 16% defendem Moraes", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 161710, "titulo": "Cezinha de Madureira emprega na Câmara sargento expulso da PM suspeito de envolvimento com PCC", "url": "https://g1.globo.com/politica/noticia/2026/09/14/cezinha-de-madureira-emprega-na-camara-sargento-expulso-da-pm-suspeito-de-envolvimento-com-pcc.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-14T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cezinha de Madureira, alvo de operação da Polícia Federal, emprega um ex-sargento da Polícia Militar suspeito de ter ligações com o PCC em seu gabinete na Câmara dos Deputados. Farani Salvador Júnior, expulso da PM em 2023, começou a trabalhar com Cezinha em agosto de 2024.", "titulo_pt": "Cezinha de Madureira emprega na Câmara sargento expulso da PM suspeito de envolvimento com PCC", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 161760, "titulo": "Flávio e PL lideram uso político de deepfakes na pré-campanha, revela levantamento", "url": "https://veja.abril.com.br/politica/flavio-e-pl-lideram-uso-politico-de-deepfakes-na-pre-campanha-revela-levantamento/", "fonte_id": "veja", "data_pub": "2026-09-14T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento realizado pelo Observatório IA nas Eleições mostrou que Flávio Bolsonaro e seu partido são os principais usuários políticos de deepfakes na pré-campanha. O uso da tecnologia se destacou antes que o TSE (Tribunal Superior Eleitoral) iniciasse a fiscalização de conteúdos sintéticos.", "titulo_pt": "Flávio e PL lideram uso político de deepfakes na pré-campanha, revela levantamento", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 161711, "titulo": "Quaest: 67% dizem que crise no STF não influencia voto para presidente", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/14/quaest-67percent-dizem-que-crise-no-stf-nao-influencia-voto-para-presidente.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-14T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento realizado pelo jornal O Globo e pela Globo mostrou que 67% dos brasileiros não consideram a crise no Supremo Tribunal Federal influente na escolha do candidato para a presidência. 7% disseram que podem mudar de opinião, enquanto 22% acreditam que a crise reforça sua decisão.", "titulo_pt": "67% Dizem que crise no STF não influencia voto para presidente", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 161712, "titulo": "STF analisa nesta terça se abre investigação contra Moraes por mensagens com Vorcaro", "url": "https://g1.globo.com/politica/ao-vivo/stf-investigacao-moraes-mensagens-vorcaro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-14T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) realiza uma sessão plenária extraordinária para analisar se deve ser aberta uma investigação contra o ministro Alexandre de Moraes por mensagens com o ex-dono do Banco Master, Daniel Vorcaro. O relatório da Polícia Federal contém 52 mensagens trocadas entre o ex-banqueiro e o ministro.", "titulo_pt": "STF analisa se abre investigação contra Moraes por mensagens com Vorcaro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 161699, "titulo": "FGV Direito SP reúne professores e alunos para acompanhar sessão do STF sobre Moraes", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/fgv-direito-sp-reune-professores-e-alunos-para-acompanhar-sessao-do-stf-sobre-moraes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-14T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A FGV Direito SP irá reunir professores e alunos em um auditório para acompanhar uma sessão do STF que discutirá a abertura de uma investigação sobre o ministro Alexandre de Moraes.", "titulo_pt": "FGV Direito SP reúne professores e alunos para acompanhar sessão do STF sobre Moraes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 161766, "titulo": "Lula x Flávio: o que explica as diferenças nos números das pesquisas Quaest e Nexus", "url": "https://veja.abril.com.br/politica/lula-x-flavio-o-que-explica-as-diferencas-nos-numeros-da-quaest-e-da-nexus/", "fonte_id": "veja", "data_pub": "2026-09-14T20:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As pesquisas Quaest e Nexus apresentam resultados semelhantes em relação ao desempenho de Lula e Flávio no cenário presidencial, mas variam nos percentuais, notadamente na Região Sudeste.", "titulo_pt": "Lula x Flávio: o que explica as diferenças nos números das pesquisas Quaest e Nexus", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 161426, "titulo": "Taiwan urged to boost defense spending", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/15/2003864277", "fonte_id": "taipei_times", "data_pub": "2026-09-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Taiwan foi encorajada a aumentar gastos em defesa. O texto sugere que há uma recomendação para que a economia taiwanesa dedique mais recursos à área militar.", "titulo_pt": "Taiwan encorajada a aumentar gastos em defesa", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 161684, "titulo": "Aprovação de Trump sobe após atingir mínima histórica em pesquisa Reuters/Ipsos", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/aprovacao-de-trump-sobe-apos-atingir-minima-historica-em-pesquisa-reutersipsos.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-14T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A aprovação de Trump subiu levemente após atingir seu valor mais baixo histórico, de acordo com uma pesquisa Reuters/Ipsos. Os americanos demonstram apoio crescente para a reversão da maioria republicana no Congresso para os democratas.", "titulo_pt": "Aprovação de Trump sobe após atingir mínima histórica em pesquisa Reuters/Ipsos", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 162115, "titulo": "US Space Force confirms weapons deployed in space for first time", "url": "https://www.france24.com/en/americas/20260914-us-space-force-confirms-weapons-deployed-in-space-for-first-time", "fonte_id": "france24", "data_pub": "2026-09-14T21:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Exército Espacial dos Estados Unidos confirmou pela primeira vez que possui armas em órbita, enquanto os Estados Unidos, China e Rússia expandem suas capacidades militares no espaço. Esta revelação destaca o crescimento da importância de controlar o domínio espacial e proteger satélites cruciais para comunicações militares, vigilância e navegação.", "titulo_pt": "Exército espacial dos EUA confirma armas em órbita pela primeira vez", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 162139, "titulo": "United States Space Force says US has weapons in orbit", "url": "https://www.euronews.com/2026/09/14/united-states-space-force-says-us-has-weapons-in-orbit", "fonte_id": "euronews", "data_pub": "2026-09-14T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Exército Espacial dos Estados Unidos afirma que o país possui armas em órbita. O espaço, que era tradicionalmente um campo de confronto entre superpotências durante a Guerra Fria, se transformou em uma área estratégica crucial, com diversos estados competindo por vantagens militares e tecnológicas.", "titulo_pt": "Exército espacial dos EUA confirma armas em órbita", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 162057, "titulo": "Australia politics live: Hastie accuses Hanson of avoiding media; Anthony Albanese and King Charles speak", "url": "https://www.theguardian.com/australia-news/live/2026/sep/15/one-nation-pauline-hanson-immigration-coalition-andrew-hastie-angus-taylor-labor-anthony-albanese-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-09-14T21:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O premiê do estado australiano do Sul, Peter Malinauskas, expressou esperança de que a produção de aço continuará no estado, após a anunciada encerramento de uma grande fornalha a soprar em Whyalla. Malinauskas, que estava no local, disse que havia sentimentos de desilusão e tristeza, mas também uma sensação de inevitabilidade.", "titulo_pt": "Austrália: malinauskas expressa esperança para a produção de aço em whyalla", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 162141, "titulo": "Landowners in Texas ask court to stop Trump border wall", "url": "https://www.aljazeera.com/news/2026/9/14/landowners-in-texas-ask-court-to-stop-trump-border-wall?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-14T21:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Donos de terras em Texas pedem à corte para impedir a construção da parede de Trump na fronteira. A região de Big Bend registra aproximadamente 1% das detenções na fronteira.", "titulo_pt": "Donos de terras em Texas pedem à corte para impedir parede de Trump na fronteira", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 162002, "titulo": "Un oligarca ruso cercano a Putin pagó los festejos tras la boda del hijo mayor de Donald Trump en las Bahamas", "url": "https://elpais.com/internacional/2026-09-14/un-oligarca-ruso-cercano-a-putin-pago-los-festejos-tras-la-boda-del-hijo-mayor-de-donald-trump-en-las-bahamas.html", "fonte_id": "elpais_america", "data_pub": "2026-09-14T21:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Umar Kremlev, um oligarca russo próximo a Putin, pagou as contas dos festejos da cerimônia de casamento do filho mais velho de Donald Trump, que ocorreu nas Bahamas. A informação foi confirmada pela própria dupla noivos.", "titulo_pt": "Oligarca russo próximo a Putin pagou festividades da cerimônia de casamento do filho de Trump nas Bahamas", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 162001, "titulo": "Carín León cierra su residencia en Las Vegas tras el trago amargo de la cancelación: “Entiendo el sacrificio, yo fui fan y entiendo lo que se gasta”", "url": "https://elpais.com/us/2026-09-14/carin-leon-cierra-su-residencia-en-las-vegas-tras-el-trago-amargo-de-la-cancelacion-entiendo-el-sacrificio-yo-fui-fan-y-entiendo-lo-que-se-gasta.html", "fonte_id": "elpais_america", "data_pub": "2026-09-14T21:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Carín León encerra sua residência em Las Vegas após a cancelação, anunciando quatro novos shows no próximo ano. O espetáculo destaca artistas da sua região natal, Sonora, e visa empoderar a comunidade latina.", "titulo_pt": "Carín León encerra residência em Las Vegas e anuncia novos shows no próximo ano", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 162116, "titulo": "Bob Mackie, fashion designer for the stars, dies at 87", "url": "https://www.france24.com/en/bob-mackie-fashion-designer-for-the-stars-dies-at-87", "fonte_id": "france24", "data_pub": "2026-09-14T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bob Mackie, designer de moda conhecido por suas roupas para celebridades como Cher e Elton John, faleceu aos 87 anos em 2023. Sua carreira durou cinco décadas e incluiu a criação de um conjunto de roupas para uma boneca Barbie.", "titulo_pt": "Bob Mackie, designer de moda para estrelas, morre aos 87 anos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 162142, "titulo": "Israeli attack targets Gaza displacement camp", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/14/israeli-attack-targets-gaza-displacement-camp?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-14T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque israelense alvo de um acampamento de deslocados palestinos em Gaza foi registrado.", "titulo_pt": "Ataque israelense alvo de acampamento de deslocados palestinos em Gaza", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 162111, "titulo": "Legendary costume designer Bob Mackie dies aged 87", "url": "https://www.bbc.co.uk/news/articles/cmpq04wx8l4eo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-14T21:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bob Mackie, conhecido como o 'Sultão dos Sequinhos', faleceu aos 87 anos. Ele projetou figurinos icônicos e brilhantes para celebridades como Cher, Tina Turner e Elton John.", "titulo_pt": "Bob Mackie, o 'sultão dos sequinhos', morre aos 87 anos", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 162117, "titulo": "Rights group accuses Israel of dismantling 'Palestinian existence' in West Bank", "url": "https://www.france24.com/en/rights-group-accuses-israel-of-dismantling-palestinian-existence-in-west-bank", "fonte_id": "france24", "data_pub": "2026-09-14T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de direitos israelense, B'Tselem, acusa o governo israelense de tentar impossibilitar a existência dos palestinos como povo no Território Ocupo, através de cinco tácticas: violência, limpeza étnica, restrições de movimento, estilhaçamento econômico e destruição social e política. O relatório é intitulado 'O Projeto de Eliminação'.", "titulo_pt": "Grupo de direitos acusa Israel de desmantelar a 'existência Palestinian' no território ocupo", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 162145, "titulo": "‘Columbia did not care’: Mahmoud Khalil files discrimination lawsuit", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/14/columbia-did-not-care-mahmoud-khalil-files-discrimination-lawsuit?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-14T21:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mahmoud Khalil, um ativista e ex-aluno da Universidade Columbia, está processando a universidade e um vice-reitor por acusações de discriminação.", "titulo_pt": "Columbia não se importou", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 162146, "titulo": "Why talks in Oman between Iran and Gulf Arab states were postponed", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/14/why-talks-in-oman-between-iran-and-gulf-arab-states-were-postponed?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-14T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As esperanças de um avanço nas relações entre Irã e estados do Golfo foram prejudicadas após as negociações em Omã entre as partes serem adiadas.", "titulo_pt": "Negociações entre Irã e estados do golfo em omã foram adiadas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 162225, "titulo": "Judge blocks Trump administration plans to limit visa length for grad students, postdocs", "url": "https://www.statnews.com/2026/09/14/court-halts-dhs-visa-limits-foreign-scholars/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-14T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz federal impediu um plano da administração Trump que pretendia limitar o tempo de permanência no país para estudantes de pós-graduação e pós-doutorandos a quatro anos.", "titulo_pt": "Juiz suspende plano da administração Trump para limitar vistos de estudantes de pós-graduação e pós-doutorandos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 162147, "titulo": "US blocks Iran nuclear chief from attending key Vienna conference", "url": "https://www.aljazeera.com/news/2026/9/14/us-blocks-iran-nuclear-chief-from-attending-key-vienna-conference?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-14T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Irã acusa os Estados Unidos de pressionarem a Áustria para revogar o visto de Mohammad Eslami, chefe nuclear iraniano, impedindo sua participação em uma conferência crucial em Viena. Isso é visto como uma violação dos direitos dos membros do país.", "titulo_pt": "EUA bloqueiam chefe nuclear iraniano de participar de conferência chave em viena", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 161450, "titulo": "BIS says global market AI momentum showing signs of vulnerability", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/15/2003864266", "fonte_id": "taipei_times", "data_pub": "2026-09-15T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco Internacional de Desenvolvimento (BIS) observa sinais de vulnerabilidade no impulso atual do mercado global de inteligência artificial (IA).", "titulo_pt": "BIS registra sinais de vulnerabilidade no impulso atual do mercado global de IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 161687, "titulo": "Fraude do Master é ponto fora da curva e fundos imobiliários seguem em alta", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/fraude-do-master-e-ponto-fora-da-curva-e-fundos-imobiliarios-seguem-em-alta.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-14T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Apesar da condenação da CVM ao Banco Master e a outros envolvidos, especialistas não veem problemas estruturais ou de fiscalização nos FIIs. A fraude do Master é vista como um episódio isolado e restrito a um grupo específico.", "titulo_pt": "Fraude do Master não afeta estrutura dos fiis, dizem especialistas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 162143, "titulo": "US repeals rules limiting greenhouse gas emissions by power plants", "url": "https://www.aljazeera.com/news/2026/9/14/us-repeals-rules-limiting-greenhouse-gas-emissions-by-power-plants?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-14T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump revogou regras que limitavam as emissões de gases de efeito estufa por usinas elétricas, alegando que isso poderia economizar mais de 300 bilhões de dólares para as usinas e liberar a energia americana.", "titulo_pt": "EUA revoga regras sobre emissões de gases de efeito estufa por usinas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 161733, "titulo": "Estados e municípios têm limite de crédito para 2026 ampliado", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/estados-e-municipios-tem-limite-de-credito-para-2026-ampliado", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-14T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Monetário Nacional aumentou em R$ 2 bilhões o limite global anual de crédito para estados, Distrito Federal e municípios, passando de R$ 26,625 bilhões para R$ 28,625 bilhões. A medida amplia a possibilidade desses entes federativos contratarem empréstimos para financiar projetos e investimentos dentro das regras fiscais estabelecidas para 2026.", "titulo_pt": "Limite de crédito para estados e municípios é ampliado para 2026", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 161866, "titulo": "Títulos do Tesouro dos EUA fecham no maior patamar em 3 anos com juros e IA", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/titulos-do-tesouro-dos-eua-fecham-no-maior-patamar-em-3-anos-com-juros-e-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-14T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os títulos do Tesouro dos Estados Unidos fecharam em seu maior patamar em três anos, com juros elevados e preocupações sobre o desenvolvimento acelerado da inteligência artificial levantadas por executivos de empresas como Anthropic, OpenAI e xAI.", "titulo_pt": "Títulos do Tesouro dos EUA fecham em maior patamar em 3 anos com juros e preocupações sobre IA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 161689, "titulo": "Brasil deve negociar tarifaço com EUA durante reunião do G20, afirma ministro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/brasil-deve-negociar-tarifaco-com-eua-durante-reuniao-do-g20-afirma-ministro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-14T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Indústria, Márcio Elias Rosa, afirmou que planeja se reunir com o embaixador dos Estados Unidos para discutir o tarifaço sobre produtos brasileiros. A reunião está programada para o final do mês.", "titulo_pt": "Brasil deve negociar tarifaço com EUA durante reunião do G20, afirma ministro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 162187, "titulo": "US has weapons deployed in orbit, Space Force says, for ‘offensive and defensive’ use", "url": "https://www.scmp.com/news/world/united-states-canada/article/3367513/us-has-weapons-deployed-orbit-space-force-says-offensive-and-defensive-use?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-14T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Exército Espacial dos Estados Unidos confirmou que armas estão em órbita, para uso ofensivo e defensivo. A força afirmou que possui armas em órbita capazes de defender a Força Conjunta contra ação hostil de adversários.", "titulo_pt": "EUA têm armas em órbita, Space Force confirma para uso ofensivo e defensivo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 161690, "titulo": "Você pode acertar o que vai acontecer e ainda perder muito dinheiro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/09/voce-pode-acertar-o-que-vai-acontecer-e-ainda-perder-muito-dinheiro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-14T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O autor cita um exemplo de uma pessoa que prevê retornar mais cedo do feriado para evitar o trânsito, mas acaba se enganando ao descobrir que a estrada já está congestionada. Muitas pessoas pensam como ele e saem antes, mas ainda assim, muitas acabam perdendo dinheiro devido ao tráfego.", "titulo_pt": "Você pode prever corretamente, mas ainda perder dinheiro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 162193, "titulo": "Insurers suffer 1st losses in 6 yrs from auto insurance biz in H1", "url": "https://en.yna.co.kr/view/AEN20260914009900320", "fonte_id": "yonhap_news", "data_pub": "2026-09-14T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As seguradoras sul-coreanas sofreram suas primeiras perdas no negócio de seguro automóvel em seis anos no primeiro semestre de 2023.", "titulo_pt": "Seguradoras sul-coreanas enfrentam perdas no seguro automóvel após seis anos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 162194, "titulo": "Import prices fall for 3rd month in Aug. on stronger won", "url": "https://en.yna.co.kr/view/AEN20260914010100320", "fonte_id": "yonhap_news", "data_pub": "2026-09-14T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços das importações caíram pelo terceiro mês consecutivo em agosto, devido ao real mais forte.", "titulo_pt": "Preços das importações caem por terceiro mês consecutivo em agosto, devido ao real mais forte", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 161765, "titulo": "Ibovespa desvaloriza com preços do petróleo e Superquarta no radar", "url": "https://veja.abril.com.br/economia/ibovespa-desvaloriza-com-precos-do-petroleo-e-superquarta-no-radar/", "fonte_id": "veja", "data_pub": "2026-09-14T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa teve uma desvalorização influenciada pelos preços do petróleo e pela Superquarta. A agenda econômica também incluiu novas projeções do Boletim Focus sobre a inflação no Brasil.", "titulo_pt": "Ibovespa cai com petróleo e Superquarta; focus projeta inflação", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 162197, "titulo": "[Allison Schrager] US tuition fees due a correction", "url": "https://www.koreaherald.com/article/10873093", "fonte_id": "korea_herald", "data_pub": "2026-09-14T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A percepção sobre a universidade mudou significativamente. Agora, muitas pessoas não veem a educação superior como uma garantia de investimento, e algumas escolas menores estão usando seus fundos para sobreviver. Escolas populares e estabelecidas, como a Syracuse, também estão enfrentando problemas de inscrição e crise orçamentária, levando a especulações sobre uma possível correção nos custos da universidade.", "titulo_pt": "Taxas de universidade precisam de uma correção", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 161691, "titulo": "Receita envia ao TCU modelo de cálculo da nova contribuição da reforma tributária", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/09/receita-envia-ao-tcu-modelo-de-calculo-da-nova-contribuicao-da-reforma-tributaria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-14T20:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Receita Federal enviou ao TCU o modelo de cálculo da CBS, contribuição que substituirá o PIS, Cofins e IOF-Seguros a partir de 2027, e que também reporá parte da arrecadação do IPI.", "titulo_pt": "Receita envia modelo de cálculo da nova contribuição cbs ao TCU", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 161692, "titulo": "Lagarde alerta que Europa enfrenta risco sem precedentes de ficar isolada da IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/lagarde-alerta-que-europa-enfrenta-risco-sem-precedentes-de-ficar-isolada-da-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-14T19:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Christine Lagarde, presidente do Banco Central Europeu, alertou que a Europa enfrenta um risco sem precedentes de ficar isolada em relação à inteligência artificial. Ela enfatizou a necessidade de a Europa se tornar produtora de tecnologia de IA para preservar sua autonomia e alcançar ganhos de eficiência.", "titulo_pt": "Lagarde avisa risco sem precedentes de Europa ficar isolada em IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 161693, "titulo": "Empresas abertas pedem a presidenciáveis manutenção de títulos isentos de IR", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/empresas-abertas-pedem-a-presidenciaveis-manutencao-de-titulos-isentos-de-ir.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-14T19:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As maiores empresas abertas do país vão solicitar aos candidatos à presidência manutenção dos títulos isentos de imposto de renda, como LCIs e LCAs. Essa solicitação visa preservar benefícios fiscais para esses investimentos.", "titulo_pt": "Empresas abertas pedem manutenção de títulos isentos de IR aos presidenciáveis", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 162132, "titulo": "Counting the votes: Warsh faces a tough battle as the Fed girds for expected interest rate hike", "url": "https://www.cnbc.com/2026/09/14/counting-the-votes-warsh-faces-tough-battle-as-fed-girds-for-expected-rate-hike.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-14T19:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Traders estavam projetando uma probabilidade superior a 92% de uma elevação das taxas de juros, além de mais de 75% de probabilidade de outra elevação em dezembro.", "titulo_pt": "Contando os votos: warsh enfrenta difícil batalha à medida que o Fed se prepara para uma elevação de taxas de juros esperada", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 161752, "titulo": "O que está por trás do levante pela paralisação da IA encabeçado por executivos responsáveis pela tecnologia", "url": "https://veja.abril.com.br/tecnologia/o-que-esta-por-tras-do-levante-pela-paralisacao-da-ia-encabecado-por-executivos-responsaveis-pela-tecnologia/", "fonte_id": "veja", "data_pub": "2026-09-14T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Executivos das empresas Anthropic, OpenAI, SpaceX e Google DeepMind concordaram sobre os riscos das inteligências artificiais que se tornaram cada vez mais poderosas.", "titulo_pt": "O que está por trás do levante pela paralisação da IA encabeçado por executivos responsáveis pela tecnologia", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 162204, "titulo": "Nvidia CEO Jensen Huang tells Trump ‘we’re not going to let [an AI slowdown] happen’", "url": "https://techcrunch.com/2026/09/14/nvidia-ceo-jensen-huang-tells-trump-were-not-going-to-let-an-ai-slowdown-happen/", "fonte_id": "techcrunch", "data_pub": "2026-09-14T21:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang, CEO da Nvidia, afirmou que não permitirá que um atraso no desenvolvimento de IA ocorra. Embora Elon Musk e Sam Altman tenham apoiado as chamadas de Dario Amodei para diminuir o ritmo do desenvolvimento de IA, Huang parece ter uma opinião diferente.", "titulo_pt": "CEO da nvidia diz a Trump que não permitirá atraso no desenvolvimento de IA", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 161917, "titulo": "Por que cofundador da Anthropic defende um 'botão de desligamento' obrigatório para IA", "url": "https://www.bbc.com/portuguese/articles/c5y4zx9l98k9o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-14T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jack Clark afirmou à BBC que os detalhes sobre a implementação de um 'botão de desligamento' para IA devem ser discutidos como parte de uma discussão política mais ampla sobre o tema.", "titulo_pt": "Por que cofundador da Anthropic defende um 'botão de desligamento' obrigatório para IA", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 162186, "titulo": "The classic Chinese parenting playbook won’t survive the AI age", "url": "https://www.scmp.com/opinion/hong-kong-opinion/article/3366957/classic-chinese-parenting-playbook-wont-survive-ai-age?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-14T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mães e pais chineses, como a de Ng, investem tempo e recursos enviando seus filhos para várias aulas de tutoria na esperança de melhorar o desempenho acadêmico. No entanto, com a chegada da era da inteligência artificial, a pergunta se essa dedicação ainda vale a pena começa a ser levantada.", "titulo_pt": "O antigo guia chinês de educação não resistirá à era da inteligência artificial", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 162220, "titulo": "What execs and politicians are saying about slowing down AI development", "url": "https://www.theverge.com/ai-artificial-intelligence/995141/ai-executives-politicians-safety-regulation-anthropic-dario-amodei", "fonte_id": "the_verge", "data_pub": "2026-09-14T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Executivos e políticos têm se pronunciado sobre a necessidade de acelerar ou retardar o desenvolvimento da inteligência artificial. Dario Amodei publicou um longo ensaio argumentando a favor de um ritmo mais lento no desenvolvimento da IA, iniciando uma onda de declarações sobre segurança na IA.", "titulo_pt": "O que executivos e políticos estão dizendo sobre o ritmo do desenvolvimento da IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 161981, "titulo": "Trump compara el “bulo” del peligro de la IA con el “timo” del cambio climático", "url": "https://www.latercera.com/mundo/noticia/trump-compara-el-bulo-del-peligro-de-la-ia-con-el-timo-del-cambio-climatico/", "fonte_id": "la_tercera", "data_pub": "2026-09-14T21:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Trump comparou as alegações sobre o perigo da IA com as afirmações anteriores sobre o cambio climático, afirmando que ambas eram baseadas em bulos sem fundamento. Ele argumentou que as pessoas que fazem essas afirmações sobre a IA são as mesmas que recentemente propagavam teorias sobre o fim do mundo devido ao aquecimento global.", "titulo_pt": "Trump compara 'lenda' sobre perigo da IA com 'fraude' do aquecimento global", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 161872, "titulo": "União Europeia planeja proibir redes sociais e IA para menores de 15 anos", "url": "https://www.cnnbrasil.com.br/internacional/uniao-europeia-planeja-proibir-redes-sociais-e-ia-para-menores-de-15-anos/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-14T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Líderes da União Europeia devem apresentar medidas esta semana para proibir redes sociais e inteligência artificial para menores de 15 anos, e a proposta também abrange jogos online.", "titulo_pt": "União Europeia planeja proibir redes sociais e IA para menores de 15 anos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 162205, "titulo": "OpenAI buys smartphone camera maker Glass Imaging for $300 million, report says", "url": "https://techcrunch.com/2026/09/14/openai-buys-smartphone-camera-maker-glass-imaging-for-300-million-report-says/", "fonte_id": "techcrunch", "data_pub": "2026-09-14T20:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI adquiriu a Glass Imaging, uma empresa de câmeras para smartphones fundada por ex-engenheiros da Apple que lideraram o desenvolvimento do modo Portrait da Apple. A transação foi estimada em 300 milhões de dólares.", "titulo_pt": "Openai compra fabricante de câmeras para smartphones Glass Imaging por 300 milhões de dólares, relata", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 162189, "titulo": "UN Security Council to hold meeting on AI next week amid international concern", "url": "https://www.scmp.com/news/world/united-states-canada/article/3367511/un-security-council-hold-meeting-ai-next-week-amid-international-concern?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-14T20:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Assembleia Geral das Nações Unidas realizará uma reunião do Conselho de Segurança sobre inteligência artificial na próxima semana, devido ao crescente preocupação internacional sobre o risco associado à rápida evolução da tecnologia. A França presidirá o conselho nesta ocasião.", "titulo_pt": "Conselho de segurança das nações unidas realizará reunião sobre IA na próxima semana", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 162206, "titulo": "AI infrastructure company Cornelis raises $205M to chip away at Nvidia’s dominance", "url": "https://techcrunch.com/2026/09/14/ai-infrastructure-company-cornelis-raises-205m-to-chip-away-at-nvidias-dominance/", "fonte_id": "techcrunch", "data_pub": "2026-09-14T20:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Cornelis levantou $205 milhões para competir com a Nvidia no mercado de infraestrutura de inteligência artificial. A companhia lançou um produto chamado Active Compute Fabric, uma tecnologia de rede que visa reduzir o tempo de espera dos GPUs por dados.", "titulo_pt": "Companhia de infraestrutura de IA Cornelis arrecada $205 milhões para desafiar a dominância da Nvidia", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 162222, "titulo": "Jensen Huang puts Trump on speakerphone onstage to announce robots won’t take over the world", "url": "https://www.theverge.com/tech/995079/president-donald-trump-calls-nvidia-ceo-jensen-huang-all-in-summit", "fonte_id": "the_verge", "data_pub": "2026-09-14T20:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Nvidia, Jensen Huang, recebeu uma chamada do presidente dos Estados Unidos, Donald Trump, durante um evento. Huang colocou a chamada em speakerphone para o público assistir, durante o qual Trump fez alguns comentários.", "titulo_pt": "Jensen Huang coloca Trump em speakerphone para anunciar que robôs não vão dominar o mundo", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 162223, "titulo": "Valve’s virtual reality plans hit actual reality", "url": "https://www.theverge.com/tech/995055/valve-steam-frame-price-ram-impact", "fonte_id": "the_verge", "data_pub": "2026-09-14T19:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O headset Steam Frame foi lançado, embora tenha custado mais do que o esperado, devido à alta do mercado global de RAM e armazenamento, que afetou todos os fabricantes.", "titulo_pt": "Valve’s virtual reality plans hit actual reality", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 162198, "titulo": "OpenAI stuck fighting Musk antitrust suit after Apple finds a way out", "url": "https://arstechnica.com/tech-policy/2026/09/musk-drops-apple-from-antitrust-suit-but-keeps-gunning-for-openai/", "fonte_id": "ars_technica", "data_pub": "2026-09-14T19:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Elon Musk parou de criticar a Apple por sua integração com o ChatGPT, mas continua criticando a OpenAI. A Apple encontrou uma maneira de se desligar do caso antitruste com a OpenAI, permitindo que Musk pare de criticar a empresa tecnológica.", "titulo_pt": "Musk para ataques a Apple sobre integração com chatgpt, mas continua com openai", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 162199, "titulo": "Founder’s cost-cutting obsession drove Unitree lead in cheap humanoid robots", "url": "https://arstechnica.com/ai/2026/09/founders-cost-cutting-obsession-drove-unitree-lead-in-cheap-humanoid-robots/", "fonte_id": "ars_technica", "data_pub": "2026-09-14T19:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Wang Xingxing, fundador da Unitree, focou intensamente em cortes de custos, levando a empresa a se destacar no mercado de robôs humanóides econômicos. Agora, questiona-se se esse estilo de liderança será capaz de levar a empresa a novos sucessos.", "titulo_pt": "Obsessão do fundador em cortar custos levou o Unitree a liderar em robôs humanóides econômicos, mas será que esse modelo de liderança será sustentável?", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 162200, "titulo": "Apple releases iOS 27, macOS Golden Gate 27 with Siri AI and Liquid Glass refinements", "url": "https://arstechnica.com/apple/2026/09/apple-releases-ios-27-macos-golden-gate-27-with-siri-ai-and-liquid-glass-refinements/", "fonte_id": "ars_technica", "data_pub": "2026-09-14T19:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple lançou a versão iOS 27 e macOS Golden Gate 27, que incluem melhorias no Siri e no Liquid Glass. É a última versão do macOS que suporta Rosetta para aplicativos Intel.", "titulo_pt": "Apple libera ios 27 e macos Golden Gate 27 com melhorias no Siri e no Liquid Glass", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 162201, "titulo": "AI leaders want to hit the brakes after years of reckless speed", "url": "https://arstechnica.com/ai/2026/09/ai-leaders-want-to-hit-the-brakes-after-years-of-reckless-speed/", "fonte_id": "ars_technica", "data_pub": "2026-09-14T19:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes de inteligência artificial querem reduzir a velocidade após anos de desenvolvimento acelerado. A segurança é a prioridade, mas há possíveis benefícios industriais por trás disso.", "titulo_pt": "Líderes de IA querem frear após anos de desenvolvimento acelerado", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 162227, "titulo": "Structural study explains how cells stabilize protective membrane pockets", "url": "https://phys.org/news/2026-09-cells-stabilize-membrane-pockets.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos estruturais explicam como as membranas celulares estabilizam bolsões protetores. Essas bolsões, chamadas caveolae, desempenham funções importantes na proteção de células de vasos sanguíneos e na regulação da pressão sanguínea.", "titulo_pt": "Estudo estrutural explica como as membranas celulares estabilizam bolsões protetores", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 162228, "titulo": "Light and nanomaterials could offer new method for detecting metal contamination in water", "url": "https://phys.org/news/2026-09-nanomaterials-method-metal-contamination.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A acessibilidade à água limpa depende não apenas de prevenir a poluição, mas também de detectar contaminantes rapidamente e de maneira confiável. Materiais nanomateriais combinados com luz podem oferecer um novo método para detectar contaminação metálica na água.", "titulo_pt": "Luz e nanomateriais poderiam oferecer novo método para detectar contaminação metálica na água", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 162229, "titulo": "AI models enable cross-species mapping of cell biology", "url": "https://phys.org/news/2026-09-ai-enable-species-cell-biology.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Stanford Medicine desenvolveram dois novos modelos de inteligência artificial para a biologia celular. O primeiro, chamado embedding celular universal, permitiu a criação do segundo modelo, TranscriptFormer, treinado em dados de 112 milhões de células de 12 espécies, variando de fungos unicelulares a humanos.", "titulo_pt": "Modelos de IA permitem mapeamento cruzado de biologia celular entre espécies", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 162230, "titulo": "Every animal, even the smallest rodent, deserves safe anesthesia, say researchers", "url": "https://phys.org/news/2026-09-animal-smallest-rodent-safe-anesthesia.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os animais de laboratório são anestesiados para evitar o sofrimento durante procedimentos invasivos. A anestesia é necessária para o bem-estar dos animais, mas pode apresentar problemas, pois anestesias inadequadas podem causar sofrimento, distorcer resultados experimentais e levar a repetição de testes com mais animais.", "titulo_pt": "Cada animal, mesmo o menor roedor, merece uma anestesia segura, dizem os pesquisadores", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 162231, "titulo": "Three DNA loops prove essential for efficient wing tissue regeneration in fruit flies", "url": "https://phys.org/news/2026-09-dna-loops-essential-efficient-wing.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois de uma lesão, determinadas regiões do DNA formam novos laços físicos que servem de pontes, unindo sequências geneticamente distantes. Um estudo identificou a formação desses laços como um passo essencial para a regeneração de tecidos nas moscas da fruta.", "titulo_pt": "Três laços de DNA são essenciais para a regeneração eficiente do tecido das asas nas moscas da fruta", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 162232, "titulo": "Magma repeatedly breaks and heals during eruptions, microscopic evidence suggests", "url": "https://phys.org/news/2026-09-magma-eruptions-microscopic-evidence.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Evidências microscópicas sugerem que magma se rompe e se cura repetidamente durante erupções vulcânicas. O tamanho dos fragmentos de magma e rochas projetados durante erupções explosivas determina a distância que eles viajam e os perigos que representam, mas o processo e o local de formação desses fragmentos permanecem mal compreendidos.", "titulo_pt": "Magma se rompe e se cura repetidamente durante erupções, sugere evidências microscópicas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 162254, "titulo": "Webinar 9/23: NASA CSDA Program Update 2026", "url": "https://science.nasa.gov/science-research/earth-science/webinar-9-23-nasa-csda-program-update-2026/", "fonte_id": "nasa_news", "data_pub": "2026-09-14T21:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O webinar fornecerá uma visão geral dos objetivos e atividades do programa CSDA, incluindo o novo iniciativa Cal/Val.", "titulo_pt": "Webinar 23/9: atualização do programa CSDA da NASA", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 162233, "titulo": "Forest fire smoke reduces bird diversity, study suggests", "url": "https://phys.org/news/2026-09-forest-bird-diversity.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa realizada por Sarah Meier, economista ambiental da ETH Zurich, em parceria com Eric Strobl da Universidade de Bern, sugere que a fumaça proveniente de incêndios florestais reduz a diversidade de aves. Os efeitos visíveis do fogo nos habitats são conhecidos, mas a pesquisa destaca a influência menos percebida da fumaça em regiões distantes do local do incêndio.", "titulo_pt": "Fumaça de incêndios florestais reduz diversidade de aves, sugere estudo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 162234, "titulo": "Common wastewater pollutant turns male minnows into poorer parents and fiercer rivals", "url": "https://phys.org/news/2026-09-common-wastewater-pollutant-male-minnows.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de pesquisadores descobriu que um poluente comum na água residual transformou peixes-moscas gordos machos em pais menos eficazes e rivais mais agressivos, revelando impactos ecológicos que os estudos laboratoriais não captaram.", "titulo_pt": "Poluente comum na água residual transforma peixes-moscas gordos machos em pais menos eficazes e rivais mais agressivos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 161873, "titulo": "A matéria escura compõe cerca de 85% de toda a matéria do Universo, é invisível e nunca foi detectada. Agora, um sinal intrigante que pode indicar a sua existência", "url": "https://www.cnnbrasil.com.br/ciencia/a-materia-escura-compoe-cerca-de-85-de-toda-a-materia-do-universo-e-invisivel-e-nunca-foi-detectada-agora-um-sinal-intrigante-que-pode-indicar-a-sua-existencia/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-14T20:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um sinal intrigante pode indicar a existência da matéria escura, que compõe cerca de 85% da matéria no universo. O experimento LUX-ZEPLIN, um detector de 7 toneladas de xenônio líquido localizado em uma mina na Dakota do Sul, pode ter solucionado este mistério.", "titulo_pt": "Mistério da matéria escura pode ter sido solucionado por experimento", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 162235, "titulo": "Radiation-tolerant rotifers rebuild broken chromosomes over successive generations", "url": "https://phys.org/news/2026-09-tolerant-rotifers-rebuild-broken-chromosomes.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bdelloídos são rotíferos que desenvolveram capacidades de reparo de DNA excepcionais. Eles são capazes de reconstruir cromossomos danificados ao longo das gerações sucessivas.", "titulo_pt": "Rotíferos resistentes à radiação reconstrzem cromossomos quebrados em gerações subsequentes", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 162236, "titulo": "Antibody cocktails could steer viruses into evolutionary dead ends", "url": "https://phys.org/news/2026-09-antibody-cocktails-viruses-evolutionary-dead.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo da Harvard sugere que combinações de anticorpos podem impedir que os vírus evoluam, evitando que mutações os permitam escapar das vacinas e dos medicamentos antivirais. Atualmente, as mutações dos vírus são geralmente descobertas somente após elas ocorrerem.", "titulo_pt": "Combinações de anticorpos poderiam bloquear evolução viral", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 162237, "titulo": "When a friend becomes a caregiver", "url": "https://phys.org/news/2026-09-friend-caregiver.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cuidadoria de idosos, tradicionalmente considerada uma responsabilidade familiar, está se adaptando às mudanças demográficas que tornam menos provável a dependência de cônjuges e filhos.", "titulo_pt": "Quando um amigo se torna cuidador", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 162196, "titulo": "[Lim Woong] Growing old in the age of artificial intelligence", "url": "https://www.koreaherald.com/article/10873094", "fonte_id": "korea_herald", "data_pub": "2026-09-14T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A chegada da inteligência artificial condensou décadas de evolução tecnológica em poucos anos, transformando a natureza básica de nossas vidas diárias. Tarefas que exigiam anos de trabalho e experiência podem agora ser realizadas com apenas algumas teclas.", "titulo_pt": "Velhice na era da inteligência artificial", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 162238, "titulo": "Active black holes reveal star-forming rings and shock waves in nine nearby galaxies", "url": "https://phys.org/news/2026-09-black-holes-reveal-star-nearby.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa em nove galáxias próximas revelou que buracos negros supermassivos em crescimento podem contribuir, em vez de impedir, para a formação estelar em suas galáxias anfitriãs.", "titulo_pt": "Buracos negros ativos revelam anéis de formação estelar e ondas de choque em nove galáxias próximas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 162239, "titulo": "Turning a potent greenhouse gas into a valuable pharmaceutical building block using light", "url": "https://phys.org/news/2026-09-potent-greenhouse-gas-valuable-pharmaceutical.html", "fonte_id": "phys_org", "data_pub": "2026-09-14T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O grupo trifluorometilado, ou CF₃, é amplamente utilizado em medicamentos. Uma maneira útil de introduzir esse grupo é através de radicais CF₃ altamente reativos, mas os métodos existentes para gerar esses radicais frequentemente dependem de reagentes caros, corrosivos ou potencialmente explosivos, podendo produzir resíduos indesejados.", "titulo_pt": "Convertendo um potente gás de efeito estufa em um bloco farmacêutico valioso usando luz", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 161680, "titulo": "Animação e fábula de Daniel Nolasco abrem a competição do Festival de Brasília", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/animacao-e-fabula-de-daniel-nolasco-abrem-a-competicao-do-festival-de-brasilia.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-14T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme 'Pequenas Tragédias', dirigido por Daniel Nolasco, estreou a competição do Festival de Brasília. É uma animação bem-humorada sobre a vida queer em Catalão, no interior de Goiás.", "titulo_pt": "Pequenas tragédias de Daniel Nolasco abre a competição do Festival de Brasília", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 161756, "titulo": "Leilão no Museu do Amanhã reúne obras de Vik Muniz e Adriana Varejão na abertura da ArtRio", "url": "https://veja.abril.com.br/cultura/leilao-no-museu-do-amanha-reune-obras-de-vik-muniz-e-adriana-varejao-na-abertura-da-artrio/", "fonte_id": "veja", "data_pub": "2026-09-14T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O leilão no Museu do Amanhã reunirá obras de Vik Muniz e Adriana Varejão, com cerca de 400 convidados presentes. O evento marca a abertura da ArtRio e contará com obras doadas por artistas renomados.", "titulo_pt": "Leilão no Museu do Amanhã reúne obras de Vik Muniz e Adriana Varejão na abertura da ArtRio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 161681, "titulo": "Globo volta a desfalcar a ESPN e contrata comentarista Mari Pereira para reforçar SporTV", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/09/globo-volta-a-desfalcar-a-espn-e-contrata-comentarista-mari-pereira-para-reforcar-sportv.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-14T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mari Pereira, comentarista da ESPN desde 2020, está deixando o canal para se juntar à SporTV, onde a Globo fechou um acordo com ela.", "titulo_pt": "Globo contrata Mari Pereira para SporTV após saída da ESPN", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 161682, "titulo": "'Invasão: Código Apollo' e Mateus Solano: o que assistir na TV e no streaming terça", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/invasao-codigo-apollo-e-mateus-solano-o-que-assistir-na-tv-e-no-streaming-terca.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-14T21:04:00Z",  162265, "titulo": "300-Pound Faun Sculpture Stolen from French Zoo in the ’90s Heads Home", "url": "https://www.artnews.com/art-news/news/faun-sculpture-stolen-french-zoo-returned-1234798172/", "fonte_id": "artnews", "data_pub": "2026-09-14T20:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um escultor de farno com 300 libras foi roubado de um zoológico francês na década de 1990 e foi identificado pelo Art Loss Register, uma organização baseada em Londres. A obra foi roubada de um zoológico francês na década de 1990 e agora foi identificada.", "titulo_pt": "Escultura de 300 libras roubada de zoológico francês na década de 1990 é identificada", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 162266, "titulo": "Prized Gertrude Abercrombie Painting, Priced at $30 at an Estate Sale, Heads to Auction for $250,000", "url": "https://www.artnews.com/art-news/news/gertrude-abercrombie-painting-freemans-estate-sale-1234798195/", "fonte_id": "artnews", "data_pub": "2026-09-14T20:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma obra de Gertrude Abercrombie, vendida por $30 em uma venda de bens pessoais, foi leiloada por $250.000. A obra chamou a atenção de um espectador durante uma avaliação de Abercrombie realizada por um museu.", "titulo_pt": "Pintura de Gertrude Abercrombie, vendida por $30 em leilão, alcança valor de $250.000", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 162259, "titulo": "Member Event: ISCP Ground Floor Studio Visits", "url": "https://hyperallergic.com/member-event-iscp-ground-floor-studio-visits/", "fonte_id": "hyperallergic", "data_pub": "2026-09-14T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No dia 30 de setembro, haverá uma visita guiada e conversas com os artistas noviços do programa de residência Ground Floor do International Studio & Curatorial Program, localizado em Nova York.", "titulo_pt": "Evento membro: visitas guiadas aos estúdios e conversas , "provavel_duplicata_de": null, "texto_pt": "A Universidade de Buenos Aires (UBA) planeja oferecer serviços de saúde gratuitos e realizar aulas abertas nas Praças de Mayo para visibilizar seu pedido de cumprimento da lei de financiamento universitário. Os 13 decanos das faculdades também darão aulas magistrais.", "titulo_pt": "A japonesa: UBA oferecerá serviços de saúde gratuitos em praça de Mayo em reclamo pelo financiamento", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 161761, "titulo": "Motociclista é baleado na cabeça por PM durante abordagem em Niterói", "url": "https://veja.abril.com.br/brasil/motociclista-e-baleado-na-cabeca-por-pm-durante-abordagem-em-niteroi/", "fonte_id": "veja", "data_pub": "2026-09-14T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um motociclista foi baleado na cabeça durante uma abordagem realizada por policiais militares em Niterói. Antes do disparo, um policial teria usado um spray de pimenta.", "titulo_pt": "Motociclista é baleado na cabeça por PM durante abordagem em Niterói", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 161762, "titulo": "Amigos de Erik Marmo organizam vaquinha após incêndio", "url": "https://veja.abril.com.br/cultura/amigos-de-erik-marmo-organizam-vaquinha-apos-incendio/", "fonte_id": "veja", "data_pub": "2026-09-14T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Amigos de Erik Marmo organizaram uma vaquinha para arrecadar fundos após um incêndio que destruiu seu imóvel em Beverly Hills, Califórnia. O ator conseguiu arrecadar 174 mil reais com essa campanha para reconstruir o local.", "titulo_pt": "Amigos de Erik Marmo organizam vaquinha após incêndio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 161764, "titulo": "Professores que inovam na educação podem concorrer a prêmio internacional de US$ 1 milhão", "url": "https://veja.abril.com.br/educacao/professores-que-inovam-na-educacao-podem-concorrer-a g-point-millions-livelihoods/", "fonte_id": "japan_times", "data_pub": "2026-09-14T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As geleiras estão se recuando, deixando atrás de si lagos glaciais instáveis que são mantidos por apenas rochas e gelo instáveis. O relatório indica que milhões de vidas estão em risco à medida que o Himalaia se aproxima do ponto de não retorno.", "titulo_pt": "Himalaias se aproximando do ponto de não retorno com milhões de vidas em risco: relatório", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 161973, "titulo": "“Son niños llenos de amor”. Tres hermanitos buscan una familia y piden crecer juntos", "url": "https://www.lanacion.com.ar/comunidad/adopcion/tres-hermanitos-buscan-una-familia-y-piden-crecer-juntos-nid14092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-14T21:07:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Três irmãos com idades entre 5 e 9 anos vivem em diferentes lares na província de Corrientes, Argentina. Um juízo emitiu um chamamento público para a comunidade inteira para que possa adotá-los e permita que eles cresçam juntos.", "titulo_pt": "São crianças cheias de amor. Três irmãos buscam uma família e querem crescer juntos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 162161, "titulo": "Djibouti humanitarian situation worsens as Yemenis seek refuge", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/14/djibouti-humanitarian-situation-worsens-as-yemenis-seek-refuge?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-14T18:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A situação humanitária em Djibouti agravou-se com a chegada de refugiados yemenitas.", "titulo_pt": "Situação humanitária em djibouti se agrava com chegada de refugiados yemenitas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id
