de dano, segundo executiva da Apple", "url": "https://veja.abril.com.br/tecnologia/tela-dobravel-do-iphone-duo-podera-ser-trocada-em-caso-de-dano-segundo-executiva-da-apple/", "fonte_id": "veja", "data_pub": "2026-10-02T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A vice-presidente de engenharia de hardware da Apple informou durante uma entrevista que o telão do iPhone Duo poderá ser substituído em caso de dano.", "titulo_pt": "Telão dobrável do iphone Duo poderá ser trocado em caso de dano, diz executiva da Apple", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 192533, "titulo": "Sean Parker is rebuilding Stability AI around music", "url": "https://techcrunch.com/2026/10/02/sean-parker-is-rebuilding-stability-ai-around-music/", "fonte_id": "techcrunch", "data_pub": "2026-10-02T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sean Parker está revitalizando a Stability AI com o apoio das gravadoras e recursos financeiros. Parker, que anteriormente ensinou o setor musical a pedir desculpas quando necessário, agora retorna ao mercado com o aval das empresas musicais.", "titulo_pt": "Sean Parker está reconstruindo Stability AI com o apoio do setor musical", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 192523, "titulo": "Meta open sources code to let you make Muse AI gadgets", "url": "https://www.theverge.com/tech/1004330/meta-muse-ai-gadgets-home-link", "fonte_id": "the_verge", "data_pub": "2026-10-02T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta agora permite que os usuários criem seus próprios gadgets Muse, utilizando o código aberto da empresa que incorpora seu novo agente de inteligência artificial. Os projetos sugeridos incluem a instalação do Muse em um display E Ink colorido para exibir lembretes, ou a adição do Muse a um stick HDMI para exibi-lo em uma tela grande.", "titulo_pt": "Meta libera código aberto para criação de gadgets Muse AI", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 192513, "titulo": "Amazon’s $1B plan to combat data center backlash draws more backlash", "url": "https://arstechnica.com/tech-policy/2026/10/amazons-1b-plan-to-combat-data-center-backlash-draws-more-backlash/", "fonte_id": "ars_technica", "data_pub": "2026-10-02T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amazon recebeu elogios por abolir acordos de confidencialidade, mas enfrentou críticas por minimizar a poluição causada pelos seus centros de dados. A empresa anunciou um plano de um bilhão de dólares para combater a reação negativa à sua operação de centros de dados, mas isso não foi suficiente para acalmar todos os críticos.", "titulo_pt": "Plano de 1 bilhão da amazon para combater reação contra centros de dados é criticado", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 192524, "titulo": "Netflix is pivoting away from prestige", "url": "https://www.theverge.com/streaming/1004323/netflix-david-fincher-shawn-levy-mike-flanagan-duffer-brothers-greta-gerwig", "fonte_id": "the_verge", "data_pub": "2026-10-02T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Netflix está mudando sua estratégia, encerrando parcerias com diretores renomados como David Fincher e Shawn Levy, que produziram alguns de seus maiores sucessos críticos. Isso sugere uma mudança maior na direção da empresa, em face da concorrência.", "titulo_pt": "Netflix se afasta do prestígio", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 192525, "titulo": "Apple will limit Mac disk access as AI agents ‘substantially’ increase risk", "url": "https://www.theverge.com/tech/1004295/apple-limit-mac-disk-access-ai-agents", "fonte_id": "the_verge", "data_pub": "2026-10-02T20:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple está implementando novas restrições para o acesso 'total ao disco' em seus Macs em resposta aos riscos associados aos agentes de IA, conforme relatado anteriormente pelo TechCrunch. A empresa anunciou que está introduzindo controles adicionais para garantir que apenas os usuários que realmente desejam conceder esse nível extraordinário de acesso a um aplicativo possam fazê-lo.", "titulo_pt": "Apple limitará o acesso ao disco em macs devido ao aumento significativo de riscos com agentes de IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 192514, "titulo": "Patient-zero drill put health facilities to the test—40% of them failed", "url": "https://arstechnica.com/health/2026/10/patient-zero-drill-put-health-facilities-to-the-test-40-of-them-failed/", "fonte_id": "ars_technica", "data_pub": "2026-10-02T20:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Atores com maquiagem e sintomas simulados entraram em 73 instalações de saúde. Quarenta por cento delas não passaram no teste.", "titulo_pt": "Exercício com paciente zero testou instalações de saúde - 40% falharam", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 191731, "titulo": "A corrida da China pela IA gerou um problema: o uso excessivo da tecnologia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/a-corrida-da-china-pela-ia-gerou-um-problema-o-uso-excessivo-da-tecnologia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-02T19:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo chinês tem incentivado a adoção da inteligência artificial na população, mas isso está levando a um problema: a dependência excessiva da tecnologia. Este problema foi, em parte, criado pela própria China.", "titulo_pt": "Corrida chinesa pela IA cria dependência excessiva da tecnologia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 192553, "titulo": "ICE Has Been Dumping Protester Photos Into a Palantir Database", "url": "https://www.wired.com/story/ice-has-been-dumping-protester-photos-into-a-palantir-database/", "fonte_id": "wired", "data_pub": "2026-10-02T19:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As agências do DHS estavam não apenas rastreando e intimidadando pessoas que observavam a atividade da ICE em Maine, mas também armazenando informações sobre elas em uma base de dados construída pela Palantir, conforme revelado por novas petições judiciais.", "titulo_pt": "ICE estava incluindo fotos de protestantes em banco de dados da Palantir", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 192515, "titulo": "Lyft settles landmark driver misclassification lawsuit for $272.5M", "url": "https://arstechnica.com/tech-policy/2026/10/lyft-settles-landmark-driver-misclassification-lawsuit-for-272-5m/", "fonte_id": "ars_technica", "data_pub": "2026-10-02T19:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lyft acordou em pagar US$ 272,5 milhões para resolver um processo judicial que classificava motoristas como trabalhadores independentes em vez de empregados. Críticos afirmam que os motoristas ainda devem receber muito mais.", "titulo_pt": "Lyft concorda em pagar us$ 272,5 milhões em processo sobre classificação de motoristas", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 192516, "titulo": "The 2008 economic crisis changed the US's relationship with energy", "url": "https://arstechnica.com/science/2026/10/the-2008-economic-crisis-changed-the-uss-relationship-to-energy/", "fonte_id": "ars_technica", "data_pub": "2026-10-02T18:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A crise econômica de 2008 alterou a relação dos Estados Unidos com o energia, levando a uma desacoplagem entre as emissões de carbono e o crescimento do PIB.", "titulo_pt": "A crise econômica de 2008 alterou a relação dos EUA com o carbono e o pib", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 192554, "titulo": "This Shoe Company’s Instagram Ad With a Frat Is Pissing People Off", "url": "https://www.wired.com/story/this-shoe-companys-instagram-ad-with-a-frat-is-pissing-people-off/", "fonte_id": "wired", "data_pub": "2026-10-02T18:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma publicação colaborativa no Instagram entre a linha de calçados HEYDUDE e um fraternidade da Universidade da Flórida está causando contragosto devido a acusações de cyberassédio sexual contra dois ex-membros.", "titulo_pt": "Esta empresa de calçados do Instagram com uma fraternidade está irritando as pessoas", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 191937, "titulo": "Nvidia renova recorde e se aproxima dos US$ 6 trilhões em valor de mercado", "url": "https://exame.com/invest/mercados/nvidia-renova-recorde-e-se-aproxima-dos-us-6-trilhoes-em-valor-de-mercado/", "fonte_id": "exame", "data_pub": "2026-10-02T18:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações da Nvidia subiram 1,34% nesta sexta-feira, acumulando uma alta de cerca de 25% no ano. A empresa se aproxima dos US$ 6 trilhões em valor de mercado após uma recuperação de 23% desde o final de julho.", "titulo_pt": "Nvidia mantém recorde e se aproxima dos US$ 6 trilhões em valor de mercado", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 192534, "titulo": "Apple says it’s tightening macOS ‘Full Disk Access’ controls due to new risks from AI agents", "url": "https://techcrunch.com/2026/10/02/apple-says-its-tightening-macos-full-disk-access-controls-due-to-new-risks-from-ai-agents/", "fonte_id": "techcrunch", "data_pub": "2026-10-02T18:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple afirmou que está implementando novos controles para a permissão 'Full Disk Access' no macOS devido a novos riscos associados a agentes de inteligência artificial cada vez mais capazes. A empresa alerta que o acesso amplo aos arquivos, mensagens, e-mail e histórico de navegação dos usuários tornou-se mais perigoso.", "titulo_pt": "Apple afirma que está apertando os controles de 'Full Disk Access' no macos devido a novos riscos de agentes de IA", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 192572, "titulo": "Researchers turn America's scattered local laws into a free searchable database covering all 50 states", "url": "https://phys.org/news/2026-10-america-local-laws-free-searchable.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos são um país regido por leis locais - milhões delas. Cada cidade, município e condado tem suas próprias regras e maneiras únicas de fazer as coisas, cobrindo desde regulamentos de ruído e códigos de construção até regras sobre licenças de pesca e a venda de manga na estrada.", "titulo_pt": "Investigadores criam banco de dados gratuito e pesquisável sobre todas as leis locais dos 50 estados americanos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 192573, "titulo": "Marine biologists discover new plankton off Oregon coast", "url": "https://phys.org/news/2026-10-marine-biologists-plankton-oregon-coast.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nicole Nakata, uma doutoranda em biologia, coletava larvas de plâncton de estrelas de mar frágeis no Oceano Pacífico, perto do Oregon Institute of Marine Biology, todos os dias pela manhã. Ela analisava essas larvas sob microscópio no laboratório do instituto.", "titulo_pt": "Biólogas marítimas descobrem novo plâncton na costa do Oregon", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 192574, "titulo": "Mowing less, spraying smarter give pollinators a boost", "url": "https://phys.org/news/2026-10-spraying-smarter-pollinators-boost.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo liderado pela Universidade de Ottawa descobriu que reduzir a poda e o uso de herbicidas nas margens de estradas rurais pode aumentar em 45% o número de polinizadores e em 23% o número de espécies encontradas nessas áreas.", "titulo_pt": "Cortar menos e usar herbicidas de forma mais inteligente beneficiam os polinizadores em margens de estradas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 192575, "titulo": "Scientists discover first type I superconductor that breaks time-reversal symmetry", "url": "https://phys.org/news/2026-10-scientists-superconductor-reversal-symmetry.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas descobriram o primeiro supercondutor do tipo I que quebra a simetria do tempo. Essa descoberta adiciona uma propriedade estranha aos supercondutores, que já são conhecidos por conduzir eletricidade sem resistência e expelir campos magnéticos quando resfriados a baixas temperaturas.", "titulo_pt": "Cientistas descobrem primeiro supercondutor do tipo I que quebra a simetria do tempo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 192576, "titulo": "On complex political issues, most Americans take shortcuts to simplicity", "url": "https://phys.org/news/2026-10-complex-political-issues-americans-shortcuts.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo realizado por cientistas sociais da UC Berkeley descobriu que os americanos geralmente não consideram todos os aspectos complexos de questões políticas difíceis, ao invés de tomar decisões baseadas em atalhos mentais que ignoram a complexidade.", "titulo_pt": "Em questões políticas complexas, a maioria dos americanos opta por atalhos simples", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 192577, "titulo": "American beech trees may carry genetic resistance to deadly leaf disease", "url": "https://phys.org/news/2026-10-american-beech-trees-genetic-resistance.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa liderada pelo Holden Arboretum identificou que o desenvolvimento dos sintomas da doença da folha de carvalho-americano (BLD) pode ser geneticamente controlado, sugerindo que algumas árvores podem ter resistência genética. Este achado apoia a investigação adicional e a criação de populações para a resistência à BLD.", "titulo_pt": "Árvores de carvalho-americano podem ter resistência genética à doença das folhas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 192578, "titulo": "Plasma-activated water tests show concentration matters for effective bacterial disinfection", "url": "https://phys.org/news/2026-10-plasma-effective-bacterial-disinfection.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores da EPFL estudaram como a Escherichia coli responde a diferentes concentrações de água ativada por plasma (PAW) em condições ricas em nutrientes. O estudo combinou o contagem de unidades formadoras de colônias (CFU) com o sensing de nanomovimento, uma técnica que detecta oscilações nanosscale produzidas por bactérias metabolicamente ativas.", "titulo_pt": "Testes de água ativada por plasma mostram que a concentração é importante para a desinfecção bacteriana efetiva", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 192579, "titulo": "Ultrafast X-rays reveal how the light-responsive molecular switch azobenzene changes shape", "url": "https://phys.org/news/2026-10-ultrafast-rays-reveal-responsive-molecular.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Azobenzene é um dos moléculas mais conhecidas que podem ser alternadas entre duas formas pela luz. A questão de como a molécula se move nos primeiros picosegundos após a absorção de luz permaneceu inresolvida por quase 50 anos.", "titulo_pt": "Raios-x ultra-rápidos revelam como o switch molecular azobenzene muda de forma", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 192580, "titulo": "Why a food poisoning bacterium can cause severe wound infections", "url": "https://phys.org/news/2026-10-food-poisoning-bacterium-severe-wound.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O toxina NheABC, produzida pelo Bacillus cereus, é particularmente ativa nas condições de pH encontradas em feridas abertas. Os pesquisadores da Umeå University descobriram que a toxina danifica tanto as membranas celulares quanto os mitocondrios, auxiliando a bactéria a se estabelecer na lesão tecidual.", "titulo_pt": "Por que uma bactéria de intoxicação alimentar pode causar infecções de feridas graves", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 192567, "titulo": "NIH rolling out streamlined website to help public find information more easily", "url": "https://www.statnews.com/2026/10/02/nih-launching-streamlined-website-to-help-public-find-information/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-02T19:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O NIH está lançando um novo site simplificado para ajudar o público a encontrar informações de forma mais fácil. A redesenhar, o objetivo é organizar um ecossistema de informações dispersas e confusas.", "titulo_pt": "NIH lança site simplificado para facilitar acesso a informações", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 192581, "titulo": "Motivation matters more than working memory for improving student math skills, study finds", "url": "https://phys.org/news/2026-10-memory-student-math-skills.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo realizado pela Universidade norueguesa de Ciência e Tecnologia (NTNU) descobriu que a motivação é mais importante do que a capacidade de memória de trabalho para melhorar as habilidades matemáticas dos alunos. O motivo pelo qual alguns alunos melhoram constantemente suas habilidades matemáticas enquanto outros estagnam não está relacionado apenas a habilidades cognitivas.", "titulo_pt": "Motivação é mais importante do que memória de trabalho para melhorar habilidades matemáticas dos alunos, sugere estudo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 192582, "titulo": "Computer-designed protein targets immune receptor linked to inflammation at new 'undruggable' site", "url": "https://phys.org/news/2026-10-protein-immune-receptor-linked-inflammation.html", "fonte_id": "phys_org", "data_pub": "2026-10-02T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O receptor Toll-like 4 (TLR4), um receptor imunológico que desempenha um papel crucial na proteção contra infecções, está associado a doenças inflamatórias como sepse, artrite e doenças inflamatórias intestinais devido à sua atividade excessiva. Apesar de ser um alvo atraente para terapias, o TLR4 é difícil de ser manipulado precisamente e não há medicamentos aprovados pela FDA que bloqueiem especificamente este receptor.", "titulo_pt": "Proteína projetada por computador alvo de receptor imunológico relacionado a inflamação em local 'indragatável'", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 192605, "titulo": "Heading Home: NASA’s SpaceX Crew-12 Concludes Station Science Mission", "url": "https://www.nasa.gov/missions/station/iss-research/heading-home-nasas-spacex-crew-12-concludes-station-science-mission/", "fonte_id": "nasa_news", "data_pub": "2026-10-02T19:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A missão Crew-12 da NASA em SpaceX está terminando, com a tripulação agendada para retornar à Terra no início de outubro. Os astronautas Jessica Meir e Jack Hathaway, a astronauta Sophie Adenot da ESA e o cosmonauta Andrey Fedyaev do Roscosmos voltarão à Terra após apoiar pesquisas que beneficiam a vida na Terra e preparam os humanos para missões espaciais futuras.", "titulo_pt": "Volta à terra: missão Crew-12 da nasa em SpaceX conclui missão científica na estação espacial internacional", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 192599, "titulo": "Could a giant iceberg really break off Greenland? Scientists check Tom Cruise’s new movie Digger", "url": "https://www.scientificamerican.com/article/could-a-giant-iceberg-really-break-off-greenland-scientists-check-tom-cruises-new-movie-digger/", "fonte_id": "scientific_american", "data_pub": "2026-10-02T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No filme, um grande iceberg do Groenlândia flutua para o mar, ameaçando milhões de pessoas, mas os cientistas questionam se isso é realmente possível. O filme 'Digger' com Tom Cruise apresenta uma cena hipotética que levanta questões sobre a realidade das mudanças climáticas.", "titulo_pt": "Um grande iceberg do groenlândia poderia realmente ameaçar milhões de pessoas no filme de Tom Cruise?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 192606, "titulo": "NASA’s DAVINCI Probe Can Stand the Heat", "url": "https://www.nasa.gov/image-article/nasas-davinci-probe-can-stand-the-heat/", "fonte_id": "nasa_news", "data_pub": "2026-10-02T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O protótipo do módulo de engenharia da missão DAVINCI da NASA foi submetido a uma avaliação térmica extrema, sendo exposto a uma temperatura de 465°C em um ambiente simulado do lado interno de Vênus.", "titulo_pt": "Protegendo o DAVINCI de vênus", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 192600, "titulo": "2026 has been a record hot year for the U.S.—it can only get worse", "url": "https://www.scientificamerican.com/article/2026-has-been-a-record-hot-year-for-the-u-s-it-can-only-get-worse/", "fonte_id": "scientific_american", "data_pub": "2026-10-02T18:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este ano tem sido extremamente quente. Se essa tendência continuar, 2026 pode estabelecer um novo recorde alarmante de temperatura.", "titulo_pt": "2026 Foi o ano mais quente dos EUA—pode ficar ainda pior", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 192053, "titulo": "Claire Keegan: “Mi imaginación es más interesante que mi vida”", "url": "https://www.lanacion.com.ar/cultura/claire-keegan-mi-imaginacion-es-mas-interesante-que-mi-vida-nid02102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-02T21:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Claire Keegan leu alguns de seus contos mais emblemáticos em um evento no MALBA, diante de um público lotado, como parte do FILBA.", "titulo_pt": "Claire Keegan: 'minha imaginação é mais interessante que minha vida'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 192054, "titulo": "El gobernador Kicillof se anticipó a Milei y declaró ciudadano ilustre al papa León XIV", "url": "https://www.lanacion.com.ar/politica/el-gobernador-kicillof-se-anticipo-a-milei-y-declaro-ciudadano-ilustre-al-papa-leon-xiv-nid02102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-02T21:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governador Kicillof declarou o Papa Leão XIV cidadão ilustre e autorizou gastos de mais de 100 milhões de pesos para reforçar a segurança. Além disso, ele cancelou uma viagem a China para receber o Papa, sintonizando com o discurso sobre justiça social.", "titulo_pt": "Kicillof antecipa Milei e declara o papa leão XIV cidadão ilustre", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "clas ento Miasma: adolescência, sexo e morte", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 191819, "titulo": "Quarta edição do Fórum Varanda da Amazônia será dedicada às mulheres", "url": "https://veja.abril.com.br/brasil/quarta-edicao-do-forum-varanda-da-amazonia-sera-dedicada-as-mulheres/", "fonte_id": "veja", "data_pub": "2026-10-02T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A quarta edição do Fórum Varanda da Amazônia será dedicada ao tema das mulheres. A Caixa Cultural será patrocinadora pela primeira vez deste evento, que foi criado por Fafá de Belém.", "titulo_pt": "Quarta edição do Fórum Varanda da Amazônia será dedicada às mulheres", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 191821, "titulo": "Proibidas, bets ainda possuem R$ 1,45 bilhão não resgatados por apostadores", "url": "https://veja.abril.com.br/economia/proibidas-bets-ainda-possuem-r-145-bilhao-nao-resgatados-por-apostadores/", "fonte_id": "veja", "data_pub": "2026-10-02T20:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os apostadores têm até 5 de outubro para solicitar o resgate de suas apostas proibidas, com valores não resgatados totalizando R$ 1,45 bilhão. O prazo termina às 23h59 da próxima segunda-feira.", "titulo_pt": "Proibidas, apostas ainda possuem R$ 1,45 bilhão não resgatados por apostadores", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 191808, "titulo": "Mostra leva ao Rio quase sete décadas de produção de Ruy Guerra", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-10/mostra-leva-ao-rio-quase-sete-decadas-de-producao-de-ruy-guerra", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-10-02T20:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Retrospectiva Ruy Guerra – Uma Vida de Cinema apresenta 17 longas-metragens e dois documentários do diretor, abrangendo sua carreira de quase sete décadas. A mostra pode ser visitada gratuit  [], "sociedade": [{"id": 192106, "titulo": "Un plan laboral insuficiente", "url": "https://www.latercera.com/opinion/noticia/un-plan-laboral-insuficiente/", "fonte_id": "la_tercera", "data_pub": "2026-10-02T21:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O plano laboral proposto não atende às expectativas dos especialistas e das partes interessadas. Os detalhes específicos do plano não foram fornecidos no trecho fornecido.", "titulo_pt": "Um plano de emprego insuficiente", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 192105, "titulo": "Jubilazo notarial: Justicia logra continuidad de los oficios y entrega al Servicio Civil 35 perfiles para abrir concursos", "url": "https://www.latercera.com/nacional/noticia/jubilazo-notarial-justicia-logra-continuidad-de-los-oficios-y-entrega-al-servicio-civil-35-perfiles-para-abrir-concursos/", "fonte_id": "la_tercera", "data_pub": "2026-10-02T21:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Justiça determinou a continuidade dos ofícios notariais e indicou 35 perfis para concursos. Até que os concursos sejam realizados, os interinos continuarão exercendo as funções.", "titulo_pt": "Jubilazo notarial: justiça autoriza continuidade dos ofícios e indica 35 perfis para concursos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 192046, "titulo": "Otro papelón de la AFA: del milagro de comprar online a las colas eternas para retirar entradas para ver la Selección y reventa con custodia policial en otro estadio", "url": "https://www.clarin.com/deportes/papelon-afa-milagro-comprar-online-colas-eternas-retirar-entradas-ver-seleccion-reventa-custodia-policial-estadio_0_V796VngIj2.html", "fonte_id": "clarin", "data_pub": "2026-10-02T21:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O processo de compra de ingressos para assistir à despedida de Lionel Messi foi difícil, com filas longas e dificuldades de compra online. Após a agotament idos e a Austrália suspenderam serviços consulares no país, justificando as medidas por questões de segurança. A decisão foi tomada em um contexto de intensa campanha eleitoral, com candidatos como Luiz Inácio Lula da Silva e Flávio Bolsonaro mobilizando recursos para conquistar votos. As embaixadas dos EUA e Austrália em Brasília e em outros locais do Brasil anunciaram o fechamento temporário de suas instalações, com os funcionários sendo instruídos a trabalharem de casa. A medida foi tomada após a decisão dos Estados Unidos, que também suspendeu o atendimento presencial em seu embaixada e consulados, sem fornecer detalhes sobre as razões da suspensão. A justificativa de 'questões de segurança' levantou suspeitas sobre a possibilidade de ameaças diretas ou indiretas relacionadas à campanha eleitoral. Além disso, a decisão afetou diretamente os cidadãos norte-americanos e australianos em emergência no Brasil, que agora devem buscar o oficial de plantão para assistência. O impacto imediato foi notável, com a interrupção de serviços essenciais e a necessidade de adaptação das equipes diplomáticas. As implicações políticas, econômicas e humanitárias são incertas, mas a situação pode ter um desenrolar que afeta a percepção pública sobre a segurança no país, além de possíveis reflexos na diplomacia bilateral.", "data_edicao": "2026-10-02", "artigos": [{"id": 192373, "titulo": "US suspends consular services in Brazil as Lula and Bolsonaro fight for election", "url": "https://www.euronews.com/2026/10/02/us-suspends-consular-services-in-brazil-as-lula-and-bolsonaro-fight-for-election", "fonte_id": "euronews", "data_pub": "2026-10-02T20:40:00Z", "topico": "politica_internacional", "idioma": "en", "texto_resumo": "Luiz Inácio Lula da Silva e Flávio Bolsonaro estão usando todos os recursos disponíveis para conquistar votos antes do pleito deste domingo no Brasil. Simultaneamente, os Estados Unidos e Austrália suspenderam serviços consulares no país devido a preocupações de seg   const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";

      const tit = n.titulo_pt || n.titulo;

      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>

  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {

function ativar(id) {

function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
