<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

  </div>
</div>

se transformaram em tumultos à noite, com 1.000 pessoas presas e forte presença policial. Em Israel, milhares marcharam em Tel Aviv contra o governo do primeiro-ministro Benjamin Netanyahu, exigindo responsabilização por falhas na prevenção de um ataque do Hamas. Em Taiwan, o ministro das Relações Exteriores, Lin Chia-lung, encoraja parcerias em inteligência artificial e drones com a Europa. A Coreia do Sul confirmou a visita do líder norte-coreano ao país no sábado. Na Itália, a primeira-ministra Meloni agradece as forças de ordem após a implementação de novas medidas de liberdade de manifestação em cidades fortificadas. Em Paris, confrontos entre protestos pacíficos e a polícia resultaram no uso de fogos de artifício e gás-lagrima. As restrições de Starlink e Starshield que afetaram operações militares na Ucrânia foram levantadas, restaurando as velocidades normais de satélite. Na Argentina, um levantamento indica que a maioria das rendas de 2 em 3 pessoas não duram até o fim do mês, levando a um aumento da taxa de inadimplência.\n\nO Irã acusa os Estados Unidos de serem responsáveis pela falha no acordo e solicita uma nova tentativa, expressando temor por novos ataques. As tensões geopolíticas continuam a crescer, com o Irã alertando que até mesmo ataques limitados gerariam uma resposta 'várias vezes maior'. Em Israel, a situação em Hebron se agravou, com centenas de famílias sendo forçadas a deixar suas casas após um tiroteio fatal. As operações militares israelenses no Território Ocupado Cisjordânia também se intensificaram, com o exército iniciando um bloqueio completo. No Brasil, a eleição presidencial está em um segundo turno muito disputado, com ambos os candidatos realizando atos em cidades importantes no último dia de campanha. Em contraste, a Ucrânia relata que o serviço de internet Starlink voltou ao normal após uma semana de restrições, enquanto negociações entre Ucrânia, Rússia e Estados Unidos devem se reunir em Abu Dhabi para discutir o conflito.", "economia": "O Ibovespa teve uma alta de 6,9% e o dólar caiu 4,4% entre o primeiro e o segundo turno da eleição presidencial, refletindo a incerteza do mercado. Na véspera do segundo turno, pesquisas indicam um empate técnico entre Flávio e Lula, com 49% dos votos válidos para cada um. O alto custo de vida e os preços elevados da gasolina nos Estados Unidos reduziram as vendas de doces para Halloween em 6,7%. Em Israel, o Banco Central rejeitou o plano do primeiro-ministro Netanyahu de usar criptomoedas para evitar sanções. A colheita de grãos nos Estados Unidos está avançando, pressionando os preços do milho e da soja. O governo planeja implementar uma linha de crédito específica para o setor de games e oferecer cursos nas faculdades federais para profissionalizar o setor.", "tecnologia": "A inteligência artificial (IA) tem ganhado destaque em diversos setores, especialmente na discussão sobre a distribuição de riqueza gerada por ela. A Anthropic destinou 5% de suas ações a um fundo benéfico público, enquanto Elon Musk prometeu doar ações da SpaceX para crianças nos Estados Unidos. Essas ações refletem a necessidade de equilíbrio entre a riqueza criada pela IA e sua distribuição equitativa. Além disso, a IA está sendo usada por criminosos para criar golpes digitais mais convincentes, como a imitação de vozes e a criação de vídeos falsos. A lei de Pennsylvania exige que anúncios modificados ou gerados por IA sejam rotulados, visando proteger os consumidores. Outras notícias destacam a surpreendente popularidade da IA, com relatos de um vendedor de violinos de 70 anos na Coreia do Sul, bem como a utilização de IA para simular ciberataques no Japão. A discussão sobre a IA também abrange questões de privacidade, como a possibilidade de aplicativos espiões monitorarem celulares sem consentimento, especialmente no Brasil.", "ciencia": "Um estudo recente mostrou que corvos podem tomar decisões mais rapidamente do que os humanos em algumas tarefas, indicando uma capacidade cognitiva superior em certos aspectos. Em outra pesquisa, a OMS iniciou testes de uma vacina contra o Ebola, com foco em grupos frequentemente excluídos de pesquisas clínicas, como gestantes e crianças a partir de 12 anos. Um estudo de fase 3 apresentou resultados promissores de uma vacina personalizada que reduziu em 42% a recorrência de um câncer de pele agressivo. Além disso, cientistas descobriram que a identificação das relações evolutivas entre espécies de aves marinhas pode prever melhor a acumulação de plástico em seus sistemas digestivos, independentemente da dieta. Outros avanços incluem a descoberta de um novo dinossauro carnívoro na Ilha da Wight, na Grã-Bretanha, e a identificação de um mecanismo que pode ajudar a prevenir a obesidade ao inibir o desenvolvimento de novas células adiposas.", "cultura": "O Brasil realiza uma eleição presidencial crucial, com o próximo presidente assumindo o cargo até 2030. A psicóloga espanhola Marian Rojas Estapé destaca a importância de aprender a renunciar sem culpa em suas palestras. O ator John Leguizamo, famoso por sua atuação em 'A Odisseia', será homenageado na Mostra Internacional de Cinema de São Paulo. A Globo descobriu um contrato que impede a transmissão da Recopa Sul-Americana em 2027, permitindo-a apenas em 2028. O dramaturgo Pedro Luis Barcia receberá a distinção de Personalidade Emérita de Cultura no Palácio Libertad. O escritor japonês Ryu Murakami, autor de 'Sopa de miso' e 'Azul quase transparente', faleceu aos 74 anos. Em outro evento, a Globo não poderá transmitir a Recopa Sul-Americana em 2027, apenas em 2028. A psicóloga Marian Rojas Estapé discute a necessidade de renunciar sem culpa em suas palestras. O ator John Leguizamo será homenageado na Mostra de SP, enquanto o escritor Ryu Murakami faleceu recentemente.", "sociedade": "Em novembro, mais de 400 mil pessoas se manifestaram na França, sob forte repressão policial, protestando contra o custo de vida e criticando o sistema de aposentadoria. Na cidade de Trappes, a violência urbana aumentou, com manifestantes queimando um ônibus da empresa RED. Em Madri, 25 mil pessoas protestaram exigindo garantias para o sistema de aposentadoria. Em Cuba, medidas sociais foram anunciadas para combater a desigualdade econômica. No Brasil, a crise de falta de oxigênio em Manaus foi novamente debatida no último debate presidencial, enquanto o ator Rafael Cardoso falou sobre sua recuperação de vício. No Chile, a região do Maule combina orgulho de sua natureza com preocupações sobre emprego e custo de vida. Em discussões sobre gênero e religião, Flávio e Lula conseguiram minimizar danos em suas campanhas eleitorais. No exterior, Filipinos buscam explicações sobre caixas de presentes enviadas para o país, enquanto no China, disputas sobre guarda de animais de estimação estão ganhando destaque legal.", "meio_ambiente": "O estado de São Paulo investiu R$ 1,19 bilhão em ações para combater enchentes e secas, com o objetivo de lidar com diversos fenômenos climáticos, incluindo temporais, estiagens, ondas de calor e incêndios florestais. A região também enfrenta o fenômeno El Niño, que prevê um aumento na nubosidade persistente e temperaturas mais frescas em dezembro. Paralelamente, a produção de soja no Canadá, próximo ao Ártico, aumentou devido ao aquecimento global, refletindo os impactos econômicos do aquecimento atmosférico na agricultura mundial.", "direitos_humanos": "Mais de 1.500 palestinos foram forçados a sair de suas casas em Hebron desde sexta-feira, de acordo com o governador Khaled Dudin, que pediu intervenção internacional. A situação é agravada por uma ordem de demolição emitida pelas forças israelenses. Em outro desenvolvimento, um argentino foi preso em Florianópolis suspeito de exploração, agressão e abuso sexual contra uma mulher. Além disso, a 'Guerra Suja' na Argentina identificou pelo menos 38 vítimas mortais, conforme identificadas por antropólogos forenses. Em um contexto mais amplo, o Chile debate a redução de penas para crimes contra crianças, enquanto a repressão transnacional e a lei mordaz que permite detenção por ofensas a policiais são debatidas em países como o Chile."}, "resumo_do_dia": {"politica_nacional": [{"id": 223819, "titulo": "Datafolha: Eleitor se divide sobre Lula ou Flávio como vencedor de debate, e maioria diz ter assistido", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/datafolha-eleitor-se-divide-sobre-lula-ou-flavio-como-vencedor-de-debate-e-maioria-diz-ter-assistido.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-24T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O segundo debate entre Flávio Bolsonaro e Lula não alterou significativamente as intenções de voto dos eleitores, com apenas 2% mudando de lado, de acordo com a pesquisa do Datafolha.", "titulo_pt": "Eleitor se divide sobre Lula ou Flávio como vencedor de debate, e maioria diz ter assistido", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 223910, "titulo": "Apoiadores de Flávio Bolsonaro organizam “caminhonetaço” em Florianópolis", "url": "https://www.metropoles.com/brasil/apoiadores-de-flavio-bolsonaro-organizam-caminhonetaco-em-florianopolis", "fonte_id": "metropoles", "data_pub": "2026-10-24T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Apoiadores de Flávio Bolsonaro realizaram uma mobilização em Florianópolis neste sábado (24/10), percorrendo várias ruas da cidade. A ação ocorreu na véspera do segundo turno das eleições.", "titulo_pt": "Apoiadores de Flávio Bolsonaro organizam 'caminhonetaço' em Florianópolis", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 223931, "titulo": "Datafolha: 46% rejeitam Lula; Flávio é rejeitado por 45%", "url": "https://www.cnnbrasil.com.br/eleicoes/datafolha-46-rejeitam-lula-flavio-e-rejeitado-por-45/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-24T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Datafolha realizou um levantamento entre os dias 23 e 23 de outubro, ouvindo 4.050 pessoas, e constatou que 46% rejeitam Lula e 45% rejeitam Flávio. A margem de erro é de dois pontos percentuais, com um índice de confiança de 95%.", "titulo_pt": "46% Rejeitam Lula; Flávio é rejeitado por 45%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 223847, "titulo": "Votação: eleitores podem usar itens que expressem preferência política", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/votacao-eleitores-podem-usar-itens-que-expressem-preferencia-politica", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-24T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os eleitores podem usar itens que expressem sua preferência política durante o segundo turno das eleições 2026. Isso inclui bandeiras, camisetas e broches adesivos. No entanto, aglomerações e manifestações coletivas ruidosas não são permitidas.", "titulo_pt": "Votação: eleitores podem usar itens que expressem preferência política", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 223848, "titulo": "Eleições: saiba como consultar locais de votação para o segundo turno", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/eleicoes-saiba-como-consultar-locais-de-votacao-para-o-segundo-turno", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-24T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os eleitores brasileiros devem verificar os locais de votação no segundo turno das eleições presidenciais, que ocorre neste domingo (25), através do aplicativo e-título. O Tribunal Superior Eleitoral recomenda que os eleitores consultem com antecedência os locais de votação nos canais oficiais.", "titulo_pt": "Eleições: saiba como consultar locais de votação para o segundo turno", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 223891, "titulo": "A última pesquisa Datafolha sobre a disputa Flávio x Lula antes do segundo turno", "url": "https://veja.abril.com.br/politica/a-ultima-pesquisa-datafolha-sobre-a-disputa-flavio-x-lula-antes-do-segundo-turno-2/", "fonte_id": "veja", "data_pub": "2026-10-24T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A última pesquisa Datafolha indica uma polarização política no segundo turno entre Flávio (PL) e Lula (PT), com a votação acirrada a poucas horas da eleição deste domingo, 25.", "titulo_pt": "Última pesquisa Datafolha: polarização mantém disputa entre Flávio e Lula acirrada antes do segundo turno", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 223921, "titulo": "Flávio e Lula fecham campanha levando multidões para atos no RJ e em SP", "url": "https://www.metropoles.com/brasil/flavio-e-lula-fecham-campanha-levando-multidoes-para-atos-no-rj-e-em-sp", "fonte_id": "metropoles", "data_pub": "2026-10-24T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na véspera do segundo turno, Flávio e Lula realizaram atos políticos em Rio de Janeiro, São Paulo e Belo Horizonte, acompanhados por familiares e aliados. Os candidatos buscaram mobilizar apoios em diferentes regiões do país.", "titulo_pt": "Flávio e Lula fecham campanha com atos em grandes centros", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 224091, "titulo": "Pesquisa eleitoral BTG/Nexus aponta Flávio Bolsonaro à frente no segundo turno das eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/pesquisa-eleitoral-btg-nexus-aponta-flavio-bolsonaro-a-frente-no-segundo-turno-das-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-10-24T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa eleitoral BTG/Nexus indica que Flávio Bolsonaro está à frente no segundo turno das eleições de 2026, com 52,4% dos votos válidos, contra 47,6% do presidente Jair Bolsonaro.", "titulo_pt": "Pesquisa eleitoral BTG/Nexus aponta Flávio Bolsonaro à frente no segundo turno das eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 223925, "titulo": "Ao TSE, PGE se manifesta contra suspensão do canal \"Exército do Lula\"", "url": "https://www.metropoles.com/brasil/pge-diz-ao-tse-que-e-contra-suspensao-do-canal-exercito-do-lula", "fonte_id": "metropoles", "data_pub": "2026-10-24T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral de Estado (PGE) se posicionou contra a suspensão do canal do WhatsApp 'Exército do Lula' diante do Tribunal Superior Eleitoral (TSE). A campanha do deputado Flávio pediu a suspensão da ferramenta nesta semana.", "titulo_pt": "PGE se manifesta contra suspensão do canal 'Exército do Lula' no TSE", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 224007, "titulo": "Lula e Flávio encerram campanha com atos no Sudeste", "url": "https://www.dw.com/pt-br/lula-e-flávio-encerram-campanha-com-atos-no-sudeste/live-78393402?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-24T20:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula e Flávio Bolsonaro encerraram suas campanhas com atos políticos em importantes cidades do Sudeste, incluindo Rio de Janeiro, Minas Gerais e São Paulo. As mobilizações visaram criticar o adversário e fortalecer apoio em regiões estratégicas.", "titulo_pt": "Lula e Flávio encerram campanha com atos no Sudeste", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}], "politica_nacional__eventos": [{"titulo": "Celina Leão lidera com 61% dos votos válidos; Leandro Grass tem 39%", "sumario": "Um levantamento divulgado neste sábado (24/10) mostrou que Celina Leão lidera com 61% dos votos válidos, enquanto Leandro Grass tem 39%. Na véspera do segundo turno, Celina Leão lidera com 59% dos votos válidos, enquanto Grass obteve 41%. A pesquisa Datafolha divulgada no Distrito Federal indica que a atual governadora Celina Leão (PP) tem 59% dos votos válidos, contra 41% de Leandro Grass (PT) na véspera do segundo turno das eleições.", "artigos": [{"id": 223923, "titulo": "Quaest: Celina Leão lidera com 61% dos votos válidos; Leandro Grass tem 39%", "url": "https://www.metropoles.com/distrito-federal/quaest-celina-leao-lidera-com-61-dos-votos-validos-leandro-grass-tem-39", "fonte_id": "metropoles", "data_pub": "2026-10-24T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento divulgado neste sábado (24/10) mostrou que Celina Leão lidera com 61% dos votos válidos, enquanto Leandro Grass tem 39%. O segundo turno das eleições está marcado para este domingo (25/10).", "titulo_pt": "Celina Leão lidera com 61% dos votos válidos; Leandro Grass tem 39%", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 223822, "titulo": "Datafolha: Celina Leão lidera no DF com 59% dos votos válidos, ante 41% de Grass na véspera do 2º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/datafolha-celina-leao-lidera-no-df-com-59-dos-votos-validos-ante-41-de-grass-na-vespera-do-2o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-24T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na véspera do segundo turno, Celina Leão lidera com 59% dos votos válidos, enquanto Grass obteve 41%. A pesquisa foi realizada pelo Datafolha.", "titulo_pt": "Celina Leão lidera no DF com 59% dos votos válidos, ante 41% de Grass no 2º turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 223854, "titulo": "Datafolha no DF, votos válidos: Celina Leão, 59%; Leandro Grass, 41%", "url": "https://g1.globo.com/df/distrito-federal/eleicoes/2026/noticia/2026/10/24/datafolha-df-governador-segundo-turno-24-outubro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-24T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha divulgada no Distrito Federal indica que a atual governadora Celina Leão (PP) tem 59% dos votos válidos, contra 41% de Leandro Grass (PT) na véspera do segundo turno das eleições.", "titulo_pt": "Votos válidos: celina Leão, 59%; Leandro Grass, 41%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}]}, {"titulo": "Quem está na frente no segundo turno das eleições no Espírito Santo?", "sumario": "A pesquisa mais recente indica um empate técnico entre Lorenzo Pazolini e Ricardo Ferraço no segundo turno das eleições no Espírito Santo. Pesquisas recentes indicam que Celina Leão está numericamente à frente de Leandro Grass no segundo turno das eleições no Distrito Federal, com 59% a 41% dos votos válidos, conforme apontado pela Real Time Big Data. Omar Aziz está numericamente à frente de Maria do Carmo no segundo turno das eleições no Amazonas, segundo o último levantamento.", "artigos": [{"id": 223959, "titulo": "Quem está na frente no 2º turno no Espírito Santo?", "url": "https://www.infomoney.com.br/politica/quem-esta-na-frente-no-2o-turno-no-espirito-santo/", "fonte_id": "infomoney", "data_pub": "2026-10-24T21:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa mais recente indica um empate técnico entre Lorenzo Pazolini e Ricardo Ferraço no segundo turno das eleições no Espírito Santo. Lorenzo Pazolini estava numericamente à frente anteriormente, mas isso mudou recentemente.", "titulo_pt": "Quem está na frente no segundo turno das eleições no Espírito Santo?", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 223960, "titulo": "Quem está na frente no 2º turno no Distrito Federal?", "url": "https://www.infomoney.com.br/politica/quem-esta-na-frente-no-2o-turno-no-distrito-federal/", "fonte_id": "infomoney", "data_pub": "2026-10-24T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisas recentes indicam que Celina Leão está numericamente à frente de Leandro Grass no segundo turno das eleições no Distrito Federal, com 59% a 41% dos votos válidos, conforme apontado pela Real Time Big Data.", "titulo_pt": "Quem está na frente no segundo turno no Distrito Federal?", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 223962, "titulo": "Quem está na frente no 2º turno no Amazonas?", "url": "https://www.infomoney.com.br/politica/quem-esta-na-frente-no-2o-turno-no-amazonas/", "fonte_id": "infomoney", "data_pub": "2026-10-24T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Omar Aziz está numericamente à frente de Maria do Carmo no segundo turno das eleições no Amazonas, segundo o último levantamento. No entanto, a diferença entre os candidatos diminuiu.", "titulo_pt": "Quem está na frente no segundo turno das eleições no Amazonas?", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}]}], "mundo": [{"id": 223712, "titulo": "Taiwan plans to build rare earths plant", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/25/2003866563", "fonte_id": "taipei_times", "data_pub": "2026-10-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Taiwan está planejando construir uma fábrica para processar metais rares da terra. O objetivo é fortalecer a indústria local e aumentar a autossuficiência em matérias-primas estratégicas.", "titulo_pt": "Taiwan planeja construir fábrica de metais rares", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 223715, "titulo": "Israeli military displaces Hebron families after attack", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/25/2003866566", "fonte_id": "taipei_times", "data_pub": "2026-10-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Famílias em Hebron foram deslocadas pelas forças militares israelenses após um ataque.", "titulo_pt": "Forças militares israelenses deslocam famílias em Hebron após ataque", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {" : null, "texto_pt": "O ministro das Relações Exteriores de Taiwan, Lin Chia-lung, encoraja parcerias em inteligência artificial e drones com a Europa.", "titulo_pt": "Ministro das relações exteriores de taiwan encoraja parcerias em IA e drones com a Europa", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 224094, "titulo": "Violent Protests Resurface in Albania: What to Know", "url": "https://www.nytimes.com/2026/10/17/world/europe/albania-protests-what-to-know.html", "fonte_id": "nyt_world", "data_pub": "2026-10-24T21:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas marcharam em manifestações de estudantes sobre educação, o custo de vida e um projeto relacionado a Jared Kushner, sogro do ex-presidente dos Estados Unidos, Donald Trump.", "titulo_pt": "Protestos violentos retornam em Albania: o que saber", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 224206, "titulo": "(URGENT) N. Korea confirms leader Kim's Saturday visit to China", "url": "https://en.yna.co.kr/view/AEN20261025000200315", "fonte_id": "yonhap_news", "data_pub": "2026-10-24T21:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Norte da Coreia confirmou que o líder Kim visitará a China no sábado. A visita foi confirmada pela Coreia do Norte.", "titulo_pt": "Norte Coreia confirma visita do líder Kim à China no sábado", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 224088, "titulo": "Trump vota en Palm Beach a 10 días de las ‘midterms’ pese a cuestionar el voto anticipado y por correo", "url": "https://elpais.com/us/2026-10-24/trump-vota-en-palm-beach-a-10-dias-de-las-midterms-pese-a-cuestionar-el-voto-anticipado-y-por-correo.html", "fonte_id": "elpais_america", "data_pub": "2026-10-24T21:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Trump, votou em Palm Beach a dez dias das eleições de meios mandatos, apes in France, but This Time, With Less Property Damage", "url": "https://www.nytimes.com/2026/10/24/world/europe/france-protests-unrest-clashes-police.html", "fonte_id": "nyt_world", "data_pub": "2026-10-24T21:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Após marchas em grande parte pacíficas no sábado, confrontos ocorreram à noite. No entanto, uma forte presença policial, 1.000 detenções e a reorientação das rotas das manifestações ajudaram a limitar o dano à propriedade.", "titulo_pt": "Distúrbios retornam à França, mas com menos danos à propriedade", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 224171, "titulo": "Riyadh airport to resume flights Sunday following closure after Houthi attacks", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/riyadh-airport-resume-flights-sunday-following-closure-after-houthi", "fonte_id": "middle_east_eye", "data_pub": "2026-10-24T21:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aeroporto internacional de Riyadh, na Arábia Saudita, retomará as operações a partir de domingo, após uma interrupção de duas semanas devido a ataques de houthis do Iêmen. O terminal 1 será usado para voos domésticos e o terminal 2 para voos internacionais operados por companhias aéreas nacionais.", "titulo_pt": "Aeroporto de riad retoma voos após fechamento devido a ataques houthis", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 223719, "titulo": "Atypical worker numbers decline", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/25/2003866577", "fonte_id": "taipei_times", "data_pub": "2026-10-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de trabalhadores atípicos diminuiu. Os detalhes específicos sobre essa tendência não foram fornecidos nesse trecho.", "titulo_pt": "Números atípicos de trabalhadores declinam", "veiculo": "Taipei Times", "pais": " null, "texto_pt": "Foram selecionadas três opções de memória RAM DDR5 compatíveis e de alta velocidade para upgrades em PCs, disponíveis na Amazon. As opções incluem a CORSAIR Vengeance DDR5 16GB 5200MHz CL40.", "titulo_pt": "Atualize a memória RAM do PC: selecionemos ótimas opções de DDR5 em oferta", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 223982, "titulo": "O que é e como funciona a Conta Meta no WhatsApp, Instagram e Facebook?", "url": "https://canaltech.com.br/apps/o-que-e-e-como-funciona-a-conta-meta-no-whatsapp-instagram-e-facebook/", "fonte_id": "canaltech", "data_pub": "2026-10-24T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Conta Meta é uma nova forma de login unificado nas plataformas da empresa, como Instagram, Facebook, WhatsApp, Meta AI e os sistemas dos óculos inteligentes. O recurso permite acesso entre diferentes apps sem a necessidade de senha, desde que estejam vinculados pela Central de Contas.", "titulo_pt": "O que é e como funciona a Conta Meta no WhatsApp, Instagram e Facebook?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 223840, "titulo": "A surpreendente popularidade da IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/a-surpreendente-popularidade-da-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-24T18:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bae Oh-do, um vendedor de violinos de 70 anos que cresceu na Coreia do Sul após a Guerra da Coreia, relata como a era do trabalho manual ainda está profundamente enraizada nele. Ele se lembra de ter usado uma 'bomba de pedal' para obter água e da alegria de ver os primeiros tratores chegar à zona rural sul-coreana.", "titulo_pt": "A impressionante popularidade da IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 224210, "titulo": "Pennsylvania will require labels on AI-generated ads", "url": "https://www.theverge.com/ai-artificial-intelligence/1018187/pennsylvania-ai-deceptive-advertising-act", "fonte_id": "the_verge", "data_pub": "2026-10-24T18:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governador de Pennsylvania, Josh Shapiro, assinou a Lei de Publicidade por Inteligência Artificial Enganosa, que exige que anúncios modificados ou gerados por inteligência artificial sejam rotulados. O rótulo deve ser exibido no mesmo formato especificado na lei.", "titulo_pt": "Pennsylvania exigirá rótulos em anúncios criados por inteligência artificial", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 223983, "titulo": "10 jogos parecidos com Zelda para quem não tem um Nintendo Switch", "url": "https://canaltech.com.br/games/jogos-parecidos-com-zelda-para-quem-nao-tem-nintendo-switch/", "fonte_id": "canaltech", "data_pub": "2026-10-24T18:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O anúncio do remake de The Legend of Zelda: Ocarina of Time agitou a comunidade de jogadores. O jogo está programado para ser lançado em novembro e competirá com outros lançamentos esperados, como GTA 6, no The Game Awards.", "titulo_pt": "10 Jogos parecidos com Zelda para quem não tem um Nintendo Switch", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 224204, "titulo": "Musk admits he throttled Ukraine’s Starlink speeds, as access is restored", "url": "https://www.scmp.com/news/world/russia-central-asia/article/3372040/ukraines-starlink-speeds-restored-after-week-frontline-disruption", "fonte_id": "scmp", "data_pub": "2026-10-24T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Elon Musk admitiu que sua empresa SpaceX limitou temporariamente a velocidade do serviço de internet Starlink na Ucrânia, o que interrompeu operações essenciais para a defesa do país contra a Rússia. A velocidade do Starlink foi restaurada após as restrições, conforme anunciado pelo presidente ucraniano Volodymyr Zelensky.", "titulo_pt": "Musk admite ter limitado a velocidade do Starlink na Ucrânia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 224085, "titulo": "Hackeos con IA desbordan Internet: falla en PHP expuso al 70% de la web", "url": "https://www.latercera.com/tecnologia/noticia/php2shell-hackeos-con-ia-falla-php/", "fonte_id": "la_tercera", "data_pub": "2026-10-24T17:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Foi identificado um problema crítico com o PHP2Shell, duas vulnerabilidades que foram descobertas com a ajuda de inteligência artificial. Esse problema afetou 70% dos sites da web e levou governos europeus a desconectar seus sites. Além disso, mais de 400 bancos e empresas de pagamentos em América Latina já foram atingidos por uma onda de ataques automatizados.", "titulo_pt": "Fallas em PHP expõem 70% da web: ataque com IA atinge bancos e empresas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 223920, "titulo": "Novo estudo indica que corvos tomam decisões mais rápido do que humanos", "url": "https://www.metropoles.com/ciencia/novo-estudo-indica-que-corvos-tomam-decisoes-mais-rapido-do-que-humanos", "fonte_id": "metropoles", "data_pub": "2026-10-24T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo demonstrou que corvos são capazes de tomar decisões mais rapidamente do que humanos em certas tarefas. Durante a experimentação, os corvos indicavam com precisão se um ponto aparecia na esquerda ou na direita da tela.", "titulo_pt": "Novo estudo indica que corvos tomam decisões mais rápido do que humanos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 223924, "titulo": "Estudo mostra avanço em terapias inovadoras para doenças neuroimunológicas", "url": "https://www.metropoles.com/saude/estudo-mostra-avanco-em-terapias-inovadoras-para-doencas-neuroimunologicas", "fonte_id": "metropoles", "data_pub": "2026-10-24T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo demonstrou avanços nas terapias inovadoras para doenças neuroimunológicas. O Ocrevus, um medicamento usado para a esclerose múltipla, resultou em 90% das crianças e adolescentes que o utilizaram ficarem livres de surtos.", "titulo_pt": "Estudo mostra avanço em terapias inovadoras para doenças neuroimunológicas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 224211, "titulo": "Bell pepper colors reveal differences in sweetness, nutrients and ripeness", "url": "https://phys.org/news/2026-10-bell-pepper-reveal-differences-sweetness.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pimentões, também conhecidos como capsicums, pimentões doces ou paprika, originaram-se na América Central e do Sul e pertencem à família das solanáceas, que inclui tomates e berinjelas. As diferentes cores de pimentão revelam diferenças em doçura, nutrientes e grau de madureza.", "titulo_pt": "Cores dos pimentões revelam diferenças em doçura, nutrientes e grau de madureza", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 224212, "titulo": "Tests reveal why titanium additions do not fully prevent pitting corrosion in stainless steel", "url": "https://phys.org/news/2026-10-reveal-titanium-additions-fully-pitting.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A adição de titanio em aço inoxidável não previne completamente a corrosão por pitting em ambientes com íons de cloreto, como a água do mar. As corrosões por pitting geralmente iniciam em pequenas partículas chamadas inclusões, que estão presentes no aço.", "titulo_pt": "Testes revelam por que a adição de titânio não previne completamente a corrosão por pitting no aço inoxidável", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223978, "titulo": "OVNI? Triângulos pretos misteriosos são avistados sobre área confidencial nos EUA", "url": "https://olhardigital.com.br/2026/10/24/ciencia-e-espaco/ovni-triangulos-pretos-misteriosos-sao-avistados-sobre-area-confidencial-nos-eua/", "fonte_id": "olhar_digital", "data_pub": "2026-10-24T19:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Arquivos do Pentágono relatam um objeto não identificado que cruzou o céu a uma velocidade de quase 3.000 km/h e desapareceu sem deixar rastros. O avistamento ocorreu em uma área confidencial dos Estados Unidos.", "titulo_pt": "OVNI? Triângulos pretos misteriosos são avistados sobre área confidencial nos EUA", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 224213, "titulo": "Single X-ray pulse reveals plasma nanostructures across scales with one camera", "url": "https://phys.org/news/2026-10-ray-pulse-reveals-plasma-nanostructures.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A compreensão de instabilidades e turbulência em plasma é um desafio crucial em várias áreas de pesquisa, como fusão nuclear, astrofísica e física de plasma com laser. A turbulência leva a estruturas de diferentes tamanhos que influenciam significativamente o movimento e a fluxo de energia no plasma.", "titulo_pt": "Única câmera captura estruturas nano-plasmáticas em diferentes escalas com uma única onda x", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223759, "titulo": "How flare ribbons reveal hidden solar explosions on the sun", "url": "https://phys.org/news/2026-10-flare-ribbons-reveal-hidden-solar.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Flare ribbons são marcas visíveis na superfície do Sol que revelam explosões solares ocultas. O comportamento solar, especialmente os flares solares, afeta diretamente a vida das pessoas na Terra.", "titulo_pt": "Como faixas de erupção revelam explosões solares ocultas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223760, "titulo": "'One-positron cyclotron' could test a key prediction of the Standard Model", "url": "https://phys.org/news/2026-10-positron-cyclotron-key-standard.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O 'ciclógrafo de positrônio' poderia testar uma previsão crucial do Modelo Estándar da Física Particulada. O positrônio é o antimatéria do elétron, com massa igual mas carga elétrica oposta. Segundo a previsão do Modelo Estándar, o momento magnético do positrônio deve ser exatamente oposto ao do elétron.", "titulo_pt": "Ciclógrafo de positrônio poderia testar previsão crucial do modelo estándar", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223769, "titulo": "STAT+: The ESMO presentation everyone’s been waiting for", "url": "https://www.statnews.com/2026/10/24/the-esmo-2026-merck-moderna-presentation-amgen-imdelltra-news/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-24T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foi apresentado um discurso 'presidencial' da Moderna e da Merck durante o segundo dia da reunião da Sociedade Europeia de Oncologia Médica em Madri. Outras notícias do evento também foram divulgadas.", "titulo_pt": "A apresentação 'presidencial' da moderna e da merck no ESMO", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 223999, "titulo": "OMS inicia testes de vacina contra cepa do Ebola, responsável por surto no Congo", "url": "https://exame.com/mundo/oms-inicia-testes-de-vacina-contra-cepa-do-ebola-responsavel-por-surto-no-congo/", "fonte_id": "exame", "data_pub": "2026-10-24T16:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OMS começou um ensaio clínico em outubro para testar três vacinas contra a variante Bundibugyo do Ebola. O estudo incluirá gestantes e crianças a partir de 12 anos, grupos que são frequentemente excluídos de pesquisas clínicas.", "titulo_pt": "OMS inicia testes de vacina contra variante do Ebola, no Congo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 223248, "titulo": "‘Um avanço histórico’: vacina personalizada reduz recorrência de câncer de pele agressivo em 42%", "url": "https://veja.abril.com.br/saude/um-avanco-historico-vacina-personalizada-reduz-recorrencia-de-cancer-de-pele-agressivo-em-42/", "fonte_id": "veja", "data_pub": "2026-10-24T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo de fase 3 apresentou resultados no congresso da Sociedade Europeia de Oncologia Médica em Madri, mostrando que uma vacina personalizada reduziu em 42% a recorrência de um câncer de pele agressivo.", "titulo_pt": "Um avanço histórico': vacina personalizada reduz recorrência de câncer de pele agressivo em 42%", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 223761, "titulo": "Newly identified protein pathway helps HIV stay hidden despite treatment", "url": "https://phys.org/news/2026-10-newly-protein-pathway-hiv-stay.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Proteínas identificadas recentemente ajudam o HIV a permanecer oculto mesmo com o tratamento. As reservatórios virais, onde o HIV se encontra inativo em certas células imunológicas e no cérebro, são os principais obstáculos para a cura atual do HIV.", "titulo_pt": "Novo caminho proteico ajuda HIV a permanecer oculto apesar do tratamento", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223789, "titulo": "This Week In Space podcast: Episode 233 — The Artemis Generation", "url": "https://www.space.com/entertainment/space-movies-shows/this-week-in-space-podcast-episode-233-the-artemis-generation", "fonte_id": "space_com", "data_pub": "2026-10-24T15:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No episódio 233 do podcast This Week In Space, Tariq Malik e Rick Jenet conversam com Dr. Amanda Smith-Hackler, da Universidade de Pesquisa Espacial, sobre como entrar no mercado de trabalho espacial.", "titulo_pt": "Episódio 233 do this Week In Space: a geração Artemis", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 223790, "titulo": "On this day in space! Oct. 24, 1946: V-2 rocket takes 1st photos of Earth from space", "url": "https://www.space.com/space-exploration/on-this-day-in-space-october-24-2026", "fonte_id": "space_com", "data_pub": "2026-10-24T15:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 24 de outubro de 1946, um foguete V-2 capturou a primeira foto de Earth do espaço. Este evento marcou o início da fotografia espacial.", "titulo_pt": "24 De outubro de 1946: foguete v-2 captura primeira foto de Earth do espaço", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 223145, "titulo": "Palácio na Etiópia teria estrutura similar à de arranha-céu há quase 3.000 anos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/palacio-na-etiopia-teria-estrutura-similar-a-de-arranha-ceu-ha-quase-3000-anos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-24T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Era há 2.800 anos, edifícios altos já existiam na região das terras altas da Etiópia, diferentemente do que se costuma pensar, onde as grandes construções da Antiguidade eram associadas apenas ao Egito, Grécia e Roma.", "titulo_pt": "Palácio na Etiópia teria estrutura similar a arranha-céu há quase 3.000 anos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 223762, "titulo": "Nanoscale alloy redesign tackles cold brittleness for potential deep-space and deep-sea applications", "url": "https://phys.org/news/2026-10-nanoscale-alloy-redesign-tackles-cold.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alies nanoescamosos são redesenhados para superar a britadeira em ambientes muito frios, com potenciais aplicações em aeroespacial, energia limpa, sistemas supercondutores e exploração espacial profunda. Isso visa manter altos níveis de força, ductilidade e resistência à fratura em temperaturas ultrabaixas.", "titulo_pt": "Reconceituação de alies nanoescamosos resolve britadeira em temperaturas muito baixas para aplicações em espaço profundo e oceanos profundos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 223720, "titulo": "Music workshop praised", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/25/2003866578", "fonte_id": "taipei_times", "data_pub": "2026-10-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um workshop musical foi elogiado pela comunidade.", "titulo_pt": "Workshop musical elogiado", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 223721, "titulo": "Richard Metson and others honored at comic awards", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/25/2003866579", "fonte_id": "taipei_times", "data_pub": "2026-10-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Richard Metson e outros foram homenageados em cerimônia de premiação de quadrinhos.", "titulo_pt": "Richard Metson e outros são homenageados em premiação de quadrinhos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 224216, "titulo": "Cynthia Erivo Plays Glinda in ‘Nigerian Wicked’ Sketch on ‘SNL U.K.’: ‘She Wants a BBL That Defies Gravity’", "url": "https://variety.com/2026/tv/global/cynthia-erivo-glinda-nigerian-wicked-snl-uk-1236930402/", "fonte_id": "variety", "data_pub": "2026-10-24T21:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cynthia Erivo interpr ce William on ‘The Graham Norton Show,’ ‘The Celebrity Traitors’ and More", "url": "https://variety.com/2026/tv/global/snl-uk-cold-open-prince-william-graham-norton-show-1236930390/", "fonte_id": "variety", "data_pub": "2026-10-24T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante o cold open de ‘SNL U.K.’, foram abordados eventos da semana, incluindo a aparição do ex-primeiro-ministro Andy Burnham no programa ‘Celebrity Gogglebox’ e do príncipe William no ‘The Graham Norton Show’. Burnham discutiu com o prefeito de Liverpool Steven Rotheram seus momentos favoritos da televisão da semana.", "titulo_pt": "SNL U.K. Faz sátira com Andy Burnham em 'Celebrity Gogglebox' e Prince William em 'The Graham Norton Show'", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 224043, "titulo": "¿El fin de los escritores?", "url": "https://www.clarin.com/opinion/fin-escritores_0_SyCkfZGsT0.html", "fonte_id": "clarin", "data_pub": "2026-10-24T21:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute o fim da era dos escritores tradicionais, explorando como a disseminação de informações e a criação de conteúdo estão mudando o panorama literário.", "titulo_pt": "O fim dos escritores?", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 223945, "titulo": "Análise: Presidente eleito terá oposição mobilizada", "url": "https://www.cnnbrasil.com.br/eleicoes/analise-presidente-eleito-tera-oposicao-mobilizada/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-24T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O analista de Política da CNN, Pedro Venceslau, avaliou o cenário pós-eleição e destacou que tanto o campo do presidente eleito quanto o da oposição estarão mobilizados para resistir a uma derrota.", "titulo_pt": "Análise: presidente eleito terá oposição mobilizada", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 224220, "titulo": "‘Young Sheldon’ Star Emily Osment "le_monde_en", "data_pub": "2026-10-24T14:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um rally de 25.000 pessoas ocorreu em Madri exigindo garantias para o sistema de aposentadoria. O evento acontece em meio a uma disputa política sobre a sustentabilidade do sistema de aposentadoria espanhol e os custos de vida, antes das eleições parlamentares no próximo mês.", "titulo_pt": "25.000 Pessoas em rally em madri exigindo garantias para o sistema de aposentadoria", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 223571, "titulo": "After deadly Trappes shooting, residents express anger and resignation over pervasive racism", "url": "https://www.lemonde.fr/en/france/article/2026/10/24/after-deadly-trappes-shooting-residents-express-anger-and-resignation-over-pervasive-racism_6762967_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-24T11:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Residentes da cidade francesa de Trappes, assim como o prefeito Ali Rabeh, consideram que o ataque que resultou em mortos e feridos foi o resultado de discursos que atribuem todos os problemas da França a muçulmanos e pessoas de origem africana.", "titulo_pt": "Depois do tiroteio letal em Trappes, moradores expressam raiva e resignação diante do racismo persistente", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 222780, "titulo": "Esto es Chile: El Maule ama su naturaleza, pero le teme a la falta de trabajo", "url": "https://www.latercera.com/esto-es-chile/noticia/el-maule-ama-su-naturaleza-pero-le-teme-a-la-falta-de-trabajo/", "fonte_id": "la_tercera", "data_pub": "2026-10-24T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O estudo de 'Esto es Chile' revela que a região do Maule, no centro do Chile, experimenta uma tensão constante. De um lado, a região se orgulha de seus belos paisajes e tradições rurais, mas, do outro, não está satisfeita com a situação de emprego e teme a elevação do custo de vida.", "titulo_pt": "Isto é Chile: Maule ama sua natureza, mas teme a falta de emprego", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 222497, "titulo": "Metalúrgicos do ABC começam a negociar nova jornada após fim da escala 6x1", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/metalurgicos-do-abc-comecam-a-negociar-nova-jornada-apos-fim-da-escala-6x1.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-24T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Sindicato dos Metalúrgicos do ABC está negociando alterações em convenções e acordos coletivos de trabalho para implementar uma nova jornada após o fim da escala 6x1. A entidade já havia enviado propostas às metalúrgicas em junho.", "titulo_pt": "Metalúrgicos do ABC começam a negociar nova jornada após fim da escala 6x1", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 222620, "titulo": "Enem 2026 tem mais de 5 milhões de inscritos; mulheres são 64% do total", "url": "https://www.cnnbrasil.com.br/educacao/enem-2026-tem-mais-de-5-milhoes-de-inscritos-mulheres-sao-64-do-total/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-24T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Enem 2026 contou com mais de 5 milhões de inscritos, sendo que 64% são mulheres. O exame será aplicado nos dias 8 e 15 de novembro. Especialistas recomendam revisar erros, distribuir os estudos e treinar a administração do tempo na reta final.", "titulo_pt": "Enem 2026 tem mais de 5 milhões de inscritos; mulheres são 64% do total", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 222752, "titulo": "Mamdani anunció que Nueva York dará comida gratis a perros y gatos en 22 puntos de la ciudad", "url": "https://www.lanacion.com.ar/estados-unidos/nueva-york/mamdani-anuncio-que-nueva-york-dara-comida-gratis-a-perros-y-gatos-en-22-puntos-de-la-ciudad-nid23102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-24T06:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O programa de Mamdani fornecerá comida gratuita para cães e gatos em 22 pontos da cidade de Nova York, com uma investida municipal de 500 mil dólares. Os locais onde será oferecida a comida serão divulgados.", "titulo_pt": "Mamdani anuncia distribuição gratuita de comida para cães e gatos em 22 pontos de nova York", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 222650, "titulo": "Mounjaro ou anorexia? Médicos alertam que canetas podem mascarar transtornos alimentares graves", "url": "https://exame.com/ciencia/mounjaro-ou-anorexia-medicos-alertam-que-canetas-podem-mascarar-transtornos-alimentares-graves/", "fonte_id": "exame", "data_pub": "2026-10-24T06:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Médicos alertam que a perda rápida de peso, tontura e redução extrema do apetite podem ser confundidos com efeitos das canetas emagrecedoras, o que dificulta o diagnóstico de transtornos alimentares graves.", "titulo_pt": "Mounjaro ou anorexia? Médicos alertam sobre confusão com transtornos alimentares", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 223065, "titulo": "Overseas Filipinos feel heartache over missing parcels for loved ones, demand answers", "url": "https://www.scmp.com/week-asia/lifestyle-culture/article/3371982/overseas-filipinos-feel-heartache-over-missing-parcels-loved-ones-demand-answers", "fonte_id": "scmp", "data_pub": "2026-10-24T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fatima Ramos, uma filipina que trabalha como doméstica no Abu Dhabi, está buscando explicações sobre as caixas de presentes que enviou para o país no ano anterior. Normalmente, essas caixas, conhecidas como balikbayan boxes, são preenchidas com presentes, roupas, alimentos e itens domésticos para serem enviados a familiares durante o Natal.", "titulo_pt": "Filipinos no exterior sentem saudade de pacotes perdidos para parentes, pedem respostas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 223974, "titulo": "Frente fria traz chuva no domingo de eleições em várias regiões", "url": "https://olhardigital.com.br/2026/10/24/ciencia-e-espaco/frente-fria-traz-chuva-no-domingo-de-eleicoes-em-varias-regioes/", "fonte_id": "olhar_digital", "data_pub": "2026-10-24T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma frente fria está trazendo chuva e tempestades no domingo de eleições em várias regiões do Brasil, enquanto o Piauí registra temperaturas de 40°C. A previsão do tempo completa para todo o país está disponível.", "titulo_pt": "Frente fria traz chuva no domingo de eleições em várias regiões", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 224080, "titulo": "Autoridad Marítima controla derrame en Papudo y descarta afectación al medio marino", "url": "https://www.latercera.com/nacional/noticia/autoridad-maritima-controla-derrame-en-papudo-y-descarta-afectacion-al-medio-marino/", "fonte_id": "la_tercera", "data_pub": "2026-10-24T19:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Autoridade Marítima controlou um derrame em Papudo após uma patrulla verificar as condições do local neste sábado. O incidente ocorreu após a derrama de uma substância de aproximadamente 20 litros no dia anterior.", "titulo_pt": "Autoridade Marítima controla derrame em Papudo e descarta impacto no meio marinho", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 223297, "titulo": "Com alerta para El Niño, SP amplia ações contra enchentes e secas com R$ 1,19 bilhão", "url": "https://exame.com/esg/com-alerta-para-el-nino-sp-amplia-acoes-contra-enchentes-e-secas-com-r-119-bilhao/", "fonte_id": "exame", "data_pub": "2026-10-24T12:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estado de São Paulo ampliou suas ações contra enchentes e secas com investimentos de R$ 1,19 bilhão. A estratégia inclui medidas para enfrentar temporais, estiagens, ondas de calor e incêndios florestais, além de uma carteira de investimentos de R$ 29 bilhões até 2029.", "titulo_pt": "Com alerta para El Niño, SP amplia ações contra enchentes e secas com R$ 1,19 bilhão", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 223483, "titulo": "A truck full of cows crashed in Kansas City. It reveals a bigger everyday horror.", "url": "https://www.vox.com/future-perfect/507513/kansas-city-cattle-truck-crash-livestock-transport", "fonte_id": "vox", "data_pub": "2026-10-24T11:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vídeos de rebanhos de novilhos correndo pelas ruas de Kansas City se tornaram uma história viral, mas representam uma tragédia real para os animais. Este incidente reflete frequentemente como notícias sobre animais podem ser uma comédia para os espectadores, mas um drama cruel para os animais envolvidos.", "titulo_pt": "Um caminhão de vacas se acidentou em Kansas City, revelando uma maior tragédia cotidiana.", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 223709, "titulo": "Indonesia cuts gas to Singapore amid Borneo, Sumatra wildfire haze", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3372025/indonesia-cuts-gas-singapore-amid-borneo-sumatra-wildfire-haze", "fonte_id": "scmp", "data_pub": "2026-10-24T10:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia reduziu as exportações de gás natural para Singapura para atender à demanda doméstica, de acordo com uma autoridade. O corte afetou uma produção total de 31 milhões de pés cúbicos padrão por dia, com 15 milhões de pés cúbicos padrão por dia sendo retirados da produção de Natuna, na Indonésia.", "titulo_pt": "Indonésia corta gás natural para singapura devido a fumaça de incêndios na Borneo e Sumatra", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 222727, "titulo": "Canadá produce soja cerca del Ártico, gracias al cambio climático", "url": "https://www.clarin.com/rural/canada-produce-soja-cerca-artico-gracias-cambio-climatico_0_r0W2rRO1jY.html", "fonte_id": "clarin", "data_pub": "2026-10-24T09:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A produção de soja no Canadá próxima ao Ártico aumentou devido ao aquecimento global. O impacto econômico do aquecimento atmosférico na agricultura mundial tem aspectos positivos.", "titulo_pt": "Canadá cultiva soja perto do Ártico graças ao aquecimento global", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 222775, "titulo": "El Niño no da tregua: de las lluvias atípicas al calor extremo", "url": "https://www.latercera.com/nacional/noticia/el-nino-no-da-tregua-de-las-lluvias-atipicas-al-calor-extremo/", "fonte_id": "la_tercera", "data_pub": "2026-10-24T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As precipitações de outubro causaram danos a centenas de residências e provocaram deslizamentos de terra, marcando uma primavera excepcionalmente chuvosa. Em um curto período, temperaturas elevadas e ondas de calor podem antecipar outros riscos para o verão.", "titulo_pt": "O Niño não dá trégua: das chuvas atípicas ao calor extremo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 223051, "titulo": "Thousands evacuated and flights grounded as Typhoon Champi hits eastern China", "url": "https://www.scmp.com/news/china/politics/article/3372015/thousands-evacuated-and-flights-grounded-typhoon-champi-hits-eastern-china", "fonte_id": "scmp", "data_pub": "2026-10-24T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Champi atingiu a costa leste da China, fazendo centenas de voos serem cancelados e levando autoridades a reloajar mais de 100 mil pessoas. O furacão está enfraquecendo à medida que se dirige para o Japão.", "titulo_pt": "Milhares evacuados e voos cancelados com o furacão Champi atingindo a costa leste da China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 222750, "titulo": "Inti Bonomo, experto en Ciencias Ambientales, sobre el avance del fenómeno del Súper Niño: “Va a seguir creciendo y el pico va a ser en diciembre”", "url": "https://www.lanacion.com.ar/sociedad/inti-bonomo-experto-en-ciencias-ambientales-sobre-el-avance-del-fenomeno-del-super-nino-va-a-seguir-nid24102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-24T07:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Inti Bonomo, especialista em Ciências Ambientais, prevê que o fenômeno do Súper Niño continuará crescendo e atingirá seu pico em dezembro. As condições de nubosidade persistente e temperaturas mais frescas de outubro serão prolongadas nos primeiros meses de 2027.", "titulo_pt": "Inti Bonomo, especialista em ciências ambientais, sobre o avanço do fenômeno do Súper Niño: 'vai seguir crescendo e o pico será em dezembro'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 222992, "titulo": "COP17 puts Armenia’s environmental record in the spotlight", "url": "https://www.aljazeera.com/opinions/2026/10/24/cop17-puts-armenias-environmental-record-in-the-spotlight?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-24T06:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Yerevan sediou a COP17, uma conferência global sobre biodiversidade. As preocupações relacionadas à mineração e proteção ambiental merecem ser examinadas durante o evento.", "titulo_pt": "COP17 coloca o registro ambiental da armênia sob a lupa", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 222753, "titulo": "Alerta en Neuquén: las intensas lluvias reactivaron cañadones secos y causaron estragos: Vaca Muerta, la zona más afectada", "url": "https://www.lanacion.com.ar/sociedad/alerta-en-neuquen-las-intensas-lluvias-reactivaron-canadones-secos-y-generaron-estragos-vaca-muerta-nid23102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-24T06:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Intensas chuvas reativaram cañadones secos na província de Neuquén, causando danos em estradas e desalojando famílias. A região de Vaca Muerta foi a mais afetada, com a crecida da estrada 5 arrastando materiais e veículos.", "titulo_pt": "Alerta em Neuquén: intensas chuvas reativaram cañadones secos e causaram estragos, com vaca Muerta sendo a região mais afetada", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 223727, "titulo": "Expert discusses deterring transnational repression", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/25/2003866585", "fonte_id": "taipei_times", "data_pub": "2026-10-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um especialista discute estratégias para deter a repressão transnacional. O evento aborda como combater ações abusivas que ultrapassem fronteiras nacionais.", "titulo_pt": "Especialista discute detecção de repressão transnacional", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 223273, "titulo": "PF prende argentino por exploração, agressão e abuso sexual contra mulher", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pf-prende-argentino-por-exploracao-agressao-e-abuso-sexual-contra-mulher", "fonte_id": "metropoles", "data_pub": "2026-10-24T16:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um argentino foi preso em Florianópolis, Santa Catarina, suspeito de exploração, agressão e abuso sexual contra uma mulher. O suspeito estava sendo procurado pela justiça da Argentina.", "titulo_pt": "PF prende argentino por exploração, agressão e abuso sexual contra mulher", "veiculo": "Metrópoles", "p
