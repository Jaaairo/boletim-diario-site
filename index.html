onaro/", "fonte_id": "veja", "data_pub": "2026-11-22T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro foi internado no Hospital DF Star, em Brasília, na última sexta-feira, devido a dores abdominais.", "titulo_pt": "Novo boletim médico sobre a saúde de Bolsonaro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 280691, "titulo": "Fiéis são hospitalizados após vazamento de gás em igreja na Alemanha", "url": "https://www.dw.com/pt-br/fiéis-são-hospitalizados-após-vazamento-de-gás-em-igreja-na-alemanha/a-80014673?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-22T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 50 fiéis foram hospitalizados após um vazamento de monóxido de carbono durante uma missa no sul da Alemanha. O dispositivo de segurança do aquecimento teria falhado.", "titulo_pt": "Fieis são hospitalizados após vazamento de gás em igreja na Alemanha", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 280745, "titulo": "Prisión preventiva para abuela de lactante de 11 meses que murió tras ingerir pasta base en Molina", "url": "https://www.latercera.com/nacional/noticia/prision-preventiva-para-abuela-de-lactante-que-murio-tras-ingerir-pasta-base-en-molina/", "fonte_id": "la_tercera", "data_pub": "2026-11-22T16:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma bebê de 11 meses morreu após sofrer convulsões enquanto estava sob a responsabilidade de sua avó, que foi presa preventivamente. A acusação é de homicídio por omissão com dolo eventual, aceita pelo tribunal.", "titulo_pt": "Prisão preventiva para avó de lactante de 11 meses que morreu após ingerir pasta base em Molina", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 280719, "titulo": "La Policía de la Ciudad detuvo por resistencia a la autoridad a una joven que quería subir al subte con su perro", "url": "https://www.lanacion.com.ar/seguridad/la-policia-de-la-ciudad-detuvo-por-resistencia-a-la-autoridad-a-una-joven-queria-subir-al-subte-con-nid22112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-22T16:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma jovem foi detida por resistência à autoridade após tentar levar seu cão ao metrô em Buenos Aires, Argentina. Ela permaneceu detida por mais de 12 horas em uma prefeitura local. A proibição de transportar animais durante os dias úteis foi o motivo do conflito, e os policiais afirmam que ela insultou e escupiu-os.", "titulo_pt": "Policia detém jovem que tentava levar cão ao metrô em buenos aires", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 280608, "titulo": "Contra os compactos, Cidade do México quer moradias sociais de pelo menos 60 m²", "url": "https://www.infomoney.com.br/mundo/contra-os-compactos-cidade-do-mexico-quer-moradias-sociais-de-pelo-menos-60-m%c2%b2/", "fonte_id": "infomoney", "data_pub": "2026-11-22T16:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Cidade do México propôs que as moradias sociais tenham pelo menos 60 m² para atender às necessidades das famílias e facilitar o trabalho remoto. A justificativa é que unidades compactas não atendem às necessidades das famílias mexicanas.", "titulo_pt": "Contra os compactos, Cidade do México quer moradias sociais de pelo menos 60 m²", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 280534, "titulo": "As principais vítimas de quadrilhas que agem em condomínios do Minha Casa, Minha Vida", "url": "https://veja.abril.com.br/brasil/as-principais-vitimas-de-quadrilhas-que-agem-em-condominios-do-minha-casa-minha-vida/", "fonte_id": "veja", "data_pub": "2026-11-22T16:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Famílias de baixa renda, mulheres e moradores que adquiriram suas casas através do programa Minha Casa, Minha Vida são alvos das facções e milícias.", "titulo_pt": "As principais vítimas de quadrilhas que atuam em condomínios do Minha Casa, Minha Vida", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 280594, "titulo": "Tragédia no RS: quem são as 5 vítimas da tempestade em Tupanciretã", "url": "https://www.metropoles.com/brasil/tragedia-no-rs-quem-sao-as-5-vitimas-da-tempestade-em-tupancireta", "fonte_id": "metropoles", "data_pub": "2026-11-22T16:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma tempestade com ventos superiores a 110 km/h causou a morte de cinco pessoas, feriu 265 e deixou cerca de 20 mil desalojados na Região Central do Rio Grande do Sul.", "titulo_pt": "Tragédia no RS: quem são as 5 vítimas da tempestade em Tupanciretã", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 280625, "titulo": "SUS avalia instalar posto médico avançado em Tupanciretã (RS) após temporal", "url": "https://www.cnnbrasil.com.br/nacional/sus-avalia-instalar-posto-medico-avancado-em-tupancireta-rs-apos-temporal/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-22T16:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Secretaria de Saúde do Estado (SUS) está avaliando a instalação de um posto médico avançado em Tupanciretã, no Rio Grande do Sul, após um temporal que causou cinco mortes e 265 feridos. A Força Nacional mobilizou 13 profissionais para avaliar a rede de saúde local e reforçar a assistência aos moradores.", "titulo_pt": "SUS planeja instalar posto médico avançado em Tupanciretã após temporal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 280595, "titulo": "Carro bate contra árvore e deixa quatro mortos e uma ferida em Pernambuco", "url": "https://www.metropoles.com/distrito-federal/na-mira/carro-bate-contra-arvore-e-deixa-quatro-mortos-e-uma-ferida-em-pernambuco", "fonte_id": "metropoles", "data_pub": "2026-11-22T16:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um acidente de carro ocorrido durante a madrugada deste domingo (22/11) em Pernambuco resultou em quatro mortes e uma ferida. As vítimas estavam presas às ferragens e foram resgatadas por bombeiros.", "titulo_pt": "Acidente de carro deixa quatro mortos e uma ferida em Pernambuco", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 280693, "titulo": "Tempestades no RS deixam mortos e milhares de deslocados", "url": "https://www.dw.com/pt-br/tempestades-no-rs-deixam-mortos-e-milhares-de-deslocados/a-80011201?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-22T16:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma supercélula causou ventos fortes de até 114 km/h no Rio Grande do Sul, afetando 36 municípios e deixando cinco mortos. Quase 9 mil residências foram impactadas.", "titulo_pt": "Tempestades no RS deixam cinco mortos e deslocam milhares", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 280751, "titulo": "Arzola ante marcha nacional del Colegio de Profesores: “No podemos darnos el lujo de perder clases”", "url": "https://www.latercera.com/nacional/noticia/arzola-ante-marcha-nacional-del-colegio-de-profesores-no-podemos-darnos-el-lujo-de-perder-clases/", "fonte_id": "la_tercera", "data_pub": "2026-11-22T16:07:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A secretária de Estado comentou sobre as negociações em andamento com o Colegio de Professores, indicando que há situações mais difíceis de resolver, mas também oportunidades para avanços mais rápidos. Ela enfatizou que não se pode permitir perdas de aulas durante a atual greve nacional.", "titulo_pt": "Arzola sobre greve nacional do Colegio de professores: 'não podemos nos permitir perder aulas'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 280742, "titulo": "Seis personas fallecen en siniestro de tránsito en Dalcahue: cuatro víctimas son menores de edad", "url": "https://www.latercera.com/nacional/noticia/seis-personas-fallecen-en-siniestro-de-transito-en-dalcahue-cuatro-victimas-son-menores-de-edad/", "fonte_id": "la_tercera", "data_pub": "2026-11-22T16:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Seis pessoas morreram em um acidente de trânsito em Dalcahue, com quatro vítimas sendo menores de idade. Cinco pessoas, incluindo três carabineras, ficaram feridas no incidente na Ruta 5 Sur, no quilômetro 1.152, na Região de Los Lagos.", "titulo_pt": "Seis pessoas morrem em acidente de trânsito em Dalcahue: quatro vítimas são menores", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 280631, "titulo": "Vídeo: homem morre e 14 ficam feridos em tiroteio no litoral de SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/video-homem-morre-e-14-ficam-feridos-em-tiroteio-no-litoral-de-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-22T15:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem morreu e 14 pessoas ficaram feridas durante um tiroteio registrado por câmeras de segurança em frente a um estabelecimento comercial no bairro Olaria, em Caraguatatuba, São Paulo. A polícia está investigando o caso, suspeitando que um casal local esteja envolvido na ação e tenha sido flagrado com uma arma.", "titulo_pt": "Vídeo: homem morre e 14 ficam feridos em tiroteio no litoral de SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 280576, "titulo": "ONU lamenta ausência de acordo na COP31 após impasse sobre combustíveis", "url": "https://www.metropoles.com/mundo/onu-lamenta-ausencia-de-acordo-na-cop31-apos-impasse-sobre-combustiveis", "fonte_id": "metropoles", "data_pub": "2026-11-22T17:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Conferência das Nações Unidas terminou sem um acordo político após mais de duas semanas de negociações, com a União Europeia rejeitando o texto final.", "titulo_pt": "ONU lamenta ausência de acordo na COP31 após impasse sobre combustíveis", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 280794, "titulo": "Cop31 climate talks break down as key deal rejected", "url": "https://www.theguardian.com/environment/2026/nov/22/cop31-climate-talks-set-to-end-in-deep-division-as-key-deal-rejected", "fonte_id": "guardian_world", "data_pub": "2026-11-22T16:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na Conferência das Nações Unidas sobre Mudanças Climáticas (Cop31) em Turquia, a União Europeia, o Reino Unido e aliados do mundo em desenvolvimento rejeitaram um acordo principal que não mencionava os combustíveis fósseis e foi considerado insuficiente para responder à ciência climática.", "titulo_pt": "Negociações sobre clima da cop31 se desmoronam após acordo principal ser rejeitado", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 280798, "titulo": "The World’s Biggest Climate Conference Just Fell Apart", "url": "https://www.theatlantic.com/science/2026/11/cop31/689530/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-22T15:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Delegados da conferência anual das Nações Unidas sobre clima não conseguiram chegar a um acordo pela primeira vez em quase 20 anos.", "titulo_pt": "A maior conferência mundial sobre clima acaba de colapsar", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 280694, "titulo": "Veto de sauditas e russos deixa COP31 sem declaração final pela 1ª vez desde 2009", "url": "https://www.dw.com/pt-br/veto-de-sauditas-e-russos-deixa-cop31-sem-declaração-final-pela-1ª-vez-desde-2009/a-80014428?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-22T15:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A COP31, ou Conferência das Nações Unidas sobre Mudanças Climáticas, não produziu uma declaração final pela primeira vez desde 2009, devido a um veto de países produtores de petróleo, incluindo sauditas e russos. A UE e outros países se recusaram a aprovar um texto que não mencionava os combustíveis fósseis.", "titulo_pt": "Veto de sauditas e russos impede declaração final na COP31 pela primeira vez desde 2009", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 280904, "titulo": "Dozens drown as boat capsizes in Nigeria en route to funeral", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/22/dozens-drown-as-boat-capsizes-in-nigeria-en-route-to-funeral?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-22T15:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 24 pessoas morreram após uma embarcação que transportava pessoas para um enterro se virar na Nigéria.", "titulo_pt": "Várias pessoas morrem em naufrágio de barco levando fiéis a um enterro na nigéria", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 280793, "titulo": "Australia urged to wean off imported fossil fuels amid global supply shocks", "url": "https://www.theguardian.com/australia-news/2026/nov/23/australia-urged-to-wean-off-imported-fossil-fuels-amid-global-supply-shocks", "fonte_id": "guardian_world", "data_pub": "2026-11-22T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório do Grattan Institute sugere que o governo da Austrália deve reduzir sua dependência de combustíveis fósseis importados ao limitar subsídios de diesel para grandes empresas, construir refinarias limpas e direcionar subsídios de veículos elétricos para pessoas com menor renda. Essas ações poderiam economizar milhares de dólares em combustível para os australianos anualmente.", "titulo_pt": "Austrália encorajada a se desligar dos combustíveis fósseis importados diante de choques de suprimento global", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 280559, "titulo": "Ciclone se aproxima do RS após temporal que deixou mortos; SC e PR estão em alerta", "url": "https://exame.com/brasil/ciclone-se-aproxima-do-rs-apos-temporal-que-deixou-mortos-sc-e-pr-estao-em-alerta/", "fonte_id": "exame", "data_pub": "2026-11-22T13:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ciclone se aproxima do Rio Grande do Sul após um temporal que deixou mortos em Santa Catarina e Paraná. O fenômeno deve intensificar as chuvas neste domingo com risco de granizo e ventos acima de 80 km/h, enquanto Tupanciretã ainda registra os danos causados pela tempestade de sexta-feira.", "titulo_pt": "Ciclone se aproxima do RS após temporal com mortes; SC e PR em alerta", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 280564, "titulo": "Álcool adulterado na Índia deixa 16 mortos e quase 600 hospitalizados", "url": "https://exame.com/mundo/alcool-adulterado-na-india-deixa-16-mortos-e-quase-600-hospitalizados/", "fonte_id": "exame", "data_pub": "2026-11-22T12:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Autoridades indianas investigam a origem de bebida adulterada que causou 16 mortes e deixou cerca de 600 pessoas hospitalizadas no nordeste do país. Seis pessoas foram presas por suspeita de envolvimento no fornecimento do produto.", "titulo_pt": "Álcool adulterado na Índia deixa 16 mortos e quase 600 hospitalizados", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 280144, "titulo": "\"Tenemos derecho al agua\": agricultores y trabajadores de rancho se pronuncian sobre los preocupantes niveles del río Colorado", "url": "https://www.clarin.com/estados-unidos/derecho-agua-agricultores-trabajadores-rancho-pronuncian-preocupantes-niveles-rio-colorado_0_PNz4DFMglx.html", "fonte_id": "clarin", "data_pub": "2026-11-22T09:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A falta de neve está deixando sem água uma das maiores regiões agrícolas dos Estados Unidos. Alguns produtores já tiveram que abandonar cultivos e vender gado.", "titulo_pt": "Temos direito à água: agricultores e trabalhadores de rancho se pronunciam sobre os preocupantes níveis do rio Colorado", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 280302, "titulo": "New COP31 draft deal tabled as countries scramble to salvage climate talks", "url": "https://www.euronews.com/2026/11/22/new-cop31-draft-deal-tabled-as-countries-scramble-to-salvage-climate-talks", "fonte_id": "euronews", "data_pub": "2026-11-22T07:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo projeto de acordo foi apresentado, mas ele não mencionou os combustíveis fósseis, que se tornaram um ponto de conflito nas negociações.", "titulo_pt": "Novo projeto de acordo apresentado, mas ignora combustíveis fósseis", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 280368, "titulo": "Fossil fuels still missing from latest COP31 draft deal", "url": "https://www.japantimes.co.jp/environment/2026/11/22/climate-change/cop31-climate-talks/", "fonte_id": "japan_times", "data_pub": "2026-11-22T05:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O último projeto de acordo do COP31 mantém os objetivos globais de eletrificação, mas deixa as tensões relacionadas aos combustíveis fósseis sem resolução.", "titulo_pt": "Combustíveis fósseis ainda ausentes no último projeto de acordo do COP31", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 280375, "titulo": "Nagano farmers are running out of altitude as warming hits key celery crop", "url": "https://www.japantimes.co.jp/environment/2026/11/22/climate-change/celery-harvest-climate-change/", "fonte_id": "japan_times", "data_pub": "2026-11-22T03:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os agricultores no Nagano estão enfrentando dificuldades devido ao aumento da temperatura, pois estão se esgotando de altitudes disponíveis para plantar azevinho, que requer condições mais frescas.", "titulo_pt": "Agricultores do nagano estão se esgotando de altitude devido ao aquecimento global afetando a cultura de azevinho", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 279503, "titulo": "Temperatures could drop to 11°C in low areas: CWA", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/22/2003868168", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A previsão indica que as temperaturas podem baixar para 11°C em áreas baixas. Essa informação foi fornecida pelo CWA (Centro Weather Administration).", "titulo_pt": "Temperaturas podem cair para 11°C em baixas áreas: CWA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 280580, "titulo": "Mexicanos são violentamente arrastados pelo ICE durante embarque nos EUA", "url": "https://www.metropoles.com/mundo/mexicanos-sao-violentemente-arrastados-pelo-ice-durante-embarque-nos-eua", "fonte_id": "metropoles", "data_pub": "2026-11-22T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ICE (Immigration and Customs Enforcement) abordou violentamente mexicanos durante o embarque em um voo com destino a Los Angeles. O governador de Washington criticou a operação e pediu o fim da agência.", "titulo_pt": "Mexicanos são violentamente arrastados pela ICE durante embarque nos EUA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 280941, "titulo": "French activists demand tear gas suspension after reported changes to menstrual cycles", "url": "https://www.scmp.com/news/world/europe/article/3375397/french-activists-demand-tear-gas-suspension-after-reported-changes-menstrual-cycles", "fonte_id": "scmp", "data_pub": "2026-11-22T17:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ativistas e legisladores franceses estão pedindo que autoridades suspendam o uso de gás lacrimogêneo durante protestos após relatos de alterações nos ciclos menstruais e outros pr const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
