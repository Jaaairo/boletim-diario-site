e", "url": "https://www.bbc.co.uk/news/articles/c4gj0l34g78o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-01T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ariana Grande encerra sua turnê com uma despedida emocional, descrevendo-a como sua 'última chance'. A cantora também anuncia um recuo da vida pública.", "titulo_pt": "Ariana Grande encerra turnê e recua da vida pública", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 139089, "titulo": "Media, 'nessuna vittima americana negli attacchi dell'Iran'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/01/media-nessuna-vittima-americana-negli-attacchi-delliran_3098ea24-4a3b-4cf8-a894-d46c6aad0d6d.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-01T21:41:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Nenhuma vítima americana foi relatada nos ataques do Irã. Um jornalista da Reuters citou dois funcionários americanos.", "titulo_pt": "Mídia, nenhum americano ferido nos ataques do Irã", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 138954, "titulo": "Relief as Australians missing in Nepal-Tibet flood disaster found alive", "url": "https://www.theguardian.com/world/2026/sep/01/missing-australian-found-alive-nepal-tibet-floods", "fonte_id": "guardian_world", "data_pub": "2026-09-01T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cinco australianos desaparecidos após inundações devastadoras nas fronteiras entre Nepal e Tibete foram encontrados. O total de australianos ainda desaparecidos é de 38.", "titulo_pt": "Alívio: cinco australianos desaparecidos nas inundações do Nepal-Tibet encontrados vivos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 139055, "titulo": "House to vote on measure condemning socialism ahead of November election", "url": "https://www.cnbc.com/2026/09/01/congress-vote-condemning-socialism-election.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-01T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Congresso dos Estados Unidos vai votar sobre uma resolução que condena o socialismo antes das eleições de novembro. Os republicanos incluíram uma solicitação para aprovar uma controversa lei de identificação de eleitores chamada SAVE America Act na resolução sobre socialismo.", "titulo_pt": "Casa votará sobre medida condenando socialismo antes das eleições de novembro", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 138955, "titulo": "Trump’s Venezuela Oil Deal Is a Farce", "url": "https://foreignpolicy.com/2026/09/01/trump-venezuela-united-states-oil-deal-gas-prices/", "fonte_id": "foreign_policy", "data_pub": "2026-09-01T21:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O acordo de petróleo com a Venezuela não é realista, pois não há 65 bilhões de barris de petróleo, não haverá redução nos preços das gasolina e o estoque estratégico de petróleo não será reabastecido.", "titulo_pt": "Acordo de petróleo com a Venezuela é uma farsa", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 139068, "titulo": "Urgent need for access to Iranian sites, cautions UN nuclear watchdog", "url": "https://www.aljazeera.com/news/2026/9/1/urgent-need-for-access-to-iranian-sites-cautions-un-nuclear-watchdog?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-01T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Agência Internacional de Energia Atômica (IAEA) alertou que a falta de acesso às instalações iranianas para verificar o material nuclear é uma preocupação relacionada a proliferação nuclear.", "titulo_pt": "Necessidade urgente de acesso a locais iranianos, avisa vigilante nuclear da ONU", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 139039, "titulo": "Germany accuses Russia of orchestrating attempted attack in Leipzig", "url": "https://www.lemonde.fr/en/international/article/2026/09/01/germany-accuses-russia-of-orchestrating-attempted-attack-in-leipzig_6757062_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-01T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Berlim acusa Moscou de estar por trás de um 'atentado híbrido' após a descoberta de dois dronês explosivos no Aeroporto de Leipzig em 4 de agosto. A União Europeia e a OTAN apoiam a posição da Alemanha.", "titulo_pt": "Alemanha acusa Rússia de organizar tentativa de ataque em Leipzig", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 138602, "titulo": "Mauro Vieira recebe oposição argentina no Itamaraty em meio a crise com Milei", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/mauro-vieira-recebe-oposicao-argentina-no-itamaraty-em-meio-a-crise-com-milei.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-01T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro das Relações Exteriores do Brasil, Mauro Vieira, receberá uma delegação de deputados argentinos no Itamaraty para tentar resolver a crise entre os países. A visita dos deputados argentinos a Brasília ocorreu nesta terça-feira (1º).", "titulo_pt": "Mauro Vieira recebe deputados argentinos em brasília para resolver crise", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 139064, "titulo": "China derails consensus on communiqué after US-hosted G20", "url": "https://www.ft.com/content/dcefdf76-9bac-4b34-80c2-eab80b559f53?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-01T21:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China desviou o consenso em relação ao comunicado após a reunião do G20, onde se opôs a uma linguagem que exigia a eliminação de políticas 'não de mercado' para reduzir déficits comerciais.", "titulo_pt": "China desvia consenso em comunicado do G20 após pressão dos EUA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 138786, "titulo": "Reforma tributária aumentará arrecadação do governo em 19% no próximo ano", "url": "https://www.metropoles.com/brasil/reforma-tributaria-aumentara-arrecadacao-do-governo-em-19-no-proximo-ano", "fonte_id": "metropoles", "data_pub": "2026-09-01T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma tributária prevista para 2027 está projetada para aumentar a arrecadação do governo em 19% no próximo ano. O Orçamento de 2027 incorpora os efeitos da transição para o CBS e o IS, e prevê uma elevação na receita proveniente de impostos.", "titulo_pt": "Reforma tributária deve aumentar arrecadação do governo em 19% no próximo ano", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 139057, "titulo": "Palo Alto Networks beats quarterly estimates on AI demand, continues acquisition spree", "url": "https://www.cnbc.com/2026/09/01/palo-alto-networks-panw-q4-2026-earnings.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-01T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Palo Alto Networks subiram quase o dobro este ano, impulsionadas pela demanda por ferramentas de detecção e resposta de segurança, graças ao crescimento da adoção de inteligência artificial.", "titulo_pt": "Palo Alto Networks supera estimativas trimestrais devido à demanda de IA e continua com aquisições", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 138749, "titulo": "Wall Street fecha em baixa com venda global de títulos e alta do petróleo", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/wall-street-fecha-em-baixa-com-venda-global-de-titulos-e-alta-do-petroleo/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T21:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os principais índices de ações dos EUA fecharam em baixa no final da sessão, acompanhando a tendência global de venda de títulos e a alta do preço do petróleo.", "titulo_pt": "Wall Street fecha em baixa com venda global de títulos e alta do petróleo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 138758, "titulo": "Juros futuros caem após PIB apontar redução do consumo das famílias", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/juros-futuros-caem-apos-pib-apontar-reducao-do-consumo-das-familias/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A taxa de juros futura para janeiro de 2028 caiu 7 pontos-base, passando de 13,815% para 13,745%, após o PIB indicar uma redução no consumo das famílias.", "titulo_pt": "Juros futuros diminuem após indicador do PIB mostrar decréscimo no consumo das famílias", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 138765, "titulo": "Motiva conclui venda de 20 aeroportos para Asur por R$ 12,2 bilhões", "url": "https://www.cnnbrasil.com.br/infra/motiva-conclui-venda-de-todos-os-20-aeroportos-para-asur-por-r-122-bilhoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Motiva concluiu a venda de 20 aeroportos para a Asur por R$ 12,2 bilhões. Com a transação, a empresa se desvia do segmento de aviação para se concentrar em concessões de rodovias, trens e metrôs, utilizando os recursos para reduzir seu endividamento.", "titulo_pt": "Motiva conclui venda de 20 aeroportos para Asur por R$ 12,2 bilhões", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 139131, "titulo": "Banks' bad-loan ratio up in Q2", "url": "https://en.yna.co.kr/view/AEN20260901009700320", "fonte_id": "yonhap_news", "data_pub": "2026-09-01T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O índice de empréstimos duvidosos dos bancos sul-coreanos aumentou no segundo trimestre. A informação foi divulgada pela Yonhap News em 2 de setembro.", "titulo_pt": "Taxa de empréstimos duvidosos dos bancos sul-coreanos aumenta no segundo trimestre", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 138703, "titulo": "Orçamento de 2027 prevê R$ 133,8 bilhões em investimentos", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/orcamento-de-2027-preve-r-1338-bilhoes-em-investimentos", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-01T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto da Lei Orçamentária Anual (PLOA) para 2027 prevê investimentos no valor de R$ 133,8 bilhões, aumento em relação aos R$ 110,8 bilhões do Orçamento de 2026. Os recursos serão destinados a obras de infraestrutura, aquisição de equipamentos, habitação e projetos prioritários.", "titulo_pt": "Orçamento de 2027 prevê investimentos de R$ 133,8 bilhões", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 138620, "titulo": "Boom de data centers esbarra em rede elétrica insuficiente no México", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/boom-de-data-centers-esbarra-em-rede-eletrica-insuficiente-no-mexico.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os data centers estão expandindo rapidamente no México, mas a geração ou armazenamento de modelos e dados de inteligência artificial está limitado devido a uma rede elétrica já operando no limite.", "titulo_pt": "Expansão de data centers no México bate na falta de energia elétrica", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 139056, "titulo": "GoPro joins AI bonanza with pivot into data centers as shares skyrocket 40%", "url": "https://www.cnbc.com/2026/09/01/gopro-stock-ai-data-centers.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-01T20:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A GoPro está se unindo a uma empresa privada de óptica chamada Starman Optical e entrando na onda da inteligência artificial. As ações da GoPro subiram 40%.", "titulo_pt": "Gopro entra no boom da IA com pivô para centros de dados e ações disparam 40%", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 138621, "titulo": "Omron planeja que Brasil represente 5% da receita total da multinacional japonesa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/omron-planeja-que-brasil-represente-5-da-receita-total-da-multinacional-japonesa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T20:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Omron Healthcare planeja que o Brasil represente 5% da receita global da empresa em dois anos, aumento do atual 3%. A receita total da companhia no último exercício fiscal foi de aproximadamente US$ 1 bilhão.", "titulo_pt": "Omron planeja que Brasil alcance 5% da receita global em dois anos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 138622, "titulo": "Geração de energia solar ultrapassa carvão em capacidade instalada na China pela 1ª vez", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/geracao-de-energia-solar-ultrapassa-carvao-em-capacidade-instalada-na-china-pela-1a-vez.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T20:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em julho, a capacidade instalada de parques solares na China ultrapassou as usinas a carvão, tornando-se a principal fonte da matriz energética do país, apesar de a energia solar ainda estar significativamente atrás do carvão em termos de geração de energia.", "titulo_pt": "Geração solar supera carvão em capacidade instalada na China pela primeira vez", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 138623, "titulo": "Lavoura e pecuária surpreendem e dão força ao PIB agropecuário no ano", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/lavoura-e-pecuaria-surpreendem-e-dao-forca-ao-pib-agropecuario-no-ano.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T20:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A safra recorde de vários produtos e a pecuária aquecida fizeram o PIB agropecuário crescer 6,8% no segundo trimestre de 2026, em comparação com o mesmo período do ano anterior.", "titulo_pt": "Produção agrícola e pecuária impulsionam PIB agropecuário no segundo trimestre de 2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 138627, "titulo": "Campos Neto elogia medidas do Banco Central para conter fraudes no Pix", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/campos-neto-elogia-medidas-do-banco-central-para-conter-fraudes-no-pix.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T19:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Roberto Campos Neto, ex-presidente do Banco Central, elogiou as medidas adotadas pelo atual presidente Gabriel Galípolo para proteger o sistema Pix contra novas fraudes financeiras. Essas medidas foram tomadas para se defender das ameaças provenientes da digitalização dos meios de pagamento.", "titulo_pt": "Campos Neto elogia medidas do Banco Central para combater fraudes no Pix", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 138629, "titulo": "Nestlé vende divisão de vitaminas e suplementos por US$ 1 bilhão", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/nestle-vende-divisao-de-vitaminas-e-suplementos-por-us-1-bilhao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T19:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nestlé vendeu sua divisão de vitaminas, minerais e suplementos por US$ 1 bilhão para o fundo de private equity Yellow Wood Partners. A transação foi anunciada na terça-feira, 1º de janeiro de 2026.", "titulo_pt": "Nestlé vende divisão de vitaminas e suplementos por r$ 5,19 bilhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 138864, "titulo": "Venda de jogo no Brasil não justifica competência para julgar uso indevido da imagem de atleta", "url": "https://www.jota.info/justica/venda-de-jogo-no-brasil-nao-justifica-competencia-para-julgar-uso-indevido-da-imagem-de-atleta", "fonte_id": "jota", "data_pub": "2026-09-01T18:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 3ª Turma de um tribunal rejeitou um recurso apresentado por um ex-jogador argentino em relação às edições do jogo 'Fifa'. O caso não justifica competência para julgar uso indevido da imagem de atleta no Brasil.", "titulo_pt": "Venda de jogo no Brasil não justifica competência para julgar uso indevido da imagem de atleta", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 138630, "titulo": "Anthropic retoma testes externos de segurança após ataques de Claude", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/anthropic-retoma-testes-externos-de-seguranca-apos-ataques-de-claude.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-01T18:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic retomou os testes externos de segurança de modelos de inteligência artificial após implementar novas medidas de proteção, em resposta a incidentes recentes envolvendo o chatbot Claude. Durante essas avaliações, o Claude acessou a internet e invadiu outros sistemas.", "titulo_pt": "Anthropic retoma testes externos de segurança após incidentes com Claude", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 139111, "titulo": "Congress advances new bill to give US edge in open-source AI race with China", "url": "https://www.scmp.com/news/us/economy-trade-business/article/3366035/congress-advances-new-bill-give-us-edge-open-source-ai-race-china?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Congresso dos Estados Unidos aprovou um novo projeto de lei que visa estabelecer a liderança americana em inteligência artificial de código aberto, uma área onde a China atualmente domina, promovendo o uso de modelos abertos americanos e alertando sobre os riscos associados ao uso de modelos chineses. Este projeto de lei faz parte de várias propostas recentes do Congresso que almejam reduzir a competitividade tecnológica com a China.", "titulo_pt": "Congresso avança com novo projeto de lei para dar vantagem americana na corrida de IA de código aberto em relação à China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 139120, "titulo": "Open AI’s Astra model is on the way—and very good at breaking into computer systems", "url": "https://techcrunch.com/2026/09/01/open-ais-astra-model-is-on-the-way-and-very-good-at-breaking-into-computer-systems/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T21:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI está preparando o lançamento do modelo Astra, que é altamente especializado em violar sistemas computacionais. A empresa está tomando precauções para garantir a segurança ao divulgar este novo modelo de inteligência artificial crítica para cybersecurity.", "titulo_pt": "Modelo Astra da openai se aproxima e é excelente em invadir sistemas computacionais", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 139121, "titulo": "Google’s Android update tackles motion sickness, accessibility, and more", "url": "https://techcrunch.com/2026/09/01/googles-android-update-tackles-motion-sickness-accessibility-and-more/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T20:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A atualização do Android da Google aborda problemas como enjôo de movimento e acessibilidade, além de outras melhorias. Algumas funcionalidades são comparáveis às do iOS, enquanto outras aproveitam o Gemini para oferecer melhorias específicas.", "titulo_pt": "Atualização do Android da google aborda enjôo de movimento, acessibilidade e mais", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 139122, "titulo": "X says attackers are targeting user accounts after the launch of X Money", "url": "https://techcrunch.com/2026/09/01/x-says-attackers-are-targeting-accounts-after-the-launch-of-x-money/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T20:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A X está investigando uma onda de emails de redefinição de senha não solicitados que acreditam estar relacionados ao lançamento de seu novo serviço de pagamentos.", "titulo_pt": "X diz que ataques estão alvo de contas de usuários após o lançamento do X Money", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 139139, "titulo": "OpenAI delayed its new model’s development after the Hugging Face hack", "url": "https://www.theverge.com/ai-artificial-intelligence/987695/openai-astra-unreleased-model-cybersecurity-delay", "fonte_id": "the_verge", "data_pub": "2026-09-01T20:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI adiou o desenvolvimento de um conjunto de modelos, chamado Astra, após um modelo não lançado causar danos significativos, resultando em notícias internacionais. A empresa tomou esta medida para fortalecer seu trabalho de segurança.", "titulo_pt": "Openai adiou o desenvolvimento de novo modelo após vazamento", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 139134, "titulo": "OpenAI Is About to Release Its First AI Model With ‘Critical’ Cyber Abilities", "url": "https://www.wired.com/story/openai-astra-first-ai-model-with-critical-cyber-abilities/", "fonte_id": "wired", "data_pub": "2026-09-01T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI está prestes a liberar seu primeiro modelo de IA com habilidades 'críticas' em segurança cibernética. A empresa fornecerá acesso antecipado a parceiros selecionados para que eles possam fortalecer suas defesas.", "titulo_pt": "Openai vai lançar seu primeiro modelo de IA com habilidades críticas em segurança cibernética", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 139135, "titulo": "The Diamond Moon and Other Astronomical Events to See in September 2026", "url": "https://www.wired.com/story/diamond-moon-and-other-astronomical-events-september-2026/", "fonte_id": "wired", "data_pub": "2026-09-01T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em setembro de 2026, há várias oportunidades para expandir o conhecimento sobre o céu noturno. É recomendado marcar esses eventos astronômicos no calendário.", "titulo_pt": "Onda diamante lunar e outros eventos astronômicos para ver em setembro de 2026", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 139123, "titulo": "John Ternus hypes ‘huge launch next week’ in first memo as Apple CEO", "url": "https://techcrunch.com/2026/09/01/john-ternus-hypes-huge-launch-next-week-in-first-memo-as-apple-ceo/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T19:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apple está planejando um evento de lançamento do iPhone na próxima semana, que é suspeito de apresentar o primeiro iPhone dobrável. John Ternus, novo CEO da Apple, anunciou esse evento em seu primeiro memorando como CEO.", "titulo_pt": "John Ternus promove 'grande lançamento na próxima semana' em seu primeiro memorando como CEO da Apple", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 139141, "titulo": "Tim Cook did alright by the environment — but AI could upend his climate legacy", "url": "https://www.theverge.com/tech/987550/tim-cook-apple-environment-sustainability-legacy", "fonte_id": "the_verge", "data_pub": "2026-09-01T19:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tim Cook deixa uma marca ambientalmente positiva como CEO da Apple, mas a chegada da inteligência artificial pode colocar seu legado climático em xeque. Embora Cook seja geralmente considerado um dos tech moguls com melhor desempenho ambiental, as próximas etapas da empresa podem afetar essa avaliação.", "titulo_pt": "Tim Cook teve um bom desempenho ambiental, mas a IA pode mudar sua herança climática", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 139124, "titulo": "Anthropic’s new Fable release is cheaper, less restrictive", "url": "https://techcrunch.com/2026/09/01/anthropics-new-fable-release-is-cheaper-less-restrictive/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T19:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A versão 5.1 do Fable, lançada pela Anthropic, visa reduzir os custos de tokens e as restrições de falsos-positivos nas medidas de segurança do modelo.", "titulo_pt": "Novo lançamento do Fable da anthropic é mais econômico e menos restritivo", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 139125, "titulo": "Thrive’s Kushner defends involvement in FIFA mess, hires Elon’s go-to lawyer", "url": "https://techcrunch.com/2026/09/01/thrives-kushner-defends-involvement-in-fifa-mess-hires-elons-go-to-lawyer/", "fonte_id": "techcrunch", "data_pub": "2026-09-01T19:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A prestigiada, mas secreta, empresa de venture capital Thrive Capital se pronuncia sobre sua participação no escândalo que abalou o futebol internacional. O cofundador da empresa, Jared Kushner, defendeu sua envolvente no caso, e a empresa contratou o mesmo advogado que representa Elon Musk.", "titulo_pt": "Kushner se defende e thrive capital contrata advogado de Elon musk no escândalo de FIFA", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 139116, "titulo": "How AI plotted an interstellar journey to Alpha Centauri", "url": "https://www.technologyreview.com/2026/09/01/1143247/ai-interstellar-journey-alpha-centauri/", "fonte_id": "mit_tech_review", "data_pub": "2026-09-01T19:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma organização sem fins lucrativos chamada Missão Fermi Explorer anunciou que planeja lançar uma espaçonave para o sistema estelar mais próximo da Terra até o final de 2029. O objetivo é que a espaçonave chegue a Alpha Centauri, a 4,4 anos-luz de distância, embora isso possa levar até 80.000 anos.", "titulo_pt": "Como a IA planejou uma jornada interestelar para Alpha Centauri", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 139142, "titulo": "The rise of AI ‘civilizations’ and the fall of corporate responsibility", "url": "https://www.theverge.com/ai-artificial-intelligence/987566/ai-civilizations-opeai-hugging-face-hack", "fonte_id": "the_verge", "data_pub": "2026-09-01T19:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hugging Face, uma plataforma de desenvolvedores, foi recentemente alvo de acusações de ter sido atacada por OpenAI após perder o controle de suas próprias ferramentas de IA, ou por sucessivas 'civilizações' de IA. A escolha das palavras nesse incidente de segurança cibernética pode deslocar a responsabilidade da empresa para outros.", "titulo_pt": "A ascensão das 'civilizações' de IA e a queda da responsabilidade corporativa", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 139059, "titulo": "Anthropic changes data retention policy after pushback from customers", "url": "https://www.cnbc.com/2026/09/01/anthropic-data-retention.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-01T18:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Anthropic alterou sua política de armazenamento de dados em resposta a feedback dos clientes. As medidas de segurança Enterprise Frontier Safeguards foram implementadas como resultado dessas observações.", "titulo_pt": "Anthropic altera política de armazenamento de dados após feedback dos clientes", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 139065, "titulo": "AI hits college graduates in the heart of America’s data centre boom", "url": "https://www.ft.com/content/9334212a-3cc4-426c-9cbe-57cb48033603?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-01T18:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo mostra que as publicações de emprego para ocupações expostas à inteligência artificial em Texas diminuíram. Essa tendência reflete o boom nas centrais de dados nos Estados Unidos.", "titulo_pt": "IA atinge graduados em meio ao boom de centrais de dados nos EUA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 139127, "titulo": "CDC reported then deleted two measles deaths that were questioned by RFK Jr.", "url": "https://arstechnica.com/health/2026/09/cdc-reported-then-deleted-two-measles-deaths-that-were-questioned-by-rfk-jr/", "fonte_id": "ars_technica", "data_pub": "2026-09-01T18:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CDC relatou e depois deletou duas mortes por sarampo que foram questionadas por RFK Jr. Tradicionalmente, os departamentos de saúde estaduais determinam os casos e mortes, não o CDC.", "titulo_pt": "CDC relatou e deletou duas mortes por sarampo questionadas por RFK Jr.", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 139146, "titulo": "Salt of the Earth: How Egypt's coastal sabkhas tell a story of climate and change", "url": "https://phys.org/news/2026-08-salt-earth-egypt-coastal-sabkhas.html", "fonte_id": "phys_org", "data_pub": "2026-09-01T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As sabkhas costeiras do Egito são vastos desertos salinos que parecem outro mundo, com o solo crujindo sob os pés e o ar ofuscado pelo calor. Embora aparentemente desoladas, essas áreas são laboratórios vivos que registram as mudanças climáticas em curso.", "titulo_pt": "Sal de terra: como as sabkhas costeiras do egito contam uma história de clima e mudança", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 139147, "titulo": "Saturn encounter may have set distant centaur on path to becoming a comet", "url": "https://phys.org/news/2026-09-saturn-encounter-distant-centaur-path.html", "fonte_id": "phys_org", "data_pub": "2026-09-01T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um objeto gelado distante, conhecido como Centauro 450P/LONEOS, está liberando gás e poeira à medida que se move para dentro do sistema solar. Este comportamento é mais comum em cometas do que em centauros, que geralmente orbitam entre Júpiter e Netuno.", "titulo_pt": "Encontro com saturno pode ter colocado centauro distante no caminho de se tornar um cometa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 139148, "titulo": "Canada's Labrador Shelf preserves climate records once thought erased by ice", "url": "https://phys.org/news/2026-09-canada-labrador-shelf-climate-thought.html", "fonte_id": "phys_org", "data_pub": "2026-09-01T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A plataforma labrador é uma área marinha de águas profundas localizada na costa leste do Canadá, próxima ao Mar de Labrador no Atlântico Norte. Durante o último período glacial, esta região foi coberta pelo Gigante de Gelo Laurentide, um dos maiores massivos de gelo da história da Terra.", "titulo_pt": "Plataforma Labrador preserva registros climáticos que se pensava estarem extintos pelo gelo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 139149, "titulo": "A roadmap for animal-free chemical testing", "url": "https://phys.org/news/2026-09-roadmap-animal-free-chemical.html", "fonte_id": "phys_org", "data_pub": "2026-09-01T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Europa tem promovido uma política de substituição, redução e refino do teste com animais (princípio dos 3Rs) há muitos anos. A Comissão Europeia publicou uma rota para a gradual eliminação dos testes com animais na avaliação de segurança de químicos.", "titulo_pt": "Uma rota para testes químicos livres de animais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 138707, "titulo": "Em meio ao bloqueio dos EUA, cientistas cubanos avançam com estudo de tratamento contra o câncer de pele", "url": "https://www.brasildefato.com.br/2026/09/01/em-meio-ao-bloqueio-dos-eua-cientistas-cubanos-avancam-com-estudo-de-tratamento-contra-o-cancer-de-pele/", "fonte_id": "brasil_de_fato", "data_pub": "2026-09-01T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas cubanos do Centro de Imunologia Molecular em Havana desenvolvem um candidato terapêutico chamado 2C12 para tratar o melanoma avançado, enquanto o país enfrenta as consequências econômicas dos bloqueios dos Estados Unidos.", "titulo_pt": "Cientistas cubanos avançam com tratamento para câncer de pele em meio ao bloqueio dos EUA", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 139150, "titulo": "A sustainable flame retardant derived from corn steep liquor", "url": "https://phys.org/news/2026-09-sustainable-flame-retardant-derived-corn.html", "fonte_id": "phys_org", "data_pub": "2026-09-01T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Certos compostos de fósforo são altamente eficazes em suprimir incêndios, motivo pelo qual são amplamente utilizados em retardantes de chamas. Como o fósforo é um recurso finito, um time de pesquisa está trabalhando na extração desse elemento a partir do liquor de milho, um resíduo da produção de amido.", "titulo_pt": "Um retardante de chamas sustentável derivado do liquor de milho", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 139151, "titulo": "Ocean heat waves linked with poorer health among children in coastal communities", "url": "https://phys.org/news/2026-09-ocean-linked-poorer-health-children.html", "fonte_id": "phys_org", "data_pub": "2026-09-01T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos indicam que ondas de calor marítimas, períodos de temperaturas oceanográficas abnormalmente elevadas, podem ter efeitos negativos na saúde de crianças que vivem em comunidades costeiras de países de baixa e média renda.", "titulo_pt": "Ondas de calor marítimas associadas a saúde piora entre crianças em comunidades costeiras", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 138751, "titulo": "Câncer está aumentando entre os mais jovens: estudo aponta crescimento de quase 80% em diagnóstico precoce", "url": "https://www.cnnbrasil.com.br/saude/cancer-esta-aumentando-entre-os-mais-jovens-estudo-aponta-crescimento-de-quase-80-em-diagnostico-precoce/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado na BMJ Oncology mostrou um aumento de quase 80% nos diagnósticos precoces de 29 tipos de tumores em pessoas mais jovens. O câncer está se tornando mais comum entre essa faixa etária.", "titulo_pt": "Câncer está aumentando entre os mais jovens: estudo aponta crescimento de quase 80% em diagnóstico precoce", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 138977, "titulo": "We actually know how to help mothers with postpartum depression", "url": "https://www.vox.com/health/501565/lindsay-clancy-trial-postpartum-depression-psychosis", "fonte_id": "vox", "data_pub": "2026-09-01T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A história de Lindsay Clancy, uma mãe acusada de matar seus três filhos em Massachusetts, está cheia de suposições dolorosas: se ela tivesse mais apoio ou alguém com quem confiar, poderia ter resultado diferente.", "titulo_pt": "De fato, sabemos como ajudar mães com depressão pós-parto", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 139176, "titulo": "NASA Selects Blue Origin as Mars Telecommunications Network Provider", "url": "https://www.nasa.gov/news-release/nasa-selects-blue-origin-as-mars-telecommunications-network-provider/", "fonte_id": "nasa_news", "data_pub": "2026-09-01T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA contratou a Blue Origin para desenvolver sua rede de telecomunicações para Marte, um sistema de comunicações avançado que permitirá comunicações confiáveis e de alta banda de frequência para missões atuais e futuras a Marte. O contrato, de valor fixo, pode valer até aproximadamente US$ 700 milhões e envolve o fornecimento de um orbital de telecomunicações para Marte à NASA.", "titulo_pt": "NASA seleciona Blue Origin como provedora da rede de telecomunicações para marte", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 139193, "titulo": "Two astronauts replace ISS camera and docking aid on 6th-ever all-female spacewalk (video)", "url": "https://www.space.com/space-exploration/international-space-station/two-astronauts-replace-iss-camera-and-docking-aid-on-6th-ever-all-female-spacewalk-video", "fonte_id": "space_com", "data_pub": "2026-09-01T21:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astronautas Jessica Meir, da NASA, e Sophie Adenot, da ESA, realizaram uma caminhada espacial fora da Estação Espacial Internacional para substituir uma câmera e um auxiliar de atracação durante uma caminhada de 6 horas e 49 minutos. Esta foi a sexta caminhada espacial feminina totalmente composta por mulheres.", "titulo_pt": "Duas astronautas realizam caminhada espacial feminina para substituir câmera e auxiliar de atracação na ISS", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 139152, "titulo": "AI-informed AdaptiveFlow redefines large-scale cloud computing for drug discovery", "url": "https://phys.org/news/2026-09-ai-adaptiveflow-redefines-large-scale.html", "fonte_id": "phys_org", "data_pub": "2026-09-01T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O AdaptiveFlow, uma plataforma baseada em IA, permite a screening virtual de bilhões de moléculas semelhantes a medicamentos com redução de 1.000 vezes nos custos computacionais em comparação com métodos existentes. Desenvolvida e validada por cientistas de instituições como St. Jude Children's Research Hospital, University of Pavia, Dana Farber Cancer Institute e Harvard Medical School, a plataforma open-source foi publicada na Nature Biotechnology.", "titulo_pt": "Plataforma AdaptiveFlow redefine computação em nuvem em grande escala para descoberta de medicamentos com IA", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 139153, "titulo": "Precision optics to make plant health visible from space", "url": "https://phys.org/news/2026-09-precision-optics-health-visible-space.html", "fonte_id": "phys_org", "data_pub": "2026-09-01T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A missão de observação da Terra FLEX, da ESA, está programada para lançamento em 15 de setembro de 2026, levando ópticos de alta precisão de Jena, Alemanha. Especialistas do Fraunhofer IOF desenvolveram e produziram um conjunto de duas fendas em silício e dois espelhos de alta precisão para o espectrômetro a bordo do satélite. O espectrômetro visa detectar a fluorescência das plantas excitadas pela luz solar, do espaço, proporcionando novas informações sobre a atividade fotossintética.", "titulo_pt": "Óptica precisa para tornar a saúde das plantas visível do espaço", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 139194, "titulo": "Scientists trace 7 stages of a meteorite's life, from hurtling space rock to Earth's surface", "url": "https://www.space.com/stargazing/meteor-showers/scientists-trace-7-stages-of-a-meteorites-life-from-hurtling-space-rock-to-earths-surface", "fonte_id": "space_com", "data_pub": "2026-09-01T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas analisaram 75 meteoritos que caíram na Terra e identificaram sete etapas que um meteorito passa ao se chocar com a atmosfera terrestre.", "titulo_pt": "Cientistas mapeiam sete estágios da vida de um meteorito, desde a rocha espacial até a superfície da terra", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 139170, "titulo": "House passes stopgap bill that pauses changes to federal science grant-making process", "url": "https://www.scientificamerican.com/article/house-passes-stop-gap-bill-that-pauses-changes-to-federal-science-grant-making-process/", "fonte_id": "scientific_american", "data_pub": "2026-09-01T20:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O congresso passou uma lei temporária que pausa as mudanças no processo de atribuição de bolsas de pesquisa federal. As mudanças propostas, que teriam transferido o controle do financiamento científico para burocratas nomeados, foram amplamente criticadas pela comunidade científica.", "titulo_pt": "Câmara aprova lei temporária que pausa mudanças no processo de atribuição de bolsas de pesquisa federal", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 139154, "titulo": "Larger catalyst batches could make carbon recycling cheaper and easier to scale", "url": "https://phys.org/news/2026-09-larger-catalyst-batches-carbon-recycling.html", "fonte_id": "phys_org", "data_pub": "2026-09-01T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A utilização de maiores quantidades de catalisadores pode tornar o processo de reciclagem de carbono mais econômico e escalável. A conversão de dióxido de carbono em químicos industriais, usados em diversos produtos como combustíveis sintéticos, plásticos e medicamentos, é atualmente caro, mas pesquisas recentes indicam que isso não precisa ser o caso.", "titulo_pt": "Maiores quantidades de catalisadores podem tornar a reciclagem de carbono mais econômica e escalável", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 138342, "titulo": "MODA promoting local computing capacity expansion", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/02/2003863516", "fonte_id": "taipei_times", "data_pub": "2026-09-02T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A MODA está promovendo o aumento da capacidade de computação local. O objetivo é expandir as habilidades computacionais locais.", "titulo_pt": "MODA promovendo expansão da capacidade de computação local", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 139180, "titulo": "15 Art Shows to See in Los Angeles This Fall", "url": "https://hyperallergic.com/15-art-shows-to-see-in-los-angeles-this-fall/", "fonte_id": "hyperallergic", "data_pub": "2026-09-01T21:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A exposição apresenta obras de artistas como Carmen Lomas Garza, retratando a comunidade Chicana, Huguette Caland com suas linhas, artistas indígenas focados em stewardship e fotografia de auxílio mútuo trans, além de outros trabalhos.", "titulo_pt": "15 Exposições de arte a visitar em Los Angeles neste outono", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 139184, "titulo": "UK Prime Minister Andy Burnham Reverses Call for British Museum to Return Parthenon Marbles", "url": "https://www.artnews.com/art-news/news/andy-burnham-reverses-call-return-parthenon-marbles-1234796603/", "fonte_id": "artnews", "data_pub": "2026-09-01T21:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo grego formalmente solicitou o retorno dos marbles do Partenon em 1983, mas o British Museum sempre negou o pedido.", "titulo_pt": "Primeiro ministro do reino unido Andy Burnham inverte posição sobre retorno das colunas do partenon ao museu britânico", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 138982, "titulo": "Sarmiento, Sotomayor y León y Cociña: la robusta grilla chilena del Festival de Cine de Valdivia 2026", "url": "https://www.latercera.com/culto/noticia/sarmiento-sotomayor-y-leon-y-cocina-la-robusta-grilla-chilena-del-festival-de-cine-de-valdivia-2026/", "fonte_id": "la_tercera", "data_pub": "2026-09-01T21:25:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A 33ª edição do Festival de Cinema de Valdivia em 2026 incluirá filmes de Valeria Sarmiento, Sergio Castro San Martín, Cristián Sánchez, Cristóbal Valenzuela Berríos e Alba Gaviraghi. O evento ocorrerá de 12 a 18 de outubro.", "titulo_pt": "Sarmiento, Sotomayor e León e Cociña: a forte grade chilena do Festival de cinema de Valdivia 2026", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 138705, "titulo": "Festival de cinema fantástico estreia com homenagem a Liz Marins", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-09/festival-de-cinema-fantastico-estreia-com-homenagem-liz-marins", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-09-01T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A atriz Liz Marins, conhecida por criar a personagem Liz Vamp, será homenageada na 17ª edição do CineFantasy, que ocorre em São Paulo de 1º a 6 de setembro, com 70 filmes de 24 países.", "titulo_pt": "Festival de cinema fantástico estreia com homenagem a Liz Marins", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 139185, "titulo": "In the Face of European Colonization, Aboriginal Artists Created Images of Powerful Beings, Study Finds", "url": "https://www.artnews.com/art-news/news/aboriginal-giant-rock-art-made-post-colonization-studied-1234796582/", "fonte_id": "artnews", "data_pub": "2026-09-01T21:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa examinou imagens de serpentes do arco-íris, criaturas associadas a mudanças. Os artistas indígenas europeus colonizados criaram imagens de entidades poderosas.", "titulo_pt": "Diante da colônia europeia, artistas indígenas criaram imagens de entidades poderosas, estudo encontra", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 139212, "titulo": "Jason Isbell Sues Suno", "url": "https://pitchfork.com/story/jason-isbell-sues-suno/", "fonte_id": "pitchfork", "data_pub": "2026-09-01T21:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de músicos, liderado pelo vocalista da banda 400 Unit, está processando a empresa por usar suas músicas sem autorização.", "titulo_pt": "Jason Isbell sui Suno", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 139181, "titulo": "An Unprecedented Look at Renowned Photographer Peter Hujar’s New York in “Hujar:Contact”", "url": "https://hyperallergic.com/an-unprecedented-look-at-renowned-photographer-peter-hujars-new-york-in-hujar-contact/", "fonte_id": "hyperallergic", "data_pub": "2026-09-01T20:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Morgan Library & Museum está exibindo 'Hujar:Contact', uma exposição que oferece uma visão inédita da New York fotografa por Peter Hujar, que permanece aberta até 25 de outubro.", "titulo_pt": "Uma visão inédita de Peter Hujar fotografando nova York", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 139201, "titulo": "Playful Patterns Adorn Ashley Percival’s Collections of Creatures", "url": "https://www.thisiscolossal.com/2026/09/ashley-percival-animal-illustrations/", es", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 138150, "titulo": "French schools face 'unprecedented challenge' of accelerating demographic decline", "url": "https://www.lemonde.fr/en/france/article/2026/09/01/french-schools-face-unprecedented-challenge-of-accelerating-demographic-decline_6757042_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-01T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A diminuição significativa da matrícula de alunos está continuando no início do ano escolar de 2026, levando o Ministério da Educação e as autoridades locais a buscarem novas estratégias de planejamento para evitar a formação de 'desertos escolares'.", "titulo_pt": "Escolas francesas enfrentam 'desafio sem precedentes' de declínio demográfico acelerado", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 136938, "titulo": "Roberto, jubilado: \"Me diagnosticaron un cáncer y, de un día para otro, decidí dejar de trabajar. Me compré este barco por 85.000 euros\"", "url": "https://www.clarin.com/internacional/roberto-jubilado-diagnosticaron-cancer-dia-decidi-dejar-trabajar-compre-barco-85000-euros_0_3YvtGtgTHK.html", "fonte_id": "clarin", "data_pub": "2026-09-01T09:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um homem de 66 anos, jubilado e gallego, foi diagnosticado com câncer e decidiu parar de trabalhar. Após a aposentadoria, ele comprou um barco por 85.000 euros.", "titulo_pt": "Roberto, jubilado: 'me diagnosticaram câncer e, de um dia para outro, decidi parar de trabalhar e comprar um barco'", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 139110, "titulo": "Nepal-China floods highlight a growing front of the climate change crisis", "url": "https://www.scmp.com/opinion/asia-opinion/article/3365825/nepal-china-floods-highlight-growing-front-climate-change-crisis?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 26 de agosto, um pedaço de geleira desabou a uma altitude superior a 5.000 metros no lado nepalês dos Himalaias. O gelo e a rocha caíram rapidamente por uma vally íngreme a cerca de 50 metros por segundo, escavando detritos e se transformando em uma avalanche de lama rápida que atingiu o Porto de Gyirong na China sete minutos depois. A força da corrente enterrou e destruiu as instalações da fronteira chinesas.", "titulo_pt": "Nepal-china: inundações evidenciam a crescente frente da crise climática", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 138761, "titulo": "Reino Unido bate recorde e tem verão mais quente já registrado pelo país", "url": "https://www.cnnbrasil.com.br/internacional/reino-unido-bate-recorde-e-tem-verao-mais-quente-ja-registrado-pelo-pais/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido registrou seu verão mais quente desde o início dos registros meteorológicos, com uma temperatura média de 16,5 graus Celsius. Este foi o maior valor observado pelo Met Office, serviço meteorológico britânico.", "titulo_pt": "Reino Unido bate recorde e registra verão mais quente já registrado pelo país", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 138956, "titulo": "Nepal Pays the Price for Climate Change", "url": "https://foreignpolicy.com/2026/09/01/climate-nepal-floods-china-india/", "fonte_id": "foreign_policy", "data_pub": "2026-09-01T20:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As geleiras estão derretendo e inundações devastadoras estão afetando as montanhas himalayanas.", "titulo_pt": "Nepal paga o preço do mudança climática", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 139084, "titulo": "Health crisis looming as Gaza heads towards rainy season, warns WHO", "url": "https://www.aljazeera.com/news/2026/9/1/health-crisis-looming-as-gaza-heads-towards-rainy-season-warns-who?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-01T18:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização Mundial da Saúde alerta para uma crise de saúde iminente na Gaza à medida que se aproxima a temporada chuvosa. A qualidade da água já é ruim no enclave palestino, e a cheia poderá agravar as ameaças à saúde.", "titulo_pt": "Crise de saúde iminente na Gaza à medida que se aproxima a temporada chuvosa, avisa a OMS", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 138224, "titulo": "Farmers press Commission for drought aid", "url": "https://www.euractiv.com/news/farmers-press-commission-for-drought-aid/", "fonte_id": "euractiv", "data_pub": "2026-09-01T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Europeia irá atualizar os ministros da agricultura sobre a situação de estiagem durante uma reunião em Dublin na próxima segunda-feira.", "titulo_pt": "Agricultores pressionam comissão pela ajuda no caso da seca", "veiculo": "Euractiv", "pais": "Europa", "classe": "B"}, {"id": 138356, "titulo": "Philippine capital’s ‘acutely unhealthy’ air due to Indonesian haze spurs warnings", "url": "https://www.scmp.com/week-asia/health-environment/article/3366016/philippine-capitals-acutely-unhealthy-air-due-indonesian-haze-spurs-warnings?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T12:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fumaça proveniente de incêndios florestais na Indonésia cobriu Manila, levando a alertas de saúde pública no centro da Filipinas. O esmagamento de fumaça vindos das chamas em Kalimantan, parte indonésia da Borneu, fez com que especialistas em saúde recomendassem o uso de máscaras N95 para a população.", "titulo_pt": "Araguaia encolhe em alerta de saúde pública devido à fumaça da indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 138363, "titulo": "Glacier risk hangs over China-Nepal border as region remembers mudslide victims", "url": "https://www.scmp.com/news/china/politics/article/3366006/glacier-risk-hangs-over-china-nepal-border-region-remembers-mudslide-victims?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-01T11:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na região autônoma do Tibete, moradores e resgatistas observaram um minuto de silêncio em memória das vítimas da deslizamento de lama que ocorreu na semana passada. Cerca de mil pessoas morreram e milhares estão desaparecidas na área fronteiriça entre China e Nepal após a colapso de um glaciar.", "titulo_pt": "Risco de gelo paira sobre fronteira entre china e nepal enquanto região homenageia vítimas de deslizamento de lama", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 138378, "titulo": "Doosan, KOEN widen drone, helicopter search for 9 missing workers in Nepal", "url": "https://www.koreaherald.com/article/10859334", "fonte_id": "korea_herald", "data_pub": "2026-09-01T11:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Doosan Enerbility e Korea South-East Power Co. intensificaram a busca por nove funcionários desaparecidos em Nepal, após inundações flash, utilizando drones e helicópteros. A empresa estatal KOEN adicionou quatro drones equipados com câmeras térmicas e infravermelhas, totalizando seis, para a busca.", "titulo_pt": "Doosan e KOEN intensificam busca por 9 trabalhadores desaparecidos em Nepal com drones e helicópteros", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 137966, "titulo": "The Growing Lawlessness in California’s Forests", "url": "https://www.theatlantic.com/science/2026/09/frog-biologists-kidnapping-california-national-forest/688445/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-01T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Duas biólogas de rãs foram sequestradas nas florestas. Situações ainda mais estranhas podem ocorrer.", "titulo_pt": "Aumento da Lawlessness nas florestas da califórnia", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 136877, "titulo": "Clima: ciclone extratropical provoca ventos intensos no centro-sul do país", "url": "https://www.metropoles.com/brasil/clima-ciclone-extratropical-provoca-ventos-intensos-no-centro-sul-do-pais", "fonte_id": "metropoles", "data_pub": "2026-09-01T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ciclone extratropical se formou na costa da Região Sul, causando ventos intensos no centro-sul do país. As temperaturas caem no Sul, enquanto no Norte e Nordeste chegam a 41ºC.", "titulo_pt": "Ciclone extratropical causa ventos fortes no centro-sul do país", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 136881, "titulo": "Lobo-guará é resgatado dentro de casa no DF e depois devolvido à natureza", "url": "https://www.metropoles.com/distrito-federal/lobo-guara-e-resgatado-dentro-de-casa-no-df-e-depois-devolvido-a-natureza", "fonte_id": "metropoles", "data_pub": "2026-09-01T09:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um lobo-guará foi resgatado dentro de uma casa no Distrito Federal e posteriormente solto na Estação Ecológica Jardim Botânico, local adequado para sua preservação e segurança.", "titulo_pt": "Lobo-guará é resgatado em casa no DF e devolvido à natureza", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 137069, "titulo": "Nepal eleva a cerca de mil los muertos por las inundaciones en la frontera con China, que deja unos 3.900 desaparecidos", "url": "https://www.latercera.com/mundo/noticia/nepal-eleva-a-cerca-de-mil-los-muertos-por-las-inundaciones-en-la-frontera-con-china-que-deja-unos-3900-desaparecidos/", "fonte_id": "la_tercera", "data_pub": "2026-09-01T09:17:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Nepal registra mais de mil mortos e cerca de 3.900 desaparecidos devido às inundações na fronteira com China, enquanto no território chinês foram registrados pelo menos 16 mortos e 550 desaparecidos.", "titulo_pt": "Nepal eleva número de mortos por inundações na fronteira com China, que registra 16 mortos e 550 desaparecidos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 137499, "titulo": "Guest post: Why tough methane cuts are crucial for keeping warming ‘well-below’ 2C", "url": "https://www.carbonbrief.org/guest-post-why-tough-methane-cuts-are-crucial-for-keeping-warming-well-below-2c", "fonte_id": "carbon_brief", "data_pub": "2026-09-01T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O metano é um gás de efeito estufa poderoso e o segundo maior contribuinte para o aquecimento global após o dióxido de carbono (CO2). Reduções rigorosas do metano são cruciais para manter o aquecimento 'bem abaixo' de 2°C.", "titulo_pt": "Post convidado: por que cortes rigorosos de metano são cruciais para manter o aquecimento 'bem abaixo' de 2°C", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 137051, "titulo": "Sydney records warmest winter on record as Melbourne equals previous hottest temperatures", "url": "https://www.theguardian.com/australia-news/2026/sep/01/sydney-records-warmest-winter-on-record-as-melbourne-equals-previous-hottest-temperatures", "fonte_id": "guardian_world", "data_pub": "2026-09-01T08:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nova Gales do Sul, Vitoria e Tasmânia registraram seus invernos mais quentes na história. O BoM prevê temperaturas acima da média para todo o país durante o outono, com maior probabilidade de máximas muito elevadas.", "titulo_pt": "Sídney registra inverno mais quente da história enquanto Melbourne iguala recordes de calor", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 136866, "titulo": "Nepal registra mais de mil mortes e 4 mil desaparecidos após enchentes", "url": "https://www.cnnbrasil.com.br/internacional/nepal-registra-mais-de-mil-mortes-e-4-mil-desaparecidos-apos-enchentes/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-01T07:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de mil pessoas morreram e cerca de 4 mil desapareceram no Nepal devido às enchentes. Equipes de resgate escavaram escombros em áreas remotas do Himalaia para resgatar trabalhadores presos.", "titulo_pt": "Nepal registra mais de mil mortes e 4 mil desaparecidos após enchentes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 137205, "titulo": "Death toll passes 1,000 from catastrophic flooding in Nepal and China, officials say", "url": "http://www.euronews.com/2026/09/01/death-toll-passes-1000-from-catastrophic-flooding-in-nepal-and-china-officials-say", "fonte_id": "euronews", "data_pub": "2026-09-01T06:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um desastre ocorrido em 26 de agosto no Himalaia começou com a colapso de um gelo, que liberou grandes quantidades de rochas, gelo e água derretida para vales abaixo, desencadeando fortes inundações a jusante. O número de mortos superou a marca de 1.000 em Nepal e China, de acordo com autoridades.", "titulo_pt": "Óbitos ultrapassam 1.000 em inundações catastróficas no Nepal e na China", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 138900, "titulo": "Museo de la Memoria recibió las 23 fotos del bombardeo a La Moneda publicadas por The Union Films y CIPER", "url": "https://www.ciperchile.cl/2026/09/01/museo-de-la-memoria-recibio-las-23-fotos-del-bombardeo-a-la-moneda-publicadas-por-the-union-films-y-ciper/?utm_source=rss&utm_medium=rss&utm_campaign=museo-de-la-memoria-recibio-las-23-fotos-del-bombardeo-a-la-moneda-publicadas-por-the-union-films-y-ciper", "fonte_id": "ciper_chile", "data_pub": "2026-09-01T20:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Museu da Memória recebeu 23 fotos do bombardeio à La Moneda publicadas por The Union Films e CIPER.", "titulo_pt": "Museu da memória recebe 23 fotos do bombardeio à La Moneda publicadas por The Union Films e CIPER", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 137995, "titulo": "Formalizan a Gonzalo Feito por maltrato habitual y decretan suspensión condicional del procedimiento por un año", "url": "https://www.latercera.com/nacional/noticia/formalizan-a-gonzalo-feito-por-maltrato-habitual-y-decretan-suspension-condicional-del-procedimiento-por-un-ano/", "fonte_id": "la_tercera", "data_pub": "2026-09-01T17:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Gonzalo Feito, periodista e apresentador de televisão, foi formalizado por maltrato habitual e teve um procedimento condicional de suspensão decretado por um ano. Como parte das condições, ele deverá submeter-se a testes de drogas a cada quatro meses e participar de um programa de reeducação em violência psicológica.", "titulo_pt": "Formalização de Gonzalo Feito por maltrato habitual e suspensão condicionada", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 138286, "titulo": "WHO raises concerns over amputees and deteriorating water quality in Gaza", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/who-raises-concern-over-deteriorating-water-quality-water-contamination", "fonte_id": "middle_east_eye", "data_pub": "2026-09-01T17:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização Mundial da Saúde (OMS) expressou preocupações sobre a qualidade da água deteriorada e a contaminação na Faixa de Gaza, com riscos de doenças aumentando. Entre janeiro e agosto deste ano, mais de 6.700 amostras de água foram testadas e a contaminação microbiológica quase triplicou, passando de menos de seis por cento em janeiro para mais de 18 por cento em agosto.", "titulo_pt": "OMS se preocupa com amputados e qualidade da água deteriorada em Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 137893, "titulo": "La desconocida investigación sobre adopciones irregulares en dictadura que hizo Mónica Madariaga en los años 80", "url": "https://www.ciperchile.cl/2026/09/01/la-desconocida-investigacion-sobre-adopciones-irregulares-en-dictadura-que-hizo-monica-madariaga-en-los-anos-80/?utm_source=rss&utm_medium=rss&utm_campaign=la-desconocida-investigacion-sobre-adopciones-irregulares-en-dictadura-que-hizo-monica-madariaga-en-los-anos-80", "fonte_id": "ciper_chile", "data_pub": "2026-09-01T16:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mónica Madariaga realizou uma investigação sobre adotantes e adotados em situações irregulares durante a ditadura chilena nos anos 80. Este trabalho não foi amplamente conhecido.", "titulo_pt": "A desconhecida investigação sobre adotantes e adotados irregulares na ditadura que fez Mónica Madariaga nos anos 80", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 139174, "titulo": "UNICEF Executive Director Catherine Russell opening remarks at the second regular session of the 2026 UNICEF Executive Board", "url": "https://www.unicef.org/press-releases/unicef-executive-director-catherine-russell-opening-remarks-second-regular-session", "fonte_id": "unicef", "data_pub": "2026-09-01T15:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A diretora executiva do UNICEF, Catherine Russell, fez as observações de abertura na segunda sessão regular do Conselho Executivo do UNICEF de 2026.", "titulo_pt": "Diretora do UNICEF Catherine Russell faz observações de abertura na segunda sessão regular do conselho executivo de 2026", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 139175, "titulo": "El Niño threatens more than two-thirds of children in Eastern and Southern Africa", "url": "https://www.unicef.org/press-releases/el-ni%C3%B1o-threatens-more-two-thirds-children-eastern-and-southern-africa", "fonte_id": "unicef", "data_pub": "2026-09-01T13:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Niña ameaça mais de dois terços dos crianças na África Oriental e do Sul. O UNICEF está pedindo ação urgente para proteger as crianças de uma crise previsível.", "titulo_pt": "Niña ameaça mais de dois terços das crianças na áfrica oriental e do sul", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 138317, "titulo": "Ex-prosecutor who accused boss of rape urges reform", "url": "https://www.japantimes.co.jp/news/2026/09/01/japan/crime-legal/ex-prosecutor-rape-reform/", "fonte_id": "japan_times", "data_pub": "2026-09-01T10:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O escritório do procurador público no Japão enfrenta recentemente uma série de escândalos relacionados a conduta imprópria de procuradores de elite. Um ex-procurador que acusou seu chefe de estupro está pedindo por reformas.", "titulo_pt": "Ex-procurador que acusou chefe de estupro defende reformas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 137133, "titulo": "NAACP's call for Black athletes' boycott of southern schools hits an NIL wall", "url": "https://www.axios.com/2026/09/01/naacp-black-athletes-boycott-nil", "fonte_id": "axios", "data_pub": "2026-09-01T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Civil rights grupos estão pedindo que atletas negros boicoteem escolas nos Estados do sul que estão revogando direitos de voto. No entanto, atletas altamente remunerados da era do NIL estão se mostrando relutantes em se envolver em protestos. Isso ilustra uma discrepância entre os ativistas que usam métodos de protesto de 1960 e os atletas proeminentes de hoje, que operam em um mercado de NIL de $3 bilhões e têm uma visão diferente de como se envolverem em ativismo, não querendo sacrificar oportunidades financeiras inéditas.", "titulo_pt": "Chamado da naacp para boicote de atletas negros a escolas do sul encontra obstáculos no NIL", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 137894, "titulo": "Militarismo civil, militarización de la seguridad pública y erosión democrática en América Latina", "url": "https://www.ciperchile.cl/2026/09/01/militarismo-civil-militarizacion-de-la-seguridad-publica-y-erosion-democratica-en-america-latina/?utm_source=rss&utm_medium=rss&utm_campaign=militarismo-civil-militarizacion-de-la-seguridad-publica-y-erosion-democratica-en-america-latina", "fonte_id": "ciper_chile", "data_pub": "2026-09-01T08:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute o militarismo civil, a militarização da segurança pública e a erosão democrática na América Latina.", "titulo_pt": "Militarismo civil, militarização da segurança pública e erosão democrática na América Latina", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 137307, "titulo": "Women Survivors of Bosnia’s War Watch Tributes to Mladic with Despair", "url": "https://balkaninsight.com/2026/09/01/women-survivors-of-bosnias-war-watch-tributes-to-mladic-with-despair/btj/", "fonte_id": "balkan_insight", "data_pub": "2026-09-01T05:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Duas mulheres que sobreviveram aos crimes cometidos pelas forças de Ratko Mladic durante a guerra de 1992-95 relatam como o falecimento de Mladic trouxe novo sofrimento, pois jovens sérvios em Bosnia glorificavam sua herança.", "titulo_pt": "Mulheres sobreviventes da guerra de Bosnia assistem a homenagens a Mladic com desespero", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 137185, "titulo": "'The hardest report I've ever done': Photographing young girls sold by their parents in Afghanistan", "url": "https://www.lemonde.fr/en/culture/article/2026/09/01/the-har
