<script>
const D = {"gerado_em": "13/11/2026 19:17", "stats": {"noticias_novas": 617, "resumos_gerados": 237}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Lula enfrenta diversos desafios políticos e institucionais. Na Câmara e no Senado, parlamentares do PL discutem se apoiarão Hugo Motta. O Congresso também enfrenta críticas por ajustes no 'plano Moretti'. A crise na Polícia Federal, com a troca de delegados, reaviva dúvidas sobre as investigações do 'Caso Master'. No STF, Fachin defende a indicação de uma mulher negra para o tribunal, enquanto Toffoli dá prazo para a campanha de Lula esclarecer inconsistências apontadas pelo TSE. Além disso, o governo estuda aplicar o CNU mesmo com poucas vagas autorizadas, e há discussões sobre ajustes fiscais e o papel do Banco Central. Em meio a esses desafios, o STF suspendeu prazos processuais devido a falhas nos sistemas da Microsoft, e há críticas de que o pacote fiscal não esteja alinhado com as promessas de campanha do governo.", "mundo": "A Administração Federal de Aviação dos Estados Unidos (FAA) emitiu uma ordem de paralisação nacional no solo, afetando todos os voos, devido a problemas de comunicação nos centros de controle de tráfego aéreo. O secretário de Transportes dos EUA, Sean Duffy, informou que técnicos estão investigando o problema. A suspensão afetou aeronaves em todos os aeroportos do país, incluindo voos internacionais que chegam aos Estados Unidos. A FAA confirmou a paralisação em comunicados oficiais. Em paralelo, a Comissão Europeia anunciou que enviará diplomatas de cinco países, incluindo França, Reino Unido, Alemanha, Itália e Polônia, para as próximas negociações com a Ucrânia, em um esforço para resolver a crise na região. A FAA também anunciou uma paralisação nacional no solo para todos os voos devido a circunstâncias extraordinárias e motivos de segurança, atribuindo o problema a um problema de comunicação no sistema de controle de tráfego aéreo.\n\nA China realiza manobras militares silenciosas em Taiwan, intensificando a tensão geopolítica na região. O Congresso dos Estados Unidos considera mais restrições sobre a exportação de chips para a China, refletindo o crescente conflito tecnológico entre os dois países. O Departamento de Transportes dos EUA suspendeu todas as operações aéreas do país devido a um problema de comunicação, causando uma paralisação generalizada do sistema de aviação. No Peru, um terremoto de magnitude 5,8 atingiu a costa durante a visita do papa, interrompendo temporariamente os voos de saída por razões de segurança. O Qatar e a Turquia assinaram um pacto de defesa mútua, reforçando suas alianças diante da crescente instabilidade regional. A União Europeia está prestes a não atingir suas metas de fabricação de chips, enquanto o secretário do Tesouro dos EUA acusa o Departamento de Comércio de atrasar a proibição de chips Nvidia para a Megaspeed, uma empresa suspeita de enviar chips avançados de IA para a China. O escândalo envolvendo Jensen Huang pode desestabilizar um consenso precário em Washington, enquanto a Alemanha restringe a circulação de carros conectados em suas bases militares devido a preocupações com espionagem. No Irã, milhares de pessoas se reuniram em Teerã para um funeral coletivo em homenagem a 110 soldados desconhecidos mortos durante a Guerra Irânio-Irakiana, com uma exibição de mísseis ocorrendo durante o evento. Um vice-primeiro-ministro russo liderou uma delegação de 70 membros para Cabul para negociações de negócios com o Taliban sobre transportes, logística, agricultura e produtos de saúde, enquanto a Rússia atribuiu a responsabilidade de car bombings em Moscou a Kiev. A assembleia iraniana está debatendo possíveis mudanças na doutrina nuclear e na possibilidade de sair do Tratado de Não-Proliferação de Armas Nucleares (NPT), com o objetivo americano de impedir qualquer programa nuclear iraniano, provocando um intenso debate na sociedade e nos círculos de poder iranianos.", "economia": "A Agência Federal de Aviação (FAA) suspendeu operações no solo devido a circunstâncias excepcionais, levantando preocupações sobre a segurança aérea. No Brasil, o dólar fechou o dia cotado a R$ 5,65, seu maior patamar desde junho de 2023, enquanto a Bolsa de Valores subiu 0,66%. A confiança da indústria atingiu o menor nível desde maio de 2020, refletindo um pessimismo prolongado no setor. O Federal Reserve identificou os riscos associados à inteligência artificial como a maior ameaça para o sistema financeiro, enquanto o Banco Central do Chile abandonou um projeto de produção de hidrogênio e amônio verde de US$16 bilhões. Além disso, a Caixa Econômica Federal revisou riscos relacionados à inadimplência, que atingiu 25,44% em setembro, e renegociou dívidas. O índice de preços ao produtor nos Estados Unidos subiu 0,3% em outubro, marcando o maior aumento anual em quatro anos, reforçando as expectativas de que o Fed possa manter a elevação das taxas de juros.", "tecnologia": "Líderes europeus realizaram a primeira cúpula sobre inteligência artificial (IA) para discutir os desafios relacionados à tecnologia na região. A saída inesperada de Jensen Huang, presidente da Nvidia, gerou surpresa, especialmente em Washington, onde seu papel era controverso. Huang participou recentemente de uma conferência no Instituto da Paz em Washington, DC. Sua saída pode afetar a cadeia de suprimentos de AI da China. No entanto, a Nvidia e outras empresas de IA mantêm suas ações estáveis, independentemente das preocupações sobre o risco concentrado. A demanda por computadores resistentes deve impulsionar as vendas da Getac no próximo ano, enquanto a Microsoft enfrenta um colapso temporário de seus servidores, atribuído a um erro de atualização. A indústria de IA reconhece o impacto das decisões políticas nas eleições, como a aprovação de iniciativas que limitam o desenvolvimento de data centers. A Swiss Innovation Week na próxima semana terá como protagonista uma inteligência artificial feminina, visando promover equidade de gênero e inclusão.", "ciencia": "Um modificador de impressora 3D que custa US$ 450 pode criar materiais vivos com mais de 100 camadas, permitindo escolher as células que compõem o material e suas formas 3D finais. Isso pode ter aplicações em limpeza de água contaminada e decomposição de plástico. Em 13 de novembro de 1971, o Mariner 9 se tornou o primeiro foguete espacial a orbitar Marte, fornecendo visões detalhadas da superfície do planeta. A equipe de astrônomos identificou uma estrela gigante vermelha com um companheiro binário invisível, sugerindo a possibilidade de uma supermassiva neutrona que poderia ajudar a explicar a lacuna de massa entre as neutronas e os buracos negros. Estudos indicam que as montanhas da Terra cresceram em dois períodos distintos durante a história, coincidindo com a expansão da biodiversidade, sugerindo que as montanhas podem ter contribuído para o surgimento da vida complexa. O chefe da agência de migração da ONU afirmou que o clima poderia forçar mais de 200 milhões de pessoas a deixar suas casas, mesmo enquanto países investem bilhões em segurança fronteiriça. A Federação do Espaço Comercial (FEC) recebeu a CesiumAstro como nova associada, uma empresa global em soluções de conectividade avançada para o espaço e outras indústrias.", "cultura": "Existem várias notícias importantes na área cultural que merecem destaque. A Noite de Museus, prevista para o próximo sábado, promete abrir mais de 350 espaços culturais, bibliotecas, clubes e instituições gratuitamente até as 2 da madrugada na cidade de Buenos Aires, oferecendo uma variedade de atividades e atrações. Em outro front, a biografia de Jacqueline Kennedy, escrita por J. Taraborrelli, está prestes a ser lançada e já se destaca como um best-seller na lista do New York Times. Na literatura, a casa de leilões Sotheby’s planeja realizar um leilão para quitar uma dívida contraída com a coleção Hedreen, sem que o dinheiro venha a ser usado para financiar um museu universitário. No cinema, o filme 'Refém por Um Fio', dirigido por Gus Van Sant, ganha destaque, enquanto a novela 'Avenida Brasil 2' reúne seu elenco nos bastidores para as gravações da nova temporada, marcada para 2027.", "sociedade": "O parlamento aprovou um aumento no período de licença parental, expandindo os direitos dos pais. Em São Paulo, o número de registros de violência nas escolas aumentou 73,83% em 2024, refletindo um problema mais amplo no país. A Doença de Chagas causou a morte de uma mulher de 76 anos durante um voo de Brasília para Porto Velho, destacando a necessidade de vigilância em saúde. Um policial militar da reserva e sua esposa foram executados a tiros por um genro em um bar em Mato Grosso do Sul, levando a uma investigação. No Distrito Federal, uma operação policial visa combater uma quadrilha que atormenta a comunidade com o uso de armas de fogo. Além disso, a ex-secretária nacional de Avaliação, Gestão da Informação e Cadastro Único defendeu a necessidade de maior integração entre os programas sociais para evitar sobreposições e lacunas de atendimento. A L'Oréal propôs que, até 2030, os profissionais negros devem representar pelo menos metade dos contratados para campanhas. O Distrito Federal é o único lugar no mundo que atinge a autossuficiência em leite humano nas unidades neonatais, mas o banco de leite do DF precisa de doações.", "meio_ambiente": "O Brasil busca apresentar um plano para tornar as cidades mais resilientes na COP31, conforme anunciou o ministro das Cidades. Durante o evento, Lula propôs um fundo global para a preservação das florestas, mas a falta de recursos pode comprometer sua implementação. A bióloga Erika Berenguer expressou preocupação com os incêndios na Amazônia, reiterando a urgência de continuar os esforços de preservação. Em Kriva Palanka, na Macedônia do Norte, o prefeito pediu ajuda para lidar com mais de mil vacas soltas, causando danos e preocupação entre os moradores. Nova Deli, na Índia, superou Lahore, no Paquistão, como a cidade mais poluída do mundo, conforme relatório do Al Jazeera. A tempestade Charles causou alagamentos e cancelamentos de voos na Europa do Sul, enquanto o calor e a alta umidade provocaram fortes chuvas no Centro-Sul do Brasil e em áreas do Norte e Nordeste. Por fim, o programa de crédito climático com juros baixos está sendo usado para financiar a construção de apartamentos de luxo, levantando questionamentos sobre o uso dos recursos.", "direitos_humanos": "A situação humanitária dos palestinos na Faixa de Gaza continua preocupante, pois as chuvas e o inverno agravaram as condições precárias em que milhares de pessoas, incluindo crianças, grávidas e bebês, vivem. As chuvas inundaram as barracas e a falta de roupas adequadas agravou a crise. O impasse entre Israel e Hamas impede a reconstrução de Gaza e a chegada de ajuda humanitária. Além disso, uma entrevista com Nushofarin Noziri aborda como a mídia influencia as percepções públicas e as respostas da polícia ao combate à violência contra mulheres no Tajiquistão."}, "resumo_do_dia": {"politica_nacional": [{"id": 262752, "titulo": "Valdemar avisa que parlamentares decidem se apoiam ou não Hugo Motta", "url": "https://www.metropoles.com/colunas/igor-gadelha/valdemar-avisa-que-parlamentares-decidem-se-apoiam-ou-nao-hugo-motta", "fonte_id": "metropoles", "data_pub": "2026-11-13T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Valdemar Costa Neto conversou com deputados do PL sobre seu interesse em entrar no bloco de Hugo Motta, afirmando que não tem interesse e que a decisão de apoiar ou não Hugo Motta é dos parlamentares.", "titulo_pt": "Valdemar costa neto avisa que parlamentares decidem apoio a Hugo Motta", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 262601, "titulo": "Câmara e Senado pedem que plenário do STF rejeite pontos da liminar de Dino sobre escala 6x1", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/camara-e-senado-pedem-que-plenario-do-stf-rejeite-pontos-da-liminar-de-dino-sobre-escala-6x1.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados e o Senado Federal solicitaram que o plenário do STF rejeite as alterações propostas pelo ministro Flávio Dino na emenda constitucional que trata da escala 6x1.", "titulo_pt": "Câmara e Senado pedem que plenário do STF rejeite mudanças de Dino sobre escala 6x1", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 262603, "titulo": "Congresso esvazia corte de supersalários no 'plano Moretti', dizem organizações", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/congresso-esvazia-corte-de-supersalarios-no-plano-moretti-dizem-organizacoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T20:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um grupo de sete entidades criticou a mudança feita pelo Congresso no chamado 'plano Moretti', que trata de medidas fiscais do governo e está em tramitação no Legislativo.", "titulo_pt": "Congresso altera corte de supersalários no 'plano Moretti', dizem organizações", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 262692, "titulo": "Caso Master: troca de delegados amplia desgaste do diretor-geral da Polícia Federal", "url": "https://veja.abril.com.br/politica/caso-master-troca-de-delegados-amplia-desgaste-do-diretor-geral-da-policia-federal/", "fonte_id": "veja", "data_pub": "2026-11-13T20:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Comissão do Senado aprovou o convite para ouvir Andrei Rodrigues, diretor-geral da Polícia Federal. A crise no diretor-geral expôs divisões na corporação e reacendeu dúvidas sobre as investigações.", "titulo_pt": "Caso Master: convite para ouvir diretor-geral da Polícia Federal amplia crise", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 262595, "titulo": "Fachin defende indicação de mulher negra para o STF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/fachin-defende-indicacao-de-mulher-negra-para-o-stf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-13T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, ministro Edson Fachin, defendeu a indicação de uma mulher negra para o tribunal durante o Encontro Nacional de Juízas e Juízes Negros, no Rio de Janeiro, em 13 de novembro de 2026.", "titulo_pt": "Fachin defende indicação de mulher negra para o STF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 262861, "titulo": "Diretório Nacional do PT discute ajuste fiscal em meio a incômodo no partido e na militância", "url": "https://www.jota.info/legislativo/diretorio-nacional-do-pt-discute-ajuste-fiscal-em-meio-a-incomodo-no-partido-e-na-militancia", "fonte_id": "jota", "data_pub": "2026-11-13T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Diretório Nacional do PT discute ajustes fiscais, enfrentando reações negativas tanto de parlamentares quanto da militância petista, que estava motivada após a vitória nas eleições.", "titulo_pt": "Diretório Nacional do PT discute ajuste fiscal em meio a incômodo no partido e na militância", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 262862, "titulo": "Em evento no Rio, Fachin defende magistrada negra para o STF", "url": "https://www.jota.info/stf/do-supremo/em-evento-no-rio-fachin-defende-magistrada-negra-para-o-stf", "fonte_id": "jota", "data_pub": "2026-11-13T20:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em um evento no Rio de Janeiro, o ministro do STF Edson Fachin defendeu a nomeação de uma magistrada negra para o Supremo Tribunal Federal (STF). A vaga deixada pelo ministro Luís Roberto Barroso está há mais de um ano em aberto.", "titulo_pt": "Fachin defende magistrada negra para STF em evento no Rio", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 262863, "titulo": "Disputa judicial sobre taxa de fiscalização do tabaco envolve mais de R$ 500 milhões", "url": "https://www.jota.info/coberturas-especiais/disputa-judicial-sobre-taxa-de-fiscalizacao-do-tabaco-envolve-mais-de-r-500-milhoes", "fonte_id": "jota", "data_pub": "2026-11-13T20:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma disputa judicial envolvendo a indústria do tabaco e um recurso em julgamento no TRF-1 pode afetar o bloqueio de valores destinados à Anvisa, estimados em mais de R$ 500 milhões. Uma professora da FGV comentou sobre a situação.", "titulo_pt": "Disputa judicial sobre taxa de fiscalização do tabaco pode afetar R$ 500 milhões", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 262609, "titulo": "Tesouro Nacional derruba sistemas após ataque que roubou dados de beneficiários do governo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/tesouro-nacional-derruba-sistemas-apos-ataque-que-roubou-dados-de-beneficiarios-do-governo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T19:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Secretaria do Tesouro Nacional informou que seus sistemas estão parcialmente fora do ar após um ataque hacker que expôs dados pessoais de usuários e beneficiários de pagamentos do governo federal. Os serviços devem ser normalizados até a manhã de segunda-feira.", "titulo_pt": "Tesouro Nacional derruba sistemas após ataque que roubou dados de beneficiários do governo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 262827, "titulo": "Apagão do Outlook afetou empresas e até os prazos de ações no Judiciário: dá para pedir indenização à Microsoft?", "url": "https://www.bbc.com/portuguese/articles/cq62pdgrer0po?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-13T19:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Outlook sofreu um apagão que afetou empresas e prazos judiciais, levantando a possibilidade de indenização. No entanto, o contrato da Microsoft não prevê indenização, apenas desconto na assinatura em caso de prejuízo. No Brasil, pequenos negócios podem contestar esse limite usando o Código do Consumidor, segundo especialista.", "titulo_pt": "Apagão do Outlook: indenização é possível?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 262610, "titulo": "Governo estuda CNU com prova antes da autorização de vagas, diz ministra", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/governo-estuda-cnu-com-prova-antes-da-autorizacao-de-vagas-diz-ministra.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T19:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal está considerando aplicar o CNU (Concurso Nacional Unificado) mesmo com poucas vagas autorizadas no momento da prova. A proposta seria criar uma lista de candidatos aptos para serem chamados quando as vagas se tornarem disponíveis.", "titulo_pt": "Governo estuda CNU com prova antes da autorização de vagas, diz ministra", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 262612, "titulo": "Lula atravessará o Rubicão?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/marcos-mendes/2026/11/lula-atravessara-o-rubicao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T19:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Desde seu primeiro mandato, Lula adota um comportamento contraditório em relação ao Banco Central, concedendo autonomia para controle da inflação, mas mantendo políticas fiscais expansionistas que levam a aumentos de juros, o que é criticado por ele.", "titulo_pt": "Lula atravessará o Rubicão?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 262596, "titulo": "AGU do governo Lula se posiciona contra liminar por segundo turno no RJ", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/agu-do-governo-lula-se-posiciona-contra-liminar-por-segundo-turno-no-rj.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-13T19:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A AGU concordou com a decisão do ministro Cristiano Zanin, do STF, de negar a liminar solicitada pelo PSD para garantir o segundo turno na eleição pelo Governo do Rio de Janeiro.", "titulo_pt": "AGU do governo Lula se posiciona contra liminar para segundo turno no RJ", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 262864, "titulo": "Fachin atende OAB e suspende prazos na Justiça após falha da Microsoft", "url": "https://www.jota.info/justica/fachin-atende-oab-e-suspende-prazos-na-justica-apos-falha-da-microsoft", "fonte_id": "jota", "data_pub": "2026-11-13T19:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF (Supremo Tribunal Federal) e do CNJ (Conselho Nacional de Justiça), ministro Fachin, suspendeu os prazos na Justiça para os dias 12 e 13 de novembro devido a uma falha da Microsoft; os prazos retornarão a correr no dia 16 de novembro.", "titulo_pt": "Fachin suspende prazos na Justiça por falha da Microsoft nos dias 12 e 13 de novembro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 262624, "titulo": "Toffoli dá 3 dias para campanha de Lula esclarecer inconsistências nas contas apontadas pelo TSE", "url": "https://g1.globo.com/politica/noticia/2026/11/13/toffoli-da-3-dias-para-campanha-de-lula-esclarecer-inconsistencias-nas-contas-apontadas-pelo-tse.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-13T18:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Dias Toffoli, do Tribunal Superior Eleitoral, concedeu um prazo de três dias para a campanha de Lula apresentar esclarecimentos sobre inconsistências nas contas apontadas pela área técnica do TSE. Os problemas incluem indícios de subcontratação irregular e a necessidade de comprovar a capacidade operacional dos fornecedores pagos com dinheiro do Fundo Eleitoral.", "titulo_pt": "Toffoli dá 3 dias para campanha de Lula esclarecer inconsistências nas contas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 262616, "titulo": "Fachin atende à OAB e prorroga prazos processuais após pane da Microsoft", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/11/fachin-atende-a-oab-e-prorroga-prazos-processuais-apos-pane-da-microsoft.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T18:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do CNJ, Edson Fachin, prorrogou os prazos processuais da Justiça em razão de uma pane na Microsoft que afetou os serviços em 12 e 13 de novembro. A medida foi tomada em resposta à OAB.", "titulo_pt": "Fachin prorroga prazos processuais após pane da Microsoft", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 262340, "titulo": "China drills ‘silent intimidation’: Taiwan", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/14/2003867710", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China realizou manobras militares silenciosas que se tornaram uma forma de intimidação. Taiwan foi o foco desses exercícios.", "titulo_pt": "China realiza manobras militares silenciosas: intimidação a taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262361, "titulo": "US Congress eyes tighter curbs on chips to China", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/14/2003867699", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Congresso dos Estados Unidos está considerando mais restrições sobre a exportação de chips para a China. Essas medidas visam restringir ainda mais a cooperação tecnológica entre os dois países.", "titulo_pt": "Congresso dos EUA considera novas restrições para exportação de chips para a China", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262922, "titulo": "How Does a 74-Year-Old in Argentina Escape House Arrest on the Fifth Floor?", "url": "https://www.nytimes.com/2026/11/13/world/americas/74-year-old-in-argentina-escapes-house-arrest.html", "fonte_id": "nyt_world", "data_pub": "2026-11-13T21:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de 74 anos, argelino, evadiu-se da prisão domiciliar em que estava sob vigilância policial. A fuga envolveu o uso de um aquecedor elétrico, uma ameaça de explosão e gorduras animais. A polícia ainda procura um italiano acusado de crimes de terrorismo dos anos 1970.", "titulo_pt": "Como um homem de 74 anos evadiu-se da prisão domiciliar em Argentina?", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 263014, "titulo": "Trump and Zohran sitting in a tree…", "url": "https://www.politico.com/newsletters/new-york-playbook-pm/2026/11/13/trump-and-zohran-sitting-in-a-tree-01166061", "fonte_id": "politico", "data_pub": "2026-11-13T21:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O trecho refere-se a uma expressão idiomática que sugere uma situação em que Trump e Zohran estão envolvidos em uma situação privada ou informal, provavelmente relacionada a negociações ou discussões.", "titulo_pt": "Trump e Zohran sentados em uma árvore...", "veiculo": "Politico", "pais": "EUA", "classe": "A"}, {"id": 263055, "titulo": "FAA issues US national ground stop on all flights", "url": "https://www.dw.com/en/faa-issues-us-national-ground-stop-on-all-flights/a-79945062?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-13T21:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Administração Federal de Aviação dos EUA emitiu uma paralisação nacional no solo para todos os voos. O secretário de Transportes dos EUA, Sean Duffy, informou que técnicos estão investigando o problema.", "titulo_pt": "FAA emite paralisação no solo para todos os voos nos EUA", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 262921, "titulo": "Eisenkot Accuses Netanyahu of Fueling ‘Racist’ Hostility Against Arabs", "url": "https://www.nytimes.com/2026/11/13/world/middleeast/eisenkot-netanyahu-racism-arabs.html", "fonte_id": "nyt_world", "data_pub": "2026-11-13T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gadi Eisenkot, ex-comandante do Exército israelense, criticou severamente o primeiro-ministro Benjamin Netanyahu, após este ter atacado deputados árabes em um discurso divisivo.", "titulo_pt": "Eisenkot acusa Netanyahu de fomentar 'racista' hostilidade contra árabes", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 262675, "titulo": "EUA suspendem voos em todo o país por falha no controle de tráfego", "url": "https://www.poder360.com.br/poder-internacional/eua-suspendem-voos-em-todo-o-pais-por-falha-no-controle-de-trafego/", "fonte_id": "poder360", "data_pub": "2026-11-13T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Administração Federal de Aviação (FAA) dos Estados Unidos suspendeu todos os voos do país devido a uma falha no sistema de controle de tráfego aéreo. A causa da falha está sendo investigada.", "titulo_pt": "EUA suspendem voos em todo o país por falha no controle de tráfego", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 263048, "titulo": "Gambia's Adama Barrow seeks third term", "url": "https://www.france24.com/en/gambia-s-adama-barrow-seeks-third-term", "fonte_id": "france24", "data_pub": "2026-11-13T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Eleitoral da Gâmbia anunciou os cinco candidatos oficiais para a próxima eleição presidencial, com o presidente Adama Barrow buscando um terceiro mandato. A tensão continua a aumentar na Etiópia após o governo federal nomear um novo chefe para a região ocidental de Tigray.", "titulo_pt": "Adama Barrow busca terceiro mandato na gâmbia", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 262933, "titulo": "La FAA ordena una suspensión nacional de los vuelos debido a “circunstancias extraordinarias y motivos de seguridad”", "url": "https://elpais.com/us/2026-11-13/la-faa-ordena-una-suspension-nacional-de-los-vuelos-debido-a-circunstancias-extraordinarias-y-motivos-de-seguridad.html", "fonte_id": "elpais_america", "data_pub": "2026-11-13T21:45:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A FAA ordenou uma suspensão nacional dos voos devido a circunstâncias extraordinárias e motivos de segurança. O problema é atribuído a um problema de comunicação que afeta todos os centros de controle de tráfego aéreo.", "titulo_pt": "FAA ordena suspensão nacional de voos devido a problemas de comunicação", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 262830, "titulo": "EUA suspendem todas as decolagens de aeroportos do país", "url": "https://www.dw.com/pt-br/eua-suspendem-todas-as-decolagens-de-aeroportos-do-país/a-79945256?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-13T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Administração Federal de Aviação dos Estados Unidos suspendeu todas as decolagens em aeroportos do país, exigindo que aviões prontos para decolar permaneçam no solo.", "titulo_pt": "EUA suspendem todas as decolagens de aeroportos do país", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 262826, "titulo": "EUA suspendem todos os voos do país por problema em sistemas de comunicação: o que se sabe", "url": "https://www.bbc.com/portuguese/articles/c54gnly4kzdpo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-13T21:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência de Regulação Aérea dos Estados Unidos (FAA) suspendeu todos os voos do país devido a uma falha nos sistemas de comunicação que afetou os centros de controle de tráfego aéreo. Inicialmente, a FAA informou que a razão era de segurança, mas o comunicado foi removido mais tarde.", "titulo_pt": "EUA suspendem todos os voos do país por problema em sistemas de comunicação", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 263049, "titulo": "France among five major powers to represent EU in Ukraine talks", "url": "https://www.france24.com/en/europe/20261113-europe-to-send-diplomats-from-across-the-continent-to-ukraine-peace-talks", "fonte_id": "france24", "data_pub": "2026-11-13T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do Conselho Europeu, Antonio Costa, anunciou que Bruxelas enviará diplomatas da União Europeia e de cinco países, incluindo Reino Unido, França, Alemanha, Itália e Polônia, para as próximas negociações com Ucrânia.", "titulo_pt": "França entre cinco grandes potências para representar ue em negociações com Ucrânia", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 263072, "titulo": "US grounds all flights after ‘communication issue’", "url": "https://www.aljazeera.com/news/2026/11/13/us-grounds-all-flights-after-communication-issue?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-13T21:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Transportes dos Estados Unidos informou que todas as operações aéreas foram suspensas devido a um problema de comunicação. A agência aérea dos EUA está investigando o incidente.", "titulo_pt": "EUA cancelam todos os voos após 'problema de comunicação'", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 262881, "titulo": "Suspenden todos los vuelos de salida en EE.UU. por una “situación extraordinaria y motivos de seguridad”", "url": "https://www.lanacion.com.ar/estados-unidos/suspenden-todos-los-vuelos-de-salida-en-eeuu-por-una-situacion-extraordinaria-y-motivos-de-seguridad-nid13112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-13T21:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Administração Federal de Aviões dos EUA suspendeu todos os voos de saída por razões de segurança extraordinárias devido a problemas graves nas comunicações do controle aéreo; os aviões em voo podem aterrizar, mas nenhum pode decolar até nova ordem.", "titulo_pt": "Suspensão de todos os voos de saída nos EUA por razões de segurança extraordinárias", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 262764, "titulo": "Voos nos EUA foram suspensos após problema de comunicação, diz secretário", "url": "https://www.metropoles.com/mundo/voos-nos-eua-foram-suspensos-apos-problema-de-comunicacao-diz-secretario", "fonte_id": "metropoles", "data_pub": "2026-11-13T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Administração de Aviação Federal (FAA) nos Estados Unidos determinou que os voos foram suspensos devido a problemas de comunicação, com aeronaves sendo mantidas no solo em todos os aeroportos do país. Além disso, voos internacionais que chegam aos EUA também serão avaliados.", "titulo_pt": "Voo nos EUA foram suspensos após problema de comunicação, diz secretário", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 263056, "titulo": "Tanker collides with cruise ship on Mississippi near New Orleans", "url": "https://www.dw.com/en/tanker-collides-with-cruise-ship-on-mississippi-near-new-orleans/a-79945080?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-13T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um navio de carga colidiu com um cruzeiro com cerca de 130 passageiros perto de Nova Orleães, fazendo com que o navio a vapor capotasse. Operações de resgate estão em andamento.", "titulo_pt": "Tanque colide com cruzeiro no Mississippi perto de nova orleães", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 262348, "titulo": "Prosecutors indict 26 in cryptocurrency fraud", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/14/2003867725", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os procuradores acusaram 26 pessoas de fraude com criptomoedas.", "titulo_pt": "Procuradores acusam 26 em fraude com criptomoedas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262358, "titulo": "ASE investing NT$100 billion in Kaohsiung", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/14/2003867696", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ASE está investindo NT$100 bilhões em Kaohsiung. Este investimento destina-se a projetos no porto de Kaohsiung.", "titulo_pt": "ASE investindo NT$100 bilhões em Kaohsiung", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262867, "titulo": "El Gobierno lanza un nuevo canje para tratar de reducir el vencimiento por casi $30 billones de fin de mes", "url": "https://www.lanacion.com.ar/economia/el-gobierno-lanza-un-nuevo-canje-para-tratar-de-reducir-el-vencimiento-por-casi-30-billones-de-fin-nid13112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-13T21:58:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo lançou um novo canje para tentar reduzir o vencimento por cerca de 30 trilhões de pesos argentinos. A convocação envolve a troca de títulos ajustáveis pelo dólar, com vencimento em 30 de outubro, por outros com vencimento no final de janeiro.", "titulo_pt": "Governo lança novo canje para reduzir vencimento por cerca de 30 trilhões de pesos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 263067, "titulo": "FAA issues nationwide ground stop citing communication issues affecting ‘multiple’ air traffic control facilities", "url": "https://www.cnbc.com/2026/11/13/faa-ground-stop.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-13T21:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Agência Federal de Aviação (FAA) emitiu um parada nacional no solo no final da tarde, devido a circunstâncias excepcionais e por questões de segurança.", "titulo_pt": "FAA emite parada no solo nacional devido a problemas de comunicação em várias estações de controle de tráfego aéreo", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 262753, "titulo": "Dólar fecha a R$ 5,65, maior patamar desde junho de 2025; Bolsa sobe 0,66%", "url": "https://www.metropoles.com/brasil/dolar-ibovespa-bolsa-13-novembro", "fonte_id": "metropoles", "data_pub": "2026-11-13T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar encerrou o dia no valor de R$ 5,65, atingindo o maior patamar desde junho de 2025. A Bolsa de valores subiu 0,66%.", "titulo_pt": "Dólar fecha a R$ 5,65, maior patamar desde junho de 2025; Bolsa sobe 0,66%", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 262620, "titulo": "Dólar fecha estável a R$ 5,65, mas sobe 2,63% na semana", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/dolar-fecha-estavel-r-565-mas-sobe-263-na-semana", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-13T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar fechou praticamente estável a R$ 5,65 nesta sexta-feira, mas registrou uma alta de 2,63% na semana. O Ibovespa subiu 0,66%, impulsionado por ações de varejistas e petroleiras.", "titulo_pt": "Dólar fecha estável a R$ 5,65, mas sobe 2,63% na semana", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 262688, "titulo": "Dólar fecha a R$ 5,65 e mantém patamar de maior cotação do ano", "url": "https://veja.abril.com.br/economia/dolar-fecha-a-r-565-e-mantem-patamar-de-maior-cotacao-do-ano/", "fonte_id": "veja", "data_pub": "2026-11-13T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar encerrou o dia cotado a R$ 5,65, mantendo o patamar de maior cotação do ano. O Ibovespa também apresentou leve alta, influenciado pelos preços do petróleo.", "titulo_pt": "Dólar fecha a R$ 5,65 e mantém maior cotação do ano, ibovespa sobe com petróleo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 263069, "titulo": "AI risks are the biggest threat to the financial system, Fed survey finds", "url": "https://www.cnbc.com/2026/11/13/ai-risks-financial-system-federal-reserve.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-13T21:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório da pesquisa do Federal Reserve indica que os riscos associados à inteligência artificial são considerados a maior ameaça para o sistema financeiro. Com a Wall Street preocupada com as gigantes da IA em expansão rápida e as comunidades alertadas pela rápida disseminação de centros de dados, a situação é vista com preocupação.", "titulo_pt": "Riscos de IA são a maior ameaça ao sistema financeiro, segundo pesquisa do Fed", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 262600, "titulo": "Falha da Microsoft expõe dependência global de big techs", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/11/falha-da-microsoft-expoe-dependencia-global-de-big-techs.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Governos, empresas e serviços públicos em mais de 70 países foram afetados por uma falha digital na Microsoft nesta semana. A companhia trabalha para restabelecer os serviços após a interrupção que atingiu milhões de usuários.", "titulo_pt": "Falha da Microsoft afeta mais de 70 países", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 262602, "titulo": "É possível investir em ações internacionais sem apostar no dólar?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/11/e-possivel-investir-em-acoes-internacionais-sem-apostar-no-dolar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "É possível investir em ações internacionais sem se preocupar com a valorização do dólar. As decisões de investir em empresas estrangeiras e na moeda podem ser separadas.", "titulo_pt": "É possível investir em ações internacionais sem apostar no dólar?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 262604, "titulo": "ONS reduz projeção de crescimento da carga de energia em novembro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/ons-reduz-projecao-de-crescimento-da-carga-de-energia-em-novembro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ONS projetou um crescimento de 6,5% na carga de energia em novembro, em comparação com o mesmo período do ano anterior, uma redução em relação à previsão anterior de 7,2%. A estimativa para a carga de energia é de 87.450 megawatts médios.", "titulo_pt": "ONS diminui projeção de crescimento da carga de energia em novembro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 262901, "titulo": "TE H2 Chile desiste de su megaproyecto de hidrógeno y amoníaco verde de US$16.000 millones", "url": "https://www.latercera.com/pulso/noticia/te-h2-chile-desiste-del-proyecto-de-hidrogeno-y-amoniaco-verde-de-us16000-millones/", "fonte_id": "la_tercera", "data_pub": "2026-11-13T20:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O projeto 'Proyecto de Producción de Hidrógeno y Amoniaco Verde - H2 Magallanes' teve sua tramitação ambiental iniciada em maio do ano anterior, mas foi desistido pelo Chile. O projeto previa um investimento de US$16 bilhões.", "titulo_pt": "Chile desiste de seu megaprojeto de hidrogênio e amônio verde de US$16 bilhões", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 262606, "titulo": "Caixa revê risco no campo e renegocia dívidas após avanço da inadimplência", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/caixa-reve-risco-no-campo-e-renegocia-dividas-apos-avanco-da-inadimplencia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Caixa Econômica Federal aumentou as provisões para perdas com empréstimos e reduziu a concessão de crédito ao agronegócio devido ao aumento da inadimplência, que atingiu 25,44% em setembro.", "titulo_pt": "Caixa reavalia risco no campo e renegocia dívidas após avanço da inadimplência", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 262621, "titulo": "Confiança da indústria atinge menor nível desde maio de 2020", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/confianca-da-industria-atinge-menor-nivel-desde-maio-de-2020", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-13T20:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A confiança dos empresários industriais no Brasil atingiu o menor nível desde maio de 2020, caindo para 40,2 pontos em novembro. O Icei registrou a terceira maior queda mensal desde 2010, indicando um pessimismo prolongado no setor.", "titulo_pt": "Confiança industrial atinge menor nível desde maio de 2020", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 262911, "titulo": "Pese al alza en los combustibles, Chile sigue siendo uno de los países con menor inflación en Sudamérica", "url": "https://www.latercera.com/pulso/noticia/chile-sigue-siendo-uno-de-los-paises-con-menor-inflacion-en-sudamerica/", "fonte_id": "la_tercera", "data_pub": "2026-11-13T20:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Chile mantém uma inflação de 4,5% em 12 meses, sendo o último colocado entre os países sudamericanos analisados. Paraguay e Ecuador apresentam menores taxas de inflação, com 1,7% e 1,34% respectivamente.", "titulo_pt": "Embora os combustíveis aumentem, Chile é um dos países com menor inflação na américa do sul", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 262607, "titulo": "Galípolo afirma ter 'desafio pedagógico' de explicar política monetária e diz que 'verdade custa caro'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/galipolo-afirma-ter-desafio-pedagogico-de-explicar-politica-monetaria-e-diz-que-verdade-custa-caro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T20:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Gabriel Galípolo, presidente do Banco Central, afirmou ter um desafio pedagógico na explicação da política monetária desde que assumiu o cargo. Ele criticou especialistas que comentam o cenário econômico nas redes sociais, afirmando que é 'custoso ir atrás da verdade'.", "titulo_pt": "Galípolo diz ter 'desafio pedagógico' de explicar política monetária e critica especialistas de vídeos nas redes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 262344, "titulo": "EU leaders seek to tackle challenges in first AI summit", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/14/2003867714", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes europeus se reuniram em uma primeira cúpula sobre IA para abordar desafios relacionados à tecnologia. O objetivo é discutir como enfrentar questões relacionadas à inteligência artificial na região.", "titulo_pt": "Líderes europeus buscam enfrentar desafios em primeira cúpula sobre IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262357, "titulo": "Chip suppliers shrug off Huang’s exit", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/14/2003867695", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas fornecedoras de chips não se preocuparam com a saída de Huang. Não há detalhes adicionais sobre o impacto ou as razões para a saída.", "titulo_pt": "Fornecedores de chips ignoram saída de Huang", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262359, "titulo": "Lutnick faces chip export scrutiny", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/14/2003867697", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa enfrenta uma revisão das exportações de chips. O foco está na análise dos processos de exportação de componentes eletrônicos.", "titulo_pt": "Lutnick enfrenta revisão de exportação de chips", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262360, "titulo": "Rugged computer demand to lift Getac sales next year", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/14/2003867698", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A demanda por computadores resistentes deve aumentar as vendas da Getac no próximo ano.", "titulo_pt": "Demanda por computadores resistentes deve impulsionar vendas da Getac no ano próximo", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262362, "titulo": "Soft sell", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/14/2003867700", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto trata de uma técnica de venda suave, sem fornecer detalhes adicionais.", "titulo_pt": "Suave venda", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 262942, "titulo": "Why the left and right are both cheering Jensen Huang’s downfall", "url": "https://www.vox.com/politics/510820/jensen-huang-nvidia-critics-hawks-populists-ai-safety", "fonte_id": "vox", "data_pub": "2026-11-13T21:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A queda repentina do ex-presidente da Nvidia, Jensen Huang, é surpreendente considerando sua riqueza, fama global e papel de liderança na empresa mais valiosa do mundo até recentemente. No entanto, sua influência significativa em Washington, especialmente durante o governo de Donald Trump, tem sido controversa entre um grupo diverso de pessoas.", "titulo_pt": "Por que a esquerda e a direita estão comemorando o desastre de Jensen Huang", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 263126, "titulo": "FAA Grounds All US Flights Until Further Notice", "url": "https://www.wired.com/story/faa-grounds-all-us-flights-until-further-notice/", "fonte_id": "wired", "data_pub": "2026-11-13T21:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo americano determinou a suspensão de todos os voos nos Estados Unidos devido a falhas de comunicação em sistemas de controle do tráfego aéreo em todo o país, em anúncio feito na sexta-feira.", "titulo_pt": "FAA suspende todos os vôos nos EUA até novo comunicado", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 263101, "titulo": "US aviation regulator grounds all departing flights", "url": "https://www.ft.com/content/c9b119ff-d1da-46a7-b2b3-4ad0544fff6b?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-13T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Administração Federal de Aviação dos Estados Unidos ordenou a suspensão de todas as operações de decolagem em aeroportos do país. Essa decisão levou aeroportos a fechar suas operações.", "titulo_pt": "Regulador aeroportuário dos EUA suspende todas as saídas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 263108, "titulo": "Flights grounded across US due to ‘extraordinary circumstances’, FAA says", "url": "https://www.scmp.com/news/world/united-states-canada/article/3374411/flights-stopped-across-us-due-extraordinary-circumstances-faa-says", "fonte_id": "scmp", "data_pub": "2026-11-13T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Federal Aviation Administration (FAA) suspendeu todas as operações aeronáuticas nos Estados Unidos devido a problemas de comunicação em 22 centros de controle regional de tráfego aéreo. A suspensão foi implementada com o objetivo de garantir a segurança dos voos.", "titulo_pt": "Voo suspendido em todo os EUA devido a circunstâncias extraordinárias", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 263066, "titulo": "Nvidia is done with Jensen Huang. The fallout in Washington is just beginning", "url": "https://www.cnbc.com/2026/11/13/nvidia-jensen-huang-washington-congress.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-13T21:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Congresso norte-americano, liderado pelos republicanos, deseja que Jensen Huang, CEO da Nvidia, visite Washington antes que os democratas assumam o controle no início de 2023.", "titulo_pt": "Nvidia despediu-se de Jensen Huang. As consequências em Washington estão apenas começando.", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 263106, "titulo": "Amazon revives deal with troubled data centre venture backed by Rick Perry", "url": "https://www.ft.com/content/692fbfe8-da52-42c0-b436-9c4aff21fbdb?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-13T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Amazon concordou em ser o locatário-padrão do data center após falhas nas negociações e turbulências no boardroom que levaram à queda das ações da empresa. O projeto de data center tem como fundador Rick Perry.", "titulo_pt": "Amazon reativa acordo com empreendimento de data center com Rick Perry", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 262702, "titulo": "Quase 60% dos brasileiros entre 50 e 60 anos já utilizam inteligência artificial, aponta pesquisa", "url": "https://veja.abril.com.br/brasil/quase-60-dos-brasileiros-entre-50-e-60-anos-ja-utilizam-inteligencia-artificial-aponta-pesquisa/", "fonte_id": "veja", "data_pub": "2026-11-13T20:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que quase 60% das pessoas entre 50 e 60 anos no Brasil já utilizam inteligência artificial. A presença delas nas redes e aplicativos bancários está se aproximando dos níveis observados nas gerações mais jovens.", "titulo_pt": "Quase 60% dos brasileiros entre 50 e 60 anos já usam inteligência artificial, aponta pesquisa", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 262832, "titulo": "A bolha do setor de IA está próxima de estourar?", "url": "https://www.dw.com/pt-br/a-bolha-do-setor-de-ia-está-próxima-de-estourar/a-79944193?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-13T19:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A abertura de capital da Anthropic e a ocorrência de liquidações de ações de empresas de inteligência artificial estão levantando dúvidas sobre a saúde do setor. No entanto, ainda há quem veja motivos para euforia no setor de inteligência artificial.", "titulo_pt": "A bolha do setor de IA está próxima de estourar?", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 263104, "titulo": "Anthropic’s Amodei ‘not super fussed’ about market turmoil ahead of IPO", "url": "https://www.ft.com/content/4b7b83d7-7fea-4ce2-bfe3-4f2cf75b1d82?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-13T19:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da empresa de laboratório de IA Anthropic, Amodei, não se preocupa com a volatilidade do mercado de tecnologia a menos de uma semana antes da esperada lista na bolsa com uma avaliação de US$ 1,5 trilhão.", "titulo_pt": "Amodei da anthropic não se preocupa com turbulência do mercado antes da IPO", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 263129, "titulo": "Microsoft 365 Crawls Back to Life After a 24-Hour Outage", "url": "https://www.wired.com/story/microsoft-365-crawls-back-to-life-after-a-24-hour-outage/", "fonte_id": "wired", "data_pub": "2026-11-13T19:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microsoft relata que um erro de atualização, e não uma cyberataque ou inteligência artificial, foi responsável pelo colapso temporário de seus servidores em todo o mundo.", "titulo_pt": "Microsoft 365 se recupera após falha de 24 horas", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 263130, "titulo": "How Microcredentials Help Engineers Build Trustworthy AI", "url": "https://spectrum.ieee.org/microcredentials-trustworthy-ai", "fonte_id": "ieee_spectrum", "data_pub": "2026-11-13T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Equipes de engenharia estão avançando rapidamente na integração de inteligência artificial, mas enfrentam um novo desafio significativo: questões de conformidade. Traduzir princípios éticos de IA, governança e auditoria para fluxos de trabalho operacionais diários se tornou um dos maiores desafios da indústria.", "titulo_pt": "Como microcredenciais ajudam engenheiros a construir IA confiável", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 263131, "titulo": "Modified $450 3D printer builds living materials with more than 100 layers", "url": "https://phys.org/news/2026-11-3d-printer-materials-layers.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um modificador de impressora 3D de US$ 450 é capaz de criar materiais vivos com mais de 100 camadas, permitindo escolher as células que compõem o material e suas formas 3D finais. Dependendo das bactérias incluídas na impressão, o material pode ser usado para limpar água contaminada ou decompor materiais como plástico.", "titulo_pt": "Impressora 3D modificada de us$ 450 constrói materiais vivos com mais de 100 camadas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 263149, "titulo": "STAT+: Democrats coalesce around ‘Medicare for More,’ ‘Medikids’ proposals", "url": "https://www.statnews.com/2026/11/13/democrats-eye-medicare-for-more-vs-medicare-for-all/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-13T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os democratas estão se unindo ao redor de um plano que oferece Medicare a mais americanos, embora ainda não a todos.", "titulo_pt": "Democratas se unem em torno de propostas de 'Medicare for More' e 'Medikids'", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 263132, "titulo": "Genomic analysis restores species status to 12 overlooked Great Barrier Reef corals", "url": "https://phys.org/news/2026-11-genomic-analysis-species-status-overlooked.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo internacional de cientistas, em colaboração com o projeto CoralBank do Museu da Queensland, descobriu diversidade genômica oculta em corais da costa leste da Austrália, revelando que 12 corais anteriormente considerados variantes de outras espécies são espécies distintas.", "titulo_pt": "Análise genômica restaura status de espécie a 12 corais ignorados do Reef do grande Barrier", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 263170, "titulo": "On this day in space! Nov. 13, 1971: NASA's Mariner 9 becomes 1st spacecraft to orbit Mars, revealing close looks at the Martian surface", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-13-2026", "fonte_id": "space_com", "data_pub": "2026-11-13T21:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 13 de novembro de 1971, o Mariner 9 se tornou o primeiro foguete espacial a orbitar Marte, fornecendo visões detalhadas da superfície do planeta.", "titulo_pt": "13 De novembro de 1971: Mariner 9, primeiro foguete a orbitar marte", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 263133, "titulo": "Common ADHD classroom accommodations may not help students succeed, study finds", "url": "https://phys.org/news/2026-11-common-adhd-classroom-accommodations-students.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da Florida International University (FIU) sugere que algumas das estratégias mais comuns de adaptação para alunos com transtorno de déficit de atenção e hiperatividade (ADHD) na sala de aula, como prazos de entrega mais longos e lugares tranquilos para trabalhar, podem não estar sendo eficazes. O estudo questiona se essas acomodações estão realmente auxiliando os alunos a se saírem melhor.", "titulo_pt": "Acomodações comuns para alunos com ADHD podem não estar ajudando na escola, sugere estudo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 263134, "titulo": "Happy face, angry voice: Human–dog interaction study tracks conflicting cues", "url": "https://phys.org/news/2026-11-happy-angry-voice-humandog-interaction.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostram que os cães respondem de maneira diferente às expressões emocionais humanas, comprovando que, após milhares de anos ao lado dos humanos, eles são altamente sensíveis a nossas emoções.", "titulo_pt": "Rosto feliz, voz zangada: estudo sobre interação humano-cão identifica sinais contraditórios", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 263171, "titulo": "60 years ago the Leonid meteor shower produced 144,000 meteors per hour. Could it happen again?", "url": "https://www.space.com/stargazing/meteor-showers/60-years-ago-the-leonid-meteor-shower-produced-144-000-meteors-per-hour-could-it-happen-again", "fonte_id": "space_com", "data_pub": "2026-11-13T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há 60 anos, a chuva de meteoros Leonídeos produziu uma das mais espetaculares tempestades de meteoros registradas. O pico em 2026 promete repetir essa exibição astronômica.", "titulo_pt": "Há 60 anos a chuva de meteoros leonídeos produziu 144.000 meteoros por hora. Poderia acontecer novamente em 2026?", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 263150, "titulo": "New addiction society guidance on medetomidine’s brutal withdrawal", "url": "https://www.statnews.com/2026/11/13/medetomidine-withdrawal-asam-new-treatment-guidance/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-13T20:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Sociedade Americana de Medicina da Adicção lançou a primeira orientação nacional para reconhecer e tratar pacientes que utilizaram medetomidina. Essa orientação visa auxiliar profissionais de saúde na identificação e no manejo desses casos.", "titulo_pt": "Nova orientação nacional sobre o tratamento de dependência de medetomidina", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 262694, "titulo": "A medicina do futuro tem de chegar antes da doença", "url": "https://veja.abril.com.br/coluna/coluna-claudio-lottenberg/a-medicina-do-futuro-tem-de-chegar-antes-da-doenca/", "fonte_id": "veja", "data_pub": "2026-11-13T20:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A medicina do futuro deve se focar na prevenção antes do tratamento. A cultura da prevenção é essencial para a sustentabilidade dos sistemas de saúde.", "titulo_pt": "A medicina do futuro tem de chegar antes da doença", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 263135, "titulo": "A perfect couple: Chromium keeps ruthenium grounded in water electrolysis", "url": "https://phys.org/news/2026-11-couple-chromium-ruthenium-grounded-electrolysis.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo realizado pela ICFO demonstra que a combinação de cromígio e ruthenio pode ser eficiente em eletrólise de água, com o cromígio ajudando a estabilizar o ruthenio, impedindo sua oxidação excessiva. Ruthenio, um catalisador atômico usado para acelerar a eletrólise de água, tende a se oxidar e dissolver durante a operação.", "titulo_pt": "O casal perfeito: cromígio mantém o ruthenio no chão na eletrólise de água", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 263136, "titulo": "A newly discovered South African dinosaur was a heavyweight even as a youngster", "url": "https://phys.org/news/2026-11-newly-south-african-dinosaur-heavyweight.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nyana rooiwalensis é uma nova espécie de dinossauro descoberta na África do Sul que vivia há mais de 200 milhões de anos. Embora ainda jovem, ela pesava cerca de 400 quilogramas e provavelmente se movia em duas pernas.", "titulo_pt": "Novo dinossauro sul-africano era pesado mesmo jovem", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 263137, "titulo": "Molecular sensor makes invisible traces of mercury easier to see", "url": "https://phys.org/news/2026-11-molecular-sensor-invisible-mercury-easier.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um sensor molecular facilita a detecção de tracés de mercúrio, que de outra forma seriam invisíveis. Detectar níveis minúsculos de mercúrio geralmente requer equipamentos especializados e profissionais treinados.", "titulo_pt": "Sensor molecular torna visíveis tracés de mercúrio", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 263172, "titulo": "'Arrival' at 10: Denis Villeneuve's alien visitation classic that reminded us it's good to talk", "url": "https://www.space.com/entertainment/space-movies-shows/arrival-at-10-the-denis-villeneuve-alien-visitation-classic-that-reminded-us-its-good-to-talk", "fonte_id": "space_com", "data_pub": "2026-11-13T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme 'Chegada', dirigido por Denis Villeneuve, transformou uma história curta menos conhecida em uma das melhores produções de ficção científica do século XXI. O longa, que destacou a importância do diálogo, se tornou um clássico da categoria.", "titulo_pt": "Chegada aos 10: clássico de ficção científica que nos lembra da importância de conversar", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 263173, "titulo": "Rocket Lab launching 100th space mission early on Nov. 14: Watch it live", "url": "https://www.space.com/space-exploration/launches-spacecraft/rocket-lab-100th-launch-iqps-electron-sar-satellite", "fonte_id": "space_com", "data_pub": "2026-11-13T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Rocket Lab lançará sua 100ª missão espacial pouco depois da meia-noite no sábado (14 de novembro), e o público pode assistir ao lançamento histórico ao vivo.", "titulo_pt": "Rocket Lab lançará 100ª missão espacial: assista ao vivo", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 263138, "titulo": "Fruit fly sleep protein yields peptides that inhibit drug-resistant bacteria in lab tests", "url": "https://phys.org/news/2026-11-fruit-fly-protein-yields-peptides.html", "fonte_id": "phys_org", "data_pub": "2026-11-13T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Tsukuba e instituições colaboradoras identificaram pequenos peptídeos antimicrobianos derivados da proteína Nemuri, responsável pelo sono na mosca-d'frute Drosophila melanogaster. Os resultados foram publicados na revista Nature Communications.", "titulo_pt": "Proteína do sono da mosca-d'frute produz peptídeos que inibem bactérias resistentes a medicamentos em testes de laboratório", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 263174, "titulo": "California's brand-new Air & Space Center, home of the space shuttle Endeavour, opens today", "url": "https://www.space.com/space-exploration/californias-brand-new-air-and-space-center-home-of-the-space-shuttle-endeavour-opens-today", "fonte_id": "space_com", "data_pub": "2026-11-13T19:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O novo Samuel Oschin Air & Space Center, localizado no California Science Center e que abriga a nave espacial Endeavour da NASA, foi oficialmente inaugurado ao público hoje, 13 de novembro.", "titulo_pt": "Novo centro de espaço e aeronáutica do california science Center abre oficialmente", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 262356, "titulo": "Changes incoming", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/14/2003867734", "fonte_id": "taipei_times", "data_pub": "2026-11-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há mudanças a caminho, mas sem detalhes específicos sobre o que está para acontecer.", "titulo_pt": "Mudanças em curso", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 263196, "titulo": "Production Designer Ruth De Jong on How To Build (Ancient) Worlds for Auteurs", "url": "https://www.indiewire.com/features/craft/production-designer-ruth-de-jong-the-odyssey-interview-1235227809/", "fonte_id": "indiewire", "data_pub": "2026-11-13T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ruth De Jong, produtora de design de arte, conversa com IndieWire sobre o processo criativo por trás de 'Odisseia', bem como seus projetos para diretores como David Lynch, Paul Thomas Anderson e Terrence Malick.", "titulo_pt": "Produtora De arte Ruth De Jong sobre a odisséia De construir mundos antigos para Auteurs", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 262871, "titulo": "De edificios históricos a .com/tribal-groups-urge-congress-to-halt-bill-that-threatens-sacred-sites/", "fonte_id": "hyperallergic", "data_pub": "2026-11-13T20:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos tribais estão pedindo ao Congresso para impedir um projeto de lei que ameaça sites sagrados. O Projeto Bipartidário de Afinidade Americana e Criação de Postos de Trabalho aceleraria a aprovação de grandes projetos e poderia impactar a soberania indígena sobre terras culturalmente significativas.", "titulo_pt": "Grupos tribais urgem congresso a suspender projeto que ameaça Sites sagrados", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 263164, "titulo": "Long-Lost Charles Le Brun Painting Returns to the New Palace in Potsdam", "url": "https://www.artnews.com/art-news/news/lost-charles-le-brun-painting-returned-new-palace-potsdam-1234805935/", "fonte_id": "artnews", "data_pub": "2026-11-13T20:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um trabalho do século XVII, uma representação de uma criança Cristo dormindo com a Santa Família, desapareceu em 1945 e recentemente retornou ao Palácio Novo em Potsdam.", "titulo_pt": "Pintura perdida de Charles Le Brun retorna ao palácio novo em Potsdam", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 263159, "titulo": "The Alchemical Possibilities of an Artist-Poet Collaboration", "url": "https://hyperallergic.com/the-alchemical-possibilities-of-an-artist-poet-collaboration/", "fonte_id": "hyperallergic", "data_pub": "2026-11-13T20:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quatro décadas depois, El Museo del Barrio reprisa a exposição de Papo Colo 'Octopus and Others', que combinava texto e imagens.", "titulo_pt": "As possibilidades alquímicas de uma colaboração entre artista e poeta", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}], "cultura__eventos": [], "sociedade": [{"id": 262342, "titulo": "Legislature passes parent
