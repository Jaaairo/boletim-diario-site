xual infantil entre 2001 e 2021", "url": "https://www.cnnbrasil.com.br/internacional/italia-prendeu-57-padres-por-abuso-sexual-infantil-entre-2001-e-2021/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-25T21:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entre 2001 e 2021, 57 padres foram presos na Itália por abuso sexual infantil. Um relatório encomendado pela Conferência Episcopal Italiana registra 880 incidentes de abuso envolvendo 356 supostos agressores e 385 vítimas nesse período.", "titulo_pt": "Itália prendeu 57 padres por abuso sexual infantil entre 2001 e 2021", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 287700, "titulo": "ONG acusa Israel de dificultar nascimentos em Gaza", "url": "https://veja.abril.com.br/mundo/ong-acusa-israel-de-dificultar-nascimentos-em-gaza/", "fonte_id": "veja", "data_pub": "2026-11-25T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma ONG acusa Israel de limitar os nascimentos em Gaza através de restrições à saúde reprodutiva das mulheres palestinas. A ONU alerta para violações cada vez mais sistemáticas no território.", "titulo_pt": "ONG acusa Israel de dificultar nascimentos em Gaza", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 287627, "titulo": "Brasil lidera ranking de feminicídios na América Latina e Caribe", "url": "https://www.dw.com/pt-br/brasil-lidera-ranking-de-feminicídios-na-américa-latina-e-caribe/a-80052515?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-25T19:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil lidera o ranking de feminicídios na América Latina e Caribe, com 1.453 casos em um ano. Em 26 países e territórios analisados, pelo menos 11 mulheres são mortas por dia por motivos de gênero.", "titulo_pt": "Brasil lidera ranking de feminicídios na América Latina e Caribe", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 287905, "titulo": "Tortured into confessing: Report exposes abusive Israeli interrogation of Palestinians", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/tortured-confessing-report-exposes-abusive-israeli-interrogation", "fonte_id": "middle_east_eye", "data_pub": "2026-11-25T19:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2021, a polícia israelense prendeu um homem palestiniano conhecido como R, que após várias sessões de tortura assinou um documento de confissão por um crime que não cometeu. Segundo um relatório do Public Committee Against Torture in Israel (PCATI), centenas de palestinos passaram por processos criminais com base em confissões extraídas sob coação.", "titulo_pt": "Forçado a confessar: relatório denuncia tortura na interrogatória de palestinos por parte da israelense", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 287681, "titulo": "Ministra Marín anuncia proyecto de ley para fortalecer la protección frente a la violencia sexual digital", "url": "https://www.latercera.com/nacional/noticia/ministra-marin-anuncia-proyecto-de-ley-para-fortalecer-la-proteccion-frente-a-la-violencia-sexual-digital/", "fonte_id": "la_tercera", "data_pub": "2026-11-25T18:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ministra Marín anunciou um projeto de lei para fortalecer a proteção contra a violência sexual digital, incluindo penas mais severas para o compartilhamento não consentido de conteúdo íntimo. O ministério também lançou uma campanha para prevenir a violência de gênero.", "titulo_pt": "Ministra Marín anuncia projeto de lei para fortalecer proteção contra violência sexual digital", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 287120, "titulo": "Why did Israel arrest human rights defender Ghassan Al Najjar?", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/25/why-did-israel-arrest-human-rights-defender-ghassan-al-najjar?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-25T16:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O agricultor palestino e defensor dos direitos humanos Ghassan Al Najjar foi detido pelas forças israelenses.", "titulo_pt": "Por que Israel deteve o defensor dos direitos humanos Ghassan Al Najjar?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 286664, "titulo": "Execuções, chibatadas, perseguição: Arábia Saudita redobra repressão a dissidentes", "url": "https://www.dw.com/pt-br/execuções-chibatadas-perseguição-arábia-saudita-redobra-repressão-a-dissidentes/a-80044727?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-25T15:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Arábia Saudita intensificou a repressão a dissidentes em 2026, com mais de 200 execuções, aplicações de chibatadas e uma perseguição crescente contra vozes críticas. A situação dos direitos humanos no país se deteriorou, ocorrendo no contexto de conflitos no Irã.", "titulo_pt": "Execuções, chicotadas e perseguição: arábia Saudita intensifica repressão a dissidentes", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 287292, "titulo": "PAHO calls for stronger health sector response to violence against women and girls", "url": "https://www.paho.org/en/news/25-11-2026-paho-calls-stronger-health-sector-response-violence-against-women-and-girls", "fonte_id": "paho", "data_pub": "2026-11-25T14:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PAHO está pedindo uma resposta mais forte do setor de saúde para lidar com a violência contra mulheres e meninas. O chamado foi feito em 25 de novembro de 2026.", "titulo_pt": "PAHO solicita resposta mais forte do setor de saúde para violência contra mulheres e meninas", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 287321, "titulo": "Three months on from Nepal's devastating floods, thousands of children face a new threat: winter", "url": "https://www.unicef.org/press-releases/three-months-nepals-devastating-floods-thousands-children-face-new-threat-winter", "fonte_id": "unicef", "data_pub": "2026-11-25T12:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três meses após as devastadoras inundações em Nepal, milhares de crianças enfrentam um novo risco: o inverno. O UNICEF pede apoio urgente para ajudar crianças e famílias a permanecerem quentes, saudáveis e seguras à medida que as temperaturas caem.", "titulo_pt": "Três meses após inundações devastadoras em Nepal, crianças enfrentam novo risco: inverno", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 286859, "titulo": "Sri Lankan asylum seeker killed himself after being sent by UK to Eswatini", "url": "https://www.theguardian.com/uk-news/2026/nov/25/sri-lanka-asylum-seeker-convicted-sexual-assault-uk-kills-himself-eswatini", "fonte_id": "guardian_world", "data_pub": "2026-11-25T11:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kishanth Peramalya, um requerente de asilo sri-lanquês condenado por assédio sexual, foi enviado pelo Reino Unido para Eswatini, onde não tinha conexões, e se suicidou. Ele fazia parte de um grupo que saiu da Índia com o objetivo de chegar ao Canadá e pedir asilo lá.", "titulo_pt": "Sri lankês condenado por assédio sexual se suicida após ser enviado pelo reino unido para Eswatini", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 286863, "titulo": "China misusing Interpol to target dissidents, says leading UK lawyer", "url": "https://www.theguardian.com/world/2026/nov/25/china-misusing-interpol-target-dissidents-uk-lawyer", "fonte_id": "guardian_world", "data_pub": "2026-11-25T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um advogado britânico especializado em 'notas vermelhas' da Interpol afirma que a China está usando indevidamente o sistema para perseguir e silenciar dissidentes. Essa prática ocorre enquanto Hong Kong prepara-se para sediar a assembleia geral da organização policial pela primeira vez.", "titulo_pt": "Advogado britânico afirma que china está usando Interpol para perseguir dissidentes", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 286984, "titulo": "Trump faces looming wave of ICE lawsuits", "url": "https://www.axios.com/2026/11/25/lawsuit-dhs-ice-operation-midway-blitz-figueroa", "fonte_id": "axios", "data_pub": "2026-11-25T10:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump enfrenta a primeira das possivelmente centenas de ações judiciais que testarão se ele pode ser responsabilizado pelo comportamento dos agentes de imigração durante as operações da ICE. A Advocacy Litigation Não-Profit Democracy Forward apresentou a primeira ação sob a Lei Federal de Reivindicações de Acidente (FTCA) em favor de Dayanne Figueroa, uma cidadã dos EUA que foi detida durante uma operação da ICE.", "titulo_pt": "Trump enfrenta onda de ações judiciais contra ICE", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 286199, "titulo": "Ebola tied to rising violence against women and girls in Congo, UNICEF says", "url": "https://www.japantimes.co.jp/news/2026/11/25/world/science-health/ebola-violence-women-congo-unicef/", "fonte_id": "japan_times", "data_pub": "2026-11-25T07:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A UNICEF associa a epidemia de Ebola a um aumento da violência contra mulheres e meninas na República Democrática do Congo. O Ebola já causou mais de 5.800 mortes desde maio.", "titulo_pt": "Ebola relacionado a aumento da violência contra mulheres e meninas na Congo, diz UNICEF", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 286250, "titulo": "Migrant who became a symbol in Trump crackdown leaves US voluntarily", "url": "https://www.scmp.com/news/world/united-states-canada/article/3375712/migrant-who-became-symbol-trump-crackdown-leaves-us-voluntarily", "fonte_id": "scmp", "data_pub": "2026-11-25T06:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kilmar Abrego Garcia, um salvadorenho que se tornou um símbolo da oposição à repressão migratória de Donald Trump, deixou voluntariamente os Estados Unidos para a Espanha. A saída de Abrego Garcia, de 31 anos, encerra um caso legal que chegou ao Supremo Tribunal dos EUA.", "titulo_pt": "Migrante que se tornou símbolo da repressão migratória de Trump deixa EUA voluntariamente", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 286313, "titulo": "Prosecutors seek lengthy prison sentences for pastor, grandmother in fatal abuse of boy", "url": "https://en.yna.co.kr/view/AEN20261125005700315", "fonte_id": "yonhap_news", "data_pub": "2026-11-25T05:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Procuradores em Cheonan, Coreia do Sul, pediram penas de prisão prolongada para um pastor e uma avó acusados de maus-tratos fatais a um menino.", "titulo_pt": "Procuradores pedem penas longas para pastor e avó em caso de maus-tratos fatais a menino", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 286208, "titulo": "Prosecutors seek death penalty for 79-year-old man over couple’s murder and arson", "url": "https://www.japantimes.co.jp/news/2026/11/25/japan/crime-legal/chiba-murder-arson-trial/", "fonte_id": "japan_times", "data_pub": "2026-11-25T04:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de 79 anos é acusado de ter esfaqueado uma casal e incendiado várias casas em Chiba, Prefeitura de 2024, destruindo um total de oito prédios.", "titulo_pt": "Procuradores buscam pena capital para homem de 79 anos por assassinato e arromatização", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 287188, "fonte_id": "taipei_times", "titulo": "US report warns of Chinese AI persona t     : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
