<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "21/11/2026 19:58", "stats": {"noticias_novas": 369, "resumos_gerados": 210}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A vitória de Lula na eleição presidencial, segundo o ministro Fernando Haddad, simboliza a defesa da democracia no Brasil. Lula criticou os agentes do mercado financeiro, chamando-os de 'yuppies', e disse que pretende aumentar a participação popular no planejamento orçamentário. O ex-presidente Jair Bolsonaro, por sua vez, está internado em uma Unidade de Terapia Intensiva (UTI) em Brasília, diagnosticado com abdome agudo obstrutivo, sem previsão de alta. O governo do Distrito Federal planeja usar a estrutura montada para o festival com shows da posse do presidente Lula para realizar uma festa de Réveillon em Brasília. A 31ª Conferência das Nações Unidas sobre Mudança do Clima (COP31) prorrogou-se no sábado (21) sem consenso sobre o tema dos combustíveis fósseis, com críticas à falta de avanço nas negociações.", "mundo": "A COP31 foi prorrogada devido à falta de acordo entre os países participantes. Durante as negociações tensas, Donald Trump e Vladimir Putin posaram juntos na China, com Trump chamando o russo de 'meu amigo', o que gerou críticas na Europa. Na Ucrânia, mísseis balísticos de origem russa atingiram a cidade natal, levando o presidente Volodymyr Zelensky a reafirmar a intenção de se juntar à NATO. A Conmebol possui R$ 88 milhões em uma conta do Ueno Bank, liquidado no Paraguai, o que levanta preocupações sobre a gestão financeira da confederação. Além disso, os cortes de cabelo em todo o país na França reuniram mais de 82 mil pessoas, com tensões registradas em várias cidades.\n\nA tensão geopolítica continua a crescer, com ataques e operações militares em diversos locais. No Golfo Pérsico, o Irã intensificou suas ações, atacando bases americanas no Bahrain e o estreito de Hormuz, enquanto os Estados Unidos responderam com operações contra o grupo houthi na Arábia Saudita. No Mar Báltico, um navio russo foi deixado à deriva após um ataque com drones, levando a Finlândia a adotar restrições temporárias de tráfego. No México, a prisão de 'El Chapo Isidro', um dos mais procurados pelo FBI, resultou em violência e confrontos fatais entre as forças de segurança e os criminosos em Sinaloa. O presidente dos Estados Unidos, Donald Trump, reafirmou seu compromisso com um acordo permanente para impedir que o Irã obtenha armas nucleares, enquanto a Rússia intensificou seus ataques a Ucrânia, resultando em mortes em Kiev. As tensões regionais e internacionais continuam elevadas, com ações militares, ataques e operações policiais que refletem as complexas relações entre as potências globais.", "economia": "O Brasil está à frente na construção de data centers na região, com a construção de um novo edifício e a possibilidade de mais dois serem erguidos em Vinhedo, São Paulo, de acordo com a Folha Mercado. O país está concorrendo pela liderança na atração desses data centers, investindo em uma matriz elétrica renovável e em um mercado em expansão para atrair investimentos de grandes empresas de tecnologia globais. A Amazon está próxima de concluir a aquisição da startup Decart por US$ 7,5 bilhões, com o objetivo de melhorar suas operações de inteligência artificial, informa a Folha Mercado. A compra visa permitir que a empresa concorra com a Nvidia no mercado de tecnologias de IA. Além disso, a União Europeia (UE) e a Indonésia assinaram um acordo que elimina 98,5% das tarifas comerciais, reduzindo os custos de tarifas para os exportadores da UE em cerca de 650 milhões de euros por ano, conforme informado pelo Infomoney.", "tecnologia": "A tecnologia enfrenta diversos desafios e avanços em diversos setores. A Caoa Changan, que iniciou suas operações no Brasil em abril de 2026, está oferecendo veículos no mercado nacional com preços variados. Em um desenvolvimento controverso, a Amazon está contestando o New York City Council e a Delivery Protection Act, que poderia adicionar custos significativos a seus pedidos. A Signal está limitando a capacidade de seus usuários de fazerem capturas de tela, reagindo a uma ameaça existencial relacionada à vigilância por inteligência artificial. A Nvidia, por sua vez, apresenta um retrato ambíguo: um relatório financeiro positivo em contraste com declarações públicas de seus executivos. O Google lançou um recurso que permite aos usuários consultar e apagar informações pessoais armazenadas pela inteligência artificial do Gemini, refletindo preocupações crescentes com a privacidade. O Brasil tem potencial para se tornar um polo global de data centers, de acordo com a The Economist, devido à presença de energia renovável e cabos submarinos, embora problemas na rede elétrica e disputas internacionais possam frear essa expansão. A tecnologia também enfrenta desafios legais, como o hackeamento do USDA e do FBI, e questões éticas, como a negociação de chips entre executivos da Nvidia e a discussão sobre armas autônomas na ONU. Além disso, a governança de IA é uma preocupação crescente, com potenciais falhas que podem comprometer a adoção da tecnologia em empresas.", "ciencia": "Um matemático da Anthropic, Levent Alpöge, em colaboração com o assistente de inteligência artificial Claude, alega ter resolvido a famosa hipótese de Riemann, uma das conjecturas mais famosas da matemática. Proposta em 1859 por Bernhard Riemann, esta hipótese permite que os matemáticos caracterizem o comportamento dos números primos. A resolução potencial desta hipótese, que tem sido um desafio para a matemática por mais de 160 anos, pode marcar um ponto de virada significativo para o campo. No entanto, a validade da solução ainda está sendo avaliada e pode levar semanas para ser compreendida e verificada pelos especialistas. Paralelamente, pesquisadores da Monash University propõem uma reclassificação radical da árvore genealógica humana, sugerindo que espécies como Australopithecus e Paranthropus sejam reclassificadas no gênero Homo, desafiando a classificação tradicional dos antepassados humanos. Estes avanços científicos abrangem desde a matemática até a antropologia, ilustrando a diversidade e a profundidade do conhecimento científico atual.", "cultura": "O poeta taiwanês Xiang Ming faleceu, deixando uma herança literária significativa. Em outro destaque, a mostra 'Milton Santos e Cidadania: um geógrafo negro pensando o Brasil e o mundo' está em exibição no Rio de Janeiro, apresentando o pensamento de Milton Santos em três eixos e oferecendo acessibilidade para os visitantes. O Festival República Folklore, realizado em São Paulo, está em andamento, com apresentações de artistas renomados como Soledad Pastorutti e Chaqueño Palavecino marcadas para a noite de encerramento. A atriz Débora Nascimento retorna às novelas com 'Lá na Minha Terra', após sete anos, e o ator Stephan James prepara-se para viver o personagem Rocky Balboa em uma nova produção, seguindo seu processo habitual de pesquisa e transformação física para honrar o legado do ator Carl Weathers. Além disso, a comédia 'Sem Pai nem Mãe' encena o Brasil de forma leve e inventiva, destacando a decoração de cozinhas como um recurso realista. Por fim, a artista chilena Kidd Voodoo se tornou a primeira chilena a ganhar o prêmio de 'Melhor Artista ou Grupo Revelação de la Categoría Global Latina' nos Los40 Music Awards, expressando orgulho pela conquista.", "sociedade": "O Rio Grande do Sul enfrenta diversos desafios sociais, com a cidade de Tupanciretã sendo atingida por um temporal devastador. De acordo com relatos, a passagem de uma supercélula causou 162 feridos, com três mortes e mais de 19 mil pessoas desalojadas. A situação levou o presidente Luiz Inácio Lula da Silva a enviar uma equipe para auxiliar no município. Paralelamente, o governo do estado mobilizou recursos para socorrer a população afetada pelo temporal. Em Minas Gerais, um homem sobreviveu após ter uma faca cravada na nuca, tendo sido submetido a uma cirurgia bem-sucedida e recebido alta hospitalar. Em outro caso, um policial civil aposentado foi preso suspeito de matar a atual esposa de sua ex-mulher em frente a um bar em Contagem. No exterior, nos Estados Unidos, uma criança morreu de sarampo na Virgínia, elevando o número de mortes relacionadas à doença para 12 em 2026, o que reforça a importância da vacinação. No Brasil, a pesquisa de Luana Génot, CEO do ID_BR, destaca que decisões corporativas são frequentemente tomadas em locais onde mulheres negras não estão presentes, indicando que a dimensão social é um dos principais obstáculos para a ascensão de mulheres negras e outras minorias em cargos executivos.", "meio_ambiente": "O COP31, evento da ONU sobre clima, se estendeu além do prazo oficial e enfrenta dificuldades para chegar a um consenso, especialmente sobre combustíveis fósseis. Paralelamente, a China se comprometeu a promover a eletrificação de sua economia através de fontes de energia de baixo carbono e a ajudar outros países a fazerem o mesmo. Além disso, o fenômeno El Niño afeta diversas regiões do estado de São Paulo, com previsões de que os efeitos possam se manter por algum tempo, levando a inundações, deslizamentos de terra e estradas fechadas.", "direitos_humanos": "O Senado francês aprovou uma lei que concede aos policiais um benefício de dúvida no caso de mortes por disparos, a menos que haja provas contrárias, em uma votação de 205 a 110. A medida, criticada por parlamentares de esquerda, é conhecida como 'licence to kill' e levanta preocupações sobre a possibilidade de impunidade em casos de violência policial. Em outro desenvolvimento, um produtor musical negro foi condenado por três policiais franceses por um ataque racista em 2020, com o tribunal reconhecendo a natureza racista da violência. No Brasil, um homem foi condenado a uma pena de prisão perpétua por assassinar uma mulher que estava cumprindo uma condenação suspensa por um ataque violento, com um histórico de agressão a uma colega de trabalho. Na Nicarágua, a ONU registrou pelo menos 318 casos de nicaraguenses impedidos de entrar no próprio país entre junho de 2018 e agosto de 2025, com o governo Ortega proibindo a entrada de cidadãos. Estes eventos refletem a persistência de desafios relacionados a direitos humanos em várias partes do mundo, incluindo violência policial, racismo e restrições de liberdade de entrada em território nacional."}, "resumo_do_dia": {"politica_nacional": [{"id": 279634, "titulo": "Ataque de drones incendeia navio cargueiro russo no mar Báltico", "url": "https://www.poder360.com.br/poder-internacional/ataque-de-drones-incendeia-navio-cargueiro-russo-no-mar-baltico/", "fonte_id": "poder360", "data_pub": "2026-11-21T22:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ataque de drones incendiou um navio cargueiro russo no mar Báltico. Autoridades resgataram 16 tripulantes e restringiram o tráfego marítimo na região, com a embarcação derivando para águas finlandesas.", "titulo_pt": "Ataque de drones incendeia navio cargueiro russo no mar Báltico", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 279645, "titulo": "Suzane von Richthofen: advogados comentam lei sobre lucro de séries baseadas em crimes", "url": "https://veja.abril.com.br/brasil/suzane-von-richthofen-advogados-comentam-lei-sobre-lucro-de-series-baseadas-em-crimes/", "fonte_id": "veja", "data_pub": "2026-11-21T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um deputado federal apresentou uma proposta sobre a lei que trata do lucro de séries baseadas em crimes, mas ainda há dúvidas sobre o assunto.", "titulo_pt": "Advogados comentam lei sobre lucro de séries baseadas em crimes", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 279716, "titulo": "Bolsonaro tem tornozeleira retirada e fica sob custódia 24h no hospital", "url": "https://www.cnnbrasil.com.br/politica/bolsonaro-tem-tornozeleira-retirada-e-fica-sob-custodia-24h-no-hospital/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-21T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Jair Bolsonaro teve a tornozeleira eletrônica removida e está sob custódia 24 horas no hospital após apresentar dores abdominais. Em ofício enviado ao ministro do STF Alexandre Moraes, a Polícia Militar do Distrito Federal detalhou os procedimentos adotados após o ocorrido na sexta-feira (20).", "titulo_pt": "Bolsonaro sem tornozeleira e sob vigilância 24h no hospital", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 279637, "titulo": "Tornados atingem Foz do Iguaçu e Manoel Ribas, no Paraná", "url": "https://www.poder360.com.br/poder-brasil/tornados-atingem-foz-do-iguacu-e-manoel-ribas-no-parana/", "fonte_id": "poder360", "data_pub": "2026-11-21T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tornados atingiram Foz do Iguaçu e Manoel Ribas, no Paraná, causando destelhamentos e cortes de energia. O número total de tornados no estado em 2026 chegou a 15.", "titulo_pt": "Tornados atingem Foz do Iguaçu e Manoel Ribas, no Paraná", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 279723, "titulo": "Michelle chega ao Brasil após internação de Jair Bolsonaro", "url": "https://www.cnnbrasil.com.br/politica/michelle-chega-ao-brasil-apos-internacao-de-jair-bolsonaro/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-21T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michelle Bolsonaro interrompeu suas férias em Israel para acompanhar Jair Bolsonaro durante sua internação hospitalar.", "titulo_pt": "Michelle retorna ao Brasil após interromper férias em israel para acompanhar Jair Bolsonaro no hospital", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 279638, "titulo": "Vitória de Lula simboliza defesa da democracia, diz Haddad", "url": "https://www.poder360.com.br/poder-governo/vitoria-de-lula-simboliza-defesa-da-democracia-diz-haddad/", "fonte_id": "poder360", "data_pub": "2026-11-21T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro Fernando Haddad afirma que a vitória do presidente Lula simboliza a defesa da democracia no Brasil. Ele também menciona que o resultado das eleições reflete uma disputa global contra a concentração de poder econômico e político.", "titulo_pt": "Vitória de Lula simboliza defesa da democracia, diz Haddad", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 279606, "titulo": "Secretário de Tarcísio troca Palácio dos Bandeirantes por salas de Oxford por uma semana", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/secretario-de-tarcisio-troca-palacio-dos-bandeirantes-por-salas-de-oxford-por-uma-semana.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-21T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O secretário-chefe da Casa Civil do governo Tarcísio de Freitas, Nerylson Lima, irá participar de uma visita a Oxford por uma semana. Durante esse período, ele deixará o Palácio dos Bandeirantes para se hospedar nas instalações da universidade britânica.", "titulo_pt": "Secretário de Tarcísio viajará para Oxford por uma semana", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 279639, "titulo": "Haddad defende taxar super-ricos durante cúpula em Paris", "url": "https://www.poder360.com.br/poder-economia/haddad-defende-taxar-super-ricos-durante-cupula-em-paris/", "fonte_id": "poder360", "data_pub": "2026-11-21T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro Haddad defendeu a aplicação de um imposto de 2% sobre grandes fortunas durante uma cúpula em Paris. Essa medida poderia arrecadar globalmente até US$ 250 bilhões por ano.", "titulo_pt": "Haddad defende taxar super-ricos em cúpula em Paris", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 279641, "titulo": "Sociedade civil diz que COP31 tende a ser a pior da história", "url": "https://www.poder360.com.br/poder-sustentavel/sociedade-civil-diz-que-cop31-tende-a-ser-a-pior-da-historia/", "fonte_id": "poder360", "data_pub": "2026-11-21T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A sociedade civil acredita que a COP31 pode ser a pior da história devido à falta de consenso que está adiando os textos finais. A presidência enfrenta críticas por recuos no processo.", "titulo_pt": "Sociedade civil considera que COP31 pode ser a pior da história", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 279618, "titulo": "Após críticas, Cidadania suspende votação sobre incorporação ao PP", "url": "https://www.cartacapital.com.br/politica/apos-criticas-cidadania-suspende-votacao-sobre-incorporacao-ao-pp/", "fonte_id": "cartacapital", "data_pub": "2026-11-21T20:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido Cidadania suspendeu a votação sobre a possibilidade de incorporação ao Partido Progressista (PP). O presidente da legenda informou que pretende ampliar o diálogo antes de tomar uma decisão sobre o futuro da sigla.", "titulo_pt": "Cidadania suspende votação sobre incorporação ao PP após críticas", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 279698, "titulo": "Com diagnóstico de abdômen agudo obstrutivo, Bolsonaro está na UTI, diz boletim", "url": "https://www.infomoney.com.br/politica/com-diagnostico-de-abdomen-agudo-obstrutivo-bolsonaro-esta-na-uti-diz-boletim/", "fonte_id": "infomoney", "data_pub": "2026-11-21T20:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Jair Bolsonaro foi levado ao hospital na sexta-feira devido a fortes dores abdominais e está internado na Unidade de Terapia Intensiva (UTI) com diagnóstico de abdômen agudo obstrutivo.", "titulo_pt": "Com diagnóstico de abdômen agudo obstrutivo, Bolsonaro está na UTI, diz boletim", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 279619, "titulo": "Governo terá novas ações para combater casamento infantil", "url": "https://www.cartacapital.com.br/politica/governo-tera-novas-acoes-para-combater-casamento-infantil/", "fonte_id": "cartacapital", "data_pub": "2026-11-21T19:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra Janine Mello anunciou diretrizes para combater o casamento infantil. As medidas serão implementadas no exterior, especificamente em Manila.", "titulo_pt": "Governo anuncia novas ações para combater casamento infantil", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 279607, "titulo": "Radicais de direita e esquerda se unem nos equívocos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/dora-kramer/2026/11/radicais-de-direita-e-esquerda-se-unem-nos-equivocos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-21T19:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Radicais de direita e esquerda cometem erros semelhantes em suas posições, independentemente de suas ideologias.", "titulo_pt": "Radicais de direita e esquerda se equivocam de forma semelhante", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 279703, "titulo": "COP31 avança para prorrogação sem consenso sobre combustíveis fósseis", "url": "https://www.brasildefato.com.br/2026/11/21/cop31-avanca-para-prorrogacao-sem-consenso-sobre-combustiveis-fosseis/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-21T19:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 31ª Conferência das Nações Unidas sobre Mudança do Clima (COP31), realizada em Antália, na Turquia, prorrogou-se no sábado (21) sem consenso entre as delegações de quase 200 países sobre o tema dos combustíveis fósseis. As negociações, que deveriam ter sido concluídas na sexta-feira (20), foram estendidas devido a divergências profundas.", "titulo_pt": "COP31 prorroga sem consenso sobre combustíveis fósseis", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 279704, "titulo": "Temporais provocam alagamentos e danos em imóveis no estado de SP", "url": "https://www.brasildefato.com.br/2026/11/21/temporais-provocam-alagamentos-e-danos-em-imoveis-no-estado-de-sp/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-21T19:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fortes chuvas em Aparecida, SP, causaram alagamentos, quedas de árvores e danos em estruturas, deixando uma família desalojada e cinco hóspedes afetados pelo desabamento parcial do teto de um restaurante.", "titulo_pt": "Temporais causam alagamentos e danos em imóveis no estado de SP", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 279620, "titulo": "Empresária terá que pagar R$ 30 mil por ameaçar reduzir salários com o fim da escala 6×1", "url": "https://www.cartacapital.com.br/justica/empresaria-tera-que-pagar-r-30-mil-por-ameacar-reduzir-salarios-com-o-fim-da-escala-6x1/", "fonte_id": "cartacapital", "data_pub": "2026-11-21T19:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma empresária terá que pagar R$ 30 mil por ameaçar reduzir salários com o fim da escala 6×1 e publicar uma retratação no perfil institucional da empresa nas redes sociais.", "titulo_pt": "Empresária terá que pagar R$ 30 mil e publicar retratação após ameaçar reduzir salários", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 279504, "titulo": "Houthis launch strikes after coalition operation", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/22/2003868169", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças houthis realizaram ataques após uma operação da coalizão.", "titulo_pt": "Houthis lançam ataques após operação da coalizão", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 279511, "titulo": "China on verge of launching new nuclear sub: report", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/22/2003868182", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Segundo relatório, a China está prestes a lançar um novo submarino nuclear. Não há detalhes adicionais sobre o lançamento ou características técnicas do submarino.", "titulo_pt": "China prestes a lançar novo submarino nuclear: relatório", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 279502, "titulo": "COP31 extended as countries unable to reach an agreement", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/22/2003868167", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A COP31 foi prorrogada pois os países não conseguiram chegar a um acordo.", "titulo_pt": "COP31 prorrogada devido à falta de acordo entre os países", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 279615, "titulo": "Governo Trump divulga documentos sobre supostos rastros do Pé-Grande", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/11/governo-trump-divulga-documentos-sobre-supostos-rastros-do-pe-grande.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-11-21T22:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos divulgou documentos relacionados a supostos avistamentos do Pé-Grande. Essa criatura mitológica gigante é motivo de centenas de relatos ao longo de décadas, apesar da descrença científica.", "titulo_pt": "Governo Trump divulga documentos sobre supostos avistamentos do Pé-Grande", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 279635, "titulo": "Trump posa ao lado de Putin e o chama de “meu amigo” na China", "url": "https://www.poder360.com.br/poder-internacional/trump-posa-ao-lado-de-putin-e-o-chama-de-meu-amigo-na-china/", "fonte_id": "poder360", "data_pub": "2026-11-21T22:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, poseou ao lado do presidente da Rússia, Vladimir Putin, e chamou o último de 'meu amigo' durante uma reunião na China. A declaração gerou críticas na Europa.", "titulo_pt": "Trump posa ao lado de Putin e o chama de 'meu amigo' na China", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 279916, "titulo": "Bahrain says Iranian attack hits industrial facility", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/21/bahrain-says-iranian-attack-hits-industrial-facility?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-21T22:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Bahrain afirma que um ataque iraniano atingiu uma instalação industrial.", "titulo_pt": "Bahrain diz que ataque iraniano atinge instalação industrial", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 279895, "titulo": "Lock of former US President George Washington's hair sells for $4,000", "url": "https://www.bbc.co.uk/news/articles/cwe9k23dpz0do?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-21T22:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um fio de cabelo do ex-presidente dos Estados Unidos George Washington foi vendido por 4.000 dólares. O cabelo foi dado como sinal de amizade brevemente antes da morte de Washington em 1799, de acordo com um descendente do proprietário anterior.", "titulo_pt": "Cabelo do ex-presidente George Washington vende por 4.000 dólares", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 279958, "titulo": "Researchers tracked a long-legged bird’s migration. He flew 6,800 miles.", "url": "https://www.washingtonpost.com/the-seven/2026/11/21/researchers-tracked-bar-tailed-godwit-called-phil-migrating-6800-miles/", "fonte_id": "washington_post_world", "data_pub": "2026-11-21T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores rastrearam a migração de um pássaro com longas pernas, um godívo-olheira chamado Phil, que voou 6.800 milhas. Os conservacionistas consideram que essa jornada foi uma façanha incrível.", "titulo_pt": "Pesquisadores rastrearam a migração de um godívo-olheira que voou 6.800 milhas", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 279636, "titulo": "Países vão discutir regras para “robôs assassinos” até 2028", "url": "https://www.poder360.com.br/poder-tech/paises-vao-discutir-regras-para-robos-assassinos-ate-2028/", "fonte_id": "poder360", "data_pub": "2026-11-21T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Países se comprometeram a discutir regras para armas autônomas até 2028. A decisão foi tomada por 128 nações em Genebra, com resistência dos Estados Unidos, Rússia e Israel a um tratado obrigatório.", "titulo_pt": "Países vão discutir regras para 'robôs assassinos' até 2028", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 279829, "titulo": "Un ataque con drones dejó a la deriva a un buque ruso en el Báltico y encendió las alarmas en Finlandia", "url": "https://www.lanacion.com.ar/el-mundo/un-ataque-con-drones-dejo-a-la-deriva-a-un-buque-ruso-en-el-baltico-y-encendio-las-alarmas-en-nid21112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-21T21:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um ataque com drones deixou um navio russo à deriva no Mar Báltico, levando a Finlândia a adotar restrições temporárias ao tráfego aéreo e marítimo na região. O incidente ocorre em um contexto de aumento da atividade militar no entorno do golfo da Finlândia.", "titulo_pt": "Ataque com drones deixa navio russo à deriva no mar Báltico e aciona alerta na finlândia", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 279667, "titulo": "Operação para prender Chapo Isidro deixou quatro militares mortos no México", "url": "https://www.metropoles.com/mundo/operacao-para-prender-chapo-isidro-deixou-quatro-militares-mortos-no-mexico", "fonte_id": "metropoles", "data_pub": "2026-11-21T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A operação militar que resultou na prisão de Fausto Isidro Meza-Flores, conhecido como Chapo Isidro, deixou quatro militares mortos no México. O criminoso estava na lista dos mais procurados pelo FBI.", "titulo_pt": "Operação para prender Chapo Isidro resultou em quatro militares mortos no México", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 279907, "titulo": "Iran attacks US bases in Bahrain as its tankers get ready to break the US blockade", "url": "https://www.euronews.com/2026/11/21/iran-attacks-us-bases-in-bahrain-as-its-tankers-get-ready-to-break-the-us-blockade", "fonte_id": "euronews", "data_pub": "2026-11-21T21:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A tensão entre Estados Unidos e Irã parece estar se aproximando de um ponto de ruptura, com o Irã intensificando suas ações militares no Golfo e na Estreito de Ormuz, enquanto tenta brevemente quebrar o bloqueio naval imposto pelos Estados Unidos no Golfo Pérsico.", "titulo_pt": "Irã ataca bases dos EUA em Bahrain enquanto seus navios-tanque se preparam para quebrar o bloqueio dos EUA", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 279917, "titulo": "Bahrain says Iranian attack causes fire at industrial facility", "url": "https://www.aljazeera.com/news/2026/11/21/bahrain-says-iranian-attack-causes-fire-at-industrial-facility?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-21T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bahrain relatou que um suposto ataque iraniano causou um incêndio em uma instalação industrial, sem relatos de feridos. A Guarda Revolucionária Iraniana (IRGC) afirmou ter atacado posições militares dos EUA em duas bases em al-Riffa e Awali.", "titulo_pt": "Bahrain relata incêndio em instalação industrial após suposto ataque iraniano", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 279932, "titulo": "Violence erupts in Sinaloa after Mexico captures alleged drug trafficker", "url": "https://www.ft.com/content/90a8d0bd-32c8-471a-8696-e95555e41b78?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-21T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Violência eclode no estado de Sinaloa após a prisão de um suposto traficante de drogas, Fausto Isidro Meza-Flores, conhecido como 'El Chapo Isidro'. Ele está na lista dos mais procurados do FBI por traficar drogas para os Estados Unidos.", "titulo_pt": "Violência surge em Sinaloa após prisão de suposto traficante 'el chapo isidro'", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 279833, "titulo": "Por qué la reunión con Trump y Xi no salió como Putin pretendía", "url": "https://www.lanacion.com.ar/el-mundo/por-que-la-reunion-con-trump-y-xi-no-salio-como-putin-pretendia-nid21112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-21T21:24:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Para alguns analistas, Putin foi um dos ganhadores da cimeira entre Trump e Xi, mas saiu da China sem obter todos os resultados esperados e com uma declaração final que parece uma advertência.", "titulo_pt": "Por que a reunião com Trump e Xi não deu como Putin planejava", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 279919, "titulo": "Indian man jailed over plot to kill Sikh separatist in US", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/21/21-11-sv-us-sikh-separatist-pannun-assassination-plot?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-21T21:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um nacional indiano foi condenado a mais de 19 anos de prisão nos Estados Unidos por planejar o assassinato de um separatista sikho.", "titulo_pt": "Índio condenado a mais de 19 anos por plano de assassinar sikho separatista nos EUA", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 279501, "titulo": "FSC announces measures after stock market losses", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/22/2003868166", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FSC anunciou medidas após as perdas no mercado de ações.", "titulo_pt": "FSC anuncia medidas após perdas no mercado de ações", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 279693, "titulo": "Paraná registra dois tornados em um dia e chega a 15 ocorrências em 2026", "url": "https://www.infomoney.com.br/brasil/parana-registra-dois-tornados-em-um-dia-e-chega-a-15-ocorrencias-em-2026/", "fonte_id": "infomoney", "data_pub": "2026-11-21T22:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em um dia, o Paraná registrou dois tornados em Foz do Iguaçu e Manoel Ribas, com ventos atingindo até 180 km/h. Ao todo, foram 15 ocorrências de tornados no estado em 2026, causando interrupções no fornecimento de energia elétrica para milhares de imóveis.", "titulo_pt": "Paraná registra dois tornados em um dia e chega a 15 ocorrências em 2026", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 279694, "titulo": "Filme de Brad Pitt na Netflix gera críticas por imagens supostamente feitas com IA", "url": "https://www.infomoney.com.br/consumo/filme-de-brad-pitt-na-netflix-gera-criticas-por-imagens-supostamente-feitas-com-ia/", "fonte_id": "infomoney", "data_pub": "2026-11-21T22:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme de Brad Pitt na Netflix gerou críticas por imagens supostamente produzidas com inteligência artificial. David Fincher defendeu o uso de novas tecnologias no cinema após essas críticas.", "titulo_pt": "Filme de Brad Pitt na Netflix gera críticas por imagens supostamente feitas com IA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 279741, "titulo": "A dívida não cai por decreto", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-divida-nao-cai-por-decreto", "fonte_id": "jota", "data_pub": "2026-11-21T22:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Medidas fiscais auxiliam na realização de metas fiscais, mas não asseguram a estabilização da dívida no longo prazo.", "titulo_pt": "A dívida não cai por decreto", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 279717, "titulo": "Brasil disputa liderança na atração de data centers, diz The Economist", "url": "https://www.cnnbrasil.com.br/economia/money/tecnologia/brasil-disputa-lideranca-da-america-latina-na-atracao-de-data-centers/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-21T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil está competindo pela liderança na atração de data centers, de acordo com The Economist. 1112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-21T21:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Três empresas, Milkaut, Punta del Agua e Failar, apresentaram propostas à Justiça para utilizarem as instalações da SanCor em Santa Fé e Córdoba mediante contratos. A SanCor está em processo de falência.", "titulo_pt": "Força de interesse por SanCor: três empresas querem produzir em instalações da icônica láctea em quiebra", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 279601, "titulo": "Ter ações na carteira é sempre uma boa decisão?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/11/ter-acoes-na-carteira-e-sempre-uma-boa-decisao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-21T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Muitas pessoas compram ações apenas porque acreditam que uma carteira de investimentos deve incluir ações da Bolsa, mesmo que não tenham um plano específico de investimento. Essa recomendação é amplamente difundida, mas não necessariamente aplicável a todos os investidores.", "titulo_pt": "Ter ações na carteira é sempre uma boa decisão?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 279697, "titulo": "Cúpula climática COP31 corre risco de fracassar, conforme negociações se estendem", "url": "https://www.infomoney.com.br/mundo/cupula-climatica-cop31-corre-risco-de-fracassar-conforme-negociacoes-se-estendem/", "fonte_id": "infomoney", "data_pub": "2026-11-21T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Negociadores de quase 200 países enfrentam dificuldades para superar divergências sobre combustíveis fósseis e financiamento climático, o que aumenta o risco de fracasso da COP31. As negociações se estendem, atrasando o avanço das discussões.", "titulo_pt": "Cúpula climática COP31 corre risco de fracasso com n Brasil", "classe": "B"}, {"id": 279604, "titulo": "Como a esquerda lidará com as consequências políticas da economia que propõe?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/viniciustorres/2026/11/como-a-esquerda-lidara-com-as-consequencias-politicas-da-economia-que-propoe.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-21T19:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudos econômicos sugerem que o PIB de 2027 pode cair 0,5% ou crescer 1,5%, dependendo das hipóteses. As projeções costumam estar erradas devido a fatores externos, como juros nos EUA e preços de commodities.", "titulo_pt": "Como a esquerda lidará com as consequências políticas da economia que propõe?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 279733, "titulo": "Quais são e quanto custam os carros da Caoa Changan no Brasil?", "url": "https://canaltech.com.br/carros/quais-sao-e-quanto-custam-os-carros-da-caoa-changan-no-brasil/", "fonte_id": "canaltech", "data_pub": "2026-11-21T22:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Caoa Changan começou suas operações no Brasil em abril de 2026, oferecendo uma gama limitada de veículos que atendem diferentes perfis de consumidores. A reportagem do CT Auto lista os modelos disponíveis e seus respectivos preços no mercado brasileiro.", "titulo_pt": "Quais são e quanto custam os carros da Caoa Changan no Brasil?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 279943, "titulo": "Amazon is complaining about NYC Council on shipping labels, too", "url": "https://www.theverge.com/tech/1039564/amazon-nyc-council-packages-shipping-label", "fonte_id": "the_verge", "data_pub": "2026-11-21T21:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amazon está utilizando rótulos nas suas entregas para contestar o New York City Council e a Deli a de Mercúrio", "url": "https://olhardigital.com.br/2026/11/21/ciencia-e-espaco/bepicolombo-faz-manobra-decisiva-para-entrar-na-orbita-de-mercurio/", "fonte_id": "olhar_digital", "data_pub": "2026-11-21T19:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O BepiColombo realizou uma manobra de 37 minutos, acionando quatro propulsores, para entrar na órbita de Mercúrio. A equipe espera a confirmação do sucesso da operação.", "titulo_pt": "Bepicolombo realiza manobra crucial para entrar na órbita de Mercúrio", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 279736, "titulo": "De vampiro a James Bond: por que Robert Pattinson é a melhor escolha para o novo 007", "url": "https://canaltech.com.br/entretenimento/por-que-robert-pattinson-melhor-escolha-para-ser-007/", "fonte_id": "canaltech", "data_pub": "2026-11-21T19:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Robert Pattinson foi anunciado como o novo James Bond, gerando debate na indústria do entretenimento. O ator, com 40 anos e passagens por franquias de sucesso, oferece uma combinação única de experiência e maturidade para o papel.", "titulo_pt": "De vampiro a James Bond: por que Robert Pattinson é a melhor escolha para o novo 007", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 279737, "titulo": "Luz da injeção acesa: quando você deve parar o carro?", "url": "https://canaltech.com.br/carros/luz-da-injecao-acesa-quando-voce-deve-parar-o-carro/", "fonte_id": "canaltech", "data_pub": "2026-11-21T19:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A luz da injeção eletrônica no painel pode indicar uma falha no sistema de injeção, mas nem sempre representa uma emergência. O comportamento da luz e os sintomas do veículo determinam se é seguro continuar a viagem ou se é preciso levar o carro para reparo.", "titulo_pt": "Luz da injeção acesa: quando você deve parar o carro?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 279738, "titulo": "Bateria do celular caindo do nada? Entenda por que isso acontece e como resolver", "url": "https://canaltech.com.br/apps/bateria-do-celular-caindo-do-nada-entenda-por-que-isso-acontece-e-como-resolver/", "fonte_id": "canaltech", "data_pub": "2026-11-21T18:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A bateria do celular pode descarregar rapidamente devido a várias razões, como aplicativos em segundo plano ou atualizações do sistema. O desgaste natural da bateria e a estimativa do software também podem afetar a carga exibida.", "titulo_pt": "Bateria do celular caindo rapidamente? Entenda as causas e possíveis soluções", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 279174, "titulo": "Como montar um PC completo para rodar modelos de IA localmente", "url": "https://canaltech.com.br/hardware/como-montar-pc-para-rodar-ia-localmente/", "fonte_id": "canaltech", "data_pub": "2026-11-21T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rodar modelos de inteligência artificial diretamente em um PC pessoal se tornou uma realidade, não sendo mais uma curiosidade experimental. Para montar uma máquina dedicada à IA local em 2026, a configuração do hardware deve priorizar a capacidade de memória e largura de banda, especialmente da memória de vídeo, diferentemente do foco em altas taxas de quadros em PCs gamers.", "titulo_pt": "Como montar um PC completo para rodar modelos de IA localmente", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 279525, "titulo": "The FBI and USDA were reportedly hacked", "url": "https://www.theverge.com/tech/1039543/fbi-usda-hacked", "fonte_id": "the_verge", "data_pub": "2026-11-21T17:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foi relatado que tanto o USDA (Departamento de Agricultura dos EUA) quanto o FBI foram hackeados. Este é o segundo ataque ao FBI nos últimos meses, desta vez contra o NCIC (National Crime Information Center), uma base de dados usada por órgãos de segurança federal, estadual e local.", "titulo_pt": "FBI e USDA seriam vítimas de hackers", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 279514, "titulo": "FEATURE: Farmer revives climate-resilient oil millet", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/22/2003868185", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um agricultor está revitalizando o cultivo de milheto de óleo, uma cultura resistente ao clima. Este cultivo pode oferecer uma alternativa sustentável para alimentos e óleos vegetais.", "titulo_pt": "Agricultor revive cultivo de milheto de óleo resistente ao clima", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 279708, "titulo": "Epilepsia infantil: Genética impacta tratamento, dizem médicos a Dr. Kalil", "url": "https://www.cnnbrasil.com.br/saude/epilepsia-infantil-genetica-impacta-tratamento-dizem-medicos-a-dr-kalil/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-21T22:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Avanços em biologia molecular permitem diagnósticos genéticos que orientam a escolha de medicamentos e terapias para crianças com epilepsia. Especialistas em neurologia discutem o tema com o CNN Sinais Vitais.", "titulo_pt": "Epilepsia infantil: genética influencia tratamento, afirmam médicos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 279949, "titulo": "The avian champions of long-distance migration keep surprising scientists", "url": "https://phys.org/news/2026-11-avian-champions-distance-migration-scientists.html", "fonte_id": "phys_org", "data_pub": "2026-11-21T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A história toda começou com uma ave extinta da Ilha Hispânia, conforme declarou Min Zhao, um ex-assistente pós-doutoral do Museu de História Natural da Flórida (agora um pesquisador pós-doutoral na Universidade de Uppsala).", "titulo_pt": "As campeãs de migração de longa distância de aves continuam surpreendendo os cientistas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 279950, "titulo": "Repeated bending strengthens sugar-based hydrogel instead of wearing it down", "url": "https://phys.org/news/2026-11-sugar-based-hydrogel.html", "fonte_id": "phys_org", "data_pub": "2026-11-21T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de pesquisa liderado por Chenfeng Ke, um professor de química na Universidade Washington em St. Louis, desenvolveu um polímero que se fortalece com o uso, contrariando a regra comum de degradação dos materiais.", "titulo_pt": "Repetida dobragem fortalece hidrogel de base de açúcar em vez de enfraquecê-lo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 279951, "titulo": "Dropping degree requirements linked to higher pay for workers without degrees", "url": "https://phys.org/news/2026-11-degree-requirements-linked-higher-pay.html", "fonte_id": "phys_org", "data_pub": "2026-11-21T18:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exigências estabelecidas pelos departamentos de recursos humanos (RH) têm um grande impacto nas oportunidades profissionais disponíveis para diferentes grupos da população. Baixar essas exigências pode levar a aumentos de salários para trabalhadores sem diplomas.", "titulo_pt": "Redução das exigências de grau associada a maiores pagamentos para trabalhadores sem grau", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 279092, "titulo": "Réptil de 156 milhões de anos com 'chifres' é encontrado nos EUA", "url": "https://www.metropoles.com/ciencia/reptil-de-156-milhoes-de-anos-com-chifres-e-encontrado-nos-eua", "fonte_id": "metropoles", "data_pub": "2026-11-21T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tomografias revelaram uma nova espécie de réptil com chifres nos Estados Unidos. O animal, com 45 cm de comprimento, recebeu o nome em homenagem ao death metal.", "titulo_pt": "Novo réptil de 156 milhões de anos com 'chifres' é encontrado nos EUA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 279687, "titulo": "Tenho que me vacinar de novo contra a Covid-19? O que diz a Fiocruz", "url": "https://exame.com/brasil/tenho-que-me-vacinar-de-novo-contra-a-covid-19-o-que-diz-a-fiocruz/", "fonte_id": "exame", "data_pub": "2026-11-21T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Fiocruz informa que a linhagem PJ.2.1 foi encontrada em 58% dos genomas sequenciados no Rio de Janeiro, sendo avaliada pela OMS para possivelmente ser classificada como variante sob monitoramento.", "titulo_pt": "Tenho que me vacinar de novo contra a Covid-19? O que diz a Fiocruz sobre a linhagem pj.2.1 no rio de janeiro?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 279587, "titulo": "On this day in space! Nov. 21, 1676: Danish astronomer discovers speed of light — by accident — while observing Jupiter's moon Io", "url": "https://www.space.com/space-exploration/on-this-day-in-space-november-21-2026", "fonte_id": "space_com", "data_pub": "2026-11-21T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 21 de novembro de 1676, o astrônomo dinamarquês Ole Rømer descobriu a velocidade da luz ao observar a lua de Júpiter Io. Este achado ocorreu por acaso durante seus estudos astronômicos.", "titulo_pt": "21 De novembro de 1676: astrônomo dinamarquês descobre a velocidade da luz — por acaso — ao observar a lua de júpiter Io", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 279548, "titulo": "Babies in ancient Greek colony started solid food at 3 months but nursed for nearly 4 years, chemical signatures suggest", "url": "https://phys.org/news/2026-11-babies-ancient-greek-colony-solid.html", "fonte_id": "phys_org", "data_pub": "2026-11-21T15:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Himera, uma colônia grega habitada por sicilianos locais, fenícios e gregos há mais de 2.500 anos, começou a amamentar seus bebês com sólidos aos três meses, mas continuou por quase 4 anos, independentemente de suas diferentes origens culturais.", "titulo_pt": "Bebês na colônia grega antiga de himera começaram a alimentação sólida aos 3 meses, mas amamentaram por quase 4 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 279691, "titulo": "Covid-19: o que se sabe sobre a PJ.2.1, variante que domina casos no Rio e avança no Brasil", "url": "https://exame.com/brasil/covid-19-o-que-se-sabe-sobre-a-pj-2-1-variante-que-domina-casos-no-rio-e-avanca-no-brasil/", "fonte_id": "exame", "data_pub": "2026-11-21T15:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A variante PJ.2.1, detectada no Canadá em maio, é responsável por 58% das amostras sequenciadas pela Fiocruz no Rio de Janeiro e tem se espalhado pelo Brasil sem que as vacinas actuais ofereçam proteção eficaz contra ela.", "titulo_pt": "Covid-19: o que se sabe sobre a PJ.2.1, variante que domina casos no Rio e avança no Brasil", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 279552, "titulo": "AI may not work like the human brain after all, scientists discover", "url": "https://www.sciencedaily.com/releases/2026/11/261120075701.htm", "fonte_id": "science_daily", "data_pub": "2026-11-21T15:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram que a inteligência artificial pode não pensar como o cérebro humano, mesmo que modelos de IA prevejam atividade cerebral de forma semelhante. Essa descoberta questiona a confiabilidade dessas modelos na pesquisa neurociêntifica.", "titulo_pt": "A inteligência artificial pode não pensar como o cérebro humano, revela nova descoberta", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 279588, "titulo": "This Week In Space podcast: Episode 237 — A Fond Farewell", "url": "https://www.space.com/entertainment/space-movies-shows/this-week-in-space-podcast-episode-237-a-fond-farewell", "fonte_id": "space_com", "data_pub": "2026-11-21T15:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Neste episódio do Podcast This Week In Space, Tariq Malik e Rod Pyle se despedem temporariamente, abordando notícias espaciais, piadas espaciais e uma recapitulação de alguns dos momentos mais engraçados do programa.", "titulo_pt": "Episódio 237 do podcast this Week In Space: uma saudade sentida", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 279553, "titulo": "Time may be far stranger than we realize. Scientists have a way to test it", "url": "https://www.sciencedaily.com/releases/2026/11/261120075558.htm", "fonte_id": "science_daily", "data_pub": "2026-11-21T15:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores propuseram um método para detectar relógios experimentando múltiplas fluxos de tempo simultaneamente, utilizando relógios atômicos com sensibilidade aprimorada. Este teste poderia revelar um efeito quântico nunca observado, alterando nossa compreensão do tempo e da gravidade.", "titulo_pt": "O tempo pode ser muito mais estranho do que imaginamos. Cientistas propõem um jeito de detectar múltiplos fluxos de tempo simultaneamente", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 279007, "titulo": "Trabalhadores fizeram greve há mais de 3.000 anos no Egito antigo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/trabalhadores-fizeram-greve-ha-mais-de-3000-anos-no-egito-antigo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-21T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Durante o reinado de Ramsés 3º, entre 1184 a 1153 a.C., os trabalhadores responsáveis pela construção dos túmulos reais realizaram uma greve devido à instabilidade política e econômica no Egito antigo. Este episódio ilustra as dificuldades enfrentadas durante esse período.", "titulo_pt": "Trabalhadores fizeram greve há mais de 3.000 anos no Egito antigo", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 279379, "titulo": "The likely solution to the Riemann hypothesis by AI marks a turning point for mathematics", "url": "https://www.lemonde.fr/en/science/article/2026/11/21/the-likely-solution-to-the-riemann-hypothesis-by-ai-marks-a-turning-point-for-mathematics_6786232_10.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-21T14:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um matemático da Anthropic, Levent Alpöge, em colaboração com o assistente de inteligência artificial Claude da empresa, alega ter resolvido uma das conjecturas mais famosas da matemática. A hipótese de Riemann, proposta em 1859 por Bernhard Riemann, permite que os matemáticos caracterizem o comportamento dos números primos.", "titulo_pt": "Solução provável para a hipótese de Riemann por IA marca ponto de virada para a matemática", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 279554, "titulo": "A giant star swallowed another star. James Webb reveals the aftermath", "url": "https://www.sciencedaily.com/releases/2026/11/261120075556.htm", "fonte_id": "science_daily", "data_pub": "2026-11-21T14:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos observaram uma colisão cósmica no galáxia da Andrômeda, onde uma pequena estrela se aproximou de uma gigante 18.000 vezes mais brilhante do que o Sol, causando uma erupção violenta. O telescópio espacial James Webb da NASA capturou a cena 47 dias após o evento, revelando detalhes sobre a fusão de duas estrelas em uma única.", "titulo_pt": "Uma estrela gigante engoliu outra estrela. O james Webb registra os efeitos", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}], "ciencia__eventos": [], "cultura": [{"id": 279517, "titulo": "Veteran Taiwanese poet Xiang Ming dies, leaving literary legacy", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/22/2003868188", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O poeta taiwanês de longa data Xiang Ming faleceu, deixando uma herança literária. Ele era conhecido por suas contribuições na literatura taiwanesa.", "titulo_pt": "Poeta taiwanês Xiang Ming falece, deixando herança literária", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 279902, "titulo": "How scientists saved a Normandy dinosaur fossil from the auction block", "url": "https://www.lemonde.fr/en/science/article/2026/11/21/how-scientists-saved-a-normandy-dinosaur-fossil-from-the-auction-block_6786364_10.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-21T22:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um único fóssil de Dubreuillosaurus valesdunensis, descoberto em Normandia em 1994, estava para ser leiloado após a morte do proprietário. A comunidade de paleontologia francesa se opôs à venda privada e buscou garantir que o fóssil fosse incluído nas coleções nacionais.", "titulo_pt": "Cientistas salvaram fóssil de dinossauro da dubreuillosaurus valesdunensis do leilão", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 279787, "titulo": "El eterno presente", "url": "https://www.latercera.com/opinion/noticia/el-eterno-presente/", "fonte_id": "la_tercera", "data_pub": "2026-11-21T22:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O artigo discute um conceito filosófico ou literário chamado 'eterno presente', mas não fornece detalhes específicos sobre o conteúdo.", "titulo_pt": "O eterno presente", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 279789, "titulo": "Entre consumir y pertenecer", "url": "https://www.latercera.com/opinion/noticia/entre-consumir-y-pertenecer/", "fonte_id": "la_tercera", "data_pub": "2026-11-21T22:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute o equilíbrio entre o consumo e a pertença. Não há detalhes específicos sobre o conteúdo, apenas o foco na interação entre esses dois conceitos.", "titulo_pt": "Consumo e pertencimento", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 279827, "titulo": "Nahuel Pennisi fue uno de los encargados de abrir el festival República Folklore: “Mercedes Sosa estaría orgullosa”", "url": "https://www.lanacion.com.ar/espectaculos/musica/nahuel-pennisi-fue-uno-de-los-encargados-de-abrir-el-festival-republica-folklore-mercedes-sosa-nid21112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-21T21:57:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Festival República Folklore está sendo realizado durante dois dias, com apresentações até esta noite. O evento ocorre no Parque de la Ciudad e contará com as performances de Soledad Pastorutti e Chaqueño Palavecino no encerramento.", "titulo_pt": "Nahuel Pennisi foi um dos responsáveis por abrir o festival República Folklore: 'mercedes Sosa estaria orgulhosa'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 279791, "titulo": "Así funciona la red de Metro este sábado 21 de noviembre: todas las estaciones disponibles", "url": "https://www.latercera.com/servicios/noticia/asi-funciona-la-red-de-metro-este-sabado-21-de-noviembre-todas-las-estaciones-disponibles/", "fonte_id": "la_tercera", "data_pub": "2026-11-21T21:56:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O serviço de transporte da Região Metropolitana funcionará normalmente neste sábado, 21 de novembro, com todas as estações disponíveis. Os passageiros devem verificar o estado das linhas e as recomendações fornecidas.", "titulo_pt": "Assim funciona a rede de metrô neste sábado 21 de novembro: todas as estações disponíveis", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 279633, "titulo": "Mostra apresenta legado de Milton Santos para pensar o Brasil", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-11/mostra-apresenta-legado-de-milton-santos-para-pensar-o-brasil", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-11-21T21:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A mostra 'Milton Santos e Cidadania: um geógrafo negro pensando o Brasil e o mundo' está sendo exibida no Museu da História e da Cultura Afro-Brasileira, no Rio de Janeiro, até 3 de janeiro. A exposição apresenta o pensamento de Milton Santos em três eixos e oferece audiodescrição e libras para visitantes.", "titulo_pt": "Mostra apresenta legado de Milton Santos para pensar o Brasil", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 279648, "titulo": "O feito de ‘Lá na Minha Terra’ que a Globo não tem nada a comemorar", "url": "https://veja.abril.com.br/cultura/o-feito-de-la-na-minha-terra-que-a-globo-nao-tem-nada-a-comemorar/", "fonte_id": "veja", "data_pub": "2026-11-21T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O folhetim 'Lá na Minha Terra', criado e escrito por Mário Teixeira, está sendo criticado nas redes sociais.", "titulo_pt": "O feito de 'Lá na Minha Terra' que a Globo não tem motivo para comemorar", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 279960, "titulo": "Seth Rogen Says Brad Pitt and ‘12 Years a Slave’ Cast Would Visit ‘This Is the End’ Set to ‘Perk Up’ Because They Were ‘in a Bummed-Out Headspace’ While Filming", "url": "https://variety.com/2026/film/news/seth-rogen-brad-pitt-12-years-a-slave-cast-set-visit-1236955074/", "fonte_id": "variety", "data_pub": "2026-11-21T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seth Rogen disse que Brad Pitt e os atores de '12 Years a Slave' passaram tempo no set de 'This Is the End' durante as filmage
