<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "23/11/2026 15:42", "stats": {"noticias_novas": 1198, "resumos_gerados": 253}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva recebeu ministros do Supremo Tribunal Federal e líderes do governo em um jantar no Palácio do Alvorada, sinalizando intenções de fortalecer apoio para seu possível quarto mandato. Em outro desenvolvimento, o Tribunal de Contas da União identificou indícios de conluio em licitações do Banco do Brasil, envolvendo R$ 105 milhões. A Polícia Federal planeja gastar R$ 11,4 milhões com a aquisição de três sedãs blindados para o transporte do presidente Lula, refletindo a crescente segurança necessária. Além disso, a Polícia Federal está investigando a chefia da Polícia Federal, Andrei Rodrigues, por supostas ligações com o Banco Master. O governo Lula enfrenta pressões para aprovar um ajuste fiscal, com o ministro Bruno Moretti assegurando que o plano visa preservar os direitos sociais. A pavimentação da rodovia BR-319, que ameaça a floresta amazônica, deve avançar em 2027, após a vitória de defensores da obra nas eleições recentes.", "mundo": "Em um evento notável, Emmanuel Macron propôs uma regra orçamentária constitucional para o orçamento francês, visando limitar os gastos governamentais e manter os déficits futuros sob controle. Esta medida, que atende às preocupações dos mercados financeiros, faz parte de um esforço maior para reestruturar as finanças do país. Além disso, o presidente francês está realizando um summit focado em investimentos de 42,5 bilhões de euros feitos por empresas francesas na França, o que, por trás dos números impressionantes, revela uma tendência preocupante. Em outros desenvolvimentos, o Irã anunciou que usará todos os meios disponíveis para contrapor o bloqueio naval dos Estados Unidos, enquanto a Coreia do Sul e Mongólia discutiram cooperação em minérios críticos e comércio. No cenário político, o ministro das Relações Exteriores da Coreia do Sul foi nomeado após demonstrar um profundo conhecimento dos Estados Unidos e da Coreia do Norte, enquanto o governo japonês está utilizando artistas e influenciadores para promover seu aumento na construção de defesa, devido à falta de uma narrativa nacional convincente sobre isso.\n\nOs ataques recentes e as medidas geopolíticas em curso refletem a crescente tensão na região do Mediterrâneo e do Oriente Médio. A Ucrânia confirmou o uso de drones navais para afundar dois navios de guerra russos em águas libianas, um evento que ampliou o conflito além da Europa. Israel também intensificou suas operações em Gaza, resultando em mortes, incluindo um trabalhador da ONU, e agravando a situação humanitária. Diante dessas tensões, a Rússia planeja posicionar uma bomba atômica em órbita terrestre, uma ação que aumenta as preocupações com a escalada nuclear. Além disso, a COP31 falhou em alcançar um acordo, com a Arábia Saudita e outros países petrolíferos sendo acusados de influenciar negativamente a agenda climática. A Ucrânia, por sua vez, reafirmou sua determinação em combater a Rússia, enquanto Israel continua sua ofensiva em Gaza, causando preocupações humanitárias e políticas.", "economia": "A União Europeia começou uma investigação contra a principal engarrafadora de Coca-Cola na Europa, suspeita de abuso de posição dominante, o que pode resultar em preços mais altos para os consumidores. A Amazon está prestes a fechar um acordo de US$ 7,5 bilhões para adquirir a startup Decart, mostrando o interesse das grandes empresas tecnológicas em expandir suas capacidades em inteligência artificial. O plantio de soja no Brasil atingiu 86% da área prevista, um aumento em relação à semana anterior e 5% acima do mesmo período do ano anterior, conforme levantamento da AgRural. A Braskem concluiu um acordo com seus credores para reestruturar sua dívida, levantando US$ 4,9 bilhões por meio de capitalização, com a Petrobras contribuindo com US$ 1,3 bilhão. A RD Saúde anunciou um programa de recompra de ações no valor máximo de R$ 600 milhões. As exportações da Coreia do Sul devem ultrapassar 1 trilhão de dólares pelo segundo ano consecutivo em 2027, enquanto o won sul-coreano caiu significativamente e atingiu seu nível mais baixo em duas semanas em relação ao dólar americano, devido a uma atmosfera de aversão ao risco.", "tecnologia": "A volta de Jensen Huang à presidência da Nvidia gerou uma reação positiva no mercado, com as ações da empresa e do índice Nasdaq subindo significativamente. A decisão unânime do conselho de administração levou as ações da SK hynix negociadas nos Estados Unidos a subirem mais de 20% nas negociações da manhã de segunda-feira. A aquisição da Zscaler pela CrowdStrike por 44 bilhões de dólares também marcou o cenário tecnológico, focando na segurança cibernética, especialmente diante das ameaças cibernéticas impulsionadas pela inteligência artificial. Além disso, a Anthropic, empresa de IA, enfrentou críticas de uma filósofa renomada sobre sua argumentação sobre a consciência da IA, enquanto a indústria de IA discute questões relacionadas à segurança e ao julgamento ético da tecnologia.", "ciencia": "A NASA está buscando parcerias com empresas privadas para desenvolver e testar o primeiro reator nuclear que fornecerá eletricidade na Lua. Este reator, chamado Lunar Reactor-1 (LR-1), será um sistema nuclear de pequena potência que produzirá 20 kilowatts de eletricidade. Em outra novidade na área da saúde, a Anvisa aprovou um novo medicamento biossimilar para o tratamento do câncer de mama, tanto para casos iniciais quanto para tumores avançados. O tratamento também pode ser usado no câncer de bexiga. Além disso, o Telescópio Espacial James Webb da NASA produziu uma observação de alta resolução e infravermelha do restante da supernova Cassiopeia A, revelando detalhes sobre a evolução das estrelas. Estes são alguns dos principais avanços em ciência e tecnologia apresentados nos artigos fornecidos.", "cultura": "A Record produzirá sua primeira novela bíblica focada na história de Débora, a única mulher juíza e profetisa de Israel, marcando um novo passo na programação da emissora. Outro destaque é o escritor egípcio Abdelrahman ElGendy, que venceu o National Book Award na categoria de não-ficção por seu livro 'Huna'. A novela 'Quem Matou PC Farias?' ganhou um novo elenco com a participação do ator Lee Taylor, conhecido por seu papel em 'A Dona do Pedaço'. Em Juazeiro, Bahia, o Festival A Bossa! reúne artistas como João Bosco, Seu Jorge e Marcelo Falcão em um evento gratuito com shows e conversas. Além disso, o documentário 'Você Pode Ver Tudo', sobre a fraudadora Elizabeth Holmes, atingiu a marca de $100 milhões na bilheteria global, consolidando seu sucesso no cinema de não-ficção.", "sociedade": "Em 2026, milhares de pessoas participaram da 31ª Parada do Orgulho LGBT+ em Copacabana, no Rio de Janeiro, celebrando a diversidade e exigindo maior igualdade. O evento, que aconteceu em 22 de novembro, enfatizou a importância da inclusão e do respeito à comunidade LGBTQ+. Além disso, um relatório da ONU Mulheres indica que apenas 7% das sobreviventes de violência contra mulheres denunciam à polícia na Argentina, refletindo uma persistente discrepância entre mulheres e homens em termos de direitos e proteção. Em São Paulo, quase metade (45,8%) dos domicílios possuem cães ou gatos, com a capital paulista tendo uma proporção de 13 gatos por 100 humanos e 19 cães por 100 habitantes. Um motorista foi preso no Paraná após um acidente que deixou uma criança em estado grave e testou positivo para álcool no bafômetro, com 0,48 mg de álcool por litro de ar.", "meio_ambiente": "A COP31, a conferência climática mais longa na história das Nações Unidas, não chegou a um acordo-chave após 17 anos de negociações, marcando o primeiro fracasso em 17 anos. A conferência, co-presidida por Turquia e Austrália, falhou devido a um impasse sobre combustíveis fósseis e apoio a países afetados pela crise climática. Em outro desenvolvimento, Taiwan anunciou que continuará com o processo de redução do uso de combustíveis fósseis, mantendo a transição energética conforme planejado. No Brasil, temporais causaram perdas significativas nas lavouras de soja em Tupanciretã, com estimativas de até 95% de perdas nas lavouras afetadas. Em outro ponto, o vulcão Kilauea na Ilha Grande de Hawái entrou em erupção, lançando lava a 200 metros de altura e humo a 5.000 metros acima do nível do mar, atraindo turistas e cientistas.", "direitos_humanos": "Mais de 1.000 militares russos se suicidaram durante a guerra na Ucrânia, de acordo com dados de mais de 11 milhões de certidões de morte, revelando um impacto psicológico significativo na força militar russa. Em outro desenvolvimento, a Universidade de Hong Kong decidiu adiar um curso sobre direitos humanos na China, após o coordenador Fu Hualing anunciar sua saída como decano da escola de direito. Paralelamente, a polícia de Hong Kong prendeu um homem de 67 anos por supostamente ter pendurado um cachorro de rua em uma árvore, em um caso de maus-tratos a animais. Por fim, a cantora iraniana Parastoo Ahmadi recebeu uma condenação de 74 chicotadas por não usar o véu durante um concerto online, refletindo a repressão a direitos humanos no Irã."}, "resumo_do_dia": {"politica_nacional": [{"id": 281570, "titulo": "TCU vê possível conluio em licitações de R$ 105 milhões do Banco do Brasil", "url": "https://www.metropoles.com/colunas/tacio-lorran/tcu-conluio-banco-do-brasil", "fonte_id": "metropoles", "data_pub": "2026-11-23T17:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A área técnica do Tribunal de Contas da União (TCU) identificou indícios de irregularidades e suspeitas de conluio entre empresas em licitações do Banco do Brasil no valor de R$ 105 milhões.", "titulo_pt": "TCU suspeita de conluio em licitações do Banco do Brasil no valor de R$ 105 milhões", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 281550, "titulo": "Fator STF pode abalar lua de mel entre Lula e Davi Alcolumbre", "url": "https://veja.abril.com.br/politica/fator-stf-pode-abalar-lua-de-mel-entre-lula-e-davi-alcolumbre/", "fonte_id": "veja", "data_pub": "2026-11-23T17:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Presidente Lula e senador Davi Alcolumbre continuam em desacordo sobre a indicação para a Suprema Corte do país. Este diferimento pode afetar a harmonia entre os dois durante a 'lua de mel' política.", "titulo_pt": "Fator STF pode abalar lua de mel entre Lula e Davi Alcolumbre", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 281540, "titulo": "Lula recebe 4 ministros do STF, Alcolumbre e Motta em jantar no Alvorada", "url": "https://www.poder360.com.br/poder-governo/lula-recebe-4-ministros-do-stf-alcolumbre-e-motta-em-jantar-no-alvorada/", "fonte_id": "poder360", "data_pub": "2026-11-23T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Luiz Inácio Lula da Silva recebeu quatro ministros do Supremo Tribunal Federal (STF), o presidente do Senado, Rodrigo Alcolumbre, e o líder do governo no Congresso, Ricardo Motta, em um jantar no Palácio do Alvorada. Lula indicou que deseja iniciar seu possível quarto mandato com o apoio mais firme dos partidos do Centrão.", "titulo_pt": "Lula recebe ministros do STF, Alcolumbre e Motta em jantar no Alvorada", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 281552, "titulo": "Partido pede a Fachin o afastamento de Andrei Rodrigues da chefia da PF", "url": "https://veja.abril.com.br/politica/partido-pede-a-fachin-o-afastamento-de-andrei-rodrigues-da-chefia-da-pf/", "fonte_id": "veja", "data_pub": "2026-11-23T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido pediu ao ministro Fachin o afastamento de Andrei Rodrigues da chefia da Polícia Federal. O pedido foi feito porque o diretor-geral está sendo investigado pelo Banco Master.", "titulo_pt": "Partido pede afastamento de Andrei Rodrigues da PF", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 281571, "titulo": "Médico condenado na \"Máfia das Próteses\" é encontrado morto na Asa Norte", "url": "https://www.metropoles.com/distrito-federal/na-mira/medico-condenado-na-mafia-das-proteses-e-encontrado-morto-na-asa-norte", "fonte_id": "metropoles", "data_pub": "2026-11-23T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Familiares encontraram o ortopedista Henry Greidinger Campos morto em seu apartamento, com um corte na testa. A Polícia Civil aguarda os laudos para determinar as causas exatas da morte.", "titulo_pt": "Médico condenado na 'Máfia das Próteses' é encontrado morto no apartamento", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 281555, "titulo": "PF prevê gasto de R$ 11,4 milhões com três blindados para Lula", "url": "https://veja.abril.com.br/coluna/faria-lima-news/pf-preve-gasto-de-r-114-milhoes-com-tres-blindados-para-lula/", "fonte_id": "veja", "data_pub": "2026-11-23T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal planeja gastar R$ 11,4 milhões com a aquisição de três sedãs blindados para o transporte do presidente Lula.", "titulo_pt": "PF prevê gasto de R$ 11,4 milhões com três blindados para Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 281505, "titulo": "Memorial da América Latina renomeia espaços internos e homenageia líderes comunistas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/memorial-da-america-latina-renomeia-espacos-internos-e-homenageia-lideres-comunistas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-23T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Memorial da América Latina renomeou espaços internos do complexo cultural para homenagear o casal de líderes comunistas Luís Carlos Prestes e Olga Benário. A decisão foi anunciada pelo presidente do Memorial, Pedro Mastrobuono.", "titulo_pt": "Memorial da América Latina renomeia espaços internos em homenagem a líderes comunistas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 281560, "titulo": "A decisão de Alexandre de Moraes que acelera tramitação de denúncia contra Flávio Bolsonaro", "url": "https://veja.abril.com.br/brasil/a-decisao-de-alexandre-de-moraes-que-acelera-tramitacao-de-denuncia-contra-flavio-bolsonaro/", "fonte_id": "veja", "data_pub": "2026-11-23T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alexandre de Moraes expediu uma decisão que acelerou a tramitação de uma denúncia contra Flávio Bolsonaro, apresentada pela Procuradoria-Geral da República, acusando-o de calúnia contra Lula, por uma fala que vinculou Lula a Nicolás Maduro.", "titulo_pt": "Decisão de Alexandre de Moraes acelera tramitação de denúncia contra Flávio Bolsonaro por calúnia contra lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 281562, "titulo": "Gilmar Mendes critica ‘modelos de negócio’ judiciais e alerta para execuções bilionárias no TRF-1", "url": "https://veja.abril.com.br/brasil/gilmar-mendes-critica-modelos-de-negocio-judiciais-e-alerta-para-execucoes-bilionarias-no-trf-1/", "fonte_id": "veja", "data_pub": "2026-11-23T17:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes criticou os modelos de negócio judiciais e alertou para o passivo judicial de R$ 255 bilhões no setor sucroalcooleiro, que está acumulando execuções bilionárias no TRF-1.", "titulo_pt": "Gilmar Mendes critica modelos de negócio judiciais e alerta para execuções bilionárias no TRF-1", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 281653, "titulo": "Delação ajuda Polícia Federal em caso de venda de sentenças no Maranhão", "url": "https://www.cnnbrasil.com.br/politica/delacao-ajuda-policia-federal-em-caso-de-venda-de-sentencas-no-maranhao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-23T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quatro desembargadores, dois juízes e três ex-assessores foram considerados réus no Superior Tribunal de Justiça (STJ) após uma investigação apontar lucros de R$ 54 milhões provenientes de vendas de sentenças no Maranhão. A apuração foi realizada pelo Live CNN, com base nas delações premiadas.", "titulo_pt": "Delação ajuda Polícia Federal a identificar réus no caso de venda de sentenças no Maranhão", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 281836, "titulo": "Fachin suspende decisão do STJ e libera benefício a vítimas de Brumadinho", "url": "https://www.jota.info/stf/do-supremo/fachin-suspende-decisao-do-stj-e-libera-beneficio-a-vitimas-de-brumadinho", "fonte_id": "jota", "data_pub": "2026-11-23T16:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF (Supremo Tribunal Federal) suspendeu uma decisão do STJ (Superior Tribunal de Justiça) que havia liberado benefícios para vítimas do rompimento da barragem de Brumadinho. A Vale tenta reverter essa ordem para assegurar o custeio do auxílio às vítimas.", "titulo_pt": "Presidente do stf suspende decisão do STJ e libera benefício a vítimas de Brumadinho", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 281661, "titulo": "Bolsonaro pede autorização para receber advogado durante internação", "url": "https://www.cnnbrasil.com.br/politica/bolsonaro-pede-autorizacao-para-receber-advogado-durante-internacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-23T16:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Jair Bolsonaro solicitou autorização para receber seu advogado durante sua internação hospitalar. A decisão sobre o pedido será tomada pelo ministro Alexandre de Moraes. Nas últimas visitas, permitiu-se que todos os filhos do ex-presidente, que permanece na UTI com diagnóstico de obstrução intestinal, o visitassem regularmente.", "titulo_pt": "Bolsonaro solicita autorização para receber advogado durante internação", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 281569, "titulo": "O arranjo defendido por especialistas para o futuro Ministério da Segurança Pública", "url": "https://veja.abril.com.br/politica/o-arranjo-defendido-por-especialistas-para-o-futuro-ministerio-da-seguranca-publica/", "fonte_id": "veja", "data_pub": "2026-11-23T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Segurança Pública deve ser criado nas próximas semanas, em resposta à aprovação da Proposta de Emenda Constitucional (PEC) da Segurança Pública no Congresso.", "titulo_pt": "Arranjo defendido por especialistas para o futuro Ministério da Segurança Pública", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 281506, "titulo": "Moretti garante às centrais sindicais que ajuste fiscal preserva direitos sociais", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/moretti-garante-as-centrais-sindicais-que-ajuste-fiscal-preserva-direitos-sociais.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-23T16:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Planejamento, Bruno Moretti, assegurou às centrais sindicais que o ajuste fiscal conhecido como plano Moretti visa preservar os direitos sociais. O projeto deve ser votado na Câmara dos Deputados nesta segunda-feira (23).", "titulo_pt": "Moretti garante às centrais sindicais que ajuste fiscal preserva direitos sociais", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 281507, "titulo": "Alcolumbre vincula emendas à relação com Lula em busca de votos no Senado, dizem aliados", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/alcolumbre-vincula-emendas-a-relacao-com-lula-em-busca-de-votos-no-senado-dizem-aliados.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-23T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Davi Alcolumbre (União Brasil - AP), estaria vinculando a liberação de emendas de comissão à relação com o presidente Lula (PT) para tentar obter votos no Senado. Essa transferência não tem liberação obrigatória e depende da boa vontade do governo Lula.", "titulo_pt": "Alcolumbre vincula emendas à relação com Lula em busca de votos no Senado, dizem aliados", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 281508, "titulo": "9º Prêmio de Jornalismo em Seguros oferece até R$ 20 mil para reportagens", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/novo-em-folha/2026/11/9o-premio-de-jornalismo-em-seguros-oferece-ate-r-20-mil-para-reportagens.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-23T14:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estão abertas as inscrições para o 9º Prêmio de Jornalismo em Seguros, promovido pela Escola de Negócios e Seguros, pela Federação Nacional dos Corretores de Seguros e pela Confederação Nacional das Empresas de Seguros. A premiação oferece prêmios de até R$ 20 mil para reportagens sobre o mercado de seguros e sua importância para a sociedade e a economia.", "titulo_pt": "9º Prêmio de Jornalismo em Seguros oferece até R$ 20 mil para reportagens", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 282043, "titulo": "'Deeply shocked': Gisèle Pelicot to sue publisher after nude photos used in book campaign", "url": "https://www.france24.com/en/france/20261123-deeply-shocked-gis%C3%A8le-pelicot-sue-publisher-nude-photos-used-book-campaign", "fonte_id": "france24", "data_pub": "2026-11-23T17:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ativista feminista francesa Gisèle Pelicot, que se tornou um símbolo mundial contra a violência sexual durante os julgamentos de 2024 contra seu marido e outros homens, anunciou que irá processar um editor após nudezas suas serem utilizadas sem consentimento para promover um livro sobre controle coercitivo de um psicanalista.", "titulo_pt": "Gisèle Pelicot processará editor após uso indevido de fotos nuas", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 281871, "titulo": "Don Toliver Concert in Manchester Is Evacuated Over ‘Unknown Substance’", "url": "https://www.nytimes.com/2026/11/23/world/europe/manchester-don-toliver-concert-evacuation-uk.html", "fonte_id": "nyt_world", "data_pub": "2026-11-23T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rapper americano Don Toliver estava em um show em Manchester quando a presença de uma substância desconhecida levou ao evacuação do local. Uma resposta de emergência foi acionada devido aos efeitos sentidos pelos espectadores.", "titulo_pt": "Concerto de don Toliver em Manchester é evacuado por substância desconhecida", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 281872, "titulo": "How Homeowners Are Powering Vietnam’s E-Bike Surge", "url": "https://www.nytimes.com/video/world/asia/100000011212632/vietnam-electric-bike-ebikes-charging-stations.html", "fonte_id": "nyt_world", "data_pub": "2026-11-23T17:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O conflito na Irã levou a uma rápida transição de motocicletas para bicicletas elétricas em Vietnam, gerando uma economia informal de recarga liderada por empreendedores proprietários de residências.", "titulo_pt": "Como moradores estão impulsionando a onda de e-bikes em Vietnam", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 281884, "titulo": "What tactics will Burnham use to sell his EU plans? – podcast", "url": "https://www.theguardian.com/politics/audio/2026/nov/23/what-tactics-will-burnham-use-to-sell-his-eu-plans-podcast", "fonte_id": "guardian_world", "data_pub": "2026-11-23T17:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andy Burnham apresentou seus planos para obter aprovação parlamentar para um novo acordo com a UE, mas as opções para a reentrada do Reino Unido na UE, conhecida como 'Breturn', ainda não serão detalhadas até dezembro. O primeiro-ministro discutirá com Pippa como espera convencer o público a considerar a reversão do Brexit.", "titulo_pt": "Qual estratégia Burnham usará para vender seus planos da ue?", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 282091, "titulo": "Attacks on two Russian ships in Libyan waters mark new turn in Ukraine war", "url": "https://www.lemonde.fr/en/le-monde-africa/article/2026/11/23/attacks-on-two-russian-ships-in-libyan-waters-mark-new-turn-in-ukraine-war_6787337_124.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-23T17:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente ucraniano Volodymyr Zelensky afirmou que sete drones navais realizaram dois ataques perto da costa de Bengasi. O ataque a navios russos transportando armas demonstra a capacidade de Kiev de atingir interesses russos em qualquer lugar.", "titulo_pt": "Ataques a duas embarcações russas na costa líbia marcam novo capítulo na guerra ucraniana", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 281578, "titulo": "Moraes diz que Flávio fugiu e manda notificá-lo por calúnia contra Lula", "url": "https://www.metropoles.com/colunas/manoela-alcantara/moraes-notifica-flavio-calunia-lula", "fonte_id": "metropoles", "data_pub": "2026-11-23T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Moraes afirmou que o senador Flávio Bolsonaro fugiu para os Estados Unidos, mesmo com bloqueio dos passaportes pelo STF. Uma notificação será feita por edital.", "titulo_pt": "Moraes afirma que Flávio fugiu para os EUA e manda notificá-lo por calúnia contra Lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 282300, "titulo": "Nato vows space defence after Russia nuclear satellite report", "url": "https://www.scmp.com/news/world/russia-central-asia/article/3375522/nato-vows-space-defence-after-russia-nuclear-satellite-report", "fonte_id": "scmp", "data_pub": "2026-11-23T16:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe do Norte Atlântico, Mark Rutte, declarou que a aliança vai se defender contra ameaças espaciais em resposta a relatos de mídia alemãs sobre a possibilidade de Russia lançar um satélite nuclear. Rutte prometeu que a aliança vai garantir a defesa necessária.", "titulo_pt": "Nato se compromete com defesa espacial após relatos sobre satélite nuclear da Russia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 282187, "titulo": "Iranian army says it destroyed US drone over Persian Gulf", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/iranian-army-says-it-destroyed-us-drone-over-persian-gulf", "fonte_id": "middle_east_eye", "data_pub": "2026-11-23T16:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O exército iraniano afirmou ter destruído um dron americano do tipo Lucas no Golfo Persa. De acordo com a agência de notícias semi-oficial Tasnim, o dron foi abatido pelos sistemas de defesa aérea do exército sob o controle da rede de defesa aérea integrada do país, nas águas orientais do Estreito de Ormuz.", "titulo_pt": "Exército iraniano diz ter destruído dron americano no golfo persa", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 281885, "titulo": "EU sanctions package intended to ‘keep pressure’ on Russia and ‘strike harder’ at its ability to fund Ukraine war – as it happened", "url": "https://www.theguardian.com/world/live/2026/nov/23/russia-ukraine-war-zelenskyy-libya-benghazi-drone-attack-ship-merkury-un-nato-europe-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-11-23T16:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A presidente da Comissão Europeia, Ursula von der Leyen, anunciou o 22º pacote de sanções contra a Rússia. O chefe do governo holandês, Mark Rutte, enfatizou a importância de fornecer suprimentos essenciais para a Ucrânia, incluindo armas de defesa aérea, argumentando que isso fortaleceria as negociações futuras da Ucrânia com a Rússia.", "titulo_pt": "Pacote de sanções da ue visa manter pressão sobre a Rússia e atingi-la mais intensamente no financiamento da guerra na Ucrânia – como aconteceu", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 281878, "titulo": "Lucy Powell to visit China to promote UK education weeks after MI5 warning", "url": "https://www.theguardian.com/politics/2026/nov/23/uk-visit-china-lucy-powell-education-mi5-universities-warning", "fonte_id": "guardian_world", "data_pub": "2026-11-23T16:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A secretária de Educação, Lucy Powell, viajará para Beijing esta semana para promover a educação britânica, acompanhada por uma delegação de 50 pessoas, incluindo líderes universitários. Esta viagem ocorre semanas após a MI5 emitir um alerta raro para as universidades sobre a interferência chinesa na academia britânica.", "titulo_pt": "Lucy Powell viajará para China para promover educação britânica, após alerta MI5", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 282163, "titulo": "Israeli strikes kill at least three, including UNRWA worker, in Gaza", "url": "https://www.aljazeera.com/news/2026/11/23/israeli-drone-strike-kills-unrwa-worker-in-gaza?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-23T16:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel realizou ataques em Gaza, resultando na morte de pelo menos três pessoas, incluindo um trabalhador da ONU. Apesar de um acordo de cessar-fogo em outubro de 2025, Israel continua a lançar ataques no enclave.", "titulo_pt": "Israel atinge Gaza, matando pelo menos três, incluindo trabalhador da ONU, em desacordo com acordo de cessar-fogo", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 282164, "titulo": "Gaza mourns UNRWA worker killed in Israeli strike", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/23/gaza-mourns-unrwa-worker-killed-in-israeli-strike?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-23T16:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Palestinos se lamentaram pelo funcionário da ONU para Assuntos de Refugiados Palestinianos (UNRWA), Adel al-Helou, que foi morto em uma aeronave israelense em um ataque durante o seu turno.", "titulo_pt": "Gaza lamenta funcionário da UNRWA morto em ataque israelense", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 281711, "titulo": "Ofensiva israelense transformou Gaza em \"deserto tóxico\", diz ONG britânica", "url": "https://www.dw.com/pt-br/ofensiva-israelense-transformou-gaza-em-deserto-tóxico-diz-ong-britânica/a-80021668?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-23T16:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Oxfam alerta que a contaminação ambiental em Gaza pode afetar a saúde da população por décadas. A ofensiva israelense recente contribuiu para transformar Gaza em um 'deserto tóxico', com sinais de poluição em mais de 99% do território.", "titulo_pt": "Ofensiva israelense transformou Gaza em 'deserto tóxico', alerta ONG", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 282188, "titulo": "Yemeni government: Civilians killed, injured in Houthi attack in Lahij", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/saudi-backed-yemeni-government-civilians-killed-injured-houthi-attack", "fonte_id": "middle_east_eye", "data_pub": "2026-11-23T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo yemenita afirmou que civis foram mortos ou feridos em um ataque realizado pelos hutitas em um ônibus na província de Lahij na segunda-feira. Autoridades locais consideraram o ataque um 'crime de guerra completo' que deve ser anotado no 'cadastro criminal' dos hutitas.", "titulo_pt": "Governo yemenita: civis mortos ou feridos em ataque hutita em Lahij", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 282323, "titulo": "Serbia’s Student Movement Criticises European Parliament’s Vukovar Resolution", "url": "https://balkaninsight.com/2026/11/23/serbias-student-movement-criticises-european-parliaments-vukovar-resolution/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-23T16:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O movimento estudantil da Sérvia criticou a resolução do Parlamento Europeu sobre o 35º aniversário da queda da cidade croata de Vukovar, afirmando que ela oferece apenas uma interpretação parcial do passado e ignora o sofrimento sérvio durante a guerra na Croácia.", "titulo_pt": "Movimento estudantil sérvio critica resolução do parlamento europeu sobre Vukovar", "v lasse": "A"}, {"id": 281457, "titulo": "CrowdStrike compra empresa de segurança em nuvem por US$ 44 bi em negociação recorde no setor", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/crowdstrike-compra-empresa-de-seguranca-em-nuvem-por-us-44-bi-em-negociacao-recorde-no-setor.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-23T16:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa de tecnologia norte-americana CrowdStrike anunciou a aquisição da Zscaler, uma empresa de segurança em nuvem, por aproximadamente 44 bilhões de dólares, uma transação que pode se tornar a maior da história no setor de segurança cibernética.", "titulo_pt": "Crowdstrike adquire zscaler por cerca de 44 bi em negociação recorde no setor de segurança cibernética", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 282218, "titulo": "Huang’s return is a triumph of money over morals", "url": "https://www.ft.com/content/189b5df2-2d06-42db-8843-1a542efb0a8f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-23T16:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O valor elevado das ações da empresa de processadores de chip sugere que os investidores apoiam o retorno surpreendente do codificador da empresa.", "titulo_pt": "Retorno de huang é um triunfo do dinheiro sobre a moral", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 281837, "titulo": "Depois do PIS/Cofins: o futuro do contencioso da CBS no Carf e na Justiça", "url": "https://www.jota.info/coberturas-especiais/pulso-da-reforma/depois-do-pis-cofins-o-futuro-do-contencioso-da-cbs-no-carf-e-na-justica", "fonte_id": "jota", "data_pub": "2026-11-23T16:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O contencioso da Contribuição para o Financiamento do Sistema de Seguridade Social (CBS) não termina com o PIS/Cofins; continua com n - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 281462, "titulo": "Mitre volta a São Caetano após dez anos e vende 40% de empreendimento em uma semana", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/mitre-volta-a-sao-caetano-apos-dez-anos-e-vende-40-de-empreendimento-em-uma-semana.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-23T15:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Mitre Realty, que havia parado de lançar em São Caetano do Sul há dez anos, está de volta com o projeto Casa Parque Cerâmica. Em apenas uma semana, 40% das 202 unidades foram vendidas, gerando receita de R$ 200 milhões de um potencial total de R$ 565 milhões.", "titulo_pt": "Mitre retorna a São Caetano após dez anos e vende 40% de empreendimento rapidamente", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 281463, "titulo": "Braskem fecha acordo com credores para capitalização de US$ 4,9 bilhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/braskem-fecha-acordo-com-credores-para-capitalizacao-de-us-49-bilhoes-dizem-fontes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-23T14:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Braskem concluiu um acordo com seus credores para reestruturar sua dívida, levantando US$ 4,9 bilhões por meio de capitalização. A Petrobras contribuirá com US$ 1,3 bilhão desse total.", "titulo_pt": "Braskem fecha acordo com credores para capitalização de US$ 4,9 bilhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 281465, "titulo": "Justiça libera R$ 2,8 bilhões em atrasados do INSS; veja quem recebe", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/justica-libera-r-28-bilhoes-em-atrasados-do-inss-veja-quem-recebe.shtml", "font istas.", "titulo_pt": "Ue inicia investigação antitruste contra Coca-Cola em relação a varejistas europeus", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 281467, "titulo": "Crise do Ueno testa fôlego do Paraguai para atrair empresas que buscam menos impostos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/crise-do-ueno-testa-folego-do-paraguai-para-atrair-empresas-que-buscam-menos-impostos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-23T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A crise bancária e política no Paraguai ameaça o modelo de atração de investimentos do país, especialmente para empresas brasileiras que buscam reduzir custos e impostos. O evento testa o fôlego do Paraguai em manter sua competitividade econômica frente a outros destinos com benefícios fiscais mais atrativos.", "titulo_pt": "Crise do Ueno coloca em xeque investimentos no Paraguai", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 281470, "titulo": "Dólar supera R$ 6 com votação de pacote fiscal e aversão global ao risco; Bolsa recua", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/dolar-abre-em-alta-e-supera-r-598-com-votacao-de-pacote-fiscal-e-aversao-global-ao-risco.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-23T12:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar atingiu R$ 6 após mais de um ano e meio, impulsionado por preocupações com a política fiscal do governo Lula e pela maior aversão global ao risco, que favorece a moeda americana. A bolsa recuou em consonância com essas condições de mercado.", "titulo_pt": "Dólar supera R$ 6 com votação de pacote fiscal e aversão global ao risco; Bolsa recua", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 282133, "titulo": "CrowdStrike to buy Zscaler in $44 billion deal as AI supercharges cyberattacks", "url": "https://www.cnbc.com/2026/11/23/crowdstrike-zscaler-aquisition-ai-cyberattacks.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-23T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A CrowdStrike está adquirindo o Zscaler por 44 bilhões de dólares. A competição na área tem investido bilhões para fortalecer as defesas diante das ameaças cibernéticas impulsionadas por inteligência artificial.", "titulo_pt": "Crowdstrike adquire Zscaler por 44 bilhões de dólares enquanto competidores investem bilhões em defesas contra ameaças de IA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 281755, "titulo": "Funcionário da Anthropic afirma ter resolvido um dos maiores problemas da matemática com IA", "url": "https://www.bbc.com/portuguese/articles/c5y4jer308n4o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-23T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um matemático da empresa Anthropic afirma ter usado inteligência artificial para resolver a famosa hipótese de Riemann. A verificação da solução, no entanto, ainda levará algum tempo.", "titulo_pt": "Funcionário da Anthropic afirma ter resolvido a famosa hipótese de riemann com IA", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 282332, "titulo": "A legendary philosopher isn’t buying Anthropic’s consciousness argument", "url": "https://www.technologyreview.com/2026/11/23/1149569/a-legendary-philosopher-isnt-buying-anthropics-consciousness-argument/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-23T17:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A filósofa renomada não apoia a argumentação da Anthropic sobre a consciência da IA. A Anthropic incluiu a possibilidade de que a IA possa ser consciente ou senciente como um risco para investidores, antes de anunciar publicamente.", "titulo_pt": "Filósofa renomada não concorda com argumento de consciência da Anthropic", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 282130, "titulo": "SpaceX sued by Oregon and Virginia over AI deepfake porn, Grok safety claims", "url": "https://www.cnbc.com/2026/11/23/oregon-virginia-spacex-grok-deepfake-lawsuits.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-23T16:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estado da Oregon e da Virginia processaram a SpaceX, acusando-a de criar e distribuir conteúdo pornográfico de deepfake sem consentimento. Os estados buscam multas civis e injunções para impedir a criação e a distribuição desse tipo de conteúdo não consensual.", "titulo_pt": "Oregon e Virginia processam spacex por AI de deepfake pornográfico sem consentimento e preocupações de segurança", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 282219, "titulo": "Nvidia and Nasdaq soar after board reinstates Huang", "url": "https://www.ft.com/content/20d2ebe3-e945-4659-a122-31bf85a4e4e5?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-23T16:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nvidia e Nasdaq subiram após a diretoria reinstalar Huang no conselho de administração. Esta decisão levou a uma reação positiva no mercado, refletida nos altos nas ações das empresas.", "titulo_pt": "Nvidia e Nasdaq avançam após Huang ser readmitido no conselho", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 282370, "titulo": "(LEAD) SK hynix's U.S.-traded shares surge over 20 pct in Mon. morning trading after Nvidia CEO's reinstatement", "url": "https://en.yna.co.kr/view/AEN20261124000251315", "fonte_id": "yonhap_news", "data_pub": "2026-11-23T16:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da SK hynix negociadas nos Estados Unidos subiram mais de 20% nas negociações da manhã de segunda-feira após o reinício das funções do CEO da Nvidia.", "titulo_pt": "Ações da SK hynix nos EUA ganham mais de 20% após reinício do CEO da Nvidia", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 282371, "titulo": "SK hynix's U.S.-traded shares surge over 20 pct early Mon. morning after Nvidia CEO's reinstatement", "url": "https://en.yna.co.kr/view/AEN20261124000200315", "fonte_id": "yonhap_news", "data_pub": "2026-11-23T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da SK hynix negociadas nos Estados Unidos subiram mais de 20% no início da manhã de segunda-feira após o reinício das funções do CEO da Nvidia.", "titulo_pt": "Ações da SK hynix nos EUA ganham mais de 20% após reinício do CEO da Nvidia", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 281461, "titulo": "Como os anéis da Oura foram parar em milhões de dedos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/como-os-aneis-da-oura-foram-parar-em-milhoes-de-dedos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-23T15:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Oura surgiu em 2013 com a ideia de que um anel de monitoramento de saúde seria mais preciso e menos invasivo do que pulseiras, e poderia acompanhar uma variedade de indicadores de saúde além de exercícios. Seus fundadores finlandeses acreditavam que o anel seria mais próximo do fluxo sanguíneo e poderia ser usado por uma ampla gama de pessoas, não apenas por aqueles obcecados com a boa forma.", "titulo_pt": "Como os anéis da Oura se tornaram populares entre milhões de usuários", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 282430, "titulo": "Learn How 5G NTN Architecture, Mobility, and Testing Shape 6G", "url": "https://content.knowledgehub.wiley.com/5g-ntn-takes-flight-a-deep-dive-into-nr-ntn-technology-and-testing-aspects/", "fonte_id": "ieee_spectrum", "data_pub": "2026-11-23T14:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo explica como as especificações 3GPP de versões de liberação de 15 a 19 estabeleceram a base para NR-NTN, e como a arquitetura de payload transparente e regenerativa de satélites difere, afetando o tempo de ida e volta, o orçamento de link e a complexidade do hardware. Também discute como as distâncias longas, os satélites em movimento rápido e o desvio Doppler desafiam a camada física, incluindo sincronização, avance de tempo e operação HARQ.", "titulo_pt": "Aprenda como a arquitetura 5G NTN, mobilidade e testes moldam o 6G", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 282399, "titulo": "Nvidia Is Powering Brain-Computer Interfaces Now", "url": "https://www.wired.com/story/nvidia-is-powering-brain-computer-interfaces-now/", "fonte_id": "wired", "data_pub": "2026-11-23T13:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de interfaces cérebro-computador Paradromics está utilizando a tecnologia de hardware e software da Nvidia para processar dados do cérebro.", "titulo_pt": "Nvidia está impulsionando Interfaces cérebro-computador agora", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 282333, "titulo": "The Download: AI’s judgment problem and carbon removal’s crop threat", "url": "https://www.technologyreview.com/2026/11/23/1149548/the-download-ai-judgment-problem-carbon-removal-crop-threat/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-23T13:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo relatório do METR, uma organização não lucrativa de avaliação de IA, indica que algumas capacidades de IA estão melhorando exponencialmente, mas os modelos ainda não são perfeitos. O relatório atualiza um gráfico amplamente discutido sobre o progresso da IA.", "titulo_pt": "Download: o problema de julgamento da IA e a ameaça de remoção de carbono para as culturas", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 282400, "titulo": "Submit Your Questions: Will Anyone Keep You Safe From AI?", "url": "https://www.wired.com/story/livestream-will-anyone-keep-us-safe-from-ai/", "fonte_id": "wired", "data_pub": "2026-11-23T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos concordam que a IA, de alguma forma, representa uma verdadeira ameaça. Um evento ao vivo será realizado em 2 de dezembro para responder às perguntas dos espectadores sobre como a indústria vai lidar com isso.", "titulo_pt": "Pergunte sua questão: alguém manterá você seguro diante da IA?", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 282402, "titulo": "A Former DOGE Operative Won a Federal Contract. Then Things Got Messy", "url": "https://www.wired.com/story/he-worked-with-doge-now-hes-bidding-for-government-contracts/", "fonte_id": "wired", "data_pub": "2026-11-23T11:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Yat Choi, cidadão canadense, passou por DOGE e o National Design Studio antes de fundar a própria empresa, Govmaxxing.", "titulo_pt": "Ex-membro do DOGE conseguiu contrato Federal, mas coisas complicadas seguiram", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 282403, "titulo": "‘Babylon on the Potomac’: Pete Hegseth’s Radical DC Church Attracts Government Elites", "url": "https://www.wired.com/story/babylon-on-the-potomac-pete-hegseths-radical-dc-church-attracts-government-elites/", "fonte_id": "wired", "data_pub": "2026-11-23T11:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Doug Wilson, um pastor idahoense que deseja revogar o direito ao voto feminino, estabeleceu sua igreja em Washington, DC, no ano passado. Agora, seu culto conta com membros de alto escalão do Pentágono e de outras esferas do governo.", "titulo_pt": "Babylon no Potomac: igreja Radical de doug wilson em DC atraí Government Elites", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 282223, "titulo": "CrowdStrike to buy Zscaler in $44bn deal as cyber threats mount", "url": "https://www.ft.com/content/762bd05d-8e20-4abf-9bc5-4e6f9bf628cb?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-23T11:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A CrowdStrike está adquirindo o Zscaler por 44 bilhões de dólares em uma aquisição integralmente em ações. Esta transação ocorre em um momento em que empresas e governos globais enfrentam uma onda de falhas tecnológicas.", "titulo_pt": "Crowdstrike adquirirá Zscaler por 44 bilhões de dólares", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 282334, "titulo": "Why using rocks for carbon removal could eventually reduce crop growth", "url": "https://www.technologyreview.com/2026/11/23/1149392/why-using-rocks-for-carbon-removal-could-eventually-reduce-crop-growth/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-23T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tech companies estão investindo pesadamente em rochas para remoção de carbono. Google, Microsoft e outras empresas comprometeram centenas de milhões de dólares para financiar startups que espalham rochas trituradas, como basalto e olivina, em fazendas, com o objetivo de capturar carbono do ar e armazená-lo.", "titulo_pt": "Por que o uso de rochas para remoção de carbono eventualmente pode reduzir o crescimento das culturas", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 282513, "titulo": "Studying Cancer Cells in Microgravity", "url": "https://www.nasa.gov/image-article/studying-cancer-cells-in-microgravity/", "fonte_id": "nasa_news", "data_pub": "2026-11-23T17:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo realizado em 19 de novembro de 2026, utilizando um biochip Encapsulates, mostrou microtumores gástricos cultivados em células cancerosas. A investigação Encapsulate-1, realizada a bordo da Estação Espacial Internacional, analisa amostras tumorais provenientes de pacientes para compreender melhor como as células cancerosas se movem e interagem em microgravidade. Os resultados podem auxiliar na criação de testes mais precisos para prever o risco de metástase em pacientes e apoiar a medicina personalizada.", "titulo_pt": "Estudo de células cancerosas em microgravidade", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 282514, "titulo": "NASA Seeks Partners to Design First Nuclear Reactor for the Moon", "url": "https://www.nasa.gov/directorates/rtmd/nasa-seeks-partners-to-design-first-nuclear-reactor-for-the-moon/", "fonte_id": "nasa_news", "data_pub": "2026-11-23T17:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está buscando parceiros do setor privado para desenvolver e testar o primeiro reator nuclear que fornecerá eletricidade na Lua, um passo importante para estabelecer uma presença humana contínua na superfície lunar. O Lunar Reactor-1 (LR-1) será um sistema de potência nuclear pequeno que gerará 20 kilowatts de eletricidade.", "titulo_pt": "NASA busca parceiros para desenvolver primeiro reator Nuclear para a lua", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 281558, "titulo": "Novo tratamento para o câncer de mama é aprovado pela Anvisa", "url": "https://veja.abril.com.br/saude/novo-tratamento-para-o-cancer-de-mama-e-aprovado-pela-anvisa/", "fonte_id": "veja", "data_pub": "2026-11-23T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa aprovou um novo medicamento biossimilar para o tratamento do câncer de mama, tanto para casos iniciais quanto para tumores avançados. A autorização também incluiu o uso da droga para o tratamento de câncer de bexiga.", "titulo_pt": "Novo medicamento biossimilar para câncer de mama é aprovado pela Anvisa", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 282515, "titulo": "NASA+ Documentary Captures Europa Clipper’s Journey Into Deep Space", "url": "https://www.nasa.gov/missions/europa-clipper/nasa-documentary-captures-europa-clippers-journey-into-deep-space/", "fonte_id": "nasa_news", "data_pub": "2026-11-23T16:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA lançou um novo documentário intitulado 'O Conceito de Europa' que mostra a jornada do projeto Europa Clipper desde uma ideia inicial até se tornar uma missão de exploração espacial avançada. O documentário será exibido nas plataformas oficiais da NASA a partir de 23 de novembro.", "titulo_pt": "Documentário da NASA revela jornada do Europa Clipper", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 282466, "titulo": "The notion of ‘positive masculinity’ is dividing the male studies field", "url": "https://www.sciencenews.org/article/positive-masculinity-male-studies-field", "fonte_id": "science_news", "data_pub": "2026-11-23T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A noção de 'masculinidade positiva' está dividindo o campo de estudos masculinos. Os pesquisadores não concordam sobre como reescrever a narrativa para melhorar o bem-estar masculino.", "titulo_pt": "A noção de 'masculinidade positiva' está dividindo o campo de estudos masculinos", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 282516, "titulo": "NASA’s Webb Shows How Supernova Dust Chronicles Star Evolution", "url": "https://science.nasa.gov/missions/webb/nasas-webb-shows-how-supernova-dust-chronicles-star-evolution/", "fonte_id": "nasa_news", "data_pub": "2026-11-23T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Telescópio Espacial James Webb da NASA produziu uma observação de alta resolução e infravermelha do restante de supernova Cassiopeia A, revelando detalhes sobre a evolução das estrelas.", "titulo_pt": "Webb da nasa mostra como restos de Supernova cas a narram a evolução das estrelas", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 282456, "titulo": "STAT+: A big win for a potential competitor for Dupixent eczema treatment", "url": "https://www.statnews.com/2026/11/23/biotech-news-a-big-win-for-potential-dupixent-competitor-eczema-treatment/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-23T14:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo com 244 pacientes mostrou que a Kymera Therapeutics pode oferecer alívio para pacientes com eczema semelhante ao Dupixent, possivelmente em forma de pílula.", "titulo_pt": "Grande vitória para um possível concorrente do Dupixent no tratamento do eczema", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 282457, "titulo": "STAT+: Pharmalittle: We’re reading about Capricor’s Duchenne drug, Lilly’s 15th acquisition of 2026, and more", "url": "https://www.statnews.com/pharmalot/2026/11/23/fda-rejects-capricor-duchenne-drug-lilly-acquires-loqus23-therapeutics/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-23T14:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA rejeitou novamente um medicamento experimental para Duchenne muscular dystrofia desenvolvido pela Capricor Therapeutics, um assunto debatido amplamente.", "titulo_pt": "Pharmalittle: estamos lendo sobre o medicamento experimental da Capricor para Duchenne, a 15ª aquisição da Lilly em 2026, e mais", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 282467, "titulo": "‘Mitt & Ted’ recounts how a political odd couple changed U.S. health care", "url": "https://www.sciencenews.org/article/mitt-and-ted-healthcare-podcast", "fonte_id": "science_news", "data_pub": "2026-11-23T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova temporada do podcast The Big Dig conta a história de como Mitt Romney e Ted Kennedy, aliad
