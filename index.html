<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 24/10/2026 15:21 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">

      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>

  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "24/10/2026 15:21", "stats": {"noticias_novas": 674, "resumos_gerados": 234}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "No último dia de campanha, Luiz Inácio Lula da Silva e Flávio Bolsonaro realizaram atos nas ruas do Rio de Janeiro e Belo Horizonte, lotando as áreas onde passaram. Os candidatos buscaram reforçar suas bases na Região Sudeste antes do pleito presidencial. Willer Tomaz, amigo de Flávio Bolsonaro, está construindo uma casa com três andares e um heliponto em uma propriedade de 764 m² em Brasília, após a compra e demolição de um edifício existente no local. A Procuradoria-Geral da República pediu ao Supremo Tribunal Federal para suspender a exigência de autorização prévia da Justiça Eleitoral para o transporte de indígenas no segundo turno das eleições, alegando que isso pode dificultar o acesso dos eleitores às urnas. A Quaest realizou um levantamento com 1.537 eleitores em todo o Brasil e apontou que Flávio Bolsonaro tem 51,4% dos votos válidos, enquanto Lula tem 48,6%. A última pesquisa Quaest antes do segundo turno será divulgada às 18h deste sábado, às vésperas do pleito presidencial.", "mundo": "Em Israel, a Autoridade Palestina pediu pressão internacional após operações que resultaram na morte de dois soldados israelenses e na expulsão de milhares de palestinos de suas casas em Hebron, na Cisjordânia. Manifestações de protesto contra o alto custo de vida continuam em vários países, com cerca de 800 mil pessoas em todo o país francês e 110 mil em Paris. No Brasil, os eleitores escolherão entre Jair Bolsonaro e Luiz Inácio Lula da Silva para presidente, com ambos realizando eventos em duas cidades diferentes. Na China, Pequim pediu aos Estados Unidos que interrompessem novas restrições ao investimento estrangeiro, alegando que isso prejudicaria as relações econômicas bilaterais. O líder norte-coreano Kim Jong-un visitou a China, enquanto o ex-deputado Eduardo defendeu uma intervenção militar americana em caso de derrota para Flávio, seu irmão candidato a presidente no Brasil.\n\nO conflito geopolítico na região do Oriente Médio e do Golfo Pérsico continua a se intensificar, com múltiplos incidentes e operações militares em diferentes locais. Em Hebron, Israel realizou operações que deslocaram centenas de famílias palestinas. A Arábia Saudita relatou a interceptação de mísseis hutitas, com os detritos caindo em várias localidades. Além disso, o Irã intensificou seus esforços para atacar cidadãos dos Estados Unidos, levando Washington a reduzir o número de funcionários em sua missão na Arábia Saudita.", "economia": "O Ibovespa registrou uma alta de 6,9% e o dólar caiu 4,4% durante o período entre o primeiro e o segundo turno das eleições, reagindo às projeções de vitória de Flávio Bolsonaro. A economia foi ainda impulsionada pelo aumento do desejo de empreender, com Flávio Bolsonaro liderando entre os brasileiros que pretendem trabalhar por conta própria, conforme pesquisa do Ideia. A alta do petróleo pressiona o governo a manter o subsídio ao diesel, que vence na segunda-feira (26). Além disso, a Ucrânia informou que os limites de velocidade dos serviços Starlink foram suspensos durante testes, o que pode aliviar tensões recentes entre Kiev e Washington.", "tecnologia": "O evento mais importante dos artigos é a possibilidade de venda da empresa Instacart para um concorrente mais forte, provavelmente DoorDash ou Uber, conforme relatado pelo TechCrunch. A Amazon também anunciou que vendeu toda sua capacidade de nuvem até 2027 devido à alta demanda por infraestrutura de inteligência artificial, como informado pelo CEO da Amazon, Andy Jassy. Em outros desenvolvimentos, o J-20, um caça oculto chinês, terá seu radar integrado nas asas. A OpenAI reforçou o isolamento de seus sistemas de inteligência artificial após um período de pausa devido a um acesso não autorizado à internet. O mercado de inteligência artificial está em expansão, com investimentos globais projetados para ultrapassar 2,1 trilhões de dólares até 2028, de acordo com a BofA Global Research. Além disso, um novo modelo de voz da Block pode ser executado localmente em um MacBook M4 Max, oferecendo uma qualidade humanamente realista, e a Joybird está oferecendo descontos de até 40% em seu sofá Eliot Sleeper durante sua venda semestral.", "ciencia": "Um estudo apresentado na Sociedade Europeia de Oncologia Médica em Madri demonstrou que uma vacina personalizada reduziu em 42% a recorrência de um câncer de pele agressivo, um avanço histórico na área, conforme relatado pela revista Veja. Além disso, a NASA afirmou estar fazendo o possível para levar astronautas à Lua em 2028, mas não garantiu que isso será cumprido, conforme informado pela Folha de S. Paulo. Outros avanços na ciência incluem a descoberta de um novo dinossauro na Ilha da Wight, na Grã-Bretanha, que é o primeiro de sua espécie na Europa, e um estudo que mostrou que a pressão arterial pode ser reduzida estimulando suavemente os nervos através do ouvido, embora não tenha superado significativamente o placebo em termos gerais, conforme relatado pela ScienceDaily. Estes são alguns dos principais avanços científicos abordados nos artigos fornecidos.", "cultura": "Um importante evento cultural aconteceu em Hong Kong, onde a comemoração de Halloween chegou antes do esperado, com festivais e eventos realizados pela primeira vez pelo Conselho de Turismo sob a campanha 'Mês de Halloween de Hong Kong'. Isso resultou em um aumento de até 20% nas vendas de bares. Em outro contexto, a psiquiatra espanhola Marian Rojas Estapé discute a dificuldade de aceitar que não é possível atender a todas as exigências, sugerindo que é importante aprender a renunciar sem culpa e escolher o melhor em cada momento. No âmbito literário, o escritor japonês Ryu Murakami faleceu aos 74 anos, deixando uma obra marcada por temas como violência, sexualidade e uma crítica à sociedade japonesa. Entre os projetos arquitetônicos, a casa Cloud projetada pelo arquiteto Peter Morris em Londres apresenta paredes rosa, como marshmallow, e arcos amplos, inspirados em um passeio por Miami, exibindo um estilo exagerado e colorido.", "sociedade": "Mais de 400 mil pessoas participaram de novos protestos em França, sob um forte esforço de segurança do governo de Emmanuel Macron, que mobilizou cerca de 70 mil policiais, veículos blindados, helicópteros e drones. Os protestos, contra o custo de vida, fecharam museus em Paris e mobilizaram estudantes e trabalhadores para discutir verbas na educação e poder de compra. Em Madri, ocorreu um rally de 25 mil pessoas exigindo garantias para o sistema de aposentadoria, em meio a uma disputa política sobre a sustentabilidade do sistema. Em Conchalí, no Chile, manifestantes queimaram um ônibus da empresa RED, causando destruição total. No Brasil, o Enem 2026 contou com mais de 5 milhões de inscritos, sendo que 64% são mulheres. A obtenção de emprego por famílias beneficiárias do Bolsa Família pode causar preocupação, pois a perda de parte da transferência de renda pode gerar incerteza sobre a segurança financeira a longo prazo. O Brasil também enfrenta a crise de falta de oxigênio em Manaus, que volta a ser discutido durante o debate entre Lula e Flávio Bolsonaro no último encontro antes do segundo turno das eleições.", "meio_ambiente": "O estado de São Paulo aumentou suas ações para combater enchentes, secas, ondas de calor e incêndios florestais, investindo R$ 1,19 bilhão. Esses investimentos fazem parte de uma carteira total de R$ 29 bilhões até 2029. O especialista Inti Bonomo prevê que o fenômeno do Super Niño continuará crescendo e atingirá seu pico em dezembro. Segundo ele, haverá condições de nublado persistente e temperaturas mais frescas a partir de outubro, que se estenderão pelos primeiros meses de 2027. Em Neuquén, intensas chuvas reativaram os canyons secos, causando danos nas estradas e desalojando famílias na região de Vaca Muerta.", "direitos_humanos": "Mais de 1.500 palestinos foram forçados a sair de suas casas em Hebron desde sexta-feira, de acordo com o governador Khaled Dudin, que pediu intervenção internacional. Em Umm Safa, forças israelenses ordenaram a demolição de casas e enfrentaram ataques de colonos israelenses contra um homem palestino. Na Argélia, pelo menos 38 vítimas mortais foram identificadas na 'Guerra Suja' durante o último regime militar. Em direitos humanos, a Polícia de Hong Kong e a China continental detiveram 33 pessoas em uma operação conjunta contra uma quadrilha de furtos de cartões de crédito que atuava em viagens de hongkongueses a Shenzhen. Além disso, palestinos do Vale Ocidental enfrentam crescente fome devido à redução da ajuda alimentar pela ONU. Um especialista discute estratégias para deter a repressão transnacional, enquanto um podcast debate a redução de penas para crimes contra crianças no Chile."}, "resumo_do_dia": {"politica_nacional": [{"id": 223149, "titulo": "Assessora sinaliza permanência de secretária da Cultura de Tarcísio no segundo mandato", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/assessora-sinaliza-permanencia-de-secretaria-da-cultura-de-tarcisio-no-segundo-mandato.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-24T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma assessoria da secretária estadual de Cultura de São Paulo, Marília Marton, indicou que ela deve continuar no cargo durante o segundo mandato do governador Tarcísio de Freitas.", "titulo_pt": "Assessora sinaliza permanência de secretária da Cultura em segundo mandato", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 223150, "titulo": "Ato pró-Lula reúne centenas no Portão de Brandemburgo em Berlim", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/ato-pro-lula-reune-centenas-no-portao-de-brandemburgo-em-berlim.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-24T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Centenas de brasileiros se reuniram no Portão de Brandemburgo, em Berlim, no segundo fim de semana seguido, para apoiar a candidatura de Luiz Inácio Lula da Silva (PT), apesar das condições climáticas ruins.", "titulo_pt": "Ato pró-lula reúne centenas no Portão de Brandemburgo em Berlim", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 223186, "titulo": "Flávio e Lula reúnem multidões em Belo Horizonte, Rio e São Paulo nos últimos atos de campanha antes do 2º turno da eleição", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/24/ultimos-atos-de-lula-e-flavio-antes-do-2o-turno.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-24T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em atos públicos nos principais centros urbanos do Sudeste, Luiz Inácio Lula da Silva e Flávio Bolsonaro mobilizaram multidões de apoiadores em Belo Horizonte, Rio de Janeiro e São Paulo, na véspera do segundo turno das eleições presidenciais de 2026. O atual presidente iniciou suas atividades em Copacabana, na Zona Sul do Rio de Janeiro, reunindo milhares de seguidores pela manhã.", "titulo_pt": "Lula e flávio bolsonaro reúnem multidões em Belo Horizonte, Rio e São Paulo nos últimos atos de campanha antes do 2º turno da eleição", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 223151, "titulo": "Ativistas espalham faixas em SP e no RJ sobre caso Ana Clara, citado por Lula contra Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/ativistas-espalham-faixas-em-sp-e-no-rj-sobre-caso-ana-clara-citado-por-lula-contra-flavio-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-24T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Faixas pedindo pesquisas sobre o caso Ana Clara foram espalhadas em pontos turísticos de São Paulo e Rio de Janeiro no sábado (24). Ana Clara, uma menina de cinco anos morta com um tiro de fuzil em Niterói em 2021, é o foco dessa campanha.", "titulo_pt": "Ativistas espalham faixas em SP e no RJ sobre caso Ana Clara, citado por Lula contra Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 223179, "titulo": "Trabalhador tem direito de sair do serviço para votar; confira a lei", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/trabalhador-tem-direito-de-sair-do-servico-para-votar-confira-lei", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-24T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O trabalhador tem o direito de se ausentar do serviço no dia da eleição para votar, sem prejuízo de seu salário. As normas estão previstas no artigo 234 da Lei eleitoral e em uma resolução do Tribunal Superior Eleitoral.", "titulo_pt": "Trabalhador tem direito de sair do serviço para votar; confira a lei", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 223262, "titulo": "No último dia de campanha, Lula e Flávio lotam ruas em atos no Rio e em BH", "url": "https://www.metropoles.com/brasil/lula-flavio-bolsonaro-fazem-atos-de-campanha-as-vespera-segundo-turno", "fonte_id": "metropoles", "data_pub": "2026-10-24T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No último dia de campanha, Luiz Inácio Lula da Silva e Flávio Bolsonaro realizaram atos nas ruas do Rio de Janeiro e Belo Horizonte, lotando as áreas onde passaram. Os candidatos buscaram reforçar suas bases na Região Sudeste antes do pleito presidencial.", "titulo_pt": "No último dia de campanha, Lula e Flávio lotam ruas em atos no Rio e em BH", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 223187, "titulo": "Eleições 2026: veja as últimas pesquisas de intenção de voto para presidente", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/24/eleicoes-2026-veja-as-ultimas-pesquisas-de-intencao-de-voto-para-presidente.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-24T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Novas pesquisas de intenção de voto do Datafolha e da Quaest para o segundo turno das eleições presidenciais serão divulgadas neste sábado (24) às 18h. Esses são os últimos levantamentos antes da votação marcada para o dia seguinte.", "titulo_pt": "Eleições 2026: veja as últimas pesquisas de intenção de voto para presidente", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 223152, "titulo": "Procuradoria Eleitoral defende extinção de processo sobre sigilos de Lula e Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/procuradoria-eleitoral-defende-extincao-de-processo-sobre-sigilos-de-lula-e-flavio-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-24T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Eleitoral propôs a extinção do processo que trata das quebras de sigilo dos candidatos à Presidência Lula e Flávio Bolsonaro. O Ministério Público Eleitoral se manifestou nesta sexta-feira (23) a favor da extinção do processo.", "titulo_pt": "Mp Eleitoral defende extinção de processo sobre sigilos de Lula e Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 223242, "titulo": "Willer Tomaz já apareceu em lista de bolsonaristas para vaga no STF", "url": "https://veja.abril.com.br/politica/willer-tomaz-ja-apareceu-em-lista-de-bolsonaristas-para-vaga-no-stf/", "fonte_id": "veja", "data_pub": "2026-10-24T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Willer Tomaz foi incluído em uma lista de possíveis nomes para uma vaga no Supremo Tribunal Federal (STF), junto com outros nomes como Jorge Oliveira, ministro do Tribunal de Contas da União (TCU), e Vicente Santini, ex-secretário nacional de Justiça.", "titulo_pt": "Willer Tomaz na lista de bolsonaristas para vaga no STF", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 223243, "titulo": "Lula e Flávio Bolsonaro apelam ao vale-tudo na reta final da campanha", "url": "https://veja.abril.com.br/politica/lula-e-flavio-bolsonaro-apelam-ao-vale-tudo-na-reta-final-da-campanha/", "fonte_id": "veja", "data_pub": "2026-10-24T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula e Flávio Bolsonaro estão empatados nas pesquisas e agora se enfrentam em uma disputa de promessas com o objetivo de agradar o eleitor.", "titulo_pt": "Lula e Flávio Bolsonaro empatados nas pesquisas entram em vale-tudo pela preferência do eleitor", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 223153, "titulo": "Apoiadores chegam para ato de Lula na avenida Paulista", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/apoiadores-chegam-para-ato-de-lula-na-avenida-paulista.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-24T16:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Apoiadores do presidente Luiz Inácio Lula da Silva começaram a se concentrar na avenida Paulista, em São Paulo, no início da tarde de sábado, para o último ato da campanha do petista antes do segundo turno das eleições.", "titulo_pt": "Apoiadores se concentram para ato de Lula na avenida Paulista", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 223188, "titulo": "PGR pede ao STF para derrubar exigência de autorização prévia para transporte de indígenas no 2º turno", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/24/pgr-pede-ao-stf-para-derrubar-exigencia-de-autorizacao-previa-para-transporte-de-indigenas-no-2o-turno.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-24T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República pediu ao Supremo Tribunal Federal para suspender a exigência de autorização prévia da Justiça Eleitoral para o transporte de indígenas no segundo turno das eleições, alegando que isso pode dificultar o acesso dos eleitores às urnas. O procurador-geral da República argumenta que a medida pode gerar problemas devido à falta de tempo para cumprir os procedimentos burocráticos.", "titulo_pt": "PGR pede ao STF para derrubar exigência de autorização para transporte de indígenas no 2º turno", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 223189, "titulo": "Certidão de quitação eleitoral é gratuita e pode ser emitida pela internet; saiba como", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/24/certidao-de-quitacao-eleitoral-e-gratuita-e-pode-ser-emitida-pela-internet-saiba-como.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-24T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A certidão de quitação eleitoral é gratuita e pode ser emitida pela internet ou presencialmente. O documento comprova a regularidade do eleitor com a Justiça Eleitoral e está disponível no site do Tribunal Superior Eleitoral ou em unidades de atendimento.", "titulo_pt": "Certidão de quitação eleitoral é gratuita e pode ser emitida pela internet; saiba como", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [{"titulo": "Flávio Bolsonaro x Lula – Quem são e números dos candidatos a presidente no segundo turno das eleições 2026", "sumario": "Flávio Bolsonaro terminou o primeiro turno com 2,2 milhões de votos a mais do que Jair Bolsonaro. Omar Aziz, senador, concorre contra Professora Maria do Carmo no segundo turno das eleições para governador do Amazonas em 2026. Mailza Assis (PP) concorre para reeleição contra Alan Rick (Republicanos) no segundo turno das eleições para governador do Acre em 2026.", "artigos": [{"id": 223458, "titulo": "Flávio Bolsonaro x Lula – Quem são e números dos candidatos a presidente no segundo turno das eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/flavio-bolsonaro-lula-quem-sao-e-numeros-dos-candidatos-a-presidente-no-segundo-turno-das-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-10-24T17:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro terminou o primeiro turno com 2,2 milhões de votos a mais do que Jair Bolsonaro. O texto discute os candidatos Flávio Bolsonaro e Lula para o segundo turno das eleições de 2026.", "titulo_pt": "Flávio Bolsonaro x Lula – Quem são e números dos candidatos a presidente no segundo turno das eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 223461, "titulo": "Quem são os e os números dos candidatos a governador do Amazonas (AM) no segundo turno nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-e-os-numeros-dos-candidatos-a-governador-do-amazonas-am-no-segundo-turno-nas-eleicoes-2026", "fonte_id": "jota", "data_pub": "2026-10-24T16:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Omar Aziz, senador, concorre contra Professora Maria do Carmo no segundo turno das eleições para governador do Ama  "Minister of Foreign Affairs Lin Chia-lung urges AI, drone ties with Europe", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/25/2003866583", "fonte_id": "taipei_times", "data_pub": "2026-10-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro das Relações Exteriores de Taiwan, Lin Chia-lung, encoraja parcerias em inteligência artificial e drones com a Europa.", "titulo_pt": "Ministro das relações exteriores de taiwan encoraja parcerias em IA e drones com a Europa", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 223667, "titulo": "Migliaia in piazza a Tel Aviv contro Netanyahu prima delle elezioni", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/24/migliaia-in-piazza-a-tel-aviv-contro-netanyahu-prima-delle-elezioni_4469d036-7822-44ec-9b96-70b9090063fd.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-24T17:55:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas se manifestaram em Tel Aviv contra Netanyahu antes das eleições. Segundo os sondagens, o alinhamento de Netanyahu está empatado com o de Eisenkot.", "titulo_pt": "Milhares em praça de Tel Aviv contra Netanyahu antes das eleições", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 223608, "titulo": "Rallies, opinion polls and a final debate - Brazil gets ready for Sunday's knife-edge presidential election", "url": "https://www.euronews.com/2026/10/24/rallies-opinion-polls-and-a-final-debate-brazil-gets-ready-for-sundays-knife-edge-presiden", "fonte_id": "euronews", "data_pub": "2026-10-24T17:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ambos os candidatos na segunda volta da eleição presidencial no Brasil realizam atos em cidades importantes no último dia de campanha. Com cerca de 20% dos eleitores que se abstiveram na primeira volta, o resultado está empatado de acordo com as pesquisas de opinião.", "titulo_pt": "Rally, pesquisas e debate final - Brasil se prepara para eleição presidencial decisiva no domingo", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 223342, "titulo": "Irã intensifica esforços para atacar cidadãos dos EUA, diz memorando de inteligência", "url": "https://www.infomoney.com.br/mundo/ira-intensifica-esforcos-para-atacar-cidadaos-dos-eua-diz-memorando-de-inteligencia/", "fonte_id": "infomoney", "data_pub": "2026-10-24T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Irã intensificou seus esforços para atacar cidadãos dos Estados Unidos, de acordo com um memorando de inteligência. Este alerta foi emitido após Washington reduzir o número de funcionários em sua missão na Arábia Saudita.", "titulo_pt": "Irã intensifica esforços para atacar cidadãos dos EUA, diz memorando de inteligência", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 223579, "titulo": "Yemen's Houthi rebels claim new attacks on oil facilities and airports across Saudi Arabia", "url": "https://www.france24.com/en/middle-east/20261024-yemen-s-houthi-rebels-claim-new-attacks-on-oil-facilities-and-airports-across-saudi-arabia", "fonte_id": "france24", "data_pub": "2026-10-24T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rebelos hutai, aliados a Irã, afirmaram ter atacado instalações de petróleo e aeroportos na Arábia Saudita. O governo saudita, apoiado pelo Iêmen, disse que o grupo também disparou três mísseis balísticos contra postos da guarda costeira em Adén.", "titulo_pt": "Rebelados hutai afirmam realizar novos ataques a instalações de petróleo e aeroportos na arábia saudita", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 223580, "titulo": "France: Clashes erupt as protests sweep across cities", "url": "https://www.france24.com/en/video/20261024-france-clashes-erupt-as-protests-sweep-across-cities", "fonte_id": "france24", "data_pub": "2026-10-24T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inter  Gaza", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-gunfire-kills-palestinian-central-gaza", "fonte_id": "middle_east_eye", "data_pub": "2026-10-24T17:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem palestino foi morto por disparos israelenses na área de al-Musadder, central Gaza, conforme relatado pela Al Jazeera. O hospital Al-Aqsa Martyrs em Deir el-Balah confirmou a recepção do corpo.", "titulo_pt": "Tiros israelenses matam palestino no centro de Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 223669, "titulo": "Razzi e bottiglie contro la polizia, a Torino fitto lancio lacrimogeni", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/24/razzi-e-bottiglie-contro-la-polizia-a-torino-fitto-lancio-lacrimogeni_8d3c0a69-2e54-4f28-9f84-0c5a48c52efb.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-24T17:21:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A polícia lançou gases lacrimogêneos contra manifestantes em Turim. Houve um intenso uso de spray de pimenta pelos agentes.", "titulo_pt": "Chamas e gases contra a polícia em turim", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 223646, "titulo": "Saudi Arabia says Houthi missile shrapnel falls in Jeddah, Taif, Rabigh after interceptions", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/saudi-arabia-says-houthi-missile-shrapnel-falls-jeddah-taif-rabigh-after", "fonte_id": "middle_east_eye", "data_pub": "2026-10-24T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Arábia Saudita afirmou que interceptou dois mísseis balísticos lançados pelos hutitas do Iêmen em direção às regiões de Meca e Medina, com detritos caindo em várias localidades, incluindo Jeddah, Taif e Rabigh.", "titulo_pt": "Arábia saudita diz que detritos de mísseis hutitas caem em Jeddah, Taif e Rabigh após interceptações", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 223581, "titulo": "Israel begins demolitions in West Bank", "url": "https://www.france24.com/en/israel-begins-demolitions-in-west-bank", "fonte_id": "france24", "data_pub": "2026-10-24T17:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Autoridade Palestina pediu pressão internacional sobre Israel após um ataque que resultou na morte de dois soldados israelenses e levou a que cerca de 1.200 palestinos em Hebron, na Cisjordânia, tenham sido forçados a sair de suas casas. O chefe do município de Hebron disse que mais 1.300 pessoas podem ser expulsas.", "titulo_pt": "Israel inicia demolições em hebron, cisjordânia", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 223582, "titulo": "Italy hit by new cost of living protests", "url": "https://www.france24.com/en/italy-hit-by-new-cost-of-living-protests", "fonte_id": "france24", "data_pub": "2026-10-24T17:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Protestos de novo coste de vida ocorreram em Milão, Itália, com soldados sendo deslocados para a cidade e lojas de luxo sendo fechadas. O governo anunciou medidas, incluindo a mobilização de mais 500 soldados e penalidades mais severas para menores de idade, que a polícia disse compor uma grande parcela dos protestantes violentos da semana anterior.", "titulo_pt": "Itália enfrenta novos protestos de novo custo de vida", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 223567, "titulo": "British woman dies after trying to rescue sons swept away at sea in the Bahamas", "url": "https://www.bbc.co.uk/news/articles/cm86z5n0yvy6o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-24T17:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma britânica morreu ao tentar resgatar seus filhos que foram arrastados pela maré nas Bahamas. O pai dos meninos, Nathan Gregory, descreveu a perda de sua namorada de infância, Leanne, como algo inimaginá veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 223750, "titulo": "These clever apps show off the iPhone Duo’s potential", "url": "https://techcrunch.com/2026/10/24/these-clever-apps-show-off-the-iphone-duos-potential/", "fonte_id": "techcrunch", "data_pub": "2026-10-24T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desenvolvedores estão explorando as possibilidades do primeiro iPhone dobrável da Apple, criando aplicativos que variam de players de gravações cassete antigas a cadernos virtuais, rastreadores de voo e até mesmo um torradeiro digital.", "titulo_pt": "Estas aplicativos astutos ilustram o potencial do iphone Duo", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 223751, "titulo": "Forced to pick, Grok’s AI model chooses Republicans. OpenAI’s picks Democrats.", "url": "https://techcrunch.com/2026/10/24/forced-to-pick-groks-ai-model-chooses-republicans-openais-picks-democrats/", "fonte_id": "techcrunch", "data_pub": "2026-10-24T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo mostrou que o modelo de IA da Grok recomendou candidatos republicanos em mais de 90% das eleições analisadas, enquanto o GPT da OpenAI preferiu candidatos democratas. As duas plataformas de IA discordaram em mais de 90% das quase 500 corridas eleitorais examinadas.", "titulo_pt": "Forçado a escolher, modelo de IA da Grok opta por republicanos, enquanto gpt da openai prefere democratas", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 223357, "titulo": "Amazon já vendeu toda sua capacidade de nuvem até 2027", "url": "https://olhardigital.com.br/2026/10/24/carros-e-tecnologia/amazon-ja-vendeu-toda-sua-capacidade-de-nuvem-ate-2027/", "fonte_id": "olhar_digital", "data_pub": "2026-10-24T14:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon Web Services (AWS) comprometeu a maior parte de sua capacidade de nuvem até 2027 devido à alta demanda por infraestrutu ticulada. O positrônio é o antimatéria do elétron, com massa igual mas carga elétrica oposta. Segundo a previsão do Modelo Estándar, o momento magnético do positrônio deve ser exatamente oposto ao do elétron.", "titulo_pt": "Ciclógrafo de positrônio poderia testar previsão crucial do modelo estándar", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223769, "titulo": "STAT+: The ESMO presentation everyone’s been waiting for", "url": "https://www.statnews.com/2026/10/24/the-esmo-2026-merck-moderna-presentation-amgen-imdelltra-news/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-24T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foi apresentado um discurso 'presidencial' da Moderna e da Merck durante o segundo dia da reunião da Sociedade Europeia de Oncologia Médica em Madri. Outras notícias do evento também foram divulgadas.", "titulo_pt": "A apresentação 'presidencial' da moderna e da merck no ESMO", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 223248, "titulo": "‘Um avanço histórico’: vacina personalizada reduz recorrência de câncer de pele agressivo em 42%", "url": "https://veja.abril.com.br/saude/um-avanco-historico-vacina-personalizada-reduz-recorrencia-de-cancer-de-pele-agressivo-em-42/", "fonte_id": "veja", "data_pub": "2026-10-24T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo de fase 3 apresentou resultados no congresso da Sociedade Europeia de Oncologia Médica em Madri, mostrando que uma vacina personalizada reduziu em 42% a recorrência de um câncer de pele agressivo.", "titulo_pt": "Um avanço histórico': vacina personalizada reduz recorrência de câncer de pele agressivo em 42%", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 223761, "titulo": "Newly identified protein pathway helps HIV stay hidden despite treatment", "url": "https://phys.org/news/2026-10-newly-protein-pathway-hiv-stay.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Proteínas identificadas recentemente ajudam o HIV a permanecer oculto mesmo com o tratamento. As reservatórios virais, onde o HIV se encontra inativo em certas células imunológicas e no cérebro, são os principais obstáculos para a cura atual do HIV.", "titulo_pt": "Novo caminho proteico ajuda HIV a permanecer oculto apesar do tratamento", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223789, "titulo": "This Week In Space podcast: Episode 233 — The Artemis Generation", "url": "https://www.space.com/entertainment/space-movies-shows/this-week-in-space-podcast-episode-233-the-artemis-generation", "fonte_id": "space_com", "data_pub": "2026-10-24T15:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No episódio 233 do podcast This Week In Space, Tariq Malik e Rick Jenet conversam com Dr. Amanda Smith-Hackler, da Universidade de Pesquisa Espacial, sobre como entrar no mercado de trabalho espacial.", "titulo_pt": "Episódio 233 do this Week In Space: a geração Artemis", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 223790, "titulo": "On this day in space! Oct. 24, 1946: V-2 rocket takes 1st photos of Earth from space", "url": "https://www.space.com/space-exploration/on-this-day-in-space-october-24-2026", "fonte_id": "space_com", "data_pub": "2026-10-24T15:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 24 de outubro de 1946, um foguete V-2 capturou a primeira foto de Earth do espaço. Este evento marcou o início da fotografia espacial.", "titulo_pt": "24 De outubro de 1946: foguete v-2 captura primeira foto de Earth do espaço", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 223145, "titulo": "Palácio na Etiópia teria estrutura similar à de arranha-céu há quase 3.000 anos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/palacio-na-etiopia-teria-estrutura-similar-a-de-arranha-ceu-ha-quase-3000-anos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-24T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Era há 2.800 anos, edifícios altos já existiam na região das terras altas da Etiópia, diferentemente do que se costuma pensar, onde as grandes construções da Antiguidade eram associadas apenas ao Egito, Grécia e Roma.", "titulo_pt": "Palácio na Etiópia teria estrutura similar a arranha-céu há quase 3.000 anos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 223762, "titulo": "Nanoscale alloy redesign tackles cold brittleness for potential deep-space and deep-sea applications", "url": "https://phys.org/news/2026-10-nanoscale-alloy-redesign-tackles-cold.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alies nanoescamosos são redesenhados para superar a britadeira em ambientes muito frios, com potenciais aplicações em aeroespacial, energia limpa, sistemas supercondutores e exploração espacial profunda. Isso visa manter altos níveis de força, ductilidade e resistência à fratura em temperaturas ultrabaixas.", "titulo_pt": "Reconceituação de alies nanoescamosos resolve britadeira em temperaturas muito baixas para aplicações em espaço profundo e oceanos profundos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223445, "titulo": "El Fenómeno del Niño pone a prueba a la capital y obliga a acelerar la adaptación de las ciudades", "url": "https://www.latercera.com/sustentabilidad/noticia/el-fenomeno-del-nino-pone-a-prueba-a-la-capital-y-obliga-a-acelerar-la-adaptacion-de-las-ciudades/", "fonte_id": "la_tercera", "data_pub": "2026-10-24T14:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O fenômeno do Niño está causando uma primavera com chuvas intensas no centro-sul do Chile, levando a inundações e deslizamentos de terra em Santiago. Isso está pressionando a infraestrutura da cidade a se adaptar a eventos climáticos mais extremos, exigindo monitoramento mais frequente, obras de mitigação e novas ferramentas de planejamento urbano.", "titulo_pt": "Fenômeno do Niño desafia a capital chilena e acelera a adaptação das cidades", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 223763, "titulo": "Seabird family tree predicts which species accumulate plastic better than diet, global analysis finds", "url": "https://phys.org/news/2026-10-seabird-family-tree-species-accumulate.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um recente estudo global descobriu que a identificação das relações evolutivas entre as espécies de aves marinhas oferece melhores indicações sobre quais acumulam plástico em seus sistemas digestivos, do que seu dieta ou métodos de alimentação.", "titulo_pt": "Árvore genealógica das aves marinhas prediz melhor do que espécies acumulam plástico em seus sistemas digestivos, mais do que sua dieta", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223774, "titulo": "Could lowering high blood pressure be as simple as stimulating your ear?", "url": "https://www.sciencedaily.com/releases/2026/10/261023023732.htm", "fonte_id": "science_daily", "data_pub": "2026-10-24T13:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um dispositivo pequeno que estimula suavemente os nervos através do ouvido pode oferecer uma nova abordagem para o tratamento da hipertensão arterial persistente. Embora não tenha superado significativamente o placebo em termos gerais, os pacientes com hipertensão arterial mais grave mostraram reduções promissoras na pressão arterial.", "titulo_pt": "Poderia baixar a pressão arterial alta ser tão simples como estimular o ouvido?", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 223772, "titulo": "A hidden bias in human language challenges 70 years of science", "url": "https://www.sciencedaily.com/releases/2026/10/261023023738.htm", "fonte_id": "science_daily", "data_pub": "2026-10-24T13:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo revolucionário desafia 70 anos de suposições sobre como o linguajar humano funciona. Ao analisar bilhões de uso de palavras, os cientistas descobriram que o significado está organizado em torno de poder, perigo e ordem, em vez de emoção apenas. Surpreendentemente, a linguagem humana mostra uma forte preferência oculta pela segurança, sugerindo que nossas palavras podem refletir instintos de sobrevivência antigos.", "titulo_pt": "Um viés oculto na linguagem humana desafia 70 anos de ciência", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 223764, "titulo": "Ancient stalagmites reveal exceptions to Asia–South America monsoon seesaw over the past 450,000 years", "url": "https://phys.org/news/2026-10-ancient-stalagmites-reveal-exceptions-asiasouth.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estalagmites antigos revelam exceções ao balanço das monções entre Ásia e América do Sul há 450.000 anos. Entender os padrões das monções é crucial para o planejamento de riscos de seca que afetam agricultura, reservatórios e geração hidrelétrica em regiões distantes.", "titulo_pt": "Estalagmites antigas revelam exceções ao balanço das monções entre ásia e américa do sul há 450.000 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223773, "titulo": "NASA’s asteroid Bennu samples reveal a 4.5-billion-year-old secret", "url": "https://www.sciencedaily.com/releases/2026/10/261023023734.htm", "fonte_id": "science_daily", "data_pub": "2026-10-24T12:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amostras minúsculas do asteroide Bennu estão revolucionando a compreensão dos cientistas sobre a formação do Sistema Solar. Novas evidências indicam que Bennu nasceu onde material do interior e exterior do Sistema Solar se misturou, com Júpiter desempenhando um papel surpreendente na sua formação.", "titulo_pt": "Amostras do asteroide Bennu revelam segredo de 4,5 bilhões de anos", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 223775, "titulo": "Scientists propose a way to detect dangerous “mirror life” before it exists", "url": "https://www.sciencedaily.com/releases/2026/10/261023023726.htm", "fonte_id": "science_daily", "data_pub": "2026-10-24T12:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas propuseram um método para detectar a 'vida espelhada', uma forma hipotética de vida que poderia representar riscos significativos para humanos, animais e ecossistemas se criada artificialmente. Eles sugerem o uso de moléculas fluorescentes especiais e um tipo de luz polarizada, similar à usada em tecnologia de filmes 3D, para distinguir organismos normais de seus contrapartes espelhados.", "titulo_pt": "Cientistas sugerem método para detectar 'vida espelhada' antes que ela exista", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}], "ciencia__eventos": [], "cultura": [{"id": 223720, "titulo": "Music workshop praised", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/25/2003866578", "fonte_id": "taipei_times", "data_pub": "2026-10-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um workshop musical foi elogiado pela comunidade.", "titulo_pt": "Workshop musical elogiado", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 223721, "titulo": "Richard Metson and others honored at comic awards", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/25/2003866579", "fonte_id": "taipei_times", "data_pub": "2026-10-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Richard Metson e outros foram homenageados em cerimônia de premiação de quadrinhos.", "titulo_pt": "Richard Metson e outros são homenageados em premiação de quadrinhos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 223237, "titulo": "Incêndio atinge antiga residência de Hitler na Alemanha; suspeito é preso", "url": "https://veja.abril.com.br/mundo/incendio-atinge-antiga-residencia-de-hitler-na-alemanha-suspeito-e-preso/", "fonte_id": "veja", "data_pub": "2026-10-24T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incêndio atingiu uma antiga residência de Hitler na Baviera, Alemanha, e cerca de 200 bombeiros foram mobilizados para controlar as chamas. Um suspeito foi preso no local.", "titulo_pt": "Incêndio atinge antiga residência de Hitler na Alemanha; suspeito é preso", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 223241, "titulo": "‘As mulheres simples têm mais coragem de compartilhar suas dores’, diz Luiza Brunet", "url": "https://veja.abril.com.br/cultura/as-mulheres-mais-simples-tem-mais-coragem-de-compartilhar-suas-dores-diz-luiza-brunet/", "fonte_id": "veja", "data_pub": "2026-10-24T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luiza Brunet, de 64 anos, empresária, ex-modelo e ativista, é a convidada do programa semanal da coluna GENTE.", "titulo_pt": "As mulheres simples têm mais coragem de compartilhar suas dores", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 223400, "titulo": "La clave de la vida que propone la psiquiatra Marian Rojas Estapé: “Es aprender a renunciar sin culpa, sabiendo elegir lo mejor en cada momento”", "url": "https://www.lanacion.com.ar/sociedad/la-clave-de-la-vida-que-propone-la-psiquiatra-marian-rojas-estape-es-aprender-a-renunciar-sin-culpa-nid24102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-24T17:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A psiquiatra Marian Rojas Estapé, espanhola, discute a dificuldade de aceitar que não é possível atender a todas as exigências. Ela sugere que é importante aprender a renunciar sem culpa e escolher o melhor em cada momento.", "titulo_pt": "A chave da vida proposta pela psiquiatra Marian Rojas Estapé: 'é aprender a renunciar sem culpa, sabendo escolher o melhor em cada momento'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 223788, "titulo": "Ste Marie imbues Monos Vancouver office with \"residential quality\"", "url": "https://www.dezeen.com/2026/10/24/monos-headquarters-vancouver-ste-marie/", "fonte_id": "dezeen", "data_pub": "2026-10-24T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A estúdio de interiores canadense Ste Marie projetou o escritório de Vancouver da marca de bagagem Monos, enfatizando simplicidade e mudanças no humor ao longo do dia. O escritório, localizado no bairro Mount Pleasant, reflete o desenvolvimento da marca e oferece espaço para seu crescimento futuro.", "titulo_pt": "Ste Marie imprime qualidade residencial no escritório de Monos em Vancouver", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 223410, "titulo": "Pedro Luis Barcia. “Padecemos sisifismo: subimos la ladera con una piedra que se nos cae y volvemos a empeñarnos sin reflexionar por qué se nos cayó”", "url": "https://www.lanacion.com.ar/cultura/pedro-luis-barcia-padecemos-sisifismo-subimos-la-ladera-con-una-piedra-que-se-nos-cae-y-volvemos-a-nid24102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-24T16:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Pedro Luis Barcia, que receberá nesta segunda-feira a distinção de Personalidade Emérita de Cultura no Palácio Libertad, analisará os argentinos, seus comportamentos, obsesões e, naturalmente, o uso da linguagem.", "titulo_pt": "Pedro Luis Barcia: 'Padecemos sisifismo: subimos a ladeira com uma pedra que se nos cai e voltamos a empenar-nos sem refletir por que se nos caiu'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 223437, "titulo": "Muere a los 74 años Ryu Murakami, escritor japonés y autor de “Sopa de miso” y “Azul casi transparente”", "url": "https://www.latercera.com/culto/noticia/muere-a-los-74-anos-ryu-murakami-escritor-japones-y-autor-de-sopa-de-miso-y-azul-casi-transparente/", "fonte_id": "la_tercera", "data_pub": "2026-10-24T16:09:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Ryu Murakami, escritor japonês conhecido por obras como 'Sopa de miso' e 'Azul quase transparente', faleceu em 17 de outubro de 2023, aos 74 anos. Sua obra foi marcada por temas como violência, sexualidade e uma crítica à sociedade japonesa.", "titulo_pt": "Ryu Murakami, autor de 'Sopa de miso' e 'Azul quase transparente', morre aos 74 anos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 223413, "titulo": "Un incendio destruyó el Nido del Águila, la “casa de té de Hitler” en los Alpes bávaros", "url": "https://www.lanacion.com.ar/el-mundo/un-incendio-destruyo-el-nido-del-aguila-la-casa-de-te-de-hitler-en-los-alpes-bavaros-nid24102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-24T16:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um incêndio destruiu o Nido do Águila, uma casa de chá associada ao nazismo localizada em um acantilado a 1834 metros acima do nível do mar nos Alpes bávaros. Um homem foi detido nas proximidades e a polícia investiga se o incêndio foi intencional.", "titulo_pt": "Incêndio destruiu o Nido do Águila, a ‘casa de chá de Hitler’ nos Alpes bávaros", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 223414, "titulo": "León XIV en la Argentina: cómo se prepara la familia agustiniana para recibirlo, qué regalo le harán y un lema para el futuro", "url": "https://www.lanacion.com.ar/sociedad/leon-xiv-en-la-argentina-como-se-prepara-la-familia-agustiniana-para-recibirlo-que-regalo-le-haran-y-nid24102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-24T15:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A família agustiniana está se preparando para a visita do Papa Leão XIV, que será o primeiro devoto de São Agostinho a liderar a Igreja Católica. Os preparativos incluem expectativas e emoção por parte dos referentes da congregação.", "titulo_pt": "Leão XIV na Argentina: como a família agustiniana se prepara para recebê-lo, qual presente lhe darão e um lema para o futuro", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 223793, "titulo": "Watch the ‘Buddy’ Team Explain How They Made the World Fall in Love with a Murderous Unicorn", "url": "https://www.indiewire.com/news/events/how-buddy-became-breakout-hit-future-of-filmmaking-summit-1235223665/", "fonte_id": "indiewire", "data_pub": "2026-10-24T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na Summit do Futuro do Filmmaking da IndieWire, a produtora Tracy Rosenblum, o co-escritor Jamie King e a chefe de marketing digital da Roadside Attractions, Melissa Yerou, descreveram a fórmula por trás do sucesso de 'Buddy', um dos grandes sucessos do ano 2026.", "titulo_pt": "Assista à equipe 'Buddy' explicar como eles fizeram o mundo apaixonar por uma unicórnio assassina", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 223170, "titulo": "Carlos Alberto de Nóbrega tem alta hospitalar após implante de marcapasso", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/carlos-alberto-de-nobrega-tem-alta-hospitalar-apos-implante-de-marcapasso.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-24T14:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Carlos Alberto de Nóbrega recebeu alta hospitalar após passar por uma cirurgia para implantação de um marcapasso. A saída do hospital foi registrada e compartilhada nas redes sociais de sua mulher, Renata de Nóbrega.", "titulo_pt": "Carlos Alberto de Nóbrega recebe alta após implante de marcapasso", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 223703, "titulo": "How Operation Santa Claus grew from Christmas donations to ‘engine’ of change", "url": "https://www.scmp.com/news/hong-kong/society/article/3372027/how-operation-santa-claus-grew-christmas-donations-engine-change", "fonte_id": "scmp", "data_pub": "2026-10-24T13:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Operation Santa Claus (OSC) evoluiu de um evento de arrecadação de fundos no Natal para se tornar um motor de mudança comunitária em Hong Kong ao longo de cerca de 40 anos. Algumas pessoas beneficiárias passaram por um ciclo completo, participando do projeto inicialmente e posteriormente se envolvendo como voluntárias.", "titulo_pt": "Como a operação papai noel cresceu de uma campanha de natal para se tornar o 'motor' de mudança da comunidade", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 223783, "titulo": "In a Historic Blunder, Wu-Tang Clan Sold an Album as a Unique Artwork—A New Doc Tells the Story of an Architect of the Sale", "url": "https://www.artnews.com/art-news/reviews/wu-tang-clan-sold-album-artwork-once-upon-time-shaolin-film-1234803666/", "fonte_id": "artnews", "data_pub": "2026-10-24T13:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um documentário conta a história de um membro envolvido na venda de um álbum do Wu-Tang Clan como um único trabalho de arte, um erro histórico. Infelizmente, a pessoa responsável pelo projeto não se destaca de forma convincente na tela.", "titulo_pt": "Em uma equivocada gaffe, Wu-Tang Clan venderam um álbum como uma obra única de arte — novo documentário relata A história de um arquiteto do venda", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 223705, "titulo": "Chasing Gothic Lolita demand, Japanese businesses expand to Europe", "url": "https://www.scmp.com/news/world/europe/article/3372030/chasing-gothic-lolita-demand-japanese-businesses-expand-europe", "fonte_id": "scmp", "data_pub": "2026-10-24T13:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma moda japonesa inspirada em trajes históricos europeus está ganhando cada vez mais seguidores na Europa, onde entusiastas adotam os designs elaborados e formam comunidades em torno do seu amor por rendas, babados e trajes intricados. Marcas japonesas estão agora buscando expandir sua presença na Europa, trazendo a moda de volta ao continente que originalmente a inspirou.", "titulo_pt": "Moda Gothic Lolita japonesa ganha adeptos na Europa", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 223171, "titulo": "Ana Carolina retrata Di Cavalcanti e enfatiza percalços e fragilidade", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/ana-carolina-retrata-di-cavalcanti-e-enfatiza-percalcos-e-fragilidade.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-24T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme de Ana Carolina foca em Di Cavalcanti, retratando tanto suas obras quanto os momentos de sua morte. O longa é o primeiro lançamento de Carolina desde 1977 e oferece uma visão única sobre o artista através de suas telas e imagens de seu velório.", "titulo_pt": "Ana Carolina retrata Di Cavalcanti e destaca percalços e fragilidade", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 223430, "titulo": "Más de 400 mil personas participan en nueva jornada de protestas en Francia bajo fuerte despliegue de seguridad del gobierno", "url": "https://www.latercera.com/mundo/noticia/mas-de-400-mil-personas-participan-en-nueva-jornada-de-protestas-en-francia-bajo-fuerte-despliegue-de-seguridad-del-gobierno/", "fonte_id": "la_tercera", "data_pub": "2026-10-24T17:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Ma , "titulo": "25,000 rally in Madrid demanding state pension guarantees", "url": "https://www.lemonde.fr/en/international/article/2026/10/24/250-000-rally-in-madrid-demanding-state-pension-guarantees_6763132_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-24T14:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um rally de 25.000 pessoas ocorreu em Madri exigindo garantias para o sistema de aposentadoria. O evento acontece em meio a uma disputa política sobre a sustentabilidade do sistema de aposentadoria espanhol e os custos de vida, antes das eleições parlamentares no próximo mês.", "titulo_pt": "25.000 Pessoas em rally em madri exigindo garantias para o sistema de aposentadoria", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 223571, "titulo": "After deadly Trappes shooting, residents express anger and resignation over pervasive racism", "url": "https://www.lemonde.fr/en/france/article/2026/10/24/after-deadly-trappes-shooting-residents-express-anger-and-resignation-over-pervasive-racism_6762967_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-24T11:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Residentes da cidade francesa de Trappes, assim como o prefeito Ali Rabeh, consideram que o ataque que resultou em mortos e feridos foi o resultado de discursos que atribuem todos os problemas da França a muçulmanos e pessoas de origem africana.", "titulo_pt": "Depois do tiroteio letal em Trappes, moradores expressam raiva e resignação diante do racismo persistente", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 222780, "titulo": "Esto es Chile: El Maule ama su naturaleza, pero le teme a la falta de trabajo", "url": "https://www.latercera.com/esto-es-chile/noticia/el-maule-ama-su-naturaleza-pero-le-teme-a-la-falta-de-trabajo/", "fonte_id": "la_tercera", "data_pub": "2026-10-24T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O estudo de 'Esto const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">

             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}

    : "";

    ${eventosHtml}

}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}
