_de": null, "texto_pt": "A empresária Tatyana Kim, a mulher mais rica da Rússia, viu sua fortuna diminuir após ataques com drones que destruíram mercadorias avaliadas em pelo menos 550 bilhões de rublos (US$ 6,4 bilhões) em instalações da empresa até o final de agosto.", "titulo_pt": "Tatyana Kim: a mulher mais rica da Rússia que viu sua fortuna encolher após ataques", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 172117, "titulo": "Preço global de alimentos sobe com clima e risco de El Niño", "url": "https://www.cnnbrasil.com.br/agro/brasil-se-firma-como-fiador-alimentar-mas-dependencia-de-insumos-ameaca-margens/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-20T16:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O índice da FAO subiu 1,9% em agosto. Especialistas alertam para o risco de um fenômeno climático intenso, o El Niño.", "titulo_pt": "Preço global de alimentos aumenta com clima e risco de El Niño", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 172170, "titulo": "Restaurantes dos EUA reduzem carne nos hambúrgueres para enfrentar inflação", "url": "https://www.infomoney.com.br/economia/restaurantes-dos-eua-reduzem-carne-nos-hamburgueres-para-enfrentar-inflacao/", "fonte_id": "infomoney", "data_pub": "2026-09-20T16:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Restaurantes nos Estados Unidos estão ajustando seus menus, diminuindo as porções de carne nos hambúrgueres e utilizando cortes mais baratos para enfrentar a alta dos preços da carne bovina.", "titulo_pt": "Restaurantes dos EUA reduzem carne nos hambúrgueres para combater inflação", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 172171, "titulo": "Kashkari, do Fed, diz que inflação ainda está alta demais em todos os setores nos EUA", "url": "https://www.infomoney.com.br/economia/kashkari-do-fed-diz-que-inflacao-ainda-esta-alta-demais-em-todos-os-setores-nos-eua/", "fonte_id": "infomoney", "data_pub": "2026-09-20T16:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Fed, Kashkari, apoiou a decisão unânime de aumentar as taxas de juros em um quarto de ponto percentual, para 3,75% a 4,00%, mantendo que a inflação ainda está alta demais em todos os setores dos EUA.", "titulo_pt": "Kashkari, do Fed, afirma que a inflação ainda está alta demais em todos os setores dos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 172570, "titulo": "Wall Street expects US to issue about $1tn of short-term debt as borrowing costs climb", "url": "https://www.ft.com/content/3fcee89f-b69d-4f4b-a944-39fe1c214fb8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-20T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas de Wall Street esperam que o governo dos Estados Unidos empreenda cerca de 1 trilhão de dólares em títulos do tesouro a curto prazo, enquanto os custos de empréstimo aumentam. Este aumento na dependência de títulos a prazo ocorre enquanto Scott Bessent tenta conter o aumento das taxas de juros a longo prazo.", "titulo_pt": "Wall Street espera empréstimos a curto prazo de 1 trilhão de dólares dos EUA à medida que custos de empréstimo aumentam", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 171985, "titulo": "Diferença de juros entre Brasil e EUA diminui, mas ativos locais seguem atrativos para estrangeiros", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/diferenca-de-juros-entre-brasil-e-eua-diminui-mas-ativos-locais-seguem-atrativos-para-estrangeiros.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-20T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Copom do Banco Central do Brasil cortou a taxa Selic para 13,75%, enquanto o Federal Reserve dos Estados Unidos elevou os juros para a faixa entre 3,75% e 4%. A diferença de juros entre Brasil e EUA diminuiu, mas os ativos locais permanecem atrativos para investidores estrangeiros.", "titulo_pt": "Diferença de juros entre Brasil e EUA diminui, mas ativos locais seguem atrativos para estrangeiros", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 172513, "titulo": "Warren Buffett hands over $1 trillion financial empire to son", "url": "https://www.lemonde.fr/en/international/article/2026/09/20/warren-buffett-hands-over-his-1-trillion-financial-empire-to-his-son_6757738_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-20T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Warren Buffett, magnata de 96 anos conhecido como 'O Profeta de Omaha', transferiu a presidência do conselho de administração da conglomerada Berkshire Hathaway, que liderou por 60 anos, para seu filho Howard Buffett.", "titulo_pt": "Warren Buffett passa para o filho o império financeiro de uma trilhão de dólares", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 172151, "titulo": "Porsche, China e tarifas: o que levou a Volkswagen a cortar projeções para 2026", "url": "https://exame.com/invest/mercados/porsche-china-e-tarifas-o-que-levou-a-volkswagen-a-cortar-projecoes-para-2026/", "fonte_id": "exame", "data_pub": "2026-09-20T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Volkswagen reduziu suas projeções de receita para 2026, projetando uma receita de aproximadamente 315 bilhões de euros, abaixo dos 321,9 bilhões registrados em 2025.", "titulo_pt": "Porsche, China e tarifas: o que levou a Volkswagen a cortar projeções para 2026", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 172155, "titulo": "12 franquias baratas para quem quer deixar de ser funcionário a partir de R$ 5 mil", "url": "https://exame.com/negocios/12-franquias-baratas-para-quem-quer-deixar-de-ser-funcionario-a-partir-de-r-5-mil/", "fonte_id": "exame", "data_pub": "2026-09-20T12:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lista apresenta 12 franquias com investimentos entre R$ 5 mil e R$ 134,4 mil, oferecendo opções em turismo, alimentação, limpeza, lavanderias e serviços.", "titulo_pt": "12 Franquias econômicas para quem deseja sair do emprego com investimento a partir de R$ 5 mil", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 171986, "titulo": "Presidente da General Motors lidera crescimento da montadora amparado pela paixão por carros", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/presidente-da-general-motors-lidera-crescimento-da-montadora-amparado-pela-paixao-por-carros.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-20T10:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente da General Motors lidera o crescimento da empresa baseado na sua paixão por carros. Há dois tipos comuns de carreiras na empresa: o jovem que começa no chão de fábrica e ascende até se tornar presidente, e o novato que é apoiado por uma família que controla a companhia.", "titulo_pt": "Presidente da General Motors impulsiona crescimento com paixão por carros", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 171987, "titulo": "Crise na Escócia e novos hábitos de consumo ameaçam setor de uísque", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/crise-na-escocia-e-novos-habitos-de-consumo-ameacam-setor-de-uisque.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-20T10:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Holyrood Distillery, uma fabricante artesanal de uísque em Edimburgo, Escócia, teve um verão movimentado com visitantes para degustações durante a temporada de festivais. A empresa enfrenta desafios devido à crise na Escócia e mudanças nos hábitos de consumo.", "titulo_pt": "Crise na Escócia e novos hábitos de consumo ameaçam setor de uísque", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 171988, "titulo": "Varejo físico enfrenta concorrência online com lojas 'com alma' e experiências", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/varejo-fisico-enfrenta-concorrencia-online-com-lojas-com-alma-e-experiencias.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-20T10:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O varejo digital está bem estabelecido no país, mas o comércio físico não vai desaparecer desde que se atualize. As lojas físicas precisam se adaptar oferecendo experiências únicas e 'almas' para competir com a concorrência online.", "titulo_pt": "Varejo físico enfrenta concorrência online com lojas 'com alma' e experiências", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 171989, "titulo": "Capim Santo assume operação gastronômica da Reserva Morros Verdes e prevê expansão", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/capim-santo-assume-operacao-gastronomica-da-reserva-morros-verdes-e-preve-expansao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-20T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Grupo Capim Santo assumiu a operação gastronômica da Reserva Morros Verdes, localizada em Ibiúna, a 70 quilômetros de São Paulo, a partir deste mês. A parceria visa a expansão das atividades gastronômicas no local.", "titulo_pt": "Capim Santo assume operação gastronômica da Reserva Morros Verdes e prevê expansão", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 172320, "titulo": "Subvenções: regra sobre reserva de lucros não vale para PIS/Cofins, decide Carf", "url": "https://www.jota.info/tributos/subvencoes-regra-sobre-reserva-de-lucros-nao-vale-para-pis-cofins-decide-carf", "fonte_id": "jota", "data_pub": "2026-09-20T09:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Administrativo de Recursos Fiscais (CARF) decidiu que a regra sobre a reserva de lucros não se aplica para os créditos de PIS/Cofins. A discussão girava em torno da possibilidade de não tributar os créditos quando a empresa não registra os valores em conta de reserva.", "titulo_pt": "Subvenções: regra sobre reserva de lucros não vale para PIS/Cofins, decide Carf", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 172322, "titulo": "Quem ganha quando uma licitação de concessão de saneamento não sai do lugar?", "url": "https://www.jota.info/opiniao-e-analise/artigos/quem-ganha-quando-uma-licitacao-de-concessao-de-saneamento-nao-sai-do-lugar", "fonte_id": "jota", "data_pub": "2026-09-20T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A decisão do STF sobre saneamento em Santa Catarina pode comprometer a universalização do serviço até 2033. O caso pode afetar outras licitações de concessão no setor.", "titulo_pt": "Quem ganha quando uma licitação de saneamento não avança?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 171980, "titulo": "O Brasil ajudou a IA a revolucionar a matemática", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/ronaldolemos/2026/09/o-brasil-ajudou-a-ia-a-revolucionar-a-matematica.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-20T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na semana passada, o diretor-geral do IMPA, Marcelo Viana, discutiu com o autor a revolução causada pela inteligência artificial na matemática. O artigo sobre o tema foi escrito por Marcelo Viana e Artur Avila, outro brasileiro premiado com a medalha Fields, publicado na Folha.", "titulo_pt": "Brasil contribuiu para a IA revolucionar a matemática", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 172121, "titulo": "“Deu match na pecuária”; IA ajuda na escolha de touro para vacada Brangus", "url": "https://www.cnnbrasil.com.br/agro/deu-match-na-pecuaria-ia-ajuda-na-escolha-de-touro-para-vacada-brangus/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-20T16:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Criadores da raça Brangus utilizam um programa de inteligência artificial para analisar dados zootécnicos de reprodutores, facilitando a escolha do touro ideal para melhorar o rebanho.", "titulo_pt": "IA auxilia na seleção de touros para a raça Brangus", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 172744, "titulo": "New California law will penalize influencers who don’t disclose political ads", "url": "https://techcrunch.com/2026/09/20/new-california-law-will-penalize-influencers-dont-disclose-political-ads/", "fonte_id": "techcrunch", "data_pub": "2026-09-20T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova lei californiana estabelece penalidades para influenciadores digitais que não revelam quando são pagos para publicar sobre assuntos políticos.", "titulo_pt": "Nova lei californiana penalizará influenciadores que não revelarem anúncios políticos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 172745, "titulo": "TechCrunch Mobility: How do we know when an AV is safe enough?", "url": "https://techcrunch.com/2026/09/20/techcrunch-mobility-how-do-we-know-when-an-av-is-safe-enough/", "fonte_id": "techcrunch", "data_pub": "2026-09-20T16:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O TechCrunch Mobility discute como se pode determinar quando um veículo autônomo (AV) é seguro o suficiente. O conteúdo aborda o papel crescente da inteligência artificial (IA) na mobilidade futura.", "titulo_pt": "Como sabemos quando um veículo autônomo é seguro o suficiente?", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 172579, "titulo": "Trump says 250ft arch will be ‘military complex’ with drones and snipers", "url": "https://www.ft.com/content/33b317b4-cd7b-486a-8707-4d65db837c6d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-20T15:43:00Z", "idioma": "en", "provavel_duplicata_de": 172451, "texto_pt": "O presidente Trump afirmou que o arco de 250 pés será uma 'compleja militar' com drones e snipers. A justificativa nacional de segurança é usada para justificar o controverso monumento em Washington.", "titulo_pt": "Trump diz que arco de 250 pés será 'complexo militar' com drones e snipers", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 172131, "titulo": "IA em pequenos negócios: 5 principais erros ao adotar — e como evitar", "url": "https://www.cnnbrasil.com.br/economia/seu-bolso/empreendedorismo-e-trabalho/ia-em-pequenos-negocios-5-principais-erros-ao-adotar-e-como-evitar/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-20T15:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo discute os cinco principais erros comuns ao adotar Inteligência Artificial em pequenas e médias empresas e oferece sugestões para evitar esses erros. Os temas abordados incluem a identificação do problema e a segurança de dados.", "titulo_pt": "IA em pequenos negócios: 5 principais erros ao adotar — e como evitar", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 172504, "titulo": "How concerned should we be about AI's supposed existential threat to humanity?", "url": "https://www.lemonde.fr/en/pixels/article/2026/09/20/how-concerned-should-we-be-about-ai-s-supposed-existential-threat-to-humanity_6757739_13.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-20T14:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Existe um debate entre cientistas que alertam sobre o risco potencial de inteligência artificial causar a extinção da humanidade e aqueles que consideram esses medos infundados.", "titulo_pt": "Como nos preocupar com a suposta ameaça existencial da IA para a humanidade?", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 172525, "titulo": "The 'robot relations' department may become reality in workplace of the future", "url": "https://www.cnbc.com/2026/09/20/ai-jobs-worker-fears.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-20T14:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A implementação de inteligência artificial, incluindo chatbots, humanoides e sistemas de gestão automatizados, está se tornando comum nas corporações, com implicações significativas para o salário e a autonomia dos trabalhadores.", "titulo_pt": "O departamento de 'relações robóticas' pode se tornar realidade no futuro do trabalho", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 171984, "titulo": "Austrália diz que big techs precisam ajudar em restrições para menores nas redes sociais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/australia-diz-que-big-techs-precisam-ajudar-em-restricoes-para-menores-nas-redes-sociais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-20T14:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro da Austrália, Anthony Albanese, afirmou que busca o apoio das grandes empresas de tecnologia para as leis de proteção de crianças na internet e para regulamentar a inteligência artificial. Albanese destaca a necessidade de colaboração das 'big techs' para implementar restrições nas redes sociais.", "titulo_pt": "Austrália busca apoio das grandes empresas de tecnologia para proteger crianças na internet", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 172747, "titulo": "6 days left to get ahead at TechCrunch Disrupt 2026", "url": "https://techcrunch.com/2026/09/20/6-days-left-to-get-ahead-at-techcrunch-disrupt-2026/", "fonte_id": "techcrunch", "data_pub": "2026-09-20T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O prazo para obtenção de desconto em ingressos para o TechCrunch Disrupt 2026 termina em 25 de setembro às 23h59 (horário do Pacífico). Até lá, é possível economizar até US$ 200 em ingressos, participando de um evento com mais de 10.000 participantes, incluindo fundadores, investidores e líderes tecnológicos.", "titulo_pt": "6 Dias restantes para se antecipar no TechCrunch Disrupt 2026", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 172148, "titulo": "'Botão para desligar a IA' enfrenta desafios técnicos e regulatórios nos EUA", "url": "https://exame.com/inteligencia-artificial/botao-para-desligar-a-ia-enfrenta-desafios-tecnicos-e-regulatorios-nos-eua/", "fonte_id": "exame", "data_pub": "2026-09-20T13:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma proposta para um 'botão de desligamento' emergencial de sistemas de inteligência artificial ganha força nos Estados Unidos após relatos de desobediência, mas especialistas alertam que a implementação pode enfrentar desafios técnicos e regulatórios devido à distribuição da tecnologia em diferentes servidores e a possibilidade de sistemas tentarem impedir sua própria interrupção.", "titulo_pt": "Botão para desligar a IA enfrenta desafios nos EUA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 172576, "titulo": "AI is a powerful but problematic new collaborator in mathematics", "url": "https://www.ft.com/content/05a7292e-4931-4631-8f77-164fb727c203", "fonte_id": "financial_times", "data_pub": "2026-09-20T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial está se tornando uma colaboradora poderosa, mas problemática na matemática. Já estamos observando consequências imprevistas de algoritmos alcançando objetivos com parâmetros mal definidos e restrições.", "titulo_pt": "A IA é uma colaboradora poderosa, mas problemática, na matemática", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 172420, "titulo": "The tech battle to build your AI assistant", "url": "https://www.axios.com/2026/09/20/ai-assistant-openai-meta-muse-instinct-grok-apple", "fonte_id": "axios", "data_pub": "2026-09-20T12:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O assistente pessoal de inteligência artificial prometido há muito tempo está finalmente chegando, com uma gama de agentes que oferecem serviços para gerenciar partes do cotidiano. Esses assistentes, impulsionados por avanços rápidos na IA, já têm memória, julgamento e autonomia para agir em nosso nome.", "titulo_pt": "A batalha tecnológica para construir seu assistente de IA pessoal", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 172666, "titulo": "Does Trump’s new AI Force signal tech race escalation ahead of Xi Jinping summit?", "url": "https://www.scmp.com/news/china/diplomacy/article/3368158/does-trumps-new-ai-force-signal-tech-race-escalation-ahead-xi-jinping-summit?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-20T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou recentemente uma nova 'Força AI', poucos dias antes de uma visita oficial do líder chinês Xi Jinping. Especialistas afirmam que essa medida pode representar uma escalada na disputa tecnológica entre os países, embora ainda não esteja claro o que exatamente essa 'Força AI' representa.", "titulo_pt": "Anúncio de 'força AI' de Trump perto da visita de Xi Jinping sinaliza escalada na corrida tecnológica?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 172733, "titulo": "Humans, not rogue AI, are still the biggest cybersecurity risk to energy systems", "url": "https://www.theverge.com/science/997834/ai-cyberattack-energy-critical-infrastructure", "fonte_id": "the_verge", "data_pub": "2026-09-20T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os sistemas de energia já eram altamente vulneráveis a ataques cibernéticos antes de recentes incidentes de alto perfil. O maior risco para os sistemas energéticos continua sendo os humanos, e não os AI maliciosos.", "titulo_pt": "Humanos, não IA maliciosos, ainda são a maior ameaça cibernética para os sistemas de energia", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 172521, "titulo": "Nvidia CEO Jensen Huang emerges as Trump's top ally in AI safety debate", "url": "https://www.cnbc.com/2026/09/20/nvidia-ceo-jensen-huang-emerges-as-trumps-top-ally-in-ai-debate.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-20T11:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jensen Huang, CEO da Nvidia, tornou-se um aliado principal de Trump nas discussões sobre segurança em IA. Sua posição como líder da empresa mais valiosa do mundo lhe conferiu influência sobre os assuntos mais importantes da IA para o presidente.", "titulo_pt": "CEO da nvidia se torna aliado principal de Trump em debates sobre segurança em IA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 172755, "titulo": "To understand the solar cycle, notice how the sun sleeps", "url": "https://phys.org/news/2026-09-solar-sun.html", "fonte_id": "phys_org", "data_pub": "2026-09-20T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A atividade solar varia entre períodos turbulentos com muitos pontos solares e períodos calmos e inativos. Embora se saiba que isso ocorre em um ciclo de 11 anos, prever o pico solar exato e sua intensidade continua sendo um desafio mesmo após séculos de observação.", "titulo_pt": "Para compreender o ciclo solar, observe como o sol dorme", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 172756, "titulo": "Virtual cells built from 4D AI models and 'digital twins' could speed up drug discovery", "url": "https://phys.org/news/2026-09-virtual-cells-built-4d-ai.html", "fonte_id": "phys_org", "data_pub": "2026-09-20T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mitocôndrias, estruturas que convertem nutrientes em energia, formam uma rede dinâmica e interconectada ao longo de todo o célula, se divinizando e fusindo rapidamente conforme são transportadas para onde a energia é mais necessária. Modelos de inteligência artificial em 4D podem ser usados para simular essas estruturas de forma virtual, acelerando o processo de descoberta de medicamentos.", "titulo_pt": "Células virtuais construídas a partir de modelos AI em 4D e 'gemelos digitais' podem acelerar a descoberta de medicamentos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 172757, "titulo": "The story of Little Italy's Feast of San Gennaro is the story of how Italian immigrants became American", "url": "https://phys.org/news/2026-09-story-italy-feast-san-gennaro.html", "fonte_id": "phys_org", "data_pub": "2026-09-20T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante duas semanas em setembro, multidões se aglomeram na Feira de São Gennaro em Little Italy, Nova York. Esta feira é vista como uma história da integração dos imigrantes italianos na América.", "titulo_pt": "A história da feira de são Gennaro em Little Italy é a história de como imigrantes italianos se tornaram americanos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 172267, "titulo": "Científicos lograron recrear el sonido que produce la Tierra en el espacio y la melodía resulta inquietante", "url": "https://www.lanacion.com.ar/ciencia/cientificos-lograron-recrear-el-sonido-que-produce-la-tierra-en-el-espacio-y-la-melodia-resulta-nid20092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-20T15:56:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Cientistas da NASA conseguiram transformar as emissões electromagnéticas da Terra e de outros corpos celestes em sons audíveis. O resultado é uma melodia inquietante.", "titulo_pt": "Cientistas da nasa criam melodia com emissões elétricas da terra", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 172758, "titulo": "Magma influx explains short-lived bulge at Tanzania's Ol Doinyo Lengai volcano", "url": "https://phys.org/news/2026-09-magma-influx-short-bulge-tanzania.html", "fonte_id": "phys_org", "data_pub": "2026-09-20T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2024, o time liderado por D. Sarah Stamps detectou e monitorou um breve aumento na altitude da terra ao redor de um vulcão na Tanzânia. A equipe identificou a causa do levantamento como sendo a entrada de 1 milhão de metros cúbicos de magma em um reservatório de magma existente a cerca de 2,9 quilômetros de profundidade.", "titulo_pt": "Influxo de magma explica elevação temporária na região do vulcão Ol Doinyo Lengai na tanzânia", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 171946, "titulo": "Chihuahuas são parte coiotes, e talvez por isso sejam pequenos, mas bravos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/chihuahuas-sao-parte-coiotes-e-talvez-por-isso-sejam-pequenos-mas-bravos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-20T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa recente revela que chihuahuas têm parte de genética de coiotes selvagens. Originários do México, esses cães são hoje populares como animais de estimação em vários países, incluindo o Reino Unido e os Estados Unidos.", "titulo_pt": "Chihuahuas têm parte de coiotes em sua genética, e são pequenos, mas bravos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 172661, "titulo": "Rare earth exposure can triple low birthweight risk: Chinese study", "url": "https://www.scmp.com/news/china/science/article/3367984/rare-earth-exposure-causes-3-fold-increase-health-risk-chinas-newborns-study?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-20T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa indica que a exposição pré-natal a elementos raras do território pode aumentar o risco de nascimento com baixo peso, com alguns compostos elevando o perigo mais de três vezes. Os pesquisadores monitoraram 4.891 mulheres grávidas que pariram no Hospital Materno-Infantil de Wuhan entre 2012 e 2014, medindo a concentração de 13 elementos raras do território nos amostras de urina das mães.", "titulo_pt": "Exposição pré-natal a elementos raras pode triplicar risco de baixo peso ao nascer: estudo chinês", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 172759, "titulo": "Longitudinal survey finds little evidence that social tech predicts life satisfaction in adults", "url": "https://phys.org/news/2026-09-longitudinal-survey-evidence-social-tech.html", "fonte_id": "phys_org", "data_pub": "2026-09-20T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo longitudinal não encontrou evidências significativas de que as tecnologias sociais predizem a satisfação na vida dos adultos. Essas tecnologias digitais permitem a comunicação e o compartilhamento de conteúdo online e se tornaram uma forma central de comunicação para muitas pessoas ao redor do mundo.", "titulo_pt": "Estudo longitudinal não encontra evidências de que tecnologias sociais predizem a satisfação na vida dos adultos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 172760, "titulo": "Satellites show Earth lost more than 12 trillion tons of ice from Greenland, Antarctica in 47 years", "url": "https://phys.org/news/2026-09-satellites-earth-lost-trillion-tons.html", "fonte_id": "phys_org", "data_pub": "2026-09-20T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De 1979 a 2026, cerca de 12,5 trilhões de toneladas de gelo deram origem em glaciares do Groenlândia e Antártica. Isso equivale a uma camada de gelo 5 pés (1,5 metro) de profundidade sobre todo o continente dos Estados Unidos.", "titulo_pt": "Satélites mostram que a terra perdeu mais de 12 trilhões de toneladas de gelo do groenlândia e antártica em 47 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 172145, "titulo": "Ácido domoico deixa leões-marinhos desorientados — e pode afetar humanos", "url": "https://exame.com/ciencia/acido-domoico-deixa-leoes-marinhos-desorientados-e-pode-afetar-humanos/", "fonte_id": "exame", "data_pub": "2026-09-20T13:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 100 casos de intoxicação por ácido domoico foram registrados em 2026. Especialistas estão investigando o aumento tardio das intoxicações na costa da Califórnia.", "titulo_pt": "Ácido domoico deixa leões-marinhos desorientados — e pode afetar humanos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 172149, "titulo": "Terra pode ter ficado sem o 'escudo' do Sol há milhões de anos, revela Nasa", "url": "https://exame.com/ciencia/terra-pode-ter-ficado-sem-o-escudo-do-sol-ha-milhoes-de-anos-revela-nasa/", "fonte_id": "exame", "data_pub": "2026-09-20T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Simulações indicam que nuvens interestelares comprimiram a heliosfera, deixando a Terra temporariamente exposta ao ambiente da Via Láctea há milhões de anos.", "titulo_pt": "Terra pode ter ficado sem o 'escudo' do Sol há milhões de anos, de acordo com Nasa", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 172152, "titulo": "Remédio para emagrecer retarda o envelhecimento? Estudo investiga efeito", "url": "https://exame.com/ciencia/remedio-para-emagrecer-retarda-o-envelhecimento-estudo-investiga-efeito/", "fonte_id": "exame", "data_pub": "2026-09-20T12:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo com camundongos idosos observou um aumento de 12% na longevidade após o uso de uma substância emagrecedora. O estudo investiga se o mesmo efeito poderia ocorrer em humanos.", "titulo_pt": "Remédio para emagrecer pode aumentar a longevidade? Estudo com camundongos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 172763, "titulo": "8 common food additives linked to high blood pressure and heart disease", "url": "https://www.sciencedaily.com/releases/2026/09/260920031905.htm", "fonte_id": "science_daily", "data_pub": "2026-09-20T12:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores identificaram oito conservantes comuns nos alimentos processados que estão associados à hipertensão arterial, embora o estudo observacional não possa provar que esses conservantes sejam diretamente responsáveis pelos riscos cardíacos.", "titulo_pt": "8 Conservantes comuns em alimentos processados ligados a hipertensão e doenças cardíacas", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 172768, "titulo": "Scientists discover a hidden “ID card” in cat urine", "url": "https://www.sciencedaily.com/releases/2026/09/260919031033.htm", "fonte_id": "science_daily", "data_pub": "2026-09-20T12:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram um 'cartão de identidade' oculto no urina dos gatos, composto por 13 ácidos graxos incomuns. Esses compostos parecem estar associados a gotas de gordura estranhas nos rins e podem representar um sistema de reconhecimento de odor compartilhado entre todos os gatos.", "titulo_pt": "Cientistas descobrem 'cartão de identidade' oculto no urina dos gatos", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 171947, "titulo": "Vão-se os anéis, fica o Cáriclo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/blogs/mensageiro-sideral/2026/09/vao-se-os-aneis-fica-o-cariclo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-20T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os anéis de Saturno são estruturas dinâmicas formadas por fragmentos menores, como grãos de poeira e pedregulhos de gelo e rocha. Observações contínuas permitem identificar que essas estruturas surgem e se dissipam conforme as circunstâncias. Estudos indicam que isso também pode ser o caso dos anéis de Cáriclo.", "titulo_pt": "Vão-se os anéis, fica o dinamismo", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 172156, "titulo": "Ama café? Pesquisa revela o limite diário para não afetar os ossos", "url": "https://exame.com/ciencia/ama-cafe-pesquisa-revela-o-limite-diario-para-nao-afetar-os-ossos/", "fonte_id": "exame", "data_pub": "2026-09-20T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo com quase 10 mil mulheres analisou a relação entre diferentes níveis de consumo de café e a saúde óssea. O objetivo foi determinar o limite diário de café que não afeta negativamente os ossos.", "titulo_pt": "Amiga, café? Pesquisa revela o limite diário para não afetar os ossos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 171937, "titulo": "Festival de Toronto premia 'A Bola Negra' e filme sobre os dramas da guerra em Gaza", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/festival-de-toronto-premia-a-bola-negra-e-filme-sobre-os-dramas-da-guerra-em-gaza.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-20T16:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Festival de Toronto premiou 'A Bola Negra' com o People's Choice Award e 'Angh', vencedor da mostra Platform.", "titulo_pt": "Festival de Toronto premia 'A Bola Negra' e filme sobre Gaza", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 172050, "titulo": "Roda de Choro celebra flautista Altamiro Carrilho na Rádio MEC", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-09/roda-de-choro-celebra-flautista-altamiro-carrilho-na-radio-mec", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-09-20T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Rádio MEC exibe no próximo domingo, às 20h, um episódio do programa Roda de Choro que celebra os álbuns 'Choros Imortais' do flautista Altamiro Carrilho, lançados em 1964 e 1965. O programa também será transmitido na Rádio Nacional às sextas-feiras, às 22h.", "titulo_pt": "Roda de Choro celebra flautista Altamiro Carrilho na Rádio MEC", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 172790, "titulo": "‘It’s been work to not go crazy’: Way Dynamic, the Australian folk-pop musician with fans including Elton John", "url": "https://www.theguardian.com/music/ng-interactive/2026/sep/21/way-dynamic-interview-australian-folk-pop-musician-dylan-young-masive-shoe", "fonte_id": "guardian_culture", "data_pub": "2026-09-20T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dylan Young, o multi-instrumentista australiano da Way Dynamic, está ganhando reconhecimento internacional com seu álbum 'Massive Shoe', que será reeditado após Young assinar com a gravadora indie Jagjaguwar. Elton John, Djo, Zane Lowe e Elijah Wood são alguns dos artistas que elogiaram seu trabalho.", "titulo_pt": "É trabalho não perder a sanidade: way Dynamic, o músico de folk-pop australiano com fãs como Elton John", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 172051, "titulo": "Ópera Completa, da Rádio MEC, apresenta composição de Carlos Gomes", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-09/opera-completa-da-radio-mec-apresenta-composicao-de-carlos-gomes", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-09-20T14:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Rádio MEC exibe no programa Ópera Completa a gravação da ópera 'Salvator Rosa', de Carlos Gomes, com regência de Maurizio Benini, neste domingo (20) às 17h. A performance conta com solistas renomados.", "titulo_pt": "Ópera Completa da Rádio MEC homenageia Carlos Gomes com 'salvator rosa'", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 172052, "titulo": "Livraria transforma vida cultural de pequeno município de São Paulo", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-09/livraria-transforma-vida-cultural-de-pequeno-municipio-de-sao-paulo", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-09-20T14:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em Bom Jesus dos Perdões, uma livraria chamada Casa do Leitor foi fundada em 2016 por Guilherme Moura e Fernanda Miquelino com o objetivo de promover a leitura e debates públicos. Antes disso, a cidade não tinha nenhuma livraria.", "titulo_pt": "Livraria transforma vida cultural em pequeno município paulista", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 172793, "titulo": "Henry Herford obituary", "url": "https://www.theguardian.com/music/2026/sep/20/henry-herford-obituary", "fonte_id": "guardian_culture", "data_pub": "2026-09-20T14:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Henry Herford, baixo-barítono britânico de 79 anos, era conhecido por sua ampla gama de papéis e performances de obras menos conhecidas. Ele começou sua carreira no coral do Glyndebourne Opera em 1977 e atuou em mais de 70 papéis em óperas.", "titulo_pt": "Obituário de henry Herford", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 172053, "titulo": "Diretor de Feito Pipa destaca relações familiares como centro da obra", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-09/diretor-de-feito-pipa-destaca-relacoes-familiares-como-centrais-na-obr", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-09-20T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme 'Feito Pipa', dirigido por Allan Deberton, foi escolhido para representar o Brasil na corrida pelo prêmio de Melhor Filme Internacional no Oscar 2027. A obra aborda temas como identidade de gênero, preconceito e a relação entre avó e neto, entre outros.", "titulo_pt": "Diretor de Feito Pipa destaca relações familiares como centro da obra", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 172054, "titulo": "Filme cearense Feito Pipa representa Brasil na disputa pelo Oscar", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-09/filme-cearense-feito-pipa-representa-brasil-na-disputa-pelo-oscar", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-09-20T13:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O filme cearense Feito Pipa, dirigido por Allan Deberton, será o representante do Brasil na disputa pelo Oscar de 2027. A história gira em torno de um menino de 11 anos que vive com a avó no interior do Ceará e enfrenta desafios com a doença da cuidadora e o medo de ser separado da avó.", "titulo_pt": "Filme cearense Feito Pipa representa Brasil no Oscar", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 171938, "titulo": "Ópera em Belo Horizonte humaniza Chica da Silva e revisita o mito histórico", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/opera-em-belo-horizonte-humaniza-chica-da-silva-e-revisita-o-mito-historico.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-20T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ópera 'Chica da Silva' desvia-se do mito tradicional da personagem, apresentada em filmes e novelas, para explorar a humanidade de uma mulher negra. O espetáculo, que se apresenta em Belo Horizonte, aborda Chica da Silva de uma perspectiva menos lasciva e mais humanizada.", "titulo_pt": "Ópera em Belo Horizonte humaniza Chica da Silva e revisita o mito histórico", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 172402, "titulo": "What Is Humanity’s Place in the Cosmos?", "url": "https://www.theatlantic.com/podcasts/2026/09/what-is-humanitys-place-in-the-cosmos/688668/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-20T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A astrônoma Priyamvada Natarajan dedicou sua vida a explorar as regiões desconhecidas do universo, mapeando suas fenômenos mais misteriosos.", "titulo_pt": "O lugar da humanidade no Cosmos", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 172403, "titulo": "50 Songs That Explain America", "url": "https://www.theatlantic.com/culture/2026/09/50-songs-explain-america-playlist/687598/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-20T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo explora 50 músicas que ilustram a essência cultural dos Estados Unidos, variando desde a música de Sinatra até a de SZA, passando por folk da Appalachia e funk de Detroit.", "titulo_pt": "50 Músicas que explicam a alma dos estados unidos", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 172788, "titulo": "Singer Becky Hill looks back: ‘Aside from the music I was making, I hated every minute of my 20s’", "url": "https://www.theguardian.com/lifeandstyle/2026/sep/20/singer-becky-hill-looks-back-album-rebecca", "fonte_id": "guardian_culture", "data_pub": "2026-09-20T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Becky Hill, nascida em 1994 em Bromsgrove, é uma cantora e compositora. Ela começou a fazer música aos 14 anos, atingiu as semifinais do The Voice UK e lançou dois álbuns no top 10. Hill também colaborou com artistas como David Guetta e Rudimental, e ganhou o prêmio Brit Award para melhor ato dance em 2022 e 2023.", "titulo_pt": "Singer Becky Hill reflete sobre sua carreira e desafios na adolescência", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 172055, "titulo": "Produções com artistas negros ganham espaço, mas desigualdade resiste", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-09/producoes-com-artistas-negros-ganham-espaco-mas-desigualdade-resiste", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-09-20T12:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Além do filme 'Feito Pipa', escolhido para representar o Brasil no Oscar 2027, outros dois longas de diretores negros estavam entre os seis filmes pré-selecionados para o Festival de Brasília do Cinema Brasileiro. São histórias que emocionam e desafiam convenções.", "titulo_pt": "Produções com artistas negros ganham espaço, mas desigualdade resiste", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 172789, "titulo": "Not I review – a mouth steals the show in Rufus Norris’s strange and deeply moving take on Beckett", "url": "https://www.theguardian.com/stage/2026/sep/20/not-i-review-minghella-theatre-reading-rufus-norris-samuel-beckett", "fonte_id": "guardian_culture", "data_pub": "2026-09-20T12:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A peça 'Not I', dirigida por Rufus Norris, destaca o rosto de Soprano Claire Booth, que interpreta a boca de uma mulher desesperada em uma cena isolada. Antes do início, há uma introdução musical e cinematográfica que prepara o público para a obra de Samuel Beckett.", "titulo_pt": "Not I revisão – a boca de claire booth rouba a cena em uma versão estranha e profundamente tocante de Beckett", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 172786, "titulo": "Ed Sheeran says situation in Gaza ‘unjustifiable’ in first show since tour plunged into turmoil", "url": "https://www.theguardian.com/music/2026/sep/20/ed-sheeran-gaza-catastrophic-and-unjustifiable-first-show-tour-loop-philadelphia-us", "fonte_id": "guardian_culture", "data_pub": "2026-09-20T11:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ed Sheeran abriu seu show solo em Philadelphia comentando sobre a situação em Gaza, chamando-a de 'catastrófica e injustificável'. Ele expressou seu pesar pelo grande dano e perda de vidas civis, especialmente de crianças, e disse que quer que sua música e shows promovam unidade e humanidade, não política.", "titulo_pt": "Ed Sheeran comenta sobre Gaza em show após tour entrar em turbulência", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 172404, "titulo": "The Pinball President", "url": "https://www.theatlantic.com/ideas/2026/09/trump-attention-presidents/688712/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-20T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Donald Trump é conhecido por sua habilidade em chamar a atenção do público, mas há uma distinção entre isso e transformar essa atenção em ação efetiva. Como presidente, ele tem sido particularmente bom em capturar a atenção do público.", "titulo_pt": "O presidente Pinball", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 172646, "titulo": "Man sentenced to prison for killing temple fish", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/21/2003864630", "fonte_id": "taipei_times", "data_pub": "2026-09-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem foi condenado a prisão por matar peixes em um templo. O caso envolveu a morte de peixes em uma instituição religiosa local.", "titulo_pt": "Homem sentenciado à prisão por matar peixes em templo", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 172246, "titulo": "Detuvieron a un entrenador de hockey acusado de iunfo foi atribuído à mãe de Lee, por sua suporte e dedicação.", "titulo_pt": "Campeão masculino de teqball dos jogos asiáticos agradece à mãe", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 172203, "titulo": "Eles se uniram para denunciar abusos em uma escola — e depois se casaram", "url": "https://www.bbc.com/portuguese/articles/cqy7z172r4zyo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-20T11:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dois alunos uniram-se para denunciar abusos cometidos por um diretor de escola indonésio e, posteriormente, se casaram.", "titulo_pt": "Eles se uniram para denunciar abusos em uma escola — e depois se casaram", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 172674, "titulo": "Low pay, job insecurity for China’s trainee doctors a turn-off for young talent", "url": "https://www.scmp.com/news/china/science/article/3367856/low-pay-job-insecurity-chinas-trainee-doctors-turn-young-talent?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-20T09:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Huang Qiaoyuan, um estudante de medicina no quinto ano na região autônoma de Guangxi Zhuang, no sul da China, está considerando abandonar a carreira médica após concluir seu treinamento. Ela foi inicialmente atraída pela profissão durante a pandemia de Covid-19, mas agora se preocupa com o baixo salário e a instabilidade no emprego.", "titulo_pt": "Baixo salário e insegurança no emprego desanimam jovens médicos em formação na China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 172321, "titulo": "Saúde em 2026: convergência digital esconde divergências sobre desenho do SUS", "url": "https://www.jota.info/opiniao-e-analise/artigos/saude-em-2026-convergencia-digital-esconde-divergencias-sobre-desenho-do-sus", "fonte_id": "jota", "data_pub": "2026-09-20T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O prontuário único e a inteligência artificial unem os planos de saúde propostos pelos presidenciáveis, mas há divergências em relação ao financiamento e ao envolvimento do setor privado no Sistema Único de Saúde (SUS).", "titulo_pt": "Saúde em 2026: convergência digital esconde divergências sobre desenho do SUS", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 172694, "titulo": "Not all harmful actions between students count as school violence: Supreme Court", "url": "https://www.koreaherald.com/article/10879660", "fonte_id": "korea_herald", "data_pub": "2026-09-20T08:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte da Coreia do Sul decidiu que uma ação prejudicial de um aluno do primeiro ano que empurrou um colega de classe do púlpito não constituiu violência escolar. A corte enfatizou que não se deve automaticamente classificar como violência escolar todo ato que cause danos físicos ou psicológicos entre alunos.", "titulo_pt": "Não todos os danos entre alunos são considerados violência escolar, decide suprema corte", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 172679, "titulo": "University calls for government funds for shared sites in Northern Metropolis", "url": "https://www.scmp.com/news/hong-kong/education/article/3368146/university-calls-government-funds-shared-sites-northern-metropolis?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-20T07:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da Universidade Privada Saint Francis, professor Stephen Cheung Yan-leung, sugeriu que as autoridades de Hong Kong deveriam assumir uma maior parte dos custos das instalações compartilhadas entre as instituições nas cidades universitárias do Metrópole do Norte. Ele também propôs fundos dedicados à pesquisa para estimular a colaboração entre os campi.", "titulo_pt": "Universidade pede fundos governamentais para instalações compartilhadas no metrópole do norte", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 172702, "titulo": "1 out of 4 young Korean men may be far-right: study", "url": "https://www.koreaherald.com/article/10879613", "fonte_id": "korea_herald", "data_pub": "2026-09-20T05:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado na Korean Journal of Sociology indicou que 25,9% dos jovens homens coreanos podem ter orientação política extremamente conservadora. O estudo analisou as respostas de 2.000 participantes a políticas de assistência social, economia e saúde para categorizá-los em termos de orientação política.", "titulo_pt": "1 Em 4 jovens homens coreanos podem ser extremamente conservadores, sugere estudo", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 171839, "titulo": "Oldest part of population give the most gifts", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/20/2003864585", "fonte_id": "taipei_times", "data_pub": "2026-09-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A parte mais antiga da população dá mais presentes. Estudos indicam que as pessoas mais velhas tendem a presentear mais frequentemente que outras faixas etárias.", "titulo_pt": "A parte mais antiga da população dá mais presentes", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 171847, "titulo": "Low birthrates a sign of evolution", "url": "https://www.taipeitimes.com/News/editorials/archives/2026/09/20/2003864558", "fonte_id": "taipei_times", "data_pub": "2026-09-20T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As baixas taxas de natalidade são sinais de evolução populacional. O artigo discute como essas taxas podem estar associadas a mudanças na sociedade e na economia, refletindo um processo de evolução demográfica.", "titulo_pt": "Baixas taxas de natalidade indicam evoluç const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>

    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
