<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 10/10/2026 19:12 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">

    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">

    <div class="modal-btns">

  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "10/10/2026 19:12", "stats": {"noticias_novas": 368, "resumos_gerados": 196}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Douglas Ruas foi eleito governador do Rio de Janeiro no primeiro turno das eleições, apesar da retotalização de votos pelo TRE que incluiu votos do ex-governador Anthony Garotinho. A campanha de Lula acusa a Meta de interferir nas eleições em favor de Flávio Bolsonaro, com o TSE dando 48 horas para a empresa esclarecer as acusações. Flávio Bolsonaro recebeu 52,7% dos votos válidos no segundo turno da eleição presidencial, contra 47,3% de Lula, segundo a pesquisa Ipespe. Além disso, Flávio Bolsonaro está sendo acusado de ter mentido sobre seu programa econômico, enquanto o deputado Júlio César venceu o cacique do Centrão e conquistou uma vaga no Senado em 2027, utilizando estratégias que incluíram associações com Lula e a obtenção de verbas para prefeituras.", "mundo": "Quatro pessoas morreram devido ao furacão Isaías nos Estados Unidos, principalmente na Flórida, Alabama, Geórgia e Mississippi, deixando cerca de 670 mil residências sem energia elétrica. O aeroporto internacional de Riad, na Arábia Saudita, foi atacado novamente por milicianos hutí, apoiados pelo Irã, resultando em feridos e cancelamento de voos. Além disso, ocorreu um tiroteio em uma residência na cidade de Erie, Pensilvânia, Estados Unidos, que resultou na morte de oito pessoas, sete delas familiares do autor dos disparos. Outra notícia importante foi a disputa política em torno do Prêmio Nobel da Paz, com a ganhadora Navi Pillay criticando as sanções dos EUA ao Tribunal Penal Internacional, considerando-as inaceitáveis.\n\nHavia discussões sobre novas ideias para pôr fim à guerra entre Ucrânia e Rússia em Miami, mas não há detalhes adicionais sobre o conteúdo dessas conversas. Por outro lado, forças do governo do Iêmen lançaram uma contraofensiva contra os houthis, enquanto ataques aeroportuários na Arábia Saudita resultaram em mortos e feridos. O aeroporto de Riad foi alvo de múltiplos ataques dos houthis, com várias pessoas feridas e operações interrompidas. O presidente dos Estados Unidos, Donald Trump, criticou o presidente ucraniano Volodymyr Zelenskyy, exigindo nova liderança para o país. Em Gaza, ataques israelenses resultaram na morte de palestinos, enquanto manifestações em várias cidades europeias exigiram o fim das operações israelenses. O furacão Isaias causou danos na região sul dos Estados Unidos, deixando duas mortes e aproximadamente 800.000 pessoas sem energia.", "economia": "A inflação no Brasil e no exterior continua sendo um fator importante para a economia. O IPCA de setembro subiu 0,82%, principalmente devido ao aumento na tarifa de energia elétrica residencial, o que permitiu que a Selic fosse cortada de forma lenta, conforme analisou um economista. O fenômeno El Niño pode continuar pressionando a inflação até fevereiro, segundo especialistas. Além disso, a inflação da energia está aumentando os custos em diversas áreas, desde o pãozinho até grandes obras de infraestrutura. No exterior, a França enfrenta problemas econômicos, como uma alta dívida pública que ultrapassa 4 trilhões de dólares, em meio a protestos estudantis. O governo dos EUA, sob o presidente Trump, espera que a Reflection AI, uma startup americana de modelos de pesos abertos, possa concorrer com alternativas chinesas mais baratas. A Nvidia, uma das empresas mais valiosas do mundo, avaliada em 5 trilhões de dólares, não oferece refeições gratuitas aos seus funcionários. O CEO da Hedge Investments, André Freitas, afirma que a meta de inflação de 3% é inatingível atualmente devido a fatores como indexação, memória inflacionária e custos globais.", "tecnologia": "Os principais eventos na área de tecnologia abordados nos artigos recentes incluem a necessidade de implementar um 'freio de emergência' nos modelos de inteligência artificial (IA), proposto por Satya Nadella, CEO da Microsoft. Este chamado para medidas de segurança mais robustas surge em um momento em que a IA está ganhando cada vez mais importância. A China está oferecendo alternativas para a dependência americana, enquanto a Arábia Saudita enfrentou interrupções nas operações de seu aeroporto devido a um ataque com mísseis. Além disso, a Amazon está promovendo diversos produtos, incluindo smartwatches, soundbars e tablets, enquanto a Apple anunciou um acordo para contratar uma equipe e licenciar tecnologia de uma startup de podcasts personalizados. A chegada dos audiolivros ao Brasil, a disponibilidade de carros elétricos com sistemas de frenagem regenerativa e a proposta de modernização da energia para data centers e veículos militares também foram pontos destacados.", "ciencia": "Os cientistas do Laboratório de Física de Plasma de Princeton podem ter encontrado uma maneira mais eficiente para obter energia por fusão nuclear. Em vez de aquecer o plasma primeiro e depois aumentar sua densidade, eles inverteram o processo. Essa descoberta pode ajudar nos futuros reatores a alcançarem a fusão auto-sustentável com muito menos energia e a evitar problemas ocultos que tornam a ignição mais difícil. Por outro lado, a Anvisa autorizou testes em humanos de uma vacina brasileira inédita contra a malária. A vacina será testada para segurança, reações e resposta imunológica em 48 voluntários. Além disso, pesquisadores descobriram que traços de psicopatia podem ser identificados na escrita, sugerindo que a escrita pode ser uma ferramenta para a detecção precoce do transtorno.", "cultura": "O filme 'O Faraó dos Bitcoins', com Christian Malheiros e Lorena Comparato no elenco, está sendo filmado no Rio de Janeiro, com a participação especial de Luana Piovani, que não tem um papel principal, mas está envolvida na produção. A 22ª edição do BAphoto, que acontecerá de 22 a 25 de outubro, reunirá 57 galerias e promoverá um fórum com mais de 50 oradores, além de homenagens a artistas. O SP Food Film Fest, festival de cinema em São Paulo conhecido por combinar filmes com degustações gastronômicas, exibe documentários seguidos por pratos gratuitos inspirados nos filmes, criando uma experiência única para os espectadores.", "sociedade": "Um homem foi preso após estuprar uma criança em Paranoá, no Distrito Federal, na noite de sexta-feira (9/10), com a tia da vítima como testemunha. O ministro da Saúde defendeu os programas de redução do dano relacionados a drogas, argumentando a favor dessas iniciativas sem fornecer mais detalhes. Em São Paulo, a Justiça determinou a prisão preventiva de Daniel Santana de Jesus, conhecido como DJ Dani Brasil, após ele ter testado positivo em um teste do bafômetro e tentado fugir da abordagem policial pulando em uma piscina. O DJ estava envolvido em um acidente de trânsito que resultou na morte de uma pessoa. Em outro caso, uma mulher trans teve seu cadastro atualizado no hospital público para refletir seu sexo feminino, conforme consta em sua certidão de nascimento, após o hospital anotar 'masculino' em sua ficha médica.", "meio_ambiente": "A Prefeitura de São Paulo alcançou um marco histórico ao entregar 250 novos ônibus elétricos, elevando a frota para 2.000 veículos e tornando a cidade líder em eletromobilidade no Brasil. Paralelamente, a comunidade Coihuín de Computa em Chiloé concluiu a restauração de 75 hectares de floresta nativa, plantando 16.660 árvores de diversas espécies para recuperar áreas degradadas devido a incêndios e exploração madeireira.", "direitos_humanos": "O Papa Francisco declarou que a pena de morte é 'inadmissível', em uma declaração, e criticou o planejamento dos Estados Unidos para transmitir ao vivo uma execução. Em outro desenvolvimento, a Associação Médica Mundial foi pressionada por médicos israelenses a suspender Israel devido à suposta inação perante a destruição do sistema de saúde palestiniano. Além disso, uma mulher condenada à morte nos Estados Unidos sobreviveu a uma tentativa de execução por injeção letal e foi posteriormente retornada à prisão. O caso chamou a atenção para a incompatibilidade da pena de morte com a dignidade humana. Em outro evento, a vencedora do Nobel da Paz criticou as sanções dos Estados Unidos ao Tribunal Penal Internacional, considerando-as inaceitáveis. Finalmente, em Gaza, uma criança foi morta durante ataques israelenses, reforçando os debates sobre direitos humanos em conflitos. Estes eventos demonstram a persistência de questões relacionadas à pena de morte, sanções internacionais e violações de direitos humanos em diversos contextos globais."}, "resumo_do_dia": {"politica_nacional": [{"id": 208191, "titulo": "Com Ruas eleito no RJ, cinco estados e DF terão 2º turno para governador", "url": "https://www.metropoles.com/brasil/com-ruas-eleito-no-rj-cinco-estados-e-df-terao-2o-turno-para-governador", "fonte_id": "metropoles", "data_pub": "2026-10-10T21:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato Douglas Ruas foi eleito governador do Rio de Janeiro no primeiro turno das eleições. Como resultado, não haverá segundo turno para o estado.", "titulo_pt": "Ruas eleito no RJ, cinco estados e DF evitam 2º turno para governador", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 208150, "titulo": "Campanha de Lula vê interferência ", "url": "https://www.npr.org/2026/10/10/nx-s1-5993847/bayeux-tapestrys-london-tour-spurs-enthusiasts-to-battle-of-hastings-re-enactment", "fonte_id": "npr_news", "data_pub": "2026-10-10T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma reenactment da Batalha de Hastings, que ocorreu há quase um milênio, está atraíndo multidões de entusiastas no Reino Unido. A exposição temporária da Tapeçaria de Bayeux em Londres está inspirando esses entusiastas.", "titulo_pt": "Exposição da tapeçaria de bayeux em londres inspira reenactment da batalha de Hastings", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 208468, "titulo": "Coalizione saudita, attaccato l'aeroporto di Dammam", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/10/coalizione-saudita-attaccato-laeroporto-di-dammam_414bdc69-7888-48d1-9c78-5521c970d523.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-10T21:33:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Um projétil caiu perto do aeroporto de Dammam, no leste do Reino Unido de Arábia. Não há informações adicionais sobre a situação.", "titulo_pt": "Coalizão saudita, atacado o aeroporto de Dammam", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 208421, "titulo": "Trump weighs joining the fight against Houthis after Riyadh airport attack", "url": "https://www.npr.org/2026/10/10/nx-s1-5997512/saudi-arabia-riyadh-airport-bombing-attack", "fonte_id": "npr_news", "data_pub": "2026-10-10T21:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aumento de ataques, incluindo a um aeroporto saudita e infraestrutura de petróleo, ocorreu na semana após uma coalizão liderada por Saudi Arabia lançar uma ofensiva militar contra os Houthis.", "titulo_pt": "Trump considera se juntar à luta contra os Houthis após ataque ao aeroporto de Riyadh", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 208238, "titulo": "Campo de aviação que foi usado pela CIA se torna uros, diz especialista", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/franca-sofre-com-divida-alta-deficit-e-juros-diz-especialista/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-10T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A França enfrenta problemas econômicos, como uma alta dívida pública que ultrapassa 4 trilhões de dólares, em meio a protestos estudantis. O déficit e os juros também são preocupações relevantes para o país.", "titulo_pt": "França sofre com dívida alta, déficit e juros, diz especialista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 208220, "titulo": "Nvidia vale US$ 5 tri, mas funcionários pagam o próprio almoço", "url": "https://www.infomoney.com.br/business/global/nvidia-vale-us-5-tri-mas-funcionarios-pagam-o-proprio-almoco/", "fonte_id": "infomoney", "data_pub": "2026-10-10T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nvidia, uma das empresas mais valiosas do mundo, avaliada em US$ 5 trilhões, não oferece refeições gratuitas aos seus funcionários. Os funcionários precisam pagar por suas próprias refeições.", "titulo_pt": "Nvidia vale US$ 5 trilhões, mas funcionários pagam o próprio almoço", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 208239, "titulo": "Setor de biodiesel no Brasil tem espaço para crescer, diz CEO da Caramuru", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/setor-de-biodiesel-no-brasil-tem-espaco-para-crescer-diz-ceo-da-caramuru/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-10T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da Caramuru Alimentos, Marcus Thieme, prevê a conclusão de testes para a avanço da mistura do biodiesel no próximo ano.", "titulo_pt": "Setor de biodiesel no Brasil tem espaço para crescer, diz CEO da Caramuru", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 208241, "titulo": "IPCA de setembro permite cortes lentos da Selic, diz economista", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/ipca-de-setembro-permite-cortes-lentos-da-selic-diz-economista/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-10T20:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inflação medida pelo IPCA de setembro subiu 0,82%, principalmente devido ao aumento na tarifa de energia elétrica residencial. Essa alta permitiu que a Selic fosse cortada de forma lenta, conforme analisou um economista.", "titulo_pt": "Ipcá de setembro permite reduções graduais da Selic, indica economista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 208243, "titulo": "El Niño forte deve pressionar inflação até fevereiro, diz economista", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/el-nino-forte-deve-pressionar-inflacao-ate-fevereiro-diz-economista/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-10T20:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O IPCA aumentou 0,82% em setembro, com alimentos e bebidas sendo os principais responsáveis pela elevação. O fenômeno El Niño pode continuar pressionando a inflação até fevereiro, segundo especialistas.", "titulo_pt": "Fenômeno el Niño deve pressionar inflação até fevereiro, diz economista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 208222, "titulo": "Viúvo de Brigitte Bardot pediu para ficar fora do testamento e agora se arrepende", "url": "https://www.infomoney.com.br/mundo/viuvo-de-brigitte-bardot-pediu-para-ficar-fora-do-testamento-e-agora-se-arrepende/", "fonte_id": "infomoney", "data_pub": "2026-10-10T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bernard d'Ormale, viúvo de Brigitte Bardot, pediu para não ser incluído no testamento, mas agora se arrepende. Ele precisou deixar a propriedade em Saint-Tropez que compartilhava com a atriz.", "titulo_pt": "Viúvo de Brigitte Bardot pediu para ficar fora do testamento e agora se arrepende", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 208246, "titulo": "Meta de inflação de 3% é inatingível, diz CEO da Hedge Investments", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/meta-de-inflacao-de-3-e-inatingivel-diz-ceo-da-hedge-investments/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-10T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da Hedge Investments, André Freitas, afirma que a meta de inflação de 3% é inatingível atualmente devido a fatores como indexação, memória inflacionária e custos globais.", "titulo_pt": "Meta de inflação de 3% é inatingível, diz CEO", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 208250, "titulo": "Pátria planeja ampliar atuação no saneamento básico do Brasil", "url": "https://www.cnnbrasil.com.br/infra/patria-planeja-ampliar-atuacao-no-saneamento-basico-do-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-10T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa Pátria planeja expandir sua atuação no setor de saneamento básico no Brasil. O executivo Thiago Bronzi detalhou os planos de crescimento e avaliou os desafios enfrentados pelos novos operadores no setor.", "titulo_pt": "Pátria planeja ampliar atuação no saneamento básico do Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 208223, "titulo": "Para CEO da Palantir, só técnicos e ‘neurodivergentes’ têm futuro da era da IA", "url": "https://www.infomoney.com.br/business/global/para-ceo-da-palantir-so-tecnicos-e-neurodivergentes-tem-futuro-da-era-da-ia/", "fonte_id": "infomoney", "data_pub": "2026-10-10T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alex Karp, CEO da Palantir e que convive com dislexia, afirma que a questão cognitiva pode ser uma vantagem no mundo dominado pela tecnologia. Ele sugere que apenas técnicos e indivíduos neurodivergentes terão um futuro promissor na era da inteligência artificial.", "titulo_pt": "Para CEO da Palantir, somente técnicos e ‘neurodivergentes’ terão futuro na era da IA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 208224, "titulo": "Eleito governador do RJ, Douglas Ruas celebra: ‘o povo escolheu a renovação’", "url": "https://www.infomoney.com.br/politica/eleito-governador-do-rj-douglas-ruas-celebra-o-povo-escolheu-a-renovacao/", "fonte_id": "infomoney", "data_pub": "2026-10-10T20:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Douglas Ruas foi eleito governador do Rio de Janeiro após a confirmação dos votos pelo Tribunal Regional Eleitoral do Rio de Janeiro (TRE-RJ). Ele comemorou a vitória, afirmando que o povo escolheu a renovação.", "titulo_pt": "Eleito governador do RJ, Douglas Ruas celebra: ‘o povo escolheu a renovação’", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 208142, "titulo": "Nvidia negocia aquisição da startup americana de modelos abertos Reflection AI", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/nvidia-negocia-aquisicao-da-startup-americana-de-modelos-abertos-reflection-ai.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-10T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nvidia está negociando a aquisição da startup americana Reflection AI, desenvolvedora de modelos de pesos abertos, ou considerando aumentar seu investimento na empresa. O governo dos EUA, sob o presidente Trump, espera que a Reflection AI possa concorrer com alternativas chinesas baratas.", "titulo_pt": "Nvidia negocia aquisição ou aumento de investimento na Reflection AI", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 208225, "titulo": "Ronaldo assume controle de famosa marca de artigos esportivos de tênis no Brasil", "url": "https://www.infomoney.com.br/business/ronaldo-assume-controle-de-famosa-marca-de-artigos-esportivos-de-tenis-no-brasil/  dados de agentes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 208252, "titulo": "Como borrar imagens e capturas de tela no Google Fotos?", "url": "https://canaltech.com.br/apps/google-fotos-como-borrar-imagens-e-capturas-de-tela/", "fonte_id": "canaltech", "data_pub": "2026-10-10T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Google Fotos lançou uma nova ferramenta chamada 'Encobrir' que permite desfocar partes sensíveis de imagens e capturas de tela. Essa função é útil para ocultar informações confidenciais antes de compartilhar as imagens.", "titulo_pt": "Como ocultar informações sensíveis em imagens no Google Fotos?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 208441, "titulo": "Microsoft's Nadella says AI needs an ‘emergency brake’ that humans control", "url": "https://www.cnbc.com/2026/10/10/microsoft-satya-nadella-ai-emergency-brake-safety.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-10T20:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nadella, CEO da Microsoft, juntou-se a outros líderes de tecnologia e pesquisadores em apelar por medidas de segurança mais fortes e, em alguns casos, por um ritmo mais lento no desenvolvimento avançado de inteligência artificial.", "titulo_pt": "Nadella diz que a IA precisa de um 'freio de emergência' controlado por humanos", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 208253, "titulo": "7 melhores brindes da BGS 2026; veja lista", "url": "https://canaltech.com.br/games/7-melhores-brindes-da-bgs-2026-veja-lista/", "fonte_id": "canaltech", "data_pub": "2026-10-10T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Brasil Game Show 2026 começou com alta demanda, vendendo todos os ingressos. O evento oferece diversos brindes de marcas como SEGA e Nintendo, mas algumas empresas ausentes em edições anteriores não participam. O Canaltech listou sete brindes que os visitantes desperate-conditions-without-running-water-or-electricity_6758448_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-10T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os residentes da cidade de Oleshky, no território ocupado pela Rússia na região de Kherson, enfrentam uma severa escassez de alimentos, o que tem gerado crescente preocupação internacional. A cidade está isolada do mundo e sob bombardeio.", "titulo_pt": "Em Oleshky, ocupada pela Rússia, ucranianos sobrevivem em condições 'desesperadoras'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 207269, "titulo": "Why French students are so angry about Parcoursup, the higher education access platform", "url": "https://www.lemonde.fr/en/campus/article/2026/10/10/why-french-students-are-so-angry-about-parcoursup-the-higher-education-access-platform_6758447_11.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-10T03:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A plataforma Parcoursup, responsável pelo acesso às instituições de ensino superior na França, é alvo de críticas dos estudantes, que estão em protesto pedindo sua reconsideração ou remoção total.", "titulo_pt": "Por que os estudantes franceses estão tão irritados com a plataforma Parcoursup de acesso ao ensino superior", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 207273, "titulo": "Denmark set to allow the return of 'physical force' to maintain order in schools", "url": "https://www.lemonde.fr/en/international/article/2026/10/10/denmark-set-to-allow-the-return-of-physical-force-to-maintain-order-in-schools_6758443_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-10T01:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Dinamarca permitirá que os professores usem força física para manter a ordem nas escolas a partir de agosto de 2027, permitindo que eles 'segurem, mantenham um aluno em lugar algum ou levem um aluno para coihuin-de-compu-en-chiloe-culmina-restauracion-de-75-hectareas-de-bosque-nativo/", "fonte_id": "la_tercera", "data_pub": "2026-10-10T20:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A comunidade Coihuín de Computa em Chiloé concluiu a restauração de 75 hectares de floresta nativa, plantando 16.660 árvores de diversas espécies e recuperando áreas degradadas devido a incêndios e exploração madeireira por décadas.", "titulo_pt": "Comunidade Coihuín de computa em Chiloé conclui restauração de 75 hectares de floresta nativa", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 207649, "titulo": "Furacão Isaias deixa 2 mortos e milhares sem energia elétrica nos EUA", "url": "https://www.infomoney.com.br/mundo/furacao-isaias-deixa-2-mortos-e-milhares-sem-energia-eletrica-nos-eua/", "fonte_id": "infomoney", "data_pub": "2026-10-10T16:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O furacão Isaias causou duas mortes e deixou milhares sem energia elétrica nos Estados Unidos. O impacto do furacão afetou várias regiões do país, resultando em interrupções significativas de energia e tragédias humanas.", "titulo_pt": "Furacão Isaias causa duas mortes e deixar milhares sem energia nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 206989, "titulo": "São Paulo atinge marco histórico de 2 mil ônibus elétricos na frota", "url": "https://www.metropoles.com/conteudo-especial/sp-onibus-eletricos", "fonte_id": "metropoles", "data_pub": "2026-10-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Prefeitura de São Paulo entregou 250 novos ônibus elétricos, elevando o número total da frota para 2 mil veículos. Com essa ação, a cidade se tornou líder em eletromobilidade no Brasil.", "titulo_pt": "São Paulo atinge marco histórico com 2 mil ônibus elétricos na frota", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 207150, "titulo": "El costo de no anticiparse a los riesgos climáticos en el sistema de salud", "url": "https://www.latercera.com/sustentabilidad/noticia/el-costo-de-no-anticiparse-a-los-riesgos-climaticos-en-el-sistema-de-salud/", "fonte_id": "la_tercera", "data_pub": "2026-10-10T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute os custos associados à falta de preparo para os riscos climáticos no sistema de saúde. Ele destaca como a não-anticipação pode impactar negativamente o sistema de saúde.", "titulo_pt": "O custo de não se antecipar aos riscos climáticos no sistema de saúde", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 207297, "titulo": "Life-threatening Hurricane Isaias makes landfall in Florida, bringing high winds and heavy rain", "url": "https://www.euronews.com/2026/10/10/life-threatening-hurricane-isaias-makes-landfall-in-florida-bringing-high-winds-and-heavy-", "fonte_id": "euronews", "data_pub": "2026-10-10T07:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Isaias atingiu a Flórida, trazendo ventos fortes e chuva intensa. O Serviço Meteorológico Nacional dos Estados Unidos advertiu sobre uma elevada onda costeira perigosa entre Dauphin Island, Alabama, e Suwannee, Flórida.", "titulo_pt": "Furacão Isaias atinge flórida, trazendo ventos fortes e chuva intensa", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 207041, "titulo": "Mudanças bruscas de clima impactam a circulação e o coração; entenda riscos", "url": "https://www.cnnbrasil.com.br/saude/mudancas-bruscas-de-clima-impactam-a-circulacao-e-o-coracao-entenda-riscos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-10T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mudanças bruscas de temperatura afetam a circulação e o coração, com o calor dilatando os vasos e baixando a pressão, enquanto o frio os contrai e eleva a frequência cardíaca. Crianças, idosos e pessoas com doenças crônicas são os grupos mais vulneráveis a esses efeitos.", "titulo_pt": "Mudanças bruscas de clima impactam a circulação e o coração; entenda riscos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 207407, "titulo": "Malaysia urged to police its firms in Indonesia as haze shuts schools", "url": "https://www.scmp.com/week-asia/health-environment/article/3370388/malaysia-urged-police-its-firms-indonesia-haze-shuts-schools?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-10T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Malásia enfrenta pressão para intensificar o controle sobre suas empresas em relação a supostas conexões com incêndios florestais no exterior, devido à neblina recorrente da Indonésia que continua interrompendo aulas e a vida cotidiana, apesar dos esforços regionais para resolver o problema há anos. As escolas em várias regiões do país foram fechadas e eventos esportivos no fim de semana foram cancelados.", "titulo_pt": "Malásia pressionada a monitorar empresas em razão da neblina na indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 206064, "titulo": "Environmental research academy honored by ARTDO", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/10/2003865726", "fonte_id": "taipei_times", "data_pub": "2026-10-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A acadêmica de pesquisa ambiental foi honrada pelo ARTDO.", "titulo_pt": "Academia de pesquisa ambiental homenageada pelo ARTDO", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 208443, "titulo": "Hundreds of doctors demand World Medical Association suspend Israel", "url": "https://www.aljazeera.com/news/2026/10/10/hundreds-of-doctors-demand-world-medical-association-suspend-israel?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-10T21:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Médicos israelenses exigem que a Associação Médica Mundial suspenda Israel devido à suposta inação perante o destruição sistemática do sistema de saúde palestiniano.", "titulo_pt": "Centenas de médicos pedem que associação médica mundial suspenda Israel", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 208202, "titulo": "Mulher que resistiu à injeção letal nos EUA tem alta e retorna à prisão", "url": "https://www.metropoles.com/mundo/mulher-que-resistiu-a-injecao-letal-nos-eua-tem-alta-e-retorna-a-prisao", "fonte_id": "metropoles", "data_pub": "2026-10-10T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Christa Pike, condenada à morte por assassinato, sobreviveu a uma tentativa de execução por injeção letal no Tennessee em 30 de setembro e foi liberada para casa, retornando posteriormente à prisão.", "titulo_pt": "Mulher condenada à morte sobrevive a injeção letal e retorna à prisão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 208323, "titulo": "Llegaron a EE.UU. como refugiados, pero el Uscis canceló su estatus e inició la deportación y ahora demandan al DHS", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/llegaron-a-eeuu-como-refugiados-pero-el-uscis-cancelo-su-estatus-e-inicio-la-deportacion-y-ahora-nid10102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-10T21:08:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Agnes Mukantagara teve seu status de refugiada revogado pelo USCIS e agora está sendo deportada. Ela e outros refugiados estão processando o DHS por essa decisão.", "titulo_pt": "Fallo permite revisão da revogação do status de refugiada e reabre ação contra Uscis", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 207960, "titulo": "Pope says death penalty ‘inadmissible’ as US plans to livestream execution", "url": "https://www.aljazeera.com/news/2026/10/10/pope-says-death-penalty-inadmissible-as-us-plans-to-livestream-execution?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-10T17:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O papa Léo XIV descreveu a pena de morte como uma 'agressão à inviolabilidade e dignidade da pessoa' em postagem no X. As autoridades dos Estados Unidos planejam transmitir ao vivo a execução de uma pessoa.", "titulo_pt": "Papa léo xiv diz que pena de morte é 'inadmissível' enquanto EUA planejam transmitir execução ao vivo", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 207720, "titulo": "El papa León declara que la pena capital es \"inadmisible\" mientras EEUU planea transmitir ejecución", "url": "https://www.clarin.com/estados-unidos/el-papa-leon-declara-que-la-pena-capital-es-inadmisible-mientras-eeuu-planea-transmitir-ejecucion_0_edGejfvVhg.html", "fonte_id": "clarin", "data_pub": "2026-10-10T17:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Papa Leão condenou a pena capital como inadmível, destacando sua incompatibilidade com a dignidade humana durante o Dia Mundial contra a Pena de Morte. Estados Unidos planeja transmitir ao vivo uma execução por fuzilamento, gerando críticas do Vaticano e líderes religiosos.", "titulo_pt": "Papa leão declara pena capital inadmível enquanto EUA planeja transmitir execução", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 207724, "titulo": "Condenada que sobrevivió a ejecución en EEUU regresa a prisión", "url": "https://www.clarin.com/estados-unidos/condenada-que-sobrevivio-a-ejecucion-en-eeuu-regresa-a-prision_0_Zs97e2IqLR.html", "fonte_id": "clarin", "data_pub": "2026-10-10T17:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma mulher condenada à morte nos Estados Unidos sobreviveu à execução após receber duas doses letais. Ela foi hospitalizada e posteriormente retornou à prisão. O governador do Tennessee suspendeu as execuções e ordenou uma investigação após aceitar a renúncia do chefe penitenciário.", "titulo_pt": "Condenada que sobreviveu à execução nos EUA retorna à prisão", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 207693, "titulo": "Vencedora do Nobel da Paz chama de 'inaceitáveis' sanções dos EUA sobre Tribunal Penal Internacional", "url": "https://exame.com/mundo/vencedora-do-nobel-da-paz-chama-de-inaceitaveis-sancoes-dos-eua-sobre-tribunal-penal-internacional/", "fonte_id": "exame", "data_pub": "2026-10-10T14:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A vencedora do Nobel da Paz foi citada por seu papel na formação de um sistema jurídico internacional para responsabilizar os autores de crimes de guerra. Ela criticou as sanções dos EUA contra o Tribunal Penal Internacional.", "titulo_pt": "Vencedora do Nobel da Paz critica sanções dos EUA ao Tribunal Penal Internacional", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 207993, "titulo": "Nobel peace laureate Pillay calls ICC sanctions 'unacceptable'", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/nobel-peace-laureate-pillay-calls-icc-sanctions-unacceptable", "fonte_id": "middle_east_eye", "data_pub": "2026-10-10T13:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Navi Pillay, ganhadora do Prêmio Nobel da Paz deste ano, criticou as sanções impostas pelos Estados Unidos ao Conselho Penal Internacional (ICC), considerando-as inaceitáveis. Ela expressou preocupação com a tensão e ansiedade sobre a existência contínua de tribunais internacionais, principalmente o ICC em Haia, e destacou que sanções contra juízes, apenas pelo exercício de suas funções, são inéditas e inaceitáveis.", "titulo_pt": "Laureada do prêmio nobel Pillay critica sanções dos EUA ao ICC como inaceitáveis", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 207982, "titulo": "Child among eight killed by Israel on Gaza ‘ceasefire’ anniversary", "url": "https://www.aljazeera.com/news/2026/10/10/israeli-forces-ki const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
