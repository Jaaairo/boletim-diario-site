<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "03/09/2026 07:22", "stats": {"noticias_novas": 858, "resumos_gerados": 245}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O evento mais importante dos artigos é a crise no Supremo Tribunal Federal (STF) envolvendo o ministro Alexandre de Moraes e o banqueiro Daniel Vercaro. As mensagens trocadas entre eles podem levar a uma investigação de crimes de corrupção passiva e advocacia administrativa, o que desafia a estabilidade das alianças internas no STF. O caso também pressiona o governo Lula e o Partido dos Trabalhadores (PT) em relação ao risco de desgaste eleitoral. Além disso, a Proposta de Emenda à Constituição (PEC) da Segurança Pública foi aprovada na Comissão de Constituição e Justiça do Senado, estabelecendo novas regras para chefes de facções criminosas. Outros temas relevantes incluem a pesquisa Quaest que mostra Lula liderando com 37% das intenções de voto no primeiro turno das eleições de 2026, e a possível anulação do relatório de André Mendonça sobre a investigação de Moraes, que é visto por especialistas como irregular.", "mundo": "A atual ocorrência de El Niño, conforme informado pela ONU, pode se tornar a mais forte desde o início dos registros, há 40 anos, devido às temperaturas excepcionalmente quentes no Oceano Pacífico tropical. O conflito entre Irã e Estados Unidos continua a intensificar, com relatos de ataques mútuos a bases militares. Em um desenvolvimento político, o presidente venezuelano Nicolás Maduro solicitou a um juiz dos Estados Unidos que descarte as acusações de tráfico de drogas contra ele, alegando imunidade como chefe de um país soberano. Além disso, a China criticou uma nova lei francesa sobre moda ultra-rápida, considerando-a 'discriminatória', enquanto a Coreia do Sul promoveu um seminário de inovação em saúde, enfatizando a importância de uma implementação previsível de reformas. O conflito entre Rússia e Ucrânia continua sem perspectivas de paz, com ambas as partes usando mísseis e drones para tentar forçar o cedimento do outro.\n\nO cenário geopolítico no Oriente Médio e na Europa continua tenso, com várias tensões e conflitos em andamento. O Irã ameaçou os Estados Unidos de que retaliará com força se Israel realizar uma ofensiva na Serra Al-Asad, no sul do Líbano, após ataques recentes que resultaram em feridos. O presidente dos Estados Unidos, Joe Biden, afirmou que novos conflitos no Oriente Médio não durarão 'muito tempo', enquanto a China apoiou o Irã, mas considera outras relações regionais, indicando que a pressão dos EUA pode limitar a aliança sino-iraniana. Além disso, ataques recentes na Ucrânia e no Kuwait causaram feridos e danos a prédios, com a OTAN alertando que a Rússia está se tornando 'progressivamente imprudente'. O Estreito de Ormuz, crucial para o comércio marítimo global, continua sob ameaça, com passagens de navios abaixo da média de 10 dias, enquanto a China busca aumentar a capacidade de armazenamento de petróleo e gás para reduzir sua exposição a conflitos no Oriente Médio.", "economia": "A bolsa de valores subiu 3% e atingiu seu maior nível desde maio, enquanto o dólar caiu pela terceira vez consecutiva, refletindo a confiança dos investidores. A União Europeia suspendeu a importação de carne bovina, ovos e carne de frango do Brasil, afetando diretamente o setor agrícola. O Banco Central brasileiro está negociando a interligação do Pix ao TIPS, a plataforma de pagamentos instantâneos da Europa, buscando maior integração com o sistema financeiro global. Benjamin Steinbruch deixará o cargo de CEO da CSN após mais de duas décadas, sendo substituído por Fabio Schvartsman, ex-CEO da Vale, em meio a uma reestruturação da empresa. A economia indiana tem superado as previsões em cada trimestre nos últimos doze meses, mas os principais índices de ações do país têm apresentado desempenho decepcionante. O iene subiu rapidamente, atingindo o nível de ¥157 para o dólar, após uma elevação repentina durante a noite. A Hongkong Land está buscando negócios imobiliários de alto valor na região de Tóquio, com foco em complexos mistos de uso, que incluem espaços de escritórios de alto nível, comércio varejista e serviços hoteleiros em locais estratégicos. A General Motors conseguiu manter o terceiro lugar nas vendas de automóveis em agosto após conceder um bônus de R$ 5.000 para toda a linha Chevrolet no último fim de semana, reagindo à pressão da BYD, uma montadora chinesa. O Ministério do Trabalho lançou novas diretrizes que excluem as demandas relacionadas a bônus ligados aos lucros do processo de negociação coletiva obrigatória. A Venezuela assinou acordos com empresas estrangeiras, incluindo a Chevron, ENI e GE Vernova, com o objetivo de expandir a produção de petróleo e atrair investimentos significativos, além de restaurar o sistema elétrico nacional.", "tecnologia": "Sam Altman, CEO da OpenAI, enfatizou a importância de maior interação com autoridades governamentais em relação à inteligência artificial (IA), considerando o processo voluntário de revisão do governo americano 'produtivo'. A OpenAI está prestes a lançar o modelo Astra, o primeiro classificado como 'crítico' em termos de segurança cibernética, exigindo medidas mais robustas de proteção durante o desenvolvimento e antes do lançamento. No Brasil, metade dos universitários não se sente preparada para lidar com a IA, conforme uma pesquisa do Fórum Econômico Mundial, que prevê que 86% das empresas acelerarão o uso de IA até 2030, com destaque para os setores de finanças e eletrônicos. Em contraste, a China e os Estados Unidos estão em uma intensa rivalidade na biociência, com Elon Musk e o CEO da Nvidia, Jensen Huang, pressionando para não estabelecer regulamentações rígidas para a IA, alegando que isso poderia sufocar a inovação. A Samsung reduziu a diferença em relação à SK hynix no mercado global de chips de memória de alta largura de banda (HBM) no segundo trimestre, mantendo o primeiro lugar com 50% de market share, mas com uma participação que caiu 8 pontos percentuais em comparação com o trimestre anterior. Além disso, a Tving, plataforma sul-coreana de streaming, teve quase 40 milhões de contas comprometidas em um enorme vazamento de dados, revelado em um levantamento conjunto de investigação.", "ciencia": "A pesquisa científica avança com notícias significativas em diversos campos. Uma startup anunciou a criação de cães incapazes de causar reações alérgicas em humanos, um avanço potencial para pessoas alérgicas a cães. Em outro desenvolvimento, cientistas da Cornell University descobriram um novo método para gerar fortes campos magnéticos estáticos usando uma metasuperfície que captura luz, sem a necessidade de ímãs externos ou materiais magnéticos. Este método pode avançar em áreas como spintrônica, computação quântica e armazenamento de dados. Além disso, pesquisadores da Universidade de Sydney desenvolveram um material biodegradável chamado 'nanobone', que permite que o corpo utilize suas próprias propriedades de cura para regenerar ossos, oferecendo uma possível alternativa futura a cirurgias de transplante de ossos invasivas que não mudaram significativamente há mais de 50 anos. Estes avanços científicos abrangem desde a saúde animal até a tecnologia avançada, demonstrando o amplo espectro de inovações que estão ocorrendo no campo da ciência.", "cultura": "A cultura global está em alta com diversos eventos e tendências. O artista Maurizio Cattelan, conhecido por suas obras provocativas, prepara uma grande mostra em Berlim, reafirmando sua posição como um dos artistas contemporâneos mais influentes. Em outro projeto cultural, a pintura de Thomas More e sua família, considerada uma obra-prima de Holbein, está sendo analisada em detalhes por um projeto de pesquisa inovador, permitindo ao público um acesso raro. Na arte, a exibição de uma nova exposição de Vânia Mignone, celebrando 30 anos de carreira, é marcada por obras que agora confinam as letras aos quadros. No cinema, a Semana do Cinema em São Paulo oferece ingressos a partir de R$ 10, com sessões matinais, enquanto a comédia 'Minha Melhor Amiga', estrelada por Ingrid Guimarães e Mônica Martelli, estreia nos cinemas. A literatura também está em alta, com a publicação de um novo musical sobre a relação de Marilyn Monroe e Arthur Miller, além de um projeto que retrata a rebelião de Owain Glyndŵr, um líder rebelde do século XV em Gales. Outro destaque é a exposição de um riacho comum em Poughkeepsie, Nova York, documentada pelo fotógrafo Caleb Stein, que captura a comunidade em um local inalterado a cada verão.", "sociedade": "Um homem que havia fugido da justiça foi capturado no Distrito Federal após a vítima conseguir fazer um pedido de ajuda à Polícia Militar. A mulher estava sendo mantida em cárcere privado pelo homem, que é acusado de ameaçar e reter a vítima. Em outro destaque, a população de Taipei, Taiwan, expressou insatisfação com a escolha do filho do prefeito para participar de uma viagem oficial. Além disso, um professor de educação física enfatizou a importância das pernas para a saúde dos idosos acima de 70 anos, destacando a necessidade de treinamento de força para manter a autonomia doméstica. Um estudo sobre experiências paranormais, como a sensação de presença e déjà vu, foi realizado para entender as origens e impactos dessas percepções inquietantes.", "meio_ambiente": "A Indonésia enfrenta um novo ciclo de incêndios florestais, que podem liberar grandes quantidades de carbono, lembrando a crise de 2015. Paralelamente, a China registrou uma diminuição de 1% nas emissões de dióxido de carbono (CO2) no segundo trimestre de 2026, devido à redução no consumo de óleo. O Nepal, por outro lado, registra um aumento alarmante de mortes devido a inundações e deslizamentos de terra, com mais de 1.100 mortos e 3.900 desaparecidos. A ONU alerta que o mundo está prestes a ultrapassar a meta de 1,5°C estabelecida pelo Acordo de Paris, com o aumento da temperatura acima de 1,5°C precisando ter magnitude e duração limitadas para dar tempo para adaptação. Além disso, 1,4 milhão de estudantes na Indonésia tiveram que mudar para o aprendizado online devido à qualidade do ar ruim causada por incêndios florestais e de terras. A indústria marítima também se adapta, com a Maersk assinando um acordo para instalar a primeira vela eólica em um navio porta-contêineres, buscando reduzir o consumo de combustível e atender a regulamentações ambientais mais rigorosas.", "direitos_humanos": "Em Hong Kong, as autoridades estão considerando o uso de testes genéticos para identificar raças de cães de luta, em resposta a preocupações públicas. No entanto, a Agência das Nações Unidas para Refugiados (UNHCR) alerta que 1.476 cidadãos de Myanmar estão em alto risco de sofrerem tortura, maus-tratos e conscrição forçada ao serem repatriados para seu país. Em Nepal, após mais de uma semana das inundações, milhares de crianças ainda não têm acesso a água segura, aumentando o risco de doenças. Em 21 países, um em cinco crianças sofreu exploração sexual e abuso através de tecnologia, com a maioria dos casos ocorrendo em plataformas de mídia social mainstream. Em Israel, dois adolescentes palestinos, ambos de 19 anos, morreram a tiros de forças israelenses e de colonos durante um ataque em terras ocupadas da Cisjordânia. Na China, a jornalista fotográfica Yalda Moaiery foi condenada a 15 anos de prisão pelo governo do Irã por compartilhar imagens das repressões contra os protestos internos com mídias estrangeiras. No Chile, a investigadora Mónica Madariaga realizou uma investigação sobre adotantes e adotados em contextos irregulares durante a ditadura chilena nos anos 80, revelando uma colaboração desconhecida entre a inteligência militar de Chile e Uruguai em 1973. Em Hong Kong, o ativista Joshua Wong admitiu culpa em um segundo caso relacionado à Lei de Segurança Nacional de Pequim, o que pode resultar em uma extensão mínima de três anos ou até mesmo prisão perpétua para sua sentença."}, "resumo_do_dia": {"politica_nacional": [{"id": 141789, "titulo": "Mesmo com avanço de Cury nas pesquisas, adversários evitam partir para o enfrentamento", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/mesmo-com-avanco-de-cury-nas-pesquisas-adversarios-evitam-partir-para-o-enfrentamento.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-03T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury, do partido Avante, tem ganhado espaço nas pesquisas de intenção de voto, surpreendendo os candidatos adversários, que ainda não pretendem intensificar a campanha contra ele.", "titulo_pt": "Mesmo com avanço de Cury nas pesquisas, adversários evitam confronto", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 141988, "titulo": "STJ nega pedido para Alexandre Nardoni e Anna Jatobá serem presos novamente", "url": "https://www.cnnbrasil.com.br/nacional/brasil/stj-nega-pedido-para-alexandre-nardoni-e-anna-jatoba-serem-presos-novamente/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-03T08:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Superior Tribunal de Justiça (STJ) negou um pedido para que Alexandre Nardoni e Anna Jatobá fossem novamente presos. O julgamento que confirmou essa decisão foi realizado por unanimidade no final da noite de quarta-feira (2), e abordou o cumprimento das regras do regime aberto para os condenados pela morte de Isabella Nardoni.", "titulo_pt": "STJ nega pedido para Alexandre Nardoni e Anna Jatobá serem presos novamente", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 142094, "titulo": "Menos jornada, mais CNPJ: a reforma que pune a escola e culpa a pejotização", "url": "https://www.jota.info/opiniao-e-analise/colunas/trabalho-previdencia-empresas/menos-jornada-mais-cnpj-a-reforma-que-pune-a-escola-e-culpa-a-pejotizacao", "fonte_id": "jota", "data_pub": "2026-09-03T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma propõe flexibilidade contratual e previsibilidade de custos para a educação, ao invés de depender de financiamento por meio de mensalidades e slogans constitucionais.", "titulo_pt": "Menos jornada, mais CNPJ: a reforma que pune a escola e culpa a pejotização", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 142095, "titulo": "Fachin precisa pôr ordem na casa", "url": "https://www.jota.info/opiniao-e-analise/artigos/fachin-precisa-por-ordem-na-casa", "fonte_id": "jota", "data_pub": "2026-09-03T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto sugere que a ética aplicada aos subordinados mas não aos superiores é uma forma de hierarquia disfarçada de moral.", "titulo_pt": "Fachin precisa organizar a casa", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 142097, "titulo": "Qual a relação entre emendas orçamentárias e a corrupção?", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-fiscal/qual-a-relacao-entre-emendas-orcamentarias-e-a-corrupcao", "fonte_id": "jota", "data_pub": "2026-09-03T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A relação entre emendas orçamentárias e corrupção não está na estrutura institucional, mas sim no manejo e na fiscalização dos recursos.", "titulo_pt": "Qual é a ligação entre emendas orçamentárias e corrupção?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 142098, "titulo": "O limbo trabalhista-previdenciário face ao STF, STJ e TST", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-limbo-trabalhista-previdenciario-face-ao-stf-stj-e-tst", "fonte_id": "jota", "data_pub": "2026-09-03T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os tribunais superiores têm lidado com a situação de trabalhadores que, após se aposentarem por causa de doenças graves, retornam ao trabalho e têm direito a uma nova contribuição previdenciária, criando uma lacuna legal.", "titulo_pt": "O limbo trabalhista-previdenciário face aos tribunais superiores", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 142004, "titulo": "'É a maior crise do STF': Gonet deveria se afastar do caso Master e Moraes precisa ser investigado, afirma ex-PGR Claudio Fonteles", "url": "https://www.bbc.com/portuguese/articles/cx2zgjg308ko?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-03T07:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-Procurador-Geral da República Claudio Fonteles afirmou que o ministro do STF Paulo Gonet deve se afastar do caso Master e que o ministro André Mendonça precisa ser investigado. Segundo Fonteles, não há justificativa para anular o relatório da Polícia Federal produzido a pedido de Mendonça.", "titulo_pt": "Gonet deve se afastar e Moraes precisa ser investigado, afirma ex-pgr", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 141954, "titulo": "Veja a agenda dos candidatos ao governo de SP nesta quinta (3/9)", "url": "https://www.metropoles.com/sao-paulo/veja-a-agenda-dos-candidatos-ao-governo-de-sp-nesta-quinta-3-9", "fonte_id": "metropoles", "data_pub": "2026-09-03T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Izadora Dias, do PCO, tem agenda mais cheia nesta quinta-feira. Tarcísio e Haddad focam em compromissos no interior do estado.", "titulo_pt": "Veja a agenda dos candidatos ao governo de SP nesta quinta-feira (3/9)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 141956, "titulo": "Lula tenta se distanciar de caso Vorcaro/Moraes e focar agenda positiva", "url": "https://www.metropoles.com/brasil/lula-tenta-se-distanciar-de-caso-vorcaro-moraes-e-focar-em-agenda-positiva", "fonte_id": "metropoles", "data_pub": "2026-09-03T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula tenta se distanciar do caso Vorcaro/Moraes, evitando comentar a crise no STF e focando em entregas do governo e projetos prioritários no Congresso.", "titulo_pt": "Lula tenta se distanciar do caso Vorcaro/Moraes e se concentrar em agenda positiva", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 141805, "titulo": "Superempregados e cargos de confiança poderão trabalhar mais de 40 horas após fim da 6x1; entenda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/superempregados-e-cargos-de-confianca-poderao-trabalhar-mais-de-40-horas-apos-fim-da-6x1-entenda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os superempregados e os trabalhadores em cargos de confiança poderão trabalhar mais do que 40 horas semanais após a aprovação da PEC que termina a escala 6x1, já que esses empregados não estão sujeitos à duração e ao controle de jornada, a menos que haja regra prevista em acordo ou convenção coletiva ou por liberalidade do empregador.", "titulo_pt": "Superempregados e cargos de confiança poderão trabalhar mais de 40 horas após fim da 6x1", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 141812, "titulo": "Alcolumbre frustra governo Lula e deixa fim da 6x1 para depois do 1º turno da eleição", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/alcolumbre-frustra-governo-lula-e-deixa-fim-da-6x1-para-depois-do-1o-turno-da-eleicao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Davi Alcolumbre, deixou para depois do primeiro turno da eleição a conclusão da votação da PEC que acaba com a escala 6x1. O governo Lula tentará convencer Alcolumbre a votar o texto antes do segundo turno da eleição.", "titulo_pt": "Alcolumbre frustra governo Lula e adia votação da pec 6x1 para depois do 1º turno", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 141835, "titulo": "Mendonça vs. Moraes: as reações do Supremo ao Caso Master - O Assunto #1797", "url": "https://g1.globo.com/podcast/o-assunto/noticia/2026/09/03/mendonca-vs-moraes-as-reacoes-do-supremo-ao-caso-master-o-assunto-1797.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-03T03:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta quarta-feira (2), a Corte se reuniu em plenário após André Mendonça pedir o fim do sigilo sobre a investigação da Polícia Federal que envolve Alexandre de Moraes. Os magistrados não discutiram o Caso Master nesta sessão, mas há expectativa de uma decisão colegiada a respeito do pedido de Mendonça.", "titulo_pt": "Mendonça vs. Moraes: Supremo se reúne após pedido para que sigilo seja quebrado sobre investigação", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 141836, "titulo": "Vorcaro diz que proposta de delação se resume a pessoas do 'atual governo', sem citar financiamento de 'Dark Horse' e envolvimento com políticos", "url": "https://g1.globo.com/politica/blog/camila-bomfim/post/2026/09/03/vorcaro-diz-que-proposta-de-delacao-se-resume-a-pessoas-do-atual-governo-sem-citar-financiamento-de-dark-horse-e-envolvimento-com-politicos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-03T03:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O banqueiro Daniel Vorcaro afirmou que sua proposta de delação premiada se refere apenas a pessoas do 'núcleo do atual governo', sem mencionar envolvimentos com políticos ou financiamento do filme 'Dark Horse'.", "titulo_pt": "Vorcaro limita proposta de delação a pessoas do 'governo atual'", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 141837, "titulo": "Eleições 2026: O que faz um deputado federal?", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/03/eleicoes-2026-o-que-faz-um-deputado-federal.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-03T03:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal é eleito para um mandato de quatro anos na Câmara dos Deputados, uma das duas casas do Congresso Nacional. Suas principais funções incluem criar e votar leis federais, fiscalizar o governo federal e participar da definição do Orçamento da União.", "titulo_pt": "O que faz um deputado federal?", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 141838, "titulo": "Cury avança, Lula e Flávio empatam no 2º turno: 10 pontos da nova Quaest", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/03/10-pontos-da-nova-pesquisa-quaest.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-03T03:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A nova pesquisa Quaest, contratada pela Globo e pelo jornal O Globo, mostra que Lula (PT) lidera com 37%, seguido por Flávio Bolsonaro (PL) com 29%, e Augusto Cury (Avante) com 10% na corrida presidencial de 2026. Cury avançou no comparativo com o primeiro turno.", "titulo_pt": "Cury avança, Lula e Flávio empatam no 2º turno: 10 pontos da nova Quaest", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 141839, "titulo": "Quaest, 1º turno: veja intenção de voto por região, gênero, idade, identificação política, cor e religião no cenário sem Pablo Marçal", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/09/03/quaest-1o-turno-segmentos-cenario-2.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-03T03:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest, divulgada em 2 de novembro, indica que Lula (PT) lidera com 37% das intenções de voto no primeiro turno, seguido por Flávio Bolsonaro (PL) com 29%. A pesquisa não inclui o candidato Pablo Marçal (PRTB), que está inelegível.", "titulo_pt": "Quaest, 1º turno: veja intenção de voto por região, gênero, idade, identificação política, cor e religião no cenário sem Pablo Marçal", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 142312, "titulo": "Brazilian justice faces pressure for alleged links to disgraced banker", "url": "https://www.france24.com/en/video/20260903-brazilian-justice-faces-pressure-for-alleged-links-to-disgraced-banker", "fonte_id": "france24", "data_pub": "2026-09-03T09:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz do Supremo Tribunal Federal do Brasil, que condenou o ex-presidente Jair Bolsonaro a 27 anos de prisão por tentativa de golpe, enfrenta pressão para renunciar devido a supostas ligações com um banqueiro descredenciado e possível conflito de interesses. Essa situação ocorre semanas antes das eleições presidenciais, em que o filho de Bolsonaro, Flávio Bolsonaro, é candidato.", "titulo_pt": "Juiz que condenou bolsonaro enfrenta pressão para se retirar", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 142197, "titulo": "Kamala Harris is wading into the midterms. Some Democrats want her to stay out.", "url": "https://www.politico.com/news/2026/09/03/kamala-harris-midterms-democrats-01063010", "fonte_id": "politico", "data_pub": "2026-09-03T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kamala Harris está se envolvendo nas eleições de meios mandatos, mas alguns democratas acreditam que sua imagem é prejudicial para suas campanhas.", "titulo_pt": "Kamala Harris está se envolvendo nas eleições de meios mandatos, mas alguns democratas acreditam que sua imagem é prejudicial", "veiculo": "Politico", "pais": "EUA", "classe": "A"}, {"id": 141868, "titulo": "Trump diz ter “bom relacionamento” com o Brasil", "url": "https://www.poder360.com.br/poder-internacional/trump-diz-ter-bom-relacionamento-com-o-brasil/", "fonte_id": "poder360", "data_pub": "2026-09-03T09:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, declarou ter um bom relacionamento com o Brasil. Trump também afirmou que os países da América do Sul estão se movendo para a direita.", "titulo_pt": "Trump diz ter bom relacionamento com o Brasil", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 142352, "titulo": "Iran warns US of retaliation if Israel storms southern Lebanon ridge", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/iran-warns-us-retaliation-if-israel-storms-southern-lebanon-ridge", "fonte_id": "middle_east_eye", "data_pub": "2026-09-03T09:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Irã advertiu os Estados Unidos que retaliará com força se Israel realizar uma ofensiva em larga escala na Serra Ali al-Taher, no sul do Líbano. A advertência foi transmitida através do Omã em agosto e levou Israel a adiar um ataque ao local estratégico.", "titulo_pt": "Irã ameaça retaliar se Israel atacar região sul do líbano", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 141942, "titulo": "Venezuela assina contratos de petróleo com os EUA; acordo tem incertezas", "url": "https://www.metropoles.com/mundo/venezuela-assina-contratos-de-petroleo-com-os-eua-acordo-tem-incertezas", "fonte_id": "metropoles", "data_pub": "2026-09-03T09:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Venezuela assinou oito novos contratos de petróleo com empresas estrangeiras, mas a presidente interina não confirmou um acordo específico com os Estados Unidos.", "titulo_pt": "Venezuela assina contratos de petróleo com os EUA; acordo tem incertezas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 142289, "titulo": "Putin floats 'chance' at peace with Ukraine as NATO chief warns Russia is becoming 'increasingly reckless'", "url": "https://www.cnbc.com/2026/09/03/putin-peace-russia-ukraine-nato-defense.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-03T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Putin afirmou que ainda existe a possibilidade de paz com a Ucrânia, mas considerou as advertências de Kiev sobre o espaço aéreo russo como 'terrorismo estatal'. O chefe da OTAN advertiu que a Rússia está se tornando 'progressivamente imprudente'.", "titulo_pt": "Putin sugere possibilidade de paz com a Ucrânia enquanto chefe da Otan alerta sobre a crescente imprudência da Rússia", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 141979, "titulo": "Ataques russos danificam prédio de 21 andares na Ucrânia", "url": "https://www.cnnbrasil.com.br/internacional/ataques-russos-danificam-predio-de-21-andares-na-ucrania/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-03T09:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Prédios de 21 andares foram atingidos por ataques russos na Ucrânia. Pelo menos 17 pessoas ficaram feridas.", "titulo_pt": "Ataques russos danificam prédio de 21 andares na Ucrânia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 142278, "titulo": "'Supersized' El Nino could be strongest on record, UN says", "url": "https://www.dw.com/en/supersized-el-nino-could-be-strongest-on-record-un-says/a-78841246?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-03T09:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A atual ocorrência de El Niño poderia se tornar a mais forte desde o início dos registros há 40 anos, de acordo com a ONU. A organização afirma que o fenômeno está sendo 'supersizado' devido às temperaturas excepcionalmente quentes no Oceano Pacífico tropical.", "titulo_pt": "El niño atual pode ser o mais forte da história, avisa a ONU", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 142246, "titulo": "'Beautiful, vibrant' Disney star Carla Jeffery dies at 33", "url": "https://www.bbc.co.uk/news/articles/ceq8r5gjygno?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-03T09:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Carla Jeffery, conhecida por interpretar a cheerleader Bree em dois filmes da Disney Channel, Zombies e suas sequências, faleceu aos 33 anos.", "titulo_pt": "Atriz da Disney Carla Jeffery morre aos 33 anos", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 141963, "titulo": "Renan Santos diz que facção criminosa não é terrorismo e que ‘Trump não quer ajudar’", "url": "https://www.infomoney.com.br/politica/renan-santos-diz-que-faccao-criminosa-nao-e-terrorismo-e-que-trump-nao-quer-ajudar/", "fonte_id": "infomoney", "data_pub": "2026-09-03T09:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renan Santos afirmou que não considera facções criminosas como terrorismo e que o presidente dos Estados Unidos, Donald Trump, não tem interesse em ajudar no combate a elas no Brasil.", "titulo_pt": "Renan Santos diz que facções criminosas não são terrorismo e que ‘Trump não quer ajudar’", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 142328, "titulo": "EU foreign ministers fail to break deadlock over Israel and Ukraine", "url": "https://www.aljazeera.com/news/2026/9/3/eu-foreign-ministers-fail-to-break-deadlock-over-israel-and-ukraine?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-03T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ministros das Relações Externas da União Europeia se reuniram na Irlanda, mas não conseguiram chegar a um acordo sobre a imposição de sanções comerciais a Israel ou sobre o fornecimento de assistência militar à Ucrânia.", "titulo_pt": "Ministros de relações externas da ue falham em quebrar impasse sobre Israel e Ucrânia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 142353, "titulo": "Iran says no one can reopen Strait of Hormuz without its consent", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/iran-says-no-one-can-reopen-strait-hormuz-without-its-consent", "fonte_id": "middle_east_eye", "data_pub": "2026-09-03T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Irã afirmou que ninguém pode reabrir o Estreito de Ormuz sem o seu consentimento. De acordo com Ebrahim Azizi, presidente da Comissão de Segurança Nacional do Parlamento iraniano, o Irã decidirá sobre o passagem de navios pelo estreito.", "titulo_pt": "Irã diz que ninguém pode reabrir estreito de Ormuz sem seu consentimento", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 142383, "titulo": "Death of young Haitian migrant highlights psychological harm of ICE’s ankle monitors", "url": "https://english.elpais.com/usa/2026-09-03/death-of-young-haitian-migrant-highlights-psychological-harm-of-ices-ankle-monitors.html", "fonte_id": "elpais_en", "data_pub": "2026-09-03T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pierre Damas Bel, um estudante de 20 anos, relatou a perseguição que sofreu após ser equipado com o dispositivo por uma agência de imigração. Em seguida, ele se jogou na frente de um caminhão em uma rodovia em Ohio.", "titulo_pt": "Morte do jovem imigrante haitiano ilustra danos psicológicos dos monitores de tornozeleira da ICE", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 142244, "titulo": "Embattled Spanish PM insists there were no prior warnings before Ceuta crisis", "url": "https://www.bbc.co.uk/news/articles/c07lz7rn2mjo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-03T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro espanhol Pedro Sánchez afirma na parlamentar que é absurdo pensar que o governo tinha informações sobre a crise em Ceuta e não agiu. Milhares de pessoas se manifestaram em cidades espanholas em protesto contra a situação.", "titulo_pt": "PM espanhol insiste que não houve avisos antes da crise em Ceuta", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 142057, "titulo": "Bruno Vellas, geriatra: “Una persona de 70 años ya tiene una capacidad intrínseca comparable a la que presentaba alguien de 60 hace dos décadas”", "url": "https://www.lanacion.com.ar/lifestyle/bruno-vellas-geriatra-una-persona-de-70-anos-ya-tiene-una-capacidad-intrinseca-comparable-a-la-que-nid02092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-03T09:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O geriatra francês Bruno Vellas sugere a medição precoce da idade biológica e alerta que a atenção médica deve se voltar mais para a preservação das funções vitais do que para o tratamento de doenças. Ele destaca que uma pessoa de 70 anos hoje tem uma capacidade intrínseca semelhante à de alguém de 60 anos há duas décadas.", "titulo_pt": "Bruno Vellas, geriatra: ‘uma pessoa de 70 anos já possui uma capacidade intrínseca similar à de alguém de 60 anos há duas décadas’", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 142382, "titulo": "Investment banks cool Trump’s optimism: Venezuelan oil will not lower prices", "url": "https://english.elpais.com/economy-and-business/2026-09-03/investment-banks-cool-trumps-optimism-venezuelan-oil-will-not-lower-prices.html", "fonte_id": "elpais_en", "data_pub": "2026-09-03T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A produção de petróleo venezuelano levará anos para ser restaurada, mesmo com um acordo político. A Chevron anunciou que aumentará suas investidas no país.", "titulo_pt": "Bancos de investimento frios com as esperanças de Trump: petróleo venezuelano não baixará preços", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 141975, "titulo": "A Iguá já botou R$ 1 bi para ‘reformar’ a velha Cedae. Os jacarés estão voltando", "url": "https://braziljournal.com/a-igua-ja-botou-r-1-bi-para-reformar-a-velha-cedae-os-jacares-estao-voltando/", "fonte_id": "brazil_journal", "data_pub": "2026-09-03T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa Iguá Saneamento investiu aproximadamente R$ 1 bilhão na reforma da Estação de Tratamento de Esgoto da Barra da Tijuca, que anteriormente pertencia à Cedae. As fotos nas instalações mostram as melhorias feitas após a empresa assumir as operações em 2022.", "titulo_pt": "A Iguá já investiu R$ 1 bi na reforma da Cedae. Os jacarés estão voltando", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 142290, "titulo": "Dutch central bank moves gold bars out of U.S. and Canada, citing ‘crisis preparedness’", "url": "https://www.cnbc.com/2026/09/03/netherlands-gold-transfer-us-canada-uk.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-03T09:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O banco central dos Países Baixos transferiu barras de ouro armazenadas nos Estados Unidos e no Canadá para o Banco da Inglaterra, citando a preparação para crises. O ouro guardado no Banco da Inglaterra é mais fácil de negociar, permitindo sua utilização mais rápida em uma crise severa.", "titulo_pt": "Banco central dos países baixos transfere ouro dos EUA e canadá para o reino unido, em nome da preparação para crises", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 142436, "titulo": "EU, China talk trade as Europe’s deadline for action looms", "url": "https://www.scmp.com/plus/news/china/diplomacy/article/3366242/eu-china-talk-trade-europes-deadline-action-looms?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-03T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oficiais da União Europeia e da China estão em negociações em Beijing antes da prazo de outubro da União Europeia para obter resultados concretos na tentativa de reduzir um déficit comercial que chega a €1 bilhão por dia. Denis Redonnet, o principal negociador comercial da UE, está liderando a delegação europeia.", "titulo_pt": "Europa e China discutem comércio antes do prazo de outubro", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 142261, "titulo": "Markets can't ignore the war anymore", "url": "https://www.axios.com/2026/09/03/oil-bonds-stocks-iran", "fonte_id": "axios", "data_pub": "2026-09-03T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços do petróleo estão voltando para cerca de US$100 por barril, e o futuro do diesel atingiu um novo recorde. Isso indica que os investidores estão começando a reconhecer que os aumentos de preços do petróleo causados pela guerra no Irã não podem ser ignorados mais. O aumento dos preços da energia está se espalhando pela economia, elevando custos para empresas, pessoas comuns e até governos em todo o mundo, que agora enfrentam taxas de juros mais altas.", "titulo_pt": "Mercados não podem ignorar mais a guerra no Irã", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 142392, "titulo": "Hongkong Land eyes billion-dollar property deals in Japan", "url": "https://www.japantimes.co.jp/business/2026/09/03/companies/hong-kong-japan-property-deals/", "fonte_id": "japan_times", "data_pub": "2026-09-03T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Hongkong Land está buscando negócios imobiliários de alto valor na região de Tóquio, com foco em complexos mistos de uso, que incluem espaços de escritórios de alto nível, comércio varejista e serviços hoteleiros em locais estratégicos.", "titulo_pt": "Hongkong Land almeja bilionárias transações imobiliárias no Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 141804, "titulo": "Brasil pode aproveitar 'powershoring' com energia limpa para atrair empresas, diz estudo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/brasil-pode-aproveitar-powershoring-com-energia-limpa-para-atrair-empresas-diz-estudo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo sugere que o Brasil pode beneficiar-se do 'powershoring' com energia limpa para atrair empresas. O economista Bernard Appy, que percorreu comitês de campanha e grupos da sociedade civil em 2018, discutiu o tema da reforma tributária.", "titulo_pt": "Brasil pode aproveitar 'powershoring' com energia limpa para atrair empresas, diz estudo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 142391, "titulo": "Yen jumps as traders bet on Japan interest rate rises", "url": "https://www.ft.com/content/22abbb77-1344-4871-9692-97a779b1ba77?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-03T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O iene subiu rapidamente, ultrapassando o nível de ¥157 para o dólar, após uma elevação repentina durante a noite.", "titulo_pt": "Iene salta com apostas sobre elevação das taxas de juros no Japão", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 142099, "titulo": "Distribuidoras no varejo de energia: separar, vedar ou limitar?", "url": "https://www.jota.info/opiniao-e-analise/artigos/distribuidoras-no-varejo-de-energia-separar-vedar-ou-limitar", "fonte_id": "jota", "data_pub": "2026-09-03T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A concentração das coligadas nas áreas de concessão está testando as regras propostas pela Aneel para o varejo de energia. O texto questiona como as distribuidoras devem ser reguladas nesse mercado.", "titulo_pt": "Distribuidoras no varejo de energia: separar, vedar ou limitar?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 141809, "titulo": "As melhores, piores e mais estranhas formas de usar IA no trabalho", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/09/as-melhores-piores-e-mais-estranhas-formas-de-usar-ia-no-trabalho.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Consultores, advogados, banqueiros e outros profissionais relatam como as ferramentas de IA estão alterando suas rotinas de trabalho. O artigo explora as melhores, piores e mais estranhas formas de uso de IA no ambiente corporativo.", "titulo_pt": "As melhores, piores e mais estranhas formas de usar IA no trabalho", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 142556, "titulo": "Labor ministry's new guidelines exclude profit-linked bonus demands from mandatory bargaining", "url": "https://en.yna.co.kr/view/AEN20260903007600315", "fonte_id": "yonhap_news", "data_pub": "2026-09-03T06:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério do Trabalho lançou novas diretrizes que excluem as demandas relacionadas a bônus ligados aos lucros do processo de negociação coletiva obrigatória.", "titulo_pt": "Novas diretrizes do ministério do trabalho excluem demandas de bônus ligados aos lucros do processo de negociação coletiva", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 141920, "titulo": "US$ 40 trilhões: por que a maior dívida dos EUA não virou tema político", "url": "https://exame.com/mundo/us-40-trilhoes-por-que-a-maior-divida-dos-eua-nao-virou-tema-politico/", "fonte_id": "exame", "data_pub": "2026-09-03T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A dívida dos EUA é equivalente a US$ 117 mil por habitante, uma cifra significativa, mas que não está sendo debatida politicamente.", "titulo_pt": "40 Trilhões de dólares: por que a maior dívida dos EUA não é tema político", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 141926, "titulo": "PMIs globais, emprego e balança comercial dos EUA: o que move os mercados", "url": "https://exame.com/invest/mercados/pmis-globais-emprego-e-balanca-comercial-dos-eua-o-que-move-os-mercados/", "fonte_id": "exame", "data_pub": "2026-09-03T05:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Foram programadas para esta quinta-feira, 3, as divulgações de pesquisas sobre a sucessão presidencial, além da agenda econômica, incluindo PMIs globais, emprego e balança comercial dos EUA.", "titulo_pt": "Pmis globais, emprego e balança comercial dos EUA, e pesquisas sobre sucessão presidencial: o que move os mercados", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 142406, "titulo": "Yen stages dramatic rally, and Japanese bonds strengthen", "url": "https://www.japantimes.co.jp/business/2026/09/03/markets/yen-market-rally/", "fonte_id": "japan_times", "data_pub": "2026-09-03T04:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O iene está experimentando uma forte recuperação, atingindo cerca de 157 ienes por dólar pela primeira vez desde agosto. Os títulos do Japão também têm fortalecido.", "titulo_pt": "Iene e títulos do Japão fortalecem", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 142294, "titulo": "China's slowdown pushes New Zealand exporters to diversify away from their top buyer, RBNZ official tells CNBC", "url": "https://www.cnbc.com/2026/09/03/china-new-zealand-dairy-agriculture-exports-slowdown-rbnz.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-03T04:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Exportadores neozelandeses estão direcionando suas remessas para mercados alternativos devido ao enfraquecimento da demanda da China, principal comprador do país, conforme informou um oficial do Banco Central da Nova Zelândia à CNBC.", "titulo_pt": "Abaixamento da china impulsiona exportadores neozelandeses a diversificar mercados", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 142385, "titulo": "KPMG warned Guggenheim unit over deficiencies in internal controls", "url": "https://www.ft.com/content/70e8e4e6-def9-4683-9aa3-4bf7351474e4?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-03T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A KPMG, uma das quatro grandes auditoras, alertou uma unidade da Guggenheim sobre falhas nos controles internos. A auditoria apontou problemas no modo como a divisão de investimentos privados da Guggenheim registrou receitas.", "titulo_pt": "KPMG avisa unidade da Guggenheim sobre falhas nos controles internos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 142386, "titulo": "Europe’s seven fantasy M&A deals", "url": "https://www.ft.com/content/d4e5956a-200c-47d1-9241-f15f495c2cf2?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-03T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sete supostas fusões e aquisições que poderiam ajudar o setor corporativo da Europa a competir com os Estados Unidos e China, mas que dependem da aprovação de reguladores, políticos e do público.", "titulo_pt": "Sete sonhos de fusões e aquisições na Europa", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 142093, "titulo": "Planos de big techs ao TSE citam rótulos para IA e meios para evitar recomendação de voto", "url": "https://www.jota.info/eleicoes/eleicoes-2026/planos-de-big-techs-ao-tse-citam-rotulos-para-ia-e-meios-para-evitar-recomendacao-de-voto", "fonte_id": "jota", "data_pub": "2026-09-03T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Onze plataformas digitais enviaram documentos à Justiça Eleitoral para as eleições de 2026, detalhando planos relacionados à inteligência artificial e estratégias para evitar a recomendação de voto por parte das tecnológicas.", "titulo_pt": "Planos das big techs ao TSE envolvem IA e meios para evitar recomendação de voto", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 142259, "titulo": "Altman raises stakes on government scrutiny as AI advances", "url": "https://www.axios.com/2026/09/03/altman-government-scrutiny-ai-g20", "fonte_id": "axios", "data_pub": "2026-09-03T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sam Altman, CEO da OpenAI, considerou o processo voluntário de revisão do governo americano para o modelo Astra 'produtivo' e afirmou que uma maior interação com autoridades governamentais será mais importante à medida que as capacidades de inteligência artificial avançarem. A OpenAI está prestes a lançar o Astra, o primeiro modelo classificado como 'crítico' em termos de segurança cibernética, que exige medidas de proteção mais robustas durante o desenvolvimento e antes do lançamento.", "titulo_pt": "Altman aumenta a vigilância governamental à medida que a IA avança", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 142260, "titulo": "Brain implants fuel U.S.-China bioscience rivalry", "url": "https://www.axios.com/2026/09/03/brain-implants-elon-musk-neuralink-china-us", "fonte_id": "axios", "data_pub": "2026-09-03T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Implantes cerebrais, como os desenvolvidos pela Neuralink de Elon Musk, estão se tornando o último ponto de fricção na intensificada rivalidade entre os Estados Unidos e China na biociência. O avanço dessas tecnologias está sendo acompanhado por investimentos bilionários de bilionários da tecnologia, mas há preocupações de que o desenvolvimento dos Estados Unidos esteja sendo superado pela abordagem mais agressiva da China em áreas como fabricação, dados e comercialização.", "titulo_pt": "Implantes cerebrais alimentam a rivalidade entre EUA e China na biociência", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 142510, "titulo": "Smart Toilets Are Already Using AI to Analyze Your Poop", "url": "https://www.wired.com/story/smart-toilets-using-ai-to-analyze-your-poop/", "fonte_id": "wired", "data_pub": "2026-09-03T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas prometem que os banheiros inteligentes podem ajudar a monitorar a saúde intestinal, mas especialistas sugerem que esses dispositivos oferecem poucos benefícios para a maioria das pessoas.", "titulo_pt": "Banheiros inteligentes já estão usando IA para analisar suas fezes", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 142521, "titulo": "Nearly 40 mln Tving accounts compromised in massive data breach: probe", "url": "https://www.koreaherald.com/article/10862171", "fonte_id": "korea_herald", "data_pub": "2026-09-03T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um levantamento conjunto revelou que quase 40 milhões de contas de usuários da plataforma sul-coreana de streaming Tving foram comprometidas em um enorme vazamento de dados decorrente de um incidente de hacking relatado em junho. O Ministério da Ciência e Tecnologia da Informação e Comunicações (ICT) anunciou os resultados de uma investigação de três meses envolvendo o governo e a iniciativa privada sobre o incidente no Tving, operado pela gigante do entretenimento CJ ENM Co.", "titulo_pt": "Quase 40 milhões de contas do Tving comprometidas em grande vazamento de dados", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 142522, "titulo": "Samsung narrows gap with SK hynix in HBM market in Q2", "url": "https://www.koreaherald.com/article/10862170", "fonte_id": "korea_herald", "data_pub": "2026-09-03T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samsung reduziu a diferença em relação à líder SK hynix no mercado global de chips de memória de alta largura de banda (HBM) no segundo trimestre. Embora SK hynix tenha mantido o primeiro lugar com 50% de market share, sua participação caiu 8 pontos percentuais em comparação com o trimestre anterior.", "titulo_pt": "Samsung reduz gap com SK hynix no mercado de HBM no segundo trimestre", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 142393, "titulo": "Japan sees fewer IPOs as Iran war, AI shock and rate anxiety slow tech listings", "url": "https://www.japantimes.co.jp/business/2026/09/03/markets/ipo-japan-slowdown/", "fonte_id": "japan_times", "data_pub": "2026-09-03T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No primeiro semestre do ano, 17 empresas realizaram IPOs nas seções Prime, Growth e Standard da Tokyo Stock Exchange, uma diminuição de aproximadamente 30% em comparação com o mesmo período do ano anterior. O número reduzido de IPOs está relacionado à guerra com o Irã, ao choque do AI e à preocupação com as taxas de juros.", "titulo_pt": "Japão registra menos IPOs devido à guerra com o Irã, choque do AI e preocupação com as taxas de juros", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 142511, "titulo": "Face Recognition Is Becoming the Norm for Dating Apps", "url": "https://www.wired.com/story/face-recognition-is-becoming-the-norm-for-dating-apps/", "fonte_id": "wired", "data_pub": "2026-09-03T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apps de relacionamento estão adotando ferramentas de reconhecimento facial e selos 'verificado humano' para combater fraudes. Essas medidas estão levantando preocupações sobre vigilância e privacidade.", "titulo_pt": "Reconhecimento facial se torna comum em Apps de casamenteiro", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 142523, "titulo": "Posco opens hundreds of entry-level jobs in AI push", "url": "https://www.koreaherald.com/article/10862148", "fonte_id": "korea_herald", "data_pub": "2026-09-03T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Posco Group está contratando centenas de funcionários de nível básico em seis afiliadas e unidades de pesquisa, com foco em talentos de Inteligência Artificial e robótica para automatizar operações e criar novos motores de crescimento. As vagas abrangem cerca de 60 cargos em áreas como produção, vendas, segurança e tecnologia avançada.", "titulo_pt": "Posco abre centenas de vagas de nível básico com foco em IA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 142336, "titulo": "OpenAI’s Sam Altman tells G20 AI will be as essential as electricity", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/3/openais-sam-altman-tells-g20-ai-will-be-as-essential-as-electricity?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-03T08:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sam Altman, CEO da OpenAI, afirmou que a inteligência artificial será tão essencial quanto a eletricidade no futuro. Ele também disse que crianças crescendo atualmente nunca serão mais inteligentes que a IA.", "titulo_pt": "Sam Altman diz que a IA será tão essencial quanto a eletricidade", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 141997, "titulo": "Metade dos universitários brasileiros não se sente pronta para lidar com IA", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/metade-dos-universitarios-brasileiros-nao-se-sente-pronta-para-lidar-com-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-03T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que apenas 52% dos universitários brasileiros se sentem preparados para enfrentar um mercado que depende fortemente de inteligência artificial. O estudo sugere uma desproporção entre a percepção dos estudantes e a relevância crescente da IA no ambiente de trabalho.", "titulo_pt": "Metade dos universitários brasileiros não se sente preparada para lidar com IA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 142442, "titulo": "Tech race flashpoint: Huang, Musk push back on AI guard rails amid heated US-China rivalry", "url": "https://www.scmp.com/tech/big-tech/article/3366216/tech-race-flashpoint-huang-musk-push-back-ai-guard-rails-amid-heated-us-china-rivalry?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-03T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nvidia CEO Jensen Huang e o empresário Elon Musk pressionam potências globais a não estabelecer regulamentações rígidas para a IA, alegando que isso poderia sufocar a inovação. Eles defendem a adoção de regulamentos focados em danos práticos e reais durante uma reunião do G20 em Chapel Hill, Carolina do Norte.", "titulo_pt": "Tech race flashpoint: huang e Musk questionam regulamentações de IA em meio à intensificada rivalidade entre EUA e china", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 141808, "titulo": "Fim da escala 6x1 exigirá adaptação em setores que funcionam sem pausa; veja impactos por profissão", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/fim-da-escala-6x1-exigira-adaptacao-em-setores-que-funcionam-sem-pausa-veja-impactos-por-profissao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-03T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A PEC que propõe o fim da escala 6x1 e a criação da escala 5x2 pode reduzir a jornada de trabalho de 44 para 42 horas semanais, exigindo adaptação em diversos setores. O relatório da PEC foi aprovado na CCJ do Senado.", "titulo_pt": "Fim da escala 6x1 exigirá adaptação em setores; veja impactos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 141923, "titulo": "86% das empresas vão acelerar o uso de IA até 2030, segundo o Fórum Econômico Mundial", "url": "https://exame.com/inteligencia-artificial/86-das-empresas-vao-acelerar-o-uso-de-ia-ate-2030-segundo-o-forum-economico-mundial/", "fonte_id": "exame", "data_pub": "2026-09-03T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Fórum Econômico Mundial prevê que 86% das empresas acelerarão o uso de inteligência artificial até 2030. No Brasil, as finanças e os eletrônicos são setores mais expostos à tecnologia e as empresas já projetam mudanças nas funções e habilidades dos profissionais.", "titulo_pt": "86% Das empresas vão acelerar o uso de IA até 2030, de acordo com o Fórum Econômico Mundial", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 142512, "titulo": "The 2026 El Niño Is Being ‘Supersized’ as Impacts Worsen", "url": "https://www.wired.com/story/2026-supersized-el-nino-impacts-worsen/", "fonte_id": "wired", "data_pub": "2026-09-03T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Organização Meteorológica Mundial alerta que a fenômeno climático que está aquecendo o Pacífico durará pelo menos até fevereiro, com graves consequências para o clima global. O El Niño está sendo 'supersizado' e os impactos estão a se agravar.", "titulo_pt": "O El Niño de 2026 está sendo 'supersizado' com impactos agravados", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 141927, "titulo": "MrBeast fecha parceria com Google para usar IA do Gemini em vídeos", "url": "https://exame.com/tecnologia/mrbeast-fecha-parceria-com-google-para-usar-ia-do-gemini-em-videos/", "fonte_id": "exame", "data_pub": "2026-09-03T05:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "MrBeast, o maior youtuber do mundo, fechou uma parceria de vários anos com a Google para usar a inteligência artificial do Gemini em seus vídeos. O primeiro vídeo dessa parceria estreia em 5 de setembro, incluindo desafios de sobrevivência extrema e integração com o Fitbit.", "titulo_pt": "Mrbeast fecha parceria com Google para usar IA em vídeos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 142560, "titulo": "Farming experts tout 'conscious' food systems to fix agriculture woes", "url": "https://phys.org/news/2026-09-farming-experts-tout-conscious-food.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos em agricultura estão promovendo sistemas de alimentos conscientes como uma solução para os problemas enfrentados pelos agricultores em todo o mundo, que incluem o impacto do clima, pressões financeiras e solo degradado. Esses sistemas visam aproximar os consumidores dos produtores de alimentos.", "titulo_pt": "Expertos em agricultura defendem 'sistemas conscientes' de alimentos para resolver problemas agrícolas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 141821, "titulo": "Startup diz ter gerado cães incapazes de gerar reações alérgicas em humanos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/startup-diz-ter-gerado-caes-incapazes-de-gerar-reacoes-alergicas-em-humanos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-03T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma startup afirmou ter criado cães incapazes de causar reações alérgicas em humanos. Essa é a primeira vez que tal tecnologia é anunciada publicamente, representando um avanço potencial para pessoas alérgicas a cães.", "titulo_pt": "Startup afirma ter criado cães incapazes de causar reações alérgicas em humanos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 142561, "titulo": "Electron spin unlocks magnetic control of hydrogen surface reactions", "url": "https://phys.org/news/2026-09-electron-magnetic-hydrogen-surface-reactions.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostram que o spin eletrônico, uma propriedade fundamental da matéria, influencia as reações químicas na superfície de materiais, além das já conhecidas influências das movimentações translacionais, vibracionais e rotacionais de átomos e moléculas.", "titulo_pt": "O spin eletrônico controla as reações químicas na superfície do hidrogênio", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 142562, "titulo": "Heavy water's atmospheric fingerprints boost weather forecasts for up to five days", "url": "https://phys.org/news/2026-09-heavy-atmospheric-fingerprints-boost-weather.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores, incluindo aqueles da Universidade de Tóquio, demonstraram pela primeira vez que a inclusão de dados sobre ísoptos d'água na atmosfera nas previsões meteorológicas pode melhorar as previsões de condições atmosféricas até cinco dias, incluindo previsões de precipitação intensa em várias regiões.", "titulo_pt": "Ísoptos de água na atmosfera aprimoram previsões meteorológicas até cinco dias", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 142563, "titulo": "AI boom is testing tech firms' climate pledges", "url": "https://phys.org/news/2026-09-ai-boom-tech-firms-climate.html", "fonte_id": "phys_org", "data_pub": "2026-09-03T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pe
