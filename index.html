<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "11/11/2026 07:29", "stats": {"noticias_novas": 824, "resumos_gerados": 249}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva está buscando reforçar a representação mineira no governo após o deputado Janones expressar preferência por continuar na Câmara dos Deputados. Isso faz com que Lula reavalie a distribuição de cargos para Minas Gerais. Paralelamente, o presidente Lula tenta recontratar ministros para o Senado durante o atual mandato, visando contrabalançar a influência do Partido Liberal (PL). O PL teme dissidências na eleição do Senado, e uma ala defende a indicação de Tereza. O BNDES manteve o selo diamante do Radar Nacional de Transparência Pública pelo quarto ano consecutivo, obtendo nota máxima pela primeira vez. Além disso, o número de obras do PAC paralisadas no governo federal diminuiu após a Casa Civil questionar a metodologia do TCU para classificar empreendimentos como interrompidos. Durante a COP31 na Turquia, o presidente Lula destacou a redução do desmatamento no Brasil e o papel do agronegócio no crescimento econômico. Durante sua viagem, o Brasil também se opôs ao tarifaço americano.", "mundo": "Nayib Bukele, presidente de El Salvador, anunciou que tropas salvadenses destruíram o quartel-general de uma gangue poderosa em Haiti, após quatro soldados desaparecerem no país em outubro. Este incidente ocorre enquanto os Estados Unidos pressionam o secretário de Defesa, Kenneth Hegseth, que enfrentou um esforço de impeachment liderado pelos republicanos na Câmara dos Representantes, que foi bloqueado. O presidente ucraniano, Volodymyr Zelenskyy, expressou satisfação com a mudança no discurso dos mediadores americanos durante negociações trilaterais com a Rússia e Estados Unidos em Abu Dhabi. No entanto, a Coreia do Sul e a Indonésia discutiram a possibilidade de diversificar a cooperação na indústria de defesa, enquanto a Coreia do Norte republicou sua constituição integral em um site de propaganda. Estes últimos eventos parecem menos relevantes em um contexto global do que os outros mencionados.\n\nOs Estados Unidos, sob a liderança de Donald Trump, enfrentam desafios geopolíticos em várias frentes. Em primeiro lugar, as negociações de paz entre Rússia, Ucrânia e EUA em Abu Dhabi continuam, apesar de poucos avanços significativos. Em segundo, a Coreia do Norte continua a ser um foco de atenção, com Trump anunciando uma redução de exercícios militares conjuntos com a Coreia do Sul, justificando a decisão como resultado de uma boa relação com Kim Jong Un. Além disso, a tensão aumenta no espaço aéreo báltico, com drones ucranianos registrados, levando à preocupação de uma possível expansão do conflito para a Europa Oriental. Em relação ao Irã, o país continua a produzir mísseis, apesar das dificuldades industriais, e as tensões diplomáticas aumentam, com o Irã designando a marinha e a força aérea da Argentina como organizações terroristas em resposta à blacklistagem da Guarda Revolucionária iraniana pelo país latino-americano. Outras questões incluem a evolução de Hong Kong em um hub offshore do quadro financeiro estritamente controlado pelo Beijing, e a crescente preocupação com roubos de criptomoedas e suas implicações de segurança global.", "economia": "O Ibovespa registrou uma queda de 0,52% nesta terça-feira (10/10/2026), influenciado pela inflação nos Estados Unidos e pela ata do Copom, que mostrou uma postura cautelosa do Banco Central brasileiro em resposta à situação inflacionária. O dólar comercial encerrou o pregão cotado a R$ 5,58, o maior fechamento desde 2026. O governo Lula sinalizou ao mercado a possibilidade de cancelar até R$ 12,8 bilhões em gastos no Orçamento de 2027 para atingir a meta fiscal. A Petrobras registrou um lucro líquido de R$ 39,783 bilhões no terceiro trimestre de 2026, um aumento de 21,5% em comparação com o mesmo período de 2025, influenciado pela alta das cotações internacionais do petróleo e pelo recorde de produção de petróleo. A Votorantim está vendendo sua participação na Acerbrag, uma siderúrgica argentina de aços longos, para o Grupo Simec, de México, em uma transação que visa explorar oportunidades de exportação de aços para o mercado brasileiro.", "tecnologia": "A Nvidia, gigante da indústria de inteligência artificial, enfrenta uma queda significativa em seu valor de mercado após um escândalo envolvendo seu CEO, Jensen Huang. Dois pregões após o incidente, a empresa já perdeu mais de 470 bilhões de dólares. Em contraste, a Coreia do Sul vê uma oportunidade de ouro em torno da inteligência artificial após os midterms dos EUA. A Coreia do Sul comprometeu-se a contribuir com 20 milhões de dólares para um fundo do Banco Asiático de Desenvolvimento (BAD), dedicado a projetos de inteligência artificial. Além disso, a Posco e o GS Group uniram-se para explorar a crescente demanda por centrais de dados de inteligência artificial, combinando os produtos de aço especializados da Posco com as capacidades de construção, energia e resfriamento do GS Group, visando projetos no Brasil e no exterior.", "ciencia": "Um novo par de quasares compactos foi descoberto, datando de apenas 900 milhões de anos após o Big Bang, desafiando a compreensão da formação de buracos negros. Este encontro celestial, descrito em um estudo publicado na revista Astronomy & Astrophysics, apresenta um mistério teórico, pois não há explicações adequadas para como esses buracos negros ativos cresceram a um tamanho tão grande tão cedo na história do universo. Em outro desenvolvimento na área de saúde, um aplicativo de saúde mental chamado DRIVEN, desenvolvido pela Northwestern University, sugeriu que pode auxiliar os desempregados a encontrar emprego, combinando exercícios mentais e estratégias de busca de emprego. Além disso, um estudo publicado na revista Biology Letters revelou que a genética desempenha um papel crucial na migração de gaivotas de Cory, com a descendência genética sendo mais importante do que o ambiente social na colônia de reprodução.", "cultura": "O Papa Francisco visitará o Complexo Penitenciário Federal em Palermo, onde conversará com os detentos, antes de viajar para o Peru. Em uma interação carinhosa, o Papa pediu aos fiéis que se aproximaram à noite para o cumprimentar na Nunciatura que o deixassem descansar, fazendo sorrir um guarda. Na Argentina, a Igreja Universal do Reino de Deus está reduzindo sua presença na programação matinal de TV aberta em 20% para melhorar a captação de fiéis e otimizar os custos. No âmbito da cultura, o documentário 'Nazá', que detalha a vigilância israelense de civis palestinos em Gaza, foi visto por mais de 1,5 milhão de pessoas em menos de dois meses. O livro 'Com Wittgenstein em uma Sauna Gay' explora subculturas LGBTQ+ em cidades da Europa Central, desafiando estereótipos regionais e inspirando uma exposição de arte sobre masculinidade.", "sociedade": "O Brasil enfrenta diversos desafios sociais e econômicos, destacando-se o aumento da população idosa e a necessidade de adaptação da Previdência e do mercado de trabalho, conforme aponta um artigo do BBC Brasil. Em São Paulo, o programa Minha Casa, Minha Vida responde por 70% das vendas de imóveis, refletindo a crescente demanda por habitação. Além disso, notícias sobre violência e injustiça social também são publicadas, como o caso de um policial civil que disparou tiros durante uma discussão, resultando em ferimentos a quatro motoboys em Minas Gerais. Em São Paulo, a justiça negou um pedido de ONGs para proibir a venda de animais em plataformas online, mantendo a legalidade do comércio, apesar das preocupações com maus tratos.", "meio_ambiente": "Um surto de doença de Chagas, causado por vinho de patauá contaminado, afetou um município no Pará, com oito casos confirmados e 27 pessoas monitoradas. Um óbito foi registrado. Paralelamente, líderes mundiais se reúnem na COP31 em Belém, Brasil, buscando avanços em ações climáticas. O Brasil apresentou controles ambientais para manter suas exportações na Europa e anunciou investimentos no setor de energia. O evento, potencialmente o maior da história, reúne mais de 92.000 participantes, mas a ausência de líderes das maiores economias desenvolvidas é um ponto negativo. O Japão usa a COP31 para promover tecnologias ambientais, enquanto a Alemanha investe 15 milhões de euros na proteção de terras indígenas no Brasil. Além disso, o conflito no Irã contribui para uma redução nas emissões de carbono, mas há preocupações sobre a reintrodução de jaguatiricais na natureza e a falta de efetividade no tratamento de água em rios do Rio Grande do Sul.", "direitos_humanos": "O tribunal mais alto da Trinidad e Tobago derrubou uma lei colonial que proibia relações sexuais entre pessoas do mesmo sexo, considerando que ela violava direitos fundamentais à privacidade e liberdade individual, em uma vitória significativa para os direitos da comunidade LGBTQ+ na região do Caribe. Em outro desenvolvimento, o gabinete presidencial coreano realizou uma reunião para discutir a proteção dos direitos dos adotados coreanos no exterior. Além disso, a diretora executiva do UNICEF, Catherine Russell, fez uma declaração durante o Summit das Crianças no Paris Peace Forum. A entidade da ONU responsável pelos direitos humanos adiou a revisão regular do registro de direitos humanos dos EUA para janeiro, esperando convencer o governo Trump a participar. A situação dos direitos humanos na Coreia do Norte também foi abordada, com Human Rights Watch pedindo ao Conselho de Segurança das Nações Unidas que aborde a situação dos direitos humanos na Coreia do Norte junto com questões de segurança."}, "resumo_do_dia": {"politica_nacional": [{"id": 256238, "titulo": "Eleição mostra importância de projeto de IA tratar de transparência algorítmica, diz chefe da Sedigi", "url": "https://www.jota.info/executivo/eleicao-mostra-importancia-de-projeto-de-ia-tratar-de-transparencia-algoritmica-diz-chefe-da-sedigi", "fonte_id": "jota", "data_pub": "2026-11-11T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Victor Fernandes, chefe da Sedigi, enfatiza a importância de um projeto de IA para tratar de transparência algorítmica. Além disso, ele afirma que o projeto de mercados digitais está bem desenhado.", "titulo_pt": "Eleição destaca a necessidade de projeto de IA para transparência algorítmica, diz chefe da Sedigi", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 256022, "titulo": "Como provável decisão de Janones faz Lula recalcular o espaço de Minas Gerais no governo", "url": "https://veja.abril.com.br/politica/como-provavel-decisao-de-janones-faz-lula-recalcular-o-espaco-de-minas-gerais-no-governo/", "fonte_id": "veja", "data_pub": "2026-11-11T09:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente está buscando reforçar a representação mineira no governo após o deputado Janones indicar preferência por continuar na Câmara dos Deputados. Isso faz com que Lula recalcule o espaço de Minas Gerais no governo.", "titulo_pt": "Como provável decisão de Janones faz Lula recalcular o espaço de Minas Gerais no governo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 256025, "titulo": "A reunião decisiva do PL sobre composição com Motta em eleição do comando da Câmara", "url": "https://veja.abril.com.br/politica/a-reuniao-decisiva-do-pl-sobre-composicao-com-motta-em-eleicao-do-comando-da-camara/", "fonte_id": "veja", "data_pub": "2026-11-11T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sóstenes Cavalcante afirmou que dois terços da bancada do PL preferem não se aliar ao presidente da Câmara em uma disputa interna. A reunião do partido sobre a composição com Motta ocorreu para discutir esse cenário.", "titulo_pt": "Reunião decisiva do PL sobre composição com Motta em eleição do comando da Câmara", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 255984, "titulo": "BNDES recebe selo máximo em programa de transparência", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/bndes-recebe-selo-maximo-em-programa-de-transparencia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-11T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O BNDES recebeu o selo diamante do Radar Nacional de Transparência Pública pelo quarto ano consecutivo, obtendo nota máxima pela primeira vez.", "titulo_pt": "BNDES recebe selo máximo em programa de transparência", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 256092, "titulo": "Petistas apostam que Tarcísio lançará \"supersecretária\" à Prefeitura de SP", "url": "https://www.metropoles.com/colunas/igor-gadelha/petistas-apostam-que-tarcisio-lancara-supersecretaria-a-prefeitura-de-sp", "fonte_id": "metropoles", "data_pub": "2026-11-11T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Petistas acreditam que Tarcísio está trabalhando para lançar Natália Resende como candidata à prefeitura de São Paulo em 2028.", "titulo_pt": "Petistas apostam que Tarcísio lançará 'supersecretária' à Prefeitura de SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 256094, "titulo": "PL teme dissidências na eleição do Senado, e ala defende apostar em Tereza", "url": "https://www.metropoles.com/brasil/pl-teme-dissidencias-na-eleicao-do-senado-e-ala-defende-apostar-em-tereza", "fonte_id": "metropoles", "data_pub": "2026-11-11T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido teme dissidências na eleição do Senado e uma ala defende apostar em Tereza. Um grupo considera que um acordo antes da eleição pode garantir ao partido espaço na distribuição de cargos, mesmo sem vencer a disputa.", "titulo_pt": "PL teme dissidências na eleição do Senado e ala defende Tereza", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 256095, "titulo": "Triplex nunca foi de Lula", "url": "https://www.metropoles.com/blog-do-noblat/triplex-nunca-foi-de-lula", "fonte_id": "metropoles", "data_pub": "2026-11-11T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça Federal confirmou que o triplex não pertence a Lula e é propriedade da OAS.", "titulo_pt": "Triplex nunca foi de Lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 256096, "titulo": "Mirando Porto de Santos, homem mais rico da Filipinas oferece jantar a Lula", "url": "https://www.metropoles.com/mundo/mirando-porto-de-santos-homem-mais-rico-da-filipinas-oferece-jantar-a-lula", "fonte_id": "metropoles", "data_pub": "2026-11-11T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Enrique Razon Jr., magnata filipino-portuário, ofereceu um jantar com empresários nas Filipinas e convidou o presidente Lula para participar.", "titulo_pt": "Enrique razon jr., mais rico das Filipinas, oferece jantar a Lula em Santos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 256139, "titulo": "Manutenção fiscal pode prejudicar governabilidade de Lula, diz economista", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/manutencao-fiscal-pode-prejudicar-governabilidade-de-lula-diz-economista/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T07:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um economista afirmou que manter a política fiscal atual pode comprometer a governabilidade do governo Lula. Zeina Latif, da Gibraltar Consulting, deu essa opinião ao World Wide.", "titulo_pt": "Manutenção fiscal pode prejudicar governabilidade de Lula, diz economista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 256140, "titulo": "Tarcísio é pressionado a intervir em disputa que racha PL na Alesp", "url": "https://www.cnnbrasil.com.br/politica/tarcisio-e-pressionado-a-intervir-em-disputa-que-racha-pl-na-alesp/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tarcísio está sendo pressionado a intervir em uma disputa interna no Partido Liberal (PL) na Assembleia Legislativa de São Paulo (Alesp). Movimentos realizados por André do Prado para apoiar um sucessor geraram desconforto entre os parlamentares do partido.", "titulo_pt": "Tarcísio é pressionado a intervir em disputa que racha PL na Alesp", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 256141, "titulo": "Lula quer ministros de volta ao Senado já para conter força do PL", "url": "https://www.cnnbrasil.com.br/politica/lula-quer-ministros-de-volta-ao-senado-ja-para-conter-forca-do-pl/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T07:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Luiz Inácio Lula da Silva busca a retomada de ministros para o Senado durante o atual mandato para contrabalançar a influência do Partido Liberal (PL). Wellington Dias, Renan Filho e Rui Costa podem retornar à Casa Alta.", "titulo_pt": "Lula quer ministros de volta ao Senado para contrabalançar força do PL", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 256142, "titulo": "Alas do PT disputam 7 ministérios de Lula 4 enquanto Centrão negocia cargos", "url": "https://www.cnnbrasil.com.br/politica/alas-do-pt-disputam-7-ministerios-de-lula-4-enquanto-centrao-negocia-cargos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T07:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido dos Trabalhadores (PT) busca controlar sete ministérios no novo governo de Lula. O Centrão, por outro lado, está negociando cargos políticos. As pastas alvo do PT têm forte visibilidade, recursos e alcance.", "titulo_pt": "Alas do PT disputam 7 ministérios de Lula enquanto Centrão negocia cargos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 255967, "titulo": "Número de obras paralisadas do PAC cai após governo Lula questionar metodologia do TCU", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/numero-de-obras-paralisadas-do-pac-cai-apos-governo-lula-questionar-metodologia-do-tcu.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de obras do PAC paralisadas no governo federal diminuiu após a Casa Civil questionar a metodologia do TCU para classificar empreendimentos como interrompidos.", "titulo_pt": "Número de obras paralisadas do PAC cai após governo Lula questionar metodologia do TCU", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 255970, "titulo": "Governo de SP divulga calendário de desconto e parcelamento do IPVA 2027; veja por placa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/governo-de-sp-divulga-calendario-de-desconto-e-parcelamento-do-ipva-2027-veja-por-placa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os proprietários de veículos em São Paulo terão a opção de parcelar o IPVA de 2027 em até cinco vezes, com vencimentos definidos pelo final da placa entre janeiro e maio de 2027. O calendário será divulgado posteriormente.", "titulo_pt": "Governo de SP divulga calendário de desconto e parcelamento do IPVA 2027; veja por placa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 255985, "titulo": "Tereza traça estratégia para furar bolha do bolsonarismo e tirar votos de Alcolumbre no Senado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/tereza-traca-estrategia-para-furar-bolha-do-bolsonarismo-e-tirar-votos-de-alcolumbre-no-senado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-11T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A senadora Tereza Cristina (PP-MS) planeja desafiar o atual presidente do Senado, Davi Alcolumbre (União Brasil-AP), com o objetivo de retirar votos e eleger Rogério Marinho (PL-RN) como representante da oposição na presidência da Casa.", "titulo_pt": "Tereza cristina traça estratégia para desafiar Alcolumbre e eleger marinho como presidente do Senado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 256241, "titulo": "Cadastro de assédio eleitoral só se sustenta depois do processo administrativo", "url": "https://www.jota.info/opiniao-e-analise/artigos/cadastro-de-assedio-eleitoral-so-se-sustenta-depois-do-processo-administrativo", "fonte_id": "jota", "data_pub": "2026-11-11T06:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lei 9.029/1995 proíbe o crédito oficial para quem pratica assédio eleitoral. A aplicação da sanção depende do processo administrativo previsto na ADPF 509.", "titulo_pt": "Cadastro de assédio eleitoral depende de processo administrativo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 256400, "titulo": "Nayib Bukele says Salvadoran troops destroyed gang HQ in Haiti", "url": "https://www.france24.com/en/nayib-bukele-says-salvadoran-troops-destroyed-gang-hq-in-haiti", "fonte_id": "france24", "data_pub": "2026-11-11T09:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Nayib Bukele afirmou que tropas salvadenses enviadas para Haiti destruíram o quartel-general de uma das gangues mais poderosas do país. Bukele enviou mais de 2.000 soldados para Haiti após quatro de seus soldados desaparecerem no país em outubro.", "titulo_pt": "Nayib Bukele afirma que tropas salvadenses destruíram sede de gangue em Haiti", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 256401, "titulo": "House Republicans quash effort to impeach Defense Secretary Hegseth", "url": "https://www.france24.com/en/house-republicans-quash-effort-to-impeach-defense-secretary-hegseth", "fonte_id": "france24", "data_pub": "2026-11-11T09:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os republicanos da Câmara dos Representantes impediram um esforço para processar o secretário de Defesa, Kenneth Hagel, por impeachment. Rochelle Ferguson Bouyahi, editora internacional de notícias, fornece mais detalhes sobre o assunto.", "titulo_pt": "Republicanos da câmara impedem esforço para processar secretário de defesa por impeachment", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 256327, "titulo": "Spain's first general strike in 14 years demands solutions to housing crisis", "url": "https://www.npr.org/2026/11/11/nx-s1-6037314/spain-general-strike", "fonte_id": "npr_news", "data_pub": "2026-11-11T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Menos de três semanas antes de uma eleição nacional que pode levar o extremismo de direita ao poder, os trabalhadores espanhóis estão realizando uma greve geral para exigir que o governo resolva a crise imobiliária.", "titulo_pt": "Espanha realiza primeira greve geral em 14 anos exigindo solução para crise imobiliária", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 256402, "titulo": eia do Sul, segundo o vice-ministro de ciência do país.", "titulo_pt": "Incertezas em torno da inteligência artificial após midterms americanos 'oportunidade ouro' para a Coreia do sul: vice-ministro de ciência", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 256633, "titulo": "LG Innotek earns top supplier partnership rating for 10th year", "url": "https://www.koreaherald.com/article/10933907", "fonte_id": "korea_herald", "data_pub": "2026-11-11T06:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "LG Innotek recebeu a maior nota no Índice de Crescimento Compartilhado 2025 da Comissão Coreana para Parceria Empresarial pelo décimo ano consecutivo, reconhecendo sua dedicação a apoiar fornecedores através de financiamento, assistência tecnológica e treinamento de mão-de-obra. A empresa manteve o seu melhor rating desde 2016.", "titulo_pt": "LG Innotek obtém nota máxima no índice de parceria compartilhada por 10 anos consecutivos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 256601, "titulo": "AMD teams up with Samsung Electronics on next-generation embedded processors", "url": "https://en.yna.co.kr/view/AEN20261111006700320", "fonte_id": "yonhap_news", "data_pub": "2026-11-11T06:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Advanced Micro Devices (AMD) está colaborando com a Samsung Electronics para desenvolver processadores embedded de próxima geração.", "titulo_pt": "AMD se associa à Samsung Electronics para processadores embedded avançados", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 256059, "titulo": "Como a chinesa DiDi, dona da 99, quer acelerar o uso de carros elétricos no Brasil", "url": "https://exame.com/negocios/como-a-chinesa-didi-dona-da-99-quer-acelerar-o-uso-de-carros-eletricos-no-brasil/", "fonte_id": "exame", "data_pub": "2026-11-11T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A chinesa DiDi, proprietária da 99 no Brasil, busca acelerar o uso de veículos elétricos no país. Na China, 74% das corridas por aplicativo já são realizadas com veículos elétricos.", "titulo_pt": "Como a chinesa DiDi, dona da 99, quer acelerar o uso de carros elétricos no Brasil", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 256555, "titulo": "Next-gen ultrasound cancer treatment advances: does the evidence match commercial hype?", "url": "https://www.scmp.com/business/companies/article/3374076/next-gen-ultrasound-cancer-treatment-advances-does-evidence-match-commercial-hype", "fonte_id": "scmp", "data_pub": "2026-11-11T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hong Kong está expandindo ensaios clínicos de histotripsy, um tratamento não invasivo que usa ultrassom focalizado para destruir tumores, com o objetivo de estabelecer um papel na desenvolvimento da tecnologia para câncer de rim. As clínicas CUHK Medical Centre, Gleneagles Hospital Hong Kong e Hong Kong Sanatorium & Hospital começarão a realizar os ensaios em 30 pacientes com foco no câncer de rim.", "titulo_pt": "Avanço no tratamento de câncer com ultrassom avançado avança: a evidência bate com a histeria comercial?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 256665, "titulo": "STAT+: MDCalc launches a ‘rumble strip’ for doctors using generative AI tools", "url": "https://www.statnews.com/2026/11/11/mdcalc-launches-crosscover-rumble-strip-for-clinical-ai-chatbots/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-11T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "MDCalc, uma ferramenta de referência médica, lançou o CrossCover, um recurso projetado para auxiliar os médicos a confiarem nas respostas de chatbots de inteligência artificial médicos. O CrossCover visa fornecer uma espécie de faixa de segurança para os profissionais de saúde que usam essas ferramentas de IA.", "titulo_pt": "Mdcalc lança o crosscover para auxiliar médicos na confiança em chatbots de IA", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 256666, "titulo": "STAT+: Doctors on Kennedy’s influential preventive care panel have major conflicts of interest, filings reveal", "url": "https://www.statnews.com/2026/11/11/kennedy-hhs-preventive-care-panel-conflict-interest-waivers/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-11T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Funcionários federais de saúde concederam permissões éticas gerais aos membros do painel USPSTF, alguns dos quais possuem ações farmacêuticas e práticas médicas privadas.", "titulo_pt": "Membros do painel influente de cuidados preventivos de Kennedy têm conflitos de interesse, revelam declarações", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 256667, "titulo": "A new tactic in the war over out-of-network bills: Health care providers are suing employers", "url": "https://www.statnews.com/2026/11/11/no-surprises-act-phi-health-air-ambulance-sues-employers/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-11T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fornecedores de saúde estão cada vez mais processando empregadores, alegando que eles são responsáveis pelos recados médicos fora da rede que as seguradoras não pagaram integralmente ou pagaram com atraso.", "titulo_pt": "Nova tática na guerra sobre contas fora da rede: provedores de saúde estão processando empregadores", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 256668, "titulo": "Opinion: Low-income parents can’t afford to take chances with nutritious food their picky eaters might reject", "url": "https://www.statnews.com/2026/11/11/picky-eating-kids-low-income-families-snap-wic/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-11T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os especialistas escrevem que as rejeições alimentares dos filhos têm um custo significativo, que poucas famílias com baixa renda conseguem suportar.", "titulo_pt": "Opinião: pais de baixa renda não podem arcar com riscos de alimentos nutritivos que seus filhos recusarem", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 256218, "titulo": "Crean una inyección experimental que “autodestruye” las células grasas y reduce la grasa abdominal", "url": "https://www.latercera.com/tendencias/noticia/crean-una-inyeccion-experimental-que-autodestruye-las-celulas-grasas-y-reduce-la-grasa-abdominal/", "fonte_id": "la_tercera", "data_pub": "2026-11-11T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um tratamento inyectable experimental foi desenvolvido para eliminar as células grasas e potencialmente reduzir a gordura abdominal, abrindo novas possibilidades para o tratamento da obesidade e do sobrepeso. Os ensaios estão explorando seu possível efeito após o uso de medicamentos como Ozempic e Mounjaro.", "titulo_pt": "Criam uma injeção experimental que ‘autodestrói’ as células grasas e reduz a gordura abdominal", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 255962, "titulo": "Corvos são mais rápidos que humanos para tomar decisões, sugere estudo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/corvos-sao-mais-rapidos-que-humanos-para-tomar-decisoes-sugere-estudo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-11T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores identificaram mecanismos relacionados à tomada de decisão em primatas e corvos. Os corvos, conhecidas por sua inteligência, foram descobertos serem mais rápidos que os humanos em tomar decisões.", "titulo_pt": "Corvos são mais rápidos que humanos para tomar decisões, sugere estudo", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 256711, "titulo": "Voyager is one light day away from us. Here’s what it discovered on its epic journey", "url": "https://www.newscientist.com/article/2598369-voyager-is-one-light-day-away-from-us-heres-what-it-discovered-on-its-epic-journey/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-11T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Voyager 1 é o objeto mais distante criado pelo homem em relação à Terra. Durante sua jornada de 50 anos até o limite do sistema solar, ele revolucionou nossa compreensão dos planetas e de nós mesmos.", "titulo_pt": "Voyager está a uma luz-dia de nós. Eis o que ele descobriu em sua jornada épica", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 256534, "titulo": "Disaster warning systems race to keep pace with galloping climate risks", "url": "https://www.japantimes.co.jp/environment/2026/11/11/climate-change/disaster-warning-systems-climate/", "fonte_id": "japan_times", "data_pub": "2026-11-11T07:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um deslizamento de rochas e gelo e inundações na Nepal em agosto, que deixaram milhares de mortos, feridos ou desaparecidos, demonstraram que todos os sistemas de alerta estão limitados. Sistemas de alerta para desastres estão correndo para acompanhar os riscos climáticos que estão aumentando rapidamente.", "titulo_pt": "Sistemas de alerta para desastres correm para acompanhar os riscos climáticos galopantes", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 256542, "titulo": "Japan research team identifies rubella virus receptor", "url": "https://www.japantimes.co.jp/news/2026/11/11/japan/science-health/rubella-virus-receptor/", "fonte_id": "japan_times", "data_pub": "2026-11-11T06:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de pesquisa japonês identificou o receptor principal do vírus da rubéola. Embora existam vacinas contra a rubéola, a identificação desse receptor pode auxiliar no desenvolvimento de medicamentos antivirais.", "titulo_pt": "Equipe japonesa identifica receptor do vírus da rubéola", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 256683, "titulo": "APOD: 2026 November 11 – NGC 4449: Small Galaxy, Big Impact", "url": "https://science.nasa.gov/image-article/apod-2026-november-11-ngc-4449-small-galaxy-big-impact/", "fonte_id": "nasa_news", "data_pub": "2026-11-11T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "NGC 4449 é uma galáxia pequena que tem um grande impacto em estudos astronômicos. Cada dia, a APOD, ou Astronomy Picture of the Day, exibe uma imagem ou foto do universo, acompanhada de uma breve explicação escrita por um astrônomo profissional.", "titulo_pt": "APOD: 11 de novembro de 2026 - NGC 4449: galáxia pequena, grande impacto", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 256684, "titulo": "Water Surges Into Navajo Reservoir", "url": "https://science.nasa.gov/earth/earth-observatory/water-surges-into-navajo-reservoir/", "fonte_id": "nasa_news", "data_pub": "2026-11-11T05:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chuvas intensas no Sudoeste dos Estados Unidos encheram rios e rapidamente elevaram o nível do segundo maior reservatório da Nuevo México.", "titulo_pt": "Água inunda reservatório Navajo", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 256640, "titulo": "New study shows COVID value-added tax cut significantly boosted private consumption", "url": "https://phys.org/news/2026-11-covid-added-tax-significantly-boosted.html", "fonte_id": "phys_org", "data_pub": "2026-11-11T03:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2020, o governo federal alemão reduziu a alíquota do imposto sobre valor adicionado (IVA) de 19% para 16% por meio de um pacote de estímulo econômico durante a pandemia. Um novo estudo, publicado recentemente na Revista de Estudos Econômicos, analisou dados de pesquisas, compras varejistas e modelos econômicos para determinar o impacto dessa medida no consumo privado. O estudo demonstrou que famílias de baixa renda, bem como jovens e adultos de meia-idade, foram particularmente beneficiadas, independentemente do seu nível de alfabetização financeira.", "titulo_pt": "Novo estudo mostra que corte no iva durante a COVID aumentou o consumo privado", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 256641, "titulo": "Coyotes are likely a permanent fixture on the Outer Banks of North Carolina", "url": "https://phys.org/news/2026-11-coyotes-permanent-fixture-outer-banks.html", "fonte_id": "phys_org", "data_pub": "2026-11-11T02:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa indica que as populações de raposas-coyote nas Ilhas Externas de Carolina do Norte persistem apesar dos programas de remoção em andamento, representando uma ameaça contínua para aves nidificantes de praias e tartarugas marinhas protegidas. Este estudo, o primeiro de profundidade sobre populações de raposas em ilhas-barreira, tem implicações para o entendimento do impacto das raposas em ecossistemas de ilhas-barreira e outros ecossistemas semelhantes.", "titulo_pt": "Raposas-coyote provavelmente se tornarão um elemento permanente nas ilhas externas de Carolina do norte", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 255963, "titulo": "Qual é o segredo de Xangai no ensino de matemática?", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/colunas/marceloviana/2026/11/qual-e-o-segredo-de-xangai-no-ensino-de-matematica.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-11T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Programa Internacional de Avaliação de Estudantes (Pisa) é realizado a cada três anos pela OCDE e testa jovens de 15 anos em matemática, ciências e literacia. Atualmente, mais de 90 países e regiões participam do programa, e os resultados são publicados em um relatório detalhado.", "titulo_pt": "Qual é o segredo de Xangai no ensino de matemática?", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 256642, "titulo": "Simplified framework could make products' environmental impacts easier to assess", "url": "https://phys.org/news/2026-11-framework-products-environmental-impacts-easier.html", "fonte_id": "phys_org", "data_pub": "2026-11-11T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo do Paul Scherrer Institute PSI demonstrou que quatro métodos híbridos estabelecidos podem ser reduzidos a dois, o que representa um passo rumo ao desenvolvimento de software aberto que permitiria a análise de impactos ambientais de produtos e serviços mesmo sem conhecimento matemático aprofundado. A vida cycle assessment é utilizada para quantificar o impacto ambiental de produtos e serviços, formando uma base importante para decisões políticas, mas a coleta de dados necessários é sempre difícil de ser realizada de forma completa.", "titulo_pt": "Quadro simplificado poderia facilitar a avaliação dos impactos ambientais de produtos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 256184, "titulo": "Leonor Benedetto: del cambio de rumbo que necesitó a los grandes amores de su vida y por qué se va a Roma a trabajar", "url": "https://www.lanacion.com.ar/espectaculos/personajes/leonor-benedetto-del-cambio-de-rumbo-que-necesito-a-los-grandes-amores-de-su-vida-y-por-que-se-va-a-nid11112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-11T09:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A atriz Leonor Benedetto viajará para Roma para apresentar sua última peça, Dante e Borges, um diálogo no paraíso, que ela escreveu e protagoniza. Em entrevista à LA NACION, ela refletiu sobre sua carreira e sua história pessoal.", "titulo_pt": "Leonor Benedetto: do rumo que sua vida amorosa tomou e por que ela vai para Roma trabalhar", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 256312, "titulo": "NAZA documentary on Gaza killings becomes one of year’s most watched", "url": "https://www.theguardian.com/film/2026/nov/11/naza-documentary-on-gaza-killings-becomes-one-of-years-most-watched", "fonte_id": "guardian_world", "data_pub": "2026-11-11T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O documentário NAZA, que detalha a vigilância israelense de civis palestinos em Gaza, foi visto por mais de 1,5 milhões de pessoas em menos de dois meses após sua exibição em cinemas ao redor do mundo. O filme, dirigido por diretores israelenses vencedores do Oscar, alcançou uma audiência global de 1,547.033 até 6 de novembro.", "titulo_pt": "Documentário NAZA sobre mortes em Gaza se torna um dos mais assistidos do ano", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 256185, "titulo": "Papa León XIV en la Argentina, EN VIVO: la misa en Luján y la despedida en Ezeiza hoy, minuto a minuto", "url": "https://www.lanacion.com.ar/sociedad/papa-leon-xiv-en-la-argentina-en-vivo-la-misa-en-lujan-y-la-despedida-en-ezeiza-hoy-minuto-a-minuto-nid11112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-11T09:46:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Papa Francisco visitará o Complexo Penitenciário Federal e escutará detidos durante o terceiro dia de sua estadia no país. À tarde, seguirá viagem para o Peru.", "titulo_pt": "Papa francisco no Brasil, em tempo real: missa em Luján e despedida em Ezeiza hoje, minuto a minuto", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 256188, "titulo": "Detuvieron cerca del escenario del Papa en Palermo a un bomb erary Hub", "pais": "EUA", "classe": "B"}, {"id": 256712, "titulo": "Rivals review – this TV joy is so much more than just a romp", "url": "https://www.theguardian.com/tv-and-radio/2026/nov/11/rivals-review-disney-series-two-aidan-turner-danny-dyer-david-tennant", "fonte_id": "guardian_culture", "data_pub": "2026-11-11T08:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O segundo ano da série Rivals não se limita a backcombing, traições e atos íntimos. Inclui momentos de grande emoção. A segunda temporada foi dividida em duas partes de seis episódios cada, por razões desconhecidas para os gerenciadores de receita da Disney.", "titulo_pt": "Rivals: a alegria da TV vai além de simples romances", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 255956, "titulo": "Sylvio Fraga, inspirado por filho e pelo cerrado, cria sons peculiares em seu novo disco", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/sylvio-fraga-inspirado-por-filho-e-pelo-cerrado-cria-sons-peculiares-em-seu-novo-disco.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-11T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O quinto álbum de Sylvio Fraga incorpora influências do nascimento do segundo filho e do cerrado, resultando em música sofisticada que desvia do refrão e do apelo pop.", "titulo_pt": "Sylvio Fraga, inspirado por filho e pelo cerrado, cria sons peculiares em seu novo disco", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 256079, "titulo": "Homem morre após ser espancado no DF e suspeito do crime é preso", "url": "https://www.metropoles.com/distrito-federal/na-mira/homem-morre-apos-ser-espancado-no-df-e-suspeito-do-crime-e-preso", "fonte_id": "metropoles", "data_pub": "2026-11-11T09:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem foi mort para vítimas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 255441, "titulo": "Maioria dos brasileiros acredita no fim do mundo causado pela sociedade", "url": "https://www.cnnbrasil.com.br/ciencia/maioria-dos-brasileiros-acredita-no-fim-do-mundo-causado-pela-sociedade/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-10T20:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um levantamento mostrou que a maioria dos brasileiros acredita que o fim do mundo pode ser causado pela sociedade, com empate técnico entre a percepção de tragédias climáticas e conflitos armados.", "titulo_pt": "Maioria dos brasileiros acredita no fim do mundo causado pela sociedade", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 256082, "titulo": "Vinho de patauá contaminado provoca surto de Chagas e deixa 1 morto no Pará", "url": "https://www.metropoles.com/brasil/vinho-de-pataua-contaminado-provoca-surto-de-chagas-e-deixa-1-morto-no-para", "fonte_id": "metropoles", "data_pub": "2026-11-11T09:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um surto de doença de Chagas foi causado por vinho de patauá contaminado em um município do Pará, com oito casos confirmados e 27 pessoas monitoradas. Até o momento, uma morte foi registrada.", "titulo_pt": "Vinho de patauá contaminado causa surto de Chagas e deixa uma morte no Pará", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 256123, "titulo": "Começa Cúpula de Líderes na COP31; Lula vai discursar", "url": "https://www.cnnbrasil.com.br/internacional/cupula-lideres-cop31/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Delegados de aproximadamente 200 países estão se reunindo na cidade turística de Antália, na Turquia, para a COP31. As emissões de gases de efeito estufa globais não mostram sinais significativos de diminuição e outras crises, como guerras e inflação, estão competindo pela atenção política.", "titulo_pt": "Começa Cúpula de Líderes na COP31; Lula vai discursar", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 256558, "titulo": "World leaders begin UN climate talks amid concerns action on global warming too slow", "url": "https://www.scmp.com/news/world/africa/article/3374065/world-leaders-begin-un-climate-talks-amid-concerns-action-global-warming-too-slow", "fonte_id": "scmp", "data_pub": "2026-11-11T09:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes mundiais começaram a chegar para iniciar discussões formais na conferência das Nações Unidas sobre mudanças climáticas em Turquia, buscando acordar ações concretas para frear o aquecimento global após um ano de desastres climáticos, como inundações e ondas de calor. No entanto, o que será alcançado na conferência de 11 dias, chamada Cop31, ainda é incerto.", "titulo_pt": "Líderes mundiais iniciam discussões climáticas das nações unidas com temores de que ação sobre o aquecimento global seja lenta", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 256085, "titulo": "Clima: pancadas de chuva, temporais isolados e rajadas de vento marcam a 4ª", "url": "https://www.metropoles.com/brasil/clima-pancadas-de-chuva-temporais-isolados-e-rajadas-de-vento-marcam-a-4a", "fonte_id": "metropoles", "data_pub": "2026-11-11T09:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pancadas de chuva, temporais isolados e rajadas de vento marcam a quarta-feira. A combinação de calor, umidade elevada e sistemas meteorológicos favorecem a formação de nuvens carregadas.", "titulo_pt": "Pancadas de chuva, temporais isolados e rajadas de vento marcam a 4ª", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 256129, "titulo": "Brasil apresenta controles ambientais para manter exportações à Europa", "url": "https://www.cnnbrasil.com.br/agro/brasil-apresenta-controles-ambientais-para-manter-exportacoes-a-europa/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-11T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo e entidades do setor agrícola apresentaram ferramentas de rastreabilidade e dados sobre propriedades rurais aos autoridades e compradores europeus para demonstrar que a produção brasileira pode atender às novas exigências ambientais do bloco europeu.", "titulo_pt": "Brasil apresenta controles ambientais para manter exportações à Europa", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 256710, "titulo": "Analysis: Climate-finance pledges fall 70% as countries meet at COP31", "url": "https://www.carbonbrief.org/analysis-climate-finance-pledges-fall-70-as-countries-meet-at-cop31", "fonte_id": "carbon_brief", "data_pub": "2026-11-11T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O montante de financiamento público prometido para ajudar os países em desenvolvimento a enfrentar o clima caiu mais de 70% durante a COP31. Essa é a análise apresentada pelo Carbon Brief.", "titulo_pt": "Análise: promessas de financiamento climático caem 70% durante COP31", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 256053, "titulo": "COP31 caminha para ser a maior da história; Brasil tem a 2ª maior delegação", "url": "https://exame.com/esg/cop31-caminha-para-ser-a-maior-da-historia-brasil-tem-a-2a-maior-delegacao/", "fonte_id": "exame", "data_pub": "2026-11-11T06:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A COP31 está progredindo com a participação de uma das maiores delegações do Brasil, embora a lista de chefes de Estado das grandes economias seja curta e os Estados Unidos não estejam presentes.", "titulo_pt": "COP31 caminha para ser a maior da história; Brasil tem a 2ª maior delegação", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 256056, "titulo": "Quem ficou de fora da COP31? Os líderes que deixaram o clima em segundo plano", "url": "https://exame.com/esg/quem-ficou-de-fora-da-cop31-os-lideres-que-deixaram-o-clima-em-segundo-plano/", "fonte_id": "exame", "data_pub": "2026-11-11T06:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os chefes de governo das sete maiores economias desenvolvidas, com exceção do primeiro-ministro britânico, não participaram da Cúpula dos Líderes, que visava avançar em acordos climáticos.", "titulo_pt": "Quem ficou de fora da COP31? Os líderes que deixaram o clima em segundo plano", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 256058, "titulo": "Cúpula de Líderes marca terceiro dia da COP31 com florestas no foco e caos na chegada", "url": "https://exame.com/esg/cupula-de-lideres-marca-terceiro-dia-da-cop31-com-florestas-no-foco-e-caos-na-chegada/", "fonte_id": "exame", "data_pub": "2026-11-11T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cúpula de líderes na COP31 em Antália, com 102 participantes esperados, enfrentou problemas de trânsito, restrições de acesso e longas filas devido ao reforço da segurança. O ex-presidente Lula discursou tanto na abertura quanto no segmento de alto nível.", "titulo_pt": "Cúpula de Líderes marca terceiro dia da COP31 com florestas no foco e caos na chegada", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 255430, "titulo": "Acordo inédito entre organizações do Brasil e dos EUA quer combater impactos do clima e da IA", "url": "https://www.cnnbrasil.com.br/ciencia/acordo-inedito-entre-organizacoes-do-brasil-e-dos-eua-quer-combater-impactos-do-clima-e-da-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-10T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Organizações do Brasil e dos Estados Unidos firmaram um acordo inédito para criar soluções que combaterão os impactos do clima e da inteligência artificial nos dois países. A parceria visa abordar desafios sociais e urbanos enfrentados pelos dois países.", "titulo_pt": "Acordo inédito entre organizações do Brasil e dos EUA quer combater impactos do clima e da IA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 255522, "titulo": "Guerra no Irã ajuda a reduzir emissões de carbono, mas há um problema", "url": "https://olhardigital.com.br/2026/11/10/ciencia-e-espaco/guerra-no-ira-ajuda-a-reduzir-emissoes-de-carbono-mas-ha-um-problema/", "fonte_id": "olhar_digital", "data_pub": "2026-11-10T19:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo levantamento do Global Carbon Project estima que a guerra no Irã tenha contribuído para uma redução nas emissões de carbono. No entanto, há um problema associado a essa diminuição.", "titulo_pt": "Guerra no Irã ajuda a reduzir emissões de carbono, mas há um problema", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 254372, "titulo": "Parque Tantauco inaugura nueva Casa Museo Sebastián Piñera Echenique", "url": "https://www.latercera.com/nacional/noticia/parque-tantauco-inaugura-nueva-casa-museo-sebastian-pinera-echenique/", "fonte_id": "la_tercera", "data_pub": "2026-11-10T17:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O novo espaço, localizado no setor norte do Parque Tantauco, oferece tecnologia, museografia interativa e experiências educativas para toda a família, destacando o patrimônio cultural e natural de Chiloé. O local já está aberto ao público.", "titulo_pt": "Parque Tantauco inaugura nova Casa museu Sebastián Piñera Echenique", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 254326, "titulo": "Una amenaza latente: el trágico desenlace de un yaguareté reavivó la preocupación por la reintroducción de la especie", "url": "https://www.lanacion.com.ar/sociedad/una-amenaza-latente-un-yaguarete-que-era-monitoreado-murio-atropellado-y-reavivo-la-preocupacion-por-nid10112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-10T17:43:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um jaguatirica de dois anos e meio, que havia começado a se deslocar para fora de uma ilha onde nasceu, morreu atropelado em uma área protegida; esse incidente reavivou preocupações sobre a reintrodução da espécie.", "titulo_pt": "Uma ameaça latente: o trágico fim de um jaguatirica reavivou a preocupação com a reintrodução da espécie", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 255488, "titulo": "O que saiu do papel desde Belém? COP31 anuncia investimentos e faz balanço da ação climática", "url": "https://exame.com/esg/o-que-saiu-do-papel-desde-belem-cop31-anuncia-investimentos-e-faz-balanco-da-acao-climatica/", "fonte_id": "exame", "data_pub": "2026-11-10T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ano após a COP30, 84% dos planos da Agenda de Ação registraram avanços. Nesta terça-feira, 10, empresas destinaram US$ 156 bilhões anuais em redes elétricas, renováveis e armazenamento.", "titulo_pt": "O que saiu do papel desde Belém? COP31 anuncia investimentos e faz balanço da ação climática", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 254225, "titulo": "Associação do setor de energia nuclear defende operação de Angra 3", "url": "https://www.cnnbrasil.com.br/infra/associacao-defende-angra-3-e-alerta-para-perda-bilionaria-com-paralisacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-10T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A associação do setor de energia nuclear defende a operação de Angra 3. O Brasil estaria perdendo bilhões com a paralisação das obras da usina.", "titulo_pt": "Associação do setor nuclear defende operação de Angra 3", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 255164, "titulo": "Analysis: Which countries have sent the most delegates to COP31?", "url": "https://www.carbonbrief.org/analysis-which-countries-have-sent-the-most-delegates-to-cop31", "fonte_id": "carbon_brief", "data_pub": "2026-11-10T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 92.000 pessoas se registraram para participar da COP31 de clima em Antalya, Turquia, o que potencialmente torna-a a maior até o momento. O artigo analisa quais países enviaram mais delegados para a COP31.", "titulo_pt": "Análise: quais países enviaram mais delegados para a COP31?", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 256315, "titulo": "Ed Miliband says national security of all countries at risk from climate crisis", "url": "https://www.theguardian.com/environment/2026/nov/11/ed-miliband-national-security-climate-crisis-cop31", "fonte_id": "guardian_world", "data_pub": "2026-11-11T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário de Estado britânico para Assuntos Exteriores, Ed Miliband, alertará líderes mundiais na COP31 que a crise climática representa uma ameaça à segurança nacional de todos os países, com cenários de destruição aparentemente sci-fi se tornando realidade e choques econômicos causados por combustíveis fósseis se tornando a regra.", "titulo_pt": "Ed Miliband diz que segurança nacional de todos os países está em risco devido à crise climática", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 256198, "titulo": "Refugios para la incertidumbre", "url": "https://www.lanacion.com.ar/opinion/refugios-para-la-incertidumbre-nid11112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-11T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute a criação de refúgios para lidar com a incerteza. Não há detalhes específicos sobre o conteúdo do texto, apenas o tema principal.", "titulo_pt": "Refúgios para a incerteza", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 256589, "titulo": "Presidential office discusses rights protection for Korean adoptees overseas", "url": "https://en.yna.co.kr/view/AEN20261111009600315", "fonte_id": "yonhap_news", "data_pub": "2026-11-11T07:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O gabinete presidencial realizou uma reunião para discutir a proteção dos direitos dos adotados coreanos no exterior. O encontro ocorreu em Seul no dia 11 de novembro.", "titulo_pt": "Gabinete presidencial discute proteção dos direitos de adotados coreanos no exterior", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 256398, "titulo": "Trinidad and Tobago's highest court strikes down colonial-era ban on gay sex", "url": "https://www.lemonde.fr/en/international/article/2026/11/11/trinidad-and-tobago-s-highest-court-strikes-down-colonial-era-ban-on-gay-sex_6777456_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-11T04:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tribunal mais alto da Trinidad e Tobago derrubou uma lei colonial que proibia relações sexuais entre pessoas do mesmo sexo, considerando que ela violava direitos fundamentais à privacidade e liberdade individual. Esta decisão representa uma vitória significativa para os direitos da comunidade LGBTQ+ na Caribe.", "titulo_pt": "Tribunal mais alto da trinidad e Tobago anula lei colonial que proibia relações homossexuais", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 256397, "titulo": "Lina Attalah: 'I've been a journalist in Egypt for over 20 years. We've never been granted any freedom'", "url": "https://www.lemonde.fr/en/le-monde-africa/article/2026/11/11/lina-attalah-i-ve-been-a-journalist-in-egypt-for-over-20-years-we-ve-never-been-granted-any-freedom_6777355_124.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-11T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lina Attalah, fundadora e editora-chefe do Mada Masr, um site de notícias independente criticando o regime egípcio, es iminalising gay sex", "url": "https://www.scmp.com/news/world/americas/article/3373994/uk-court-overturns-trinidad-and-tobago-law-criminalising-gay-sex", "fonte_id": "scmp", "data_pub": "2026-11-10T18:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal de Londres anulou uma lei na Trinidade e Tobago que criminalizava relações sexuais consentidas entre homens do mesmo sexo. Jason Jones, um homem gay, desafiou a Lei de Delitos Sexuais do país, alegando que ela violava seus direitos fundamentais.", "titulo_pt": "Tribunal britânico anula lei criminalizando sexo gay na trinidade e Tobago", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 255856, "titulo": "HRW urges U.N. to address N. Korean human rights situation alongside security issues", "url": "https://en.yna.co.kr/view/AEN20261111000300315", "fonte_id": "yonhap_news", "data_pub": "2026-11-10T18:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Human Rights Watch pediu ao Conselho de Segurança das Nações Unidas que aborde a situação dos direitos humanos na Coreia do Norte junto com questões de segurança.", "titulo_pt": "HRW solicita ao conselho de segurança da ONU abordar situação de direitos humanos na Coreia do norte junto com questões de segurança", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 254304, "titulo": "Jueza ordena liberar a estudiante de UC Berkeley detenida por el ICE en aeropuerto de San Francisco", "url": "https://www.clarin.com/estados-unidos/jueza-ordena-liberar-a-estudiante-de-uc-berkeley-detenida-por-el-ice-en-aeropuerto-de-san-francisco_0_zIiNTARJRy.html", "fonte_id": "clarin", "data_pub": "2026-11-10T17:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma juiza federal ordenou a liberação de uma estudante da UC Berkeley que foi detida pelo ICE no aeroporto de San Francisco, citando uma violação ao direito processual. A jovem colombiana poderá continuar seu p r Own Rights", "url": "https://thediplomat.com/2026/11/the-afghan-women-who-wrote-their-own-rights/", "fonte_id": "the_diplomat", "data_pub": "2026-11-10T15:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há 26 anos, mulheres afegãs se reuniram em Dushanbe para declarar seus direitos, que posteriormente foram novamente retirados pelo regime do Taleban.", "titulo_pt": "As mulheres afegãs que redigiram sua própria carta de direitos", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 254317, "titulo": "Prisões VIP na Indonésia expõem crise e corrupção em presídios no Sudeste Asiático", "url": "https://www.dw.com/pt-br/prisões-vip-na-indonésia-expõem-crise-e-corrupção-em-presídios-no-sudeste-asiático/a-79867515?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-10T12:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Prisões VIP na Indonésia revelam tratamento preferencial para condenados ricos, enquanto sistemas prisionais enfrentam superlotação no Sudeste Asiático.", "titulo_pt": "Prisões VIP na Indonésia expõem crise e corrupção em presídios no Sudeste Asiático", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 255166, "titulo": "Drones and drought in Sudan: a combined assault on children like nothing seen before", "url": "https://www.unicef.org/press-releases/drones-and-drought-sudan-combined-assault-children-nothing-seen", "fonte_id": "unicef", "data_pub": "2026-11-10T09:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Representante da UNICEF, James Elder, fez uma declaração durante uma coletiva de imprensa no Palais des Nations em Genebra, relatando sobre o impacto combinado de drones e seca em crianças no Sudão, descrevendo uma situação inédita.", "titulo_pt": "Drones e seca no sudão: uma ameaça conjunta para crianças como nunca antes visto", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 254653, "titulo": "Question of raci function renderSecao(topico) {

function toggleDrill(id) {
