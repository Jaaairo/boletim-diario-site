<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "24/08/2026 13:08", "stats": {"noticias_novas": 959, "resumos_gerados": 251}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O ministro Alexandre de Moraes discursou sobre algoritmos e grandes empresas de tecnologia (big techs) durante um evento no Tribunal de Contas do Município de São Paulo. Ele afirmou que essas empresas não são neutras, como muitos supunham. Em outro desenvolvimento, o presidente do TRE-SP, José Antonio Encinas Manfré, negou um recurso apresentado pelo influenciador Pablo Marçal e confirmou a inelegibilidade do candidato até 2032. Segundo uma pesquisa do BTG/Nexus, a vantagem de Lula sobre Flávio Bolsonaro diminuiu de 3 pontos para 1 ponto em apenas três semanas, com ambos os candidatos tecnicamente empatados no segundo turno, com 46% e 45% de intenções de voto, respectivamente. O governador de São Paulo, Tarcísio de Freitas, não participará do programa Roda Viva, da TV Cultura, devido a uma incompatibilidade de agenda. Além disso, a Braskem obteve o aval do conselho de administração para solicitar recuperação extrajudicial com o objetivo de reestruturar aproximadamente R$ 56,2 bilhões em dívidas.", "mundo": "O presidente dos Estados Unidos, Donald Trump, anunciou que aumentará as tarifas sobre os carros canadenses para 50%, aprofundando a guerra comercial entre Washington e Ottawa. Em resposta, os Estados Unidos e a Coreia do Sul enfatizaram a comunicação próxima em relação à Coreia do Norte e ao estabelecimento da paz na península coreana. A Coreia do Sul também apresentou novas diretrizes, baseadas nos padrões da OTAN, para aumentar suas exportações de defesa. Por outro lado, o Irã rejeitou uma ameaça econômica dos EUA, afirmando que a narrativa não faz sentido. A Austrália planeja competir com a China ao estabelecer novas refinarias de metais rares, visando um fornecimento global mais diversificado e confiável desses recursos.\n\nAs tensões geopolíticas continuam a dominar o cenário internacional. Na Ucrânia, as ações contra a Rússia e os ataques de drones ucranianos em territórios russos resultaram em duas mortes de crianças em Krasnodar. Em outro frente, Israel enfrenta críticas por ataques a Palestina, com o exército apoiando os colonos em ataques cada vez mais violentos, compatíveis com a definição de pogroms. Na Ásia, a China intensificou suas atividades marítimas próximas à ilha de Taiwan, atingindo recordes de detecções de embarcações governamentais. Na Ásia, a Coreia do Sul cancelou exercícios marítimos conjuntos com os EUA devido a preocupações com a escalada de tensões regionais. No Oriente Médio, o Irã ameaça restringir o trânsito marítimo no Estreito de Ormuz, enquanto a França e o Reino Unido aumentam o apoio em armas de foguete para a Ucrânia. As tensões comerciais continuam a crescer, com a escalada das sanções econômicas entre os EUA e a Rússia, e o Canadá respondendo com medidas comerciais à escalada da guerra comercial com os EUA.", "economia": "A economia global enfrenta diversos desafios, principalmente a insegurança jurídica e a incerteza causada por conflitos comerciais. Empresas como Shein, Unicharm e Shell estão enfrentando mudanças significativas em suas estratégias e operações. A Shein, uma empresa de moda online, está buscando uma avaliação de 27 bilhões de dólares em sua oferta pública inicial de ações (IPO) na Bolsa de Hong Kong. A Unicharm registrou crescimento global e prioriza o mercado brasileiro. A Shell recebeu propostas para vender seus ativos químicos nos Estados Unidos, potencialmente arrecadando 8 bilhões de dólares. No cenário econômico brasileiro, os economistas reduziram as previsões do PIB para 2026. A insegurança jurídica tem um impacto econômico significativo, levando a práticas de compliance excessivas e atrasos nos investimentos. A discussão sobre ESG (Responsabilidade Social, Sustentabilidade Ambiental e Governança Corporativa) continua polarizada, com avanços regulatórios em alguns países. A Arábia Saudita está negociando seguros estatais devido aos aumentos de preços e restrições de cobertura, enquanto a Coreia do Sul estende prazos de pagamento e adia auditorias para contribuintes afetados pelas cheias. O cenário das bolsas asiáticas também é volátil, com quedas significativas nas ações da Alibaba e na Bolsa de Seul, devido à venda de ações e problemas de oferta de chips.", "tecnologia": "Os Estados Unidos estão acelerando investimentos em inteligência artificial (IA) e ampliando a diferença em relação à Europa, conforme projeções que destacam a disparidade na adoção da IA entre as duas economias. O Yahoo está buscando atrair a geração Z com uma ferramenta de IA própria, enquanto empresas chinesas de tecnologia e farmacêuticas estão utilizando Hong Kong como plataforma para expandir globalmente. A Xpeng, uma empresa de veículos elétricos chinesa, levantou US$ 900 milhões para impulsionar sua unidade de robótica, enquanto o SoftBank planeja captar US$ 6,3 bilhões para investir em IA, incluindo compromissos com a OpenAI. A Hugging Face, uma empresa de tecnologia, pode ser vendida por cerca de 13 bilhões de dólares após rejeitar um investimento de 500 milhões de dólares da Nvidia. Além disso, a integração de IA no CRM está revolucionando a gestão de vendas, e a inteligência artificial está sendo usada para melhorar a segurança marítima e a gestão do transporte de cargas em portos.", "ciencia": "A astronauta Christina Koch, da NASA, descreveu a impressionante experiência de ver a Terra iluminada durante a missão Artemis II, afirmando que nada a preparou para tal sensação. A empresa Spirit Electronics anunciou a inclusão de componentes de espaço grade da Texas Instruments e da Microchip Technology em sua loja online, preparando-se para o evento SmallSat 2026. Cientistas chilenos desenvolveram uma técnica inovadora para remover resíduos de medicamentos das águas residuais, utilizando líquidos iônicos como alternativa eficaz. A NASA e a World Space Week destacam a importância da tecnologia e dos talentos humanos para a próxima geração de exploração cislunar. A FDA planeja regular a inteligência artificial gerativa, enquanto a Agência de Alimentos e Medicamentos espera emitir orientações sobre dispositivos de IA gerativa. A Regenxbio enfrenta novas preocupações de segurança em seus ensaios clínicos de terapia genética. Uma pesquisa com moscas de fruta sugere que neurônios motores não apenas transmitem comandos, mas também enviam sinais para o cérebro e organizam sequências de movimento. A vacina contra o câncer desenvolvida pela Moderna e Merck foi um sucesso, superando grandes dúvidas iniciais e desafios logísticos. A mudança climática está abrindo rotas marítimas no Ártico, enquanto medidas de proteção de florestas e áreas sem estradas podem ser revogadas. A NASA destaca os playas expostos pelo dessecamento do grande lago Bonneville, que se tornaram cenário de feitos de engenharia e inovação tecnológica. Além disso, a tecnologia de exoesqueletos está avançando rapidamente de laboratórios para trilhas de caminhadas, prometendo auxiliar na caminhada, corrida e salto.", "cultura": "A noite no Usher Hall em Edimburgo foi marcada pela apresentação do trio de mulheres que interpretaram a ópera 'Elektra' de Richard Strauss, com a orquestra de 111 músicos liderada por Karina Canellakis. No entanto, a atenção cultural também se voltou para o documentário 'NAZA', produzido pelo The Guardian, que será exibido em primeira mão no Festival de Veneza. Além disso, a exposição 'Apocalipse' de Alex Flemming, que transforma ruínas históricas em arte sem assistência de tecnologia ou iluminação, também foi apresentada no Festival de Veneza. A Women Photograph anunciou os vencedores das bolsas de 2026, com Fatma Fahmy, Caroline Gutman e Yixi Tian recebendo US$ 10.000 cada. Em outro evento, a Feira SP-Arte Rotas em São Paulo promoveu o Brasil como novo polo de excelência para as artes visuais na América Latina, com a proposta de Fernanda Feitosa seguindo a ideia de Joaquín Torres García. O Festival C6 no Rock atraiu 20 mil pessoas ao Ibirapuera, em São Paulo, para ouvir clássicos do rock nacional. Por fim, o ator Mark Ruffalo negou acusações de antisemitismo feitas por Paramount Skydance, afirmando que tais tropos não existem em seu trabalho.", "sociedade": "Um bebê de 3 meses faleceu após suspeita de maus-tratos no Rio de Janeiro, com o pai sendo preso preventivamente e o Ministério Público investigando o caso. Na Guiné-Bissau, mais de metade dos casos de mpox são em crianças, com 46 suspeitos desde julho, refletindo a rápida disseminação da doença. O governo de Singapura anunciou medidas para tornar a criação de filhos mais atrativa, incluindo aumentar o período de licença parental, embora algumas preocupações persistam sobre a eficácia dessas iniciativas.", "meio_ambiente": "Dezenas de milhares de pessoas foram evacuadas em Nevada e na Califórnia, Estados Unidos, devido a incêndios florestais, incluindo o incêndio de Hawk que se aproximava da cidade de Reno. Em outro evento, um deslizamento de terra em um aterro sanitário na Guiné resultou em 30 mortes. No entanto, o evento mais significativo relacionado ao meio ambiente ocorreu na Austrália, onde apenas 12.000 lobos-marinhos restam, com a gripe aviária H5N1 representando uma ameaça potencial. Na África, quatro suspeitos foram detidos em investigações sobre a morte de 18 elefantes no ecossistema de Amboseli, na Quênia, sugerindo a possibilidade de uso de substâncias tóxicas. Além disso, a Nova Zelândia apresentou uma proposta de lei para proibir redes sociais para menores de 16 anos, enquanto a Indonésia permitiu a sementação de nuvens para combater a poluição de fuligem na região.", "direitos_humanos": "Forças de segurança indianas usaram gás lacrimogênico, armas de projéteis de gás e dispositivos de choque elétrico durante protestos de estudantes em Nova Deli, conforme relatório da Amnesty International. Além disso, autoridades russas informaram a morte de duas crianças e ferimentos em sete outras após ataques ucranianos na região de Krasnodar. Em Gaza, um novo levantamento SMART forneceu uma avaliação atualizada sobre a nutrição infantil e materna em áreas acessíveis. Na Indonésia, trabalhadores migrantes indonésios lançaram uma campanha em defesa dos direitos trabalhistas, buscando melhorar as condições de trabalho e garantir direitos básicos. Por outro lado, no Chile, o conceito de heterarquia é discutido, descrevendo situações em que comunidades locais exercem poder e gerenciam questões sem a intervenção do Estado. O governo chileno, por sua vez, declarou que não planeja questionar o Convenio 169 da OIT, considerando-o não uma prioridade atual."}, "resumo_do_dia": {"politica_nacional": [{"id": 120298, "titulo": "\"Fomos ingênuos ao achar que big techs eram neutras\", diz Moraes em SP", "url": "https://www.metropoles.com/sao-paulo/fomos-ingenuos-ao-achar-que-big-techs-eram-neutras-diz-moraes-em-sp", "fonte_id": "metropoles", "data_pub": "2026-08-24T15:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes discursou sobre algoritmos e empresas de tecnologia de grande porte (big techs) durante um evento no Tribunal de Contas do Município de São Paulo. Segundo Moraes, essas empresas não são neutras como muitos supunham.", "titulo_pt": "Fomos ingênuos ao achar que as grandes empresas de tecnologia são neutras, diz Moraes em SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 120191, "titulo": "O eleitorado que ajudou Flávio Bolsonaro a reduzir distância de Lula, segundo pesquisa BTG/Nexus", "url": "https://veja.abril.com.br/brasil/o-eleitorado-que-ajudou-flavio-bolsonaro-a-reduzir-distancia-de-lula-segundo-a-nexus/", "fonte_id": "veja", "data_pub": "2026-08-24T15:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Desde julho, Flávio Bolsonaro ganhou popularidade entre eleitores católicos, mais escolarizados e moradores da região Sudeste, segundo pesquisa BTG/Nexus.", "titulo_pt": "O eleitorado que ajudou Flávio Bolsonaro a reduzir distância de Lula, de acordo com pesquisa BTG/Nexus", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 120303, "titulo": "Bolsonarismo articula para adiar votação do fim da escala 6x1", "url": "https://www.metropoles.com/blog-do-noblat/artigos/bolsonarismo-articula-para-adiar-votacao-do-fim-da-escala-6x1", "fonte_id": "metropoles", "data_pub": "2026-08-24T15:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O bolsonarismo está planejando adiar a votação que visa extinguir a escala 6x1. A intenção é evitar o avanço desse projeto no Congresso.", "titulo_pt": "Bolsonarismo planeja adiar votação do fim da escala 6x1", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 120138, "titulo": "BRB autoriza ações contra ex-administradores envolvidos no caso Master e Reag", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/brb-autoriza-acoes-contra-ex-administradores-envolvidos-no-caso-master-e-reag.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T15:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os acionistas do BRB aprovaram a autorização para que o banco possa processar na justiça ex-administradores que sejam identificados como responsáveis por prejuízos causados à instituição financeira em operações relacionadas ao caso do Banco Master e da Reag.", "titulo_pt": "BRB autoriza ações judiciais contra ex-administradores envolvidos no caso Master e Reag", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 120139, "titulo": "INSS libera consignado sem biometria para aposentados", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/inss-libera-consignado-sem-biometria-para-aposentados.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T14:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aposentados e pensionistas do INSS sem biometria facial nas bases do governo federal agora podem contratar empréstimos consignados através do aplicativo Meu INSS, com acesso por dados bancários. A autorização foi liberada novamente para esse grupo.", "titulo_pt": "INSS libera consignado sem biometria para aposentados", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 120276, "titulo": "Paraná Pesquisas MT: No 1º turno, Pivetta tem 39% e Fagundes, 35%", "url": "https://www.cnnbrasil.com.br/eleicoes/parana-pesquisas-mt-no-1o-turno-pivetta-tem-39-e-fagundes-35/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-24T14:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O levantamento Paraná Pesquisas, referente ao primeiro turno, indica que Pivetta tem 39% dos votos e Fagundes tem 35%. A pesquisa ouviu 1.504 eleitores entre os dias 21 e 23 de agosto, com uma margem de erro de 2,6 pontos percentuais.", "titulo_pt": "Paraná Pesquisas MT: no 1º turno, Pivetta tem 39% e Fagundes, 35%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 120161, "titulo": "Deputado Kim Kataguiri apresenta projeto para obrigar candidatos a irem a debates", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/deputado-kim-kataguiri-apresenta-projeto-para-obrigar-candidatos-a-irem-a-debates.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-24T14:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Kim Kataguiri (Missão-SP) apresentou um projeto de lei que obriga candidatos às eleições majoritárias a participarem de debates promovidos por emissoras de rádio e TV.", "titulo_pt": "Deputado Kim Kataguiri apresenta projeto para obrigar candidatos a irem a debates", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 120162, "titulo": "Fuga de debate denota medo do contraditório", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/dora-kramer/2026/08/fuga-de-debate-denota-medo-do-contraditorio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-24T14:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos com maior visibilidade e rejeição nas pesquisas de opinião não participaram do primeiro debate televisivo da campanha. Eles alegaram razões estratégicas de proteção mútua para a não comparecimento.", "titulo_pt": "Fuga de debate mostra medo do contraditório", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 120163, "titulo": "PSD de SP não vai se opor a que seus prefeitos apoiem Tebet ao Senado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/psd-de-sp-nao-vai-se-opor-a-que-seus-prefeitos-apoiem-tebet-ao-senado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-24T14:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PSD, liderado por Gilberto Kassab, permitirá que seus prefeitos em São Paulo apoiem candidatos ao Senado fora da chapa oficial do partido, formada por Guilherme Derrite (PP) e André do Prado (PL).", "titulo_pt": "PSD de SP não se oporá hike Canada auto tariffs to 50% as trade war escalates", "url": "https://www.cnbc.com/2026/08/24/trump-canada-auto-tariffs-trade-war.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-24T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, declarou que os EUA aumentarão os impostos sobre as importações de carros, caminhões e peças automotivas do Canadá para 50% em 1º de janeiro de 2027.", "titulo_pt": "Trump anuncia aumento de tarifas para 50% em importações de veículos do canadá em 2027", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 120827, "titulo": "Mainland China’s ship activity near Taiwan hits record for third month in a row", "url": "https://www.scmp.com/news/china/military/article/3365081/mainland-chinas-ship-activity-near-taiwan-hits-record-third-month-row?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-24T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de embarcações governamentais da China continental perto da ilha de Taiwan atingiu níveis recordes por terceiro mês consecutivo. De acordo com a força de defesa de Taiwan, em 24 dias de agosto foram registradas 118 detecções de barcos de costeira, de pesquisa e outros navios oficiais, superando os números de julho e junho.", "titulo_pt": "Atividade de embarcações da China continental perto da Taiwan atinge recordes por terceiro mês consecutivo", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 120734, "titulo": "Houses set on fire as fresh violence erupts in India’s Manipur", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/24/houses-set-on-fire-as-fresh-violence-erupts-in-indias-manipur?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-24T14:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias casas foram incendiadas no estado indiano de Manipur, seguidas por tiros entre dois gr  de empresas como ExxonMobil e LyondellBasell para vender seus ativos químicos nos Estados Unidos, com potencial arrecadação de 8 bilhões de dólares. A empresa busca se desfazer de operações com desempenho abaixo do esperado.", "titulo_pt": "Shell recebe ofertas para vender ativos químicos nos EUA e pode arrecadar US$ 8 bi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 120144, "titulo": "Shein estima arrecadar US$ 1,7 bilhão com IPO na próxima semana", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/shein-estima-arrecadar-us-17-bilhao-com-ipo-na-proxima-semana.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T13:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Shein, uma empresa de moda online, planeja realizar uma oferta pública inicial de ações (IPO) em 1º de setembro na Bolsa de Hong Kong e espera arrecadar US$ 1,7 bilhão. A empresa anunciou isso na segunda-feira, 24 de setembro de 2026.", "titulo_pt": "Shein estima arrecadar US$ 1,7 bilhão com IPO na próxima semana", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 120402, "titulo": "Insegurança jurídica é custo econômico que precisa ser mensurado", "url": "https://www.jota.info/coberturas-especiais/jurisprudente/inseguranca-juridica-e-custo-economico-que-precisa-ser-mensurado", "fonte_id": "jota", "data_pub": "2026-08-24T13:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A insegurança jurídica tem impacto econômico significativo, demonstrado por decisões judiciais imprevistas, práticas de compliance excessivas e atrasos nos investimentos.", "titulo_pt": "Insegurança jurídica é custo econômico que precisa ser mensurado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 120145, "titulo": "Unicharm cresce 4,9% globalmente e prioriza expansão no Norte e Nordeste brasileiro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/unicharm-cresce-49-globalmente-e-prioriza-expansao-no-norte-e-nordeste-brasileiro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Unicharm, multinacional japonesa, registrou crescimento de 4,9% no faturamento global no primeiro semestre de 2026. A empresa prioriza a expansão nas regiões Norte e Nordeste do Brasil na estratégia para a América Latina.", "titulo_pt": "Unicharm cresce 4,9% globalmente e destaca expansão no Norte e Nordeste brasileiro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 120404, "titulo": "Quem vai executar a reforma tributária?", "url": "https://www.jota.info/coberturas-especiais/pulso-da-reforma/quem-vai-executar-a-reforma-tributaria", "fonte_id": "jota", "data_pub": "2026-08-24T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A transição também requer o planejamento das relações de trabalho. O texto original sugere que planejamento adicional é necessário além da reforma tributária.", "titulo_pt": "Quem vai executar a reforma tributária?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 120147, "titulo": "Ações da Alibaba despencam 8,5% e puxam queda nas Bolsas da Ásia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466759", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T12:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações da Alibaba caíram 8,54% na sessão de segunda-feira, após a empresa anunciar a venda de ações no valor de 80 bilhões de dólares de Hong Kong. A queda foi motivada pela oferta de ações primária, destinada a financiar o desenvolvimento relacionado à inteligência artificial.", "titulo_pt": "Ações da Alibaba caem 8,5% após oferta de ações para financiar inteligência artificial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 120151, "titulo": "Economistas reduzem previsão do PIB neste ano", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/economistas-reduzem-previsao-do-pib-neste-ano.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T12:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os economistas ajustaram suas previsões para o PIB brasileiro em 2026, projetando um desempenho econômico mais fraco do que o previsto anteriormente.", "titulo_pt": "Economistas reduzem previsão do PIB em 2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 120410, "titulo": "Reflexões sobre o mercado de capitais a partir do recente caso Oncoclínicas", "url": "https://www.jota.info/opiniao-e-analise/artigos/reflexoes-sobre-o-mercado-de-capitais-a-partir-do-recente-caso-oncoclinicas", "fonte_id": "jota", "data_pub": "2026-08-24T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute o papel das OPA estatutárias, do ativismo corporativo e das minorias acionistas, enfatizando a tensão entre a proteção legal desses grupos e as conveniências oportunistas.", "titulo_pt": "Reflexões sobre o mercado de capitais a partir do recente caso Oncoclínicas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 120411, "titulo": "ESG segue em ambiente polarizado", "url": "https://www.jota.info/opiniao-e-analise/colunas/praticas-esg/esg-segue-em-ambiente-polarizado", "fonte_id": "jota", "data_pub": "2026-08-24T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A discussão sobre ESG (Responsabilidade Social, Meio Ambiente e Governança) continua polarizada nos Estados Unidos. No entanto, há avanços nas regulamentações relacionadas a ESG na Europa e no Brasil.", "titulo_pt": "ESG em ambiente polarizado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 120988, "titulo": "S. Korean won hits 13-month high as dollar selling continues", "url": "https://en.yna.co.kr/view/AEN20260824008900320", "fonte_id": "yonhap_news", "data_pub": "2026-08-24T07:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano atingiu um nível próximo ao de 13 meses contra o dólar, devido à continuação da venda desse último.", "titulo_pt": "Won sul-coreano atinge nível próximo há 13 meses contra o dólar", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 120807, "titulo": "Japan’s power prices climb to highest since 2023 on heat wave", "url": "https://www.japantimes.co.jp/business/2026/08/24/economy/japan-power-prices-heat-wave/", "fonte_id": "japan_times", "data_pub": "2026-08-24T07:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços da energia elétrica no Japão aumentaram em 20% em comparação com a semana anterior, alcançando 25,18 ienes por quilowatt-hora, o maior valor desde janeiro de 2023. Este aumento ocorreu devido a uma onda de calor.", "titulo_pt": "Preços da energia no Japão atingem nível mais alto desde 2023 em meio a uma onda de calor", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 120992, "titulo": "(URGENT) Seoul stocks close over 3 pct lower on chip sell-off", "url": "https://en.yna.co.kr/view/AEN20260824006700320", "fonte_id": "yonhap_news", "data_pub": "2026-08-24T06:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As bolsas de valores de Seul fecharam com uma queda superior a 3%, principalmente devido à venda de chips.", "titulo_pt": "Seul registra queda superior a 3% nas bolsas devido à venda de chips", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 119871, "titulo": "A ‘democratised’ financial crisis is still a crisis", "url": "https://www.ft.com/content/f3f51071-3c6e-49ee-a984-92d8d7af99b2?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-24T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O boom de seguros de crédito privado pode ter custos ocultos. Uma crise financeira democratizada ainda é uma crise.", "titulo_pt": "A 'crise financeira democratizada' ainda é uma crise", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 120137, "titulo": "Yahoo quer conquistar geração Z com ferramenta própria de IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/yahoo-quer-conquistar-geracao-z-com-ferramenta-propria-de-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T15:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Yahoo está buscando atrair a geração Z com uma ferramenta de inteligência artificial própria e outros produtos destinados aos consumidores. A empresa, apoiada pela Apollo, deseja se posicionar como um vencedor na era da IA.", "titulo_pt": "Yahoo quer conquistar geração Z com ferramenta de IA própria", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 120830, "titulo": "Chinese tech, pharma firms eye Hong Kong as springboard for global expansion", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3365100/chinese-tech-pharma-firms-eye-hong-kong-springboard-global-expansion?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-24T14:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas chinesas de tecnologia e farmacêuticas estão utilizando Hong Kong como plataforma para expandir globalmente, de acordo com líderes da indústria. Durante uma viagem de seis dias pelo Grande Bay Area, organizada pelo Escritório das Relações entre Hong Kong e Macau, foi discutido o possível investimento de uma grande empresa estatal farmacêutica na mega-projeto Metrópole do Norte de Hong Kong.", "titulo_pt": "Empresas chinesas veem Hong Kong como plataforma para expansão global", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 120140, "titulo": "Estados Unidos aceleram investimentos em IA e deixam Europa para trás", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/estados-unidos-aceleram-investimentos-em-ia-e-deixam-europa-para-tras.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-24T14:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O investimento empresarial nos Estados Unidos está crescendo mais de três vezes mais rápido do que na Europa desde a pandemia, de acordo com projeções que destacam a disparidade na adoção da inteligência artificial entre as duas economias.", "titulo_pt": "Estados Unidos aceleram investimentos em IA e deixam Europa para trás", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 120851, "titulo": "How to encourage smarter AI use in the classroom", "url": "https://www.technologyreview.com/2026/08/24/1142630/ai-school-classroom-policies/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-24T14:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute como promover o uso mais inteligente de IA nas salas de aula. Antes do lançamento de chatbots, muitas escolas foram surpreendidas, pois os alunos podiam usar aplicativos que respondiam a quase qualquer pergunta.", "titulo_pt": "Como promover o uso mais inteligente de IA nas salas de aula", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 120902, "titulo": "What It Takes to Be an Adaptable Engineer", "url": "https://spectrum.ieee.org/adaptable-engineer-core-skills", "fonte_id": "ieee_spectrum", "data_pub": "2026-08-24T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A onda de inteligência artificial tem alterado a maneira como os engenheiros trabalham, introduzindo novas ferramentas e aumentando as expectativas dos times. Diante dessa incerteza, a orientação para os jovens profissionais é frequentemente voltada para a adaptação. No entanto, a prática de como ser adaptável ainda é questionada.", "titulo_pt": "O que é ser um engenheiro adaptável?", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 120834, "titulo": "EV maker Xpeng set to challenge Tesla in embodied AI after robotics unit raises US$900m", "url": "https://www.scmp.com/business/china-evs/article/3365096/ev-maker-xpeng-set-challenge-tesla-embodied-ai-after-robotics-unit-raises-us900m?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-24T13:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa chinesa de veículos elétricos Xpeng levantou US$ 900 milhões com investidores notáveis, como o Alibaba Group Holding e a IDG Capital, para impulsionar sua unidade de robótica. A subordinada Dogotix da Xpeng levantou US$ 900 milhões nessa rodada de financiamento, avaliando-a em US$ 6,3 bilhões.", "titulo_pt": "Fabricante de veículos elétricos Xpeng prepara-se para desafiar Tesla com unidade de robótica que levantou US$ 900 milhões", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 120232, "titulo": "Hugging Face pode ser vendida por US$ 13 bilhões após recusar aporte da Nvidia", "url": "https://exame.com/inteligencia-artificial/hugging-face-pode-ser-vendida-por-us-13-bilhoes-apos-recusar-aporte-da-nvidia/", "fonte_id": "exame", "data_pub": "2026-08-24T12:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Hugging Face, uma empresa de tecnologia, pode ser vendida por cerca de 13 bilhões de dólares. A empresa já havia rejeitado um investimento de 500 milhões de dólares da Nvidia para evitar um investidor dominante.", "titulo_pt": "Hugging Face pode ser vendida por 13 bilhões após recusar investimento da Nvidia", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 120852, "titulo": "The Download: kids outlearning AI, and space travel agents", "url": "https://www.technologyreview.com/2026/08/24/1142863/the-download-kids-outlearning-ai-space-travel-agents/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-24T12:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nas últimas notícias, crianças estão aprendendo mais rápido do que os sistemas de inteligência artificial. O motivo exato para esse fenômeno ainda não é claro. O processamento de linguagem natural requer uma quantidade imensa de dados, e um único sistema de inteligência de linguagem de máquina pode facilmente lidar com centenas de milhares de vezes mais dados.", "titulo_pt": "Download do dia: crianças superando a IA e agentes de viagens espaciais", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 120241, "titulo": "Após Huawei, Xiaomi lança chip para smartphone visando reduzir dependência de fornecedores", "url": "https://exame.com/tecnologia/apos-huawei-xiaomi-lanca-chip-para-smartphone-visando-reduzir-dependencia-de-fornecedores/", "fonte_id": "exame", "data_pub": "2026-08-24T11:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Xiaomi lançou o chip Xring O3, fabricado pela TSMC em processo de 3 nanômetros, concorrendo com Qualcomm e MediaTek. No entanto, a empresa ainda depende fortemente de fornecedores estrangeiros e não está sob sanções americanas como a Huawei.", "titulo_pt": "Xiaomi lança chip para smartphone visando reduzir dependência de fornecedores", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 120903, "titulo": "Building Technology People Can Trust", "url": "https://spectrum.ieee.org/ai-connected-test-and-measurement-platforms", "fonte_id": "ieee_spectrum", "data_pub": "2026-08-24T11:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor, engenheiro com experiência no setor de semicondutores, destaca que a inovação sempre cria complexidade. Ele afirma que cada geração de tecnologia de semicondutores traz avanços em desempenho e capacidade, mas aumenta a dificuldade de compreender o comportamento do sistema. O autor sugere que o futuro da engenharia dependerá da capacidade de lidar com essa complexidade.", "titulo_pt": "Tecnologia que as pessoas podem confiar", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 120250, "titulo": "Por que o SoftBank vai captar US$ 6,3 bilhões para investir em inteligência artificial", "url": "https://exame.com/inteligencia-artificial/por-que-o-softbank-vai-captar-us-63-bilhoes-para-investir-em-inteligencia-artificial/", "fonte_id": "exame", "data_pub": "2026-08-24T10:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O SoftBank, grupo japonês, planeja captar US$ 6,3 bilhões através da emissão de títulos para financiar investimentos em inteligência artificial, incluindo compromissos com a OpenAI.", "titulo_pt": "Por que o SoftBank vai captar US$ 6,3 bilhões para investir em inteligência artificial", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 120253, "titulo": "Vendas na era digital: como a inteligência artificial revoluciona a gestão do CRM", "url": "https://exame.com/inteligencia-artificial/vendas-na-era-digital-como-a-inteligencia-artificial-revoluciona-a-gestao-do-crm/", "fonte_id": "exame", "data_pub": "2026-08-24T10:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ferramentas integradas ao CRM usam inteligência artificial para analisar comportamentos do consumidor e fornecer dados importantes, auxiliando os profissionais de vendas a anteciparem as próximas ações dos clientes.", "titulo_pt": "Vendas na era digital: como a inteligência artificial transforma a gestão do CRM", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 120894, "titulo": "Forget Meta Ray-Bans. These Dorky-Looking Virtual Display Glasses Are Way More Useful", "url": "https://www.wired.com/story/all-work-and-some-play-in-a-virtual-display/", "fonte_id": "wired", "data_pub": "2026-08-24T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os óculos de exibição conectados são computadores de face verdadeiramente práticos. Eles sacrificam o computador espacial volumoso por simplicidade: conecte, se recoste e obtenha uma tela gigante direto diante do seu nariz.", "titulo_pt": "Esqueça as Ray-Bans Meta. Esses óculos difíceis de verificar são muito mais úteis", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 120595, "titulo": "The UAE is fighting AI hackers with AI of its own", "url": "https://restofworld.org/2026/uae-ai-cyberattacks-cyber-factory-defenses/?utm_source=rss&utm_medium=rss&utm_campaign=feeds", "fonte_id": "rest_of_world", "data_pub": "2026-08-24T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os ataques a sistemas bancários, aeroportuários e de energia do país aumentaram desde o início da guerra com a Irã. Em resposta, o Emirado Árabe Unido está desenvolvendo uma indústria de segurança baseada em IA.", "titulo_pt": "UAE combate hackers de IA com sua própria IA", "veiculo": "Rest of World", "pais": "EUA", "classe": "A"}, {"id": 120896, "titulo": "They Dedicated Their Lives to Teaching. Then the Deepfakes Started", "url": "https://www.wired.com/story/teachers-deepfake-ai-students-content/", "fonte_id": "wired", "data_pub": "2026-08-24T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quatro professores relataram para a WIRED como se tornaram alvos de conteúdo sexualizado gerado por inteligência artificial e como foi difícil encontrar responsabilidade por isso.", "titulo_pt": "Epidemia de Deepfakes atinge professores", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 120712, "titulo": "From AI tools to alcohol drops: The unexpected forces driving America's crime decline", "url": "https://www.axios.com/2026/08/24/violent-crime-decline-theories", "fonte_id": "axios", "data_pub": "2026-08-24T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos estão experimentando uma das maiores e mais amplas reduções na criminalidade em sua história moderna. Embora os pesquisadores não saibam exatamente o motivo, sugerem que uma combinação de fatores, como o uso decrescente de álcool e drogas desde a pandemia de COVID-19, tecnologia policial baseada em IA que facilita a captura de suspeitos, uma população mais idosa, ações mais rigorosas e outras variáveis possam estar contribuindo para essa redução.", "titulo_pt": "De ferramentas de IA a gotas de álcool: as forças imprevistas que estão reduzindo a criminalidade nos EUA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 120455, "titulo": "Christina Koch, astronauta de Artemis II: “No hay nada que te prepare para la impresionante sensación de ver tu planeta iluminado como si fuera de día”", "url": "https://www.lanacion.com.ar/el-mundo/christina-koch-astronauta-de-artemis-ii-no-hay-nada-que-te-prepare-para-la-impresionante-sensacion-nid23082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-24T15:22:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Christina Koch, uma astronauta da NASA, expressou a impressionante sensação de ver a Terra iluminada enquanto realizava a missão Artemis II. Nada a prepara para essa experiência.", "titulo_pt": "Christina Koch, astronauta da Artemis II: 'nada te prepara para a sensação impressionante de ver a terra iluminada como se fosse de dia'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 120975, "titulo": "Spirit Electronics Adds Texas Instruments and Microchip Technology Space Grade Components to Online Store Ahead of SmallSat 2026", "url": "https://spacenews.com/spirit-electronics-adds-texas-instruments-and-microchip-technology-space-grade-components-to-online-store-ahead-of-smallsat-2026/", "fonte_id": "spacenews", "data_pub": "2026-08-24T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Spirit Electronics, uma distribuidora de eletrônicos de alta confiabilidade focada em requisitos de programa direcionados para desempenho, anunciou a inclusão de componentes de espaço grade da Texas Instruments e da Microchip Technology em sua loja online antes do SmallSat 2026.", "titulo_pt": "Spirit Electronics adiciona componentes espaço Grade da Texas Instruments e da Microchip Technology em loja Online antes de SmallSat 2026", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 120978, "titulo": "Heat therapy for sick frogs lowers sperm levels", "url": "https://www.sciencenews.org/article/infection-treatment-lowers-frog-sperm", "fonte_id": "science_news", "data_pub": "2026-08-24T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tratamento térmico usado para combater uma infecção fúngica letal em rãs pode reduzir seus níveis de espermatozoides. Este tratamento, frequentemente empregado pelos cientistas, pode ter um custo adicional nos machos das rãs.", "titulo_pt": "Terapia térmica para rãs doentes reduz níveis de espermatozoides", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 120906, "titulo": "STAT+: Lady Gaga and her fiancé launch a biotech startup", "url": "https://www.statnews.com/2026/08/24/biotech-news-lady-gaga-and-her-fiance-launch-biotech-startup/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-24T14:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lady Gaga e seu noivo lançaram uma startup de biotecnologia. A FTC desafiou a estratégia de patentes da Amgen em relação ao Enbrel, e há avanços no caminho para a vacina contra câncer da Moderna e Merck.", "titulo_pt": "Lady Gaga e seu noivo lançam startup de biotecnologia", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 120514, "titulo": "Científicos chilenos idean revolucionaria forma de extraer contaminantes farmacéuticos de aguas residuales", "url": "https://www.latercera.com/educacion/noticia/cientificos-chilenos-idean-revolucionaria-forma-de-extraer-contaminantes-farmaceuticos-de-aguas-residuales/", "fonte_id": "la_tercera", "data_pub": "2026-08-24T14:25:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Cientistas da Universidade das Américas desenvolveram uma técnica inovadora para remover resíduos de medicamentos, como antibióticos e analgésicos, das águas residuais. A proposta utiliza líquidos iônicos como alternativa eficaz, já que as estações de tratamento não estão preparadas para essa tarefa.", "titulo_pt": "Cientistas chilenos desenvolvem técnica inovadora para remover resíduos de medicamentos das águas residuais", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 120907, "titulo": "STAT+: Public-sector purgatory, and a union-hospital fight", "url": "https://www.statnews.com/2026/08/24/public-sector-workers-health-insurance-costs-hospital-union-battle/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-24T14:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aon, uma grande empresa de consultoria e corretagem, prevê que os encargos com planos de saúde baseados em empregos serão extremamente difíceis para as empresas em 2027. O chefe atuário da Aon afirmou que as empresas precisarão lidar com esse desafio.", "titulo_pt": "Purgatório público e conflito hospital-união", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 120976, "titulo": "The Fuel for the Next Generation of Cislunar Exploration? Technology and Talent.", "url": "https://spacenews.com/the-fuel-for-the-next-generation-of-cislunar-exploration-technology-and-talent/", "fonte_id": "spacenews", "data_pub": "2026-08-24T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Após os astronautas da NASA terem pousado na Lua em 1969, seu feito gerou descobertas científicas e vantagens estratégicas nacionais ao longo das décadas seguintes. Agora, com planos para a próxima geração de exploração cislunar, a tecnologia e os talentos humanos são considerados cruciais.", "titulo_pt": "O combustível para a próxima geração de exploração Cislunar? Tecnologia e talentos", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 120908, "titulo": "STAT+: Pharmalittle: We’re reading about Medicaid obesity-drug coverage, a Regenxbio gene therapy, and more", "url": "https://www.statnews.com/pharmalot/2026/08/24/state-medicaid-obesity-drugs-regenxbio-gene-therapy/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-24T13:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O compromisso do presidente Trump de tornar medicamentos caros para perda de peso mais acessíveis para americanos de baixa renda através do Medicaid não está se concretizando.", "titulo_pt": "Pharmalittle: estamos lendo sobre a cobertura de medicamentos contra obesidade pelo Medicaid, uma terapia genética Regenxbio e mais", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 120833, "titulo": "Meet Dai Zheng, the space veteran betting on China’s reusable rocket revolution", "url": "https://www.scmp.com/tech/tech-trends/article/3365091/meet-dai-zheng-space-veteran-betting-chinas-reusable-rocket-revolution?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-24T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dai Zheng, um veterano espacial que deixou um emprego seguro na programação espacial estatal chinesa para se juntar a uma start-up privada inovadora, viu seu esforço recompensado em 19 de agosto com o primeiro pouso vertical bem-sucedido de um foguete reutilizável na história do espaço comercial chinês. Este sucesso marca um importante marco pessoal para Dai e um avanço crucial na revolução dos foguetes reutilizáveis da China.", "titulo_pt": "Conheça Dai Zheng, o veterano espacial apostando na revolução dos foguetes reutilizáveis da China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 120979, "titulo": "Personalized brain stimulation can ease chronic pain", "url": "https://www.sciencenews.org/article/brain-stimulation-chronic-pain", "fonte_id": "science_news", "data_pub": "2026-08-24T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma sessão de mapeamento cerebral de uma semana pode levar a alívio duradouro, conforme mostrado em uma série de casos com três pacientes com dor crônica.", "titulo_pt": "Estimulação cerebral personalizada pode aliviar dor crônica", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 120909, "titulo": "FDA plans to regulate generative AI", "url": "https://www.statnews.com/2026/08/24/health-news-fda-plans-to-regulate-generative-ai/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-24T12:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA (Agência de Vigilância Sanitária dos EUA) está planejando regular a inteligência artificial gerativa. Novas informações sobre os planos de vacinação do filho de RFK Jr., um obstáculo para os enfermeiros auxiliares, e outras notícias de saúde do programa Morning Rounds foram mencionadas.", "titulo_pt": "FDA planeja regular inteligência artificial gerativa", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 120977, "titulo": "Tory Bruno Named Honorary Chair Of World Space Week 2027", "url": "https://spacenews.com/tory-bruno-named-honorary-chair-of-world-space-week-2027/", "fonte_id": "spacenews", "data_pub": "2026-08-24T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tory Bruno, presidente de Segurança Nacional da Blue Origin, será o Chair Honório da World Space Week em 2027. A notícia foi divulgada pela World Space Week Association.", "titulo_pt": "Tory Bruno nomeado Chair honório da World Space Week 2027", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 120910, "titulo": "STAT+: FDA pauses Regenxbio gene therapy trial est-protections-face-rollback/", "fonte_id": "scientific_american", "data_pub": "2026-08-24T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A mudança climática está abrindo rotas marítimas no Ártico, enquanto medidas de proteção de florestas e áreas sem estradas podem ser revogadas. O mundo está enfrentando realidades de um clima em ação, incluindo mudanças climáticas e extremos meteorológicos.", "titulo_pt": "Clima abrindo rotas marítimas no ártico enquanto medidas de proteção de florestas podem ser revogadas", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 121026, "titulo": "BBCSSO/Canellakis review – electrifying trio of women unleash the horror in Strauss’s Elektra", "url": "https://www.theguardian.com/stage/2026/aug/24/bbcsso-canellakis-review-usher-hall-edinburgh-strauss-elektra", "fonte_id": "guardian_culture", "data_pub": "2026-08-24T15:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma orquestra de 111 músicos, conduzida por Karina Canellakis, interpretou a obra de Richard Strauss 'Elektra' em uma apresentação no Usher Hall, em Edimburgo. A noite foi dominada pelas performances das cantoras, que deram vida até aos papéis mais pequenos de forma excepcional.", "titulo_pt": "BBCSSO/Canellakis: trio de mulheres mulheres dominam a horrorosa 'Elektra' de Strauss", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 121020, "titulo": "‘A rock star on her own terms’: why we’re still so fascinated by Meg White", "url": "https://www.theguardian.com/music/2026/aug/24/meg-white-white-stripes-fascination", "fonte_id": "guardian_culture", "data_pub": "2026-08-24T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Recentes tentativas erradas de revelar o paradeiro da cantora e baterista dos White Stripes refletem a nossa ainda persistente fascinação por ela. Em fevereiro de 2011, a banda anunciou que não iria mais toc  "2026-08-24T13:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor descreve como a série 'Red Riding' foi adaptada dos livros de David Peace. A série retrata a brutalidade do crime em Yorkshire sem exageros, usando cenas realistas como carros queimados e carrinhos de supermercado derrubados. O autor foi atraído pela intensidade e realismo dos livros, especialmente em relação aos casos de Peter Sutcliffe e Stefan Kiszko.", "titulo_pt": "Melhor que o padrinho: como criamos o clássico brutal de crime de Yorkshire Red Riding", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 120156, "titulo": "Acrobata processa Cirque du Soleil em US$ 16 milhões após queda em espetáculo", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/08/acrobata-processa-cirque-du-soleil-em-us-16-milhoes-apos-queda-em-espetaculo.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-24T13:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A acrobata russa Mariia Konfektova, de 28 anos, está processando o Cirque du Soleil por um acidente ocorrido durante um espetáculo em Portland, EUA, pedindo US$ 16,75 milhões. O incidente aconteceu há dois anos e resultou em danos corporais para a artista.", "titulo_pt": "Acrobata processa Cirque du Soleil após queda em espetáculo em portland", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 121022, "titulo": "Gaza documentary produced by the Guardian to receive world premiere at Venice film festival", "url": "https://www.theguardian.com/film/2026/aug/24/gaza-documentary-produced-by-the-guardian-to-receive-world-premiere-at-venice-film-festival", "fonte_id": "guardian_culture", "data_pub": "2026-08-24T13:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um documentário sobre a campanha de bombardeios de Israel em Gaza, dirigido por Yuval Abraham e Rachel Szor e produzido ur questions for Alex Winter", "url": "https://www.theguardian.com/film/2026/aug/24/post-your-questions-for-alex-winter-the-lost-boys-and-bill-and-ted", "fonte_id": "guardian_culture", "data_pub": "2026-08-24T12:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alex Winter, conhecido por papéis em The Lost Boys e Bill & Ted, responderá a perguntas dos fãs. Ele teve uma carreira multifacetada, incluindo atuações no teatro e na tela, além de trabalhos na frente das câmeras e no palco.", "titulo_pt": "Pergunte a Alex Winter", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 121029, "titulo": "Race Across the World star Jo Gardiner dies a year after son", "url": "https://www.theguardian.com/tv-and-radio/2026/aug/24/jo-gardiner-race-across-the-world-star-dies", "fonte_id": "guardian_culture", "data_pub": "2026-08-24T12:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jo Gardiner, fisioterapeuta de 61 anos que competiu no programa Race Across the World com seu filho Sam em 2020, morreu após uma longa batalha contra o câncer. Ela faleceu um ano após o filho co-estrela Sam falecer em um acidente de carro.", "titulo_pt": "Estrela do race Across the World Jo Gardiner morre um ano após filho", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 121031, "titulo": "Academy of St Martin in the Fields/Marquise Gilmore review – bassoon earns its spotlight in Thea Musgrave’s Out of the Darkness", "url": "https://www.theguardian.com/music/2026/aug/24/academy-of-st-martin-in-the-fields-marquise-gilmore-thea-musgrave-proms-royal-albert-hall-london", "fonte_id": "guardian_culture", "data_pub": "2026-08-24T12:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Thea Musgrave, compositora escocesa de 98 anos, estreou seu novo concerto para bassoon chamado 'Out of the Darkness' no Royal Albert Hall, em Londres. O concerto marca um momento especial na carreira da compositora,
