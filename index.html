<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

sas acusações, feitas pelos Estados Unidos, envolvem supostas torturas sofridas por cidadãos norte-americanos durante seu governo. Em outro desenvolvimento, a startup francesa Sesterce planeja construir um gigantesco centro de dados no valor de 10 bilhões de euros em Jamsa, refletindo o crescimento do setor de TI e inteligência artificial. No entanto, a situação política nos Estados Unidos continua tensa, com o ex-secretário de Defesa Mark Esper acreditando que a guerra com a Irã não terá um fim imediato, beneficiando seu 'maior adversário'.\n\nOs Estados Unidos impuseram novas sanções à frota de navios de petróleo do Irã, uma ação adicional para aumentar a pressão sobre Teerã. Além disso, Israel realizou ataques aéreos e tiroteios na Faixa de Gaza, resultando em pelo menos cinco mortes. O presidente dos Estados Unidos, Joe Biden, declarou que o país não realizará ataques ao Irã antes das eleições gerais de 3 de novembro. Em outro desenvolvimento, um general sírio acusado de crimes contra a humanidade está sendo hospedado e financiado pelos Estados Unidos e autoridades libanesas, conforme uma investigação conjunta da NPR e BBC. O preço do petróleo Brent atingiu US$ 104 por barril após relatos de que o presidente dos Estados Unidos e sua equipe de segurança nacional estavam discutindo possíveis ataques militares ao Irã.", "economia": "Os rendimentos do Tesouro dos Estados Unidos estão em baixa após atingirem máximos multi-anos, refletindo a incerteza entre os traders em relação ao resultado de um leilão de títulos de dívida de longo prazo. Comentários de um alto funcionário do Federal Reserve também influenciaram este movimento. Em outro desenvolvimento, a Receita Federal enviou cartas a 498 mil contribuintes com declarações retidas na malha fina, incentivando a regularização voluntária. No cenário internacional, há preocupação nos Estados Unidos sobre a situação econômica da França, onde investidores americanos detêm cerca de 3% a 4% da dívida do país. A situação econômica dos Estados Unidos também está sendo afetada por uma série de questões, incluindo a proibição das apostas, que afetou fábricas de bonés no Rio Grande do Norte. Além disso, a Petrobras registrou ganhos com a alta do petróleo, influenciada pelas tensões no Oriente Médio, enquanto a Uniqlo se aproxima da H&M na liderança global do varejo de roupas. O Banco Central do Japão (BOJ) elevou sua avaliação econômica para a região de Tohoku e Shikoku, devido à forte demanda relacionada à inteligência artificial. A OMC dobrou suas projeções para o crescimento do comércio global de mercadorias, considerando o impacto da inteligência artificial, e a Petrobras registrou ganhos com a alta do petróleo, influenciada pelas tensões no Oriente Médio.", "tecnologia": "A OpenAI está enfrentando acusações de uso não autorizado de conteúdos publicados por jornais, com a USA Today e outros processando a empresa por supostamente ter copiado 'centenas de milhares' de artigos para treinar seus modelos de inteligência artificial. Além disso, a receita anualizada da OpenAI foi revisada para cerca de 20 bilhões de dólares, bem menos do que os 50 bilhões de dólares antecipados. Em outro desenvolvimento, a Anthropic está implementando mudanças em sua política de uso, proibindo comportamento abusivo e cruel persistente em relação ao Claude, refletindo casos recentes de má utilização. A B3, bolsa de valores brasileira, está em processo para se tornar uma PSAV no Banco Central, com a emissão de ações tokenizadas programada para janeiro, mas a liquidação 24 horas por dia depende da regulação.", "ciencia": "A missão SpaceX Crew-12, que durou mais de sete meses na Estação Espacial Internacional, pousou com segurança no Oceano Pacífico. Os tripulantes irão discutir sua missão científica em uma conferência de imprensa no Centro Espacial Johnson, em Houston. Entre as outras notícias científicas, destacam-se o desenvolvimento de uma nova técnica de imagens elétricas para monitorar o movimento celular, o mapeamento de marcadores genéticos associados à longevidade em uma tartaruga de 194 anos, e um estudo que sugere que jejum antes de exames de sangue não é necessário. Além disso, a NASA e o Departamento de Energia dos EUA avançam no desenvolvimento de tecnologias nucleares para exploração espacial.", "cultura": "Anne Carson, escritora canadense de 76 anos, foi premiada com o Nobel de Literatura em 2026, reconhecida por sua obra ousada e inovadora que criou novas formas para a literatura contemporânea. Após a divulgação do prêmio, as buscas por Carson aumentaram, e a Academia Sueca anunciou a notícia na quinta-feira, 8 de agosto de 2026. A escritora, conhecida por misturar poesia, ficção e produção acadêmica, é celebrada por transpor barreiras entre diferentes formas literárias. Além disso, a Record está produzindo uma nova série bíblica sobre Sansão, com a filha de Edir Macedo como uma das autoras, e o Lollapalooza 2027 incluirá performances de artistas como Charli XCX, Travis Scott e Selena Gomez.", "sociedade": "Milhares de pessoas marcham por Madri em memória de María del Carmen Abascal, uma pensionista de 87 anos cuja expulsão levou a protestos nacionais sobre a crise imobiliária na Espanha. O caso de Abascal, que resultou em um aumento de 230% no aluguel do seu apartamento, se tornou o rosto público da crise. Centenas de pessoas se manifestaram perto do parlamento espanhol em Madri para homenagear Abascal e exigirem ações sobre a crise imobiliária. Em outro evento, jovens e adultos em Paris e outras cidades francesas protestam contra prédios escolares em ruínas e a escassez de professores, além de chamar a atenção para desigualdades educacionais mais amplas. O movimento, liderado por jovens, já dura três semanas e expõe tensões profundas na França entre as demandas populares por investimentos em serviços públicos deteriorados e um governo economicamente estressado sob pressão para reduzir sua dívida e déficit.", "meio_ambiente": "A ONU alertou para um dos El Niño mais intensos da história, com temperaturas marítimas recordes em dezembro de 2026. Este evento deve persistir até fevereiro de 2027, afetando significativamente o meio ambiente e a economia global. Paralelamente, a população de tartarugas gigantes de Aldabra, na ilha de Aldabra, nos Seychelles, atingiu um recorde de 180.000 animais, resultado de um programa de recuperação que durou décadas. Essa espécie, que estava em perigo de extinção, está prosperando em um atol do Oceano Índico. Além disso, a Unicef alerta que as crianças serão impactadas 'desproporcionalmente' pelo El Niño, devido à sua vulnerabilidade em face das mudanças climáticas urgentes.", "direitos_humanos": "Os Estados Unidos apresentaram novas acusações contra Nicolás Maduro e sua esposa, acusados de organizar a tortura de pessoas detidas pelo regime venezuelano. Além disso, Maduro e Flores foram acusados de tráfico de drogas e de armas após serem capturados em uma operação militar em Caracas. Em outro desenvolvimento, um projeto de lei filipino que expande a lei de espionagem para incluir atividades durante o tempo de paz está levantando preocupações sobre a possibilidade de silenciamento da livre expressão. No Brasil, o deputado federal Fábio Felix (PSOL) reagiu a uma declaração do presidente nacional do Partido Liberal, Valdemar Costa Neto, classificando-a como homofobia. Em um caso judicial, um juízo determinou que o líder de uma organização religiosa controversa e sua organização devem compensar 370 milhões de wons a três mulheres estupradas pelo líder. Além disso, mulheres da geração Z urbanas na Índia estão se manifestando contra uma série de estupros em sua capital, rejeitando serem intimidadas ou policiadas em relação ao seu vestuário."}, "resumo_do_dia": {"politica_nacional": [{"id": 202815, "titulo": "MDB marca para terça-feira anúncio de apoio a Flávio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/mdb-marca-para-terca-feira-anuncio-de-apoio-a-flavio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O MDB planeja anunciar, na próxima terça-feira (13), o apoio da maioria de seus diretórios regionais à candidatura presidencial de Flávio Bolsonaro. A informação foi antecipada pelo Painel.", "titulo_pt": "MDB marca para terça-feira anúncio de apoio a Flávio bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 202859, "titulo": "'Ainda há tempo de a esquerda dominar as redes sociais', diz deputada mineira Ana Elisa", "url": "https://g1.globo.com/politica/blog/andreia-sadi/post/2026/10/08/ana-elisa-entrevista-estudio-i.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-08T17:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada federal Ana Elisa, eleita pelo PT em Minas Gerais, afirmou que ainda há oportunidade para a esquerda dominar as redes sociais. Ela considera que a eleição demonstrou que as redes sociais são um instrumento de votação e que há um cansaço com a política tradicional.", "titulo_pt": "Ainda há tempo para a esquerda dominar as redes sociais, diz deputada mineira", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 203114, "titulo": "Mendonça muda de posição, e TSE derruba posts de Flávio que associam Lula a crime organizado", "url": "https://www.jota.info/eleicoes/eleicoes-2026/mendonca-muda-de-posicao-e-tse-derruba-posts-de-flavio-que-associam-lula-a-crime-organizado", "fonte_id": "jota", "data_pub": "2026-10-08T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Justiça e Segurança Pública, Augusto Aras, alterou sua posição. O Tribunal Superior Eleitoral (TSE) invalidou publicações do senador Flávio Bolsonaro que ligavam o ex-presidente Lula a atividades de crime organizado.", "titulo_pt": "Mendonça muda de posição e TSE derruba posts de Flávio associando Lula a crime organizado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 202816, "titulo": "Renan Santos modula discurso e interage com 'esquerdistas' como contraponto a Flávio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/renan-santos-modula-discurso-e-interage-com-esquerdistas-como-contraponto-a-flavio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Renan Santos, derrotado no primeiro turno presidencial, mudou seu discurso e passou a interagir com seguidores de esquerda nas redes sociais, como contraponto a Flávio Bolsonaro. Ele também ganhou visibilidade nas redes de Anitta após essa mudança de estratégia.", "titulo_pt": "Renan Santos ajusta discurso e interage com 'esquerdistas' como contraponto a Flávio bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 202836, "titulo": "Diarista, manicure e jardineiro não terão que abrir CNPJ e nem emitir nota, diz ministro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/10/diarista-manicure-e-jardineiro-nao-terao-que-abrir-cnpj-e-nem-emitir-nota-diz-ministro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Dario Durigan (Fazenda) negou que pessoas como diaristas, manicures e jardineiros tenham que abrir CNPJ ou emitir notas fiscais. Essa informação foi divulgada erroneamente na internet.", "titulo_pt": "Diarista, manicure e jardineiro não terão que abrir CNPJ e nem emitir nota, diz ministro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 202817, "titulo": "Marqueteiro de novo governador do PA diz que campanha 'Davi contra Golias' ajudou em vitória sobre clã Barbalho", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/marqueteiro-de-novo-governador-do-pa-diz-que-campanha-davi-contra-golias-ajudou-em-vitoria-sobre-cla-barbalho.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O marqueteiro da campanha do novo governador do Pará, Dr. Daniel (Podemos), afirmou que o discurso de simplicidade do candidato, filho de um leiteiro, ajudou na vitória sobre o clã Barbalho na eleição de primeiro turno. O contraste entre a 'grandiosidade política' da família Barbalho e o discurso de simplicidade do adversário pesou na vitória.", "titulo_pt": "Marqueteiro da vitória diz que 'Davi contra Golias' ajudou dr. Daniel no pará", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 202818, "titulo": "Eduardo Paes afirma que vai recorrer ao STF contra anulação de votos de Garotinho no RJ", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/eduardo-paes-afirma-que-vai-recorrer-ao-stf-contra-anulacao-de-votos-de-garotinho-no-rj.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Paes, ex-prefeito do Rio de Janeiro, afirmou que vai recorrer ao STF contra a anulação definitiva dos votos de Anthony Garotinho na eleição para governador do Rio de Janeiro. A decisão foi tomada pelo TSE.", "titulo_pt": "Eduardo Paes afirma que vai recorrer ao STF contra anulação de votos de Garotinho no RJ", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 202860, "titulo": "Nas redes, Lula celebra Dia do Nordestino e diz que, se Flávio for eleito, cortará Pé-de-Meia e outros programas sociais", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/08/nas-redes-lula-celebra-dia-do-nordestino-e-diz-que-se-flavio-for-eleito-cortara-pe-de-meia-e-outros-programas-sociais.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-08T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato do PT, Luiz Inácio Lula da Silva, publicou vídeos nas redes sociais celebrando o Dia do Nordestino e acusando o candidato do PL, Flávio Bolsonaro, de cortar programas sociais como Pé-de-Meia, Farmácia Popular e Minha Casa, Minha Vida se eleito.", "titulo_pt": "Lula celebra Dia do Nordestino e acusa Flávio bolsonaro de cortar programas sociais", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 202819, "titulo": "Quem é Douglas Ruas, governador virtualmente eleito do RJ", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/quem-e-douglas-ruas-governador-virtualmente-eleito-do-rj.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Douglas Ruas, governador virtualmente eleito do Rio de Janeiro e policial civil desde 2013, ocupa cargos políticos desde 2017. Sua carreira está fortemente ligada ao pai, prefeito de São Gonçalo, e ao deputado federal Altineu Côrtes, vice-presidente da Câmara dos Deputados.", "titulo_pt": "Quem é Douglas Ruas, governador virtualmente eleito do rio de janeiro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 202927, "titulo": "‘Não me arrependo’, diz bilionário que defendeu cloroquina no governo de Jair Bolsonaro", "url": "https://veja.abril.com.br/economia/nao-me-arrependo-diz-bilionario-que-defendeu-cloroquina-no-governo-de-jair-bolsonaro/", "fonte_id": "veja", "data_pub": "2026-10-08T16:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Carlos Wizard afirmou que não se arrepende de suas ações no governo de Jair Bolsonaro, onde defendeu a cloroquina. Ele também comentou que o Brasil está 'muito pior' e defendeu a alternância de poder.", "titulo_pt": "‘Não me arrependo’, diz carlos wizard sobre defesa da cloroquina no governo Bolsonaro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 202820, "titulo": "Propostas de Lula não bastam em polarização, diz deputada mais votada de MG e aposta petista no digital", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/propostas-de-lula-nao-bastam-em-polarizacao-diz-deputada-mais-votada-de-mg-e-aposta-petista-no-digital.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-08T16:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada federal Ana Elisa, mais votada em Minas Gerais pelo PT, afirmou que as propostas do presidente Lula não são suficientes para vencer o segundo turno em um momento de polarização. Ela defendeu a atrair votos de candidatos do Missão e do Avante.", "titulo_pt": "Propostas de Lula não bastam em polarização, diz deputada mais votada de MG e aposta petista no digital", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 202841, "titulo": "Ministro diz ver avanços para retomar exportação de carne para UE", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/agro/2026/10/ministro-diz-ver-avancos-para-retomar-exportacao-de-carne-para-ue.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T16:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Desenvolvimento, Indústria, Comércio e Serviços, Márcio Rosa, afirmou que o governo brasileiro espera resolver o impasse com a União Europeia e retomar as exportações de carne para o bloco. O ministro disse que vê avanços nessa direção.", "titulo_pt": "Ministro espera retomar exportação de carne para UE", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 202932, "titulo": "Quem é Douglas Ruas, provável novo governador do Rio", "url": "https://veja.abril.com.br/politica/quem-e-douglas-ruas-provavel-novo-governador-do-rio/", "fonte_id": "veja", "data_pub": "2026-10-08T16:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Douglas Ruas, presidente da Assembleia Legislativa, está em seu primeiro mandato como deputado estadual e surpreendeu ao desbancar o favorito Eduardo Paes nas intenções de voto para o cargo de governador do Rio de Janeiro.", "titulo_pt": "Quem é Douglas Ruas, provável novo governador do Rio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 203116, "titulo": "STF AO VIVO – Gratuidade para PCDs em estacionamentos privados – 8/10/26", "url": "https://www.jota.info/stf/do-supremo/stf-ao-vivo-gratuidade-para-pcds-em-estacionamentos-privados-8-10-26", "fonte_id": "jota", "data_pub": "2026-10-08T16:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) deve julgar uma lei estadual do Paraná que estabelece a gratuidade mínima para pessoas com deficiência em estacionamentos privados.", "titulo_pt": "STF AO VIVO – Gratuidade para PCDs em estacionamentos privados – 26/10/2023", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 202861, "titulo": "Lula perde votos no berço do Fome Zero, no Piauí; Flávio Bolsonaro cresce em reduto bolsonarista no Sul", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/08/votacao-lula-flavio-bolsonaro-redutos-1-turno-2026.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-08T16:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O percentual de votos para candidatos do PT a presidente diminuiu em Guaribas, no Piauí, desde 2018. Em 2026, Lula obteve 87,6% dos votos válidos no primeiro turno, contra 92,1% em 2022 e 93,2% em 2018.", "titulo_pt": "Lula perde votos no berço do Fome Zero, no Piauí; Flávio Bolsonaro cresce em reduto bolsonarista no Sul", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 202844, "titulo": "Lula diz que plano de ajuste de Flávio Bolsonaro é para 'cortar do sangue do povo'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/lula-diz-que-plano-de-ajuste-de-flavio-bolsonaro-e-para-cortar-do-sangue-do-povo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T16:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva afirmou que o plano de ajuste fiscal proposto pelo senador Flávio Bolsonaro é para cortar 'do sangue do povo'.", "titulo_pt": "Lula critica plano de ajuste de Bolsonaro como 'cortar do sangue do povo'", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 203492, "titulo": "Israeli gunfire and air strikes kill at least five in Gaza", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-gunfire-and-air-strikes-kill-least-five-gaza", "fonte_id": "middle_east_eye", "data_pub": "2026-10-08T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israeli tiroteios e ataques aéreos resultaram em pelo menos cinco mortes em Gaza. Três pessoas foram mortas por tiroteio israelense em Gaza City e norte de Gaza desde a manhã de quinta-feira, conforme relatado pela Al Jazeera. Em um ataque separado, duas pessoas morreram e três ficaram feridas quando um veículo foi atingido por um ataque israelense em Gaza City, bairro de Tel al-Hawa. Outro ataque aéreo em al-Tawam, ao norte de Gaza City, também causou feridos, mas o número exato não foi divulgado.", "titulo_pt": "Tiroteios e ataques aéreos israelenses causam pelo menos cinco mortes em Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 203337, "titulo": "Trump: U.S. won't attack Iran before midterms", "url": "https://www.axios.com/2026/10/08/trump-iran-strikes-midterm-elections", "fonte_id": "axios", "data_pub": "2026-10-08T17:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, declarou que o país não realizará ataques a Irã antes das eleições gerais de 3 de novembro. Trump vinha considerando retomar operações militares significativas antes das eleições, mas suas declarações anteriores sobre intenções em relação ao Irã não sempre se confirmaram.", "titulo_pt": "Trump: estados unidos não atacará Irã antes das eleições", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 203013, "titulo": "EUA investigam Harvard, Stanford e MIT por vistos de intercâmbio para pesquisadores", "url": "https://www.infomoney.com.br/mundo/eua-investigam-harvard-stanford-e-mit-por-vistos-de-intercambio-para-pesquisadores/", "fonte_id": "infomoney", "data_pub": "2026-10-08T17:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos está investigando a Harvard, Stanford e MIT sobre possíveis fraudes em vistos J-1 usados por doutorandos e pesquisadores visitantes. A investigação foi iniciada após a administração de Trump abrir apurações sobre esses vistos.", "titulo_pt": "EUA investigam Harvard, Stanford e MIT por vistos de intercâmbio para pesquisadores", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 203493, "titulo": "US and Lebanon hosting Syrian general wanted for war crimes: Report", "url": "https://www.middleeasteye.net/news/us-and-lebanon-hosting-syrian-general-wanted-war-crimes-report", "fonte_id": "middle_east_eye", "data_pub": "2026-10-08T17:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um general sírio acusado de crimes contra a humanidade está sendo hospedado e financiado pelos Estados Unidos e autoridades libanesas, de acordo com uma investigação conjunta da NPR e BBC. O general Bassam al-Hassan, que supervisionou o programa de armas químicas da Síria, está sendo ajudado a localizar Austin Tice, um ex-cidadão americano desaparecido na Síria.", "titulo_pt": "EUA e líbano hospedam general sírio acusado de crimes contra a humanidade", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 203377, "titulo": "Aaron Sorkin, Mikey Madison, Jeremy Allen White: The director and cast behind the Facebook sequel", "url": "https://www.france24.com/en/tv-shows/arts24/20261008-aaron-sorkin-mikey-madison-jeremy-allen-white-the-director-and-cast-behind-the-facebook-sequel", "fonte_id": "france24", "data_pub": "2026-10-08T17:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aaron Sorkin está dirigindo um novo filme chamado 'The Social Reckoning', que explora o papel do Facebook na divisão, extremismos e disseminação de desinformação nos Estados Unidos. O filme se baseia na história real de Frances Haugen, uma whistleblower que vazou documentos internos para um repórter do Wall Street Journal.", "titulo_pt": "Aaron Sorkin, Mikey Madison e Jeremy Allen White: o diretor e o elenco do filme sobre Facebook", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 203345, "titulo": "Venezuela's ex-leader Nicolás Maduro charged with conspiracy to commit torture", "url": "https://www.bbc.co.uk/news/articles/c5pvgn7xvxpzo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-08T17:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nicolás Maduro, ex-líder da Venezuela, foi acusado de conspiração para cometer tortura. As acusações envolvem supostas torturas sofridas por cidadãos norte-americanos enquanto Maduro estava no poder.", "titulo_pt": "Ex-líder venezuelano Nicolás Maduro acusado de conspiração para cometer tortura", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 203525, "titulo": "Anne Carson, i soldi del Nobel in beneficenza", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/08/anne-carson-i-soldi-del-nobel-in-beneficenza_c9ab673f-2526-4ec7-8f47-27c3cee45be1.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-08T17:37:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Anne Carson celebra o prêmio Nobel do Literatura distribuindo os prêmios em benefícios. Ela passa caminhadas nos bosques para evitar responder ao telefone.", "titulo_pt": "Anne Carson, os prêmios do Nobel em benefício", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 203776, "titulo": "Iran scales up Hormuz attacks, raising pressure on Trump as midterms near", "url": "https://www.washingtonpost.com/world/2026/10/08/iran-scales-up-hormuz-attacks-raising-pressure-trump-midterms-near/", "fonte_id": "washington_post_world", "data_pub": "2026-10-08T17:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações de petróleo têm diminuído devido a ataques iranianos na Passagem de Hormuz, uma escalada de violência não vista há meses. O presidente Donald Trump comemorou a retomada das flutuações de petróleo, mas a situação continua tenso à medida que se aproxima o período eleitoral intermediário nos Estados Unidos.", "titulo_pt": "Irã intensifica ataques em Hormuz, aumentando pressão sobre Trump antes das eleições", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 203526, "titulo": "Ex Ilva, da domani stop all'area a caldo e avvio procedure cig", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/08/ex-ilva-da-domani-stop-allarea-a-caldo-e-avvio-procedure-cig_e0a90fbe-2991-4f0e-831f-4f907f700f7b.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-08T17:35:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Ex Ilva informou a suspensão das atividades produtivas na área quente. O processo CIG (Comitato Interaziendale per la Gestione) foi iniciado.", "titulo_pt": "Ex Ilva: suspensão das atividades produtivas e início de procedimentos cig", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 203777, "titulo": "No new attack on Iran before the midterm elections, Trump says", "url": "https://www.washingtonpost.com/politics/2026/10/08/no-new-attack-iran-before-midterm-elections-trump-says/", "fonte_id": "washington_post_world", "data_pub": "2026-10-08T17:30:00Z", "idioma": "en", "provavel_duplicata_de": 203495, "texto_pt": "Trump afirmou que não haverá novo ataque contra o Irã antes das eleições legislativas. O presidente reconhece às vezes usar declarações públicas sobre negociações e planejamento militar para manter adversários em guarda.", "titulo_pt": "Trump não fará novo ataque ao Irã antes das eleições legislativas", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 203464, "titulo": "US suspends Microsoft and Adobe from visa programme amid fraud claims", "url": "https://www.aljazeera.com/economy/2026/10/8/us-suspends-microsoft-and-adobe-from-visa-programme-amid-fraud-claims?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-08T17:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos suspendeu as credenciais de visto de empresas como Microsoft e Adobe devido a acusações de fraudes. Uma investigação de vistos também alvo universidades por supostamente explorar estudantes internacionais para reduzir os custos salariais nos Estados Unidos.", "titulo_pt": "EUA suspende credenciais de visto de Microsoft e Adobe diante de acusações de fraudes", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 203527, "titulo": "Giorgetti, fiduciosi che l'Ue seguirà una corretta interpretazione della flessibilità", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/08/giorgetti-fiduciosi-che-lue-seguira-una-corretta-interpretazione-della-flessibilita_e53bb683-f384-4375-8ec4-94c5b9d0a81d.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-08T17:25:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O ministro italiano expressou confiança de que a União Europeia adotará uma interpretação correta da flexibilidade proposta pela Itália. Houve um amplo debate e várias adesões à proposta italiana.", "titulo_pt": "Giorgetti, confiante de que a união europeia seguirá uma correta interpretação da flexibilidade", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 203494, "titulo": "US imposes fresh sanctions on Iran's 'shadow fleet'", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/us-imposes-fresh-sanctions-irans-shadow-fleet", "fonte_id": "middle_east_eye", "data_pub": "2026-10-08T17:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos impuseram novas sanções à frota de navios de petróleo da 'sombra' da Irã, conhecida como 'shadow fleet', em um passo adicional para aumentar a pressão sobre Teerã. A medida visa neutralizar a maioria dos navios restantes da rede de navios-piratas iranianos e privar o governo iraniano de recursos financeiros para financiar atividades militares na região.", "titulo_pt": "EUA impõem novas sanções à frota de navios-piratas 'sombra' da Irã", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 203164, "titulo": "Desahuciada en Barcelona una mujer vulnerable con dos hijos menores un día después de la muerte de Maricarmen", "url": "https://elpais.com/espana/catalunya/2026-10-08/desahuciada-en-barcelona-una-mujer-vulnerable-con-dos-hijos-menores-un-dia-despues-de-la-muerte-de-maricarmen.html", "fonte_id": "elpais_america", "data_pub": "2026-10-08T17:22:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Natalia Zakharova, uma vítima de violência doméstica, foi despejada de sua residência em Barcelona, Espanha, um dia após a morte de Maricarmen. A mulher, que é vulnerável com dois filhos menores, não tem alternativa habitacional.", "titulo_pt": "Vítima de violência machista é despejada em Barcelona um dia após morte de Maricarmen", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 203019, "titulo": "Trump diz que EUA não atacarão Irã antes das eleições de meio de mandato em novembro", "url": "https://www.infomoney.com.br/mundo/trump-diz-que-eua-nao-atacarao-ira-antes-das-eleicoes-de-meio-de-mandato-em-novembro/", "fonte_id": "infomoney", "data_pub": "2026-10-08T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, afirmou que os Estados Unidos não irão atacar o Irã antes das eleições de meio de mandato previstas para novembro. Essa declaração foi publicada no site InfoMoney.", "titulo_pt": "Trump afirma que EUA não atacarão Irã antes das eleições de meio de mandato em novembro", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 203528, "titulo": "Dombrovskis, 'non possiamo continuare a introdurre nuove forme di flessibilità'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/08/dombrovskis-non-possiamo-continuare-a-introdurre-nuove-forme-di-flessibilita_989aec06-e176-4773-840a-fccc85643f58.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-08T17:20:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O economista Dombrovskis afirmou que não podemos continuar introduzindo novas formas de flexibilidade nas regras fiscais. As regras fiscais já contêm elementos que levam em conta a inflação.", "titulo_pt": "Dombrovskis: não podemos continuar introduzindo novas formas de flexibilidade nas regras fiscais", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 203439, "titulo": "Treasury yields are lower after reaching multiyear highs, traders weigh latest bond auction", "url": "https://www.cnbc.com/2026/10/08/us-treasury-yields-30-year-bond-auction.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-08T17:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos do Tesouro estão mais baixos após atingirem máximos multi-anos, enquanto os traders aguardam o resultado de uma leilão de títulos de dívida de longo prazo. Comentários de um alto oficial do Federal Reserve foram considerados durante esse período.", "titulo_pt": "Rendimentos do tesouro caem após máximos multi-anos, traders aguardam leilão de títulos", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 203115, "titulo": "ESG e insolvência", "url": "https://www.jota.info/opiniao-e-analise/colunas/constituicao-empresa-e-mercado/esg-e-insolvencia", "fonte_id": "jota", "data_pub": "2026-10-08T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo discute como a integridade socioambiental afeta a gestão de crises empresariais. Ele examina as principais consequências para a saúde financeira das empresas em situações de insolvência.", "titulo_pt": "Integridade socioambiental e insolvência", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 202837, "titulo": "OAB-SP processa startup jurídica de IA e diz que tecnologia invade atividade de advogados", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/10/oab-sp-processa-startup-juridica-de-ia-e-diz-que-tecnologia-invade-atividade-de-advogados.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OAB-SP processou a startup jurídica de inteligência artificial Talisman AI, que oferece serviços considerados exclusivos dos advogados. A ação civil pública foi distribuída recentemente, mas ainda não há decisão sobre pedidos de urgência.", "titulo_pt": "OAB-SP processa startup de IA por oferecer serviços considerados exclusivos dos advogados", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 202838, "titulo": "Pedidos semanais de auxílio-desemprego nos EUA caem", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/01/6562-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post467446", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de norte-americanos que solicitaram novos benefícios de desemprego diminuiu na semana passada, indicando uma estabilidade contínua no mercado de trabalho. Apesar da desaceleração acentuada no crescimento do emprego em setembro, os pedidos de auxílio-desemprego permaneceram estáveis.", "titulo_pt": "Pedidos semanais de auxílio-desemprego nos EUA caem", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 202839, "titulo": "Latam prevê lançar segunda leva de rotas com aviões da Embraer no final de novembro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/latam-preve-lancar-segunda-leva-de-rotas-com-avioes-da-embraer-no-final-de-novembro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T16:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O diretor-presidente da Latam Brasil, Jerome Cadier, anunciou que a companhia espera lançar uma segunda leva de rotas com aviões da Embraer no final de novembro. A empresa planeja operar essas novas rotas com aeronaves da Embraer.", "titulo_pt": "Latam prevê lançar segunda leva de rotas com aviões Embraer no final de novembro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 202840, "titulo": "Contradições do discurso econômico de Flávio expõem dúvidas no ajuste fiscal prometido pelo candidato", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/contradicoes-do-discurso-economico-de-flavio-expoem-duvidas-no-ajuste-fiscal-prometido-pelo-candidato.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T16:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As declarações contraditórias do candidato Flávio Bolsonaro sobre seu programa de ajuste fiscal levantam dúvidas sobre a consistência de suas propostas econômicas. Isso sugere incertezas sobre as medidas que ele adotará caso seja eleito.", "titulo_pt": "Contradições no discurso econômico de Flávio expõem dúvidas sobre ajuste fiscal prometido", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 202842, "titulo": "Super-ricos driblam Receita na importação de móveis de alto luxo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/super-ricos-driblam-receita-na-importacao-de-moveis-de-alto-luxo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T16:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Super-ricos estão utilizando operações fictícias de mudança de residência para driblar os impostos sobre a importação de móveis de alto luxo, reduzindo o valor tributável em cerca de 50%. Um sofá de design italiano vendido por quase R$ 100 mil pode ser importado com impostos reduzidos por meio dessas estratégias.", "titulo_pt": "Super-ricos driblam impostos na importação de móveis de alto luxo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 202843, "titulo": "Petrobras sobe com alta do petróleo em meio a tensões no Oriente Médio", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/01/6562-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post467445", "fonte_id": "folha_mercado", "data_pub": "2026-10-08T16:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações da Petrobras subiram nesta quinta-feira (8) devido à alta dos preços do petróleo, influenciada pelas tensões no Oriente Médio. O Ibovespa também registrou ganhos, subindo 0,73% às 13h10.", "titulo_pt": "Petrobras avança com alta do petróleo em meio a tensões no Oriente Médio", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 202845, "titulo": "Uniqlo se aproxima da H&M e mira liderança global", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/uniqlo-se-aproxima-da-hm-e-mira-lideranca-g
