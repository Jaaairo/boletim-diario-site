<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 05/11/2026 22:23 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">

  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>

</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">

    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "05/11/2026 22:23", "stats": {"noticias_novas": 800, "resumos_gerados": 244}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva anunciou a criação do Ministério da Segurança Pública por meio de uma Medida Provisória, com o objetivo de intensificar a luta contra organizações criminosas. A renúncia do presidente do Paraguai, Santiago Peña, foi vista pelo governo brasileiro como mais um contraponto à direita na região, gerando preocupações com a instabilidade no país vizinho. Lula também enfatizou a importância da responsabilidade fiscal para atrair investimentos, argumentando que uma economia estável e previsível é crucial. Em São Paulo, a bancada do PT na Câmara Municipal deve apoiar o vereador João Jorge na sua candidatura à presidência da Casa, fortalecendo sua posição na disputa. Além disso, o ministro André Mendonça autorizou a prisão domiciliar do empresário Maurício Camisotti, que está sendo investigado por fraudes nos descontos do INSS.", "mundo": "Os resultados das eleições intercalares nos Estados Unidos tiveram um impacto significativo em diversos países e regiões. A derrota maciça do Partido Republicano levou a uma 'onda azul' que reverteu o apoio dos latinos aos democratas, com um aumento de 11 pontos percentuais desde 2024. Esse resultado desestruturou a extrema-direita nos Estados Unidos e no mundo, especialmente após a derrota de Donald Trump. No Canadá, o governo liderado por Justin Trudeau (não Mark Carney, que foi governador do Banco of England) apresentou um orçamento focado em fortalecer a independência econômica do país em relação aos Estados Unidos. Em outro desenvolvimento, o presidente do Paraguai, Santiago Peña, renunciou após ser acusado de favorecer o Banco Ueno, em que era acionista até 2025. Além disso, a Coreia do Sul manteve sua cooperação com os Estados Unidos e Japão em questões de sanções contra a Coreia do Norte, enquanto o Palácio Cheong Wa Dae afirmou que os resultados eleitorais dos Estados Unidos não afetarão a aliança entre as duas nações.\n\nAs relações geopolíticas internacionais foram significativamente afetadas pelas recentes eleições intermédiadas nos Estados Unidos, que resultaram em vitórias significativas para os democratas. Os democratas conquistaram a maioria no Senado e estão em vias de obter uma ampla maioria na Câmara dos Representantes, representando uma rejeição severa do governo de Donald Trump. Em resposta, o presidente eleito Joe Biden intensificou as pressões sobre a China em questões como Taiwan, inteligência artificial e controles de exportação. As tensões entre as nações continuaram com o Canadá rejeitando jogar hóquei contra times russos devido à guerra na Ucrânia, enquanto o Irã enfrenta a possibilidade de uma escalada com os Estados Unidos, que não têm planos imediatos de ataque. Em uma ação militar, Washington atacou alvos iranianos no Estreito de Ormuz. A Ucrânia também enfrentou ataques russos, com pelo menos 33 mortos e 50 desaparecidos após uma bomba atingir um centro de distribuição de ajuda humanitária. A China, por sua vez, está se tornando cada vez mais importante para o futuro econômico do Golfo, mas ainda depende de rotas marítimas vulneráveis para o acesso ao petróleo do Oriente Médio.", "economia": "A economia global enfrenta desafios significativos, com destaque para a situação dos EUA e a dívida externa de países em desenvolvimento. No Brasil, a Sabesp registrou uma queda de 36% no lucro líquido no terceiro trimestre, devido à pressão dos juros sobre a dívida. O governo Lula planeja misturar os biocombustíveis na etapa de refino, em vez da distribuição. O Distrito Federal solicitou a transferência de R$ 2,2 bilhões que estavam bloqueados devido ao caso Master. No mercado de ações, o Nasdaq 100 caiu 6,4% em um dia de negociações caóticas após a vitória dos democratas nas eleições médias nos EUA. Em outro desenvolvimento, o Banco Central da Noruega manteve a taxa de juros em 4,5%, mas indicou que pode aumentá-la para combater a inflação.", "tecnologia": "As bolsas de Seul abriram com uma forte queda na sexta-feira, em resposta às preocupações sobre o desenvolvimento de centros de dados em face da vitória democrata na Câmara dos EUA. A Doosan Group anunciou investimentos significativos para expandir a produção de CCL na China, devido ao aumento da demanda por inteligência artificial. As ações das empresas de semicondutores sul-coreanas, como a Samsung e a SK hynix, caíram cerca de 10%, impactando o índice Kospi. O índice Nasdaq 100 perdeu valor superior a US$ 2 trilhões, refletindo o medo dos investidores de que a vitória do Partido Democrata possa frear o expansionismo da infraestrutura de inteligência artificial. A Doosan Group também investirá aproximadamente 550 bilhões de wons para ampliar a capacidade de produção de CCL na China, devido ao aumento da demanda por inteligência artificial.", "ciencia": "Um importante avanço na ciência foi alcançado com a produção de uma imagem de rádio mais nítida e sensível, realizada em baixas frequências por um time internacional de astrônomos liderado pela Universidade Leiden, utilizando o Array de Frequências Baixas (LOFAR). A imagem, que cobre uma área do céu equivalente a cerca de 25 vezes a área da Lua inteira, revela cerca de 63.000 fontes de rádio, incluindo núcleos galácticos ativos e galáxias em formação de estrelas. Além disso, a Amorim Cork Solutions está fornecendo seu material de proteção térmica P50, baseado em cortiça, para a missão DRACO, uma missão europeia da Agência Espacial Europeia (ESA) projetada para capturar dados raros em voo. O material será usado para proteger os dados de serem destruídos pelo calor durante a missão.", "cultura": "O Festival de Cinema de Mar del Plata começou com uma cerimônia de abertura conduzida por Teté Coustarot, marcando o início de uma programação que já conta com mais de 40 sessões esgotadas. No âmbito do jornalismo, Amanda Klein, apresentadora da RedeTV!, foi contratada pela TMC para integrar o jornal matinal TMC 360, apresentado por Joana Treptow e Felipe Bueno. No campo do cinema, o filme 'Amor Possível', vencedor no Festival de Veneza, transforma o décimo mandamento bíblico em um drama sobre desigualdade, enquanto 'Epifania - Uma Fábula Moderna', de Vitor Rocha, é destacado como um espetáculo autoral inovador. Marília Mendonça, cinco anos após sua morte, mantém recordes no streaming, consolidando-se como uma das vozes mais influentes do sertanejo. Além disso, o Met Gala de 2027 anuncia um tema inovador, focado em roupas e materiais do cotidiano transformados em peças de moda, e o documentário 'Saravá Shalom' explora a identidade judaica através de práticas espirituais brasileiras.", "sociedade": "Milhares de pessoas em todo o país francês participaram de manifestações pacíficas em várias cidades, em protesto contra o aumento dos custos de vida e cortes orçamentários, pressionando o governo de Emmanuel Macron. As manifestações ocorreram em vários dias, incluindo a Torre Eiffel, que permaneceu fechada na quinta-feira. Em São Paulo, a senadora Damares Alves esteve presente no velório de uma menina morta por seu padrasto no Distrito Federal, prestando apoio aos familiares. Em Belém, um detento escapou de um ônibus durante o transporte para uma audiência presencial, mas acabou baleado durante a tentativa de fuga. O Ministério da Saúde informou uma redução na mortalidade infantil no Brasil, mas especialistas alertam sobre as diferenças regionais e as oportunidades de prevenção.", "meio_ambiente": "Em outubro de 2026, a cidade de São Paulo registrou o segundo outubro mais chuvoso desde 1995, com 220,3 mm de precipitação, 96,7% acima da média esperada. O mês teve 26 dias com chuva, o que teve um impacto significativo na rotina da população. Paralelamente, as chuvas intensas no sul da Província de Buenos Aires, na Argentina, atrasaram a plantação de milho e girassol, com alguns produtores possivelmente não concluindo a área prevista. As emissões de dióxido de carbono na China diminuíram 3,1% no terceiro trimestre de 2026, o maior decréscimo desde a pandemia de COVID-19. No Brasil, mais de 100 tornados já foram registrados este ano, relacionados a mudanças climáticas e à influência do El Niño.", "direitos_humanos": "Joshua Wong, um ativista pró-democracia de Hong Kong, foi condenado a mais 10 anos de prisão por conspirar com forças estrangeiras para ameaçar a segurança nacional, sob a Lei de Segurança Nacional implementada por Pequim. Este é o segundo julgamento do ativista recentemente. Em outro caso, uma avó de 68 anos foi condenada a 20 dias de prisão por esbofetear uma menina de 5 anos em um shopping center em Hong Kong. A Suécia devolveu uma coleção de bronze de Benin a Nigéria e restos humanos aos Museus Arqueológicos de La Paz, Bolívia. Além disso, a Comissão dos Direitos Humanos da ONU relatou que as condições de direitos humanos na Coreia do Norte não melhoraram nos últimos dez anos. A Coreia do Norte também rejeitou reduções de penas para prisioneiros. No Chile, Rabat rejeitou pelo menos nove reduções de penas e os casos foram disputados em tribunais. Em um caso, a justiça reduziu as condenações de 115 narcotraficantes estrangeiros. No Brasil, o Ministério Público Federal ingressou com uma ação judicial por racismo no TikTok, solicitando que a plataforma pague uma indenização de R$ 200 milhões. O relatório Water Under Fire Volume 4 registra um aumento de 300% nos ataques a sistemas de água em conflitos, prejudicando trabalhadores e crianças que dependem desses serviços em 23 países e territórios. No México, uma avó foi condenada a 20 dias de prisão por esbofetear uma menina em um shopping center em Hong Kong."}, "resumo_do_dia": {"politica_nacional": [{"id": 246651, "titulo": "Concessão Nova Raposo investe R$ 495 milhões desde março de 2025", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/concessao-nova-raposo-investe-r-495-milhoes-desde-marco-de-2025.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-06T00:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A concessionária Nova Raposo investiu R$ 495,4 milhões nas rodovias Castello Branco e Raposo Tavares desde março de 2025. O investimento foi realizado como parte de suas operações na região de São Paulo.", "titulo_pt": "Concessão Nova Raposo investe R$ 495 milhões desde março de 2025", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 246700, "titulo": "Senado começa a analisar impeachment de Santiago Peña; sessão volta amanhã", "url": "https://veja.abril.com.br/mundo/senado-comeca-a-analisar-impeachment-de-santiago-pena-sessao-volta-amanha/", "fonte_id": "veja", "data_pub": "2026-11-06T00:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado iniciou a análise do processo de impeachment contra Santiago Peña. A sessão será retomada no dia seguinte. Peña havia oferecido renúncia, mas a Câmara rejeitou e manteve o processo em andamento.", "titulo_pt": "Senado começa a analisar impeachment de Santiago Peña; sessão volta amanhã", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 246652, "titulo": "PT negocia apoio a aliado de Nunes para presidência da Câmara de SP", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/pt-negocia-apoio-a-aliado-de-nunes-para-presidencia-da-camara-de-sp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-06T00:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A bancada do PT na Câmara Municipal de São Paulo deve apoiar o vereador João Jorge (MDB) na sua candidatura à presidência da Casa em uma reunião agendada para a próxima terça-feira. O apoio do PT visa fortalecer a posição de João Jorge na disputa pela presidência.", "titulo_pt": "PT deve apoiar candidatura de joão jorge (mdb) à presidência da Câmara de SP", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 246643, "titulo": "Lula vai criar Ministério da Segurança Pública com Medida Provisória", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/lula-vai-criar-ministerio-da-seguranca-publica-com-medida-provisoria", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-06T00:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva anunciou que criará o Ministério da Segurança Pública por meio de uma Medida Provisória. A criação visa ampliar o combate às ações de organizações criminosas.", "titulo_pt": "Lula anuncia criação do Ministério da Segurança Pública com mp", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 246794, "titulo": "Planalto vê saída de Peña como novo revés da direita na região", "url": "https://www.cnnbrasil.com.br/politica/planalto-ve-saida-de-pena-como-novo-reves-da-direita-na-regiao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T00:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo brasileiro considera a renúncia de Peña como um novo revés para a direita na região. O governo vê a saída de Peña como enfraquecimento dos aliados de Trump e expressa preocupação com a instabilidade no Paraguai.", "titulo_pt": "Planalto vê saída de Peña como novo revés para a direita na região", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 246797, "titulo": "Lula diz que Flávio é “pé-frio” e que senador foi aos EUA buscar “proteção”", "url": "https://www.cnnbrasil.com.br/politica/lula-diz-que-flavio-e-pe-frio-e-que-senador-foi-aos-eua-buscar-protecao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T00:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula afirmou que Flávio é 'pé-frio' e que o senador foi aos Estados Unidos buscar 'proteção'. Essas declarações foram feitas durante uma live realizada na noite de quinta-feira (5) junto com André Janones.", "titulo_pt": "Lula diz que Flávio é 'pé-frio' e que senador buscou 'proteção' nos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 246763, "titulo": "Em live, Lula chama Flávio de “pé-frio”: “Chegou nos EUA, o Trump perdeu”", "url": "https://www.metropoles.com/brasil/em-live-lula-chama-flavio-de-pe-frio-chegou-nos-eua-o-trump-perdeu", "fonte_id": "metropoles", "data_pub": "2026-11-05T23:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Jair Bolsonaro, durante uma live com André Janones, fez uma ironia sobre a derrota dos republicanos nos Estados Unidos, comparando-a à derrota do ex-presidente Donald Trump. Bolsonaro também criticou o senador Flávio Bolsonaro, chamando-o de 'pé-frio'.", "titulo_pt": "Lula chama Flávio de 'pé-frio' em live sobre derrota dos republicanos nos EUA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 246600, "titulo": "Heleno Torres defende CBS de até 10% e reforma tributária sem adiamento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/11/heleno-torres-defende-cbs-de-ate-10-e-reforma-tributaria-sem-adiamento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-05T23:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Heleno Torres, professor de Direito Financeiro, defende que o Senado possa fixar a alíquota da CBS entre 9,5% e 10%, abaixo dos 11,3% calculados pelo TCU. Ele afirma que o Senado possui argumentos técnicos para essa decisão.", "titulo_pt": "Heleno Torres defende CBS de 9,5% a 10% e reforma tributária sem adiamento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 246602, "titulo": "Mendonça autoriza prisão domiciliar de Camisotti, investigado por fraudes nos descontos do INSS", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/mendonca-autoriza-prisao-domiciliar-de-camisotti-investigado-por-fraudes-nos-descontos-do-inss.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-05T23:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça, do STF, autorizou a prisão domiciliar do empresário Maurício Camisotti, que estava preso preventivamente desde setembro de 2025 por suspeita de envolvimento em fraudes do INSS.", "titulo_pt": "Mendonça autoriza prisão domiciliar de Camisotti, investigado por fraudes nos descontos do INSS", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 246653, "titulo": "Após Lula planejar diálogo com empresários, centrais sindicais pedem encontro com o presidente", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/apos-lula-planejar-dialogo-com-empresarios-centrais-sindicais-pedem-encontro-com-o-presidente.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-05T23:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Centrais sindicais solicitaram um encontro com o presidente Lula para discutir a economia e a política fiscal do governo. Lula havia planejado um diálogo com empresários recentemente.", "titulo_pt": "Centrais sindicais pedem encontro com Lula para discutir economia e política fiscal", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 246645, "titulo": "Governo define minerais críticos prioritários para investimentos", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/governo-define-minerais-criticos-prioritarios-para-investimentos", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-05T22:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conselho Nacional para Industrialização de Minerais Críticos e Estratégicos definiu a lista de 27 minerais prioritários para investimentos, classificados em três níveis de prioridade. Essa lista será usada como guia para a direcionamento de políticas públicas e recursos de fomento.", "titulo_pt": "Governo define minerais críticos prioritários para investimentos", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 246654, "titulo": "Lula diz ter mais medo do que no 1º mandato, cita revés de Trump e fala em 'lição para o mundo'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/lula-diz-ter-mais-medo-do-que-no-1o-mandato-cita-reves-de-trump-e-fala-em-licao-para-o-mundo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-05T22:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula afirmou sentir mais medo de decepcionar o eleitorado neste mandato do que no primeiro. Ele citou o revés de Trump como uma lição para o mundo.", "titulo_pt": "Lula diz ter mais medo de decepcionar eleitorado neste mandato, cita revés de Trump", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 246655, "titulo": "Após acordo eleitoral, Tarcísio deve dar secretaria a Ricardo Salles", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/apos-acordo-eleitoral-tarcisio-deve-dar-secretaria-a-ricardo-salles.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-05T22:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ricardo Salles (Novo) deve assumir a Secretaria da Justiça na equipe de Tarcísio de Freitas (Republicanos) em São Paulo no ano que vem, após um acordo eleitoral.", "titulo_pt": "Ricardo Salles deve assumir secretaria de justiça em acordo com Tarcísio de freitas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 246707, "titulo": "‘Temos que ter responsabilidade fiscal para atrair capital’, afirma Lula", "url": "https://veja.abril.com.br/economia/temos-que-ter-responsabilidade-fiscal-para-atrair-capital-afirma-lula/", "fonte_id": "veja", "data_pub": "2026-11-05T22:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula enfatizou a importância da responsabilidade fiscal para atrair investimentos. Este apoio ao ajuste das contas públicas foi anunciado após uma reunião com economistas para discutir a situação econômica.", "titulo_pt": "Lula destaca responsabilidade fiscal para atrair capital", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 246606, "titulo": "Onda azul nos Estados Unidos pode favorecer produtor brasileiro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/vaivem/2026/11/onda-azul-nos-estados-unidos-pode-favorecer-produtor-brasileiro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-05T22:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A eleição dos democratas nos Estados Unidos será favorável aos produtores brasileiros, já que os anseios do meio rural foram expressos através do voto e contrariam a política de Donald Trump, que prejudicou o campo americano e consequentemente o brasileiro.", "titulo_pt": "Onda azul nos Estados Unidos pode beneficiar produtores brasileiros", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 246609, "titulo": "'Temos que ter responsabilidade fiscal', diz Lula em meio a debate sobre ajuste nas contas públicas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/temos-que-ter-responsabilidade-fiscal-diz-lula-em-meio-a-debate-sobre-ajuste-nas-contas-publicas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-05T22:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) defendeu a responsabilidade fiscal como forma de atrair investimentos para o país. Lula destacou a importância da responsabilidade fiscal durante um debate sobre ajustes nas contas públicas.", "titulo_pt": "Lula defende responsabilidade fiscal para atrair investimentos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 247184, "titulo": "Deputy FM meets British lawmakers for talks on N. Korea, Ukraine", "url": "https://www.koreaherald.com/article/10928087", "fonte_id": "korea_herald", "data_pub": "2026-11-06T00:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O subsecretário de Estado para Assuntos Exteriores, Chung Eui-hae, se reuniu com uma delegação de parlamentares britânicos em Seul para discutir relações bilaterais e questões regionais importantes, incluindo a Península Coreana e a guerra na Ucrânia. Ambas as partes trocaram opiniões sobre os assuntos em discussão.", "titulo_pt": "Subsecretário de estado para assuntos exteriores se reúne com parlamentares britânicos para discutir Coreia do norte e Ucrânia", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 247213, "titulo": "N. Korea says Japan's push to raise defense spending will only burden its people", "url": "https://en.yna.co.kr/view/AEN20261106002800315", "fonte_id": "yonhap_news", "data_pub": "2026-11-06T00:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Norte Coreano crit
