<html lang="pt-BR">

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

ses menos desenvolvidos, as pequenas empresas e os trabalhadores jovens correm o risco de serem excluídos a menos que haja melhorias no acesso à energia, infraestrutura digital e habilidades. Um grupo de 380 empresários, executivos e representantes da sociedade civil, liderados pelo economista Roberto Giannetti da Fonseca, enviou uma carta aos candidatos à Presidência Luiz Inácio Lula da Silva e Tarcísio de Freitas solicitando o compromisso com medidas econômicas e políticas para reduzir a taxa Selic a 7,5% em 2027. A TSMC, empresa taiwanesa de fabricação de chips, está avaliando alternativas para componentes de terras raras em seus equipamentos de fábrica com o objetivo de minimizar riscos relacionados a possíveis controles de exportação da China. A GM começou a usar inteligência artificial para reduzir o tempo de desenvolvimento de veículos com IA, pretendendo diminuir a duração do processo para apenas dois anos. A arrecadação federal no mês de setembro foi de R$ 239,4 bilhões, representando um crescimento real de 5,62% em comparação com o mesmo mês do ano anterior, após a deflação da inflação pelo IPCA. A Yara reduzirá a produção de fertilizantes no quarto trimestre devido à alta dos preços do gás natural na Europa. A Bradsaúde registrou um terceiro trimestre acima do esperado, com aumento de 14% no lucro, que atingiu R$ 1,1 bilhão, e uma receita de R$ 14,3 bilhões, crescimento de 9% em comparação ao mesmo período do ano anterior. O dólar e os juros futuros subiram, enquanto a bolsa caiu mais de 1%, influenciados pelo cenário eleitoral e pela alta do petróleo. As bolsas de valores ao redor do mundo caíram nesta quinta-feira devido à forte elevação dos preços do petróleo, em meio a tensões no Oriente Médio e preocupações com a dívida da zona do euro. A Polícia Federal realizou buscas em 12 locais contra grupos suspeitos de operar pirâmides financeiras, afetando mais de 10 mil vítimas entre 2018 e 2020. O petróleo subiu mais de 3% na manhã desta quinta-feira e atingiu o maior valor desde 5 de maio, após ataque a aeroporto na Arábia Saudita. A China enfrenta dificuldades na produção de algo importante, enquanto a França enfrenta uma crise econômica empurrando a taxa de juros do título do governo francês de 10 anos para um novo recorde de 24 anos. O Japão adotará um novo sistema de reembolsos de impostos após a saída a partir de novembro. Três grandes bancos japoneses estão finalizando os preparativos para não participar da terceira lote de investimentos nos Estados Unidos. A Europa não pode esperar que os juros dos Estados Unidos caiam para beneficiar seus próprios mercados - ela deve resolver seus próprios problemas. A China's Economy Has a Huge Weakness: Fabricantes locais estão enfrentando dificuldades para produzir algo muito importante. O orçamento intercalar de dezembro projetará crescimento mais fraco e taxa de desemprego mais alta, conforme economistas alertam para um período difícil de seis meses para a economia australiana. A bolsa de valores australiana cairá mais de 1% devido à forte elevação dos preços do petróleo, em meio a tensões no Oriente Médio e preocupações com a dívida da zona do euro. A B3 e LibertyCard lançaram o primeiro certificado de recebíveis de consignado do Brasil, com uma captação inicial de R$ 5 milhões voltada a investidores de varejo. O investimento mínimo é de R$ 100.", "tecnologia": "A TSMC, uma das principais fabricantes de chips do mundo, está buscando alternativas para os equipamentos de fábrica. A empresa busca diversificar seus fornecedores para garantir a continuidade de sua produção. Em outro desenvolvimento, a Tesla, liderada por Elon Musk, afirma que pretende vender 5 milhões de veículos por ano até 2030, embora os números não sustentem essa meta. A OpenAI enfrenta críticas após especialistas externos identificarem vulnerabilidades em seu sistema de monitoramento durante um teste piloto. O Spotify espera lucros no quarto trimestre acima das estimativas, devido ao investimento em inteligência artificial para aumentar a base de usuários, levando suas ações a subirem mais de 9%. A TSMC está buscando alternativas para os equipamentos de fábrica. A empresa busca diversificar seus fornecedores para garantir a continuidade de sua produção. Em outro desenvolvimento, a Tesla, liderada por Elon Musk, afirma que pretende vender 5 milhões de veículos por ano até 2030, embora os números não sustentem essa meta. A OpenAI enfrenta críticas após especialistas externos identificarem vulnerabilidades em seu sistema de monitoramento durante um teste piloto. O Spotify espera lucros no quarto trimestre acima das estimativas, devido ao investimento em inteligência artificial para aumentar a base de usuários, levando suas ações a subirem mais de 9%.", "ciencia": "A NASA anunciou uma atualização sobre os planos da missão Artemis III, programada para aterrisar astronautas na lua, durante uma conferência de imprensa no dia 23 de outubro, que será transmitida ao vivo. Paralelamente, a Índia intensificou medidas para combater a poluição do ar em Nova Deli, uma das capitais mais poluídas do mundo, antes do inverno. Em um avanço na biotecnologia, pesquisadores da Universidade Técnica de Delft desenvolveram um braço robótico macio que usa microalgas para se mover e manipular objetos, publicado em Nature Communications. Além disso, a primeira rainha-femea do Egito foi revelada através de selos reais perdidos por séculos, enquanto a água-viva imortal inspira estudos sobre rejuvenescimento celular. Um novo chip supercondutor foi testado para identificar sinais de instabilidade em fusão nuclear, e a NASA usará observações gravitacionais para preparar o telescópio Nancy Grace Roman.", "cultura": "A Art Basel Paris, feira de arte contemporânea, encerra suas atividades dois dias antes do agendado, devido às manifestações programadas para este sábado em Paris. O evento, que termina neste domingo, apresenta uma seleção diversificada e de alta qualidade de obras de arte, apesar das tensões sociais. A Globo não incluirá uma transmissão ao vivo durante o último debate entre Lula e Flávio Bolsonaro, apesar do apoio do público nas redes sociais. A artista brasileira Anna Bella Geiger, com 93 anos, ganhou o Prêmio Velázquez de Artes Plásticas, concedido pelo Ministério da Cultura da Espanha, com um valor de 100 mil euros, reconhecendo sua trajetória experimental e contribuição para a formação de várias gerações de artistas. A atriz britânica Judi Dench, de 91 anos, anunciou que deixou de atuar devido à perda de visão devido à degeneração macular, não conseguindo mais atuar no palco ou em filmes. O Theatro São Pedro está comemorando o legado de Milton Nascimento, destacando sua contribuição para a música brasileira. A 50ª Mostra Internacional de Cinema de São Paulo inclui uma retrospectiva dedicada aos filmes produzidos por Paulo Branco, com participações de diretores como Manoel de Oliveira, Raúl Ruiz, Chantal Akerman e Wim Wenders, incluindo algumas obras-primas do cinema. A Globo transmitirá ao vivo um concerto da Orquestra Filarmônica de Goiás, conduzida por Neil Thomson e Jean Louis Steuerman, no Teatro Rio Vermelho, em Goiânia, com a participação dos solistas Jean Louis Steuerman e Carmelo de Los Santos, intitulado 'Natureza e Sons', nesta quinta-feira (22) às 20h, pela Rádio MEC.", "sociedade": "A participação feminina nos conselhos de empresas do IBrX100 aumentou 28% em cinco anos, alcançando 22% em 2021, embora ainda haja 11 companhias sem mulheres em seus conselhos. Em Brasília, uma criança de 5 anos foi picada por um escorpião durante um passeio escolar no Zoológico de Brasília. Um casal suspeito de matar Beatriz Vitória planejava fazer uma tatuagem conjunta exaltando a morte, sugerindo que o crime foi motivado por ciúmes. Os irmãos Jeferson Carmo e Salatiel Rodrigues foram condenados a 11 e 9 anos de prisão, respectivamente, por tentativa de homicídio contra um vendedor de chocolates em Brasília. A decisão de reduzir penas para condenados por delitos sexuais contra menores causou questionamentos e pressionou o Executivo a se defender. No Chile, a população está envelhecendo rapidamente, com uma maior proporção de idosos e uma diminuição da força de trabalho, o que pode criar desafios significativos para o sistema de pensões e a economia do país. Além disso, a China, Arábia Saudita e México suspenderam as compras de aves de Santa Catarina devido à detecção da doença de Newcastle em granjas de perus, levando o governo a decretar emergência sanitária em quatro cidades.", "meio_ambiente": "As ações globais para combater o clima estão insuficientes, conforme um relatório da ONU, que destaca que as medidas implementadas não são suficientes para alcançar os objetivos climáticos estabelecidos. Paralelamente, 96% dos recifes de corais estão em situação crítica e podem colapsar em 50 anos devido ao aquecimento global, informa a União Internacional para a Conservação da Natureza. O Brasil, por sua vez, reduziu suas emissões em 6% desde 2015, mas ainda não atingiu a meta climática de 2025. As mudanças climáticas também afetaram a infraestrutura de energia no país, com mais de 290 torres de transmissão de energia derrubadas desde julho de 2023 devido ao fenômeno El Niño.", "direitos_humanos": "O Tribunal Penal Internacional (TPI), que julga crimes contra o direito internacional, recebeu o prêmio Sakharov do Parlamento Europeu por seu trabalho em prol da justiça e da democracia. Em contraste, um vídeo viral mostrou um soldado israelense lançando um gato sobre uma grade, levantando questionamentos sobre abusos de poder. A vereadora brasileira Marielle Franco foi assassinada em 14 de março de 2018, o que gerou grande comoção. Além disso, a UNICEF, representada pelo diretor regional Edouard Beigbeder para o Oriente Médio e Norte da África, emitiu uma declaração sobre os assassinatos contínuos de crianças na Faixa de Gaza, destacando a preocupação do UNICEF com a situação dos menores nessas regiões. Em outro desenvolvimento, ações coletivas foram apresentadas na Austrália contra o Meta (anteriormente Facebook), acusando as plataformas de causarem dependência e exposição a conteúdo prejudicial a menores, buscando indenização para os jovens usuários. As restrições de privacidade em abrigos para vítimas de violência doméstica também foram um tema de debate, com críticas sobre a falta de proteção adequada dessas instituições."}, "resumo_do_dia": {"politica_nacional": [{"id": 218625, "titulo": "Lula acompanhará apuração do 2º turno em SP; Flávio, em Brasília", "url": "https://www.metropoles.com/colunas/igor-gadelha/lula-acompanhara-apuracao-do-2o-turno-em-sp-flavio-em-brasilia", "fonte_id": "metropoles", "data_pub": "2026-10-22T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula (PT) e Flávio Bolsonaro (PL) escolheram acompanhar a apuração dos votos no 2º turno em cidades diferentes, como ocorreu no 1º turno.", "titulo_pt": "Lula acompanhará apuração do 2º turno em SP; Flávio, em Brasília", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 218549, "titulo": "Equipe de Lula diz que presidente aceitou termos colocados por Flávio", "url": "https://www.cnnbrasil.com.br/eleicoes/equipe-de-lula-diz-que-presidente-aceitou-termos-colocados-por-flavio/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-22T17:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A equipe do presidente Lula confirmou que o mesmo aceitou termos propostos por Flávio, provavelmente se referindo a um acordo político ou de campanha. Uma autorização para o sigilo dos dois candidatos foi assinada durante um encontro entre as campanhas no Tribunal Superior Eleitoral nesta quinta-feira (22).", "titulo_pt": "Equipe de Lula diz que presidente aceitou termos colocados por Flávio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 218504, "titulo": "Ministério da Justiça desenvolve método para identificar imóveis de luxo ligados ao PCC e ao Comando Vermelho", "url": "https://g1.globo.com/sp/sao-paulo/noticia/2026/10/22/ministerio-da-justica-desenvolve-metodo-para-identificar-imoveis-de-luxo-ligados-ao-pcc-e-ao-comando-vermelho.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-22T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Justiça e Segurança Pública desenvolveu uma metodologia para identificar imóveis de luxo registrados em nome de pessoas sem lastro financeiro e vinculadas a organizações criminosas, como o PCC e o CV. Essa metodologia permitiu localizar bens relacionados a essas organizações que ainda não haviam sido identificados nos processos criminais.", "titulo_pt": "Ministério da Justiça desenvolve método para identificar imóveis de luxo ligados a PCC e cv", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 218505, "titulo": "Veja até quando a lei eleitoral permite comícios, caminhadas e campanha na TV neste 2º turno", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/22/eleicoes-2026-prazos-2-turno.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-22T16:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A três dias do segundo turno das eleições de 2026, que ocorrerá no próximo domingo (25), o Tribunal Superior Eleitoral (TSE) estabeleceu que esta quinta-feira (22) é o último dia para realização de comícios e propaganda eleitoral na internet. Fiscais do TRE-AM já observaram quatro ocorrências de propaganda irregular neste fim de semana em Manaus.", "titulo_pt": "Veja até quando a lei eleitoral permite comícios, caminhadas e campanha na TV neste 2º turno", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 218740, "titulo": "Campanhas concordam em abrir sigilos, mas Flávio condiciona entrega a análise de dados de Lula", "url": "https://www.jota.info/eleicoes/eleicoes-2026/campanhas-concordam-em-abrir-sigilos-mas-flavio-condiciona-entrega-a-analise-de-dados-de-lula", "fonte_id": "jota", "data_pub": "2026-10-22T16:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As campanhas concordaram em abrir sigilos, mas Flávio condicionou a entrega dos dados de Lula à análise dos mesmos. Lula aceitou incluir a empresa LILS Palestras, Eventos e Publicações, e o candidato consentiu com a quebra da conta bancária da Alcazar Holdings.", "titulo_pt": "Campanhas concordam em abrir sigilos, mas Flávio condiciona entrega a análise de dados de Lula", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 218446, "titulo": "Folha e Agência Lupa farão checagem ao vivo durante debate da TV Globo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/folha-e-agencia-lupa-farao-checagem-ao-vivo-durante-debate-da-tv-globo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-22T16:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Folha de S.Paulo e a Agência Lupa realizarão checagens durante o último debate presidencial entre Luiz Inácio Lula da Silva e Flávio Bolsonaro, transmitido pela TV Globo, nesta sexta-feira (23). As checagens ocorrerão após o Jornal Nacional.", "titulo_pt": "Folha e Agência Lupa farão checagem ao vivo durante debate presidencial na TV Globo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 218648, "titulo": "Lula e Flávio Bolsonaro autorizam abertura de sigilos, mas decisão cabe ao TSE", "url": "https://veja.abril.com.br/politica/lula-e-flavio-bolsonaro-autorizam-abertura-de-sigilos-mas-decisao-cabe-ao-tse/", "fonte_id": "veja", "data_pub": "2026-10-22T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula e Flávio Bolsonaro autorizaram a abertura de sigilos, mas a decisão final está sob responsabilidade do TSE. O pedido será analisado pelo ministro André Mendonça e os dados devem ser divulgados simultaneamente nesta quinta-feira.", "titulo_pt": "Lula e Flávio Bolsonaro autorizam abertura de sigilos, mas decisão cabe ao TSE", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 218506, "titulo": "Saiba como o Fato ou Fake checará declarações dos candidatos no debate de 2⁰ turno da Globo", "url": "https://g1.globo.com/fato-ou-fake/eleicoes/noticia/2026/10/22/saiba-como-o-fato-ou-fake-checara-declaracoes-dos-candidatos-no-debate-de-2-turno-da-globo.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-22T16:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Fato ou Fake, do Grupo Globo, realizará checagens das declarações dos candidatos Lula (PT) e Flávio Bolsonaro (PL) durante o debate da TV Globo, nesta sexta-feira (23). Uma equipe de mais de 30 jornalistas do Grupo Globo atuará para garantir agilidade e rigor na verificação das afirmações.", "titulo_pt": "Saiba como o Fato ou Fake checará declarações dos candidatos no debate de 2º turno da Globo", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 218418, "titulo": "Vale, Braskem e Samarco saem vencedoras de leilão inédito de gás natural da União", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/10/vale-braskem-e-samarco-saem-vencedoras-de-leilao-inedito-de-gas-natural-da-uniao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-22T16:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A PPSA realizou um leilão inédito de gás natural da União, ofertando 1,1 milhão de metros cúbicos por dia de gás natural para fornecimento entre março e dezembro de 2027. Vale, Braskem e Samarco foram as vencedoras do leilão.", "titulo_pt": "Vale, Braskem e Samarco ganham leilão inédito de gás natural da União", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 218493, "titulo": "Vote Segura mostra boas práticas de políticas de segurança a mulheres", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/vote-segura-mostra-boas-praticas-de-politicas-de evido à alta dos preços do gás natural na Europa.", "titulo_pt": "Yara reduzirá produção de fertilizantes devido à alta do gás na Europa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 218607, "titulo": "Bradsaúde controla sinistralidade e bate consenso; ação sobe 4%", "url": "https://braziljournal.com/bradsaude-controla-sinistralidade-e-bate-consenso-acao-sobe-4", "fonte_id": "brazil_journal", "data_pub": "2026-10-22T14:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Bradsaúde registrou um terceiro trimestre acima do esperado, com aumento de 14% no lucro, que atingiu R$ 1,1 bilhão, e uma receita de R$ 14,3 bilhões, crescimento de 9% em comparação ao mesmo período do ano anterior. A ação da empresa subiu 4% no início da sessão de negociação.", "titulo_pt": "Bradsaúde supera consenso e ação sobe 4%", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 219066, "titulo": "France protests: Macron condemns 'stupid' comments from Trump, others as bond market pressure builds", "url": "https://www.cnbc.com/2026/10/22/macron-trump-france-protests.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-22T14:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A França enfrenta uma crise econômica que está empurrando a taxa de juros do título do governo francês de 10 anos para um novo recorde de 24 anos. O presidente francês, Macron, condenou comentários 'estúpidos' de Trump e outros como a situação econômica se agrava.", "titulo_pt": "França enfrenta crise econômica: macron condena 'comentários estúpidos' de Trump, enquanto pressão na taxa de juros aumenta", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 219201, "titulo": "TSMC seeks factory-equipment alternatives", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/23/2003866444", "fonte_id": "taipei_times", "data_pub": "2026-10-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A TSMC está buscando alternativas para equipamentos de fábrica. A empresa busca diversificar fornecedores para garantir a continuidade de sua produção.", "titulo_pt": "TSMC busca alternativas para equipamentos de fábrica", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 219203, "titulo": "Musk might affect SpaceX-Tesla talks", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/23/2003866446", "fonte_id": "taipei_times", "data_pub": "2026-10-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Está sendo discutido a possibilidade de Musk influenciar as negociações entre SpaceX e Tesla.", "titulo_pt": "Musk poderia influenciar conversas entre spacex e tesla", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 219204, "titulo": "Egis and SiPearl ink deal", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/23/2003866447", "fonte_id": "taipei_times", "data_pub": "2026-10-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Egis e a SiPearl firmaram um acordo recentemente. As empresas não forneceram detalhes adicionais sobre o contrato.", "titulo_pt": "Egis e SiPearl selam acordo", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 219278, "titulo": "Elon Musk says Tesla will sell 5 million cars by 2030 — math says otherwise", "url": "https://www.theverge.com/transportation/1016055/elon-musk-tesla-5-million-cars-2030-reality-check", "fonte_id": "the_verge", "data_pub": "2026-10-22T17:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma chamada de resultados, Elon Musk afirmou que a Tesla pretende vender 5 milhões de veículos por ano até 2030. No entanto, os números não apoiariam essa meta.", "titulo_pt": "Elon Musk diz que a Tesla venderá 5 milhões de carros por ano até 2030 — matemática diz o contrário", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 219063, "titulo": "Third-party evaluators found vulnerabilities in OpenAI monitoring system during test pilot", "url": "https://www.cnbc.com/2026/10/22/metr-redwood-research-open-ai-test.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-22T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Especialistas externos identificaram vulnerabilidades no sistema de monitoramento da OpenAI durante um teste piloto. O CEO Sam Altman prometeu conceder acesso semelhante ao de funcionários aos avaliadores independentes para abordar preocupações crescentes com a segurança.", "titulo_pt": "Especialistas encontram vulnerabilidades no sistema de monitoramento da OpenAI", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 218546, "titulo": "Spotify prevê lucro no 4º trimestre acima das estimativas com apostas em IA", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/spotify-preve-lucro-no-4o-trimestre-acima-das-estimativas-com-apostas-em-ia/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-22T17:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Spotify espera lucros no quarto trimestre acima das estimativas, devido ao investimento em inteligência artificial para aumentar a base de usuários. As ações da empresa subiram mais de 9%.", "titulo_pt": "Spotify prevê lucro no 4º trimestre acima das estimativas com apostas em IA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 219280, "titulo": "Arc browser is shutting down", "url": "https://www.theverge.com/tech/1016832/arc-browser-shutting-down", "fonte_id": "the_verge", "data_pub": "2026-10-22T17:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A The Browser Company anunciou que encerrará o desenvolvimento do seu navegador Arc em 22 de dezembro. O navegador, que era um projeto inovador, será descontinuado após a empresa se concentrar no desenvolvimento do seu novo navegador focado em IA, o Dia.", "titulo_pt": "Navegador arc está sendo encerrado", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 219282, "titulo": "Wildwood’s director says AI is ‘antithetical to everything that we are at this studio’", "url": "https://www.theverge.com/entertainment/1016647/wildwood-travis-knight-interview-ai-laika-stop-motion", "fonte_id": "the_verge", "data_pub": "2026-10-22T16:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Wildwood é um filme de animação stop-motion ambicioso da Laika, conhecida por produções como Coraline e ParaNorman. O filme é uma aventura fantástica que levou cinco anos para ser concluído e envolveu mais de 230 bonecos, incluindo 36 do personagem principal Prue.", "titulo_pt": "Diretor de wildwood afirma que IA é 'antithetico a tudo que somos nesta estúdio'", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 218655, "titulo": "TIM amplia aposta em tecnologia com contratos de nuvem protegidos do dólar", "url": "https://veja.abril.com.br/economia/tim-amplia-aposta-em-tecnologia-com-contratos-de-nuvem-protegidos-do-dolar/", "fonte_id": "veja", "data_pub": "2026-10-22T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A TIM está expandindo sua presença no mercado corporativo de inteligência artificial e serviços digitais através de contratos de nuvem protegidos do dólar, utilizando uma empresa adquirida em 2025.", "titulo_pt": "TIM amplia aposta em tecnologia com contratos de nuvem protegidos do dólar", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 219210, "titulo": "The One Question AI Could Not Answer", "url": "https://www.scmp.com/presented/news/hong-kong/education/topics/garden-house-waldorf-school/article/3371650/one-question-ai-could-not-answer", "fonte_id": "scmp", "data_pub": "2026-10-22T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hong Kong está investindo significativamente em tecnologia educacional, incluindo ferramentas de inteligência artificial, recursos digitais e treinamento. Os policymaker acreditam que os alunos precisam dominar a tecnologia, mas a verdadeira mestria exige mais do que apenas a utilização de telas.", "titulo_pt": "A pergunta de AI que não pode ser respondida", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 219269, "titulo": "Save $150 on the Apple Mac Mini M4, but There’s a Catch", "url": "https://www.wired.com/story/mac-mini-m4-deal-october-2026/", "fonte_id": "wired", "data_pub": "2026-10-22T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Mac Mini M4 da Apple está com desconto de $150, mas é mais caro do que quando foi lançado. Apesar de ser uma boa oferta para um modelo mais antigo, ele ainda é mais caro do que no lançamento.", "titulo_pt": "Economize $150 no Apple Mac Mini M4, mas há um contraponto", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 219071, "titulo": "‘Know Your Agent’ will be the new rule of the AI age", "url": "https://www.ft.com/content/5116beca-1b6e-418e-99d7-462339b3b57e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-22T14:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A regulamentação de agentes autônomos de inteligência artificial será uma nova regra na era da IA. É necessário focar na maneira de controlar o comportamento dessas softwares e estabelecer responsabilidades.", "titulo_pt": "Conheça seu agente será a nova regra da era da IA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 219214, "titulo": "Singapore pushes for quick action on PHP security flaws as hackers prowl", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3371820/singapore-pushes-quick-action-php-security-flaws-hackers-prowl", "fonte_id": "scmp", "data_pub": "2026-10-22T13:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Organizações em Singapura foram incentivadas a corrigir imediatamente duas falhas de segurança críticas no PHP, uma linguagem de programação amplamente utilizada. Segundo a Comissária de Cybersecurity Gwenda Fong, há relatos de tentativas generalizadas de hackers explorar essas vulnerabilidades.", "titulo_pt": "Singapura pressiona por ação rápida sobre falhas de segurança no PHP diante de ameaças de hackers", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 218748, "titulo": "Juíza nega pedido da OAB-SP para proibir a IA jurídica Enter de fechar novos contratos", "url": "https://www.jota.info/justica/juiza-nega-pedido-da-oab-sp-para-proibir-a-ia-juridica-enter-de-fechar-novos-contratos", "fonte_id": "jota", "data_pub": "2026-10-22T13:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A juíza negou o pedido da OAB-SP para proibir a startup Enter de fechar novos contratos. A seccional da Ordem dos Advogados argumentou que a empresa pratica o exercício ilegal da profissão.", "titulo_pt": "Juíza nega pedido da OAB-SP para impedir fechamento de novos contratos pela IA jurídica Enter", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 218592, "titulo": "Justiça nega pedidos da OAB-SP para restringir publicidade e novos contratos da Enter", "url": "https://exame.com/tecnologia/justica-nega-pedidos-da-oab-sp-para-restringir-publicidade-e-novos-contratos-da-enter/", "fonte_id": "exame", "data_pub": "2026-10-22T13:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça negou os pedidos da OAB-SP para restringir a publicidade e os novos contratos da Enter. A empresa terá de preservar documentos e registros da operação desde janeiro de 2024.", "titulo_pt": "Justiça nega pedidos da OAB-SP para restringir publicidade e novos contratos da Enter", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 218598, "titulo": "IA já responde a 40% das dúvidas de consumidores na internet", "url": "https://exame.com/bussola/ia-ja-responde-a-40-das-duvidas-de-consumidores-na-internet/", "fonte_id": "exame", "data_pub": "2026-10-22T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Consultorias indicam que 40% das perguntas de consumidores na internet são respondidas por inteligência artificial. Isso implica em uma necessidade de reestruturação dos dados para pequenas e médias empresas.", "titulo_pt": "IA já responde a 40% das dúvidas de consumidores na internet", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 219303, "titulo": "Earth's hemispheres may have worked together to drive past ice ages", "url": "https://phys.org/news/2026-10-earth-hemispheres-ice-ages.html", "fonte_id": "phys_org", "data_pub": "2026-10-22T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos estudos da Universidade de St Andrews descobriram um processo desconhecido que pode ter ajudado a induzir as últimas eras de gelo. O trabalho, publicado no Journal of Climate, conecta os gelos do Hemisfério Norte à mudança na circulação oceânica e geleiras no Hemisfério Sul, que são conhecidas por reduzir o CO₂ atmosférico. Esta conexão entre as duas características-chave das eras de gelo tem sido um desafio devido à distância entre as regiões.", "titulo_pt": "Os hemisférios da terra podem ter trabalhado juntos para causar eras de gelo passadas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 219287, "titulo": "Top MAHA adviser Calley Means resigns from White House days ahead of midterms", "url": "https://www.statnews.com/2026/10/22/calley-means-resigns-white-house-adviser-maha-movement/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-22T17:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Calley Means, um dos principais assessores do MAHA, deixou a Casa Branca alguns dias antes das eleições gerais.", "titulo_pt": "Assessora principal do MAHA, Calley Means, se demite da casa branca antes das eleições", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 218622, "titulo": "Cientistas encontram \"túmulo aquático\" de baleia nas profundezas do Ártico", "url": "https://www.metropoles.com/ciencia/cientistas-encontram-tumulo-aquatico-de-baleia-nas-profundezas-do-artico", "fonte_id": "metropoles", "data_pub": "2026-10-22T17:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas localizaram um 'túmulo aquático' de baleia nas águas do Ártico. Este é um achado raro, pois representa a queda da baleia, um fenômeno que ocorre quando o corpo do animal chega ao fundo do mar.", "titulo_pt": "Cientistas encontram 'túmulo aquático' de baleia nas profundezas do Ártico", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 219304, "titulo": "Webb captures stars in the early stages of life in a nearby stellar nursery", "url": "https://phys.org/news/2026-10-webb-captures-stars-early-stages.html", "fonte_id": "phys_org", "data_pub": "2026-10-22T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Telescópio Espacial James Webb da NASA/ESA/CSA está revelando partes ocultas do cosmos com seus instrumentos infravermelhos avançados. Em uma nova imagem, o Webb mostrou estrelas anteriormente ocultas pelas nuvens de poeira de NGC 7129, uma nurserie estelar a cerca de 3.300 anos-luz da Terra na constelação Cepheus, melhorando nossa compreensão do nascimento e evolução de novas estrelas.", "titulo_pt": "Webb captura estrelas em estágios iniciais de vida em uma nurserie estelar próxima", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 219305, "titulo": "Webb image reveals young stars brewing in a nebulous cauldron", "url": "https://phys.org/news/2026-10-webb-image-reveals-young-stars.html", "fonte_id": "phys_org", "data_pub": "2026-10-22T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem da NASA/ESA James Webb Space Telescope revela uma região de formação estelar chamada N159, localizada na Nuvem Maior de Magalhães, a cerca de 161.000 anos-luz da Terra. A imagem mostra a formação de estrelas em densos agrupamentos de gás nessa região turbulenta de formação estelar.", "titulo_pt": "Imagem do webb revela estrelas em formação em uma cauldron turbulenta", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 219306, "titulo": "Mosquito bites are more complicated than they appear—getting a closer look might lead to better disease prevention", "url": "https://phys.org/news/2026-10-mosquito-complicated-closer-disease.html", "fonte_id": "phys_org", "data_pub": "2026-10-22T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mosquitos fêmeas precisam de sangue para produzir ovos. Embora muitos estudos tenham se concentrado em como esses insetos famintos encontram suas vítimas, menos se sabe sobre o que acontece após eles pousarem na pele. No entanto, um entendimento melhor pode permitir que os pesquisadores encontrem novas maneiras de prevenir picadas que transmitem doenças como malária e dengue.", "titulo_pt": "Princípios das picadas de mosquito são mais complexos do que se pensa—estudos mais detalhados podem levar à melhor prevenção de doenças", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 219307, "titulo": "When climate data is transformed into visuals, some people and places get overlooked", "url": "https://phys.org/news/2026-10-climate-visuals-people-overlooked.html", "fonte_id": "phys_org", "data_pub": "2026-10-22T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quando desastres climáticos ocorrem, as pessoas em outros lugares podem aprender sobre eles através de números, como o número de mortos, deslocados, casas destruídas e infraestrutura danificada. No entanto, para aqueles que vivenciam o desastre, ele não é apenas uma série de dados, mas representa uma casa, uma família, uma vida e um lugar.", "titulo_pt": "Quando os dados climáticos são transformados em visuais, algumas pessoas e lugares são ignorados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 218460, "titulo": "Startup diz ter usado vírus criado por IA para tratar paciente", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/startup-diz-ter-usado-virus-criado-por-ia-para-tratar-paciente.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-22T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas afirmaram ter usado, pela primeira vez, vírus desenvolvidos por inteligência artificial para tratar um paciente humano. O anúncio foi feito na última terça-feira (20/10/2026).", "titulo_pt": "Startup diz ter usado vírus criado por IA para tratar paciente", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 219308, "titulo": "Wildfires cause Amazon to emit 1.17 billion more metric tons of CO₂ than it absorbs", "url": "https://phys.org/news/2026-10-wildfires-amazon-emit-billion-metric.html", "fonte_id": "phys_org", "data_pub": "2026-10-22T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Entre 2010 e 2024, a selva amazônica emitiu, em média, 1,17 bilhões de toneladas métricas a mais de dióxido de carbono (CO₂) do que absorveu anualmente. Os incêndios florestais foram a principal causa, emitindo aproximadamente 1,47 bilhões de toneladas métricas de CO₂ por ano, bem acima da capacidade de absorção do bosque de 300 milhões de toneladas métricas por ano.", "titulo_pt": "Incêndios causam amazonia a emitir 1,17 bilhões a mais de toneladas métricas de CO₂ do que absorve", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 219339, "titulo": "A nanoparticle revealed the tiny impact of a single gas atom", "url": "https://www.sciencenews.org/article/nanoparticle-tiny-impact-gas-atom", "fonte_id": "science_news", "data_pub": "2026-10-22T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas isolaram a força exercida por uma única partícula de gás, demonstrando o impacto minúsculo de um único átomo ou molécula.", "titulo_pt": "Partícula nanométrica revelou o pequeno impacto de um único átomo de gás", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 219295, "titulo": "Data centers are a target of modern warfare. How do we secure the infrastructure that runs our digital lives?", "url": "https://www.scientificamerican.com/article/data-centers-are-a-target-of-modern-warfare-how-do-we-secure-the-infrastructure-that-runs-our-digital-lives/", "fonte_id": "scientific_american", "data_pub": "2026-10-22T16:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ataques contra data centers na Europa e no Oriente Médio estão levantando questões sobre como proteger a infraestrutura que suporta nossas vidas digitais.", "titulo_pt": "Centrais de dados são alvo de guerra moderna. Como proteger a infraestrutura que suporta nossas vidas digitais?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 219344, "titulo": "NASA’s Hubble Charts Path for Roman with Gravitational Lenses", "url": "https://science.nasa.gov/missions/hubble/nasas-hubble-charts-path-for-roman-with-gravitational-lenses/", "fonte_id": "nasa_news", "data_pub": "2026-10-22T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está usando observações gravitacionais para preparar o telescópio espacial Nancy Grace Roman. Essas observações foram realizadas pelo Hubble e são parte de um esforço para garantir que o novo telescópio esteja pronto para suas missões científicas.", "titulo_pt": "Nasa's Hubble mapeia caminho para Roman com gravitação através de prisma espacial", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 219288, "titulo": "STAT+: Will the Treasury restrict U.S. investment in the Chinese biotech sector?", "url": "https://www.statnews.com/2026/10/22/biotech-news-treasury-restrictions-for-us-investment-in-chinese-biotech/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-22T16:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há rumores de que o Departamento do Tesouro dos Estados Unidos planeja propor uma regra que limitaria as investidas norte-americanas no setor biotecnológico chinês.", "titulo_pt": "Treasury pode restringir investimentos dos EUA no setor biotecnológico chinês", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 219296, "titulo": "The inside story behind OpenAI’s million-dollar math proof", "url": "https://www.scientificamerican.com/article/the-inside-story-behind-openais-million-dollar-math-proof/", "fonte_id": "scientific_american", "data_pub": "2026-10-22T16:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A solução de inteligência artificial para o problema de Navier-Stokes e os detalhes do processo revelam um futuro caótico para a matemática e o mundo.", "titulo_pt": "A história por trás da solução milionária de matemática do OpenAI", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 219297, "titulo": "Astronomers unlock a mystery hidden in van Gogh’s The Starry Night", "url": "https://www.scientificamerican.com/article/astronomers-unlock-a-mystery-hidden-in-van-goghs-the-starry-night/", "fonte_id": "scientific_american", "data_pub": "2026-10-22T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um constelação mal identificada pode revisar o cronograma para criação da icônica pintura de Vincent van Gogh, The Starry Night.", "titulo_pt": "Astrônomos desvendam mistério em The Starry Night de van Gogh", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 219340, "titulo": "Was van Gogh’s ‘The Starry Night’ a flight of fancy or a real sky?", "url": "https://www.sciencenews.org/article/van-gogh-starry-night-real-sky-stars", "fonte_id": "science_news", "data_pub": "2026-10-22T15:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vincent van Gogh pintou o trabalho icônico em ve rêmio espanhol de artes plásticas por trajetória", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/anna-bella-geiger-vence-premio-espanhol-de-artes-plasticas-por-trajetoria.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-22T16:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A artista brasileira Anna Bella Geiger, com 93 anos, ganhou o Prêmio Velázquez de Artes Plásticas, concedido pelo Ministério da Cultura da Espanha, com um valor de 100 mil euros. O júri reconheceu sua trajetória experimental e sua contribuição para a formação de várias gerações de artistas.", "titulo_pt": "Anna Bella Geiger vence prêmio espanhol de artes plásticas por trajetória", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 218400, "titulo": "Art Basel Paris será fechada dois dias mais cedo por causa de manifestações", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/art-basel-paris-sera-fechada-dois-dias-mais-cedo-por-causa-de-manifestacoes.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-22T16:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Art Basel Paris, feira de arte contemporânea, encerrará suas atividades na sexta-feira, dois dias antes do agendado, devido às manifestações programadas para este sábado em Paris. Os organizadores anunciaram a mudança no horário de encerramento na quinta-feira.", "titulo_pt": "Art Basel Paris fechará duas dias antes devido às manifestações", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 218401, "titulo": "William Waack renova contrato com a CNN Brasil e fica na emissora até 2029", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/william-waack-renova-contrato-com-a-cnn-brasil-por-tres-anos.shtml", "fonte_id": "fol
