, "data_pub": "2026-11-12T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Desde décadas, o senador Bernie Sanders defende um 'populismo de mesa de cozinha', focado nas preocupações cotidianas das famílias e da classe trabalhadora. Este enfoque foi captado por candidatos progresistas nos Estados Unidos, contribuindo para o sucesso de suas campanhas.", "titulo_pt": "O populismo econômico está muito de moda: a velha fórmula de Bernie Sanders que fez sucesso entre os democratas", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 258701, "titulo": "Los venezolanos nominados al Latin Grammy que cruzan el país por carretera para evitar al ICE", "url": "https://elpais.com/us/migracion/2026-11-12/los-venezolanos-nominados-al-latin-grammy-que-cruzan-el-pais-por-carretera-para-evitar-al-ice.html", "fonte_id": "elpais_america", "data_pub": "2026-11-12T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Três artistas venezuelanos, que estão processando solicitações de asilo, escolheram viajar de carro para a cerimônia do Latin Grammy em Las Vegas para evitar as autoridades migratórias.", "titulo_pt": "Venezuelanos nominados ao Latin Grammy viajam de carro para cerimônia em las vegas", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 258702, "titulo": "Y la nave espacial aterrizó, para siempre, en Los Ángeles: el ‘Endeavour’, el primer transbordador en verse en un museo", "url": "https://elpais.com/us/2026-11-12/y-la-nave-espacial-aterrizo-para-siempre-en-los-angeles-el-endeavour-el-primer-transbordador-en-verse-en-un-museo.html", "fonte_id": "elpais_america", "data_pub": "2026-11-12T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A partir de 13 de novembro, o Centro de Ciências de California receberá o transbordador espacial Endeavour, após uma espera de quase 15 anos e uma investida de 450 milhões de dólares. Este será o primeiro transbordador a ser exposto em um museu.", "titulo_pt": "E a nave espacial aterrissou, para sempre, em Los angeles: o 'Endeavour', o primeiro transbordador a ser exposto em um museu", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 258709, "titulo": "El viaje del EZLN a Ciudad de México agita el horizonte de las familias buscadoras", "url": "https://elpais.com/mexico/2026-11-12/el-viaje-del-ezln-a-ciudad-de-mexico-agita-el-horizonte-de-las-familias-buscadoras.html", "fonte_id": "elpais_america", "data_pub": "2026-11-12T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os zapatistas optaram por reuniões privadas em várias cidades ao invés de um encontro nacional sobre desaparecidos, o que gerou diferenças com alguns grupos. Eles rejeitaram uma proposta de encontro masivo em Ciudad de México.", "titulo_pt": "Viagem dos zapatistas a cidade do México agita famílias buscadoras", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 258711, "titulo": "“El deseo erótico en Bolivia se educa con racismo”: Juan Pablo Vargas Rollano y la pedagogía antirracista en el mundo virtual", "url": "https://elpais.com/america-futura/2026-11-12/el-deseo-erotico-en-bolivia-se-educa-con-racismo-juan-pablo-vargas-rollano-y-la-pedagogia-antirracista-en-el-mundo-virtual.html", "fonte_id": "elpais_america", "data_pub": "2026-11-12T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O poeta, ensaísta e criador de pensamento crítico Juan Pablo Vargas Rollano publicou em agosto seu livro '01100011 01101001 01101110 01100011 01101111'. O título do livro é codificado em binário e se refere ao desejo erótico em Bolivia, relacionado ao racismo.", "titulo_pt": "O desejo erótico no Brasil é educado com racismo: juan Pablo Vargas Rollano e a pedagogia antirracista no mundo virtual", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 258666, "titulo": "Tiene 16 años, puede sumar 50 números de cinco cifras en 25 segundos y, gracias a su intelecto, ya obtuvo nueve Récords Guinness", "url": "https://www.lanacion.com.ar/lifestyle/tiene-16-anos-puede-sumar-50-numeros-de-cinco-cifras-en-25-segundos-y-gracias-a-su-intelecto-ya-nid11112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-12T09:12:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Aaryan Nitin Shukla, com 16 anos, pode somar 50 números de cinco dígitos em 25 segundos e já obteve nove recordes Guinness. Começou a praticar cálculos mentais aos seis anos, ganhando a Copa Mundial de Cálculo Mental aos 12 anos e sendo considerado uma eminência em matemática na Índia.", "titulo_pt": "Tenho 16 anos, posso somar 50 números de cinco dígitos em 25 segundos e já conquistei nove recordes Guinness", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 258671, "titulo": "ASUS trae a Chile la ProArt P16 con el superchip NVIDIA RTX Spark", "url": "https://www.latercera.com/tecnologia/noticia/asus-trae-a-chile-la-proart-p16-con-el-superchip-nvidia-rtx-spark/", "fonte_id": "la_tercera", "data_pub": "2026-11-12T09:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ASUS lançou no Chile a ProArt P16 com o superchip NVIDIA RTX Spark, que combina CPU e GPU em uma única unidade e oferece até 1 petaflop de desempenho em IA. A laptop já está disponível para venda por 4.499.990 chilenos pesos, enquanto o modelo topo de linha está em pré-venda.", "titulo_pt": "ASUS traz para o Chile a ProArt P16 com o superchip NVIDIA RTX Spark", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 258877, "titulo": "Ukrainian defense tech startup hits $6 billion valuation as investors bet on battle-tested drones", "url": "https://www.cnbc.com/2026/11/12/uforce-defense-tech-drones-warfare-ukraine.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-12T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup ucraniana UFORCE alcançou uma avaliação de 6 bilhões de dólares, com seus drones NEMESIS realizando 300.000 voos de combate e suas embarcações MAGURA contribuindo para a destruição de navios de guerra russos.", "titulo_pt": "Startup de tecnologia militar ucraniana atinge avaliação de 6 bilhões de dólares com drones e embarcações de combate", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 258588, "titulo": "Toyota vê futuro nos EUA para minúsculas picapes, que têm Trump entre os fãs", "url": "https://www.infomoney.com.br/business/global/toyota-ve-futuro-nos-eua-para-minusculas-picapes-que-tem-trump-entre-os-fas/", "fonte_id": "infomoney", "data_pub": "2026-11-12T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Toyota está lançando um modelo de picape pequena inspirado nos caminhões 'kei' japoneses, sob a marca Scion, que será vendido nos Estados Unidos a partir do próximo ano. O modelo é apoiado por figuras como Donald Trump.", "titulo_pt": "Toyota vê futuro nos EUA para picapes minúsculas, com apoio de Trump", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 258589, "titulo": "Líbano enfrenta “catástrofe” econômica após guerra e anos de má gestão", "url": "https://www.infomoney.com.br/business/global/libano-enfrenta-catastrofe-economica-apos-guerra-e-anos-de-ma-gestao/", "fonte_id": "infomoney", "data_pub": "2026-11-12T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Mundial prevê que a inflação no Líbano aumente mais de 17% neste ano, devido a interrupções no abastecimento, aumento dos custos de transporte marítimo e disparada dos preços dos combustíveis. O país enfrenta uma 'catástrofe' econômica após anos de má gestão e uma guerra recente.", "titulo_pt": "Líbano enfrenta 'catástrofe' econômica após guerra e anos de má gestão", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 258480, "titulo": "PIB no Reino Unido cresceu 0,7% no 3º trimestre", "url": "https://www.poder360.com.br/poder-internacional/pib-no-reino-unido-cresceu-07-no-3o-trimestre/", "fonte_id": "poder360", "data_pub": "2026-11-12T07:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PIB do Reino Unido cresceu 0,7% no terceiro trimestre, impulsionado pela alta de 0,9% no setor de serviços.", "titulo_pt": "PIB do Reino Unido cresce 0,7% no 3º trimestre, impulsionado pelo setor de serviços", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 259045, "titulo": "(LEAD) KEPCO Q3 net plunges 78 pct on higher fuel costs", "url": "https://en.yna.co.kr/view/AEN20261112009651320", "fonte_id": "yonhap_news", "data_pub": "2026-11-12T07:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A companhia estatal Korea Electric Power Corp. (KEPCO) informou que seu lucro líquido no terceiro trimestre caiu 78% devido a aumentos nos custos de combustível.", "titulo_pt": "Lucro líquido do KEPCO no terceiro trimestre cai 78% devido a elevação dos custos de combustível", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 259046, "titulo": "S. Korean won hits 15-day high against U.S. dollar on foreign inflows", "url": "https://en.yna.co.kr/view/AEN20261112009900320", "fonte_id": "yonhap_news", "data_pub": "2026-11-12T07:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano atingiu seu nível mais alto em 15 dias em relação ao dólar americano devido a flutuações de investidores estrangeiros.", "titulo_pt": "Won sul-coreano atinge nível mais alto em 15 dias contra dólar", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 258643, "titulo": "Reforma tributária e concessões de saneamento", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-fiscal/reforma-tributaria-e-concessoes-de-saneamento", "fonte_id": "jota", "data_pub": "2026-11-12T07:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma tributária e as concessões de saneamento visam reequilibrar o cenário econômico-financeiro, além de abordar as tarifas. Este tema envolve medidas para melhorar a estrutura tributária e a gestão do saneamento no país.", "titulo_pt": "Reforma tributária e concessões de saneamento para reequilibrar o econômico-financeiro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 258402, "titulo": "Brasil tem uma das piores avaliações do mundo na tributação de bebidas alcoólicas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/11/brasil-tem-uma-das-piores-avaliacoes-do-mundo-na-tributacao-de-bebidas-alcoolicas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil obteve a nota mais baixa entre os 162 países avaliados na primeira edição do Alcohol Tax Scorecard 2026, recebendo 0,33 em uma escala de zero a cinco. Este levantamento internacional analisa a tributação de bebidas alcoólicas.", "titulo_pt": "Brasil tem uma das piores notas do mundo na tributação de bebidas alcoólicas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 258403, "titulo": "Sem sistema pronto, regra que permite passar VR e VA em qualquer maquininha não sai do papel", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/sem-sistema-pronto-regra-que-permite-passar-vr-e-va-em-qualquer-maquininha-nao-sai-do-papel.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A regra que permitiria o uso de Vale-Refeição (VR) e Vale-Alimentação (VA) de qualquer bandeira nas mesmas maquininhas começou a valer no sábado, mas não teve efeito prático, pois os sistemas de interoperabilidade ainda não estão prontos.", "titulo_pt": "Sem sistema pronto, regra para usar VR e VA em qualquer maquininha não entra em vigor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 258404, "titulo": "Imposto Seletivo recebe 179 propostas de emendas, e mais da metade pretende reduzir tributação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/imposto-seletivo-recebe-179-propostas-de-emendas-e-mais-da-metade-pretende-reduzir-tributacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-12T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A medida provisória que estabeleceu as alíquotas do Imposto Seletivo para 2027 recebeu 179 propostas de emendas, sendo que 117 delas, ou 65,4%, buscam reduzir a tributação.", "titulo_pt": "Imposto Seletivo recebe 179 propostas de emendas, e mais da metade pretende reduzir tributação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 258508, "titulo": "CFO do BB diz que grandes produtores do agro atrasam dívidas à espera de ‘milagre’", "url": "https://exame.com/invest/mercados/cfo-do-bb-diz-que-grandes-produtores-do-agro-atrasam-dividas-a-espera-de-milagre/", "fonte_id": "exame", "data_pub": "2026-11-12T06:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CFO do Banco do Brasil, Geovanne Tobias, afirmou que grandes produtores do agronegócio estão atrasando pagamentos de dívidas, esperando por um 'milagre'. O banco registrou provisões de R$ 12 bilhões devido a essa situação, o que reduziria o lucro do banco para R$ 7 bilhões se não fossem feitas essas provisões.", "titulo_pt": "CFO do BB diz que grandes produtores do agro atrasam dívidas à espera de ‘milagre’", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 259054, "titulo": "(LEAD) KOGAS Q3 net more than triples on equity gains, lower costs", "url": "https://en.yna.co.kr/view/AEN20261112006951320", "fonte_id": "yonhap_news", "data_pub": "2026-11-12T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A KOGAS, empresa de gás estatal da Coreia do Sul, registrou lucros líquidos no terceiro trimestre que triplicaram em comparação com o ano anterior, devido a ganhos em investimentos e redução de custos.", "titulo_pt": "Lucros líquidos da KOGAS no terceiro trimestre triplicam", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 259121, "titulo": "Intel China wants to turn untapped renewable energy into AI tokens with computing pods slated for 1H27", "url": "https://www.digitimes.com/news/a20261112PD211/intel-china-renewable-energy-chipmakers-ai-inference-demand.html", "fonte_id": "digitimes", "data_pub": "2026-11-12T05:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A demanda por computação de inteligência artificial (IA) está se expandindo em diversas indústrias e aplicações, levando fabricantes de chips a explorar oportunidades além dos data centers convencionais, estendendo-se para implantações empresariais e dispositivos pessoais. Durante o nono China International Import Expo (CIIE) em 2026, a Intel China apresentou três soluções de computação de IA: pods de computação verde para grandes data centers e campus empresariais, sistemas de inferência de IA integrados para pequenas e médias empresas (PMEs) e PCs de agente de IA para usuários individuais.", "titulo_pt": "Intel China planeja transformar energia renovável não utilizada em tokens de IA com pods de computação verde para 2027", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 258940, "titulo": "AI slump not seen affecting Bank of Japan’s rate-rise plan", "url": "https://www.japantimes.co.jp/business/2026/11/12/economy/boj-rate-hike-ai-demand/", "fonte_id": "japan_times", "data_pub": "2026-11-12T05:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco do Japão ainda prevê uma elevação de taxa a cada três meses, mesmo após as quedas nas cotações das ações de tecnologia.", "titulo_pt": "Redução nas ações de tecnologia não afeta plano de elevação de taxas do banco do Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 258941, "titulo": "Japan’s producer prices pick up, backing case for another BOJ rate hike", "url": "https://www.japantimes.co.jp/business/2026/11/12/economy/japan-producer-prices-october-pick-up/", "fonte_id": "japan_times", "data_pub": "2026-11-12T05:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços dos bens comercializados entre empresas no Japão aumentaram 0.7% em outubro em comparação com o mês anterior, o ritmo mais rápido desde maio. Essa elevação apóia o argumento para uma nova elevação da taxa de juros pela BoJ.", "titulo_pt": "Preços de produção no Japão crescem, respaldando caso para aumento de taxa pela BOJ", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 259015, "titulo": "Kumho Petrochemical steps up workplace safety, green initiatives", "url": "https://www.koreaherald.com/article/10935563", "fonte_id": "korea_herald", "data_pub": "2026-11-12T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Kumho Petrochemical Group está fortalecendo a segurança no trabalho e a gestão ambiental em suas principais subsidiárias, implementando sistemas de monitoramento mais inteligentes, controles mais rigorosos de segurança química e tecnologias de reciclagem de recursos. Além disso, a empresa está expandindo medidas preventivas de segurança e melhorando os processos produtivos para reduzir desperdícios.", "titulo_pt": "Kumho Petrochemical intensifica medidas de segurança no trabalho e iniciativas verdes", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 258914, "titulo": "Nvidia shares slide as board considers Huang’s future", "url": "https://www.ft.com/content/a93307a7-e2cd-4abd-bd89-c38832d8c40e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-12T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Nvidia caíram mais de 7% antes do mercado de Wall Street abrir, enquanto a diretoria considera o futuro do CEO. A situação do CEO permanece incerta.", "titulo_pt": "Ações da nvidia caem após diretoria avaliar futuro do ceo", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 258932, "titulo": "Nvidia’s Asian supply chain prepares for life after Huang", "url": "https://www.japantimes.co.jp/business/2026/11/12/nvidia-supply-chain-asia/", "fonte_id": "japan_times", "data_pub": "2026-11-12T09:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A diretoria da Nvidia está se reunindo para decidir o futuro do CEO Jensen Huang após relatos de dois casos de infidelidade extramatrimonial.", "titulo_pt": "Diretoria da nvidia se reúne para decidir futuro de Huang após relatos de infidelidade", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 258672, "titulo": "Ciberseguridad e IA: 5 claves para identificar estafas telefónicas", "url": "https://www.latercera.com/tendencias/noticia/ciberseguridad-e-ia-5-claves-para-identificar-estafas-telefonicas/", "fonte_id": "la_tercera", "data_pub": "2026-11-12T09:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "María Isabel Manjarrez, Senior Security Researcher da Kaspersky, descreve os componentes de uma estafa telefônica e oferece conselhos para se proteger contra esses golpes cada vez mais avançados.", "titulo_pt": "Cibersegurança e IA: 5 chaves para identificar estafas telefônicas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 259099, "titulo": "Quanta shifts 2027 capex toward power, the new battleground for AI server ODMs", "url": "https://www.digitimes.com/news/a20261112PD243/quanta-2027-capex-ai-server-revenue.html", "fonte_id": "digitimes", "data_pub": "2026-11-12T08:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quanta Computer registrou uma forte receita e lucro no terceiro trimestre de 2026 e prevê que as operações acelerem no quarto trimestre, impulsionadas por servidores de IA. A empresa planeja investir entre NT$40 bilhões e NT$45 bilhões em capital em 2027, apesar de dizer que os gastos começarão a moderar.", "titulo_pt": "Quanta ajusta investimentos de 2027 para servidores de potência, novo campo de batalha para fabricantes ODMs de servidores de IA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 259100, "titulo": "Pegatron targets multiyear AI server surge, with Nvidia Vera Rubin shipments set for 1H27", "url": "https://www.digitimes.com/news/a20261112PD244/pegatron-rubin-nvidia-2026-shipments.html", "fonte_id": "digitimes", "data_pub": "2026-11-12T08:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pegatron prevê um aumento multi-anual de servidores de IA, com as entregas do sistema Vera Rubin programadas para o primeiro semestre de 2027. A empresa espera que seu negócio de servidores contribua com cerca de 10% das receitas consolidadas em 2026 e aumente várias vezes em 2027, após começar a enviar servidores de geração próxima em 2027.", "titulo_pt": "Pegatron almeja aumento multi-anual de servidores de IA, com entregas do Vera Rubin previstas para o primeiro semestre de 2027", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 259093, "titulo": "Biomatter lands $18M to speed up enzyme development with AI", "url": "https://tech.eu/2026/11/12/biomatter-lands-18m-to-speed-up-enzyme-development-with-ai/", "fonte_id": "tech_eu", "data_pub": "2026-11-12T08:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Biomatter, uma empresa especializada no design personalizado de enzimas, levantou $18 milhões em uma rodada de financiamento Series A sob inscrição excessiva, liderada pela Astanor, com a participação de investidores existentes UVC Partners e Inve...", "titulo_pt": "Biomatter arrecada $18 milhões para acelerar o desenvolvimento de enzimas com inteligência artificial", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 259101, "titulo": "Foxconn sees high-double-digit AI rack growth in 2027", "url": "https://www.digitimes.com/news/a20261112PD245/foxconn-2027-2026-revenue-growth.html", "fonte_id": "digitimes", "data_pub": "2026-11-12T08:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foxconn registrou uma receita de mais de 3 trilhões de NT$ no terceiro trimestre de 2026 e elevou sua projeção para o ano inteiro. A empresa espera alta de dois dígitos nos embarques de racks de inteligência artificial em 2027, buscando ganhar market share por meio de soluções de IA diversificadas e um cliente mais amplo.", "titulo_pt": "Foxconn projeta alta de dois dígitos nos embarques de racks de IA em 2027", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 259102, "titulo": "Aleees makes Tainan plant launchpad for North American LFP expansion", "url": "https://www.digitimes.com/news/a20261112PD240/aleees-plant-taiwan-lithium-expansion.html", "fonte_id": "digitimes", "data_pub": "2026-11-12T08:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Aleees, fabricante de cátodos de fósforo de ferro-lítio (LFP), assinou um memorando de entendimento (MOU) com um parceiro norte-americano em 12 de novembro para produzir cátodos de LFP através de uma joint venture, em resposta à crescente demanda por baterias de energia e armazenamento de energia e ao aceleramento da localização da cadeia de suprimentos na Europa e nos Estados Unidos.", "titulo_pt": "Aleees torna Tainan base para expansão de LFP para o norte americano", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 259103, "titulo": "Chinese universities obtain Nvidia chips despite US export controls", "url": "https://www.digitimes.com/news/a20261112PD237/chips-nvidia-university-supplier-military.html", "fonte_id": "digitimes", "data_pub": "2026-11-12T08:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias universidades chinesas, incluindo a Northwestern Polytechnical University, uma das sete universidades de defesa nacionais da China, conseguiram adquirir chips Nvidia apesar das restrições de exportação dos EUA, conforme relatado pela Reuters. Os chips H200 da Nvidia foram comprados por CNY875,000 (aproximadamente US$177,629) através de um fornecedor local, em vez de diretamente da Nvidia.", "titulo_pt": "Universidades chinesas adquirem chips Nvidia em desafio às restrições dos EUA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 259094, "titulo": "Nebuly raises $21M Series A to turn AI investments into measurable results", "url": "https://tech.eu/2026/11/12/nebuly-raises-21m-series-a-to-turn-ai-investments-into-measurable-results/", "fonte_id": "tech_eu", "data_pub": "2026-11-12T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nebuly, uma plataforma que ajuda as empresas a medir o valor de negócios de seus agentes de inteligência artificial, levantou US$ 21 milhões em uma rodada de financiamento série A, liderada pela Planven. A rodada contou com a participação de Exor Ventures.", "titulo_pt": "Nebuly arrecada us$ 21 milhões em rodada série A para medir o valor de negócios dos agentes de IA", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 258985, "titulo": "Nvidia’s Jensen Huang affair revives China Initiative concerns in Silicon Valley", "url": "https://www.scmp.com/news/china/science/article/3374151/nvidias-jensen-huang-affair-revives-china-initiative-concerns-silicon-valley", "fonte_id": "scmp", "data_pub": "2026-11-12T08:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Nvidia, Jensen Huang, admitiu ter sido infiel à sua esposa, o que levantou preocupações sobre a iniciativa chinesa em Silicon Valley. Vários profissionais chineses trabalhando em grandes empresas de tecnologia na região expressaram temores sobre as possíveis implicações do caso para suas carreiras.", "titulo_pt": "Escândalo de infidelidade do ceo da nvidia reaviva preocupações da iniciativa chinesa em Silicon Valley", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 259104, "titulo": "Naver signs US$1.5 billion AI cloud deal with US firm", "url": "https://www.digitimes.com/news/a20261112VL211/naver-ai-data-center-capacity-nvidia.html", "fonte_id": "digitimes", "data_pub": "2026-11-12T07:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Naver firmou um contrato de serviços de computação de inteligência artificial (IA) no valor de aproximadamente US$1,5 bilhão com uma empresa norte-americana especializada em inferência de IA, estabelecendo seu primeiro grande cliente para o negócio de AI Factory que está desenvolvendo em parceria com a Nvidia e Brookfield.", "titulo_pt": "Naver firma contrato de US$1,5 bilhão em serviços de IA com empresa norte-americana", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 258916, "titulo": "Who could run Nvidia after Jensen Huang?", "url": "https://www.ft.com/content/e47f7d4a-88d7-41e4-8c77-8ea8e0769353?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-12T07:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O futuro da presidência executiva da Nvidia está incerto após relatos de um segundo caso extraconjugal envolvendo seu co-fundador.", "titulo_pt": "Quem poderia liderar a Nvidia após Jensen Huang?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 259105, "titulo": "India's Tata Electronics reportedly seeks up to US$2 billion in loans", "url": "https://www.digitimes.com/news/a20261112VL213/fab-2026-expansion-production-iphone.html", "fonte_id": "digitimes", "data_pub": "2026-11-12T07:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Tata Electronics está buscando financiamento adicional no valor de até 2 bilhões de dólares em um momento em que praticamente todas as etapas de sua expansão enfrentam dificuldades, incluindo atrasos e problemas em seus projetos de produção de chips e na unidade que produz componentes para o iPhone.", "titulo_pt": "Tata Electronics busca até 2 bilhões de dólares em empréstimos", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 258933, "titulo": "Chinese AI firms rush to secure Nvidia chip capacity as scandal stirs fear of curbs", "url": "https://www.japantimes.co.jp/business/2026/11/12/tech/china-ai-nvidia-spy-us-chip-curbs/", "fonte_id": "japan_times", "data_pub": "2026-11-12T07:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas chinesas de inteligência artificial estão correndo para garantir a capacidade de uso de chips Nvidia após um escândalo envolvendo o CEO da Nvidia, Jensen Huang, que pode levar ao endurecimento das restrições por parte dos Estados Unidos sobre o uso remoto de processadores avançados.", "titulo_pt": "Escândalo envolvendo Nvidia pode levar a endurecimento de restrições para empresas chinesas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 259062, "titulo": "Sunken treasure: Historic US ocean liner reborn as artificial reef", "url": "https://phys.org/news/2026-11-sunken-treasure-historic-ocean-liner.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um majestoso e praticamente indestrutível navio de passageiros do século XX, que transportou líderes reais, estrelas do cinema e até mesmo a 'Mona Lisa' para os Estados Unidos, está sendo deliberadamente afundado para se tornar o maior recife artificial do mundo.", "titulo_pt": "Tesouro enterrado: antiga navio de passageiros americano se transforma em recife artificial", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 259059, "titulo": "Opinion: 3 things new governors must do to lead on health", "url": "https://www.statnews.com/2026/11/12/new-governors-2027-health-priorities-agenda/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-12T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os governadores devem conhecer as taxas de vacinação no jardim de infância por condado no primeiro dia de mandato, segundo Mandy Cohen e Ellen Montz.", "titulo_pt": "Opinião: 3 coisas que os novos governadores devem fazer para liderar em saúde", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 259060, "titulo": "Opinion: I research MAHA and Black Americans. The relationship is complicated — and fascinating", "url": "https://www.statnews.com/2026/11/12/maha-black-american-activists-voters-health-care-midterms/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-12T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jerel Ezell afirma que Kennedy e MAHA têm copiado estratégias de ativistas negros, mas ao mesmo tempo têm trabalhado para desestruturar a comunidade afro-americana.", "titulo_pt": "Opinião: eu pesquiso MAHA e negros americanos. A relação é complicada — e fascinante", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 259061, "titulo": "Newly elected doctors and scientists hope to restore trust in science. It won’t be easy", "url": "https://www.statnews.com/2026/11/12/trust-in-science-physician-lawmakers-rebuild-belief/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-12T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitos médicos e cientistas foram eleitos recentemente. A recuperação da confiança no sistema científico não será fácil.", "titulo_pt": "Eleitos médicos e cientistas esperam reconstruir a confiança no cientifismo", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 259063, "titulo": "New way of detecting date-rape drug use found in Switzerland", "url": "https://phys.org/news/2026-11-date-rape-drug-switzerland.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores suíços desenvolveram um novo método para detectar o droga de estupro GHB no urina até 72 horas após a ingestão, o que pode ser útil para investigações de abusos sexuais.", "titulo_pt": "Novo método de detecção de uso de droga de estupro encontrado na Suíça", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 259064, "titulo": "Europe's Hera spacecraft begins close inspections of an asteroid rammed by NASA in a 2022 test", "url": "https://phys.org/news/2026-11-europe-hera-spacecraft-asteroid-rammed.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T09:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um spacecraft europeu está realizando inspeções perto de um asteroide que foi impactado pela NASA em 2022 como parte de um teste de defesa planetária.", "titulo_pt": "Europeu Hera inicia inspeções perto de asteroide impactado pela NASA em 2022", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 259065, "titulo": "Baboons made themselves at home in this town, and a battle between their defenders and haters ensued", "url": "https://phys.org/news/2026-11-baboons-home-town-defenders-haters.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T09:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na cidade de Simon's Town, há anos, defensores e opositores de babuinos têm se confrontado tanto nas redes sociais quanto na vida real.", "titulo_pt": "Babuinos se instalaram nesta cidade, e uma batalha entre seus defensores e opositores eclodiu", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 258673, "titulo": "Descubren un fármaco con potencial de reparar el daño y la inflamación cerebral que provoca el Alzheimer", "url": "https://www.latercera.com/tendencias/noticia/descubren-un-farmaco-con-potencial-de-reparar-el-dano-y-la-inflamacion-cerebral-que-provoca-el-alzheimer/", "fonte_id": "la_tercera", "data_pub": "2026-11-12T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa investiga um medicamento experimental com potencial para reparar o dano neuronal e reduzir a inflamação cerebral associados ao Alzheimer. Os resultados sugerem que esse fármaco pode ter efeitos benéficos no combate à doença.", "titulo_pt": "Descoberto medicamento com potencial para reparar danos cerebrais causados pelo Alzheimer", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 258397, "titulo": "Aranhas-saltadoras apresentam sono em duas fases, como mamíferos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/aranhas-saltadoras-apresentam-sono-em-duas-fases-como-mamiferos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-12T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado na revista PNAS sugere que aranhas-saltadoras apresentam sono dividido em duas fases, similar ao padrão observado em mamíferos. O trabalho foi publicado no último dia 26.", "titulo_pt": "Aranhas-saltadoras apresentam sono em duas fases, como mamíferos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 259066, "titulo": "How potentials and electric fields together control reactions on catalyst surfaces", "url": "https://phys.org/news/2026-11-potentials-electric-fields-reactions-catalyst.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T08:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores do Departamento de Ciência de Interface (ISC) demonstraram que reações eletroquímicas nas interfaces sólido-álvoro podem ser afetadas por dois fatores relacionados, mas distintos: a potencial aplicada pode impulsionar uma reação, enquanto os campos elétricos no ambiente estendido podem modificar os conjuntos que determinam os parâmetros de ativação, sem necessariamente constituir uma força de empurrão termodinâmico.", "titulo_pt": "Como potenciais e campos elétricos juntos controlam reações em superfícies de catalisador", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 258936, "titulo": "Congo Ebola outbreak still out of control after six months, MSF says", "url": "https://www.japantimes.co.jp/news/2026/11/12/world/science-health/congo-ebola-outbreak-six-months/", "fonte_id": "japan_times", "data_pub": "2026-11-12T07:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A MSF afirma que o surto de Ebola no Congo ainda está fora de controle após seis meses, com muitos casos provavelmente sendo ignorados e a transmissão nos hospitais em algumas áreas sendo ampla.", "titulo_pt": "Surto de Ebola no congo ainda fora de controle após seis meses, diz MSF", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 258992, "titulo": "Silk Road in orbit: China to build 20-satellite ‘space AI’ system for Oman", "url": "https://www.scmp.com/news/china/science/article/3374157/silk-road-orbit-china-build-20-satellite-space-ai-system-oman", "fonte_id": "scmp", "data_pub": "2026-11-12T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Star Vision, com sede em Hangzhou, irá construir para o Omã uma rede de 20 satélites que usarão inteligência artificial para processar imagens em órbita e detectar navios e inundações em tempo real. O contrato, avaliado em mais de 200 milhões de dólares, foi assinado recentemente durante uma visita oficial do sultão do Omã, Haitham bin Tariq, em Beijing.", "titulo_pt": "Caminho da seda no espaço: china construirá sistema de 20 satélites inteligentes para o omã", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 259145, "titulo": "SpaceX launches 2nd mystery mission for US Space Force in 6-day span (photos)", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-launches-2nd-mystery-mission-for-us-space-force-in-6-day-span-photos", "fonte_id": "space_com", "data_pub": "2026-11-12T05:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX lançou uma missão classificada para a Força Espacial dos Estados Unidos a partir da Califórnia nesta noite (11 de novembro). Esta é a segunda missão classificada da empresa em uma span de seis dias.", "titulo_pt": "Spacex realiza segunda missão classificada para a força espacial dos EUA em seis dias (fotos)", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 259124, "titulo": "APOD: 2026 November 12 – Moon, Venus and Spica Meet", "url": "https://science.nasa.gov/image-article/apod-2026-november-12-moon-venus-and-spica-meet/", "fonte_id": "nasa_news", "data_pub": "2026-11-12T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 12 de novembro de 2026, a Lua, Vênus e Spica se alinharão no céu noturno. Esta configuração celestial será visível à noite.", "titulo_pt": "Lua, vênus e Spica se alinham em 12 de novembro de 2026", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 259125, "titulo": "Scotland’s Flow Country", "url": "https://science.nasa.gov/earth/earth-observatory/scotlands-flow-country/", "fonte_id": "nasa_news", "data_pub": "2026-11-12T05:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bacias pantanosas na Highlands da Escócia armazenam grandes quantidades de carbono.", "titulo_pt": "Escócia: países de cobertura pantanosa", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 259067, "titulo": "From Romania to Kazakhstan, summer droughts linked to less winter ice in two rapidly warming seas", "url": "https://phys.org/news/2026-11-romania-kazakhstan-summer-droughts-linked.html", "fonte_id": "phys_org", "data_pub": "2026-11-12T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este verão, com baixa precipitação e ondas de calor repetidas, registrou uma das secas mais severas na Europa desde 1540. Simulações indicam que essas secas se tornarão mais frequentes e intensas no futuro devido ao aquecimento global causado pelo homem.", "titulo_pt": "De romênia a cazaquistão, secas de verão ligadas a menos gelo no inverno em dois mares rapidamente aquecidos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 258653, "titulo": "Papa León XIV en Perú, EN VIVO: el regreso al país en el que fue nombrado obispo y su agenda hoy, minuto a minuto", "url": "https://www.lanacion.com.ar/sociedad/papa-leon-xiv-en-peru-en-vivo-el-regreso-al-pais-en-el-que-fue-nombrado-obispo-y-su-agenda-hoy-nid12112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-12T09:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Papa Francisco chegou a Peru após sua viagem pela Argentina e foi recebido pela presidente Keiko Fujimori. Na quinta-feira, ele participará de uma celebração na Catedral de Lima e uma vigília com jovens.", "titulo_pt": "Papa francisco no peru, minuto a minuto: o retorno ao país onde foi nomeado bispo e sua agenda", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 258440, "titulo": "Justiça não consegue encontrar Bento Ribeiro para intimá-lo em ação movida por Marcos Mion", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/11/justica-nao-consegue-encontrar-bento-ribeiro-para-intima-lo-em-acao-movida-por-marcos-mion.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-12T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça de São Paulo não localizou o humorista Bento Ribeiro para intimá-lo em uma ação movida pelo apresentador Marcos Mion. O processo refere-se a uma disputa judicial entre os dois, ex-colegas na MTV Brasil (1990-2013).", "titulo_pt": "Justiça não consegue localizar Bento Ribeiro para processo movido por Marcos Mion", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 259129, "titulo": "‘I railed against the stereotype of the humourless lesbian’: the cheeky, feminist photography of Jill Posener", "url": "https://www.theguardian.com/artanddesign/2026/nov/12/jill-posener-interview-radical-feminist-photography", "fonte_id": "guardian_culture", "data_pub": "2026-11-12T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jill Posener é uma fotógrafa que usou humor nas suas fotos para contrariar a misoginia dos anos 80 e o conservadorismo de Thatcher. Ela retratou uma placa publicitária grafitada em Londres em 1979, com uma frase sexista, transformando-a em um objeto de crítica feminista.", "titulo_pt": "‘Eu me rebelava contra o estereótipo da lesbianagem sem humor’: a fotografia feminista e irônica de Jill Posener", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 259017, "titulo": "Lim Yunchan wins Apple Music’s album of the year while his best friend Lee Hanurij sweeps Geneva", "url": "https://www.koreaherald.com/article/10935492", "fonte_id": "korea_herald", "data_pub": "2026-11-12T07:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O pianista Lim Yunchan e o compositor Lee Hanurij, amigos próximos e dois dos nomes mais promissores da música clássica coreana, receberam importantes prêmios internacionais em categorias diferentes. Lee, de 20 anos, venceu a categoria de composição no 80º Concurso Internacional de Genebra, ganhando todos os seis prêmios especiais, incluindo o prêmio do público, o prêmio do público jovem e o prêmio dos estudantes.", "titulo_pt": "Lim Yunchan vence prêmio de álbum do ano da Apple Music enquanto seu amigo Lee Hanurij vence prêmios em genebra", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 258441, "titulo": "'Ópera do Malandro' e 'Tina Turner, O Musical' são destaques no Prêmio Bibi Ferreira", "url": "https://  "titulo_pt": "Paralisação de camionetas: governo anuncia reingresso do projeto e congelamento das tarifas do combustível até fevereiro", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 257510, "titulo": "Average wage rises, but 70% still making less", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/12/2003867573", "fonte_id": "taipei_times", "data_pub": "2026-11-12T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O salário médio aumentou, mas 70% das pessoas ainda ganham menos do que antes. A pesquisa indica que embora haja um crescimento médio nos rendimentos, a maioria dos trabalhadores não beneficiou desse aumento.", "titulo_pt": "Salário médio aumenta, mas 70% ganham menos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 258494, "titulo": "Covid: quais grupos devem se preocupar com a nova escalada do vírus", "url": "https://veja.abril.com.br/saude/covid-quais-grupos-devem-se-preocupar-com-a-nova-escalada-do-virus/", "fonte_id": "veja", "data_pub": "2026-11-11T23:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministério informou que cerca de 15% dos casos da doença podem se tornar graves e 5% podem evoluir para episódios críticos. A nova escalada do vírus deve preocupar grupos que correm risco de desenvolver formas mais severas da doença.", "titulo_pt": "Covid: quais grupos devem se preocupar com a nova escalada do vírus", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 258466, "titulo": "Espanha vive dia de greve geral e protesto por moradia antes da eleição", "url": "https://www.cartacapital.com.br/mundo/espanha-vive-dia-de-greve-geral-e-protesto-por-moradia-antes-da-eleicao/", "fonte_id": "cartacapital", "data_pub": "2026-11-11T22:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas participaram de uma greve geral e protestos por moradia em Madri e outras cidades espanholas, antes das eleições.", "titulo_pt": "Espanha vive dia de greve geral e protesto por moradia antes das eleições", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 257872, "titulo": "Policiais são presos acusados de levar drogas e garotas de programa a presídio de SP", "url": "https://veja.abril.com.br/brasil/policiais-sao-presos-acusados-de-levar-drogas-e-garotas-de-programa-a-presidio-de-sp/", "fonte_id": "veja", "data_pub": "2026-11-11T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Policiais foram presos acusados de envolvimento com o tráfico de drogas e a exploração de garotas de programa. Os investigados podem responder por crimes como associação criminosa, tráfico de drogas, corrupção ativa e corrupção passiva.", "titulo_pt": "Policiais presos por tráfico e exploração de garotas de programa", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 258074, "titulo": "Los expertos en psicología coinciden: las personas que se desahogan con sus compañeros en el trabajo generan reducciones de bienestar y aumento de rumiación", "url": "https://www.lanacion.com.ar/lifestyle/los-expertos-en-psicologia-coinciden-las-personas-que-se-desahogan-con-sus-companeros-en-el-trabajo-nid11112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-11T21:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da Universidade de Michigan analisou como as conversas entre colegas de trabalho afetam a saúde emocional. As conversas foram associadas a uma diminuição do bem-estar e a um aumento da ruminação.", "titulo_pt": "Peritos em psicologia concordam: desabafos com colegas de trabalho diminuem bem-estar e aumentam ruminação", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 258075, "titulo": "Los voluntarios del Papa: 25.000 nombres para mejorar la Argentina", "url": "https://www.lanacion.com.ar/opinion/los-voluntarios-del-papa-25000-nombres-para-mejorar-la-argentina-nid11112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-11T21:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A visita do Papa Leão XIV destacou o potencial do voluntariado na Argentina, um movimento silencioso com poder transformador que, embora se fortaleça em ocasiões especiais, não se consolida como um hábito permanente e estruturado na sociedade.", "titulo_pt": "Os voluntários do Papa: 25.000 nomes para melhorar a Argentina", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 257950, "titulo": "Cacique Raoni é internado com oscilações na pressão e infecção pulmonar", "url": "https://www.metropoles.com/brasil/cacique-raoni-e-internado-com-oscilacoes-na-pressao-e-infeccao-pulmonar", "fonte_id": "metropoles", "data_pub": "2026-11-11T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cacique Raoni, de 94 anos, está internado desde domingo, 8 de novembro, em Mato Grosso, devido a oscilações na pressão e infecção pulmonar. Seu quadro de saúde é considerado estável.", "titulo_pt": "Cacique Raoni internado com oscilações na pressão e infecção pulmonar", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 258552, "titulo": "“Não há contradição” entre petróleo e transição energética, diz ministro", "url": "https://www.cnnbrasil.com.br/internacional/coletiva-transicao-energetica-petroleo-venezuela-brasil-cop-31/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T09:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro João Paulo Capobianco afirmou que não há contradição entre o petróleo e a transição energética durante a COP31. Essa declaração foi feita um dia após o presidente discutir investimentos no setor petrolífero com a Venezuela.", "titulo_pt": "Não há contradição entre petróleo e transição energética, diz ministro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 258536, "titulo": "Ponto de recarga para carros elétricos é destruído por incêndio no DF", "url": "https://www.metropoles.com/distrito-federal/ponto-de-recarga-para-carros-eletricos-e-destruido-por-incendio-no-df", "fonte_id": "metropoles", "data_pub": "2026-11-12T09:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incidente de incêndio destruiu um ponto de recarga para carros elétricos na noite de 11 de novembro na Avenida Alagados, em Santa Maria (DF). Não houve registros de vítimas.", "titulo_pt": "Ponto de recarga para carros elétricos é destruído por incêndio no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 258663, "titulo": "Cubrieron parte de un glaciar con lana de oveja y redujeron su deshielo en más del 50%", "url": "https://www.lanacion.com.ar/ciencia/cubrieron-parte-de-un-glaciar-con-lana-de-oveja-y-redujeron-su-deshielo-en-mas-del-50-nid11112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-12T09:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um experimento suíço demonstrou que o uso de fibras naturais, como lã de ovelha, pode reduzir o deshielo de glaciares em mais de 50%. Este método evita a degradação ambiental associada aos materiais sintéticos.", "titulo_pt": "Parte de um glaciar foi coberta com lã de ovelha e seu deshielo foi reduzido em mais de 50%", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 258665, "titulo": "Se aceleró el calentamiento global: el planeta consumió casi la totalidad de su margen de seguridad climática", "url": "https://www.lanacion.com.ar/ciencia/se-acelero-el-calentamiento-global-el-planeta-consumio-casi-la-totalidad-de-su-margen-de-seguridad-nid11112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-12T09:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo científico indica que o aquecimento global já consumiu quase toda a margem de segurança climática estabelecida pelo Acordo de Paris. Os especialistas alertam sobre a rapidez do processo.", "titulo_pt": "Acelerou o aquecimento global: o planeta consumiu quase toda a margem de segurança climática", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 258674, "titulo": "Alerta por temperaturas extremas: norte y centro del país podrían alcanzar hasta 38°C", "url": "https://www.latercera.com/tendencias/noticia/alerta-por-temperaturas-extremas-norte-y-centro-del-pais-podrian-alcanzar-hasta-38c/", "fonte_id": "la_tercera", "data_pub": "2026-11-12T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Direção Meteorológica de Chile emitiu uma alerta para altas temperaturas extremas que se estenderão até a tarde de quinta-feira. A Região Metropolitana também declarou uma Alerta Amarilla por calor intenso.", "titulo_pt": "Alerta para temperaturas extremas: norte e centro do país podem atingir até 38°C", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 258577, "titulo": "Os ventos que vêm dos EUA e o clima quente na COP31", "url": "https://apublica.org/podcast/2026/11/bom-dia-fim-do-mundo/os-ventos-que-vem-dos-eua-e-o-clima-quente-na-cop31/", "fonte_id": "agencia_publica", "data_pub": "2026-11-12T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O podcast examina a importância do multilateralismo na luta contra a crise climática. Os ventos dos Estados Unidos e o clima quente são mencionados como contextos para a discussão.", "titulo_pt": "Os ventos dos EUA e o clima quente na COP31", "veiculo": "Agência Pública", "pais": "Brasil", "classe": "B"}, {"id": 258509, "titulo": "COP31 chega ao quarto dia com despedida de Lula e debates sobre cidades resilientes", "url": "https://exame.com/esg/cop31-chega-ao-quarto-dia-com-saida-de-lula-e-debates-sobre-cidades-resilientes/", "fonte_id": "exame", "data_pub": "2026-11-12T06:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A COP31 prossegue com debates sobre investimentos em infraestrutura urbana, descarbonização industrial e redução de emissões de metano após a conclusão da Cúpula dos Líderes, que reuniu chefes de Estado até esta tarde.", "titulo_pt": "COP31 encerra quarto dia com foco em infraestrutura urbana e descarbonização", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 258870, "titulo": "At least two dead while others are trapped in the rubble after a building collapse in New York City", "url": "https://www.euronews.com/2026/11/12/at-least-two-dead-while-others-are-trapped-in-the-rubble-after-a-building-collapse-in-new-", "fonte_id": "euronews", "data_pub": "2026-11-12T04:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos duas pessoas morreram e outras ficaram presas sob os escombros após o colapso de um edifício em Nova York. Um morador do edifício, Anderson Velez, relatou que sua esposa o alertou sobre a situação de seus dois filhos, de 2 e 7 anos, que estavam entre as pessoas presas.", "titulo_pt": "Pelo menos duas mortas e outras presas em escombros após colapso de edifício em nova York", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 257942, "titulo": "Prédio desaba parcialmente em Nova York e deixa pessoas soterradas", "url": "https://www.metropoles.com/mundo/predio-desaba-parcialmente-em-nova-york-e-deixa-pessoas-soterradas", "fonte_id": "metropoles", "data_pub": "2026-11-11T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um prédio desabou parcialmente no bairro de Flatbush, no Brooklyn, em Nova York, deixando pessoas soterradas. Bombeiros estão realizando uma operação de resgate no local.", "titulo_pt": "Prédio desaba parcialmente em Nova York e deixa pessoas soterradas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 258018, "titulo": "UE está longe da meta de cortar emissões no transporte em 90% até 2050", "url": "https://www.dw.com/pt-br/ue-está-longe-da-meta-de-cortar-emissões-no-transporte-em-90-até-2050/a-79912043?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-11T21:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Europeia está longe de atingir a meta de reduzir as emissões no setor de transporte em 90% até 2050. Embora as frotas mais limpas estejam transformando a mobilidade no continente, muitas cidades ainda avançam devagar em direção à sustentabilidade.", "titulo_pt": "UE está longe da meta de cortar emissões no transporte em 90% até 2050", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 257883, "titulo": "Brasil sobe seis posições em ranking de proteção do clima e supera Alemanha", "url": "https://veja.abril.com.br/agenda-verde/brasil-sobe-seis-posicoes-em-ranking-de-protecao-do-clima-e-supera-alemanha/", "fonte_id": "veja", "data_pub": "2026-11-11T20:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil subiu seis posições no ranking de proteção do clima, alcançando o 21º lugar entre 64 nações e a União Europeia, devido à redução de 16% nas emissões de gases de efeito estufa.", "titulo_pt": "Brasil avança seis posições em ranking de proteção climática e supera Alemanha", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 258127, "titulo": "‘The world we know is over’ without urgent climate action, leaders tell Cop31", "url": "https://www.theguardian.com/environment/2026/nov/11/the-world-we-know-is-over-marshall-islands-president-cop31", "fonte_id": "guardian_world", "data_pub": "2026-11-11T18:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente das Ilhas Marshall advertiu sobre agravamento das inundações, enquanto o secretário-geral da ONU propôs uma taxa sobre empresas de petróleo e gás. Sem ação urgente climática, os líderes afirmam que o mundo como conhecemos está em perigo.", "titulo_pt": "O mundo como conhecemos está acabado sem ação urgente sobre o clima, dizem líderes em Cop31", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 256982, "titulo": "Brasil extremo: seca atinge 59% do país e alagamentos, 49,5% dos municípios", "url": "https://www.metropoles.com/brasil/brasil-extremo-seca-atinge-59-do-pais-e-alagamentos-495-dos-municipios", "fonte_id": "metropoles", "data_pub": "2026-11-11T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa do IBGE mostra que 59% do Brasil está sob seca e 49,5% dos municípios enfrentam alagamentos. O relatório destaca o acentuado cenário climático extremo no país.", "titulo_pt": "Brasil extremo: seca atinge 59% do país e alagamentos, 49,5% dos municípios", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 256792, "titulo": "Setores de aço e cimento vão receber R$ 81 milhões para reduzir emissão de CO2", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/setores-de-aco-e-cimento-vao-receber-r-81-milhoes-para-reduzir-emissao-de-co2.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-11T15:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Embrapii e a agência alemã GIZ lançaram uma chamada de financiamento no valor de R$ 81 milhões para projetos de pesquisa e desenvolvimento voltados à redução das emissões de CO2 na cadeia industrial do aço e do cimento no Brasil.", "titulo_pt": "Setores de aço e cimento vão receber R$ 81 milhões para reduzir emissão de CO2", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 256923, "titulo": "Após clima de inverno, temporais voltam ao Centro-Sul; veja previsão", "url": "https://exame.com/brasil/apos-clima-de-inverno-temporais-voltam-ao-centro-sul-veja-previsao/", "fonte_id": "exame", "data_pub": "2026-11-11T14:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As massas de ar polar se afastam e as temperaturas começam a subir. Entre quarta e quinta-feira, áreas do Centro-Sul do país podem enfrentar chuva forte, granizo e ventos de até 80 km/h.", "titulo_pt": "Depois do inverno, temporais voltam ao Centro-Sul; confira a previsão", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 257034, "titulo": "Brasil salta em ranking de proteção climática após queda do desmatamento na Amazônia", "url": "https://www.dw.com/pt-br/brasil-salta-em-ranking-de-proteção-climática-após-queda-do-desmatamento-na-amazônia/a-79919030?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-11T14:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil melhorou seu ranking de proteção climática devido à redução do desmatamento na Amazônia e ao aumento da utilização de energias renováveis. No entanto, a expansão do petróleo e gás e as emissões de gases de efeito estufa de setores poluentes continuam sendo obstáculos para um avanço maior.", "titulo_pt": "Brasil avança no ranking de proteção climática após queda do desmatamento na Amazônia", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 258983, "titulo": "Debt collector, 20, held in Hong Kong after 15 doxxed over unpaid loans", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3374197/debt-collector-20-held-hong-kong-after-15-doxxed-over-unpaid-loans", "fonte_id": "scmp", "data_pub": "2026-11-12T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um indivíduo de 20 anos foi preso em Hong Kong sob suspeita de divulgar informações pessoais de 15 vítimas online sem consentimento, em relação a empréstimos não pagos. A Comissaria de Proteção de Dados da cidade anunciou que mensagens contendo dados pessoais dos vítimas foram postadas em duas contas de mídia social em setembro.", "titulo_pt": "Coletor de dívidas, de 20 anos, detido em Hong Kong após doxxar 15 pessoas por empréstimos não pagos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 258548, "titulo": "Relatório expõe perseguição a cristãos após avanço do terrorismo na África", "url": "https://www.metropoles.com/mundo/relatorio-expoe-perseguicao-a-cristaos-apos-avanco-do-terrorismo-na-africa", "fonte_id": "metropoles", "data_pub": "2026-11-12T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório publicado pela fundação Ajuda à Igreja que Sofre (ACN) revela que a perseguição contra cristãos aumentou entre 2024 e 2026. O relatório destaca o aumento da perseguição após o avanço do terrorismo na África.", "titulo_pt": "Relatório mostra aumento da perseguição a cristãos após avanço do terrorismo na África", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 258906, "titulo": "Amnesty says UN, South Sudan officials failed to prevent village massacre", "url": "https://www.aljazeera.com/news/2026/11/12/amnesty-says-un-south-sudan-officials-failed-to-prevent-village-massacre?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-12T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma organização de direitos humanos informou que as Nações Unidas e oficiais sul-sudaneses falharam em prevenir o massacre em um vilarejo. Segundo o relatório, as forças de paz tinham conhecimento de um possível ataque em Abiemnom, onde mais de 200 pessoas foram mortas.", "titulo_pt": "Amnistia diz que ONU e oficiais sul-sudaneses falharam em prevenir massacre em vilarejo", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 258909, "titulo": "Mother reunites with sons taken under Pinochet regime 40 years ago", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/12/aje-onl-nf_mother-reunites-with-sons-taken-under-pinochet-111126?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-12T03:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mãe chilena reencontrou seus filhos após 40 anos, que foram levados durante o regime de Pinochet.", "titulo_pt": "Mãe se reencontra com filhos raptados durante regime de Pinochet há 40 anos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 258069, "titulo": "Rescatan a un bebé en Estados Unidos tras ser enterrado vivo en una jaula para perros", "url": "https://www.lanacion.com.ar/el-mundo/rescatan-a-un-bebe-en-estados-unidos-tras-ser-enterrado-vivo-en-una-jaula-para-perros-nid11112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-11T21:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um bebê foi resgatado nos Estados Unidos após ter sido enterrado vivo em uma jaula para cães em Carolina do Sul. A polícia deteve o pai do bebê, considerado o principal suspeito do caso.", "titulo_pt": "Resgate de bebê enterrado vivo em jaula para cães na carolina do sul", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 258021, "titulo": "Vítimas polonesas do nazismo apelam à sociedade civil alemã", "url": "https://www.dw.com/pt-br/vítimas-polonesas-do-nazismo-apelam-à-sociedade-civil-alemã/a-79919393?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-11T20:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Atualmente, menos de 50 mil pessoas vivem na Polônia que foram perseguidas pelo nazismo. Representantes das vítimas estão pedindo doações ao público alemão, diante da recusa de Berlim em pagar reparações.", "titulo_pt": "Vítimas polonesas do nazismo pedem doações à sociedade civil alemã", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 258301, "titulo": "Trump admin loses fight to spy on random journalists’ LinkedIn DMs", "url": "https://arstechnica.com/tech-policy/2026/11/trump-admin-loses-fight-to-spy-on-random-journalists-linkedin-dms/", "fonte_id": "ars_technica", "data_pub": "2026-11-11T18:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal determinou que as fontes confidenciais são o 'órgão vital' da liberdade de imprensa no caso envolvendo o DM do LinkedIn. O governo Trump perde um dos mais seguros da América Latina, em um dos mais violentos.", "titulo_pt": "Morte de jornalista ilustra a deterioração das condições em Ecuador", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 257035, "titulo": "Corte britânica descriminaliza sexo gay em Trinidad e Tobago", "url": "https://www.dw.com/pt-br/corte-britânica-descriminaliza-sexo-gay-em-trinidad-e-tobago/a-79916807?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-11T13:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem de 61 anos teve sucesso após uma década de luta judicial. A última instância de apelação, que decidiu descriminalizar o sexo gay em Trinidad e Tobago, está localizada em Londres, refletindo o legado colonial.", "titulo_pt": "Corte britânica descriminaliza sexo gay em Trinidad e Tobago", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 257458, "titulo": "African rights body raises alarm over treatment of Niger’s Mahamid Arabs", "url": "https://www.aljazeera.com/news/2026/11/11/african-rights-body-raises-alarm-over-treatment-of-nigers-mahamid-arabs?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-11T12:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma comissão de direitos humanos pediu ao presidente da Nigéria que interceda sobre supostas violações cometidas contra os Mahamid, um grupo árabe na Nigéria.", "titulo_pt": "Organização de direitos humanos alerta para abusos contra os Mahamid, na nigéria", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 256315, "titulo": "Ed Miliband says national security of all countries at risk from climate crisis", "url": "https://www.theguardian.com/environment/2026/nov/11/ed-miliband-national-security-climate-crisis-cop31", "fonte_id": "guardian_world", "data_pub": "2026-11-11T09:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário de Estado britânico para function renderSecao(topico) {

function toggleDrill(id) {
  const el = document.getElementById(id);

  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
