<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "25/10/2026 19:23", "stats": {"noticias_novas": 473, "resumos_gerados": 160}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Os eleitores do Brasil votaram neste domingo (25) no segundo turno entre Flávio Bolsonaro e Lula. O ministro Cristiano Zanin do STF estendeu o horário de votação até as 19h, gerando debate e críticas de políticos e partidos. A decisão vale para os locais onde as urnas ainda não foram fechadas, conforme informou Zanin. Mesários relataram falta de orientação sobre a reabertura das urnas em São Paulo, enquanto alguns deputados criticaram a prorrogação. A substituição de urnas eletrônicas no segundo turno será realizada em 1.516 unidades, mas não está relacionada à prorrogação do horário de votação. Além disso, a campanha de Lula notificou companhias aéreas após denúncias de passageiros com dificuldades para viajar e votar. O resultado da eleição deve ser conhecido após o encerramento das apurações.", "mundo": "As eleições presidenciais no Brasil estão em andamento, com Lula da Silva liderando com mais de 57% dos votos no baloté especial, contra Flávio Bolsonaro, que tem cerca de 42%. O horário de votação foi estendido até as 19h para garantir que todos pudessem votar. Na Sérvia, a Lista Estudantil venceu as eleições legislativas antecipadas com alta participação de 70%, enquanto o presidente Aleksandar Vučić reconheceu a derrota para o movimento liderado por estudantes. Na França, o presidente Emmanuel Macron enfrenta críticas por um projeto de lei que torna os protestantes responsáveis por danos causados por vandalismo durante manifestações. Em Israel, um ataque israelense em uma universidade de Gaza resultou na morte de três pessoas, enquanto o fenômeno El Niño causou inundações no nordeste da Argentina, desalojando mais de 2.000 pessoas.\n\nA geopolítica global enfrenta diversos desafios e crises em diferentes regiões. Em primeiro lugar, a Ucrânia, Rússia e Estados Unidos planejam uma reunião trilateral em novembro para reabrir negociações de paz, mostrando a complexidade das relações internacionais e a necessidade de diplomacia para resolver conflitos. Em segundo lugar, Israel realizou um ataque aéreo em Gaza, resultando em mortes, enquanto o Irã advertiu com uma resposta 'inimaginável' a qualquer agressão dos Estados Unidos, refletindo a crescente tensão na região do Oriente Médio. Por fim, a situação no Brasil é considerada um desastre geopolítico, de acordo com um analista político, devido a dúvidas sobre a segurança do sistema eleitoral, evidenciando a importância das instituições para a estabilidade política mundial.", "economia": "A Federação está para liderar uma pausa hawkish de três entidades, indicando que a taxa de juros será mantida estável, mas com uma postura mais conservadora. As despesas com combustíveis da Taipower aumentarão devido às tensões geopolíticas, elevando os custos para aquisição de combustíveis. Os preços dos combustíveis permaneceram estáveis por mais uma semana, apesar do aumento nos preços do petróleo, mantendo-se estáveis por seis semanas consecutivas. O home office pode interromper reuniões de trabalho por videoconferência devido a elementos da vida pessoal, como crianças correndo pela casa ou barulhos de reformas. É possível obter rendimentos equivalentes aos títulos públicos mesmo investindo em uma carteira de renda fixa que inclui empresas em risco, devido à diversificação no crédito privado. A indústria de transformação brasileira continua com crescimento inferior ao global, ocupando atualmente o 62º lugar no ranking, uma queda significativa desde 2024, quando estava na metade superior do ranking. Apesar de uma pequena recuperação recente, o desempenho da indústria permanece fraco.", "tecnologia": "A inteligência artificial (IA) continua sendo um tema central na indústria tecnológica, com empresas como a Nvidia assumindo riscos bilionários para apoiar o seu crescimento. Por outro lado, a Anthropic está planejando um IPO bilionário, enquanto outras empresas de IA adiam suas estreias na bolsa devido à instabilidade do mercado, juros elevados e dúvidas sobre os gastos com IA. O uso da IA em plataformas de mídia social, como a MODA, está sendo melhorado para oferecer mais transparência. A Grok lançou o primeiro episódio de sua 'Odisséia' gerada por IA, e Elon Musk divulgou a adaptação através de sua plataforma Grok Imagine. As preocupações com a segurança da informação também estão em alta, com duas falhas críticas no PHP quase causando uma crise global na internet. Além disso, a Tesla está considerando a possibilidade de ressuscitar o modelo SUV Freemont, e a NASA quer levar um supercomputador com IA para a Lua para testar a navegação autônoma em ambiente lunar.", "ciencia": "Pesquisas recentes sobre a Via Láctea revelaram que a galáxia cresceu de baixo para cima, com camadas de estrelas mais jovens se formando em camadas cada vez mais finas, o que ampliou nosso entendimento sobre a estrutura e evolução da nossa galáxia. Em outro avanço tecnológico, corvos demonstraram ser mais rápidos em tomar decisões visuais do que humanos e macacos, com uma média de 235 milissegundos para identificar a direção de um padrão de pontos. A equipe do HZB descobriu vórtices polares em superlattices (BaTiO₃/SrTiO₃)₁₀ sobre silício, o que abre novas possibilidades para tecnologias baseadas em silício. O estudo da AstraZeneca na conferência ESMO evidencia o progresso da empresa na oncologia, enquanto a missão robótica MMX do Japão, que partirá em 20 de outubro de 2026, visa explorar a lua marciana Fobos. Além disso, a descoberta de três buracos negros ativamente alimentados em uma única galáxia a mais de 12,5 bilhões de anos-luz da Terra revela um cenário notável do início do universo.", "cultura": "O documentário 'You Can See Everything', dirigido por Lance Oppenheim, estreou com um lucro expressivo de 24 milhões de dólares no box office, liderando as bilheterias. O filme retrata a vida íntima de celebridades, incluindo um close-up frontal de Billy Evans, que não se importou com a exposição. Na área de entretenimento, a banda Turnstile realizou um show em massa na base do Monumento a Washington, arrecadando mais de 220 mil dólares para auxílio humanitário. Em outro segmento cultural, a exposição no Palácio Capanema apresenta murais de Candido Portinari, retratando os 'Ciclos Econômicos Brasileiros', mas não desperta grande entusiasmo entre os visitantes. Além disso, o escritor Hugo Gonçalves destaca a herança colonial no Rio de Janeiro, especialmente no quarto de empregada, e a discussão sobre os 'late bloomers', pessoas que atingem o sucesso ou a plenitude vital mais tarde do que o esperado, também ganha destaque na discussão cultural.", "sociedade": "Em Santos, litoral paulista, um homem de 28 anos foi agredido física e verbalmente por desconhecidos após se afastar de um ato político. O pai da vítima suspeita que a agressão tenha sido motivada por homofobia ou por questões políticas. No município de Goianésia, Goiás, um jovem de 19 anos faleceu após ser atropelado durante uma carreata em apoio a Flávio Bolsonaro. Na França, quase mil pessoas foram presas durante grandes protestos, apesar das autoridades terem conseguido evitar os tumultos e saques vistos no fim de semana anterior. No Brasil, o Ministério da Igualdade Racial considerou inaceitável uma cena em que um homem negro estava acorrentado durante um ato, comparando-a ao período da escravidão. Além disso, o Ministério Público Federal abriu um inquérito para investigar o apagão na saúde pública do Amapá, identificando falhas estruturais no Sistema Único de Saúde (SUS) e o represamento de demanda por cirurgias especializadas. Em Coreia do Sul, o percentual de estudantes de ensino médio que experimentaram sentimentos de depressão ultrapassou o de estudantes de ensino superior pela terceira vez consecutiva, conforme dados do Instituto de Desenvolvimento Educacional da Coreia.", "meio_ambiente": "Comunidades indígenas brasileiras expressaram preocupações com o resultado das eleições, acreditando que o futuro do ambiente nacional está em risco. Eles temem que o novo governo possa reduzir as proteções ambientais, o que poderia levar a diversos impactos negativos sobre a biodiversidade e os recursos naturais do país. Essas preocupações são fundamentadas em políticas anteriores que reduziram a área protegida em terras indígenas, levando a debates intensos sobre o equilíbrio entre o desenvolvimento econômico e a preservação ambiental.", "direitos_humanos": "A Arquidiocese de Nova York concordou em pagar 800 milhões de dólares a mais de 1.300 sobreviventes de abuso sexual, em um acordo que se destaca como o segundo maior envolvendo um arcebispo católico nos Estados Unidos. Este acordo, que se soma a outros pagamentos de centenas de milhões de dólares por dioceses em todo o país, reflete a crescente pressão sobre as instituições religiosas e sociais para enfrentar e compensar o abuso sexual. Em outro desenvolvimento, o Ministério Público Federal (MPF) abriu um procedimento para investigar supostas violações do direito de uso do nome social por um banco, destacando a importância do respeito aos direitos de identidade dos indivíduos. Além disso, a regra do Departamento de Segurança Nacional (DHS) nos Estados Unidos foi alterada, reduzindo o prazo para responder a notificações de refugiados de 30 para 10 dias, afetando diretamente aqueles que buscam asilo no país. No entanto, o texto não menciona questões específicas sobre a situação de crianças cegas e surdas em Gaza."}, "resumo_do_dia": {"politica_nacional": [{"id": 225553, "titulo": "Escola no DF mantém 4 das 11 seções abertas após decisão de Zanin", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://aovivo.folha.uol.com.br/poder-poder_e_politica/2026/10/25/6567-acompanhe-ao-vivo-o-segundo-turno-entre-flavio-bolsonaro-e-lula-nas-eleicoes-de-2026.shtml#post467807", "fonte_id": "folha_poder", "data_pub": "2026-10-25T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na escola de ensino médio Elefante Branco, em Brasília, 4 das 11 seções permaneceram abertas para votação após as 17h, enquanto as outras já haviam sido encerradas antes da decisão de prorrogação do prazo pelo ministro Cristiano Zanin, do STF.", "titulo_pt": "Escola no DF mantém 4 das 11 seções abertas após decisão de Zanin", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 225554, "titulo": "PF decide abrir investigações sobre denúncias de restrições ao transporte nas eleições", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/pf-decide-abrir-investigacoes-sobre-denuncias-de-restricoes-ao-transporte-nas-eleicoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-25T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal está investigando suspeitas de restrições ao transporte de eleitores durante o segundo turno das eleições, realizado neste domingo (25).", "titulo_pt": "PF investiga suspeitas de restrições ao transporte de eleitores no segundo turno das eleições", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 225660, "titulo": "Eleitores da BA e SP ficam sem votar por urnas fechadas, apesar de horário", "url": "https://www.metropoles.com/colunas/milena-teixeira/eleitores-da-ba-e-sp-ficam-sem-votar-por-urnas-fechadas-apesar-de-horario", "fonte_id": "metropoles", "data_pub": "2026-10-25T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eleitores em Bahia e São Paulo foram impedidos de votar após as urnas serem fechadas, conforme relatado em vídeos nas redes sociais. Locais de votação ficaram vazios após o encerramento do horário eleitoral.", "titulo_pt": "Eleitores da BA e SP ficam sem votar por urnas fechadas, apesar de horário", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 225661, "titulo": "Mesários \"perdidos\" esperam orientação sobre reabertura de urnas em SP", "url": "https://www.metropoles.com/sao-paulo/mesarios-perdidos-esperam-orientacao-sobre-reabertura-de-urnas-em-sp", "fonte_id": "metropoles", "data_pub": "2026-10-25T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Cristiano Zanin do STF estendeu o horário de votação em todo o país até às 19h. Mesários relatam falta de orientação sobre a reabertura das urnas em São Paulo.", "titulo_pt": "Mesários 'perdidos' esperam orientação sobre reabertura de urnas em SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 225845, "titulo": "AO VIVO resultado das eleições 2026 – acompanhe a apuração da disputa entre Flávio Bolsonaro e Lula no 2º turno", "url": "https://www.jota.info/eleicoes/eleicoes-2026/ao-vivo-eleicoes-2026-acompanhe-a-votacao-ate-as-19h-e-a-disputa-entre-flavio-bolsonaro-e-lula-no-2o-turno", "fonte_id": "jota", "data_pub": "2026-10-25T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os eleitores votam para presidente da República e governadores em cinco estados e no Distrito Federal. A apuração do segundo turno entre Flávio Bolsonaro e Lula será transmitida ao vivo a partir das 16h.", "titulo_pt": "AO VIVO resultado das eleições 2026 – acompanhe a apuração entre Flávio Bolsonaro e Lula no 2º turno", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 225662, "titulo": "Eleições 2026: substituição de urnas eletrônicas no 2° turno vai para 1.516", "url": "https://www.metropoles.com/brasil/eleicoes-2026-substituicao-de-urnas-eletronicas-no-2-turno-vai-para-1-516", "fonte_id": "metropoles", "data_pub": "2026-10-25T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A substituição de urnas eletrônicas no segundo turno das eleições 2026 será realizada em 1.516 unidades, correspondendo a 0,28% do total de equipamentos no Brasil. Essas trocas não estão relacionadas a uma possível prorrogação do horário de votação no país.", "titulo_pt": "Substituição de urnas eletrônicas no 2º turno das eleições 2026 atinge 1.516 unidades", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 225814, "titulo": "Rogério Marinho critica decisão de Zanin e acusa tentativa de tumultuar eleição", "url": "https://veja.abril.com.br/brasil/rogerio-marinho-critica-decisao-de-zanin-e-acusa-tentativa-de-tumultuar-eleicao/", "fonte_id": "veja", "data_pub": "2026-10-25T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Rogério Marinho criticou a decisão de Zanin e acusou uma tentativa de tumultuar a eleição. Marinho também mencionou a atuação anterior do ministro como advogado do presidente da República.", "titulo_pt": "Rogério Marinho critica decisão de Zanin e acusa tentativa de tumultuar eleição", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 225670, "titulo": "Nikolas detona decisão de Zanin: \"Quer ganhar no tapetão\"", "url": "https://www.metropoles.com/minas-gerais/nikolas-detona-decisao-de-zanin-quer-ganhar-no-tapetao", "fonte_id": "metropoles", "data_pub": "2026-10-25T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Nikolas publicou um vídeo criticando a decisão judicial que, segundo ele, favorece Lula e alimenta a narrativa de fraude eleitoral.", "titulo_pt": "Nikolas critica decisão judicial em favor de lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 225671, "titulo": "Tarcísio critica decisão de Zanin: \"Estão querendo tumultuar a eleição\"", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/tarcisio-critica-decisao-de-zanin-estao-querendo-tumultuar-a-eleicao", "fonte_id": "metropoles", "data_pub": "2026-10-25T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tarcísio criticou a decisão de Zanin, afirmando que o PT está tentando tumultuar a eleição devido à certeza da derrota. Ele negou as acusações sobre a redução na frota de transporte.", "titulo_pt": "Tarcísio critica decisão de Zanin e afirma que pt quer tumultuar a eleição", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 225734, "titulo": "Zanin diz que votação até 19h vale apenas para urnas ainda abertas", "url": "https://www.infomoney.com.br/politica/zanin-diz-que-votacao-ate-19h-vale-apenas-para-urnas-ainda-abertas/", "fonte_id": "infomoney", "data_pub": "2026-10-25T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Zanin afirmou que a votação estendida até às 19h é válida apenas para as seções eleitorais que ainda não haviam encerrado às 17h. A extensão do horário de votação não se aplica às urnas que já haviam sido fechadas no horário original.", "titulo_pt": "Zanin diz que votação até 19h vale apenas para urnas ainda abertas", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 225564, "titulo": "É a ira, estúpido", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/mafalda-anjos/2026/10/e-a-ira-estupido.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-25T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há alguns dias, um amigo brasileiro questionou sobre os protestos na Europa, comparando-os com a situação econômica favorável do Brasil. Esses protestos ocorreram em vários países da Europa, como Portugal, Espanha, França, Itália, Bélgica, Albânia e Grécia, nas últimas semanas.", "titulo_pt": "É a ira, estúpido", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 225846, "titulo": "Cristiano Zanin esclarece decisão que mandou estender votação até as 19h", "url": "https://www.jota.info/eleicoes/eleicoes-2026/cristiano-zanin-esclarece-decisao-que-mandou-estender-votacao-ate-as-19h", "fonte_id": "jota", "data_pub": "2026-10-25T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cristiano Zanin esclareceu uma decisão que resultou na extensão do horário de votação até as 19h. Eleitores, mesários e presidentes de seções eleitorais ficaram sem saber como proceder.", "titulo_pt": "Cristiano Zanin esclarece decisão que estendeu votação até as 19h", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 225676, "titulo": "Ex-estrategista de Trump critica decisão de Zanin: “Não dá para acreditar”", "url": "https://www.metropoles.com/mundo/ex-estrategista-de-trump-critica-decisao-de-zanin-nao-da-para-acreditar", "fonte_id": "metropoles", "data_pub": "2026-10-25T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jason Miller, ex-estrategista de Trump, criticou a prorrogação do horário de votação no Brasil, após pedido da campanha de Lula ao STF. Miller expressou sua descrença com a decisão.", "titulo_pt": "Ex-estrategista de Trump critica prorrogação do horário de votação", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 225738, "titulo": "TSE orienta seções ainda abertas a manter votação até as 19h após ordem do STF", "url": "https://www.infomoney.com.br/politica/tse-orienta-secoes-ainda-abertas-a-manter-votacao-ate-as-19h-apos-ordem-do-stf/", "fonte_id": "infomoney", "data_pub": "2026-10-25T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) orientou as seções ainda abertas a manter a votação até as 19h, conforme determinação do Superior Tribunal Federal (STF) por meio de decisão de Cristiano Zanin. O presidente do TSE enviou um ofício para garantir o cumprimento desta decisão.", "titulo_pt": "TSE orienta seções ainda abertas a manter votação até as 19h após ordem do STF", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 225821, "titulo": "A cobrança da campanha de Lula por cancelamentos de voos na véspera de segundo turno", "url": "https://veja.abril.com.br/politica/a-cobranca-da-campanha-de-lula-por-cancelamentos-de-voos-na-vespera-de-segundo-turno/", "fonte_id": "veja", "data_pub": "2026-10-25T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Equipe do candidato Lula notificou as companhias aéreas após receber dezenas de denúncias de passageiros sobre dificuldades para viajar e votar no segundo turno das eleições presidenciais.", "titulo_pt": "A cobrança de Lula por cancelamentos de voos na véspera do segundo turno", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 225714, "titulo": "Duas mulheres morreram após serem arrastadas por correnteza em São Paulo", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/duas-mulheres-morreram-apos-serem-arrastadas-por-correnteza-em-sao-paulo/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-25T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Duas mulheres perderam a vida após serem arrastadas pela correnteza de um córrego no bairro Casa Branca, em Jundiaí, durante as chuvas da madrugada deste domingo.", "titulo_pt": "Duas mulheres morreram após serem arrastadas por correnteza em jundiaí", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 225428, "titulo": "HK agents risk losing Taiwan status", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/26/2003866611", "fonte_id": "taipei_times", "data_pub": "2026-10-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Agentes de Hong Kong podem correr o risco de perder o estatuto de Taiwan. O texto sugere que há uma possibilidade de alteração no status desses agentes.", "titulo_pt": "Agentes de hong kong podem perder estatuto de Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 225429, "titulo": "Claims of vote-buying across Taiwan being probed", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/26/2003866612", "fonte_id": "taipei_times", "data_pub": "2026-10-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ações estão sendo tomadas para investigar possíveis casos de compra de votos em todo o território de Taiwan. As autoridades estão examinando relatos de atividades suspeitas relacionadas ao voto.", "titulo_pt": "Investigações sobre compra de votos em Taiwan estão em andamento", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 225431, "titulo": "Musk accuses Ukraine of violating Starlink’s terms", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/26/2003866614", "fonte_id": "taipei_times", "data_pub": "2026-10-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Musk acusa a Ucrânia de violar os termos do Starlink. O título em português é 'Musk acusa Ucrânia de violar termos do Starlink'.", "titulo_pt": "Musk acusa Ucrânia de violar termos do Starlink", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 225432, "titulo": "Barack Obama blasts Trump’s ‘chaos and cruelty’", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/26/2003866615", "fonte_id": "taipei_times", "data_pub": "2026-10-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Barack Obama criticou as ações de Donald Trump, descrevendo-as como causadoras de 'caos e crueldade'.", "titulo_pt": "Barack Obama critica 'caos e crueldade' de Trump", "veiculo": "Taipei Times", "pai  com uma avaliação global, principalmente devido ao aquecimento projetado do oceano.", "titulo_pt": "Recifes de corais australianos correm risco de colapso em 50 anos sem ações drásticas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 225997, "titulo": "Supercurrent enables the reading of quantum information without destroying it", "url": "https://phys.org/news/2026-10-supercurrent-enables-quantum-destroying.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um dos principais desafios da computação quântica é obter informações de um qubit sem destruí-lo. Uma supercorrente pode permitir a leitura da informação quântica sem causar sua destruição.", "titulo_pt": "Super-corrente permite a leitura de informações quânticas sem destruí-las", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 225998, "titulo": "Crows make decisions twice as fast as humans and monkeys", "url": "https://phys.org/news/2026-10-crows-decisions-fast-humans-monkeys.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Tübingen demonstraram que corvos tomam decisões visuais duas vezes mais rápidas que humanos e macacos, identificando a direção de um padrão de pontos em média em 235 milissegundos com alta precisão.", "titulo_pt": "Corvos tomam decisões duas vezes mais rápido que humanos e macacos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 225999, "titulo": "Monarchs report their locations via… cellphone?", "url": "https://phys.org/news/2026-10-monarchs-cellphone.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tecnologia mais leve permitiu que borboletas-monarca usem tags semelhantes a rastreadores de celular para se comunicar com pesquisadores durante suas jornadas.", "titulo_pt": "Monarquias usam 'celular' para se comunicar com pesquisadores durante viagens?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 226000, "titulo": "Milky Way's disk grew 'upside down,' with younger stars forming in ever-thinner layers", "url": "https://phys.org/news/2026-10-milky-disk-grew-upside-younger.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T18:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Via Láctea possui uma disk formada por camadas de estrelas mais jovens que se formaram em camadas cada vez mais finas. Além da estrutura espiral, a galáxia é dividida em bulbo galáctico, disk galáctica e haló galáctico.", "titulo_pt": "A disk da via láctea se expandiu 'debaixo para cima', com estrelas mais jovens se formando em camadas cada vez mais finas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 225491, "titulo": "How screening tools measure disadvantage may leave rural communities overlooked for public support", "url": "https://phys.org/news/2026-10-screening-tools-disadvantage-rural-communities.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo da Universidade do Novo México revela que a priorização de comunidades para receber apoio público pode depender das formas como suas necessidades são medidadas. A pesquisa apontou diferenças significativas nas formas como os instrumentos de triagem governamentais identificam comunidades, especialmente nas áreas rurais, o que pode afetar o acesso a fundos.", "titulo_pt": "Como ferramentas de triagem medem a desvantagem pode deixar comunidades rurais de lado no apoio público", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 225492, "titulo": "Patterns of polar vortices discovered in lead-free superlattices on silicon", "url": "https://phys.org/news/2026-10-patterns-polar-vortices-free-superlattices.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grupo de cientistas do HZB descobriu, pela primeira vez, vórtices polares em superlattices (BaTiO₃/SrTiO₃)₁₀ sobre silício. Esses resultados ampliam o espectro de materiais e substratos em que podem ocorrer texturas polares topológicas e abrem novas possibilidades para incorporar estados ferroelétricos complexos em tecnologias baseadas em silício.", "titulo_pt": "Padrões de vórtices polares descobertos em superlattices livres de halogênios sobre silício", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 225490, "titulo": "STAT+: At ESMO, AstraZeneca’s cancer pursuits get a showcase", "url": "https://www.statnews.com/2026/10/25/esmo-astrazeneca-adcs-lung-gastric-cancer/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-25T16:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "AstraZeneca tem experimentado grande impulso na oncologia nos últimos anos. A empresa teve uma grande exposição na principal conferência de câncer da Europa.", "titulo_pt": "AstraZeneca apresenta avanços na oncologia na principal conferência europeia", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 225061, "titulo": "Rios de gelo: entenda como se formam as geleiras e onde elas estão localizadas pelo planeta", "url": "https://www.cnnbrasil.com.br/curiosidades/rios-de-gelo-entenda-como-se-formam-as-geleiras-e-onde-elas-estao-localizadas-pelo-planeta/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-25T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Geleiras são grandes massas de neve comprimida que contêm informações sobre a última Era Glacial e ajudam a monitorar o aquecimento global. Elas estão localizadas em várias regiões do planeta, incluindo a Antártida, Groenlândia e montanhas.", "titulo_pt": "Rios de gelo: entenda como se formam as geleiras e onde elas estão localizadas pelo planeta", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 225493, "titulo": "Protecting children from harm isn't enough—welfare systems must support healing through quality mental health care", "url": "https://phys.org/news/2026-10-children-isnt-welfare-quality-mental.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os sistemas de assistência à criança no Quebec e no Canadá realizam um trabalho notável para proteger crianças e jovens de maus-tratos e para apoiar famílias que enfrentam desafios complexos. No entanto, a proteção dos crianças não é suficiente; os sistemas precisam também promover a recuperação através de cuidados de saúde mental de qualidade.", "titulo_pt": "Proteger crianças de maltrato não basta—sistemas de assistência social devem promover o processo de cura através de cuidados de saúde mental de qualidade", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 225494, "titulo": "A few seconds of loading time can push online learners off track", "url": "https://phys.org/news/2026-10-seconds-online-learners-track.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos mostram que uma pausa adicional de um segundo no carregamento de uma lição online pode levar a menores taxas de conclusão de tarefas, notas mais baixas e menos tempo gasto no site.", "titulo_pt": "Vários segundos de carregamento podem desviar os estudantes online", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 224876, "titulo": "Histórias podem ter ajudado a ampliar cooperação entre humanos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/historias-podem-ter-ajudado-a-ampliar-cooperacao-entre-humanos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-25T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em uma caverna da ilha de Sulawesi, na Indonésia, foi encontrada uma imagem narrativa de pelo menos 51,2 mil anos, que retrata humanos interagindo com animais. Este painel é considerado a primeira história visual conhecida.", "titulo_pt": "Histórias podem ter ajudado a ampliar cooperação entre humanos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 225517, "titulo": "On this day in space! Oct. 25, 1671: Astronomer Giovanni Cassini discovers Iapetus, Saturn's 'yin-yang' moon", "url": "https://www.space.com/space-exploration/on-this-day-in-space-oct-25-1671-astronomer-giovanni-cassini-discovers-iapetus-saturns-yin-yang-moon", "fonte_id": "space_com", "data_pub": "2026-10-25T13:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 25 de outubro de 1671, o astrônomo italiano Giovanni Cassini descobriu a lua de Saturno Iapetus. Este achado foi significativo porque Iapetus apresenta um aspecto incomum, com um lado muito mais escuro do que o outro.", "titulo_pt": "25 De outubro de 1671: astrônomo italiano Giovanni Cassini descobre a lua Iapetus, de saturno", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 225495, "titulo": "Microorganisms show promise for reducing emissions from manure", "url": "https://phys.org/news/2026-10-microorganisms-emissions-manure.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Microorganismos mostram potencial para reduzir as emissões de detritos bovinos. As emissões de substâncias como amônia ocorrem quando urina e fezes misturam-se no chão das instalações de criação. Os agricultores de leite querem aumentar o valor fertilizante do esterco quando aplicado à terra agrícola.", "titulo_pt": "Microorganismos mostram potencial para reduzir emissões de detritos bovinos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 225496, "titulo": "Southern Africa's first known stenciled rock art found hiding in plain sight", "url": "https://phys.org/news/2026-10-southern-africa-stenciled-art-plain.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T12:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A África do Sul é o primeiro local na região sul da África a ter sido descoberto com arte rupestre estencilada. Antes disso, a região não possuía exemplos conhecidos de arte rupestre estencilada.", "titulo_pt": "Primeira arte rupestre estencilada da áfrica do sul sul descoberta", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 225500, "titulo": "Scientists reveal the hidden danger of missing blood pressure medication", "url": "https://www.sciencedaily.com/releases/2026/10/261024222028.htm", "fonte_id": "science_daily", "data_pub": "2026-10-25T12:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma análise de mais de 91.000 pessoas revelou que omissão na medicação anticonvulsivante pode diminuir significativamente a proteção contra ataques cardíacos e derrames. Pacientes que tomaram consistentemente a medicação tiveram uma redução de 11% nos eventos cardíacos maiores, enquanto aqueles que deixaram de tomar muitas doses não obtiveram quase nenhum benefício mensurável.", "titulo_pt": "Cientistas revelam perigo oculto da omissão de medicação anticonvulsivante", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}], "ciencia__eventos": [], "cultura": [{"id": 226013, "titulo": "Mistakes, chaos and meditation: inside the mind of Bráulio Amado", "url": "https://www.itsnicethat.com/features/braulio-amado-graphic-design-spotlight-261026", "fonte_id": "its_nice_that", "data_pub": "2026-10-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bráulio Amado, um dos designers gráficos mais respeitados de sua geração, é entrevistado sobre como encontrar ideias valiosas no caos de Nova York e sobre os hábitos e parâmetros que moldam seu melhor trabalho.", "titulo_pt": "Erros, caos e meditação: dentro da mente de Bráulio Amado", "veiculo": "It's Nice That", "pais": "Reino Unido", "classe": "B"}, {"id": 226014, "titulo": "Hono’s label branding for Temper cider animates the last rally of the 2008 Wimbledon final", "url": "https://www.itsnicethat.com/articles/studio-hono-temper-branding-project-261026", "fonte_id": "its_nice_that", "data_pub": "2026-10-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hono, uma empresa que cria objetos e experiências relacionadas ao tênis, colaborou única e exclusivamente com o fabricante de cidra Luka Zeichmann para criar rótulos que se desdobram como um gibi quando alinhados.", "titulo_pt": "Colaboração única entre hono e luka zeichmann anima rótulos do Temper cider", "veiculo": "It's Nice That", "pais": "Reino Unido", "classe": "B"}, {"id": 226015, "titulo": "“You deserve a chance to try and find a role that challenges you”", "url": "https://www.itsnicethat.com/articles/creative-career-condundrums-if-you-could-jobs-advice-261026", "fonte_id": "its_nice_that", "data_pub": "2026-10-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Katie Cadwell sugere que criativos enfrentam uma escolha difícil entre trabalhos criativamente satisfatórios e oportunidades comerciais. Ela oferece conselhos para aqueles que se sentem presos criativamente.", "titulo_pt": "Você merece uma chance de tentar encontrar um papel que o desafie", "veiculo": "It's Nice That", "pais": "Reino Unido", "classe": "B"}, {"id": 226016, "titulo": "Madeline Rupard finds the sublime in the mundane landscapes of western America", "url": "https://www.itsnicethat.com/articles/madeline-rupard-2002-forrester-subaru-art-discover-261026", "fonte_id": "its_nice_that", "data_pub": "2026-10-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Madeline Rupard, uma pintora baseada no Utah, captura a mágica estranha e cotidiana do Oeste americano, desde estações de serviço brilhantes e refrigerantes até às vastas cadeias de montanhas, através da janela de seu Subaru vintage.", "titulo_pt": "Madeline Rupard encontra o sublime no mundano dos paisagens ocidentais dos estados unidos", "veiculo": "It's Nice That", "pais": "Reino Unido", "classe": "B"}, {"id": 225810, "titulo": "A herança colonial do Rio está no quarto de empregada, diz escritor português", "url": "https://veja.abril.com.br/cultura/a-heranca-colonial-do-rio-esta-no-quarto-de-empregada-diz-escritor-portugues/", "fonte_id": "veja", "data_pub": "2026-10-25T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Hugo Gonçalves, um escritor português, afirmou em uma entrevista que a herança colonial pode ser observada na estrutura social do Rio de Janeiro, especialmente no quarto de empregada. Ele destacou diferenças na maneira como os países lidam com o passado colonial.", "titulo_pt": "Herança colonial do Rio reflete na estrutura social, diz escritor português", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 226001, "titulo": "‘You Can See Everything’ Director Lance Oppenheim Says Billy Evans ‘Didn’t Care About Being Seen Naked’; Evans Asked, ‘Want to Film Me Showering?’", "url": "https://variety.com/2026/film/news/you-can-see-everything-billy-evans-full-frontal-lance-oppenheim-1236930442/", "fonte_id": "variety", "data_pub": "2026-10-25T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O diretor Lance Oppenheim revelou que um close-up frontal de Billy Evans, parceiro de Elizabeth Holmes, foi gravado sem que ele se importasse com a exposição. Evans teria perguntado durante as filmagens se Oppenheim queria filmá-lo tomando banho.", "titulo_pt": "‘Você pode ver tudo’ diretor revela que filme de Billy Evans foi feito sem sua cautela", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 226002, "titulo": "Peggy King, ‘George Gobel Show’ Actress and Singer of the ’50s, Dies at 96", "url": "https://variety.com/2026/tv/people-news/peggy-king-dead-actress-singer-1236930847/", "fonte_id": "variety", "data_pub": "2026-10-25T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Peggy King, atriz e cantora dos anos 1950, faleceu aos 96 anos após uma batalha contra a Alzheimer's em um centro de cuidados assistidos em Pennsylvania. Ela era conhecida por seu papel regular no programa 'George Gobel Show' de 1954 a 1957, onde recebeu o apelido de 'Pretty Perky Peggy King'.", "titulo_pt": "Peggy King, atriz e cantora dos anos 1950, morre aos 96 anos", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 225820, "titulo": "Sobrinho-neto de Dilma, Pedro Rousseff sofre acidente de carro", "url": "https://veja.abril.com.br/politica/sobrinho-neto-de-dilma-pedro-rousseff-sofre-acidente-de-carro/", "fonte_id": "veja", "data_pub": "2026-10-25T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado eleito do PT, Pedro Rousseff, sofreu um acidente de carro. Ele e seu assessor estavam bem após o ocorrido, com destino de Belo Horizonte a São Paulo.", "titulo_pt": "Neto de Dilma sofre acidente de carro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 226003, "titulo": "Hudson Williams Says He’s Writing a Film Featuring an ‘Ex-Hockey Player’ and Is ‘Getting Tripped Up’ by ‘Heated Rivalry’ Parallels", "url": "https://variety.com/2026/film/news/hudson-williams-new-film-heated-rivalry-parallel-1236930742/", "fonte_id": "variety", "data_pub": "2026-10-25T20:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hudson Williams está desenvolvendo um novo filme, mas está tendo dificuldades devido a uma paralela com um 'rivalia quente'. Antes do sucesso de sua romancesa canadense sobre hockey gay que o lançou à fama, Williams escreveu e dirigiu vários curtas-metragens, incluindo 'Soakers', 'Buttons' e 'Inside Augustine Mendoza’s Quotidian Apartment'.", "titulo_pt": "Hudson Williams se enfrenta com paralelos de 'rivalidade quente' em novo filme", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 226004, "titulo": "‘Wicker’ Stars Olivia Colman, Alexander Skarsgård and Elizabeth Debicki on Making the ‘Very Silly,’ ‘Really Heartbreaking’ Film: ‘It’s Not Just a Slapstick or Sex Comedy’", "url": "https://variety.com/2026/film/news/alexander-skarsgard-olivia-colman-elizabeth-debicki-wicker-interview-1236919062/", "fonte_id": "variety", "data_pub": "2026-10-25T20:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Olivia Colman, Alexander Skarsgård e Elizabeth Debicki estrelaram 'Wicker', um filme descrito como 'muito cômico' e 'realmente emocionante'. Durante o processo de filmagem, Elizabeth Debicki chegou ao set e viu Alexander Skarsgård 'naked as wicker' (naked como vime), o que a deixou vermelha de vergonha.", "titulo_pt": "Olivia Colman, Alexander Skarsgård e Elizabeth Debicki sobre 'wicker': 'um filme muito cômico e realmente emoção'", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 226005, "titulo": "Olivia Rodrigo’s ‘You Seem Pretty Sad for a Girl So in Love’ Returns to No. 1 on Albums Chart Following ‘Expectations’ Remix", "url": "https://variety.com/2026/music/news/olivia-rodrigo-you-seem-pretty-sad-returns-to-no-1-chart-1236930779/", "fonte_id": "variety", "data_pub": "2026-10-25T19:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois do lançamento do remix 'Expectations' com Chappell Roan, Olivia Rodrigo retorna à posição número um no Billboard 200 com 'You Seem Pretty Sad for a Girl So in Love', conquistando sua terceira semana consecutiva no topo. A música foi originalmente lançada em junho e inicialmente tocou em primeiro lugar no chart.", "titulo_pt": "Olivia Rodrigo retorna ao topo das paradas com 'You Seem Pretty Sad for a Girl So in Love' após Remix", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 226007, "titulo": "Holland Taylor Says She Was ‘Never Paid Very Well’ on ‘Two and a Half Men’: ‘I Got Four Emmy Nominations, and They Never Gave Me a Raise’", "url": "https://variety.com/2026/tv/news/holland-taylor-left-two-and-a-half-men-1236930648/" 25T06:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A exposição a notícias, a tensão política e a expectativa pelo resultado da eleição podem afetar o bem-estar emocional. Uma psicóloga dá cinco dicas para lidar com o estresse gerado pela situação.", "titulo_pt": "Ansiedade com a eleição: psicóloga dá 5 dicas para lidar com o estresse", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 224488, "titulo": "Quase mil pessoas são presas após confrontos em mais um dia de protestos em massa na França", "url": "https://www.bbc.com/portuguese/articles/cmgr8dw92n78o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-25T00:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quase mil pessoas foram presas durante protestos em massa na França em um dia de manifestações. As autoridades conseguiram evitar a repetição de tumultos e saques vistos no fim de semana anterior, apesar da grande participação nas manifestações.", "titulo_pt": "Quase mil pessoas são presas após protestos em massa na França", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 224677, "titulo": "Indigenous communities worry Brazil’s election could hurt environment", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/25/indigenous-communities-worry-brazils-election-could-hurt-environment?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-25T08:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Comunidades indígenas brasileiras expressaram preocupação sobre como o resultado das eleições poderia afetar as proteções ambientais.", "titulo_pt": "Comunidades indígenas se preocupam com possíveis impactos das eleições no ambiente", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 225441, "titulo": "New laws needed to fight repression: activist", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/26/2003866629", "fonte_id": "taipei_times", "data_pub": "2026-10-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ativista defendeu a necessidade de novas leis para combater a repressão. O ativista acredita que novas legislações são essenciais para enfrentar o problema.", "titulo_pt": "Novas leis necessárias para combater repressão, afirma ativista", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 225818, "titulo": "MPF apura se banco não está respeitando uso de nome social", "url": "https://veja.abril.com.br/brasil/mpf-apura-se-banco-nao-esta-respeitando-uso-de-nome-social/", "fonte_id": "veja", "data_pub": "2026-10-25T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Federal (MPF) abriu um procedimento administrativo para investigar se um banco estaria violando o direito de uso do nome social. Isso ocorreu após o órgão receber relatos de supostas violações.", "titulo_pt": "MPF investiga possível violação ao uso do nome social em banco", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 225939, "titulo": "After racist killing in Trappes, Mayor Ali Rabeh declares: 'The French president was not the protector he should have been'", "url": "https://www.lemonde.fr/en/politics/article/2026/10/25/after-racist-killing-in-trappes-mayor-ali-rabeh-declares-the-french-president-was-not-the-protector-he-should-have-been_6763925_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O prefeito de Trappes, Ali Rabeh, reeleito em março, declarou em entrevista ao Le Monde que o presidente francês não foi o protetor que deveria ser. Ele expressou preocupação com a penetração da rhetoric do extremo direito na consciência coletiva e descreveu um clima de guerra civil latente.", "titulo_pt": "Prefeito de Trappes: 'o presidente francês não foi o protetor que deveria ser'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 225365, "titulo": "Gaza’s visually and hearing-impaired children miss school due to Israel war", "url": "https://www.aljazeera.com/features/2026/10/25/gazas-visually-and-hearing-impaired-children-miss-school-due-to-israel-war?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-25T13:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Crianças em Gaza com deficiências auditivas e visuais frequentemente não têm acesso a uma educação especializada. Isso as afeta negativamente, pois elas não podem ir à escola devido à guerra israelense.", "titulo_pt": "Crianças com deficiências auditivas e visuais em gaza ficam sem escola devido à guerra israelense", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 224470, "titulo": "La nueva regla del DHS que reduce de 30 a 10 días el plazo para responder antes de perder el estatus de refugiado", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/la-nueva-regla-del-dhs-que-reduce-de-30-a-10-dias-el-plazo-para-responder-antes-de-perder-el-estatus-nid24102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-25T08:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A regra do DHS nos Estados Unidos foi alterada, reduzindo o prazo para responder a 10 dias em vez dos anteriores 30 dias. Isso afeta quem busca refúgio no país e precisa responder a notificações importantes.", "titulo_pt": "Nova regra do DHS reduz prazo para refugiados responder para 10 dias", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 224478, "titulo": "El ICE apuesta US$100 millones a un programa que analiza datos y vínculos personales de migrantes: la advertencia sobre sus riesgos", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/el-ice-apuesta-us100-millones-a-un-programa-que-analiza-datos-y-vinculos-personales-de-migrantes-la-nid24102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-25T06:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ICE investiu 100 milhões de dólares em um programa que analisa dados pessoais de migrantes, levantando preocupações sobre a vigilância em massa.", "titulo_pt": "ICE investe 100 milhões em programa de análise de dados pessoais de migrantes: alerta sobre riscos de vigilância em massa", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 224769, "titulo": "Israel widens West Bank crackdown, displacing Hebron families after attack", "url": "https://www.scmp.com/news/world/middle-east/article/3372058/israel-widens-west-bank-crackdown-displacing-hebron-families-after-attack", "fonte_id": "scmp", "data_pub": "2026-10-25T06:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel anunciou que fechará todos os pontos de entrada terrestres com a Cisjordânia durante o dia da eleição próxima, como parte de uma linha mais dura contra a militância. Forças israelenses expulsaram cerca de 2.000 moradores de Hebron após um ataque que resultou na morte de dois soldados palestinos.", "titulo_pt": "Israel intensifica controle na cisjordânia, expulsando famílias de Hebron após ataque", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 224774, "titulo": "Law enforcement alerted to firm offering LGBTQ surrogacy services in Hong Kong", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3372052/law-enforcement-alerted-about-firm-offering-lgbtq-surrogacy-services-hong-kong", "fonte_id": "scmp", "data_pub": "2026-10-25T04:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A reguladora de fertilização in vitro em Hong Kong encaminhou um caso à polícia após suspeitar que uma influenciadora chinesa, Tan Zubiao, também conhecida como berlinsun, estivesse oferecendo serviços de maternidade de substituição comercial para casais LGBTQ+ em Hong Kong. Tan havia estabelecido uma empresa na cidade e anunciado esses serviços nas redes sociais.", "titulo_pt": "Regulador de ivf em Hong Kong alerta sobre empresa oferecendo serviços de maternidade de substituição para pais LGBTQ+", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 223727, "titulo": "Expert discusses deterring transnational repression", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/25/2003866585", "fonte_id": "taipei_times", "data_pub": "2026-10-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um especialista discute estratégias para deter a repressão transnacional. O evento aborda como combater ações abusivas que ultrapassem fronteiras nacionais.", "titulo_pt": "Especialista discute detecção de repressão transnacional", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "direitos_humanos__eventos": [{"titulo": "Nova iorque arquidiocese concorda em pagar 800 milhões a 1.300 sobreviventes de abuso sexual", "sumario": "A Arquidiocese de Nova York concordou em pagar $800 milhões a 1.300 sobreviventes de abuso sexual. A arquidiocese de Nova York e as vítimas de abusos clericais chegaram a um acordo por mais de 800 milhões de dólares. A arquidiocese de Nova York vai pagar 800 milhões de dólares a mais de 1300 vítimas de abuso sexual.", "artigos": [{"id": 224693, "titulo": "New York Archdiocese agrees to pay $800m to 1,300 sexual abuse survivors", "url": "https://www.aljazeera.com/news/2026/10/25/new-york-archdiocese-agrees-to-pay-800m-to-1300-sexual-abuse-survivors?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-25T03:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Arquidiocese de Nova York concordou em pagar $800 milhões a 1.300 sobreviventes de abuso sexual. Este é o segundo maior acordo após o de $880 milhões fechado pela Arquidiocese de Los Angeles em 2024.", "titulo_pt": "Nova iorque arquidiocese concorda em pagar 800 milhões a 1.300 sobreviventes de abuso sexual", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 224534, "titulo": "Arquidiócesis de Nueva York y las víctimas de abusos clericales llegan a un acuerdo de más de US$800 millones", "url": "https://www.latercera.com/mundo/noticia/arquidiocesis-de-nueva-york-y-las-victimas-de-abusos-clericales-llegan-a-un-acuerdo-de-mas-de-us800-millones/", "fonte_id": "la_tercera", "data_pub": "2026-10-25T01:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A arquidiocese de Nova York e as vítimas de abusos clericais chegaram a um acordo por mais de 800 milhões de dólares. Este seria o segundo maior acordo envolvendo um arcebispo católico nos Estados Unidos.", "titulo_pt": "Arquidiocese de nova York e vítimas de abusos clericais chegam a acordo de mais de 800 milhões de dólares", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 224630, "titulo": "New York archdiocese to pay $800 million to over 1300 sex abuse victims", "url": "https://www.lemonde.fr/en/religions/article/2026/10/25/new-york-archdiocese-to-pay-800-million-to-over-1300-sex-abuse-victims_6763495_63.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-25T01:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A arquidiocese de Nova York vai pagar 800 milhões de dólares a mais de 1300 vítimas de abuso sexual. Dioceses em todo o país já pagaram centenas de milhões de dólares em indenizações e programas foram estabelecidos para compensar as vítimas sem precisar ir a julgamento.", "titulo_pt": "Arquidiocese de nova York pagará 800 milhões a mais de 1300 vítimas de abuso sexual", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}]}]}, "noticias": [{"id": 226013, "fonte_id": "its_nice_that", "titulo": "Mistakes, chaos and meditation: inside the mind of Bráulio Amado", "url": "https://www.itsnicethat.com/features/braulio-amado-graphic-design-spotlight-261026", "data_pub": "2026-10-26T09:00:00Z", "topico": "cultura", "i
