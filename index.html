eino Unido", "classe": "B"}, {"id": 226014, "titulo": "Hono’s label branding for Temper cider animates the last rally of the 2008 Wimbledon final", "url": "https://www.itsnicethat.com/articles/studio-hono-temper-branding-project-261026", "fonte_id": "its_nice_that", "data_pub": "2026-10-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hono, uma empresa que cria objetos e experiências relacionadas ao tênis, colaborou única e exclusivamente com o fabricante de cidra Luka Zeichmann para criar rótulos que se desdobram como um gibi quando alinhados.", "titulo_pt": "Colaboração única entre hono e luka zeichmann anima rótulos do Temper cider", "veiculo": "It's Nice That", "pais": "Reino Unido", "classe": "B"}, {"id": 226015, "titulo": "“You deserve a chance to try and find a role that challenges you”", "url": "https://www.itsnicethat.com/articles/creative-career-condundrums-if-you-could-jobs-advice-261026", "fonte_id": "its_nice_that", "data_pub": "2026-10-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Katie Cadwell sugere que criativos enfrentam uma escolha difícil entre trabalhos criativamente satisfatórios e oportunidades comerciais. Ela oferece conselhos para aqueles que se sentem presos criativamente.", "titulo_pt": "Você merece uma chance de tentar encontrar um papel que o desafie", "veiculo": "It's Nice That", "pais": "Reino Unido", "classe": "B"}, {"id": 226016, "titulo": "Madeline Rupard finds the sublime in the mundane landscapes of western America", "url": "https://www.itsnicethat.com/articles/madeline-rupard-2002-forrester-subaru-art-discover-261026", "fonte_id": "its_nice_that", "data_pub": "2026-10-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Madeline Rupard, uma pintora baseada no Utah, captura a mágica estranha e cotidiana do Oeste americano, desde estações de serviço brilhantes e refrigerantes até às vastas cadeias de montanhas, através da janela de seu Subaru vintage.", "titulo_pt": "Madeline Rupard encontra o sublime no mundano dos paisagens ocidentais dos estados unidos", "veiculo": "It's Nice That", "pais": "Reino Unido", "classe": "B"}, {"id": 226326, "titulo": "Freddie De Tommaso: la pérdida temprana que lo marcó y forjó su carácter y cómo será su debut en el Colón, el gran teatro en el que cantó su ídolo", "url": "https://www.lanacion.com.ar/espectaculos/musica/freddie-de-tommaso-la-perdida-temprana-que-lo-marco-y-forjo-su-caracter-y-como-sera-su-debut-en-el-nid26102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-26T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O tenor inglês de origem italiana encerrará esta noite a temporada do Ciclo Aura no Teatro Colón, acompanhado pela cantora Nadine Sierra. Este evento marca o debut do artista nesse importante palco, onde seu ídolo já se apresentou.", "titulo_pt": "Freddie De Tommaso: a perda precoce que o marcou e forjou seu caráter e seu debut no Colón, palco onde cantou seu ídolo", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 226349, "titulo": "El magisterio de la paz de León XIV", "url": "https://www.latercera.com/opinion/noticia/el-magisterio-de-la-paz-de-leon-xiv/", "fonte_id": "la_tercera", "data_pub": "2026-10-26T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O título refere-se à doutrina de paz do Papa Leão XIV, que aborda temas relacionados à paz e à justiça internacional. Este documento é considerado uma importante contribuição da Igreja Católica para a promoção da paz mundial.", "titulo_pt": "A doutrina de paz de leão XIV", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 226799, "titulo": "‘Vicarious wish-fulfillment’: why That Thing You Do! is my feelgood movie", "url": "https://www.theguardian.com/film/2026/oct/26/that-thing-you-do-feelgood-movie", "fonte_id": "guardian_culture", "data_pub": "2026-10-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo explica por que o filme 'That Thing You Do!' é considerado uma das comédias musicais mais reassistidas do autor. O filme, estrelado por Tom Hanks, é ambientado nos anos 60 e retrata uma banda de rock. Um momento particularmente marcante na trama é quando os personagens questionam como chegaram ali, antes de se apresentarem ao vivo na televisão.", "titulo_pt": "‘Vontade de possuir coisas imaginárias’: por que 'That Thing You Do!' É meu filme otimista", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 226810, "titulo": "War Is Interested in You by Gideon Rachman review – are we on the brink of world war three?", "url": "https://www.theguardian.com/books/2026/oct/26/war-is-interested-in-you-by-gideon-rachman-review-how-close-is-world-war-three", "fonte_id": "guardian_culture", "data_pub": "2026-10-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gideon Rachman, colunista de finanças e negócios da Financial Times, explora a perspectiva sombria da segurança global em seu último estudo sobre diplomacia internacional. O título do livro é inspirado na expressão atribuída a Trotsky, sugerindo que a guerra está sempre interessada em envolver os seres humanos, independentemente de sua vontade.", "titulo_pt": "Interesse da guerra em você", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 226748, "titulo": "'My Wish' envisions culture leading to world peace", "url": "https://www.koreaherald.com/article/10915283", "fonte_id": "korea_herald", "data_pub": "2026-10-26T08:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor deseja que sua nação se torne a mais bela do mundo, priorizando a cultura e a paz em vez da riqueza e poder. Ele acredita que a riqueza e a força militar são suficientes para garantir a abundância de vida e a capacidade de se defender, enquanto a cultura avançada é o desejo infinito expresso.", "titulo_pt": "‘Meu desejo’ visualiza a cultura como caminho para a paz mundial", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 226749, "titulo": "Late poets Yoon Dong-ju, Kim Nam-jo receive Korea’s highest cultural honor", "url": "https://www.koreaherald.com/article/10915281", "fonte_id": "korea_herald", "data_pub": "2026-10-26T08:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Yoon Dong-ju, um dos poetas mais amados da Coreia, cuja poesia introspectiva em coreano capturou o sofrimento da vida sob o domínio japonês, e Kim Nam-jo, uma das poetas femininas mais proeminentes da Coreia pós-guerra, receberam, postumamente, a Ordem Geumgwan de Mérito Cultural, a maior honra cultural do país, em uma cerimônia realizada naquele dia. Yoon Dong-ju nasceu em 1917 na Longjing, na província de Jilin, na China atual, e graduou-se na Yonhi College, que mais tarde se tornou a Universidade Yonsei, em 1941, antes de ir estudar no Japão.", "titulo_pt": "Poetas coreanos Yoon Dong-ju e Kim Nam-jo recebem maior honra cultural do país após morte", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 226797, "titulo": "‘People think songwriters go around crying all the time’: Jimmy Webb on his epic hits – and wild drinking days", "url": "https://www.theguardian.com/music/2026/oct/26/jimmy-webb-wichita-lineman-macarthur-park-galveston-dolly", "fonte_id": "guardian_culture", "data_pub": "2026-10-26T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jimmy Webb, compositor de clássicos como 'Wichita Lineman' e 'MacArthur Park', relembra a criação de suas músicas e conta sobre suas sessões de gravação com artistas como Dolly Parton, Frank Sinatra e Glen Campbell. A história também menciona uma experiência envolvendo o ator Richard Harris em Oklahoma.", "titulo_pt": "Pessoas pensam que os composidores de música andam sempre chorando: jimmy Webb sobre seus êxitos e dias de bebedeiras", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 226798, "titulo": "As mega-hit Into the Woods wows the West End, what’s the secret weapon of this Sondheim spectacular?", "url": "https://www.theguardian.com/stage/2026/oct/26/aideen-malone-lighting-fairytale-musical-into-the-woods-sondheim-olivier", "fonte_id": "guardian_culture", "data_pub": "2026-10-26T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A designer de iluminação Aideen Malone ganhou um Olivier por sua work em 'Into the Woods', mas afirma que o espetáculo ainda não foi totalmente concluído. Apesar disso, a produção foi bem-sucedida tanto com os críticos quanto com o público.", "titulo_pt": "Qual é o segredo da grande produção 'Into the Woods' no West End?", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 226752, "titulo": "Seoul’s zombie-themed bus tour sparks online buzz", "url": "https://www.koreaherald.com/article/10915233", "fonte_id": "korea_herald", "data_pub": "2026-10-26T07:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Zumbis com roupas sujas de sangue perambulam pelas ruas de Seul, se aproximando de um ônibus turístico. O ônibus percorre a cidade enquanto os zumbis o cercam, alguns até entrando no veículo, criando uma cena de filme de terror.", "titulo_pt": "Caminhão-touro temática de zumbis causa burburinho na internet em seul", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 226101, "titulo": "Kleber Mendonça Filho homenageia Jafar Panahi em curta após disputa no Oscar", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/kleber-mendonca-filho-homenageia-jafar-panahi-em-curta-apos-disputa-no-oscar.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-26T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Kleber Mendonça Filho produziu 'Sul de Teerã', um curta-metragem que homenageia Jafar Panahi, que competiu pelo Os  O distrital continua a depender do puxador de votos, não do puxador de eleitores.", "titulo_pt": "A reforma eleitoral deixa intactos os algoritmos que moldam a opinião pública", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 226388, "titulo": "A saúde da mulher é mais que uma campanha", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-saude-da-mulher-e-mais-que-uma-campanha", "fonte_id": "jota", "data_pub": "2026-10-26T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A saúde da mulher deve ser considerada além das campanhas específicas, como o Outubro Rosa, e a regulação precisa equilibrar as regras com as decisões médicas.", "titulo_pt": "A saúde da mulher é mais do que campanhas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 226656, "titulo": "70% in Japan want to shelter at home after disasters, survey finds", "url": "https://www.japantimes.co.jp/news/2026/10/26/japan/disaster-shelter-preference-survey/", "fonte_id": "japan_times", "data_pub": "2026-10-26T08:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa revelou que 70% dos japoneses gostariam de se abrigar em casa após desastres naturais, enquanto apenas 15% dos entrevistados tinham um entendimento detalhado das preparações necessárias para esse tipo de situação.", "titulo_pt": "70% Dos japoneses querem se abrigar em casa após desastres, mostra pesquisa", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 226233, "titulo": "Messias à CNN: Flávio tem espírito antidemocrático", "url": "https://www.cnnbrasil.com.br/eleicoes/messias-a-cnn-flavio-tem-espirito-antidemocratico/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-26T06:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O advogado-geral da União comentou sobre o não reconhecimento do resultado eleitoral pelo candidato derrotado do PL, Flávio Dino. Este comportamento foi descrito como antidemocrático.", "titulo_pt": "Messias à CNN: flávio tem espírito antidemocrático", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 226149, "titulo": "INSS começa folha de outubro nesta segunda, 26; veja quem recebe", "url": "https://exame.com/invest/minhas-financas/inss-comeca-folha-de-outubro-nesta-segunda-26-veja-quem-recebe/", "fonte_id": "exame", "data_pub": "2026-10-26T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Nacional do Seguro Social (INSS) começa a pagar a folha de outubro nesta segunda-feira, 26. Os beneficiários com final de inscrição 1 e renda de até um salário mínimo são os primeiros a receber o benefício.", "titulo_pt": "INSS inicia pagamento de outubro nesta segunda, 26; veja quem recebe", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 226672, "titulo": "Father of woman struck by man who jumped from building seeks murder charge", "url": "https://www.japantimes.co.jp/news/2026/10/26/japan/crime-legal/daughter-death-murder-charge/", "fonte_id": "japan_times", "data_pub": "2026-10-26T04:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kenji Inaba, pai da vítima falecida, argumenta que o homem de 29 anos, que sobreviveu, sabia que suas ações poderiam causar a morte de outra pessoa. Inaba busca uma acusação de assassinato.", "titulo_pt": "Pai da vítima morta pede acusação de assassinato contra homem que pulou de edifício", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 226673, "titulo": "Unscrupulous businesses preying on older people with dementia", "url": "https://www.japantimes.co.jp/news/2026/10/26/japan/crime-legal/older-people-dementia-fraud/", "fonte_id": "japan_times", "data_pub": "2026-10-26T04:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos afirmam que é essencial estabelecer um sistema de apoio para proteger pessoas idosas com demência que podem ser exploradas por empresas desonestas.", "titulo_pt": "Empresas desonestas explorando idosos com demência", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 226457, "titulo": "Birthkeeper who allegedly ‘groomed’ pregnant women to fear hospital could face criminal charges", "url": "https://www.theguardian.com/australia-news/2026/oct/26/birthkeeper-groomed-pregnant-women-melbourne-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-10-26T04:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma birthkeeper chamada Emily Lal pode ser referenciada à promotoria para enfrentar possíveis acusações criminais após supostamente ter manipulado mulheres grávidas para temer o nascimento hospitalar. Stacey Warnecke, uma das mulheres manipuladas, morreu em setembro de 2025 após dar à luz em casa e sofrer uma hemorragia pós-parto.", "titulo_pt": "Birthkeeper que supostamente manipulou grávidas para temer o hospital pode enfrentar acusações criminais", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 226413, "titulo": "A terra arrasada que a rejeição à família Bolsonaro e a Lula vai deixar para 2030", "url": "https://veja.abril.com.br/politica/a-terra-arrasada-que-a-rejeicao-a-familia-bolsonaro-e-a-lula-vai-deixar-para-2030/", "fonte_id": "veja", "data_pub": "2026-10-26T02:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A próxima eleição presidencial ocorrerá sem os atuais protagonistas, abrindo espaço para novas lideranças e disputas, em um cenário de incertezas.", "titulo_pt": "A terra arrasada que a rejeição à família Bolsonaro e o retorno do Lula deixarão para 2030", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 226425, "titulo": "As mulheres eleitas em 2026 para chefiar os governos dos estados no Brasil", "url": "https://veja.abril.com.br/politica/as-mulheres-eleitas-em-2026-para-chefiar-os-governos-dos-estados-no-brasil/", "fonte_id": "veja", "data_pub": "2026-10-26T00:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Este ano, foram eleitas ape jas de condena a abusadores sexuales de menores, pero polémica sigue abierta", "url": "https://www.latercera.com/politica/noticia/rabat-busca-formulas-para-revertir-las-rebajas-de-condena-a-abusadores-sexuales-de-menores-pero-polemica-sigue-abierta/", "fonte_id": "la_tercera", "data_pub": "2026-10-26T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo marroquino está considerando anular decisões que permitiram a libertação antecipada de 56 condenados por abuso sexual de menores, apesar de ter descartado anteriormente a suspensão dos decretos já executados. A sessão especial no Congresso marcada para o próximo dia 16 será crucial para o ministro da Justiça, que rejeitou renunciar ao cargo.", "titulo_pt": "Rabat busca fórmulas para anular decisões de libertação de abusadores sexuais de menores, mas polêmica persiste", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 226692, "titulo": "Discovery of baby orangutans in India exposes booming illegal pet trade", "url": "https://www.scmp.com/news/asia/south-asia/article/3372133/discovery-baby-orangutans-india-exposes-booming-illegal-pet-trade", "fonte_id": "scmp", "data_pub": "2026-10-26T07:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vilarejos indianos descobriram cinco bebês orangotangos em uma floresta de casuarinas no início de setembro. Os animais, com idades entre seis e oito meses, foram deixados em uma plantação no estado de Odisha, a mais de 2.700 km de suas florestas nativas em Borneu e Sumatra, indicando um comércio ilegal de primatas que está se expandindo para a Índia.", "titulo_pt": "Descoberta de bebês orangotangos na Índia expõe comércio ilegal de animais em crescimento", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 226613, "titulo": "Trump dials up Islamophobia against Abdul El-Sayed at Michigan Senate rally", "url": "https://www.aljazeera.com/news/2026/10/26/trump-dials-up-islamophobia-at-michigan-se rabeh-declares-the-french-president-was-not-the-protector-he-should-have-been_6763925_5.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O prefeito de Trappes, Ali Rabeh, reeleito em março, declarou em entrevista ao Le Monde que o presidente francês não foi o protetor que deveria ser. Ele expressou preocupação com a penetração da rhetoric do extremo direito na consciência coletiva e descreveu um clima de guerra civil latente.", "titulo_pt": "Prefeito de Trappes: 'o presidente francês não foi o protetor que deveria ser'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 225365, "titulo": "Gaza’s visually and hearing-impaired children miss school due to Israel war", "url": "https://www.aljazeera.com/features/2026/10/25/gazas-visually-and-hearing-impaired-children-miss-school-due-to-israel-war?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-25T13:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Crianças em Gaza com deficiências auditivas e visuais frequentemente não têm acesso a uma educação especializada. Isso as afeta negativamente, pois elas não podem ir à escola devido à guerra israelense.", "titulo_pt": "Crianças com deficiências auditivas e visuais em gaza ficam sem escola devido à guerra israelense", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 224470, "titulo": "La nueva regla del DHS que reduce de 30 a 10 días el plazo para responder antes de perder el estatus de refugiado", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/la-nueva-regla-del-dhs-que-reduce-de-30-a-10-dias-el-plazo-para-responder-antes-de-perder-el-estatus-nid24102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-25T08:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A regra do DHS nos Estados Unidos foi alterada, reduzindo o prazo para responder a 10 dias em vez dos anteriores 30 dias }

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });

    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
