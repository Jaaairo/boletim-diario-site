"data_pub": "2026-09-04T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os trabalhadores de aplicativos no Brasil já somam 2 milhões de pessoas, e realizam uma jornada média semanal de 44,7 horas, 5,4 horas a mais do que os trabalhadores em outros setores privados, de acordo com dados do IBGE.", "titulo_pt": "Trabalhadores de aplicativos já são 2 milhões no Brasil, mas ainda trabalham mais horas por semana", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 146285, "titulo": "MP denuncia motoristas de carros de luxo após racha no RS", "url": "https://www.cnnbrasil.com.br/nacional/sul/rs/mp-denuncia-motoristas-de-carros-de-luxo-apos-racha-no-rs/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T20:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público denunciou motoristas de carros de luxo após um racha em Porto Alegre, Rio Grande do Sul, em agosto. Duas pessoas ficaram feridas durante a disputa em alta velocidade.", "titulo_pt": "MP denuncia motoristas de carros de luxo após racha em porto alegre", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 146286, "titulo": "Entenda o que é tamponamento cardíaco; condição matou professora no RJ", "url": "https://www.cnnbrasil.com.br/saude/entenda-o-que-e-tamponamento-cardiaco-condicao-matou-professora-no-rj/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-04T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O tamponamento cardíaco é uma condição grave causada pelo acúmulo de líquido ou sangue no pericárdio, que interfere no bombeamento do coração. A professora que morreu no Rio de Janeiro foi vitimada por essa condição.", "titulo_pt": "Entenda o que é tamponamento cardíaco; condição matou professora no RJ", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 146198, "titulo": "Em meio à queda populacional, China amplia benefícios para gravidez e parto", "url": "https://exame.com/mundo/em-meio-a-queda-populacional-china-amplia-beneficios-para-gravidez-e-parto/", "fonte_id": "exame", "data_pub": "2026-09-04T18:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O China está expandindo os benefícios para a gravidez e o parto, em meio a uma queda populacional. Cerca de 260 milhões de pessoas estão atualmente cobertas pelo sistema, que inclui reembolso de despesas médicas e pagamento de auxílio relacionado à maternidade.", "titulo_pt": "China amplia benefícios para gravidez e parto em meio à queda populacional", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 145467, "titulo": "Investigan homicidio frustrado de menor de seis años: recibió disparo desde el exterior de su domicilio", "url": "https://www.latercera.com/nacional/noticia/investigan-homicidio-frustrado-de-menor-de-seis-anos-recibio-disparo-desde-el-exterior-de-su-domicilio/", "fonte_id": "la_tercera", "data_pub": "2026-09-04T17:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um menor de seis anos foi alvo de um tentativa de assassinato por disparos de fora de sua residência. As investigações estão a cargo de policiais especializados da Carabineros de Chile.", "titulo_pt": "Investigação de tentativa de homicídio frustrado contra menor de seis anos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 145285, "titulo": "SP tem 31 praias impróprias para banho no 7 de setembro. Saiba quais", "url": "https://www.metropoles.com/sao-paulo/sp-31-praias-improprias-7-de-setembro", "fonte_id": "metropoles", "data_pub": "2026-09-04T17:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Boletim divulgado pela Cetesb informa que 31 praias em São Paulo são impróprias para banho durante o feriado prolongado em 7 de setembro. Outras 144 praias foram consideradas adequadas.", "titulo_pt": "SP tem 31 praias impróprias para banho no 7 de setembro. Saiba quais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 147081, "titulo": "Orangutan mother and infant rescued from wildfire-hit forest in Indonesia", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/5/orangutan-mother-and-infant-rescued-from-wildfire-hit-forest-in-indonesia?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-05T08:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mãe orangotango e seu recém-nascido foram resgatados de uma pequena área de floresta ameaçada por incêndios florestais na Indonésia.", "titulo_pt": "Mãe orangotango e seu bebê resgatados de floresta afetada por incêndios na indonésia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 146881, "titulo": "Avanza un frente de aire antártico que llegará con fuertes heladas, sensación térmica muy baja, inestabilidad y lluvias: las zonas afectadas", "url": "https://www.lanacion.com.ar/sociedad/avanza-un-frente-de-aire-antartico-que-llegara-con-fuertes-heladas-sensacion-termica-muy-baja-nid05092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-05T08:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um frente de ar antártico avança para o país, trazendo fortes geladas, sensação térmica baixa, instabilidade e chuvas. O ar frio causará uma significativa diminuição da temperatura durante o primeiro fim de semana de setembro, com rajadas intensas e registros de até -13°C.", "titulo_pt": "Avança um frente de ar antártico com fortes geladas e sensação térmica baixa", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 146768, "titulo": "Deslizamento após tufão deixa um morto e 11 desaparecidos na China", "url": "https://www.metropoles.com/mundo/deslizamento-apos-tufao-deixa-um-morto-e-11-desaparecidos-na-china", "fonte_id": "metropoles", "data_pub": "2026-09-05T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um deslizamento de terra ocorreu após um tufão na China, deixando uma pessoa morta e étima suposta ocorrência de feminicídio na Itália desde agosto", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 145541, "titulo": "Colombia president provokes disgust by posing with bodies of ‘terrorists’", "url": "https://www.theguardian.com/world/2026/sep/04/colombia-president-posts-video-guerrillas-body-bags-abelardo-de-la-espriella", "fonte_id": "guardian_world", "data_pub": "2026-09-04T13:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da Colômbia, Abelardo De La Espriella, causou indignação ao publicar um vídeo em redes sociais mostrando uma fila de sacos de cadáveres, afirmando que contêm os corpos de 23 'neutralizados' guerrilheiros. Ele assumiu o poder há um mês prometendo uma 'guerra total' contra grupos armados ilegais e publicou o vídeo como forma de demonstrar que está cumprindo essa promessa.", "titulo_pt": "Presidente da colômbia causa indignação ao publicar vídeo com sacos de cadáveres", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 146087, "titulo": "Serbian President Launches ‘Non-Political’ Podcast as Election Looms", "url": "https://balkaninsight.com/2026/09/04/serbian-president-launches-non-political-podcast-as-election-looms/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-09-04T13:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sérvio Aleksandar Vucic lançou um podcast não-político que inclui o conhecido treinador de basquete Miroslav Nikolic. Este formato de auto-promoção online é seguido por outros políticos na região e em outros lugares.", "titulo_pt": "Presidente sérvio lança Podcast ‘não-político’ no momento das eleições", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 145600, "titulo": "Human Rights Are Essential to Australia’s Interests", "url": "https://thediplomat.com/2026/09/human-rights-are-essential-to-australias-interests/", "fonte_id": "the_diplomat", "data_pub": " function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
