<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<div class="modal-overlay" id="modal-flag">

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "11/10/2026 07:19", "stats": {"noticias_novas": 576, "resumos_gerados": 213}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Flávio Bolsonaro venceu o segundo turno das eleições com 52% dos votos contra 48% de Lula. O resultado levou a uma série de movimentos políticos e campanhas. Lula, do PT, realizou um comício em Natal, enquanto Flávio Bolsonaro, do PL, participou de uma moto-carreata no Rio de Janeiro. O candidato filho exaltou seu pai, Jair Bolsonaro, e recebeu um pedido simulado de voto em um culto. Além disso, a campanha de Lula acusa a Meta, proprietária do Instagram e do Facebook, de limitar a difusão de conteúdo, enquanto a empresa nega as acusações. O TSE determinou que a Meta esclareça essas acusações em 48 horas. Também foi revelado que Flávio Bolsonaro compartilhava uma conta bancária com um suspeito de lavagem de dinheiro do INSS, conforme indicam emails obtidos pela Polícia Federal.", "mundo": "Pelo menos 109 migrantes morreram e mais de 100 estão desaparecidos após uma embarcação capotar nas proximidades de Djibuti. Em outro desenvolvimento, o presidente do Paquistão, Asif Ali Zardari, suspendeu efetivamente o governo provincial em Khyber Pakhtunkhwa, epicentro do apoio ao ex-PM Imran Khan. Na África do Sul, os rebeldes hutitas advertiram passageiros contra o uso dos aeroportos sauditas, um dia após um ataque com mísseis ao aeroporto de Riad que resultou em 12 mortos e mais de 300 feridos. Em Israel, o presidente ucraniano Zelensky declarou que a Ucrânia encerrará os ataques às refinarias se a Rússia parar de atingir infraestruturas energéticas, sinalizando uma possível escalada ou desescalação da guerra na região. No Brasil, Flávio Bolsonaro venceu em 86% dos locais de votação nas áreas de milícias no Rio de Janeiro, conforme levantamento, enquanto Lula realizou uma carreata em Natal para mobilizar eleitores.\n\nA Arábia Saudita enfrenta uma crescente tensão geopolítica após um ataque a um aeroporto em Riad, que deixou 12 mortos. O ataque, reivindicado pelos hutis do Iêmen, teve o apoio do Irã, o que levou a um novo alerta sobre a segurança dos aeroportos sauditas, agravando a crise. O presidente dos Estados Unidos, Donald Trump, pressionou a Ucrânia para realizar eleições, sugerindo que Volodymyr Zelenskyy falhou em encerrar o conflito com a Rússia. A coalizão liderada pela Arábia Saudita prometeu uma resposta 'decisiva', e Washington considera atacar os hutis e retomar os ataques ao Irã. Em outra frente geopolítica, a NASA solicitou que empresas desenvolvam um reator nuclear capaz de operar perto do polo sul da Lua até 2030, em uma corrida para instalar reatores nucleares na Lua, envolvendo EUA, Rússia e China.", "economia": "A economia brasileira enfrenta desafios com a previsão de crescimento reduzido para 2026, conforme anunciado pelo Banco Mundial, que revisou a projeção para 2,1%, abaixo dos 4% iniciais. O CARF manteve os créditos de PIS/Cofins para o transporte com trecho internacional. A atividade econômica registrou um crescimento de 1,7% entre janeiro e julho, impulsionada principalmente pela agricultura, mineração, petróleo e gás. Mercado Libre liderou o ranking de empresas com melhor reputação em 2025, com estratégias diferenciadas, como a proximidade com vendedores locais. A informalidade continua sendo um desafio previdenciário nos países emergentes, segundo a OCDE, que alerta que apenas 8% dos trabalhadores informais contribuem para o sistema previdenciário. Além disso, o Congresso Nacional pode ter um maior potencial para ajustes fiscais devido ao avanço da direita, mas a implementação de reformas dependerá de negociações políticas.", "tecnologia": "A tecnologia está em destaque em diversos setores, com destaque para a indústria de semicondutores e a crescente integração de inteligência artificial em aspectos cotidianos. A Vicor Corporation, por exemplo, está tentando obter uma nova proibição de importação dos Estados Unidos contra fabricantes taiwaneses de servidores, como Foxconn, Quanta e Delta, em uma disputa legal relacionada a patentes de inteligência artificial. Em outro desenvolvimento, a Solidigm, subsidiária da SK hynix, está considerando uma possível listagem de ações nos Estados Unidos, o que está dividindo os investidores sobre o potencial de valorização. A indústria de semicondutores também está se adaptando às mudanças, com a Samsung planejando investir pesadamente na Coreia do Sul e no Vietnã para expandir sua produção de chips. Além disso, a inteligência artificial está sendo integrada em sistemas de drones e em indústrias de defesa, enquanto a segurança cibernética se torna uma prioridade após incidentes relacionados a ataques de inteligência artificial. O uso precoce de smartphones por crianças pequenas também é um tema de debate, com um levantamento governamental sul-coreano mostrando que mais da metade das crianças com menos de cinco anos já utilizam smartphones antes dos dois anos de idade. A inteligência artificial está se integrando em diversos setores, desde saúde mental até segurança cibernética, destacando a importância de medidas de segurança mais robustas e a necessidade de um 'freio de emergência' para os modelos de IA.", "ciencia": "A confiança na ciência diminuiu, de acordo com um estudo global que abrangeu a era do COVID-19, com potenciais implicações para a saúde pública. Os cientistas descobriram um sistema oculto de limpeza nos olhos que pode levar ao desenvolvimento de novos tratamentos para doenças oculares. Um estudo associou a COVID-19 prolongada à diminuição de até 20% na dopamina cerebral dos pacientes. Além disso, pesquisadores identificaram quase 300 variantes genéticas em uma tartaruga de 194 anos, com o objetivo de orientar pesquisas de saúde. A Anvisa autorizou testes em humanos de uma vacina brasileira inédita contra malária, enquanto cientistas em Viena desenvolveram o primeiro relógio nuclear autostabilizante, um avanço significativo no controle do tempo que pode superar os relógios atômicos mais precisos. Adicionalmente, pesquisadores descobriram que microplásticos de polietileno podem contribuir para a doença hepática gordurosa não alcoólica.", "cultura": "A cultura global está em destaque com uma série de eventos e exposições. Em Nova York, a exposição de Roy Lichtenstein no Museu Whitney celebra o artista pop com obras raramente vistas, incluindo um grande mural inspirado na técnica de narrativa em série do Tapete de Bayeux, que foi destruído pelo próprio artista após seis semanas. Em outro destaque, a arquiteta irlandesa Facha Architekti projetou uma extensão vermelha metálica de 26 metros para uma pequena casa familiar na República Tcheca, aumentando o espaço de vida da família e melhorando a conexão com o exterior. No Reino Unido, o programa 'SNL U.K.' retratou um encontro contencioso entre os príncipes William e Kate e Harry e Meghan no Sandringham Estate, retratando uma reunião familiar que gerou tensões entre os membros envolvidos. Em um evento musical, Arlo Parks compartilhou suas músicas favoritas, incluindo 'Sweet Dreams (Are Made of This)' dos Eurythmics e 'Fake Tales of San Francisco' dos Arctic Monkeys, destacando a importância de certas melodias na sua vida emocional.", "sociedade": "A saúde mental e a obesidade são temas importantes na sociedade brasileira, conforme destacado em artigos publicados. A obesidade, comum no Brasil, é uma condição crônica associada a diversos fatores que podem aumentar o risco de diabetes e hipertensão. O Dia Nacional de Prevenção da Obesidade, celebrado em 11 de outubro, destaca a importância de prevenir a doença. Além disso, a atenção corporativa à saúde mental diminuiu em 2026, apesar do aumento no número de licenças por transtornos psíquicos. Em relação a eventos específicos, um homem foi preso por estuprar uma criança em Brasília, e um gerente do tráfico foi preso no Rio de Janeiro. No exterior, a Coreia do Sul registrou uma redução de 41% no número de creches desde 2013, devido a baixas taxas de natalidade. Na França, estudantes em Sevran, uma região suburbana pobre ao norte de Paris, continuam as manifestações por condições precárias nas escolas, enquanto a Dinamarca permitirá que professores usem força física para manter a ordem nas escolas a partir de 2027.", "meio_ambiente": "O furacão Isaias, que atingiu a região sudeste dos Estados Unidos, deixou quatro mortos e causou danos significativos, incluindo interrupções de energia elétrica em várias cidades. Em outra notícia, oito orangotãos resgatados de áreas afetadas por incêndios foram libertados em uma floresta protegida na Indonésia, em uma ação que visa a sua recuperação e reintrodução na natureza. Na região chilena de Chiloé, a comunidade Coihuín de Compu concluiu a restauração de 75 hectares de floresta nativa, plantando 16.660 árvores de diversas espécies e recuperando áreas degradadas.", "direitos_humanos": "O Papa Francisco declarou que a pena de morte é 'inadmissível', em uma declaração, e criticou o planejamento dos Estados Unidos para transmitir ao vivo uma execução. Em outro desenvolvimento, a Associação Médica Mundial foi pressionada por médicos israelenses a suspender Israel devido à suposta inação perante a destruição do sistema de saúde palestiniano. Além disso, uma mulher condenada à morte nos Estados Unidos sobreviveu a uma tentativa de execução por injeção letal e foi posteriormente retornada à prisão. O caso chamou a atenção para a incompatibilidade da pena de morte com a dignidade humana. Em outro evento, a vencedora do Nobel da Paz criticou as sanções dos Estados Unidos ao Tribunal Penal Internacional, considerando-as inaceitáveis. Finalmente, em Gaza, uma criança foi morta durante ataques israelenses, reforçando os debates sobre direitos humanos em conflitos. Estes eventos demonstram a persistência de questões relacionadas à pena de morte, sanções internacionais e violações de direitos humanos em diversos contextos globais."}, "resumo_do_dia": {"politica_nacional": [{"id": 208523, "titulo": "Guilherme Cortez pede que PF amplie apuração sobre ataques a símbolos religiosos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/guilherme-cortez-pede-que-pf-amplie-apuracao-sobre-ataques-a-simbolos-religiosos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-11T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal eleito Guilherme Cortez (PSOL-SP) pediu à Polícia Federal que ampliasse a apuração sobre ataques a símbolos religiosos para incluir novos casos ocorridos recentemente.", "titulo_pt": "Guilherme Cortez pede que PF amplie apuração sobre ataques a símbolos religiosos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 208812, "titulo": "O voto que se forma nas redes", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-voto-que-se-forma-nas-redes", "fonte_id": "jota", "data_pub": "2026-10-11T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto explora o fenômeno do bolsonarismo nas redes sociais e seu impacto no processo eleitoral brasileiro. O bolsonarismo tem conseguido muitas vitórias em ambientes digitais.", "titulo_pt": "O voto que se forma nas redes", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 208592, "titulo": "Lula e Flávio buscam atrair eleitores que se abstiveram no 1º turno", "url": "https://www.metropoles.com/brasil/lula-e-flavio-buscam-atrair-eleitores-que-se-abstiveram-no-1o-turno", "fonte_id": "metropoles", "data_pub": "2026-10-11T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Com 33,4 milhões de eleitores que se abstiveram no primeiro turno, Lula e Flávio buscam aumentar a mobilização. 78% desses ausentes não pretendem votar novamente.", "titulo_pt": "Lula e Flávio buscam atrair eleitores que se abstiveram no 1º turno", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 208593, "titulo": "Eleições 2026: confira as agendas de Flávio e Lula neste domingo (11/10)", "url": "https://www.metropoles.com/brasil/eleicoes-2026-confira-as-agendas-de-flavio-e-lula-neste-domingo-11-10", "fonte_id": "metropoles", "data_pub": "2026-10-11T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos Flávio e Lula iniciam suas agendas de campanha neste domingo (11/10) com o objetivo de conquistar votos para o segundo turno das eleições de 2026.", "titulo_pt": "Eleições 2026: confira as agendas de Flávio e Lula neste domingo (11/10)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 208524, "titulo": "'Escudo' de Flávio Bolsonaro, Marçal produz onda de conteúdos e deixa em aberto convite a eventual governo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/escudo-de-flavio-bolsonaro-marcal-produz-onda-de-conteudos-e-deixa-em-aberto-convite-a-eventual-governo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-11T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pablo Marçal, um influenciador que já estava inelegível, registrou sua candidatura à Presidência da República. A candidatura, que não avançou, gerou suspeitas sobre suas verdadeiras intenções.", "titulo_pt": "Candidatura de Marçal à presidência suscita dúvidas sobre suas reais motivações", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 208536, "titulo": "Ala do STF vê Lei da Dosimetria como alternativa à revisão criminal de Bolsonaro", "url": "https://g1.globo.com/politica/noticia/2026/10/11/ala-do-stf-ve-lei-da-dosimetria-como-alternativa-a-revisao-criminal-de-bolsonaro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-11T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ministros do Supremo Tribunal Federal (STF) propõem julgar ações sobre a Lei da Dosimetria após as eleições, considerando-a uma alternativa para o julgamento de pedidos de revisão criminal de Jair Bolsonaro, que buscam anular sua condenação.", "titulo_pt": "Ala do STF vê Lei da Dosimetria como alternativa à revisão criminal de Bolsonaro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 208639, "titulo": "Crise energética: Brasil não destoa das boas práticas, diz especialista", "url": "https://www.cnnbrasil.com.br/economia/crise-energetica-brasil-nao-destoa-das-boas-praticas-diz-especialista/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-11T06:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um especialista avaliou as medidas do governo brasileiro para reduzir os preços dos combustíveis e o impacto financeiro de R$ 5,2 bilhões nas contas públicas relacionado a essas ações.", "titulo_pt": "Crise energética: Brasil não se diferencia nas boas práticas, diz especialista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 208537, "titulo": "Estreantes nas urnas, conhecidos na política: veja quem chega ao Congresso em 2027", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/11/estreantes-congresso-eleicoes-2026.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-11T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A eleição de 2026 levará iculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 208515, "titulo": "Flávio Bolsonaro cria site 'anti-fake news' em que se compromete com ajuste do mínimo pela inflação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/flavio-bolsonaro-cria-site-anti-fake-news-em-que-se-compromete-com-ajuste-do-minimo-pela-inflacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-11T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro, candidato a presidente pelo PL, lançou um site para combater notícias falsas, onde se compromete com o reajuste do salário mínimo pela inflação, se eleito.", "titulo_pt": "Flávio Bolsonaro cria site 'anti-fake news' e se compromete com reajuste do mínimo pela inflação", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 208525, "titulo": "Com centrão e Faria Lima, 5 grupos já disputam eventual ministério de Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/com-centrao-e-faria-lima-5-grupos-ja-disputam-eventual-ministerio-de-flavio-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-11T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, do PL, chegou ao segundo turno das eleições, terminando o primeiro com votos acima de Lula, do PT. Cinco grupos de origens diferentes estão disputando uma eventual posição ministerial no governo de Flávio Bolsonaro, alguns dos quais o acompanharam desde a campanha, enquanto outros se aproximaram recentemente.", "titulo_pt": "Com centrão e Faria Lima, 5 grupos já disputam eventual ministério de Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 208526, "titulo": "Pesquisa refuta 'voto de cajado' nas igrejas: propaganda eleitoral apareceu em 3%", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/pesquisa-refuta-voto-de-cajado-nas-igrejas-propaganda-eleitoral-apareceu-em-3.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-11T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que a propaganda eleitoral nas igrejas é rara, aparecendo apenas em 3% dos casos. Padres e pastores não incentivam votos na igreja com frequência.", "titulo_pt": "Pesquisa diz que 'voto de cajado' nas igrejas é raro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 208527, "titulo": "A situação de Lula piorou", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/eliogaspari/2026/10/a-situacao-de-lula-piorou.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-11T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha mostrou que Flávio Bolsonaro aumentou sua vantagem sobre Lula, com 52% a 48%. Nove milhões de votos que foram para Lula em 2022 agora apoiam Flávio em 2026.", "titulo_pt": "Situação de Lula piorou", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 208528, "titulo": "Centrais intensificam mobilização pelo fim da 6x1, em Brasília", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/centrais-intensificam-mobilizacao-pelo-fim-da-6x1-em-brasilia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-11T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As centrais sindicais vão aumentar a mobilização em favor da aprovação da PEC que prevê o fim da escala 6x1 no Congresso, na semana em que o Senado pode votar o projeto em primeiro turno.", "titulo_pt": "Centrais intensificam mobilização pelo fim da 6x1, em Brasília", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 208529, "titulo": "Moraes está disposto a cair atirando", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/eliogaspari/2026/10/moraes-esta-disposto-a-cair-atirando.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-11T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes determinou que Eduardo Bolsonaro comece a cumprir a pena de quatro anos e dois meses de prisão em regime semiaberto. Essa decisão indica que Moraes está disposto a enfrentar possíveis consequências por essa medida.", "titulo_pt": "Moraes está disposto a cair atirando", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 208619, "titulo": "Houthis renovam alerta sobre aeroportos sauditas após ataque com 12 mortos", "url": "https://www.cnnbrasil.com.br/internacional/houthis-renovam-alerta-sobre-aeroportos-sauditas-apos-ataque-com-12-mortos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-11T09:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O grupo hutíssimo, apoiado pelo Irã, renovou um alerta sobre a segurança dos aeroportos sauditas, após um ataque que resultou em 12 mortos. O grupo advertiu companhias aéreas, especialistas, funcionários, trabalhadores e viajantes contra o uso dos aeroportos e do espaço aéreo saudita.", "titulo_pt": "Houthis renovam alerta sobre aeroportos sauditas após ataque com 12 mortos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 208853, "titulo": "🔴At least 109 migrants dead, more than 100 missing after boat capsizes off Djibouti", "url": "https://www.france24.com/en/africa/20261011-at-least-hundred-migrants-dead-scores-missing-after-boat-capsizes-off-djibouti", "fonte_id": "france24", "data_pub": "2026-10-11T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 109 migrantes morreram e mais de 100 estão desaparecidos após uma embarcação capotar nas proximidad
