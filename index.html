licata_de": null, "texto_pt": "Um estudo examinou as experiências paranormales vivenciadas por pessoas para entender suas origens e impacto no bem-estar. O estudo revelou detalhes sobre fenômenos como a sensação de presença, a visão de fantasmas e o déjà vu.", "titulo_pt": "Sentir uma presença, ver fantasmas ou ter um déjà vu: o que mostrou um estudo sobre essas experiências 'inquietantes'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 141233, "titulo": "\"Neguinho\": estudante denuncia professor por racismo em colégio de SP", "url": "https://www.metropoles.com/sao-paulo/neguinho-estudante-denuncia-professor-por-racismo-em-colegio-de-sp", "fonte_id": "metropoles", "data_pub": "2026-09-02T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um aluno denunciou um professor de história por supostamente chamá-lo de 'neguinho' durante uma aula no colégio São Paulo, na manhã de 1° de setembro. O colégio ainda não se pronunciou sobre o caso.", "titulo_pt": "Estudante denuncia professor por racismo em colégio de SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 141624, "titulo": "Two Palestinian citizens of Israel killed in Nazareth", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/two-palestinian-citizens-israel-killed-nazareth", "fonte_id": "middle_east_eye", "data_pub": "2026-09-02T19:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois cidadãos palestinos de Israel foram mortos em Nazaré na sexta-feira. O total de cidadãos palestinos mortos em Israel desde o início de 2026 é de 156, incluindo pelo menos três mortos por disparos de policiais israelenses, além de cinco mulheres e três crianças.", "titulo_pt": "Dois cidadãos palestinos de Israel mortos em nazaré", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 140339, "titulo": "Família denúncia negligência médica após mulher morrer durante endoscopia", "url": "https://www.metropoles.com/distrito-federal/familia-denuncia-negligencia-medica-apos-mulher-morrer-durante-endoscopia", "fonte_id": "metropoles", "data_pub": "2026-09-02T17:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Miranir de Souza Dias teve um mal-estar após uma endoscopia em uma clínica particular no Distrito Federal e faleceu após ser internada. A polícia está investigando o caso.", "titulo_pt": "Família denuncia negligência médica após mulher morrer durante endoscopia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 140341, "titulo": "Ufop retoma aulas após ameaças contra alunos e diretor em campus de MG", "url": "https://www.metropoles.com/minas-gerais/ufop-retoma-aulas-apos-ameacas-contra-alunos-e-diretor-em-campus-de-mg", "fonte_id": "metropoles", "data_pub": "2026-09-02T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As atividades no campus de Minas Gerais foram retomadas nesta quarta-feira (2/9) após ameaças contra alunos e diretor, com reforço do policiamento da PM no local.", "titulo_pt": "Ufop retoma aulas após ameaças contra alunos e diretor em campus de MG", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 140344, "titulo": "Mercado terá que pagar R$ 15,6 mil à mulher que se feriu com carrinho em BH", "url": "https://www.metropoles.com/minas-gerais/mercado-tera-que-pagar-r-156-mil-a-mulher-que-se-feriu-com-carrinho-em-bh", "fonte_id": "metropoles", "data_pub": "2026-09-02T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher de 80 anos fraturou o tornozelo quando um carrinho com mais de 100 produtos tombou sobre ela em uma esteira de um mercado em Belo Horizonte. O estabelecimento terá que pagar R$ 15,6 mil como indenização.", "titulo_pt": "Mercado terá que pagar R$ 15,6 mil à mulher que se feriu com carrinho em BH", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 140354, "titulo": "Resort vai indenizar família após intoxicação alimentar em ceia de Natal", "url": "https://www.metropoles.com/sao-paulo/resort-vai-indenizar-familia-apos-intoxicacao-alimentar-em-ceia-de-natal", "fonte_id": "metropoles", "data_pub": "2026-09-02T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma família de Rio Preto que adquiriu um pacote all inclusive para comemorar o Natal na Bahia será indenizada após sofrer intoxicação alimentar durante a ceia de Natal. Cada membro da família receberá R$ 5 mil de indenização.", "titulo_pt": "Resort vai indenizar família após intoxicação alimentar em ceia de Natal", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 140355, "titulo": "Casal lava imóvel após atrair, emboscar e matar adolescente dentro de casa", "url": "https://www.metropoles.com/sao-paulo/casal-lava-imovel-apos-atrair-emboscar-e-matar-adolescente-dentro-de-casa", "fonte_id": "metropoles", "data_pub": "2026-09-02T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um casal emboscou e matou Clara Victória De Oliveira Palhares, uma adolescente de 17 anos, em sua casa. Mesmo após o assassinato, ela foi levada a um hospital por um dos suspeitos, mas não sobreviveu.", "titulo_pt": "Casal embosca, mata e leva adolescente a hospital antes de ser detida", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 140358, "titulo": "Polícia apura morte de professora que teve alta 2 vezes em hospital público", "url": "https://www.metropoles.com/brasil/policia-apura-morte-de-professora-que-teve-alta-2-vezes-em-hospital-publico", "fonte_id": "metropoles", "data_pub": "2026-09-02T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A polícia está investigando a morte de uma professora que teve alta médica duas vezes em um hospital público. O hospital justificou a primeira alta por indicadores vitais normais, mas não forneceu detalhes sobre a segunda alta ou sobre a eventual causa da morte da vítima.", "titulo_pt": "Polícia apura morte de professora que teve alta duas vezes em hospital público", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 141275, "titulo": "Sintomas respiratórios atingiram 92% da população brasileira no último ano", "url": "https://www.cnnbrasil.com.br/saude/sintomas-respiratorios-atingiram-92-da-populacao-brasileira-no-ultimo-ano/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Datafolha indicou que 92% da população brasileira apresentaram sintomas respiratórios no último ano. O relatório destaca a normalização desses sintomas e a falta de busca por avaliação médica.", "titulo_pt": "Sintomas respiratórios atingiram 92% da população brasileira no último ano", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 141484, "titulo": "The world is whiffing on its biggest climate goal", "url": "https://www.vox.com/today-explained-newsletter/501812/the-world-is-whiffing-on-its-biggest-climate-goal", "fonte_id": "vox", "data_pub": "2026-09-02T21:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O objetivo climático de manter o aquecimento global abaixo de 1,5°C tem sido o principal foco das políticas climáticas por mais de uma década. No entanto, há preocupações de que esse objetivo possa não ser alcançado.", "titulo_pt": "Mundo negligenciando seu maior objetivo climático", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 140488, "titulo": "“Cada fracción de grado costará vidas”: la ONU admitió que estamos cerca de superar el aumento límite de 1,5°C fijado por el Acuerdo de París", "url": "https://www.lanacion.com.ar/sociedad/cada-fraccion-de-grado-costara-vidas-la-onu-admitio-que-estamos-cerca-de-superar-el-aumento-limite-nid02092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-02T17:43:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um novo relatório indicou que o limite de 1,5°C estipulado pelo Acordo de Paris pode ser superado nos próximos anos. Autoridades e especialistas internacionais alertaram sobre os riscos para humanos e ecossistemas associated com essa possibilidade.", "titulo_pt": "Cada fração de grau custará vidas: ONU admite que estamos próximos de superar o aumento limite de 1,5°C do acordo de paris", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 140159, "titulo": "Indústria marítima recorre ao vento para reduzir consumo de combustível", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/industria-maritima-recorre-ao-vento-para-reduzir-consumo-de-combustivel.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-02T15:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Maersk, empresa dinamarquesa de logística e transporte marítimo, assinou um acordo para instalar a primeira vela eólica em um navio porta-contêineres. A indústria marítima está retomando uma tecnologia antiga para reduzir o consumo de combustível e atender a regulamentações ambientais mais rigorosas.", "titulo_pt": "Indústria marítima recorre ao vento para reduzir consumo de combustível", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 140790, "titulo": "Nepal PM links deadly floods to climate change", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/2/nepal-pm-links-deadly-floods-to-climate-change?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-02T15:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro do Nepal relacionou as inundações letais recentes ao aquecimento global e às mudanças climáticas.", "titulo_pt": "PM do nepal relaciona inundações fatais às mudanças climáticas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 140319, "titulo": "Mundo deve ultrapassar limite de 1,5°C e corrida agora é para limitar danos, alerta ONU", "url": "https://exame.com/esg/mundo-deve-ultrapassar-limite-de-15c-e-corrida-agora-e-para-limitar-danos-alerta-onu/", "fonte_id": "exame", "data_pub": "2026-09-02T12:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relatório do PNUMA indica que o mundo está prestes a ultrapassar a meta de 1,5°C estabelecida pelo Acordo de Paris nos próximos anos, mas destaca que ações rápidas podem limitar os danos e reverter a trajetória de aquecimento.", "titulo_pt": "Mundo deve ultrapassar limite de 1,5°C e corrida agora é para limitar danos, alerta ONU", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 140444, "titulo": "ONU: aumento da temperatura acima de 1,5°C precisa ter magnitude e duração limitados para dar tempo para adaptação", "url": "https://www.jota.info/executivo/onu-aumento-da-temperatura-acima-de-15c-precisa-ter-magnitude-e-duracao-limitados-para-dar-tempo-para-adaptacao", "fonte_id": "jota", "data_pub": "2026-09-02T12:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O documento da ONU prevê um aumento de temperatura de até 1,8°C, no melhor cenário, embora já existam sinais de que este valor possa ultrapassar os 2°C.", "titulo_pt": "ONU: aumento da temperatura acima de 1,5°C precisa ter magnitude e duração limitados para dar tempo de adaptação", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 140916, "titulo": "Indonesian wildfire haze forces 1.4 million students to move to online learning", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3366138/indonesian-wildfire-haze-forces-14-million-students-move-online-learning?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-02T12:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 1,4 milhão de estudantes em seis províncias indonésias tiveram que mudar para aprendizado online devido à qualidade do ar ruim causada por incêndios florestais e de terras. Até 2 de setembro, cerca de 1,43 milhões de estudantes de 12.874 escolas nessas províncias estavam estudando remotamente.", "titulo_pt": "Incêndios florestais fazem 1,4 milhão de estudantes mudarem para ensino online na indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 140730, "titulo": "DRC Ebola epidemic records over 6,000 cases and nearly 3,000 deaths", "url": "https://www.lemonde.fr/en/health/article/2026/09/02/drc-ebola-epidemic-records-over-6-000-cases-and-nearly-3-000-deaths_6757083_14.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-02T11:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A atual epidemia de Ebola na República Democrática do Congo registrou mais de 6.000 casos e quase 3.000 mortes desde maio. É a pior epidemia do país e está causada pelo vírus Ebola do tipo Bundibugyo, sem vacina ou tratamento específico aprovado.", "titulo_pt": "Epidemia de Ebola na república democrática do congo atinge marca de mais de 6.000 casos e 3.000 mortes", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 140719, "titulo": "The world must do all it can to return below 1.5°C threshold after surpassing it, UN warns", "url": "https://www.lemonde.fr/en/environment/article/2026/09/02/the-world-must-do-all-it-can-to-return-below-1-5-c-threshold-after-surpassing-it-un-warns_6757082_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-02T10:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ONU reconheceu que o mundo está destinado a ultrapassar o objetivo mais ambicioso do Acordo de Paris e apresentou uma nova trajetória para que as temperaturas retornem abaixo desse limite antes do fim do século. Isso exigiria enormes esforços e transformações radicais.", "titulo_pt": "Mundo deve fazer tudo o que for possível para retornar abaixo da marca de 1,5°C após ultrapassá-la, avisa a ONU", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 139418, "titulo": "Clima: frentes frias chegam ao Sudeste e tempo firme retorna ao Sul", "url": "https://www.metropoles.com/brasil/clima-frentes-frias-chegam-ao-sudeste-e-sol-e-tempo-firme-retornam-ao-sul", "fonte_id": "metropoles", "data_pub": "2026-09-02T09:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Frentes frias chegam ao Sudeste do Brasil, causando rajadas de vento entre 50 km/h e 70 km/h no litoral paulista e capixaba, com picos de até 90 km/h. O tempo firme retorna para o Sul do país.", "titulo_pt": "Clima: frentes frias chegam ao Sudeste e tempo firme retorna ao Sul", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 139379, "titulo": "Mortos no Nepal passam de 1.100 após inundação e deslizamento", "url": "https://www.cnnbrasil.com.br/internacional/mortos-no-nepal-passam-de-1-100-apos-inundacao-e-deslizamento/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T08:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de mortos no Nepal após a ocorrência de inundação e deslizamento de terra ultrapassou 1.100. Mais de 3.900 pessoas permanecem desaparecidas no país, segundo as autoridades.", "titulo_pt": "Mortos no Nepal passam de 1.100 após inundação e deslizamento de terra; 3.900 desaparecidos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 139384, "titulo": "ONU prevê aquecimento superior a 1,5°C e riscos maiores no agro", "url": "https://www.cnnbrasil.com.br/agro/onu-preve-aquecimento-superior-a-15c-e-riscos-maiores-no-agro/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-02T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ONU prevê um aquecimento global superior a 1,5°C, aumentando os riscos relacionados a eventos climáticos extremos e afetando negativamente a produtividade agrícola e a utilização de recursos naturais.", "titulo_pt": "ONU prevê aquecimento superior a 1,5°C e riscos maiores no agro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 139869, "titulo": "Fatal floods expose threats to hydropower in the roof of the world", "url": "https://www.japantimes.co.jp/environment/2026/09/02/energy/floods-threat-hydropower-nepal/", "fonte_id": "japan_times", "data_pub": "2026-09-02T06:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O clima está mudando, trazendo gelos instáveis e chuvas imprevisíveis, criando novos riscos e aumentando os custos para projetos de hidrelétrica na região conhecida como teto do mundo.", "titulo_pt": "Inundações fatais expõem ameaças às hidrelétricas no teto do mundo", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 139637, "titulo": "Almost half of world’s farmers poisoned by pesticides every year, experts find", "url": "https://www.theguardian.com/environment/2026/sep/02/50-per-cent-world-farmers-poisoned-pesticides-every-year-experts", "fonte_id": "guardian_world", "data_pub": "2026-09-02T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo, encomendado pela Rede de Ação sobre Pesticidas, revelou que quase metade dos agricultores do mundo são intoxicados por pesticidas a cada ano. O estudo, que utilizou dados públicos de 2006 a 2023, estimou que ocorrem entre 402 e 433 milhões de casos de intoxicação aguda por pesticidas entre agricultores e trabalhadores rurais anualmente. India é responsável por quase 60% dos óbitos relacionados a intoxicações por pesticidas.", "titulo_pt": "Quase metade dos agricultores do mundo é intoxicada por pesticidas a cada ano, mostra estudo", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 139859, "titulo": "‘Marine Landfills’: The Garbage Choking Greece’s Seas", "url": "https://balkaninsight.com/2026/09/02/marine-landfills-the-garbage-choking-greeces-seas/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-09-02T05:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As águas do Mar Egeu e do Mar Íonico em Grécia estão sendo sufocadas por crescentes concentrações de resíduos, principalmente plásticos, sobretudo devido à imagem de águas cristalinas que se mantém.", "titulo_pt": "Marjantes de lixo: as águas de Grécia estão sufocadas", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 141656, "titulo": "57 indicted over AI-powered romance scam", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/03/2003863596", "fonte_id": "taipei_times", "data_pub": "2026-09-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cinquenta e sete pessoas foram indiciadas em relação a um esquema de golpe de romance baseado em inteligência artificial.", "titulo_pt": "57 Indiciados em esquema de romance com inteligência artificial", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 141658, "titulo": "EU says alleged Russian drone plot has ‘all the hallmarks of terrorism’", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/03/2003863598", "fonte_id": "taipei_times", "data_pub": "2026-09-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Europa dos Estados (UE) afirma que o suposto plano de drone russo apresenta todos os sinais típicos de terrorismo.", "titulo_pt": "Ue diz que suposto plano de drone russo tem 'todas as características do terrorismo'", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 141659, "titulo": "Groups call for release of HK democracy advocate", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/03/2003863605", "fonte_id": "taipei_times", "data_pub": "2026-09-03T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos estão pedindo pela libertação de um ativista democrático de Hong Kong. As organizações estão pressionando por liberdade para o ativista, sem fornecer detalhes adicionais sobre a situação.", "titulo_pt": "Grupos chamam pela libertação de ativista democrático de hong kong", "veiculo": "Taipei Times", "pais": "Ta o", "classe": "B"}, {"id": 140449, "titulo": "Archivo Berrutti: oficios secretos revelan desconocida colaboración entre inteligencia militar de Chile y Uruguay en 1973", "url": "https://www.ciperchile.cl/2026/09/02/archivo-berrutti-oficios-secretos-revelan-desconocida-colaboracion-entre-inteligencia-militar-de-chile-y-uruguay-en-1973/?utm_source=rss&utm_medium=rss&utm_campaign=archivo-berrutti-oficios-secretos-revelan-desconocida-colaboracion-entre-inteligencia-militar-de-chile-y-uruguay-en-1973", "fonte_id": "ciper_chile", "data_pub": "2026-09-02T17:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Ofícios secretos revelam uma colaboração desconhecida entre a inteligência militar de Chile e Uruguai em 1973.", "titulo_pt": "Arquivo Berrutti: ofícios secretos mostram colaboração inesperada entre inteligência militar de Chile e uruguai em 1973", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 140450, "titulo": "Anatomía del terror: los secretos del Archivo Berrutti y las operaciones de los militares en Chile y el Cono Sur antes del golpe de 1973", "url": "https://www.ciperchile.cl/2026/09/02/anatomia-del-terror-los-secretos-del-archivo-berrutti-y-las-operaciones-de-los-militares-en-chile-y-el-cono-sur-antes-del-golpe-de-1973/?utm_source=rss&utm_medium=rss&utm_campaign=anatomia-del-terror-los-secretos-del-archivo-berrutti-y-las-operaciones-de-los-militares-en-chile-y-el-cono-sur-antes-del-golpe-de-1973", "fonte_id": "ciper_chile", "data_pub": "2026-09-02T17:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O livro 'Anatomia do Terror: Os Secretos do Arquivo Berrutti e as Operações dos Militares em Chile e o Cono Sul Antes do Golpe de 1973' explora os arquivos Berrutti e as atividades militares durante o período pré-golpe de 1973 no Chile e região.", "titulo_pt": "Anatomia do terror: os secretos do arquivo Berrutti e as operações militares em Chile e o Cono sul antes do golpe de 1973", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 141728, "titulo": "Global initiative launched to improve access to mpox vaccines", "url": "https://www.unicef.org/press-releases/global-initiative-launched-improve-access-mpox-vaccines", "fonte_id": "unicef", "data_pub": "2026-09-02T15:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foi lançada uma iniciativa global com o objetivo de melhorar o acesso a vacinas contra a variante mpox. A iniciativa visa aumentar a disponibilidade e a distribuição dessas vacinas em todo o mundo.", "titulo_pt": "Iniciativa global lançada para melhorar o acesso às vacinas contra mpox", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 140563, "titulo": "Palestinian Australian sues NSW police claiming he was punched at Herzog rally when helping prayer group", "url": "https://www.theguardian.com/australia-news/2026/sep/03/palestinian-australian-eyad-shadid-sues-nsw-police-punched-at-herzog-rally-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-09-02T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem palestino-australiano acusa a polícia do estado de Nova South Wales de tê-lo batido durante uma manifestação contra o político Isaac Herzog, quando ele tentava impedir a perturbação de um grupo de oração. Ele ingressou com uma ação cível na corte district de NSW, alegando que foi falsamente acusado e injustamente detido pela polícia.", "titulo_pt": "Palestino-australiano processa polícia de NSW após acusação de ser agredido durante manifestação", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 140909, "titulo": "Hong Kong police arrest 2 from clinic over sales of bogus ‘cancer vaccine’", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3366148/hong-kong-police-arrest-clinic-operator-over-sales-unapproved-cancer-vaccine?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-02T14:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades de Hong Kong detiveram um homem e uma mulher de uma clínica suspeitas de venderem um reagente de laboratório como um suposto vacina contra mais de 20 tipos de câncer. A operação, realizada pela Secretaria de Saúde e pela polícia, resultou no raio-x de 13 locais associados à empresa.", "titulo_pt": "Hong Kong: pessoas de clínica são detidas por venda de suposto ‘vacina contra câncer’", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 139409, "titulo": "Homem é preso após defender estupro como “dever” e atacar mulheres na web", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/homem-e-preso-apos-defender-estupro-como-dever-e-atacar-mulheres-na-web", "fonte_id": "metropoles", "data_pub": "2026-09-02T09:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Gabriel Mendes Bernartt, acusado de defender estupro como dever e atacar mulheres na internet, foi preso. Imagens da investigação mostram-o segurando a cabeça de um animal decapitado.", "titulo_pt": "Homem é preso após defender estupro como ‘dever’ e atacar mulheres na web", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 139673, "titulo": "America is seeing an uptick in executions", "url": "https://www.axios.com/2026/09/02/death-penalty-executions-surging-florida", "fonte_id": "axios", "data_pub": "2026-09-02T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de execuções nos Estados Unidos aumentou após a pandemia de COVID-19, com Florida executando seu 14º prisioneiro no ano. Apesar de menos sentenças de morte e a suspensão temporária da pena capital em mais de metade dos estados, o governo Trump incentivou o uso da pena capital.", "titulo_pt": "Estados unidos registram aumento nas execuções", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 139969, "titulo": "Ex-head of Incheon disability facility gets 15 years for sexually assaulting residents", "url": "https://www. const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
