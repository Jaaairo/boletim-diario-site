<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

o presidente dos Estados Unidos, Donald Trump, para discutir a retomada das negociações comerciais e as alegações infundadas que levaram à imposição de novas tarifas contra o Brasil. O presidente do Irã, Masud Pezeshkián, declarou que seu país está em posição de força e dignidade para concluir a guerra com os Estados Unidos, rejeitando qualquer cedência à pressão americana. Além disso, a França emitiu uma ordem de recall de aproximadamente 260 mil condôminos de qualidade subpadrão, enquanto o governo do Novo Sul da Wales pode recorrer de uma decisão controversa do juiz Desmond Fagan, que rejeitou seu pedido para um mandado de terror contra Mohammed Farhat, acusado de escrever 'Fuk Israel' em carros e incendiar outro veículo em 2023.\n\nA Ucrânia continua enfrentando intensos ataques militares, com um ataque a um shopping em Kryvyi Rih resultando em 6 mortos e mais de 90 feridos, incluindo crianças. O número de mortos ucranianos aumenta, levando um especialista russo a advertir sobre uma possível crise social iminente. Em resposta, líderes da França, Alemanha e Reino Unido vão co-presidir uma reunião de países aliados à Ucrânia em Kiev. A Ucrânia pede uma resposta mais forte aos lançamentos de foguetes balísticos sobre a capital. As tensões geopolíticas se estendem para outros países, com o Irã reagindo à escalada de sanções dos EUA, e a China e os EUA competindo por influência na Ásia Oriental, especialmente em relação à inteligência artificial. Além disso, a Romênia mobilizou caças F-16 para destruir um drone suspeito perto de um projeto de gás crucial, enquanto a Alemanha investiga o suspeito ucraniano Volodymyr Zhuravlev envolvido nas explosões nos dutos Nord Stream.", "economia": "O dólar caiu nesta sexta-feira, seguindo a tendência de queda do dólar norte-americano no mercado internacional. O Ibovespa subiu e alcançou os 170 mil pontos, principalmente impulsionado por ações da Vale e das empresas bancárias. O ministro da Fazenda, Fernando Haddad, destacou que os juros do cartão de crédito e a escala 6x1 serão focos das próximas políticas econômicas. A Petrobras expressou interesse em explorar petróleo em Gana, enquanto a Braskem está avaliando medidas de proteção e intensificando negociações com credores. O Bitcoin está em uma trajetória para ganhar 20% na semana, impulsionado por diversos fatores, e a indústria de pagamentos digitais pode melhorar sua eficiência energética em até 15%. O governo sul-coreano manteve os limites de preço do combustível inalterados por mais quatro semanas, devido à tensão no Oriente Médio. Além disso, a Airbus flexibilizou suas políticas sobre trabalho remoto após uma série de greves.", "tecnologia": "O presidente dos Estados Unidos, Joe Biden, assinou uma diretriz para aumentar os lançamentos espaciais no país, com o objetivo de revitalizar a liderança americana no transporte espacial. No âmbito tecnológico, o Instituto ofereceu 150 vagas para um curso gratuito focado em tecnologia, direcionado a jovens, visando prepará-los para o mercado de trabalho na área de programação. O relatório Stop Hunting, Start Solving discute como transformar variações de rendimento em análise mais rápida e confiável da causa raiz, utilizando uma plataforma de análise semicondutora especializada. Além disso, a empresa Oura enfrenta uma ação judicial que acusa a empresa de enganar os consumidores sobre a precisão da medição do sono pelos seus anéis. Por fim, a Tesla está realizando a maior recall de produtos já registrada no mercado de veículos elétricos da China, afetando quase 3 milhões de carros para corrigir um problema com os travessões das portas, enquanto a China busca mecanismos de proteção contra riscos da IA, adotando abordagens diferentes para gerenciar os riscos associados à inteligência artificial.", "ciencia": "A exposição de Taipei destaca tecnologias de adaptação ao calor, apresentando inovações para mitigar os efeitos do calor em diversos ambientes. O Instituto de Conservação apresentou um plano para proteger três espécies de plantas em perigo de extinção. O Telescópio Espacial James Webb da NASA capturou uma imagem da Nébula Carina, revelando detalhes de uma região de formação estelar. Cientistas usaram fibras ópticas para transformar ondas sísmicas geradas por tempestades, conhecidas como 'thunderquakes', em mapas subterrâneos que podem revelar perigos ocultos sob as cidades. A China está lançando uma missão lunar para procurar água congelada em craters permanentemente sombreados, um passo importante para estabelecer uma presença humana permanente na Lua. A Telescópio Espacial James Webb da NASA também capturou uma imagem de uma parte da Nébula Carina, revelando uma região de formação estelar conhecida como 'Cofre', que é um globo cometeário. Além disso, a estrela S301, a mais rápida já registrada, pode auxiliar cientistas a medir pela primeira vez a rotação do buraco negro Sagitário A* localizado no centro da Via Láctea.", "cultura": "A Universidade Zumbi dos Palmares realizou uma cerimônia para comemorar a formatura de uma nova turma de transteters, com a presença de ministros, promovendo autonomia financeira e capacitando milhares de mulheres. Em São Paulo, o festival The Town anunciou as datas de sua terceira edição, que ocorrerá nos dias 4, 5, 6, 11 e 12 de setembro de 2027, no Autódromo de Interlagos. A cantora portuguesa Carminho iniciou sua nova turnê 'Eu Vou Morrer de Amor ou Resistir', com apresentações marcadas para o Vivo Rio. O artigo do Guardian Culture destaca a peça 'Who Killed Marilyn?' de Sharleen Cooper Cohen, com a atriz Pixie Lott, que revisita a vida de Marilyn Monroe sem resolver as teorias da conspiração sobre sua morte em 1962.", "sociedade": "A sociedade brasileira enfrenta diversos desafios, como casos de violência doméstica e sexual, bem como problemas na saúde mental das mulheres no trabalho. Recentemente, uma mulher foi presa em Hong Kong por estuprar repetidamente uma mulher com deficiência intelectual, levando a uma investigação intensa. No Rio de Janeiro, Flávio Bolsonaro realizou um evento em Nova Iguaçu, com um comício separado que contou com o apoio de políticos locais. Em São Paulo, a corrida eleitoral para governador está em pleno vapor, com propostas de Tarcísio de Freitas e Fernando Haddad para melhorar a segurança. No Rio Grande do Sul, um novo levantamento indica um cenário equilibrado entre os candidatos ao governo. Em relação à saúde, uma nova terapia para doença hepática autoimune pode ser ampliada no SUS, beneficiando principalmente mulheres acima de 45 anos. Além disso, a saúde mental das mulheres é um problema significativo, representando quase 65% dos afastamentos por esse motivo no trabalho. A ocupação Kasa Invisível em Belo Horizonte foi despejada, levando a um ato público, enquanto dois pescadores mexicanos foram resgatados após cinco dias à deriva no oceano.", "meio_ambiente": "Um relatório sobre o fenômeno 'Súper Niño' indica que há mais de 90% de probabilidade de ele se tornar 'Muito Forte', um dos mais intensos desde 1950. Até agora, 58 dos 92 municípios analisados já superaram suas médias históricas de precipitação e dez apresentam excedentes hídricos superiores a 50%. O fenômeno, que já causou inundações na Flórida após fortes chuvas em Nova York, está se movendo para o sul, gerando preocupações com a ameaça de inundações na região. Além disso, o governo está articulando medidas de prevenção para incêndios florestais em virtude do El Niño, recebendo estratégias de 11 estados para orientar equipes e recursos em áreas mais vulneráveis. Outros eventos ambientais incluem a expansão da energia solar na China, que pode afetar a biodiversidade, especialmente a diversidade de aves, e a descontaminação do Lago Villarrica no Chile, com um investimento estimado de US$ 56 milhões em 15 anos. A Vale fechou um novo acordo após quase 11 anos sobre a tragédia de Mariana, e o Ministério Público Federal (MPF) se posicionou contra um projeto que reduz a Área de Proteção Ambiental (APA) da Baleia Franca no litoral de Santa Catarina, podendo retirar cerca de 34 mil hectares da área protegida.", "direitos_humanos": "Trabalhadores indonésios acusam empregadores de usar trabalho forçado e reduzir salários, denunciando violações de direitos trabalhistas em operações de emprego temporário. Por outro lado, a senadora Damares afirmou que as mortes de yanomami representam uma das maiores crises humanitárias do país, apesar de uma comissão ter solicitado uma investigação sobre um bilhão de verbas destinadas à assistência aos yanomami. A Organização das Nações Unidas (ONU) alerta que 94% da população de Gaza, que ultrapassa 2,1 milhões de pessoas, enfrenta níveis críticos ou catastróficos de fome, com quatro em cada cinco famílias em situação desesperadora. Além disso, dois ativistas pró-democracia em Hong Kong foram condenados por organizar uma vigília anual para marcar o massacre de Tiananmen, enfrentando até 10 anos de prisão em uma audiência de segurança nacional."}, "resumo_do_dia": {"politica_nacional": [{"id": 115809, "titulo": "Lulinha pode ser preso por tráfico de influência? Advogado criminalista explica", "url": "https://veja.abril.com.br/brasil/lulinha-pode-ser-preso-por-trafico-de-influencia-advogado-criminalista-explica/", "fonte_id": "veja", "data_pub": "2026-08-21T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Paulo Brondi, advogado criminalista, detalha a pena para o crime de tráfico de influência e as circunstâncias que podem aumentar essa pena. A entrevista foi concedida ao programa Ponto de Vista.", "titulo_pt": "Lulinha pode ser condenado por tráfico de influência? Advogado explica", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 115862, "titulo": "Meirelles defende políticas ‘mais fortes’ do próximo governo para controlar gastos", "url": "https://www.infomoney.com.br/economia/meirelles-defende-politicas-mais-fortes-do-proximo-governo-para-controlar-gastos/", "fonte_id": "infomoney", "data_pub": "2026-08-21T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro da Fazenda, Henrique Meirelles, defendeu que o próximo governo deve implementar políticas mais rigorosas para controlar os gastos. Segundo ele, a proposta de reduzir o crescimento percentual das despesas de 2,5% para 1,5% dentro do arcabouço fiscal é considerada insuficiente.", "titulo_pt": "Meirelles defende políticas ‘mais fortes’ do próximo governo para controlar gastos", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 115908, "titulo": "Campanha de Flávio Bolsonaro divulga integrantes da área econômica", "url": "https://www.metropoles.com/brasil/campanha-de-flavio-bolsonaro-divulga-integrantes-da-area-economica", "fonte_id": "metropoles", "data_pub": "2026-08-21T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os novos integrantes da campanha de Flávio Bolsonaro se juntam a Daniella Marques, ex-presidente da Caixa, e Adolfo Sachsida, ex-ministro.", "titulo_pt": "Campanha de Flávio Bolsonaro anuncia novos integrantes da área econômica", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 115736, "titulo": "Moraes diz que IA é anabolizante para desinformação eleitoral e que só sobra cassação por uso indevido", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/moraes-diz-que-ia-e-anabolizante-para-desinformacao-eleitoral-e-que-so-sobra-cassacao-por-uso-indevido.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-21T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes, do STF, afirmou que candidatos que utilizarem inteligência artificial para disseminar desinformação durante as eleições poderão sofrer a cassação do registro ou do mandato. A possibilidade de perda do cargo é visto como um dos principais mecanismos para desestimular o uso criminoso da tecnologia na disputa eleitoral.", "titulo_pt": "Moraes afirma que uso de IA para desinformação eleitoral pode levar à cassação", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 115842, "titulo": "Senador pede para PF dizer se localização de Lulinha é conhecida", "url": "https://www.cnnbrasil.com.br/politica/senador-pede-para-pf-dizer-se-localizacao-de-lulinha-e-conhecida/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Carlos Viana solicitou à Polícia Federal que informasse se o localização do filho do presidente Lula, Lulinha, é conhecida e se as autoridades têm os meios necessários para realizar diligências relacionadas a ele.", "titulo_pt": "Senador quer saber se localização de Lulinha é conhecida pela PF", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 115737, "titulo": "Hélio Lopes adota versão 'Hélio Bolsonaro' em RR, critica Moraes e fala em 'guerra espiritual'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/helio-lopes-adota-versao-helio-bolsonaro-em-rr-critica-moraes-e-fala-em-guerra-espiritual.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-21T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Hélio Lopes, do PL-RJ, iniciou sua campanha pelo Senado em Roraima com um ato que reuniu cerca de 30 pessoas. A campanha inicial focará no apoio ao garimpo e a evangélicos, utilizando o sobrenome de Jair Bolsonaro.", "titulo_pt": "Hélio Lopes adota versão 'Hélio Bolsonaro' em roraima, critica Moraes e fala em 'guerra espiritual'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 115747, "titulo": "Flávio Bolsonaro anuncia novos nomes para equipe econômica", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/flavio-bolsonaro-anuncia-novos-nomes-para-equipe-economica.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato à presidência, anunciou sete novos membros para sua equipe econômica. Os novos nomes incluem a ex-presidente da Caixa Daniella Marques e o ex-ministro Adolfo Sachsida, que continuará na coordenação-geral do plano econômico.", "titulo_pt": "Flávio Bolsonaro anuncia novos nomes para equipe econômica", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 115823, "titulo": "As três variáveis que podem mudar jogo eleitoral após caso Lulinha, segundo cientista político", "url": "https://veja.abril.com.br/brasil/as-tres-variaveis-que-podem-mudar-jogo-eleitoral-apos-caso-lulinha-segundo-cientista-politico/", "fonte_id": "veja", "data_pub": "2026-08-21T16:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O professor Rodrigo Prando, do Mackenzie, indica que três variáveis podem influenciar o jogo eleitoral após o caso Lulinha: a repercussão do próprio caso, possíveis novos desgastes envolvendo Flávio Bolsonaro e outros fatores ainda não identificados.", "titulo_pt": "As três variáveis que podem mudar o jogo eleitoral após o caso Lulinha, de acordo com cientista político", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 115824, "titulo": "O motivo do silêncio de Flávio Bolsonaro sobre revelações do caso Lulinha, segundo cientista político", "url": "https://veja.abril.com.br/politica/o-motivo-do-silencio-de-flavio-bolsonaro-sobre-revelacoes-do-caso-lulinha-segundo-cientista-politico/", "fonte_id": "veja", "data_pub": "2026-08-21T16:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cientista político Rodrigo Prando analisa a reação do senador Flávio Bolsonaro ao caso Lulinha e afirma que a oposição já está em 'modo eleição', o que limita o espaço para a criação de uma Comissão Parlamentar de Inquérito (CPI).", "titulo_pt": "Motivo do silêncio de Flávio Bolsonaro sobre caso Lulinha, segundo cientista político", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 115739, "titulo": "Saiba quem são as pessoas ligadas às investigações do caso Lulinha", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/saiba-quem-sao-as-pessoas-ligadas-as-investigacoes-do-caso-lulinha.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-21T16:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O empresário Fábio Luís Lula da Silva, filho do ex-presidente Lula, é investigado por três inquéritos da Polícia Federal por suspeita de tráfico de influência. O ministro André Mendonça é relator de duas dessas investigações, enquanto Flávio Dino acompanha uma no Supremo Tribunal Federal.", "titulo_pt": "Saiba quem são as pessoas ligadas às investigações do caso Lulinha", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 116012, "titulo": "Quem são os candidatos ao governo do Tocantins (TO) nas eleições 2026", "url": "https://www.jota.info/eleicoes/eleicoes-2026/quem-sao-os-candidatos-ao-governo-do-tocantins-to-nas-eleicoes-2026-agosto", "fonte_id": "jota", "data_pub": "2026-08-21T15:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O vice-governador e seis outros políticos concorrem à eleição para o governo do Tocantins em 2026.", "titulo_pt": "Quem são os candidatos ao governo do Tocantins (TO) nas eleições 2026", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 115765, "titulo": "Marina diz que redução da maioridade penal é proposta populista 'para lacrar' e não resolve violência juvenil", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/08/21/marina-diz-que-reducao-da-maioridade-penal-e-proposta-populista-para-lacrar-e-nao-resolve-violencia-juvenil.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-21T15:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marina Silva criticou a proposta de redução da maioridade penal, considerando-a uma medida populista que não resolve a violência juvenil. Ela defendeu a aplicação dos mecanismos já existentes na legislação para adolescentes que cometem crimes graves.", "titulo_pt": "Marina critica proposta de redução da maioridade penal como medida populista", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 115749, "titulo": "Debate sobre 6x1 é populista e inócuo, diz coordenadora na campanha de Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/debate-sobre-6x1-e-populista-e-inocuo-diz-coordenadora-na-campanha-de-flavio-bolsonaro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T15:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A coordenadora do núcleo de economia da campanha do senador Flávio Bolsonaro, Daniella Marques, afirmou que o debate sobre o fim da escala 6x1 no país é populista e inócuo. Essa declaração foi feita em 21 de agosto de 2026.", "titulo_pt": "Debate sobre 6x1 é populista e inócuo, diz coordenadora da campanha de Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 115740, "titulo": "DC pede ao TSE que sua candidata participe de debate e alega falta de mulheres", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/dc-pede-ao-tse-que-sua-candidata-participe-de-debate-e-alega-falta-de-mulheres.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-21T15:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O DC (Democracia Cristã) solicitou ao TSE que sua candidata, Clariana Barão, participe de um debate previsto para o próximo domingo. O partido alega falta de representatividade feminina no evento.", "titulo_pt": "DC pede ao TSE que sua candidata participe de debate e alega falta de mulheres", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 116015, "titulo": "Sob Duda Lima, Flávio Bolsonaro afina discurso e encontra rumo para sua campanha", "url": "https://www.jota.info/eleicoes/eleicoes-2026/sob-duda-lima-flavio-bolsonaro-afina-discurso-e-encontra-rumo-para-sua-campanha", "fonte_id": "jota", "data_pub": "2026-08-21T15:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, sob a liderança de Duda Lima, está afinando seu discurso antissistema, mas evitando promessas de golpes, com o objetivo de atrair tanto o 'direita raiz' quanto eleitores moderados descontentes com o PT.", "titulo_pt": "Flávio Bolsonaro ajusta discurso sob liderança de Duda Lima", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 115741, "titulo": "Lobista pagou cartão e carro de ex-chefe de gabinete de Lula enquanto negociava com governo, diz PF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/lobista-pagou-cartao-e-carro-de-ex-chefe-de-gabinete-de-lula-enquanto-negociava-com-governo-diz-pf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-21T15:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal investiga o pagamento de R$ 217 mil por uma lobista para um ex-chefe de gabinete de Lula, Marco Aurélio Ribeiro, conhecido como Marcola, que incluiu faturas de cartão de crédito e financiamento de um veículo.", "titulo_pt": "Lobista pagou r$ 217 mil em despesas de ex-chefe de gabinete de Lula, diz PF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 116358, "titulo": "MAC calls for release of pro-democracy HK activists", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/22/2003862922", "fonte_id": "taipei_times", "data_pub": "2026-08-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Macau chamou para a liberação dos ativistas pró-democracia de Hong Kong. O governo de Macau pediu que as autoridades de Hong Kong considerem a soltura de ativistas que estão detidos por suas atividades pró-democracia.", "titulo_pt": "Macau pede liberdade para ativistas pró-democracia de hong kong", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 116384, "titulo": "Turkey issues ‘genocide’ warrant for Israel’s Netanyahu over Gaza flotilla", "url": "https://www.scmp.com/news/world/middle-east/article/3364892/turkey-issues-genocide-warrant-israels-netanyahu-over-gaza-flotilla?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-21T17:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo turco solicitou uma ordem de prisão internacional contra o primeiro-ministro de Israel, Benjamin Netanyahu, acusando-o de 'genocídio' em relação à interceptação de um navio-escorte que levava ajuda para Gaza. A justificativa turca se refere a incidentes ocorridos durante o conflito na Gaza, que começou em outubro de 2023, e que incluiu a interceptação de um navio em maio com cerca de 430 ativistas.", "titulo_pt": "Turquia pede prisão internacional de Netanyahu por 'genocídio' em Gaza", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 116024, "titulo": "O que Lula e Trump falaram no primeiro telefonema após meses de crise", "url": "https://www.bbc.com/portuguese/articles/c20eql73w4do?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-21T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "É a primeira conversa entre Lula e Trump desde junho, ocorrendo em meio a tensões entre os dois países. As negociações para o telefonema levaram semanas e foram conduzidas pela estratégia do governo brasileiro.", "titulo_pt": "O que Lula e Trump falaram no primeiro telefonema após meses de crise", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 115898, "titulo": "Ataque russo a shopping deixa 6 mortos e mais de 90 feridos na Ucrânia", "url": "https://www.metropoles.com/mundo/ataque-russo-a-shopping-deixa-6-mortos-e-mais-de-90-feridos-na-ucrania", "fonte_id": "metropoles", "data_pub": "2026-08-21T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Drones russos atingiram um centro comercial em Kryvyi Rih, na Ucrânia, deixando 6 mortos e mais de 90 feridos. Crianças estavam entre as vítimas e dezenas ficaram em estado grave.", "titulo_pt": "Ataque de drones russos a shopping deixa 6 mortos e mais de 90 feridos na Ucrânia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 116331, "titulo": "Kiev, 'salgono a 14 i morti nel raid a Kryvyi Rih, 4 uccisi a Mykolaiv'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/21/kiev-salgono-a-14-i-morti-nel-raid-a-kryvyi-rih-4-uccisi-a-mykolaiv_c3340416-d77f-4084-9726-a931fa2efa4e.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-21T17:40:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O governador e o ministro do Interior divulgaram um novo balanço. Em Kryvyi Rih, 14 mortes foram registradas durante o ataque, e 4 pessoas morreram em Mykolaiv.", "titulo_pt": "Kiev, novo balanço de 14 mortos em Kryvyi Rih e 4 em Mykolaiv", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 116177, "titulo": "El impacto de la guerra: Rusos retiran en masa dinero de bancos mientras estantes lucen vacíos en supermercados de Ucrania", "url": "https://www.latercera.com/mundo/noticia/el-impacto-de-la-guerra-rusos-retiran-en-masa-dinero-de-bancos-mientras-estantes-lucen-vacios-en-supermercados-de-ucrania/", "fonte_id": "la_tercera", "data_pub": "2026-08-21T17:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em agosto, cerca de 3,4 bilhões de dólares foram retirados dos bancos russos nas duas primeiras semanas do mês. Os ataques às instalações de armazenamento em Ucrânia estão causando problemas de abastecimento em supermercados no país.", "titulo_pt": "Impacto da guerra: russos retiram grandes quantias de bancos enquanto supermercados em Ucrânia ficam sem estoque", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 116118, "titulo": "Germany Identifies a Plot After Finding a Weapons Cache, but Names No Culprit", "url": "https://www.nytimes.com/2026/08/21/world/europe/germany-foreign-plot-hidden-guns.html", "fonte_id": "nyt_world", "data_pub": "2026-08-21T17:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades alemãs revelaram uma suposta conspiração envolvendo um plano de ataque político, mas não identificaram nenhum suspeito. A revelação ocorre em um momento em que uma série de ações desestabilizadoras têm sido atribuídas à Rússia.", "titulo_pt": "Alemanha revela plano de ataque político, mas não nomeia Culprit", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 115998, "titulo": "Trump y Lula conversan durante más de una hora tras los recientes gestos hostiles de Washington", "url": "https://elpais.com/america/2026-08-21/trump-y-lula-conversan-durante-mas-de-una-hora-tras-los-recientes-gestos-hostiles-de-washington.html", "fonte_id": "elpais_america", "data_pub": "2026-08-21T17:24:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Trump e Lula conversaram por mais de uma hora, abordando temas como o tarifamento, a luta contra o crime organizado e a situação internacional. Ambos os presidentes discutiram essas questões após os recentes gestos hostis de Washington.", "titulo_pt": "Trump e Lula conversam por mais de uma hora sobre tarifamento, crime organizado e situação internacional", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 116308, "titulo": "Israeli army, settlers kill 2 Palestinians in separate West Bank incidents", "url": "https://www.aljazeera.com/news/2026/8/21/israeli-army-settlers-kill-2-palestinians-in-separate-west-bank-incidents?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-21T17:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Settadores israelenses mataram um jovem palestiniano de 17 anos, enquanto forças israelenses mataram um homem palestiniano de 58 anos em incidentes separados no Território Ocidental.", "titulo_pt": "Israelenses matam dois palestinianos em incidentes separados no território ocidental", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 115999, "titulo": "Rubén Rocha regresa como gobernador de Sinaloa", "url": "https://elpais.com/mexico/2026-08-21/ruben-rocha-anuncia-su-regreso-como-gobernador-de-sinaloa.html", "fonte_id": "elpais_america", "data_pub": "2026-08-21T17:16:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Rubén Rocha retornou como governador de Sinaloa. Antes, ele havia se afastado do cargo com uma licença em maio, após ser acusado de tráfico de drogas nos Estados Unidos.", "titulo_pt": "Rubén Rocha retorna como governador de Sinaloa", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 116332, "titulo": "L'Argentina preme sul Mercosur per accelerare l'apertura a nuovi mercati", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/21/largentina-preme-sul-mercosur-per-accelerare-lapertura-a-nuovi-mercati_8d4ceac8-6e16-4ce3-b4ec-2f9ca841463d.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-21T17:11:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O ministro Quirno afirmou que não há tempo a perder e que, se não houver avanço no Mercosur, a Argentina vai avançar bilateralmente. O objetivo é acelerar a abertura para novos mercados.", "titulo_pt": "Argentina avança no Mercosur para acelerar abertura de novos mercados", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 115776, "titulo": "Em conversa ‘cordial’ com Trump, Lula rejeita classificação de facções como terroristas", "url": "https://www.cartacapital.com.br/politica/em-conversa-cordial-com-trump-lula-rejeita-classificacao-de-faccoes-como-terroristas/", "fonte_id": "cartacapital", "data_pub": "2026-08-21T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em uma conversa cordial com Trump, Lula rejeitou a classificação de facções como terroristas. O presidente americano se comprometeu a reforçar a cooperação bilateral sobre o tema.", "titulo_pt": "Em conversa cordial com Trump, Lula rejeita classificação de facções como terroristas", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 116002, "titulo": "El presidente de Irán pide terminar la guerra con Estados Unidos: “El mundo entero reconoce nuestra victoria”", "url": "https://elpais.com/internacional/2026-08-21/el-presidente-de-iran-pide-terminar-la-guerra-con-estados-unidos-el-mundo-entero-reconoce-nuestra-victoria.html", "fonte_id": "elpais_america", "data_pub": "2026-08-21T17:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente do Irã, Masud Pezeshkián, declarou que seu país está em posição de força e dignidade para concluir a guerra com os Estados Unidos, rejeitando, no entanto, qualquer cedência à pressão americana.", "titulo_pt": "Presidente do Irã afirma disposição para encerrar guerra com Estados Unidos", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 116154, "titulo": "Why Do Young Africans Love Donald Trump?", "url": "https://foreignpolicy.com/2026/08/21/african-youth-survey-donald-trump-transactionalism-popularity/", "fonte_id": "foreign_policy", "data_pub": "2026-08-21T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa revela que os jovens africanos têm uma preferência pelo abordagem transacional do presidente dos Estados Unidos, Donald Trump.", "titulo_pt": "Por que jovens africanos gostam de Donald Trump?", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 115847, "titulo": "Ataque russo a shopping na Ucrânia deixa 6 mortos e cerca de 90 feridos", "url": "https://www.cnnbrasil.com.br/internacional/ataque-russo-a-shopping-na-ucrania-deixa-mortos-e-feri/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T16:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ataque russo a um shopping em Kryvyi Rih, na Ucrânia, resultou em 6 mortos e cerca de 90 feridos. A cidade é natal do presidente Volodymyr Zelensky.", "titulo_pt": "Ataque russo a shopping na Ucrânia deixa 6 mortos e cerca de 90 feridos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 116027, "titulo": "Terremoto no Peru: por que América do Sul está vendo tantos abalos sísmicos em sequência?", "url": "https://www.bbc.com/portuguese/articles/c4gjn30x817o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-21T16:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Peru está passando por uma sequência recente de terremotos, levantando dúvidas sobre se o mundo está realmente experimentando mais tremores ou se a capacidade de registrá-los melhorou.", "titulo_pt": "Terremotos no Peru: mundo está passando por mais tremores ou a capacidade de registrá-los melhorou?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 115745, "titulo": "Entenda estratégia de secretário de Trump para mercado de US$ 32 trilhões dos Treasuries", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/entenda-estrategia-de-secretario-de-trump-para-mercado-de-us-32-trilhoes-dos-treasuries.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O secretário do Tesouro dos Estados Unidos, Scott Bessent, tem desempenhado um papel importante para Donald Trump, estabilizando o mercado financeiro diante das incertezas causadas pelas políticas do presidente americano. Essa estratégia tem sido aplicada em um mercado de títulos americanos de US$ 32 trilhões.", "t pub": "2026-08-21T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações dos bancos caíram, resultando em uma perda de mais de R$ 100 bilhões de valor de mercado. Investidores estão avaliando o impacto da inadimplência na lucratividade e nos dividendos das instituições.", "titulo_pt": "Ações de bancos caem em meio a preocupações com inadimplência e juros altos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 116279, "titulo": "Trump claims deal to cut beef import tariffs to help curb high prices", "url": "https://www.ft.com/content/7aabb591-ca73-4d87-96ad-dac9a210e1d0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-21T16:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou um acordo para reduzir tarifas de importação de carne bovina. Futuros do mercado de futuros de carne bovina caíram após Trump afirmar que fornecedores estrangeiros não identificados oferecerão um desconto de 25% por três meses.", "titulo_pt": "Trump anuncia acordo para reduzir tarifas de importação de carne bovina", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 116278, "titulo": "Apollo says hackers accessed personal data in latest Wall Street breach", "url": "https://www.ft.com/content/ac3f252d-bd49-4340-8565-f27a29652759?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-21T16:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um inquérito conduzido pela gestora de ativos alternativos Apollo revelou que dados pessoais, incluindo nomes, endereços residenciais e números de segurança social, foram roubados em um ataque cibernético ocorrido no mês passado.", "titulo_pt": "Apollo afirma que hackers acessaram dados pessoais na última brecha do Wall Street", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 115830, "titulo": "Empresas com 100 ou mais empregados devem atualizar dados até dia 31", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/empresas-com-100-ou-mais-empregados-devem-atualizar-dados-ate-dia-31", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-21T15:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As empresas privadas com 100 ou mais empregados devem atualizar suas informações até 31 de agosto no Portal Emprega Brasil. O procedimento é necessário para a elaboração do 6º Relatório de Transparência Salarial e de Critérios Remuneratórios pelo Ministério do Trabalho e Emprego.", "titulo_pt": "Empresas com 100 ou mais empregados devem atualizar dados até 31 de agosto", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 115831, "titulo": "Petrobras negocia exploração em Gana para ampliar presença na África", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/petrobras-negocia-exploracao-em-gana-para-ampliar-presenca-na-africa", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-21T15:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras expressou interesse em explorar petróleo em Gana como parte de sua expansão na África. A decisão visa encontrar novas fronteiras para a produção de óleo e gás.", "titulo_pt": "Petrobras expressa interesse em exploração de petróleo em Gana para ampliar presença na África", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 116014, "titulo": "Freio legal contém gasto com saúde em 2027, mas efeito sobre emendas será pequeno", "url": "https://www.jota.info/executivo/freio-legal-contem-gasto-com-saude-em-2027-mas-efeito-sobre-emendas-sera-pequeno", "fonte_id": "jota", "data_pub": "2026-08-21T15:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas têm opiniões divergentes sobre o impacto da medida, mas destacam que a área da saúde será uma das mais afetadas. O gasto com saúde em 2027 deve ser contido, mas o efeito sobre as emendas orçamentárias será limitado.", "titulo_pt": "Freio legal contém gasto com saúde em 2027, mas efeito sobre emendas será pequeno", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 115750, "titulo": "Nova safra de soja do Brasil pode cair um pouco com El Niño, diz executivo da Cofco", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466756", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T15:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da divisão de Grãos e Oleaginosas da Cofco no Brasil, Luiz Noto, espera uma redução na safra de soja em 2026/2027 devido aos efeitos do El Niño, menor área plantada e dificuldades financeiras dos produtores em um cenário de crédito restrito.", "titulo_pt": "Nova safra de soja do Brasil pode diminuir em 2026/2027 devido a El Niño, afirma executivo da Cofco", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 115751, "titulo": "Petrobras inicia negociação para exploração offshore em Gana", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/08/01/6556-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post466755", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T15:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras expressou interesse em explorar blocos offshore na Bacia de Keta, em Gana. A companhia informou sobre a manifestação de interesse nesta sexta-feira (21).", "titulo_pt": "Petrobras inicia negociação para exploração offshore em Gana", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 116274, "titulo": "Citadel offloads 80% of portfolio scooped up from Situational Awareness", "url": "https://www.ft.com/content/1603577e-89d8-4cfa-884b-b83fbb8dd20e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-21T14:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A hedge fund Citadel vendeu aproximadamente 80% de uma carteira adquirida da Situational Awareness recentemente, em operações de compra em bloco avaliadas em mais de 4 bilhões de dólares.", "titulo_pt": "Citadel vende 80% da carteira adquirida da situacional Awareness", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 115832, "titulo": "Desigualdades marcam formalização do trabalho entre jovens brasileiros", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/desigualdades-marcam-formalizacao-do-trabalho-entre-jovens-brasileiros", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-21T14:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Juventudes e o Mundo do Trabalho, realizada pela Fundação Itaú com apoio do Datafolha e do Instituto Locomotiva, revela que a formalização do trabalho entre jovens brasileiros de 16 a 29 anos é marcada por desigualdades. A sondagem ouviu 1.816 jovens de todo o país entre 11 e 23 de maio deste ano.", "titulo_pt": "Desigualdades marcam formalização do trabalho entre jovens brasileiros", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 115753, "titulo": "Juros do cartão de crédito e escala 6x1 serão foco do próximo governo, diz Durigan", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/juros-do-cartao-de-credito-e-escala-6x1-serao-foco-do-proximo-governo-diz-durigan.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T14:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, afirmou que os juros do cartão de crédito e a escala 6x1 serão focos das próximas políticas econômicas. Durigan também criticou o governo Jair Bolsonaro e defendeu os resultados da gestão de Luiz Inácio Lula da Silva.", "titulo_pt": "Juros do cartão de crédito e escala 6x1 serão foco do próximo governo, diz Durigan", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 116280, "titulo": "US and Canada haggle over trade deal as midnight tariffs threat looms", "url": "https://www.ft.com/content/24f9c08e-e23f-434e-b0f4-fc1eb55a7b04?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-21T14:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oficiais dos Estados Unidos e Canadá discutem um acordo comercial, após Trump suspender novas tarifas de US$ 20 bilhões sobre o parceiro comercial norte-americano. A ameaça de tarifas adicionais continua a pairar sobre as negociações.", "titulo_pt": "EUA e canadá negociam acordo comercial após pausa nas novas tarifas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 115754, "titulo": "Onze montadoras anunciam maior recall da China com mais de 4 milhões de carros elétricos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/onze-montadoras-anunciam-maior-recall-da-china-com-mais-de-4-milhoes-de-carros-eletricos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T14:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Onze montadoras chinesas realizaram um recall de mais de 4 milhões de carros elétricos em resposta à fiscalização dos órgãos reguladores sobre os sistemas de abertura emergencial das portas dos veículos elétricos.", "titulo_pt": "Onze montadoras realizam maior recall da China com mais de 4 milhões de carros elétricos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 116378, "titulo": "Report outlines AI’s workplace effects", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/22/2003862907", "fonte_id": "taipei_times", "data_pub": "2026-08-22T00:00:00Z", "idioma": "en", "provavel_duplicata_d nn_brasil", "data_pub": "2026-08-21T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto ofereceu 150 vagas para um curso gratuito focado em tecnologia, direcionado a jovens. Os alunos desenvolverão habilidades relevantes para o mercado de trabalho na área de programação.", "titulo_pt": "Instituto libera 150 vagas para curso gratuito de tecnologia para jovens", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 116010, "titulo": "ChatGPT, Grok e Google IA fazem ranking de melhores candidatos, e descumprem norma do TSE", "url": "https://www.jota.info/eleicoes/eleicoes-2026/chatgpt-grok-e-google-ia-fazem-ranking-de-melhores-candidatos-e-descumprem-norma-do-tse", "fonte_id": "jota", "data_pub": "2026-08-21T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "ChatGPT, Grok e Google IA avaliaram candidatos para a economia, classificando Ronaldo Caiado como o melhor, seguido por Zema, Renan, Lula e Flávio.", "titulo_pt": "Chatgpt, Grok e Google IA fazem ranking de melhores candidatos para a economia, descumprem norma do TSE", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 116403, "titulo": "Why is the DOJ investigating Andreessen Horowitz’s board seats?", "url": "https://techcrunch.com/video/why-is-the-doj-investigating-andreessen-horowitzs-board-seats/", "fonte_id": "techcrunch", "data_pub": "2026-08-21T16:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Advocacia-Geral dos Estados Unidos está investigando a Associação Andreessen Horowitz devido a dois de seus sócios que agora ocupam posições de conselho em empresas concorrentes: Ben Horowitz na Databricks e Martin Casado na Fivetran. A investigação se baseia em uma lei antitruste de 112 anos que é raramente aplicada contra investidores-anjo.", "titulo_pt": "Por que a agu está investigando a Andreessen Horowitz sobre suas cadeiras no conselho?", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 116413, "titulo": "Microsoft and Discord subpoenaed over GTA VI gameplay leaks", "url": "https://www.theverge.com/games/983323/grand-theft-auto-vi-gta-leaks-microsoft-discord-subpoenaed", "fonte_id": "the_verge", "data_pub": "2026-08-21T16:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Take-Two Interactive solicitou documentos a Microsoft e Discord após vazamentos aparentes de gameplay de Grand Theft Auto VI. A empresa busca identificar os responsáveis por infringir seus direitos autorais, que incluem conteúdo audiovisual, arte, imagens e diálogos.", "titulo_pt": "Take-two interactive requisita documentos a microsoft e Discord sobre vazamentos de GTA VI", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 116404, "titulo": "US government lab is probing Chinese lidar for security vulnerabilities", "url": "https://techcrunch.com/2026/08/21/us-government-lab-is-probing-chinese-lidar-for-security-vulnerabilities/", "fonte_id": "techcrunch", "data_pub": "2026-08-21T16:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Idaho National Laboratory está realizando uma revisão de segurança em sistemas lidar chineses. A pesquisa está sendo financiada por uma empresa ou grupo de empresas do setor de veículos elétricos e autônomos.", "titulo_pt": "Lab dos EUA investiga sistemas lidar chineses em busca de vulnerabilidades de segurança", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 116013, "titulo": "IA não elimina empregos; decisões humanas que impactam no trabalho", "url": "https://www.jota.info/coberturas-especiais/ia-nao-elimina-empregos-decisoes-humanas-que-impactam-no-trabalho", "fonte_id": "jota", "data_pub": "2026-08-21T15:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marina Garrote do Reglab afirma que a atribuição de demissões apenas à inteligência artificial é uma simplificação que ignora decisões empresariais, econômicas e regulatórias.", "titulo_pt": "IA não é responsável pelas demissões; são decisões humanas que impactam o trabalho", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 116411, "titulo": "Meta’s Big Reckoning Is Here", "url": "https://www.wired.com/story/metas-big-reckoning-is-here/", "fonte_id": "wired", "data_pub": "2026-08-21T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta está novamente em tribunal em relação à segurança de crianças, e desta vez é um caso de grande importância que pode exigir mudanças significativas em recursos fundamentais do Facebook e do Instagram.", "titulo_pt": "Meta enfrenta grande desafio legal em relação à segurança de crianças", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 116405, "titulo": "Oura faces lawsuit accusing it of misleading consumers about sleep-tracking accuracy", "url": "https://techcrunch.com/2026/08/21/oura-faces-lawsuit-accusing-it-of-misleading-consumers-about-sleep-tracking-accuracy/", "fonte_id": "techcrunch", "data_pub": "2026-08-21T14:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Oura enfrenta uma ação judicial que acusa a empresa de enganar os consumidores sobre a precisão da medição do sono pelos seus anéis. A ação afirma que os anéis Oura não conseguem medir nenhum dos sinais fisiológicos necessários para avaliar a qualidade do sono ou determinar os estágios do sono.", "titulo_pt": "Oura enfrenta ação judicial por supostamente enganar consumidores sobre a precisão da medição do sono", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 116388, "titulo": "Tesla forced to recall record 3 million cars in China over door-handle issue", "url": "https://www.scmp.com/business/china-evs/article/3364887/tesla-forced-recall-record-3-million-cars-china-over-door-handle-issue?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-21T14:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Tesla está realizando a maior recall de produtos já registrada no mercado de veículos elétricos da China, afetando quase 3 milhões de carros para corrigir um problema com os travessões das portas. A ação de recall ocorre enquanto reguladores chineses buscam proibir os travessões de porta retráteis devido a preocupações com a segurança, após um incidente fatal no qual um motorista ficou preso em um veículo em chamas, impossibilitando que outras pessoas o resgatassem.", "titulo_pt": "Tesla realiza recall recorde de 3 milhões de carros no China por problema em travessões de porta", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 116476, "titulo": "Gravis Robotics bags $200M, a safer marketplace for teen odd jobs, and Monzo chairman Gary Hoffman to stand down", "url": "https://tech.eu/2026/08/21/gravis-robotics-bags-200m-a-safer-marketplace-for-teen-odd-jobs-and-monzo-chairman-gary-hoffman-to-stand-down/", "fonte_id": "tech_eu", "data_pub": "2026-08-21T14:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Gravis Robotics recebeu financiamento no valor de $200 milhões. O ex-diretor executivo de Monzo, Gary Hoffman, deixará o cargo. A tech e EU relatou mais de 45 transações de financiamento de tecnologia e mais de 5 saídas, negócios e notícias relacionadas na Europa esta semana.", "titulo_pt": "Gravis Robotics conquista financiamento de $200 milhões e Gary Hoffman deixa cargo no Monzo", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 116451, "titulo": "Stop Hunting, Start Solving: Accelerating Root Cause Analysis with Agentic AI", "url": "https://event.on24.com/wcc/r/5460332/DAFEFF7A68EE900DEA7A14356089B553?utm_source=IEEE&utm_medium=site&utm_campaign=922", "fonte_id": "ieee_spectrum", "data_pub": "2026-08-21T14:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A webinar discute como transformar variações de rendimento em análise mais rápida e confiável da causa raiz. Ela explora como uma plataforma de análise semicondutora especializada pode ajudar engenheiros uring oil spills", "url": "https://phys.org/news/2026-08-autonomous-ship-liability-unclear-oil.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Se um navio-pipa operado remotamente causar uma derramamento de óleo, o proprietário do navio é responsável por indenizar as vítimas de acordo com regras internacionais existentes. No entanto, ainda não está claro se a pessoa que controla o navio da costa também pode ser processada diretamente por negligência.", "titulo_pt": "Responsabilidade de operadores de navios autônomos durante derramamentos de óleo permanece incerta", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 116424, "titulo": "Thunderquakes enable seismic imaging of Earth's shallow subsurface", "url": "https://phys.org/news/2026-08-thunderquakes-enable-seismic-imaging-earth.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos recentes mostram que ondas sísmicas geradas por tempestades, conhecidas como thunderquakes, podem ser usadas como uma nova fonte para a imageria sísmica do subsolo superficial da Terra.", "titulo_pt": "Thunderquakes permitem imagens sísmicas do subsolo superficial", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 116470, "titulo": "‘Thunderquakes’ do more than shake the ground — they map it", "url": "https://www.sciencenews.org/article/thunderquakes-shake-ground-map-it", "fonte_id": "science_news", "data_pub": "2026-08-21T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas utilizaram fibras ópticas para transformar os chamados 'thunderquakes' em mapas subterrâneos que podem revelar perigos ocultos sob as cidades.", "titulo_pt": "‘Thunderquakes’ mais do que sacudem a terra — eles a mapeiam", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 116472, "titulo": "TB 26-04 Updates and Modernization of NASA’s Chemical Equilibrium with Applications (CEA) Code", "url": "https://www.nasa.gov/centers-and-facilities/nesc/tb-26-04-updates-and-modernization-of-nasas-chemical-equilibrium-with-applications-cea-code/", "fonte_id": "nasa_news", "data_pub": "2026-08-21T17:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O código de equilíbrio químico com aplicações (CEA) da NASA é uma ferramenta fundamental para o análise de sistemas de propulsão. Ele fornece cálculos de equilíbrio químico, desempenho do foguete, choque e detonação utilizados na NASA e na comunidade aeroespacial mais ampla. Atualizações e modernizações do CEA estão sendo realizadas pelo Centro Glenn de Pesquisas Espaciais.", "titulo_pt": "Atualizações e modernização do código de equilíbrio químico com aplicações (CEA) da NASA", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 116425, "titulo": "Shipwrecks from WWI and WWII are polluting the North Sea", "url": "https://phys.org/news/2026-08-shipwrecks-wwi-wwii-polluting-north.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Navios afundados da Primeira e Segunda Guerra Mundial estão poluindo o Mar do Norte. Em abril de 1917, a submarina UC-30 da Alemanha, que havia sofrido problemas de motor, foi para casa após uma missão na Irlanda.", "titulo_pt": "Navios afundados da primeira e segunda guerra mundial poluem o mar do norte", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 116426, "titulo": "Move over bears. Fat Marmot Week puts a spotlight on the alpine rodents", "url": "https://phys.org/news/2026-08-fat-marmot-week-spotlight-alpine.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A última winter foi difícil para os marmotes vivendo nas montanhas do Colorado, onde dois terços de uma população morreram durante o sono invernal devido à falta de cobertura de neve suficiente.", "titulo_pt": "Lado a lado com os ursos, a semana dos marmotes gordos destaca os roedores alpinos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 116473, "titulo": "Webb Opens Treasure Chest", "url": "https://www.nasa.gov/image-article/webb-opens-treasure-chest/", "fonte_id": "nasa_news", "data_pub": "2026-08-21T17:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Telescópio Espacial James Webb da NASA capturou uma imagem infravermelha em 6 de agosto de 2026 de uma parte da Nébula Carina, uma região de formação estelar que inclui os Penhascos Cósmicos. Esta região, conhecida como 'Cofre', é um globo cometeário, uma nuvem de gás e poeira isolada com uma densa.", "titulo_pt": "Webb abre cofre de tesouros", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 116467, "titulo": "Why tornadoes touched down near New York City", "url": "https://www.scientificamerican.com/article/why-tornadoes-touched-down-near-new-york-city/", "fonte_id": "scientific_american", "data_pub": "2026-08-21T17:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tufões não atingem frequentemente Nova York, mas podem ocorrer quando as condições climáticas são favoráveis.", "titulo_pt": "Por que tornados pousaram perto da cidade de nova York", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 115911, "titulo": "Teste de fezes caseiro reduz em até 43% mortes por câncer colorretal", "url": "https://www.metropoles.com/saude/teste-de-fezes-caseiro-reduz-em-ate-43-mortes-por-cancer-colorretal", "fonte_id": "metropoles", "data_pub": "2026-08-21T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo com 376 mil pessoas mostrou que um teste de fezes caseiro pode identificar sinais precoces de câncer colorretal e reduzir em até 43% as mortes ao longo de até 14 anos.", "titulo_pt": "Teste de fezes caseiro reduz até 43% mortes por câncer colorretal", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 115840, "titulo": "Climatério, perimenopausa e menopausa: a diferença que confunde tanta gente", "url": "https://www.cnnbrasil.com.br/saude/climaterio-perimenopausa-e-menopausa-a-diferenca-que-confunde-tanta-gente/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A perimenopausa, climatério e menopausa são fases da transição hormonal feminina que podem durar vários anos e afetar diversos aspectos da saúde, incluindo sono, humor, ossos, coração, sexualidade e saúde bucal.", "titulo_pt": "Climatério, perimenopausa e menopausa: a diferença que confunde tanta gente", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 116474, "titulo": "NASA’s Artemis II Crew Set to Receive Congressional Space Medal of Honor", "url": "https://www.nasa.gov/news-release/nasas-artemis-ii-crew-set-to-receive-congressional-space-medal-of-honor/", "fonte_id": "nasa_news", "data_pub": "2026-08-21T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Donald J. Trump vai conceder a Medalha Espacial Congresional a cada membro da tripulação da missão Artemis II da NASA, incluindo os astronautas Reid Wiseman, Victor Glover, Christina Koch e o astronauta canadense Jeremy Hansen, durante uma cerimônia no Centro Espacial Johnson em Houston às 11h de 28 de agosto.", "titulo_pt": "Tripulantes da missão Artemis II da nasa receberão medalha espacial congresional", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 115915, "titulo": "Cientistas datam, pela 1ª vez, sinais de vida de 3,5 bilhões de anos", "url": "https://www.metropoles.com/ciencia/cientistas-datam-pela-1a-vez-sinais-de-vida-de-35-bilhoes-de-anos", "fonte_id": "metropoles", "data_pub": "2026-08-21T16:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas identificaram sinais de vida de 3,5 bilhões de anos em rochas da Índia. A análise revelou carbono
