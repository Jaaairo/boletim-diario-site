veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 107941, "titulo": "PAHO launches toolkit to prevent bullying and cyberbullying among children and adolescents in the Americas", "url": "https://www.paho.org/en/news/17-8-2026-paho-launches-toolkit-prevent-bullying-and-cyberbullying-among-children-and", "fonte_id": "paho", "data_pub": "2026-08-17T14:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PAHO lançou uma ferramenta para prevenir bullying e cyberbullying entre crianças e adolescentes nas Américas. O objetivo é fornecer recursos para combater esses problemas.", "titulo_pt": "PAHO lança ferramenta para prevenir bullying e cyberbullying entre crianças e adolescentes nas américas", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 106961, "titulo": "Anxious Chinese mothers turn to pricey ‘parent awakening camps’ for academic help", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3364207/anxious-chinese-mothers-turn-pricey-parent-awakening-camps-academic-help?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-17T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Camps de 'awakening' familiares, controversos, estão atraídos mães chinesas ansiosas dispostas a investir significativamente em programas que buscam combater a adição a jogos e desempenho acadêmico ruim. Estes programas, promovidos por serviços de educação familiar na mídia social da China, prometem transformar práticas de educação parental e melhorar as relações familiares.", "titulo_pt": "Mães ansiosas chinesas recorrem a caros campings de 'awakening' familiar para ajudar no desempenho acadêmico", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 106543, "titulo": "Operação no Rio mira CV por sessões de tortura contra motoboys", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/operacao-no-rio-mira-cv-por-sessoes-de-tortura-contra-motoboys", "fonte_id": "metropoles", "data_pub": "2026-08-17T09:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A operação policial no Rio de Janeiro alvo do bairro CV investiga sessões de tortura contra motoboys. Segundo as investigações, criminosos ameaçavam moradores da região sob a alegação de possíveis ligações com facções rivais.", "titulo_pt": "Operação no Rio mira CV por sessões de tortura contra motoboys", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 106544, "titulo": "Sargento da PMDF é morto a tiros por advogado durante discussão", "url": "https://www.metropoles.com/distrito-federal/na-mira/sargento-da-pmdf-e-morto-a-tiros-por-advogado-durante-discussao", "fonte_id": "metropoles", "data_pub": "2026-08-17T09:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um sargento da PMDF foi morto a tiros por um advogado durante uma discussão no Lago Corumbá, em Santo Antônio do Descoberto (GO). A Polícia Militar de Goiás prendeu o advogado, que é um Comandante de Área de Cidades (CAC), e apreendeu a arma dele.", "titulo_pt": "Sargento da PMDF é morto a tiros por advogado durante discussão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 106620, "titulo": "Más de 700 personas dieron positivo en alcoholemia: las infracciones más cometidas y el caso mendocino", "url": "https://www.lanacion.com.ar/autos/mas-de-700-personas-dieron-positivo-en-alcoholemia-las-infracciones-mas-cometidas-y-el-caso-nid17082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-17T09:19:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Agência Nacional de Segurança Vial (ANSV) intensificou os controles de trânsito no inverno e identificou mais de 10.000 condutores infratorses em todo o país. Mais de 700 pessoas testaram positivo para alcoolemia.", "titulo_pt": "Mais de 700 pessoas testaram positivo para alcoolemia: as infrações mais cometidas e o caso mendocino", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 106934, "titulo": "60% in Japan give up activities due to sweat, survey finds", "url": "https://www.japantimes.co.jp/news/2026/08/17/japan/science-health/sweat-survey-japan-summer/", "fonte_id": "japan_times", "data_pub": "2026-08-17T09:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um levantamento japonês revelou que 60% das pessoas no país deixaram de realizar atividades devido ao suor intenso. Os participantes relataram ter modificado suas atividades preferidas, evitando o contato físico e optando por roupas diferentes.", "titulo_pt": "60% No Japão abandonam atividades devido ao suor, pesquisa mostra", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 107581, "titulo": "Sistema frontal mantiene en alerta al norte y Tocopilla concentra principales afectaciones", "url": "https://www.latercera.com/videos/noticia/sistema-frontal-mantiene-en-alerta-al-norte-y-tocopilla-concentra-principales-afectaciones/", "fonte_id": "la_tercera", "data_pub": "2026-08-17T17:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O sistema frontal manteve o norte do Chile em alerta, com Tocopilla sendo a localidade que registrou as principais afetações. Duas alertas do Sistema de Alerta de Emergência (SAE) foram ativadas, levando a evacuações em diferentes áreas da comuna devido à ativação de quebradas.", "titulo_pt": "Sistema frontal mantém norte em alerta e Tocopilla concentra principais afetações", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 107959, "titulo": "Analysis: The two largest reservoirs in the US have hit record-low levels", "url": "https://www.carbonbrief.org/analysis-the-two-largest-reservoirs-in-the-us-have-hit-record-low-levels", "fonte_id": "carbon_brief", "data_pub": "2026-08-17T16:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O segundo maior reservatório dos Estados Unidos atingiu seu nível de água mais baixo registrado no sábado, apenas alguns dias após o maior reservatório do país alcançar um nível recorde baixo.", "titulo_pt": "Análise: os dois maiores reservatórios dos EUA atingiram níveis históricos baixos", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 107501, "titulo": "European farmers face ‘unprecedented crisis’ after successive heatwaves", "url": "https://www.theguardian.com/environment/2026/aug/17/european-farmers-unprecedented-crisis-successive-heatwaves", "fonte_id": "guardian_world", "data_pub": "2026-08-17T16:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Agricultores europeus estão enfrentando uma crise sem precedentes devido a sucessivas ondas de calor intensas e uma seca continental severa. Produções de legumes e grãos estão em queda significativa, com previsões de colheitas catastróficas.", "titulo_pt": "Agricultores europeus enfrentam crise sem precedentes após ondas de calor sucessivas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 107960, "titulo": "Why land-use emissions have fallen by a third this century – in six charts", "url": "https://www.carbonbrief.org/why-land-use-emissions-have-fallen-by-a-third-this-century-in-six-charts", "fonte_id": "carbon_brief", "data_pub": "2026-08-17T12:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As emissões relacionadas ao uso do solo, incluindo desmatamento, perda de pântanos e degradação florestal, têm diminuído ao longo do século. Essa redução é ilustrada em seis gráficos.", "titulo_pt": "Por que as emissões de uso do solo caíram em um terço neste século – em seis gráficos", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 106618, "titulo": "Preservar el agua", "url": "https://www.lanacion.com.ar/opinion/preservar-el-agua-nid17082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-17T09:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O água é um recurso vital que necessita ser cuidado.", "titulo_pt": "Preservar a água", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 107664, "titulo": "How wildfires are changing the U.S. electric grid", "url": "https://www.axios.com/2026/08/17/wildfires-electric-grid-planning-energy-infrastructure", "fonte_id": "axios", "data_pub": "2026-08-17T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anos de incêndios destrutivos estão forçando as empresas de energia a priorizar a resistência a incêndios em seus planos para a próxima geração da rede elétrica dos Estados Unidos. O projeto atual da rede está ocorrendo em um momento em que o risco de incêndios florestais se torna um desafio definidor para as empresas de energia.", "titulo_pt": "Como os incêndios florestais estão mudando a rede elétrica dos EUA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 106519, "titulo": "Etanol e biometano avançam no transporte de cargas no Brasil", "url": "https://www.cnnbrasil.com.br/agro/etanol-e-biometano-avancam-no-transporte-de-cargas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-17T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O etanol e o biometano estão ganhando espaço no transporte de cargas no Brasil, oferecendo novas opções para reduzir a emissão de gases de efeito estufa em setores difíceis de eletrificar.", "titulo_pt": "Etanol e biometano avançam no transporte de cargas no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 106844, "titulo": "Belgium races to tame huge wildfire 'spreading towards Germany'", "url": "http://www.euronews.com/video/2026/08/17/belgium-races-to-tame-huge-wildfire-spreading-towards-germany", "fonte_id": "euronews", "data_pub": "2026-08-17T07:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Combustionistas lutam contra as chamas avançantes na Bélgica oriental, onde o fumo denso e a topografia difícil dificultam o controle do incêndio. O fogo está se aproximando da Alemanha.", "titulo_pt": "Bélgica corre contra o grande incêndio 'que se aproxima da Alemanha'", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 106846, "titulo": "Thousands in Indonesia await aid after quake kills 53, overshadowing Independence Day", "url": "http://www.euronews.com/2026/08/17/thousands-in-indonesia-await-aid-after-quake-kills-53-overshadowing-independence-day", "fonte_id": "euronews", "data_pub": "2026-08-17T05:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas em Indonesia aguardam auxílio após terremoto que deixou 53 mortos, sobretudo durante o Dia da Independência. O Exército Indonésio informou que está transportando 13 toneladas de ajuda em dois aviões Hercules e um Boeing.", "titulo_pt": "Milhares aguardam ajuda após terremoto que matou 53 no dia da independência em Indonesia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 105959, "titulo": "Crown-of-thorns to be removed to protect park reefs", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/17/2003862633", "fonte_id": "taipei_times", "data_pub": "2026-08-17T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A coroa-de-espinhos será removida para proteger os recifes do parque.", "titulo_pt": "Coração-de-espinho será removido para proteger os recifes do parque", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 105965, "titulo": "Heat, water scarcity driving stranded-asset risks: report", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/17/2003862600", "fonte_id": "taipei_times", "data_pub": "2026-08-17T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma reportagem destaca que o aumento da temperatura e a escassez d'água estão aumentando os riscos associados a ativos estrategicamente localizados.", "titulo_pt": "Aquecimento e escassez d'água aumentam riscos de ativos estrategicamente localizados: relatório", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 107682, "titulo": "'Gender apartheid': How the Taliban have trampled women's rights for five years", "url": "https://www.lemonde.fr/en/summer-reads/article/2026/08/17/gender-apartheid-how-the-taliban-have-trampled-women-s-rights-for-five-years_6756597_183.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-17T16:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois de retornarem ao poder em 15 de agosto de 2021, os talibãs desmontaram as instituições, leis e serviços relacionados aos direitos das mulheres em poucos dias e removeram todas as mulheres do sistema judicial. Essa é a próxima parte das testemunhos coletados por nosso repórter em Cabul.", "titulo_pt": "Apartheid de gênero: como os talibãs pisotearam os direitos das mulheres há cinco anos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 107584, "titulo": "Canada Is Exploiting Migrant Agricultural Workers", "url": "https://foreignpolicy.com/2026/08/17/canada-caribbean-agriculture-mexico-migrant-farm-worker/", "fonte_id": "foreign_policy", "data_pub": "2026-08-17T15:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores agrícolas caribenhos relatam quartos infestados por roedores e chefes abusivos.", "titulo_pt": "Canadá está explorando trabalhadores agrícolas migrantes do caribe", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 107741, "titulo": "Rights group urges FIFA to block Infantino re-election bid over term limits", "url": "https://www.aljazeera.com/sports/2026/8/17/rights-group-urges-fifa-to-block-infantino-re-election-bid-over-term-limits?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-17T15:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma organização de direitos humanos pede ao presidente                 return `<div class="item" data-flag-url="${esc(n.url)}">

                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}

            </div>

  const drillHtml = arts.length

       <div class="drill-lista" id="${drillId}">

           return `<div class="item" data-flag-url="${esc(n.url)}">

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">

    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
