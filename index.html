<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "01/10/2026 07:19", "stats": {"noticias_novas": 680, "resumos_gerados": 240}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A campanha do presidente Lula está focada em mobilizar idosos e reduzir a abstenção, enquanto Flávio Bolsonaro busca atrair eleitores indecisos e de outros candidatos da direita, conforme informa a Folha de S.Paulo. O Tribunal Superior Eleitoral decidiu manter a publicação de posts sobre Flávio Bolsonaro e Nossa Senhora Aparecida, após reconsiderar a remoção de fake news que ligam o candidato a deuses religiosos. A campanha de Lula também planeja exibir uma peça eleitoral que usa reportagens que ligam Flávio Bolsonaro a milícias, enquanto a Globo realiza o último debate entre os candidatos à Presidência antes do primeiro turno. Além disso, a Fazenda investiga o site de apostas Blaze por práticas irregulares, e o STF pode precisar decidir sobre as investigações envolvendo Flávio Bolsonaro caso ele seja eleito presidente.", "mundo": "O ex-presidente dos Estados Unidos, Donald Trump, discutiu o caso de Jimmy Lai, um ativista de Hong Kong, com o líder chinês Xi Jinping durante uma reunião em Washington. Além disso, Israel investiga um incidente envolvendo um piloto ferido com um golpe de faca durante um voo da Flydubai que ia para Israel. A Coreia do Sul conquistou uma medalha de ouro no taekwondo poomsae durante a Asiad em Nagoya, Japão, em outubro de 2014. O presidente sul-coreano incentivou uma conversa com Pyongyang após as explosões na Desmilitarizada Zona. A Argentina busca atrair novos investidores estrangeiros para tentar evitar uma recessão no país. A União Árabe Emiratí investiga se o incidente envolvendo a companhia aérea Flydubai foi uma atividade terrorista.\n\nA Coreia do Sul espera avanços nas discussões de segurança com os Estados Unidos após anúncios de investimentos, conforme informou a agência Yonhap News. Em um contexto geopolítico mais amplo, o presidente sul-coreano, Lee Jae Myung, prometeu buscar medidas para reduzir as tensões militares com a Coreia do Norte. Além disso, o governo do Reino Unido rejeitou a ideia de envolvimento do Irã em um incidente envolvendo uma base aérea britânica, em resposta a uma acusação feita pelo primeiro-ministro britânico. Na Coreia do Sul, o 78º aniversário do Dia das Forças Armadas foi comemorado em Seul, com a exibição de armas avançadas. No Oriente Médio, o primeiro-ministro do Catar afirmou que Israel rejeitou uma proposta do Hamas para libertar prisioneiros civis em troca de um cessar-fogo limitado após os ataques de 7 de outubro. Na Ásia, o governo do Reino Unido anunciou cortes de 20% em altos oficiais durante um discurso sobre o 'Estado das Forças'. Autoridades de Israel realizaram uma visita de dois dias à Coreia do Sul, onde o chefe do Exército de Auto-defesa do Japão se reuniu com o chefe do Estado-Maior da Força Terrestre sul-coreana. No Iêmen, o exército iemenita afirmou ter realizado 468 operações contra os hutitas, resultando na morte e ferimento de centenas de membros da milícia. Na região do Báltico, o governo russo ameaçou usar armas nucleares se tentarem bloquear Kaliningrado, localizado entre Polônia e Lituânia, em resposta a uma possível tentativa de bloqueio por parte da OTAN.", "economia": "Os rendimentos das obrigações do Tesouro americano a 10 anos atingiram o nível mais alto desde 2002, levando a um deságio significativo no mercado de títulos globais. Este movimento desencadeou um ciclo vicioso de vendas, com investidores se desfazendo de suas posições de dívida. Em última análise, isso pode ter implicações significativas para a economia global. Por outro lado, as exportações da Coreia do Sul atingiram um recorde de US$120,9 bilhões em setembro, impulsionadas por uma forte demanda por chips, reforçando a economia sul-coreana. Além disso, o Brasil gerou quase 4,6 milhões de empregos formais para beneficiários do Bolsa Família desde janeiro de 2023, de acordo com um estudo da FGV, contribuindo para a recuperação econômica do país.", "tecnologia": "As tecnologias de inteligência artificial (IA) continuam ganhando destaque em diversos setores, com empresas e governos investindo em rebranding e desenvolvimento de novas aplicações. O Google lançou recentemente o modelo Gemini 4 Argon, buscando competir com concorrentes como a OpenAI e a Anthropic, em meio a debates sobre a segurança da IA. A China está acelerando o desenvolvimento de chips de computação de IA, com gigantes tecnológicos locais como Huawei e Alibaba entrando em produção em massa. As empresas também estão expandindo a capacidade de centros de dados, e a China se tornou o segundo maior mercado mundial. Além disso, a IA está se tornando cada vez mais presente em diversos aspectos da vida cotidiana, desde relógios inteligentes até sistemas de refrigeração para centros de dados de IA. No entanto, o rápido crescimento do setor tem levantado preocupações ambientais, com um estudo alertando para a possibilidade de as emissões de gases de efeito estufa da IA triplicarem até 2030.", "ciencia": "Um estudo recente comparou a atividade cerebral de cães e humanos em relação a diferentes sequências sonoras, mostrando que os cães aprendem palavras de maneira semelhante aos bebês humanos. Além disso, borboletas podem enganar seus predadores com ilusões ópticas, criando mecanismos defensivos durante o voo. Em outra notícia científica, a NASA anunciou novas investigações na Lua e a contratação de uma empresa para desenvolver comunicações 5G na superfície lunar. Na área espacial, a Galileo Space está desenvolvendo satélites que transformam sinais em respostas em órbita. Na Terra, o programa de fusão nuclear avançado da China entrou em uma nova fase de engenharia com a abertura oficial do campus do Tokamak Supercondutor de Plasma Experimental (BEST).", "cultura": "O escritor indiano Salman Rushdie, que foi gravemente ferido em um ataque brutal, está produzindo um documentário sobre o incidente e mantendo sua atividade literária. Em Buenos Aires, a exposição 'Mafalda inmersiva' celebra o universo criado por Quino, com realidade virtual e cenários em escala real. A Royal Shakespeare Company anunciou a adaptação de dois romances experimentais, de Susanna Clarke e Virginia Woolf, para a temporada que inclui as estreias de Elizabeth Debicki como Richard II e Damien Molony como Coriolanus. A atriz Anne Hathaway e Dakota Johnson protagonizam a adaptação do livro 'Verity' para o cinema, enquanto o grupo de K-pop BTS exibe sua coleção de arte no San Francisco Museum of Modern Art. A atriz Margarida Vila-Nova interpretará a vilã Carminha na versão portuguesa de 'Avenida Brasil', e o cinema Multiplex Playarte Marabá, localizado na avenida Ipiranga, em São Paulo, pode fechar as portes devido a um processo de despejo.", "sociedade": "Um membro do Comando Vermelho foi morto em um confronto com a Polícia Militar do Distrito Federal (PMDF) na GO-547, entre Águas Lindas de Goiás e Brazlândia. Durante o incidente, a Polícia apreendeu tabletes de maconha e uma pistola. Em outra notícia, a deputada Mayra Mendoza respondeu críticas por usar um pantalão do time Boca Juniors durante uma sessão na Legislatura bonaerense, argumentando que a crítica é injusta. A deputada afirmou que se orgulha de sua identidade de 'kuka' e que 'negra' também não a ofende. O governo de Hong Kong planeja introduzir cuidadores estrangeiros qualificados para auxiliar na assistência aos idosos, visando antecipar-se ao desafio demográfico da cidade envelhecida. Além disso, o Ministério da Saúde do Brasil está considerando a implementação de licença parental para agricultores, enquanto a PAHO e MSD for Mothers assinaram um acordo para reduzir as mortes maternas evitáveis na Guatemala e na República Dominicana. Um novo plano de segurança alimentar foi lançado com o objetivo de reduzir a carga de doenças transmitidas por alimentos que afetam 43 milhões de pessoas nas Américas.", "meio_ambiente": "Em outubro, o Brasil enfrenta temperaturas elevadas no Nordeste, com registros de 40°C, enquanto o Sudeste experimenta temporais. No nível global, a Suíça registra uma rápida perda de gelo nos seus glaciares. O Glacier Rhône perdeu 5,5% de sua geleira nos primeiros oito meses de 2026, após um verão marcado por ondas de calor extremas. De acordo com a pesquisa, a Suíça perdeu 20% de suas geleiras em apenas cinco anos, devido ao efeito do calor das emissões de poluentes de combustíveis fósseis. Além disso, o calor armazenado nos oceanos atingiu um recorde em 2025, com evidências de aquecimento acelerado, aumento do nível do mar e diminuição do gelo polar. A mudança climática está pressionando os preços dos alimentos e ameaçando a inflação no Brasil, com ondas de calor, secas e chuvas extremas reduzindo as safras. Além disso, a população de jumentos no Brasil diminuiu 94%, e cientistas estão se mobilizando para denunciar os impactos do comércio de peles e defender medidas de proteção.", "direitos_humanos": "A Suprema Corte dos Estados Unidos confirmou a execução de Christa Pike, uma mulher condenada a morte há 31 anos, após várias disputas judiciais. Pike foi sentenciada em 1996 por assassinar uma colega de escola em Knoxville, Tennessee. O caso levanta questões sobre a justiça e a aplicação da pena de morte. Paralelamente, o governo francês reconheceu oficialmente como crime contra a humanidade a operação nazista e do regime colaboracionista Vichy que afetou 20 mil moradores do Velho Port de Marselha em 1943, após uma investigação de sete anos. O reconhecimento visa compensar e reconciliar as vítimas, marcando um passo importante na luta pelos direitos humanos na Europa."}, "resumo_do_dia": {"politica_nacional": [{"id": 188357, "titulo": "Candidato a deputado é alvo da PF por financiamento irregular de campanha", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/candidato-a-deputado-e-alvo-da-pf-por-financiamento-irregular-de-campanha", "fonte_id": "metropoles", "data_pub": "2026-10-01T09:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fábio Tyrone, ex-prefeito de Sousa (PB) e candidato a deputado, foi alvo de uma operação da Polícia Federal acusado de financiamento irregular de campanha.", "titulo_pt": "Candidato a deputado é alvo da PF por financiamento irregular de campanha", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 188468, "titulo": "Como votam evangélicos e católicos nesta eleição?", "url": "https://www.bbc.com/portuguese/articles/cmx2z70jq94wo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-01T08:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A preferência dos evangélicos e católicos pelos candidatos Lula e Flávio Bolsonaro segue uma tendência observada em 2022, mas com diferenças significativas. Pesquisas indicam que fatores como a economia e a segurança pública podem ser decisivos no final da campanha.", "titulo_pt": "Como votam evangélicos e católicos nesta eleição?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 188515, "titulo": "A democracia se perde cidade a cidade", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-democracia-se-perde-cidade-a-cidade", "fonte_id": "jota", "data_pub": "2026-10-01T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Prisões de políticos no Rio de Janeiro e no Ceará demonstram que o crime organizado está disputando mandatos no Brasil.", "titulo_pt": "A democracia se perde cidade a cidade", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 188516, "titulo": "Emendas parlamentares: participação democrática, controle e responsabilidade", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-fiscal/emendas-parlamentares-participacao-democratica-controle-e-responsabilidade", "fonte_id": "jota", "data_pub": "2026-10-01T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desafio não é diminuir o papel do Legislativo, mas tornar as emendas parlamentares rastreáveis e controladas de forma proporcional.", "titulo_pt": "Emendas parlamentares: participação democrática, controle e responsabilidade", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 188371, "titulo": "Campanha de Lula prevê vantagem sobre Flávio, mas evita clima de já ganhou", "url": "https://www.metropoles.com/colunas/igor-gadelha/campanha-de-lula-preve-vantagem-sobre-flavio-mas-evita-clima-de-ja-ganhou", "fonte_id": "metropoles", "data_pub": "2026-10-01T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Lula considera que o candidato se recuperou nos últimos dias, mas espera uma disputa difícil e evita fazer comemorações prematuras.", "titulo_pt": "Campanha de Lula vê recuperação, mas evita comemoração antecipada", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 188517, "titulo": "Um Legislativo que se pareça com o Brasil", "url": "https://www.jota.info/opiniao-e-analise/artigos/um-legislativo-que-se-pareca-com-o-brasil", "fonte_id": "jota", "data_pub": "2026-10-01T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A desigualdade de gênero na política brasileira afeta a legitimidade das instituições.", "titulo_pt": "Um Legislativo que se pareça com o Brasil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 188518, "titulo": "Segredo de empresa e sigilo processual", "url": "https://www.jota.info/opiniao-e-analise/colunas/constituicao-empresa-e-mercado/segredo-de-empresa-e-sigilo-processual", "fonte_id": "jota", "data_pub": "2026-10-01T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto questiona como conciliar a proteção de segredos comerciais com o direito à apresentação de provas e ao contraditório, bem como com a efetividade do processo judicial.", "titulo_pt": "Segredo empresarial e sigilo processual", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 188373, "titulo": "De sobrenome Haddad, primo de Maluf herdou nome de ex-governador nas urnas", "url": "https://www.metropoles.com/colunas/ramiro-brites/primo-maluf-urnas", "fonte_id": "metropoles", "data_pub": "2026-10-01T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Albertinho Maluf, candidato à Alesp, herdou o nome político do primo, que é ex-governador, nas eleições. Maluf não tem o sobrenome do primo no cartório, mas o chama de tio e considera-se seu herdeiro político.", "titulo_pt": "Primo de Maluf herda nome político nas urnas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 188321, "titulo": "'Tanto Lula quanto Flávio Bolsonaro geram pouco entusiasmo', diz brasilianista", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/tanto-lula-quanto-flavio-bolsonaro-geram-pouco-entusiasmo-diz-brasilianista.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-01T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cientista política norte-americana Wendy Hunter, da Universidade do Texas, afirma que a disputa eleitoral envolvendo Lula e Flávio Bolsonaro tem 'os dois lados apagados'.", "titulo_pt": "Lula e Flávio Bolsonaro geram pouco entusiasmo, diz especialista", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 188322, "titulo": "Gilmar chama Kassio de 'imperador', e ministros veem risco de Dino afastar presidente do TSE de ações", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/gilmar-chama-kassio-de-imperador-e-ministros-veem-risco-de-dino-afastar-presidente-do-tse-de-acoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-01T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ministros do STF, incluindo aliados e rivais de Flávio Dino, avaliam a possibilidade de determinarem o afastamento de Kassio Nunes Marques e André Mendonça da relatoria de ações sobre propaganda no TSE, o que poderia intensificar a divisão interna entre as cortes.", "titulo_pt": "Gilmar chama Kassio de 'imperador', e ministros veem risco de Dino afastar presidentes do TSE de ações", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 188323, "titulo": "Após cassações e prisões, 'petistas raiz' voltam ao jogo eleitoral em busca de vaga na Câmara", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/apos-cassacoes-e-prisoes-petistas-raiz-voltam-ao-jogo-eleitoral-em-busca-de-vaga-na-camara.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-01T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nomes envolvidos em casos como mensalão e Lava Jato, e que têm ligação histórica com o PT, estão retornando ao cenário eleitoral de 2026 com candidaturas à Câmara dos Deputados, mesmo sem a influência que tinham anteriormente.", "titulo_pt": "Petistas envolvidos em escândalos e históricos voltam ao jogo eleitoral em 2026", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 188335, "titulo": "Surpreendidas, associações pedem que governo adie veto à compra de pré-precatórios por fundos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/surpreendidas-associacoes-pedem-que-governo-adie-veto-a-compra-de-pre-precatorios-por-fundos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A mais recente norma do CMN proibiu que fundos de investimento em direitos creditórios adquiram direitos creditórios não julgados, como os pré-precatórios. Essa regra entra em vigor em 13 de outubro.", "titulo_pt": "Associações pedem adiamento do veto à compra de pré-precatórios por fundos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 188420, "titulo": "Quem são os candidatos a deputado federal por São Paulo?", "url": "https://exame.com/brasil/quem-sao-os-candidatos-a-deputado-federal-por-sao-paulo/", "fonte_id": "exame", "data_pub": "2026-10-01T04:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lista completa de 1.132 candidatos concorre às 70 vagas de deputado federal por São Paulo na Câmara dos Deputados nas eleições de 2026.", "titulo_pt": "Quem São os candidatos a deputado federal por São Paulo?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 187261, "titulo": "Gilmar cita precatórios e risco de R$ 24 bi ao SUS e cobra STJ e STF sobre ações de hospitais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/gilmar-cita-precatorios-e-risco-de-r-24-bi-ao-sus-e-cobra-stj-e-stf-sobre-acoes-de-hospitais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T02:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes acionou os presidentes do STF e do STJ para discutir ações judiciais envolvendo hospitais e a questão dos precatórios no setor de saúde, citando o risco financeiro de R$ 24 bilhões para o SUS.", "titulo_pt": "Gilmar cita precatórios e risco de R$ 24 bi ao SUS e cobra STJ e STF sobre ações de hospitais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 187497, "titulo": "Lula, Cury e Caiado assinam carta de compromisso contra o trabalho escravo", "url": "https://www.cnnbrasil.com.br/eleicoes/lula-cury-e-caiado-assinam-carta-de-compromisso-contra-o-trabalho-escravo/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T02:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula, Cury e Caiado assinaram uma carta de compromisso contra o trabalho escravo, enquanto Flávio, Renan e Zema não foram incluídos como signatários. A Conatrae vem apresentando esse documento a candidatos desde 2003.", "titulo_pt": "Lula, Cury e Caiado assinam carta de compromisso contra o trabalho escravo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 187314, "titulo": "Após Mendonça mudar voto, TSE decide liberar post de humorista sobre Nossa Senhora Aparecida", "url": "https://g1.globo.com/politica/noticia/2026/09/30/apos-mendonca-mudar-voto-tse-decide-liberar-post-de-humorista-sobre-nossa-senhora-aparecida.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-01T02:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça, do Tribunal Superior Eleitoral, alterou seu voto e decidiu liberar a publicação do humorista Antonio Tabet sobre Nossa Senhora Aparecida. Todos os ministros seguiram o novo voto de Mendonça.", "titulo_pt": "Após Mendonça mudar voto, TSE libera post de humorista sobre Nossa Senhora Aparecida", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 188880, "titulo": "(2nd LD) (Asiad) S. Korea's Jung Ha-eun wins gold in taekwondo poomsae", "url": "https://en.yna.co.kr/view/AEN20261001011452320", "fonte_id": "yonhap_news", "data_pub": "2026-10-01T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jung Ha-eun, da Coreia do Sul, venceu a medalha de ouro no taekwondo poomsae durante a Asiad em Nagoya, Japão, em outubro de 2014.", "titulo_pt": "Coreia do sul vence medalha de ouro em taekwondo poomsae", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 188795, "titulo": "Japan and Germany sign evacuation cooperation memorandum", "url": "https://www.japantimes.co.jp/news/2026/10/01/japan/japan-germany-evacuation-memorandum/", "fonte_id": "japan_times", "data_pub": "2026-10-01T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2024, o Japão estabeleceu acordos de evacuação com South Korea, Australia, Canada, Britain e Brazil. A Alemanha se tornou o sexto país a assinar um memorando de cooperação em evacuação com o Japão.", "titulo_pt": "Japão e Alemanha assinam memorando de cooperação em evacuação", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 188796, "titulo": "Ex-GSDF member admits trespassing at Chinese embassy in Tokyo", "url": "https://www.japantimes.co.jp/news/2026/10/01/japan/crime-legal/gsdf-member-china-embassy/", "fonte_id": "japan_times", "data_pub": "2026-10-01T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kodai Murata, de 24 anos, admitiu ter invadido o terreno do embaixado chinês em Tóquio com uma faca de cozinha de 18 centímetros de lâmina em 24 de março.", "titulo_pt": "Ex-membro da gsdf confessa invasão ao embaixado chinês em tóquio", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 188320, "titulo": "Flávio promete a entidade judaica visitar Israel logo no início de eventual governo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/flavio-promete-a-entidade-judaica-visitar-israel-logo-no-inicio-de-eventual-governo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-01T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato a presidente Flávio Bolsonaro (PL) prometeu visitar Israel logo no início de um eventual governo, seguindo o exemplo do seu pai, Jair Bolsonaro, em 2019.", "titulo_pt": "Flávio promete visitar Israel logo no início de eventual governo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 188574, "titulo": "‘It’s utter surrealism’: Venezuela’s Chavistas lament government’s embrace of Trump", "url": "https://www.theguardian.com/world/2026/oct/01/venezuela-hugo-chavez-supporters-critical-delcy-rodriguez-embrace-of-trump", "fonte_id": "guardian_world", "data_pub": "2026-10-01T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Diehard Hugo Chávez apoiadores têm dificuldade em compreender a mudança ideológica sendo realizada pela administração interina de Delcy Rodríguez. Mario Silva, um dos mais entusiastas propagandistas da revolução bolivariana, frequentemente apresentava seu programa com uma foto de Chávez atrás dele e até mesmo tatuou a assinatura do líder na própria mão.", "titulo_pt": "É surrealismo total: apoiadores de chávez lutam para entender a mudança ideológica do governo", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 188674, "titulo": "Chess legend Kasparov says he is an assassination target after US uncovers alleged Russian plot", "url": "https://www.lemonde.fr/en/international/article/2026/10/01/chess-legend-kasparov-says-he-is-an-assassination-target-after-us-uncovers-alleged-russian-plot_6758133_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-01T08:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kasparov, ex-campeão mundial de xadrez e oponente político russo, declarou que é alvo de uma tentativa de assassinato após os Estados Unidos acusarem cinco supostos agentes de inteligência russos de planejar o assassinato de uma 'dissidente russa proeminente' que reside nos Estados Unidos.", "titulo_pt": "Kasparov afirma ser alvo de tentativa de assassinato após acusações russas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 188800, "titulo": "Ground Self-Defense Force chief makes first visit to South Korea in 17 years", "url": "https://www.japantimes.co.jp/news/2026/10/01/japan/japan-gsdf-chief-south-korea/", "fonte_id": "japan_times", "data_pub": "2026-10-01T08:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe do Exército de Auto-defesa do Japão, General Masayoshi Arai, realizou uma visita de dois dias à Coreia do Sul, onde se reuniu com o chefe do Estado-Maior da Força Terrestre sul-coreana, Kim Gyu-ha.", "titulo_pt": "Chefe do exército de auto-defesa do Japão faz primeira visita à Coreia do sul em 17 anos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 188924, "titulo": "STAT+: In Shanghai’s ‘Science City,’ China’s ascendant biotechs make their pitch to the world", "url": "https://www.statnews.com/2026/10/01/china-biotech-boom-jefferies-conference-shanghai/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-01T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pequena conferência com ambiciosos objetivos reflete o rápido crescimento da biotecnologia chinesa, levantando comparações com um encontro de biotecnologia dos Estados Unidos conhecido por seus acordos de negócios.", "titulo_pt": "Na 'cidade da ciência' de Shanghai, biotecnológicas chinesas buscam atenção internacional", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 188747, "titulo": "The battle for Kordofan: The corridor linking Sudan’s east and west", "url": "https://www.aljazeera.com/news/2026/10/1/the-battle-for-kordofan-the-corridor-linking-sudans-east-and-west?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-01T08:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kordofan, localizado entre Darfur e o centro do Sudão, registrou um quinto das ataques documentados na guerra no Sudão desde abril de 2023.", "titulo_pt": "A batalha por Kordofan: o corredor que liga o leste ao oeste do sudão", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 188671, "titulo": "From one summit to the next, China shapes a world favorable to its rise", "url": "https://www.lemonde.fr/en/opinion/article/2026/10/01/from-one-summit-to-the-next-china-shapes-a-world-favorable-to-its-rise_6758132_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-01T08:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Presidências de Xi Jinping em reuniões internacionais podem parecer não trazer resultados concretos, mas Beijing busca apoio geral e vago de diversos países para reforçar seu papel central na cena mundial.", "titulo_pt": "De um pico para o outro, a China modela um mundo favorável ao seu renascimento", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 188725, "titulo": "UAE investigates if Flydubai attack was ‘terrorist activity’", "url": "https://www.ft.com/content/8ead762e-88a0-4227-80b5-7aa605caf6ea?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-01T08:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Árabe Emiratí investiga se o incidente envolvendo a companhia aérea Flydubai foi uma atividade terrorista. Israel também está participando da investigação sobre o voo entre Dubai e Tel Aviv.", "titulo_pt": "UAE investiga se incidente com Flydubai foi atividade terrorista, com participação de israel", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 188807, "titulo": "What’s in a name? A Taiwan towel stirs Asian Games controversy", "url": "https://www.japantimes.co.jp/news/2026/10/01/japan/society/taiwan-towel-asian-games/", "fonte_id": "japan_times", "data_pub": "2026-10-01T07:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A intervenção foi além da proibição de exibir as bandeiras oficiais de países não participantes, como a Taiwan, durante os Jogos Asiáticos.", "titulo_pt": "O que importa no nome? Um pano da Taiwan causa controvérsia nos jogos asiáticos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 188372, "titulo": "Ataque do Paquistão ao Afeganistão deixa 22 mortos", "url": "https://www.metropoles.com/mundo/ataque-do-paquistao-ao-afeganistao-deixa-22-mortos", "fonte_id": "metropoles", "data_pub": "2026-10-01T07:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ataque do Paquistão ao Afeganistão resultou em 22 mortes. O Paquistão afirma que todos os mortos são terroristas, enquanto o Afeganistão afirma que nove civis foram mortos.", "titulo_pt": "Ataque do Paquistão ao Afeganistão deixa 22 mortos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 188576, "titulo": "Australian couple on plane diverted after flydubai pilot’s alleged attack on co-pilot", "url": "https://www.theguardian.com/world/2026/oct/01/australian-couple-on-flydubai-plane-to-israel-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-10-01T07:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um casal de Sydney estava a bordo de um voo para Tel Aviv quando o voo foi drasticamente diverti para a Arábia Saudita após um piloto supostamente ter esfaqueado o copiloto. Os passageiros, um casal judeu de Sydney, estão seguros, conforme confirmou o ministro dos Assuntos Exteriores australianos.", "titulo_pt": "Casal australiano a bordo de voo diverti após suposto ataque de piloto a copiloto", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 188890, "titulo": "(LEAD) S. Korea expects faster progress in security talks with U.S. following investment announcement", "url": "https://en.yna.co.kr/view/AEN20261001009351315", "fonte_id": "yonhap_news", "data_pub": "2026-10-01T07:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul espera avanços nas discussões de segurança com os Estados Unidos após anúncio de investimentos. O avanço nas negociações de segurança é visto como plicata_de": null, "texto_pt": "Escolas e empresas devem gerenciar o crescimento das apostas sem violar leis e princípios éticos. O texto discute estratégias para lidar com essa situação.", "titulo_pt": "A mensalidade atrasada e a aposta em dia", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 188717, "titulo": "Four potential positives from higher bond yields", "url": "https://www.ft.com/content/96e004e0-43ab-46e6-9116-fabfc7251496?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-01T08:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aumento significativo das taxas de juros das dívidas tem levantado alarmes justificados, mas existem também benefícios associados a essa situação.", "titulo_pt": "Quatro possíveis aspectos positivos com a elevação das taxas de juros", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 188889, "titulo": "Renault Korea's sales drop 24.7 pct in Sept. on weak demand", "url": "https://en.yna.co.kr/view/AEN20261001012400320", "fonte_id": "yonhap_news", "data_pub": "2026-10-01T07:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas da Renault Korea, unidade sul-coreana da Renault, caíram 24,7% em setembro devido à baixa demanda.", "titulo_pt": "Vendas da renault Korea caem 24,7% em setembro por baixa demanda", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 188894, "titulo": "GM Korea's Sept. sales surge 73.3 pct on strong exports", "url": "https://en.yna.co.kr/view/AEN20261001012000320", "fonte_id": "yonhap_news", "data_pub": "2026-10-01T07:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas de setembro da GM Korea, unidade sul-coreana da General Motors, aumentaram 73,3% em comparação com o mesmo mês do ano anterior, impulsionadas por fortes exportações.", "titulo_pt": "Vendas de setembro da GM Korea aumentam 73,3% devido a fortes exportações", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 188896, "titulo": "Household loans fall for 1st time in six months on tightened rules, higher rates", "url": "https://en.yna.co.kr/view/AEN20261001011100320", "fonte_id": "yonhap_news", "data_pub": "2026-10-01T07:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os empréstimos para famílias nas principais instituições bancárias caíram pela primeira vez em seis meses devido a regras mais rígidas e taxas de juros mais altas.", "titulo_pt": "Empréstimos para famílias caem pela primeira vez em seis meses devido a regras mais rígidas e taxas de juros mais altas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 188577, "titulo": "First home buyers with big loans among those most at risk of falling into negative equity, RBA warns", "url": "https://www.theguardian.com/australia-news/2026/oct/01/australia-at-risk-from-major-global-financial-shock-reserve-bank-warns", "fonte_id": "guardian_world", "data_pub": "2026-10-01T07:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Reserva Federal Australiana (RBA) alertou que os primeiros compradores de casas com empréstimos significativos são os mais propensos a entrar em desequilíbrio negativo. De acordo com estimativas do banco central, menos de um em cada 100 emprestadores têm dívidas superiores ao valor atual da propriedade.", "titulo_pt": "Primeiros compradores com grandes empréstimos são os mais vulneráveis a entrarem em desequilíbrio negativo, avisa o RBA", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 188334, "titulo": "Nota Fiscal de Serviços deve trazer informações da reforma tributária a partir deste mês", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/10/nota-fiscal-de-servicos-deve-trazer-informacoes-da-reforma-tributaria-a-partir-deste-mes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-
