s americanas do aplicativo continuam sob forte escrutínio político.", "titulo_pt": "Tiktok e ByteDance concordam em pagamento de US$400 milhões em ação sobre privacidade infantil", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 117053, "titulo": "Over 1 million people have clicked LinkedIn’s AI slop button", "url": "https://www.theverge.com/ai-artificial-intelligence/983502/linkedin-ai-slop-button-one-million-people-message", "fonte_id": "the_verge", "data_pub": "2026-08-21T21:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de um milhão de pessoas clicaram no botão 'Parece lixo de IA' no LinkedIn, de acordo com um post do Chief Product Officer Hari Srinivasan.", "titulo_pt": "Mais de um milhão de pessoas clicaram no botão 'parece lixo de IA' do LinkedIn", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 116958, "titulo": "The job application got faster. The job search got worse.", "url": "https://www.axios.com/2026/08/21/job-seekers-ai-hiring-ghost-jobs-trust", "fonte_id": "axios", "data_pub": "2026-08-21T21:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2026, o processo de busca por emprego pode incluir conversas com robôs, rejeições por inteligência artificial, a presença de vagas fictícias e a competição com uma grande quantidade de candidatos. O processo de recrutamento está se tornando cada vez mais longo, o que pode estar erosionando a confiança no mercado de trabalho americano.", "titulo_pt": "A busca pelo emprego ficou pior, enquanto o processo de aplicação se acelerou", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 117059, "titulo": "Apple is reportedly cutting hundreds of jobs from Siri, Vision Pro teams", "url": "https://techcrunch.com/2026/08/21/apple-is-reportedly-cutting-hundreds-of-jobs-from-siri-vision-pro-teams/", "fonte_id": "techcrunch", "data_pub": "2026-08-21T20:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apple está supostamente cortando centenas de posições nas equipes do Siri e do Vision Pro, enquanto se desvia do foco em certos projetos. A empresa admitiu que algumas funções estão sendo afetadas com essa mudança de estratégia.", "titulo_pt": "Apple supostamente corta centenas de vagas nas equipes do Siri e do Vision Pro", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 116653, "titulo": "Chatbots concordam demais com você, e pesquisadores da USP explicam o risco", "url": "https://www.cnnbrasil.com.br/economia/money/tecnologia/chatbots-concordam-demais-com-voce-e-pesquisadores-da-usp-explicam-o-risco/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo mostra que os chatbots tendem a concordar demais com os usuários, e pesquisadores da USP explicam que isso não é uma falha, mas um mecanismo fundamental da tecnologia.", "titulo_pt": "Chatbots concordam demais com você, e pesquisadores da USP explicam o risco", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 117046, "titulo": "Thunder + fiber-optic cabling used for seismic imaging", "url": "https://arstechnica.com/science/2026/08/researchers-use-thunderquakes-to-study-structure-of-earths-surface/", "fonte_id": "ars_technica", "data_pub": "2026-08-21T20:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os raios de tempestades produzem ondas sísmicas que podem ser utilizadas para identificar características sub-superficiais. A fibra óptica também pode ser empregada para esse tipo de imagens sísmicas.", "titulo_pt": "Trombas + cabos de fibra óptica usados para imagens sísmicas", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 117060, "titulo": "TikTok reaches $400M settlement over children’s privacy lawsuit", "url": "https://techcrunch.com/2026/08/21/tiktok-reaches-400m-settlement-over-childrens-privacy-lawsuit/", "fonte_id": "techcrunch", "data_pub": "2026-08-21T20:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "TikTok chegou a um acordo de $400 milhões após ser acusado de violar a Lei de Proteção à Privacidade Online de Crianças pelos Estados Unidos, dois anos após a acusação.", "titulo_pt": "Tiktok chega a acordo de $400 milhões em caso sobre privacidade de crianças", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 116931, "titulo": "Qué son las plantas BESS y por qué están revolucionando el sistema eléctrico", "url": "https://www.latercera.com/mineria/noticia/que-son-las-plantas-bess-y-por-que-estan-revolucionando-el-sistema-electrico/", "fonte_id": "la_tercera", "data_pub": "2026-08-21T20:16:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "As plantas BESS armazenam energia renovável através de grandes baterias de litio, resolvendo o problema do vertimento de energia verde na matriz elétrica. Esses sistemas têm grande desenvolvimento e potencial no sistema de energia.", "titulo_pt": "O que são as plantas BESS e por que estão transformando o sistema elétrico", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 116882, "titulo": "The week the data center backlash exploded", "url": "https://www.vox.com/today-explained-newsletter/500158/data-centers-2026-election-texas-ohio-michigan", "fonte_id": "vox", "data_pub": "2026-08-21T20:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Houve uma semana em que houve uma forte reação contra os centros de dados, com políticos testando opiniões populares sobre o assunto. Isso levou a discussões sobre a importância e os impactos dos centros de dados.", "titulo_pt": "A semana em que a reação contra os centros de dados explodiu", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 116874, "titulo": "Dutch regulator fines Uber $966m for automating driver suspensions", "url": "https://www.theguardian.com/technology/2026/aug/21/netherlands-fines-uber-automated-driver-suspensions", "fonte_id": "guardian_world", "data_pub": "2026-08-21T20:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autoridade de proteção de dados holandesa multou a Uber em 825 milhões de euros por desativar contas de motoristas através de sistemas automatizados sem fornecer informações adequadas. Esta penalidade é a segunda maior aplicada sob a Regulamento Geral sobre Proteção de Dados (RGPD) da União Europeia.", "titulo_pt": "Regulador holandês multa Uber em 966 milhões de dólares por automação na suspensão de contas de motoristas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 117047, "titulo": "Hidden Zillow listings created fake supply shock, raising NYC rents, lawsuit says", "url": "https://arstechnica.com/tech-policy/2026/08/class-action-accuses-brokers-of-hiding-zillow-listings-driving-up-nyc-rents/", "fonte_id": "ars_technica", "data_pub": "2026-08-21T20:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ressentimentos de inquilinos alegam que listagens ocultas no Zillow criaram uma suposta escassez de imóveis, levando a aumentos nos aluguéis em Nova York. Uma ação judicial alega que isso dificultou a capacidade de pessoas de se manterem no mercado imobiliário da cidade.", "titulo_pt": "Listagens ocultas do Zillow criaram suposta escassez, elevando os aluguéis em nova york, diz ação judicial", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 117061, "titulo": "The $225 Pebble Time 2 is a refreshingly fun smartwatch", "url": "https://techcrunch.com/2026/08/21/the-225-pebble-time-2-is-a-refreshingly-fun-smartwatch/", "fonte_id": "techcrunch", "data_pub": "2026-08-21T19:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Pebble Time 2, com preço de US$ 225, combina relógios de pulso com design único e aplicativos com botões físicos, uma tela de papel eletrotérmico, uma autonomia de bateria de várias semanas e um espírito hacker divertido.", "titulo_pt": "O Pebble Time 2 de us$ 225 é uma relógio inteligente fresca e divertida", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 117054, "titulo": "Apple is laying off staffers working on the Vision Pro and Siri", "url": "https://www.theverge.com/tech/983451/apple-layoffs-vision-pro-siri", "fonte_id": "the_verge", "data_pub": "2026-08-21T19:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apple está despedindo funcionários dos times de desenvolvimento do Vision Pro e Siri, com cortes significativos na equipe de jogos do Vision Pro e na equipe que produz conteúdo imersivo para o dispositivo. Mais de 200 empregos foram afetados.", "titulo_pt": "Apple está demitindo funcionários do Vision Pro e Siri", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 117062, "titulo": "Nvidia just showed that the harness, not the AI model, is now the real hero", "url": "https://techcrunch.com/2026/08/21/nvidia-just-showed-that-the-harness-not-the-ai-model-is-now-the-real-hero/", "fonte_id": "techcrunch", "data_pub": "2026-08-21T19:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa da Nvidia demonstrou que os agentes de IA podem se sair bem e não se desviarem, mesmo que o modelo de IA não seja muito bom na tarefa, desde que sejam ajustados com precisão. Isso sugere que o treinamento refinado pode ser mais importante do que a qualidade do modelo de IA em si.", "titulo_pt": "Nvidia mostra que a capa de treinamento, não o modelo de IA, é o verdadeiro herói", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 117048, "titulo": "Motorola's GrapheneOS phones will launch in 2027 priced higher than Pixels", "url": "https://arstechnica.com/gadgets/2026/08/motorolas-grapheneos-phones-will-launch-in-2027-priced-higher-than-pixels/", "fonte_id": "ars_technica", "data_pub": "2026-08-21T19:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Motorola lançará em 2027 telefones com o sistema operacional GrapheneOS, que será mais caro que os modelos Pixel. O GrapheneOS, um sistema Android privado, expandirá seu alcance além dos dispositivos Pixel no próximo ano.", "titulo_pt": "Motorola lançará telefones com GrapheneOS em 2027, mais caros que os pixel", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 116363, "titulo": "Exhibition showcases heat adaptation technologies", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/22/2003862933", "fonte_id": "taipei_times", "data_pub": "2026-08-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma exposição está apresentando tecnologias de adaptação ao calor. O evento destaca inovações relacionadas à mitigação do efeito do calor em ambientes diversos.", "titulo_pt": "Exposição apresenta tecnologias de adaptação ao calor", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 116364, "titulo": "Institute introduces plan for conserving three plant species", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/22/2003862934", "fonte_id": "taipei_times", "data_pub": "2026-08-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O instituto apresentou um plano para conservar três espécies de plantas. O objetivo é proteger essas espécies de plantas em perigo de extinção.", "titulo_pt": "Instituto apresenta plano para conservar três espécies de plantas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 117065, "titulo": "Hydrogel platform uses vitamin B2 and blue light to simplify living tissue models", "url": "https://phys.org/news/2026-08-hydrogel-platform-vitamin-b2-blue.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores da Universidade de Tampere desenvolveram uma plataforma de hidrogel versátil que facilita a criação de biomateriais personalizados para engenharia de tecidos, modelagem de doenças, descoberta de fármacos e medicina regenerativa. A tecnologia de cruzamento plug-and-play permite o design de uma ampla gama de hidrogels em que podem ser incorporados moléculas biológicas sob condições suaves e amigáveis para células.", "titulo_pt": "Plataforma de hidrogel utiliza vitamina B2 e luz azul para simplificar modelos de tecidos vivos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 116833, "titulo": "“Foliares inteligentes”: lograron respuestas de hasta 465 kilos por hectárea en trigo con una estrategia que integra nutrición y bioestimulación", "url": "https://www.lanacion.com.ar/economia/campo/foliares-inteligentes-lograron-respuestas-de-hasta-465-kilos-por-hectarea-en-trigo-con-una-nid21082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-21T21:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os testes realizados em quatro áreas de trigo com uma tecnologia de Rizobacter resultaram em aumentos de produtividade e uma resposta superior aos tratamentos convencionais de zinco foliar.", "titulo_pt": "Foliar inteligente: tecnologia de rizobacter gerou rendimentos superiores em trigo", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 117066, "titulo": "Climate change could triple the price of wheat", "url": "https://phys.org/news/2026-08-climate-triple-price-wheat.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aumento das mudanças climáticas pode triplicar o preço do trigo. A escassez de água em várias regiões importantes para a produção de trigo global pode afetar significativamente os preços no mercado mundial, impactando produtos como pão, massa e cereal.", "titulo_pt": "Mudanças climáticas podem triplicar o preço do trigo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 116649, "titulo": "Onda de vacinas contra câncer pode ser inaugurada em breve", "url": "https://www.cnnbrasil.com.br/saude/onda-de-vacinas-contra-o-cancer-pode-ser-inaugurada-em-breve-entenda/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um imunizante personalizado baseado em mRNA está mantendo o melanoma sob controle e pode abrir caminho para novos métodos de tratamento de outros tipos de tumores.", "titulo_pt": "Onda de vacinas contra câncer pode ser inaugurada em breve", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 117067, "titulo": "Your high school friends may shape whether you become an entrepreneur decades later", "url": "https://phys.org/news/2026-08-high-school-friends-entrepreneur-decades.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A demanda por programas de empreendedorismo está aumentando no Canadá, com mais jovens considerando a autossustentação devido a uma alta taxa de desemprego juvenil. O número de aplicativos para a Futurpreneur, uma organização nacional que financia empreendedores jovens canadenses, aumentou 50% no último trimestre, em comparação com um crescimento de 15% no ano anterior.", "titulo_pt": "Seus amigos da escola podem influenciar se você se tornará um empreendedor décadas depois", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 117068, "titulo": "Complex odors prove easier to map than expected with machine learning", "url": "https://phys.org/news/2026-08-complex-odors-easier-machine.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A descrição de odores complexos não possui um equivalente ao Pantone para cores, mas a aprendizagem de máquina pode facilitar essa tarefa. Até agora, não havia um sistema similar para complexos odores como existe para as cores.", "titulo_pt": "Odores complexos podem ser mapeados com mais facilidade do que se pensava usando aprendizagem de máquina", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 117097, "titulo": "What happens when a galaxy's supermassive black hole turns off? These dying radio galaxies could show us", "url": "https://www.space.com/astronomy/black-holes/what-happens-when-a-galaxys-supermassive-black-hole-turns-off-these-dying-radio-galaxies-could-show-us", "fonte_id": "space_com", "data_pub": "2026-08-21T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobriram uma população de galáxias com lóbulos de rádio que estão se apagando, revelando o que acontece com essas vastas jatos quando os motores de seus buracos negros supermassivos param de funcionar.", "titulo_pt": "O que acontece quando o superburaco negro de uma galáxia para de funcionar? Essas galáxias moribundas de rádio poderiam nos mostrar", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 116652, "titulo": "Marte ganhou uma batata como lua depois de um impacto violento modificar o formato original de Deimos; cientistas agora recriaram como tudo aconteceu", "url": "https://www.cnnbrasil.com.br/ciencia/marte-ganhou-uma-batata-como-lua-depois-de-um-impacto-violento-modificar-o-formato-original-de-deimos-cientistas-agora-recriaram-como-tudo-aconteceu/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T20:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um único impacto de asteroide mudou a forma da lua de Marte, criando sua cratera polar e camada de poeira. Marte ganhou uma 'batata' como lua devido a um impacto violento que remodelou Deimos.", "titulo_pt": "Marte ganhou uma 'batata' como lua após impacto de asteroide", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 116657, "titulo": "Modelo da Unicamp enxerga o interior da bateria de lítio sem abri-la", "url": "https://www.cnnbrasil.com.br/economia/money/tecnologia/modelo-da-unicamp-enxerga-o-interior-da-bateria-de-litio-sem-abri-la/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-21T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um modelo da Universidade Estadual de Campinas (Unicamp) desenvolveu uma técnica que permite avaliar a vida útil de baterias de íon-lítio sem precisar abrir as unidades. Este avanço é importante para celulares, veículos elétricos e sistemas de armazenamento de energia.", "titulo_pt": "Modelo da Unicamp avança na avaliação de vida útil de baterias de íon-lítio sem abri-las", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 117069, "titulo": "Laser-cut aluminum foil could replace costly terahertz polarizers", "url": "https://phys.org/news/2026-08-laser-aluminum-foil-terahertz-polarizers.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Físicos do ARC Centre for Transformative Meta-Optical Systems (TMOS) encontraram um problema ao precisar de pequenos dispositivos ópticos chamados polarizadores de grade de fio para seus experimentos de terahertz, pois estes são muito caros, custando milhares de dólares cada um.", "titulo_pt": "Folha de alumínio laser-cortada poderia substituir polarizadores terahertz caros", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 116617, "titulo": "A missão chinesa que busca gelo em uma das regiões mais frias da Lua", "url": "https://veja.abril.com.br/ciencia/a-missao-chinesa-que-busca-gelo-em-uma-das-regioes-mais-frias-da-lua/", "fonte_id": "veja", "data_pub": "2026-08-21T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A China está envolvida em uma missão para buscar água congelada em crateras da Lua, entrando na competição com outros países.", "titulo_pt": "Missão chinesa procura gelo em crateras da Lua", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 117070, "titulo": "Scientists map hair follicle formation in spacetime, advancing understanding of how organs develop", "url": "https://phys.org/news/2026-08-scientists-hair-follicle-formation-spacetime.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas da Johns Hopkins Medicine desenvolveram uma tecnologia que permite capturar uma 'fotografia' tridimensional molecular de centenas de folículos pilosos em diferentes estágios de desenvolvimento e, em seguida, reconstruir o quarto dimensionamento—tempo—criando uma animação de stop-motion sobre como esse órgão se forma. O estudo foi publicado na revista Cell.", "titulo_pt": "Cientistas criam tecnologia para mapear a formação dos folículos pilosos em 4d, avançando no entendimento do desenvolvimento de órgãos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 117071, "titulo": "Inside the race to prepare cities for extreme heat", "url": "https://phys.org/news/2026-08-cities-extreme.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A paisagem urbana informal de Makassar, na Indonésia, é dominada por uma vasta área de telhados de metal ondulado.", "titulo_pt": "Dentro da corrida para preparar cidades para o calor extremo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 117072, "titulo": "Iron hydride enters an exotic state of matter under Earth's inner-core conditions", "url": "https://phys.org/news/2026-08-iron-hydride-exotic-state-earth.html", "fonte_id": "phys_org", "data_pub": "2026-08-21T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores do Instituto Science Tokyo identificaram sinais experimentais de hidrureto de ferro superiónico sob condições relevantes para o núcleo terrestre, sugerindo que o núcleo interno da Terra pode entrar em um estado de matéria superiónico sob pressão e temperatura extremas.", "titulo_pt": "Hidrureto de ferro entra em um estado de matéria exótico nas condições do núcleo interno da terra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 11 erá uno de los más fuertes desde 1950 y dónde ya hay riesgos", "url": "https://www.lanacion.com.ar/economia/campo/super-nino-adelantan-que-el-fenomeno-sera-uno-de-los-mas-fuertes-desde-1950-y-donde-ya-hay-riesgos-nid20082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-21T17:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um informe do Ministério de Infraestrutura e Serviços Públicos indica que há mais de 90% de probabilidade de o fenômeno 'Súper Niño' se tornar 'Muito Forte'. Até o momento, 58 dos 92 municípios analisados já superaram suas médias históricas de precipitação e dez apresentam excedentes hídricos superiores a 50%.", "titulo_pt": "Super Niño: fenômeno será um dos mais fortes desde 1950 e já há riscos em vários municípios", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 116077, "titulo": "Amenaza de inundación en Florida: tras las tormentas en Nueva York, avanza el mal tiempo hacia el sur", "url": "https://www.lanacion.com.ar/estados-unidos/florida/amenaza-de-inundacion-en-florida-tras-las-tormentas-en-nueva-york-avanza-el-mal-tiempo-hacia-el-sur-nid21082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-21T17:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Há ameaça de inundações na Flórida, com a chegada de tempestades após fortes chuvas em Nova York. As áreas com mais calor e possíveis fortes chuvas também serão monitoradas.", "titulo_pt": "Ameaça de inundações na flórida após tormentas em nova York", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 115988, "titulo": "Recuperaron un bosque para las tortugas de tierra y 20 años después el mismo hábitat se convirtió en un lugar de liberación para casi 500 ranas excavadoras en peligro de extinción y otras especies", "url": "https://www.clarin.com/estados-unidos/recuperaron-bosque-tortugas-tierra-20-anos-despues-mismo-habitat-convirtio-lugar-liberacion-500-ranas-excavadoras-peligro-extinci rasil", "classe": "B"}, {"id": 115752, "titulo": "Expansão da energia solar na China reduz diversidade de aves, diz estudo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/expansao-da-energia-solar-na-china-reduz-diversidade-de-aves-diz-estudo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-21T14:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo realizado na China e publicado na revista Journal indica que a expansão global da energia solar pode afetar a biodiversidade, especialmente reduzindo a diversidade de aves. O estudo foi divulgado na quinta-feira (20).", "titulo_pt": "Expansão da energia solar na China pode reduzir diversidade de aves, sugere estudo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 116269, "titulo": "New videos show deadly landslide burying gold miners in Central African Republic", "url": "http://www.euronews.com/video/2026/08/21/new-videos-show-deadly-landslide-burying-gold-miners-in-central-african-republic", "fonte_id": "euronews", "data_pub": "2026-08-21T13:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vídeos recentemente filmados no local de mineração de Zamboye, no Central African Republic, mostram um deslizamento de terra que sepultou mineradores em um ouvinte de ouro artesanal no dia 18 de agosto.", "titulo_pt": "Novos vídeos mostram deslizamento de terra sepultando mineradores de ouro no Central African Republic", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 115883, "titulo": "El Niño eleva alerta para incêndios, e governo articula prevenção com estados", "url": "https://exame.com/esg/el-nino-eleva-alerta-para-incendios-e-governo-articula-prevencao-com-estados/", "fonte_id": "exame", "data_pub": "2026-08-21T13:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo articula medidas de prevenção para incêndios florestais em virtude do El :00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Hungria enfrenta uma grave crise hídrica devido a um período prolongado de calor e seca, que está baixando os níveis de água em lagos e rios. Cerca de 99% do país está sujeito a uma seca severa ou extremamente severa, e a desertificação ameaça a Planície Maior da Hungria.", "titulo_pt": "Hungria enfrenta grave crise hídrica com seca prolongada e níveis de água em baixa", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 116361, "titulo": "Indonesian workers allege forced labor, salary cuts", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/22/2003862931", "fonte_id": "taipei_times", "data_pub": "2026-08-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores indonésios acusam empregadores de usar trabalho forçado e reduzir salários. Os relatos indicam violações de direitos trabalhistas em operações de empregos temporários.", "titulo_pt": "Trabalhadores indonésios acusam trabalho forçado e cortes salariais", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 117013, "titulo": "Indian workers in Israel demand accountability after murder of Indian caregiver", "url": "https://www.middleeasteye.net/news/indian-workers-israel-demand-accountability-after-murder-indian-caregiver", "fonte_id": "middle_east_eye", "data_pub": "2026-08-21T20:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores indianos em Israel exigem responsabilização após o assassinato de uma cuidadora indiana. Rajeev Acharya, um cuidador indiano, foi morto a facadas por um cidadão israelense, levantando preocupações sobre a vulnerabilidade de milhares de trabalhadores indianos no país.", "titulo_pt": "Trabalhadores indianos em Israel exigem responsabilização após assassinato de cuidadora", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 116993, "titulo" "2026-08-21T11:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os colonos israelenses atacam seis vezes por dia na Cisjordânia ocupada. AJLabs investiga como o território palestino é apropriado.", "titulo_pt": "Quem a lei serve na cisjordânia ocupada?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 115540, "titulo": "Outrage as China programmer’s toilet death ruled non-work-related for being ‘not at desk’", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3364847/outrage-china-programmers-toilet-death-ruled-non-work-related-being-not-desk?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-21T10:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Xing Zhi, um programador de 39 anos de Shenzhen, morreu no banheiro da empresa em abril após ir diretamente ao banheiro em vez de ir para seu escritório. As autoridades não classificaram a morte como relacionada ao trabalho, alegando que ele não estava à mesa de trabalho.", "titulo_pt": "Ira na China após morte de programador no banheiro não ser classificada como relacionada ao trabalho", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 114975, "titulo": "‘É uma das maiores crises humanitárias do país’, diz Damares sobre mortes de Yanomamis", "url": "https://veja.abril.com.br/brasil/e-uma-das-maiores-crises-humanitarias-do-pais-diz-damares-sobre-mortes-de-yanomamis/", "fonte_id": "veja", "data_pub": "2026-08-21T10:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra Damares afirmou que as mortes de Yanomamis representam uma das maiores crises humanitárias do país. Uma comissão está solicitando investigação sobre o destino de uma verba bilionária destinada à assistência aos Yanomamis.", "titulo_pt": "É uma das maiores crises humanitárias do país', diz Damares sobre mortes de Yanomamis", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 115673, "titulo": "Hundreds of health and nutrition facilities closed as Somalia’s child crisis deepens", "url": "https://www.unicef.org/press-releases/hundreds-health-and-nutrition-facilities-closed-somalias-child-crisis-deepens", "fonte_id": "unicef", "data_pub": "2026-08-21T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitas instalações de saúde e nutrição foram fechadas em Somalia à medida que a crise infantil se agrava. Esta é uma síntese das declarações feitas pelo porta-voz do UNICEF, James Elder, durante uma coletiva de imprensa no Palácio das Nações em Genebra.", "titulo_pt": "Muitas instalações de saúde e nutrição fechadas em Somalia à medida que a crise infantil se agrava", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 115508, "titulo": "The Hong Kong Tiananmen vigil activists convicted in national security trial", "url": "https://www.japantimes.co.jp/news/2026/08/21/asia-pacific/hong-kong-tiananmen-activists-convicted/", "fonte_id": "japan_times", "data_pub": "2026-08-21T07:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal de Hong Kong condenou dois ativistas pró-democracia que organizavam vigílias anuais para marcar o massacre de Tiananmen à subversão nacional em uma audiência de segurança nacional.", "titulo_pt": "Ativistas de Hong Kong que organizavam vigílias de Tiananmen condenados por incitação à subversão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 115389, "titulo": "Hong Kong court convicts activists who organized Tiananmen vigil", "url": "https://www.lemonde.fr/en/international/article/2026/08/21/hong-kong-court-convicts-activists-who-organized-tiananmen-vigil_6756724_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-21T06:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lee Cheuk-yan, de 69 anos, e Chow Hang-tung, de 41 anos, ativistas pró-democracia, foram condenados por organizar uma vigília em Hong Kong. Eles podem enfrentar até ": 49}};
const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
