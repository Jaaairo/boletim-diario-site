:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Deolane Bezerra, advogada e influenciadora, está detida em São Paulo desde o dia 21 de maio, data em que foi deflagrada em uma operação policial. Ela fez um novo desabafo em uma carta enviada à mãe, expressando o desejo de voltar para casa.", "titulo_pt": "Deolane Bezerra faz novo desabafo em carta enviada à mãe: 'só quero voltar'", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 226966, "titulo": "Deputada mais votada do RJ sugere que empresários demitam funcionários que apoiaram Lula", "url": "https://veja.abril.com.br/brasil/deputada-mais-votada-do-rj-sugere-que-empresarios-demitam-funcionarios-que-apoiaram-lula/", "fonte_id": "veja", "data_pub": "2026-10-26T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma deputada mais votada no Rio de Janeiro sugeriu que empresários demitem funcionários que votaram em Lula. Ela associou o voto no petista a uma posição contrária ao empresariado.", "titulo_pt": "Deputada RJ sugere demissão de funcionários que apoiaram Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 227053, "titulo": "Vídeo: Homem é agredido com chutes por grupo após eleições em Goiás", "url": "https://www.cnnbrasil.com.br/nacional/centro-oeste/go/video-homem-e-agredido-com-chutes-por-grupo-apos-eleicoes-em-goias/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-26T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Imagens mostram um homem sendo agredido com chutes por um grupo de pessoas com camisas amarelas após as eleições em Goiás. A polícia não foi chamada e a motivação do ataque ainda não foi determinada.", "titulo_pt": "Vídeo: homem é agredido com chutes por grupo após eleições em Goiás", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 227684, "titulo": "OPS y Special Olympics International firman acuerdo para promover la salud inclusiva de personas con discapacidad intelectual y del desarrollo", "url": "https://www.paho.org/es/noticias/26-10-2026-ops-special-olympics-international-firman-acuerdo-para-promover-salud-inclusiva", "fonte_id": "paho", "data_pub": "2026-10-26T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OPS e a Special Olympics International assinaram um acordo framework para promover a saúde inclusiva das pessoas com deficiência intelectual e de desenvolvimento. O objetivo é avançar na inclusão na área da saúde para essa população.", "titulo_pt": "OPS e Special Olympics International assinam acordo para promover saúde inclusiva de pessoas com deficiência intelectual e de desenvolvimento", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 227274, "titulo": "The chaos in France is a ‘warning signal’ for Australia’s public spending and rising costs", "url": "https://www.theguardian.com/business/2026/oct/27/the-chaos-in-france-is-a-warning-signal-for-australias-public-spending-and-rising-costs", "fonte_id": "guardian_world", "data_pub": "2026-10-26T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Economistas afirmam que os protestos na França, motivados por problemas na educação e infraestrutura, servem como um 'sinal de alerta' para a Austrália, que também corre o risco de enfrentar similares problemas sem uma 'conversa honesta' sobre os gastos públicos. A dívida pública da Austrália é menor que a da França, mas há lições a serem aprendidas com os desafios econômicos franceses.", "titulo_pt": "Protestos na França são 'sinal de alerta' para a austrália em relação aos gastos públicos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 226747, "titulo": "In one Korean county, 1 in 3 young people have migrant backgrounds", "url": "https://www.koreaherald.com/article/10915303", "fonte_id": "korea_herald", "data_pub": "2026-10-26T08:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Goseong, na Província de Gangwon, cerca de um terço dos residentes com 24 anos ou menos tinham origem migrante em 2025, sendo o maior percentual do país e quatro vezes maior que a média nacional.", "titulo_pt": "Em um condado coreano, 1 em 3 jovens têm origem migrante", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 226386, "titulo": "Overkill em casos de feminicídio – parte 2", "url": "https://www.jota.info/opiniao-e-analise/colunas/direito-dos-grupos-vulneraveis/overkill-em-casos-de-feminicidio-parte-2", "fonte_id": "jota", "data_pub": "2026-10-26T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Este trecho trata das consequências jurídicas do fenômeno do feminicídio no sistema de justiça brasileiro. A parte 2 sugere que o texto abordará aspectos específicos das ações judiciais relacionadas a esse problema social.", "titulo_pt": "Overkill em casos de feminicídio – parte 2", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 226387, "titulo": "O distrital acaba com o puxador de votos, não com o puxador de eleitores", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-distrital-acaba-com-o-puxador-de-votos-nao-com-o-puxador-de-eleitores", "fonte_id": "jota", "data_pub": "2026-10-26T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reforma eleitoral foca na estrutura dos votos, mas ignora os algoritmos que influenciam a opinião pública. O distrital continua a depender do puxador de votos, não do puxador de eleitores.", "titulo_pt": "A reforma eleitoral deixa intactos os algoritmos que moldam a opinião pública", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 226388, "titulo": "A saúde da mulher é mais que uma campanha", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-saude-da-mulher-e-mais-que-uma-campanha", "fonte_id": "jota", "data_pub": "2026-10-26T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A saúde da mulher deve ser considerada além das campanhas específicas, como o Outubro Rosa, e a regulação precisa equilibrar as regras com as decisões médicas.", "titulo_pt": "A saúde da mulher é mais do que campanhas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 226656, "titulo": "70% in Japan want to shelter at home after disasters, survey finds", "url": "https://www.japantimes.co.jp/news/2026/10/26/japan/disaster-shelter-preference-survey/", "fonte_id": "japan_times", "data_pub": "2026-10-26T08:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa revelou que 70% dos japoneses gostariam de se abrigar em casa após desastres naturais, enquanto apenas 15% dos entrevistados tinham um entendimento detalhado das preparações necessárias para esse tipo de situação.", "titulo_pt": "70% Dos japoneses querem se abrigar em casa após desastres, mostra pesquisa", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 226233, "titulo": "Messias à CNN: Flávio tem espírito antidemocrático", "url": "https://www.cnnbrasil.com.br/eleicoes/messias-a-cnn-flavio-tem-espirito-antidemocratico/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-26T06:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O advogado-geral da União comentou sobre o não reconhecimento do resultado eleitoral pelo candidato derrotado do PL, Flávio Dino. Este comportamento foi descrito como antidemocrático.", "titulo_pt": "Messias à CNN: flávio tem espírito antidemocrático", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 226149, "titulo": "INSS começa folha de outubro nesta segunda, 26; veja quem recebe", "url": "https://exame.com/invest/minhas-financas/inss-comeca-folha-de-outubro-nesta-segunda-26-veja-quem-recebe/", "fonte_id": "exame", "data_pub": "2026-10-26T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Nacional do Seguro Social (INSS) começa a pagar a folha de outubro nesta segunda-feira, 26. Os beneficiários com final de inscrição 1 e renda de até um salári "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A vigilância ambiental do estado da Austrália Ocidental alertou que o plano da Woodside Energy para perfurar gás na costa norte da Austrália pode causar danos significativos a recifes de coral excepcionais e aumentar o risco de vazamento de óleo, possivelmente impossível de ser reduzido a um nível aceitável.", "titulo_pt": "Tartarugas em perigo e recifes de coral excepcionais correm risco com perfuração de gás da Woodside na austrália ocidental, diz vigilância ambiental", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 227598, "titulo": "Climate damage to Philippine ports could cost US$70b a year by 2100", "url": "https://www.scmp.com/week-asia/economics/article/3372185/climate-damage-philippine-ports-could-cost-us70b-year-2100", "fonte_id": "scmp", "data_pub": "2026-10-26T11:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Filipinas enfrenta os custos mais altos de danos aos portos devido ao clima na Ásia Oriental, com prejuízos anuais projetados em US$70,2 bilhões até 2100, conforme alerta o Banco de Desenvolvimento Asiático. O relatório destaca a necessidade de uma abordagem mais coordenada para a proteção contra inundações, além da simples fortificação das infraestruturas portuárias.", "titulo_pt": "Danos climáticos aos portos filipinos poderiam custar US$70 bilhões ao ano até 2100", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 226212, "titulo": "Reciclagem no agro amplia recuperação de resíduos e se torna referência", "url": "https://www.cnnbrasil.com.br/agro/reciclagem-no-agro-amplia-recuperacao-de-residuos-e-se-torna-referencia/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O sistema de logística reversa de embalagens agrícolas já destinou corretamente mais de 900 mil toneladas desde 2002. A demanda por material reciclado e a rastreabilidade são essenciais para a sustentabilidade financeira da operação.", "titulo_pt": "Reciclagem no agronegócio amplia recuperação de resíduos e se torna referência", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 226389, "titulo": "Parques de papel: obstáculos à efetividade das unidades de conservação", "url": "https://www.jota.info/opiniao-e-analise/colunas/advogadas-publicas-em-debate/parques-de-papel-obstaculos-a-efetividade-das-unidades-de-conservacao", "fonte_id": "jota", "data_pub": "2026-10-26T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A falta de estrutura e planejamento compromete a efetividade das unidades de conservação no Brasil. Parques de papel, como são conhecidas, não atendem plenamente seu propósito de preservação e gestão ambiental.", "titulo_pt": "Parques de papel: obstáculos à efetividade das unidades de conservação", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 226230, "titulo": "Taxa de AVC em adultos jovens sobe 83% nos Estados Unidos", "url": "https://www.cnnbrasil.com.br/saude/taxa-de-avc-em-adultos-jovens-sobe-83-nos-estados-unidos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-26T06:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que a taxa de AVC em adultos jovens nos Estados Unidos aumentou em 83% entre as pessoas com idades entre 20 a 54 anos. O crescimento é atribuído a fatores de risco vasculares e estilo de vida.", "titulo_pt": "Taxa de AVC em adultos jovens aumenta 83% nos Estados Unidos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 226959, "titulo": "Comissão da ONU acusa Rússia de crimes de guerra e contra a humanidade na Ucrânia", "url": "https://veja.abril.com.br/mundo/comissao-da-onu-acusa-russia-de-crimes-de-guerra-e-contra-a-humanidade-na-ucrania/", "fonte_id": "veja", "data_pub": "2026-10-26T17:49:00Z", "idioma": "pt", "provavel_duplicata_de": nu armed-conflict-commitment-impact", "fonte_id": "unicef", "data_pub": "2026-10-26T14:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A diretora executiva do UNICEF, Catherine Russell, fez uma declaração à Segurança das Nações Unidas sobre 30 anos de proteção a crianças afetadas por conflitos armados. O foco foi na transformação do compromisso em impacto.", "titulo_pt": "30 Anos de proteção a crianças afetadas por conflitos armados: de compromisso a impacto", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 227543, "titulo": "Kosovo Woman Murdered Hours After Reporting Domestic Violence to Police", "url": "https://balkaninsight.com/2026/10/26/kosovo-woman-murdered-hours-after-reporting-domestic-violence-to-police/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-10-26T12:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher foi assassinada horas após denunciar violência doméstica à polícia em Kosovo. A autoridade local foi acusada de falhar na proteção de mulheres nesses casos.", "titulo_pt": "Mulher assassinada horas após denunciar violência doméstica à polícia em kosovo", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 226346, "titulo": "Rabat busca fórmulas para revertir las rebajas de condena a abusadores sexuales de menores, pero polémica sigue abierta", "url": "https://www.latercera.com/politica/noticia/rabat-busca-formulas-para-revertir-las-rebajas-de-condena-a-abusadores-sexuales-de-menores-pero-polemica-sigue-abierta/", "fonte_id": "la_tercera", "data_pub": "2026-10-26T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo marroquino está considerando anular decisões que permitiram a libertação antecipada de 56 condenados por abuso sexual de menores, apesar de ter descartado anteriormente a suspensão dos decretos já executados. A sessão especial no Congresso marcada para o próximo dia 16 será crucial para o ministro da Justiça, que re function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  return `<div>

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {

    btn.classList.toggle('flag-ativo', ativo);

    btn.textContent = ativo ? '⚑' : '⚐';
  });

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
