impacto das propostas de captura de carbono. A intenção é avaliar a eficácia dessas iniciativas ambientais.", "titulo_pt": "Ministério vai testar impacto de propostas de captura de carbono", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 249191, "titulo": "Envases vacíos de agroquímicos: el 44% del plástico recuperado se usa para fabricar caños de fibra óptica", "url": "https://www.lanacion.com.ar/economia/campo/envases-vacios-de-agroquimicos-el-44-del-plastico-recuperado-se-usa-para-fabricar-canos-de-fibra-nid06112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-06T21:46:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A iniciativa CampoLimpio recuperou mais de 28 milhões de quilos de embalagens vazias de agroquímicos desde 2019. A indústria investiu mais de 100 milhões de dólares em uma rede que atinge 22 províncias, com parte do plástico reutilizado para fabricar caixas ou caixas de fibra óptica.", "titulo_pt": "Garrafas vazias de agroquímicos: 44% do plástico recuperado são usados para fabricar caixas de fibra óptica", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 249136, "titulo": "90 milhões de pessoas estão em risco devido às mudanças climáticas, diz ONU", "url": "https://www.cnnbrasil.com.br/internacional/90-milhoes-de-pessoas-estao-em-risco-devido-as-mudancas-climaticas-diz-onu/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência das Nações Unidas para Refugiados alertou para o risco enfrentado por 90 milhões de pessoas devido às mudanças climáticas. A organização solicitou financiamento para auxiliar as comunidades vulneráveis em países afetados por secas, inundações e calor extremo.", "titulo_pt": "90 Milhões de pessoas estão em risco devido às mudanças climáticas, diz ONU", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 249141, "titulo": "Governo aprova mapa para reverter desmatamento até 2030", "url": "https://www.cnnbrasil.com.br/agro/governo-aprova-mapa-para-reverter-desmatamento-ate-2030/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T20:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo aprovou um plano para reverter o desmatamento até 2030, que engloba quatro frentes de atuação e inclui medidas para aumentar o financiamento, a assistência técnica e o acesso a mercados. A reunião também estabeleceu diretrizes para o mercado de carbono.", "titulo_pt": "Governo aprova plano para reverter desmatamento até 2030", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 249142, "titulo": "Mais de 40 baleias-piloto morrem após encalharem na costa da Nova Zelândia", "url": "https://www.cnnbrasil.com.br/internacional/mais-de-40-baleias-piloto-morrem-apos-encalharem-na-costa-da-nova-zelandia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-06T20:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 40 baleias-piloto encalharam e morreram na costa da Nova Zelândia. Grande parte dos animais já estavam mortos quando foram descobertos no local.", "titulo_pt": "Mais de 40 baleias-piloto morrem após encalharem na costa da Nova Zelândia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 249371, "titulo": "Del riesgo climático al riesgo económico", "url": "https://www.ciperchile.cl/2026/11/06/del-riesgo-climatico-al-riesgo-economico/?utm_source=rss&utm_medium=rss&utm_campaign=del-riesgo-climatico-al-riesgo-economico", "fonte_id": "ciper_chile", "data_pub": "2026-11-06T18:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Este texto discute a transição do risco climático para o risco econômico.", "titulo_pt": "Do risco climático ao risco econômico", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 249240, "titulo": "Mundo registrou mês de outubro mais quente da história, diz serviço climático da UE", "url": "https://www.dw.com/pt-br/mundo-registrou-mês-de-outubro-mais-quente-da-história-diz-serviço-climático-da-ue/a-79879668?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-06T18:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O serviço climático da União Europeia (UE) informou que o mês de outubro de 2026 foi o mais quente já registrado. Um El Niño excepcionalmente forte está intensificando o aquecimento global causado pela atividade humana.", "titulo_pt": "Mês de outubro de 2026 registrou temperatura mais alta da história, diz serviço climático da UE", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 249018, "titulo": "Estados Unidos registram maior número de casos de sarampo em 30 anos", "url": "https://www.cartacapital.com.br/mundo/estados-unidos-registram-maior-numero-de-casos-de-sarampo-em-30-anos/", "fonte_id": "cartacapital", "data_pub": "2026-11-06T18:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Desde o início de 2026, os Estados Unidos registraram 5.182 casos de sarampo, um número que não era visto há 30 anos. A doença havia sido erradicada no país em 2000, devido à vacinação.", "titulo_pt": "Estados Unidos registram maior número de casos de sarampo em 30 anos", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 249061, "titulo": "Por que uma barragem de contenção de cheias precisa operar com reservatório vazio?", "url": "https://exame.com/esg/barragem-de-contencao-reservatorio-vazio/", "fonte_id": "exame", "data_pub": "2026-11-06T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A operação de barragens de contenção de cheias com reservatórios vazios é justificada pela necessidade de amortecimento hidráulico e pelas exigências do Plano de Segurança da Barragem, além de sua importância para as comunidades situadas abaixo da barragem.", "titulo_pt": "Por que uma barragem de contenção de cheias precisa operar com reservatório vazio?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 248364, "titulo": "Quase 90 milhões de deslocados vivem em países altamente expostos à crise climática, alerta ACNUR", "url": "https://www.jota.info/internacional/quase-90-milhoes-de-deslocados-vivem-em-paises-altamente-expostos-a-crise-climatica-alerta-acnur", "fonte_id": "jota", "data_pub": "2026-11-06T14:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ACNUR alerta que quase 90 milhões de deslocados vivem em países altamente expostos à crise climática. Durante a última década, desastres climáticos causaram mais de 255 milhões de deslocamentos internos.", "titulo_pt": "Quase 90 milhões de deslocados vivem em países altamente expostos à crise climática, alerta ACNUR", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 248430, "titulo": "Most Europeans want action to tackle climate crisis but not at any cost, poll shows", "url": "https://www.theguardian.com/world/2026/nov/06/europeans-want-action-climate-crisis-yougov-poll", "fonte_id": "guardian_world", "data_pub": "2026-11-06T12:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa YouGov realizada em seis países europeus mostrou que a maioria das pessoas acredita em mudanças climáticas causadas pelo homem e apoia ações como plantio de árvores e impostos sobre emissões, mas se opõe a medidas que afetem significativamente sua vida, como taxas de combustível e viagens aéreas.", "titulo_pt": "A maioria dos europeus quer ação contra a crise climática, mas não a qualquer custo, pesquisa mostra", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 248551, "titulo": "2026 'most likely' to be second-hottest year on record says EU monitor", "url": "https://www.lemonde.fr/en/environment/article/2026/11/06/2026-most-likely-to-be-second-hottest-year-on-record-says-eu-monitor_6773395_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-06T10:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com um padrão climático El Niño excepcionalmente forte acelerando o aquecimento global causado pela humanidade, o serviço Copernicus de Mudanças Climáticas afirma que há ainda uma '20% de chances de este ano empatar ou superar' 2024 como o ano mais quente jamais registrado.", "titulo_pt": "2026 'Provavelmente' será o segundo ano mais quente na história, diz monitor da ue", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 247603, "titulo": "Construyen el puente para animales más grande del mundo, una obra que busca reconectar hábitats y proteger a pumas aislados", "url": "https://www.lanacion.com.ar/el-mundo/construyen-el-puente-para-animales-mas-grande-del-mundo-una-obra-que-busca-reconectar-habitats-y-nid05112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-06T09:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em California, está sendo finalizado o Wallis Annenberg Wildlife Crossing, que será o maior puente para animais do mundo. A estrutura visa conectar habitats e proteger pumas isolados, reduzindo a endogamia genética nesses felinos.", "titulo_pt": "Construem o puente para animais mais grande do mundo, uma obra que busca reconectar habitats e proteger pumas aislados", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 247977, "titulo": "‘Simply staggering’: Rapidly developing ‘super El Niño’ on track to peak in December", "url": "https://www.carbonbrief.org/simply-staggering-rapidly-developing-super-el-nino-on-track-to-peak-in-december", "fonte_id": "carbon_brief", "data_pub": "2026-11-06T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O 'super El Niño' atual está em desenvolvimento rápido e está programado para atingir seu pico em dezembro. As temperaturas globais médias podem ser afetadas significativamente quando o fenômeno atingir seu pico no final do ano.", "titulo_pt": "Absurdo: 'super El Niño' em desenvolvimento rápido previsto para atingir pico em dezembro", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 247753, "titulo": "Grizzly bear hunt underway after mother and daughter killed in Canada", "url": "https://www.euronews.com/2026/11/06/grizzly-bear-hunt-underway-after-mother-and-daughter-killed-in-canada", "fonte_id": "euronews", "data_pub": "2026-11-06T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mãe e sua filha foram encontradas mortas após um suposto ataque de urso pardo perto de Bella Coola, no Canadá. Oficiais de conservação afirmam que podem ter sido envolvidos múltiplos ursos pardos, e as operações de armadilhas estão em andamento. A autoridade local estabeleceu um curfew enquanto a investigação continua.", "titulo_pt": "Caça ao urso pardo em andamento após mortes de mãe e filha em território canadense", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 247859, "titulo": "Indonesia doubles down on climate goals despite surging wildfire emissions", "url": "https://www.scmp.com/week-asia/health-environment/article/3373544/indonesia-doubles-down-climate-goals-despite-surging-wildfire-emissions", "fonte_id": "scmp", "data_pub": "2026-11-06T08:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia aumentou suas metas climáticas, apesar das intensas queimadas que contradizem essa estratégia. O ministro do Meio Ambiente, Jumhur Hidayat, enfatizou que os objetivos climáticos não devem prejudicar o desenvolvimento nacional.", "titulo_pt": "Indonésia reforça metas climáticas frente a intensas queimadas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 249370, "titulo": "El proyecto de reforma al INDH ante los estándares internacionales", "url": "https://www.ciperchile.cl/2026/11/06/el-proyecto-de-reforma-al-indh-ante-los-estandares-internacionales/?utm_source=rss&utm_medium=rss&utm_campaign=el-proyecto-de-reforma-al-indh-          ${arts.map(n => {

           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
