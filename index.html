<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

s Patriot interceptadores para contrabalançar os ataques de foguetes balísticos russos. Em outro desenvolvimento, o governo Lula rejeitou a prorrogação das sanções dos Estados Unidos contra o Brasil, considerando-a injustificada e questionando a caracterização do país como uma ameaça aos EUA.\n\nOs Estados Unidos e a Arábia Saudita intensificaram suas operações militares contra o Irã, realizando ataques aéreos coordenados contra bases do Movimento de Mobilização Popular (PMF) no Iraque. Essas ações foram em resposta aos recentes ataques iranianos contra alvos americanos na região e representam uma escalada significativa na guerra regional. Em reação, o Irã rejeitou uma proposta do Omã para dividir igualmente o Estreito de Ormuz e lançou múltiplos mísseis balísticos contra forças americanas no Iêmen, em um ataque surpresa que aumenta as preocupações com a escalada do conflito. Além disso, os Estados Unidos anunciaram novas sanções contra entidades associadas ao Corpo de Guardiões da Revolução Islâmica (CRI) iraniano, acusando-as de extorquir navios no Estreito de Ormuz. Esses desenvolvimentos refletem a crescente tensão geopolítica na região e as medidas cada vez mais agressivas adotadas por ambas as partes.", "economia": "A economia global e brasileira registrou vários movimentos relevantes nos últimos dias. A UBS elevou sua projeção para o crescimento do PIB do país, projetando um aumento de 11%, refletindo uma melhora nas perspectivas econômicas. No cenário internacional, a Reserva Federal dos Estados Unidos manteve as taxas de juros inalteradas em uma decisão tomada por nove votos contra três, mas com a probabilidade de uma alta nos juros em setembro aumentando para 60%. O preço do petróleo Brent fechou com uma alta significativa de 7,91%, atingindo US$ 90,74 por barril, refletindo a retomada dos ataques no Oriente Médio. No Brasil, o Tesouro Nacional colocou no mercado R$12,21 bilhões em títulos e conseguiu um rollover de 144,5% sobre as dívidas vencíveis, além de outros US$309 milhões do Bonar 2029. A Microsoft superou as expectativas do quarto trimestre em relação aos serviços na nuvem e a receita anual total do Azure ultrapassou os 100 bilhões de dólares. Por outro lado, a Meta caiu 6% nas bolsas de valores devido a uma previsão de vendas e lucros que não atenderam às expectativas. Além disso, o Brasil criou 921,6 mil empregos formais no primeiro semestre de 2023, o menor saldo desde 2020, atribuído à taxa de juros elevada e ao cenário internacional marcado por guerras e pelo tarifaço de Trump.", "tecnologia": "A Thunder Tiger e o Shield AI apresentaram software de autonomia operacional para missões, permitindo que os sistemas operem automaticamente durante as tarefas designadas. Em outra notícia, a Qualcomm aumentará os preços dos seus processadores a partir do dia 1º de setembro, conforme anunciado pelo CEO Cristiano Amon. No campo da inteligência artificial, o CEO da OpenAI, Sam Altman, conversou com senadores sobre novos modelos de IA após um incidente recente de segurança. Além disso, empresas como Meta e Anthropic apoiaram uma iniciativa que pede aos Estados Unidos para frear o desenvolvimento de modelos avançados de inteligência artificial. No Brasil, a GWM lançou versões esportivas do Ora 5 no mercado chinês com kits aerodinâmicos e sensor LiDAR, enquanto a Dynapack aumenta suas vendas de baterias de backup neste ano. Sobre IA, Sam Altman também se reuniu com altos funcionários do governo Trump para discutir um framework sobre inteligência artificial antes de uma data final.", "ciencia": "Um estudo da Universidade de San Andrés mostrou que o ambiente tem influência na saúde cerebral cerca de nove vezes maior do que os hábitos pessoais, ressaltando a importância de um contexto favorável para práticas saudáveis. Paralelamente, pesquisadores localizaram quase 1.300 estruturas pré-colombianas no Acre e nas regiões vizinhas, sugerindo que o número real pode chegar a cerca de 20 mil monumentos. Em outro avanço, astrônomos da NASA descobriram um superburaco negro vagando pelo espaço profundo, considerado o exemplo mais promissor encontrado até agora. Esses achados reforçam a importância do ambiente e dos estudos científicos em diversos campos, desde a saúde cerebral até a arqueologia e astronomia.", "cultura": "O filme 'Homem-Aranha: Um Novo Dia', com Tom Holland e Zendaya nos papéis principais, retorna às telonas após dois anos de hiato. O longa explora os sentimentos de Peter Parker após um feitiço que afetou sua ex-namorada Michelle Jones-Watson. Em outro destaque cultural, a banda sul-coreana BTS anunciou que não participará dos Grammy Awards no próximo ano, criticando o foco excessivo na popularidade asiática nas categorias musicais. A ministra Chomali anunciou a incorporação gradual de todos os tipos de câncer ao GES como parte da agenda 2026-2030, com foco em acesso territorial equitativo e oportuno. Além disso, Jane Schoenbrun, Hannah Einbinder e Gillian Anderson realizaram uma leitura dramatizada do filme 'Secretária' no Wallis Annenberg Center for the Performing Arts em 28 de julho, trazendo um novo contexto para o clássico dos anos 2000.", "sociedade": "O Brasil e o Chile enfrentaram graves desafios sociais. Em São Paulo, uma ventania com rajadas de até 111 km/h causou três mortes, levando a montagem do Gabinete de Crise para lidar com os estragos. No Amazonas, um professor de jiu-jitsu foi flagrado agredindo um adolescente autista, justificando que estava protegendo seu cachorro. Em Goiás, três pessoas foram mortas a tiros dentro de uma fazenda, com o suspeito tentando se suicidar após o crime. Na Região do Biobío, no Chile, as aulas foram suspensas para esta quinta-feira por causa de um sistema frontal que também levou a isolamento de milhares de pessoas há cerca de uma semana. Em Porto Alegre, a cidade está novamente sob alerta devido à intensificação das chuvas, após um desastre em 2023, não 2024.", "meio_ambiente": "Mais da metade do Reino Unido está oficialmente em estado de seca, conforme informa o Agência Ambiental do Reino Unido. O órgão relata baixos níveis nos rios, colheitas antecipadas por agricultores e aumento do risco de incêndios florestais, além de milhões de pessoas vivendo sob restrições no uso d'água. No Brasil, uma frente fria intensificou ventos acima de 100 km/h, causando destruição e apagões no Rio de Janeiro, com 30 ocorrências atendidas pelos bombeiros e paralisação parcial dos trens e metrô. Em Goiás, uma explosão envolvendo um caminhão que transportava químicos perigosos levou à proibição da captação de água na cidade de Professor Jamil. No Quênia, pelo menos 15 elefantes morreram suspeitamente envenenados no Parque Nacional Amboseli.", "direitos_humanos": "Um relatório recente da ONU indicou que 2025 foi o ano mais letal para ataques antissemitas nos últimos décadas, com mais de 23.000 incidentes em sete países, incluindo Austrália, Reino Unido e França. Em Cuba, um artista famoso, fundador do Movimento San Isidro, ficou preso por cinco anos antes de ser liberado e forçado a deixar o país. Ele afirma ter sobrevivido à prisão e planeja usar suas obras para resistir contra o sistema que mantém Cuba em uma situação similar a um sequestro. Em Hong Kong, duas livrarias independentes foram revistadas pela polícia após suspeitas de exibição e venda de materiais seditivos, resultando na prisão de cinco pessoas. No Líbano, o Alto Comissário das Nações Unidas para os Direitos Humanos, Volker Türk, visitou o país para discutir violações cometidas durante a guerra entre Israel e Hezbollah, bem como questões de justiça para as vítimas."}, "resumo_do_dia": {"politica_nacional": [{"id": 80443, "titulo": "Justiça Eleitoral condena Lula por propaganda antecipada por pedido de votos para Simone Tebet e Marina Silva", "url": "https://www.jota.info/eleicoes/eleicoes-2026/justica-eleitoral-condena-lula-por-propaganda-antecipada-por-pedido-de-votos-para-simone-tebet-e-marina-silva", "fonte_id": "jota", "data_pub": "2026-07-29T21:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça Eleitoral condenou Lula por propaganda antecipada, após pedido explícito de votos para Simone Tebet e Marina Silva realizado em um evento em maio em São Paulo.", "titulo_pt": "Justiça Eleitoral condena Lula por propaganda antecipada", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 80267, "titulo": "Eduardo Bolsonaro encontra Netanyahu no complexo da Casa Branca", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/eduardo-bolsonaro-encontra-netanyahu-no-complexo-da-casa-branca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Bolsonaro esteve na Blair House, residência em frente à Casa Branca, onde está hospedado o primeiro-ministro de Israel, Binyamin Netanyahu. Ambos participaram de reuniões e eventos relacionados a lideranças políticas americanas.", "titulo_pt": "Eduardo Bolsonaro encontra Netanyahu na blair house", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 80264, "titulo": "Eduardo Bolsonaro desiste de concorrer como suplente de candidato ao Senado em SP", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/07/29/eduardo-bolsonaro-eleicao-2026.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-29T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Bolsonaro, deputado federal cassado e filho do ex-presidente Jair Bolsonaro, decidiu não concorrer à eleição de 2026 para o cargo de suplente de candidato ao Senado em São Paulo. Ele foi condenado pelo Supremo Tribunal Federal por coação e ficou inelegível por oito anos.", "titulo_pt": "Eduardo Bolsonaro desiste de concorrer como suplente de candidato ao Senado em SP", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 80268, "titulo": "Prêmio reconhece reportagens sobre envelhecimento e qualidade de vida", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/novo-em-folha/2026/07/premio-reconhece-reportagens-sobre-envelhecimento-e-qualidade-de-vida.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jornalistas podem se inscrever até 25 de setembro de 2026 no Prêmio da Longevidade Bradesco Seguros, que reconhece reportagens sobre envelhecimento e qualidade de vida publicadas entre março de 2025 e setembro de 2026.", "titulo_pt": "Prêmio destaca reportagens sobre envelhecimento e qualidade de vida", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 80266, "titulo": "Pensão alimentícia será recebida de forma automática, via pix", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-07/pensao-alimenticia-sera-recebida-de-forma-automatica-pix", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-07-29T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva sancionou duas leis de proteção às mulheres, incluindo a lei do Pix Pensão que permite o pagamento automático da pensão alimentícia por meio digital. A outra lei determina a divulgação ampla do Ligue 180, serviço de denúncias de violência contra a mulher.", "titulo_pt": "Pensão alimentícia será recebida automaticamente via pix", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 80269, "titulo": "TSE manda big techs explicarem moderação de conteúdo eleitoral, mas permite sigilo sobre dados de IA", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/tse-manda-big-techs-explicarem-moderacao-de-conteudo-eleitoral-mas-permite-sigilo-sobre-dados-de-ia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TSE obrigou as empresas de tecnologia a explicarem como garantirão o cumprimento da legislação sobre propaganda durante as eleições deste ano. A medida visa prevenir a difusão de informações falsas ou descontextualizadas, sem exigir anteriormente comprovação da conformidade das plataformas.", "titulo_pt": "TSE obriga big techs a explicarem moderação de conteúdo eleitoral, mas permite sigilo sobre dados de IA", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 80270, "titulo": "Eduardo Bolsonaro desiste de concorrer e indica aliada como suplente ao Senado em SP", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/eduardo-bolsonaro-desiste-de-concorrer-e-indica-aliada-como-suplente-ao-senado-em-sp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Bolsonaro desistiu de concorrer como suplente na disputa ao Senado por São Paulo e indicou uma aliada para ocupar o lugar. A informação foi publicada em 29/07/2026 às 18h11.", "titulo_pt": "Eduardo Bolsonaro desiste de concorrer e indica aliada como suplente ao Senado em SP", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 80271, "titulo": "Presença de Flávio em convenção de Tarcísio gera mal-estar com Republicanos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/presenca-de-flavio-em-convencao-de-tarcisio-gera-mal-estar-com-republicanos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T21:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A presença de Flávio Bolsonaro no evento da convenção do Republicanos, que será realizada no próximo sábado com Tarcísio de Freitas como cabeça de chapa, está causando mal-estar entre os Republicanos e o PL, partido de Flávio.", "titulo_pt": "Presença de Flávio em convenção de Tarcísio gera mal-estar com Republicanos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 80446, "titulo": "Mesmo fora do TSE, Moraes deve definir até que ponto Bolsonaro pode ser cabo eleitoral", "url": "https://www.jota.info/opiniao-e-analise/colunas/coluna-flavia-maia/mesmo-fora-do-tse-moraes-deve-definir-ate-que-ponto-bolsonaro-pode-ser-cabo-eleitoral", "fonte_id": "jota", "data_pub": "2026-07-29T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF, Alexandre Moraes, ainda pode influenciar a situação legal de Bolsonaro se este for usado como cabo eleitoral com manipulação digital. Qualquer uso indevido da imagem do ex-presidente pode ser considerado deep fake.", "titulo_pt": "Mesmo fora do TSE, Moraes deve definir até que ponto Bolsonaro pode ser cabo eleitoral", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 80272, "titulo": "Lula reclama de corporativismo de juízes e procuradores e prega reforma de instituições", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/07/lula-reclama-de-corporativismo-de-juizes-e-procuradores-e-prega-reforma-de-instituicoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula criticou o corporativismo de juízes e procuradores e afirmou a necessidade de reformar as instituições. As declarações foram dadas durante uma cerimônia em Brasília.", "titulo_pt": "Lula critica corporativismo de juízes e procuradores e defende reforma das instituições", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 80273, "titulo": "Formação em segurança digital para comunicadoras negras recebe inscrições até 25 de setembro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/novo-em-folha/2026/07/formacao-em-seguranca-digital-para-comunicadoras-negras-recebe-inscricoes-ate-25-de-setembro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As inscrições para a edição de 2026 da Rede de Proteção Digital para Comunicadoras Negras na América Latina estão abertas até 25 de setembro. A iniciativa oferece formação em segurança digital, combate à desinformação e apoio jurídico e psicossocial.", "titulo_pt": "Inscrições para formação em segurança digital para comunicadoras negras encerram em 25 de setembro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 80303, "titulo": "Governo vai prorrogar renegociações de dívidas pelo Desenrola Brasil até 31 de agosto", "url": "https://veja.abril.com.br/economia/governo-vai-prorrogar-renegociacoes-de-dividas-pelo-desenrola-brasil-ate-31-de-agosto/", "fonte_id": "veja", "data_pub": "2026-07-29T20:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O programa Desenrola Brasil, que oferece refinanciamento subsidiado pelo governo, terá sua renegociação prorrogada até 31 de agosto. O programa foi anunciado em maio e estava previsto para terminar no início de agosto.", "titulo_pt": "Governo prorroga renegociações de dívidas pelo Desenrola Brasil até 31 de agosto", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 80274, "titulo": "MST defende mudar modelo econômico e taxar o agro em manifesto eleitoral", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/mst-defende-mudar-modelo-economico-e-taxar-o-agro-em-manifesto-eleitoral.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T20:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O MST divulgou um manifesto com 15 pontos na campanha eleitoral, defendendo mudanças no modelo econômico e a tributação do setor agrícola.", "titulo_pt": "MST defende alterar modelo econômico e taxar o agronegócio em manifesto eleitoral", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 79251, "titulo": "Senadores pedem investigação sobre venda de acesso antecipado a posts de Trump no Truth Social", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/senadores-pedem-investigacao-sobre-venda-de-acesso-antecipado-a-posts-de-trump-no-truth-social.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-29T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Senadores democratas dos Estados Unidos pediram uma investigação à SEC sobre o plano de vender acesso antecipado a publicações na rede social Truth Social, que pertence ao ex-presidente Donald Trump.", "titulo_pt": "Senadores pedem investigação sobre venda de acesso antecipado a posts de Trump no Truth Social", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 79285, "titulo": "A indústria de autodifamação do STF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/conrado-hubner-mendes/2026/07/a-industria-de-autodifamacao-do-stf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-29T20:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alguns ministros do STF estão acusando grupos extremistas de serem responsáveis pela crise de autoridade da instituição, negando qualquer ligação entre a má conduta e a recusa em investigar essas práticas dentro do próprio tribunal.", "titulo_pt": "A indústria de autodifamação do STF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 79299, "titulo": "Derrite nega que vá desistir de disputa ao Senado em SP após liderança de Marina e Tebet em pesquisas e pressão no PP", "url": "https://g1.globo.com/sp/sao-paulo/eleicoes/2026/noticia/2026/07/29/derrite-nega-desistir-de-disputa-ao-senado-em-sp-apos-lideranca-de-marina-e-tebet-em-pesquisas-e-pressao-no-pp.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-29T20:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Guilherme Derrite (PP) negou que vá desistir da disputa ao Senado pelo estado de São Paulo. As pesquisas Quaest e Datafolha indicaram que as candidatas Marina Silva (Rede) e Simone Tebet (PSB) lideram a corrida às duas vagas de senador em São Paulo.", "titulo_pt": "Derrite nega desistir da disputa ao Senado em SP após pesquisas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 79973, "titulo": "US and Saudi hit Iran-backed fighters in Iraq", "url": "https://www.taipeitimes.com/News/front/archives/2026/07/30/2003861623", "fonte_id": "taipei_times", "data_pub": "2026-07-30T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças dos Estados Unidos e do Reino Unido atacaram combatentes apoiados pelo Irã emIraq.", "titulo_pt": "Estados unidos e Saudi arábia atacam fighters iranianos no iraque", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 80571, "titulo": "How Trump’s call for Asia-Pacific allies to raise defence spending may backfire on US", "url": "https://www.scmp.com/news/china/military/article/3362301/how-trumps-call-asia-pacific-allies-raise-defence-spending-may-backfire-us?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-29T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Donald Trump exigiu que aliados americanos na Ásia-Pacífico aumentem o gasto em defesa, levantando dúvidas sobre a confiabilidade dos Estados Unidos para deter ameaças como a China e a Coreia do Norte. Essa situação tem incentivado esses países a desenvolver suas próprias indústrias militares, o que pode eventualmente diminuir o domínio americano no comércio mundial de armas.", "titulo_pt": "Requisitos de Trump para aumento do gasto em defesa podem desequilibrar o poder militar", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 80278, "titulo": "Zelensky liga para Macron depois de reunião com Trump", "url": "https://www.poder360.com.br/poder-internacional/zelensky-liga-para-macron-depois-de-reuniao-com-trump/", "fonte_id": "poder360", "data_pub": "2026-07-29T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Zelensky ligou para Macron após reunião com Trump, informando-o sobre as conversas na Casa Branca e agradecendo ajuda à Ucrânia. Os líderes também discutiram incêndios em França.", "titulo_pt": "Zelensky liga para Macron após reunião com Trump", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 80478, "titulo": "El ICE libera a uno de los testigos clave en la muerte del inmigrante mexicano Lorenzo Salgado", "url": "https://elpais.com/us/migracion/2026-07-29/el-ice-libera-a-uno-de-los-testigos-clave-en-la-muerte-del-inmigrante-mexicano-lorenzo-salgado.html", "fonte_id": "elpais_america", "data_pub": "2026-07-29T21:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um juiz federal concedeu 48 horas ao ICE para libertar José Trinidad Rojas, um testemunha-chave na investigação da morte do imigrante mexicano Lorenzo Salgado.", "titulo_pt": "O ICE libera um dos principais testemunhos na morte do imigrante mexicano Lorenzo Salgado", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 80544, "titulo": "Zelensky warns of possible major Russian strike overnight", "url": "https://www.france24.com/en/europe/20260729-zelensky-warns-of-possible-major-russian-strike-overnight", "fonte_id": "france24", "data_pub": "2026-07-29T21:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente ucraniano, Zelensky, advertiu sobre a possibilidade de um ataque russo significativo durante a noite. Kyiv está pedindo apoio adicional em forma de mísseis Patriot interceptores para contrabalançar o aumento nas ataques de foguetes balísticos russos.", "titulo_pt": "Zelensky avisa sobre possível ataque russo noturno", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 80516, "titulo": "EE.UU. insta a Latinoamérica a aumentar el gasto en defensa para reforzar la seguridad en el hemisferio", "url": "https://www.latercera.com/mundo/noticia/eeuu-insta-a-latinoamerica-a-aumentar-el-gasto-en-defensa-para-reforzar-la-seguridad-en-el-hemisferio/", "fonte_id": "la_tercera", "data_pub": "2026-07-29T21:47:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Defesa dos Estados Unidos está incentivando países da América Latina a aumentarem seus gastos com defesa para melhorar a segurança no hemisfério. Segundo Elbridge Colby, subsecretário de Defesa para Assuntos de Política, não há justificativa para que países enfrentando ameaças narcoterroristas investam tão pouco nessa área.", "titulo_pt": "EUA incentiva américa latina a aumentar gastos com defesa", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 80346, "titulo": "Planalto repudia decisão dos EUA de prorrogar sanções contra o Brasil", "url": "https://www.cnnbrasil.com.br/politica/planalto-repudia-decisao-dos-eua-de-prorrogar-sancoes-contra-o-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Palácio do Planalto rejeitou a decisão dos Estados Unidos de manter sanções contra o Brasil. O governo brasileiro se posicionou contrariamente à prorrogação das medidas econômicas impostas pelos EUA.", "titulo_pt": "Planalto repudia decisão dos EUA de prorrogar sanções contra o Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80265, "titulo": "Governo Lula repudia decisão dos EUA em prorrogar sanções e diz ser 'descabido' caracterizar Brasil como ameaça", "url": "https://g1.globo.com/politica/noticia/2026/07/29/governo-lula-repudia-decisao-dos-eua-em-prorrogar-sancoes-e-diz-ser-descabido-caracterizar-brasil-como-ameaca.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-07-29T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula repudiou a decisão dos EUA de prorrogar as sanções contra o Brasil, considerando descabido caracterizar o país como uma ameaça aos Estados Unidos. O anúncio foi feito após os EUA prorrogarem por mais um ano a declaração de emergência nacional em relação ao Brasil.", "titulo_pt": "Governo Lula repudia decisão dos EUA e diz que caracterizar o Brasil como ameaça aos estados unidos é descabido", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 80476, "titulo": "Two Tankers Hit in Apparent Drone Strike in Egypt", "url": "https://www.nytimes.com/2026/07/29/world/middleeast/ships-drone-strike-egypt.html", "fonte_id": "nyt_world", "data_pub": "2026-07-29T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois navios, incluindo um tanque americano de armazenamento de gás, pegaram fogo após uma explosão em um terminal portuário na costa mediterrânea do Egito, conforme informaram empresas de rastreamento marítimo.", "titulo_pt": "Dois tanques são atingidos por suposta atenção com Drone no egito", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 80553, "titulo": "Myanmar court sentences activists to 37 years over election protest", "url": "https://www.aljazeera.com/news/2026/7/29/myanmar-court-sentences-activists-to-37-years-over-election-protest?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-29T21:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove ativistas foram condenados a penas de até 37 anos de prisão por participar da protesto contra as eleições realizadas no mês de dezembro, apoiadas pelo exército.", "titulo_pt": "Juízo condena ativistas a até 37 anos de prisão por protestarem contra eleições militares", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 80576, "titulo": "Can China’s EV boom give it decisive edge in geopolitical tech war?", "url": "https://www.scmp.com/news/china/diplomacy/article/3362313/can-chinas-ev-boom-give-it-decisive-edge-geopolitical-tech-war?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-29T21:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Análises sugerem que a China pode usar sua liderança no setor de veículos elétricos globais como uma forma de influência geopolítica, proporcionando maior controle sobre países dependentes de suas tecnologias e cadeias de suprimentos. Segundo o CEO de Dunne Insights, Michael Dunne, a estratégia chinesa é dominar completamente a indústria para usá-la posteriormente como um meio de pressão.", "titulo_pt": "Poderá a expansão dos veículos elétricos chineses dar à China uma vantagem decisiva na guerra tecnológica geopolítica?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 80475, "titulo": "New Strikes Engulf More Countries in the Iran War", "url": "https://www.nytimes.com/2026/07/29/world/middleeast/iran-war-us-jordan-saudi-iraq.html", "fonte_id": "nyt_world", "data_pub": "2026-07-29T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, ameaçou vingança após a Irã disparar mísseis contra bases militares americanas no Iêmen. Ações de aviões de guerra norte-americanos e sauditas contra milícias afiliadas ao Irã emIraq representaram um novo escalamento das tensões.", "titulo_pt": "Novas ações envolvem mais países na guerra do Irã", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 80555, "titulo": "Trump threatens Iran strikes after attack on US base in Jordan", "url": "https://www.aljazeera.com/video/newsfeed/2026/7/29/trump-threatens-iran-strikes-after-attack-on-us-base-in-jordan?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-29T21:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, ameaçou retaliar contra o Irã após um ataque a forças americanas no Iêmen. Segundo ele, os EUA vão atingir o Irã 'muito duramente'.", "titulo_pt": "Trump ameaça ataques ao Irã após ataque a tropas nos estados unidos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 80357, "titulo": "Trump diz que vai atacar Irã com muita força após interceptação de mísseis", "url": "https://www.cnnbrasil.com.br/internacional/trump-diz-que-vai-atacar-ira-com-muita-forca-apos-interceptacao-de-misseis/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, ameaçou atacar o Irã com grande força após a tentativa de ataque iraniano contra alvos americanos na região.", "titulo_pt": "Trump ameaça atacar Irã com muita força após tentativa de ataque", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80623, "titulo": "Death of 15 elephants in Kenyan national park sparks outrage, investigation", "url": "https://www.washingtonpost.com/world/2026/07/29/death-15-elephants-kenyan-national-park-sparks-outrage-investigation/", "fonte_id": "washington_post_world", "data_pub": "2026-07-29T21:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dezessete elefantes morreram nos últimos trinta dias em um parque nacional da Kenia, levantando preocupações sobre a possibilidade de envenenamento. A morte inesperada desses animais está provocando indignação e motivou uma investigação.", "titulo_pt": "Morte de 17 elefantes em parque nacional da kenia causa indignação e gera investigação", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 80256, "titulo": "Japão tem menos de 120 milhões de japoneses pela primeira vez desde 1984", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/07/japao-tem-menos-de-120-milhoes-de-japoneses-pela-primeira-vez-desde-1984.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-07-29T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Japão registrou seu 17º ano consecutivo de diminuição populacional e agora tem menos de 120 milhões de habitantes, o menor número desde 1984. Este é o menor registro desde então, quando a população ainda estava em crescimento.", "titulo_pt": "Japão atinge marca histórica com menos de 120 milhões de habitantes pela primeira vez desde 1984", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 79971, "titulo": "UBS raises forecast for nation’s GDP to expand 11 percent", "url": "https://www.taipeitimes.com/News/front/archives/2026/07/30/2003861621", "fonte_id": "taipei_times", "data_pub": "2026-07-30T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A UBS elevou sua previsão para o crescimento do PIB do país, projetando um aumento de 11%.", "titulo_pt": "UBS aumenta projeção de crescimento da economia nacional para 11%", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 80275, "titulo": "Dólar cai para R$ 5,10, após juros serem mantidos nos EUA", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/dolar-cai-para-r-510-apos-juros-serem-mantidos-nos-eua", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-29T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar encerrou o pregão em queda, cotado a R$ 5,108, enquanto a bolsa de valores recuou. O Federal Reserve decidiu manter os juros nos Estados Unidos entre 3,50% e 3,75%, com um tom mais moderado do presidente Kevin Warsh e divisão entre os membros da autoridade monetária.", "titulo_pt": "Dólar cai para R$ 5,10 após juros serem mantidos nos EUA", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 80518, "titulo": "Sube la bencina: revisa los valores de los combustibles para los próximos días", "url": "https://www.latercera.com/servicios/noticia/sube-la-bencina-revisa-los-valores-de-los-combustibles-para-los-proximos-dias/", "fonte_id": "la_tercera", "data_pub": "2026-07-29T21:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Empresa Nacional do Petróleo divulgou um relatório semanal sobre as variações dos valores dos combustíveis, que entrarão em vigor a partir desta quinta-feira. Os preços serão revisados nos próximos dias.", "titulo_pt": "Preços da gasolina sobem: confira os novos valores para os próximos dias", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 80456, "titulo": "El Gobierno retiró pesos del mercado en el debut de un nuevo bono dual", "url": "https://www.lanacion.com.ar/economia/el-gobierno-retiro-pesos-del-mercado-en-el-debut-de-un-nuevo-bono-dual-nid29072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-29T21:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Tesouro Nacional colocou no mercado argentino $12,21 bilhões em títulos e conseguiu um rollover de 144,5% sobre as dívidas vencíveis. Além disso, foram colocados outros US$309 milhões do Bonar 2029.", "titulo_pt": "Governo retirou pesos do mercado em debut de novo bono dual", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 80566, "titulo": "Microsoft’s cloud business boosts sales as capex climbs to $41bn", "url": "https://www.ft.com/content/da7c4472-cb30-4b82-b321-d82c1859419e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-29T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas da divisão de nuvem da Microsoft aumentaram 32% para US$ 39,3 bilhões. O gasto em capital subiu para US$ 41 bilhões.", "titulo_pt": "Negócio em nuvem da microsoft impulsiona vendas enquanto gasto em capital atinge us$ 41 bi", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 80444, "titulo": "Infraestrutura digital e capacidade estatal: lições do caso SuperSapiens", "url": "https://www.jota.info/opiniao-e-analise/artigos/infraestrutura-digital-e-capacidade-estatal-licoes-do-caso-supersapiens", "fonte_id": "jota", "data_pub": "2026-07-29T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A indisponibilidade recente do sistema da Advocacia-Geral da União (AGU) ilustra que a infraestrutura digital é uma condição essencial para o exercício das capacidades estatais.", "titulo_pt": "Infraestrutura digital e capacidade estatal: lições do caso SuperSapiens", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 80276, "titulo": "Dívida Pública sobe 2,61% em junho e supera R$ 9,2 trilhões", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-07/divida-publica-sobe-261-em-junho-e-supera-r-92-trilhoes", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-07-29T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Dívida Pública Federal subiu 2,61% em junho e atingiu R$ 9,033 trilhões. O valor superou a marca de R$ 9 trilhões no mês passado.", "titulo_pt": "Dívida Pública sobe 2,61% em junho e ultrapassa R$ 9,2 trilhões", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 80568, "titulo": "Infantino defends $20bn Fifa commercial venture after mounting backlash", "url": "https://www.ft.com/content/b97720c3-b6d7-455e-84ca-1e4339003644?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-29T21:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da entidade governante do futebol mundial defendeu a proposta de vender uma participação na organização para investidores, afirmando que se trata de uma oportunidade e não de uma obrigação. Houve crescente rejeição à ideia.", "titulo_pt": "Presidente da Fifa defende venda de participação para investidores", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 80548, "titulo": "Starbucks stock jumps as coffee giant raises full-year outlook", "url": "https://www.cnbc.com/2026/07/29/starbucks-sbux-q3-2026-earnings.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-29T21:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Starbucks registrou seu quarto trimestre consecutivo de crescimento nas vendas de lojas comparáveis e continua sua recuperação sob a liderança do CEO Brian Niccol.", "titulo_pt": "Ações da starbucks avançam com perspectiva anual melhorada pela gigante do café", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 80389, "titulo": "Treasuries de 30 anos atingem maior nível desde 2007 após Fed manter juros", "url": "https://www.infomoney.com.br/mercados/treasuries-de-30-anos-atingem-maior-nivel-desde-2007-apos-fed-manter-juros/", "fonte_id": "infomoney", "data_pub": "2026-07-29T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A taxa dos títulos do Tesouro de 30 anos atingiu o nível mais alto desde 2007 após a decisão do Federal Reserve (Fed) manter os juros básicos entre 3,5% e 3,75%. A probabilidade de uma alta nos juros em setembro aumentou para 60%, com três membros do Fed votando pela elevação.", "titulo_pt": "Títulos do tesouro de 30 anos atingem nível mais alto desde 2007 após manutenção dos juros pelo Fed", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 80550, "titulo": "Qualcomm to raise prices during memory crunch as chipmaker issues light earnings guidance", "url": "https://www.cnbc.com/2026/07/29/qualcomm-qcom-earnings-report-q3-2026-.html", "fonte_id": "cnbc_international", "data_pub": "2026-07-29T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Qualcomm planeja aumentar os preços devido a um aumento nos custos, conforme declarado pelo CEO Cristiano Amon. A empresa ofereceu uma perspectiva de lucros moderada.", "titulo_pt": "Qualcomm vai aumentar os preços durante escassez de memória e oferece perspectiva de lucros leve", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 80354, "titulo": "Bitcoin opera em alta após decisão do Fed e à espera de balanços tech", "url": "https://www.cnnbrasil.com.br/economia/mercado/bitcoin-opera-em-alta-apos-decisao-do-fed-e-a-espera-de-balancos-tech/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Bitcoin operou em alta, subindo 0,73%, enquanto o Ethereum registrou uma leve baixa de 0,03%. As moedas estavam sendo negociadas após a decisão do Fed e à espera dos balanços das empresas tecnológicas.", "titulo_pt": "Bitcoin opera em alta após decisão do Fed e à espera de balanços tech", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80355, "titulo": "Fórum E-Commerce Brasil movimenta R$ 21,2 milhões em 2 horas de negócios", "url": "https://www.cnnbrasil.com.br/economia/negocios/forum-e-commerce-brasil-movimenta-r-212-milhoes-em-2-horas-de-negocios/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Fórum E-Commerce Brasil gerou uma movimentação de R$ 21,2 milhões em apenas duas horas de negócios. O evento reuniu 11 empresas patrocinadoras e 30 compradoras conectadas com base nos seus interesses e demandas.", "titulo_pt": "Fórum E-Commerce Brasil movimenta R$ 21,2 milhões em 2 horas de negócios", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80258, "titulo": "Polêmico carro elétrico da Ferrari alcança meta de vendas de 2026 em dois meses", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/polemico-carro-eletrico-da-ferrari-alcanca-meta-de-vendas-de-2026-em-dois-meses.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-29T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Ferrari atingiu a meta de vendas para o seu primeiro carro elétrico, o Luce, apenas dois meses após o lançamento. O sucesso foi impulsionado pela forte demanda da China, apesar do design controverso que gerou reações negativas.", "titulo_pt": "Ferrari alcança meta de vendas do luce em dois meses", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 80259, "titulo": "CVM adia assembleia da Emae que decidiria incorporação pela Sabesp", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/cvm-adia-assembleia-da-emae-que-decidiria-incorporacao-pela-sabesp.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-29T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CVM adiou por 30 dias a assembleia da Emae, que decidiria sobre a incorporação pela Sabesp. A reunião originalmente estava marcada para esta quinta-feira (30).", "titulo_pt": "CVM adia assembleia da Emae que decidiria incorporação pela Sabesp", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 80260, "titulo": "Agência reguladora propõe liminar contra norma de portos da Bahia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/07/agencia-reguladora-propoe-liminar-contra-norma-de-portos-da-bahia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-29T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diretoria da Antaq propôs uma medida cautelar para suspender a exigência de relatório de gestão ambiental portuária de água de lastro pela Codeba, atendendo a um pedido da Centronave e da ABAC. A decisão visa autorizar a atracação de navios sem essa exigência temporariamente.", "titulo_pt": "Agência reguladora sugere liminar contra norma de portos da Bahia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 79977, "titulo": "Thunder Tiger, Shield AI demonstrate mission autonomy software", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/07/30/2003861633", "fonte_id": "taipei_times", tarefas em nome dos usuários. Durante o chamado financeiro do segundo trimestre de 2026, o CEO Mark Zuckerberg deu um vislumbre dessa estratégia.", "titulo_pt": "Mark Zuckerberg planeja uma grande investida em agentes pessoais de IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 80582, "titulo": "Qualcomm is raising phone chip prices starting September 1st", "url": "https://www.theverge.com/tech/972894/qualcomm-price-hikes-q2-2026-earnings", "fonte_id": "the_verge", "data_pub": "2026-07-29T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Qualcomm está aumentando os preços dos seus processadores a partir do dia 1º de setembro. De acordo com o CEO Cristiano Amon, as novas tarifas serão aplicadas em todos os produtos da empresa.", "titulo_pt": "Qualcomm vai aumentar os preços dos seus processadores a partir de 1º de setembro", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 80575, "titulo": "In an era defined by AI, can work still be measured by the clock?", "url": "https://www.scmp.com/opinion/asia-opinion/article/3361805/era-defined-ai-can-work-still-be-measured-clock?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-29T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Hwaseong, Coreia do Sul, após a meia-noite, um engenheiro está totalmente imerso no trabalho, detectando uma falha que evita desperdício de wafers. No entanto, ele precisa se retirar conforme exigido pela lei. A chegada da inteligência artificial está gradualmente redefinindo o valor do tempo dele fora das instalações.", "titulo_pt": "Na era dominada por IA, a still pode ser medida pelo relógio?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 80351, "titulo": "Limite da IA: empresas de tecnologia pedem que EUA freiem modelos avançados", "url": "https://www.cnnbrasil.com.br/tecnologia/limite-da-ia-empresas-de-tecnologia-pedem-que-eua-freiem-modelos-avancados/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas de tecnologia como OpenAI e Anthropic apoiaram uma iniciativa que pede aos Estados Unidos para frear o desenvolvimento de modelos avançados de inteligência artificial.", "titulo_pt": "Limite da IA: empresas de tecnologia apoiam pedido para frear modelos avançados nos EUA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80352, "titulo": "Após Brasil, Google anuncia verificação de idade para o mundo todo", "url": "https://www.cnnbrasil.com.br/tecnologia/apos-brasil-google-anuncia-verificacao-de-idade-para-o-mundo-todo/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Google anunciou a verificação de idade para seus serviços em todo o mundo, incluindo no Brasil. Este recurso faz parte das exigências do ECA Digital.", "titulo_pt": "Google anuncia verificação de idade global após Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80586, "titulo": "Discover what’s next for AI, from the SaaS reckoning to the agent security gap, at TechCrunch Disrupt 2026", "url": "https://techcrunch.com/2026/07/29/discover-whats-next-for-ai-from-the-saas-reckoning-to-the-agent-security-gap-at-techcrunch-disrupt-2026/", "fonte_id": "techcrunch", "data_pub": "2026-07-29T21:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No TechCrunch Disrupt 2026, o palco dedicado à Inteligência Artificial (IA) retornará para explorar o tema mais quente da comunidade nos últimos anos, apresentado pela Google for Startups.", "titulo_pt": "Descubra o que vem por aí na IA, do questionamento sobre os serviços como software à lacuna de segurança dos agentes, no TechCrunch Disrupt 2026", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 80587, "titulo": "Thinking Machines co-founder Lilian Weng left the company citing health reasons, then joined O clusivo da China", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 80532, "titulo": "Resultados de la matriz de Facebook e Instagram decepcionan al mercado y acciones caen con fuerza", "url": "https://www.latercera.com/pulso/noticia/resultados-de-la-matriz-de-facebook-e-instagram-decepcionan-al-mercado-y-acciones-caen-con-fuerza/", "fonte_id": "la_tercera", "data_pub": "2026-07-29T21:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os resultados financeiros do segundo trimestre da matriz da Facebook e Instagram decepcionaram o mercado, com as projeções para este trimestre também ficando abaixo das expectativas.", "titulo_pt": "Resultados financeiros da matriz Facebook e Instagram decepcionam mercado", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 80588, "titulo": "Winamp aims for a comeback with a new music player powered by Deezer", "url": "https://techcrunch.com/2026/07/29/winamp-aims-for-a-comeback-with-a-new-music-player-powered-by-deezer/", "fonte_id": "techcrunch", "data_pub": "2026-07-29T21:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Winamp está preparando um relançamento com um serviço premium de música baseado no Deezer e uma nova aplicação all-in-one, apostando na sua marca nostálgica para se destacar em um mercado de streaming cada vez mais concorrido.", "titulo_pt": "Winamp busca retorno com novo player de música alimentado pelo Deezer", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 80366, "titulo": "Após ataque hacker, CEO da OpenAI discute novos modelos de IA nos EUA", "url": "https://www.cnnbrasil.com.br/tecnologia/apos-ataque-hacker-ceo-da-openai-discute-novos-modelos-de-ia-nos-eua/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da OpenAI, Sam Altman, discutiu com senadores os novos modelos de IA após um incidente de segurança recente.", "titulo_pt": "CEO da OpenAI fala c Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 79668, "titulo": "Rural America’s Maternal-Health Crisis Is About to Get Much Worse", "url": "https://www.theatlantic.com/ideas/2026/07/giving-birth-rural-hospitals-danger-mortality/688091/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-07-29T11:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A situação de saúde materna no interior dos Estados Unidos ficará ainda mais crítica, com menor oferta de cuidados, distâncias maiores para deslocamentos e situações de alto risco mais propensas a ter resultados trágicos.", "titulo_pt": "A crise maternal do interior dos EUA vai agravar", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 78680, "titulo": "Desde Atacama hasta Magallanes: cuáles son las 13 regiones chilenas bajo alerta sanitaria por hantavirus tras 18 muertes", "url": "https://www.lanacion.com.ar/sociedad/desde-atacama-hasta-magallanes-cuales-son-las-13-regiones-chilenas-bajo-alerta-sanitaria-por-nid29072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-29T11:24:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Saúde do Chile implementou uma alerta sanitária para 13 regiões, incluindo Atacama e Magallanes, devido a um aumento na letalidade do hantavirus, que chegou a 39% dos casos. A medida também prevê precauções contra influenza aviar e dengue e será válida até julho de 2027.", "titulo_pt": "Das Atacama às Magallanes: quais são as 13 regiões chilenas sob alerta sanitário por hantavirus após 18 mortes", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 78554, "titulo": "Três pessoas são mortas a tiros dentro de fazenda em Goiás", "url": "https://www.metropoles.com/distrito-federal/na-mira/tres-pessoas-sao-mortos-a-tiros-dentro-de-fazenda-em-goias", "fonte_id": "metropoles", "data_pub": "2026-07-29T11:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Três pessoas foram o apoio comunitário para essas tecnologias.", "titulo_pt": "Austrália valoriza baterias e veículos elétricos, mas setor de renováveis precisa ganhar confiança das regiões", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 79656, "titulo": "Bird flu is spreading locally and Australia faces more wildlife deaths. How bad could it get?", "url": "https://www.theguardian.com/world/2026/jul/30/bird-flu-australia-h5n1-how-will-it-affect-wildlife", "fonte_id": "guardian_world", "data_pub": "2026-07-29T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades confirmaram a transmissão local do vírus da gripe aviária H5N1 entre aves na Austrália do Sul, indicando um novo estágio no enfrentamento à infecção. O ministério da Agricultura, Pesca e Floresta anunciou 11 novas detecções suspeitas.", "titulo_pt": "Gripe aviária h5n1 se espalha localmente na austrália do sul; país entra em nova fase", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 80131, "titulo": "World falling short on 22 of 23 nature targets for 2030, says draft UN report", "url": "https://www.carbonbrief.org/world-falling-short-on-22-of-23-nature-targets-for-2030-says-draft-un-report", "fonte_id": "carbon_brief", "data_pub": "2026-07-29T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório preliminar da ONU indica que o mundo não atingirá 22 de seus 23 objetivos ambientais para 2030. A meta global de conter e revertar a perda da natureza até 2030 não será alcançada a menos que as ações dos países se acelerem.", "titulo_pt": "Mundo falha em 22 de 23 objetivos ambientais para 2030, diz relatório preliminar da ONU", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 80132, "titulo": "Climate change is driving a ‘shift’ in childhood malaria risk across Africa", "url": "https://www.carbonbrief.org/climate-change-is-driving-a-shift-in-childhood-malaria-risk-across-africa", "fonte_id": "carbon_brief", "data_pub": "2026-07-29T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As altas temperaturas estão redistribuindo o risco de malária infantil na África subsaariana, criando áreas de 'novo risco'. Este fenômeno é impulsionado pelo aquecimento global.", "titulo_pt": "Mudanças climáticas estão provocando uma 'relocalização' do risco de malária infantil na áfrica subsaariana", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 79961, "titulo": "15 elephants die from suspected poisoning in Kenyan park", "url": "https://www.scmp.com/news/world/africa/article/3362295/15-elephants-die-suspected-poisoning-kenyan-park?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-29T13:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ao menos 15 elefantes morreram devido a uma suspeita de intoxicação no Parque Nacional Amboseli, na região sul do Quênia, entre 24 de junho e 24 de julho. O Serviço de Vida Selvagem da Quênia (KWS) relatou que 10 dos animais apresentavam sintomas semelhantes.", "titulo_pt": "Pelo menos 15 elefantes morrem por suspeita de intoxicação em parque nacional do quênia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 79855, "titulo": "France veterinary team treats pets of wildfire evacuees", "url": "http://www.euronews.com/video/2026/07/29/france-veterinary-team-treats-pets-of-wildfire-evacuees", "fonte_id": "euronews", "data_pub": "2026-07-29T12:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de veterinários francês em Bordeaux está cuidando dos animais domésticos dos evacuados das chamas no Gironde, fornecendo comida, tratamento e apoio enquanto as famílias aguardam para retornar para suas casas.", "titulo_pt": "Equipe veterinária francesa auxilia pets de evacuados por incêndios no gironde", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 79964, "titulo": "France battles wildfire 4 times the size of Paris", "url": "https://www.scmp.com/news/world/europe/article/3362292/france-battles-wildfire-4-times-size-paris?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-29T12:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogoiros lutavam contra um incêndio florestal não controlado na região sudoeste da França, cuja área era quatro vezes maior que Paris. As temperaturas previstas chegariam a 40 graus Celsius, o que poderia reativar focos de calor oculto e espalhar cinzas além das áreas protegidas.", "titulo_pt": "França enfrenta incêndio quatro vezes maior que Paris", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 80133, "titulo": "Q&A: What does China’s 15th ‘five-year plan’ for renewables mean for climate change?", "url": "https://www.carbonbrief.org/qa-what-does-chinas-15th-five-year-plan-for-renewables-mean-for-climate-change", "fonte_id": "carbon_brief", "data_pub": "2026-07-29T12:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China lançou seu '15º plano quinquenal para o desenvolvimento de energias renováveis', detalhando metas e políticas importantes. O documento visa orientar os esforços de desenvolvimento de energia renovável do país nos próximos cinco anos.", "titulo_pt": "Perguntas e respostas: qual é o significado do '15º plano quinquenal para renovaáveis' chinês para as mudanças climáticas?", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 78610, "titulo": "Sob alerta de chuva e ventos, Defesa Civil ativa Gabinete de Crise em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/sob-alerta-de-chuva-e-ventos-defesa-civil-ativa-gabinete-de-crise-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-29T10:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Defesa Civil de São Paulo ativou o Gabinete de Crise nesta quarta-feira (29) e manterá a operação na quinta-feira (30) para m const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>

           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}
