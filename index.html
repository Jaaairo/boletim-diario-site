Xi Jinping reforçando a presença chinesa durante a cúpula da Cooperação Econômica Ásia-Pacífico em Shenzhen. Em outro desenvolvimento, o CEO da Nvidia, Jensen Huang, enfrenta desinformação gerada por inteligência artificial, incluindo gravações falsas e perfis falsos, após sua demissão por suspeitas de espionagem chinesa.\n\nO secretário interino da Marinha dos EUA, Hung Cao, pressionou os congressistas americanos para fortalecer a capacidade de construção naval, sugerindo que navios de construção de aliados como Coreia do Sul e Japão poderiam auxiliar na reconstrução dos estaleiros americanos. Em outro desenvolvimento, o Reino Unido transferiu um soldado americano acusado de espionagem para a Rússia, conforme protocolos internacionais, para o controle dos EUA. O Irã acusou os Estados Unidos de realizar ataques em uma ilha no Estreito de Ormuz, enquanto o Pentágono confirmou que caças dos EUA atacaram uma base iraniana em Qeshm, no Estreito de Ormuz, em resposta a uma suposta 'agressão' do Irã. Em meio a essas tensões, o preço do petróleo encerrou em alta após ataques a petroleiros no Estreito de Ormuz. A China sediou a 33ª reunião de líderes da APEC em Shenzhen, buscando expandir a integração no Pacífico, enquanto o governo chinês anunciou que adotará contramedidas após restrições dos EUA a chips.", "economia": "As notícias desta edição abordam diversos aspectos da economia, destacando-se a reunião entre Xi Jinping e Donald Trump, que discutiram questões comerciais e tecnológicas. Durante a reunião, o presidente-executivo do Baidu alertou para o risco de uma bolha na indústria de inteligência artificial (IA), antes que Trump assumisse a presidência. Em outro desenvolvimento, o Deutsche Bank, um dos maiores bancos da Alemanha, enfrenta acusações de má conduta, com documentos revelando conexões entre empresas de Trump e esquemas de lavagem de dinheiro. Ainda sobre a IA, a Nvidia anunciou mudanças em seu relatório financeiro, deixando de divulgar vendas no Singapura, e a Amazon e o Google adquiriram juntos mais de 28% das ações da Anthropic após o IPO da empresa, refletindo o boom na tecnologia de IA. As bolsas da Europa caíram após novas restrições dos EUA a exportações de chips, com especial impacto no FTSE 100. Além disso, o governo Lula analisa o impacto de restrições dos EUA sobre a importação de chips de IA, enquanto o Banco Central do Brasil enfrenta questionamentos sobre sua resolução 522. O Ibovespa incluirá ações de empresas brasileiras listadas no exterior a partir de 2027, e o Sistema Financeiro apresentou um recurso ao STF questionando a decisão do TST sobre indenização por previdência complementar. O ministro da Fazenda, Fernando Haddad, prevê um impacto limitado da reforma tributária na inflação, mas o governo ainda analisa o efeito de restrições dos EUA sobre a importação de chips de IA.", "tecnologia": "As últimas notícias na área de tecnologia abordam diversos aspectos, desde restrições comerciais até avanços em inteligência artificial. Os Estados Unidos impuseram restrições a chips avançados para a China, visando limitar a tecnologia nesse país. A Nvidia formou uma comissão de controle de exportação após as novas regulamentações e registrou um faturamento de US$ 115,8 bilhões no primeiro trimestre, o dobro em comparação com o trimestre anterior, impulsionada pela venda do chip Vera Rubin. Além disso, a empresa anunciou que seu agente de inteligência artificial Spark será relançado como 'Tasks' e tornado gratuito para uso. A Microsoft lançou uma nova família de inteligências artificiais voltadas para a cibersegurança, enquanto a Pax, empresa brasileira de IA, ingressou em um programa restrito da OpenAI. O sudoeste dos Estados Unidos gerou 28% menos eletricidade através da hidrelétrica entre abril e agosto do que a média de 10 anos, de acordo com novos dados do Administrador de Informações Energéticas dos EUA. O CEO da Nvidia, Jensen Huang, declarou que estaria 'honorado' em retornar à empresa.", "ciencia": "A NASA e o CDC (Centro para o Controle e Prevenção de Doenças) são os principais assuntos científicos desta edição. O CDC alerta sobre o aumento dos riscos de doenças devido às mudanças climáticas, enfatizando a necessidade de monitoramento constante. Por outro lado, a NASA está se preparando para a 35ª missão de suprimentos da Estação Espacial Internacional. Além disso, a agência compartilha um álbum de sons de estrelas jovens, investiga a biologia espacial e prepara-se para lançar as primeiras imagens do Telescópio Nancy Grace Roman. Outros temas abordados incluem a perda do status de eliminação da rubéola nos Estados Unidos, a investigação sobre o uso de infinitesimais no cálculo e a discussão sobre a criação de empresas de plataforma AI focadas em saúde humana e planeta no Reino Unido.", "cultura": "O Papa Leão XIV, após uma visita a Argentina, Uruguai e Peru, enfatizou a importância de superar a polarização social e econômica, pedindo que líderes como Javier Milei se preocupem mais com os necessitados. Durante sua volta a Roma, a visita do Pontífice também levantou questões sobre a liberdade de expressão e mobilizou a comunidade internacional para pressionar as autoridades do Irã a libertarem o cineasta iraniano Jafar Panahi, que enfrenta perseguições judiciais. Em outro destaque cultural, a feira de arte TEFAF Maastricht anunciou sua programação para 2027, com a participação de 277 galerias de 11 países, incluindo representantes de Europa, América do Norte, América do Sul, Oriente Médio e Ásia, prometendo uma ampla variedade de obras de arte para os visitantes.", "sociedade": "Os artigos abordam diversos aspectos da sociedade. Destaque para o caso dos irmãos gêmeos Bruno e Thiago Paiva, acusados de estupro após uma festa em Minas Gerais. O caso gerou comentários do grupo Vou Zuar, que se declarou contra qualquer forma de violência. Em outro evento, a Prefeitura do Rio de Janeiro ampliou o público elegível para a vacinação contra o Mpox, estendendo a imunização de forma escalonada. A sociedade também enfrenta questões relacionadas à segurança, como o caso de um trabalhador terceirizado da Neoenergia que morreu após sofrer um choque elétrico em São Sebastião. Além disso, a PAHO pediu aos países para intensificarem esforços para prevenir surtos de sarampo e trabalharem para eliminá-lo nas Américas. Outros temas abordados incluem a discussão sobre a contagem de férias, a brecha salarial na Austrália, e a preocupação com a possibilidade de fraude usando inteligência artificial em exames de admissão à universidade no Japão.", "meio_ambiente": "A COP31, realizada em Belém, discutiu a transição energética justa e financiamento para proteger oceanos e florestas, reunindo ministros, cientistas e lideranças indígenas. O evento abordou investimentos, direitos territoriais e cooperação internacional. No Brasil, o governo do Distrito Federal aprovou um plano de enfrentamento ao El Niño, prevendo temperaturas acima da média e aumentando o risco de doenças como dengue, chikungunya e zika. O preço do tomate aumentou significativamente em várias capitais brasileiras devido a condições climáticas que afetaram a produção, com altas de 181% em Florianópolis e 174% no Rio de Janeiro. Além disso, um sistema foi apresentado para evitar que toneladas de lixo cheguem ao Rio Riachuelo, focando em embalagens plásticas e resíduos flutuantes. O ranking QS de sustentabilidade mostrou que oito das onze universidades do país tiveram posições reduzidas, com a Universidade Austral sendo a única a melhorar sua posição. Por fim, o Carbon Brief revelou que Rússia, Arábia Saudita e Austrália foram os maiores exportadores de dióxido de carbono em toda a história, com base em um relatório do Carbon Brief.", "direitos_humanos": "O Peru aprovou uma legislação inovadora que concede direitos legais a mais de 175 espécies de insetos nativos, incluindo as abelhas sem ferrão, para protegê-las contra desmatamento, pesticidas e mudanças climáticas. Em outro desenvolvimento, o Brasil enfrenta um julgamento na Corte Interamericana de Direitos Humanos (CIDH) por negar uma cirurgia de redesignação sexual a uma mulher trans, em um caso que marcará a primeira sentença da corte sobre o tema. A situação de direitos humanos no Gaza é alarmante, com um membro da Comissão de Inquérito das Nações Unidas afirmando que Israel está alvo de ataques de crianças em Gaza, apesar de um suposto cessar-fogo. Além disso, a China demitiu um pesquisador após ele ocultar a morte de uma menina durante um teste genético, enquanto o Irã intensifica suas operações ocultas e ameaças na Europa, buscando dissuadir o apoio aos Estados Unidos."}, "resumo_do_dia": {"politica_nacional": [{"id": 270546, "titulo": "Decreto que regulamenta escala 5x2 será assinado quinta-feira", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/decreto-que-regulamenta-escala-5x2-sera-assinado-quinta-feira", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-17T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva assinará o decreto que regulamenta a escala de trabalho 5x2 na próxima quinta-feira (19) às 9h. O decreto estabelece que a nova escala entrará em vigor a partir de 16 de dezembro.", "titulo_pt": "Decreto que regulamenta escala 5x2 será assinado nesta quinta-feira", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 270550, "titulo": "Aneel forma maioria para recomendar a antecipação do fim do contrato de concessão da Enel em SP", "url": "https://g1.globo.com/sp/sao-paulo/noticia/2026/11/17/aneel-forma-maioria-para-recomendar-o-encerramento-antecipado-da-concessao-da-enel-em-sp.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-17T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diretoria da Agência Nacional de Energia Elétrica (Aneel) formou maioria para recomendar o encerramento antecipado da concessão da Enel Distribuição São Paulo. Após a avaliação, o documento será encaminhado ao Ministério de Minas e Energia (MME) para decisão final.", "titulo_pt": "Aneel forma maioria para recomendar antecipação do fim do contrato de concessão da Enel em SP", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 270649, "titulo": "PGR defende prorrogar investigação sobre financiamento do filme Dark Horse", "url": "https://www.metropoles.com/colunas/manoela-alcantara/pgr-defende-prorrogar-investigacao-sobre-financiamento-do-filme-dark-horse", "fonte_id": "metropoles", "data_pub": "2026-11-17T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República (PGR) concordou com o pedido da Polícia Federal (PF) para prorrogar as investigações sobre o financiamento do filme 'Dark Horse' e a possível atuação de Flávio Bolsonaro nesse processo.", "titulo_pt": "PGR concorda com prorrogação das investigações sobre financiamento do filme 'Dark Horse'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 270561, "titulo": "Lula vai às redes defender que 'plano Moretti' não terá cortes para conter insatisfação na esquerda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/lula-vai-as-redes-defender-que-plano-moretti-nao-tera-cortes-para-conter-insatisfacao-na-esquerda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T21:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula gravará um vídeo em apoio às medidas de ajuste fiscal de seu governo, visando tranquilizar setores do PT e da esquerda que se opõem ao projeto. A bancada petista está dividida, com uma ala que votou contra as medidas para economizar até R$ 60 bilhões em 2027.", "titulo_pt": "Lula grava vídeo em defesa do 'plano Moretti' sem cortes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 270551, "titulo": "'Dark Horse': PGR concorda com pedido para prorrogar inquérito sobre financiamento do filme", "url": "https://g1.globo.com/politica/noticia/2026/11/17/caso-dark-horse-pgr-diz-ao-stf-que-apoia-prorrogar-inquerito-por-90-dias.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-17T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República concordou com a prorrogação do inquérito que investiga o financiamento do filme Dark Horse, que aborda a história do ex-presidente Jair Bolsonaro, por 90 dias. O pedido foi encaminhado ao ministro André Mendonça, do Supremo Tribunal Federal, relator do caso.", "titulo_pt": "PGR concorda com prorrogação do inquérito sobre financiamento do filme dark Horse", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 270539, "titulo": "Deputado do PL lança candidatura à presidência da Câmara em oposição a Motta", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/deputado-do-pl-lanca-candidatura-a-presidencia-da-camara-em-oposicao-a-motta.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-17T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Luiz Philippe de Orléans e Bragança, do Partido Liberal (PL) de São Paulo, anunciou sua candidatura à presidência da Câmara dos Deputados em 2027. A candidatura será feita em oposição ao atual presidente da Câmara, Arthur Lira.", "titulo_pt": "Deputado do PL anuncia candidatura à presidência da Câmara em 2027", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 270587, "titulo": "Brasil simplifica exportação de cosméticos para América Latina", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/brasil-simplifica-exportacao-de-cosmeticos-para-america-latina", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-17T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal simplificou a exportação de cosméticos para a América Latina através de um decreto que internaliza o acordo da Aladi. A medida visa reduzir a burocracia e facilitar as exportações brasileiras de higiene pessoal, perfumaria e cosméticos.", "titulo_pt": "Brasil simplifica exportação de cosméticos para América Latina", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 270709, "titulo": "Cleitinho se encontra com Jorge Messias para debater dívida de MG com União", "url": "https://www.cnnbrasil.com.br/politica/cleitinho-se-encontra-com-jorge-messias-para-debater-divida-de-mg-com-uniao/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-17T20:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Minas Gerais possui uma dívida de aproximadamente R$ 170 bilhões com o governo federal e está buscando um acordo específico para renegociar esse montante. O encontro entre Cleitinho e Jorge Messias foi para discutir essa questão.", "titulo_pt": "Cleitinho se reúne com Jorge Messias para discutir dívida de minas gerais com União", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 270540, "titulo": "PF conclui inquérito sobre respiradores para Covid não entregues e exclui Rui Costa e esposa", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/pf-conclui-inquerito-sobre-respiradores-para-covid-nao-entregues-e-exclui-rui-costa-e-esposa.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-17T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal concluiu o inquérito sobre a compra de respiradores não entregues durante a pandemia de Covid-19, excluindo Rui Costa e sua esposa do caso. O ex-governador da Bahia, atual senador eleito e ex-ministro da Casa Civil, não está mais envolvido no processo.", "titulo_pt": "PF conclui inquérito sobre respiradores não entregues e exclui Rui Costa e esposa", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 270749, "titulo": "Taxas dos DIs recuam com ajuste fiscal e novo governo Lula no radar", "url": "https://www.infomoney.com.br/mercados/taxas-dos-dis-recuam-com-ajuste-fiscal-e-novo-governo-lula-no-radar/", "fonte_id": "infomoney", "data_pub": "2026-11-17T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As taxas dos DIs recuaram devido ao ajuste fiscal e ao novo governo Lula no radar. O presidente da Câmara, Hugo Motta, afirmou que a proposta de ajuste fiscal deve ser votada ainda na terça-feira.", "titulo_pt": "Taxas dos DIs caem com ajuste fiscal e novo governo Lula no horizonte", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 270541, "titulo": "Folha abre vaga de estágio na editoria de Treinamento", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/novo-em-folha/2026/11/folha-abre-vaga-de-estagio-na-editoria-de-treinamento.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-17T20:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Folha de São Paulo oferece uma vaga de estágio na editoria de Treinamento, Seminários e Especiais. Os produtos desta área incluem a coluna Novo em Folha, o RUF (Ranking Universitário Folha) e o Programa de Treinamento em Jornalismo.", "titulo_pt": "Folha abre vaga de estágio na editoria de Treinamento", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 270564, "titulo": "Coaf em 2027 usará IA e dará retorno a bancos sobre uso de informações contra lavagem de dinheiro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/coaf-em-2027-usara-ia-e-dara-retorno-a-bancos-sobre-uso-de-informacoes-contra-lavagem-de-dinheiro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Coaf planeja reformular seus sistemas de notificação para 2027, implementando inteligência artificial e fornecendo retorno aos bancos sobre o uso de informações contra lavagem de dinheiro. Isso foi anunciado pelo presidente do Coaf, Ricardo Saadi, durante um evento da Febraban.", "titulo_pt": "Coaf em 2027 usará IA e dará retorno a bancos sobre uso de informações contra lavagem de dinheiro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 270565, "titulo": "Senado adia votação de destaques do 'plano Moretti' de ajuste nas contas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/senado-adia-votacao-de-destaques-do-plano-moretti-de-ajuste-nas-contas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T20:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado adiou a votação de quatro possíveis mudanças no projeto de ajuste fiscal apresentado pelo governo Lula, conhecido como 'plano Moretti'. A proposta visa equilibrar as contas públicas com medidas de contenção de despesas e aumento de receitas, com um impacto estimado de R$ 46 bilhões a R$ 56 bilhões no Orçamento de 2027.", "titulo_pt": "Senado adia votação de destaques do 'plano Moretti' de ajuste nas contas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 270552, "titulo": "Senado adia votação de destaques ao projeto de ajuste fiscal do governo para quarta-feira", "url": "https://g1.globo.com/politica/noticia/2026/11/17/senado-adia-votacao-de-destaques-ao-projeto-de-ajuste-fiscal-do-governo-para-quarta-feira.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-17T20:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado adiou a votação das propostas de mudanças no projeto de lei do ajuste fiscal para a próxima quarta-feira (18). A sessão prevista para esta terça-feira (17) não ocorreu devido à falta de acordo entre os senadores sobre quais propostas deveriam ser aprovadas ou rejeitadas.", "titulo_pt": "Senado adia votação de destaques ao projeto de ajuste fiscal do governo para quarta-feira", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 270553, "titulo": "Senado aprova R$ 13,5 bilhões em crédito a exportadores afetados por tarifas e guerras", "url": "https://g1.globo.com/politica/noticia/2026/11/17/senado-aprova-mp-que-libera-r-135-bilhoes-em-credito-a-exportadores-afetados-por-tarifas-e-guerras.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-17T20:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado Federal aprovou a medida provisória que cria o programa Brasil Soberano 3, destinado a auxiliar exportadores afetados por tarifas e pela guerra no Oriente Médio. Agora, a proposta segue para sanção presidencial.", "titulo_pt": "Senado aprova R$ 13,5 bilhões em crédito para exportadores afetados por tarifas e guerra", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 270637, "titulo": "Simone Tebet: uma aliada de mil e uma utilidades", "url": "https://veja.abril.com.br/politica/simone-tebet-uma-aliada-de-mil-e-uma-utilidades/", "fonte_id": "veja", "data_pub": "2026-11-17T20:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ex-ministra Simone Tebet tem uma ampla gama de possíveis cargos disponíveis para ela, indicando o alto prestígio que ela detém junto ao presidente Lula.", "titulo_pt": "Simone Tebet: uma aliada de mil e uma utilidades", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 270548, "titulo": "Lula diz que Irã não tem interesse em construir bomba nuclear", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/11/lula-diz-que-ira-nao-tem-interesse-em-construir-bomba-nuclear.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-11-17T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula afirmou que o Irã não tem interesse em construir uma bomba nuclear e que os Estados Unidos estariam 'inventando história' para justificar ataques a outros países. Essa declaração foi dada durante uma conversa com o premiê da Espanha, Pedro Sánchez, e foi publicada nas redes sociais do espanhol.", "titulo_pt": "Lula afirma que Irã não tem interesse em bomba nuclear e critica estados unidos", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 270875, "titulo": "Matan Kahana Elected Speaker of Israel’s Parliament", "url": "https://www.nytimes.com/2026/11/17/world/middleeast/israel-opposition-selects-parliamentary-speaker.html", "fonte_id": "nyt_world", "data_pub": "2026-11-17T21:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Matan Kahana foi eleito speaker do parlamento israelense. Como speaker, ele supervisionará o processo legislativo enquanto a oposição busca pressionar o primeiro-ministro Benjamin Netanyahu em vários aspectos.", "titulo_pt": "Matan Kahana eleito Speaker do parlamento de Israel", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 270980, "titulo": "Israel parliament elects Eisenkot ally as parliament speaker in blow for Netanyahu", "url": "https://www.lemonde.fr/en/international/article/2026/11/17/israel-parliament-elects-eisenkot-ally-as-parliament-speaker-in-blow-for-netanyahu_6782833_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-17T21:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O parlamento israelense elegeram Matan Kahana, aliado de Gadi Eisenkot, como presidente da câmara. Kahana tem até o mês seguinte para formar um governo que substitua Benjamin Netanyahu e está previsto que comece a desfazer a agenda de Netanyahu a partir da próxima sexta-feira.", "titulo_pt": "Parlamento israelense elege aliado de Eisenkot como presidente da câmara, em golpe contra Netanyahu", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 270933, "titulo": "Nvidia bate previsiones al disparar sus ingresos un 103% y defiende el poder de su tecnología y su remuneración a los accionistas", "url": "https://elpais.com/economia/2026-11-17/nvidia-bate-previsiones-al-disparar-sus-ingresos-un-103-y-defiende-el-poder-de-su-tecnologia-y-su-remuneracion-a-los-accionistas.html", "fonte_id": "elpais_america", "data_pub": "2026-11-17T21:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Nvidia superou as expectativas financeiras, com um aumento de 103% nos seus receitas. A empresa enfatiza sua posição sólida após a saída de Jensen Huang e informa que a SEC está investigando a companhia após a demissão de seu ex-executivo-chefe.", "titulo_pt": "Nvidia supera expectativas com aumento de 103% nas receitas e defende força da empresa após saída de jensen huang e investigação da sec", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 271056, "titulo": "US Navy chief urges US lawmakers to strengthen shipbuilding capacity to close gap on China", "url": "https://www.scmp.com/news/us/diplomacy/article/3374804/us-navy-chief-urges-us-lawmakers-strengthen-shipbuilding-capacity-close-gap-china", "fonte_id": "scmp", "data_pub": "2026-11-17T21:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário interino da Marinha dos EUA, Hung Cao, sugeriu que navios de construção de aliados como Coreia do Sul e Japão poderiam auxiliar na reconstrução dos estaleiros americanos e na redução da vantagem chinesa. Durante uma reunião do Comitê de Assuntos Militares do Senado para confirmar sua nomeação, Cao destacou a importância de manter a construção de navios de guerra nos Estados Unidos.", "titulo_pt": "Secretário interino da marinha dos EUA incentiva construção naval com aliados para reduzir gap com China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 270644, "titulo": "MP rejeita acordo para evitar condenação de argentina acusada de racismo", "url": "https://www.metropoles.com/brasil/mp-rejeita-acordo-para-evitar-condenacao-de-argentina-acusada-de-racismo", "fonte_id": "metropoles", "data_pub": "2026-11-17T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A defesa de Agostina Páez tentou reverter a decisão da Procuradoria-Geral de Justiça, que negou um acordo para evitar a condenação da argentina acusada de racismo. A advogada é acusada de racismo.", "titulo_pt": "MP rejeita acordo para evitar condenação de argentina acusada de racismo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 270761, "titulo": "Milhões enterrados e escândalos abalam círculo de ex-premiê da Hungria", "url": "https://www.dw.com/pt-br/milhões-enterrados-e-escândalos-abalam-círculo-de-ex-premiê-da-hungria/a-79974362?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-17T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milhões de euros enterrados e escândalos de corrupção abalaram o círculo político do ex-premiê da Hungria. Aliados próximos foram recentemente presos em uma ofensiva anticorrupção.", "titulo_pt": "Milhões enterrados e escândalos abalam círculo de ex-premiê da Hungria", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 271143, "titulo": "How Should We Memorialize the Trump Era?", "url": "https://hyperallergic.com/how-should-we-memorialize-the-trump-era/", "fonte_id": "hyperallergic", "data_pub": "2026-11-17T21:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anti-monumentalismo não reage com grandes estátuas ecuestres ou colunas neoclássicas, mas com ausência e ansiedade, minimalismo e melancolia.", "titulo_pt": "Como homenagear a Era Trump?", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 271045, "titulo": "Nvidia batte le attese su utili e ricavi nel terzo trimestre, +2,3% nell'after-hours", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/17/nvidia-batte-le-attese-su-utili-e-ricavi-nel-terzo-trimestre-23-nellafter-hours_cd249bdb-6196-44e3-8bf3-c904e894e6ad.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-17T21:36:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Nvidia superou as expectativas em relação aos lucros e receitas no terceiro trimestre, com lucro por ação de 2,68 dólares e receita de 115,84 bilhões. Os resultados foram divulgados após o mercado fechar.", "titulo_pt": "Nvidia supera expectativas em lucros e receitas no terceiro trimestre, +2,3% após o mercado", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 271010, "titulo": "UK hands NATO-assigned US soldier accused of Russia spying to US military", "url": "https://www.aljazeera.com/news/2026/11/17/uk-hands-nato-assigned-us-soldier-accused-of-russia-spying-to-us-military?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-17T21:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades do Reino Unido transferiram o caso de um soldado americano acusado de espionagem para a Rússia para o controle dos Estados Unidos, conforme os protocolos internacionais estabelecidos.", "titulo_pt": "Reino unido transferiu para os estados unidos o caso de soldado acusado de espionar para a Rússia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 270990, "titulo": "US, Mexico and Bolivia lose measles-free status as deaths mount", "url": "https://www.france24.com/en/americas/20261117-us-mexico-and-bolivia-lose-measles-free-status-as-deaths-mount", "fonte_id": "france24", "data_pub": "2026-11-17T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Estados Unidos perdeu seu status livre de sarampo, assim como México e Bolívia, devido ao aumento rápido da disseminação do vírus, que ocorre após uma queda nas taxas de vacinação. O sarampo tem se espalhado pela América Latina desde 2024.", "titulo_pt": "Estados unidos, México e bolívia perdem status livre de sarampo com aumento das mortes", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 270695, "titulo": "Ataque da Ucrânia derruba trecho de ponte crucial que liga Rússia e Crimeia", "url": "https://www.cnnbrasil.com.br/internacional/ataque-da-ucrania-derruba-trecho-de-ponte-crucial-que-liga-russia-e-crimeia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-17T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ataque na Ucrânia derrubou uma ponte crucial que conecta a Rússia à Crimeia, interrompendo o tráfego de carros, mas não causando vítimas. A passagem de trens pela estrutura ainda é realizada.", "titulo_pt": "Ataque na Ucrânia derruba ponte crucial que liga Rússia e Crimeia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 271011, "titulo": "UK sanctions Israeli settlement firms to protect two-state solution", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/17/aje-onl-nf_uk-sanctions-eight-israeli-settlement-firms-171126?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-17T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Reino Unido impôs novas sanções a oito empresas israelenses que apoiam assentamentos ilegais na Cisjordânia ocupada.", "titulo_pt": "Reino unido impõe sanções a empresas israelenses de assentamentos para proteger a solução de dois estados", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 271046, "titulo": "La Knesset elegge presidente il fedelissimo di Eisenkot Kahana", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/17/la-knesset-elegge-presidente-il-fedelissimo-di-eisenkot-kahana_1fb5de09-973d-4ba1-bd1c-a007869f27df.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-17T21:27:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Knesset (parlamento israelense) elegera o fiel escudeiro de Eisenkot, Kahana, como presidente após mais de 6 horas de obstáculos impostos pelo Likud (partido de oposição).", "titulo_pt": "Knesset elegerá presidente fiel escudeiro de Eisenkot Kahana após sessão prolongada", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 270696, "titulo": "Veja o momento em que aeronave militar cai na Rússia e mata 19 pessoas", "url": "https://www.cnnbrasil.com.br/internacional/video-aeronave-militar-cai-misteriosamente-na-siberia-e-mata-pessoas-na-russia/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-17T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um avião modelo An-12 caiu na região de Kemerovo, Rússia, resultando em 19 mortes. As imagens capturadas por uma câmera de segurança mostram o momento em que o veículo atinge o chão e explode em um feixe de luz.", "titulo_pt": "Veja o momento em que aeronave militar cai na Rússia e mata 19 pessoas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 270991, "titulo": "🔴Israeli parliament elects Eisenkot ally Matan Kahana as new Knesset speaker", "url": "https://www.france24.com/en/middle-east/20261117-%F0%9F%94%B4-israeli-parliament-elects-eisenkot-ally-matan-kahana-as-speaker", "fonte_id": "france24", "data_pub": "2026-11-17T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O parlamento israelense elegera Matan Kahana, aliado de Avigdor Eisenkot, como novo presidente da Knesset. A Knesset é o parlamento de Israel.", "titulo_pt": "Parlamento israelense elegerá novo presidente da Knesset", "veiculo": "France 24", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 270559, "titulo": "Vendas da Nvidia dobram no 3º tri em meio à crise após saída de Huang", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/vendas-da-nvidia-dobram-no-3o-tri-em-meio-a-crise-apos-saida-de-huang.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nvidia registrou um aumento de suas vendas no terceiro trimestre, duplicando os resultados, cinco dias após o cofundador Jensen Huang renunciar ao cargo de CEO. A saída de Huang desencadeou uma crise de liderança na empresa.", "titulo_pt": "Vendas da Nvidia dobram no 3º tri após saída de Huang", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 270762, "titulo": "O que explica a explosão da inadimplência no agronegócio?", "url": "https://www.dw.com/pt-br/o-que-explica-a-explosão-da-inadimplência-no-agronegócio/a-79975178?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-17T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inadimplência no agronegócio aumentou devido à expansão do crédito rural, à queda dos preços das commodities e à elevação dos juros. O volume maior de endividamento afetou principalmente produtores com renda mais alta.", "titulo_pt": "O que explica a explosão da inadimplência no agronegócio?", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 270700, "titulo": "Ouro fecha em leve alta, limitado por juros dos EUA e dólar forte", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/ouro-fecha-em-alta-leve-limitada-pelas-expectativas-de-juros-dos-eua-e-dolar-forte/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-17T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ouro fechou com leve alta, à US$ 3.864,20 por onça-troy, enquanto a prata avançou 1,06% a US$ 47,357 por onça-troy. O desempenho foi limitado pelos juros dos EUA e pelo forte dólar.", "titulo_pt": "Ouro fecha com leve alta, limitado por juros dos EUA e dólar forte", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 270560, "titulo": "Live Nation zera taxa em shows no Nubank Parque após pressão online", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/live-nation-zera-taxa-em-shows-no-nubank-parque-apos-pressao-online.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Live Nation decidiu eliminar as taxas em vendas de ingressos para shows no Nubank Parque devido a pressões online devido a reclamações sobre sites instáveis, falta de proteção contra cambistas e altas taxas cobradas durante a compra.", "titulo_pt": "Live Nation elimina taxas em shows no Nubank Parque após pressão online", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 270562, "titulo": "Política comercial dos EUA faz Canadá e México procurarem a China", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/vaivem/2026/11/politica-comercial-dos-eua-faz-canada-e-mexico-procurarem-a-china.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Donald Trump se reúne novamente com Xi Jinping, e as exportações agropecuárias entram em pauta. O Canadá e o México estão buscando alternativas na China devido às políticas comerciais dos Estados Unidos.", "titulo_pt": "Política comercial dos EUA faz Canadá e México procurarem a China", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 270563, "titulo": "Você precisa mesmo ter ações, dólar e títulos IPCA+ na sua carteira?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/11/voce-precisa-mesmo-ter-acoes-dolar-e-titulos-ipca-na-sua-carteira.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ideia de que uma carteira de investimentos deve incluir ações, investimentos no exterior e títulos que acompanham a inflação é comum, mas a pergunta é se todos os investidores precisam ter essas aplicações, independentemente do momento e dos preços.", "titulo_pt": "Você precisa mesmo ter ações, dólar e títulos IPCA+ na sua carteira?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 271060, "titulo": "Delinquency ratio on bank loans down in Sept.", "url": "https://en.yna.co.kr/view/AEN20261117005900320", "fonte_id": "yonhap_news", "data_pub": "2026-11-17T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O índice de inadimplência em empréstimos concedidos pelas bancas diminuiu em setembro.", "titulo_pt": "Taxa de inadimplência em empréstimos bancários cai em setembro", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 270567, "titulo": "Ibovespa incluirá ações de empresas brasileiras listadas no exterior a partir de 2027", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/ibovespa-incluira-acoes-de-empresas-brasileiras-listadas-no-exterior-a-partir-de-2027.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir de 2027, o Ibovespa incluirá BDRs de empresas brasileiras listadas no exterior. Essa mudança faz parte de uma revisão na metodologia do indicador, que representa o desempenho médio das negociações na B3.", "titulo_pt": "Ibovespa incluirá ações de empresas brasileiras listadas no exterior a partir de 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 270823, "titulo": "Sistema financeiro vai ao STF contra tese do TST sobre indenização por previdência complementar", "url": "https://www.jota.info/stf/do-supremo/sistema-financeiro-vai-ao-stf-contra-tese-do-tst-sobre-indenizacao-por-previdencia-complementar", "fonte_id": "jota", "data_pub": "2026-11-17T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Sistema Financeiro apresentou recurso ao Supremo Tribunal Federal (STF) questionando a decisão do Tribunal Superior do Trabalho (TST) sobre indenização por previdência complementar. A Confederação dos Serviços (Consif) argumenta que o entendimento do TST aumenta a insegurança jurídica nas relações trabalhistas.", "titulo_pt": "Sistema financeiro recorre ao STF contra decisão do TST sobre indenização por previdência complementar", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 270568, "titulo": "Maior associação de bets troca presidente em meio à turbulência no setor", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/maior-associacao-de-bets-troca-presidente-em-meio-a-turbulencia-no-setor.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T19:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O IBJR (Instituto Brasileiro de Jogo Responsável), maior associação de empresas de apostas do país, trocou seu presidente-executivo. Carlos Lima deixa o cargo após desgastes com os associados, e Fernando Vieira, que já ocupou o cargo anteriormente, retorna para presidir novamente entre outubro de 2024 e setembro de 2025.", "titulo_pt": "Maior associação de apostas troca presidente em meio a turbulência", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 270569, "titulo": "Vale tem contrato de 20 anos de compra de minério da Cedro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/vale-tem-contrato-de-20-anos-de-compra-de-minerio-da-cedro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T19:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Cedro Mineração assinou um contrato com a Vale para fornecimento de minério de ferro por 20 anos, prorrogáveis por mais dez anos, envolvendo a mina da empresa em Mariana (MG).", "titulo_pt": "Cedro mineração e vale firmam contrato de 20 anos de fornecimento de minério", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 270570, "titulo": "Amazon e Google terão cerca de 28% da Anthropic após IPO da empresa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/amazon-e-google-terao-cerca-de-28-da-anthropic-apos-ipo-da-empresa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T19:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon e o Google terão, juntos, mais de 28% das ações da Anthropic após o IPO da empresa. Este fato reforça os laços estreitos entre as companhias que estão impulsionando o boom da inteligência artificial.", "titulo_pt": "Amazon e Google terão mais de 28% da Anthropic após IPO", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 270824, "titulo": "Resolução 522 do BCB: faltou o essencial", "url": "https://www.jota.info/opiniao-e-analise/colunas/direito-economia-mercado/resolucao-522-do-bcb-faltou-o-essencial", "fonte_id": "jota", "data_pub": "2026-11-17T19:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A resolução 522 do Banco Central do Brasil foi analisada em termos de impacto regulatório, liberdade econômica e os limites jurídicos da intervenção nos mercados financeiros.", "titulo_pt": "Resolução 522 do BCB: o que falta?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 270571, "titulo": "Governo Lula avalia impacto de restrição dos EUA à importação de chips de IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/governo-lula-avalia-impacto-de-restricao-dos-eua-a-importacao-de-chips-de-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T19:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula ainda analisa o impacto de uma restrição dos EUA que afeta a importação de chips de IA para o Brasil e quatro outros países. Os ministros da Indústria e da Gestão e Inovação serão responsáveis por avaliar os efeitos econômicos.", "titulo_pt": "Governo Lula avalia impacto de restrição dos EUA em importação de chips de IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 270573, "titulo": "Corinthians entra com pedido de proteção contra credores e tenta renegociar dívidas de R$ 2,8 bi", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/corinthians-entra-com-pedido-de-tutela-cautelar-para-renegociar-dividas-de-r-28-bi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-17T18:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Corinthians apresentou uma solicitação de tutela cautelar para facilitar as negociações com credores, uma etapa que geralmente precede uma possível recuperação judicial. A dívida do clube é de R$ 2,8 bilhões.", "titulo_pt": "Corinthians pede proteção judicial e busca renegociar dívidas de R$ 2,8 bi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 270589, "titulo": "Durigan prevê impacto inicial da reforma tributária sobre inflação", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/durigan-preve-impacto-inicial-da-reforma-tributaria-sobre-inflacao", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-17T18:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, declarou que a reforma tributária pode causar um impacto inicial limitado na inflação, mas esse efeito tende a diminuir gradualmente com o tempo. Segundo ele, as empresas irão se adaptar às novas regras tributárias e ajustarão gradualmente a formação de preços.", "titulo_pt": "Durigan prevê impacto inicial limitado da reforma tributária sobre a inflação", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 270231, "titulo": "US blocks China’s indirect access to latest chips", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/18/2003867932", "fonte_id": "taipei_times", "data_pub": "2026-11-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos impediram que a China tivesse acesso indireto a chips mais recentes. A medida visa restringir a tecnologia avançada à China.", "titulo_pt": "EUA bloqueiam acesso indireto da China aos últimos chips", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 270254, "titulo": "Nvidia forms export control board committee after chip curbs", "url": "https://www.taipeitimes.com/News/biz/archives/2026/11/18/2003867919", "fonte_id": "taipei_times", "data_pub": "2026-11-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia formou uma comissão de controle de exportação após as restrições a chips. A empresa reagiu às novas regulamentações implementadas por governos para monitorar a exportação de tecnologia avançada.", "titulo_pt": "Nvidia forma comissão de controle de exportação após restrições a chips", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 271003, "titulo": "Widespread outages hit banks, air travel, the NSA and Apple, disrupting seemingly everything", "url": "https://www.cnbc.com/2026/11/17/apple-microsoft-faa-jpmorgan-outages.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-17T21:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças generalizadas de interrupção afetaram bancos, viagens aéreas, o NSA e a Apple, interrompendo praticamente tudo. Esses incidentes ilustram os riscos associados à tecnologia interconectada na era da inteligência artificial.", "titulo_pt": "Interrupções generalizadas afetam bancos, aviação, NSA e Apple, interrompendo praticamente tudo", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 271055, "titulo": "La soberanía de los cables", "url": "https://www.ciperchile.cl/2026/11/17/la-soberania-de-los-cables/?utm_source=rss&utm_medium=rss&utm_campaign=la-soberania-de-los-cables", "fonte_id": "ciper_chile", "data_pub": "2026-11-17T21:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O título original 'La soberanía de los cables' se refere a um conteúdo publicado inicialmente no CIPER Chile.", "titulo_pt": "A soberania dos cabos", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 271067, "titulo": "Nvidia’s Q3 earnings hit the mark, without mentioning the whole Jensen Huang thing", "url": "https://www.theverge.com/tech/1036032/nvidia-q3-2027-jensen-huang", "fonte_id": "the_verge", "data_pub": "2026-11-17T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A interina CEO da Nvidia, Colette Kress, anunciou os resultados trimestrais da empresa sem mencionar o ex-CEO Jensen Huang, seu desligamento ou qualquer tentativa de retorno. Essa informação provavelmente será fornecida durante a chamada para analistas agendada para mais tarde.", "titulo_pt": "Earnings da nvidia anunciamos, sem falar em Huang", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 271068, "titulo": "Nike’s new air sole technology can mix soft and firm cushioning", "url": "https://www.theverge.com/tech/1035911/nike-shoes-tuned-air-sole-printing-variable-cushioning", "fonte_id": "the_verge", "data_pub": "2026-11-17T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2024, a Nike lançou o Air Max 1000, produzido por meio de um processo de impressão 3D que resultou em um sapato com uma silhueta uniforme, mas áreas variáveis de suporte e flexibilidade. A empresa agora está utilizando uma tecnologia semelhante com seus famosos tacos de ar, chamada Tuned Air.", "titulo_pt": "Tecnologia de soleira do ar da nike pode combinar maciez e firmeza", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 271004, "titulo": "Jensen Huang scandal fuels bipartisan push to block AI chip sales to China", "url": "https://www.cnbc.com/2026/11/17/congress-ai-china-jensen-huang-chips.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-17T21:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Congressistas americanos estão empurrando para incluir uma série de projetos de lei de controle de exportação de chips em uma legislação anual de autorização de defesa nacional. O escândalo envolvendo Jensen Huang está alimentando essa iniciativa.", "titulo_pt": "Escândalo envolvendo jensen Huang impulsiona esforço bipartidário para bloquear vendas de chips de IA para a China", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 271043, "titulo": "Nvidia sales doubled last quarter", "url": "https://www.ft.com/content/3a8881b8-068c-4950-9238-4f8eb1efc870?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-17T21:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas da Nvidia dobraram no último trimestre. A empresa relatou resultados financeiros sólidos após o CEO Jensen Huang ter que deixar suas funções.", "titulo_pt": "Vendas da nvidia dobram no último trimestre", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 271069, "titulo": "Not even Sam Altman is safe from AI deepfakes on Instagram", "url": "https://www.theverge.com/news/1035957/meta-alexandr-wang-sam-altman-instagram-ai-deepfake", "fonte_id": "the_verge", "data_pub": "2026-11-17T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Instagram está cheio de conteúdo deepfake, incluindo recentemente um vídeo gerado por inteligência artificial com o CEO da Meta, Mark Zuckerberg, e o CEO da OpenAI, Sam Altman. O chief AI officer da Meta, Alexandr Wang, compartilhou um vídeo para promover o Muse, um agente de IA da empresa, no qual aparecem ele mesmo, Zuckerberg e Altman.", "titulo_pt": "Até mesmo Sam Altman não está seguro de deepfakes no Instagram", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 270986, "titulo": "Why the internet suddenly broke all at once", "url": "https://www.axios.com/2026/11/17/tech-outages-ai-fears-internet-breaking", "fonte_id": "axios", "data_pub": "2026-11-17T20:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nos últimos dias, os EUA experimentaram várias interrupções na internet, incluindo problemas com contas bancárias, voos e e-mails. Embora a internet tenha apontado para uma possível ameaça de inteligência artificial, especialistas informam que essas interrupções não parecem estar relacionadas a ataques cibernéticos e podem ser resultado de esforços para corrigir códigos obsoletos.", "titulo_pt": "Por que a internet quebrou de repente", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 271070, "titulo": "Instagram is helping creators crack down on copycat videos", "url": "https://www.theverge.com/tech/1035943/instagram-creators-crack-down-copycat-videos", "fonte_id": "the_verge", "data_pub": "2026-11-17T20:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Instagram está implementando uma funcionalidade de 'proteção de conteúdo' que permite aos criadores monitorar e revisar cópias de seus vídeos publicados no plataforma. Os criadores inscritos podem ser notificados quando suas vídeos originais forem identificados em outras postagens.", "titulo_pt": "Instagram ajuda criadores a combaterem cópias de seus vídeos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 271064, "titulo": "[Lee Moon-won] Chasing wellness without a vacation", "url": "https://www.koreaherald.com/article/10940218", "fonte_id": "korea_herald", "data_pub": "2026-11-17T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mãe gastava uma hora diária lavando o cabelo do filho para economizar tempo de estudo. O filho estava preparando-se para um exame importante em Coreia, dedicando quase todo seu tempo livre aos estudos. Sua aparência física estava desgastada em relação à sua idade.", "titulo_pt": "Perseguindo a saúde sem férias", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 271065, "titulo": "[Kim Seong-kon] The importance of a great leader", "url": "https://www.koreaherald.com/article/10940217", "fonte_id": "korea_herald", "data_pub": "2026-11-17T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um líder competente e confiável é essencial para a segurança e prosperidade do grupo, enquanto um líder ineficiente ou vago pode levar ao fracasso. Portanto, é crucial ter um grande líder que possa discernir o caminho certo, navegar com segurança por águas perigosas e transformar visões em realidade.", "titulo_pt": "A importância de um grande líder", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 270634, "titulo": "A nova família de IAs da Microsoft voltadas para a cibersegurança", "url": "https://veja.abril.com.br/tecnologia/a-nova-familia-de-ias-da-microsoft-voltadas-para-a-ciberseguranca/", "fonte_id": "veja", "data_pub": "2026-11-17T20:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Microsoft lançou uma nova família de inteligências artificiais voltadas para a cibersegurança. A empresa anunciou a criação de vários modelos em um mercado tecnológico em constante avanço.", "titulo_pt": "Nova família de IAs da Microsoft para cibersegurança", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 271090, "titulo": "How to Tell If It’s a Cyberattack or Just an Outage", "url": "https://www.wired.com/story/how-to-tell-if-its-a-cyberattack-or-just-an-outage/", "fonte_id": "wired", "data_pub": "2026-11-17T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Falhas em redes estão se acumulando, incluindo e-mails, voos e bancos. A WIRED explica como investigar se essas falhas são resultado de ataques cibernéticos, geralmente não sendo o caso.", "titulo_pt": "Como diferenciar um ataque cibernético de uma falha de rede", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 271073, "titulo": "California just banned Waymo from all state freeways", "url": "https://www.theverge.com/transportation/1035789/california-dmv-bans-waymo-freeways-construction-zone-safety", "fonte_id": "the_verge", "data_pub": "2026-11-17T19:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Califórnia proibiu oficialmente as viagens autônomas de Waymo em todas as rodovias do estado a partir do dia 11 de novembro, devido a potenciais riscos de segurança. A decisão foi tomada após dois incidentes notáveis na Baía de São Francisco, onde veículos robóticos Waymo colidiram com uma área de fechamento de obras ativa.", "titulo_pt": "Califórnia proíbe Waymo de percorrer todas as rodovias do estado", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 270242, "titulo": "Temperature shifts could raise disease risks: CDC", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/18/2003867949", "fonte_id": "taipei_times", "data_pub": "2026-11-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CDC (Centro para o Controle e Prevenção de Doenças) alerta que mudanças nas temperaturas podem aumentar os riscos de doenças. O órgão sugere que variações climáticas devem ser monitoradas com atenção devido a possíveis impactos na saúde pública.", "titulo_pt": "Mudanças na temperatura podem aumentar riscos de doenças: CDC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 270808, "titulo": "La NASA detectó una inminente explosión cataclísmica, pero no saben cuándo va a ocurrir con exactitud: el riesgo para la Tierra", "url": "https://www.lanacion.com.ar/ciencia/la-nasa-detecto-una-inminente-explosion-cataclismica-pero-no-saben-cuando-va-a-ocurrir-con-exactitud-nid17112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-17T21:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O sistema binário T Coronae Borealis está prestes a sofrer uma explosão estelar de magnitude histórica. Astrônomos monitoram constantemente a situação, mas a data exata do evento ainda é incerta.", "titulo_pt": "NASA detecta explosão estelar inminente em sistema binário, mas data exata é incerta", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 270985, "titulo": "Why the world's biggest climate meeting (still) matters", "url": "https://www.axios.com/2026/11/17/un-climate-conference-negotiations-energy", "fonte_id": "axios", "data_pub": "2026-11-17T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cada ano, milhares de pessoas se reúnem para discutir o futuro da humanidade em um planeta mais quente. Apesar da distração global com outros assuntos, esses encontros anuais ainda são um dos poucos lugares onde os países podem coletivamente abordar um problema que nenhum deles pode resolver sozinho.", "titulo_pt": "Por que a maior reunião climática do mundo (ainda) importa", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 271136, "titulo": "BPS Digital AVATAR Challenge", "url": "https://www.nasa.gov/directorates/stmd/prizes-challenges-crowdsourcing-program/center-of-excellence-for-collaborative-innovation-coeci/bps-digital-avatar-challenge/", "fonte_id": "nasa_news", "data_pub": "2026-11-17T20:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa de Biologia Espacial da NASA na Divisão de Ciências Biológicas e Físicas (BPS) investiga como os sistemas vivos respondem em toda a escala de organização biológica para avançar o entendimento de como esses sistemas vivos reagem aos stressores únicos da exploração espacial, incluindo microgravidade, radiação ionizante, campos magnéticos baixos e elevados níveis de CO₂. A NASA está preparando-se para missões de longa duração em explorações espaciais profundas.", "titulo_pt": "Desafio Digital AVATAR do programa de biologia espacial da nasa", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 271137, "titulo": "New Album of Baby Star Sounds Shared by NASA’s Chandra", "url": "https://science.nasa.gov/missions/chandra/new-album-of-baby-star-sounds-shared-by-nasas-chandra/", "fonte_id": "nasa_news", "data_pub": "2026-11-17T20:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA compartilhou um novo álbum de sons que transforma dados de estrelas jovens em áudio. O Chandra X-ray Observatory coletou imagens de estrelas em formação em todo o galáxia e transformou essas informações em sons.", "titulo_pt": "Novo álbum de sons de estrelas jovens compartilhado pelo Chandra da NASA", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 271109, "titulo": "STAT+: Updated health data privacy rule sets standards for sharing records with apps", "url": "https://www.statnews.com/2026/11/17/hipaa-privacy-rule-update-aims-to-improve-patient-access-to-records/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-17T19:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento Federal de Saúde atualizou a regra de privacidade HIPAA, enfatizando a acessibilidade dos pacientes aos seus próprios registros médicos. A atualização visa facilitar o compartilhamento desses registros com aplicativos de saúde.", "titulo_pt": "Atualização da regra de privacidade de saúde suporta acesso dos pacientes aos seus registros médicos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 270987, "titulo": "What is a dirty bomb and how dangerous is the weapon", "url": "https://www.axios.com/2026/11/17/dirty-bomb-radioactive-trump-washington-weapon", "fonte_id": "axios", "data_pub": "2026-11-17T19:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Presidente Trump advertiu a Irã contra uma possível operação de 'bomba suja' em Washington, D.C., embora o Palácio Branco afirme que não há ameaças credíveis. Uma 'bomba suja' usa explosivos comuns para espalhar material radioativo, potencialmente contaminando áreas adjacentes, causando evacuações e desordem generalizada.", "titulo_pt": "O que é uma bomba suja e quão perigosa é essa arma?", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 271138, "titulo": "NASA to Cover 35th SpaceX Resupply Mission Space Station Departure", "url": "https://www.nasa.gov/news-release/nasa-to-cover-35th-spacex-resupply-mission-space-station-departure/", "fonte_id": "nasa_news", "data_pub": "2026-11-17T19:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX está programada para deslocar sua 35ª missão de suprimentos da Estação Espacial Internacional em 18 de novembro, com a descolagem prevista para 11h05 de Brasília, dependendo das condições meteorológicas. A cápsula Dragon deve levar amostras científicas e equipamentos de volta à Terra.", "titulo_pt": "NASA vai transmitir 35ª missão de retorno da SpaceX da estação espacial", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 271140, "titulo": "Infinitesimals are essential to calculus. But are they even real?", "url": "https://www.scientificamerican.com/article/infinitesimals-are-essential-to-calculus-but-are-they-even-real/", "fonte_id": "scientific_american", "data_pub": "2026-11-17T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Infinitesimais são fundamentais para o cálculo, mas sua validade ainda é questionada por muitos matemáticos. Apesar de 'ant-infinitos' terem sido cruciais para a criação do cálculo, muitos pesquisadores duvidam de sua realidade.", "titulo_pt": "Infinitesimais são essenciais para o cálculo. Mas eles são reais?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 271139, "titulo": "NICER Status Updates", "url": "https://www.nasa.gov/missions/station/nicer-status-updates/", "fonte_id": "nasa_news", "data_pub": "2026-11-17T18:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A telescope da NASA, NICER (Neutron star Interior Composition Explorer), no espaço stationário da Estação Espacial Internacional, encerrou suas operações científicas após estudar o universo por seis anos e meio além da missão inicial. Agora, a missão e a equipe da estação espacial estão se concentrando nos planos para concluir os últimos anos do NICER.", "titulo_pt": "Atualizações sobre o Status do telescópio NICER", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 271110, "titulo": "STAT+: GOP, MAHA leaders clash over FDA nominee’s record on vapes", "url": "https://www.statnews.com/2026/11/17/heidi-overton-fda-commissioner-nomination-vote-vaping-controversy/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-17T18:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Heidi Overton está enfrentando dificuldades para se tornar a próxima comissária do FDA. Ela está sendo desafiada em relação ao seu trabalho sobre vapes.", "titulo_pt": "GOP e líderes MAHA se confrontam sobre registro de vapes da candidata do FDA", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 270368, "titulo": "STAT+: What to know about the new AI roadmap from CMS, and news from HLTH", "url": "https://www.statnews.com/2026/11/17/cms-ai-roadmap-and-news-from-hlth-health-tech/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-17T17:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute o roadmap de IA recentemente lançado pelo CMS e destaca os principais pontos do evento HLTH. O CMS divulgou um plano estratégico sobre a utilização de inteligência artificial no setor de saúde, enquanto HLTH apresentou algumas das principais notícias e tendências relacionadas à tecnologia na saúde.", "titulo_pt": "O que saber sobre o novo roadmap de IA do CMS e notícias do HLTH", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 269662, "titulo": "Covid: variante PJ.2.1 aumenta no Brasil e entra no radar de vacinas da OMS", "url": "https://www.metropoles.com/saude/covid-variante-pj-2-1-aumenta-no-brasil-e-entra-no-radar-de-vacinas-da-oms", "fonte_id": "metropoles", "data_pub": "2026-11-17T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A variante PJ.2.1 aumentou nos casos no Brasil, com registro de alta em 18 unidades da Federação, conforme informado pelo Ministério da Saúde. A Organização Mundial da Saúde (OMS) incluirá esta variante em suas análises sobre vacinas.", "titulo_pt": "Covid: variante PJ.2.1 cresce no Brasil e é monitorada pela OMS", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 270271, "titulo": "US loses measles-free status as vaccinations fall, cases and deaths mount", "url": "https://www.scmp.com/news/world/united-states-canada/article/3374799/us-loses-measles-free-status-vaccinations-fall-cases-and-deaths-mount", "fonte_id": "scmp", "data_pub": "2026-11-17T17:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Brasil perdeu o status de eliminação da viruela, conforme anunciado pela Organização Pan-Americana de Saúde (OPAS), devido à queda nas taxas de vacinação, que resultou em um aumento significativo de casos da doença altamente contagiosa. México e Bolívia também perderam seu status este ano.", "titulo_pt": "Brasil perde status de eliminação da viruela devido a queda nas taxas de vacinação", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 269539, "titulo": "Thereza Imanishi-Kari, cientista inocentada de acusação nos EUA, morre aos 83 anos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/thereza-imanishi-kari-cientista-inocentada-de-acusacao-nos-eua-morre-aos-83-anos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-17T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Thereza Imanishi-Kari, uma cientista que enfrentou uma acusação injusta nos Estados Unidos por cerca de uma década, morreu aos 83 anos. Ela se mudou vária "}, {"id": 270793, "titulo": "Al menos 81 migrantes detenidos en operativos marítimos frente a la costa de California", "url": "https://www.clarin.com/estados-unidos/al-menos-81-migrantes-detenidos-en-operativos-maritimos-frente-a-la-costa-de-california_0_wbp9LHcTS0.html", "fonte_id": "clarin", "data_pub": "2026-11-17T20:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Autoridades interceptaram quatro barcos no sul da Califórnia em 7 e 8 de novembro, detendo 81 pessoas acusadas de tráfico de imigrantes. As operações envolveram a Guarda Costeira e a CBP e destacaram o perigo das embarcações sobrecarregadas no mar.", "titulo_pt": "Pelo menos 81 imigrantes detidos em operações marítimas na costa da califórnia", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 271024, "titulo": "Ugandan human trafficking survivor uses music to fight abuse", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/17/ugandan-human-trafficking-survivor-uses-music-to-fight-abuse?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-17T19:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O cantor ugandense Gideon Mwesezi, conhecido como 'Small Q', que sobreviveu ao tráfico humano em Myanmar, está utilizando a música para alertar outras pessoas sobre o problema.", "titulo_pt": "Sobrevivente de tráfico humano no uganda usa música para combater abuso", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 270759, "titulo": "Por que EUA perderam certificado de eliminação do sarampo após 26 anos", "url": "https://www.bbc.com/portuguese/articles/cq78258y8np9o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-17T18:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos relataram mais de 5,4 mil casos e 10 mortes de sarampo pela primeira vez desde os anos 1990. Como resultado, o país perdeu o certificado de eliminação do sarampo após 26 anos.", "titulo_pt": "Por que EUA perderam certificado de eliminação do sarampo após 26 anos", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 270827, "titulo": "Liberdade, liberdade, abre as redes, desfaz os nós", "url": "https://www.jota.info/opiniao-e-analise/artigos/liberdade-liberdade-abre-as-redes-desfaz-os-nos", "fonte_id": "jota", "data_pub": "2026-11-17T18:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei 4.675 visa aumentar a concorrência no setor digital e obriga o Conselho Administrativo de Defesa Econômica (Cade) a justificar cada obrigação impostas.", "titulo_pt": "Liberdade, liberdade, amplie a concorrência digital e justifique obrigações", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 270157, "titulo": "CAIR defends civil rights work against Trump’s ‘smear’", "url": "https://www.aljazeera.com/news/2026/11/17/cair-defends-civil-rights-work-against-trumps-smear?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-17T17:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A maior organização de defesa dos direitos muçulmanos dos EUA pede a Trump que aborde o aumento de crimes de ódio contra muçulmanos. O grupo defende seu trabalho contra as acusações de campanha de Trump.", "titulo_pt": "CAIR defende trabalho de direitos civis contra acusações de Trump", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 269961, "titulo": "The AI Safety Debate Has a Human Rights Blind Spot", "url": "https://foreignpolicy.com/2026/11/17/ai-human-rights-safety-debate/", "fonte_id": "foreign_policy", "data_pub": "2026-11-17T16:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria da IA deveria se basear em um quadro já existente em vez de escrever regras próprias. O debate sobre a segurança da IA tem um vazio em relação aos direitos humanos.", "titulo_pt": "O Debate sobre a segurança da IA tem um vazio em direitos humanos", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 270183, "titulo": "Exclusive: UN commissioner Chris Sidoti says Israel is targeting children in Gaza", "url": "https://www.middleeasteye.net/video/exclusive-un-commissioner-chris-sidoti-israels-targeting-children-and-ongoing-genocide", "fonte_id": "middle_east_eye", "data_pub": "2026-11-17T16:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um membro da Comissão de Inquérito das Nações Unidas sobre o Território Palestino Ocupado, Chris Sidoti, afirmou que Israel está alvo de crianças em Gaza. Segundo Sidoti, não há cessar-fogo e Israel está cometendo genocídio no Gaza e na Cisjordânia ocupada.", "titulo_pt": "Exclusivo: comissário das nações unidas Chris Sidoti afirma que Israel está alvo de crianças em Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 270056, "titulo": "Lanzamiento Informe Anual sobre Derechos Humanos en Chile 2026", "url": "https://www.ciperchile.cl/2026/11/17/lanzamiento-informe-anual-sobre-derechos-humanos-en-chile-2026/?utm_source=rss&utm_medium=rss&utm_campaign=lanzamiento-informe-anual-sobre-derechos-humanos-en-chile-2026", "fonte_id": "ciper_chile", "data_pub": "2026-11-17T14:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O relatório anual sobre direitos humanos no Chile para 2026 foi lançado.", "titulo_pt": "Lançamento do relatório Anual sobre direitos Humanos no Chile 2026", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 269810, "titulo": "Brasil responde na Corte IDH por negar cirurgia de redesignação sexual a mulher trans", "url": "https://www.jota.info/coberturas-especiais/direitos-humanos/brasil-responde-na-corte-idh-por-negar-cirurgia-de-redesignacao-sexual-a-mulher-trans", "fonte_id": "jota", "data_pub": "2026-11-17T14:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O caso Luiza Melinho vs. Brasil é o primeiro julgamento da Corte Interamericana de Direitos Humanos sob
