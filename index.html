<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<script>
const D = {"gerado_em": "13/09/2026 19:13", "stats": {"noticias_novas": 416, "resumos_gerados": 198}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Supremo Tribunal Federal (STF) está enfrentando várias disputas e pedidos de sigilo que podem influenciar o julgamento do caso Master na terça-feira. O presidente do STF, Luís Roberto Barroso, pediu à Procuradoria-Geral da República (PGR) que se manifestasse sobre uma petição sigilosa, enquanto o ministro Alexandre Moraes solicitou a retirada do sigilo de dados sobre o Banco Master antes do julgamento. Fachin também pediu acesso a uma nova petição sigilosa relacionada ao caso. A 'guerra de petições' entre os ministros do STF, envolvendo relações de ministros com o ex-banqueiro Daniel Vorcaro, está agravando a crise institucional na corte. Além disso, o Ministério Público Federal (MPF) abriu um inquérito para investigar desvios financeiros em contratos públicos no Acre, enquanto o Banco Central encontrou indícios de que dois servidores receberam R$ 12 milhões em propinas do Banco Master.", "mundo": "A Suécia está passando por momentos cruciais em sua política, com eleições que podem levar um partido de extrema-direita ao governo, conforme indicam as pesquisas. As pesquisas sugerem que a coalizão de centro-esquerda liderada por Magdalena Andersson tem uma leve vantagem sobre a aliança de centro-direita liderada por Ulf Kristersson. O presidente dos Estados Unidos, Donald Trump, continua a gerar controvérsias, tanto com suas postagens na rede social quanto com seu pedido para que o presidente ucraniano Volodymyr Zelensky pare de atacar alvos energéticos russos. Em um contexto global, drones russos atingiram um trem perto da fronteira entre a Ucrânia e a Polônia, um dia após diplomatas europeus terem usado a mesma linha ferroviária, levando a condenações de Ucrânia e Polônia. Além disso, a Suécia enfrenta debates sobre o desenvolvimento da inteligência artificial, com o rei Carlos XVI Gustavo convocando líderes de empresas de IA para discutir o tema.\n\nA tensão geopolítica no Oriente Médio e na Europa continua a crescer, com ataques e confrontos entre várias nações. Primeiramente, ataques na Arábia Saudita e no Estreito de Ormuz aumentaram a nervosidade no mercado de petróleo, ameaçando a produção global. Novos ataques em navios e oleodutos sauditas, bem como avanços hutís no Iêmen, aumentaram as preocupações sobre a estabilidade do abastecimento de petróleo. Em seguida, a Rússia realizou um ataque a um trem ucraniano perto da fronteira com a Polônia, levando a acusações de escalada do conflito e a tensões diplomáticas entre países europeus. Além disso, a China busca aumentar sua influência antes de um encontro com os Estados Unidos, enquanto Israel e Líbano preparam-se para uma reunião em Roma.", "economia": "Todos os olhares estão voltados para o Federal Reserve (Fed) dos Estados Unidos para combater a alta inflação. O presidente dos Estados Unidos, Donald Trump, afirmou que os EUA deveriam ter a menor taxa de juros do mundo. A Casa Branca declarou que não há razões técnicas para um aumento dos juros, apoiando a decisão do Fed. A paralisação em um oleoduto saudita pode reduzir em 4% o abastecimento global de petróleo, agravando a escassez de combustíveis e levando a novos recordes nos preços internacionais. O presidente da China, Xi Jinping, defendeu a importância de fortalecer os laços econômicos entre os países do Brics para aumentar o perfil global do bloco. Além disso, o preço do petróleo disparou, reavivando o interesse por hidrogênio limpo em governos globais, apesar do seu custo mais elevado em comparação com os combustíveis tradicionais.", "tecnologia": "O CEO da Anthropic, Dario Amodei, pediu uma pausa no desenvolvimento da inteligência artificial (IA) para garantir a segurança e a responsabilidade no avanço tecnológico. Amodei argumentou que a IA representa um risco existencial para a humanidade e que estabelecer limites para seu desenvolvimento é um 'dilema mais difícil', devido ao risco de países rivais, como a China, não aderirem a essas mesmas limitações. Este pedido de Amodei ganhou apoio de outros líderes de empresas de IA, incluindo o presidente do Google DeepMind, Demis Hassabis, e Sam Altman, da OpenAI. No entanto, o presidente dos Estados Unidos, Donald Trump, minimizou a necessidade de regulamentar o desenvolvimento da IA, afirmando que tem medo de perder o avanço dos EUA em relação à China em uma competição global. Ainda assim, Trump reconheceu a necessidade de algum tipo de regulação, mas não detalhou propostas específicas. A Nvidia está em negociações para investir até NT$10 bilhões na oferta inicial de ações (IPO) da Anthropic, de acordo com uma fonte. Além disso, a indústria de IA está debatendo se ela representa uma ameaça existencial para a humanidade, com os investidores de capital de risco (VCs) selecionando as nove startups mais promissoras do lote de verão do programa Y Combinator, que apresentaram projetos de soluções para reatores flutuantes e dispositivos implantados no cérebro.", "ciencia": "A SpaceX realizou a missão número 700 da família de foguetes Falcon, lançando três satélites de comunicação da SES, o3b mPOWER, para a órbita. Além disso, os cientistas descobriram que uma estrela distante, que parecia prestes a explodir em supernova, na verdade está sendo influenciada por uma companheira oculta. Um estudo sobre morcegos revelou adaptações relacionadas à imunidade e resistência ao câncer que podem fornecer pistas sobre longevidade e resistência ao câncer nessas criaturas. O Laboratório Nacional de Oak Ridge desenvolveu um framework de inteligência artificial que auxilia na identificação de características nanosscale mais informativas utilizando microscópios de força atômica. A superfície de Mercúrio está cheia de crateras, sulcos e penhascos, e a inundações de água salgada estão se tornando um problema crescente para a agricultura na Inglaterra oriental, afetando tanto os cultivos quanto as receitas dos agricultores. A datação luminiscente redefiniu a idade dos restos de mamutes no Sítio Mamut do Sudão, empurrando-a para mais de 160.000 anos, cerca de 100.000 anos a mais do que o valor anterior de 26.000 anos. A NASA está planejando um novo observatório espacial que poderia detectar oceans em mundos distantes. Além disso, os físicos demonstraram experimentalmente o efeito óptico de Magnus pela primeira vez, mostrando que um laser concentrado interage mais fortemente com uma atômica ligeiramente afastada do centro do jato de luz, criando erros em computadores quânticos, mas também oferecendo uma nova maneira de acoplar qubits juntos.", "cultura": "O Rock in Rio, que reuniu 700 mil pessoas em sua última edição, confirmou sua presença no calendário para 2028 com novidades, incluindo uma corrida que culminará na Cidade do Rock, local do festival. O evento, dedicado às mulheres no último dia, contou com apresentações de artistas como Ivete Sangalo, que ofereceu ao Rock in Rio uma performance especial em embalagem espanhola. A 28ª edição da Bienal do Livro de São Paulo bateu um recorde histórico, recebendo 760 mil visitantes e consolidando-se como o maior evento literário do país. Entre as tendências de moda do festival, destaque para o couro, jeans e estamparia animal. Além disso, a diretora Anna Biller, após quase abandonar a carreira, retorna ao cinema com 'The Face of Horror', enquanto o documentário 'Everest: The Other Side' destaca a ascensão do lado norte do Monte Everest.", "sociedade": "Um homem de 26 anos foi baleado durante uma abordagem policial em Niterói, no Rio de Janeiro, levando à prisão do policial responsável. Em São Paulo, um desabamento resultou na morte de uma menina de 7 anos, sendo a 6ª vítima fatal do incidente. O número de suicídios entre estudantes sul-coreanos de escolaridade básica e média aumentou 65% em cinco anos, atingindo o maior nível histórico em 2025. No Brasil, uma família de onze pessoas, incluindo uma grávida, foi morta em um colapso de edifício em São Paulo. Em Hong Kong, a cidade enfrenta desafios demográficos e econômicos, como uma população envelhecida, baixa natalidade e perdas de emprego, o que requer uma abordagem para melhorar os padrões de vida dos cidadãos.", "meio_ambiente": "Um evento importante mencionado nos artigos é a tragédia envolvendo uma balsa na Indonésia, que deixou ao menos seis mortos e 130 desaparecidos. A balsa transportava 243 passageiros e tripulantes, mas se virou durante a viagem entre Java e Bornéu, com 107 pessoas já resgatadas até o momento. O incidente ocorreu em um contexto de preocupações ambientais, com oceanos registrando recordes de temperatura, o que ameaça a economia global. Paralelamente, o aquecimento do Ártico é discutido como uma possível via comercial, mas levanta preocupações de segurança. Além disso, a participação de indígenas e comunidades brasileiras no debate climático é reivindicada, buscando maior voz no assunto. Outros temas abordados incluem a pressão dos EUA sobre instituições multilaterais de crédito, a seca na Europa e seus impactos, e a primeira morte de uma lula-lobo australiana devido à gripe aviária H5, refletindo preocupações com espécies em perigo.", "direitos_humanos": "Em uma escola na Cisjordânia, um diretor instalou uma nova cerca de arame farpado após a morte de três alunos este ano, levantando preocupações entre os pais palestinos sobre os ataques a escolas na região ocupada. A ministra de Mulheres e Igualdade de Gênero criticou a decisão no caso Mariana Sepúlveda, afirmando que o autor confesso do crime permanece livre, sentindo-se impotente diante dessa situação. A Turquia realizou uma operação contra organizações, empresas e indivíduos LGBTQ+, acusando-os de atividades como prostituição e conteúdo obsceno. Diante da guerra dos Estados Unidos, a vida digna continua sendo um sonho distante para muitas famílias iranianas. Em China, um proprietário de Porsche colocou 90 cartazes de crianças desaparecidas em seu carro, gerando grande atenção nas redes sociais e recentemente reuniu uma família. Finalmente, a missão francesa nas Nações Unidas pediu desculpas após criticar a postura dos Estados Unidos durante uma votação no Conselho de Segurança."}, "resumo_do_dia": {"politica_nacional": [{"id": 159679, "titulo": "Fachin pede à PGR manifestação sobre quebra de sigilo pedida por Moraes", "url": "https://www.metropoles.com/brasil/fachin-pede-a-pgr-manifestacao-sobre-quebra-de-sigilo-pedida-por-moraes", "fonte_id": "metropoles", "data_pub": "2026-09-13T21:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Supremo Tribunal Federal (STF), Ministro Fachin, solicitou que a Procuradoria-Geral da República (PGR) apresentasse uma manifestação antes de tomar uma decisão sobre a abertura da Petição 15.645, que pede a quebra de sigilo de alguém, supostamente investigado pelo Ministro Moraes.", "titulo_pt": "Fachin pede manifestação da PGR sobre quebra de sigilo solicitada por Moraes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 159629, "titulo": "Fachin manda PGR opinar ‘com brevidade’ sobre nova queda de braço entre Moraes e Mendonça", "url": "https://veja.abril.com.br/politica/fachin-manda-pgr-opinar-com-brevidade-sobre-nova-queda-de-braco-entre-moraes-e-mendonca/", "fonte_id": "veja", "data_pub": "2026-09-13T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Supremo Tribunal Federal (STF), Ministro Luiz Fux, solicitou ao Procurador-Geral da República (PGR) que se manifestasse rapidamente sobre uma nova disputa entre os ministros do STF, Alexandre Moraes e Luís Roberto Barroso, em relação a um pedido de sigilo de uma petição relacionada ao caso Master.", "titulo_pt": "Fux pede opinião rápida da PGR sobre nova disputa entre ministros do stf", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 159585, "titulo": "Polícia Civil deixou produtora de 'Dark Horse' de fora de pedido ao Coaf", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/policia-civil-deixou-produtora-de-dark-horse-de-fora-de-pedido-ao-coaf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-13T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Civil de São Paulo ainda não esclareceu, em setembro, se recursos públicos foram usados para financiar 'Dark Horse', quase seis meses após o Ministério Público estadual requisitar a abertura da investigação em março.", "titulo_pt": "Polícia Civil não esclareceu uso de recursos públicos em 'Dark Horse'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 159710, "titulo": "Fachin envia à PGR pedido de Moraes sobre petição sigilosa do Master", "url": "https://www.infomoney.com.br/politica/fachin-envia-a-pgr-pedido-de-moraes-sobre-peticao-sigilosa-do-master/", "fonte_id": "infomoney", "data_pub": "2026-09-13T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, Fachin, enviou um pedido à PGR sobre uma petição sigilosa do Master, sem rejeitar ou acolher a solicitação. O documento está relacionado a um julgamento marcado para a terça-feira.", "titulo_pt": "Fachin envia pedido à PGR sobre petição sigilosa do Master", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 159586, "titulo": "Moraes pede a Fachin retirada de sigilo de dados sobre rede de pagamentos do Master", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/moraes-pede-a-fachin-retirada-de-sigilo-de-dados-sobre-rede-de-pagamentos-do-master.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-13T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Alexandre de Moraes solicitou ao presidente do STF, Edson Fachin, que fosse levantado o sigilo de um inquérito sobre o caso do Banco Master antes do julgamento marcado para terça-feira. Moraes fez essa solicitação neste domingo (13).", "titulo_pt": "Moraes pede retirada de sigilo de inquérito sobre banco Master a Fachin", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 159687, "titulo": "Ex-ministros, economistas e empresários assinam carta em apoio a Fachin", "url": "https://www.metropoles.com/brasil/ex-ministros-economistas-e-empresarios-assinam-carta-em-apoio-a-fachin", "fonte_id": "metropoles", "data_pub": "2026-09-13T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ex-ministros, economistas e empresários assinaram uma carta em apoio a Fachin, reiterando que o STF não deve permitir que sua jurisdição seja influenciada por interesses duvidosos.", "titulo_pt": "Ex-ministros, economistas e empresários apoiam Fachin contra influência de interesses duvidosos no stf", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 159611, "titulo": "Veja como foi o fim de semana dos candidatos a presidente", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/veja-como-foi-o-final-de-semana-dos-candidatos-presidente", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-13T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos à Presidência da República realizaram diversas atividades durante o fim de semana, incluindo atos de campanha, reuniões e entrevistas. Luiz Inácio Lula da Silva, entre outros, criticou o Supremo Tribunal Federal (STF) por supostos vazamentos de investigações.", "titulo_pt": "Veja como foi o fim de semana dos candidatos a presidente", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 159729, "titulo": "OPINIÃO. Carece de seriedade", "url": "https://braziljournal.com/opiniao-carece-de-seriedade/", "fonte_id": "brazil_journal", "data_pub": "2026-09-13T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Aliomar Baleeiro rejeitou uma suspeição arguida contra o ministro Victor Nunes Leal em quatro palavras: 'Rejeito, carece de seriedade'. Este episódio ficou marcado na memória forense.", "titulo_pt": "OPINIÃO. Carece de seriedade", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 159587, "titulo": "Zanin ordena acesso à integra de celular de Vorcaro e diz não haver 'hierarquia entre ministros' do STF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/zanin-ordena-acesso-a-integra-de-celular-de-vorcaro-e-diz-nao-haver-hierarquia-entre-ministros-do-stf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-13T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Cristiano Zanin, do STF, determinou que a Polícia Federal entregasse a íntegra do conteúdo do celular do banqueiro Daniel Vorcaro até às 23 horas deste domingo. Zanin afirmou que não há 'hierarquia entre ministros' do STF.", "titulo_pt": "Zanin ordena acesso à integra de celular de Vorcaro e diz não haver 'hierarquia entre ministros' do STF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 159635, "titulo": "MPF abre inquérito para investigar desvios milionários em contratos públicos no Acre", "url": "https://veja.abril.com.br/brasil/mpf-abre-inquerito-para-investigar-desvios-milionarios-em-contratos-publicos-no-acre/", "fonte_id": "veja", "data_pub": "2026-09-13T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Federal (MPF) abriu um inquérito para investigar desvios financeiros em contratos públicos no estado do Acre. O caso específico envolve contratos de merenda escolar.", "titulo_pt": "MPF abre inquérito para investigar desvios em contratos de merenda escolar no Acre", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 159588, "titulo": "Cármen Lúcia tem participação prevista em seminário da USP sobre 'Crise da democracia'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/carmen-lucia-participa-de-seminario-da-usp-sobre-crise-da-democracia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-13T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra Cármen Lúcia participará de um seminário sobre 'Crise da democracia', promovido pela USP, na segunda-feira (14). O evento ocorre em meio a uma crise no STF.", "titulo_pt": "Cármen Lúcia participará de seminário sobre 'Crise da democracia' na USP", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 159612, "titulo": "Às vésperas da sessão, STF vive disputa nos bastidores sobre votos, alcance do julgamento e pedido de vista", "url": "https://g1.globo.com/politica/blog/andreia-sadi/post/2026/09/13/stf-vive-disputa-nos-bastidores-sobre-votos-alcance-do-julgamento-e-pedido-de-vista.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-13T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A sessão do Supremo Tribunal Federal marcada para terça-feira (15) sobre o caso Master e o ministro Alexandre de Moraes está sendo tratada como decisiva, mas há incerteza sobre o que será discutido, com possibilidade de pedido de vista. Os ministros ainda não definiram o conteúdo exato da sessão, e há articulações para evitar uma decisão sobre o mérito das mensagens.", "titulo_pt": "Na véspera da sessão, STF enfrenta disputa nos bastidores sobre o conteúdo do julgamento e possibilidade de pedido de vista", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 159656, "titulo": "“Guerra de petições” pode atrapalhar julgamento no STF, dizem especialistas", "url": "https://www.cnnbrasil.com.br/politica/guerra-de-peticoes-pode-atrapalhar-julgamento-no-stf-dizem-especialistas/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-13T20:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) vai julgar na terça-feira (15) se incluirá o ministro Luís Roberto Barroso na investigação do caso Master. Advogadas ouvidas pela CNN indicam que há uma 'guerra de petições' envolvendo disputa interna por poder e tentativa de atrapalhar o julgamento.", "titulo_pt": "Guerra de petições pode atrapalhar julgamento no STF, dizem especialistas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [{"titulo": "Moraes pede nova retirada de sigilo antes de julgamento no STF", "sumario": "O ministro Moraes solicitou uma nova retirada do sigilo dos autos antes do julgamento no STF, que discutirá mensagens entre ele e Vorcaro. O ministro do STF (Supremo Tribunal Federal) Edson Fachin solicitou acesso a uma nova petição sigilosa antes do julgamento no STF. O ministro do STF, Alexandre Moraes, solicitou uma nova quebra de sigilo antes de uma sessão marcada para terça-feira.", "artigos": [{"id": 159683, "titulo": "Moraes pede nova retirada integral de sigilo antes de julgamento no STF", "url": "https://www.metropoles.com/colunas/manoela-alcantara/moraes-pede-nova-retirada-integral-de-sigilo-antes-de-julgamento-no-stf", "fonte_id": "metropoles", "data_pub": "2026-09-13T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Moraes solicitou uma nova retirada do sigilo dos autos antes do julgamento no STF, que discutirá mensagens entre ele e Vorcaro. Os autos contêm elementos essenciais para a sessão.", "titulo_pt": "Moraes pede nova retirada de sigilo antes de julgamento no STF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 159711, "titulo": "Moraes pede acesso a nova petição sigilosa antes de julgamento no STF", "url": "https://www.infomoney.com.br/politica/moraes-pede-acesso-a-nova-peticao-sigilosa-antes-de-julgamento-no-stf/", "fonte_id": "infomoney", "data_pub": "2026-09-13T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF (Supremo Tribunal Federal) Edson Fachin solicitou acesso a uma nova petição sigilosa antes do julgamento no STF. Fachin está buscando documentos de procedimento sob a relatoria do ministro André Mendonça, que estão relacionados às investigações do Banco Master.", "titulo_pt": "Fachin pede acesso a nova petição sigilosa antes de julgamento no STF", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 159651, "titulo": "Moraes pede nova queda de sigilo antes de sessão de terça-feira no STF", "url": "https://www.cnnbrasil.com.br/politica/moraes-pede-nova-queda-de-sigilo-antes-de-sessao-de-terca-feira-no-stf/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-13T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF, Alexandre Moraes, solicitou uma nova quebra de sigilo antes de uma sessão marcada para terça-feira. A petição inclui detalhes sobre a rede de pagamentos do Vorcaro e do Banco Master.", "titulo_pt": "Moraes solicita nova quebra de sigilo antes de sessão no STF", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}]}], "mundo": [{"id": 159479, "titulo": "More delegations visit Taiwan: MOFA", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/14/2003864219", "fonte_id": "taipei_times", "data_pub": "2026-09-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "tex a alega que não adotou as propostas da coalizão sobre migração. O partido pretende vincular os números de imigração à construção de casas e que o Ministro da Habitação deve comparecer ao Parlamento sobre o assunto.", "titulo_pt": "Política em tempo real: partido laborista revela política de imigração 'net-negativa'; impulso elétrico para australianos economizarem r$ 5.000 por ano", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 159829, "titulo": "Los socialdemócratas ganan en Suecia, pero las proyecciones apuntan a un escenario de igualdad máxima entre bloques", "url": "https://elpais.com/internacional/2026-09-13/los-socialdemocratas-ganan-las-elecciones-en-suecia-segun-los-sondeos-a-pie-de-urna.html", "fonte_id": "elpais_america", "data_pub": "2026-09-13T21:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Os partidos de centro-esquerda ganham na Suécia, com projeções para 175 vagas no parlamento, contra 174 para a direita. A ultradireita perdeu votos e foi superada pelos conservadores.", "titulo_pt": "Os socialdemocratas ganham em suécia, mas projeções apontam para igualdade máxima entre bloques", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 159856, "titulo": "Russian Strikes on Ukraine Hits Near David Petraeus, ex-C.I.A. Chief", "url": "https://www.nytimes.com/2026/09/13/world/europe/ukraine-petraeus-russian-strike.html", "fonte_id": "nyt_world", "data_pub": "2026-09-13T21:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "David Petraeus estava em uma estação de trem quando uma aeronave não tripulada atingiu o local. Segundo autoridades ucranianas, um trem com o ex-Primeiro Ministro Boris Johnson da Grã-Bretanha e outros dignitários acabava de sair do local.", "titulo_pt": "Ataque russo em Ucrânia perto de David Petraeus, ex-chefe da c.I.A.", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 159632, "titulo": "Drone russo atinge trem perto da Polônia e primeiro-ministro fala em escalada", "url": "https://veja.abril.com.br/mundo/drone-russo-atinge-trem-perto-da-polonia-e-primeiro-ministro-fala-em-escalada/", "fonte_id": "veja", "data_pub": "2026-09-13T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um drone russo atingiu um trem perto da Polônia, após a passagem de uma locomotiva com ex-primeiros-ministros. O incidente não resultou em feridos.", "titulo_pt": "Drone russo atinge trem perto da Polônia", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 159790, "titulo": "Los ataques en dos frentes en Medio Oriente amenazan con agravar las turbulencias en el suministro global de petróleo", "url": "https://www.lanacion.com.ar/el-mundo/los-ataques-en-dos-frentes-en-medio-oriente-amenazan-con-agravar-las-turbulencias-en-el-suministro-nid13092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-13T21:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em mais um ataque, um navio foi atingido no Estreito de Ormuz, enquanto um oleoduto saudita foi danificado. A expectativa é de que esses incidentes aumentem as turbulências no fornecimento global de petróleo.", "titulo_pt": "Ataques em dois frentes no Oriente médio ameaçam agravar as turbulências no suprimento global de petróleo", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 159968, "titulo": "N. Korea reports latest missile launches, calling it strike drill", "url": "https://en.yna.co.kr/view/AEN20260914000851320", "fonte_id": "yonhap_news", "data_pub": "2026-09-13T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A mídia estatal norte-coreana informou que o país realizou lançamentos de mísseis, descrevendo-os como uma drill de ataque.", "titulo_pt": "Coreia do norte relata lançamentos de mísseis, chamando-os de drill de ataque", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 159712, "titulo": "Omã: reunião com Irã, Iraque e países do Golfo sobre navegação em Ormuz é adiada", "url": "https://www.infomoney.com.br/mundo/oma-reuniao-com-ira-iraque-e-paises-do-golfo-sobre-navegacao-em-ormuz-e-adiada/", "fonte_id": "infomoney", "data_pub": "2026-09-13T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reunião entre Omã, Irã, Iraque e países do Golfo sobre a navegação no Estreito de Ormuz foi adiada, conforme declarou o ministro das Relações Exteriores de Omã, Badr Albusaidi. O encontro foi postergado para buscar um consenso entre as partes.", "titulo_pt": "Omã: reunião com Irã, Iraque e países do Golfo sobre navegação no estreito de Ormuz é adiada", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 159903, "titulo": "The 'authenticity' of Celine Dion: 'She appeals to the Boomers and the Zoomers'", "url": "https://www.france24.com/en/tv-shows/spotlight/20260913-the-authenticity-of-celine-dion-she-appeals-to-the-boomers-and-the-zoomers", "fonte_id": "france24", "data_pub": "2026-09-13T21:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nick Rees-Roberts, professor de mídia, cultura e comunicação da Sorbonne Nouvelle University, Paris, explica que a retomada de Céline Dion em Paris revela mais do que apenas a popularidade duradoura de uma estrela pop global. Seu appeal está em sua habilidade única de conectar gerações, línguas e hierarquias culturais, mesmo entre o que a cultura pop contemporânea frequentemente mantém separados: a aparente oposição entre autenticidade e estrelismo cuidadosamente construído.", "titulo_pt": "A 'autenticidade' de céline Dion: 'ela atrai baby Boomers e millennials'}", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 159902, "titulo": "Swedish party blocs tied after Sunday vote, projections say", "url": "https://www.bbc.co.uk/news/articles/c0qx5d79kdeo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-09-13T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "B"}, {"id": 159964, "titulo": "What’s behind the AI industry’s latest warnings of doom?", "url": "https://techcrunch.com/2026/09/13/whats-behind-the-ai-industrys-latest-warnings-of-doom/", "fonte_id": "techcrunch", "data_pub": "2026-09-13T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria de IA está debatendo se ela representa uma ameaça existencial para a humanidade. Este debate é abordado no Equity, um programa de discussão sobre tecnologia.", "titulo_pt": "O que está por trás das últimas advertências da indústria de IA sobre o fim?", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 159956, "titulo": "Trump downplays need to check AI development, says he is unwilling to cede edge to China", "url": "https://www.scmp.com/news/world/united-states-canada/article/3367374/trump-downplays-need-check-ai-development-says-he-unwilling-cede-edge-china?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-13T19:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, minimizou a necessidade de regulamentar o desenvolvimento da inteligência artificial, afirmando que tem medo de perder o avanço dos EUA em relação à China em uma competição global. Ele reconheceu a necessidade de algum tipo de regulação, mas não detalhou propostas específicas e atribuiu as preocupações sobre a tecnologia avançando rapidamente e sem supervisão a críticas negativas.", "titulo_pt": "Trump diminui a importância de regulamentar a AI, teme perder vantagem para China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 159721, "titulo": "Pause tudo: há jogos de Xbox em promoção que merecem sua atenção", "url": "https://olhardigital.com.br/2026/09/13/reviews/pause-tudo-ha-jogos-de-xbox-em-promocao-que-merecem-sua-atencao/", "fonte_id": "olhar_digital", "data_pub": "2026-09-13T19:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há jogos de s_org", "data_pub": "2026-09-13T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos descobriram que uma estrela distante, que parecia estar prestes a explodir em supernova, na verdade está sendo influenciada por uma companheira oculta, causando suas erupções.", "titulo_pt": "Astrônomos desvendam o impostor da supernova", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 159692, "titulo": "DNA de morcegos dá pistas sobre longevidade e resistência ao câncer", "url": "https://www.metropoles.com/ciencia/dna-de-morcegos-da-pistas-sobre-longevidade-e-resistencia-ao-cancer", "fonte_id": "metropoles", "data_pub": "2026-09-13T20:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo examinou espécies de morcegos que vivem até seis vezes mais que outras espécies, identificando adaptações relacionadas à imunidade e à resistência ao câncer. Essas adaptações podem fornecer pistas sobre longevidade e resistência ao câncer em morcegos.", "titulo_pt": "DNA de morcegos oferece insights sobre longevidade e resistência ao câncer", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 159973, "titulo": "AI helps microscopes find the most informative nanoscale features in a sample", "url": "https://phys.org/news/2026-09-ai-microscopes-nanoscale-features-sample.html", "fonte_id": "phys_org", "data_pub": "2026-09-13T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas do Laboratório Nacional de Oak Ridge, Departamento de Energia, desenvolveram um framework de inteligência artificial que auxilia na identificação de características nanosscale mais informativas utilizando microscópios de força atômica, permitindo que os pesquisadores se concentrem nas áreas mais relevantes de uma amostra.", "titulo_pt": "IA ajuda microscópios a identificar as características nanosscale mais informativas em uma amostra", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 159974, "titulo": "Masked tectonic structures suggest Mercury contracted 40% more than its visible scars alone indicate", "url": "https://phys.org/news/2026-09-masked-tectonic-mercury-visible-scars.html", "fonte_id": "phys_org", "data_pub": "2026-09-13T19:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A superfície de Mercúrio está cheia de crateras, sulcos e penhascos. Ao longo de bilhões de anos, com a resfriamento do seu interior, o planeta também se contraiu, formando sulcos e penhascos à medida que sua superfície se dobrava.", "titulo_pt": "Estruturas ocultas suggiadem que mercúrio contraiu-se 40% a mais do que indicam suas marcas visíveis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 159976, "titulo": "Saltwater flooding could radically change which crops are worth growing", "url": "https://phys.org/news/2026-09-saltwater-radically-crops-worth.html", "fonte_id": "phys_org", "data_pub": "2026-09-13T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inundações de água salgada estão se tornando um problema crescente para a agricultura na Inglaterra oriental, afetando tanto os cultivos quanto as receitas dos agricultores.", "titulo_pt": "Inundações de água salgada podem radicalmente alterar quais cultivos são valiosos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 159551, "titulo": "On this day in space! Sept. 13, 2007: Japan launches Kaguya spacecraft to the moon to map the lunar surface in HD", "url": "https://www.space.com/space-exploration/on-this-day-in-space-september-13-2026", "fonte_id": "space_com", "data_pub": "2026-09-13T17:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 13 de setembro de 2007, o Japão lançou o foguetão Kaguya para a lua com o objetivo de mapear a superfície lunar em alta definição.", "titulo_pt": "13 De setembro de 2007: Japão lança foguetão Kaguya para mapear a lua em HD", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 159525, "titulo": "Luminescence dating pushes age of South Dakota's Mammoth Site back by more than 100,000 years", "url": "https://phys.org/news/2026-09-luminescence-dating-age-south-dakota.html", "fonte_id": "phys_org", "data_pub": "2026-09-13T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A datação luminiscente redefiniu a idade dos restos de mamutes no Sítio Mamut do Sudão, nos Estados Unidos, empurrando-a para mais de 160.000 anos, cerca de 100.000 anos a mais do que o valor anterior de 26.000 anos.", "titulo_pt": "Datação luminiscente redefine a idade dos mamutes do sítio mamut do sudão", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 159526, "titulo": "The tourism industry is slowly waking up to solo travelers' needs", "url": "https://phys.org/news/2026-09-tourism-industry-slowly-solo.html", "fonte_id": "phys_org", "data_pub": "2026-09-13T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de viajantes solitários está aumentando e a indústria do turismo está começando a prestar mais atenção a suas necessidades. Pesquisas online mostraram que as buscas por 'viagem solitária' atingiram um recorde este ano, com as buscas por 'mulheres viajando sozinhas' registrando um pico de 15 anos.", "titulo_pt": "O setor de turismo começa a notar as necessidades dos viajantes solitários", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 159527, "titulo": "Gravitational-wave analysis narrows the search for black hole impostors", "url": "https://phys.org/news/2026-09-gravitational-analysis-narrows-black-hole.html", "fonte_id": "phys_org", "data_pub": "2026-09-13T14:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Black holes são regiões do espaço-tempo onde a gravidade é tão forte que nada pode escapar, nem mesmo a luz. A análise de ondas gravitacionais está restringindo a busca por possíveis objetos compactos que não sejam buracos negros, mas que também produzam ondas gravitacionais similares àquelas geradas por fusões de buracos negros.", "titulo_pt": "Análise de ondas gravitacionais reduz a busca por buracos negros falsos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 159528, "titulo": "Fish may be highly sensitive to antidepressants found in water", "url": "https://phys.org/news/2026-09-fish-highly-sensitive-antidepressants.html", "fonte_id": "phys_org", "data_pub": "2026-09-13T14:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitos medicamentos que atuam no sistema nervoso humano, como antidepressivos, permanecem biologicamente ativos após saírem do corpo. Essas substâncias e seus metabólitos podem persistir nos efluentes domésticos e eventualmente chegar ao mar, rios ou outros ambientes aquáticos.", "titulo_pt": "Peixes podem ser altamente sensíveis a antidepressivos encontrados na água", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 158939, "titulo": "Cientistas querem descobrir se há detritos de civilizações alienígenas na Lua", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/cientistas-querem-descobrir-se-ha-detritos-de-civilizacoes-alienigenas-na-lua.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-13T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas planejam investigar a Lua em busca de evidências de detritos de civilizações alienígenas avançadas, como naves estelares e estruturas gigantes.", "titulo_pt": "Cientistas querem descobrir se há detritos de civilizações alienígenas na Lua", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 159553, "titulo": "NASA astronaut Jessica Meir shares zero-G curly hair tips from the ISS (video)", "url": "https://www.space.com/space-exploration/international-space-station/nasa-astronaut-jessica-meir-shares-zero-g-curly-hair-tips-from-the-iss-video", "fonte_id": "space_com", "data_pub": "2026-09-13T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astronauta Jessica Meir, da NASA, compartilhou dicas de penteados para cabelos crespos durante sua estadia na Estação Espacial Internacional (ISS).", "titulo_pt": "Astronauta Jessica Meir compartilha dicas de penteados para cabelos crespos da ISS (vídeo)", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 159535, "titulo": "Scientists find a new layer of Alzheimer’s hidden in the genome", "url": "https://www.sciencedaily.com/releases/2026/09/260912220051.htm", "fonte_id": "science_daily", "data_pub": "2026-09-13T13:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram que a organização tridimensional do DNA está desorganizada em várias células do cérebro afetadas pela doença de Alzheimer, alterando a atividade de genes importantes. Essa descoberta revela um nível anteriormente subexplorado da doença que pode abrir novas possibilidades para o entendimento e o tratamento da doença de Alzheimer.", "titulo_pt": "Cientistas encontram nova camada da doença de Alzheimer no genoma", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 159529, "titulo": "Cataract surgery will be needed in space, surgeon predicts", "url": "https://phys.org/news/2026-09-cataract-surgery-space-surgeon.html", "fonte_id": "phys_org", "data_pub": "2026-09-13T13:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um oftalmologista, apaixonado por espaço desde a infância, prevê que, à medida que astronautas iniciarem viagens à lua e Marte no futuro próximo, cirurgias oculares no espaço eventualmente se tornarão necessárias.", "titulo_pt": "Cirurgia de catarata no espaço será necessária, preveem oftalmologista", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 159536, "titulo": "Physicists can’t agree on how the Universe works", "url": "https://www.sciencedaily.com/releases/2026/09/260912220041.htm", "fonte_id": "science_daily", "data_pub": "2026-09-13T13:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um levantamento mundial de físicos revelou pouca concordância sobre algumas das maiores mistérios do universo. A maioria não apoia o modelo cosmológico padrão ou qualquer teoria única de gravidade quântica.", "titulo_pt": "Físicos não concordam sobre como o universo funciona", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}], "ciencia__eventos": [], "cultura": [{"id": 159485, "titulo": "Chinese microdrama distorts history: academic", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/14/2003864231", "fonte_id": "taipei_times", "data_pub": "2026-09-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um acadêmico afirma que um microdrama chinês distorce a história. O trabalho acadêmico critica a representação histórica no conteúdo do microdrama.", "titulo_pt": "Acadêmico critica distorção histórica em microdrama chinês", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 159486, "titulo": "CCP and China becoming one and the same: experts", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/14/2003864232", "fonte_id": "taipei_times", "data_pub": "2026-09-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos estão observando que o Partido Comunista Chinês (PCC) e a China estão se tornando cada vez mais indistinguíveis. Essa é uma percepção baseada em observações feitas por especialistas.", "titulo_pt": "Pcc e China se tornando uma só: especialistas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 159495, "titulo": "Abnormal state", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/14/2003864241", "fonte_id": "taipei_times", "data_pub": "2026-09-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A situação foi descrevida como anormal. O texto original não fornece detalhes adicionais sobre o que constitui essa situação anormal.", "titulo_pt": "Estado anorm endências do Rock in Rio", "url": "https://www.metropoles.com/colunas/ilca-maria-estevao/couro-jeans-e-animal-print-sao-as-principais-tendencias-do-rock-in-rio", "fonte_id": "metropoles", "data_pub": "2026-09-13T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Rock in Rio, que contou com apresentações de Elton John, Foo Fighters e Maroon 5, se tornou uma importante plataforma para mostrar as principais tendências de moda, incluindo couro, jeans e animal print.", "titulo_pt": "Couro, jeans e animal print são as principais tendências do Rock in Rio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 159648, "titulo": "Bienal do Livro de SP bate recorde histórico ao receber 760 mil visitantes", "url": "https://www.cnnbrasil.com.br/pop/bienal-do-livro-de-sp-bate-recorde-historico-ao-receber-760-mil-visitantes/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-13T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 28ª edição da Bienal do Livro de São Paulo bateu recorde ao receber 760 mil visitantes, se tornando a maior na história do evento literário.", "titulo_pt": "Bienal do Livro de SP bate recorde histórico ao receber 760 mil visitantes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 159789, "titulo": "Benjamin Franklin: “Las tres cosas más difíciles de la vida son guardar un secreto, perdonar un agravio y aprovechar el tiempo”", "url": "https://www.lanacion.com.ar/lifestyle/benjamin-franklin-las-tres-cosas-mas-dificiles-de-la-vida-son-guardar-un-secreto-perdonar-un-agravio-nid13092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-13T21:31:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Benjamin Franklin, considerado um dos fundadores dos Estados Unidos, definiu os pilares do autocontrole pessoal em uma citação que continua relevante para os desafios da sociedade moderna. Ele destacou a dificuldade de guardar segredos, perdoar ofensas e aproveitar o tempo.", "titulo_pt": "Benjamin Franklin: 'as três coisas mais difíceis da vida são guardar um segredo, perdoar um ressentimento e aproveitar o tempo'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 159954, "titulo": "Will Hong Kong’s educators learn from sliding Pisa results?", "url": "https://www.scmp.com/opinion/hong-kong-opinion/article/3367209/will-hong-kongs-educators-learn-sliding-pisa-results?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-13T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os resultados mais recentes do Programa para Avaliação do Desempenho de Estudantes no Mundo (Pisa) mostraram que Hong Kong apresentou uma performance ruim. O Departamento de Educação pode estar sendo questionado sobre se aprendeu com os resultados da avaliação anterior.", "titulo_pt": "Educadores de Hong Kong aprenderão com os resultados ruins do Pisa?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 159605, "titulo": "Bienal do Livro, com muvuca e mascarados, faz lambança do sucesso", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/bienal-do-livro-com-muvuca-e-mascarados-faz-lambanca-do-sucesso.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-13T21:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um mascarado causou pânico durante a Bienal do Livro, gerando uma confusão. O evento, no entanto, continuou como um sucesso.", "titulo_pt": "Bienal do Livro, com pânico causado por mascarado, faz sucesso", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 159634, "titulo": "Ivete Sangalo oferece ao Rock in Rio o biscoito de sempre em embalagem espanhola", "url": "https://veja.abril.com.br/cultura/ivete-sangalo-oferece-ao-rock-in-rio-o-biscoito-de-sempre-em-embalagem-espanhola/", "fonte_id": "veja", "data_pub": "2026-09-13T21:12:00Z", "idioma": "pt", "prova function renderSecao(topico) {

function toggleDrill(id) {

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

  return "8h";

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
