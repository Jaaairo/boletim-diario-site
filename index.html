ub": "2026-11-12T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo do Pará decretou uma emergência ambiental e climática devido à influência do El Niño, que durará 120 dias. Durante esse período, todas as autorizações e concessões para o uso do fogo no estado estão suspensas.", "titulo_pt": "Devido ao El Niño, governo do Pará declara emergência ambiental e climática por 120 dias", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 260073, "titulo": "COP31: How Ed Miliband answered Carbon Brief readers’ questions", "url": "https://www.carbonbrief.org/cop31-how-ed-miliband-answered-carbon-brief-readers-questions", "fonte_id": "carbon_brief", "data_pub": "2026-11-12T16:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ed Miliband, ex-secretário de Estado britânico e veterano das conferências COP, participou de uma entrevista com o Carbon Brief durante a COP31 em Antalya, Turquia, respondendo a perguntas dos leitores do site.", "titulo_pt": "COP31: como Ed Miliband respondeu às perguntas dos leitores do Carbon Brief", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 259413, "titulo": "Temporais no Brasil: entenda como El Niño influencia eventos meteorológicos", "url": "https://www.cnnbrasil.com.br/nacional/brasil/temporais-no-brasil-entenda-como-el-nino-influencia-eventos-meteorologicos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T16:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fenômeno El Niño modifica a circulação atmosférica no Brasil, podendo causar períodos de chuva intensa e tempestades severas. A ocorrência de tornados, no entanto, depende de condições específicas.", "titulo_pt": "Temporais no Brasil: entenda como El Niño influencia eventos meteorológicos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 259588, "titulo": "The planet ‘is being killed’, Greta Thunberg tells Cop31 climate summit", "url": "https://www.theguardian.com/environment/2026/nov/12/greta-thunberg-cop31-climate-summit", "fonte_id": "guardian_world", "data_pub": "2026-11-12T16:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Greta Thunberg criticou os governos mundiais por sua falha em prevenir o colapso ambiental. Ela afirmou que a 'planeta está sendo morto, e sabemos por quem', durante sua primeira aparição na conferência anual das Nações Unidas sobre clima em Antalya, Turquia.", "titulo_pt": "Planeta 'está sendo morto', afirma Greta Thunberg em conferência climática", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 259371, "titulo": "Cinema movido a energia solar percorre o Nordeste em ação sustentável", "url": "https://exame.com/bussola/cinema-movido-a-energia-solar-percorre-o-piaui-em-acao-sustentavel/", "fonte_id": "exame", "data_pub": "2026-11-12T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma iniciativa gratuita da AXIA Energia e Brazucah Produções está percorrendo o Nordeste com uma van equipada com placas solares para exibir filmes e oferecer uma estação de ciências.", "titulo_pt": "Cinema movido a energia solar percorre o Nordeste em ação sustentável", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 258552, "titulo": "“Não há contradição” entre petróleo e transição energética, diz ministro", "url": "https://www.cnnbrasil.com.br/internacional/coletiva-transicao-energetica-petroleo-venezuela-brasil-cop-31/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-12T09:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro João Paulo Capobianco afirmou que não há contradição entre o petróleo e a transição energética durante a COP31. Essa declaração foi feita um dia após o presidente discutir investimentos no setor petrolífero com a Venezuela.", "titulo_pt": "Não há contradição entre petróleo e transição energética, diz ministro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 258536, "titulo": "Ponto de recarga para carros elétricos é destruído por incêndio no DF", "url": "https://www.metropoles.com/distrito-federal/ponto-de-recarga-para-carros-eletricos-e-destruido-por-incendio-no-df", "fonte_id": "metropoles", "data_pub": "2026-11-12T09:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incidente de incêndio destruiu um ponto de recarga para carros elétricos na noite de 11 de novembro na Avenida Alagados, em Santa Maria (DF). Não houve registros de vítimas.", "titulo_pt": "Ponto de recarga para carros elétricos é destruído por incêndio no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 258663, "titulo": "Cubrieron parte de un glaciar con lana de oveja y redujeron su deshielo en más del 50%", "url": "https://www.lanacion.com.ar/ciencia/cubrieron-parte-de-un-glaciar-con-lana-de-oveja-y-redujeron-su-deshielo-en-mas-del-50-nid11112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-12T09:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um experimento suíço demonstrou que o uso de fibras naturais, como lã de ovelha, pode reduzir o deshielo de glaciares em mais de 50%. Este método evita a degradação ambiental associada aos materiais sintéticos.", "titulo_pt": "Parte de um glaciar foi coberta com lã de ovelha e seu deshielo foi reduzido em mais de 50%", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 258665, "titulo": "Se aceleró el calentamiento global: el planeta consumió casi la totalidad de su margen de seguridad climática", "url": "https://www.lanacion.com.ar/ciencia/se-acelero-el-calentamiento-global-el-planeta-consumio-casi-la-totalidad-de-su-margen-de-seguridad-nid11112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-12T09:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo científico indica que o aquecimento global já consumiu quase toda a margem de segurança climática estabelecida pelo Acordo de Paris. Os especialistas alertam sobre a rapidez do processo.", "titulo_pt": "Acelerou o aquecimento global: o planeta consumiu quase toda a margem de segurança climática", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 258674, "titulo": "Alerta por temperaturas extremas: norte y centro del país podrían alcanzar hasta 38°C", "url": "https://www.latercera.com/tendencias/noticia/alerta-por-temperaturas-extremas-norte-y-centro-del-pais-podrian-alcanzar-hasta-38c/", "fonte_id": "la_tercera", "data_pub": "2026-11-12T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Direção Meteorológica de Chile emitiu uma alerta para altas temperaturas extremas que se estenderão até a tarde de quinta-feira. A Região Metropolitana também declarou uma Alerta Amarilla por calor intenso.", "titulo_pt": "Alerta para temperaturas extremas: norte e centro do país podem atingir até 38°C", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 258577, "titulo": "Os ventos que vêm dos EUA e o clima quente na COP31", "url": "https://apublica.org/podcast/2026/11/bom-dia-fim-do-mundo/os-ventos-que-vem-dos-eua-e-o-clima-quente-na-cop31/", "fonte_id": "agencia_publica", "data_pub": "2026-11-12T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O podcast examina a importância do multilateralismo na luta contra a crise climática. Os ventos dos Estados Unidos e o clima quente são mencionados como contextos para a discussão.", "titulo_pt": "Os ventos dos EUA e o clima quente na COP31", "veiculo": "Agência Pública", "pais": "Brasil", "classe": "B"}, {"id": 258509, "titulo": "COP31 chega ao quarto dia com despedida de Lula e debates sobre cidades resilientes", "url": "https://exame.com/esg/cop31-chega-ao-quarto-dia-com-saida-de-lula-e-debates-sobre-cidades-resilientes/", "fonte_id": "exame", "data_pub": "2026-11-12T06:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A COP31 prossegue com debates sobre invest '. O fechamento visa, segundo a organização, 'isolar' pessoas LGBTQ+ e privá-las de um espaço para organizar-se.',", "titulo_pt": "Escritório da organização LGBTQ+ mais antiga da Turquia fechado", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 259829, "titulo": "10 Palestinians killed since dawn", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/11-palestinians-killed-dawn", "fonte_id": "middle_east_eye", "data_pub": "2026-11-12T15:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dez palestinos foram mortos em ataques israelenses em Gaza desde o amanhecer, incluindo dois ataques a hospitais que resultaram em pelo menos sete mortes. Um ataque noturno a um hospital médico Nasser em Khan Younis causou a morte de seis pessoas, entre elas cirurgiões e pacientes, e um ataque a um veículo por um drone israelense no sul de Deir al-Balah também resultou em várias vítimas.", "titulo_pt": "10 Palestinos mortos em ataques israelenses em gaza desde o amanhecer", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 259667, "titulo": "“Sin importar las fechas de vencimiento”: la trama que facilitó desde el Estado que las AFP perdieran US$10.000 millones de sus afiliados", "url": "https://www.ciperchile.cl/2026/11/12/sin-importar-las-fechas-de-vencimiento-la-trama-que-facilito-desde-el-estado-que-las-afp-perdieran-us10-000-millones-de-sus-afiliados/?utm_source=rss&utm_medium=rss&utm_campaign=sin-importar-las-fechas-de-vencimiento-la-trama-que-facilito-desde-el-estado-que-las-afp-perdieran-us10-000-millones-de-sus-afiliados", "fonte_id": "ciper_chile", "data_pub": "2026-11-12T14:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A notícia relata uma trama que permitiu que as Administradoras de Fundos de Pensão (AFP) perdessem US$10.000 milhões de seus afiliados. Este evento ocorreu independentemente das datas de vencimento.", "titulo_pt": "Indiferente às datas de vencimento: a trama que permitiu que as AFP perdessem US$10.000 milhões dos seus afiliados", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 258983, "titulo": "Debt collector, 20, held in Hong Kong after 15 doxxed over unpaid loans", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3374197/debt-collector-20-held-hong-kong-after-15-doxxed-over-unpaid-loans", "fonte_id": "scmp", "data_pub": "2026-11-12T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um indivíduo de 20 anos foi preso em Hong Kong sob suspeita de divulgar informações pessoais de 15 vítimas online sem consentimento, em relação a empréstimos não pagos. A Comissaria de Proteção de Dados da cidade anunciou que mensagens contendo dados pessoais dos vítimas foram postadas em duas contas de mídia social em setembro.", "titulo_pt": "Coletor de dívidas, de 20 anos, detido em Hong Kong após doxxar 15 pessoas por empréstimos não pagos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 258548, "titulo": "Relatório expõe perseguição a cristãos após avanço do terrorismo na África", "url": "https://www.metropoles.com/mundo/relatorio-expoe-perseguicao-a-cristaos-apos-avanco-do-terrorismo-na-africa", "fonte_id": "metropoles", "data_pub": "2026-11-12T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório publicado pela fundação Ajuda à Igreja que Sofre (ACN) revela que a perseguição contra cristãos aumentou entre 2024 e 2026. O relatório destaca o aumento da perseguição após o avanço do terrorismo na África.", "titulo_pt": "Relatório mostra aumento da perseguição a cristãos após avanço do terrorismo na África", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 258906, "titulo": "Amnesty says UN, South Sudan officials failed to prevent village massacre", "url": "https://www.aljazeera.com/news/2026/11/12/amnesty-says-un-south-sudan-officials-failed-to-prevent-village-massacre?traffic_source=rss", "fon ": "science_news", "titulo": "The brain’s fear center moonlights as the save button for memories", "url": "https://www.sciencenews.org/article/brain-amygdala-neuron-saves-memories", "data_pub": "2026-11-12T16:00:00Z", "topico": "ciencia", "idioma": "en", "titulo_pt": "O centro de medo do cérebro atua como o botão de salvamento de memórias", "veiculo": "Science News", "pais": "EUA", "classe": "A"}], "destaque": {"titulo_evento": "Renúncia de Huang à liderança da Nvidia", "texto_pt": "Jensen Huang, fundador e ex-CEO da Nvidia, renunciou ao cargo após ser envolvido em um escândalo de relações extraconjugais, incluindo um suposto caso com uma espiã chinesa. Sua saída, ocorrida em 12 de novembro de 2020, levantou questões sobre a governança da empresa e as implicações para o futuro do desenvolvimento de inteligência artificial. O anúncio suscitou reações de figuras políticas, como o ex-presidente dos Estados Unidos, Donald Trump, que sugeriu nomes como Tim Cook, ex-CEO da Apple, e Steve Jobs para substituir Huang. A empresa anunciou que a diretora financeira, Colette Kress, assumiria interinamente a posição de CEO. O conselho de administração da Nvidia enfrentou um dilema de lealdade ao considerar a permanência de Huang, que foi crucial para a transformação da empresa em uma das mais valiosas do mundo. A saída de Huang, que ocorreu em meio a preocupações de segurança, pode ser vista como um catalisador que ameaça o aumento da bolha de inteligência artificial, levantando dúvidas sobre a direção futura da empresa e suas implicações geopolíticas. O escândalo também gerou debates sobre a importância de governança corporativa e ética na indústria tecnológica.", "data_edicao": "2026-11-12", "artigos": [{"id": 259907, "titulo": "Nvidia’s Jensen Huang steps down from positions", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/13/2003867651", "fonte_id": "taipei_times", "data_pub": "2026-11-13T00:00:00Z", "topico": "tecnologia", "idioma": "en", "texto_resumo": "Jensen Huang, CEO da Nvidia, deixou suas posições na empresa. Não há detalhes adicionais sobre as razões ou o futuro de Huang no texto fornecido.", "titulo_pt": "Jensen Huang deixa posições na nvidia", "texto_pt": "Jensen Huang, CEO da Nvidia, deixou suas posições na empresa. Não há detalhes adicionais sobre as razões ou o futuro de Huang no texto fornecido.", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 260540, "titulo": "Huang Out at Nvidia", "url": "https://foreignpolicy.com/2026/11/12/nvidia-jensen-huang-resigns-ai-china-spy-megaspeed-extramarital-affairs/", "fonte_id": "foreign_policy", "data_pub": "2026-11-12T20:50:00Z", "topico": "geopolitica", "idioma": "en", "texto_resumo": "O CEO da Nvidia, uma empresa de chips americana, deixou o cargo após ser acusado de envolvimento com uma suposta espia chinesa.", "titulo_pt": "Huang deixa a Nvidia", "texto_pt": "O CEO da Nvidia, uma empresa de chips americana, deixou o cargo após ser acusado de envolvimento com uma suposta espia chinesa.", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 260487, "titulo": "Jensen Huang mantuvo una tercera relación extramarital con otra empleada de Nvidia", "url": "https://elpais.com/us/2026-11-12/jensen-huang-mantuvo-una-tercera-relacion-extramarital-con-una-empleada-de-nvidia.html", "fonte_id": "elpais_america", "data_pub": "2026-11-12T20:14:00Z", "topico": "politica_internacional", "idioma": "es", "texto_resumo": "Jensen Huang, fundador da Nvidia, renunciou ao cargo de CEO após as pressões causadas pelo escândalo de suas relações extraconjugais, incluindo uma suposta espía chinesa. Huang também renunciou como conselheiro delegado da empresa.", "titulo_pt": "Jensen Huang renunciou como ceo da Nvidia devido a escândalo de infidelidades", "texto_pt": "Jensen Huang, fundador da Nvidia, renunciou ao cargo de CEO após as pressões causadas pelo escândalo de suas relações extraconjugais, incluindo uma suposta espía chinesa. Huang também renunciou como const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
