<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

const D = {"gerado_em": "07/08/2026 15:23", "stats": {"noticias_novas": 1168, "resumos_gerados": 257}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O candidato Ronaldo Caiado (PSD) sugeriu a criação de uma polícia conjunta com países sul-americanos para combater o crime organizado, seguindo um modelo semelhante ao europeu. Em outra frente, a Federação Lula acionou o TSE contra um projeto de lei proposto por Flávio Bolsonaro no PL, alegando uso indevido de verbas públicas. No âmbito judicial, o STF decidiu que curadores podem acumular honorários contratuais e de sucumbência, enquanto o TSE criou um conselho para monitorar fake news e inteligência artificial nas eleições. A campanha de Flávio Bolsonaro planeja produzir vídeos específicos para diferentes grupos evangélicos, refletindo a divisão do voto entre Lula e Bolsonaro nessa base eleitoral.", "mundo": "O Senado dos Estados Unidos aprovou recentemente novas sanções contra a Rússia e o Irã, aumentando as tensões geopolíticas. A aprovação visa impactar os principais compradores de petróleo e gás da Rússia e a economia do Irã, reforçando a pressão econômica sobre esses países. Em outro desenvolvimento, o presidente dos Estados Unidos, Donald Trump, enfrenta vários obstáculos legais em seus planos para construir um salão de festas na Casa Branca sem aprovação do Congresso, com a Corte Suprema americana confirmando uma decisão que impede a continuação das obras. Além disso, o Senado aprovou um projeto de lei que impõe sanções econômicas à Rússia, permitindo novas tarifas severas sobre importadores maiores de energia russa, liderado pelo senador Lindsey Graham.\n\nA Arábia Saudita, Turquia e Paquistão assinaram um pacto de defesa mútua em Mecca. De acordo com o acordo, uma ameaça armada contra qualquer um dos países será considerada como uma ameaça contra todos os outros. O objetivo é fortalecer a cooperação militar entre eles, especialmente diante das crescentes tensões com o Irã e suas aliadas. Em outro desenvolvimento, dois civis foram mortos em Marib durante um ataque hutita, levando o ministro da Saúde do Iêmen a acusar o grupo de ter alvos residenciais. Além disso, a Rússia intensificou seus ataques com bombas guiadas na Ucrânia, enquanto a China está utilizando inteligência artificial para planejar operações de ataque, levantando preocupações sobre o futuro do controle humano nas guerras. Esses eventos refletem os complexos desafios geopolíticos enfrentados atualmente e as estratégias adotadas pelos principais players internacionais.", "economia": "A economia brasileira e internacional enfrenta vários desafios e oportunidades. A Petrobras afirmou que um dividendo extraordinário é 'muito pouco provável', apesar de ter registrado um lucro recorde no segundo trimestre. A atividade econômica mais fraca pode levar o Banco Central a reduzir a taxa básica de juros (Selic) para 13,25% ao ano até o final de 2026, conforme análise do Bradesco. Além disso, as ações da Renner caíram após a empresa revisar sua projeção de vendas para 2026, pressionando as bolsas, enquanto as ações do Fleury subiram com um balanço positivo no mesmo período.", "tecnologia": "A China está avançando rapidamente no desenvolvimento de inteligência artificial (IA), com pesquisas que abrangem desde a produção de chips quânticos baseados em grafeno até o uso de IA para impulsionar a indústria de diamantes sintéticos. A Universidade de Pequim fez avanços significativos na produção de chips quânticos, superando obstáculos cruciais para a implementação prática de computadores quânticos. Além disso, as empresas chinesas estão fechando o gap em desempenho em relação aos laboratórios de vanguarda dos EUA, com avanços notáveis na produção de rares metais e equipamentos para polimento químico-mecânico. No entanto, a China enfrenta desafios como a fuga de um modelo de IA do ambiente de testes no Reino Unido, o que levanta preocupações sobre segurança cibernética. Em outros desenvolvimentos, a Microsoft Edge está prestes a parar o suporte ao Manifest V2, afetando bloqueadores de anúncios, e a Google realizou mudanças na estrutura do seu time de IA, com alguns renomados nomes deixando a empresa. A implementação de IA em diversos setores, como finanças e serviços municipais, está sendo reavaliada, com desafios relacionados à segurança e à ética tecnológica.", "ciencia": "A nomeação de Jennifer Gilsenan como nova chefe do Bureau of Space Services na FCC (Federal Communications Commission), substituindo Jay Schwarz, que se aposenta, marca um novo capítulo na regulação de satélites. Paralelamente, o NIH (Instituto Nacional de Saúde) planeja limitar o acesso de pesquisadores internacionais com visto a fontes de financiamento essenciais para carreiras em pesquisa biomédica nos Estados Unidos. Essas medidas refletem mudanças significativas no cenário científico e regulatório, impactando diretamente as dinâmicas globais da pesquisa e inovação.", "cultura": "O Festival Doida de Música, na sua terceira edição, será realizado em Belo Horizonte nos dias 2 a 4 de setembro. O evento tem como objetivo fortalecer a luta antimanicomial através da música, arte e ocupação dos espaços culturais. Em outra notícia cultural, o ator neozelandês Sam Neill concluiu recentemente as filmagens para um papel no filme adaptado do jogo The Legend of Zelda, que será lançado no próximo ano, antes de falecer aos 78 anos por pneumonia. Na área cinematográfica, a Lionsgate planeja lançar uma continuação da cinebiografia sobre Michael Jackson entre o final de 2027 e o primeiro semestre de 2028. Além disso, a Globo solicitou sigilo ao elenco e equipe de produção sobre a pré-produção da continuação de 'Avenida Brasil', proibindo registros até a divulgação oficial prevista para outubro.", "sociedade": "O ministro do Esporte, André Fufuca, afirmou que a Copa Feminina de Futebol deixará um legado contra o preconceito. Em outro destaque, Julián Álvarez Guardia, de 20 anos, foi assassinado por sua namorada, Victoria Cantero, em Chaco, Argentina, após ela ter enviado mensagens sobre situações de violência sofridas. No interior de São Paulo, um ladrão roubou um carro e atropelou uma idosa durante a fuga, levando-a à morte. O trágico caso do casal Nixon Pérez Paz e Glendy González de la Cruz, que foi assassinado na Guatemala após ser deportado dos Estados Unidos, também merece destaque. Além disso, em São Paulo, a vacinação contra sarampo está disponível para pessoas com idades entre 6 meses e 59 anos sem restrições. Um avô foi preso por estuprar sua neta de 5 anos durante uma ceia de Natal, enquanto um pai de santo foi condenado a quase 10 anos de prisão por extorquir R$ 700 mil para espantar espíritos do mal. As ondas de calor na Europa estão expondo a crise de superlotação em prisionais, levando à tensão entre os detentos e o pessoal da prisão.", "meio_ambiente": "Um ciclone-bomba causou fortes ventos e impactos significativos no litoral de São Paulo, com aulas suspensas e o Porto de Santos paralisado. O fenômeno também atingiu o Rio Grande do Sul, onde um tornado resultou em uma morte, deixando 589 mil pessoas sem energia elétrica e causando estragos em mais de cem cidades. Este ciclone-bomba, que se alastra para o Paraná e Santa Catarina, é parte de eventos climáticos extremos no Sul e Sudeste do Brasil, incluindo um tornado no Rio Grande do Sul. O fenômeno raro resulta da combinação entre El Niño, mudanças climáticas e instabilidade atmosférica. Paralelamente, uma onda de calor extremamente quente afeta a Ásia, levando à preocupação com uma crise energética e riscos para a saúde, como o caso do aposentado de 69 anos em Gwangju, na Coreia do Sul, que deixou de caminhar diariamente devido ao calor intenso. Além disso, um incêndio florestal consumiu cerca de 100 hectares perto de Narbonne na França, sendo combatido por aviões e helicópteros após um acidente de estrada.", "direitos_humanos": "O presidente sul-coreano Yoon Suk Yeol se reuniu com sobreviventes de violências estatais historicamente negligenciadas e ofereceu uma compensação formal, prometendo restaurar a dignidade dessas vítimas. Paralelamente, ocorreu um ataque violento em uma escola na Tailândia, onde um aluno de 14 anos matou cinco professores e seus avós antes de ser encontrado morto. Em outro caso, estudantes indianos enfrentam assédio online após protestos terminarem. A Organização Internacional do Trabalho (OIT) alerta que endividar-se para trabalhar em aplicativos pode ser considerado trabalho escravo. Além disso, a situação das aldeias aborígenes na Austrália foi denunciada como vergonhosa, especialmente após o assassinato de uma menina de 5 anos em abril. A República Democrática do Congo enfrenta um surto de Ebola que está superando as respostas internacionais, segundo a Organização Mundial da Saúde (OMS)."}, "resumo_do_dia": {"politica_nacional": [{"id": 92734, "titulo": "Caiado propõe criar polícia conjunta com países sul-americanos para combater o crime organizado", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/07/caiado-sabatina-g1-globonews-crime-organizado.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-07T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato Ronaldo Caiado (PSD) propôs a criação de uma polícia conjunta com países sul-americanos para combater o crime organizado. Segundo ele, esse modelo seria semelhante ao da Europa e envolveria dez países fronteiriços ao Brasil.", "titulo_pt": "Caiado sugere criação de polícia conjunta com países sul-americanos contra o crime organizado", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 92735, "titulo": "g1 e GloboNews entrevistam Ronaldo Caiado, candidato à Presidência da República", "url": "https://g1.globo.com/politica/eleicoes/2026/ao-vivo/caiado-entrevista-g1-globonews.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-07T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato à Presidência pelo PSD, Ronaldo Caiado, foi entrevistado pelo g1 e pela GloboNews. A entrevista faz parte de uma série com os cinco candidatos mais bem colocados na pesquisa Datafolha.", "titulo_pt": "G1 e GloboNews entrevistam Ronaldo Caiado, candidato à Presidência da República", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 92736, "titulo": "Eleições 2026: g1 e GloboNews entrevistam Ronaldo Caiado, candidato à Presidência pelo PSD", "url": "https://g1.globo.com/politica/eleicoes/2026/playlist/eleicoes-2026-g1-e-globonews-entrevistam-ronaldo-caiado-candidato-a-presidencia-pelo-psd.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-07T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O g1 e a GloboNews realizaram uma entrevista com Ronaldo Caiado, que se apresenta como candidato à Presidência da República pelo Partido Social Democrático (PSD).", "titulo_pt": "Eleições 2026: g1 e GloboNews entrevistam Ronaldo Caiado, do PSD", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 93040, "titulo": "Federação de Lula aciona TSE contra o PL de Flávio Bolsonaro", "url": "https://www.jota.info/eleicoes/eleicoes-2026/federacao-de-lula-aciona-tse-contra-o-pl-de-flavio-bolsonaro", "fonte_id": "jota", "data_pub": "2026-08-07T17:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Federação de Lula acionou o TSE contra um projeto de lei do PL proposto por Flávio Bolsonaro. A alegação é que verbas públicas estão sendo utilizadas para difundir conteúdos já proibidos pela Justiça Eleitoral.", "titulo_pt": "Federação de Lula move ação contra projeto de lei de Flávio Bolsonaro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 92698, "titulo": "TCU decide construir casas para ministros em área valorizada de Brasília", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/tcu-decide-construir-casas-para-ministros-em-area-valorizada-de-brasilia.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-07T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TCU decidiu construir casas para seus ministros em uma área valorizada de Brasília, ampliando a lista de imóveis disponíveis para a cúpula da corte. Essa decisão envolve a construção de residências funcionais para os membros que são responsáveis por controlar o uso do dinheiro público federal.", "titulo_pt": "TCU decide construir casas para ministros em área nobre de Brasília", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 92737, "titulo": "Entrevista ao g1 e à GloboNews: Caiado promete anistiar condenados por 8 de janeiro: 'Briga inútil que só traz desgastes'", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/07/g1-e-globonews-entrevistam-ronaldo-caiado-candidato-a-presidencia-pelo-psd.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-07T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ronaldo Caiado, candidato do PSD à Presidência da República, afirmou que, se eleito, promoveria uma anistia para os condenados pelos atos golpistas de 8 de janeiro de 2023. Ele considera essa medida como um passo para pacificar o país.", "titulo_pt": "Caiado promete anistiar condenados por ações golpistas de 8 de janeiro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 92699, "titulo": "André do Prado chama Salles de ingrato, critica Marina e Tebet e defende Sabesp privatizada", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/andre-do-prado-chama-salles-de-ingrato-critica-marina-e-tebet-e-defende-sabesp-privatizada.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-07T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "André do Prado, deputado estadual e candidato ao Senado por São Paulo pelo PL, criticou Marina Silva e Tebet, defendendo a privatização da Sabesp. Ele também acusou Carlos Salles de ser ingrato.", "titulo_pt": "André do Prado critica Marina e Tebet e defende privatização da Sabesp", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 93041, "titulo": "TSE cria conselho de especialistas para assessorar Nunes Marques sobre IA", "url": "https://www.jota.info/eleicoes/eleicoes-2026/tse-cria-conselho-de-especialistas-para-assessorar-nunes-marques-sobre-ia", "fonte_id": "jota", "data_pub": "2026-08-07T16:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) criou um conselho de especialistas para auxiliar o ministro Luís Roberto Barroso, que é a chefia da Corte, sobre os desafios contemporâneos relacionados à inteligência artificial nas eleições. A composição do grupo ainda será definida pelo ministro.", "titulo_pt": "TSE cria conselho de especialistas para auxiliar barroso em questões de IA", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 92700, "titulo": "Previsão de leitores sobre gestão de Salomão no STJ", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/frederico-vasconcelos/2026/08/previsao-de-leitores-sobre-gestao-de-salomao-no-stj.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-07T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma enquete conduzida pelo colunista sobre as expectativas dos leitores para a gestão de Luis Felipe Salomão como presidente do Superior Tribunal de Justiça revelou diferentes perspectivas e muitas incertezas.", "titulo_pt": "Previsão de leitores sobre gestão de Salomão no STJ", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 92738, "titulo": "Representantes do Discord pedem reunião com AGU; Janja cobrou medidas contra a plataforma", "url": "https://g1.globo.com/politica/noticia/2026/08/07/apos-janja-cobrar-medidas-agu-vai-se-reunir-com-representantes-do-discord-nesta-sexta.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-07T15:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Advocacia-Geral da União (AGU) se reúne nesta sexta-feira com representantes do Discord para discutir medidas que a plataforma deve tomar para adequar-se às normas brasileiras de plataformas digitais. O Discord enfrenta críticas e investigações relacionadas à falta de moderação eficaz, o que pode permitir a prática de crimes contra crianças e adolescentes.", "titulo_pt": "AGU pede reunião com Discord; plataforma é alvo de críticas", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 92680, "titulo": "Governo Trump cobra 'proposta satisfatória' para não punir Brasil em cota de açúcar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/governo-trump-cobra-proposta-satisfatoria-para-nao-punir-brasil-em-cota-de-acucar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-07T15:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos, sob a administração de Donald Trump, exigiu que o Brasil apresentasse propostas comerciais satisfatórias para recuperar uma cota de exportação de açúcar de quase 60 mil toneladas. Caso contrário, os EUA ameaçam redistribuir essa cota para outros países.", "titulo_pt": "Governo Trump exige 'proposta comercial' do Brasil para manter cota de açúcar", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 92682, "titulo": "Zanin diverge de Flávio Dino e vota que privatização da Celepar não deveria ir ao STF", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/zanin-diverge-de-flavio-dino-e-vota-que-privatizacao-da-celepar-nao-deveria-ir-ao-stf.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-07T15:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Cristiano Zanin, do STF, votou contra o julgamento do mérito da ação que questiona a privatização da Celepar. Sua decisão visa derrubar a suspensão parcial da lei estadual que autorizava a desestatização.", "titulo_pt": "Zanin vota contra julgamento do mérito da privatização da Celepar", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 92701, "titulo": "Irmão de Cleitinho convoca caminhada de 40 km para pressionar partido por candidatura", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/irmao-de-cleitinho-convoca-caminhada-de-40-km-para-pressionar-partido-por-candidatura.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-07T14:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Apoiadores do senador Cleitinho realizam uma caminhada de 40 km para pressionar a direção nacional do Republicanos a autorizar sua candidatura ao governo de Minas Gerais. O evento ocorre em meio às discussões sobre a participação do senador na eleição.", "titulo_pt": "Irmão de Cleitinho convoca caminhada de 40 km para pressionar partido por candidatura", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 93044, "titulo": "Casa JOTA reúne campanhas presidenciais para debater agenda digital", "url": "https://www.jota.info/casa-jota/casa-jota-reune-campanhas-presidenciais-para-debater-agenda-digital", "fonte_id": "jota", "data_pub": "2026-08-07T14:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O evento Casa JOTA, realizado em Brasília, trouxe candidatos presidenciais para discutir as prioridades relacionadas ao desenvolvimento digital do país com representantes do setor de tecnologia. O encontro visou promover um diálogo entre os candidatos e o setor privado sobre questões digitais.", "titulo_pt": "Casa JOTA reúne candidatos presidenciais para debater agenda digital", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 93045, "titulo": "STJ diz que curador especial pode acumular honorários contratuais e de sucumbência", "url": "https://www.jota.info/justica/stj-diz-que-curador-especial-pode-acumular-honorarios-contratuais-e-de-sucumbencia", "fonte_id": "jota", "data_pub": "2026-08-07T14:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O STJ (Supremo Tribunal de Justiça) decidiu que um curador especial pode acumular honorários contratuais e de sucumbência. A decisão foi unânime, com o relator ministro Villas Bôas Cueva argumentando que as verbas têm naturezas jurídicas distintas.", "titulo_pt": "STJ permite que curador especial acumule honorários contratuais e de sucumbência", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 92740, "titulo": "TSE cria órgão para monitorar fake news e uso indevido de IA nas eleições", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/07/tse-cria-orgao-para-monitorar-fake-news-e-uso-indevido-de-ia-nas-eleicoes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-07T14:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) criou um órgão para monitorar a divulgação de conteúdos falsos e o uso indevido de inteligência artificial nas eleições de 2026. O Conselho Consultivo sobre Integridade Informacional será composto por especialistas em tecnologia, segurança pública, criminalidade organizada e comunicação social.", "titulo_pt": "TSE cria órgão para monitorar fake news e uso indevido de IA nas eleições", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 92724, "titulo": "Tribunal mantém bloqueio à construção do salão de Trump na Casa Branca", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/08/tribunal-mantem-bloqueio-a-construcao-do-salao-de-trump-na-casa-branca.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-08-07T17:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um painel de juízes de um tribunal federal de apelações decidiu que Donald Trump não pode continuar a construir o salão de festas na Casa Branca sem aprovação explícita do Congresso. O presidente dos Estados Unidos deve obter permissão legislativa antes de prosseguir com a construção.", "titulo_pt": "Tribunal proíbe Trump de construir salão de festas na Casa Branca sem aprovação do congresso", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 93192, "titulo": "Monty Roberts, who trained horses through trust, dies at 91", "url": "https://www.npr.org/2026/08/07/nx-s1-5924104/monty-roberts-horse-training", "fonte_id": "npr_news", "data_pub": "2026-08-07T17:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Monty Roberts, um renomado treinador de cavalos que desenvolveu uma abordagem mais suave baseada na linguagem não-verbal dos cavalos, faleceu aos 91 anos. Ele se opôs ao método convencional de domar cavalos e criou seu próprio método gentil.", "titulo_pt": "Monty Roberts, que treinava cavalos com base no respeito, morre aos 91 anos", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 92886, "titulo": "Sauditas preveem ataque em duas frentes por aliados do Irã, diz fonte", "url": "https://www.cnnbrasil.com.br/internacional/sauditas-preveem-ataque-em-duas-frentes-por-aliados-do-ira-diz-fonte/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-07T17:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sauditas esperam um ataque em duas frentes por aliados do Irã, que poderiam tentar atrapalhar esforços diplomáticos. Ofensiva de milícias iraquianas e Houthis pode ser parte dessa estratégia.", "titulo_pt": "Sauditas preveem ataque em duas frentes por aliados do Irã", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 93424, "titulo": "Senato Usa approva nuove sanzioni alla Russia e all'Iran", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/07/senato-usa-approva-nuove-sanzioni-alla-russia-e-alliran_158d58d8-d5c0-44f0-a1d8-65c0b45c8034.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-07T17:38:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O Senado dos Estados Unidos aprovou novas sanções contra a Rússia e o Irã. As medidas afetam os principais compradores de petróleo e gás da Rússia e a energia do Irã.", "titulo_pt": "Senado aprova novas sanções à Rússia e ao Irã", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 93193, "titulo": "Senate passes Russia sanctions bill that was long championed by Lindsey Graham", "url": "https://www.npr.org/2026/08/07/nx-s1-5924914/senate-passes-russia-sanctions-bill-that-was-long-championed-by-lindsey-graham", "fonte_id": "npr_news", "data_pub": "2026-08-07T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou um projeto de lei que impõe sanções econômicas à Rússia, permitindo novas tarifas severas sobre importadores maiores de energia russa. O projeto foi liderado pelo senador Lindsey Graham antes de seu inesperado falecimento em julho.", "titulo_pt": "Senado aprova projeto de lei com sanções à Rússia defendido por Lindsey Graham", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 93425, "titulo": "Un video fake annuncia le dimissioni di Merz, 'è disinformazione russa'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/07/un-video-fake-annuncia-le-dimissioni-di-merz-e-disinformazione-russa_83b6136c-fc31-4e4d-8427-297d9f58771f.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-07T17:32:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Um vídeo falso anuncia as demissões de Merz, mas isso é considerado desinformação russa. O Bild atribui essa informação à segurança, que acredita ser obra dos serviços secretos de Moscou.", "titulo_pt": "Vídeo falso anuncia demissão de Merz; é desinformação russa", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 93394, "titulo": "Donald Trump revives threat to sack Fed governor Lisa Cook", "url": "https://www.ft.com/content/0012c7c9-fb31-4c90-a2e7-e65bd4629b22?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-07T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Donald Trump ameaça demitir a governadora do Fed Lisa Cook, após o Supremo Tribunal dos EUA decidir, em junho, que ela poderia permanecer no cargo durante o processo.", "titulo_pt": "Trump revive ameaça de demitir governadora do Fed Lisa Cook", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 93078, "titulo": "As Pressure Mounts, U.S. Hunts for Cuba’s Next Leader", "url": "https://www.nytimes.com/2026/08/07/us/politics/us-search-cuba-leader.html", "fonte_id": "nyt_world", "data_pub": "2026-08-07T17:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns funcionários públicos alertam que um líder mais rígido pode surgir se a administração Trump seguir com seus planos.", "titulo_pt": "A pressão monta, EUA buscam o próximo líder cubano", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 93344, "titulo": "Colombian DJ and his husband detained by ICE before embarking on a tour tied to Karol G’s concerts", "url": "https://english.elpais.com/usa/2026-08-07/colombian-dj-and-his-husband-detained-by-ice-before-embarking-on-a-tour-tied-to-karol-gs-concerts.html", "fonte_id": "elpais_en", "data_pub": "2026-08-07T17:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um DJ colombiano e seu marido foram detidos pela ICE antes de embarcarem para uma turnê associada a shows da cantora Karol G. A defesa afirma que eles têm casos de asilo em andamento e permissoes de trabalho válidas, enquanto as autoridades afirmam que ambos estavam nos Estados Unidos com vistos expirados no ano passado.", "titulo_pt": "DJ colombiano e seu marido detidos pela ICE antes de shows com Karol G", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 93426, "titulo": "Trump, 'la decisione sul salone delle feste è orrenda, farò appello'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/07/trump-la-decisione-sul-salone-delle-feste-e-orrenda-faro-appello_1cb52376-5537-43fc-902f-cb63a5ceeee4.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-07T17:23:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Trump se referiu à decisão sobre o salão de festas como terrível e afirmou que fará um apelo. A sentença é motivada por regiões políticas.", "titulo_pt": "Trump: 'a decisão sobre o salão de festas é horrível, farei recurso'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 93427, "titulo": "Ong denuncia 51 decessi da aprile nelle carceri venezuelane per mancanza di cure", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/07/ong-denuncia-51-decessi-da-aprile-nelle-carceri-venezuelane-per-mancanza-di-cure_880e4029-1a8e-4da7-adb6-1490a7dd66b8.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-07T17:19:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Ong denunciou 51 mortes de presos em abril nas prisões venezuelanas devido à falta de cuidados médicos. A crise humanitária nas penitenciárias está condenando os detentos à morte.", "titulo_pt": "Ong denuncia 51 mortes de presos em abril nas prisões venezuelanas por falta de assistência", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 93347, "titulo": "China shelves film about great naval epic of the conquest of Taiwan", "url": "https://english.elpais.com/international/2026-08-07/china-shelves-film-about-great-naval-epic-of-the-conquest-of-taiwan.html", "fonte_id": "elpais_en", "data_pub": "2026-08-07T17:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme 'A Batalha dos Pescadores de Penghu' desapareceu das programações chinesas sem estrear, coincidindo com tensões na estraita e um debate nacionalista nas redes sociais.", "titulo_pt": "China retira do ar filme sobre grande épico naval da conquista de Taiwan", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 93348, "titulo": "Trump to appeal ballroom construction halt to Supreme Court", "url": "https://www.dw.com/en/trump-to-appeal-ballroom-construction-halt-to-supreme-court/a-78285628?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-07T17:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Corte de Apelações dos Estados Unidos confirmou uma decisão que impede o presidente Trump de construir um salão de baile na Casa Branca sem aprovação do Congresso. Trump declarou que vai recorrer dessa 'decisão injusta'.", "titulo_pt": "Trump vai recorrer da decisão que proíbe construção de salão de baile na casa branca no supremo", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 93428, "titulo": "La Francia verso l'uso del casco obbligatorio per chi usa il monopattino elettrico", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/07/la-francia-verso-luso-del-casco-obbligatorio-per-chi-usa-il-monopattino_879c21a1-938d-4b42-8caa-4cd6f40aba50.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-07T17:01:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Nos últimos seis anos, o número de acidentes e das vítimas relacionadas ao uso do monopatim elétrico na França aumentou. A França está considerando a possibilidade de tornar o uso obrigatório do capacete para quem utiliza esse meio de transporte.", "titulo_pt": "França pode tornar uso de capacete obrigatório para monopatinheiros", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 93442, "titulo": "Albanian Court Puts Turkish Activist in Custody After Extradition Demand", "url": "https://balkaninsight.com/2026/08/07/albanian-court-puts-turkish-activist-in-custody-after-extradition-demand/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-08-07T16:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ativista Julide Yazici, que é procurada pela Turquia, foi colocada sob custódia na capital albanesa, Tirana, enquanto aguarda o processo de extradição, apesar de ter status de asilo político na França.", "titulo_pt": "Juíza albanesa coloca ativista turca em custódia", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 92989, "titulo": "Una argentina detenida por el ICE cuando iba a ver el Mundial lleva casi un mes presa", "url": "https://elpais.com/argentina/2026-08-07/una-argentina-detenida-por-el-ice-cuando-iba-a-ver-el-mundial-lleva-casi-un-mes-presa.html", "fonte_id": "elpais_america", "data_pub": "2026-08-07T16:57:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Iliana Noeli Lick, uma argentina que trabalha como babá e vive nos Estados Unidos desde 2024, foi detida pelo ICE quando ia assistir ao Mundial. Ela está presa há quase um mês.", "titulo_pt": "Argentina: mulher detida pelo ICE no aeroporto ao ir ver o Mundial", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 92672, "titulo": "Petrobras diz que dividendo extra é 'muito pouco provável', apesar de petróleo caro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://w const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

  return `<div>

    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
