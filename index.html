<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<header>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "10/11/2026 19:22", "stats": {"noticias_novas": 638, "resumos_gerados": 231}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O ministro Dario Durigan prometeu estudar um sistema simplificado de recolhimento de impostos para pequenas empresas que deixarem o Simples Nacional. A Câmara dos Deputados aprovou uma Medida Provisória que permite a renegociação de dívidas rurais. O Supremo Tribunal Federal (STF) decidiu que o arquivamento do inquérito das fake news não afeta os processos já em andamento. O canal do WhatsApp 'Tropa do Flávio' foi renomeado para 'Direita Já', e o ministro Toffoli revogou seu voto, permitindo que a maioria do STF possa derrubar uma lei paraibana que restringe a aplicação de cotas raciais. O prefeito do Rio de Janeiro, Eduardo Paes, se reuniu com o ministro Cristiano Zanin para discutir a possibilidade de um segundo turno nas eleições no estado. O STF planeja incluir as ações sobre a nova jornada de trabalho na pauta do plenário na próxima semana, após a Confederação Nacional da Indústria (CNI) pedir um prazo maior para a implementação. O governo brasileiro está avaliando a liberação de misturas de 20% de biodiesel no diesel a partir de 2027, após a conclusão de testes previstos para março de 2017. Diplomatas sugerem que Haddad ou Tebet possam liderar o Itamaraty, valorizando um chanceler com força política para aumentar o orçamento. O Conselho Nacional de Justiça (CNJ) aprovou regras para a venda de precatórios e criou uma central nacional para rastrear essas operações, visando ampliar a transparência.", "mundo": "Os Estados Unidos enfrentam diversos desafios internos e externos. O Departamento de Justiça acusa três agentes iranianos de planejarem um ataque fallido a uma base aérea nos EUA. Paralelamente, o Partido Republicano nomeou Jim Jordan como líder minoritário da Câmara dos Representantes, apesar de ter sofrido uma derrota histórica nas eleições médias. O jornal Novaya Gazeta, um dos mais corajosos da Rússia, encerrou suas operações após mais de 30 anos de atividade. Além disso, a Ucrânia e a Rússia retomaram negociações de paz mediadas pelos EUA, mas há desconfiança ucraniana e europeia sobre as intenções dos Estados Unidos. Em outro contexto, o Reino Unido está disposto a discutir o pagamento para infraestruturas em países menos desenvolvidos da União Europeia em troca do acesso ao mercado elétrico europeu, mas a proposta não aceita a ligação do comércio de eletricidade a um fundo de coesão.\n\nA China está realizando exercícios militares de 'bloqueio de área', um desenvolvimento geopolítico importante. Em outro evento, o Departamento de Justiça dos EUA acusou três homens, descritos como 'operadores iranianos', por um suposto plano para atacar a base aérea RAF Fairford, no Reino Unido. Os EUA afirmam que não há necessidade de novas ações militares contra o Irã, mas consideram as condições impostas pelo país para um acordo político como 'absurdas'. As negociações mediadas pelos EUA entre Rússia e Ucrânia não avançaram significativamente, enquanto o governo Trump propôs cortar assistência alimentar para mais de seis milhões de pessoas. A atividade naval russa aumentou em 41% ao redor do Reino Unido nos primeiros nove meses do ano, levando o Reino Unido a formar uma aliança com países como os Países Baixos, os bálticos e nórdicos para reforçar a defesa marítima. As partes envolvidas na guerra na Ucrânia, Estados Unidos, Rússia e Ucrânia, retomaram conversações para tentar terminar o conflito, no entanto, há baixas expectativas de um avanço significativo, pois Vladimir Putin não demonstra intenção de interromper o conflito.", "economia": "O Ibovespa registrou uma queda de 0,52%, influenciado pela inflação nos Estados Unidos e pela ata do Copom. O dólar comercial subiu 1,48% e encerrou o pregão cotado a R$ 5,58, o maior fechamento desde 2026. As bolsas de Nova York também caíram, com o Dow Jones recuando 0,30%, o S&P 500 caindo 0,38% e o Nasdaq diminuindo 0,74%. O Bradesco aumentou sua projeção de inflação para 2027, prevendo uma taxa de 5,3% no final do ano, contra 4,1% anteriormente, destacando a incerteza relacionada ao efeito da reforma tributária e da escala 6x1 nos preços. O petróleo Brent caiu abaixo de US$ 90 pela primeira vez desde agosto, refletindo a esperança de um acordo para pôr fim à guerra no Oriente Médio. A China superou o superávit comercial de US$ 1 trilhão nos primeiros dez meses do ano, refletindo um comércio exterior em forte crescimento. O programa Discover SP, criado pela gestão do prefeito Ricardo Nunes para promover São Paulo no turismo global, gerou um potencial de R$ 260 milhões em investimentos estrangeiros para empresas da cidade. A JBS anunciou a aquisição da Flora e do Canal Rural, empresas da holding J&F, com o objetivo de fortalecer a relação com o varejo e produtores de animais. O Itaú investiu R$ 1,2 bilhão para se tornar sócio da Klabin na Bougainville Reflorestadora, uma SPE controlada pela companhia de papel e celulose. O Conselho Nacional de Justiça (CNJ) aprovou novas regras para a cessão de precatórios e estabeleceu um 'regime de transição'. Um estudo projeta que o envelhecimento da população, mudanças climáticas e avanços na inteligência artificial aumentarão os desafios para o Estado nos próximos anos, devido a restrições orçamentárias.", "tecnologia": "O Brasil, o país mais atacado da América Latina em termos de cibersegurança, enfrenta desafios significativos na implementação de leis de cibersegurança, de acordo com um relatório da Exame. O país não possui uma lei específica e unificada sobre o assunto, o que resulta em altos índices de roubo de dados e sequestro de sistemas. O MEC (Ministério da Educação) estabeleceu regras para o uso de inteligência artificial em escolas, proibindo a correção automatizada de redações, o reconhecimento de emoções e o acesso sem supervisão, conforme noticia o Veja. Em outro desenvolvimento, a Nvidia contratou um ex-procurador federal para investigar a suposta relação do seu CEO com uma suposta espiã chinesa, informa o Financial Times. A investigação, liderada pelo ex-cabo chefe do escritório de procuradores do distrito sul de Nova York, pode ter implicações significativas para a reputação da empresa, especialmente em um momento em que a empresa está enfrentando pressões para negociar contratos futuros baseados em processamento de inteligência artificial devido a preocupações sobre manipulação de preços.", "ciencia": "O evento mais importante dos artigos listados é a chegada da ativista climática Greta Thunberg à reunião da ONU sobre mudanças climáticas em Antalya, na Turquia. Thunberg enfatizou a importância de proteger as pessoas e o planeta acima de lucros e poder, em um evento marcado por eventos climáticos extremos como ondas de calor e desastres naturais. Outros assuntos relevantes incluem a descoberta de uma vitória-régia gigante na América do Sul, a possível perda de status de eliminação da rubéola nos Estados Unidos, e a aquisição da Oura por US$ 625 milhões, um sinal da crescente importância da inteligência artificial no cuidado à saúde. Além disso, a NASA está buscando novos astronautas para o programa Artemis, que visa a estadia humana permanente na Lua, e o LISA (Laser Interferometer Space Antenna) está em desenvolvimento para detectar ondas gravitacionais e revelar novos exoplanetas.", "cultura": "O Papa Francisco visitou oficialmente a Argentina, participando de uma celebração na Catedral de Córdoba e de uma vigília jovem no Monumento de los Españoles em Palermo. O evento Square Peg Social, organizado por Ari Aster e Lars Knudsen, ofereceu quatro dias de atividades para jovens cineastas, proporcionando um ambiente de camaradagem e aprendizado. A novela 'Quem Ama Cuida', exibida pela Globo, foi indicada ao Rose d'Or Awards 2026 na categoria de melhor telenovela, sendo a única representante brasileira. O ator Victor Medeiros interpreta Roberto Carlos na cinebiografia 'Detalhes de Uma Vida', enquanto o compositor dos jogos 'Donkey Kong Country' anuncia um show e um novo álbum no Brasil. O documentário 'Avedon', dirigido por Ron Howard, explora a carreira do fotógrafo Richard Avedon, um dos principais do século XX. A exposição 'Elas Dirigem', promovida pelo Sesc-DF, apresenta filmes de diretoras alemãs, oferecendo uma visão das mulheres no cinema alemão.", "sociedade": "Um projeto do distrito indígena concluiu a construção da primeira casa, representando um avanço significativo na melhoria da moradia para os indígenas. Em outro desenvolvimento, mais de três mil celulares roubados no Rio de Janeiro serão devolvidos aos proprietários nesta terça-feira (10) em várias regiões do estado. Por outro lado, a maioria dos brasileiros acredita que o fim do mundo pode ser causado pela sociedade, com empate técnico entre a percepção de tragédias climáticas e conflitos armados, de acordo com uma pesquisa recente. Além disso, o Ministério notificou a Uber para esclarecer relatos de motoristas que recusam passageiros por motivo político, e a justiça de São Paulo negou um pedido de ONGs para proibir a venda de animais em plataformas online, argumentando a falta de uma lei nacional que proíba o comércio online de pets.", "meio_ambiente": "Um acordo inédito foi feito entre organizações brasileiras e americanas para combater os impactos do clima e da inteligência artificial em seus países, visando enfrentar desafios sociais e urbanos. Em outro desenvolvimento, a guerra no Irã levou a uma redução nas emissões de carbono, mas há um problema associado a essa diminuição. Durante a COP31, que reuniu mais de 92.000 participantes, a Alemanha anunciou um investimento de 15 milhões de euros na proteção e preservação de terras indígenas no Brasil. O evento também serviu para apresentar tecnologias ambientais, com o objetivo de aumentar a electrificação mundial para 35% até 2035. Além disso, pesquisadores detectaram resíduos de medicamentos em um rio importante do Rio Grande do Sul, indicando a necessidade de investimentos em saneamento.", "direitos_humanos": "Um tribunal em Londres anulou uma lei na Trindade e Tobago que criminalizava relações sexuais consensuais entre homens do mesmo sexo, reafirmando a proteção dos direitos fundamentais. A Human Rights Watch também pediu ao Conselho de Segurança das Nações Unidas que aborde a situação dos direitos humanos na Coreia do Norte, enquanto a entidade da ONU responsável pelos direitos humanos adiou a revisão regular do registro de direitos humanos dos Estados Unidos, criticando a 'não cooperação contínua' do país. Em outro desenvolvimento, uma juíza federal ordenou a liberação de uma estudante da UC Berkeley que foi detida pelo ICE no aeroporto de San Francisco, alegando uma violação ao direito processual. As denúncias sobre risco de exploração sexual de menores de não nacionalidade enviadas pela ex-Mejor Niñez à fiscalia aumentaram 166% entre 2021 e 2024. Por fim, a situação dos direitos humanos na Bósnia continua comprometida, com a constituição do país ainda discriminando comunidades como romenos e judeus, sete anos após uma condenação do Tribunal Europeu de Direitos Humanos."}, "resumo_do_dia": {"politica_nacional": [{"id": 255307, "titulo": "Durigan prometeu recolhimento simplificado para quem deixar Simples, diz deputado", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/durigan-prometeu-recolhimento-simplificado-para-quem-deixar-simples-diz-deputado.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, se comprometeu a estudar uma forma simplificada de recolhimento de impostos sobre consumo para pequenas empresas que deixarem o Simples Nacional após a reforma tributária. Esse compromisso foi relatado pelo deputado Joaquim Passarinho (PL-PA).", "titulo_pt": "Durigan prometeu recolhimento simplificado para empresas que deixarem Simples, diz deputado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 255409, "titulo": "Câmara aprova MP da renegociação das dívidas rurais", "url": "https://www.metropoles.com/brasil/camara-aprova-mp-da-renegociacao-das-dividas-rurais", "fonte_id": "metropoles", "data_pub": "2026-11-10T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados aprovou uma Medida Provisória que amplia o acesso à renegociação de dívidas de produtores rurais. O texto precisa ser aprovado pelo Senado até a próxima quarta-feira (11/11).", "titulo_pt": "Câmara aprova MP para renegociação de dívidas rurais", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 255330, "titulo": "Fim do inquérito das fake news não derruba processos abertos a partir dele; entenda", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/fim-do-inquerito-das-fake-news-nao-derruba-processos-abertos-a-partir-dele-entenda.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-10T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A decisão de arquivar o inquérito das fake news, anunciada pelo presidente do STF, Edson Fachin, na segunda-feira (9), não afeta os processos já abertos a partir dessa investigação. Os processos continuam em andamento mesmo após o arquivamento do inquérito.", "titulo_pt": "Arquivamento do inquérito das fake news não encerra processos já abertos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 255410, "titulo": "Pai de deputado Neto Carletto fez 23 saques que somam R$ 3 milhões, diz PF", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pai-de-deputado-neto-carletto-fez-23-saques-que-somam-r-3-milhoes-diz-pf", "fonte_id": "metropoles", "data_pub": "2026-11-10T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O pai do deputado Neto Carletto realizou 23 saques que totalizam R$ 3 milhões, conforme informou a Polícia Federal. As informações foram autorizadas pelo ministro Flávio Dino, do STF, na Operação Fluxo Paralelo.", "titulo_pt": "Pai do deputado Neto Carletto fez 23 saques que somam R$ 3 milhões, diz PF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 255422, "titulo": "Dino decidirá até sexta (13) sobre regras de transição do fim da escala 6×1", "url": "https://www.cnnbrasil.com.br/politica/dino-decidira-ate-sexta-13-sobre-regras-de-transicao-do-fim-da-escala-6x1/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-10T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Dino deve decidir até a próxima sexta-feira (13) sobre as regras de transição do fim da escala 6x1. A decisão esclarecerá a aplicação da jornada de 42 horas e as regras de compensação de folgas, sendo posteriormente submetida ao referendo do plenário do STF.", "titulo_pt": "Dino decidirá até sexta sobre regras de transição do fim da escala 6x1", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 255411, "titulo": "Deputada do PT obtém medida protetiva contra colega do PL eleito pelo Ceará", "url": "https://www.metropoles.com/brasil/deputada-do-pt-obtem-medida-protetiva-contra-colega-do-pl-eleito-pelo-ceara", "fonte_id": "metropoles", "data_pub": "2026-11-10T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A deputada Larissa Gaspar (PT) obteve uma medida protetiva contra Abreu Júnior (PL), que foi eleito deputado federal pelo Ceará. A medida impede que Abreu Júnior se aproxime ou entre em contato com Larissa Gaspar no estado do Ceará devido a uma denúncia de violência política de gênero.", "titulo_pt": "Deputada do PT obtém medida protetiva contra deputado eleito pelo PL no Ceará", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 255331, "titulo": "Escultura com símbolo da justiça africana será instalada no STF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/escultura-com-simbolo-da-justica-africana-sera-instalada-no-stf.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-10T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) instalará no dia 17 de novembro a escultura do Oxê de Xangô, símbolo africano da Justiça, em sua sede em Brasília.", "titulo_pt": "Escultura com símbolo da justiça africana será instalada no STF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 255332, "titulo": "Justiça manda devolver à OAS R$ 2,4 mi do leilão de tríplex atribuído a Lula pela Lava Jato", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/justica-manda-devolver-a-oas-r-24-mi-do-leilao-de-triplex-atribuido-a-lula-pela-lava-jato.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-10T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça Federal de Brasília determinou a devolução de R$ 2,4 milhões à OAS, já que o tríplex em Guarujá é considerado propriedade da empresa e não há processo criminal em torno do imóvel.", "titulo_pt": "Justiça determina devolução de R$ 2,4 mi do tríplex de guarujá à OAS", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 255309, "titulo": "Senado aprova projeto que amplia fiscalização da ANP após Carbono Oculto", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/senado-aprova-projeto-que-amplia-fiscalizacao-da-anp-apos-carbono-oculto.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou um projeto de lei que amplia os poderes da ANP para fiscalizar o setor de combustíveis e aumenta o rigor na concessão de autorização para essas atividades. O objetivo é combater a utilização do setor pelo crime organizado.", "titulo_pt": "Senado aprova projeto que amplia fiscalização da ANP contra crime organizado", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 255622, "titulo": "Canal tocado por Nikolas Ferreira no WhatsApp abandona nome ‘Tropa do Flávio’", "url": "https://www.jota.info/legislativo/canal-tocado-por-nikolas-ferreira-no-whatsapp-abandona-nome-tropa-do-flavio", "fonte_id": "jota", "data_pub": "2026-11-10T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O canal do WhatsApp gerenciado por Nikolas Ferreira foi renomeado para 'Direita Já!', substituindo o nome 'Tropa do Flávio'. O novo nome do canal agora menciona 'quatro anos de oposição firme' e 'caminho até 2030'.", "titulo_pt": "Canal do WhatsApp de Nikolas Ferreira passa a se chamar 'direita já!'", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 255623, "titulo": "Toffoli muda voto e STF tem maioria para derrubar lei que restringe cota racial", "url": "https://www.jota.info/stf/do-supremo/toffoli-muda-voto-e-stf-tem-maioria-para-derrubar-lei-que-restringe-cota-racial", "fonte_id": "jota", "data_pub": "2026-11-10T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF (Supremo Tribunal Federal) Ricardo Toffoli mudou seu voto, permitindo que a maioria do tribunal pudesse derrubar uma lei paraibana que restringe a aplicação de cotas raciais a alunos de escolas públicas com renda familiar bruta per capita igual ou inferior a 1,5 salário mínimo.", "titulo_pt": "Toffoli altera voto e STF pode derrubar lei que restringe cota racial", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 255333, "titulo": "Advogados de Paes se reúnem com Zanin e reforçam pedido por 2º turno no RJ", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/advogados-de-paes-se-reunem-com-zanin-e-reforcam-pedido-por-2o-turno-no-rj.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-10T21:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Advogados do ex-prefeito do Rio de Janeiro Eduardo Paes se reuniram com o ministro Cristiano Zanin para pedir a realização de um segundo turno nas eleições no estado. O encontro ocorreu na tarde de terça-feira (10).", "titulo_pt": "Advogados de Paes se reúnem com Zanin e reforçam pedido por 2º turno no RJ", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 255334, "titulo": "'Tropa do Flávio' no WhatsApp vira 'Direita Já' e quer mobilizar apoiadores sobre pautas do Congresso", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/tropa-do-flavio-no-whatsapp-vira-direita-ja-e-quer-mobilizar-apoiadores-sobre-pautas-do-congresso.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-10T20:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O canal do WhatsApp 'Tropa do Flávio', anteriormente usado pela campanha presidencial de Flávio Bolsonaro, foi renomeado para 'Direita Já' e está novamente enviando mensagens. O grupo agora se dedica a mobilizar apoiadores em torno de pautas do Congresso.", "titulo_pt": "Tropa do Flávio no WhatsApp vira Direita Já e mobiliza apoiadores sobre pautas do Congresso", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 255335, "titulo": "Afastamento de delegados da PF tem contornos de extrema gravidade, diz Transparência Internacional", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/afastamento-de-delegados-da-pf-tem-contornos-de-extrema-gravidade-diz-transparencia-internacional.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-10T20:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Transparência Internacional Brasil declarou que o afastamento de delegados da Polícia Federal que estavam envolvidos em uma investigação sobre o Banco Master é de extrema gravidade. A instituição fez essa afirmação em uma nota oficial divulgada nesta quarta-feira (10).", "titulo_pt": "Afastamento de delegados da PF em investigação sobre o banco master tem contornos de extrema gravidade, diz Transparência Internacional", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 255314, "titulo": "Dino sinaliza que vai permitir flexibilizar folgas após fim da 6x1 por acordo coletivo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/dino-indica-que-dara-aval-a-flexibilizacao-do-fim-da-escala-6x1-desde-que-prevista-em-acordo-coletivo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-10T20:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF Flávio Dino indicou que permitirá a flexibilização do direito a duas folgas semanais após o fim da escala 6x1, desde que seja previsto em acordo coletivo. A decisão deve ser proferida nos próximos dias.", "titulo_pt": "Dino sinaliza flexibilização de folgas após fim da 6x1 por acordo coletivo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 255336, "titulo": "Abraji e TikTok abrem inscrições para curso gratuito de jornalismo digital", s": "Argentina", "classe": "B"}, {"id": 255812, "titulo": "John Thune rieletto leader dei repubblicani al Senato Usa", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/10/john-thune-rieletto-leader-dei-repubblicani-al-senato-usa_788f97ef-48b7-49ac-9246-bf1fdba44448.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-10T21:42:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "John Thune foi reeleito líder dos republicanos no Senado dos Estados Unidos, apesar das duras críticas que recebeu de Trump.", "titulo_pt": "John Thune reeleito líder dos republicanos no senado dos EUA", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 255598, "titulo": "Bukele afirma que las fuerzas militares salvadoreñas destruyeron el cuartel general de una poderosa banda criminal haitiana", "url": "https://elpais.com/america/2026-11-10/bukele-afirma-que-las-fuerzas-militares-salvadorenas-destruyeron-el-cuartel-general-de-una-poderosa-banda-criminal-haitiana.html", "fonte_id": "elpais_america", "data_pub": "2026-11-10T21:37:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O secretário de Estado dos Estados Unidos, Marco Rubio, negou a possibilidade de um deslocamento militar para apoiar o presidente salvadorenho Nayib Bukele. De acordo com Bukele, as forças militares salvadoreñas teriam destruído o quartel-general de uma poderosa facção criminal haitiana.", "titulo_pt": "Bukele afirma que as forças militares salvadoreñas destruíram o quartel-general de uma poderosa banda criminal haitiana", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 255731, "titulo": "Meghan's father Thomas Markle detained for allegedly cutting off ankle monitor, officials say", "url": "https://www.bbc.co.uk/news/articles/c9j3433zy4vro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-10T21:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O pai de Meghan, Thomas Markle, de 82 anos, foi det
