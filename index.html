nico que afetaram as vendas. A empresa estima que a recuperação demore tempo.", "titulo_pt": "Shein registra queda na receita com 'taxa das blusinhas' na Europa e projeta recuperação para o segundo semestre do próximo ano", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 286729, "titulo": "Leilão de baterias: mudar quem paga não elimina o custo", "url": "https://www.jota.info/opiniao-e-analise/artigos/leilao-de-baterias-mudar-quem-paga-nao-elimina-o-custo", "fonte_id": "jota", "data_pub": "2026-11-25T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proposta de leilão de baterias coloca o custo apenas nos geradores, mas esse custo tende a ser transferido para os consumidores, com impacto adicional nos leilões de dezembro.", "titulo_pt": "Leilão de baterias: mudar quem paga não elimina o custo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 287198, "titulo": "NTU develops chips for on-device generative AI", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/26/2003868419", "fonte_id": "taipei_times", "data_pub": "2026-11-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Universidade Nacional de Taiwan desenvolveu chips para inteligência artificial gerativa em dispositivos locais. O objetivo é melhorar a eficiência e a privacidade no processamento de IA nos próprios equipamentos.", "titulo_pt": "NTU desenvolve chips para IA gerativa em dispositivos locais", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 287223, "titulo": "FCC signs off on SpaceX’s plan to put up to 1 million data center satellites into space", "url": "https://www.theverge.com/science/1042278/spacex-fcc-starmind-ai-space-data-centers", "fonte_id": "the_verge", "data_pub": "2026-11-25T17:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FCC autorizou a SpaceX, empresa de Elon Musk, a implantar até 1 milhão de satélites equipados com chips de inteligência artificial como parte do projeto 'Starmind'. Esta é a primeira aprovação do órgão para um projeto desse porte.", "titulo_pt": "FCC aprova plano da SpaceX de lançar até 1 milhão de satélites equipados com chips de IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 287240, "titulo": "DOJ accuses former cyber executive of defrauding ransomware victims by secretly paying hackers", "url": "https://techcrunch.com/2026/11/25/doj-accuses-former-cyber-executive-of-defrauding-ransomware-victims-by-secretly-paying-hackers/", "fonte_id": "techcrunch", "data_pub": "2026-11-25T17:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Procuradores dos Estados Unidos acusaram um ex-executivo de fraudar vítimas de ransomware ao pagar os hackers, cobrando mais dos vítimas e guardando a diferença.", "titulo_pt": "Procuradores acusam ex-executivo de fraudar vítimas de ransomware", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 287241, "titulo": "State AGs fight Character AI’s plan to auction off users’ private chats", "url": "https://techcrunch.com/2026/11/25/state-ags-fight-character-ais-plan-to-auction-off-users-private-chats/", "fonte_id": "techcrunch", "data_pub": "2026-11-25T17:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os procuradores-gerais dos estados estão combatendo o plano da Character AI de leiloar dados pessoais sensíveis de mais de 21 milhões de contas nos Estados Unidos, incluindo 2,1 milhões de contas de menores de idade.", "titulo_pt": "Procuradores-gerais combatem plano da Character AI de leiloar dados pessoais de usuários", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 287233, "titulo": "Ladybird browser's first downloadable alpha is surprisingly capable", "url": "https://arstechnica.com/gadgets/2026/11/ladybirds-new-alpha-shows-theres-life-beyond-chromium/", "fonte_id": "ars_technica", "data_pub": "2026-11-25T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um motor de navegador independente foi lançado para Linux e macOS, e foi testado pela equipe. O navegador Ladybird, em sua versão alfa baixável, surpreendeu com suas capacidades.", "titulo_pt": "Ladybird browser's first downloadable alpha is surprisingly capable", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 287242, "titulo": "X’s latest update for creators focuses on vertical video", "url": "https://techcrunch.com/2026/11/25/xs-latest-update-for-creators-focuses-on-vertical-video/", "fonte_id": "techcrunch", "data_pub": "2026-11-25T17:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A última atualização dos recursos de criação da X se concentra em vídeos verticais, refletindo a crescente popularidade dos vídeos de curta duração. Essas ferramentas buscam ajudar a empresa a concorrer com plataformas como o YouTube e o Instagram.", "titulo_pt": "Última atualização dos recursos de criação da x se concentra em vídeos verticais", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 286620, "titulo": "Investigadores dos EUA identificam falha que provocou caos aéreo, diz jornal", "url": "https://www.infomoney.com.br/mundo/investigadores-dos-eua-identificam-falha-que-provocou-caos-aereo-diz-jornal/", "fonte_id": "infomoney", "data_pub": "2026-11-25T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investigadores dos Estados Unidos identificaram uma falha que causou caos no sistema aéreo, conforme informou um jornal. O problema não teria sido causado por um ataque hacker.", "titulo_pt": "Investigadores dos EUA identificam falha que provocou caos aéreo", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 287234, "titulo": "Etsy clarifies AI terms after seller backlash", "url": "https://arstechnica.com/tech-policy/2026/11/etsy-clarifies-ai-terms-after-seller-backlash/", "fonte_id": "ars_technica", "data_pub": "2026-11-25T17:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Etsy esclareceu os termos relacionados à inteligência artificial após reações negativas de vendedores. Um ilustrador experiente descartou as mudanças como 'doces palavras'.", "titulo_pt": "Etsy esclarece termos de IA após reações negativas de vendedores", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 287220, "titulo": "How data centers are driving a US natural-gas boom", "url": "https://www.technologyreview.com/2026/11/25/1149836/data-centers-gas-power-plants/", "fonte_id": "mit_tech_review", "data_pub": "2026-11-25T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A crescente demanda por energia elétrica, impulsionada por centrais de dados, tem levado a um boom no uso de gás natural nos Estados Unidos. David Rotman, em uma reportagem publicada em maio de 2025, previu que a inteligência artificial poderia manter a dependência do gás natural, e suas previsões se confirmaram mais vezes do que se pode contar desde então.", "titulo_pt": "Como centrais de dados estão impulsionando um boom de gás natural nos EUA", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 287243, "titulo": "WhatsApp now lets you schedule messages in group and individual chats", "url": "https://techcrunch.com/2026/11/25/whatsapp-now-lets-you-schedule-messages-in-group-and-individual-chats/", "fonte_id": "techcrunch", "data_pub": "2026-11-25T16:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A WhatsApp agora permite agendar mensagens em chats individuais e grupais, com opções de agendamento de 10 minutos a 14 dias após o envio.", "titulo_pt": "Agora, whatsapp permite agendar mensagens em chats individuais e grupais", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 287235, "titulo": "Ars Live recap: Don’t expect military attacks on data centers to stop", "url": "https://arstechnica.com/gadgets/2026/11/ars-live-recap-dont-expect-military-attacks-on-data-centers-to-stop/", "fonte_id": "ars_technica", "data_pub": "2026-11-25T16:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças militares têm várias razões para alvos de data centers e nuvem durante tempos de guerra.", "titulo_pt": "Ars Live recap: não espere que ataques militares a data centers parem", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 287303, "titulo": "Permut raises €3M to turn conversational AI into a revenue driver for brands", "url": "https://tech.eu/2026/11/25/permut-raises-eur3m-to-turn-conversational-ai-into-a-revenue-driver-for-brands/", "fonte_id": "tech_eu", "data_pub": "2026-11-25T15:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Permut, uma plataforma de agentes de inteligência artificial conversacional que empresas podem implantar em qualquer canal de interação com os clientes, concluiu uma rodada seed de €3 milhões. A empresa resolve um desafio enfrentado por muitas organizações.", "titulo_pt": "Permut arrecada €3 milhões para transformar IA conversacional em motor de receita para marcas", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 287167, "titulo": "Hong Kong ticketing hack exposes data of 1.3 million users as cyber breaches surge", "url": "https://www.scmp.com/news/hong-kong/society/article/3375802/hong-kong-ticketing-hack-exposes-data-13-million-users-cyber-breaches-surge", "fonte_id": "scmp", "data_pub": "2026-11-25T14:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um sistema de bilheteria online gerenciado pelo governo de Hong Kong foi hackeado, exposto dados de 1,3 milhão de usuários. Esta é uma das várias violações de segurança cibernética que ocorreram recentemente na cidade.", "titulo_pt": "Hackeamento expõe dados de 1,3 milhões de usuários em sistema de bilheteria de hong Kong", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 287096, "titulo": "Spanish defence giant Indra joins Europe’s push for ‘sovereign AI’", "url": "https://www.ft.com/content/05d6c6b6-80ce-4331-9bed-5835991fba2e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-25T14:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A gigante espanhola de defesa Indra se juntou à iniciativa europeia para promover a 'soberania da IA', em resposta ao crescente desconforto sobre a dependência da tecnologia americana na Europa.", "titulo_pt": "Grande empresa espanhola de defesa se une à busca europeia por 'soberania da IA'", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 286680, "titulo": "Startup de IA contra o crime chega a 230 cidades brasileiras", "url": "https://exame.com/inteligencia-artificial/startup-de-ia-contra-o-crime-chega-a-230-cidades-brasileiras/", "fonte_id": "exame", "data_pub": "2026-11-25T14:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma startup brasileira de inteligência artificial chegou a 230 cidades e captou US$ 40 milhões em financiamento. A empresa planeja expandir seus pilotos para três novas unidades da federação além das quatro já atendidas.", "titulo_pt": "Startup de IA contra o crime chega a 230 cidades brasileiras", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 287226, "titulo": "Amazon is reportedly in talks to end Muse AI shopping block", "url": "https://www.theverge.com/tech/1042071/meta-amazon-muse-ai-shopping-discussions", "fonte_id": "the_verge", "data_pub": "2026-11-25T14:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amazon estaria em negociações para permitir que o agente AI Muse da Meta compre no seu marketplace online. As conversas poderiam encerrar o bloqueio atual de Muse na plataforma, com foco nas categorias de produtos recomendados e no impacto na receita publicitária da gigante do e-commerce.", "titulo_pt": "Amazon estaria em discussões para permitir que o Muse AI da meta faça compras em seu marketplace", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 287259, "titulo": "Immersive shopping survived the demise of the metaverse—but its appeal depends on how it's designed and who is using it", "url": "https://phys.org/news/2026-11-immersive-survived-demise-metaverse-appeal.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2021 e 2022, grandes lojas e marcas de moda entraram no metaverso, criando lojas virtuais, produtos digitais e convidando consumidores a explorarem mundos virtuais através de avatar. Apesar da maioria dessa excitação ter diminuído, as tecnologias por trás dessas experiências ainda não desapareceram.", "titulo_pt": "O comércio imersivo sobreviveu à morte do metaverso, mas sua atratividade depende da sua concepção e do público-alvo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 287331, "titulo": "Why don’t dogs look up when a low-flying plane passes overhead? Part 7", "url": "https://www.newscientist.com/article/2600098-why-dont-dogs-look-up-when-a-low-flying-plane-passes-overhead-part-7/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Leitores do New Scientist forneceram respostas científicas a uma pergunta sobre por que os cães não olham para cima quando um avião passa baixo no céu, como parte da série Last Word do periódico.", "titulo_pt": "Por que os cães não olham para cima quando um avião passa baixo no céu?", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 287332, "titulo": "What is the world actually like, if what we see is just our brain’s interpretations? part 3", "url": "https://www.newscientist.com/article/2600097-reality-check-4/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os leitores de New Scientist responderam a uma pergunta sobre o que o mundo realmente seria como se o que vemos fosse apenas interpretações do nosso cérebro. O tema era parte da série Last Word do New Scientist, onde os leitores fornecem respostas científicas entre si.", "titulo_pt": "Como seria o mundo se o que vemos for apenas interpretações do nosso cérebro?", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 287333, "titulo": "If two chromosomes are better than one, why not three?", "url": "https://www.newscientist.com/article/2600096-paired-up/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os leitores da New Scientist responderam a uma pergunta sobre por que, se duas cromossomos são melhores, não seriam três. O tema foi abordado no Last Word da revista, onde os leitores fornecem respostas científicas entre si.", "titulo_pt": "Se dois cromossomos são melhores que um, por que não ter três?", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 287388, "titulo": "‘Blade Runner 2099’ cast praise the incredible set designs that brought the sci-fi universe to life: ‘it was all so well-realized’ (interview)", "url": "https://www.space.com/entertainment/space-movies-shows/blade-runner-2099-cast-praise-the-incredible-set-designs-that-brought-the-sci-fi-universe-to-life-it-was-all-so-well-realized-interview", "fonte_id": "space_com", "data_pub": "2026-11-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Atores elogiaram os designs de cenário impressionantes que trouxeram o universo de ficção científica à vida, afirmando que tudo estava bem-realizado. Eles se disseram prontos para mergulhar no projeto, especialmente após a excelente criação da história e do roteiro por Silka.", "titulo_pt": "Elenco de 'blade Runner 2099' elogia designs de cenário impressionantes", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 286783, "titulo": "Creyeron que se trataba de una roca y resultó ser el cuello de un titanosaurio gigante", "url": "https://www.lanacion.com.ar/ciencia/creyeron-que-se-trataba-de-una-roca-y-resulto-ser-el-cuello-de-un-titanosaurio-gigante-nid25112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-25T17:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Paleontólogos espanhóis descobriram um fósil que provavelmente pertencia a um titanosaurio gigante que viveu há 70 milhões de anos. Inicialmente, os cientistas acreditaram que se tratava apenas de uma rocha.", "titulo_pt": "Acreditavam ser uma rocha, mas era o pescoço de um titanosaurio gigante", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 287261, "titulo": "'Rubik's Cube molecule' puts the stretch in next-gen semiconductors", "url": "https://phys.org/news/2026-11-rubik-cube-molecule-gen-semiconductors.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Toronto desenvolveram materiais plásticos que são flexíveis e ainda conseguem conduzir eletricidade, potencialmente abrindo novas aplicações em medicina e biologia. Essa inovação aumenta a elasticidade desses materiais mantendo suas propriedades conductivas, o que poderia superar limitações atuais encontradas em telas dobráveis de celulares.", "titulo_pt": "Molécula do cubo de rubik: aumenta a flexibilidade dos materiais sem comprometer a condutividade elétrica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 286600, "titulo": "EUA atualiza diretrizes de colesterol e recomenda exames desde a infância", "url": "https://www.metropoles.com/saude/eua-atualiza-diretrizes-de-colesterol-e-recomenda-exames-desde-a-infancia", "fonte_id": "metropoles", "data_pub": "2026-11-25T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As diretrizes dos EUA foram atualizadas para recomendar o exame da lipoproteína (a) ao menos uma vez na vida e avaliar o risco cardiovascular para iniciar o tratamento precocemente.", "titulo_pt": "EUA atualiza diretrizes de colesterol e recomenda exames desde a infância", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 287391, "titulo": "Hera spacecraft gets 1st up-close look at stadium-sized hole punched in asteroid by NASA DART mission", "url": "https://www.space.com/astronomy/asteroids/hera-spacecraft-gets-1st-up-close-look-at-stadium-sized-hole-punched-in-asteroid-by-nasa-dart-mission", "fonte_id": "space_com", "data_pub": "2026-11-25T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A missão DART da NASA criou um buraco do tamanho de um estádio em um asteroide distante, e o spacecraft Hera foi o primeiro a capturar uma imagem perto desse impacto.", "titulo_pt": "Nave hera captura primeiro vistinho de buraco do tamanho de um estádio causado por missão DART na asteroide", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 287262, "titulo": "Mountain gorillas that survive early hardship show few signs of lasting social isolation", "url": "https://phys.org/news/2026-11-mountain-gorillas-survive-early-hardship.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na Volcanoes National Park, Ruanda, pesquisadores não encontraram evidências de que gorilas montanheses que perderam um dos pais, cresceram com poucos companheiros da mesma idade ou enfrentaram outros desafios na infância, ficaram socialmente isolados à medida que cresceram. As fêmeas que enfrentaram mais dificuldades passaram mais tempo próximas de outras fêmeas, mesmo ainda vivendo em seus grupos de nascimento.", "titulo_pt": "Gorilas montanheses que enfrentam dificuldades precoces não mostram sinais duradouros de isolamento social", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 287263, "titulo": "Workplace connections reveal a quitting paradox: Too few or too many may increase risk", "url": "https://phys.org/news/2026-11-workplace-reveal-paradox.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores que são frequentemente consultados pelos colegas apresentam um paradoxo: apesar de terem acesso a informações importantes e participarem de decisões, a sobrecarga de mensagens e solicitações pode dificultar o foco no trabalho próprio, aumentando o risco de querer deixar a empresa.", "titulo_pt": "Conexões no local de trabalho revelam paradoxo: poucas ou muitas conexões podem aumentar o risco de saída", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 287293, "titulo": "A cosmically close supernova may spill the stellar explosion’s secrets", "url": "https://www.sciencenews.org/article/close-supernova-secrets-white-dwarf", "fonte_id": "science_news", "data_pub": "2026-11-25T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em novembro, astrônomos observaram uma supernova próxima. Rapidamente perceberam que era algo especial e iniciaram estudos imediatos.", "titulo_pt": "Uma supernova próxima pode revelar segredos estelares", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 287317, "titulo": "Childhood, Career Come Full Circle for Budget Analyst at NASA Goddard", "url": "https://www.nasa.gov/centers-and-facilities/goddard/childhood-career-come-full-circle-for-budget-analyst-at-nasa-goddard/", "fonte_id": "nasa_news", "data_pub": "2026-11-25T16:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ashley Knight cresceu ouvindo conversas sobre a NASA em casa, pois seus pais trabalhavam no Goddard Space Flight Center. Essas conversas continuaram mesmo após o fechamento do escritório. Uma conversa marcante aconteceu após o acidente da Columbia em 1986.", "titulo_pt": "Infância, carreira se completam para analista orçamentário na NASA Goddard", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 287318, "titulo": "Eye of the Sahara", "url": "https://www.nasa.gov/image-article/eye-of-the-sahara/", "fonte_id": "nasa_news", "data_pub": "2026-11-25T16:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Richat Structure, conhecida como o 'Olho do Saara', foi observada pela Estação Espacial Internacional em 14 de novembro de 2026. É uma estrutura geológica erodida, com cerca de 100 milhões de anos, resultante de atividade ignea e levantamento na Mauritânia.", "titulo_pt": "Olho do saara", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 287268, "titulo": "New database integrates genomic resources for China's protected wild plants", "url": "https://phys.org/news/2026-11-database-genomic-resources-china-wild.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores do Jardim Botânico do Sul da China (SCBG) da Academia Chinesa de Ciências (CAS) desenvolveram o Banco de Dados Genômico para Plantas Selvagens Protegidas da China (GDNPP) para integrar recursos genômicos de plantas selvagens protegidas da China. O banco de dados inclui 626 conjuntos de referência genômicos de 234 espécies e estudos populacionais genômicos de 147 espécies, com base em uma revisão sistemática de 381 publicações.", "titulo_pt": "Nova base de dados integra recursos genômicos para plantas silvestres protegidas da China", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 287308, "titulo": "Why AI’s proof of the Riemann hypothesis is so bittersweet", "url": "https://www.scientificamerican.com/article/why-ais-proof-of-the-riemann-hypothesis-is-so-bittersweet/", "fonte_id": "scientific_american", "data_pub": "2026-11-25T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A prova da hipótese de Riemann deveria ter sido motivo de comemoração para alguém que literalmente usa uma parte dela na pele. O artigo discute a natureza complexa dessa conquista em termos de avanço científico e suas implicações práticas.", "titulo_pt": "Por que a prova da hipótese de Riemann pelo AI é tão amarga", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 287346, "titulo": "Desai Chia designs Bethesda Residence to balance \"openness and discretion\"", "url": "https://www.dezeen.com/2026/11/25/bethesda-residence-desai-chia-maryland/", "fonte_id": "dezeen", "data_pub": "2026-11-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Desai Chia Architecture projetou uma residência em Bethesda, Maryland, que combina abertura e privacidade através de uma grande claraboia que traz luz natural para o interior do espaço. O projeto foi desenvolvido para um terreno estreito em uma vizinhança densamente povoada.", "titulo_pt": "Desai Chia projeta residência em Bethesda para equilibrar 'abertura e privacidade'", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 287354, "titulo": "‘The Trip’ Returns for Fifth Installment, Next Sending Steve Coogan and Rob Brydon to Frigid Arctic Circle", "url": "https://www.indiewire.com/news/breaking-news/the-trip-returns-fifth-installment-steve-coogan-rob-brydon-1235231120/", "fonte_id": "indiewire", "data_pub": "2026-11-25T17:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme 'The Trip to the Northern Lights' retornará para sua quinta instalação, com Steve Coogan e Rob Brydon viajando para o frio círculo polar ártico. A produção será lançada em cinemas em 9 de abril de 2027.", "titulo_pt": "The Trip: viagem às luzes do norte retorna para quinta temporada no círculo polar ártico", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 287325, "titulo": "Anselm Kiefer review – Holocaust-haunted forests and a glimpse into a gigantic grave", "url": "https://www.theguardian.com/artanddesign/2026/nov/25/anselm-kiefer-review-white-cube", "fonte_id": "guardian_culture", "data_pub": "2026-11-25T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anselm Kiefer explora o significado da arte após o Holocausto em suas grandes pinturas, que abordam temas pesados como a história europeia e o fim da civilização. A exposição retrata o artista buscando inspiração em mitologias antigas e poesia romântica alemã.", "titulo_pt": "Revisão de anselm Kiefer – florestas assombradas pelo holocausto e uma vislumbre de uma gigantesca sepultura", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 286549, "titulo": "Quaquá vai a Brasília convidar Lula e Janja para o desfile da Maricá na Sapucaí", "url": "https://veja.abril.com.br/brasil/quaqua-vai-a-brasilia-convidar-lula-e-janja-para-o-desfile-da-marica-na-sapucai/", "fonte_id": "veja", "data_pub": "2026-11-25T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A dirigente petista Quaquá convidou o casal Lula e Janja para assistir ao desfile da agremiação Maricá no Carnaval carioca, durante a estreia da entidade no Grupo Especial.", "titulo_pt": "Quaquá convida Lula e Janja para desfile da Maricá no carnaval carioca", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 286551, "titulo": "Chef brasileira recebe prêmio por projeto que investiga gastronomia nacional", "url": "https://veja.abril.com.br/gastronomia/chef-brasileira-recebe-premio-por-projeto-que-investiga-gastronomia-nacional/", "fonte_id": "veja", "data_pub": "2026-11-25T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A chef brasileira Janaína Torres recebeu o prêmio 'Community Spirit Award', concedido pelo 'La Liste' por seu projeto que investiga a gastronomia nacional.", "titulo_pt": "Chef brasileira jan 6607, "titulo": "Voluntários se mobilizam para encontrar 30 cães da raça spitz abandonados", "url": "https://www.metropoles.com/colunas/e-o-bicho/voluntarios-se-mobilizam-para-encontrar-30-caes-da-raca-spitz-abandonados", "fonte_id": "metropoles", "data_pub": "2026-11-25T17:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Voluntários em Varsóvia, Polônia, estão buscando localizar cerca de 30 cães spitz que foram abandonados de um criadouro ilegal.", "titulo_pt": "Voluntários buscam encontrar 30 cães spitz abandonados em varsóvia", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 286749, "titulo": "Autor de femicidio en Villa Alemana está siendo buscado y se investiga agresión sexual a madre de la víctima", "url": "https://www.latercera.com/nacional/noticia/autor-de-femicidio-en-villa-alemana-esta-siendo-buscado-y-se-investiga-agresion-sexual-a-madre-de-la-victima/", "fonte_id": "la_tercera", "data_pub": "2026-11-25T17:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um suspeito de cometer um femicídio em Villa Alemana está sendo procurado, e está sendo investigada uma agressão sexual contra a mãe da vítima. O crime ocorreu no Dia Internacional de Eliminação da Violência contra a Mulher, celebrado em 25 de novembro.", "titulo_pt": "Suspeito de femicídio em Villa Alemana está sendo procurado e investigada agressão sexual à mãe da vítima", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 286611, "titulo": "Quatro são presos em tentativa de roubo a residência de ex-deputado federal", "url": "https://www.metropoles.com/sao-paulo/quatro-sao-presos-em-tentativa-de-roubo-a-residencia-de-ex-deputado-federal", "fonte_id": "metropoles", "data_pub": "2026-11-25T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quatro pessoas foram presas em uma tentativa de roubo a uma residência do ex-deputado federal Nelson Marquezelli, localizada em Pirassununga, São Paulo. O incidente ocorreu nesta quarta-feira (25/11).", "titulo_pt": "Quatro presos em tentativa de roubo a casa de ex-deputado federal", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 286663, "titulo": "Expectativa de vida em Cuba cai pela primeira vez em quase 80 anos", "url": "https://www.dw.com/pt-br/expectativa-de-vida-em-cuba-cai-pela-primeira-vez-em-quase-80-anos/a-80048415?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-25T15:55:00Z", "idioma": "pt", "provavel_duplicata_de": 286450, "texto_pt": "A expectativa de vida em Cuba diminuiu pela primeira vez em quase 80 anos, passando de 78,8 anos em 2020 para 74,4 anos em 2025. O aumento da mortalidade infantil e materna foi um fator chave nesse decréscimo.", "titulo_pt": "Expectativa de vida em Cuba diminui pela primeira vez em quase 80 anos", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 286866, "titulo": "Number of women killed by men in Ireland almost doubles in a year", "url": "https://www.theguardian.com/society/2026/nov/25/number-of-women-killed-by-men-in-ireland-almost-doubles-in-a-year", "fonte_id": "guardian_world", "data_pub": "2026-11-25T13:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de mulheres mortas por homens em Irlanda aumentou nos últimos cinco anos, especialmente nos últimos doze meses, de acordo com um estudo. Após décadas de queda, o número de mortes violentas começou a aumentar em 2021 e continuou a crescer este ano, com 13 mortes até agora, conforme informado pela organização benemérita Women’s Aid.", "titulo_pt": "Número de mulheres mortas por homens na irlanda quase duplica em um ano", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 286700, "titulo": "Como saber se uma iniciativa realmente gera impacto social?", "url": "https://exame.com/bussola/como-saber-se-uma-iniciativa-realmente-gera-impacto-social/", "fonte_id": "exame", "data_pub": "2026-11-25T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alcance, profundidade e durabilidade são dimensões complementares para avaliar a efetividade das iniciativas sociais. Essas dimensões ajudam a compreender melhor como uma ação social realmente impacta a sociedade.", "titulo_pt": "Como saber se uma iniciativa social realmente gera impacto?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 286666, "titulo": "Como o PCC e o Comando Vermelho se espalharam pelo Brasil", "url": "https://www.dw.com/pt-br/como-o-pcc-e-o-comando-vermelho-se-espalharam-pelo-brasil/a-80045430?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-25T12:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nas prisões de São Paulo e do Rio de Janeiro, nasceram as duas maiores facções criminosas do país, o PCC e o Comando Vermelho, que hoje atuam em praticamente todas as regiões brasileiras e em rotas internacionais, influenciando mercados ilegais.", "titulo_pt": "Como o PCC e o Comando Vermelho se espalharam pelo Brasil", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 286668, "titulo": "Um ano após feminicídios no Cefet/RJ, denúncias de assédio seguem sem resposta", "url": "https://www.dw.com/pt-br/um-ano-após-feminicídios-no-cefet-rj-denúncias-de-assédio-seguem-sem-resposta/a-80032239?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-25T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Denúncias de assédio sexual e comportamentos hostis na comunidade do Cefet/RJ continuam sem resposta a um ano dos feminicídios ocorridos na instituição. Pouca ação foi tomada para prevenir assédios e investigar as reclamações.", "titulo_pt": "Um ano após feminicídios no Cefet/RJ, denúncias de assédio seguem sem resposta", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 286982, "titulo": "Most blame government for return of measles: Poll", "url": "https://www.axios.com/2026/11/25/measles-elimination-poll-government-ipsos", "fonte_id": "axios", "data_pub": "2026-11-25T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo levantamento da Ipsos indica que quase 60% dos americanos atribuem a responsabilidade pelo retorno da raiva de macacão aos líderes do governo. Há poucas indicações de que o público queira focar nisso. A divisão partidária sobre vacinas e surtos é tão profunda que os democratas, quando tomarem o controle do Congresso, não terão um mandato amplo para investigar a resposta do governo. Além disso, há uma divisão geracional, com pessoas com mais de 65 anos, que lembram a introdução da vacina contra macacão, mais propensas a considerar que a situação atual é inadequada.", "titulo_pt": "Quase 60% dos americanos culpam o governo pelo retorno da raiva de macacão", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 286986, "titulo": "This Thanksgiving won't be stuffed with politics, Americans say: Poll", "url": "https://www.axios.com/2026/11/25/thanksgiving-politics-polling", "fonte_id": "axios", "data_pub": "2026-11-25T10:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A maioria dos americanos não espera discutir política durante o Thanksgiving deste ano. Em uma pesquisa recente, 37% dos entrevistados que planejam comemorar o feriado disseram que políticas serão discutidas, sendo que os democratas são mais propensos a fazê-lo do que os republicanos.", "titulo_pt": "Este Thanksgiving não será cheio de discussões políticas, dizem americanos: pesquisa", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 287032, "titulo": "'Femicide destroys everything': The red benches raising awareness of domestic violence", "url": "https://www.lemonde.fr/en/france/article/2026/11/25/femicide-destroys-everything-the-red-benches-raising-awareness-of-domestic-violence_6788080_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-25T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Patrícia Le Fell perdeu sua irmã Christelle em maio de 2013, que foi assassinada pelo parceiro em frente a seus dois filhos. Agora, ela apoia vítimas de violência doméstica na Bretanha. Uma campanha de 'Bancos Vermelhos' foi lançada nacionalmente.", "titulo_pt": "Femicídio destrói tudo: campanha de bancos vermelhos aumenta conscientização sobre violência doméstica", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 287202, "titulo": "Five new dengue cases reported in Kaohsiung: CDC", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/26/2003868423", "fonte_id": "taipei_times", "data_pub": "2026-11-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram relatados cinco novos casos de dengue em Kaohsiung: o Centro de Controlo e Prevenção de Doenças (CDC) fez o anúncio.", "titulo_pt": "Cinco novos casos de dengue relatados em Kaohsiung: CDC", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 286748, "titulo": "RADAR LT: El Niño: lluvias y calor podrían aumentar el riesgo de enfermedades infecciosas en Chile", "url": "https://www.latercera.com/videos/noticia/radar-lt-el-nino-lluvias-y-calor-podrian-aumentar-el-riesgo-de-enfermedades-infecciosas-en-chile/", "fonte_id": "la_tercera", "data_pub": "2026-11-25T17:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Investigadores do Instituto Milenio em Inmunología e Inmunoterapia (IMII) alertam que as chuvas intensas e as altas temperaturas associadas ao El Niño podem aumentar o risco de doenças infecciosas como dengue, hantavirus e infecções alimentares. Eles enfatizam a necessidade de reforçar as medidas de prevenção.", "titulo_pt": "RADAR LT: el Niño: chuvas e calor podem aumentar o risco de doenças infecciosas no Chile", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 286562, "titulo": "Mpox: número de casos passa de 1 500 no Brasil e São Paulo inicia vacinação com novas doses", "url": "https://veja.abril.com.br/saude/mpox-numero-de-casos-passa-de-1-500-no-brasil-e-sao-paulo-inicia-vacinacao-com-novas-doses/", "fonte_id": "veja", "data_pub": "2026-11-25T16:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de casos de mpox no Brasil ultrapassou 1.500. A cidade de São Paulo recebeu 600 doses de vacina enviadas pelo Ministério da Saúde.", "titulo_pt": "Número de casos de mpox no Brasil passa de 1.500 e São Paulo inicia vacinação", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 287320, "titulo": "Media reaction: Who is to blame for COP31 ‘failure’?", "url": "https://www.carbonbrief.org/media-reaction-who-is-to-blame-for-cop31-failure", "fonte_id": "carbon_brief", "data_pub": "2026-11-25T16:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A COP31 chegou a um fim dramático no final de semana quando uma coalizão de países rejeitou o 'Pacto de Antalya', citando suas falhas. O post discute a reação da mídia sobre quem deve ser culpado pelo 'fracasso' da COP31.", "titulo_pt": "Reação da mídia: quem deve ser culpado pelo 'fracasso' da COP31?", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 287185, "titulo": "9 dead, 17 trapped in Indonesia after illegal gold mine floods", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3375778/3-dead-23-trapped-indonesia-after-illegal-gold-mine-floods", "fonte_id": "scmp", "data_pub": "2026-11-25T10:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove pessoas morreram e 17 estão desaparecidas após uma mina ilegal de ouro se encher em uma região montanhosa da Indonésia. O acidente ocorreu quando a chuva forte fez o rio Ciseureuh transbordar e inundar uma mina localizada na província de Java Ocidental.", "titulo_pt": "9 Mortos, 17 desaparecidos após mina ilegal de ouro se encher na indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 285756, "titulo": "Por que as negociações climáticas travaram na COP31 e foram um ‘fracasso’, segundo Marina Silva", "url": "https://veja.abril.com.br/agenda-verde/por-que-as-negociacoes-climaticas-travaram-na-cop31-e-foram-um-fracasso-segundo-marina-silva/", "fonte_id": "veja", "data_pub": "2026-11-25T09:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As negociações climáticas na COP31 ficaram paralisadas devido a impasses entre grandes potências e bloqueios em temas centrais, resultando em um 'fracasso' conforme declarou Marina Silva.", "titulo_pt": "Por que as negociações climáticas na COP31 travaram e foram um ‘fracasso’, segundo Marina Silva", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 285797, "titulo": "Clima: ciclone extratropical avança pelo Sul e provoca nova frente fria", "url": "https://www.metropoles.com/brasil/clima-ciclone-extratropical-avanca-pelo-sul-e-provoca-nova-frente-fria", "fonte_id": "metropoles", "data_pub": "2026-11-25T09:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Inmet prevê chuvas fortes em áreas do Sul, Sudeste e Centro-Oeste do Brasil. No Nordeste, o calor pode chegar a 41°C.", "titulo_pt": "Ciclone extratropical avança pelo Sul e provoca nova frente fria, com chuvas fortes e calor no nordeste", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 286018, "titulo": "Large bushfire threatens homes and properties on remote island off Tasmania", "url": "https://www.theguardian.com/australia-news/2026/nov/25/large-bushfire-threatens-homes-and-properties-on-remote-island-off-tasmania", "fonte_id": "guardian_world", "data_pub": "2026-11-25T09:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio florestal em Flinders Island, uma ilha remota no Estreito de Bass, ameaça casas e propriedades após se expandir significativamente devido a descargas de relâmpagos. O fogo já lançou cinzas por centenas de quilômetros para o sul.", "titulo_pt": "Grande incêndio ameaça casas e propriedades em ilha remota ao largo de Tasmania", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 285904, "titulo": "Polémica por la venta de tierras frente al glaciar Perito Moreno a un magnate árabe que quiere construir un hotel de lujo", "url": "https://www.clarin.com/sociedad/polemica-venta-tierras-frente-glaciar-perito-moreno-magnate-arabe-quiere-construir-hotel-lujo_0_msTiB8tDq7.html", "fonte_id": "clarin", "data_pub": "2026-11-25T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governador Claudio Vidal autorizou, por decreto excepcional, a compra de terras para um empresário emirata que deseja construir um hotel de luxo na área protegida do Parque Nacional Los Glaciares, frente ao glaciar Perito Moreno. Um juiz suspendeu a transferência da propriedade e encaminhou o caso para a Corte Suprema.", "titulo_pt": "Polêmica por venda de terras frente ao glaciar Perito Moreno a magnata árabe que quer construir hotel de luxo", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 286166, "titulo": "Rescuers search for dozens trapped in flooded Indonesia gold mine", "url": "https://www.aljazeera.com/news/2026/11/25/rescuers-search-for-dozens-trapped-in-flooded-indonesia-gold-mine?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-25T08:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Polícia informa que 26 trabalhadores ainda estão presos em uma mina de ouro inundada após a transbordamento de um rio próximo devido a chuvas intensas.", "titulo_pt": "Resgatistas buscam trabalhadores em mina de ouro inunda em indonésia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 287120, "titulo": "Why did Israel arrest human rights defender Ghassan Al Najjar?", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/25/why-did-israel-arrest-human-rights-defender-ghassan-al-najjar?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-25T16:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O agricultor palestino e defensor dos direitos humanos Ghassan Al Najjar foi detido pelas forças israelenses.", "titulo_pt": "Por que Israel deteve o defensor dos direitos humanos Ghassan Al Najjar?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 286664, "titulo": "Execuções, chibatadas, perseguição: Arábia Saudita redobra repressão a dissidentes", "url": "https://www.dw.com/pt-br/execuções-chibatadas-perseguição-arábia-saudita-redobra-repressão-a-dissidentes/a-80044727?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-25T15:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Arábia Saudita intensificou a repressão a dissidentes em 2026, com mais de 200 execuções, aplicações de chibatadas e uma perseguição crescente contra vozes críticas. A situação dos direitos humanos no país se deteriorou, ocorrendo no contexto de conflitos no Irã.", "titulo_pt": "Execuções, chicotadas e perseguição: arábia Saudita intensifica repressão a dissidentes", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 287292, "titulo": "PAHO calls for stronger health sector response to violence against women and girls", "url": "https://www.paho.org/en/news/25-11-2026-paho-calls-stronger-health-sector-response-violence-against-women-and-girls", "fonte_id": "paho", "data_pub": "2026-11-25T14:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PAHO está pedindo uma resposta mais forte do setor de saúde para lidar com a violência contra mulheres e meninas. O chamado foi feito em 25 de novembro de 2026.", "titulo_pt": "PAHO solicita resposta mais forte do setor de saúde para violência contra mulheres e meninas", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 287321, "titulo": "Three months on from Nepal's devastating floods, thousands of children face a new threat: winter", "url": "https://www.unicef.org/press-releases/three-months-nepals-devastating-floods-thousands-children-face-new-threat-winter", "fonte_id": "unicef", "data_pub": "2026-11-25T12:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três meses após as devastadoras inundações em Nepal, milhares de crianças enfrentam um novo risco: o inverno. O UNICEF pede apoio urgente para ajudar crianças e famílias a permanecerem quentes, saudáveis e seguras à medida que as temperaturas caem.", "titulo_pt": "Três meses após inundações devastadoras em Nepal, crianças enfrentam novo risco: inverno", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 286859, "titulo": "Sri Lankan asylum seeker killed himself after being sent by UK to Eswatini", "url": "https://www.theguardian.com/uk-news/2026/nov/25/sri-lanka-asylum-seeker-convicted-sexual-assault-uk-kills-himself-eswatini", "fonte_id": "guardian_world", "data_pub": "2026-11-25T11:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kishanth Peramalya, um requerente de asilo sri-lanquês condenado por assédio sexual, foi enviado pelo Reino Unido para Eswatini, onde não tinha conexões, e se suicidou. Ele fazia parte de um grupo que saiu da Índia com o objetivo de chegar ao Canadá e pedir asilo lá.", "titulo_pt": "Sri lankês condenado por assédio sexual se suicida após ser enviado pelo reino unido para Eswatini", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 286863, "titulo": "China misusing Interpol to target dissidents, says leading UK lawyer", "url": "https://www.theguardian.com/world/2026/nov/25/china-misusing-interpol-target-dissidents-uk-lawyer", "fonte_id": "guardian_world", "data_pub": "2026-11-25T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um advogado britânico especializado em 'notas vermelhas' da Interpol afirma que a China está usando indevidamente o sistema para perseguir e silenciar dissidentes. Essa prática ocorre enquanto Hong Kong prepara-se para sediar a assembleia geral da organização policial pela primeira vez.", "titulo_pt": "Advogado britânico afirma que china está usando Interpol para perseguir dissidentes", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 286984, "titulo": "Trump faces looming wave of ICE lawsuits", "url": "https://www.axios.com/2026/11/25/lawsuit-dhs-ice-operation-midway-blitz-figueroa", "fonte_id": "axios", "data_pub": "2026-11-25T10:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Trump enfrenta a primeira das possivelmente centenas de ações judiciais que testarão se ele pode ser responsabilizado pelo comportamento dos agentes de imigração durante as operações da ICE. A Advocacy Litigation Não-Profit Democracy Forward apresentou a primeira ação sob a Lei Federal de Reivindicações de Acidente (FTCA) em favor de Dayanne Figueroa, uma cidadã dos EUA que foi detida durante uma operação da ICE.", "titulo_pt": "Trump enfrenta onda de ações judiciais contra ICE", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 286199, "titulo": "Ebola tied to rising violence against women and girls in Congo, UNICEF says", "url": "https://www.japantimes.co.jp/news/2026/11/25/world/science-health/ebola-violence-women-congo-unicef/", "fonte_id": "japan_times", "data_pub": "2026-11-25T07:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A UNICEF associa a epidemia de Ebola a um aumento da violência contra mulheres e meninas na República Democrática do Congo. O Ebola já causou mais de 5.800 mortes desde maio.", "titulo_pt": "Ebola relacionado a aumento da violência contra mulheres e meninas na Congo, diz UNICEF", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 286250, "titulo": "Migrant who became a symbol in Trump crackdown leaves US voluntarily", "url": "https://www.scmp.com/news/world/united-states-canada/article/3375712/migrant-who-became-symbol-trump-crackdown-leaves-us-voluntarily", "fonte_id": "scmp", "data_pub": "2026-11-25T06:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kilmar Abrego Garcia, um salvadorenho que se tornou um símbolo da oposição à repressão migratória de Donald Trump, deixou voluntariamente os Estados Unidos para a Espanha. A saída de Abrego Garcia, de 31 anos, encerra um caso legal que chegou ao Supremo Tribunal dos EUA.", "titulo_pt": "Migrante que se tornou símbolo da repressão migratória de Trump deixa EUA voluntariamente", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 286313, "titulo": "Prosecutors seek lengthy prison sentences for pastor, grandmother in fatal abuse of boy", "url": "https://en.yna.co.kr/view/AEN20261125005700315", "fonte_id": "yonhap_news", "data_pub": "2026-11-25T05:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Procuradores em Cheonan, Coreia do Sul, pediram penas de prisão prolongada para um pastor e uma avó acusados de maus-tratos fatais a um menino.", "titulo_pt": "Procuradores pedem penas longas para pastor e avó em caso de maus-tratos fatais a menino", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 286208, "titulo": "Prosecutors seek death penalty for 79-year-old man over couple’s murder and arson", "url": "https://www.japantimes.co.jp/news/2026/11/25/japan/crime-legal/chiba-murder-arson-trial/", "fonte_id": "japan_times", "data_pub": "2026-11-25T04:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de 79 anos é acusado de ter esfaqueado uma casal e incendiado várias casas em Chiba, Prefeitura de 2024, destruindo um total de oito prédios.", "titulo_pt": "Procuradores buscam pena capital para homem de 79 anos por assassinato e arromatização", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 286024, "titulo": "The Russian army’s secret death toll – podcast", "url": "https://ww const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
