<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "13/11/2026 15:24", "stats": {"noticias_novas": 909, "resumos_gerados": 249}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva visitou as Filipinas com uma agenda comercial ampla, incluindo o objetivo de revertê-lo veto à carne suína. Durante essa visita, o governo Lula 4 terá que dialogar com a oposição no Senado, já que o PL (Partido Liberal) será responsável por mais de um terço do Senado a partir de 2027. O ministro Gilmar Mendes, do STF, comentou sobre as eleições no Rio de Janeiro, indicando que, se houver um recurso, o caso irá ao plenário. Além disso, o ajuste fiscal proposto pelo governo Lula 4 não é incompatível com as promessas de campanha, segundo André Esteves, presidente do conselho do BTG Pactual. O projeto de ajuste fiscal do governo foi enviado à Câmara dos Deputados, enfrentando críticas tanto de empresários quanto de petistas.", "mundo": "O primeiro-ministro do Kosovo, Albin Kurti, afirmou que seu país já está pronto para se candidatar à União Europeia após quatro anos de implementação do processo. A Alta Representante da União Europeia para os Negócios Estrangeiros, Kaja Kallas, exigiu que a Europa nomeie um embaixador antes de participar das negociações. Por outro lado, o presidente russo, Vladimir Putin, recusou-se a conversar com a chanceler estoniana devido à sua posição firme. A Coreia do Sul multou a Match Group em 11 milhões de euros por violações de privacidade de dados. Além disso, o papa está em uma viagem que aborda tanto questões políticas quanto religiosas durante sua tour por países sul-americanos.\n\nA China realizou manobras militares silenciosas no Pacífico, intensificando sua pressão militar sobre Taiwan, que reagiu com uma condenação. O Congresso dos Estados Unidos está considerando mais restrições na exportação de chips para a China, com o objetivo de limitar a cooperação tecnológica entre os dois países. Em outro desenvolvimento, Israel realizou operações militares em territórios palestinos, resultando na morte de um cidadão palestiniano e em operações em áreas residenciais. Além disso, o Irã está debatendo possíveis mudanças na sua doutrina nuclear, enquanto o Irã e a Rússia intensificaram as negociações comerciais. A Ucrânia relatou ter registrado 3.000 baixas russas em um único dia, enquanto a Rússia sugeriu controlar metade do Donbas não ocupado. Finalmente, a China advertiu os Estados Unidos contra a imposição de novas restrições de exportação de chips de inteligência artificial, em meio a tensões comerciais entre os dois países.", "economia": "Os títulos do Tesouro dos Estados Unidos podem ter sua pior semana desde o dia em que Donald Trump foi libertado, devido a uma inflação maior do que o esperado e declarações hawkish dos membros do Federal Reserve. Este cenário afetou investidores que apostavam em uma reversão da queda dos rendimentos das dívidas globais. Em seguida, a Caixa Econômica Federal está avaliando se e quando aumentará as taxas de juros do financiamento imobiliário, considerando o aumento do custo de captação de recursos e a elevação das taxas no mercado financeiro. O presidente do Banco Central afirmou que os dados atuais não justificam mudanças na mensagem sobre os juros e que a incerteza nos cenários doméstico e internacional requer cautela na comunicação dos próximos movimentos da Selic. Além disso, a Braskem informou que as margens elevadas na petroquímica, impulsionadas pela guerra no Irã, já passaram. A empresa espera que 2027 seja um ano pior do que a média histórica do setor.", "tecnologia": "Líderes europeus se reuniram em uma primeira cúpula sobre inteligência artificial (IA) para discutir desafios relacionados à tecnologia, buscando estratégias para manter a região competitiva na corrida global de IA. A saída do CEO da Nvidia, Jensen Huang, após problemas pessoais, tem gerado preocupações sobre o futuro da empresa e os investimentos em inteligência artificial de código aberto. A renúncia de Huang pode afetar a cadeia de suprimentos de IA da China e reduzir os investimentos da Nvidia em modelos de IA de baixo perfil e infraestrutura associada. Além disso, a demanda por computadores resistentes deve impulsionar as vendas da Getac no próximo ano, enquanto a startup sul-coreana DeepX planeja investir 100 milhões de dólares no desenvolvimento de um novo chip de IA utilizando a tecnologia de fabricação avançada de 2 nanômetros da Samsung.", "ciencia": "A poluição sonora está alterando a saúde e o comportamento dos animais em todo o planeta, conforme relatado pelo New Scientist. Além disso, cientistas publicaram um atlas cerebral com dados de 25,5 milhões de células de humanos e outros primatas, que pode auxiliar na investigação de doenças como Parkinson e esquizofrenia. Em outro desenvolvimento, pesquisadores da National Taiwan University relataram a primeira evidência experimental do efeito Nernst orbital, causado por correntes de calor que acumulam o momento angular orbital dos elétrons transversalmente. Os cientistas do Instituto de Pesquisa de Metais da Academia Chinesa de Ciências demonstraram como a geometria e as propriedades eletrônicas dos sítios ativos de ródio subnanométricos moldam a ativação de C–H, a desorção de produtos e a quebra de ligações C–C durante a dehidrogenação de butano. Por fim, a simulação Lumina, um modelo computacional complexo de astrofísica, está fornecendo uma visão virtual do início do universo a cientistas, oferecendo insights sobre o início do cosmos.", "cultura": "O Papa Leão XIV realizou uma visita histórica à Argentina, marcada por cinco momentos emocionantes, segundo relatos da La Nación. A atriz Neusa Borges está internada no Rio de Janeiro com pneumonia, mas seu estado de saúde é estável, informa a Folha Ilustrada. A exposição participativa 'The Sacred Ordinary', em Birmingham, ilumina o patrimônio cultural do distrito de direitos civis, destacando a importância do local, conforme o Colossal. A Amazon MGM Studios prepara a revelação do novo James Bond, com Robert Pattinson cotado para o papel, em um anúncio crucial para a franquia, segundo relatos do The Atlantic.", "sociedade": "O parlamento aprovou um aumento no período de licença parental, oferecendo mais opções de apoio familiar. Um incêndio em uma indústria química em Salto deixou nove feridos, levando o prefeito a pedir cautela à população. Em São Paulo, um temporal afetou mais de 100 mil imóveis, causando interrupções de energia e alagamentos. Uma mulher de 76 anos morreu durante um voo devido à Doença de Chagas. Um policial militar da reserva e sua esposa foram mortos a tiros por um genro em um bar em Mato Grosso do Sul. Um garoto de 11 anos ficou preso na roda de um caminhão após cair de uma bicicleta, sofrendo escoriações leves e um traumatismo craniano leve. Um homem foi condenado pelo STJ após ser absolvido pelo TJGO por estuprar uma criança. Um cardiólogo alertou sobre a crescente incidência de infartos em pessoas jovens. Uma mulher marcou uma consulta médica para denunciar violência doméstica, resultando na prisão de seu parceiro. Dois funcionários da Kalunga foram feridos a tiros em frente à loja em Santos, em tentativa de homicídio. A ex-secretária de ministério defendeu a necessidade de maior integração entre os programas sociais. Uma operação policial foi realizada para combater um núcleo criminoso no Complexo do Vale que assusta a comunidade com o uso de armas de fogo. Um jovem foi preso no Distrito Federal suspeito de participar da execução de um adolescente. O banco de leite do Distrito Federal, referência em doação de leite materno, precisa de contribuições. Em nível internacional, um estudo revelou que mais de 60% das soldadas alemãs relatam ser vítimas de assédio ou abuso. A proporção de mulheres prefeitas no Brasil é baixa, com apenas 13% das prefeituras sendo comandadas por mulheres. Reações divididas foram registradas em relação ao acordo entre governo e camionistas, com críticas e apoios variados.", "meio_ambiente": "Na COP31, o Brasil apresenta um plano para tornar as cidades mais resilientes, baseado em iniciativas que visam o fim do desmatamento e a transição para energias renováveis. Paralelamente, a cidade de Nova Deli, na Índia, superou Lahore, no Paquistão, como a mais poluída do mundo, conforme relatório divulgado pela Al Jazeera. A bióloga Erika Berenguer expressa preocupação com os incêndios na Amazônia, reiterando a importância da continuidade dos esforços de preservação ambiental. Finalmente, a tempestade Charles causou alagamentos e cancelamentos de voos na Europa do Sul, mas não está diretamente relacionada ao tema do meio ambiente. Em desenvolvimento controverso, um programa de crédito climático com juros baixos está sendo usado para financiar a construção de prédios de luxo, o que não se enquadra no tema do meio ambiente.", "direitos_humanos": "A situação humanitária na Faixa de Gaza continua preocupante, com milhares de palestinos enfrentando condições precárias devido às chuvas e ao inverno. Segundo relatos, barracas estão sendo inundadas e há falta de roupas adequadas, agravando a crise humanitária. Além disso, a questão dos direitos humanos em relação à saúde e à segurança dos palestinos no Hospital Nasser em Gaza foi novamente levantada, com ataques israelenses frequentes há três anos. A presidente da Fepal, Fatima Ali, afirma que a Palestina é uma prisão a céu aberto onde Israel promove uma limpeza étnica. No Reino Unido, a cultura de silêncio em relação à violência sexual é revisitada, com a secretária de Cultura planejando reuniões com líderes de indústrias para melhorar a proteção de mulheres e informantes."}, "resumo_do_dia": {"politica_nacional": [{"id": 261849, "titulo": "Lula 4 terá que dialogar com oposição no Senado, diz líder do governo à CNN", "url": "https://www.cnnbrasil.com.br/politica/lula-4-tera-que-dialogar-com-oposicao-no-senado-diz-lider-do-governo-a-cnn/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-13T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PL (Partido Liberal) será responsável por mais de um terço do Senado a partir de 2027, o que aumenta a necessidade de diálogo entre a oposição e o governo. O governo está tomando medidas para avançar com suas pautas antes do próximo ano eleitoral de 2026.", "titulo_pt": "Lula 4 terá que dialogar com a oposição no Senado, diz líder do governo à CNN", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 261687, "titulo": "Chefe do Coaf defende nova lei de crimes financeiros e diz que órgão funciona bem sob o BC", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/chefe-do-coaf-defende-nova-na-lei-de-crimes-financeiros-e-diz-que-orgao-funciona-bem-sob-o-bc.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-13T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Coaf, Ricardo Saadi, defendeu a modernização da legislação sobre crimes contra o sistema financeiro nacional. Saadi afirmou que o órgão funciona bem sob o Banco Central.", "titulo_pt": "Chefe do Coaf defende modernização da legislação de crimes financeiros", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 261699, "titulo": "Ida de montadoras chinesas para UE é salvação para indústria, diz CEO de siderúrgica", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/ida-de-montadoras-chinesas-para-ue-e-salvacao-para-industria-diz-ceo-de-siderurgica.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O diretor-presidente da siderúrgica Voestalpine, Herbert Eibensteiner, afirmou que as montadoras chinesas que estão se expandindo pela Europa oferecerão uma tábua de salvação aos fabricantes afetados pelos cortes das produtoras locais.", "titulo_pt": "Idade de montadoras chinesas na Europa é salvação para indústria, diz CEO de siderúrgica", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 262228, "titulo": "Vorcaro pede ao STF revogação da prisão e critica parecer de Gonet", "url": "https://www.metropoles.com/colunas/manoela-alcantara/vorcaro-pede-ao-stf-revogacao-da-prisao-e-critica-parecer-de-gonet", "fonte_id": "metropoles", "data_pub": "2026-11-13T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A defesa de Vorcaro solicitou ao STF a revogação da prisão e criticou o parecer de Gonet, que incluiu fatos relacionados ao Master e ao BRB que não justificaram a prisão decretada em março.", "titulo_pt": "Vorcaro pede ao STF revogação da prisão e critica parecer de Gonet", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 261700, "titulo": "Ajuste fiscal não é incompatível com promessas do governo Lula 4, diz André Esteves", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/ajuste-fiscal-nao-e-incompativel-com-promessas-do-governo-lula-4-diz-andre-esteves.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "André Esteves, presidente do conselho e principal sócio do BTG Pactual, afirmou que o ajuste fiscal não contradiz as promessas de campanha do quarto mandato de Lula.", "titulo_pt": "Ajuste fiscal não contradiz promessas de campanha de Lula, diz banqueiro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 261774, "titulo": "Kassab diz que vê com ‘otimismo’ a possibilidade de haver 2º turno para o governo do RJ", "url": "https://veja.abril.com.br/brasil/kassab-diz-que-ve-com-otimismo-a-possibilidade-de-haver-2o-turno-para-o-governo-do-rj/", "fonte_id": "veja", "data_pub": "2026-11-13T17:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do PSD, Kassab, expressou otimismo sobre a possibilidade de haver um segundo turno para o governo do Rio de Janeiro. Ele também mencionou que viu com naturalidade a primeira rejeição a um pedido e espera um desfecho diferente no julgamento do mérito do caso.", "titulo_pt": "Kassab vê com otimismo a possibilidade de segundo turno para governo do RJ", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 262235, "titulo": "\"Se houver recurso irá ao plenário\", diz Gilmar Mendes sobre 2º turno no RJ", "url": "https://www.metropoles.com/sao-paulo/se-houver-recurso-ira-ao-plenario-diz-gilmar-mendes-sobre-2o-turno-no-rj", "fonte_id": "metropoles", "data_pub": "2026-11-13T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Gilmar Mendes, ministro do STF, comentou sobre as eleições no Rio de Janeiro durante o IDP Debates em São Paulo. Ele afirmou que, se houver um recurso, o caso irá ao plenário.", "titulo_pt": "Gilmar Mendes diz que recurso sobre 2º turno no RJ irá ao plenário", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 262236, "titulo": "“Encerrou no tempo certo”, diz Gilmar sobre fim do inquérito das Fake News", "url": "https://www.metropoles.com/sao-paulo/encerrou-no-tempo-certo-diz-gilmar-sobre-fim-do-inquerito-das-fake-news", "fonte_id": "metropoles", "data_pub": "2026-11-13T17:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes, do Supremo Tribunal Federal (STF), afirmou que o inquérito sobre fake news já estava previsto para ser encerrado no final deste ano. O processo havia tramitado na Corte por mais de sete anos.", "titulo_pt": "Encerrou no tempo certo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 261777, "titulo": "Raquel Lyra critica pacote fiscal: ‘Não pode ser tirando dinheiro dos estados’", "url": "https://veja.abril.com.br/brasil/raquel-lyra-critica-pacote-fiscal-nao-pode-ser-tirando-dinheiro-dos-estados/", "fonte_id": "veja", "data_pub": "2026-11-13T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora Raquel Lyra criticou o pacote fiscal, afirmando que não pode se dar apenas pela redução de receitas dos estados. Ela defendeu que a preocupação com os gastos é legítima, mas deve envolver todos os entes federativos.", "titulo_pt": "Raquel Lyra critica pacote fiscal: 'não pode ser tirando dinheiro dos estados'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 261703, "titulo": "Banco do Brasil tem 31 mil produtores rurais inadimplentes, diz CEO", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/banco-do-brasil-tem-31-mil-produtores-rurais-inadimplentes-diz-ceo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A presidente do Banco do Brasil, Tarciana Medeiros, informou que 31 mil produtores rurais estão inadimplentes com a instituição, representando 5,5% dos 566 mil clientes desse segmento com operações de crédito ativas.", "titulo_pt": "Banco do Brasil tem 31 mil produtores rurais inadimplentes, diz presidente", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 261866, "titulo": "Flávio Bolsonaro vota contra ajuste fiscal do governo Lula", "url": "https://www.cnnbrasil.com.br/politica/flavio-bolsonaro-vota-contra-ajuste-fiscal-do-governo-lula/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-13T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro votou contra o ajuste fiscal proposto pelo governo Lula, seguindo a orientação do PL (Partido Liberal). Ele criticou a gestão petista, acusando-a de focar excessivamente na assistência social.", "titulo_pt": "Flávio Bolsonaro vota contra ajuste fiscal do governo Lula", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 261688, "titulo": "Gilmar diz que trocas de delegados ocorrem todo dia e endossa fala de Lula para atacar Lava Jato", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/gilmar-diz-que-trocas-de-delegados-ocorrem-todo-dia-e-endossa-fala-de-lula-para-atacar-lava-jato.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-13T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes, do STF, afirmou que trocas de delegados são comuns e ocorrem todos os dias, em meio ao desgaste do diretor-geral da Polícia Federal, Andrei Rodrigues, após o afastamento de delegados do caso Master.", "titulo_pt": "Gilmar afirma que trocas de delegados são rotineiras e endossa críticas a Lava Jato", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 261843, "titulo": "Moretti: governo fará qualquer medida em acréscimo para ter cenário fiscal benigno", "url": "https://www.infomoney.com.br/politica/moretti-governo-fara-qualquer-medida-em-acrescimo-para-ter-cenario-fiscal-benigno/", "fonte_id": "infomoney", "data_pub": "2026-11-13T16:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Planejamento está articulando conversas na Câmara para viabilizar a votação do PLP do ajuste fiscal. O governo dispara que fará qualquer medida adicional para garantir um cenário fiscal benigno.", "titulo_pt": "Moretti: governo fará qualquer medida adicional para ter cenário fiscal benigno", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 261705, "titulo": "Moraes acompanha Dino e vota pelo fim da escala 6x1 em julgamento no STF; entenda a decisão", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/moraes-acompanha-dino-e-vota-pelo-fim-da-escala-6x1-em-julgamento-no-stf.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-13T16:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O julgamento no STF sobre a escala 6x1 teve dois votos a favor da implementação da mudança a partir de 16 de dezembro, conforme determina a emenda constitucional 141. Moraes e Dino votaram a favor da mudança.", "titulo_pt": "Moraes e Dino votam a favor do fim da escala 6x1 no STF; julgamento tem dois votos a favor", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 261689, "titulo": "Alvo da PF, ex-assessor de Mario Frias nega desvio de emendas e diz que irmão deixou projeto suspeito", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/alvo-da-pf-ex-assessor-de-mario-frias-nega-desvio-de-emendas-e-diz-que-irmao-deixou-projeto-suspeito.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-13T15:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Raphael Augusto Azevedo, ex-assessor de Mario Frias, negou qualquer envolvimento em desvios de emendas do parlamentar e afirmou ter orientado o irmão a deixar um projeto investigado após suspeitar de irregularidades. Raphael foi alvo de uma operação da Polícia Federal nesta sexta-feira (13).", "titulo_pt": "Alvo da PF, ex-assessor de Mario Frias nega desvio de emendas e diz que irmão deixou projeto suspeito", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 261690, "titulo": "Cotada para
