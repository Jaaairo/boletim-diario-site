migrantes a Ceuta, acusando-o de não proteger adequadamente as fronteiras. Além disso, o presidente dos Estados Unidos, Donald Trump, expressou publicamente, durante a Assembleia Geral da ONU, a ideia de potencialmente aniquilar o Irã, representando uma abordagem significativamente diferente da adotada pelos presidentes anteriores nos Estados Unidos em relação ao uso da força militar.\n\nA geopolítica global enfrenta diversos desafios e tensões, com destaque para os conflitos e negociações em vários países e regiões. O Irã propôs um acordo de paz para reabrir o Estreito de Hormuz em sete dias, como parte de esforços para aliviar tensões com os Estados Unidos, que negam planos de invadir a Europa, apesar das crescentes tensões. Em um contexto de guerra, a Etiópia voltou a entrar em conflito após quatro anos de paz, rompendo um acordo de 2022 que havia encerrado uma guerra que resultou em milhares de mortes. No Paquistão, ataques suicidas e insurgências continuam, com pelo menos 11 mortos em um ataque no noroeste do país. Além disso, a situação no Irã está afetando a economia do Irak, aumentando os custos de importações e enfraquecendo a moeda local. Em um cenário de cooperação limitada, China e Estados Unidos concordaram em melhorar a cooperação em inteligência artificial, tarifas e controle de precursoros químicos após a visita do presidente chinês Xi Jinping aos EUA. A Rússia está usando uma campanha de recrutamento dirigida a belarussos como uma ferramenta crucial para aumentar o número de soldados no campo de batalha na Ucrânia, explorando as dificuldades econômicas e o isolamento do país.", "economia": "O governo brasileiro instituiu uma subvenção de R$ 2,20 por litro de diesel para combater as pressões sobre os preços internacionais do petróleo. Paralelamente, os EUA e a China chegaram a um acordo para reduzir tarifas em bens não sensíveis, no valor de 30 bilhões de dólares, como parte de um pacote de comércio acordado durante a reunião entre os presidentes Trump e Xi Jinping. A The Economist destaca problemas institucionais e impasses políticos no Brasil, apesar de seu alto potencial econômico, o país não realiza ações eficazes. O presidente Luiz Inácio Lula da Silva se reuniu com empresários em São Paulo, atraindo mais de 500 pessoas, representantes de diversos setores da economia, buscando maior compromisso com questões fiscais. Além disso, a pobreza na Argentina aumentou, atingindo 32,3% da população, um aumento de 4,1 pontos percentuais em relação ao semestre anterior, representando 9,7 milhões de pessoas em 31 aglomerados urbanos do país.", "tecnologia": "Os Estados Unidos e China concordaram em estabelecer um diálogo sobre inteligência artificial (IA) para ajudar a prevenir incidentes graves, após a cúpula entre o presidente Trump e o líder chinês Xi Jinping. Esta decisão visa promover a cooperação em um campo cada vez mais competitivo. Paralelamente, a Bayer está investindo em soluções baseadas em IA para a agricultura, planejando pelo menos 20 lançamentos no Brasil até 2030. Além disso, a IA está sendo utilizada de forma ética e responsável para fortalecer o poder público, mas também apresenta ameaças eleitorais. Em outro desenvolvimento, a OpenAI admitiu que seus recursos de IA publicaram imagens de usuários em sites online sem o conhecimento da empresa, levantando questões sobre a responsabilidade e dever de alerta no setor de IA. Ainda na área de tecnologia, a Starlink, serviço de internet via satélite da empresa de Elon Musk, está sendo utilizada pela Justiça Eleitoral para enviar dados das urnas em locais remotos, garantindo a transmissão dos resultados das eleições em 13 estados brasileiros.", "ciencia": "O evento mais importante desta semana na ciência foi o 14º voo de teste da Starship, um foguete desenvolvido pela SpaceX. Este voo, realizado na segunda-feira (22), demonstrou avanços significativos na exploração espacial. Paralelamente, um estudo importante da Ben-Gurion University of the Negev identificou um mecanismo molecular que determina se células humanas sob estresse ativam um mecanismo de sobrevivência ou desencadeiam a morte programada celular. Este descobrimento pode auxiliar no combate à resistência a quimioterapia em tumores agressivos. Outros assuntos relevantes incluem a publicação de um estudo que indica que livros didáticos digitais aumentam significativamente a motivação intrínseca dos alunos, bem como a descoberta de uma 'falha' por trás da fraqueza muscular com a idade, que pode levar ao desenvolvimento de tratamentos futuros.", "cultura": "O Papa Leão XIV celebrou uma missa ao ar livre no Place de la Concorde, em Paris, diante de uma multidão estimada em cerca de 600 mil fiéis ansiosos. Este evento reforça o poder simbólico e a influência do líder religioso, especialmente em um contexto diversificado de convicções. Em outro contexto, Fernando Lemos exibe obras de arte que retratam um mundo sombrio e ameaçador, utilizando técnicas surrealistas para explorar temas como ditaduras em Portugal e no Brasil. A 10ª edição do Breakfast Weekend acontece em São Paulo, oferecendo menus de café da manhã em diversos estabelecimentos com preços acessíveis, com a temática de celebrar o início do dia com variedades culinárias. Ainda no cenário cultural, o The New York Times divulgou a lista das 100 melhores séries do século 21, incluindo desde comédias até dramas, destacando a diversidade e a qualidade das produções televisivas modernas.", "sociedade": "Um recente caso triste em Mogi Guaçu emocionou a sociedade brasileira, com a morte de mãe e filha, Maria Elisabete e Cibele, que lutavam contra diferentes tipos de câncer em um curto intervalo de tempo. O incidente ocorreu em intervalos de 10 horas, levando a uma profunda reflexão sobre a luta contra a doença. Em outro episódio, MC Paiva se defende em uma ação judicial após ser processado por transfobia pela influenciadora digital Malévola, que pediu uma indenização de R$ 60 mil. O caso está sendo tratado na justiça. Em Ceilândia, uma mulher foi ferida a tiros durante uma briga generalizada, com o autor dos disparos ainda não localizado. A 27ª DP investiga o caso como disparo de arma de fogo e tentativa de homicídio. Outras notícias abordam a importância do microcrédito para mulheres na economia brasileira, a nova lei em Connecticut que altera os procedimentos de arrestos migratórios, o metrô de São Paulo e suas ações em casos de parada cardíaca, e a abertura de inscrições para bolsas de intercâmbio no exterior pelo Centro Paula Souza. Finalmente, uma pesquisa revelou que a percepção de uma emergência laboral no Chile aumentou 10 pontos percentuais em dois meses, chegando a 87%, com a população atribuindo a crise ao governo atual, especificamente ao presidente Gabriel Boric e aos ministros.", "meio_ambiente": "Mais de 260 manifestações estão programadas para todo o país no sábado, em resposta a um verão recordista, pedindo um plano de ação climática de emergência. Essas manifestações, inicialmente organizadas por ativistas ambientais, agora contam com o apoio de organizações sem fins lucrativos, sindicatos e partidos políticos. Em São Paulo, a Green Mining, uma iniciativa que já pagou R$ 6,8 milhões a mais de 6 mil trabalhadores da cadeia do lixo, incentivou a população a reciclar perto de casa, oferecendo estações que pagam por recicláveis. Além disso, prédios de alto padrão estão incluindo pequenas florestas no projeto arquitetônico para reduzir o calor, absorver a água das chuvas e tornar as cidades mais agradáveis para se viver. Eventos climáticos extremos, como o Super El Niño, aumentam o risco de encontros com serpentes em áreas urbanas e rurais devido às mudanças no habitat dos animais, contribuindo para a situação de calor intensificado. É necessário tomar cuidados além de beber água para proteger a saúde durante as ondas de calor, especialmente em períodos de El Niño, sugerem especialistas.", "direitos_humanos": "O Papa Francisco visitou o centro de refugiados Maison Bakhita em Paris, durante sua segunda visita oficial à cidade, destacando o papel das mulheres na sociedade e alertando contra a cultura que isola as pessoas. Em Hong Kong, uma mulher de 44 anos foi presa sob suspeita de abuso infantil após uma gravação de câmera dash mostrar que ela empurrava um menino contra um muro de rua. Em Paris, o Papa também visitou o centro de refugiados Maison Bakhita, enfatizando a importância do papel das mulheres na sociedade e alertando contra a cultura que isola as pessoas. A violência e a desconfiança em relação aos centros de tratamento do Ebola no Congo dificultam o combate à doença, levando pacientes a buscar tratamento apenas quando a doença já está em estágio grave. O editorial do Taipei Times destaca a importância da tutela de adultos como um assunto urgente que merece atenção."}, "resumo_do_dia": {"politica_nacional": [{"id": 181558, "titulo": "Entenda medida provisória e projeto que proíbem bets no Brasil", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/entenda-medida-provisoria-e-projeto-que-proibem-bets-no-brasil", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-26T12:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva assinou uma medida provisória que proíbe a exploração, oferta, intermediação e publicidade de apostas esportivas e jogos online no Brasil. Esta decisão abrange both ambientes físicos e virtuais e revoga as autorizações concedidas por estados e pelo Distrito Federal, sem afetar outras modalidades de loteria legais.", "titulo_pt": "Entenda medida provisória que proíbe bets no Brasil", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 181669, "titulo": "Governo notifica apostadores sobre MP do fim das bets e prazo para saque", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/governo-notifica-apostadores-sobre-mp-do-fim-das-bets-e-prazo-para-saque/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-26T12:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo notificou apostadores sobre a Medida Provisória (MP) que encerra as operações de apostas internacionais e estabelece um prazo para saque dos valores. A MP faz parte de um pacote de medidas anunciado por Lula nove dias antes das eleições com o objetivo de atrair votos e reduzir o endividamento das famílias.", "titulo_pt": "Governo notifica apostadores sobre MP do fim das bets e prazo para saque", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 181729, "titulo": "PF investiga grupo por pressionar servidores em troca de apoio eleitoral", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pf-investiga-grupo-por-pressionar-servidores-em-troca-de-apoio-eleitoral", "fonte_id": "metropoles", "data_pub": "2026-09-26T12:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal investiga um grupo suspeito de pressionar servidores em troca de apoio eleitoral. Durante a operação, foram realizadas buscas em Boa Vista e Rorainópolis, no estado de Roraima.", "titulo_pt": "PF investiga grupo por pressionar servidores em troca de apoio eleitoral", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 181572, "titulo": "Veja quem são os candidatos a governador de Mato Grosso do Sul", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/veja-quem-sao-os-candidatos-governador-de-mato-grosso-do-sul", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-26T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Oito candidatos disputam o cargo de governador em Mato Grosso do Sul nas eleições de 2026. No estado, 2.024.884 eleitores estão aptos a votar, sendo maioria feminina (53%).", "titulo_pt": "Conheça os candidatos a governador de Mato Grosso do Sul nas eleições de 2026", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 181875, "titulo": "Onda de mensagens católicas nas redes preocupa campanha de Flávio e alimenta debate religioso", "url": "https://www.jota.info/eleicoes/eleicoes-2026/onda-de-mensagens-catolicas-nas-redes-preocupa-campanha-de-flavio-e-alimenta-debate-religioso", "fonte_id": "jota", "data_pub": "2026-09-26T11:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Há uma onda de mensagens católicas nas redes sociais que preocupa a campanha de Flávio Bolsonaro (PL). A Conferência Nacional dos Bispos do Brasil (CNBB) nega um alinhamento oficial com o presidente Jair Bolsonaro (PL).", "titulo_pt": "Onda de mensagens católicas nas redes preocupa campanha de Flávio e alimenta debate religioso", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 181573, "titulo": "Saiba quem são os candidatos ao governo de Mato Grosso", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/saiba-quem-sao-os-candidatos-ao-governo-de-mato-grosso", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-26T11:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Seis candidatos concorrem ao governo de Mato Grosso nas eleições de 2026. O estado possui 2.638.230 eleitores aptos a votar, sendo maioria composta por pessoas pardas (59,85%).", "titulo_pt": "Saiba quem são os candidatos ao governo de Mato Grosso", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 181574, "titulo": "Quase 1 milhão de brasileiros no exterior poderão votar nas eleições", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/quase-1-milhao-de-brasileiros-no-exterior-poderao-votar-nas-eleicoes", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-26T11:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quase 1 milhão de brasileiros com domicílio eleitoral no exterior estão aptos a votar nas eleições de 2026. São 918.876 eleitores em 134 países, votando apenas para presidente e vice-presidente da República.", "titulo_pt": "Quase 1 milhão de brasileiros no exterior poderão votar nas eleições", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 181575, "titulo": "Conheça os candidatos ao governo de Goiás nas eleições deste ano", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/conheca-os-candidatos-ao-governo-de-goias-nas-eleicoes-deste-ano", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-26T11:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Seis candidatos disputam o governo de Goiás nas eleições de 2026. O estado possui 5.080.755 eleitores aptos a votar, sendo 53% mulheres e 47% homens. Os dados sobre a distribuição racial/etnica dos eleitores também foram fornecidos.", "titulo_pt": "Conheça os candidatos ao governo de Goiás nas eleições deste ano", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 181500, "titulo": "Antes da proibição das bets, o que os candidatos à Presidência defendiam para as apostas on-line", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/09/26/propostas-candidatos-presidencia-bets-apostas.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-26T11:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal proibiu todas as bets no Brasil. Antes da medida, o plano de governo do presidente Luiz Inácio Lula da Silva (PT) não previa a proibição das apostas on-line, mas sim a manutenção de mecanismos de controle e ampliação do atendimento para pessoas com problemas relacionados aos jogos.", "titulo_pt": "Antes da proibição das bets, os candidatos à Presidência defendiam o que propunham para as apostas on-line", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 181576, "titulo": "Eleições 2026: saiba quem são os candidatos ao governo do DF", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/eleicoes-2026-saiba-quem-sao-os-candidatos-ao-governo-do-df", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-26T11:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dez candidatos concorrem ao governo do Distrito Federal nas eleições de 2026. O primeiro turno está previsto para o dia 4 de outubro, com eventual segundo turno em 25 de outubro.", "titulo_pt": "Eleições 2026: saiba quem são os candidatos ao governo do DF", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 181578, "titulo": "Flávio fala sobre volta do pai em evento: 'Quem quer ver o Bolsonaro aqui no ano que vem dá um grito'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/flavio-fala-sobre-volta-do-pai-em-evento-quem-quer-ver-o-bolsonaro-aqui-no-ano-que-vem-da-um-grito.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-26T11:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato à Presidência do PL, participou do Jaguariúna Rodeo Festival em Jaguariúna, São Paulo, acompanhado do governador Tarcísio de Freitas. Durante o evento, Flávio mencionou a possibilidade de seu pai, Jair Bolsonaro, retornar à campanha no ano seguinte, se houver interesse dos eleitores.", "titulo_pt": "Flávio fala sobre possível volta do pai em evento: 'quem quer ver o Bolsonaro aqui no ano que vem dá um grito'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 181876, "titulo": "Carf mantém decisão que afasta equiparação de FII a pessoa jurídica", "url": "https://www.jota.info/tributos/carf-mantem-decisao-que-afasta-equiparacao-de-fii-a-pessoa-juridica", "fonte_id": "jota", "data_pub": "2026-09-26T09:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A decisão do CARF (Conselho Administrativo de Recursos Fiscais) manteve a equiparação de fundos de investimento imobiliário (FII) a pessoa jurídica para fins de cobrança de IRPJ e CSLL, apesar da isenção tributária de rendimentos desses fundos.", "titulo_pt": "Carf mantém decisão que equipara FII a pessoa jurídica para fins fiscais", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 181579, "titulo": "MPF e Promotoria de 7 estados descumprem regra de transparência sobre salários", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/mpf-e-promotoria-de-7-estados-descumprem-regra-de-transparencia-sobre-salarios.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público Federal (MPF) e as Promotorias de sete estados não estavam cumprindo uma norma que exige transparência sobre os salários da categoria até a última quinta-feira (24).", "titulo_pt": "MPF e promotorias de 7 estados descumprem regra de transparência sobre salários", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 181501, "titulo": "Candidatura de Hélio Lopes em Roraima: por que partidos buscam ampliar bancadas no Senado com nomes fora de redutos eleitorais", "url": "https://g1.globo.com/rr/roraima/eleicoes/2026/noticia/2026/09/26/candidatura-de-helio-lopes-em-roraima-por-que-partidos-buscam-ampliar-bancadas-no-senado-com-nomes-fora-de-redutos-eleitorais.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-26T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Partidos políticos apostam em candidaturas de nomes de fora dos seus redutos eleitorais para o Senado em 2026. Hélio Lopes, do PL, é um exemplo, tendo deixado o Rio de Janeiro para concorrer em Roraima.", "titulo_pt": "Candidatura de Hélio Lopes em Roraima: partidos buscam ampliar bancadas no Senado com nomes fora de redutos eleitorais", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 181580, "titulo": "Limites ao foro especial e a decisões monocráticas são respostas à crise do STF, dizem especialistas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/limites-ao-foro-especial-e-a-decisoes-monocraticas-sao-respostas-a-crise-do-stf-dizem-especialistas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-26T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A crise atual no STF levantou questões sobre os limites do foro especial e das decisões monocráticas, problemas que já eram conhecidos por estudiosos da corte há anos.", "titulo_pt": "Limites ao foro especial e decisões monocráticas são respostas à crise do STF, afirmam especialistas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 181581, "titulo": "'Nova direita nasceu porque ninguém mais aguentava Caetano Veloso', diz cineasta Josias Teófilo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/nova-direita-nasceu-porque-ninguem-mais-aguentava-caetano-veloso-diz-cineasta-josias-teofilo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-26T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cineasta conservador Josias Teófilo afirma que a nova direita surgiu como uma reação contra o suposto domínio da esquerda na cultura, citando Caetano Veloso como exemplo. Teófilo dirigiu documentários sobre Olavo de Carvalho e o bolsonarismo.", "titulo_pt": "Nova direita nasceu por não aguentar mais Caetano Veloso, diz cineasta", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 182026, "titulo": "Leo XIV will be meeting French sexual abuse survivors during his visit in France", "url": "https://www.france24.com/en/leo-xiv-will-be-meeting-french-sexual-abuse-survivors-during-his-visit-in-france", "fonte_id": "france24", "data_pub": "2026-09-26T12:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Papa Francisco fará a primeira visita oficial do Vaticano à França em 18 anos, durante a qual planeja se encontrar com sobreviventes de abuso sexual.", "titulo_pt": "Papa francisco visitará sobreviventes de abuso sexual na França", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 181549, "titulo": "Milhares protestam na Espanha contra a gestão da crise em Ceuta pelo governo", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/milhares-protestam-na-espanha-contra-a-gestao-da-crise-em-ceuta-pelo-governo.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-26T12:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas protestaram em Madri contra a gestão do governo espanhol em relação à chegada de migrantes a Ceuta, acusando-o de não proteger adequadamente as fronteiras e exigindo eleições gerais antecipadas.", "titulo_pt": "Milhares protestam em madri contra gestão do governo em Ceuta", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 182124, "titulo": "Trump, 'fake news non accedano alla Casa Bianca, è luogo sacro'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/26/trump-fake-news-non-accedano-alla-casa-bianca-e-luogo-sacro_591c3aee-c673-4320-90e1-39e5bb42f00d.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-26T12:37:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump critica as notícias falsas, afirmando que elas não devem ter acesso à Casa Branca, que é um lugar sagrado. Ele também critica a situação atual, dizendo que ela já dura muito tempo e tem um custo enorme para os Estados Unidos.", "titulo_pt": "Trump critica 'fake news' e afirma que Casa branca é lugar sagrado", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 182122, "titulo": "Manchester City verdict poses fresh test to UK-UAE relations", "url": "https://www.ft.com/content/36fd2644-9d0e-40b5-8a7a-ef33f302e652?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-26T12:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A decisão sobre o Manchester City representa um novo desafio para as relações entre o Reino Unido e os Emirados Árabes Unidos. Sucessivas governos britânicos tentaram fortalecer as relações diplomáticas com Abu Dhabi com o objetivo de atraír investimentos.", "titulo_pt": "Decisão sobre manchester City representa novo desafio para relações entre reino unido e emirados árabes unidos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 182028, "titulo": "Middle East: Palestinians plan first local elections in 20 years", "url": "https://www.france24.com/en/middle-east-palestinians-plan-first-local-elections-in-20-years", "fonte_id": "france24", "data_pub": "2026-09-26T12:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Palestinos planejam realizar suas primeiras eleições locais em 20 anos. Oliver McTernan, diretor e co-fundador da Forward Thinking em Londres, é o convidado.", "titulo_pt": "Oriente médio: palestinos planejam primeiras eleições locais em 20 anos", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 182056, "titulo": "At least 11 dead following suicide bomb attack in northwestern Pakistan", "url": "https://www.euronews.com/2026/09/26/at-least-11-dead-following-suicide-bomb-attack-in-northwestern-pakistan", "fonte_id": "euronews", "data_pub": "2026-09-26T12:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 11 pessoas morreram em um ataque suicida bomba no noroeste do Paquistão. O grupo Tehreek-e-Taliban Pakistan (TTP), também conhecido como Taliban paquistanês, assumiu a responsabilidade pelo ataque.", "titulo_pt": "Pelo menos 11 mortos em ataque suicida bomba no noroeste do paquistão", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 181888, "titulo": "A Tetris-Like Maze Blocks Protests in Pakistan’s Capital", "url": "https://www.nytimes.com/2026/09/26/world/asia/pakistan-protest-islamabad-containers.html", "fonte_id": "nyt_world", "data_pub": "2026-09-26T12:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades paquistanesas bloquearam Islamabad com mais de 1.500 contêineres marítimos para impedir os protestos da oposição, limitando o acesso à capital.", "titulo_pt": "Um labirinto de contêineres bloqueia protestos na Capital do paquistão", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 182125, "titulo": "Omicidio Torino: madre presunto assassino, 'piangeva, era sconvolto'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/26/omicidio-torino-madre-presunto-assassino-piangeva-era-sconvolto_15082269-143a-4285-9dcf-5e1efd988d9d.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-26T12:12:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A mãe do suspeito foi descrita como chorando e estar muito perturbada. Ela falava coisas confusas e não compreendia o que tinha feito.", "titulo_pt": "Homicídio em Torino: mãe do suspeito chorando e perturbada", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 182126, "titulo": "Attentato contro posto di polizia in Pakistan, 11 morti", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/26/attentato-contro-posto-di-polizia-in-pakistan-11-morti_13f149b3-f3b8-457c-8fd7-d9ca6109c894.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-26T12:07:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Um ataque ocorreu em um posto de polícia no Paquistão, resultando em 11 mortes, entre elas oito homens, duas mulheres e um criança.", "titulo_pt": "Ataque a posto de polícia no paquistão causa 11 mortes", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 181962, "titulo": "OPINION: Trump's U.N. speech, a stark contrast with past presidents", "url": "https://www.npr.org/2026/09/26/nx-s1-5974096/essay-09-26-26", "fonte_id": "npr_news", "data_pub": "2026-09-26T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Presidente Donald Trump expressou publicamente, durante a ONU, a ideia de potencialmente aniquilar a Irã, representando uma abordagem significativamente diferente da adotada pelos presidentes anteriores nos Estados Unidos em relação ao uso da força militar.", "titulo_pt": "Opinião: discurso de trump na ONU, uma contraste evidente com os antecessores", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 182064, "titulo": "Propaganda in Russian schools prepares students to die for their country", "url": "https://www.dw.com/en/propaganda-in-russian-schools-prepares-students-to-die-for-their-country/a-79417294?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-26T11:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo russo busca ensinar patriotismo aos alunos desde cedo. A DW conversou com estudantes na Sibéria sobre suas opiniões em relação à propaganda, à guerra na Ucrânia e ao seu futuro.", "titulo_pt": "Propaganda nas escolas russas prepara estudantes para morrerem pelo país", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 182065, "titulo": "Paris: Pope Leo XIV to celebrate Mass before huge crowd", "url": "https://www.dw.com/en/paris-pope-leo-xiv-to-celebrate-mass-before-huge-crowd/a-79442864?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-26T11:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Papa Leo XIV está realizando uma visita de quatro dias à França e deve celebrar uma missa que deve atraír aproximadamente 600 mil pessoas no Place de la Concorde, perto dos Champs-Élysées.", "titulo_pt": "Paris: papa Leo XIV realizará missa para multidão", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 182217, "titulo": "(LEAD) S. Korean military, U.N. Command conduct joint survey on DMZ blast site ahead of probe: JCS", "url": "https://en.yna.co.kr/view/AEN20260926004551315", "fonte_id": "yonhap_news", "data_pub": "2026-09-26T11:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A força armada sul-coreana e a Comando Conjunto das Nações Unidas realizaram uma inspeção conjunta no local da explosão na Zona de Desarmamento antes de iniciar uma investigação. A inspeção ocorreu no dia 26 de setembro.", "titulo_pt": "(LEAD) exercito sul-coreano e comando conjunto das nações unidas realizam inspeção conjunta no local de explosão na zona de desarmamento antes de investigação", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 182082, "titulo": "Pressure to boycott Israel game grows as Ireland preparations stall", "url": "https://www.aljazeera.com/sports/2026/9/26/pressure-to-boycott-israel-game-grows-as-ireland-preparations-stall?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-26T11:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Irlanda está programada para jogar contra Israel em uma partida da Nations League emHungria no domingo, mas a pressão para boicotear o jogo aumenta, tanto dentro quanto fora de campo.", "titulo_pt": "Pressão para boicote do jogo contra Israel cresce enquanto preparações irlandesas ficam em standstill", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 181550, "titulo": "Papa Leão 14 se encontra com imigrantes antes de grande missa na Champs-Élysées, em Paris", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/papa-leao-14-se-encontra-com-imigrantes-antes-de-grande-missa-na-champs-elysees-em-paris.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-26T11:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O papa Leão 14 se reuniu com imigrantes em Paris, pedindo convivência com dignidade e paz, horas antes de uma missa para 600 mil pessoas na Champs-Élysées, como parte de sua primeira visita à França.", "titulo_pt": "Papa Leão 14 se reúne com imigrantes antes de missa na Champs-Élysées, em Paris", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 182029, "titulo": "Pope Leo set for largest event of France tour as Paris crowds swell", "url": "https://www.france24.com/en/pope-leo-set-for-largest-event-of-france-tour-as-paris-crowds-swell", "fonte_id": "france24", "data_pub": "2026-09-26T11:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Papa Léo está prestes a participar do maior evento de sua visita à França, enquanto as multidões em Paris aumentam. Philip Turle está transmitindo de Paris.", "titulo_pt": "Papa léo para maior evento da visita à França com multidões em Paris crescendo", "veiculo": "France 24", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 181726, "titulo": "Governo regulamenta subvenção de R$ 2,20 por litro de diesel", "url": "https://www.metropoles.com/brasil/governo-regulamenta-subvencao-de-r-220-por-litro-de-diesel", "fonte_id": "metropoles", "data_pub": "2026-09-26T12:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo publicou no Diário Oficial da União a regulamentação de uma subvenção de R$ 2,20 por litro de diesel. A medida foi tomada diante de fortes pressões sobre os preços internacionais do petróleo.", "titulo_pt": "Governo regulamenta subvenção de R$ 2,20 por litro de diesel", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 182010, "titulo": "U.S., China reach $30 billion tariff deal after Trump-Xi summit", "url": "https://www.axios.com/2026/09/26/us-china-tariffs-trade-30-billion", "fonte_id": "axios", "data_pub": "2026-09-26T11:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os EUA e a China chegaram a um acordo para reduzir tarifas em bens não sensíveis no valor de 30 bilhões de dólares como parte de um pacote de comércio acordado durante o encontro entre os presidentes Trump e Xi Jinping. Tal acordo marcaria uma trégua na guerra comercial que envolveu os dois países no ano anterior.", "titulo_pt": "EUA e China chegam a acordo de $30 bilhões para reduzir tarifas após encontro entre trump e xi", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 181526, "titulo": "Executivos de bets vão da perplexidade à revolta após MP que as coloca na ilegalidade", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/executivos-de-bets-vao-da-perplexidade-a-revolta-apos-mp-que-as-coloca-na-ilegalidade.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-26T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Executivos de empresas de apostas expressaram indignação e desolação após a assinatura da medida provisória que as coloca na ilegalidade. O governo havia concedido 85 outorgas em dois anos, cada uma valendo R$ 30 milhões e válida por cinco anos.", "titulo_pt": "Executivos de bets vão da indignação à desolação após MP que as coloca na ilegalidade", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 181680, "titulo": "Bracell aposta em eficiência logística e redução de emissões", "url": "https://www.cnnbrasil.com.br/agro/bracell-aposta-em-eficiencia-logistica-e-reducao-de-emissoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-26T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Bracell está investindo na eletrificação e no uso de biometano para o transporte de eucalipto. A empresa destaca a logística florestal e a redução de emissões como prioridades.", "titulo_pt": "Bracell aposta em eficiência logística e redução de emissões", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 181917, "titulo": "Cobre, “el salvavidas” de Jorge Quiroz que le da un mayor espacio fiscal para el Presupuesto 2027", "url": "https://www.latercera.com/pulso/noticia/cobre-el-salvavidas-de-jorge-quiroz-que-le-da-un-mayor-espacio-fiscal-para-el-presupuesto-2027/", "fonte_id": "la_tercera", "data_pub": "2026-09-26T10:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O próximo dia 30 de setembro é a data limite para o governo apresentar o projeto de lei do Orçamento de 2027. O ministro da Economia recebeu uma maior margem de manobra devido ao aumento do preço do cobre, que subiu de US$4,38 para US$5,37 a libra, gerando recursos adicional de aproximadamente US$2 bilhões.", "titulo_pt": "Cobre, ‘o salvador’ de Jorge Quiroz que dá maior espaço fiscal para o orçamento 2027", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 181961, "titulo": "Blame Trump for Rising Borrowing Costs", "url": "https://www.theatlantic.com/ideas/2026/09/trump-national-debt-interest-rates/688783/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-26T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O aumento dos custos de empréstimos é atribuído a Trump. Os credores não confiam mais nos Estados Unidos.", "titulo_pt": "É culpa de Trump o aumento dos custos de empréstimos", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 181698, "titulo": "Por que as marcas de moda estão olhando para a gastronomia", "url": "https://exame.com/casual/por-que-as-marcas-de-moda-estao-olhando-para-a-gastronomia/", "fonte_id": "exame", "data_pub": "2026-09-26T09:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As marcas de moda estão estabelecendo parcerias com estabelecimentos gastronômicos, após já terem feito colaborações com hotéis e restaurantes. Esses endereços se tornam locais de encontro populares.", "titulo_pt": "Por que as marcas de moda estão olhando para a gastronomia", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 182121, "titulo": "Monzo in talks with Brazil’s Nubank about sale", "url": "https://www.ft.com/content/e375ba2b-8033-426a-aa63-0f22dd06e689?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-26T09:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Monzo, uma fintech britânica, está em negociações com a Nubank, uma fintech brasileira, sobre a venda de sua empresa. A Monzo também está em discussões com investidores de private equity para vender uma participação significativa na empresa.", "titulo_pt": "Monzo em negociações com Nubank sobre venda", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 181701, "titulo": "Vender mais não bastou: 49% das empresas com receita em alta perderam margem em 2026", "url": "https://exame.com/exame-in/mais-receita-menos-margem-o-paradoxo-do-crescimento-das-empresas-brasileiras/", "fonte_id": "exame", "data_pub": "2026-09-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Strategy& com 366 empresas abertas mostrou que 49% das companhias que aumentaram suas receitas no primeiro semestre de 2026 também perderam margem operacional.", "titulo_pt": "Vender mais não foi suficiente: 49% das empresas com receita em alta perderam margem em 2026", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 181878, "titulo": "Agências reguladoras e os regulamentos do Poder Executivo", "url": "https://www.jota.info/opiniao-e-analise/artigos/agencias-reguladoras-e-os-regulamentos-do-poder-executivo", "fonte_id": "jota", "data_pub": "2026-09-26T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A decisão do STF na ADI 1668 estabeleceu limites para a autonomia normativa das agências reguladoras, influenciando os regulamentos do Poder Executivo. O título traduzido para português brasileiro é: 'Agências reguladoras e os limites da autonomia normativa dos regulamentos do Poder Executivo.'", "titulo_pt": "Agências reguladoras e os limites da autonomia normativa dos regulamentos do Poder Executivo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 181689, "titulo": "Apostas não são a principal causa de endividamento, dizem especialistas", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/apostas-nao-sao-a-principal-causa-de-endividamento-dizem-especialistas/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-26T08:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas em Mercados Regulados afirmam que o endividamento no Brasil é um problema estrutural que precede a popularização das apostas esportivas no país.", "titulo_pt": "Apostas não são a principal causa de endividamento, dizem especialistas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 181705, "titulo": "Brasil está preso entre potencial econômico e impasse político, diz The Economist", "url": "https://exame.com/brasil/brasil-esta-preso-entre-potencial-economico-e-impasse-politico-diz-the-economist/", "fonte_id": "exame", "data_pub": "2026-09-26T08:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A The Economist destaca problemas institucionais e impasses políticos no Brasil, descrevendo-o como um país com alto potencial econômico, mas que não realiza ações eficazes.", "titulo_pt": "Brasil enfrenta impasses políticos enquanto possui alto potencial econômico, segundo The Economist", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 181709, "titulo": "Como este padre tirou uma universidade do vermelho e a levou para o clube do bilhão", "url": "https://exame.com/negocios/como-este-padre-tirou-uma-universidade-do-vermelho-e-a-levou-para-o-clube-do-bilhao/", "fonte_id": "exame", "data_pub": "2026-09-26T08:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após anos de desequilíbrio financeiro, a PUC-Rio implementou um plano de gestão que incluiu a ampliação das receitas de pesquisa e a fortificação da governança, resultando em um superávit dobrado para R$ 80,9 milhões em 2025.", "titulo_pt": "Como este padre transformou a puc-rio em uma universidade bilionária", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 181713, "titulo": "A Lei de Responsabilidade Fiscal envelheceu — e o Rio de Janeiro pode mostrar o que vem depois", "url": "https://exame.com/exame-in/a-necessaria-modernizacao-da-lei-de-responsabilidade-fiscal-e-o-estado-do-rio-de-janeiro/", "fonte_id": "exame", "data_pub": "2026-09-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Lei de Responsabilidade Fiscal, que era moderna em 2000, precisa de reforma. O Estado do Rio de Janeiro pode ser o primeiro a testar uma nova abordagem.", "titulo_pt": "A Lei de Responsabilidade Fiscal envelheceu — e o Rio de Janeiro pode mostrar o que vem depois", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 181881, "titulo": "Ata de registro de preços não é ‘barriga de aluguel’", "url": "https://www.jota.info/opiniao-e-analise/artigos/ata-de-registro-de-precos-nao-e-barriga-de-aluguel", "fonte_id": "jota", "data_pub": "2026-09-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A nova norma do Tribunal de Contas de São Paulo visa evitar distorções no processo. Ata de registro de preços não é considerada 'barriga de aluguel'.", "titulo_pt": "Ata de registro de preços não é 'barriga de aluguel'", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 182137, "titulo": "Junglia theme park in Okinawa logs ¥17 billion loss in first year", "url": "https://www.japantimes.co.jp/business/2026/09/26/junglia-okinawa-first-year-loss/", "fonte_id": "japan_times", "data_pub": "2026-09-26T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O parque temático da Junglia, inaugurado em julho no Okinawa, registrou uma perda de 17 bilhões de ienes no primeiro ano de operação. O parque abriu com expectativas de aumentar a permanência dos turistas e impulsionar a economia local, mas não atingiu esses objetivos.", "titulo_pt": "Parque temático da junglia no Okinawa registra perda de 17 bilhões de ienes no primeiro ano", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 182244, "titulo": "Old-School Credit Card Scams Are Far From Dead", "url": "https://www.wired.com/story/kernel-panic-old-timey-credit-card-scams/", "fonte_id": "wired", "data_pub": "2026-09-26T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma era dominada por fraudes cada vez mais sofisticadas, baseadas em IA, uma ameaça antiga pode estar esperando no seu caixa postal.", "titulo_pt": "Fraudes antigas não estão mortas", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 182009, "titulo": "U.S. and China agree to \"super intelligence\" dialogue amid AI tensions", "url": "https://www.axios.com/2026/09/26/us-china-ai-si-deal", "fonte_id": "axios", "data_pub": "2026-09-26T11:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos e China concordaram em estabelecer um diálogo sobre inteligência artificial, com um canal de comunicação para ajudar a desarmar incidentes graves. O pacto foi anunciado após a cúpula entre o presidente Trump e o líder chinês Xi Jinping.", "titulo_pt": "EUA e China concordam em diálogo sobre inteligência artificial", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 181656, "titulo": "A corrida da Bayer para levar inteligência artificial do laboratório ao campo", "url": "https://veja.abril.com.br/economia/a-corrida-da-bayer-para-levar-inteligencia-artificial-do-laboratorio-ao-campo/", "fonte_id": "veja", "data_pub": "2026-09-26T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Bayer está planejando pelo menos 20 lançamentos no Brasil até 2030, utilizando uma rede de pesquisa para acelerar o desenvolvimento de soluções baseadas em inteligência artificial para a agricultura.", "titulo_pt": "A corrida da Bayer para levar inteligência artificial do laboratório para o campo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 181658, "titulo": "Até onde confiar na inteligência artificial para tirar dúvidas de saúde", "url": "https://veja.abril.com.br/coluna/bem-estar/ate-onde-confiar-na-inteligencia-artificial-para-tirar-duvidas-de-saude/", "fonte_id": "veja", "data_pub": "2026-09-26T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial (IA) gerativa está expandindo o acesso a informações de saúde no Brasil. No entanto, o Conselho Federal de Medicina (CFM) enfatiza que o médico continua sendo a autoridade final em matters de saúde.", "titulo_pt": "Até onde confiar na inteligência artificial para tirar dúvidas de saúde?", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 182218, "titulo": "Trump, Xi agree to establish AI communication channel, oppose tolls on int'l waterways: White House", "url": "https://en.yna.co.kr/view/AEN20260926003900315", "fonte_id": "yonhap_news", "data_pub": "2026-09-26T10:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, e o presidente da China, Xi Jinping, concordaram em estabelecer um canal de comunicação sobre inteligência artificial e se comprometeram a se opor a tarifas em vias internacionais de navegação, de acordo com a Casa Branca.", "titulo_pt": "Trump e Xi concordam em estabelecer canal de comunicação sobre AI e se oporem a tarifas em vias internacionais: casa branca", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 182246, "titulo": "Meta’s Muse Is Adults-Only. Why Does It Look Like a Kids’ Toy?", "url": "https://www.wired.com/story/meta-muse-is-adults-only-why-does-it-look-like-a-cute-kids-toy/", "fonte_id": "wired", "data_pub": "2026-09-26T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta afirma que o Muse é apenas para adultos, mas seu mascote fofo e semelhante ao Labubu, bem como o dispositivo de IA no estilo Tamagotchi, podem agradar usuários de todas as idades.", "titulo_pt": "Meta’s Muse é para adultos, mas parece um brinquedo infantil", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 182114, "titulo": "Foreign capital flows into US stocks hit record as appetite for debt fades", "url": "https://www.ft.com/content/a1a1318b-8051-4539-a485-5a4e1d021578?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-26T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A compra de ações norte-americanas por investidores internacionais atingiu um recorde de mais de 940 bilhões de dólares no período até julho, coincidindo com fortes ganhos no índice S&P 500.", "titulo_pt": "Fluxo de capitais estrangeiros para ações americanas bate recorde enquanto apetite por dívida diminui", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 182118, "titulo": "Hackers hijack AI accounts and servers to fuel new cyber crime boom", "url": "https://www.ft.com/content/3f406fbe-b72e-488f-9975-5b94e95dfe32?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-26T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores de segurança alertam para um aumento nas 'LLM-jacking' (ataques de AI), que visam os recursos caros de inteligência artificial das empresas. Esses ataques permitem que hackers se aproprie de contas e servidores de IA para promover novos esquemas criminosos cibernéticos.", "titulo_pt": "Hackers se apropriam de contas e servidores de IA em aumento de novos ataques cibernéticos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 182247, "titulo": "This Browser Extension Lets You Snooze Open Tabs Until Later", "url": "https://www.wired.com/story/tuck-browser-extension-lets-you-snooze-open-tabs-until-later/", "fonte_id": "wired", "data_pub": "2026-09-26T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O adicional gratuito Tuck traz uma das melhores funcionalidades do email moderno—a capacidade de esconder algo por um tempo—para a confusão de abas abertas no navegador.", "titulo_pt": "Esta extensão de navegador permite que você esconda abas abertas até mais tarde", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 182248, "titulo": "A Gravitational Battle Within the Earth Is Changing the Length of Days", "url": "https://www.wired.com/story/gravitational-struggle-deep-in-earth-is-changing-length-of-days/", "fonte_id": "wired", "data_pub": "2026-09-26T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma competição entre a gravidade do núcleo interno e outras forças na crosta mafiosa está alterando a rotação da Terra, mudando o comprimento dos dias.", "titulo_pt": "Batalha de gravidade dentro da terra está alterando o comprimento dos dias", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 181879, "titulo": "O outro lado da IA: da ameaça eleitoral à eficiência do Estado", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-outro-lado-da-ia-da-ameaca-eleitoral-a-eficiencia-do-estado", "fonte_id": "jota", "data_pub": "2026-09-26T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A tecnologia da Inteligência Artificial (IA) pode se tornar uma importante aliada da democracia quando utilizada de forma ética e responsável, fortalecendo o poder público. No entanto, sua implementação também apresenta ameaças eleitorais que devem ser consideradas.", "titulo_pt": "Outro lado da IA: da ameaça eleitoral à eficiência do Estado", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 181710, "titulo": "Por que a IA mente? Entenda as alucinações e como contorná-las", "url": "https://exame.com/inteligencia-artificial/por-que-as-ias-inventam-respostas-e-como-ensina-las-a-admitir-que-nao-sabem-alguma-coisa/", "fonte_id": "exame", "data_pub": "2026-09-26T08:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fundador da startup suíça Ammonix, que desenvolveu inteligência artificial para cirurgias cardíacas, acredita que a incerteza deve ser considerada como uma resposta válida. Ele também observa que os assistentes de IA atuais são projetados para nunca parar de falar.", "titulo_pt": "Por que a IA mente? Entenda as alucinações e como contorná-las", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 181691, "titulo": "TSE usará starlink de Musk para resultados das eleições em locais remotos", "url": "https://www.cnnbrasil.com.br/eleicoes/tse-usara-starlink-de-musk-para-resultados-das-eleicoes-em-locais-remotos/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça Eleitoral utilizará até 1.113 terminais Starlink, da empresa de Elon Musk, para enviar dados das urnas em locais remotos onde não há infraestrutura convencional. Este sistema será usado em 13 estados para garantir a transmissão dos resultados das eleições.", "titulo_pt": "Justiça eleitoral usará starlink de Musk para resultados das eleições em locais remotos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 181711, "titulo": "Filtr bate 1 bilhão de views e vira aposta da Sony Music Brasil para criar novos negócios na música", "url": "https://exame.com/pop/filtr-bate-1-bilhao-de-views-e-vira-aposta-da-sony-music-para-criar-novos-negocios-na-musica/", "fonte_id": "exame", "data_pub": "2026-09-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Filtr, uma banda de música, alcançou 1 bilhão de visualizações e agora é uma aposta da Sony Music Brasil para criar novos negócios na indústria musical, expandindo sua operação para um ecossistema de entretenimento com conteúdo próprio, projetos presenciais e descoberta de novos talentos.", "titulo_pt": "Filtr, com 1 bilhão de visualizações, se torna aposta da Sony Music Brasil para novos negócios na música", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 181717, "titulo": "Starlink funciona em caminhão, lancha e área rural? Veja cobertura e limites", "url": "https://exame.com/tecnologia/examelab/starlink-funciona-em-caminhao-lancha-e-area-rural-veja-cobertura-e-limites/", "fonte_id": "exame", "data_pub": "2026-09-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Starlink oferece internet via satélite com planos específicos para uso em movimento e em alto-mar, enquanto outros planos são destinados a sítios e fazendas. O serviço não é uniforme para todos os usos.", "titulo_pt": "Starlink: plano específico para uso em movimento e em alto-mar", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 181880, "titulo": "Da digitalização ao governo digital", "url": "https://www.jota.info/opiniao-e-analise/colunas/regulacao-e-novas-tecnologias/da-digitalizacao-ao-governo-digital", "fonte_id": "jota", "data_pub": "2026-09-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute pontos importantes relacionados ao processo administrativo, incluindo a digitalização e o governo digital.", "titulo_pt": "Da digitalização ao governo digital", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 181754, "titulo": "Semana da Ciência tem novo voo da Starship, segredos de Marte e cozinha espacial da China", "url": "https://olhardigital.com.br/2026/09/26/ciencia-e-espaco/semana-da-ciencia-tem-novo-voo-da-starship-segredos-de-marte-e-cozinha-espacial-da-china/", "fonte_id": "olhar_digital", "data_pub": "2026-09-26T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O 14º voo de teste da Starship ocorreu na segunda-feira (22). O post destaca também segredos de Marte e a cozinha espacial da China.", "titulo_pt": "Semana da Ciência destaca voo da Starship, segredos de Marte e cozinha espacial da China", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 182256, "titulo": "Molecular 'self-destruct' switch discovered: How stressed cells decide between survival and death", "url": "https://phys.org/news/2026-09-molecular-destruct-stressed-cells-survival.html", "fonte_id": "phys_org", "data_pub": "2026-09-26T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo da Ben-Gurion University of the Negev identificou um mecanismo molecular que determina se células humanas sob estresse ativam um mecanismo de sobrevivência ou desencadeiam a morte programada celular (apoptose). Os resultados podem auxiliar no combate à resistência a quimioterapia em tumores agressivos.", "titulo_pt": "Interruptor molecular de 'auto-destruição' descoberto: como células estressadas decidem entre sobrevivência e morte", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 182257, "titulo": "Digital textbooks significantly boost students' intrinsic learning motivation", "url": "https://phys.org/news/2026-09-digital-textbooks-significantly-boost-students.html", "fonte_id": "phys_org", "data_pub": "2026-09-26T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo meta-analítico realizado por uma equipe da Universidade de Educação de Hong Kong e da Universidade Normal de Oriental China analisou 27 estudos experimentais e quase experimentais entre 2000 e 2024, com 3.590 participantes, e confirmou que os livros didáticos digitais aumentam significativamente a motivação intrínseca dos alunos em comparação com os livros-texto tradicionais em papel.", "titulo_pt": "Livros didáticos digitais intensificam a motivação intrínseca dos alunos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 182250, "titulo": "Opinion: I worked on the CDC investigation of the anthrax letters. 25 years later, are we ready for the next biothreat?", "url": "https://www.statnews.com/2026/09/26/anthrax-letters-25th-anniversary-cdc-investigation-new-biothreats-ai/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-26T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde outubro de 2001, houve avanços, mas também aumentaram as lacunas na preparação e mitigação da saúde pública, escreve o autor. 25 anos após o incidente de antrax, há preocupações sobre a capacidade de lidar com a próxima ameaça biológica.", "titulo_pt": "Opinião: trabalhei na investigação do CDC sobre as cartas de antrax. Há 25 anos, estamos preparados para a próxima ameaça biológica?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 181524, "titulo": "Como a cultura dos orangotangos é transmitida aos seus filhotes", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/colunas/reinaldojoselopes/2026/09/como-a-cultura-dos-orangotangos-e-transmitida-aos-seus-filhotes.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-26T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cultura dos orangotangos é transmitida aos seus filhotes, com semelhanças notáveis entre eles e os filhotes de outras espécies de primatas, incluindo uma curiosidade intrínseca para compreender o mundo ao seu redor.", "titulo_pt": "Como a cultura dos orangotangos é transmitida aos seus filhotes", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 182258, "titulo": "Millions in the US Northeast brace for a powerful storm", "url": "https://phys.org/news/2026-09-millions-northeast-brace-powerful-storm.html", "fonte_id": "phys_org", "data_pub": "2026-09-26T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 40 milhões de pessoas no nordeste dos Estados Unidos se prepararam para chuva intensa e ventos fortes, diante de uma tempestade excepcionalmente poderosa para a temporada.", "titulo_pt": "Millhões no nordeste dos EUA se preparam para tempestade forte", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 182259, "titulo": "Canals full, roads submerged as Bangkok declares flood disaster", "url": "https://phys.org/news/2026-09-canals-full-roads-submerged-bangkok.html", "fonte_id": "phys_org", "data_pub": "2026-09-26T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades de Bangkok declararam uma situação de desastre por inundações após quase 48 horas de chuva intensa, deixando canais cheios e estradas submersas. Os residentes tiveram que se deslocar por águas profundas.", "titulo_pt": "Canais cheios, estradas alagadas e Bangkok declara situação de desastre por inundações", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 182260, "titulo": "Indonesia fires threaten critically endangered orangutan: IUCN", "url": "https://phys.org/news/2026-09-indonesia-threaten-critically-endangered-orangutan.html", "fonte_id": "phys_org", "data_pub": "2026-09-26T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais na Borneo, Indonésia, estão aumentando a pressão sobre os orangotangos da Borneo, uma espécie criticamente em perigo de extinção, conforme informou a União Internacional para a Conservação da Natureza.", "titulo_pt": "Incêndios ameaçam orangotangos críticamente ameaçados na borneo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 182261, "titulo": "Guatemala ensures survival of vulnerable 'fossil' fish", "url": "https://phys.org/news/2026-09-guatemala-survival-vulnerable-fossil-fish.html", "fonte_id": "phys_org", "data_pub": "2026-09-26T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em um canal de água doce ao lado de mangue na Guatemala do sul, centenas de jovens garos tropicais, peixes torpedes com uma mandíbula semelhante a de um crocodilo e conhecidos como 'peixes fósseis', foram soltos na natureza.", "titulo_pt": "Guatemala garante sobrevivência de 'peixes fósseis' vulneráveis", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 181525, "titulo": "Cães 'ouvem' melhor consoantes da fala, assim como seres humanos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/caes-ouvem-melhor-consoantes-da-fala-assim-como-seres-humanos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os cães se concentraram principalmente nas consoantes das palavras ao acompanhar a fala humana, similar ao processo de compreensão da linguagem no cérebro humano. Essa descoberta oferece novas perspectivas sobre o aprendizado da fala durante a evolução e sugere possíveis diferenças na sintonia cognitiva entre cães e humanos.", "titulo_pt": "Cães 'ouvem' melhor as consoantes da fala, como humanos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 181715, "titulo": "Arqueólogos encontram escola onde Aristóteles pode ter ensinado Alexandre, o Grande", "url": "https://exame.com/ciencia/arqueologos-encontram-escola-onde-aristoteles-pode-ter-ensinado-alexandre-o-grande/", "fonte_id": "exame", "data_pub": "2026-09-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Arqueólogos descobriram um complexo de 2.300 anos na Grécia que pode ser a escola onde Aristóteles ensinou Alexandre, o Grande. O local contém salas com carteiras de pedra, área de treinamento físico, estádio e espaços para banquetes.", "titulo_pt": "Arqueólogos encontram escola onde Aristóteles pode ter ensinado Alexandre, o Grande", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 181718, "titulo": "Cientistas descobrem 'falha' por trás da fraqueza muscular com a idade", "url": "https://exame.com/ciencia/cientistas-descobrem-falha-por-tras-da-fraqueza-muscular-com-a-idade/", "fonte_id": "exame", "data_pub": "2026-09-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas identificaram uma perda de eficiência na comunicação entre nervos e músculos como causa da fraqueza muscular com a idade. O estudo aponta para um possível alvo para o desenvolvimento de tratamentos.", "titulo_pt": "Cientistas descobrem causa da fraqueza muscular com a idade", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 181926, "titulo": "Drones could speed up getting defibrillators to people having cardiac arrests, study suggests", "url": "https://www.theguardian.com/society/2026/sep/26/drones-could-speed-up-getting-defibrillators-to-people-having-cardiac-arrests-study-suggests", "fonte_id": "guardian_world", "data_pub": "2026-09-26T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos sugerem que drones podem acelerar o acesso a defibriladores para pessoas que sofrerem paradas cardíacas fora dos hospitais. No Reino Unido, mais de 30.000 casos de paradas cardíacas fora dos hospitais são registrados anualmente, com menos de 10% de sobreviventes.", "titulo_pt": "Drones podem acelerar o acesso a defibriladores em casos de paradas cardíacas fora dos hospitais, sugere estudo", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 182264, "titulo": "APOD: 2026 September 26 – Mirrored Meteor and Milky Way", "url": "https://science.nasa.gov/image-article/apod-2026-september-26-mirrored-meteor-and-milky-way/", "fonte_id": "nasa_news", "data_pub": "2026-09-26T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem de hoje do Astronomy Picture of the Day (APOD) mostra um meteoro refletido e a Via Láctea. A imagem foi capturada em 26 de setembro de 2026.", "titulo_pt": "Meteorito refletido e via láctea", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 182262, "titulo": "A 'library' of bacteria-killing viruses: Harnessing the power of phages", "url": "https://phys.org/news/2026-09-library-bacteria-viruses-harnessing-power.html", "fonte_id": "phys_org", "data_pub": "2026-09-26T02:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estima-se que 38 trilhões de bactérias habitam o corpo humano, com apenas uma pequena parte sendo prejudicial à saúde. No entanto, as bactérias nocivas podem causar doenças graves, especialmente quando desenvolvem resistência a _pt": "A perda do olfato afeta a alimentação, os relacionamentos, a vida sexual e a capacidade de detectar riscos como fumaça, gás ou comida podre. Poucas pessoas valorizam o olfato até que ele desaparece.", "titulo_pt": "O sentido invisível: nos alerta do perigo e nos permite desfrutar de muitos prazeres, mas poucos o valorizam até que desaparece", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 182305, "titulo": "Lit Hub Weekly: September 21 – 25, 2026", "url": "https://lithub.com/lit-hub-weekly-september-21-25-2026/", "fonte_id": "lithub", "data_pub": "2026-09-26T10:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Durante a temporada de grandes livros, Ed Simon usa um fluxograma para escolher qual ler. Ele explora como a dor limita a linguagem, afetando a criação poética de todos os seres humanos.", "titulo_pt": "Lit Hub semanal: 21 a 25 de setembro de 2026", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 181599, "titulo": "TV Brasil: reality apresenta trajetória da guitarrista Lui Rabello", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-09/tv-brasil-reallity-apresenta-trajetoria-da-guitarrista-lui-rabello", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-09-26T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A TV Brasil exibirá um episódio inédito do reality show Duelo de Guitarras no sábado (26), às 13h30, focado na baiana Lui Rabello e sua participação no programa. A guitarrista, conhecida por sua personalidade mansa, integrou a banda Altas Horas durante 16 anos e conquistou a admiração dos participantes do reality.", "titulo_pt": "TV Brasil: reality mostra trajetória da guitarrista Lui Rabello", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 182266, "titulo": "Thanks, I’m Just Looking", "url": "https://hyperallergic.com/thanks-im-just-looking/", "fonte_id": "hyperallergic", "data_pub": "2026-09-26T10:00:00Z", "id ago Roncagliolo: “Chile forzó al Papa Francisco a un golpe de timón inédito en una institución muy lenta”", "url": "https://www.latercera.com/culto/noticia/santiago-roncagliolo-los-intimos-del-papa-francisco-difundieron-que-robert-prevost-debia-ser-el-sucesor/", "fonte_id": "la_tercera", "data_pub": "2026-09-26T09:15:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O escritor e jornalista peruano Santiago Roncagliolo, em entrevista com Culto, discute as principais ideias de seu livro 'O pastor e os lobos', que explora o rápido avanço do bispo de Chiclayo para o Vaticano, a influência da crise de abusos sexuais na Igreja Católica chilena e o processo que levou o Papa Francisco ao papado. O livro também analisa como o Chile forçou o Papa Francisco a tomar um inédito golpe de timão em uma instituição muito lenta.", "titulo_pt": "Santiago Roncagliolo: ‘chile impôs um inédito rumo ao vaticano a Papa Francisco’", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 182268, "titulo": "Six designs that freshen up the humble toothbrush", "url": "https://www.dezeen.com/2026/09/26/toothbrush-product-design/", "fonte_id": "dezeen", "data_pub": "2026-09-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O post revisita projetos do arquivo do Dezeen que modernizam o simples pente de dentes. Um exemplo é a coleção de acessórios da Landor & Fitch, projetada para pessoas com desafios de mobilidade, incluindo manoplas com agarre grosso.", "titulo_pt": "Seis projetos que renovam o simples pente de dentes", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 182012, "titulo": "Huge crowds cheer Pope Leo ahead of open-air mass on Place de la Concorde", "url": "https://www.lemonde.fr/en/france/article/2026/09/26/pope-to-hold-giant-mass-on-place-de-la-concorde-and-champs-elysees_6757973_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-26T08:32:00Z", "idioma": "en", "provavel_duplicata_de": n s e Fatecs.", "titulo_pt": "Centro Paula Souza abre inscrições para bolsas de intercâmbio no exterior", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 181918, "titulo": "Encuesta Descifra: percepción de que Chile está en una emergencia laboral salta 10 puntos en dos meses y llega a 87%", "url": "https://www.latercera.com/pulso/noticia/encuesta-descifra-percepcion-de-que-chile-esta-en-una-emergencia-laboral-salta-10-puntos-en-dos-meses-y-llega-a-87/", "fonte_id": "la_tercera", "data_pub": "2026-09-26T10:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa revelou que a percepção de que Chile está enfrentando uma emergência laboral aumentou 10 pontos percentuais em dois meses, chegando a 87%. A população atribui a responsabilidade pela crise ao governo atual, especificamente ao presidente Kast e aos ministros Rau e Quiroz.", "titulo_pt": "Pesquisa mostra que 87% consideram que Chile está em emergência laboral", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 181657, "titulo": "A natureza que virou ativo nos imóveis de alto padrão", "url": "https://veja.abril.com.br/economia/a-natureza-que-virou-ativo-nos-imoveis-de-alto-padrao/", "fonte_id": "veja", "data_pub": "2026-09-26T11:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Imóveis de alto padrão estão incluindo pequenas florestas no projeto arquitetônico para reduzir o calor, absorver a água das chuvas e tornar as cidades mais agradáveis para se viver.", "titulo_pt": "A natureza que se tornou ativo nos imóveis de alto padrão", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 181683, "titulo": "Super El Niño e ondas de calor aumentam risco de encontros com serpentes; especialista ensina como reagir", "url": "https://www.cnnbrasil.com.br/ciencia/super-el-nino-e-ondas-de-calor-aumentam-risco-de-encontros-com-serpentes-especialista-ensina-como-reagir/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-26T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eventos climáticos extremos, como o Super El Niño, aumentam o risco de encontros com serpentes em áreas urbanas e rurais devido às mudanças no habitat dos animais. O calor intensificado também contribui para essa situação.", "titulo_pt": "Super El Niño e ondas de calor aumentam risco de encontros com serpentes; especialista ensina como reagir", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 182015, "titulo": "Climate rallies to be held across France on Saturday after record-breaking summer", "url": "https://www.lemonde.fr/en/environment/article/2026/09/26/climate-rallies-to-be-held-across-france-on-saturday-after-record-breaking-summer_6757975_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-26T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 260 manifestações estão programadas para todo o país no sábado, pedindo um plano de ação climática de emergência. Inicialmente organizadas por ativistas ambientais, essas protestos agora contam com o apoio de organizações sem fins lucrativos, sindicatos e partidos políticos.", "titulo_pt": "Rallys climáticos marcados para sábado em toda França após verão recorde", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 181712, "titulo": "Onda de calor no Brasil: como proteger a saúde durante o El Niño", "url": "https://exame.com/ciencia/onda-de-calor-no-brasil-como-proteger-a-saude-durante-o-el-nino/", "fonte_id": "exame", "data_pub": "2026-09-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "É necessário tomar cuidados além de beber água para proteger a saúde durante as ondas de calor, especialmente em períodos de El Niño. O artigo sugere maneiras de reduzir os riscos associados ao calor extremo.", "titulo_pt": "Onda de calor no Brasil: como proteger a saúde durante o El Niño", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 181714, "titulo": "Recicle perto de você: encontre as estações que pagam por recicláveis em São Paulo", "url": "https://exame.com/esg/recicle-perto-de-voce-encontre-as-estacoes-que-pagam-por-reciclaveis-em-sao-paulo/", "fonte_id": "exame", "data_pub": "2026-09-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Green Mining é uma iniciativa que já pagou R$ 6,8 milhões a mais de 6 mil trabalhadores da cadeia do lixo em São Paulo e em Embu das Artes. Ela possui sete unidades na capital paulista e uma em Embu das Artes, permitindo a localização das estações mais próximas no mapa.", "titulo_pt": "Recicle perto de você: encontre as estações que pagam por recicláveis em São Paulo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 182096, "titulo": "Disaster zone declared across Bangkok as heavy rain triggers flooding", "url": "https://www.aljazeera.com/news/2026/9/26/disaster-zone-declared-across-bangkok-as-heavy-rain-triggers-flooding?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-26T07:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cidade de Bangkok está sob estado de calamidade devido a chuvas constantes desde quinta-feira, que inundaram as ruas e canais, invadindo casas e estabelecimentos comerciais.", "titulo_pt": "Área de desastre declarada em Bangkok devido a fortes chuvas e inundações", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 181671, "titulo": "Violência e desconfiança dificultam combate ao ebola no Congo", "url": "https://www.cnnbrasil.com.br/internacional/congo-ebola-violencia-desconfianca/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-26T12:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A violência e a desconfiança em relação aos centros de tratamento do Ebola dificultam o combate à doença no Congo, levando pacientes a buscar tratamento apenas quando a doença já está em
