<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>

<script>
const D = {"gerado_em": "26/10/2026 07:23", "stats": {"noticias_novas": 828, "resumos_gerados": 223}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Luiz Inácio Lula da Silva (PT) foi reeleito para seu quarto mandato presidencial com 51,75% dos votos válidos, derrotando Flávio Bolsonaro no segundo turno das eleições. Esta vitória foi a primeira eleição presidencial vencida pela esquerda na América Latina desde 2025, quando Donald Trump retornou à Casa Branca. Lula ganhou após uma reação nas redes sociais e manifestações de rua que deram fôlego à campanha no segundo turno, especialmente no Sudeste, onde ocorreu o maior movimento de eleitores em apoio à candidatura petista. O novo governo enfrentará diversos desafios econômicos, incluindo a necessidade de ajuste fiscal, desaceleração da atividade econômica, inflação e juros elevados, além de um endividamento em nível recorde. Além disso, Lula terá que lidar com a retomada das plataformas digitais e a ampliação do diálogo político, especialmente com André Janones, que usou o WhatsApp para mobilizar apoio na reta final da campanha. A equipe de Lula está preparando uma Proposta de Emenda à Constituição (PEC) para permitir que o novo governo busque o centro da meta fiscal e congele recursos do Orçamento, se necessário, para melhorar a trajetória da dívida pública.", "mundo": "Luiz Inácio Lula da Silva venceu a eleição presidencial no Brasil, conquistando seu quarto mandato. Este resultado foi surpreendente, considerando a disputa apertada no primeiro turno. O resultado tem implicações significativas para a democracia, o meio ambiente e as relações internacionais no Brasil e no exterior. A vitória de Lula foi celebrada por líderes latino-americanos, incluindo aqueles da direita, e foi destacada nos principais jornais internacionais. Em contraste, o senador Flávio Bolsonaro, o principal oponente de Lula, rejeitou o resultado, chamando-o de 'sacanagem' e prometendo buscar a anulação das eleições. A derrota de Flávio enfraquece o bolsonarismo, mas não afeta a nova força da direita. A Albânia anunciou novas medidas para combater a 'anarquia urbana' após protestos violentos. A Serbia entrou em uma nova era democrática após um movimento liderado por estudantes derrubou o presidente autoritário Aleksandar Vučić. Além disso, o ex-primeiro-ministro japonês Yasuo Fukuda faleceu aos 90 anos, e o presidente da Coreia do Sul, Lee Jae Myung, afirmou que a entrada do país no Acordo de Parceria Econômica Comprida (CPTPP) é inevitável, embora a adesão durante o seu mandato seja improvável.\n\nA vitória do presidente Luiz Inácio Lula da Silva nas eleições presidenciais do Brasil marcou um ponto de viragem para a América Latina, com observadores notando que a onda do extremismo de direita não era inevitável. Milhares de pessoas comemoraram nas ruas de grandes cidades brasileiras após Lula derrotar Flávio Bolsonaro, garantindo mais quatro anos de mandato para o presidente eleito. Em contraste, a Sérvia viu o fim do governo do autoritário Aleksandar Vucic, com a oposição vencendo as eleições após dois anos de protestos contra corrupção e mau gerenciamento. As tensões regionais continuaram a se intensificar, com o Irã planejando conversar com autoridades de países do bloco saudita, enquanto o conflito no Oriente Médio levou ao cancelamento do Dakar Rally em 2027. As sanções americanas contra o Irã continuaram a ser testadas, com as compras de combustível de avião sancionado sendo disfarçadas através do Myanmar. Enquanto isso, a China, tradicionalmente um grande exportador de mão-de-obra migrante, pode eventualmente considerar a importação em massa de trabalhadores devido ao declínio demográfico. A Indonésia apreendeu mais de 2 toneladas de drogas em operações antidrogas significativas, enquanto a Coreia do Sul e os Estados Unidos continuaram a coordenar para definir o ano-alvo para a transferência do controle operacional (OPCON).", "economia": "A reeleição de Lula tem impactado significativamente os mercados financeiros. As ações brasileiras caíram no exterior, enquanto investidores ajustaram suas posições. A Petrobras e o Banco do Brasil, por exemplo, podem se beneficiar ou sofrer, dependendo das flutuações do petróleo e do desempenho do setor agrícola. O investimento em renda fixa também pode variar com as condições de mercado. O setor de ações enfrenta volatilidade, com gestores de fundos prevenindo uma segunda-feira volátil. Em um cenário mais amplo, a economia global também está sentindo os efeitos de propostas de restrições de investimento externo dos EUA, que podem dificultar a expansão de empresas biotecnológicas chinesas. Além disso, a União Europeia está implementando uma taxa de dois euros em pacotes enviados para fora do bloco, enquanto o Federal Reserve dos EUA está considerando uma pausa hawkish em suas taxas de juros. No Brasil, a economia enfrenta desafios como a necessidade de ajustes fiscais para o 3º mandato de Lula. Economistas e empresários esperam maior previsibilidade para o próximo governo.", "tecnologia": "A Europa registrou um aumento significativo no financiamento tecnológico, com mais de 65 transações de financiamento superando 1,5 bilhão de euros no último período, conforme relatório da European Tech Weekly Recap. Em outro destaque, a startup sueca Strawberry lançou sua versão final de um navegador com assistentes de inteligência artificial integrados, competindo com grandes players do setor. Na Coreia do Sul, o Galaxy Corp. inaugurou uma arena de desempenho de robôs em Dubai, enquanto a Deutsch Motors registrou um aumento de 25,4% no lucro operacional no primeiro trimestre de 2026, impulsionado pelas vendas de veículos elétricos chineses da BYD. Na China, modelos de geração de vídeo de inteligência artificial chineses superaram rivais americanos em qualidade visual, mas ficaram atrás em medidas de segurança, de acordo com um estudo da Universidade de Hong Kong. Além disso, a startup adsilico, spin-off da Universidade de Leeds, levantou £10 milhões em uma rodada de financiamento série A para testar dispositivos médicos em pacientes virtuais.", "ciencia": "Um estudo liderado pela Universidade de Columbia identificou fatores que podem explicar por que algumas pessoas não desenvolvem Alzheimer, mesmo com alto risco, o que pode levar ao desenvolvimento de novos tratamentos para a doença. Além disso, uma imunoterapia combinada de dois medicamentos reduziu em 58% o risco de morte para pacientes com câncer de pulmão agressivo, aumentando a sobrevida mediana de 12,7 para 21,1 meses. A Terra e Marte podem ter se formado de maneiras diferentes, o que revela a complexidade do processo de formação de planetas. Corvos tomam decisões duas vezes mais rápido que humanos, identificando a direção de um padrão de pontos em média em 235 milissegundos com alta precisão. A simulação 'Lumina', desenvolvida pelo Centro para Astrofísica | Harvard & Smithsonian, é uma das maiores e mais detalhadas simulações já criadas do universo primitivo, auxiliando os astrônomos a compreenderem as observações feitas pelo Telescópio Espacial James Webb e pelo Telescópio Espacial Nancy Roman. Além disso, cientistas desenvolveram uma técnica que permite operar múltiplos qubits de silício simultaneamente com alta precisão, superando um grande desafio na escala de computadores quânticos, permitindo o desenvolvimento de processadores quânticos maiores e mais poderosos.", "cultura": "O Brasil assistiu ao retorno de Lula à presidência após vencer Flávio Bolsonaro nas eleições presidenciais, reafirmando a necessidade de regulamentação de plataformas digitais. Em São Paulo, o grupo BTS realizou um show com eventos especiais para os fãs. No exterior, o tenor inglês Freddie De Tommaso encerrou sua temporada no Teatro Colón, um marco em sua carreira, acompanhado pela cantora Nadine Sierra. A cultura pop chinesa também se destacou com a tendência de jovens adultos estressados criarem 'blocos de construção' como companhia. No cinema, a obra 'Music Against the Night', de Yiyun Li, explora a natureza da genialidade através da história de dois músicos reais. O ator Ashley Walters, após passar por dificuldades com a lei e adicção, dirigiu seu primeiro filme. A exposição da Tapestria de Bayeux registrou grande interesse entre os jovens, com 55% das compras para o British Museum provenientes de pessoas com menos de 35 anos. No teatro, a designer de iluminação Aideen Malone, vencedora de um Olivier, defende que a produção de 'Into the Woods' ainda não foi totalmente concluída, apesar de seu sucesso com críticos e público. Finalmente, a série 'Sons de S.Paulo' registra sons das cidades, campos, matas e do litoral do estado de São Paulo, capturando a diversidade sonora do estado.", "sociedade": "Em Goseong, na Província de Gangwon, na Coreia do Sul, cerca de um terço dos residentes com 24 anos ou menos têm origem migrante, representando o maior percentual do país, quatro vezes maior que a média nacional. No Brasil, a saúde da mulher é discutida em um contexto mais amplo do que campanhas específicas como o Outubro Rosa, destacando a necessidade de uma regulação equilibrada entre regras e decisões médicas. Em Goianésia, Goiás, um jovem de 19 anos morreu após ser atropelado durante uma carreata em apoio a Flávio Bolsonaro, o que levou a investigações. As tensões políticas também se refletem em confrontos, como um tiroteio perto de um estádio na Flórida que deixou 11 feridos, incluindo menores de idade, e uma série de protestos na França que resultaram em quase mil pessoas presas.", "meio_ambiente": "Comunidades indígenas brasileiras expressaram preocupações sobre como o resultado das eleições poderia afetar as proteções ambientais, conforme relatado pelo Al Jazeera. Em outro artigo, publicado pelo Jota, foi discutido o problema da falta de estrutura e planejamento nas unidades de conservação no Brasil, que são conhecidas como 'parques de papel'. O CNN Brasil destacou a importância do sistema de logística reversa de embalagens agrícolas na reciclagem, que já destinou corretamente mais de 900 mil toneladas desde 2002. No entanto, o artigo do CNN Brasil também mencionou que a demanda por material reciclado e a rastreabilidade são essenciais para a sustentabilidade financeira da operação.", "direitos_humanos": "A Arquidiocese de Nova York concordou em pagar 800 milhões de dólares a mais de 1.300 sobreviventes de abuso sexual, em um acordo que é o segundo maior envolvendo um arcebispo católico nos Estados Unidos. Este acordo, que soma a outras indenizações, reflete a crescente pressão sobre instituições religiosas e sociais para enfrentar e compensar violações de direitos humanos, especialmente em casos de abuso sexual infantil. Em outro desenvolvimento, o governo do Marrocos está reconsiderando a decisão de permitir a libertação antecipada de 56 condenados por abuso sexual de menores, apesar de ter descartado anteriormente a suspensão dos decretos já executados. Por outro lado, a descoberta de cinco bebês orangotangos em uma floresta de casuarinas na Índia, alegadamente abandonados por vilarejos, expõe um comércio ilegal de primatas que está se expandindo para o país. Esses eventos reforçam a necessidade de maior proteção e responsabilidade em casos de abuso infantil em diversos contextos sociais e geográficos."}, "resumo_do_dia": {"politica_nacional": [{"id": 226260, "titulo": "Como Janones montou um exército digital na campanha de Lula — e qual espaço pode ter no novo governo", "url": "https://www.bbc.com/portuguese/articles/c678pegn3krmo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-26T09:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Janones usou o WhatsApp para mobilizar apoio na reta final da campanha de Lula. A vitória de Lula abre discussões sobre o peso político de Janones e seu estilo de confronto no próximo mandato.", "titulo_pt": "Como Janones montou um exército digital na campanha de Lula — e qual espaço pode ter no novo governo", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 226024, "titulo": "Do ajuste fiscal à desaceleração da atividade, Lula enfrentará desafios na economia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/do-ajuste-fiscal-a-desaceleracao-da-atividade-lula-enfrentara-desafios-na-economia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-26T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva (PT) enfrentará diversos desafios econômicos após sua reeleição em 2027, incluindo a necessidade de ajuste fiscal, desaceleração da atividade econômica, inflação e juros elevados, bem como um endividamento em nível recorde, conforme analistas apontam.", "titulo_pt": "Lula enfrentará desafios econômicos após reeleição em 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 226174, "titulo": "TSE desmente Flávio Bolsonaro sobre retirada de fiscais do PL de sala-cofre", "url": "https://www.metropoles.com/brasil/tse-desmente-flavio-bolsonaro-sobre-retirada-de-fiscais-do-pl-de-sala-cofre", "fonte_id": "metropoles", "data_pub": "2026-10-26T08:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TSE esclareceu que a sala-cofre não é aberta a visitas e que fiscais estiveram presentes e acompanharam todos os procedimentos. Flávio Bolsonaro havia feito declarações sobre a retirada de fiscais do PL de sala-cofre.", "titulo_pt": "TSE desmente Flávio Bolsonaro sobre fiscalização na sala-cofre", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 226390, "titulo": "Não fixar tese não descaracteriza o precedente", "url": "https://www.jota.info/opiniao-e-analise/artigos/nao-fixar-tese-nao-descaracteriza-o-precedente", "fonte_id": "jota", "data_pub": "2026-10-26T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cancelamento da repercussão geral do Tema 106 no STF não afeta o caráter de precedente da decisão no RE 590.880.", "titulo_pt": "Não cancelar tese não desqualifica o precedente", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 226025, "titulo": "O que Lula pode mudar nas leis trabalhistas em seu quarto governo?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/o-que-lula-pode-mudar-nas-leis-trabalhistas-em-seu-quarto-governo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-26T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O quarto governo de Lula, após a reeleição, pode trazer alterações na CLT, incluindo a possibilidade de fim da escala 6x1.", "titulo_pt": "O que Lula pode mudar nas leis trabalhistas em seu quarto governo?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 226026, "titulo": "Fim da eleição destrava agenda da reforma tributária, e alíquota será conhecida nesta semana", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/10/fim-da-eleicao-destrava-agenda-da-reforma-tributaria-e-aliquota-sera-conhecida-nesta-semana.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-26T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A agenda da reforma tributária foi desbloqueada após o fim da eleição. A alíquota será divulgada na semana atual. Parar a reforma tributária foi considerado uma burrada pelo presidente da Fiesp em 2000.", "titulo_pt": "Fim da eleição libera agenda da reforma tributária e alíquota será conhecida em breve", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 226299, "titulo": "Lula diz que sua vitória é derrota da mentira e do negacionismo; acompanhe na DW", "url": "https://www.dw.com/pt-br/lula-diz-que-sua-vitória-é-derrota-da-mentira-e-do-negacionismo-acompanhe-na-dw/live-78393402?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-26T06:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula afirmou que sua vitória é uma derrota para a mentira e o negacionismo. Ele acusou Flávio Bolsonaro de mentir com desfaçatez e o chamou de representante do milicianismo.", "titulo_pt": "Lula diz que vitória é derrota da mentira e do negacionismo; acusa flávio bolsonaro", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 226300, "titulo": "Recuperação no Sudeste turbinou vitória decisiva de Lula sobre Flávio", "url": "https://www.dw.com/pt-br/recuperação-no-sudeste-turbinou-vitória-decisiva-de-lula-sobre-flávio/a-79759200?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-26T05:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A vitória decisiva de Lula no segundo turno teve quase metade de seus votos extras provenientes do Sudeste, região onde ocorreu o maior movimento de eleitores em apoio à candidatura petista.", "titulo_pt": "Vitória de Lula no segundo turno teve quase metade dos votos extras do Sudeste", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 226266, "titulo": "Chances de anulação ou 'terceiro turno' a pedido de Flávio são remotas, veem especialistas", "url": "https://www.bbc.com/portuguese/articles/cqdjvnppkdnyo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-26T04:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro afirmou não reconhecer a vitória de Lula. Especialistas consideram remotas as chances de anulação ou de um 'terceiro turno' devido à ampla margem de vantagem de Lula no segundo turno das eleições.", "titulo_pt": "Oportunidades de anulação ou 'terceiro turno' pedidas por Flávio são remotos, dizem especialistas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 226261, "titulo": "Os argumentos de Flávio para pedir anulação da eleição — e o que dizem especialistas", "url": "https://www.bbc.com/portuguese/articles/crkg7ywjj8l0o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-26T04:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Advogados de Flávio Bolsonaro teriam de demonstrar que os votos depositados após a prorrogação do período de votação teriam influência no resultado final da eleição.", "titulo_pt": "Argumentos de Flávio para pedir anulação da eleição e o que dizem os especialistas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 226263, "titulo": "Lula conquista a 1ª vitória da esquerda na América Latina desde que Trump voltou ao poder; veja mapa", "url": "https://www.bbc.com/portuguese/articles/ck5ynlp6qq57o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-26T04:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A vitória de Lula foi a primeira eleição presidencial vencida pela esquerda na América Latina desde 2025, quando Trump retornou à Casa Branca. Nesse período, candidatos conservadores ganharam em Colômbia, Peru, Costa Rica, Honduras, Chile, Bolívia e Equador.", "titulo_pt": "Lula conquista vitória da esquerda na América Latina após Trump retornar ao poder", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 226259, "titulo": "Lula conquista virada inédita e terá quarto mandato como presidente do Brasil: 'Vamos ter que regular as plataformas digitais'", "url": "https://www.bbc.com/portuguese/articles/cx8dzrgq569go?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-26T03:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O petista Lula conquistou uma virada inédita na campanha e terá quarto mandato como presidente do Brasil. A campanha renasceu após a derrota no primeiro turno, com manifestações nas ruas e ação nas redes sob comando de André Janones (Rede-MG).", "titulo_pt": "Lula conquista virada inédita e terá quarto mandato como presidente do Brasil", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 226264, "titulo": "Por que o STF ordenou prorrogar votação por duas horas - e o que dizem os juristas sobre medida", "url": "https://www.bbc.com/portuguese/articles/c64g13y5k303o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-26T03:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) prorrogou a votação por duas horas para atender a pedidos da campanha de Lula, devido a problemas no transporte público, e da campanha de Flávio Bolsonaro, em virtude das chuvas em alguns Estados.", "titulo_pt": "Por que o STF prorrogou a votação por duas horas - e o que dizem os juristas sobre a medida", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 226393, "titulo": "Lula atribui virada histórica à juventude e fala em proteger Brasil de interferência estrangeira", "url": "https://www.jota.info/eleicoes/eleicoes-2026/lula-atribui-virada-historica-a-juventude-e-fala-em-proteger-brasil-de-interferencia-estrangeira", "fonte_id": "jota", "data_pub": "2026-10-26T02:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula foi reeleito presidente em uma virada histórica, destacando a participação da juventude e prometendo proteger o Brasil de interferências estrangeiras. Ele enfatizou sua trajetória pessoal e declarou que fará o seu melhor mandato.", "titulo_pt": "Lula vira história e fala em proteger Brasil de interferência estrangeira", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 226394, "titulo": "Direita passa a comandar 15 estados no país", "url": "https://www.jota.info/eleicoes/eleicoes-2026/direita-passa-a-comandar-15-estados-no-pais", "fonte_id": "jota", "data_pub": "2026-10-26T02:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido de direita PL venceu seis eleições no primeiro turno, mas não conquistou nenhum estado neste domingo. O PSD elegeu cinco governadores.", "titulo_pt": "Direita comanda 15 estados no país", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 226262, "titulo": "Os números que mostram de onde vieram os 10 milhões de votos que deram virada histórica a Lula", "url": "https://www.bbc.com/portuguese/articles/cqe8rekpg9lxo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-26T02:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O resultado de Lula foi marcado por uma virada em Minas Gerais, uma redução das desvantagens em grandes colégios eleitorais do Sudeste e um fortalecimento da liderança no Nordeste.", "titulo_pt": "Os números que mostram de onde vieram os 10 milhões de votos que deram virada histórica a Lula", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 226739, "titulo": "The city that fought Flock", "url": "https://www.theverge.com/features/1017836/flock-huntington-west-virginia-surveillance-ballot-measure", "fonte_id": "the_verge", "data_pub": "2026-10-26T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na cidade de Huntington, West Virginia, o prefeito Patrick Farrell se preparava para uma noite longa durante uma reunião da câmara municipal com 10 membros. Ele estava vestido formalmente e representava a comunidade local, que estava presente com atitudes variadas.", "titulo_pt": "A noite longa em huntington, west virginia", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 226525, "titulo": "Serbia's student movement wins parliamentary elections against populist leader Aleksandar Vucic", "url": "https://www.lemonde.fr/en/international/article/2026/10/26/serbia-s-student-movement-wins-parliamentary-elections-against-populist-leader-aleksandar-vucic_6764419_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-26T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A coalizão de estudantes derrotou o líder populista Aleksandar Vucic, que estava no poder há 14 anos. Agora, o país enfrenta uma transição democrática significativa, que poderia trazer uma nova sensação de calma aos Bálcãs.", "titulo_pt": "Movimento estudantil da sérvia vence eleições parlamentares contra líder populista Aleksandar Vucic", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 226449, "titulo": "Brazil runoff live updates: world leaders congratulate Lula on historic election win as Bolsonaro refuses to concede", "url": "https://www.theguardian.com/world/live/2026/oct/25/brazil-election-runoff-live-updates-flavio-bolsonaro-lula", "fonte_id": "guardian_world", "data_pub": "2026-10-26T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva, do centro-esquerda, venceu o senador Flávio Bolsonaro, do extremo direito, nas eleições presidenciais do Brasil e foi eleito para seu quarto mandato não consecutivo. O Tribunal Regional Eleitoral local ordenou o restabelecimento imediato da frota de ônibus e prendeu o secretário municipal de transporte, Pablo Souza, suspeito de crime eleitoral e desobediência, mas o mandado não pôde ser cumprido porque Souza estava em Paris.", "titulo_pt": "Atualizações da corrida presidencial do Brasil: líderes mundiais saúdam Lula em seu histórico vitória eleitoral enquanto Bolsonaro recusa-se a ceder", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 226674, "titulo": "Serbia Erupts in Celebration as Aleksandar Vucic’s Long Rule Ends", "url": "https://balkaninsight.com/2026/10/26/serbia-erupts-in-celebration-as-aleksandar-vucics-long-rule-ends/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-10-26T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pessoas saíram às ruas em várias cidades da Sérvia para comemorar a vitória da lista de oposição, marcando o fim do governo do líder autoritário Aleksandar Vucic e de seu Partido Progressista Sérvio, que estava no poder por 14 anos.", "titulo_pt": "Sérvia explode em comemoração ao fim do longo governo de Aleksandar Vucic", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 226527, "titulo": "Macron makes surprise visit to Marseille after protest clashes", "url": "https://www.lemonde.fr/en/france/article/2026/10/26/france-s-macron-in-surprise-visit-to-marseille-after-protest-clashes_6764387_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-26T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente francês fará uma visita inesperada à cidade de Marseilles na segunda-feira, após duas semanas de protestos em todo o país.", "titulo_pt": "Macron faz visita surpresa a marseilles após protestos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 226458, "titulo": "Brexit deal is not good enough for British public, says Andy Burnham", "url": "https://www.theguardian.com/politics/2026/oct/26/brexit-deal-not-good-enough-andy-burnham", "fonte_id": "guardian_world", "data_pub": "2026-10-26T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Andy Burnham afirmou que o Brexit não cumpriu as promessas feitas à população e prejudicou a economia. O chefe do partido trabalhista também disse que não haverá grandes mudanças antes das eleições no atual parlamento.", "titulo_pt": "Brexit não cumpre promessas e prejudica economia, diz Andy Burnham", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 226522, "titulo": "Brazil: Lula defeats Bolsonaro, winning fourth presidential term after massive turnout", "url": "https://www.lemonde.fr/en/international/article/2026/10/26/lula-defeats-bolsonaro-winning-fourth-term-as-brazil-president-after-massive-turnout_6764386_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-26T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva venceu a eleição presidencial, conquistando seu quarto mandato após ficar em segundo lugar no primeiro turno. O candidato da esquerda obteve uma grande adesão eleitoral.", "titulo_pt": "Lula vence eleição, conquistando quarto mandato após primeiro turno", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 226675, "titulo": "Albanian Prime Minister Announces New Anti-Protest Legislation", "url": "https://balkaninsight.com/2026/10/26/albanian-prime-minister-announces-new-anti-protest-law/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-10-26T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro da Albânia, Edi Rama, anunciou novas medidas para combater a 'anarquia urbana' após violência durante protestos anti-governo no fim de semana, onde um manifestante teve o olho ferido por uma bala de borracha.", "titulo_pt": "Primeiro-ministro da albânia anuncia novas medidas antiprotesto", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 226459, "titulo": "Serbia wakes up to new reality after student-led movement ousts Vučić – Europe live", "url": "https://www.theguardian.com/world/live/2026/oct/26/serbia-vucic-elections-students-bulgaria-france-urkaine-russia-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-10-26T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Serbia acordou para uma nova realidade após um movimento liderado por estudantes derrubou o presidente autoritário Aleksandar Vučić. O premiê da Hungria, Péter Magyar, que assumiu o poder após derrubar Viktor Orbán, expressou sua simpatia pelas recentes eleições serbias, fazendo comparações entre as vitórias de ambos.", "titulo_pt": "Serbia acorda com nova realidade após movimento estudantil derruba Vučić – Europa em tempo real", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 226651, "titulo": "The new India-Pakistan ‘cold war’", "url": "https://www.japantimes.co.jp/commentary/2026/10/26/world/india-pakistan-cold-war/", "fonte_id": "japan_times", "data_pub": "2026-10-26T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Índia retornará às negociações apenas após o Paquistão desmontar, de forma abrangente e verificável, suas redes terroristas patrocinadas pelo Estado.", "titulo_pt": "Nova 'guerra fria' entre Índia e paquistão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 226652, "titulo": "Former Prime Minister Yasuo Fukuda dies at 90", "url": "https://www.japantimes.co.jp/news/2026/10/26/japan/politics/yasuo-fukuda-obituary/", "fonte_id": "japan_times", "data_pub": "2026-10-26T09:03:00Z", "idioma": "en", "provavel_duplicata_de": 226633, "texto_pt": "Yasuo Fukuda, ex-primeiro-ministro do Japão, faleceu aos 90 anos. Ele se tornou o primeiro primeiro-ministro herdeiro em setembro de 2007, assumindo o cargo como filho do ex-líder Takeo Fukuda.", "titulo_pt": "Ex-primeiro-ministro Yasuo Fukuda morre aos 90 anos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 226653, "titulo": "Argentina’s economic chainsaw massacre", "url": "https://www.japantimes.co.jp/commentary/2026/10/26/world/argentina-chainsaw-massacre/", "fonte_id": "japan_times", "data_pub": "2026-10-26T08:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antes das próximas eleições, o presidente argentino Milei conseguiu recuperar a economia e estabilizar os preços, mas deixou milhões de pessoas na pobreza.", "titulo_pt": "Argentine's economic chainsaw massacre", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 226593, "titulo": "Do Palestinians in Gaza expect anything to change after Israel’s election?", "url": "https://www.aljazeera.com/news/2026/10/26/do-palestinians-in-gaza-expect-anything-to-change-after-israels-election?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-26T08:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Palestinos em Gaza perguntam se a eleição israelense terá algum impacto em seu futuro, após anos de guerra, deslocamento e restrições.", "titulo_pt": "Palestinos em Gaza esperam alguma mudança após a eleição israelense?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 226594, "titulo": "Lula’s victory may be a turning point for Latin America", "url": "https://www.aljazeera.com/opinions/2026/10/26/lulas-victory-may-be-a-turning-point-for-latin-america?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-26T08:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O resultado da eleição presidencial no Brasil mostra que a onda do extremismo de direita na América Latina não era inevitável.", "titulo_pt": "Vitória do lula pode ser um ponto de virada para a américa latina", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 226654, "titulo": "How purchases of sanctioned Iranian jet fuel were disguised by Myanmar", "url": "https://www.japantimes.co.jp/news/2026/10/26/asia-pacific/crime-legal/sanction-iran-jet-fuel-myanmar/", "fonte_id": "japan_times", "data_pub": "2026-10-26T08:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As compras de combustível de avião iraniano sancionado foram disfarçadas através do Myanmar, sugerindo que as sanções americanas estão tendo efeito, mas o combustível iraniano continua a ser fornecido.", "titulo_pt": "Compras de combustível de avião iraniano sancionado foram disfarçadas pelo Myanmar", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 226685, "titulo": "China may well be the next big competitor for Asian migrant labour", "url": "https://www.scmp.com/opinion/china-opinion/article/3371970/china-may-well-be-next-big-competitor-asian-migrant-labour", "fonte_id": "scmp", "data_pub": "2026-10-26T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China era um dos maiores países exportadores de mão-de-obra migrante por décadas, com seus trabalhadores ocupando fábricas em casa e construindo infraestrutura no exterior. No entanto, o declínio demográfico pode eventualmente levar o país a considerar a importação em massa de trabalhadores.", "titulo_pt": "China pode se tornar o próximo grande concorrente na busca por trabalhadores asiáticos migrantes", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 226385, "titulo": "Carf rejeita anular provas da Lava Jato em caso da Galvão Engenharia", "url": "https://www.jota.info/tributos/carf-rejeita-anular-provas-da-lava-jato-em-caso-da-galvao-engenharia", "fonte_id": "jota", "data_pub": "2026-10-26T09:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petição solicitava a anulação de um auto de infração, alegando o uso de provas inválidas pelo STF no caso da Galvão Engenharia. O Carf rejeitou tal solicitação.", "titulo_pt": "Carf rejeita anulação de provas da Lava Jato no caso Galvão Engenharia", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 226655, "titulo": "Chinese beauty brands, flush with success at home, start to vie for global shelf space", "url": "https://www.japantimes.co.jp/business/2026/10/26/chinese-beauty-brands-global/", "fonte_id": "japan_times", "data_pub": "2026-10-26T08:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Marcas de beleza chinesas, que têm tido sucesso no mercado doméstico, começam a buscar espaço nas prateleiras globais. Executivos da indústria falam de uma crescente confiança de que produtos chineses serão bem aceitos pelo consumidor mundial.", "titulo_pt": "Marcas de beleza chinesas buscam espaço global com sucesso doméstico", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 226391, "titulo": "Temas consolidados e emergentes do ESG", "url": "https://www.jota.info/opiniao-e-analise/colunas/praticas-esg/temas-consolidados-e-emergentes-do-esg", "fonte_id": "jota", "data_pub": "2026-10-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisas bibliométricas indicam que o tema ESG (Sustentabilidade Ambiental, Social e de Governança) madureira na academia e apontam para novos debates emergentes.", "titulo_pt": "Temas consolidados e emergentes do ESG", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 226392, "titulo": "O combate à lavagem e o futuro do mercado de ativos judiciais", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-combate-a-lavagem-e-o-futuro-do-mercado-de-ativos-judiciais", "fonte_id": "jota", "data_pub": "2026-10-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nova Resolução 5.343 do CMN visa combater fraudes no mercado de ativos judiciais, mas pode limitar o mercado legítimo, que valeria R$ 35 bilhões no país.", "titulo_pt": "Nova resolução do cmn visa combater fraudes, mas pode afetar mercado de r$ 35 bilhões", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 226688, "titulo": "Could new US investment curbs complicate China’s biotech licensing surge?", "url": "https://www.scmp.com/business/article/3372151/could-new-us-investment-curbs-complicate-chinas-biotech-licensing-surge", "fonte_id": "scmp", "data_pub": "2026-10-26T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas biotecnológicas chinesas enfrentam novos desafios em suas expansões globais, devido às propostas de restrições de investimento externo do governo americano, que podem interferir nas estruturas de negócios, embora os acordos de licenciamento de medicamentos permaneçam inalterados por now. Segundo analistas, essas medidas podem dificultar a atração de investimentos diretos americanos ou a formação de joint ventures pelas empresas chinesas.", "titulo_pt": "Novas restrições de investimento dos EUA podem complicar expansão global da biotecnologia chinesa?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 226726, "titulo": "(2nd LEAD) Seoul shares dip over 1 pct ahead of earnings reports, Fed decision", "url": "https://en.yna.co.kr/view/AEN20261026006452320", "fonte_id": "yonhap_news", "data_pub": "2026-10-26T07:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações de Seul encerraram com perdas de mais de 1% na segunda-feira, seguindo perdas no mercado devido a relatórios de resultados e a decisão do Federal Reserve previstos para o mesmo dia.", "titulo_pt": "Seul perde 1% antes de divulgação de resultados e decisão do federal reserve", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 226587, "titulo": "Oil price falls back as traders remain focused on Middle East conflict", "url": "https://www.ft.com/content/97a60042-f7b6-4c87-9387-8572968a7de0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-26T07:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O preço do petróleo caiu após subir para $117 na semana passada, mantendo-se focado na situação de conflito no Oriente Médio.", "titulo_pt": "Preço do petróleo cai após alta para $117 na semana passada", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 226448, "titulo": "UK poised to miss reduced aid spending target of 0.3% of national income", "url": "https://www.theguardian.com/politics/2026/oct/26/uk-international-aid-target-spending-shortfall-budget-research", "fonte_id": "guardian_world", "data_pub": "2026-10-26T06:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As estimativas do Center for Global Development indicam que o Reino Unido pode gastar £410 milhões menos em ajuda internacional do que planejado no próximo ano. O país corre o risco de não atingir seu objetivo de gastar 0,3% do PIB com ajuda internacional até o final de 2027, com um déficit previsto de cerca de £400 milhões.", "titulo_pt": "Reino unido pode não atingir meta de gastos reduzidos com ajuda internacional", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 226528, "titulo": "EU to charge two-euro handling fee on packages from outside bloc", "url": "https://www.lemonde.fr/en/international/article/2026/10/26/eu-to-charge-two-euro-handling-fee-on-packages-from-outside-bloc_6764287_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-26T06:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A partir de novembro, uma taxa de dois euros será cobrada em todos os pacotes enviados para consumidores de fora da União Europeia.", "titulo_pt": "Ue vai cobrar taxa de dois euros em pacotes vindos de fora do bloco", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 226588, "titulo": "Singapore to store Saudi oil in underground caverns", "url": "https://www.ft.com/content/1baa5eb0-d6e3-4989-beb0-1b29879ff606?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-26T06:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Singapore firmou um acordo com a Saudi Aramco para armazenar petróleo em cavernas subterrâneas, visando garantir os suprimentos de energia para a Ásia do Sul durante a interrupção causada pela guerra no Oriente Médio.", "titulo_pt": "Singapura vai armazenar petróleo saudita em cavernas subterrâneas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 226554, "titulo": "Oil slides over 2% as traders weigh Saudi attack risks, demand destruction", "url": "https://www.cnbc.com/2026/10/26/oil-prices-today-wti-brent.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-26T05:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços do petróleo caíram após investidores ponderarem o risco de novos ataques à infraestrutura energética saudita e as preocupações de que preços elevados possam reduzir a demanda.", "titulo_pt": "Petróleo cai mais de 2% diante dos riscos de ataques e possível redução da demanda", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 226150, "titulo": "O que muda no seu bolso com a reeleição de Lula", "url": "https://exame.com/invest/minhas-financas/o-que-muda-no-seu-bolso-com-a-reeleicao-de-lula/", "fonte_id": "exame", "data_pub": "2026-10-26T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reeleição de Lula pode impactar o orçamento das famílias por meio do salário mínimo, aposentadoria, impostos, juros e dívidas.", "titulo_pt": "O que muda no seu bolso com a reeleição de Lula", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 226152, "titulo": "O que acontece com as ações da Petrobras e do Banco do Brasil com Lula reeleito", "url": "https://exame.com/invest/mercados/petrobras-banco-do-brasil-acoes-lula-reeleito/", "fonte_id": "exame", "data_pub": "2026-10-26T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O petróleo alto beneficia as ações da Petrobras, enquanto o calote no setor agrícola pressiona as ações do Banco do Brasil.", "titulo_pt": "O que acontece com as ações da Petrobras e do Banco do Brasil com Lula reeleito", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 226153, "titulo": "Onde investir na renda fixa com Lula reeleito: Tesouro Selic, prefixado ou IPCA+?", "url": "https://exame.com/invest/mercados/renda-fixa-lula-reeleito-onde-investir/", "fonte_id": "exame", "data_pub": "2026-10-26T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O investimento em renda fixa com Lula reeleito pode variar dependendo das condições de mercado. Os títulos pós-fixados ganham força com juros altos por mais tempo, enquanto os prefixados e os com índice IPCA+ podem oscilar devido à incerteza fiscal do novo mandato.", "titulo_pt": "Onde investir na renda fixa com Lula reeleito: tesouro Selic, prefixado ou IPCA+?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 226154, "titulo": "Com Lula reeleito, quais ações sofrem mais na bolsa e quais devem resistir", "url": "https://exame.com/invest/onde-investir/lula-reeleito-acoes-bolsa/", "fonte_id": "exame", "data_pub": "2026-10-26T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ações de empresas endividadas podem sofrer com juros mais altos, enquanto exportadoras e seguradoras devem resistir nos mercados de ações.", "titulo_pt": "Com Lula reeleito, quais ações sofrem mais na bolsa e quais devem resistir", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 226584, "titulo": "The reclusive quant billionaire coming into the light", "url": "https://www.ft.com/content/bc6bba42-0b33-4825-a2c5-cff9b8f5c591?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-26T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Peter de Putron tem mantido um perfil baixo por décadas, mas sua ampla gama de interesses está agora ganhando mais atenção.", "titulo_pt": "O bilionário quant reservado que está ganhando destaque", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 226788, "titulo": "Venture Kick backs CHD with €160K to advance remote pregnancy monitoring", "url": "https://tech.eu/2026/10/26/venture-kick-backs-chd-with-eur160k-to-advance-remote-pregnancy-monitoring/", "fonte_id": "tech_eu", "data_pub": "2026-10-26T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup medtech CHD (Connected Health Development) recebeu aproximadamente €160.000 de Venture Kick para desenvolver suas soluções digitais para o monitoramento remoto da gravidez e do feto.", "titulo_pt": "Venture Kick investe €160K na CHD para avançar no monitoramento remoto da gravidez", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 226718, "titulo": "KB Kookmin Bank finds 2,091 more people affected by data leak", "url": "https://en.yna.co.kr/view/AEN20261026010200315", "fonte_id": "yonhap_news", "data_pub": "2026-10-26T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "KB Kookmin Bank informou que mais 2.091 pessoas foram afetadas por uma violação de dados. O anúncio foi feito em Seul em 26 de outubro.", "titulo_pt": "KB Kookmin Bank identifica 2.091 novos casos de vazamento de dados", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 226256, "titulo": "Exynos 2700 supera Snapdragon em testes, mas chip do Galaxy S27 ainda é incerto", "url": "https://canaltech.com.br/smartphone/exynos-2700-supera-snapdragon-em-testes-mas-galaxy-s27-ainda-gera-duvidas/", "fonte_id": "canaltech", "data_pub": "2026-10-26T09:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Exynos 2700, supostamente o processador do próximo Galaxy S27, superou os chips Snapdragon 8 Elite Gen 6 em testes internos, mas ainda não está claro qual chip será usado no dispositivo final.", "titulo_pt": "Exynos 2700 supera Snapdragon em testes, mas chip do Galaxy S27 ainda é incerto", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 226741, "titulo": "Meet the AI Agents Trying to Be Real-Life Journalists", "url": "https://www.wired.com/story/ai-agents-are-trying-to-be-journalists-now/", "fonte_id": "wired", "data_pub": "2026-10-26T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jayden, Sam e Zack são agentes de inteligência artificial que estão apresentando histórias jornalísticas e reportagens de investigação para editores. O que distingue esses agentes de outros é que eles são completamente autônomos e gerados por IA.", "titulo_pt": "Conheça os agentes de IA que estão tentando ser jornalistas reais", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 226649, "titulo": "Driverless trucks show how to keep AI from killing us", "url": "https://www.japantimes.co.jp/commentary/2026/10/26/world/driverless-trucks-ai-safetly/", "fonte_id": "japan_times", "data_pub": "2026-10-26T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Veículos autônomos têm uma tarefa específica e um rastro de codificação, oferecendo um modelo mais simples que serve como uma 'verificação de sanidade' para prevenir manobras perigosas.", "titulo_pt": "Caminhões autônomos mostram como evitar que a IA nos cause dano", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 226650, "titulo": "Government holds urgent cybersecurity meeting in response to recent data breaches", "url": "https://www.japantimes.co.jp/news/2026/10/26/japan/japan-government-cybersecurity/", "fonte_id": "japan_times", "data_pub": "2026-10-26T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo realizou uma reunião urgente de segurança cibernética na segunda-feira à noite em resposta a uma solicitação da GMO Internet Group para que o governo adotasse medidas contra recentes violações de dados.", "titulo_pt": "Governo realiza reunião urgente de segurança cibernética em resposta a violações de dados", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 226344, "titulo": "La IA podría hacernos recordar cosas que nunca ocurrieron, según distintos estudios", "url": "https://www.latercera.com/tendencias/noticia/la-ia-podria-hacernos-recordar-cosas-que-nunca-ocurrieron-segun-distintos-estudios/", "fonte_id": "la_tercera", "data_pub": "2026-10-26T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Estudos indicam que as tecnologias de inteligência artificial gerativa podem afetar a forma como nos lembramos de eventos. Além disso, há alertas sobre os riscos associados à dependência dessas tecnologias.", "titulo_pt": "IA poderia nos fazer lembrar de coisas que nunca ocorreram, dizem estudos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 226789, "titulo": "European tech weekly recap: €1.5B in funding and Q3 2026 highlights", "url": "https://tech.eu/2026/10/26/european-tech-weekly-recap-eur15b-in-deals-and-q3-2026-highlights/", "fonte_id": "tech_eu", "data_pub": "2026-10-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No último período, foram registradas mais de 65 transações de financiamento tecnológico com valor superior a 1,5 bilhão de euros e mais de 4 saídas, transações de aquisição e notícias relacionadas na Europa. O relatório Q3 de 2026 abordou esses desenvolvimentos.", "titulo_pt": "Resumo semanal europeu de tecnologia: mais de 1,5 bilhão em financiamento e destaque do Q3 de 2026", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 226790, "titulo": "Swedish AI browser Strawberry takes on US AI heavy hitters as comes out of beta", "url": "https://tech.eu/2026/10/26/swedish-ai-browser-strawberry-takes-on-us-ai-heavy-hitters-as-comes-out-of-beta/", "fonte_id": "tech_eu", "data_pub": "2026-10-26T08:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma startup sueca, apoiada por investidores como a General Catalyst e os fundadores de Lovable e Hugging Face, lançou sua versão final de um navegador com assistentes de IA integrados. A empresa se posiciona como uma alternativa para empresas.", "titulo_pt": "Navegador sueco com assistente de IA enfrenta grandes players americanos de IA", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 226791, "titulo": "Leeds AI spinout adsilico raises £10M to test medical devices on virtual patients", "url": "https://tech.eu/2026/10/26/leeds-ai-spinout-adsilico-raises-ps10m-to-test-medical-devices-on-virtual-patients/", "fonte_id": "tech_eu", "data_pub": "2026-10-26T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A spinoff da Universidade de Leeds, adsilico, levantou £10 milhões em uma rodada de financiamento série A para expandir sua tecnologia de simulação baseada em IA para avaliar o desempenho de dispositivos médicos em pacientes virtuais diversificados.", "titulo_pt": "Spinoff da universidade de leeds raised £10M para testar dispositivos médicos em pacientes virtuais", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 226689, "titulo": "Chinese video AI models beat US rivals in visual quality, but lag on safeguards: HKU study", "url": "https://www.scmp.com/tech/tech-trends/article/3372107/chinese-video-ai-models-beat-us-rivals-visual-quality-lag-safeguards-hku-study", "fonte_id": "scmp", "data_pub": "2026-10-26T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Universidade de Hong Kong mostrou que modelos de geração de vídeo de inteligência artificial chineses superaram rivais americanos em qualidade visual, mas alguns ficaram atrás em medidas de segurança. O Seedance 2.0 Pro, do ByteDance, liderou a classificação de 12 modelos de IA de geração de vídeo, com uma pontuação de 3,84 em qualidade visual.", "titulo_pt": "Modelos de IA chineses de vídeo superam americanos em qualidade visual, mas caem atrás em segurança", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 226792, "titulo": "Nous lands $17M to bring AI-powered household management to more homes", "url": "https://tech.eu/2026/10/26/nous-lands-17m-to-bring-ai-powered-household-management-to-more-homes/", "fonte_id": "tech_eu", "data_pub": "2026-10-26T08:00:00Z", iferentes", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 226776, "titulo": "The 4 stages of women’s heart health: Experts present new framework", "url": "https://www.statnews.com/2026/10/26/heart-health-women-four-life-stages-qa-sadiya-khan/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo guia apresenta um quadro com quatro fases distintas do bem-estar cardíaco feminino, visando auxiliar meninas e mulheres, bem como os médicos, a identificar essas fases.", "titulo_pt": "As 4 fases da saúde cardíaca feminina: especialistas apresentam novo quadro", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 226796, "titulo": "What are microchimeric cells doing to our brain?", "url": "https://www.newscientist.com/article/2595503-what-are-microchimeric-cells-doing-to-our-brain/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-26T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sabe-se que células trocadas durante a gravidez podem se estabelecer no cérebro. Este artigo explora a possibilidade de que essas células influenciem o desenvolvimento, a saúde ou o comportamento das mulheres após o parto.", "titulo_pt": "O que as células microcimeras estão fazendo com o nosso cérebro?", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 226777, "titulo": "STAT+: Moderna CEO on what’s next after success in cancer vaccine", "url": "https://www.statnews.com/2026/10/26/moderna-ceo-stephane-bancel-interview-cancer-vaccine-intismeran/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-26T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da Moderna, Stéphane Bancel, discute os próximos passos após o recente sucesso na vacina contra câncer e como isso afeta a estratégia de negócios da go tempo?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 226228, "titulo": "Corvos tomam decisões duas vezes mais rápido que humanos, conclui pesquisadores da Alemanha", "url": "https://www.cnnbrasil.com.br/ciencia/corvos-tomam-decisoes-duas-vezes-mais-rapido-que-humanos-conclui-pesquisadores-da-alemanha/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-26T06:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Alemanha descobriram que gralhas-pretas tomam decisões duas vezes mais rápido que humanos, levando apenas 235 milissegundos para identificar movimentos e escolher direções em testes.", "titulo_pt": "Corvos tomam decisões duas vezes mais rápido que humanos, concluem pesquisadores da Alemanha", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 226229, "titulo": "Astrônomos afirmam que “A Noite Estrelada” de Van Gogh pode ter sido inspirada por um fenômeno celeste real", "url": "https://www.cnnbrasil.com.br/ciencia/astronomos-afirmam-que-a-noite-estrelada-de-van-gogh-pode-ter-sido-inspirada-por-um-fenomeno-celeste-real/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-26T06:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores sul-coreanos identificaram a posição exata de estrelas e planetas visíveis no sul da França em julho de 1889. Essa descoberta sugere que o quadro 'A Noite Estrelada' de Van Gogh pode ter sido inspirado por um fenômeno celeste real.", "titulo_pt": "Astrônomos sugerem que 'A Noite Estrelada' de Van Gogh foi inspirada por fenômeno celeste real", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 226794, "titulo": "2026 October 26 – M42: The Great Nebula in Orion", "url": "https://science.nasa.gov/image-article/2026-october-26-m42-the-great-nebula-in-orion/", "fonte_id": "nasa_news", "data_pub": "2026-10-26T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do APOD de 26 de outubro de 2026 apresenta a Nuvem de Orion (M42), uma nebulosa interestelar visível no céu noturno. É uma das estruturas celestes mais conhecidas e estudadas.", "titulo_pt": "26 De outubro de 2026 – nuvem de Orion (M42)", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 226795, "titulo": "Hunting Red Leaves with Satellites", "url": "https://science.nasa.gov/earth/earth-observatory/hunting-red-leaves-with-satellites/", "fonte_id": "nasa_news", "data_pub": "2026-10-26T04:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um satélite moderno permite explorar a tradição antiga de observar as folhas vermelhas de uma maneira totalmente nova.", "titulo_pt": "Caçando folhas vermelhas com satélites", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 226784, "titulo": "A simple liquid can stop cavities without drilling, major study confirms", "url": "https://www.sciencedaily.com/releases/2026/10/261025222339.htm", "fonte_id": "science_daily", "data_pub": "2026-10-26T02:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um líquido simples, aplicado em poucos segundos sobre os dentes, pode prevenir cáries sem a necessidade de furar os dentes, injetar anestésico ou realizar cirurgias, conforme confirma um grande estudo clínico envolvendo crianças jovens. Este tratamento econômico poderia evitar milhares de procedimentos dentários dolorosos e cirurgias nas crianças.", "titulo_pt": "Um líquido simples pode prevenir cáries sem furar os dentes", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}], "ciencia__eventos": [], "cultura": [{"id": 226680, "titulo": "Why China’s heritage-listed Dog-Carrying Festival honours canines as sacred lifesavers", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3372156/why-chinas-heritage-listed-dog-carrying-festival-honours-canines-sacred-lifesavers", "fonte_id": "scmp", "data_pub": "2026-10-26T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "
