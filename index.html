<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 25/07/2026 20:29 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">

  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "25/07/2026 20:29", "stats": {"noticias_novas": 134, "resumos_gerados": 156}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Partido Trabalhista (PT) lançou Gleisi Hoffmann e Dr. Rosinha como candidatos ao Senado do Paraná, enquanto o Republicanos apresentou a candidatura de Anthony Garotinho para governador do Rio de Janeiro. O PL oficializou a candidatura de Flávio Bolsonaro à Presidência da República durante sua convenção nacional em São Paulo, onde Javier Milei também participou e chamou o ministro do STF, Alexandre Moraes, de 'lixo careca'. Em resposta, Edson Fachin, presidente do STF, disse que as declarações são incompatíveis com a civilidade. O PT também confirmou uma aliança com o MDB para as eleições no Pará e definiu Dirceu Ten Caten como vice-governador na chapa de Hana Ghassan.", "mundo": "Um evento de grande repercussão ocorreu durante as celebrações do Orgulho LGBT+ em Berlim, na Alemanha. No sábado à noite, um veículo atingiu a multidão perto da Porta de Brandenburgo, resultando em uma morte e 15 feridos graves. A polícia está buscando o condutor do veículo. Este incidente interrompeu as comemorações, que são conhecidas localmente como Christopher Street Day (CSD). Em outro desenvolvimento internacional, o Irã acusou a Ucrânia de um ataque naval no Mar do Cáspio, resultando na morte de um marinheiro. A Rússia prepara-se para receber 30.000 soldados sul-coreanos para o conflito na Ucrânia, conforme informado pelo presidente Zelenskyy. Além disso, a administração Trump enfrenta críticas por suas políticas internas e externas, com o Tribunal dos EUA impedindo a implementação de um decreto que endurece as regras para votação por correio em 23 estados do país.\n\nOs Estados Unidos interromperam suas incursões noturnas contra alvos iranianos após 13 noites consecutivas de ataques, marcando o fim de uma escalada militar que durou quase duas semanas. O presidente Donald Trump instruiu o Exército a não realizar novas operações militares na sexta-feira, embora ainda não esteja claro se essa pausa é temporária ou permanente. A decisão de Washington levanta dúvidas sobre sua estratégia na guerra e vem em um momento em que as críticas ao conflito com o Irã aumentam. Em outro desenvolvimento geopolítico significativo, a Índia enfrenta pressões internas após a renúncia do ministro da Educação Dharmendra Pradhan, após 36 dias de protestos contínuos liderados pelo partido Cockroach Janta. O incidente abalou o governo do primeiro-ministro Narendra Modi e destacou as tensões políticas no país. Além disso, a Arábia Saudita acusou os hutíes, apoiados pelo Irã, de uma 'escalada perigosa' após ataques em Yemen, enquanto o grupo hutí respondeu criticando a televisão estatal iraniana por censura. Estas tensões regionais refletem a complexidade e instabilidade da região do Oriente Médio.", "economia": "Os preços do gasolina e diesel no mercado interno da Taiwan serão aumentados na próxima semana, conforme anunciado pelo CPC (Comitê de Preços de Petróleo). Em outra notícia econômica internacional, as compras de joias por consumidores japoneses estão impulsionando significativamente as vendas de joias. No Brasil, a XP realizou a Liga XP Awards 2026, reconhecendo assessores e líderes da empresa nas categorias de Top Assessores, Top Líderes, Top Pessoa Jurídica, Top Estratégia e Top Consultores. A W1 foi eleita a melhor assessoria do país, enquanto Pedro Figueira, da Alianco, recebeu o título de melhor assessor no Brazil Advisor Awards. As pequenas empresas brasileiras estão entrando com ações judiciais contra as novas tarifas impostas por Trump, que retomou as tarifas comerciais após retornar ao cargo. O conflito no Irã elevou os preços do petróleo, contribuindo para o aumento das tarifas de importação nos Estados Unidos. Além disso, a Petrobras anunciou que a plataforma P-52 está fechada há nove meses e pode não retornar até 2026, afetando significativamente as operações na Bacia de Campos.", "tecnologia": "Em San Francisco, o presidente da Coreia do Sul, Yoon Suk Yeol, afirmou que a era da inteligência artificial (IA) oferece uma nova oportunidade para seu país. Esta declaração ocorre em um contexto global onde mais de 200 economistas e pesquisadores de IA assinaram uma carta aberta alertando sobre as potenciais transformações econômicas trazidas pela IA, comparáveis à Revolução Industrial, e a necessidade urgente de criar instituições adequadas. Paralelamente, a GAC está oferecendo descontos significativos em praticamente toda sua linha no Brasil, com destaque para o SUV GS4 Premium, que teve um desconto de R$ 37 mil. Além disso, a Amazon promove três opções de smartwatches: Samsung Galaxy Fit3 e outros modelos não especificados. Estes dispositivos oferecem diferentes opções para atender às necessidades dos usuários.", "ciencia": "Um estudo recente publicado na revista International Journal of Enterprise Network Management revela que os usuários de mídias sociais têm um papel mais significativo no compartilhamento de informações falsas do que se pensava. Os pesquisadores sugerem que as iniciativas para combater a 'fake news' devem concentrar-se tanto na compreensão dos motivos pelos quais os usuários compartilham informações enganosas quanto em identificar aqueles que criam conteúdo enganoso. Além disso, uma pesquisa liderada por Taiwan analisou falantes de mandarim e mostrou que os sons que ouvimos e produzimos estão profundamente influenciados por nossa experiência linguística anterior, fornecendo novas perspectivas sobre como humanos aprendem e utilizam a língua. Estudos científicos abordando desde a biodiversidade das pradarias até o comportamento dos camundongos adultos em manter memórias jovens semelhantes ao autismo, passando por novas descobertas arqueológicas e avanços tecnológicos para detectar buracos negros, mostram a amplidão do campo científico atual.", "cultura": "O evento mais significativo da edição foi o atropelamento durante a celebração do Orgulho de Berlim, que resultou na suspensão do desfile. De acordo com relatos, um veículo invadiu uma multidão no Parque Tiergarten, perto da Porta de Brandemburgo, ferindo várias pessoas. A polícia intensificou as buscas por suspeitos e aumentou a segurança na região. O incidente levou à cancelamento do evento, que estava sendo realizado com grande entusiasmo pelos participantes. Em outro momento cultural importante, a escritora Nathacha Appanah foi destaque na 24ª Festa Literária Internacional de Paraty (Flip), discutindo temas como violência doméstica e o impacto histórico em mulheres angolanas. A poeta Ana Paula Tavares também participou da Flip, abordando as feridas históricas do país, incluindo o colonialismo e o patriarcado, em uma sessão muito concorrida no evento. Além disso, a cantora Karol G iniciou sua turnê 'Viajando Por El Mundo Tropitour' com um show de três horas no estádio de Chicago, exaltando orgulhosamente suas raízes colombianas e celebrando a cultura latina.", "sociedade": "Um acidente de trânsito ocorreu durante a Parada do Orgulho LGBTQI+ em Berlim, Alemanha, resultando em uma morte e pelo menos 15 feridos. O veículo envolvido foi abandonado no parque Tiergarten. As autoridades estão investigando o caso. Em São Paulo, o governo federal anunciou a liberação de recursos para as cidades afetadas por uma tempestade que deixou um morto e causou danos significativos à infraestrutura. No Brasil, Delson Carlos Barros, jornalista, foi encontrado morto em Goiânia após ser esfaqueado no Setor Bueno. Moradores contestaram a versão da Guarda Civil Municipal sobre uma abordagem policial que resultou na baleação de um homem de 32 anos nas costas. A família do menino Léo Wolschick Soares, em Rio Grande do Sul, busca ajuda para adquirir o medicamento Zolgensma, que custa R$8 milhões e é necessário antes que ele complete 2 anos.", "meio_ambiente": "Mais de 250 mil pessoas tiveram que se deslocar devido aos incêndios florestais na Espanha e França, conforme relatos da CNN Brasil e Taipei Times. Em Madrid e Ávila, as chamas devastaram mais de 25 mil hectares, levando o governo espanhol a declarar estado de emergência nacional. Na França, onde os ventos fortes empurram as chamas na direção de Bordeaux, pelo menos 100 mil pessoas foram evacuadas e o presidente Emmanuel Macron mobilizou as Forças Armadas para auxiliar os bombeiros. Além disso, a China enfrenta um tufão chamado Noul que atingiu a costa entre Shenzhen e Haifeng, com mais de 340 mil pessoas sendo retiradas da região como medida preventiva, conforme informou o Infomoney.", "direitos_humanos": "Volker Turk foi reeleito para mais quatro anos como Alto Comissariado das Nações Unidas para os Direitos Humanos, com 144 votos a favor e 10 contra. Este resultado ocorreu apesar da oposição dos Estados Unidos, Israel e Rússia. Em Berlim, um acidente de trânsito durante a Parada LGBTQIA+ resultou na morte de uma pessoa e deixou pelo menos 15 feridos. Navid Manafi Rasi, que fugiu do Irã por ser gay, compartilhou sua história de liberdade no Brasil após escapar da perseguição religiosa. No Gaza, o conflito israelo-palestiniano está causando um aumento nos nascimentos prematuros e colocando a saúde materna em risco. Foram realizados funerais noturnos para quatro palestinos mortos perto de Nablus. Além disso, no Chile, uma investigação concluiu que um funcionário da Conaf ordenou a inclusão de alertas de evacuação falsos na bitácora do incêndio em Valparaíso. Por fim, os filhos de Lorenzo Salgado Araujo, morto pelo ICE em Texas, expressaram seu luto e pediram responsabilização aos legisladores, afirmando que o pai trabalhava arduamente para proteger a família."}, "resumo_do_dia": {"politica_nacional": [{"id": 72796, "titulo": "PT lança Gleisi Hoffmann e Dr. Rosinha para concorrer ao Senado no PR", "url": "https://www.metropoles.com/brasil/pt-lanca-gleisi-hoffmann-e-dr-rosinha-para-concorrer-ao-senado-no-pr", "fonte_id": "metropoles", "data_pub": "2026-07-25T22:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PT lançou Gleisi Hoffmann e Dr. Rosinha como candidatos ao Senado do Paraná. O partido também apoia Requião Filho para governador no estado, que é o quinto maior colégio eleitoral do país.", "titulo_pt": "PT lança Gleisi Hoffmann e Dr. Rosinha para Senado no PR", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 72811, "titulo": "Republicanos lança em convenção candidatura de Anthony Garotinho ao governo do Rio", "url": "https://www.infomoney.com.br/politica/republicanos-lanca-em-convencao-candidatura-de-anthony-garotinho-ao-governo-do-rio/", "fonte_id": "infomoney", "data_pub": "2026-07-25T22:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Anthony Garotinho apresentou sua candidatura ao governo do Rio de Janeiro durante a convenção do Republicanos. O ex-governador busca retornar à Palácio Guanabara após ter a inelegibilidade suspensa pelo STF.", "titulo_pt": "Republicanos lançam candidatura de Anthony Garotinho ao governo do Rio", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 72787, "titulo": "PDT oficializa Juliana Brizola ao governo do Rio Grande do Sul", "url": "https://www.poder360.com.br/poder-eleicoes-2026/pdt-oficializa-juliana-brizola-ao-governo-do-rio-grande-do-sul/", "fonte_id": "poder360", "data_pub": "2026-07-25T22:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O diretório estadual do PDT oficializou a candidatura de Juliana Brizola para o governo do Rio Grande do Sul nas eleições de 2026.", "titulo_pt": "PDT oficializa Juliana Brizola como candidata ao governo do Rio Grande do Sul", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 72788, "titulo": "Milei dança rock com Flávio Bolsonaro em convenção do PL", "url": "https://www.poder360.com.br/poder-eleicoes/milei-danca-rock-com-flavio-bolsonaro-em-convencao-do-pl/", "fonte_id": "poder360", "data_pub": "2026-07-25T22:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro e Matheus Mol, conhecido como Milei, dançaram rock durante a convenção do PL. O presidente argentino também se apresentou no evento, dançando à música 'Panic Show', da banda La Renga.", "titulo_pt": "Milei e Flávio Bolsonaro dançam rock em convenção do PL", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 72813, "titulo": "TSE convida diplomatas americanos para explicar funcionamento da urna eletrônica", "url": "https://www.infomoney.com.br/mercados/tse-convida-diplomatas-americanos-para-explicar-funcionamento-da-urna-eletronica/", "fonte_id": "infomoney", "data_pub": "2026-07-25T22:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) recebeu uma solicitação da Embaixada dos Estados Unidos para explicar o funcionamento das urnas eletrônicas. O Itamaraty negou vistos a dois diplomatas americanos que pretendiam visitar o Brasil para discutir sobre eleições.", "titulo_pt": "TSE convida diplomatas americanos para explicar funcionamento da urna eletrônica", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 72798, "titulo": "Presidente do PT repudia fala de Milei em evento do PL: \"Inadmissível\"", "url": "https://www.metropoles.com/brasil/presidente-do-pt-repudia-fala-de-milei-em-evento-do-pl-inadmissivel", "fonte_id": "metropoles", "data_pub": "2026-07-25T22:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Edinho Silva, presidente nacional do PT, criticou as declarações de Javier Milei durante um evento do PL, chamando sua fala de 'inadmissível'. Silva também afirmou que Milei 'não está a altura do cargo que ocupa'.", "titulo_pt": "Presidente do PT repudia fala de Milei em evento do PL", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 72785, "titulo": "PL oficializa candidatura de Flávio Bolsonaro à Presidência", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-07/pl-oficializa-candidatura-de-flavio-bolsonaro-presidencia", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-07-25T21:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido Liberal (PL) oficializou a candidatura de Flávio Bolsonaro à Presidência da República durante sua Convenção Nacional, realizada no Mercado Pago Hall, na Arena Pacaembu. O evento reuniu lideranças e políticos do campo da direita.", "titulo_pt": "PL oficializa candidatura de Flávio Bolsonaro à Presidência", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 72189, "titulo": "Milei chama Moraes de “lixo careca”, e Fachin rebate: “Desrespeitoso”", "url": "https://www.poder360.com.br/poder-justica/milei-chama-moraes-de-lixo-careca-e-fachin-rebate-desrespeitoso/", "fonte_id": "poder360", "data_pub": "2026-07-25T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milei, um político, chamou Moraes de 'lixo careca'. Em resposta, Fachin acusou Milei de desrespeitoso. Milei também participou do evento que lançou Flávio Bolsonaro como candidato à Presidência.", "titulo_pt": "Milei chama Moraes de ‘lixo careca’, e Fachin o acusa de desrespeitoso", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 72298, "titulo": "As lágrimas de Flávio Bolsonaro e o aceno eleitoral do filho de Jair às mulheres", "url": "https://apublica.org/2026/07/as-lagrimas-de-flavio-bolsonaro-e-o-aceno-eleitoral-do-filho-de-jair-as-mulheres/", "fonte_id": "agencia_publica", "data_pub": "2026-07-25T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro enfatiza sua esposa como forma de atrair o apoio feminino, enquanto enfrenta tensões com Michelle. O filho do presidente tem menos apoio entre as mulheres do que Lula.", "titulo_pt": "Lágrimas e acenos: Flávio Bolsonaro destaca esposa para atrair voto feminino", "veiculo": "Agência Pública", "pais": "Brasil", "classe": "B"}, {"id": 72302, "titulo": "Entenda as regras do TSE para vídeos e imagens com IA nas eleições", "url": "https://www.cnnbrasil.com.br/eleicoes/entenda-as-regras-do-tse-para-videos-e-imagens-com-ia-nas-eleicoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-25T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Vídeo que imitou Jair Bolsonaro durante a convenção do PL pode levantar dúvidas sobre as regras estabelecidas pelo TSE para o uso de imagens e áudios com IA nas eleições.", "titulo_pt": "Entenda as regras do TSE para vídeos e imagens com IA nas eleições", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 72190, "titulo": "PDT oficializa candidatura de Requião Filho ao governo do Paraná", "url": "https://www.poder360.com.br/poder-eleicoes/pdt-oficializa-candidatura-de-requiao-filho-ao-governo-do-parana/", "fonte_id": "poder360", "data_pub": "2026-07-25T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O diretório estadual do PDT oficializou a candidatura de Requião Filho ao governo do Paraná para as eleições de 2026.", "titulo_pt": "PDT oficializa candidatura de Requião Filho ao governo do Paraná", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 72303, "titulo": "Fachin reage após Milei chamar Moraes de “lixo careca”: “Desrespeitosa”", "url": "https://www.cnnbrasil.com.br/politica/fachin-reage-apos-milei-chamar-moraes-de-lixo-careca-desrespeitosa/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-25T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, Dias Toffoli, reagiu após o deputado argentino Matías Milei chamar o ministro Alexandre Moraes de 'lixo careca', afirmando que a declaração é incompatível com a civilidade nas relações entre Estados.", "titulo_pt": "Toffoli reage após Milei chamar Moraes de ‘lixo careca’", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 72191, "titulo": "Carla Zambelli reaparece nas redes e apoia mãe como pré-candidata", "url": "https://www.poder360.com.br/poder-gente/carla-zambelli-reaparece-nas-redes-e-apoia-mae-como-pre-candidata/", "fonte_id": "poder360", "data_pub": "2026-07-25T21:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Carla Zambelli, ex-deputada condenada pelo STF, anunciou o apoio à mãe, Rita Zambelli, que será pré-candidata a deputada federal pelo PL em São Paulo. Carla permanecerá na Itália.", "titulo_pt": "Carla Zambelli apoia mãe como pré-candidata e se mantém na Itália", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 72192, "titulo": "Vasco fecha com a Sportingbet como nova patrocinadora máster", "url": "https://www.poder360.com.br/poder-sportsmkt/vasco-fecha-com-a-sportingbet-como-nova-patrocinadora-master/", "fonte_id": "poder360", "data_pub": "2026-07-25T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Vasco da Gama fechou um contrato com a Sportingbet como nova patrocinadora máster, que será válida até o fim de 2027. A marca estreará na camisa do clube em um jogo contra o Mirassol.", "titulo_pt": "Vasco fecha com a Sportingbet como nova patrocinadora máster", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 72255, "titulo": "MG: liderança do PSB cobra que Lula ouça cotados antes de fechar chapa", "url": "https://www.metropoles.com/minas-gerais/mg-lideranca-do-psb-cobra-que-lula-ouca-cotados-antes-de-fechar-chapa", "fonte_id": "metropoles", "data_pub": "2026-07-25T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O líder do PSB na Assembleia Legislativa de Minas Gerais, Carlos Pimenta, afirmou que a escolha da chapa pelo presidente Lula deve envolver os mineiros. O parlamentar argumentou que as decisões partidárias não devem ser tomadas em Brasília sem o input local.", "titulo_pt": "Líder do PSB em minas gerais cobra inclusão de mineiros na decisão sobre chapa", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 72326, "titulo": "Colapso de ferragens em obra deixa um morto e cinco feridos no Morumbi", "url": "https://www.infomoney.com.br/brasil/colapso-de-ferragens-em-obra-deixa-um-morto-e-cinco-feridos-no-morumbi/", "fonte_id": "infomoney", "data_pub": "2026-07-25T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um trabalhador morreu e cinco ficaram feridos após o colapso de ferragens durante uma obra no Morumbi. A informação foi dada pelo capitão Jaelson Nobre, da Polícia Militar, em entrevista à SP1, da TV Globo.", "titulo_pt": "Colapso de ferragens em obra deixa um morto e cinco feridos no Morumbi", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 72713, "titulo": "Shen’s courage is Taiwan’s courage", "url": "https://www.taipeitimes.com/News/editorials/archives/2026/07/26/2003861378", "fonte_id": "taipei_times", "data_pub": "2026-07-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto destaca a coragem de Shen como uma representação da coragem de Taiwan.", "titulo_pt": "A coragem de shen é a coragem de Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 72856, "titulo": "Trump Holds Off on Major War Escalation Against Iran as Advisers Raise Concerns", "url": "https://www.nytimes.com/2026/07/25/us/politics/trump-iran-military.html", "fonte_id": "nyt_world", "data_pub": "2026-07-25T22:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Trump está evitando uma escalada significativa da guerra contra a Irã, conforme seus conselheiros expressam preocupações sobre o risco de intensificar os conflitos, que poderia comprometer as reservas reduzidas de munições para defesa aérea no Oriente Médio.", "titulo_pt": "Trump adia escalada maior da guerra contra a Irã diante das preocupações dos conselheiros", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 72892, "titulo": "Smash hit: How Alex Eala's Wimbledon run made everyday Filipinos fall in love with tennis", "url": "https://www.bbc.co.uk/news/articles/c3v0lyrndn7o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-07-25T22:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tênis está ganhando popularidade no Filipinos, um país historicamente apaixonado por basquete e boxe. Anteriormente restrito a pessoas ricas, o esporte agora atrai uma ampla base de fãs.", "titulo_pt": "Sucesso na Wimbledon: como o percurso de Alex Eala fez os Filipinos comuns se apaixonarem pelo tênis", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 72857, "titulo": "Berlin Pride Event Cut Short After Car Hits Crowds", "url": "https://www.nytimes.com/2026/07/25/world/europe/berlin-car-attack.html", "fonte_id": "nyt_world", "data_pub": "2026-07-25T22:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um evento da Berlin Pride foi interrompido após um carro atingir a multidão. A polícia está buscando suspeitos.", "titulo_pt": "Berlin Pride interrompida após carro atingir multidão", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 72815, "titulo": "Por que o “Trump Trade” está agora em frangalhos", "url": "https://www.infomoney.com.br/mercados/por-que-o-trump-trade-esta-agora-em-frangalhos/", "fonte_id": "infomoney" 026-07-25T22:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto apresenta uma breve troca que ilustra a grande diferença entre os estilos presidenciais de Trump e Obama.", "titulo_pt": "Uma breve troca que ilustra a grande diferença entre Trump e Obama", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 72895, "titulo": "What’s next for Venezuela’s path to recovery from devastating earthquakes?", "url": "https://www.aljazeera.com/news/2026/7/25/whats-next-for-venezuelas-path-to-recovery-from-devastating-earthquakes?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-25T21:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O custo da reconstrução é esperado ultrapassar os bilhões, mesmo diante de múltiplos obstáculos enfrentados pelo país.", "titulo_pt": "O que vem next para a recuperação da Venezuela após os devastadores terremotos?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 72653, "titulo": "US pauses nightly Iran strikes, as Houthis clash with Saudis", "url": "https://www.scmp.com/news/world/middle-east/article/3361857/us-pauses-nightly-iran-strikes-houthis-clash-saudis?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-25T21:57:00Z", "idioma": "en", "provavel_duplicata_de": 72650, "texto_pt": "Conflitos entre rebeldes hutíes e Arábia Saudita aumentaram, enquanto os Estados Unidos pausaram suas quase duas semanas consecutivas de ataques noturnos contra alvos iranianos. A pausa nas operações dos EUA levanta dúvidas sobre a estratégia do presidente Donald Trump na guerra.", "titulo_pt": "EUA pausam ataques noturnos em Irã, enquanto hutíes se confrontam com árabes sauditas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 72401, "titulo": "Al menos un muerto y varios heridos por un atropello durante el Día del Orgullo en Berlín", "url": "https://elpais.com/internacional/2026-07-25/varios-heridos-por-un-atropello-dur P-52 da Petrobras está fechada há nove meses – e pode não voltar até 2026", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 72430, "titulo": "El megaexitoso sistema de pagos que conquistó Brasil y desató una batalla con Trump", "url": "https://www.lanacion.com.ar/el-mundo/el-megaexitoso-sistema-de-pagos-que-conquisto-brasil-y-desato-una-batalla-con-trump-nid25072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-25T21:46:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O sistema de pagamentos público, gratuito e amplamente utilizado deslocou o dinheiro físico no Brasil e acendeu alertas nas grandes empresas americanas. O sistema ficou no centro das discussões sobre as tarifas impostas por Washington.", "titulo_pt": "O megaexitoso sistema de pagos que conquistou o Brasil e despertou a atenção de Trump", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 72327, "titulo": "Pequenas empresas entram com ações na Justiça contra novas tarifas de Trump", "url": "https://www.infomoney.com.br/mundo/pequenas-empresas-entram-com-acoes-na-justica-contra-novas-tarifas-de-trump/", "fonte_id": "infomoney", "data_pub": "2026-07-25T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pequenas empresas estão apresentando ações judiciais contra as novas tarifas impostas por Trump. A Casa Branca não se pronunciou sobre o assunto.", "titulo_pt": "Pequenas empresas entram com ações na Justiça contra novas tarifas de Trump", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 72234, "titulo": "O que as grandes fortunas sabem que a maioria ainda não percebe", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/07/o-que-as-grandes-fortunas-sabem-que-a-maioria-ainda-nao-percebe.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-25T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A maioria admira o s://veja.abril.com.br/brasil/o-fim-do-contrato-do-banco-master-com-um-tribunal-brasileiro/", "fonte_id": "veja", "data_pub": "2026-07-25T19:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O contrato do Banco Master com um tribunal brasileiro, especificamente o TRT da 4ª Região, está terminando. O banco tinha permissão para oferecer empréstimos a magistrados, servidores e pensionistas desse tribunal.", "titulo_pt": "Fim do contrato do Banco Master com tribunal brasileiro", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 72394, "titulo": "O imposto mínimo global e o custo da convergência", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-imposto-minimo-global-e-o-custo-da-convergencia", "fonte_id": "jota", "data_pub": "2026-07-25T17:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As multinacionais começaram a recolher o adicional da CSLL neste mês, mas só detalharão a apuração à Receita Federal em 2027.", "titulo_pt": "O imposto mínimo global e o prazo de detalhamento", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 72237, "titulo": "'Aviação não é brinquedo de luxo, é infraestrutura para turismo', diz CEO do Beach Park", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/07/aviacao-nao-e-brinquedo-de-luxo-e-infraestrutura-para-turismo-diz-ceo-do-beach-park.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-25T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2026, o Beach Park comemora 40 anos e planeja abrir o Ohana Beach Park no final de setembro. O novo resort será voltado para clientes de alta renda.", "titulo_pt": "Aviação não é brinquedo de luxo, é infraestrutura para turismo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 72238, "titulo": "Dona de Habib's e Ragazzo pede à Justiça proteção contra credores com dívidas de R$ 312,4 milhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/dona-de-habibs-e-ragazzo-pede-a-justica-protecao-contra-credores-com-dividas-de-r-3124-milhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-25T16:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Grupo Gennius, proprietário das redes de restaurantes Habib's e Ragazzo, solicitou à Justiça proteção contra credores com uma dívida total de R$ 312,4 milhões. O pedido visa evitar problemas legais relacionados às dívidas.", "titulo_pt": "Dono de Habib's e Ragazzo pede proteção judicial contra credores com dívidas de R$ 312,4 milhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 72274, "titulo": "O novo imperativo estratégico: mobilizar capital para o futuro da América Latina", "url": "https://exame.com/esg/o-novo-imperativo-estrategico-mobilizar-capital-para-o-futuro-da-america-latina/", "fonte_id": "exame", "data_pub": "2026-07-25T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A próxima década determinará se a América Latina será apenas receptora de capital ou se tornará protagonista na construção de uma nova economia baseada em impacto, inovação e sustentabilidade.", "titulo_pt": "O novo imperativo estratégico: mobilizar capital para o futuro da América Latina", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 72845, "titulo": "O que é o botão de plástico no cinto de segurança dos carros?", "url": "https://canaltech.com.br/carros/o-que-e-o-botao-de-plastico-no-cinto-de-seguranca-dos-carros/", "fonte_id": "canaltech", "data_pub": "2026-07-25T22:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O pequeno botão de plástico localizado abaixo da fivela do cinto de segurança tem uma função prática, evitando que a fivela deslize livremente pelo tecido e mantendo-a sempre acessível. Este acessório não é apenas decorativo, mas serve para facilitar o uso do cinto de segurança.", "titulo_pt": "O que é esse botão de plástico no cinto de segurança dos carros?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 72903, "titulo": "Lee says emergence of AI era offers S. Korea new opportunity", "url": "https://en.yna.co.kr/view/AEN20260726000300315", "fonte_id": "yonhap_news", "data_pub": "2026-07-25T22:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung afirmou que a emergência da era de inteligência artificial oferece uma nova oportunidade para a Coreia do Sul. A declaração foi feita em San Francisco no dia 25 de julho.", "titulo_pt": "Lee diz que era da IA oferece nova chance à Coreia do sul", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 72655, "titulo": "The West is debating AI’s future with half the world absent", "url": "https://www.scmp.com/opinion/world-opinion/article/3361362/west-debating-ais-future-half-world-absent?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-25T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 200 economistas e pesquisadores de IA, incluindo 16 laureados com o Nobel, assinaram uma carta aberta organizada pelo Stanford Digital Economy Lab em 13 de julho. Eles alertam que a IA pode causar uma transformação econômica maior do que a Revolução Industrial, ocorrendo em um curto período de tempo, e que é necessário agir agora para criar as instituições necessárias.", "titulo_pt": "O ocidente está debatendo o futuro da IA com metade do mundo ausente", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 72352, "titulo": "Seu próximo seguro pode depender de uma IA", "url": "https://olhardigital.com.br/2026/07/25/inteligencia-artificial/seu-proximo-seguro-pode-depender-de-uma-ia/", "fonte_id": "olhar_digital", "data_pub": "2026-07-25T21:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A regulação de sinistros já utiliza inteligência artificial para acelerar o processo, diminuindo o tempo de análise. Seus próximos seguros podem ser gerenciados por sistemas baseados em IA.", "titulo_pt": "Seu próximo seguro pode depender de uma IA", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 72361, "titulo": "5 celulares mais baratos que podem ser melhores que o iPhone 17", "url": "https://canaltech.com.br/smartphone/5-celulares-mais-baratos-que-podem-ser-melhores-que-o-i-phone-17/", "fonte_id": "canaltech", "data_pub": "2026-07-25T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O iPhone 17 apresenta melhorias limitadas e ainda enfrenta críticas por algumas de suas limitações, enquanto fabricantes Android oferecem dispositivos com melhores custos-benefícios. São cinco modelos Android que são mais baratos do que o iPhone 17 e oferecem recursos avançados como telas de 120 Hz, carregamento rápido e câmeras versáteis.", "titulo_pt": "5 Celulares mais baratos podem ser melhores que o iphone 17", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 72724, "titulo": "Warner Bros. lawsuit accuses Amazon of illegally poaching executives", "url": "https://techcrunch.com/2026/07/25/warner-bros-lawsuit-accuses-amazon-of-illegally-poaching-executives/", "fonte_id": "techcrunch", "data_pub": "2026-07-25T20:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Warner Bros. moveu uma ação judicial contra a Amazon, acusando-a de ter roubado executivos ilegalmente. O caso pode reavivar debates sobre a aplicabilidade das contratações por prazo determinado sob a lei californiana.", "titulo_pt": "Warner Bros. Processa Amazon por suposto roubo ilegal de executivos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 72725, "titulo": "The hacker who humiliated spyware makers and was never caught", "url": "https://techcrunch.com/2026/07/25/the-hacker-who-humiliated-spyware-makers-and-was-never-caught/", "fonte_id": "techcrunch", "data_pub": "2026-07-25T20:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ativista hacker impressionante que invadiu duas controversas empresas de spyware governamentais pode ser o hacker mais prolífico nunca apanhado. As informações disponíveis sobre Phineas Fisher são limitadas.", "titulo_pt": "O hacker que humilhou fabricantes de spyware e foi nunca capturado", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 72353, "titulo": "Seus dados podem já estar sendo roubados para serem lidos no futuro", "url": "https://olhardigital.com.br/2026/07/25/seguranca/seus-dados-podem-ja-estar-sendo-roubados-para-serem-lidos-no-futuro/", "fonte_id": "olhar_digital", "data_pub": "2026-07-25T20:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A computação quântica representa uma ameaça potencial à segurança dos dados, pois pode desafiar as atualmente usadas técnicas criptográficas. Os dados podem já estar sendo coletados e armazenados de forma que possam ser facilmente decifrados no futuro com o uso dessa tecnologia.", "titulo_pt": "Seus dados podem já estar sendo roubados para serem lidos no futuro", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 72362, "titulo": "GAC derrete preços de quase toda linha no Brasil; veja condições", "url": "https://canaltech.com.br/carros/gac-derrete-precos-de-quase-toda-linha-no-brasil-veja-condicoes/", "fonte_id": "canaltech", "data_pub": "2026-07-25T20:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A fabricante chinesa GAC está oferecendo preços reduzidos praticamente para toda a sua linha no Brasil, com destaque para o SUV GS4 Premium que teve seu preço reduzido em R$ 37 mil. A campanha inclui modelos elétricos como o Aion ES e o Aion Y.", "titulo_pt": "GAC derrete preços de quase toda linha no Brasil; veja condições", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 72354, "titulo": "Smartwatch b ios da desinformação", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 72726, "titulo": "Elon Musk’s Boring Company reportedly raising funding at a $20 billion valuation", "url": "https://techcrunch.com/2026/07/25/elon-musks-boring-company-reportedly-raising-funding-at-a-20-billion-valuation/", "fonte_id": "techcrunch", "data_pub": "2026-07-25T19:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A startup de Elon Musk dedicada a construir túneis está em negociações para uma nova rodada de financiamento significativa. A avaliação da empresa pode chegar a 20 bilhões de dólares.", "titulo_pt": "Startup do túnel de elon Musk supostamente buscando financiamento avaliado em 20 bi", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 72364, "titulo": "Review Dell 14 | Notebook \"premium de entrada\" que acerta no básico", "url": "https://canaltech.com.br/notebook/review-dell-14/", "fonte_id": "canaltech", "data_pub": "2026-07-25T19:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Dell 14 é um notebook classificado como 'premium de entrada', oferecendo bom hardware e construção robusta por um preço mais acessível comparado a outros modelos premium. A crise de hardware está elevando os preços, mas o Dell 14 não foi imune a isso.", "titulo_pt": "Dell 14 | Notebook 'premium de entrada' que acerta no básico", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 72356, "titulo": "Wolverine, GTA VI e mais: os melhores jogos de PS5 em oferta agora", "url": "https://olhardigital.com.br/2026/07/25/reviews/wolverine-gta-vi-e-mais-os-melhores-jogos-de-ps5-em-oferta-agora/", "fonte_id": "olhar_digital", "data_pub": "2026-07-25T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O catálogo do PlayStation 5 oferece vários jogos interessantes, entre eles o Kit Marvel’s Wolverine e Grand Theft Auto VI. São opções recomendadas para quem procura boas ofertas no console.", "titulo_pt": "Wolverine, GTA VI e mais: os melhores jogos de PS5 em oferta agora", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 72357, "titulo": "Imprima com mais economia: veja uma seleção de impressoras em promoção na Amazon", "url": "https://olhardigital.com.br/2026/07/25/reviews/imprima-com-mais-economia-veja-uma-selecao-de-impressoras-em-promocao-na-amazon/", "fonte_id": "olhar_digital", "data_pub": "2026-07-25T18:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon está oferecendo três opções de impressoras multifuncionais com wi-fi, tanque de tinta e custo reduzido. É um bom momento para pesquisar e trocar a sua impressora se ela estiver desatualizada.", "titulo_pt": "Imprima com mais economia: veja uma seleção de impressoras em promoção na Amazon", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}], "tecnologia__eventos": [], "ciencia": [{"id": 72917, "titulo": "New research shows how language experience shapes human communication", "url": "https://phys.org/news/2026-07-language-human-communication.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T22:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa liderada pela Taiwan analisou falantes de mandarim e demonstrou que os sons que ouvimos e produzimos estão profundamente influenciados por nossa experiência linguística anterior. Essa pesquisa fornece novas perspectivas sobre como humanos aprendem e utilizam a língua.", "titulo_pt": "Nova pesquisa mostra como a experiência linguística molda a comunicação humana", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72731, "titulo": "'I get caught up in the numbers game': Why useful social media content gets lost online", "url": "https://phys.org/news/2026-07-caught-game-social-media-content.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amy posta fotos de si mesma no Instagram e percebe que as imagens em biquíni recebem muitos likes, enquanto conteúdo explicativo sobre sua stoma (um orifício na barriga que direciona os resíduos para uma bolsa conectada a ela) tem menos visibilidade. Isso ilustra como conteúdo útil pode ser negligenciado em redes sociais.", "titulo_pt": "Eu me envolvo no jogo dos números: por que conteúdo socialmente valioso é perdido na internet", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72732, "titulo": "Unwritten social rules, not government oversight, help keep forest land sustainable", "url": "https://phys.org/news/2026-07-unwritten-social-oversight-forest-sustainable.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa analisou mais de 18.000 áreas florestais ao redor do mundo e descobriu que a agricultura swidden, frequentemente chamada de 'corta-e-baixa', tem um impacto ambiental mais complexo e menos destrutivo do que o termo sugere. Segundo o estudo, regras sociais não escritas em pequenas comunidades, e não a regulação governamental, são as principais responsáveis por manter o uso da terra sustentável ao longo do tempo.", "titulo_pt": "Regras sociais, não fiscalização governamental, ajudam na sustentabilidade das florestas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72733, "titulo": "Syria's ancient sites face widespread looting and systematic bulldozing, satellite images reveal", "url": "https://phys.org/news/2026-07-syria-ancient-sites-widespread-looting.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias centenas de sítios arqueológicos foram destruídos por roubos durante a guerra civil síria, que durou de 2011 a 2024. O dano recente aos locais de patrimônio cultural desde 2016, incluindo os sítios da UNESCO como Palmyra e a antiga cidade romana de Apamea, tem sido desconhecido até agora.", "titulo_pt": "Sítios arqueológicos antigos da síria sofrem devastação generalizada por roubos e demolições sistemáticas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72790, "titulo": "Krakatoa: a erupção que produziu o som mais alto da história", "url": "https://exame.com/ciencia/krakatoa-a-erupcao-que-produziu-o-som-mais-alto-da-historia/", "fonte_id": "exame", "data_pub": "2026-07-25T19:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 1883, a erupção do Vulcão Krakatoa foi ouvida a mais de 4.600 km e causou a morte de 36 mil pessoas, alterando o clima global por anos.", "titulo_pt": "Krakatoa: a erupção que produziu o som mais alto da história", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 72199, "titulo": "8.000 novas espécies de insetos são identificadas por meio do DNA no Equador", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/07/8000-novas-especies-de-insetos-sao-identificadas-por-meio-do-dna-no-equador.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-25T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas do Equador identificaram geneticamente 8.000 novas espécies de insetos em uma floresta protegida do Chocó Andino, que foi declarada reserva mundial da biosfera.", "titulo_pt": "8.000 Novas espécies de insetos são identificadas por meio do DNA no Equador", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 72266, "titulo": "Quem é melhor na multitarefa? Estudo surpreende ao comparar homens e mulheres", "url": "https://exame.com/ciencia/quem-e-melhor-na-multitarefa-estudo-surpreende-ao-comparar-homens-e-mulheres/", "fonte_id": "exame", "data_pub": "2026-07-25T18:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo simulou situações do cotidiano e constatou que homens e mulheres apresentaram desempenho semelhante ao realizar tarefas simultaneamente. O experimento comparou os dois gêneros em contextos de multitarefa, encontrando resultados iguais entre eles.", "titulo_pt": "Quem é melhor na multitarefa? Estudo não encontra diferença entre homens e mulheres", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 72734, "titulo": "New model maps how social media users repeatedly spread misinformation", "url": "https://phys.org/news/2026-07-social-media-users-misinformation.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa publicada na International Journal of Enterprise Network Management sugere que os usuários de mídias sociais têm um papel mais significativo no compartilhamento de informações falsas do que se pensava. Os pesquisadores argumentam que as iniciativas para combater a 'fake news' devem concentrar-se tanto na compreensão dos motivos pelos quais os usuários compartilham informações enganosas quanto em identificar aqueles que criam conteúdo enganoso.", "titulo_pt": "Novo modelo mapeia como usuários de mídias sociais repetidamente espalham desinformação", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72735, "titulo": "Cameras attached to whale sharks capture krill chases never witnessed before", "url": "https://phys.org/news/2026-07-cameras-whale-sharks-capture-krill.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Câmeras instaladas nos tubarões-baleia capturaram cenas de caça a crustáceos krill que nunca foram vistas antes. Estes peixes, os maiores do mundo, despertam curiosidade e interesse pelos observadores.", "titulo_pt": "Câmeras em tubarões-baleia registram caças a krill inéditos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72737, "titulo": "Spain fights to 'save lives' as wildfire evacuees shelter in Madrid", "url": "https://phys.org/news/2026-07-spain-wildfire-evacuees-madrid.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro espanhol Pedro Sánchez afirmou que bombeiros estão trabalhando para salvar vidas nas chamas que se alastram próximo a Madrid. Além disso, um incêndio em outra região do país já resultou em uma morte.", "titulo_pt": "Espanha luta para 'salvar vidas' com evacuados de incêndios no madri", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72738, "titulo": "SpaceX launches Starship on another test flight, this time with the most advanced Starlinks", "url": "https://phys.org/news/2026-07-spacex-starship-flight-advanced-starlinks.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T17:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX lançou o foguete Starship em mais uma viagem de teste, desta vez lançando 20 dos Starlinks mais avançados. O voo se estendeu por metade do mundo.", "titulo_pt": "Spacex realiza outro voo de teste do Starship com os Starlinks mais avançados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72595, "titulo": "Latest news bulletin | July 25th, 2026 – Evening", "url": "http://www.euronews.com/video/2026/07/25/latest-news-bulletin-july-25th-2026-evening", "fonte_id": "euronews", "data_pub": "2026-07-25T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram relatadas as principais notícias da Europa e do mundo no dia 25 de julho de 2026, abrangendo os setores de notícia geral, economia, entretenimento, política, cultura e viagens.", "titulo_pt": "Boletim das últimas notícias | 25 de julho de 2026 – noite", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 72739, "titulo": "The hunt for a natural molecule that can release cellular energy", "url": "https://phys.org/news/2026-07-natural-molecule-cellular-energy.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Todos os células do corpo humano utilizam energia gerada pela molécula ATP para realizar processos celulares, como o batimento cardíaco e a movimentação dos dedos. A liberação da energia armazenada no ATP ocorre apenas quando sua decomposição é iniciada por uma enzima.", "titulo_pt": "A busca por uma molécula natural que libere energia celular", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72754, "titulo": "We talk with astronaut Michael Foale about the 1997 Space Station Mir crisis: 'He took all the blame of the collision on his shoulders'", "url": "https://www.space.com/entertainment/space-movies-shows/we-talk-with-astronaut-michael-foale-about-the-1997-space-station-mir-crisis-he-took-all-the-blame-of-the-collision-on-his-shoulders", "fonte_id": "space_com", "data_pub": "2026-07-25T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Michael Foale, astronauta, afirma que a tripulação salvou a Estação Espacial Mir naquele dia. Ele assumiu toda a responsabilidade pelo acidente de colisão.", "titulo_pt": "Astronauta Michael Foale fala sobre a crise da estação espacial Mir em 1997: 'ele levou toda a culpa do choque nas costas'", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 72740, "titulo": "Ancient bones from smaller Maya communities reveal heavy reliance on maize and local subsistence patterns", "url": "https://phys.org/news/2026-07-ancient-bones-smaller-maya-communities.html", "fonte_id": "phys_org", "data_pub": "2026-07-25T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos de ossadas de comunidades menores maiaicas mostraram uma forte dependência da milho e padrões locais de subsistência. Os historiadores e arqueólogos já sabem que o milho era um alimento central e símbolo cultural no mundo maia antigo, mas a maioria do conhecimento vêm de pesquisas em cidades maiores e sepultamentos nobres.", "titulo_pt": "Ossadas antigas das menores comunidades maiaicas revelam forte dependência do milho e padrões locais de subsistência", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 72755, "titulo": "This Week In Space podcast: Episode 220 — First on Mars", "url": "https://www.space.com/entertainment/space-movies-shows/this-week-in-space-podcast-episode-220-first-on-mars", "fonte_id": "space_com", "data_pub": "2026-07-25T15:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na 220ª edição do podcast This Week In Space, Rod Pyle e Tariq Malik recebem Dr. Pascal Lee e a astrobióloga Dr. Penny Boston para comemorar o aniversário de 50 anos desde que a Viking 1 pousou em Marte.", "titulo_pt": "Esta semana no espaço: episódio 220 — primeira pousada em marte", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 72918, "titulo": "‘Neuromancer’ First Look: Callum Turner Is a Cyberspace Criminal in Teaser for Apple TV Sci-Fi Series", "url": "https://variety.com/2026/tv/news/neuromancer-first-look-callum-turner-apple-tv-1236821177/", "fonte_id": "variety", "data_pub": "2026-07-25T22:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Apple lançou um teaser para a série 'Neuromancer', uma drama de ficção científica com Callum Turner no elenco, baseada no best-seller de 1984 de William Gibson. A produção é criada por Graham Roland e JD Dillard.", "titulo_pt": "Primeira visão de ‘neuromancer’: callum Turner como Criminal cibernético em Teaser da série da Apple", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 72789, "titulo": "O inusitado processo criativo de Ana Maria Gonçalves", "url": "https://veja.abril.com.br/cultura/o-inusitado-processo-criativo-de-ana-maria-goncalves/", "fonte_id": "veja", "data_pub": "2026-07-25T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ana Maria Gonçalves é a primeira mulher negra a se tornar imortal na Academia Brasileira de Letras.", "titulo_pt": "O processo criativo inusitado de Ana Maria Gonçalves", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 72771, "titulo": "Bon Iver Plays Full Bob Dylan Covers Set as Bon Dylan at Eaux Claires Festival", "url": "https://consequence.net/2026/07/bon-iver-do-bob-dylan-at-eaux-claires/", "fonte_id": "consequence_sound", "data_pub": "2026-07-25T21:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Justin Vernon, como Bon Iver, tocou um set completo de músicas covers do Bob Dylan no festival Eaux Claires. Ele também realizou um show solo adicional para substituir Kevin Morby.", "titulo_pt": "Bon Iver toca conjunto completo de músicas do Bob Dylan no Festival Eaux Claires", "veiculo": "Consequence of Sound", "pais": "EUA", "classe": "C"}, {"id": 72776, "titulo": "‘Dungeons & Dragons’ Sequel Was Written but May Never Be Filmed Due to ‘Financial Reasons’", "url": "https://variety.com/2026/film/news/dungeons-and-dragons-sequel-written-never-filmed-financial-1236821132/", "fonte_id": "variety", "data_pub": "2026-07-25T21:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um roteiro para uma sequência de 'Dungeons & Dragons: Honor Among Thieves' foi escrito, mas não deve ser produzido por razões financeiras.", "titulo_pt": "Seguência de 'dungeons & Dragons' foi escrita mas pode nunca ser produzida", "veiculo": "Variety", "pais": "EUA", "classe": "C"}, {"id": 72777, "titulo": "‘Sour Minnows’ Is the Surreal Body Snatching Comedy That Mystified and Delighted Its Premiere Audience — Fantasia", "url": "https://variety.com/2026/film/features/sour-minnows-surreal-body-snatching-comedy-fantasia-fest-1236821014/", "fonte_id": "variety", "data_pub": "2026-07-25T21:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A história apresenta seis homens deitados no chão, lambendo uma rua deserta em Los Angeles. É uma introdução perturbadora, mas 'Sour Minnows' não é um conto convencional. Trata-se de uma comédia sobre roommates que acidentalmente entram em outro plano de existência.", "titulo_pt": "'Peixes amargos' é a
