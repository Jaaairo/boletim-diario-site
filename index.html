<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>
  <div class="sub">notícias do mundo · atualizado em 25/11/2026 15:26 · próxima atualização às <span id="prox-hora"></span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">
  <div class="modal-box">
    <h4>Modo Editorial</h4>
    <label for="inp-senha">Senha</label>
    <input type="password" id="inp-senha" placeholder="••••••" autocomplete="current-password">
    <div class="modal-erro" id="senha-erro" style="display:none">Senha incorreta.</div>
    <div class="modal-btns">
      <button class="btn-sec2" onclick="fecharModal('modal-senha')">Cancelar</button>
      <button class="btn-pri" onclick="verificarSenha()">Entrar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-flag">
  <div class="modal-box">
    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>
    <label for="flag-tipo">Tipo de problema</label>
    <select id="flag-tipo">
      <option value="erro_factual">Erro factual</option>
      <option value="erro_traducao">Erro de tradução</option>
      <option value="classificacao_errada">Classificação errada</option>
      <option value="resumo_impreciso">Resumo impreciso</option>
      <option value="outro">Outro</option>
    </select>
    <label for="flag-nota">Nota (opcional)</label>
    <textarea id="flag-nota" placeholder="Descreva o problema..."></textarea>
    <div class="modal-btns">
      <button class="btn-peri" id="btn-rm-flag" onclick="removerFlagAtual()" style="display:none;margin-right:auto">Remover</button>
      <button class="btn-sec2" onclick="fecharModal('modal-flag')">Cancelar</button>
      <button class="btn-pri" onclick="salvarFlagAtual()">Marcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "25/11/2026 15:26", "stats": {"noticias_novas": 974, "resumos_gerados": 251}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Partido dos Trabalhistas (PT) tenta manter o controle da presidência da Câmara dos Deputados, apoiando a candidatura de Hugo Motta. O presidente Luiz Inácio Lula da Silva enfrenta dificuldades para indicar um substituto para o Supremo Tribunal Federal, devido a resistências e incertezas políticas. O governo planeja prorrogar a subvenção ao diesel por mais 30 dias, com um custo estimado de R$ 75 bilhões no ano. Além disso, a equipe econômica do governo está discutindo novas medidas fiscais, buscando não afetar os gastos sociais. A Procuradoria-Geral da República decidiu arquivar a investigação sobre posts atribuindo canibalismo ao presidente Jair Bolsonaro, após a retirada dos posts questionados. O governo também anunciou a destruição dos passaportes do ex-assessor presidencial Filipe Martins, conforme determinação do ministro Alexandre de Moraes.", "mundo": "Os Estados Unidos anunciaram novas tarifas, incluindo uma de 10% sobre aeronaves brasileiras e uma sobretaxa no açúcar, em meio a tensões comerciais com o governo Lula. O presidente Donald Trump defendeu essas medidas, apesar de um revés eleitoral recente, afirmando que o Brasil não corrigiu 'atos, políticas e práticas irrazoáveis'. Em contraste, o governo de Joe Biden havia proposto aumentar tarifas sobre o Brasil em uma nova chantagem comercial, com foco em produtos como aeronaves e açúcar. As relações internacionais também se destacaram com a China pedindo auxílio à Holanda para garantir a estabilidade das cadeias de suprimentos. O Japão considerava implementar um novo teste de proficiência em japonês para trabalhadores estrangeiros. Além disso, o Iraque decidiu que o governo pode assumir o controle das fronteiras e dos campos de petróleo kurdos, enquanto a Colômbia enfrentou um sequestro em um supermercado que paralisou o país e mobilizou o presidente.\n\nO cenário geopolítico global permanece tenso, com várias frentes de conflito e cooperação em andamento. Os Estados Unidos e a China continuam disputando influência, com os EUA aplicando novas tarifas a 14 parceiros comerciais, incluindo a China e a União Europeia, enquanto a China intensifica o uso de drones guiados por inteligência artificial em sua formação militar. O conflito na Ucrânia persiste, com ataques de drones russos causando mortes e danos em várias regiões do país. Israel intensifica sua pressão sobre o Hamas, matando o chefe de segurança interna do grupo em Gaza. A questão das sanções e do apoio internacional também é central, com a Suíça fechando seu escritório em Coreia do Norte devido a uma disputa sobre sanções, e os EUA alertando sobre possíveis violações das sanções da ONU contra o Norte-Coreia por conta de equipamentos de esqui usados por Kim Ju-ae. Além disso, a Rússia reitera sua posição contra o envio de tropas estrangeiras para a Ucrânia, enquanto a Alemanha pressiona para manter o apoio à Ucrânia, alertando sobre a escalada da tensão tanto na Europa quanto no espaço global.", "economia": "O Banco Central do Brasil planeja aumentar as alíquotas de capital mínimo regulatório para emissores de cartão de crédito, com o objetivo de reduzir o endividamento dos brasileiros. Esse anúncio está programado para acontecer nesta quarta-feira (25). Em contraste, a inflação nos Estados Unidos atingiu 3,3% ao ano no terceiro trimestre, levando a expectativa de que o Federal Reserve possa elevar as taxas de juros até o início de 2027. O governo brasileiro busca acelerar as investigações de dumping e proteger o mercado contra a concorrência desleal de produtos importados, especialmente chineses, diante da pressão das importações chinesas. As ações da Embraer caíram mais de 9% após o anúncio de tarifas de 10% sobre a importação de aeronaves brasileiras pelos Estados Unidos, enquanto a Shein prevê que seu negócio na Europa não se recupere antes do segundo semestre do próximo ano devido a novas tarifas sobre importações do comércio eletrônico. Além disso, a coleta seletiva de resíduos sólidos avançou no Brasil, atingindo 2.675 municípios em 2023, contra 994 em 2008, facilitando o reaproveitamento de materiais recicláveis.", "tecnologia": "A FCC aprovou a SpaceX para implantar até 1 milhão de satélites equipados com chips de inteligência artificial (IA) como parte do projeto 'Starmind'. Esta é a primeira aprovação do órgão para um projeto desse porte. Paralelamente, a Universidade Nacional de Taiwan desenvolveu chips para IA gerativa em dispositivos locais com o objetivo de melhorar a eficiência e a privacidade no processamento de IA nos próprios equipamentos. Em outro desenvolvimento, a Permut, uma plataforma de agentes de IA conversacionais, concluiu uma rodada seed de 3 milhões de euros com o objetivo de transformar a IA em um motor de receita para marcas, resolvendo um desafio enfrentado por muitas organizações.", "ciencia": "Um evento importante recente foi a entrada do astronauta paquistanês Muhammad Zeeshan Ali na Estação Espacial China, Tiangong, tornando-o o primeiro estrangeiro a fazer isso durante o primeiro voo tripulado conjunto da China com astronautas internacionais. Este evento marca um avanço significativo na cooperação espacial internacional. Em seguida, a NASA anunciou observações do telescópio Hubble que visam preparar a interpretação das futuras observações do Telescópio Espacial Nancy Grace Roman, buscando caracterizar estrelas e exoplanetas. Além disso, a descoberta de um fósil que provavelmente pertencia a um titanosaurio gigante há 70 milhões de anos, inicialmente confundido por cientistas com uma rocha, é um importante avanço na paleontologia. Outros assuntos abordados incluem a evolução das geckos sem pernas da Austrália, que ocorreu de forma semelhante à dos cobras, a atualização das diretrizes dos EUA sobre colesterol, e a possível detonação de cinco toneladas de azide de chumbo tóxico em Iowa pela Força Armada dos Estados Unidos, devido à instabilidade do material em certas temperaturas.", "cultura": "A cultura brasileira e internacional foi debatida em vários aspectos neste edição. A chef Janaína Torres ganhou o prêmio 'Community Spirit Award' por seu projeto que explora a gastronomia nacional. A artista Nick Cave recebeu o Leão de Ouro na Bienal de Veneza. A cineasta Ava DuVernay produziu um documentário sobre o 14º Emendamento à Constituição dos EUA, focando na democracia e defendendo-a contra a influência do presidencialismo de Donald Trump. 'The Trip' retorna para sua quinta temporada, com Steve Coogan e Rob Brydon viajando para o círculo polar ártico. No cinema, 'Entrando Numa Grande Fria' é a continuação da franquia 'Entrando Numa Fria', repetindo a fórmula de encontros desastrosos entre personagens. O álbum 'As Damas do Samba', de Karinah, revisita oito trajetórias femininas importantes na história do samba, com 16 faixas dedicadas a artistas icônicas. Além disso, a animação brasileira enfrenta o desafio de desenvolver uma estética própria, conforme afirma Otto Guerra, um dos pioneiros do gênero no país.", "sociedade": "A expectativa de vida em Cuba diminuiu pela primeira vez em quase 80 anos, passando de 78,8 anos em 2020 para 74,4 anos em 2025, de acordo com a OMS. Esta queda, principalmente, é atribuída ao aumento da mortalidade infantil e materna durante o embargo petrolífero imposto pelo governo Trump. Em outro desenvolvimento, a justiça de São Paulo autorizou um jovem a retirar o nome da mãe de seus documentos após relatos de agressões físicas e exploração sexual durante a infância. Além disso, uma pesquisa da Universidade Federal Fluminense revela que moradores da Baixada Santista enfrentam medo constante de morte ou tortura, insônia e ansiedade devido à operação Escudo e Verão, que teve um impacto duradouro na saúde mental da população local.", "meio_ambiente": "As negociações climáticas na COP31 enfrentaram dificuldades significativas, resultando em um 'fracasso', conforme declarou Marina Silva. As discussões ficaram paralisadas devido a impasses entre grandes potências e bloqueios em temas centrais. Paralelamente, um incêndio florestal em Flinders Island, uma ilha remota da Tasmânia, ameaça casas e propriedades após se expandir devido a descargas de relâmpagos. Em terras brasileiras, chuvas intensas provocaram um novo ciclo de frente fria no Sul, Sudeste e Centro-Oeste do país, enquanto no Nordeste o calor pode chegar a 41°C. Além disso, uma mina ilegal de ouro na Indonésia deixou nove mortos e 17 desaparecidos após o rio Ciseureuh transbordar, inundando a área.", "direitos_humanos": "Em 2026, a Arábia Saudita intensificou a repressão a dissidentes, com mais de 200 execuções, aplicações de chicotadas e uma perseguição crescente contra vozes críticas, o que agravou a situação dos direitos humanos no país. Um caso notável foi a detenção de Ghassan Al Najjar, um agricultor palestino e defensor dos direitos humanos, pelas forças israelenses. O UNICEF alertou sobre o risco crescente de inverno para milhares de crianças em Nepal, três meses após devastadoras inundações. No Reino Unido, Kishanth Peramalya, um requerente de asilo sri-lanquês, se suicidou após ser enviado para Eswatini, um país onde ele não tinha conexões. A China é acusada de usar indevidamente o sistema da Interpol para perseguir dissidentes, uma prática que ocorre enquanto Hong Kong prepara-se para sediar a assembleia geral da organização. Além disso, a UNICEF associou a epidemia de Ebola a um aumento da violência contra mulheres e meninas na República Democrática do Congo, onde o vírus já causou mais de 5.800 mortes desde maio."}, "resumo_do_dia": {"politica_nacional": [{"id": 286596, "titulo": "PT mira comando da “prefeitura” da Câmara dos Deputados", "url": "https://www.metropoles.com/colunas/igor-gadelha/pt-mira-comando-da-prefeitura-da-camara-dos-deputados", "fonte_id": "metropoles", "data_pub": "2026-11-25T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido dos Trabalhistas (PT) apoia a candidatura de Hugo Motta à reeleição para a presidência da Câmara dos Deputados e busca manter o comando da 1ª secretaria na eleição prevista para fevereiro.", "titulo_pt": "PT almeja manter comando na Câmara após reeleição de hugo motta", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 286598, "titulo": "Moraes arquiva investigação sobre posts que ligavam Bolsonaro a canibalismo", "url": "https://www.metropoles.com/colunas/manoela-alcantara/moraes-arquiva-investigacao-sobre-posts-que-ligavam-bolsonaro-a-canibalismo", "fonte_id": "metropoles", "data_pub": "2026-11-25T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República (PGR) decidiu arquivar a investigação sobre os posts que atribuíam ao presidente Bolsonaro envolvimento com canibalismo. A decisão foi tomada após a retirada dos posts questionados.", "titulo_pt": "Moraes arquiva investigação sobre posts que ligavam Bolsonaro a canibalismo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 286452, "titulo": "Coordenador do plano de governo de Lula diz que cortes contrariam pauta que venceu eleição", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/coordenador-do-plano-de-governo-de-lula-diz-que-cortes-contrariam-pauta-que-venceu-eleicao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-25T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "José Sergio Gabrielli, coordenador do programa de governo de Lula, afirma que o projeto de contenção de despesas aprovado pelo Congresso, conhecido como 'plano Moretti', contradiz a pauta que levou Lula à vitória nas eleições.", "titulo_pt": "Coordenador do plano de governo de Lula diz que cortes contrariam pauta eleitoral", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 286618, "titulo": "Lula 4: o que já se sabe da agenda fiscal e o que o governo ainda precisa responder", "url": "https://www.infomoney.com.br/economia/lula-4-o-que-ja-se-sabe-da-agenda-fiscal-e-o-que-o-governo-ainda-precisa-responder/", "fonte_id": "infomoney", "data_pub": "2026-11-25T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A agenda fiscal do governo já inclui um ajuste de até R$ 56 bilhões, mas a segunda etapa, relacionada a gastos obrigatórios, ainda não tem um formato definido. A JPMorgan prevê que a dívida aumente até 2028.", "titulo_pt": "Lula 4: o que já se sabe da agenda fiscal e o que o governo ainda precisa responder", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 286462, "titulo": "Apelo de Nizan Guanaes por renacionalização da publicidade acende debate contra grupos internacionais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/apelo-de-nizan-guanaes-por-renacionalizacao-da-publicidade-acende-debate-contra-grupos-internacionais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T17:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O arroz biro-biro, prato típico brasileiro, teve seu nome inspirado na publicidade brasileira, criado por Washington Olivetto, em homenagem a um jogador do Corinthians. Este nome foi usado como um exemplo no apelo de Nizan Guanaes por uma renacionalização da publicidade, em oposição a grupos internacionais.", "titulo_pt": "Apelo de Nizan Guanaes por renacionalização da publicidade chama atenção para origem brasileira de pratos publicitários", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 286726, "titulo": "O que falta nas agendas dos ministros do TCU", "url": "https://www.jota.info/opiniao-e-analise/colunas/controle-publico/o-que-falta-nas-agendas-dos-ministros-do-tcu", "fonte_id": "jota", "data_pub": "2026-11-25T17:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo questiona se há uma regra de transparência nas agendas dos ministros do Tribunal de Contas da União (TCU).", "titulo_pt": "O que falta nas agendas dos ministros do TCU?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 286635, "titulo": "PGR denuncia ex-secretário do RJ e outros 14 por elo com crime organizado", "url": "https://www.cnnbrasil.com.br/politica/pgr-denuncia-ex-secretario-do-rj-e-outros-14-por-elo-com-crime-organizado/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-25T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República denunciou um ex-secretário do Rio de Janeiro e outros 14 indivíduos por supostas conexões com o crime organizado, com foco na atuação do Comando Vermelho e de milícias envolvidas no tráfico internacional de drogas e armas.", "titulo_pt": "PGR denuncia ex-secretário do RJ e outros 14 por ligação com crime organizado", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 286486, "titulo": "Paulinho da Força diz que se reuniu com Moraes e que espera apoio unânime do STF a lei que reduz penas do 8 de janeiro", "url": "https://g1.globo.com/politica/blog/andreia-sadi/post/2026/11/25/paulinho-da-forca-dosimetria-moraes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-25T17:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Paulinho da Força afirmou que se reuniu com o ministro Alexandre de Moraes e espera apoio unânime do STF à lei que reduz penas do crime do 8 de janeiro.", "titulo_pt": "Paulinho da Força diz que STF dará apoio unânime à lei que reduz penas do 8 de janeiro", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 286640, "titulo": "Bolsonaro segue estável e sem previsão de alta, diz boletim médico", "url": "https://www.cnnbrasil.com.br/politica/bolsonaro-segue-estavel-e-sem-previsao-de-alta-diz-boletim-medico/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-25T16:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Bolsonaro permanece internado desde a última sexta-feira (20) devido a fortes dores abdominais. Ele está recebendo tratamento com antibióticos e sessões de fisioterapia.", "titulo_pt": "Bolsonaro segue internado e sem previsão de alta, diz boletim médico", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 286487, "titulo": "Lula reúne ex-ministros da Justiça para discutir estrutura de nova pasta da Segurança Pública", "url": "https://g1.globo.com/politica/noticia/2026/11/25/lula-reune-ex-ministros-da-justica-para-discutir-nova-pasta-da-seguranca-publica.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-25T16:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva (PT) realizou uma reunião no Palácio da Alvorada com ex-ministros da Justiça para discutir a criação do Ministério da Segurança Pública. Participaram da reunião ex-ministros Flávio Dino, Ricardo Lewandowski e Tarso Genro, além de outros membros do governo.", "titulo_pt": "Lula reúne ex-ministros da Justiça para discutir criação do ministério da Segurança Pública", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 286488, "titulo": "Governo diz que bloqueou quase quatro mil celulares usados por presos em menos de 50 dias", "url": "https://g1.globo.com/politica/noticia/2026/11/25/governo-diz-que-bloqueou-quase-quatro-mil-celulares-usados-por-presos-em-menos-de-50-dias.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-11-25T16:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal bloqueou quase quatro mil celulares usados por presos em menos de 50 dias após a publicação do decreto que permitiu essa medida. Os dados foram divulgados pela Secretaria Nacional de Políticas Penais (Senappen), do Ministério da Justiça.", "titulo_pt": "Governo bloqueou quase quatro mil celulares de presos em menos de 50 dias", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 286453, "titulo": "Impasse entre Messias e Pacheco zera corrida ao STF, e Lula vê profusão de candidatas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/impasse-entre-messias-e-pacheco-zera-corrida-ao-stf-e-lula-ve-profusao-de-candidatas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-25T16:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula enfrenta dificuldades para indicar um substituto para o STF, devido à resistência de Jorge Messias e à recusa em aceitar Rodrigo Pacheco. Isso resultou em um impasse que não avançou a indicação para a vaga aberta no tribunal.", "titulo_pt": "Impasse entre Messias e Pacheco impede indicação para STF, e Lula vê inércia na escolha", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 286645, "titulo": "Centrão vê impasse em indicação de Lula à vaga de Barroso no STF", "url": "https://www.cnnbrasil.com.br/politica/centrao-ve-impasse-em-indicacao-de-lula-a-vaga-de-barroso-no-stf/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-25T16:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os partidos do Centrão esperavam que Rodrigo Pacheco indicasse alguém para a vaga no STF, enquanto a nova sinalização de Lula gerou incerteza sobre a aprovação no Senado.", "titulo_pt": "Centrão vê impasse em indicação de Lula para vaga no STF", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 286484, "titulo": "CCJ do Senado aprova PEC sobre papel da União no financiamento do DF", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/ccj-do-senado-aprova-pec-sobre-papel-da-uniao-no-financiamento-do-df", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-25T16:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Constituição e Justiça do Senado aprovou uma proposta de emenda à Constituição que altera a responsabilidade da União no financiamento de serviços públicos do Distrito Federal. O texto ainda precisa ser aprovado pelos plenários do Senado e da Câmara para ser incorporado à Constituição.", "titulo_pt": "CCJ do Senado aprova PEC sobre papel da União no financiamento do DF", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 286647, "titulo": "Rogério Marinho guarda sigilo sobre apoios para evitar traições", "url": "https://www.cnnbrasil.com.br/politica/rogerio-marinho-guarda-sigilo-sobre-apoios-para-evitar-traicoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-25T16:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Rogério Marinho mantém sigilo sobre apoios recebidos para evitar possíveis traições. Ele calcula que, pelo menos por enquanto, ainda detém o favoritismo na disputa pelo cargo de senador.", "titulo_pt": "Rogério Marinho mantém sigilo sobre apoios para evitar traições", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 286467, "titulo": "Caixa discute com BC operação para comprar BRB, e plano será submetido a Lula", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/caixa-discute-com-bc-operacao-para-comprar-brb-e-plano-sera-submetido-a-lula.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T16:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Caixa Econômica Federal está discutindo com o Banco Central a possibilidade de comprar o BRB, que está passando por uma crise devido a um rombo causado por operações com o Banco Master. O plano será enviado para avaliação do Palácio do Planalto.", "titulo_pt": "Caixa discute com banco central compra do BRB e plano será avaliado por Lula", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 287188, "titulo": "US report warns of Chinese AI persona tactics targeting Taiwan elections", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/26/2003868404", "fonte_id": "taipei_times", "data_pub": "2026-11-26T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório americano alerta para o uso de técnicas de inteligência artificial de personalidades chinesas que podem ser direcionadas para influenciar as eleições taiwanesas. A informação sugere que o uso de AI pode ser uma estratégia para manipular a opinião pública na região.", "titulo_pt": "Relatório americano avisa sobre uso de AI por parte da china em campanhas eleitorais de Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 286892, "titulo": "Chats de conservador Yáber revelan supuestas gestiones de Sergio Gahona e Issa Kort para nombrar a Bárbara Quintana en la Corte de Rancagua", "url": "https://www.ciperchile.cl/2026/11/25/chats-de-conservador-yaber-revelan-supuestas-gestiones-de-sergio-gahona-e-issa-kort-para-nombrar-a-barbara-quintana-en-la-corte-de-rancagua/?utm_source=rss&utm_medium=rss&utm_campaign=chats-de-conservador-yaber-revelan-supuestas-gestiones-de-sergio-gahona-e-issa-kort-para-nombrar-a-barbara-quintana-en-la-corte-de-rancagua", "fonte_id": "ciper_chile", "data_pub": "2026-11-25T17:46:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Chats de um conservador chamado Yáber supostamente revelam que Sergio Gahona e Issa Kort teriam feito gestões para nomear Bárbara Quintana na Corte de Rancagua.", "titulo_pt": "Chats de conservador Yáber revelam supostas gestões de Gahona e Kort para nomear Bárbara Quintana na Corte de Rancagua", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 287390, "titulo": "Pakistani astronaut becomes 1st international visitor to China's Tiangong space station (photos)", "url": "https://www.space.com/space-exploration/human-spaceflight/pakistani-astronaut-becomes-1st-international-visitor-to-chinas-tiangong-space-station-photos", "fonte_id": "space_com", "data_pub": "2026-11-25T17:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muhammad Zeeshan Ali, um astronauta paquistanês, se tornou o primeiro astronauta internacional a visitar a Estação Espacial Tiangong da China, ao se juntar à tripulação da missão Shenzhou-24 e atracar com a estação orbital.", "titulo_pt": "Astronauta paquistanês se torna primeiro internacional a visitar a estação espacial Tiangong da China (fotos)", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 286599, "titulo": "EUA detona 4,5 toneladas de explosivos com chumbo que podem contaminar área", "url": "https://www.metropoles.com/mundo/eua-detona-45-toneladas-de-explosivos-com-chumbo-que-podem-contaminar-area", "fonte_id": "metropoles", "data_pub": "2026-11-25T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A operação envolveu a destruição de 4,5 toneladas de azida de chumbo em 68 tambores que apresentavam risco de explosão espontânea. A ação foi realizada nos Estados Unidos para eliminar o perigo.", "titulo_pt": "EUA destrói 4,5 toneladas de explosivos com chumbo que podem contaminar área", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 287113, "titulo": "Iraq’s top court rules government can take over Kurdish borders, oil fields", "url": "https://www.aljazeera.com/news/2026/11/25/iraqs-top-court-rules-government-can-take-over-kurdish-borders-oil-fields?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-25T17:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O tribunal superior do Iraque decidiu que o governo pode assumir o controle das fronteiras e campos de petróleo kurdos. Esta decisão ocorre um dia após autoridades kurdas acusarem Bagdá de uma 'invasão' aos direitos constitucionais da região.", "titulo_pt": "Tribunal iraquiano autoriza governo a tomar controle das fronteiras e campos de petróleo kurdos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 287029, "titulo": "How Ukraine is disrupting Russia's Africa operations by hitting arms shipments in the Mediterranean", "url": "https://www.lemonde.fr/en/le-monde-africa/article/2026/11/25/how-ukraine-is-disrupting-russia-s-africa-operations-by-hitting-arms-shipments-in-the-mediterranean_6788476_124.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-25T17:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Navios da marinha ucraniana atacaram dois navios russos em águas líbias. De acordo com imagens de satélite, um navio da supostamente ilegal frota de Moscou pode ter desembarcado equipamentos militares em Bengasi antes dos ataques.", "titulo_pt": "Ucrânia interrompe operações russas na áfrica ao atacar embarcações na mediterrâneo", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 287117, "titulo": "Switzerland forced to close office in North Korea over sanctions feud", "url": "https://www.aljazeera.com/news/2026/11/25/switzerland-regrets-closure-of-north-korea-office-over-sanctions-feud?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-25T16:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suíça foi obrigada a fechar seu escritório em Coreia do Norte devido a uma disputa sobre sanções. Segundo a Coreia do Norte, a Suíça incluiu um campo para crianças em sua lista de sanções.", "titulo_pt": "Suíça fechou escritório em Coreia do norte devido a sanções", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 286463, "titulo": "Quem é o grupo hacker do Irã que estaria por trás dos ataques a freezers na Europa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/11/quem-e-o-grupo-hacker-do-ira-que-estaria-por-tras-dos-ataques-a-freezers-na-europa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T16:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Numa noite de outubro, hackers de origem iraniana realizaram um ataque cibernético inusitado, elevando as temperaturas dos sistemas de refrigeração de centenas de supermercados na França e causando perdas de milhões de euros em alimentos destruídos.", "titulo_pt": "Quem são os hackers iranianos por trás dos ataques a freezers em supermercados na França?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 286931, "titulo": "Trump Is Desperate For a Ukraine Deal, but the Window Is Closing", "url": "https://foreignpolicy.com/2026/11/25/trump-putin-ukraine-russia-peace-deal-corruption-kushner-witkoff/", "fonte_id": "foreign_policy", "data_pub": "2026-11-25T16:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trump deseja um acordo com a Ucrânia que seja lucrativo e favorável ao Kremlin antes que os democratas tomem o Congresso.", "titulo_pt": "Trump precisa de um acordo com a Ucrânia, mas o período está se encerrando", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 287119, "titulo": "Why are school shootings continuing to shake the Balkans?", "url": "https://www.aljazeera.com/news/2026/11/25/kragujevac-school-shooting-what-we-know-so-far?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-25T16:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tiroteio na Sérvia reavivou preocupações sobre o acesso a armas de fogo, sinais de alerta online e falhas na prevenção de violência.", "titulo_pt": "Por que os tiroteios em escolas continuam abalando o bálcãs?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 286528, "titulo": "UE rejeita justificativa para as novas tarifas propostas pelos EUA", "url": "https://www.cartacapital.com.br/economia/ue-rejeita-justificativa-para-as-novas-tarifas-propostas-pelos-eua/", "fonte_id": "cartacapital", "data_pub": "2026-11-25T16:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A União Europeia rejeitou as justificativas apresentadas pelos Estados Unidos para as novas tarifas propostas. Se implementadas, essas tarifas afetarão 14 economias, incluindo China e Brasil.", "titulo_pt": "UE rejeita justificativas para novas tarifas propostas pelos EUA", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 286662, "titulo": "Ilhas Canárias registram chegada recorde de migrantes", "url": "https://www.dw.com/pt-br/ilhas-canárias-registram-chegada-recorde-de-migrantes/a-80051890?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-25T16:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 2.000 migrantes chegaram às Ilhas Canárias em 24 horas, batendo novos recordes de chegadas. O primeiro-ministro espanhol, Sánchez, pediu cooperação entre a União Europeia e países africanos para lidar com a situação.", "titulo_pt": "Ilhas Canárias registram chegada recorde de migrantes", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 287161, "titulo": "The Limits of Illiberal Power: What the Defeats of Vucic and Orban Reveal", "url": "https://balkaninsight.com/2026/11/25/the-limits-of-illiberal-power-what-the-defeats-of-vucic-and-orban-reveal/rd/", "fonte_id": "balkan_insight", "data_pub": "2026-11-25T16:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As dificuldades econômicas, escândalos, fadiga governamental e mudanças no ambiente de mídia contribuíram para os fracassos de Vucic e Orban. No entanto, a comparação indica que a transformação mais significativa ocorreu do lado da oposição.", "titulo_pt": "Os limites do poder iliberal: o que os fracassos de Vucic e Orban revelam", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 287077, "titulo": "U.S. proposes new tariffs on 14 trading partners, including China and the EU", "url": "https://www.cnbc.com/2026/11/25/us-tariffs-trump-section-301.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-25T16:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos propuseram novas tarifas sobre 14 parceiros comerciais, incluindo China e União Europeia, para combater práticas comerciais estrangeiras consideradas injustas, discriminatórias ou onerosas para o comércio americano.", "titulo_pt": "EUA propõem novas tarifas sobre 14 parceiros comerciais, incluindo China e ue", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 287122, "titulo": "Jerusalem Daily: Israel kills Hamas’s Gaza security chief", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/25/jerusalem-daily-israel-kills-hamass-gaza-security-chief?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-25T16:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israel assassinou o chefe de segurança interna do Hamas em Gaza, matando-o e mais seis pessoas em um ataque.", "titulo_pt": "Jerusalém diário: israel assassina chefe de segurança interna do Hamas em Gaza", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 287033, "titulo": "Court rules EU must set out timeline to end cage farming", "url": "https://www.lemonde.fr/en/environment/article/2026/11/25/court-rules-eu-must-set-out-timeline-to-end-cage-farming_6788377_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-25T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Europeia havia prometido, em 2021, apresentar legislação até o final de 2023 para proibir a criação de galinhas, coelhos, suínos e outros animais em gaiolas. No entanto, não cumpriu essa promessa.", "titulo_pt": "Corte decide que ue deve estabelecer prazo para fim da criação em gaiolas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 286460, "titulo": "Buscando frear endividamento, BC deve elevar capital regulatório de emissores de cartão", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/buscando-frear-endividamento-bc-deve-elevar-capital-regulatorio-de-emissores-de-cartao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Banco Central planeja aumentar as alíquotas de capital mínimo regulatório para emissores de cartão de crédito, com o objetivo de reduzir o endividamento dos brasileiros. A medida pode ser anunciada nesta quarta-feira (25) em comunicado do Comef (Comitê de Estabilidade Financeira).", "titulo_pt": "Banco central deve aumentar capital regulatório de emissores de cartão para frear endividamento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 286461, "titulo": "Juros forçados para baixo podem acabar em recessão, com mais inflação e pobreza", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/juros-forcados-para-baixo-podem-acabar-em-recessao-com-mais-inflacao-e-pobreza.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T17:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Propostas de redução da Selic antes de um ajuste fiscal podem levar a uma nova recessão econômica, com aumento da inflação e da pobreza, como ocorreu no Brasil em 2015 e 2016.", "titulo_pt": "Redução forçada dos juros pode resultar em recessão, inflação e pobreza", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 286548, "titulo": "Crescimento forte e inflação persistente complicam planos do Fed", "url": "https://veja.abril.com.br/coluna/macro-intelligence/crescimento-forte-e-inflacao-persistente-complicam-planos-do-fed/", "fonte_id": "veja", "data_pub": "2026-11-25T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A economia dos Estados Unidos registrou crescimento de 4,3% no terceiro trimestre, acima das expectativas, enquanto a inflação medida pelo núcleo do PCE atingiu 3,3% ao ano.", "titulo_pt": "Crescimento robusto e inflação persistente complicam planos do Fed", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 286660, "titulo": "EUA anunciam novas tarifas, miram Embraer e ampliam pressão comercial sobre Brasil e China", "url": "https://www.dw.com/pt-br/eua-anunciam-novas-tarifas-miram-embraer-e-ampliam-pressão-comercial-sobre-brasil-e-china/a-80053122?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-25T17:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos anunciou novas tarifas, incluindo uma taxa de 10% sobre aeronaves brasileiras, e ameaçou aumentar as taxas sobre o açúcar. A administração Trump acusa o Brasil de práticas comerciais desleais e também visa outros países.", "titulo_pt": "EUA anunciam novas tarifas, miram Embraer e ampliam pressão comercial sobre Brasil e China", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 286557, "titulo": "Varejo de moda perde 32,6 mil vagas formais, diz associação", "url": "https://veja.abril.com.br/coluna/faria-lima-news/varejo-de-moda-perde-326-mil-vagas-formais-diz-associacao/", "fonte_id": "veja", "data_pub": "2026-11-25T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O varejo de moda perdeu 32,6 mil vagas formais entre janeiro e agosto de 2026, de acordo com a associação responsável.", "titulo_pt": "Varejo de moda perde 32,6 mil vagas formais, diz associação", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 286558, "titulo": "Inflação ganha força em novembro? Veja o que esperar do IPCA-15", "url": "https://veja.abril.com.br/coluna/macro-intelligence/inflacao-ganha-forca-em-novembro-veja-o-que-esperar-do-ipca-15/", "fonte_id": "veja", "data_pub": "2026-11-25T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O IPCA-15, indicador oficial de inflação no Brasil, deve registrar uma elevação de 0,40% segundo a Warren, ou 0,35% conforme a BGC. A difusão da inflação também deve aumentar.", "titulo_pt": "Inflação deve ganhar força em novembro? Veja as projeções do IPCA-15", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 286727, "titulo": "Projetos-pilotos mostram custos menores em recuperação extrajudicial de veículos via Detran, diz estudo", "url": "https://www.jota.info/justica/projetos-pilotos-mostram-custos-menores-em-recuperacao-extrajudicial-de-veiculos-via-detran-diz-estudo", "fonte_id": "jota", "data_pub": "2026-11-25T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo apresentado pela Acrefi demonstra que projetos-piloto mostram custos menores na recuperação extrajudicial de veículos via Detran. O Marco Legal das Garantias prevê essa modalidade de recuperação.", "titulo_pt": "Estudo mostra que custos são menores na recuperação extrajudicial de veículos via Detran, diz acrefi", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 287035, "titulo": "EU and UK fine global fragrance giants more than €570 million over cartel", "url": "https://www.lemonde.fr/en/international/article/2026/11/25/eu-and-uk-fine-global-fragrance-giants-more-than-570-million-over-cartel_6788443_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-25T16:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Europeia e o Reino Unido multaram gigantes globais da fragrância por mais de 570 milhões de euros por formarem uma cartel, com empresas suíças Givaudan e Firmenich e o grupo norte-americano International Flavors & Fragrances trocando informações confidenciais por anos, possivelmente aumentando os preços de produtos cotidianos como cosméticos e detergentes de roupas.", "titulo_pt": "Ue e reino unido multam gigantes da fragrância por mais de 570 milhões de euros", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 286977, "titulo": "The U.S. economy is ripping", "url": "https://www.axios.com/2026/11/25/incomes-layoffs-rates-pce-ai", "fonte_id": "axios", "data_pub": "2026-11-25T16:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado de Wall Street tem enfrentado preocupações sobre o futuro do boom da IA, mas os dados econômicos divulgados recentemente indicam que a economia dos Estados Unidos está experimentando um forte crescimento. Essa expansão robusta está elevando os rendimentos dos americanos e reduzindo o ritmo de demissões.", "titulo_pt": "A economia dos EUA está em pleno boom", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 286465, "titulo": "Após taxação dos EUA, Embraer defende tarifa zero para a setor aeroespacial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/25/6568-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post468072", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T16:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Embraer reagiu à tarifa de 10% sobre a importação de aeronaves anunciada pelo governo dos EUA, afirmando que continua acreditando na manutenção do regime de tarifa zero para a indústria aeroespacial global.", "titulo_pt": "Embraer defende tarifa zero para setor aeroespacial após taxação dos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 286466, "titulo": "Equipe econômica prevê fechar o ano com déficit nas contas inferior a R$ 68 bi", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/equipe-economica-preve-fechar-o-ano-com-deficit-nas-contas-inferior-a-r-68-bi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T16:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A equipe econômica espera concluir 2026 com um déficit de aproximadamente R$ 68 bilhões, equivalente a cerca de 0,5% do PIB. Este resultado é ligeiramente melhor do que o previsto na última atualização.", "titulo_pt": "Equipe econômica projeta fechar 2026 com déficit inferior a R$ 68 bi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 286728, "titulo": "Pagamento de ‘13º de honorários’ para carreiras da AGU desrespeita decisão do STF, dizem especialistas", "url": "https://www.jota.info/executivo/pagamento-de-13o-de-honorarios-para-carreiras-da-agu-desrespeita-decisao-do-stf-dizem-especialistas", "fonte_id": "jota", "data_pub": "2026-11-25T16:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas afirmam que o pagamento de uma 13ª cota de honorários para carreiras da Advocacia-Geral da União desrespeita uma decisão do Supremo Tribunal Federal. Cada servidor recebeu R$ 11 mil extra.", "titulo_pt": "Pagamento de ‘13º de honorários’ para carreiras da AGU desrespeita decisão do STF, dizem especialistas", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 287091, "titulo": "Upgrade to US GDP figures keeps December rate rise in play for Fed", "url": "https://www.ft.com/content/a1aaf5be-176c-4c4c-99d6-00875f6933f3?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-25T16:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Bureau of Economic Analysis atualizou os dados do PIB dos EUA para o
