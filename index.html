<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

    <h4 id="flag-modal-titulo" style="font-size:17px;margin-bottom:14px"></h4>

</div>

<div class="modal-overlay" id="modal-relatorio">

    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "22/10/2026 19:19", "stats": {"noticias_novas": 601, "resumos_gerados": 237}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Na reta final da campanha presidencial, a disputa entre Lula e Flávio Bolsonaro ganha novos capítulos com a abertura de sigilos e o uso de canais de comunicação. O ministro André Mendonça, do TSE, afirmou que não cabe à corte determinar a quebra de sigilos e que as campanhas devem divulgar os dados que quiserem. A TV Globo realizou um debate entre os candidatos, mediado por César Tralli, após o Jornal Nacional. Em outro ponto, a Meta foi condenada a fornecer informações sobre o perfil do deputado Nikolas Ferreira no Instagram, sob pena de multa diária de R$ 100 mil. A defesa de Lula pediu ao TSE que o canal 'Exército do Lula' seja desvinculado da campanha do petista, enquanto o presidente do TSE, Alexandre de Moraes, determinou que a Meta apresentasse um relatório detalhado sobre o canal 'Exército do Lula' em 24 horas. Além disso, a campanha de Lula apresentou um termo assinado por ambos os candidatos autorizando a abertura do sigilo bancário, fiscal e telefônico de Lula e Flávio Bolsonaro. A pesquisa Datafolha aponta que Celina Leão lidera a disputa pelo segundo turno da eleição para o Governo do Distrito Federal com 60% dos votos válidos, enquanto Flávio Bolsonaro e Lula discursaram sobre os riscos de cortes em programas sociais e críticas à economia e segurança, respectivamente.", "mundo": "O novo embaixador da França nos Estados Unidos, Aurélien Lechevallier, assumiu seu cargo esta semana, após uma nomeação atrasada devido a uma disputa diplomática entre Paris e Washington. Em um desenvolvimento geopolítico, a Coreia do Sul enviou uma carta ao Conselho de Segurança das Nações Unidas pedindo que a Coreia do Norte assuma a responsabilidade pelos explosivos na Zona de Desarmamento. Além disso, um terremoto de magnitude 7,0 atingiu a região remota do Tibete, na China, causando 16 mortes e danos significativos a propriedades. Na política, a eleição do Segundo Distrito Congressual da Virgínia pode decidir o controle da Câmara dos Representantes, enquanto parlamentares dos EUA estão pedindo explicações a Zuckerberg sobre a atuação da Meta durante as eleições brasileiras. A Coreia do Norte também reduziu as condenações de 56 condenados por crimes sexuais contra menores, gerando críticas do governo chileno.\n\nA Rússia intensificou seus ataques militares na Ucrânia, bombardeando Kyiv com mísseis horas após anunciar a retomada das negociações trilaterais, causando pelo menos duas mortes e 22 feridos, incluindo quatro crianças. O presidente russo, Vladimir Putin, declarou que a Rússia está pronta para negociar um acordo final sobre a guerra com a Ucrânia, mas o presidente ucraniano, Volodymyr Zelensky, afirmou que novos ataques mostram que a posição do Kremlin não mudou. O diretor-executivo do IEA, Dr. Fatih Birol, alertou que a energia está se tornando uma arma geopolítica, enquanto o conflito no Oriente Médio poderia se intensificar com planos americanos de retomar ataques ao Irã. Além disso, Israel realizou um exercício militar próximo ao Irã antes das eleições para o novo Parlamento, e o Irã afirmou que sete navios foram atingidos no Estreito de Ormuz, ameaçando uma resposta mais ampla aos Estados Unidos.", "economia": "O Brasil enfrenta um cenário econômico complexo, com a maior importação de trigo em 30 anos, prevista para 2026/2027, devido à menor oferta interna. Segundo o setor privado argentino, essa situação ocorrerá devido à menor oferta interna. A Hitachi Energy planeja construir uma nova unidade no Brasil para fabricar componentes de transformadores de energia, investindo US$ 77 milhões. O Bradesco registrou um lucro líquido de R$ 7,1 bilhões no terceiro trimestre, um aumento de 14,6% em relação ao mesmo período do ano anterior. A DPSP, dona das redes Drogaria São Paulo e Drogarias Pacheco, está utilizando salas de vacinação em suas unidades para atrair clientes, registrando uma alta de 15% nas visitas. Além disso, o Ibovespa registrou uma queda de mais de 1% influenciada pela tensão política pré-segundo turno das eleições. A American Airlines prevê um prejuízo em 2026 devido ao aumento dos preços do combustível de aviação.", "tecnologia": "A TSMC, empresa líder na fabricação de chips, está buscando alternativas para seus equipamentos de fábrica, diversificando os fornecedores para garantir a continuidade da produção. Paralelamente, a SpaceX está negociando o acesso a 80 mil torres de telecomunicação para expandir sua operação de internet satelital Starlink e competir com as principais empresas de telefonia móvel nos Estados Unidos. A fusão entre SpaceX e Tesla, proposta por Musk, depende da aprovação de Musk mesmo, o que pode influenciar as negociações. A Meta, por sua vez, enfrenta críticas por possíveis violações de privacidade e as ações da empresa caíram 7% devido a um plano para financiar a expansão em inteligência artificial.", "ciencia": "A NASA convidou a mídia para participar do 26º Symposium de Exploração Espacial von Braun, que ocorrerá de 26 a 28 de outubro na Universidade do Alabama em Huntsville. O evento abordará temas como o retorno da humanidade à Lua e avanços na propulsão espacial. Um material especial, descoberto por pesquisadores, manteve seu estado quântico acima da temperatura ambiente, permanecendo estável até cerca de 135°F, um comportamento incomum que pode ser aplicado a temperaturas normais. A China encontrou um material inesperado em amostras da Lua, intrigando os cientistas devido ao tipo de ferro encontrado, que não deveria existir devido às condições de temperatura do satélite lunar. Além disso, a regeneração natural das florestas ajuda a conter a expansão de espécies invasoras. A pesquisa de Sander Lambrix analisou a relação entre as casas e o bem-estar das pessoas à medida que envelhecem, concluindo que as casas são muito mais do que apenas um ambiente físico e estão profundamente conectadas com os moradores em nível emocional, independentemente de estarem adequadas para pessoas idosas.", "cultura": "Um importante evento cultural ocorreu no leilão da Sotheby’s em 21 de outubro, quando um fragmento de escultura em mármore, representando o torso de um imperador romano, foi vendido por 34,3 milhões de dólares, estabelecendo um recorde para antiguidades romanas em leilões. Este valor, quase três vezes o preço estimado de 12 milhões, reflete a crescente valorização do mercado de arte antiga. Em outro desenvolvimento, a artista brasileira Anna Bella Geiger, com 93 anos, venceu o Prêmio Velázquez de Artes Plásticas, concedido pelo Ministério da Cultura da Espanha, com 100 mil euros, reconhecendo sua trajetória experimental e sua contribuição para a formação de várias gerações de artistas. Além disso, o programa Brasil no Mundo, da TV Brasil, abordou os protestos na França e em outros países europeus devido ao aumento do custo de vida, discutindo os efeitos das guerras no Oriente Médio e na Ucrânia na economia internacional.", "sociedade": "A Secretaria de Segurança Pública (SSP) realizou uma reunião com representantes de diferentes tendências políticas para discutir os planos de segurança e organização dos atos programados para o Distrito Federal na véspera da eleição. Em outro evento, a diretora do Presídio de Benfica, no Rio de Janeiro, foi presa sob suspeita de desviar alimentos, comprometendo a alimentação dos detentos. A participação feminina nos conselhos de empresas do IBrX100 aumentou 28% em cinco anos, mas 11 companhias ainda não contam com mulheres em seus conselhos. No Chile, uma pesquisa revelou que 84% dos chilenos acreditam que o país não está preparado para lidar com o envelhecimento da população. No Brasil, a Gavi e o UNICEF negociaram um preço mais baixo para a vacina contra a malária, economizando US$50 milhões para programas de imunização infantil. Em Santa Catarina, o governo decretou emergência sanitária em quatro cidades após a detecção da doença de Newcastle em granjas de perus. Na França, os protestos em 17 de outubro surpreenderam os participantes com o saque de lojas e o dano a edifícios públicos, levando alguns a considerar se retornarão às ruas neste sábado.", "meio_ambiente": "As ações globais para combater o clima estão insuficientes, conforme um relatório da ONU que destaca que as medidas implementadas estão muito aquém das necessidades atuais. O Brasil reduziu suas emissões em 6%, mas não cumpriu sua meta climática de 2025, com 2,06 bilhões de toneladas de CO₂ equivalente lançadas na atmosfera. O desmatamento na Amazônia Legal atingiu o menor valor desde 1988, com 3,3 mil km² desmatados, uma queda de 71% em comparação com 2022. O Santuário Padre Hurtado, em colaboração com a Fundação Circular, transformou a piscina existente em um estanque verde, incorporando sistemas de reutilização de água e espécies que promovem a biodiversidade. O relatório das consultoras do UN sobre o aquecimento global indica que quase todas as ilhas de corais de águas rasas no planeta correm o risco de colapso ecológico antes de 2075, com cerca de 24% dessas ilhas de corais já em situação crítica em mais de 80 países. Além disso, a persistente nubosidade está influenciando as temperaturas mais baixas de outubro, conforme explica Inti Bonomo, especialista em Ciências Ambientais, que prevê que esses efeitos se estenderão para os primeiros meses de 2027.", "direitos_humanos": "O Tribunal Penal Internacional (TPI), que julga crimes contra o direito internacional, recebeu o prêmio Sakharov do Parlamento Europeu por seu trabalho em prol da justiça e da democracia. Em contraste, um vídeo viral mostrou um soldado israelense lançando um gato sobre uma grade, levantando questionamentos sobre abusos de poder. A ex-vereadora brasileira Marielle Franco foi assassinada em 14 de março de 2018, o que gerou grande comoção. Além disso, a UNICEF, representada pelo diretor regional Edouard Beigbeder para o Oriente Médio e Norte da África, emitiu uma declaração sobre os assassinatos contínuos de crianças na Faixa de Gaza, destacando a preocupação do UNICEF com a situação dos menores nessas regiões. Em outro desenvolvimento, ações coletivas foram apresentadas na Austrália contra o Meta (anteriormente Facebook), acusando as plataformas de causarem dependência e exposição a conteúdo prejudicial a menores, buscando indenização para os jovens usuários. As restrições de privacidade em abrigos para vítimas de violência doméstica também foram um tema de debate, com críticas sobre a falta de proteção adequada dessas instituições."}, "resumo_do_dia": {"politica_nacional": [{"id": 219487, "titulo": "Mendonça diz que Lula e Flávio Bolsonaro podem abrir seus sigilos e que medida independe de aval do TSE", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/mendonca-diz-que-lula-e-flavio-bolsonaro-podem-abrir-seus-sigilos-e-que-medida-independe-de-aval-do-tse.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-22T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro André Mendonça, do TSE, afirmou que não cabe à corte determinar a quebra de sigilo e que as campanhas de Lula e Flávio Bolsonaro devem divulgar os dados que quiserem.", "titulo_pt": "Mendonça diz que Lula e Flávio Bolsonaro podem abrir seus sigilos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 219488, "titulo": "TSE dá prazo de 12 horas para Meta explicar alcance do perfil de Nikolas no Instagram", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/tse-da-prazo-de-12-horas-para-meta-explicar-alcance-do-perfil-de-nikolas-no-instagram.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-22T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) concedeu à Meta um prazo de 12 horas para fornecer informações sobre a amplificação do perfil do deputado Nikolas Ferreira no Instagram, sob pena de multa diária de R$ 100 mil. A decisão foi tomada após a Meta não fornecer os dados solicitados no prazo estipulado.", "titulo_pt": "TSE dá prazo de 12 horas para Meta explicar amplificação do perfil de Nikolas no Instagram", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 219489, "titulo": "Guerra dos sigilos e outros factoides dominam reta final da campanha; veja vídeo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/guerra-dos-sigilos-e-outros-factoides-dominam-reta-final-da-campanha-veja-video.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-22T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A reta final da campanha eleitoral está sendo marcada por tensões e eventos inesperados, especialmente em uma disputa muito próxima. Os sigilos e as notícias falsas têm sido temas dominantes nos últimos dias.", "titulo_pt": "Guerra dos sigilos e fake news dominam reta final da campanha; veja vídeo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 219503, "titulo": "Sigilos de Lula e Flávio: Mendonça diz que não cabe ao TSE 'definir o que cada candidato quer ou não divulgar'", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/22/desafio-dos-sigilos-mendonca-diz-que-nao-cabe-ao-tse-definir-o-que-cada-candidato-quer-ou-nao-divulgar.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-22T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "André Mendonça, vice-presidente do Tribunal Superior Eleitoral (TSE), afirmou que a decisão sobre o que os candidatos Lula e Flávio Bolsonaro querem divulgar não cabe à Justiça Eleitoral. A decisão foi tomada no processo que tratava da quebra de sigilo dos dois candidatos.", "titulo_pt": "Mendonça diz que não cabe ao TSE definir o que cada candidato quer ou não divulgar", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 219504, "titulo": "Guerra das campanhas: lei eleitoral não prevê regras para a abertura de sigilo por candidatos", "url": "https://g1.globo.com/politica/noticia/2026/10/22/guerra-das-campanhas-lei-eleitoral-nao-preve-regras-para-a-abertura-de-sigilo-por-candidatos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-22T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva (PT) e Flávio Bolsonaro (PL) chegaram a um acordo para a abertura de sigilos bancário, fiscal e telefônico, mas a medida pode enfrentar obstáculos legais, pois a lei eleitoral não prevê regras específicas para essa autorização no TSE.", "titulo_pt": "Guerra das campanhas: lei eleitoral não prevê regras para a abertura de sigilo por candidatos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 219505, "titulo": "Flávio Bolsonaro x Lula: veja quem Augusto Cury, Renan Santos e outros candidatos a presidente derrotados no 1º turno apoiam", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/22/flavio-bolsonaro-x-lula-augusto-cury-renan-santos-candidatos-presidente-derrotados-apoio.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-22T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Candidatos derrotados no primeiro turno das eleições brasileiras se dividem entre apoios a Flávio Bolsonaro e Luiz Inácio Lula da Silva para o segundo turno. Cinco ex-presidenciáveis já declararam apoio a Flávio Bolsonaro, incluindo Augusto Cury, Clariana Barão, Romeu Zema, Ronaldo Caiado e Wilson Grassi.", "titulo_pt": "Flávio Bolsonaro x Lula: veja apoios de ex-candidatos derrotados no 1º turno", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 219490, "titulo": "Lula foca atos com multidão na reta final pensando em cortes para redes", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/lula-foca-atos-com-multidao-na-reta-final-pensando-em-cortes-para-redes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-22T21:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Lula focará em atos com multidões na véspera do segundo turno das eleições para aumentar a mobilização e alcançar cortes nas redes sociais.", "titulo_pt": "Lula planeja atos com multidão na reta final para impulsionar militância e fazer cortes nas redes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 219610, "titulo": "Mendonça mantém no ar vídeo de Flávio sobre Lula “esquecer” Bolsa Família", "url": "https://www.cnnbrasil.com.br/eleicoes/mendonca-mantem-no-ar-video-de-flavio-sobre-lula-esquecer-bolsa-familia/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-22T21:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do TSE, Luís Roberto Barroso, manteve no ar um vídeo de Flávio Bolsonaro criticando Lula, mas proibiu o impulsionamento pago do conteúdo, que critica uma fala do petista sobre não saber que o Bolsa Família estava quase quatro anos sem reajuste.", "titulo_pt": "Mendonça deixa vídeo de Flávio sobre Lula no ar, mas proíbe impulsionamento", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 219491, "titulo": "Curso gratuito online aborda jornalismo de soluções", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/novo-em-folha/2026/10/curso-gratuito-online-aborda-jornalismo-de-solucoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-22T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estão abertas as inscrições para um treinamento online e gratuito sobre jornalismo de soluções, que ocorrerá em 5 de novembro, das 19h às 21h (horário de Brasília).", "titulo_pt": "Treinamento online gratuito aborda jornalismo de soluções", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 219566, "titulo": "Previsão de superávit no Orçamento de 2027 está mantida, diz Durigan", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/previsao-de-superavit-no-orcamento-de-2027-esta-mantida-diz-durigan", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-22T20:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro da Fazenda, Dario Durigan, afirmou que a previsão de superávit primário para o Orçamento de 2027 permanece inalterada, mesmo após anúncios de medidas que afetam as contas públicas. As iniciativas foram planejadas dentro das regras fiscais vigentes e sem alterações no arcabouço fiscal.", "titulo_pt": "Previsão de superávit no Orçamento de 2027 mantida, diz Durigan", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 219494, "titulo": "Kassio manda Meta apresentar em 24 horas relatório detalhado sobre ações do 'Exército do Lula'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/kassio-manda-meta-apresentar-em-24-horas-relatorio-detalhado-sobre-acoes-do-exercito-de-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-22T20:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do TSE, Kassio Nunes Marques, ordenou que a Meta apresentasse um relatório detalhado sobre o canal 'Exército do Lula' administrado pelo deputado André Janones (Rede-MG) em até 24 horas.", "titulo_pt": "Kassio determina que Meta entregue relatório sobre 'Exército do Lula' em 24 horas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 219507, "titulo": "Defesa pede ao TSE desvinculação do canal 'Exército do Lula' da campanha de Lula", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/22/defesa-pede-ao-tse-desvinculacao-do-canal-exercito-do-lula-da-campanha-de-lula.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-22T20:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A defesa de Lula pediu ao TSE que o canal de mensagens do WhatsApp 'Exército do Lula' seja desvinculado da sua campanha. O canal, coordenado pelo deputado André Janones, tem mais de 8,3 milhões de inscritos e não é oficialmente ligado à campanha do petista.", "titulo_pt": "Defesa de Lula pede desvinculação do canal 'Exército do Lula' do registro de campanha", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 219495, "titulo": "Datafolha: Celina Leão mantém liderança no DF com 60% dos votos válidos, contra 40% de Grass", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/datafolha-celina-leao-mantem-lideranca-no-df.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-22T20:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha aponta que Celina Leão lidera a disputa pelo segundo turno da eleição para o Governo do Distrito Federal com 60% dos votos válidos, enquanto Grass obteve 40%.", "titulo_pt": "Celina Leão lidera segundo turno para governador do DF com 60% dos votos válidos, contra 40% de Grass", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 219508, "titulo": "Datafolha no DF: 32% avaliam gestão Celina Leão como positiva e 31%, como negativa", "url": "https://g1.globo.com/df/distrito-federal/eleicoes/2026/noticia/2026/10/22/datafolha-df-avaliacao-governo-celina-22-outubro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-22T20:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha, divulgada nesta quinta-feira (22), mostrou que 32% dos eleitores avaliam a gestão da governadora Celina Leão (PP) como positiva, enquanto 31% consideram negativa. Celina assumiu o cargo em março deste ano, após ser vice-governadora.", "titulo_pt": "Datafolha no DF: 32% avaliam gestão Celina Leão como positiva e 31%, como negativa", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 219509, "titulo": "Datafolha no DF, 2º turno: Celina Leão, 54%; Leandro Grass, 37%", "url": "https://g1.globo.com/df/distrito-federal/eleicoes/2026/noticia/2026/10/22/datafolha-df-governador-segundo-turno-22-outubro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-22T20:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Datafolha divulgada nesta quinta-feira (22) indica que Celina Leão (PP) lidera com 54% das intenções de voto no segundo turno das eleições do Distrito Federal, seguida por Leandro Grass (PT) com 37%. A votação acontecerá no próximo domingo (25).", "titulo_pt": "Datafolha no DF, 2º turno: celina Leão, 54%; Leandro Grass, 37%", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 219496, "titulo": "Pensamento obsessivo com eleição pode gerar irritabilidade, falta de sono e dor de cabeça", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/equilibrioesaude/2026/10/pensamento-obsessivo-com-eleicao-pode-gerar-irritabilidade-falta-de-sono-e-dor-de-cabeca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-22T19:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A estagiária de psicologia Larissa Santos, de 29 anos, esas envolvidas.", "titulo_pt": "Quatro empresas financeiras aprovam fusão", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 219460, "titulo": "Janela de importação de etanol pelo Brasil deve ser reaberta entre dezembro e janeiro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/janela-de-importacao-de-etanol-pelo-brasil-deve-ser-reaberta-entre-dezembro-e-janeiro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-22T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A janela de importação de etanol do Brasil deve ser reaberta entre dezembro e janeiro, apesar de uma produção recorde esperada para o país em 2026/2027, segundo a corretora StoneX e a consultoria Argus.", "titulo_pt": "Janela de importação de etanol pelo Brasil deve ser reaberta entre dezembro e janeiro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 219753, "titulo": "“Año extraordinario”: Brasil prevé la mayor importación de trigo en 30 años y abre una oportunidad para la Argentina", "url": "https://www.lanacion.com.ar/economia/campo/ano-extraordinario-brasil-preve-la-mayor-importacion-de-trigo-en-30-anos-y-abre-una-oportunidad-para-nid22102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-22T21:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Brasil prevê a maior importação de trigo em 30 anos, com compras de 2026/2027 estimadas em até 9 milhões de toneladas devido à menor oferta interna. O setor privado argentino espera excedentes para atender parte dessa demanda e aumentar as exportações de farinha.", "titulo_pt": "Ano extraordinário: Brasil planeja maior importação de trigo em 30 anos e abre oportunidade para a Argentina", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 219461, "titulo": "Hitachi Energy anuncia nova unidade no Brasil e eleva plano de investimentos a US$ 350 milhões", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/hitachi-energy-anuncia-nova-unidade-no-brasil-e-eleva-plano-de-investimentos-a-us-350-milhoes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-22T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Hitachi Energy planeja construir uma nova unidade no Brasil para fabricar componentes de transformadores de energia, investindo US$ 77 milhões. O projeto visa expandir a oferta desses componentes essenciais para a infraestrutura elétrica. Além disso, a empresa elevou seu plano de investimentos globais para US$ 350 milhões.", "titulo_pt": "Hitachi Energy anuncia nova unidade no Brasil e eleva investimentos para US$ 350 milhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 219679, "titulo": "Empresário vai responder por fraude ao seguro por enterrar carro no quintal", "url": "https://www.metropoles.com/sao-paulo/empresario-vai-responder-por-fraude-ao-seguro-por-enterrar-carro-no-quintal", "fonte_id": "metropoles", "data_pub": "2026-10-22T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um empresário foi denunciado por fraude ao seguro após enterrar seu carro no quintal de sua empresa. A Polícia Civil descobriu que o BO feito pelo empresário em 2020 por roubo era falso, já que o veículo estava enterrado em um terreno pertencente à própria empresa.", "titulo_pt": "Empresário responderá por fraude ao seguro por enterrar carro no quintal", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 219599, "titulo": "Bradesco tem lucro de R$ 7,1 bilhões no 3º tri, alta de 14,6%", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/bradesco-tem-lucro-de-r-71-bilhoes-no-3o-tri-alta-de-146/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-22T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Bradesco registrou lucro de R$ 7,1 bilhões no terceiro trimestre, uma alta de 14,6% em comparação com o mesmo período anterior. A carteira de crédito da instituição alcançou R$ 1,15 trilhão no final de setembro, crescendo 11,1% em relação ao mesmo período do ano anterior.", "titulo_pt": "Bradesco registra lucro de R$ 7,1 bilhões no 3º tri, alta de 14,6%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 219462, "titulo": "Bradesco segura despesas e lucro sobe para R$ 7,1 bilhões no 3º tri", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/bradesco-segura-despesas-e-lucro-sobe-para-r-71-bilhoes-no-3o-tri.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-22T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Bradesco conseguiu manter as despesas sob controle e registrou um lucro líquido de R$ 7,1 bilhões no terceiro trimestre de 2026, um aumento de 0,8% em comparação com o trimestre anterior e de 14,6% em relação ao mesmo período do ano anterior. O banco operou com maior cautela na concessão de crédito durante o período.", "titulo_pt": "Bradesco mantém despesas sob controle e lucro sobe para R$ 7,1 bilhões no 3º tri", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 219463, "titulo": "Farm planeja entrar na Ásia em três anos, mesmo com possível venda da empresa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/farm-planeja-entrar-na-asia-em-tres-anos-mesmo-com-possivel-venda-da-empresa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-22T21:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Farm Rio planeja expandir para o mercado asiático em três anos, com foco na China e Austrália. A empresa já tem experiência nos Estados Unidos e na Europa e busca alvos estratégicos devido à influência regional da China e à proximidade cultural da Austrália com a marca.", "titulo_pt": "Farm rio planeja entrar na Ásia em três anos, mesmo com possível venda da empresa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 219464, "titulo": "Um guia para os impostos ruins do Reino Unido às vésperas do orçamento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/um-guia-para-os-impostos-ruins-do-reino-unido-as-vesperas-do-orcamento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-22T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O autor menciona um exemplo de impostos hereditários no Reino Unforto, citando Douglas Adams e economistas que estudam estratégias para adiar a data oficial da morte para reduzir a obrigação de pagamento de imposto sobre herança. O título original em português brasileiro seria: 'Um guia para os impostos hereditários ruins do Reino Unido às vésperas do orçamento'.", "titulo_pt": "Um guia para os impostos hereditários ruins do Reino Unido às vésperas do orçamento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 219465, "titulo": "Trabalhadora grávida orientada a vomitar em lixeira receberá R$ 30 mil em ação contra Vivo e call center", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/trabalhadora-gravida-orientada-a-vomitar-em-lixeira-recebera-r-30-mil-em-acao-contra-vivo-e-call-center.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-22T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior do Trabalho aumentou a indenização por danos morais de R$ 5.000 para R$ 30 mil para uma operadora de telemarketing grávida que era orientada a vomitar em uma lata de lixo durante o trabalho. A decisão foi unânime na 7ª Turma e foi divulgada em 21 de outubro de 2026.", "titulo_pt": "Trabalhadora grávida que era orientada a vomitar em lixeira receberá R$ 30 mil em ação contra Vivo e call center", "vei cos-centrais-devem-se-preocupar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-22T20:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os bancos centrais podem se preocupar com a possibilidade de inteligência artificial causar inflação sem aumentar a produtividade. O autor expressa sua irritação com assistentes de IA e sugere que formuladores de políticas econômicas também podem temer um impacto similar a escala global.", "titulo_pt": "IA e inflação: bancos centrais devem se preocupar?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 219201, "titulo": "TSMC seeks factory-equipment alternatives", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/23/2003866444", "fonte_id": "taipei_times", "data_pub": "2026-10-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A TSMC está buscando alternativas para equipamentos de fábrica. A empresa busca diversificar fornecedores para garantir a continuidade de sua produção.", "titulo_pt": "TSMC busca alternativas para equipamentos de fábrica", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 219203, "titulo": "Musk might affect SpaceX-Tesla talks", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/23/2003866446", "fonte_id": "taipei_times", "data_pub": "2026-10-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Está sendo discutido a possibilidade de Musk influenciar as negociações entre SpaceX e Tesla.", "titulo_pt": "Musk poderia influenciar conversas entre spacex e tesla", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 219204, "titulo": "Egis and SiPearl ink deal", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/23/2003866447", "fonte_id": "taipei_times", "data_pub": "2026-10-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Egis e a SiPearl firmaram um acordo recentemente. As empresas não forneceram detalhes adicionais sobre o contrato.", "titulo_pt": "Egis e SiPearl selam acordo", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 219618, "titulo": "SpaceX negocia acesso a 80 mil torres para desafiar gigantes da telefonia nos EUA", "url": "https://www.infomoney.com.br/business/spacex-negocia-acesso-a-80-mil-torres-para-desafiar-gigantes-da-telefonia-nos-eua/", "fonte_id": "infomoney", "data_pub": "2026-10-22T21:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A SpaceX está negociando o acesso a 80 mil torres para expandir a sua operação de internet satelital Starlink e competir com as principais empresas de telefonia móvel dos Estados Unidos, como AT&T, Verizon e T-Mobile.", "titulo_pt": "Spacex negocia acesso a 80 mil torres para desafiar gigantes da telefonia nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 219942, "titulo": "Canva’s first AI image model plans designs before generating them", "url": "https://www.theverge.com/ai-artificial-intelligence/1017151/canva-craft-in-house-ai-model", "fonte_id": "the_verge", "data_pub": "2026-10-22T21:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Canva lançou um modelo de geração de imagens chamado Canva Craft, que usa uma arquitetura em duas etapas para planejar um design antes de gerar a imagem. O modelo oferece maior precisão, consistência e controle.", "titulo_pt": "Canva lança modelo de AI para gerar imagens que planeja designs antes de criar", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 219943, "titulo": "PC shipments dropped over 20 percent in Q3 due to RAM price hikes", "url": "https://www.theverge.com/gadgets/1017144/global-pc-shipments-dropped-q3-2026-ram", "fonte_id": "the_verge", "data_pub": "2026-10-22T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas de PCs globais caíram 21% no terceiro trimestre de 2026 em comparação com o mesmo período do ano anterior, devido a aumentos de preços no ram. As vendas de smartphones também atingiram um mínimo de 14 anos no mesmo período.", "titulo_pt": "Vendas de pcs caíram mais de 20% no terceiro trimestre devido a aumentos de preços no RAM", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 219928, "titulo": "Designing an AI serving harness built to last", "url": "https://www.technologyreview.com/2026/10/22/1146109/designing-an-ai-serving-harness-built-to-last/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-22T21:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A próxima vantagem competitiva no AI empresarial depende menos da escolha do modelo do que do que se constrói ao seu redor. O foco tem mudado para o desenvolvimento de infraestruturas duráveis que suportam esses modelos avançados.", "titulo_pt": "Projeto de um suporte para AI projetado para durar", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 219608, "titulo": "SpaceX diz que fusão com a Tesla depende de aprovação de Musk", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/spacex-diz-que-fusao-com-a-tesla-depende-de-aprovacao-de-musk/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-22T21:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Musk afirmou que uma fusão entre SpaceX e Tesla seria uma 'boa ideia', mas ressaltou que isso depende da aprovação dele mesmo. A SpaceX declarou que a fusão depende da aprovação de Musk.", "titulo_pt": "Musk diz que fusão entre spacex e Tesla seria uma boa ideia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 219934, "titulo": "Rivian buys world model startup to accelerate self-driving ambitions", "url": "https://techcrunch.com/2026/10/22/rivian-buys-world-model-startup-to-accelerate-self-driving-ambitions/", "fonte_id": "techcrunch", "data_pub": "2026-10-22T21:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Rivian adquiriu a startup Third Dimension, cuja tecnologia utiliza IA para corresponder ao mundo físico, o que, combinado com os dados abundantes da Rivian, poderia se transformar em um simulador valioso.", "titulo_pt": "Rivian compra startup para acelerar ambícios de autônomos", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 219614, "titulo": "Justiça nega liminar que pedia suspensão de IA de advocacia", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/justica-nega-liminar-que-pedia-suspensao-de-ia-de-advocacia/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-22T20:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça negou um pedido da OAB SP para interromper as atividades jurídicas ofertadas pela Enter. OAB SP havia solicitado a suspensão de uma inteligência artificial de advocacia.", "titulo_pt": "Justiça nega pedido para interromper atividades de IA de advocacia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 219945, "titulo": "Meta’s AI could still scrape news sites, legal experts say", "url": "https://www.theverge.com/tech/1017082/meta-terms-update-ai-training-concerns", "fonte_id": "the_verge", "data_pub": "2026-10-22T20:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta alterou as condições de seu negócio para remover o texto que permitia que a empresa treinasse seus modelos de IA em sites de notícias, como The Verge, mas especialistas em direito acreditam que essas mudanças não são suficientes para resolver suas preocupações. O texto original sugere que a empresa ainda poderia raspar esses sites.", "titulo_pt": "Meta’s AI ainda pode raspar sites de notícias, dizem especialistas em direito", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 219562, "titulo": "Plano da Meta para financiar expansão em IA abala ações de tecnologia", "url": "https://veja.abril.com.br/economia/plano-da-meta-para-financiar-expansao-em-ia-abala-acoes-de-tecnologia/", "fonte_id": "veja", "data_pub": "2026-10-22T20:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O plano da Meta para financiar a expansão em inteligência artificial fez as ações da empresa cairem 7%. Os investidores buscaram alternativas, como títulos do Tesouro dos EUA.", "titulo_pt": "Plano da Meta para expansão em IA abala ações de tecnologia", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 219947, "titulo": "The FCC is beginning to block gadgets with ‘foreign surveillance chips’", "url": "https://www.theverge.com/policy/1017016/fcc-block-foreign-surveillance-chips-hivision-huawei-loophole", "fonte_id": "the_verge", "data_pub": "2026-10-22T20:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O FCC (Comissão Federal de Comunicações) bloqueou pela primeira vez dois dispositivos por conterem supostos 'chip de vigilância estrangeira'. Em 13 de outubro, o FCC concedeu a si mesmo o poder de bloquear gadgets que contenham chips de qualquer empresa listada como ameaça à segurança nacional.", "titulo_pt": "O FCC começa a bloquear gadgets com 'chip de vigilância estrangeira'", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 219961, "titulo": "Disgraced eMudhra drops out of TLS business after using cert private key of 4", "url": "https://arstechnica.com/security/2026/10/disgraced-emudhra-drops-out-of-tls-business-following-certificate-debacle/", "fonte_id": "ars_technica", "data_pub": "2026-10-22T20:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa eMudhra saiu do negócio de TLS após um erro na cerimônia de assinatura de chave que permitiu a emissão de credenciais da web para qualquer site. Este erro permitiu que a empresa criasse certificados SSL válidos para qualquer domínio.", "titulo_pt": "Emudhra sai do negócio de TLS após erro na cerimônia de assinatura de chave", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 219952, "titulo": "The Google Home Speaker Has Been Secretly Eating My Wi-Fi Data", "url": "https://www.wired.com/story/google-home-speaker-bug-oct-2026/", "fonte_id": "wired", "data_pub": "2026-10-22T20:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Google Home Speaker estava consumindo mais dados do que todos os outros dispositivos do autor juntos. A investigação revelou que outros dispositivos inteligentes de casa também apresentavam o mesmo problema.", "titulo_pt": "O Google Home Speaker estava secretamente comendo meus dados de Wi-Fi", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 219935, "titulo": "Arc browser sunsets December 22 as The Browser Company doubles down on Dia", "url": "https://techcrunch.com/2026/10/22/arc-browser-sunsets-december-22-as-the-browser-company-doubles-down-on-dia/", "fonte_id": "techcrunch", "data_pub": "2026-10-22T20:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O navegador Arc encerrou suas operações em 22 de dezembro, enquanto The Browser Company concentra seus esforços no desenvolvimento do navegador Dia. O Arc era apreciado por um grupo dedicado de entusiastas, mas nunca se tornou a alternativa mass-marcetista ao Chrome que seus criadores haviam planejado.", "titulo_pt": "Arc encerra em 22 de dezembro enquanto The Browser Company aposta no Dia", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 220013, "titulo": "Europe's Space Rider vehicle comes crashing down during drop test", "url": "https://www.space.com/space-exploration/launches-spacecraft/europes-space-rider-vehicle-comes-crashing-down-during-drop-test", "fonte_id": "space_com", "data_pub": "2026-10-22T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um protótipo em grande escala do veiculo Space Rider da Europa não conseguiu desplegar seu paraquedas durante um teste de queda. No entanto, oficiais da ESA esperam que esse imprevisto não atrasará o progresso para o primeiro foguete reutilizável da agência.", "titulo_pt": "Protótipo do Space Rider da Europa falha em teste de queda", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 219923, "titulo": "China-made cancer drug to go on sale in US after Americans travel to buy it", "url": "https://www.scmp.com/news/us/article/3371835/china-made-cancer-drug-go-sale-us-after-americans-travel-buy-it", "fonte_id": "scmp", "data_pub": "2026-10-22T21:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "AstraZeneca anunciou que começará a vender um medicamento contra o câncer nos Estados Unidos após ser criticada por não trazer o medicamento ao mercado local mais rapidamente. Alguns americanos viajaram para a China para adquirir o medicamento, que foi aprovado pela FDA americana, mas permanecia indisponível no país.", "titulo_pt": "Medicamento chinês contra câncer será vendido nos EUA após pressão", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 219973, "titulo": "Helping microgreens pack even more of a nutritional punch", "url": "https://phys.org/news/2026-10-microgreens-nutritional.html", "fonte_id": "phys_org", "data_pub": "2026-10-22T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Penn State estão trabalhando em várias áreas relacionadas a microverdes, publicando três estudos que abordam a enriquecimento de ferro, a produção indoor eficiente e uma técnica de imitação de relâmpagos que pode melhorar o crescimento, a produção e a qualidade nutricional dos microverdes.", "titulo_pt": "Ajuda microverdes a tornarem-se ainda mais potentes em termos nutricionais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 219974, "titulo": "Amino acid stabilizes material's quantum state above room temperature", "url": "https://phys.org/news/2026-10-amino-acid-stabilizes-material-quantum.html", "fonte_id": "phys_org", "data_pub": "2026-10-22T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores descobriram que um material especial mantém seu estado quântico acima da temperatura ambiente, até cerca de 135°F (57°C), temperatura próxima à registrada no Vale do Morte, Califórnia. O comportamento incomum do material, notável em condições extremamente frias, pode ser estendido a temperaturas bem acima do normal.", "titulo_pt": "Ácido amino estabiliza estado quântico do material acima da temperatura ambiente", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 219975, "titulo": "Most AI chatbots stay in the political middle ground, with Grok being an exception", "url": "https://phys.org/news/2026-10-ai-chatbots-stay-political-middle.html", "fonte_id": "phys_org", "data_pub": "2026-10-22T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A eleição parlamentar de 2026 foi a primeira eleição parlamentar na Suécia desde que os chatbots de IA se tornaram uma parte significativa da vida cotidiana, especialmente para jovens e eleitores primeiros. Hoje, é possível recorrer a diversos serviços de chatbots, como o ChatGPT, para obter informações sobre política, discutir questões políticas ou ajudar a aperfeiçoar argumentos.", "titulo_pt": "A maioria dos chatbots de IA se mantém no centro político, com Grok sendo uma exceção", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 220000, "titulo": "NASA Invites Media to 2026 von Braun Space Exploration Symposium", "url": "https://www.nasa.gov/news-release/nasa-invites-media-to-2026-von-braun-space-exploration-symposium/", "fonte_id": "nasa_news", "data_pub": "2026-10-22T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA convida a mídia para participar do 2026 von Braun Space Exploration Symposium, que ocorrerá de 26 a 28 de outubro na Universidade da Alabama em Huntsville. O evento abordará temas como o retorno da humanidade à Lua, infraestrutura lunar sustentável, propulsão espacial avançada e a força de trabalho espacial em evolução.", "titulo_pt": "NASA convida mídia para 2026 von Braun Space Exploration Symposium", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 219805, "titulo": "Pionero estudio muestra impacto del estrés en estudiantes universitarios", "url": "https://www.latercera.com/educacion/noticia/pionero-estudio-muestra-impacto-del-estres-en-estudiantes-universitarios/", "fonte_id": "la_tercera", "data_pub": "2026-10-22T21:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo realizado pela Universidade de Las Américas analisou a qualidade de vida de 125 alunos universitários e constatou que 60% deles apresentam níveis moderados ou altos de estresse. Além disso, aproximadamente 40% dos estudantes apresentam sintomas relacionados ao Síndrome de Intestino Irritado (SII).", "titulo_pt": "Pioneiro estudo mostra impacto do estresse em estudantes universitários", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 220001, "titulo": "Spiral’s Edge", "url": "https://www.nasa.gov/image-article/spirals-edge/", "fonte_id": "nasa_news", "data_pub": "2026-10-22T21:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA liberou uma imagem da Telescopio Espacial Hubble em 16 de outubro de 2026, mostrando a galáxia espiral intermediária NGC 1827, vista de frente, localizada a aproximadamente 37 milhões de anos-luz na constelação Columba. A imagem faz parte de uma pesquisa que examina 260 galáxias satélite ao redor de 22 galáxias-mãe semelhantes à Via Láctea em um raio de", "titulo_pt": "Borda da galáxia ngc 1827", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 219976, "titulo": "DNA and underwater footage reveal two new species of deep-sea siphonophores", "url": "https://phys.org/news/2026-10-dna-underwater-footage-reveal-species.html", "fonte_id": "phys_org", "data_pub": "2026-10-22T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da MBARI, da Universidade de Gdańsk, da NYU e da Universidade de Yale examinaram Bargmannia sifonóforos usando material museal, observações submarinas e sequenciamento genômico. Eles descobriram duas novas espécies: Bargmannia marlena e Bargmannia pyrosa.", "titulo_pt": "DNA e filmagens submarinas revelam duas novas espécies de sifonóforos do fundo do mar", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 219977, "titulo": "Canine cancer patients contribute to next-generation minimally invasive cancer therapies for dogs and humans", "url": "https://phys.org/news/2026-10-canine-cancer-patients-contribute-generation.html", "fonte_id": "phys_org", "data_pub": "2026-10-22T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas de um novo laboratório na Purdue University estão utilizando cães com câncer para desenvolver novas terapias minimamente invasivas para cães e humanos. O método utilizado é a ablação tumoral.", "titulo_pt": "Cães com câncer contribuem para novas terapias minimamente invasivas para cães e humanos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 219978, "titulo": "Natural forest regeneration helps curb spread of invasive species", "url": "https://phys.org/news/2026-10-natural-forest-regeneration-curb-invasive.html", "fonte_id": "phys_org", "data_pub": "2026-10-22T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa, publicada na revista Nature Plants, mostra que a regeneração natural das florestas ajuda a conter a expansão de espécies invasoras. Os dados analisados, provenientes de mais de 1.500 áreas de regeneração florestal na América, indicam que as espécies exóticas dominam inicialmente, mas esse domínio é temporário, multiplicando-se facilmente nos primeiros 10 a 20 anos.", "titulo_pt": "Regeneração natural de florestas auxilia na contenção de espécies invasoras", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 219602, "titulo": "China acha material inesperado na Lua – e há mais de 2 anos tenta decifrar como foi parar lá", "url": "https://www.cnnbrasil.com.br/curiosidades/china-acha-material-inesperado-na-lua-e-ha-mais-de-2-anos-tenta-decifrar-como-foi-parar-la/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-22T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um material inesperado foi encontrado em amostras da missão chinesa à Lua em 2024, intrigando os cientistas devido ao tipo de ferro encontrado, que não deveria existir devido às condições de temperatura do satélite lunar.", "titulo_pt": "China encontra material inesperado na Lua – e há mais de 2 anos tenta decifrar como foi parar lá", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 219979, "titulo": "The assumption about farm automation that may be wrong", "url": "https://phys.org/news/2026-10-assumption-farm-automation-wrong.html", "fonte_id": "phys_org", "data_pub": "2026-10-22T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade da Califórnia, Davis, estudaram 16 operações de plantação de fruticultura na Califórnia e no Washington durante três anos e descobriram que a automação agrícola ainda requer conhecimento humano. O estudo, baseado em 165 entrevistas detalhadas com trabalhadores e produtores, foi publicado na revista New Technology, Work and Employment.", "titulo_pt": "A suposição sobre a automação na agricultura que pode estar errada", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 220014, "titulo": "On this day in space! Oct. 22, 1992: Ashes of 'Star Trek' creator Gene Roddenberry launch into space on NASA shuttle", "url": "https://www.space.com/space-exploration/on-this-day-in-space-october-22-2026", "fonte_id": "space_com", "data_pub": "2026-10-22T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 22 de outubro de 1992, as cinzas de Gene Roddenberry, criador de 'Star Trek', foram levadas ao espaço a bordo da nave espacial Columbia. Este evento marcou uma homenagem póstuma ao visionário da série de ficção científica.", "titulo_pt": "22 De outubro de 1992: cinzas de Gene Roddenberry, criador de 'Star Trek', são levadas ao espaço", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 219980, "titulo": "Public health programs can 'rewire' social networks, study finds", "url": "https://phys.org/news/2026-10-health-rewire-social-networks.html", "fonte_id": "phys_org", "data_pub": "2026-10-22T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um programa educacional projetado para melhorar a saúde materna e infantil alterou fundamentalmente a estrutura social das vilas rurais hondurenhas onde foi implementado, conforme descoberto em uma nova pesquisa liderada pela Yale. Os resultados indicam que programas de saúde pública podem reconfigurar redes sociais, com implicações para intervenções em qualquer lugar que busquem melhorar o bem-estar das pessoas por meio da disseminação de informações ou mudança de comportamentos por contágio social.", "titulo_pt": "Programas de saúde pública podem 'reconfigurar' redes sociais, estudo descobre", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 219981, "titulo": "Disiplinang walang palo: Challenging common Filipino parenting misbeliefs", "url": "https://phys.org/news/2026-10-disiplinang-walang-palo-common-filipino.html", "fonte_id": "phys_org", "data_pub": "2026-10-22T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos internacionais que incluem famílias filipinas mostram que o espancamento mais frequente está associado a maior ansiedade e agressividade nas crianças ao longo do tempo. Esses achados desafiam a crença comum de que o 'pamamalo' (espancamento) gera crianças mais disciplinadas.", "titulo_pt": "Disciplina sem palos: desafiando a crença filipina de que espancamento produz crianças mais disciplinadas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 220050, "titulo": "Charli XCX Will Appear in a Martin Scorsese Film", "url": "https://pitchfork.com/story/charli-xcx-will-appear-in-a-martin-scorsese-film/", "fonte_id": "pitchfork", "data_pub": "2026-10-22T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Charli XCX faz uma aparição especial no filme What Happens At Night, dirigido por Martin Scorsese, ao lado de Leonardo DiCaprio e Jennifer Lawrence.", "titulo_pt": "Charli XCX fará cameo em filme de Martin Scorsese", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 220053, "titulo": "$34.3 Million Marble Torso Sets Roman Antiquity Record at Sotheby’s", "url": "https://www.artforum.com/news/34-3-million-marble-torso-sets-record-at-sothebys-1234761959/", "fonte_id": "artforum", "data_pub": "2026-10-22T21:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um fragmento de escultura em mármore representando o torso de um imperador romano foi leiloado por $34,3 milhões na Sotheby’s em 21 de outubro, quase três vezes o preço estimado de $12 milhões, estabelecendo um recorde para antiguidades romanas em leilões.", "titulo_pt": "Torso de imperador romano em mármore leiloado por $34,3 milhões, estabelecendo recorde", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 219479, "titulo": "Os fantasmas que o Brasil se recusa a enterrar", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/djamila-ribeiro/2026/10/os-fantasmas-que-o-brasil-se-recusa-a-enterrar.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-22T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pensadora e artista Grada Kilomba, em seu trabalho 'Memórias da Plantação', usa a metáfora do fantasma para discutir a continuidade do colonialismo no presente brasileiro, afirmando que as desigualdades sociais persistem devido à negação da sua existência.", "titulo_pt": "Os fantasmas que o Brasil se recusa a enterrar", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 220054, "titulo": "Miami Beach’s Bass Museum Unveils Expansion Plans", "url": "https://www.artforum.com/news/miami-beachs-bass-museum-unveils-expansion-plan-1234761912/", "fonte_id": "artforum", "data_pub": "2026-10-22T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A expansão do Museu de Arte Bass em Miami Beach foi projetada pela firma de arquitetura Johnston Marklee, de Los Angeles, e inclui três elementos: pavilhões, um patio e uma área de palco, em uma área de 22.000 pés quadrados no canto sudoeste do campus do museu.", "titulo_pt": "Plano de expansão do museu de arte Bass em miami Beach é revelado", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 219760, "titulo": "Descartes: “Si no pienso, luego me doy cuenta que tengo que estar existiendo, porque si yo no existo, no pienso”", "url": "https://www.lanacion.com.ar/sociedad/descartes-si-no-pienso-luego-me-doy-cuenta-que-tengo-que-estar-existiendo-porque-si-yo-no-existo-no-nid22102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-22T21:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Descartes discutiu a relação entre o pensamento e a vida cotidiana, afirmando que questionar a realidade leva a uma forma superior de liberdade. Ele argumentou que se não pensamos, devemos nos dar conta de que devemos existir, pois se não existíssemos, não poderíamos pensar.", "titulo_pt": "Descartes: 'se não pensar, então devo existir, pois se não existisse, não poderia pensar'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 219761, "titulo": "Una cueva estuvo sellada durante 16.800 años y conserva una vivienda de la Edad de Piedra con más de 4600 objetos", "url": "https://www.lanacion.com.ar/ciencia/una-cueva-estuvo-sellada-durante-16800-anos-y-conserva-una-vivienda-de-la-edad-de-piedra-con-mas-de-nid22102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-22T21:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma caverna em La Garma, na Espanha, permaneceu fechada por 16.800 anos e manteve uma habitação da Era do Pedra com mais de 4.600 artefatos.", "titulo_pt": "Uma caverna estava sellada durante 16.800 anos e preserva uma habitação da era do pedra com mais de 4.600 objetos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 220018, "titulo": "Louvre Heist Suspect Denied Release As Investigators Unravel Tangled Testimonies", "url": "https://www.artnews.com/art-news/news/louvre-heist-suspect-denied-release-as-investigators-unravel-tangled-testimonies-1234803583/", "fonte_id": "artnews", "data_pub": "2026-10-22T21:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rachid H., de 40 anos, suspeito do roubo ao Louvre em 2025, continua detido conforme determinou o Tribunal de Apelações de Paris na sexta-feira. Ele permanecerá em prisão preventiva durante o processo investigativo.", "titulo_pt": "Suspeito do roubo ao louvre negado liberdade pela justiça", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 219550, "titulo": "Livro infantil aborda poder popular e organização coletiva de maneira lúdica", "url": "https://veja.abril.com.br/cultura/livro-infantil-aborda-poder-popular-e-organizacao-coletiva-de-maneira-ludica/", "fonte_id": "veja", "data_pub": "2026-10-22T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O livro 'Nenhum rei', que será lançado no sábado, explora relações de poder de forma lúdica e acessível para crianças.", "titulo_pt": "Livro infantil aborda poder popular e organização coletiva de maneira lúdica", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 220008, "titulo": "Raye wins 2026 Mercury prize for This Music May Contain Hope", "url": "https://www.theguardian.com/music/2026/oct/22/raye-wins-2026-mercury-prize-for-this-music-may-contain-hope", "fonte_id": "guardian_culture", "data_pub": "2026-10-22T21:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Raye venceu o prêmio Mercury de 2026 com seu segundo álbum de estúdio, 'This Music May Contain Hope', um álbum ambicioso de 73 minutos que inclui jazz de big band, baladas poderosas, funk e outros estilos. A vitória marca um renascimento para a cantora britânica, que anteriormente teve sucesso com os prêmios Brit Awards.", "titulo_pt": "Raye vence prêmio Mercury com 'This Music May Contain Hope'", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 220004, "titulo": "When Does a Woman Artist Reach Her \"Prime\"?", "url": "https://hyperallergic.com/when-does-a-woman-artist-reach-her-prime/", "fonte_id": "hyperallergic", "data_pub": "2026-10-22T21:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A exposição 'O Pico da Sua Vida' examina o que reconhecimento e sucesso no mercado significam para 18 artistas mulheres com mais de 75 anos.", "titulo_pt": "Quando uma artista feminina chega ao seu 'pico'?", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 219591, "titulo": "Brasil no Mundo, na TV Brasil, analisa protestos na Europa", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-10/brasil-no-mundo-na-tv-brasil-analisa-protestos-na-europa", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-10-22T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O programa Brasil no Mundo, da TV Brasil, aborda os protestos na França e em outros países europeus devido ao aumento do custo de vida. O programa também discute os efeitos das guerras no Oriente Médio e na Ucrânia na economia internacional.", "titulo_pt": "Brasil no Mundo analisa protestos na Europa e impacto das guerras na economia", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 220019, "titulo": "Monet Painting Sells for $56.2 M., Setting French Auction Record at Sotheby’s Paris", "url": "https://www.artnews.com/art-news/market
