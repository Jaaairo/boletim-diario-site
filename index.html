s votam no Brasil — e o que explica esse fenômeno", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 185082, "titulo": "A correta interpretação do art. 54 do Regulamento das PDPs", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-correta-interpretacao-do-art-54-do-regulamento-das-pdps", "fonte_id": "jota", "data_pub": "2026-09-28T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O parecer da AGU (Advocacia-Geral da União) afirma que a dispensa de licitação é válida apenas enquanto houver transferência de tecnologia. Este parecer confirma a interpretação correta do artigo 54 do Regulamento das PDPs (Parcerias para o Desenvolvimento Privado).", "titulo_pt": "Parecer da agu confirma que dispensa de licitação depende de transferência de tecnologia", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 185083, "titulo": "Sobre o Judiciário e deferência às decisões majoritárias", "url": "https://www.jota.info/opiniao-e-analise/colunas/advogadas-publicas-em-debate/sobre-o-judiciario-e-deferencia-as-decisoes-majoritarias", "fonte_id": "jota", "data_pub": "2026-09-28T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute bancas de heteroidentificação e a alíquota zero de IBS e CBS para pessoas com deficiência e autismo.", "titulo_pt": "Sobre o Judiciário e deferência às decisões majoritárias", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 184854, "titulo": "Renan Filho e JHC miram votos lulistas na reta final acirrada em Alagoas", "url": "https://www.metropoles.com/brasil/renan-filho-e-jhc-miram-votos-lulistas-na-reta-final-acirrada-em-alagoas", "fonte_id": "metropoles", "data_pub": "2026-09-28T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha eleitoral em Alagoas está intensificando-se, com os candidatos Renan Filho (MDB) e JHC (PSDB) buscando votos entre os eleitores que apoiam o ex-presidente Lula. Enquanto o MDB investe em materiais com imagens do petista, o PSDB distribui material com imagens do candidato do PT.", "titulo_pt": "Renan Filho e JHC almejam votos lulistas na reta final da campanha em Alagoas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 184856, "titulo": "Eleições 2026: veja datas importantes na semana que antecede o 1º turno", "url": "https://www.metropoles.com/brasil/eleicoes-2026-veja-datas-importantes-na-semana-que-antecede-o-1o-turno", "fonte_id": "metropoles", "data_pub": "2026-09-28T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Durante a semana que antecede o primeiro turno das eleições de 2026, ocorrem datas importantes como o horário eleitoral, campanhas, pesquisas e possíveis prisões, cada um com regras específicas. O dia da votação está marcado para 4 de outubro.", "titulo_pt": "Eleições 2026: veja datas importantes na semana que antecede o 1º turno", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 184858, "titulo": "Lula vai ao Pará e terá aliado fora do palanque em ato de campanha", "url": "https://www.metropoles.com/brasil/lula-vai-ao-para-e-tera-aliado-fora-do-palanque-em-ato-de-campanha", "fonte_id": "metropoles", "data_pub": "2026-09-28T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula realizará um ato eleitoral no Pará nesta segunda-feira (28/9) para apoiar a chapa do MDB. O governador Helder Barbalho concorrerá à disputa pelo Senado.", "titulo_pt": "Lula realiza primeiro ato eleitoral no norte em apoio à chapa do mdb", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 184859, "titulo": "Último debate do 1º turno vira cálculo de Lula e Flávio em eleição acirrada", "url": "https://www.metropoles.com/brasil/ultimo-debate-do-1o-turno-vira-calculo-de-lula-e-flavio-em-eleicao-acirrada", "fonte_id": "metropoles", "data_pub": "2026-09-28T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A três dias do primeiro turno das eleições, o último debate pode ser a única oportunidade para Lula e Flávio Fernandes se enfrentarem na televisão.", "titulo_pt": "Último debate do 1º turno vira cálculo de Lula e Flávio em eleição acirrada", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 184894, "titulo": "EPP pede que a Aneel retire documentos da Eneva e Global em leilão", "url": "https://www.cnnbrasil.com.br/infra/epp-pede-que-a-aneel-retire-documentos-da-eneva-e-global-em-leilao/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-28T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A EPP pediu à Aneel que retire os documentos das empresas Eneva e Global do leilão. Consórcios ION alegam que as concorrentes se manifestaram fora do prazo e tentam reverter a inabilitação de nove termelétricas selecionadas no certame.", "titulo_pt": "EPP solicita à Aneel a remoção de documentos da Eneva e Global em leilão", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 184897, "titulo": "Lula intensifica agenda em busca de voto indeciso", "url": "https://www.cnnbrasil.com.br/eleicoes/lula-intensifica-agenda-em-busca-de-voto-indeciso/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-28T07:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha do PT intensifica esforços para atrair votos indecisos, focando em medidas populares e buscando reduzir a abstenção nos votos.", "titulo_pt": "Lula intensifica agenda em busca de voto indeciso", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 184787, "titulo": "Nossa Senhora Aparecida e bets pautam a reta final da eleição", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/encaminhado-com-frequencia/2026/09/nossa-senhora-aparecida-e-bets-pautam-a-reta-final-da-eleicao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na reta final do primeiro turno, dois temas emergiram: a proibição das bets e especulações sobre Flávio Bolsonaro pretendendo retirar o título de padroeira do Brasil de Nossa Senhora Aparecida.", "titulo_pt": "Nossa Senhora Aparecida e bets dominam a reta final da eleição", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 185140, "titulo": "Will Jürgen Klopp's charisma be enough for Germany?", "url": "https://www.dw.com/en/will-jürgen-klopp-s-charisma-be-enough-for-germany/a-79455266?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-28T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois da derrota para a Grécia, Jürgen Klopp enfrenta o verdadeiro desafio de sua missão como técnico da seleção da Alemanha. Seu charme pessoal pode ser insuficiente para levar o grupo adiante.", "titulo_pt": "Será que o charme de Jürgen Klopp será suficiente para a Alemanha?", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 185272, "titulo": "Regeni, giudici in camera di consiglio, sentenza attesa per le 18", "url": "https://www.ansa.it/sito/notizie/topnews/2026/09/28/regeni-giudici-in-camera-di-consiglio-sentenza-attesa-per-le-18_4a6e1c83-6868-479f-b1fb-854d75d1bb33.html", "fonte_id": "ansa_italy", "data_pub": "2026-09-28T09:42:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A procuradoria solicitou uma pena de morte e três condenações a 17 anos e meio de prisão. Os juízes estão em sessão de conselho, e a sentença será anunciada às 18h.", "titulo_pt": "Regeni, juízes em sessão de conselho, sentença aguardada às 18h", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 185198, "titulo": "After María Corina Machado’s failed attempts to return to Venezuela, her communications chief does so instead", "url": "https://english.elpais.com/international/2026-09-28/after-maria-corina-machados-failed-attempts-to-return-to-venezuela-her-communications-chief-does-so-instead.html", "fonte_id": "elpais_en", "data_pub": "2026-09-28T09:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Claudia Macedo, assistente da líder da oposição María Corina Machado, retornou à Venezuela nesta semana, acompanhada por jornalistas e simpatizantes. Ela afirmou estar abrindo caminhos para futuros esforços.", "titulo_pt": "Depois dos fracassos de María Corina Machado em retornar à Venezuela, sua assessoria faz o papel", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 185126, "titulo": "🔴Follow live: France's Macron, Pope Leo XIV speak on European unity in Metz", "url": "https://www.france24.com/en/france/20260928-live-pope-leo-xiv-arrives-in-metz-for-final-stop-of-france-visit", "fonte_id": "france24", "data_pub": "2026-09-28T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da França, Emmanuel Macron, e o Papa Francisco estão se comunicando sobre unidade europeia em Metz, França. A transmissão ao vivo está sendo acompanhada.", "titulo_pt": "Siga ao vivo: Macron e papa francisco se comunicam sobre unidade europeia em Metz", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 185127, "titulo": "Saudi schools adopt remote learning amid mounting Gulf tensions", "url": "https://www.france24.com/en/video/20260928-saudi-schools-adopt-remote-learning-amid-mounting-gulf-tensions", "fonte_id": "france24", "data_pub": "2026-09-28T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As escolas de Riad, na Arábia Saudita, anunciaram um último plano de passar uma semana com aprendizado remoto. A medida foi tomada sem uma explicação oficial e ocorre em meio a tensões crescentes no Golfo Pérsico e a ataques diários contra a Arábia Saudita por insurgentes hutíes apoiados pelo Irã, no Iêmen.", "titulo_pt": "Escolas de riad adotam aprendizado remoto em meio a tensões crescentes no golfo", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 185052, "titulo": "Videoanálisis | La Guaira, entre el desastre y la reconstrucción", "url": "https://elpais.com/america/2026-09-28/videoanalisis-la-guaira-entre-el-desastre-y-la-reconstruccion.html", "fonte_id": "elpais_america", "data_pub": "2026-09-28T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "EL PAÍS retorna ao epicentro do desastre três meses após o duplo sismo em La Guaira. A cidade enfrenta situações de desastre e reconstrução simultaneamente.", "titulo_pt": "Análise de vídeo | La Guaira, entre o desastre e a reconstrução", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 185054, "titulo": "Los venezolanos sin papeles en Colombia buscan rumbo ante las amenazas de De la Espriella: “Tenemos las manos atadas”", "url": "https://elpais.com/america-colombia/2026-09-28/los-venezolanos-sin-papeles-en-colombia-buscan-rumbo-ante-las-amenazas-de-de-la-espriella-tenemos-las-manos-atadas.html", "fonte_id": "elpais_america", "data_pub": "2026-09-28T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Migrantes venezolanos sem documentos em Colômbia buscam regularizar sua situação diante das ameaças de deportação, mas as opções são limitadas. O anúncio de deportações de De la Espriella dificulta o processo de regularização.", "titulo_pt": "Migrantes venezolanos sem documentos em colômbia buscam saída diante das ameaças De deportação", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 185055, "titulo": "La promesa rota de Trump con las criptos: una mina de oro para su imperio, pérdidas millonarias para los inversores", "url": "https://elpais.com/us/2026-09-28/la-promesa-rota-de-trump-con-las-criptos-una-mina-de-oro-para-su-imperio-perdidas-millonarias-para-los-inversores.html", "fonte_id": "elpais_america", "data_pub": "2026-09-28T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Cerca de um milhão de investidores minoritários perderam 3.810 milhões de dólares em criptomoedas, enquanto Donald Trump declarou mais de 1.400 milhões de dólares em lucros provenientes de seus negócios com criptomoedas.", "titulo_pt": "A promessa quebrada de Trump com as criptomoedas: uma mina de ouro para seu império, perdas millonárias para os investidores", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 185061, "titulo": "Amina Helmi, astrónoma: “En 20 años sabremos si estamos solos o no en el universo”", "url": "https://elpais.com/argentina/2026-09-28/amina-helmi-astronoma-en-20-anos-sabremos-si-estamos-solos-o-no-en-el-universo.html", "fonte_id": "elpais_america", "data_pub": "2026-09-28T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Amina Helmi, especialista em arqueologia de galáxias, ganhou o prêmio Kavli por descobertas cruciais sobre a formação da Vía Láctea. Em 20 anos, a humanidade poderá saber se estamos ou não sozinhos no universo.", "titulo_pt": "Amina Helmi, astrônoma: 'em 20 anos sabremos se estamos sozinhos ou não no universo'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 185062, "titulo": "De Renée Good a Wilber Garcés: cinco casos que reflejan las violentas tácticas del ICE", "url": "https://elpais.com/us/2026-09-28/de-renee-good-a-wilber-garces-cinco-casos-que-reflejan-las-violentas-tacticas-del-ice.html", "fonte_id": "elpais_america", "data_pub": "2026-09-28T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em vários incidentes recentes, pessoas morreram ou ficaram feridas por disparos de agentes do ICE em diferentes regiões dos Estados Unidos. Esses casos têm gerado fortes críticas.", "titulo_pt": "De Renée Good a Wilber Garcés: cinco casos que refletem as violentas táticas do ICE", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 184992, "titulo": "Irã nega retomada das negociações com os Estados Unidos", "url": "https://www.cartacapital.com.br/mundo/ira-nega-retomada-das-negociacoes-com-os-estados-unidos/", "fonte_id": "cartacapital", "data_pub": "2026-09-28T09:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Irã negou a retomada das negociações com os Estados Unidos. Donald Trump afirmou que esperava conversas com os iranianos 'em breve'.", "titulo_pt": "Irã nega retomada das negociações com os Estados Unidos", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 185184, "titulo": "Russia under Putin lost nearly half its schools — war propaganda fills the rest", "url": "https://www.euronews.com/2026/09/28/russia-under-putin-lost-nearly-half-its-schools-war-propaganda-fills-the-rest", "fonte_id": "euronews", "data_pub": "2026-09-28T09:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fechamento de escolas emRussia, sob o governo de Putin, foi maior do que a diminuição demográfica, devido a um financiamento por aluno que tornou as escolas rurais menores ineficientes. Desde 2022, todas as escolas restantes realizam classes obrigatórias semanais sobre valores tradicionais russos e a versão do Kremlin dos eventos da guerra da Rússia na Ucrânia.", "titulo_pt": "Rússia, sob Putin, perdeu quase metade de suas escolas — propaganda da guerra preenche o resto", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 184993, "titulo": "Preço do petróleo dispara após Trump rejeitar oferta iraniana de trégua", "url": "https://www.cartacapital.com.br/mundo/preco-do-petroleo-dispara-apos-trump-rejeitar-oferta-iraniana-de-tregua/", "fonte_id": "cartacapital", "data_pub": "2026-09-28T09:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O preço do petróleo Brent aumentou mais do que 3% após Donald Trump rejeitar uma oferta iraniana de trégua. Este aumento ocorreu em resposta à tensão geopolítica gerada pela recusa americana.", "titulo_pt": "Preço do petróleo brent dispara após Trump rejeitar oferta iraniana de trégua", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 185237, "titulo": "Israeli actions 'paving way for total control' over Al-Aqsa, says Hamas", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-police-guard-1500-jewish-settlers-storming-al-aqsa-mosque-0", "fonte_id": "middle_east_eye", "data_pub": "2026-09-28T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Khaled Meshaal, membro do bureau político do Hamas, alertou que as ações israelenses em torno do Monte do Templo estão preparando o caminho para um controle total e dominador sobre o local. Segundo Meshaal, essas ações incluem o fechamento por 40 dias da Mesquita Al-Aqsa, a imposição de uma divisão temporal para facilitar incursões de grupos judeus extremistas e esforços para criar uma divisão espacial limpando instalações-chave no recinto.", "titulo_pt": "Ações israelenses estão pavimentando o caminho para um controle total sobre Al-Aqsa, afirma Hamas", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 185121, "titulo": "Swedish Social Democrats fail to form government", "url": "https://www.lemonde.fr/en/international/article/2026/09/28/swedish-social-democratic-party-fails-to-form-government_6758033_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-28T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A líder do Partido Social Democrata sueco, Magdalena Andersson, falhou em formar um governo com três outras partidos da esquerda. O atual primeiro-ministro de direita, Ulf Kristersson, provavelmente será encarregado de tentar formar um governo.", "titulo_pt": "Partido Social democrata sueco falha em formar governo", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 185238, "titulo": "Israeli police guard 1,500 Jewish settlers storming Al-Aqsa mosque as Palestinians face restrictions", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-police-guard-1500-jewish-settlers-storming-al-aqsa-mosque", "fonte_id": "middle_east_eye", "data_pub": "2026-09-28T08:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Israelis policiais monitoraram enquanto cerca de 1.500 judeus entraram no pátio da Mesquita Al-Aqsa em Jerusalém no segundo dia da festa judaica das Tabernáculos, mesmo enquanto as autoridades impuseram restrições aos palestinos.", "titulo_pt": "Policiais israelenses monitoram judeus invadindo mesquita Al-Aqsa enquanto palestinos enfrentam restrições", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 185049, "titulo": "America’s empty bedrooms are up for grabs", "url": "https://www.vox.com/the-highlight/502859/padsplit-sros-housing-affordable-bedroom-adult-dorms-homelessness", "fonte_id": "vox", "data_pub": "2026-09-28T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Todd Waller, um social worker de Atlanta, precisou encontrar um novo lugar para morar após um rompimento em 2022, o que o levou a se interessar por apartamentos eficientes e plataformas como PadSplit.", "titulo_pt": "Quartos vazios nos estados unidos estão disponíveis", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 185262, "titulo": "Bond sell-off deepens as oil rises above $108", "url": "https://www.ft.com/content/d751ad99-531d-4990-9a4c-ee89a9fc1b2d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-28T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rendimento das obrigações de dívida do Tesouro dos EUA a 10 anos atingiu 5,2% e o petróleo Brent subiu acima de 108 dólares o barril, devido à diminuição das esperanças de um acordo entre Estados Unidos e Irã.", "titulo_pt": "Venda de títulos de dívida aprofunda e petróleo passa de 108 dólares", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 184967, "titulo": "Horacio Marín, CEO de YPF: “La producción de petróleo va a llegar a un millón de barriles por primera vez en la historia”", "url": "https://www.lanacion.com.ar/lnmas/horacio-marin-ceo-de-ypf-la-produccion-de-petroleo-va-a-llegar-a-un-millon-de-barriles-por-primera-nid27092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-28T09:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Horacio Marín, CEO da YPF, afirmou que a produção de petróleo da empresa vai atingir um milhão de barris pela primeira vez na história da companhia. Ele respondeu a declarações de Prat-Gay sobre a produção de Vaca Muerta em Neuquén e afirmou que o RIGI foi um sucesso.", "titulo_pt": "Horacio Marín, CEO da YPF: produção de petróleo atingirá um milhão de barris pela primeira vez", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 185369, "titulo": "Banks to open at 9:30 a.m. from April under labor-management deal", "url": "https://en.yna.co.kr/view/AEN20260928010900315", "fonte_id": "yonhap_news", "data_pub": "2026-09-28T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As agências bancárias na Coreia do Sul abrirão às 9h30 a partir de abril, conforme acordo entre empregadores e sindicatos.", "titulo_pt": "Bancos na Coreia do sul abrirão às 9h30 a partir de abril, diz acordo", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 185174, "titulo": "U.S. Treasury yields edge higher amid pressure on global government bonds", "url": "https://www.cnbc.com/2026/09/28/treasury-yields-bonds-selloff.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-28T08:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos das dívidas do Tesouro dos Estados Unidos aumentaram ligeiramente na segunda-feira, enquanto os investidores se preparavam para novos lançamentos de dados econômicos na semana seguinte.", "titulo_pt": "Rendimentos das dívidas do tesouro dos EUA subiram ligeiramente em meio a expectativas de novos dados econômicos", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 184908, "titulo": "Dow Jones Futuro cai com petróleo em alta após Trump rejeitar trégua com Irã", "url": "https://www.infomoney.com.br/mercados/dow-jones-futuro-cai-com-petroleo-em-alta-apos-trump-rejeitar-tregua-com-ira/", "fonte_id": "infomoney", "data_pub": "2026-09-28T08:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Dow Jones Futuro caiu devido à alta do petróleo, resultado do impasse nas negociações entre EUA e Irã, o que reacendeu preocupações sobre inflação e juros nos Estados Unidos.", "titulo_pt": "Dow Jones Futuro cai com petróleo em alta após Trump rejeitar trégua com Irã", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 185081, "titulo": "Reflexões sobre a pobreza do debate fiscal no Brasil", "url": "https://www.jota.info/opiniao-e-analise/artigos/reflexoes-sobre-a-pobreza-do-debate-fiscal-no-brasil", "fonte_id": "jota", "data_pub": "2026-09-28T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O caso Master ilustra as conexões entre poder econômico, mídia e prioridades nacionais no debate fiscal no Brasil.", "titulo_pt": "Reflexões sobre a pobreza do debate fiscal no Brasil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 184910, "titulo": "Eleições podem destravar o Ibovespa? Confira o que esperar em semana decisiva", "url": "https://www.infomoney.com.br/mercados/eleicoes-podem-destravar-o-ibovespa-confira-o-que-esperar-em-semana-decisiva/", "fonte_id": "infomoney", "data_pub": "2026-09-28T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Com o primeiro turno das eleições no horizonte, os investidores acompanham com cautela o Ibovespa, que vem registrando duas semanas consecutivas de queda.", "titulo_pt": "Eleições podem destravar o Ibovespa? Confira o que esperar em semana decisiva", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 185377, "titulo": "Hanwha Ocean wins 680 bln-won order to build 2 LNG carriers", "url": "https://en.yna.co.kr/view/AEN20260928009100320", "fonte_id": "yonhap_news", "data_pub": "2026-09-28T07:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Hanwha Ocean venceu um contrato para construir 2 navios transportadores de gás natural liquefeito (LNG) no valor de 680 bilhões de wones (coreanos).", "titulo_pt": "Hanwha Ocean vence contrato de 680 bilhões de wones para construir 2 navios de transporte de LNG", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 185378, "titulo": "(2nd LD) Seoul stocks sink over 2.5 pct on chip losses", "url": "https://en.yna.co.kr/view/AEN20260928007352320", "fonte_id": "yonhap_news", "data_pub": "2026-09-28T07:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações sul-coreanas caíram mais de 2% na sessão de Monday, principalmente devido às perdas no setor de chips.", "titulo_pt": "Seoul, 28 de setembro (yonhap) -- ações sul-coreanas caem mais de 2% na segunda-feira, com perdas no setor de chips", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 184811, "titulo": "Próximo quinto dia útil cairá no dia 6 de outubro; veja como é feita a conta", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/proximo-quinto-dia-util-caira-no-dia-6-de-outubro-veja-como-e-feita-a-conta.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O próximo quinto dia útil do ano será no dia 6 de outubro, uma terça-feira. Este dia é importante para o pagamento do salário referente ao mês de setembro para trabalhadores sob o regime da CLT.", "titulo_pt": "Próximo quinto dia útil será no dia 6 de outubro; confira o prazo para pagamento do salário de setembro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 185382, "titulo": "Seoul stocks sink over 2 pct on chip losses", "url": "https://en.yna.co.kr/view/AEN20260928007300320", "fonte_id": "yonhap_news", "data_pub": "2026-09-28T06:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações sul-coreanas caíram mais de 2% devido a perdas no setor de chips.", "titulo_pt": "Ações sul-coreanas caem mais de 2% devido a perdas no setor de chips", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 185329, "titulo": "China’s gas turbine makers are moving to make a global splash. Is Malaysia the first stop?", "url": "https://www.scmp.com/economy/global-economy/article/3369029/chinas-gas-turbine-makers-aim-challenge-global-giants-malaysia-start?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-28T06:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa estatal Shanghai Electric acertou um contrato para fornecer equipamentos para uma usina de gás em Malásia, marcando um passo importante para fabricantes chineses de turbinas de gás pesadas. O acordo, fechado recentemente, dá a Shanghai Electric uma presença no mercado dominado por players estrangeiros estabelecidos, durante um período de escassez global de suprimentos.", "titulo_pt": "Fabricantes de turbinas de gás da china buscam expansão global. Malásia seria o primeiro passo?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 185387, "titulo": "GDP projected to grow 0.38 pct over 10 years following CPTPP membership", "url": "https://en.yna.co.kr/view/AEN20260928006700320", "fonte_id": "yonhap_news", "data_pub": "2026-09-28T06:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A economia sul-coreana está projetada para crescer 0,38% ao longo de 10 anos após a adesão ao CPTPP. Essa projeção considera o impacto da membresia do país no Acordo de Parceria Transpacífico (CPTPP).", "titulo_pt": "Economia sul-coreana projetada para crescer 0,38% em 10 anos com CPTPP", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 185260, "titulo": "US and China agree $60bn low tariff regime for goods from foie gras to camels", "url": "https://www.ft.com/content/b1ba7dd2-3e3a-4944-b637-ff7db3b636e1?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-28T04:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos e China concordaram com um regime de tarifas baixas de US$ 60 bilhões para bens não sensíveis, como foie gras e camelos. O comércio bilateral reduzirá as tarifas sobre produtos não sensíveis em busca de aliviar tensões entre as duas superpotências.", "titulo_pt": "Estados unidos e China acordam regime de tarifas baixas de US$ 60 bilhões para bens não sensíveis", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 184989, "titulo": "El Gobierno extendió hasta 2049 la concesión de 35 aeropuertos a la empresa de Eurnekian", "url": "https://www.lanacion.com.ar/economia/el-gobierno-extendio-hasta-2049-la-concesion-de-35-aeropuertos-a-la-empresa-de-eurnekian-nid28092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-28T04:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo estendeu a concesão de 35 aeroportos, administrados pela empresa Eurnekian, até 2049. O prazo pode ser prorrogado até 2056 se a empresa investir US$600 milhões e atingir os avanços programados para 2031.", "titulo_pt": "Governo prorroga até 2049 concesão de 35 aeroportos a Eurnekian", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 185366, "titulo": "Solving Math’s Greatest Problems Was an Art Form. Then Came AI", "url": "https://www.wired.com/story/solving-maths-greatest-problems-was-an-art-form-until-ai/", "fonte_id": "wired", "data_pub": "2026-09-28T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A matemática tem sido uma das manifestações criativas humanas, semelhante à pintura e à poesia. Agora, os matemáticos estão tentando preservá-la do uso excessivo da força bruta da inteligência artificial.", "titulo_pt": "Resolver os maiores problemas da matemática era uma manifestação criativa. Agora, chegou a inteligência artificial", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 185172, "titulo": "Nvidia releases software platform to stop AI agents from misbehaving", "url": "https://www.cnbc.com/2026/09/28/nvidia-releases.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-28T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia lançou uma plataforma de software que, segundo a empresa, poderia ter evitado o incidente envolvendo a HuggingFace da OpenAI.", "titulo_pt": "Nvidia libera plataforma de software para impedir que agentes de IA se comportem de forma inadequada", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 185105, "titulo": "Why I'm finally giving Meta AI a chance", "url": "https://www.axios.com/2026/09/28/meta-ai-muse-privacy-zuckerberg", "fonte_id": "axios", "data_pub": "2026-09-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta finalmente prometeu uma funcionalidade que vinha impedindo o autor de usar seus serviços de IA: a privacidade. O CEO Mark Zuckerberg anunciou recentemente um compromisso amplo de oferecer um modo totalmente privado para agentes pessoais, onde nem a Meta nem outros serviços teriam acesso aos dados.", "titulo_pt": "Por que estou finalmente dando uma chance ao Meta AI", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 185321, "titulo": "ByteDance grabs one-fifth of China’s data centre capacity as AI drives infrastructure boom", "url": "https://www.scmp.com/tech/big-tech/article/3369056/bytedance-grabs-one-fifth-chinas-data-centre-capacity-ai-drives-infrastructure-boom?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "ByteDance detém aproximadamente um quinto da capacidade de centrais de dados da China, tornando-se o maior locatário do país e um dos principais impulsionadores do desenvolvimento de inteligência artificial, de acordo com estimativas da empresa de pesquisa SemiAnalysis. A empresa aluga praticamente toda sua infraestrutura de centrais de dados.", "titulo_pt": "Bytedance conquista um quinto da capacidade de centrais de dados da China com a inteligência artificial", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 185367, "titulo": "The Next Evolution of AI Is Learning From Your Dodgy Gaming Skills", "url": "https://www.wired.com/story/the-next-evolution-of-ai-is-learning-from-your-dodgy-gaming-skills/", "fonte_id": "wired", "data_pub": "2026-09-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma startup britânica está transformando entradas de jogo em dados de treinamento para modelos de inteligência artificial que podem navegar no mundo físico. O objetivo é que esses modelos aprendam com as habilidades de jogo imprecisas dos jogadores.", "titulo_pt": "A próxima evolução da IA é aprender com seus jogos desajeitados", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 185368, "titulo": "Nvidia’s Answer to Rogue Agents Is an Open-Source AI Security System", "url": "https://www.wired.com/story/nvidias-answer-to-rogue-agents-is-an-open-source-ai-security-system/", "fonte_id": "wired", "data_pub": "2026-09-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nvidia lançou um novo sistema de segurança baseado em código aberto para ajudar a prevenir a fuga de agentes de inteligência artificial após uma série de incidentes de segurança notáveis nesse campo.", "titulo_pt": "Nvidia lança sistema de segurança de código aberto para inteligência artificial", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 185429, "titulo": "Interhuman AI wants to teach AI what humans say without words", "url": "https://tech.eu/2026/09/28/interhuman-wants-to-teach-ai-what-humans-say-without-words/", "fonte_id": "tech_eu", "data_pub": "2026-09-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa Interhuman está desenvolvendo tecnologias de IA para que a inteligência artificial possa interpretar sinais não verbais humanos, além de compreender o significado das palavras. Isso envolve a detecção de hesitação, confiança, incerteza, envolvimento e concordância.", "titulo_pt": "Interhuman quer ensinar a IA a entender o que os humanos dizem sem usar palavras", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 185350, "titulo": "NXP says Singapore fab with Vanguard is its biggest investment since Freescale", "url": "https://www.digitimes.com/news/a20260928PD200/fab-nxp-investment-ceo-freescale-semiconductor.html", "fonte_id": "digitimes", "data_pub": "2026-09-28T08:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da NXP Semiconductors, Rafael Sotomayor, afirmou que a fábrica de 12 polegadas em Singapura, construída em parceria com a Vanguard International Semiconductor (VIS) e operada pela joint venture VisionPower Semiconductor Manufacturing Company (VSMC), é a maior investimento da empresa desde a aquisição da Freescale em 2015. A fábrica, localizada em Tampines, Singapura, está em produção piloto e planejada para volume de produção a partir do primeiro trimestre de 2027.", "titulo_pt": "NXP considera fábrica em singapura com Vanguard como maior investimento desde a aquisição da Freescale", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 185347, "titulo": "Who’s liable when AI agents go rogue?", "url": "https://www.technologyreview.com/2026/09/28/1145197/whos-liable-when-ai-agents-go-rogue/", "fonte_id": "mit_tech_review", "data_pub": "2026-09-28T08:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há meses, uma série de ataques cibernéticos por agentes de inteligência artificial tem surpreendido o mundo. Em julho, a OpenAI revelou que um grupo de seus agentes estava envolvido em essas atividades.", "titulo_pt": "Quem é responsável quando os agentes de IA saem de controle?", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 185323, "titulo": "China’s Nio and Geely deepen commitment to EV battery swapping tech in stake sale", "url": "https://www.scmp.com/business/china-evs/article/3369047/chinas-nio-and-geely-deepen-commitment-ev-battery-swapping-tech-stake-sale?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-28T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fabricante chinesa de veículos elétricos Nio estreitou sua parceria com o grupo automotivo Zhejiang Geely Holding ao vender uma participação em sua subsidiária de troca de baterias para o conglomerado, avaliada em 16 bilhões de yuan (US$2,4 bilhões). Como parte do acordo, a Geely Holding, controlada pelo bilionário chinês Li Shufu, pagará 640 milhões de yuan em dinheiro e contribuirá com sua unidade inteiramente dedicada à troca de baterias, a Yiyi Internet Technology, adquirindo uma participação de 30% na Nio Power.", "titulo_pt": "Nio e Geely intensificam parceria em tecnologia de troca de baterias para veículos elétricos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 185430, "titulo": "Complaion raises €13.5M to simplify compliance for European SMEs", "url": "https://tech.eu/2026/09/28/complaion-raises-eur135m-to-simplify-compliance-for-european-smes/", "fonte_id": "tech_eu", "data_pub": "2026-09-28T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Complaion, uma empresa italiana que auxilia micro e pequenas empresas a gerenciar certificações e conformidade regulatória, levantou €13,5 milhões para expandir sua equipe, desenvolver sua tecnologia e apoiar sua expansão internacional.", "titulo_pt": "Complaion levanta €13,5 milhões para simplificar conformidade regulatória para micro e pequenas empresas europeias", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 185431, "titulo": "European tech weekly recap: Over €2B invested across 65+ deals", "url": "https://tech.eu/2026/09/28/european-tech-weekly-recap-over-eur2b-invested-across-65-deals/", "fonte_id": "tech_eu", "data_pub": "2026-09-28T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No último período, foram acompanhadas mais de 65 transações de investimento em tecnologia com valor superior a 2 bilhões de euros e mais de 4 saídas ou negócios por fusões e aquisições na Europa. Os três principais setores envolvidos foram destacados.", "titulo_pt": "Resumo semanal europeu de tecnologia: mais de 2 bilhões investidos em 65+ transações", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 185297, "titulo": "Sony to skip CES show after Honda EV venture dropped", "url": "https://www.japantimes.co.jp/business/2026/09/28/companies/sony-skips-ces-show/", "fonte_id": "japan_times", "data_pub": "2026-09-28T07:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Sony decidiu não participar da CES, uma vez que parou seu projeto com a Honda sobre veículos elétricos. Sua atividade empresarial tem se deslocado cada vez mais para jogos, música e filmes.", "titulo_pt": "Sony vai evitar CES após encerrar parceria com Honda", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 185432, "titulo": "‘Shopify of mobile apps’ bilt.me raises $700K to turn ideas into mobile businesses", "url": "https://tech.eu/2026/09/28/shopify-of-mobile-apps-biltme-raises-700k-to-turn-ideas-into-mobile-businesses/", "fonte_id": "tech_eu", "data_pub": "2026-09-28T07:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A plataforma estoniana de construção de aplicativos com inteligência artificial, bilt.me, levantou $700,000 em financiamento pré-série A, liderado pela Superhero Capital, com o apoio de Markus Villig, fundador da Bolt, e Martin Sokk, fundador da Lightyear.", "titulo_pt": "Plataforma bilt.Me, de estonia, levanta $700 mil para construir ideias em negócios móveis", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 185433, "titulo": "Sofinnova Partners closes oversubscribed €82M Sofinnova MD Start IV fund", "url": "https://tech.eu/2026/09/28/sofinnova-partners-closes-oversubscribed-eur82m-sofinnova-md-start-iv-fund/", "fonte_id": "tech_eu", "data_pub": "2026-09-28T07:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Sofinnova Partners, uma empresa de capital de risco especializada em biotecnologia europeia, encerrou seu quarto fundo de medicina de precisão, o Sofinnova MD Start IV, com €82 milhões. O fundo, que superou as expectativas, vai expandir as operações da Sofinnova na área de tecnologias médicas.", "titulo_pt": "Sofinnova Partners fecha quarto fundo de medicina de precisão no valor de €82 milhões", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 184807, "titulo": "Empresas americanas aderem a modelos de IA 'abertos' mais baratos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/empresas-americanas-aderem-a-modelos-de-ia-abertos-mais-baratos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas americanas estão utilizando modelos de inteligência artificial (IA) de 'pesos abertos' e com menor custo, devido ao aumento das despesas com tecnologia da informação. Isso ocorre enquanto executivos buscam alternativas aos sistemas de ponta oferecidos pela Anthropic e pela OpenAI.", "titulo_pt": "Empresas americanas aderem a modelos de IA 'abertos' mais baratos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 184827, "titulo": "Por que chimpanzés e bonobos carregam filhotes mortos por semanas ou meses", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/por-que-chimpanzes-e-bonobos-carregam-filhotes-mortos-por-semanas-ou-meses.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quando um filhote de chimpanzé ou bonobo morre, a mãe o carrega nas costas por dias, semanas ou até meses. Este comportamento incomoda os cientistas há décadas e suscita dúvidas sobre a compreensão dessas espécies sobre a morte.", "titulo_pt": "Por que chimpanzés e bonobos carregam filhotes mortos por semanas ou meses", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 185419, "titulo": "The herring fishery that took 400 years to rebound—and what it teaches us today", "url": "https://phys.org/news/2026-09-herring-fishery-years-rebound-today.html", "fonte_id": "phys_org", "data_pub": "2026-09-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesca de sardinhas da região do Estreito de Skanör-Falsterbo, entre a Dinamarca e a Suécia, foi um dos principais produtos de comércio da Europa do norte durante o século XIII ao século XVI. No entanto, por volta de 1570, a pesca colapsou rapidamente, levando séculos para se recuperar, com a recuperação completa ocorrendo apenas nos anos 1950.", "titulo_pt": "A pesca de sardinhas que levou 400 anos para se recuperar - e o que nos ensina hoje", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 185420, "titulo": "Waves find order in the chaos of an oddly shaped cavity", "url": "https://phys.org/news/2026-09-chaos-oddly-cavity.html", "fonte_id": "phys_org", "data_pub": "2026-09-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos recentes, liderados por cientistas do Advanced Science Research Center da CUNY Graduate Center, demonstraram que ondas podem se comportar de maneira diferente ao passar por um tipo especial de material, mesmo quando refletidas em uma câmara de forma anômala.", "titulo_pt": "Ondas encontram ordem no caos de uma câmara de forma incomum", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 185421, "titulo": "New formulation helps RNA vaccines withstand high temperatures", "url": "https://phys.org/news/2026-09-rna-vaccines-high-temperatures.html", "fonte_id": "phys_org", "data_pub": "2026-09-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova formulação permite que os vacinas RNA, eficazes contra o COVID-19, sejam desenvolvidas para várias outras doenças, incluindo o câncer, sem a necessidade de armazenamento ultracold.", "titulo_pt": "Nova formulação ajuda vacinas RNA a resistirem a altas temperaturas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 185422, "titulo": "SpaceX aims to put Starship in orbit for the first time", "url": "https://phys.org/news/2026-09-spacex-aims-starship-orbit.html", "fonte_id": "phys_org", "data_pub": "2026-09-28T08:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O foguete Starship, desenvolvido pela SpaceX, fará sua primeira tentativa de entrar em órbita terrestre três anos após seu primeiro voo de teste. Este é um passo crucial no desenvolvimento do veículo de lançamento para futuras missões à Lua e Marte.", "titulo_pt": "Spacex visa colocar Starship em órbita pela primeira vez", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 185423, "titulo": "The wildfires choking Indonesia, sparking regional haze", "url": "https://phys.org/news/2026-09-wildfires-indonesia-regional-haze.html", "fonte_id": "phys_org", "data_pub": "2026-09-28T08:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia tem enfrentado incêndios que têm queimado grandes áreas de florestas e ecossistemas de turfe, causando nevoeiros tóxicos a cobrir partes do país e da Malásia e Singapura.", "titulo_pt": "As chamas que sufocam a indonésia, acendendo nevoeiros regionais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 185391, "titulo": "STAT+: Once described as obesity medicines for ‘patients,’ GLP-1s are increasingly lifestyle drugs for ‘customers’", "url": "https://www.statnews.com/2026/09/28/glp1-marketing-shift-obesity-medicine-weight-loss-drug/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-28T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os medicamentos GLP-1, que já eram descritos como tratamentos para obesidade em ‘pacientes’, estão se tornando cada vez mais medicamentos de estilo de vida para ‘consumidores’. Estes medicamentos estão passando por uma transformação.", "titulo_pt": "GLP-1s, que já eram medicamentos para ‘pacientes’ de obesidade, se tornam cada vez mais drogas de estilo de vida para ‘consumidores’", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 185392, "titulo": "Opinion: AI is eroding the barriers that kept biological weapons rare", "url": "https://www.statnews.com/2026/09/28/ai-bioweapons-pathogens-guardrails-policy-warning/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-28T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As defesas contra bioterrorismo criado por inteligência artificial levarão anos para serem desenvolvidas, mas o tempo não é nosso aliado, escreve Ashish Jha.", "titulo_pt": "Opinião: a IA está erosionando as barreiras que mantinham os armamentos biológicos raramente utilizados", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 185393, "titulo": "Opinion: I discovered a new structure in the heart — just by looking closely", "url": "https://www.statnews.com/2026/09/28/heart-structure-left-atrial-septal-pouch-lasp-anatomy-discovery/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-28T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A descoberta de uma nova estrutura no coração foi notável, pois havia permanecido oculta em um dos órgãos mais estudados na história médica.", "titulo_pt": "Opinião: eu descobri uma nova estrutura no coração — apenas olhando com atenção", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 185424, "titulo": "Mediterranean rockrose extract shows fungicidal activity against common skin infections", "url": "https://phys.org/news/2026-09-mediterranean-rockrose-fungicidal-common-skin.html", "fonte_id": "phys_org", "data_pub": "2026-09-28T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um extrato rico em polifenóis da Cistus salviifolius, uma espécie de rockrose mediterrânea tradicionalmente utilizada para tratar condições cutâneas, demonstrou atividade fungicida contra vários dermatófitos, os fungos responsáveis por infecções superficiais da pele, cabelo e unhas.", "titulo_pt": "Extrato de rockrose mediterrânea demonstra atividade fungicida contra infecções cutâneas comuns", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 185455, "titulo": "Can you hack your brain to be ultra-productive?", "url": "https://www.newscientist.com/article/2590997-can-you-hack-your-brain-to-be-ultra-productive/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-09-28T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A constante distração, como notificações de e-mail e prazos concorrentes, pode levar à perda de concentração. A colunista Helen Thomson buscou métodos neurocientíficos comprovados para aumentar a produtividade.", "titulo_pt": "Você pode hackear o seu cérebro para ser ultra-productivo?", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 185425, "titulo": "Antarctic radar data improves forecasts for Southern Hemisphere atmospheric rivers in tests", "url": "https://phys.org/news/2026-09-antarctic-radar-southern-hemisphere-atmospheric.html", "fonte_id": "phys_org", "data_pub": "2026-09-28T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A precisão das previsões meteorológicas no Hemisfério Sul é geralmente menor que no Hemisfério Norte devido à falta de observações climáticas na Antártida e no Oceano Sul. Dados de radar da Antártida melhoraram as previsões para rios atmosféricos no Hemisfério Sul, que podem causar chuva intensa, nevascas, inundações e ventos fortes em Austrália, Nova Zelândia, América do Sul e Antártida.", "titulo_pt": "Dados de radar da antártida melhoram previsões para rios atmosféricos no hemisfério sul", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 185426, "titulo": "New metal-free molecules glow deep red in water and boost MRI contrast in test images", "url": "https://phys.org/news/2026-09-metal-free-molecules-deep-red.html", "fonte_id": "phys_org", "data_pub": "2026-09-28T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas moléculas sem metais brilham em vermelho escuro em água e melhoram a contraste em imagens de ressonância magnética (MRI) em testes. As tecnologias de bio-imagem, como a fluorescência e a ressonância magnética, são ferramentas poderosas em pesquisa básica e medicina clínica, mas apresentam limitações, como a falta de profundidade de imagem em fluorescência e a ausência de resolução de células em MRI.", "titulo_pt": "Novas moléculas sem metais brilham em vermelho escuro em água e melhoram o contraste MRI em imagens de teste", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 185428, "titulo": "Uncovering the Valleys Hidden Below Greenland’s Ice", "url": "https://science.nasa.gov/earth/earth-observatory/uncovering-the-valleys-hidden-below-greenlands-ice/", "fonte_id": "nasa_news", "data_pub": "2026-09-28T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo mapa da topografia sob a Calota de Gelo da Groenlândia conecta centenas de vales que mapas anteriores deixaram de notar ou fragmentaram.", "titulo_pt": "Descobrindo as vales ocultos sob a calota de gelo da groenlândia", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 185427, "titulo": "What the smell of a soil can tell us about soil health", "url": "https://phys.org/news/2026-09-soil-health.html", "fonte_id": "phys_org", "data_pub": "2026-09-28T00:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ecologista Rosa Boone descobriu que o cheiro do solo pode ser capturado e analisado no laboratório, fornecendo informações sobre as comunidades microbianas presentes. Ela sugere que o monitoramento do solo está se tornando cada vez mais importante, especialmente com a chegada de novas diretrizes de monitoramento.", "titulo_pt": "O que o cheiro do solo pode nos dizer sobre a saúde do solo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 184609, "titulo": "Descubrimiento histórico en Miramar: hallan una nueva especie fósil de un marsupial \"dientes de sable\" de hace 2 millones de años", "url": "https://www.clarin.com/sociedad/descubrimiento-historico-miramar-hallan-nueva-especie-fosil-marsupial-dientes-sable-hace-2-millones-anos_0_vuPsLVUrmm.html", "fonte_id": "clarin", "data_pub": "2026-09-27T21:23:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Foi descoberta uma nova espécie fósil de marsupial 'dentes de sable' na região de Miramar, datada de 2 milhões de anos atrás. O esqueleto parcial encontrado fornece informações importantes sobre a evolução dos predadores sul-americanos.", "titulo_pt": "Descoberta histórica em Miramar: nova espécie fósil de marsupial 'dentes de sable' de 2 milhões de anos", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}], "ciencia__eventos": [], "cultura": [{"id": 185454, "titulo": "Arthur Jafa’s Elegy to America", "url": "https://hyperallergic.com/arthur-jafas-elegy-to-america/", "fonte_id": "hyperallergic", "data_pub": "2026-09-28T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Stephanie Wambugu discursou sobre a instalação 'I Am Tony' no New Museum. O texto também oferece uma atualização sobre as feiras de arte realizadas na cidade de Nova York na semana anterior.", "titulo_pt": "Elegia à américa de arthur Jafa", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 184968, "titulo": "La dama de Retiro", "url": "https://www.lanacion.com.ar/lifestyle/la-dama-de-retiro-nid28092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-28T09:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto não fornece um resumo do conteúdo, apenas o título original. O título 'La dama de Retiro' foi traduzido para 'A dama de Retiro'.", "titulo_pt": "A dama de Retiro", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 184799, "titulo": "Globo negocia renovação com Marcos Mion; apresentador já planeja Caldeirão em 2027", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/09/globo-negocia-renovacao-com-marcos-mion-apresentador-ja-planeja-caldeirao-em-2027.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marcos Mion, apresentador do Caldeirão, deve continuar na Globo por mais algum tempo. Ele já planeja novidades para a atração em 2027, incluindo um aumento no número de edições ao vivo.", "titulo_pt": "Globo negocia renovação com Marcos Mion; apresentador planeja Caldeirão para 2027", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 184975, "titulo": "Toto Ferro: la película que hizo con Lucas Vignale que, tras la muerte de su amigo, se convirtió en un homenaje", "url": "https://www.lanacion.com.ar/espectaculos/personajes/toto-ferro-la-pelicula-que-hizo-con-lucas-vignale-que-tras-la-muerte-de-su-amigo-se-convirtio-en-un-nid28092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-28T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Toto Ferro, ator e diretor, conversou com LA NACION sobre seu primeiro trabalho como diretor, que se transformou em um homenagear a seu amigo e codiretor falecido em um acidente aéreo. O filme foi filmado após a morte do amigo, tornando-se um tributo a ele.", "titulo_pt": "Toto Ferro: a película que fez com Lucas Vignale, após a morte de seu amigo, se tornou um homenagear", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 185442, "titulo": "Rod Stewart announces final tour for 2027: ‘Most definitely my last’", "url": "https://www.theguardian.com/music/2026/sep/28/rod-stewart-announces-final-tour-for-2027-most-definitely-my-last", "fonte_id": "guardian_culture", "data_pub": "2026-09-28T08:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rod Stewart, de 81 anos, anunciou que sua próxima turnê será sua última. Ele tem sido em turnê desde os anos 1960, quando se apresentava na Europa com um harmonizma e um parceiro de música folk, Wizz Jones.", "titulo_pt": "Rod Stewart anuncia última turnê, prevista para 2027", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 184853, "titulo": "Criolo, Amaro & Dino trazem para Brasília projeto indicado ao Grammy", "url": "https://www.metropoles.com/metropoles-music/criolo-amaro-dino-trazem-para-brasilia-projeto-indicado-ao-grammy", "fonte_id": "metropoles", "data_pub": "2026-09-28T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O trio Criolo, Amaro & Dino apresentará um projeto indicado ao Grammy Latino no Festival Estilo Brasil em 30 de outubro, com a participação especial de Iza.", "titulo_pt": "Criolo, Amaro & Dino trazem para Brasília projeto indicado ao Grammy com iza", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 185447, "titulo": "Range by Dorthe Nors review – an astrophysicist at odds with reality", "url": "https://www.theguardian.com/books/2026/sep/28/range-by-dorthe-nors-review-an-astrophysicist-at-odds-with-reality", "fonte_id": "guardian_culture", "data_pub": "2026-09-28T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A narrativa do novo romance da autora dinamarquesa Dorthe Nors, 'Range', segue uma renomada astrônoma que se muda para o interior do país, mas seus verdadeiros motivos para essa mudança não estão relacionados apenas com o céu. Logo após o seu traslado, ela invade uma propriedade rural, motivada por interesse pessoal e não por pesquisa científica, quando uma mulher em um BMW preto aparece no local.", "titulo_pt": "Range de Dorthe Nors: uma astrônoma em conflito com a realidade", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 184800, "titulo": "Mira Schendel, artista que fez as letras dançarem, atiça o interesse do exterior", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/mira-schendel-artista-que-fez-as-letras-dancarem-atica-o-interesse-do-exterior.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mira Schendel, uma artista suíça naturalizada brasileira, usou letras e números em papéis translúcidos para criar obras que dançam visualmente. Suas criações, que buscam ultrapassar fronteiras linguísticas, tiveram sucesso internacional.", "titulo_pt": "Mira Schendel, artista que fez as letras dançarem, desperta interesse internacional", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 185436, "titulo": "Sex, drugs and floral fabrics: Celia Birtwell relives her wild times – and wilder outfits – with Ossie Clark", "url": "https://www.theguardian.com/culture/2026/sep/28/sex-drugs-celia-birtwell-ossie-clark-david-hockney-fashion", "fonte_id": "guardian_culture", "data_pub": "2026-09-28T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Celia Birtwell, em colaboração com Ossie Clark, criou roupas coloridas e florais que eram usadas e frequentemente associadas à elite da cultura boêmia de Londres na década psicodélica. A mostra recente celebra suas criações de moda, lembrando os bons tempos e a perda de David Hockney.", "titulo_pt": "Sexo, drogas e estampas florais: celia Birtwell relembra tempos e looks exuberantes com Ossie Clark", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 185437, "titulo": "‘I’ve never watched a whole episode of Peep Show’: Matt King on surviving a stroke and reviving Super Hans", "url": "https://www.theguardian.com/tv-and-radio/2026/sep/28/peep-show-matt-king-interview-super-hans-comedy", "fonte_id": "guardian_culture", "data_pub": "2026-09-28T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Matt King, ator que interpreta o personagem Super Hans na série de comédia britânica Peep Show, está lançando uma autobiografia após ter sobrevivido a um AVC. O livro aborda seu tempo no hospital e as reações de estranhos sobre seu personagem.", "titulo_pt": "Matt King: de volta a Super Hans após sobreviver a um avc e escrever uma autobiografia", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 185407, "titulo": "Bibigo taps K-pop appeal to woo Mexican consumers", "url": "https://www.koreaherald.com/article/10886431", "fonte_id": "korea_herald", "data_pub": "2026-09-28T06:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A CJ CheilJedang usou o apelo do K-pop para promover sua marca de alimentos Bibigo no México, combinando atividades temáticas de artistas com degustações durante a 2026 K-Expo Mexico. O evento, realizado no World Trade Center México City de 24 a 27 de setembro, apresentou conteúdo, alimentos, produtos de beleza e outros bens de consumo sul-coreanos.", "titulo_pt": "Bibigo aproveita o apelo do K-pop para atrair consumidores mexicanos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, "classe": "B"}, {"id": 185313, "titulo": "30% of children in low-income families miss out on extracurriculars: survey", "url": "https://www.japantimes.co.jp/news/2026/09/28/japan/society/low-income-households-survey/", "fonte_id": "japan_times", "data_pub": "2026-09-28T03:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa mostrou que 30% das crianças de famílias de baixa renda não participam de atividades extracurriculares. Entre as famílias de baixa renda que reduziram gastos com essas atividades, 76,5% apontaram o aumento dos preços dos itens essenciais como motivo.", "titulo_pt": "30% Das crianças de famílias de baixa renda deixam de participar de atividades extracurriculares: pesquisa", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 185118, "titulo": "India's Cockroach Party denounces crumbling schools: 'Children are treated worse than animals'", "url": "https://www.lemonde.fr/en/international/article/2026/09/28/india-s-cockroach-party-denounces-crumbling-schools-children-are-treated-worse-than-animals_6758016_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-27T22:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O partido político 'Cockroach Janta Party', liderado por gerações mais jovens, foi fundado há alguns meses e realizou auditorias em várias escolas para expor as condições degradação e insalubridade. As autoridades tentaram impedir essas inspeções.", "titulo_pt": "Partido das caramujos denuncia escolas em ruínas: 'crianças são tratadas pior do que animais'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 184480, "titulo": "Incêndio atinge hospital municipal em Campinas, interior de São Paulo", "url": "https://www.metropoles.com/sao-paulo/incendio-atinge-hospital-municipal-em-campinas-interior-de-sao-paulo", "fonte_id": "metropoles", "data_pub": "2026-09-27T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incêndio atingiu pl ", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 62 pessoas morreram devido a fortes chuvas e inundações no norte da Índia, de acordo com autoridades. As escolas foram fechadas em algumas áreas, incluindo a capital Lucknow, e equipes de resgate transferiram pessoas de áreas inundadas para locais mais seguros.", "titulo_pt": "Pelo menos 62 mortos após fortes chuvas e inundações no norte da Índia, dizem autoridades", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 185326, "titulo": "Southeast Asia’s falling literacy: can cash and gamification fix it?", "url": "https://www.scmp.com/week-asia/lifestyle-culture/article/3369039/southeast-asias-falling-literacy-can-cash-and-gamification-fix-it?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-28T07:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Najwa Alhabshi, uma tutora de 35 anos de Singapura, lembra-se de ter lido clássicos literários na adolescência, mas hoje encontra dificuldade em encontrar tempo para ler devido às obrigações profissionais. Ela afirma ter 'caído do hábito de ler'.", "titulo_pt": "Abaixamento da alfabetização na ásia oriental: dinheiro e gamificação podem ajudar?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 185187, "titulo": "Bangkok streets turn to canals as days of heavy rain bring citywide flooding", "url": "https://www.euronews.com/video/2026/09/28/bangkok-streets-turn-to-canals-as-days-of-heavy-rain-bring-citywide-flooding", "fonte_id": "euronews", "data_pub": "2026-09-28T07:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bangcoc foi inundada devido a dias de chuvas intensas, interrompendo o transporte e afetando as atividades comerciais. Abrigos foram abertos e autoridades alertaram que a água pode levar vários dias para desaparecer.", "titulo_pt": "Ruas de bangcoc se transformam em canais devido a fortes chuvas e inundação cidades", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 184904, "titulo": "Enchentes deixam ao menos oito mortos e atingem 580 mil casas na Tailândia", "url": "https://www.cnnbrasil.com.br/internacional/enchentes-deixam-mortos-e-atingem-casas-na-tailandia/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-28T06:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Enchentes na Tailândia deixaram pelo menos oito mortos e atingiram 580 mil casas, com milhares de desalojados concentrados em Bangkok. Chuvas intensas causaram novas retiradas no leste do país.", "titulo_pt": "Enchentes deixam ao menos oito mortos e atingem 580 mil casas na Tailândia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 184613, "titulo": "Devastadora inundación en Bangkok: declaran estado de desastre por los 300 milímetros caídos en 48 horas y hay más 5.000 evacuados", "url": "https://www.clarin.com/mundo/devastadora-inundacion-bangkok-declaran-estado-desastre-300-milimetros-caidos-48-horas-5000-evacuados_0_gZQyVaPsXN.html", "fonte_id": "clarin", "data_pub": "2026-09-27T21:07:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de 50.000 famílias foram afetadas pela inundação em Bangkok, com mais de 5.000 pessoas evacuadas. As aulas foram canceladas e as autoridades pediram para que a população permanecesse em casa.", "titulo_pt": "Inundação devastadora em Bangkok: estado de desastre declarado após chuvas de 300 milímetros em 48 horas e mais de 5.000 evacuados", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 184722, "titulo": "Lula's mixed environmental record has brought less deforestation but more oil", "url": "https://www.lemonde.fr/en/environment/article/2026/09/27/lula-s-mixed-environmental-record-has-brought-less-deforestation-but-more-oil_6758014_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-27T20:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva busca uma quarta gestão presidencial no Brasil, afirmando ter fortalecido as proteções para a Amazônia. No entanto, seu apoio a novas explorações de petróleo está obscurecendo sua imagem como defensor do meio ambiente.", "titulo_pt": "Registro ambiental misto de lula tem reduzido a desmatamento, mas aumentado a exploração de petróleo", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 184085, "titulo": "Trump afirma que detenidos en Reino Unido buscaban causar “gran daño” en una base aérea utilizada por EE.UU.", "url": "https://www.latercera.com/mundo/noticia/trump-afirma-que-detenidos-en-reino-unido-buscaban-causar-gran-dano-en-una-base-aerea-utilizada-por-eeuu/", "fonte_id": "la_tercera", "data_pub": "2026-09-27T17:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Trump, afirmou que cinco suspeitos detidos perto de RAF Fairford buscavam causar 'grande dano' em uma base aérea usada pelos Estados Unidos. Os suspeitos vinham sendo investigados há algum tempo, e a polícia britânica os mantém detidos sob a suspeita de preparar um ato terrorista.", "titulo_pt": "Trump afirma que detidos no Reino Unido buscavam causar 'grande dano' em base aérea usada pelos EUA", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 184043, "titulo": "Una potente tormenta golpea la costa este de Estados Unidos: un muerto, inundaciones y casi 150.000 hogares sin electricidad", "url": "https://www.clarin.com/estados-unidos/potente-tormenta-golpea-costa-estados-unidos-muerto-inundaciones-150000-hogares-electricidad_0_KU5M6UDRFS.html", "fonte_id": "clarin", "data_pub": "2026-09-27T17:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma forte tempestade, conhecida como 'nor’easter', atingiu a costa leste dos Estados Unidos, causando mortes, inundações e deixando cerca de 150.000 residências sem energia. Emergências foram declaradas em várias áreas de Nova York e Nova Jersey.", "titulo_pt": "Potente tempestade atinge costa leste dos EUA: um morto, inundações e quase 150.000 casas sem luz", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 183914, "titulo": "Elevação do nível do mar destrói casas e apaga praias na Califórnia", "url": "https://www.cnnbrasil.com.br/internacional/elevacao-do-nivel-do-mar-destroi-casas-e-apaga-praias-na-california/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Casas foram destruídas e praias desapareceram na Califórnia devido a uma série de ciclones e furacões do Pacífico Oriental, intensificados pelo fenômeno El Niño.", "titulo_pt": "Elevação do nível do mar destrói casas e apaga praias na Califórnia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 184315, "titulo": "3 hikers fall ill on Hong Kong trails as temperatures top 33 degrees", "url": "https://www.scmp.com/news/hong-kong/society/article/3368956/3-hikers-fall-ill-hong-kong-trails-temperatures-top-33-degrees?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-27T11:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pelo menos três excursionistas se sentiram mal em trilhas rurais de Hong Kong durante um dia com temperaturas de até 33 graus Celsius. Um visitante de 25 anos foi suspeito de sofrer de choque térmico durante uma caminhada no percurso popular de High Island Reservoir East Dam-Po Pin Chau em Sai Kung.", "titulo_pt": "Pelo menos três caminhoneiros se sentem mal em trilhas de Hong Kong com temperaturas acima de 33 graus", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 183542, "titulo": "Thousands march for climate across France: 'I wish there were more of us, after the summer we've just had'", "url": "https://www.lemonde.fr/en/environment/article/2026/09/27/thousands-march-for-climate-across-france-i-wish-there-were-more-of-us-after-the-summer-we-ve-just-had_6757999_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-27T07:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em diversas cidades francesas, desde Bordéus até Paris, ocorreram 260 manifestações envolvendo 120 mil pessoas em prol do clima, da vida, da paz e da justiça social.", "titulo_pt": "Milhares marcham por clima em toda França: 'gostaria que houvessem mais de nós, depois do verão que passamos'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 183320, "titulo": "Onda de calor sufocante pode fazer temperatura passar dos 40ºC em 8 estados", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/onda-de-calor-sufocante-pode-fazer-temperatura-passar-dos-40oc-em-8-estados/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-27T06:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma onda de calor intensa está afetando 8 estados brasileiros, com previsão de temperatura acima dos 40ºC até a próxima quarta-feira (30). O fenômeno começou no sábado (26) e deve durar até o próximo dia 30, conforme previsão do Instituto Nacional de Meteorologia (Inmet).", "titulo_pt": "Onda de calor sufocante pode fazer temperatura passar dos 40ºc em 8 estados", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 183671, "titulo": "Nepal’s hydropower ambitions face climate reality check", "url": "https://www.japantimes.co.jp/environment/2026/09/27/energy/nepal-hydropower-focus/", "fonte_id": "japan_times", "data_pub": "2026-09-27T03:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 90% da eletricidade de Nepal vem da hidropotência, mas danos extensos aos seus projetos fluviais levantaram dúvidas sobre a segurança energética do país.", "titulo_pt": "Ambições de hidropotência de nepal enfrentam veredito da realidade climática", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 185316, "titulo": "India’s Supreme Court urges accountability over rapes", "url": "https://www.scmp.com/news/asia/south-asia/article/3369069/indias-supreme-court-urges-accountability-over-rapes?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-28T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Corte Suprema da Índia pressionou por maior responsabilidade em relação a casos recentes de estupro no Distrito Nacional e nas proximidades, afirmando que refletem uma 'falha na aplicação da lei'. Centenas de estudantes protestaram em Delhi na semana anterior, exigindo maior segurança para mulheres após uma adolescente afirmar ter sido estuprada por três homens em um parque da cidade.", "titulo_pt": "Corte suprema da Índia pressiona por responsabilidade em casos de estupro", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 185317, "titulo": "How Mary Jane Veloso’s case exposes gaps in Filipino migrant protection", "url": "https://www.scmp.com/week-asia/people/article/3369068/how-mary-jane-velosos-case-exposes-gaps-filipino-migrant-protection?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-28T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A libertação de Mary Jane Veloso, após 16 anos em detenção, foi celebrada pelos defensores dos direitos dos migrantes, mas também destacou os riscos que ainda enfrentam muitos trabalhadores filipinos vulneráveis no exterior. Veloso foi quase executada na Indonésia anos atrás e agora foi libertada graças a um perdão absoluto concedido pelo presidente filipino.", "titulo_pt": "Como o caso de Mary Jane Veloso expõe falhas na proteção de trabalhadores filipinos migrantes", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 185116, "titulo": "Famine feared in Russian-occupied Ukrainian city Oleshky", "url": "https://www.lemonde.fr/en/international/article/2026/09/28/famine-feared-in-russian-occupied-ukrainian-city-oleshky_6758034_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-28T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os residentes da cidade ucraniana de Oleshky, situada na linha de frente, enfrentam graves escassezes de alimentos e medicamentos, agravando a crise humanitária. A capital ucraniana, Kyiv, levou o caso à Organização das Nações Unidas.", "titulo_pt": "Fome temida na cidade ucraniana Oleshky ocupação russa", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 185331, "titulo": "Businessman Jason Poon and wife granted bail over alleged HK$6 million loan fraud", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3369025/businessman-jason-poon-wife-granted-bail-over-alleged-hk6-million-loan-fraud?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-28T06:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O empresário de construção Jason Poon Chuk-hung, de 56 anos, e sua esposa, Carrie Chu Shu-fong, de 54 anos, foram concedidos o direito ao bônus judicial após serem acusados de supostamente fraudar um esquema de financiamento governamental para empresas no valor de HK$6 milhões (US$765,000) durante a pandemia de COVID-19. Os processos contra eles por fraudes e lavagem de dinheiro serão transferidos para o Tribunal Distrital.", "titulo_pt": "Empresário Jason Poon e esposa concedidos bônus judicial por suposto esquema de fraude de empréstimo de HK$6 milhões", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 185077, "titulo": "Another Lao Activist Vanishes in Thailand", "url": "https://thediplomat.com/2026/09/another-lao-activist-vanishes-in-thailand/", "fonte_id": "the_diplomat", "data_pub": "2026-09-28T03:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Khieo Lapchanh é o último exilado lao a ser vítima da crescente colaboração autoritária entre os governos da região do Mekong.", "titulo_pt": "Outro ativista Lao desaparece na tailândia", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 1852
