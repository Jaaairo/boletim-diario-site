ocal discreto onde agências que tenham presenciado comportamentos inadequados podem informar as autoridades.", "titulo_pt": "Agentes de IA agora têm um lugar para denunciar", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 163993, "titulo": "ZuckOff Is a Free App That Sees Meta Glasses Before They See You", "url": "https://www.wired.com/story/zuckoff-app-sees-meta-glasses-before-they-see-you/", "fonte_id": "wired", "data_pub": "2026-09-15T17:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "ZuckOff é uma aplicação gratuita que pode detectar a presença de óculos inteligentes da Meta antes que você os veja. Essa ferramenta ajuda a identificar se alguém está usando dispositivos de vigilância sem que você saiba.", "titulo_pt": "Zuckoff é uma aplicação gratuita que detecta óculos inteligentes da Meta antes que você os veja", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 163371, "titulo": "Ex-Google reforça alerta de que a IA pode “matar todos os humanos”", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/ex-google-reforca-alerta-de-que-a-ia-pode-matar-todos-os-humanos/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T16:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ex-empregado da Anthropic reforçou a preocupação sobre os perigos potenciais da inteligência artificial. Isso ocorreu após a empresa ex-Anthropic ter expressado preocupações similares sobre a tecnologia.", "titulo_pt": "Ex-anthropic reforça alerta de que a IA pode 'matar todos os humanos'", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 163279, "titulo": "Empresas de segurança e fabricantes de tecnologia de defesa se unem para ampliar integração tecnológica", "url": "https://veja.abril.com.br/brasil/empresas-de-seguranca-e-fabricantes-de-tecnologia-de-defesa-se-unem-para-ampliar-integracao-tecnologica/", "fonte_id": "veja", "data_pub": "2026-09-15T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas de segurança e fabricantes de tecnologia de defesa estão unindo forças para aumentar a integração tecnológica. O movimento visa elevar os padrões do setor.", "titulo_pt": "Empresas de segurança e fabricantes de tecnologia de defesa unem-se para elevar padrões do setor", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 163184, "titulo": "TotalEnergies investirá mais de 100 milhões de euros em projeto de IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/totalenergies-investira-mais-de-100-milhoes-de-euros-em-projeto-de-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T16:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A TotalEnergies investirá mais de 100 milhões de euros em uma parceria com a startup francesa Mistral AI para expandir suas capacidades de exploração de petróleo e gás e estender a vida útil de campos existentes.", "titulo_pt": "Totalenergies investirá mais de 100 milhões de euros em projeto de IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 163757, "titulo": "Musk urges top AI labs, Chinese companies to test each other's models amid calls for slowdown", "url": "https://www.cnbc.com/2026/09/15/elon-musk-ai-safety-testing.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-15T16:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Elon Musk incentivou as principais empresas e laboratórios de IA a realizarem uma revisão mútua de seus modelos antes de lançá-los ao público, com o objetivo de avaliar sua segurança. Essa medida foi proposta em meio a chamados para uma pausa no desenvolvimento de IA avançada.", "titulo_pt": "Musk incentiva laboratórios e empresas chinesas a realizarem revisão mútua de modelos de IA", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 163994, "titulo": "Join WIRED@Night for an Uncanny Valley Live Recording on Women, Tech, and Power", "url": "https://www.wired.com/story/come-see-uncanny-valley-live/", "fonte_id": "wired", "data_pub": "2026-09-15T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O evento ocorrerá em São Francisco e abordará temas relacionados a mulheres, tecnologia e poder. Será uma gravação ao vivo do podcast WIRED@Night.", "titulo_pt": "Joineie-se ao WIRED@Night para uma gravação ao vivo sobre mulheres, tecnologia e poder em são francisco", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 163638, "titulo": "Trump’s Position on AI Makes No Sense", "url": "https://www.theatlantic.com/ideas/2026/09/trump-ai-china/688629/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-15T15:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, expressou preocupação com a corrida tecnológica em Inteligência Artificial (IA), mas permite que empresas chinesas comprem chips americanos.", "titulo_pt": "Posição de trump sobre IA não faz sentido", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 163968, "titulo": "Meta’s new One subscriptions put a price on social media and AI", "url": "https://www.theverge.com/tech/995453/meta-one-subscriptions-ai", "fonte_id": "the_verge", "data_pub": "2026-09-15T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta lançou novas assinaturas One que combinam suas assinaturas de aplicativos individuais com uso adicional de IA. As novas assinaturas estão disponíveis globalmente e oferecem diferentes níveis para usuários individuais, criadores e empresas. Além disso, a empresa lançou recentemente seu assistente de IA multifuncional Muse.", "titulo_pt": "Novas assinaturas One da meta colocam um preço na mídia social e na IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 163398, "titulo": "99 integra mais de 150 estações de recarga elétrica no Rio e oferece até 20% de desconto", "url": "https://exame.com/esg/99-integra-mais-de-150-estacoes-de-recarga-eletrica-no-rio-e-oferece-ate-20-de-desconto/", "fonte_id": "exame", "data_pub": "2026-09-15T13:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 99 expandiu seu serviço de recarga elétrica para o Rio de Janeiro, integrando mais de 150 estações. A empresa oferece até 20% de desconto nas recargas. Essa expansão faz parte de sua estratégia para apoiar a eletrificação da frota.", "titulo_pt": "99 Integra mais de 150 estações de recarga elétrica no Rio e oferece até 20% de desconto", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 164001, "titulo": "The AI Inference Revolution Is Here", "url": "https://spectrum.ieee.org/inference-hardware-revolution", "fonte_id": "ieee_spectrum", "data_pub": "2026-09-15T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde 2020, o foco do desenvolvimento da IA tem se voltado para a criação de modelos maiores e melhores. O GPT-4, em 2024, atingiu uma pontuação de 88,7% em um teste de conhecimento e raciocínio, comparável aos humanos. A treinamento de modelos cada vez maiores ainda ocorre, mas tem sido menos central na discussão sobre IA.", "titulo_pt": "A revolução da inferência de IA chegou", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 164002, "titulo": "The Mind-bending Joyrides That Gave Rise to Tesla", "url": "https://spectrum.ieee.org/elon-musk-tesla", "fonte_id": "ieee_spectrum", "data_pub": "2026-09-15T12:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2003, Martin Eberhard, cofundador da Tesla Motors, buscou atrair investidores ao conduzir a tZero, um revolucionário e extremamente rápido carro elétrico construído por Alan Cocconi e Tom Gage na AC Propulsion, por Sand Hill Road, no coração da Valley de Silício. Eberhard e Gage realizaram demonstrações para empreendedores e investidores curiosos.", "titulo_pt": "As excursões desconcertantes que levaram ao nascimento da Tesla", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 163958, "titulo": "The Download: AI doomers, whistleblowing agents, and de-aged livers", "url": "https://www.technologyreview.com/2026/09/15/1144141/the-download-ai-extinction-whistleblowing-agents-donated-livers/", "fonte_id": "mit_tech_review", "data_pub": "2026-09-15T12:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A indústria de inteligência artificial (IA) está tomando uma direção mais pessimista. Chefe de IA Dario Amodei, Sam Altman, Elon Musk e Demis Hassabis concordam sobre os riscos associados às últimas gerações de modelos de aprendizado de máquina (LLMs).", "titulo_pt": "Download: otimistas e pesimistas na IA, denunciantes e pulmões rejuvenescidos", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 164061, "titulo": "The U.S. has weapons in space", "url": "https://www.scientificamerican.com/article/the-u-s-has-weapons-in-space/", "fonte_id": "scientific_american", "data_pub": "2026-09-15T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um alto funcionário anunciou que os militares dos Estados Unidos deslocaram armas para a órbita para contrabalançar ameaças vindas da Rússia e da China.", "titulo_pt": "Estados unidos têm armas em órbita", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 164089, "titulo": "Celebrate International Observe the Moon Night with NASA", "url": "https://www.nasa.gov/centers-and-facilities/goddard/celebrate-international-observe-the-moon-night-with-nasa/", "fonte_id": "nasa_news", "data_pub": "2026-09-15T16:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em setembro, a NASA convida o público para observar a Lua em eventos espalhados pelo país, incluindo a celebração do International Observe the Moon Night no Goddard Space Flight Center. Este evento ocorre após a missão Artemis II, que levou quatro astronautas de volta à órbita lunar após 50 anos.", "titulo_pt": "Comemore o International Observe the Moon Night com a NASA", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 164090, "titulo": "Artemis III Crew Visits NASA Kennedy’s Vehicle Assembly Building", "url": "https://www.nasa.gov/image-article/artemis-iii-crew-visits-nasa-kennedys-vehicle-assembly-building/", "fonte_id": "nasa_news", "data_pub": "2026-09-15T16:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astronautas da NASA, Randy Bresnik e Andre Douglas, e da ESA, Luca Parmitano, visitaram o Vehicle Assembly Building da NASA no Kennedy Space Center em Florida para inspecionar o avanço na integração do foguete propelente sólido em 2 de setembro de 2026. Também presentes foram os astronautas Frank Rubio e Bob Hines.", "titulo_pt": "Tripulantes da artemis III visitam edifício de montagem de véhiculas do Kennedy space center", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 164062, "titulo": "Do universal free lunch programs affect students' academic performance?", "url": "https://www.scientificamerican.com/article/do-universal-free-lunch-programs-affect-students-academic-performance/", "fonte_id": "scientific_american", "data_pub": "2026-09-15T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Scientific American indica que há benefícios financeiros e sociais na oferta de lanche gratuito para todos os alunos, mas a relação entre esse programa e o desempenho acadêmico ainda não está clara. Expertos afirmam que o lanche gratuito melhora o desempenho acadêmico dos alunos.", "titulo_pt": "Programas de lanche gratuito para todos os alunos afetam o desempenho acadêmico?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 164063, "titulo": "Which million-dollar math problem could AI solve next?", "url": "https://www.scientificamerican.com/article/which-million-dollar-math-problem-could-ai-solve-next/", "fonte_id": "scientific_american", "data_pub": "2026-09-15T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois que um modelo da OpenAI apresentou uma possível solução ao problema de Navier-Stokes, matemáticos estão especulando qual outra questão importante não resolvida poderia ser resolvida pela inteligência artificial no futuro.", "titulo_pt": "Qual próximo problema matemático de um milhão de dólares poderia ser resolvido pela IA?", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 164082, "titulo": "More satellites watch the battlefield, putting a premium on making sense of the data", "url": "https://spacenews.com/more-satellites-watch-the-battlefield-putting-a-premium-on-making-sense-of-the-data/", "fonte_id": "spacenews", "data_pub": "2026-09-15T15:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Programas da Força Espacial estão utilizando dados de satélites e inteligência artificial para fornecer informações mais rapidamente aos comandantes militares. O aumento no número de satélites monitorando o campo de batalha está elevando a importância de interpretar esses dados de forma eficiente.", "titulo_pt": "Mais satélites vigiam o campo de batalha, aumentando a necessidade de interpretar os dados", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 164052, "titulo": "Meet Swiftiephylus, an Australian bug named after Taylor Swift", "url": "https://www.sciencenews.org/article/swiftiephylus-bug-named-taylor-swift", "fonte_id": "science_news", "data_pub": "2026-09-15T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quatro novas espécies de insetos da Austrália foram nomeadas em homenagem à cantora Taylor Swift. Esses insetos pertencem a uma família de pulgas chamada plant bugs.", "titulo_pt": "Conheça Swiftiephylus, inseto australiano nomeado em homenagem a Taylor Swift", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 164035, "titulo": "STAT+: Medicare to expand its pilot that pays for technology to manage chronic diseases", "url": "https://www.statnews.com/2026/09/15/medicare-access-chronic-care-management-tech-pilot-expanding/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-15T14:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O programa Medicare, recentemente lançado, que remunera a tecnologia para auxiliar as pessoas a gerenciar condições crônicas está sendo expandido.", "titulo_pt": "Medicare amplia seu experimento que remunera tecnologia para gerenciar doenças crônicas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 164087, "titulo": "PAHO opens a new pathway to access lenacapavir for HIV prevention in Latin America and the Caribbean", "url": "https://www.paho.org/en/news/15-9-2026-paho-opens-new-pathway-access-lenacapavir-hiv-prevention-latin-america-and-caribbean", "fonte_id": "paho", "data_pub": "2026-09-15T14:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OPAS abriu um novo caminho para o acesso ao lenacapavir como prevenção do HIV em América Latina e no Caribe. Este medicamento será agora mais acessível para prevenir a infecção pelo HIV na região.", "titulo_pt": "Opas abre novo caminho para acesso ao lenacapavir na prevenção do HIV em américa latina e no caribe", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 164036, "titulo": "STAT+: FDA takes applications for new program to shorten drug approval times", "url": "https://www.statnews.com/2026/09/15/fda-launches-program-to-shorten-drug-approval-times/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-15T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA está aceitando inscrições para um programa piloto visando acelerar os tempos de aprovação de medicamentos e ajudar os EUA a competir com países como a China e Austrália.", "titulo_pt": "FDA abre inscrições para programa piloto para acelerar a aprovação de medicamentos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 164088, "titulo": "Webb reveals stunning panorama of star formation", "url": "https://www.esa.int/Science_Exploration/Space_Science/Webb/Webb_reveals_stunning_panorama_of_star_formation", "fonte_id": "esa_space", "data_pub": "2026-09-15T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem estelar da região de formação estelar IC 348, uma das maiores liberadas pela Telescópio Espacial James Webb da NASA/ESA/CSA, foi usada pelos astrônomos para buscar brown dwarfs, objetos menos massivos que as estrelas mais pequenas. Eles descobriram brown dwarfs com duas vezes a massa de Júpiter, expandindo o espectro de estudo desses objetos.", "titulo_pt": "Webb revela impressionante panorama de formação estelar", "veiculo": "ESA - Space Science", "pais": "Europa", "classe": "A"}, {"id": 164091, "titulo": "NASA’s Webb Reveals Dynamic Panorama of Star Formation", "url": "https://science.nasa.gov/missions/webb/nasas-webb-reveals-dynamic-panorama-of-star-formation/", "fonte_id": "nasa_news", "data_pub": "2026-09-15T14:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA's James Webb Space Telescope capturou uma vista estelar detalhada da região formadora de estrelas IC 348, uma das imagens mais grandes divulgadas até agora. Os astrônomos usaram a Webb para procurar por gigantes vermelhos, descobrindo alguns com apenas duas vezes a massa de Júpiter.", "titulo_pt": "Webb da nasa revela Panorama dinâmico de formação estelar", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 164037, "titulo": "STAT+: Obesity drugmakers are testing in kids as young as 6", "url": "https://www.statnews.com/2026/09/15/biotech-news-obesity-drugmakers-are-testing-in-kids-as-young-as-si/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-15T13:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Farmacêuticas de medicamentos para obesidade estão testando seus produtos em crianças a partir dos 6 anos. Vera busca aprovação para um medicamento renal, e outras notícias de biotecnologia da The Readout incluem dados preliminares de uma empresa chamada Syntis Bio.", "titulo_pt": "Farmacêuticas de medicamentos para obesidade testam em crianças a partir dos 6 anos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 164092, "titulo": "Travel", "url": "https://www.nasa.gov/centers-and-facilities/nssc/travel/", "fonte_id": "nasa_news", "data_pub": "2026-09-15T13:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NSSC oferece serviços de indenização por deslocamento para todos os tipos de viagens autorizadas pela Agência, incluindo viagens domésticas, internacionais, locais, de serviço prolongado e de mudança de estação. Os taxas de subsídio de alimentação doméstico e internacional, bem como as regras de impostos, estão baseadas nas regulamentações federais de viagens.", "titulo_pt": "Viagens", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 164039, "titulo": "STAT+: New documents reveal problems with Medicare’s prior-authorization pilot", "url": "https://www.statnews.com/2026/09/15/medicare-ai-prior-authorization-pilot-problems-health-tech/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-15T13:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos documentos revelam problemas com o lançamento apressado do piloto de autorização prévia baseado em IA do Medicare. O relatório também menciona pistas de políticas vindas de altos funcionários do FDA e ONC.", "titulo_pt": "Novos documentos revelam problemas com o lançamento apressado do piloto de autorização prévia baseado em IA do Medicare", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 164053, "titulo": "‘Bogland’ explores beautifully strange ecosystems", "url": "https://www.sciencenews.org/article/book-review-bogland-strange-ecosystems", "fonte_id": "science_news", "data_pub": "2026-09-15T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ecologista Merritt Turetsky dedica seu novo livro à exploração de ecossistemas úmidos fascinantes como bacias de bueiro e várzeas inundadas. O livro reflete sua paixão por esses ambientes úmidos e singulares.", "titulo_pt": "‘Bogland’ explora ecossistemas úmidos fascinantes", "veiculo": "Science News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 164121, "titulo": "Painter Lucy Bull Joins Hauser & Wirth as Her Market Continues Its Ascent", "url": "https://www.artnews.com/art-news/news/lucy-bull-hauser-and-wirth-representation-1234798169/", "fonte_id": "artnews", "data_pub": "2026-09-15T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A artista Lucy Bull, uma estrela da categoria de mercado 'ultra-contemporânea', passará a ser representada pela galeria Hauser & Wirth. Ela permanecerá representada pelo David Kordansky.", "titulo_pt": "A artista Lucy Bull passa a ser representada pela Hauser & Wirth", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 164175, "titulo": "In About-Face, British Museum Bans Photography of Bayeux Tapestry", "url": "https://www.artforum.com/news/british-museum-bans-photos-of-bayeux-tapestry-1234759200/", "fonte_id": "artforum", "data_pub": "2026-09-15T17:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fotografia não está mais permitida diante da Tapestra de Bayeux no British Museum, de acordo com o blog Maxwell Museums, escrito pelo jornalista Maxwell Blowfield. Blowfield relatou que visitou o museu duas vezes para ver o trabalho-mestre do século XI: a primeira como membro de imprensa convidado e a segunda como visitante comum.", "titulo_pt": "British Museum proíbe fotografia da tapestra de Bayeux", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 164177, "titulo": "It’s “A Cat-astrophe”! (1919)", "url": "https://publicdomainreview.org/collection/cat-astrophe", "fonte_id": "public_domain_review", "data_pub": "2026-09-15T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A 'Cat-astrophe' ocorreu no final de uma estranha onda de música cat-themed em 1918.", "titulo_pt": "É uma 'catástrofe' com gatos!", "veiculo": "Public Domain Review", "pais": "Reino Unido", "classe": "B"}, {"id": 163207, "titulo": "A aposta da Novig nos peitos de Sydney Sweeney", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/joanna-moura/2026/09/a-aposta-da-novig-nos-peitos-de-sydney-sweeney.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-15T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma plataforma de apostas lançou uma campanha publicitária que mostra uma mulher nua, com partes íntimas cobertas por bolas de futebol americano e raquetes, promovendo a empresa como 'apenas esportes'.", "titulo_pt": "Aposta da Novig usa peitos de modelo em campanha polêmica", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 163267, "titulo": "Benedita da Silva faz campanha na ‘garupa’ de Zeca Pagodinho", "url": "https://veja.abril.com.br/politica/benedita-da-silva-faz-campanha-na-garupa-de-zeca-pagodinho/", "fonte_id": "veja", "data_pub": "2026-09-15T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Benedita da Silva, candidata ao Senado pelo PT, realizou uma campanha em Xerém em um quadriciclo pertencente ao sambista Zeca Pagodinho.", "titulo_pt": "Benedita da Silva faz campanha na garupa de Zeca Pagodinho", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 163268, "titulo": "Morre Amelinha Teles, símbolo da luta contra a ditadura, aos 81 anos", "url": "https://veja.abril.com.br/cultura/morre-amelinha-teles-simbolo-da-luta-contra-a-ditadura-aos-81-anos/", "fonte_id": "veja", "data_pub": "2026-09-15T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Amelinha Teles, ativista, escritora e ex-prisão política, morreu aos 81 anos. Ela foi torturada durante o regime militar e dedicou sua vida à defesa dos direitos humanos.", "titulo_pt": "Morre Amelinha Teles, símbolo da luta contra a ditadura, aos 81 anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 164194, "titulo": "Ed Sheeran Addresses Macklemore’s Removal From Tour in New Statement", "url": "https://pitchfork.com/story/ed-sheeran-addresses-macklemores-removal-from-tour-in-new-statement/", "fonte_id": "pitchfork", "data_pub": "2026-09-15T17:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ed Sheeran emitiu um comunicado afirmando que a saída de Macklemore do tour foi uma decisão do promotor, não dele próprio. Segundo Sheeran, Macklemore tinha um contrato com o promotor, não com ele.", "titulo_pt": "Ed Sheeran comenta sobre saída de Macklemore do Tour", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 163208, "titulo": "Ed Sheeran diz que retirada de Macklemore da turnê partiu dos produtores", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/ed-sheeran-diz-que-retirada-de-macklemore-da-turne-partiu-dos-produtores.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-15T17:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O cantor Ed Sheeran afirmou que a saída do rapper Macklemore da turnê Loop Tour foi uma decisão dos produtores, devido a ameaças de cancelamento de shows por parte de casas de shows. A decisão ocorre após Macklemore fazer declarações pró-Palestina.", "titulo_pt": "Ed Sheeran afirma que saída de Macklemore da turnê foi decisão dos produtores", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 164195, "titulo": "Syd Lines Up North American Tour", "url": "https://pitchfork.com/story/syd-lines-up-north-american-tour/", "fonte_id": "pitchfork", "data_pub": "2026-09-15T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Syd está agendando datas para uma turnê norte-americana, que começará em novembro com shows de Beard.", "titulo_pt": "Syd anuncia turnê norte-americana para novembro", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 164123, "titulo": "Chelsea Building Housing Two Art Galleries Will Go to Auction, But the Dealers Plan to Stay Put", "url": "https://www.artnews.com/art-news/market/chelsea-building-housing-art-galleries-auction-dealers-stay-1234798371/", "fonte_id": "artnews", "data_pub": "2026-09-15T16:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As galerias de arte Miles McEnery e Yancey Richardson, que já ocupam espaços no prédio há anos, planejam vender o edifício, mas continuarão a operar nas mesmas localizações.", "titulo_pt": "Prédio com duas galerias de arte vai à leilão, mas comerciantes permanecerão", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 164110, "titulo": "‘This should be condemned by any thinking human’: film industry rallies behind NAZA directors", "url": "https://www.theguardian.com/film/2026/sep/15/naza-directors-yuval-abraham-rachel-szor-film-industry-support", "fonte_id": "guardian_culture", "data_pub": "2026-09-15T16:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Diretores israelenses Yuval Abraham e Rachel Szor, vencedores do Oscar pela documentário NAZA, estão sendo ameaçados de ter sua cidadania revogada pelo ministro da Cultura de Israel, que os acusa de traição ao estado. O setor cinematográfico global está unindo forças em apoio a eles.", "titulo_pt": "Esta deve ser condenada por qualquer ser pensante: indústria cinematográfica se solidariza com diretores de NAZA", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 163965, "titulo": "How The Oregon Trail became a generational icon", "url": "https://www.theverge.com/podcast/995432/how-the-oregon-trail-became-a-generational-icon", "fonte_id": "the_verge", "data_pub": "2026-09-15T16:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O jogo The Oregon Trail se tornou um ícone para várias gerações de crianças, seja no fundo da sala de aula ou em casa no computador, durante as últimas três décadas.", "titulo_pt": "Como The Oregon Trail se tornou um ícone para várias gerações", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 164116, "titulo": "New Order keyboardist Gillian Gilbert announces she is ‘living with cancer’", "url": "https://www.theguardian.com/music/2026/sep/15/new-order-keyboardist-gillian-gilbert-announces-she-is-living-with-cancer", "fonte_id": "guardian_culture", "data_pub": "2026-09-15T16:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gillian Gilbert, tecladista da New Order, anunciou que está novamente recebendo tratamento para câncer. Ela fez o anúncio em seu Instagram após seu marido e baterista da banda, Stephen Morris, ter mencionado problemas de saúde em uma entrevista recente.", "titulo_pt": "Gillian Gilbert, tecladista da new Order, anuncia que está 'vivendo com câncer'", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 163522, "titulo": "La Batalla de Chile: la historia del documental que inmortalizó la huella de Patricio Guzmán", "url": "https://www.latercera.com/culto/noticia/patricio-guzman-y-la-batalla-de-chile-el-legado-del-documental-mas-importante-de-america-latina/", "fonte_id": "la_tercera", "data_pub": "2026-09-15T16:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Patricio Guzmán, cineasta chileno, faleceu aos 85 anos em Paris. O documentário 'A Batalha de Chile', que retrata a utopia e a queda do governo da Unidade Popular, é destacado como um marco cinematográfico. O filme está disponível em plataformas como Ondamedia e Mubi.", "titulo_pt": "A batalha de Chile: a história do documentário que inmortalizou a trajetória de Patricio Guzmán", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 164117, "titulo": "Matthew Rhys’s alma mater pays tribute to ‘loyal pupil’ and Welsh language devotee", "url": "https://www.theguardian.com/tv-and-radio/2026/sep/15/matthew-rhys-emmys-wales-welsh-language-school", "fonte_id": "guardian_culture", "data_pub": "2026-09-15T15:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Matthew Rhys, ator que conquistou dois prêmios Emmy consecutivos, agradeceu à sua terra natal, o País de Gales, por sua formação. Ele disse que o Gales é uma pequena, mas poderosa nação e agradeceu em galego.", "titulo_pt": "Matthias Rhys, formado no país de gales, tributa a nação pela sua formação e talento", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 164119, "titulo": "The lion, the witch and the warblers: behind the scenes of Handel’s Alcina at the RBO – in pictures", "url": "https://www.theguardian.com/music/gallery/2026/sep/15/handel-alcina-at-the-rbo-royal-opera-in-pictures", "fonte_id": "guardian_culture", "data_pub": "2026-09-15T15:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A produção colorida e exagerada da ópera Alcina, que conta a história de uma encantadora que transforma seus amantes em animais, retorna ao palco do Royal Opera House. As fotos capturam os bastidores dos últimos dias de ensaios.", "titulo_pt": "Alicina, o leão, a bruxa e os passarinhos: bastidores da ópera de Handel no RBO – em imagens", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 163293, "titulo": "Alagado há 4 dias, Jd. Pantanal se mobiliza para distribuir água e comida", "url": "https://www.metropoles.com/sao-paulo/alagado-jd-pantanal-agua-e-comida", "fonte_id": "metropoles", "data_pub": "2026-09-15T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A região do Jardim Pantanal, localizada na várzea do Rio Tietê, está alagada há quatro dias, desde que choveu intensamente em São Paulo a partir do sábado, 12 de setembro. A comunidade está se mobilizando para distribuir água e alimentos.", "titulo_pt": "Alagado há 4 dias, Jd. Pantanal se mobiliza para distribuir água e comida", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 163377, "titulo": "Grupo é denunciado por crimes violentos em destinos turísticos da Bahia", "url": "https://www.cnnbrasil.com.br/nacional/nordeste/ba/grupo-e-denunciado-por-crimes-violentos-em-destinos-turisticos-da-bahia/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T16:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público investiga a atuação de tráfico e lavagem de dinheiro com estruturas bem definidas em Porto Seguro e região. Um grupo foi denunciado por crimes violentos em destinos turísticos da Bahia.", "titulo_pt": "Grupo é denunciado por crimes violentos em destinos turísticos da Bahia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 163379, "titulo": "PMs acusados de matar sargento em quartel são julgados hoje (15) em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/pms-acusados-de-matar-sargento-em-quartel-sao-julgados-hoje-15-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T16:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os policiais militares envolvidos na morte do sargento em um quartel em 2023, após uma discussão por escala de serviço, serão julgados hoje em São Paulo. O capitão e o cabo são acusados de homicídio qualificado e fraude processual.", "titulo_pt": "Pms acusados de matar sargento em quartel são julgados hoje em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 163183, "titulo": "Saúde no Brasil desperdiça até R$ 360 bilhões por ano, diz estudo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/09/saude-no-brasil-desperdica-ate-r-360-bilhoes-por-ano-diz-estudo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T16:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O sistema de saúde brasileiro desperdiça entre R$ 240 bilhões e R$ 360 bilhões por ano, de acordo com um estudo elaborado pela Fesaúde e pelo SindHosp.", "titulo_pt": "Saúde no Brasil desperdiça até R$ 360 bilhões por ano, diz estudo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 163191, "titulo": "Caixa e bancários retomam negociações nesta quarta (16), mas greve segue sem prazo para terminar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/caixa-e-bancarios-retomam-negociacoes-nesta-quarta-16-mas-greve-segue-sem-prazo-para-terminar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-15T15:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Caixa Econômica Federal e os bancários retomaram as negociações nesta quarta-feira (16) com o objetivo de encerrar a greve nacional, que começou no dia 10. A paralisação continua sem prazo definido para terminar.", "titulo_pt": "Caixa e bancários retomam negociações, mas greve segue sem prazo para terminar", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 163495, "titulo": "Indexa Broadcast: 70% dos brasileiros confiam na PF; 42% confiam no STF", "url": "https://www.jota.info/justica/indexa-broadcast-70-dos-brasileiros-confiam-na-pf-42-confiam-no-stf", "fonte_id": "jota", "data_pub": "2026-09-15T14:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "70% dos brasileiros confiam na Polícia Federal, enquanto 42% confiam no Supremo Tribunal Federal. A confiança na Polícia Federal é majoritária tanto entre apoiadores de Lula quanto entre apoiadores de Bolsonaro.", "titulo_pt": "70% Dos brasileiros confiam na PF; 42% confiam no STF", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 163877, "titulo": "South Africa on alert after seventh woman’s body found near capital", "url": "https://www.scmp.com/news/world/africa/article/3367629/south-africa-alert-after-7th-womans-body-found-near-capital?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-15T13:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A corpo de uma mulher foi encontrado na mesma área, a leste de Joanesburgo, onde foram descobertos corpos de outras vítimas nos últimos dois meses. A polícia saudou o público para que fossem mais cautelosas, sem confirmar se os casos são obra de um único assassino.", "titulo_pt": "África do sul em alerta após corpo da sétima mulher ser encontrado perto da capital", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 163899, "titulo": "Nearly 9 in 10 middle-aged Seoul residents are caring for parent, child or both", "url": "https://www.koreaherald.com/article/10874681", "fonte_id": "korea_herald", "data_pub": "2026-09-15T11:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um levantamento realizado pela cidade de Seul, Coreia do Sul, mostrou que 88,1% dos residentes na meia-idade cuidam de um parente ou de um filho, enquanto 49,9% cuidam de ambos simultaneamente. O índice de qualidade de vida dos adultos maduros em Seul foi desenvolvido pela prefeitura de Seul e pela Seoul50Plus Foundation.", "titulo_pt": "Quase 9 em 10 adultos maduros em seul cuidam de parente ou filho, e metade cuida de ambos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 163640, "titulo": "A Diagnosis for Social Conflict That Gets Lost Along the Way", "url": "https://www.theatlantic.com/books/2026/09/art-of-fighting-priya-parker-book-review/688598/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-15T11:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo livro sugere que argumentos não são sobre vencer, mas parecem se concentrar nisso de qualquer maneira.", "titulo_pt": "Uma diagnóstico para conflitos sociais que se perde ao longo do caminho", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 163753, "titulo": "Stark contrast emerges between victim and defendants at Paris trial over murder of Argentine rugby star", "url": "https://www.lemonde.fr/en/france/article/2026/09/15/stark-contrast-emerges-between-victim-and-defendants-at-paris-trial-over-murder-of-argentine-rugby-star_6757549_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-15T10:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A família e os amigos mais próximos de Federico Martin Aramburu testemunharam no tribunal parisiense, descrevendo-o como calmo e respeitoso. O contraste foi evidente com os réus da extrema-direita Loïk Le Priol e Romain Bouvier, que têm passado por problemas relacionados à violência no passado.", "titulo_pt": "Contraste evidente entre vítima e réus no julgamento do assassinato do jogador de rugby argentino", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 162511, "titulo": "As atletas contra-atacam a anúncio de Sydney Sweeney: 'Esta é a aparência das mulheres no esporte'", "url": "https://www.bbc.com/portuguese/articles/ck5ywq81qvqyo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-15T09:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Atletas de diversos países criticaram o anúncio de uma casa de apostas que estrela a atriz Sydney Sweeney. A corredora britânica Amy Hunt foi uma das que se manifestaram contra o anúncio.", "titulo_pt": "Atletas reagem contra anúncio de casa de apostas com atriz", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 162563, "titulo": "Baja la natalidad y cae la matrícula en los colegios privados: la nueva tendencia para evitar cierres", "url": "https://www.clarin.com/sociedad/baja-natalidad-cae-matricula-colegios-privados-nueva-tendencia-evitar-cierres_0_uKDFm30Hyl.html", "fonte_id": "clarin", "data_pub": "2026-09-15T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A diminuição da natalidade está resultando em uma menor matrícula em escolas privadas, levando a fusões entre instituições. Em Buenos Aires, foram notados dois casos recentes: a união entre o San Tarsicio e Misericordia e entre o Colegio Los Robles e a Escuela Argentina Modelo.", "titulo_pt": "Redução da natalidade e fusões em escolas privadas na argentina", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 162421, "titulo": "Cuidado integrado e olhar da família contribuem para a inclusão de pessoas com TEA", "url": "https://www.metropoles.com/conteudo-especial/cuidado-integrado-tea", "fonte_id": "metropoles", "data_pub": "2026-09-15T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas recomendam que o tratamento para pessoas com Transtorno do Espectro Autista deve ser personalizado. O cuidado integrado e a perspectiva familiar são considerados importantes para a inclusão dessas pessoas.", "titulo_pt": "Cuidado personalizado e olhar familiar contribuem para a inclusão de pessoas com TEA", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 162685, "titulo": "Australia’s Indigenous population estimated at 2.2m before ‘demographic catastrophe’ of colonisation", "url": "https://www.theguardian.com/australia-news/2026/sep/15/australia-indigenous-population-before-colonisation-underestimated-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-09-15T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que a população indígena australiana antes da colonização era significativamente maior, estimada em 2,2 milhões de pessoas, em vez das estimativas iniciais de 250 mil. Isso sugere que o impacto das doenças e dos massacres foi maior do que se pensava anteriormente.", "titulo_pt": "População indígena australiana antes da colonização era de 2,2 milhões, sugere nova pesquisa", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 162938, "titulo": "As cases rise, Japan moves to step up measures against human trafficking", "url": "https://www.japantimes.co.jp/news/2026/09/15/japan/human-trafficking-report/", "fonte_id": "japan_times", "data_pub": "2026-09-15T07:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Japão está intensificando as medidas contra o tráfico de pessoas, incluindo exploração laboral e sexual, em meio ao aumento no número de vítimas identificadas.", "titulo_pt": "Aumento nas vítimas levanta ações contra tráfico de pessoas no Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 162984, "titulo": "2 socially isolated brothers found dead in Hong Kong flat, no foul play suspected", "url": "https://www.scmp.com/news/hong-kong/society/article/3367552/2-socially-isolated-brothers-found-dead-hong-kong-flat-no-foul-play-suspected?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-15T06:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois irmãos de meia-idade foram encontrados mortos em seu apartamento em Hong Kong, de acordo com a polícia. Eles evitavam socialmente e eram mantidos financeiramente pelos pais. Não foram identificados indícios de circunstâncias suspeitas no momento.", "titulo_pt": "Dois irmãos socialmente isolados são encontrados mortos em apartamento em Hong Kong, sem suspeitas de crime", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 163378, "titulo": "Japão bate recorde e tem mais de 100 mil centenários pela primeira vez", "url": "https://www.cnnbrasil.com.br/internacional/japao-bate-recorde-e-tem-mais-de-100-mil-centenarios-pela-primeira-vez/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T16:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Japão estabeleceu um novo recorde ao ter mais de 100 mil centenários pela primeira vez, com a maioria sendo mulheres. O ministro destacou os números positivos dessa tendência.", "titulo_pt": "Japão bate recorde com mais de 100 mil centenários pela primeira vez", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 163613, "titulo": "Indonesian wildfires threaten leading orangutan research site in Borneo", "url": "https://www.theguardian.com/environment/2026/sep/15/indonesia-wildfires-threaten-leading-orangutan-research-site-borneo-cabang-panti", "fonte_id": "guardian_world", "data_pub": "2026-09-15T15:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais na Indonésia ameaçam um importante centro de pesquisa de orangotangos da Borneu, forçando os animais a fugirem das florestas. O fogo está a menos de 200 metros de uma estação de pesquisa, que é parte de um estudo de longo prazo sobre macacos selvagens.", "titulo_pt": "Incêndios ameaçam importante centro de pesquisa de orangotangos da borneu", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 163817, "titulo": "El Nino reaches super status: Where will it bring rain, drought and heat?", "url": "https://www.aljazeera.com/news/2026/9/15/el-nino-reaches-super-status-where-will-it-bring-rain-drought-and-heat?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-15T13:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meteorologistas afirmam que o padrão de aquecimento do Oceano Pacífico pode ser o mais forte da história. Isso significa que as regiões afetadas podem experimentar intensas mudanças climáticas, incluindo chuvas abundantes e secas severas, além de calor extremo.", "titulo_pt": "El niño atinge status superlativo: onde trará chuva, seca e calor?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 162424, "titulo": "Clima: Brasil tem dia de contrastes, com geada no Sul e calor no Norte", "url": "https://www.metropoles.com/brasil/clima-brasil-tem-dia-de-contrastes-com-geada-no-sul-e-calor-no-norte", "fonte_id": "metropoles", "data_pub": "2026-09-15T08:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil experimentou um dia com contrastes climáticos, com geada no Sul e calor no Norte. Uma área de baixa pressão e um fluxo de umidade favoreceram instabilidades em partes do Sul e do Sudeste.", "titulo_pt": "Clima: Brasil tem dia de contrastes, com geada no Sul e calor no Norte", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 162817, "titulo": "After summer of unprecedented heatwaves and drought, climate activists rally support ahead of French elections", "url": "https://www.lemonde.fr/en/environment/article/2026/09/15/after-summer-of-unprecedented-heatwaves-and-drought-climate-activists-rally-support-ahead-of-french-elections_6757544_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-15T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Organizações não-governamentais e sindicatos chamaram para uma manifestação na quinta-feira próximo ao Ministério da Economia, pedindo ação urgente climática. Manifestações em 269 cidades francesas estão programadas para 26 de setembro, com temas incluindo clima, vida, paz e justiça social.", "titulo_pt": "Após verão de ondas de calor e secas inéditas, ativistas climáticos buscam apoio nas eleições francesas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 162444, "titulo": "Chuvas atrasam moagem de cana e sustentam preços do etanol em SP", "url": "https://www.cnnbrasil.com.br/agro/chuvas-atrasam-moagem-de/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As chuvas interferiram no processo de moagem de cana-de-açúcar nas usinas, levando a um aumento de mais de 20% nos preços do etanol. O aumento também foi influenciado pela elevação dos preços do açúcar internacional.", "titulo_pt": "Chuvas atrasam moagem de cana e sustentam preços do etanol em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 162960, "titulo": "Wildfires Burn Thousands of Hectares, Exposing Albania’s Systemic Weaknesses", "url": "https://balkaninsight.com/2026/09/15/wildfires-burn-thousands-of-hectares-exposing-albanias-systemic-weaknesses/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-09-15T05:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este verão, incêndios florestais destruíram milhares de hectares na Albânia, revelando a incapacidade do estado de lidar com a situação de forma eficaz e coordenada. Os especialistas apontam que os riscos estão aumentando devido ao aquecimento global.", "titulo_pt": "Incêndios florestais destruem milhares de Hectares, expõem fraquezas sistêmicas da albânia", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 162994, "titulo": "Air quality across Singapore reaches unhealthy levels from Indonesian wildfires", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3367527/air-quality-across-singapore-reaches-unhealthy-levels-indonesian-wildfires?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-15T03:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A qualidade do ar em Singapura foi afetada por fumaça proveniente de incêndios florestais na Indonésia, levando a níveis de poluição considerados prejudiciais à saúde em todas as cinco regiões da cidade-estado. A situação é a mais grave desde setembro de 2019, conforme informado pelo Agência Nacional do Meio Ambiente.", "titulo_pt": "Qualidade do ar em singapura atinge níveis indesejáveis devido a incêndios na indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 163275, "titulo": "Terceira Guerra Mundial se torna maior risco global, aponta relatório d   const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;

      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>

  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));

  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {

function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
