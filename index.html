<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

const D = {"gerado_em": "30/10/2026 00:57", "stats": {"noticias_novas": 1335, "resumos_gerados": 247}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Brasil reelegeu Lula (PT) com 51,79% dos votos válidos no segundo turno, contra 48,21% de Flávio Bolsonaro (PL), conforme indicado pelo mapa interativo divulgado pela Folha. A vitória de Lula foi acompanhada por desafios políticos e econômicos. Senadores de partidos de esquerda estão planejando estratégias para contrabalançar a influência da bancada recorde do PL no Senado, composta principalmente por parlamentares de direita. A direita, por sua vez, rejeitou a proposta de trocar apoio a Alcolumbre por um indulto a Jair Bolsonaro. O governo Lula enfrenta um impasse sobre as medidas de ajuste fiscal, com o presidente demonstrando resistência em propor medidas mais robustas. A governadora do Distrito Federal, Celina Leão, está buscando criar uma agência de investimentos para atrair recursos para a capital, diante de um orçamento restrito e déficit financeiro. Além disso, a justiça determinou que a Meta, proprietária do Facebook, remova postagens que incentivam demissões por causa do voto nas plataformas em até 24 horas, em resposta a uma ação civil movida pelo MPT.", "mundo": "O presidente Luiz Inácio Lula da Silva (PT) mantém uma postura pragmática em suas relações internacionais, especialmente com os Estados Unidos e a Argentina, enquanto se prepara para encerrar seu terceiro mandato em 2026. O Brasil passará a presidência da COP30, conferência das Nações Unidas sobre Mudanças Climáticas, para a Turquia em novembro e dezembro. Em outro desenvolvimento, o Partido Comunista Chinês expulsou um número recorde de membros durante a quinta plenária, refletindo a intensificação das purgas sob o comando de Xi Jinping. Na Coreia do Sul, apesar de recentes desacordos diplomáticos, o país continuará a oferecer apoio à Ucrânia e espera um resultado concreto na transição do comando operacional durante as conversas entre chefes de defesa programadas para dezembro. Além disso, a inflação no Japão atingiu níveis superiores ao alvo do Banco do Japão, preocupando os lojistas de conveniência e afetando a economia.\n\nOs principais eventos geopolíticos da semana envolvem tensões na região do Oriente Médio e conflitos regionais. O Irã e os Estados Unidos mantêm uma tensão crescente, com o presidente americano, JD Vance, afirmando que Donald Trump não permitirá que o conflito se transforme em uma 'guerra de gerações'. O Irã também afirmou que quatro navios-pipa foram atingidos por minas no Estreito de Ormuz, enquanto Israel transferiu 10 aviões militares para bases israelenses como preparação para uma possível operação militar contra o Irã. Em outros desenvolvimentos, a Coreia do Norte realizou uma demonstração de armas, exibindo um lançador de foguetes de 600 milímetros. Na Ucrânia, um ataque com drone em Dnipro resultou em 14 mortos, enquanto em Chernihiv, dois adolescentes morreram em um ataque russo. No Oriente Médio, a coalizão afirmou ter interceptado dois mísseis disparados pelos hutis em direção à capital saudita, Riad. Além disso, a Itália pediu a liberação de cinco ativistas italianos detidos na Cisjordânia Ocidental, enquanto a Autoridade Islâmica Waqf alertou para uma redução do controle sobre o local sagrado Al-Aqsa devido a novas restrições impostas por Israel. A Coreia do Sul, Estados Unidos e Japão se encontraram para discutir assuntos relacionados à Coreia do Norte e cooperação trilateral.", "economia": "A economia global enfrenta diversos desafios e realizações. O Banco do Japão manteve as taxas de juros estáveis, apesar da inflação estar acima do objetivo. A Starbucks retomou ações de aquisição de ações, mesmo com incertezas no mercado chinês. No Brasil, a dívida pública federal atingiu um recorde de R$ 9,4 trilhões em setembro, impulsionada por gastos com juros. O preço da arroba de boi chegou a R$ 400 em algumas regiões de São Paulo, pressionando o bolso do consumidor. A Vale registrou um lucro líquido de R$ 6,4 bilhões no terceiro trimestre, uma queda de 56% em comparação com o mesmo período do ano anterior. A Petrobras anunciou a terceira descoberta de petróleo no poço Morpho, enquanto a Binance congelou US$ 2,54 bilhões em criptoativos após uma suposta violação de segurança. O Fundo Monetário Internacional recomendou que a Argentina destine os lucros da estabilização financeira à criação de empregos e ao investimento para estimular o crescimento econômico.", "tecnologia": "As preocupações com a inteligência artificial (IA) continuam a dominar o mercado e a indústria tecnológica. A Binance, uma das maiores exchanges de criptomoedas, congelou mais de 2,5 bilhões de ativos em meio a suspeitas de hack, o que pode ser um contraponto para os apoiadores das criptomoedas. A Samsung e o Canadá realizaram a quinta reunião conjunta do comitê de ciência, tecnologia e inovação, sinalizando um compromisso contínuo em colaboração tecnológica. A LG CNS, filial da LG, registrou um lucro operacional no terceiro trimestre crescendo 15%, impulsionado pelo crescimento dos negócios de IA e nuvem. No entanto, a Intel enfrentou uma queda de 22% nas ações devido a uma previsão de vendas de chips para PCs abaixo do esperado e a margens decrescentes. Ainda assim, a corrida pela liderança na IA continua, com a SpaceX informando que cerca de 34,5% de sua receita no último trimestre veio de um único cliente, identificado apenas como 'Cliente B', estimado em cerca de $3 bilhões por mês. Além disso, a NordVPN identificou 196 sites falsos do Roblox ativos em sete dias, com cerca de 105 mil visitas acumuladas, destacando a necessidade de vigilância em torno de plataformas populares de jogos para crianças.", "ciencia": "No início de outubro, a OpenAI anunciou centenas de resultados matemáticos que, segundo a empresa, poderiam expandir as fronteiras do conhecimento humano, surpreendendo a comunidade matemática. Paralelamente, a NASA detalhou um estudo sobre uma das meteorítas mais antigas do Planeta Vermelho já encontradas, o meteorito Teghaza 001, que data de mais de 4,1 bilhões de anos e foi recuperado no Deserto do Saara em 2022. Este meteorito, originário de Marte, revela aspectos antigos da história hidráulica do planeta vermelho. Além disso, a NASA também nomeou Troy Asher como diretor do Centro de Pesquisa Aeronáutica Armstrong, em Edwards, Califórnia, reforçando seu compromisso com a pesquisa espacial.", "cultura": "O Festival de Cinema Francês, em sua 17ª edição, celebra o cinema francês, exibindo 21 filmes em mais de 50 cidades até 11 de novembro, alcançando cerca de 2,5 milhões de espectadores. Este evento, considerado o principal dedicado à cinematografia francesa no Brasil, oferece uma visão sobre a cultura e o cinema francês. Em São Paulo, o Teatro Anchieta, localizado no Sesc Consolação, se reafirma como um importante centro cultural. Nele, Antunes Filho criou o CPT, uma escola de teatro que se tornou um marco de inovação cênica.", "sociedade": "Um acidente envolvendo trens de alta velocidade na Espanha resultou em pelo menos 68 mortos, incluindo uma brasileira, e dezenas de feridos. O Itamaraty confirmou a situação e informou que a cidadã brasileira já está sendo assistida. Em outro evento, um ex-funcionário de creche em Sydney foi acusado de mais de 200 abusos cometidos entre 2014 e 2017. O desemprego na Argentina aumentou para 9,8%, enquanto camioneiros de San Antonio iniciaram o primeiro paro sob o governo de Kast. Em São Paulo, o interior registrou uma queda nos índices de homicídios e latrocínios até setembro, atribuída ao uso do sistema SP Vida, que visa direcionar ações policiais.", "meio_ambiente": "As mudanças climáticas e suas consequências globais continuam sendo um tema central nas discussões ambientais. Um relatório divulgado durante a COP17 da Biodiversidade indica que o Brasil perdeu 45% de sua vegetação e fragmentou florestas nos últimos 38 anos. Durante este período, houve uma redução no tamanho médio das áreas conservadas e um avanço no desmembramento do território devido a expansão de lavouras e urbanização. Este cenário reflete a urgência de ações para combater a perda de biodiversidade e a degradação ambiental. Em outro front, a Indonésia enfrenta a pior temporada de incêndios na história, com a nebulosidade tóxica se espalhando para cidades vizinhas. Na Papua Nova Guiné, a crise climática persiste, especialmente devido a um histórico fenômeno El Niño que está causando uma severa escassez de alimentos, água e energia elétrica, afetando até 8 milhões de pessoas. A China, por sua vez, está sendo observada para saber suas prioridades na COP31, uma conferência climática que está prestes a ocorrer na Turquia, com foco em suas exportações de tecnologias limpas que podem evitar a emissão de CO2 equivalente às emissões anuais do Brasil.", "direitos_humanos": "A lei antirrepresão transnacional no Taiwan está sendo debatida, com relatos de supostos casos de forçamento a se desculpar. Em outro desenvolvimento, o cineasta iraniano Jafar Panahi foi condenado a cinco anos de prisão e proibido de viajar e usar redes sociais por dois anos. O Ministério da Unificação de Seul está em conversas com entidades relevantes sobre a possibilidade de cosancionar uma resolução da ONU sobre os direitos humanos na Coreia do Norte. Um relatório da Amnesty Internacional acusa policiais e soldados de trabalharem como guardas em centros de detenção ilegais na Indonésia, usando choques elétricos e espancamentos para manter as pessoas presas. Um adolescente com ligações a trios foi condenado a oito anos de prisão por atacar uma turista de Singapura com líquido corrosivo em Hong Kong, em junho de 2025. Desde o desmantelamento da 'jungle' de Calais em 2016, pequenos acampamentos improvisados surgiram ao longo da costa norte da França, com condições de vida insalubres, e organizações de ajuda relataram essas condições. Finalmente, a Comissão Anticorrupção e de Direitos Civis pediu clemência para os ex-funcionários da Coupang acusados no caso da 'lista negra', enquanto a Albânia introduziu multas de mais de 6.000 euros para demonstrantes que participam de protestos violentos, mesmo que não cometam atos violentos pessoais."}, "resumo_do_dia": {"politica_nacional": [{"id": 233272, "titulo": "Senadores de partidos de esquerda traçam estratégias para fazer frente à bancada recorde do PL", "url": "https://g1.globo.com/politica/noticia/2026/10/30/senado-esquerda-bancada-recorde-do-pl.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-30T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Senadores de partidos de esquerda estão planejando estratégias para contrabalançar a influência da bancada recorde do PL no Senado, que será composta principalmente por parlamentares de direito, assumindo em 2027. Essa bancada vai ocupar mais de um terço da Casa, o que representa um desafio significativo para a articulação política do governo Lula.", "titulo_pt": "Senadores de esquerda traçam estratégias para enfrentar bancada recorde do PL no senado", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 233273, "titulo": "Carta de Flávio Bolsonaro e fuga do Brasil geram críticas até entre aliados e movimentam direita para 2030", "url": "https://g1.globo.com/politica/noticia/2026/10/30/repercussao-carta-de-flavio-bolsonaro-e-fuga-do-brasil.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-30T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, senador pelo PL-RJ, saiu do Brasil após a derrota na eleição presidencial e publicou uma carta onde se autoproclamou presidente eleito, gerando críticas entre aliados e movimentando a direita para as eleições de 2030.", "titulo_pt": "Carta de Flávio Bolsonaro e fuga do Brasil geram críticas entre aliados e movimentam direita para 2030", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 233274, "titulo": "Entre veteranos e novos nomes, Nordeste marca presença no entorno de Lula; veja aliados", "url": "https://g1.globo.com/politica/noticia/2026/10/30/entre-veteranos-e-novos-nomes-nordeste-marca-presenca-no-entorno-de-lula-veja-aliados.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-30T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula contou com a presença de nove lideranças nordestinas de diferentes gerações durante seu discurso de vitória, incluindo aliados históricos, novos nomes da campanha e representantes da nova geração da esquerda. O governador reeleito do Piauí, Rafael Fonteles, foi um dos principais destaques.", "titulo_pt": "Entre veteranos e novos nomes, Nordeste marca presença no entorno de Lula; veja aliados", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 233466, "titulo": "Justiça manda Meta tirar do ar postagens de assédio eleitoral em até 24h", "url": "https://www.metropoles.com/distrito-federal/justica-manda-meta-tirar-do-ar-postagens-de-assedio-eleitoral-em-ate-24h", "fonte_id": "metropoles", "data_pub": "2026-10-30T02:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A justiça determinou que a Meta, proprietária do Facebook, remova postagens que incentivam demissões por causa do voto nas plataformas em até 24 horas. A decisão atendeu a uma ação civil movida pelo MPT.", "titulo_pt": "Justiça manda Meta remover postagens de assédio eleitoral em até 24h", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 233198, "titulo": "Alíquota da reforma tributária mostra de forma crua uma carga que o Brasil não conseguia ver", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/aliquota-da-reforma-tributaria-mostra-de-forma-crua-uma-carga-que-o-brasil-nao-conseguia-ver.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após as eleições presidenciais, ficou conhecida a alíquota de 11,3% da CBS (Contribuição sobre Bens e Serviços), sugerida pelo TCU. Essa alíquota revela a carga tributária proposta para a reforma tributária.", "titulo_pt": "Alíquota da reforma tributária mostra de forma crua a carga tributária do Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 233199, "titulo": "Após boicotes, apoiadores de Lula divulgam listas para prestigiar restaurantes associados à esquerda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/apos-boicotes-apoiadores-de-lula-divulgam-listas-para-prestigiar-restaurantes-associados-a-esquerda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após apoiadores de Flávio Bolsonaro divulgar listas de estabelecimentos supostamente ligados à esquerda para incentivar boicotes, usuários das redes sociais passaram a compartilhar nomes de bares, restaurantes e cafés para estimular o movimento contrário, em apoio aos negócios associados à esquerda.", "titulo_pt": "Após boicotes, apoiadores de Lula divulgam listas para prestigiar restaurantes associados à esquerda", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 233201, "titulo": "Tamanho do ajuste nas contas públicas gera impasse no governo Lula, e equipe discute medidas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/tamanho-do-ajuste-nas-contas-publicas-gera-impasse-no-governo-lula-e-equipe-discute-medidas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula enfrenta um impasse sobre as medidas de ajuste fiscal após a reeleição, com o presidente demonstrando resistência em propor medidas mais robustas que poderiam ser consideradas estelionato eleitoral. A equipe do governo discute essas medidas, mas há divergências sobre o tamanho do ajuste necessário.", "titulo_pt": "Tamanho do ajuste nas contas públicas gera impasse no governo Lula", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 233223, "titulo": "Direita rejeita trocar apoio a Alcolumbre por plano de indulto a Bolsonaro e prioriza redução de penas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/direita-rejeita-trocar-apoio-a-alcolumbre-por-plano-de-indulto-a-bolsonaro-e-prioriza-reducao-de-penas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A direita rejeitou a proposta de Davi Alcolumbre de trocar o apoio para sua reeleição pelo Senado por um indulto ou anistia para Jair Bolsonaro. A maioria dos senadores prefere que Alcolumbre não seja reconduzido ao comando da Casa.", "titulo_pt": "Direita rejeita trocar apoio a Alcolumbre por indulto a Bolsonaro e prioriza sua derrota", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 233224, "titulo": "Com rombo herdado, governadora do DF articula criação de agência para atrair investimentos à capital", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/com-rombo-herdado-governadora-do-df-articula-criacao-de-agencia-para-atrair-investimentos-a-capital.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora do Distrito Federal, Celina Leão, está buscando criar uma agência de investimentos para atraír recursos para a capital, diante de um orçamento restrito e déficit financeiro.", "titulo_pt": "Com rombo nos cofres, governadora do DF planeja agência de investimentos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 233225, "titulo": "Veja como votaram todos os bairros do Brasil em mapa interativo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/veja-como-votaram-todos-os-bairros-do-brasil-em-mapa-interativo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil reelegeu Lula (PT) com 51,79% dos votos válidos no segundo turno contra 48,21% de Flávio Bolsonaro (PL). A abstenção foi de 30,4 milhões, o menor número em 20 anos.", "titulo_pt": "Veja como votaram todos os bairros do Brasil em mapa interativo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 233226, "titulo": "Alcolumbre viu excesso em ordem para apreensão de passaporte de Flávio e procurou STF para reclamar", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/alcolumbre-viu-excesso-em-ordem-para-apreensao-de-passaporte-de-flavio-e-procurou-stf-para-reclamar.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-30T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Davi Alcolumbre, reclamou com aliados sobre a decisão do STF que cancelou o passaporte de Flávio Bolsonaro e procurou Gilmar Mendes para tentar uma solução.", "titulo_pt": "Alcolumbre reclamou sobre cancelamento do passaporte de Flávio e buscou STF para resolver", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 233404, "titulo": "PF apreende joias de R$ 900 mil em operação que mira Márcio Poncio no Rio", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/rj/pf-apreende-joias-de-r-900-mil-em-operacao-que-mira-marcio-poncio-no-rio/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-30T01:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal apreendeu joias avaliadas em R$ 900 mil e outros itens durante uma operação que alvo do ex-secretário Márcio Poncio no Rio de Janeiro. Agentes também apreenderam cheques de alto valor, celulares, computadores e documentos.", "titulo_pt": "PF apreende joias e outros itens em operação contra Márcio Poncio no Rio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 233489, "titulo": "Fachin fica com caso Master e devolve investigação do INSS para André Mendonça", "url": "https://www.jota.info/stf/do-supremo/fachin-fica-com-caso-master-e-devolve-investigacao-do-inss-para-andre-mendonca", "fonte_id": "jota", "data_pub": "2026-10-30T01:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Fachin ficou com o caso Master e devolveu a investigação do INSS para André Mendonça. A decisão será levada a plenário.", "titulo_pt": "Fachin fica com caso Master e devolve investigação do INSS para André Mendonça", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 233334, "titulo": "O campo político que está em disputa após fuga de Flávio Bolsonaro", "url": "https://veja.abril.com.br/politica/o-campo-politico-que-esta-em-disputa-apos-fuga-de-flavio-bolsonaro/", "fonte_id": "veja", "data_pub": "2026-10-30T01:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Centrão se tornou uma figura importante nas articulações políticas para o ano eleitoral de 2030. Apó classe": "B"}, {"id": 234231, "titulo": "(LEAD) Top diplomats of S. Korea, U.S., Japan to discuss N. Korea, trilateral cooperation", "url": "https://en.yna.co.kr/view/AEN20261030001951315", "fonte_id": "yonhap_news", "data_pub": "2026-10-30T02:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário de Estado dos EUA e o ministro das Relações Exteriores da Coreia do Sul se encontrarão com o ministro das Relações Exteriores do Japão para discutir assuntos relacionados à Coreia do Norte e cooperação trilateral.", "titulo_pt": "Secretários de estado de S. Coreia, EUA e Japão irão discutir Coreia do norte e cooperação trilateral", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 234061, "titulo": "Report: US sends 10 military planes to Israel, amid plans for a possible military operation against Iran", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/report-us-sends-10-military-planes-israel-amid-plans-possible-military", "fonte_id": "middle_east_eye", "data_pub": "2026-10-30T02:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Estados Unidos transferiu 10 aviões militares para bases israelenses como preparação para uma possível operação militar contra o Irã. De acordo com a emissora pública israelense KAN, esses aviões pousaram nas bases aéreas de Ovda e Nevatim, no sul da região de Negev. Várias outras aeronaves foram enviadas a outras áreas da região, incluindo Jordânia, Arábia Saudita e Catar.", "titulo_pt": "Relatório: EUA enviam 10 aviões militares para Israel, em meio a planos para uma possível operação militar contra o Irã", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 234233, "titulo": "(LEAD) N. Korea showcases 'Sniper' rocket launcher in weapons demonstration", "url": "https://en.yna.co.kr/view/AEN20261030000651315", "fonte_id": "yonhap_news", "data_pub": "2026-10-30T02:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "No dia 30 de outubro, a Coreia do Norte realizou uma demonstração de armas e exibiu um lançador de foguetes de 600 milímetros denominado 'Sniper'.", "titulo_pt": "Coreia do norte exibe lançador de foguetes 'Sniper' em demonstração de armas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 234033, "titulo": "Japan’s beleaguered shoppers are a worry for convenience stores and the economy", "url": "https://www.japantimes.co.jp/business/2026/10/30/companies/japan-shopping-habits-inflation/", "fonte_id": "japan_times", "data_pub": "2026-10-30T02:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inflação subjacente aumentou em setembro no ritmo mais rápido em três anos, superando o objetivo de 2% do Banco do Japão. Isso preocupa os lojistas de conveniência e afeta a economia.", "titulo_pt": "Compradores japoneses em dificuldades preocupam lojas de conveniência e economia", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 234034, "titulo": "Tokyo inflation exceeds BOJ’s 2% target before rate decision", "url": "https://www.japantimes.co.jp/business/2026/10/30/economy/tokyo-cpi-october/", "fonte_id": "japan_times", "data_pub": "2026-10-30T02:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inflação no total em Tóquio atingiu 2,8%, enquanto a inflação subjacente, excluindo alimentos frescos e energia, registrou 2,6%. Esses números superam o alvo de 2% do Banco do Japão antes da decisão sobre a taxa de juros.", "titulo_pt": "Inflação em tóquio ultrapassa alvo do banco do Japão antes da decisão de taxa de juros", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 234234, "titulo": "Lee's approval rating falls back to 39 pct: poll", "url": "https://en.yna.co.kr/view/AEN20261030004200315", "fonte_id": "yonhap_news", "data_pub": "2026-10-30T02:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A aprovação do presidente Lee Jae Myung caiu para 39%. 10-30T01:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 77ª Vara do Trabalho de São Paulo concedeu uma liminar que determina à Meta, proprietária do Instagram, a remoção de 14 publicações que incentivam a demissão de funcionários que votaram no candidato Lula. O prazo para a remoção é de 24 horas e a medida é válida nacionalmente.", "titulo_pt": "Justiça do Trabalho determina remoção de posts do instagram que incentivam demissão de quem votou em Lula", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 233203, "titulo": "Binance congela US$ 2,54 bilhões após suspeita de ataque hacker", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/binance-congela-us-254-bilhoes-apos-suspeita-de-ataque-hacker.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-30T01:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Binance, maior corretora de criptomoedas do mundo, congelou US$ 2,54 bilhões em criptoativos em investigação de uma possível violação de segurança. As emissoras de stablecoins Circle e Tether também congelaram ativos relacionados.", "titulo_pt": "Binance congela US$ 2,54 bilhões após suspeita de ataque hacker", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 233994, "titulo": "Has Australia’s push for lower house prices gone too far?", "url": "https://www.ft.com/content/5e37d086-5ecf-45a2-96e1-278a0f5a86c2?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-30T00:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Canberra pretendia moderar um dos mercados imobiliários mais quentes do mundo.", "titulo_pt": "A tentativa de canbera em reduzir os preços imobiliários na austrália foi demais?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 233205, "titulo": "Lucro da Multiplan dispara mais de 70% no 3º tri, alcançando R$ 383 milhões", "url": "https://redir
