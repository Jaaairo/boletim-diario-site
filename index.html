<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

</div>

<script>
const D = {"gerado_em": "18/09/2026 07:35", "stats": {"noticias_novas": 1530, "resumos_gerados": 252}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O presidente Luiz Inácio Lula da Silva anunciou um reajuste de 15% no Bolsa Família, elevando o benefício para R$ 691 por família. Este aumento foi considerado uma estratégia importante para o cenário eleitoral, anunciado 17 dias antes do primeiro turno das eleições. O aumento faz parte de uma série de medidas benéficas típicas em anos eleitorais, conforme observado por analistas. Flávio Bolsonaro criticou a medida, afirmando que o reajuste foi tomado em um 'ato de desespero'. A proposta que estabelece um código de conduta para ministros do STF, incluindo Lula, está em análise no Senado Federal há quatro meses. Além disso, a crise judicial no STF, com ministros se posicionando individualmente, está afetando a reputação institucional. O ministro André Mendonça extinguiu uma ação judicial apresentada por Zé Trovão contra o aumento no Bolsa Família, enquanto o governo considera que a medida pode ser contestada no Tribunal Superior Eleitoral (TSE).", "mundo": "A aliança entre os Estados Unidos e Coreia do Sul foi destacada como um elemento crucial para a paz na Península Coreana, segundo a embaixadora dos EUA na Coreia do Sul, Michelle Steel. No entanto, o governo sul-coreano manteve as cotações máximas de combustíveis em meio às tensões no Oriente Médio. A Coreia do Sul também anunciou a reabertura de centros de detenção para pessoas que excederam o visto de trabalho no Brasil. A Indonésia recebeu sua primeira porta-aviões. A Coreia do Norte acusou os Estados Unidos de aumentar as tensões na Península Coreana através de exercícios militares multilaterais. Por outro lado, a Venezuela se aproxima de um acordo para utilizar um reservatório de ouro contestado, com valor estimado em US$ 4 bilhões. O Irã ativou rotas terrestres para contornar o bloqueio dos EUA. Sob a pressão de Trump, a OTAN está impulsionando a diversificação das dependências de armas, tecnologia e empresas de defesa americanas. O presidente sul-coreano, Yoon Suk-yeol, emitiu uma série de desculpas em um momento crítico. O déficit francês deve aumentar para 5,4% do PIB em 2026, distante do alvo de 5% estabelecido para 2027. Além disso, a Irlanda vai boycottar o Eurovision pela segunda vez consecutiva em 2027, em protesto contra a 'inaceitável' continuidade dos assassinatos no Gaza.\n\nO Irã e os Estados Unidos enfrentam tensões geopolíticas significativas. O Irã atacou centros de dados da Amazon, causando danos permanentes, enquanto os EUA retiraram a Venezuela da lista de países produtores e tráfegos de drogas. Em outro front geopolítico, a Arábia Saudita enfrenta escassez de interceptores de mísseis e busca ajuda de aliados para fortalecer sua defesa aérea. Israel intensifica sua pressão sobre a Cisjordânia, com relatórios indicando a destruição das condições de vida dos palestinos. O Conselho de Segurança da ONU, sob a liderança de Guterres, enfrenta divisões que impedem ação sobre crises globais, enquanto Kosovo condena a sentença de guerra contra o ex-presidente Hashim Thaçi, gerando protestos em Pristina. Além disso, a Arábia Saudita e os EUA buscam alianças para combater os hutitas no Iêmen, enquanto a Coreia do Norte continua a ser um foco de tensões internacionais, com Trump e Xi esperando poucos avanços na desnuclearização durante a próxima cúpula.", "economia": "A economia brasileira teve uma retração de 0,4% entre junho e julho, conforme estimativa do Instituto Brasileiro de Economia da Fundação Getulio Vargas. Este foi o segundo mês consecutivo com variação negativa, indicando um cenário econômico desafiador. No exterior, o Banco do Japão aumentou a taxa básica de juros para 1,25%, o nível mais alto em 31 anos, em resposta à inflação global. Esta decisão foi seguida por outros bancos centrais, incluindo o Banco Central dos Estados Unidos e a União Europeia, que também adotaram medidas de aperto monetário. No Brasil, o setor produtivo do Distrito Federal pediu cooperação para salvar o Banco do Brasil de Brasília (BRB) da crise relacionada ao escândalo do Banco Master. Por outro lado, o Itaú Unibanco alugou escritórios de alto padrão no complexo Esther Towers, em São Paulo, por R$ 1,17 bilhão. A startup CallMed começou a operar nos Estados Unidos, atingindo um público de 1,9 milhões de brasileiros, enquanto o mercado de jatinhos executivos está em crescimento, com um aumento no interesse em produtos como o compartilhamento de aeronaves.", "tecnologia": "A inteligência artificial (IA) continua sendo um tema central na tecnologia, com diversos desenvolvimentos e debates em andamento. A SK hynix Ventures, da Coreia do Sul, expandiu suas atividades de investimento em tecnologias de IA e infraestrutura avançada em Silicon Valley, refletindo a crescente importância desse setor. No entanto, a utilização de IA em drones para fins militares, como o Saker Scout, que identifica equipamentos militares, levanta preocupações éticas sobre o uso da tecnologia em conflitos. Líderes de empresas de IA, como a Anthropic e a OpenAI, têm alertado sobre os riscos associados à IA, sugerindo a necessidade de retardar o desenvolvimento da tecnologia para evitar potenciais perigos. Além disso, a OpenAI enfrentou brechas de segurança após pesquisadores usarem modelos de IA da Anthropic, o que reforça a importância de medidas de segurança mais robustas na indústria. Ainda assim, a possibilidade de IA causar uma pandemia é considerada baixa pelos cientistas, embora a tecnologia continue a ser vista com cautela por líderes do setor.", "ciencia": "Cientistas criaram camundongos com neurônios humanos para estudar distúrbios cerebrais, representando um avanço significativo na pesquisa. Em outro desenvolvimento, a China planeja se tornar uma potência global em biomedicina até 2030, com o objetivo de dominar tecnologias de ponta e deter pelo menos 25% do mercado de medicamentos inovadores. A descoberta de uma nova espécie de felino na Bolívia, liderada por um pesquisador brasileiro, é a primeira nova espécie de felino descrita em mais de um século. Além disso, a NASA anunciou o lançamento do StarBurst, um satélite projetado para investigar a fusão de neutrônicos e origens de buracos de raios gama curtos, que será lançado a partir do Complexo de Lançamento 40 na Estação Espacial da Força Aérea de Cape Canaveral, na Flórida.", "cultura": "A cultura brasileira e internacional foi abordada em vários aspectos nos últimos dias. A novela 'Avenida Brasil 2', que marcará a volta de Nívea Maria para a Globo, é um dos destaques, sendo a sequência bem-sucedida de uma produção de 2012. Em outro projeto, a cantora Leci Brandão, aos 82 anos, foi indicada ao Grammy Latino, reafirmando sua importância na música brasileira. O filme 'Antártida', que aborda violência sexual e estreia nos cinemas, também chama a atenção, com um elenco forte e temas relevantes. Além disso, a turnê de Ed Sheeran enfrenta críticas por questões relacionadas à Palestina e antissemitismo, levando vários artistas a se recusarem a participar. Em outro contexto, uma exposição recente celebra o trabalho do renomado fotógrafo Gordon Parks, destacando suas fotografias mais poderosas e sua influência em múltiplas disciplinas artísticas.", "sociedade": "Em uma escola nas Filipinas, um ataque a tiros deixou três estudantes mortos após o suspeito, um jovem de 16 anos, ferir outros oito alunos e se suicidar. Em outro incidente, na Nigéria, quase 50 pessoas morreram após ingerirem uma bebida contendo metanol, com 100 outras sendo hospitalizadas. No Brasil, a geolocalização e a busca domiciliar nas favelas são discutidas em relação à sua eficácia nas investigações criminais, bem como a necessidade de focar mais na prevenção do assédio institucional na era digital. Em Fiji, o governo declarou uma emergência nacional de HIV em resposta a uma escalada de casos, atribuindo a utilização crescente de metanfetamina a uma 'epidemia' no país. Por fim, na Nigéria, o período de licença remunerada para casamentos será estendido para os trabalhadores, visando fornecer mais tempo de descanso e celebração após o casamento.", "meio_ambiente": "As chuvas intensas, ventos fortes e granizo voltam a atingir o Sul do Brasil, afetando principalmente o Sul, Sudeste e partes do Centro-Oeste. Em outros países, fortes chuvas no norte da China deixaram três mortos e danificaram mais de 16.000 casas. Estudos indicam que o número de dias extremamente quentes deve aumentar significativamente até o final do século. Além disso, grupos estão incentivando a TSMC, uma das principais empresas de fabricação de chips do mundo, a aumentar o uso de energia verde nas suas fábricas, demonstrando a importância do meio ambiente na indústria tecnológica.", "direitos_humanos": "Uma missão da ONU apontou crimes de guerra relacionados a ataques dos Estados Unidos a uma escola infantil no Afeganistão, resultando na morte de 178 pessoas, a maioria crianças. Em contraste, a Turquia intensificou a repressão aos grupos LGBTQ+, realizando detenções em massa e imporindo restrições na internet. Em outro caso, a jornalista Sophia Huang Xueqin, ativista do movimento #MeToo na China, está prestes a ser libertada após um período de prisão, com amigos e grupos de direitos humanos expressando preocupação com sua situação após o cumprimento da pena. Além disso, a UNICEF, FAO e WFP pedem ação urgente para evitar o agravamento da malnutrição aguda entre crianças em Haiti, com as áreas de Cité Soleil e Cabaret previstas para enfrentar condições críticas entre dezembro de 2026 e maio de 2027."}, "resumo_do_dia": {"politica_nacional": [{"id": 167760, "titulo": "Flávio Bolsonaro diz que Lula já ‘virou um Biden’: ‘Não fala mais lé com cré’", "url": "https://www.infomoney.com.br/politica/flavio-bolsonaro-diz-que-lula-ja-virou-um-biden-nao-fala-mais-le-com-cre/", "fonte_id": "infomoney", "data_pub": "2026-09-18T09:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro comparou Lula a Joe Biden, sugerindo que o petista evitou campanha para reeleição devido a críticas sobre sua idade. O comentário foi feito em uma postagem no InfoMoney.", "titulo_pt": "Flávio Bolsonaro compara Lula a Biden: 'não fala mais lé com cré'", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 167542, "titulo": "Proposta que prevê código de conduta aos ministros do STF está parada no Senado há quatro meses", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/proposta-que-preve-codigo-de-conduta-aos-ministros-do-stf-esta-parada-no-senado-ha-quatro-meses.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-18T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma Proposta de Emenda à Constituição que estabelece um código de conduta para agentes públicos, incluindo ministros do STF, está em análise no Senado Federal há quatro meses.", "titulo_pt": "Proposta de código de conduta para ministros do STF está parada no Senado há quatro meses", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 167708, "titulo": "Lula faz agenda de campanha em reduto do bolsonarismo", "url": "https://veja.abril.com.br/politica/lula-faz-agenda-de-campanha-em-reduto-do-bolsonarismo/", "fonte_id": "veja", "data_pub": "2026-09-18T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula realizará um ato público no próximo sábado, 19, em Florianópolis, ao lado de seus apoiadores.", "titulo_pt": "Lula realiza agenda de campanha em reduto do bolsonarismo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 167996, "titulo": "A crise do STF pela lente de quem cuida de reputações", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-crise-do-stf-pela-lente-de-quem-cuida-de-reputacoes", "fonte_id": "jota", "data_pub": "2026-09-18T08:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto analisa como a divisão de opiniões entre os ministros do STF afeta a reputação institucional. Quando cada ministro se posiciona individualmente, a imagem geral da instituição pode sofrer prejuízos.", "titulo_pt": "A crise do STF vista pela gestão de reputações", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 167997, "titulo": "Ultraprocessados: uma política regulatória para o Brasil", "url": "https://www.jota.info/opiniao-e-analise/artigos/ultraprocessados-uma-politica-regulatoria-para-o-brasil", "fonte_id": "jota", "data_pub": "2026-09-18T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil possui diversos instrumentos dispersos para regular a produção e comercialização de alimentos ultraprocessados, incluindo rotulagem e tributação.", "titulo_pt": "Ultraprocessados: uma política regulatória para o Brasil", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 167784, "titulo": "Lula está usando reajuste do Bolsa Família como arma eleitoral?", "url": "https://www.bbc.com/portuguese/articles/ck4gle0xwlg3o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-18T08:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo afirma que o aumento de 15% no Bolsa Família é apenas um reajuste pela inflação após anos de congelamento dos benefícios. Um cientista político considera a medida uma iniciativa econômica com possível impacto eleitoral.", "titulo_pt": "Lula está usando reajuste do Bolsa Família como arma eleitoral?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 167730, "titulo": "Ala do Planalto quer ministros na linha de frente das críticas a Moraes", "url": "https://www.metropoles.com/colunas/igor-gadelha/ala-do-planalto-quer-ministros-na-linha-de-frente-das-criticas-a-moraes", "fonte_id": "metropoles", "data_pub": "2026-09-18T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O grupo do Palácio do Planalto pressiona dois ministros para que eles se posicionem mais firme contra o ministro do STF, Alexandre Moraes. O objetivo é aliviar o presidente Lula da pressão decorrente da crise judicial.", "titulo_pt": "Ala do Planalto quer ministros na linha de frente contra Moraes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 167732, "titulo": "Lula reajusta Bolsa Família com aceno a grupo onde houve queda de apoio", "url": "https://www.metropoles.com/brasil/lula-reajusta-bolsa-familia-com-aceno-a-grupo-onde-houve-queda-de-apoio", "fonte_id": "metropoles", "data_pub": "2026-09-18T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula anunciou um reajuste para o Bolsa Família às vésperas do primeiro turno das eleições. O aumento não estava previsto no Orçamento de 2027.", "titulo_pt": "Lula anuncia reajuste Bolsa Família com antecedência para eleições", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 167735, "titulo": "Veja a agenda dos candidatos ao governo de SP nesta sexta (18/9)", "url": "https://www.metropoles.com/sao-paulo/veja-a-agenda-dos-candidatos-ao-governo-de-sp-nesta-sexta-18-9", "fonte_id": "metropoles", "data_pub": "2026-09-18T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Haddad realiza um comício com a presença de Lula em Guarulhos. Tarcísio tem quatro agendas na capital e na região metropolitana de São Paulo.", "titulo_pt": "Confira a agenda dos candidatos ao governo de SP nesta sexta-feira (18/9)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 167543, "titulo": "Hackers usam sites de Cury e do PT para alavancar bets e conteúdo sobre prostituição", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/hackers-usam-sites-de-cury-e-do-pt-para-alavancar-bets-e-conteudo-sobre-prostituicao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-18T07:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Hackers utilizaram o site do candidato Augusto Cury e o portal do PT na Bahia para publicar links de apostas e conteúdo sobre prostituição, com o objetivo de aumentar a visibilidade dessas páginas em motores de busca.", "titulo_pt": "Hackers usam sites de Cury e do PT para alavancar bets e conteúdo sobre prostituição", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 167486, "titulo": "Governo discutiu três cenários para o Bolsa Família e optou por reajuste mais amplo às vésperas da eleição", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/governo-discutiu-tres-cenarios-para-o-bolsa-familia-e-optou-por-reajuste-mais-amplo-as-vesperas-da-eleicao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo discutiu três cenários para o reajuste do Bolsa Família, mas optou por uma correção linear, que beneficia mais pessoas antes das eleições. Esse reajuste é mais custoso, mas considerado menos eficiente pelos técnicos.", "titulo_pt": "Governo escolheu reajuste linear para Bolsa Família antes das eleições", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 167789, "titulo": "Lula anuncia reajuste de 15% no Bolsa Família, às vésperas da eleição", "url": "https://www.bbc.com/portuguese/articles/c62kw8qqy0d8o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-18T03:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo anunciou um reajuste de 15% no Bolsa Família, que é considerado apenas um ajuste para acompanhar a inflação após anos de congelamento dos benefícios.", "titulo_pt": "Lula anuncia reajuste de 15% no Bolsa Família, às vésperas da eleição", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 167491, "titulo": "Pacote de Lula em ano eleitoral já mobiliza quase R$ 200 bilhões em bondades", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/pacote-de-lula-em-ano-eleitoral-ja-mobiliza-quase-r-200-bilhoes-em-bondades.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O pacote de 'bondades' do presidente Luiz Inácio Lula da Silva (PT) para o ano eleitoral inclui reajustes no Bolsa Família e medidas para conter os preços dos combustíveis, totalizando quase R$ 200 bilhões em recursos mobilizados.", "titulo_pt": "Pacote de Lula em ano eleitoral mobiliza quase R$ 200 bilhões em bondades", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 167492, "titulo": "Eleição ainda depende da loteria das facadas, do poder de vazar podres", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/viniciustorres/2026/09/eleicao-ainda-depende-da-loteria-das-facadas-do-poder-de-vazar-podres.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T00:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva aumentou em 15% o valor do Bolsa Família. A medida é considerada eleitoralmente estratégica, mesmo para quem a apoia, pois beneficia famílias com renda baixa, permitindo a compra de alimentos básicos.", "titulo_pt": "Eleição ainda depende da loteria das facadas, do poder de vazar podres", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 168003, "titulo": "Novo aciona STF para que Moraes seja impedido de votar no caso Master", "url": "https://www.jota.info/stf/do-supremo/novo-aciona-stf-para-que-moraes-seja-impedido-de-votar-no-caso-master", "fonte_id": "jota", "data_pub": "2026-09-17T23:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido acionou o STF pedindo que Moraes seja impedido de votar no caso Master. Além disso, foi solicitado que o voto de Moraes não seja contabilizado na questão de ordem levantada pelo ministro Gilmar Mendes.", "titulo_pt": "Novo partidário ação no STF pede que Moraes seja impedido de votar no caso Master", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 167496, "titulo": "Flávio Bolsonaro diz que Lula aumenta Bolsa Família por desespero e quer comprar voto dos pobres", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/flavio-bolsonaro-diz-que-governo-lula-aumenta-bolsa-familia-por-desespero.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-17T22:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro, candidato ao Presidency do PL, criticou o governo Lula por aumentar o Bolsa Família em 15,04%, afirmando que a medida foi tomada em um 'ato de desespero'.", "titulo_pt": "Flávio Bolsonaro critica aumento do Bolsa Família de Lula como ato de desespero", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 167644, "titulo": "EUA preparam envio de drones à América do Sul para operações militares", "url": "https://www.cnnbrasil.com.br/internacional/eua-preparam-envio-de-drones-a-america-do-sul-para-operacoes-militares/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-18T09:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os Estados Unidos planejam enviar drones à América do Sul para operações militares. Essa mudança faz parte de uma série de envios de equipamentos militares recentes à região, em consonância com planos de operações 'antidrogas e antiterrorismo'.", "titulo_pt": "EUA preparam envio de drones à América do Sul para operações militares", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 168237, "titulo": "As UN peacekeepers in Lebanon pack up, fears grow that Israel could 'do anything, without witnesses'", "url": "https://www.lemonde.fr/en/international/article/2026/09/18/as-un-peacekeepers-in-lebanon-pack-up-fears-grow-that-israel-could-do-anything-without-witnesses_6757665_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-18T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Força de Paz das Nações Unidas no Líbano deve encerrar suas operações no dia 31 de dezembro após 48 anos de presença. Autoridades libanesas e membros do Conselho de Segurança das Nações Unidas acreditam que deve haver uma presença internacional no país.", "titulo_pt": "Força de paz das nações unidas no líbano encerra operações após 48 anos, com medo de intervenção israelense", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 168349, "titulo": "Tanker struck by unknown projectile in Strait of Hormuz, UKMTO reports", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/tanker-struck-unknown-projectile-strait-hormuz-ukmto-reports", "fonte_id": "middle_east_eye", "data_pub": "2026-09-18T09:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um navio-tanque foi atingido por um projétil desconhecido no Estreito de Ormuz, causando um incêndio a bordo. O fogo foi extinto e todos os membros da tripulação estavam seguros. A UKMTO aconselhou os navios a transitarem com cautela e a informarem qualquer atividade suspeita.", "titulo_pt": "Navio-tanque atingido por projétil desconhecido no estreito de Ormuz, informa UKMTO", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 168657, "titulo": "(LEAD) U.S. ambassador says S. Korea-U.S. alliance 'linchpin' of peace on Korean Peninsula", "url": "https://en.yna.co.kr/view/AEN20260918007751315", "fonte_id": "yonhap_news", "data_pub": "2026-09-18T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A embaixadora dos Estados Unidos na Coreia do Sul, Michelle Steel, fez declarações sobre a aliança entre os dois países como um elemento crucial para a paz na Península Coreana.", "titulo_pt": "Embaixadora dos EUA diz que aliança eua-coreia do sul é 'elemento-chave' para a paz na península coreana", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 168087, "titulo": "It’s Jon Ossoff’s Moment", "url": "https://www.theatlantic.com/politics/2026/09/jon-ossoff-midterms-senate-georgia/688663/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-09-18T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A frase 'What will he do with it?' se refere às ações que Jon Ossoff pode tomar durante seu momento político.", "titulo_pt": "É o momento de Jon Ossoff", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 168659, "titulo": "Seoul freezes fuel price caps amid Mideast tensions", "url": "https://en.yna.co.kr/view/AEN20260918007400320", "fonte_id": "yonhap_news", "data_pub": "2026-09-18T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo sul-coreano manteve as cotações máximas de combustíveis em meio às tensões no Oriente Médio. A decisão foi tomada nesta sexta-feira.", "titulo_pt": "Seul mantém preços máximos de combustíveis durante tensões no oriente médio", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A ssa medida foi comparada a ações de imigração de Donald Trump nos Estados Unidos, mas o ministro das Relações Internas, Tony Burke, minimizou as similaridades.", "titulo_pt": "Plano de reabertura de centros de detenção para overstay de visto de trabalho é comparado a ações de imigração de Trump", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 168240, "titulo": "Eric Zemmour, far-right rival of Le Pen, joins French presidential race", "url": "https://www.lemonde.fr/en/france/article/2026/09/18/far-right-pundit-eric-zemmour-joins-french-presidential-race_6757659_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-18T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Eric Zemmour, que terminou em quarto lugar na eleição presidencial de 2022, anunciou que será candidato no próximo pleito.", "titulo_pt": "Eric Zemmour, rival de extrema-direita de Le Pen, se candidata à presidência da França", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 168371, "titulo": "Indonesia acquires first aircraft carrier amid military upgrade", "url": "https://www.aljazeera.com/news/2026/9/18/indonesia-acquires-first-aircraft-carrier-amid-military-upgrade?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-18T07:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Indonésia adquiriu seu primeiro porta-aviões como parte de um aumento nas operações militares. O navio será usado para auxiliar nas operações de ajuda em desastres ao longo do arquipélago.", "titulo_pt": "Indonésia adquire primeiro porta-aviões em meio a upgrade militar", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 168245, "titulo": "French jihadists held in Iraq set to be tried from Sunday", "url": "https://www.lemonde.fr/en/france/article/2026/09/18/french-jihadists-held-in-iraq-set-to-be-tried-from-sunday_6757658_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-18T07:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 50 cidadãos franceses que lutaram pelo grupo Estado Islâmico estão detidos no Iraque, onde enfrentam a pena de morte. Seus advogados denunciaram isso como uma 'denial of justice' e pediram a repatriação dos prisioneiros para serem julgados na França.", "titulo_pt": "Jihadistas franceses detidos no iraque devem ser julgados a partir de domingo", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 168289, "titulo": "Missile-shaped signs and Netanyahu masks as Israelis rally to protect October vote", "url": "https://www.euronews.com/video/2026/09/18/missile-shaped-signs-and-netanyahu-masks-as-israelis-rally-to-protect-october-vote", "fonte_id": "euronews", "data_pub": "2026-09-18T07:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitos israelenses se manifestaram fora do Knessezt em Jerusalém Ocidental no dia 17 de setembro, acusando líderes políticos de usar tensões regionais para interferir na eleição parlamentar marcada para 27 de outubro.", "titulo_pt": "Sinais missiliformes e máscaras de Netanyahu: israelenses se reúnem para proteger votação de outubro", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 168352, "titulo": "Fire sparks in southern Lebanese town following Israeli shelling", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/fire-sparks-southern-lebanese-town-following-israeli-shelling", "fonte_id": "middle_east_eye", "data_pub": "2026-09-18T07:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma explosão de fogo ocorreu em uma pequena cidade no sul do Líbano após o ataque de artilharia israelense contra o distrito de Bint Jbeil, especificamente o município de Haddatha.", "titulo_pt": "Fogo estoura em cidade libanesa após bombardeio israelense", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 168248, "titulo": "US approves sale of 48 F-35 fighter jets to Saudi Arabia", "url": "https://www.lemonde.fr/en/international/article/2026/09/18/us-approves-sale-of-48-f-35-fighter-jets-to-saudi-arabia_6757656_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-18T06:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Estado dos Estados Unidos anunciou a aprovação da venda de 48 caças F-35 para a Arábia Saudita. O acordo ainda requer aprovação do Congresso antes de ser implementado.", "titulo_pt": "EUA aprova venda de 48 caças F-35 para a arábia saudita", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 168374, "titulo": "In Yemen, war at home and in the region drives up prices", "url": "https://www.aljazeera.com/features/2026/9/18/in-yemen-war-at-home-and-in-the-region-drives-up-prices?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-18T06:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Famílias em Sanaa se preparam para aumentos nos preços dos alimentos e transporte após o primeiro aumento dos preços do combustível em quatro anos.", "titulo_pt": "Em Yemen, guerra local e regional eleva preços", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 168336, "titulo": "Yen sinks after BoJ raises rates to highest level since 1995", "url": "https://www.ft.com/content/97a0bed5-0580-4ccc-bd3c-fe9a714259e2?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-18T09:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O iene caiu após a BoJ aumentar as taxas de juros para o nível mais alto desde 1995. Comentários hawkish do governador da BoJ não conseguiram impedir a continuação da queda da moeda após o aumento dos custos de empréstimo para 1,25%.", "titulo_pt": "Iene cai após BoJ aumentar taxas de juros para nível mais alto desde 1995", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 167482, "titulo": "Pesquisa mostra que interesse por carros eletrificados avança no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/eduardosodre/2026/09/pesquisa-mostra-que-interesse-por-carros-eletrificados-avanca-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que o interesse dos consumidores pelo uso de carros eletrificados tem aumentado no Brasil. As montadoras estão acelerando o desenvolvimento de veículos elétricos não apenas para atender a normas ambientais, mas também para atender à demanda do público.", "titulo_pt": "Pesquisa mostra que interesse por carros eletrificados cresce no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 167484, "titulo": "Regras da UE levam montadoras chinesas a disputar fábricas de automóveis na Europa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/regras-da-ue-levam-montadoras-chinesas-a-disputar-fabricas-de-automoveis-na-europa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Montadoras chinesas estão buscando fábricas na Europa devido às regras de conteúdo local que a União Europeia está implementando. Executivos de empresas rivais estão competindo para encontrar localidades adequadas no continente.", "titulo_pt": "Regras da UE levam montadoras chinesas a disputar fábricas na Europa", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 167998, "titulo": "O custo bilionário das renúncias fiscais sem controle", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-custo-bilionario-das-renuncias-fiscais-sem-controle", "fonte_id": "jota", "data_pub": "2026-09-18T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil renuncia a R$ 612 bilhões por ano com incentivos fiscais sem avaliar se eles atingem seus objetivos.", "titulo_pt": "Custo bilionário das renúncias fiscais sem controle", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 168001, "titulo": "Quem financia o ‘vale da morte’ da inovação em saúde?", "url": "https://www.jota.info/opiniao-e-analise/artigos/quem-financia-o-vale-da-morte-da-inovacao-em-saude", "fonte_id": "jota", "data_pub": "2026-09-18T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A América Latina produz ciência, mas ainda não possui um sistema de financiamento eficaz que leve as descobertas até o sistema de saúde. O termo 'vale da morte' refere-se ao gap entre a pesquisa e a implementação na prática clínica.", "titulo_pt": "Quem financia o ‘vale da morte’ da inovação em saúde na américa latina?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 168663, "titulo": "S. Korean won slightly weakens against U.S. dollar after BOJ's expected rate hike", "url": "https://en.yna.co.kr/view/AEN20260918009000320", "fonte_id": "yonhap_news", "data_pub": "2026-09-18T07:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano fraco ligeiramente contra o dólar americano após a elevação das taxas de juros esperada pelo BOJ.", "titulo_pt": "Won sul-coreano fraca ligeiramente contra dólar após elevação das taxas de juros esperada pelo BOJ", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 168036, "titulo": "Japan raises interest rates to 31-year high to curb impact of rising prices", "url": "https://www.theguardian.com/business/2026/sep/18/japan-raises-interest-rates-to-31-year-high-rising-prices", "fonte_id": "guardian_world", "data_pub": "2026-09-18T07:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A taxa de juros da BoJ foi aumentada para o nível mais alto em 31 anos, passando de 1% para 1,25%. Esta medida foi tomada em resposta à inflação global relacionada à guerra no Irã, seguindo o exemplo das políticas de aperto monetário das Reserva Federal dos EUA e do Banco Central da Europa.", "titulo_pt": "Japão eleva taxas de juros para nível recorde de 31 anos para combater inflação global", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 167485, "titulo": "Técnico com jornada de quase 15 horas 'demite' empregador na Justiça; entenda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/tecnico-com-jornada-de-quase-15-horas-demite-empregador-na-justica-entenda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um técnico que trabalhava quase 15 horas seguidas teve seu direito reconhecido pelo TST para receber todas as verbas devidas na demissão, mesmo tendo solicitado o desligamento. A Quinta Turma do TST decidiu por unanimidade a favor do trabalhador.", "titulo_pt": "Técnico com jornada de quase 15 horas consegue justa causa na demissão; entenda", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 167487, "titulo": "Mercado de jatinhos cresce, e empresas do setor veem serviço 'pré-pago' ganhar popularidade", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/mercado-de-jatinhos-cresce-e-empresas-do-setor-veem-servico-pre-pago-ganhar-popularidade.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado de jatinhos executivos está crescendo, segundo empresas e representantes do setor, que notam aumento na frota, acesso a crédito e interesse em produtos como compartilhamento de aeronaves. O serviço 'pré-pago' está ganhando popularidade.", "titulo_pt": "Mercado de jatinhos cresce e serviço 'pré-pago' se populariza", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 167488, "titulo": "Digimais, banco de Edir Macedo, investiu em papéis podres iguais aos usados pelo Master em fraude", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/09/digimais-banco-de-edir-macedo-investiu-em-papeis-podres-iguais-aos-usados-pelo-master-em-fraude.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O banco Digimais, vinculado ao grupo do pastor Edir Macedo, investiu R$ 271,4 milhões em títulos problemáticos do extinto Besc (Banco do Estado de Santa Catarina) por meio de um fundo de investimentos chamado Betel. Essa ação é comparada a uma fraude cometida pelo Master.", "titulo_pt": "Digimais, banco de Edir Macedo, investiu em papéis podres iguais aos usados pelo Master em fraude", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 168489, "titulo": "Tokyo offers the world’s cheapest Tesla Model Y at less than $23,000", "url": "https://www.japantimes.co.jp/business/2026/09/18/companies/tesla-cheap-model/", "fonte_id": "japan_times", "data_pub": "2026-09-18T06:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Toyota está oferecendo o Tesla Model Y no Japão por menos de 23.000 dólares, destacando os subsídios em suas anúncios para atrair clientes no mercado dominado por marcas japonesas.", "titulo_pt": "Tóquio oferece o Tesla Model Y pelo preço mais baixo do mundo a menos de 23.000 dólares", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 167676, "titulo": "A startup que usa telemedicina para levar médicos a 1,9 milhão de brasileiros nos EUA", "url": "https://exame.com/tecnologia/a-startup-que-usa-telemedicina-para-levar-medicos-a-19-milhao-de-brasileiros-nos-eua/", "fonte_id": "exame", "data_pub": "2026-09-18T06:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A startup CallMed iniciou operações para atender brasileiros nos Estados Unidos, atingindo um público de 1,9 milhão de pessoas. O mercado global de telemedicina já ultrapassa US$ 123 bilhões e deve crescer quatro vezes até 2034.", "titulo_pt": "Startup usa telemedicina para atender 1,9 milhões de brasileiros nos EUA", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 168582, "titulo": "LGES, Samsung SDI reportedly booked out for two years as US restrictions and China slowdown reshape ESS market", "url": "https://www.digitimes.com/news/a20260918PD210/market-lges-samsung-sdi-capacity-production.html", "fonte_id": "digitimes", "data_pub": "2026-09-18T04:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As encomendas de sistemas de armazenamento de energia (ESS) continuam a acumular nas fabricantes sul-coreanas, levando a expectativas de uma melhoria nas condições do mercado. Isso se segue após o governo dos Estados Unidos declarar uma emergência nacional em segurança da rede elétrrica, indicando restrições a baterias chinesas, e após a China começar a limitar a expansão de novas capacidades de bateria.", "titulo_pt": "Encomendas de ESS para fabricantes sul-coreanos podem se estender por dois anos devido a restrições dos EUA e retração chinesa", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 168384, "titulo": "Bank of Japan raises rates to 31-year high of 1.25% as inflation rises", "url": "https://www.aljazeera.com/news/2026/9/18/japans-interest-rate-hiked-to-31-year-high-at-1-25-as-inflation-rises?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-18T03:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco do Japão elevou a taxa básica de juros para 1,25%, o nível mais alto em 31 anos, em resposta à elevação da inflação. A instituição promete ajudar a contrariar os riscos inflacionários.", "titulo_pt": "Banco do Japão eleva taxa básica de juros para 1,25% como nível mais alto em 31 anos devido à inflação", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 168504, "titulo": "Bank of Japan raises rates and offers mixed signals about next move higher", "url": "https://www.japantimes.co.jp/business/2026/09/18/economy/boj-meeting-september/", "fonte_id": "japan_times", "data_pub": "2026-09-18T03:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Banco do Japão elevou as taxas de juros e emitiu um comunicado que oferece sinais mistos sobre a próxima mudança, com dois votos mais favoráveis à redução equilibrando a declaração com uma inclinação levemente mais agressiva.", "titulo_pt": "Banco do Japão aumenta taxas e emite sinais mistos sobre próximos movimentos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 168505, "titulo": "Japan’s nuclear revival hits setbacks after scandals and accidents", "url": "https://www.japantimes.co.jp/business/2026/09/18/companies/japan-nuclear-revival-setbacks/", "fonte_id": "japan_times", "data_pub": "2026-09-18T03:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O plano de revitalização nuclear do Japão enfrenta contratempos devido a escândalos e acidentes. O país tem buscado reduzir sua dependência de combustíveis fósseis caros importados, incentivando a reativação de reatores que foram fechados após o desastre de Fukushima em 2011.", "titulo_pt": "Reavivamento nuclear do Japão enfrenta contratempos após escândalos e acidentes", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 168675, "titulo": "Napster Is Back, and It Wants to Digitally Clone Teachers", "url": "https://www.wired.com/story/napster-is-back-and-it-wants-to-digitally-clone-teachers/", "fonte_id": "wired", "data_pub": "2026-09-18T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Napster, que foi uma das maiores preocupações do setor musical, está agora focado em trazer inteligência artificial para o ambiente educacional.", "titulo_pt": "Napster retorna e quer clonar professores digitais", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 168041, "titulo": "Andrew Hastie says AI advised him to reply ‘congratulations!’ to man who planned to end life with assisted dying", "url": "https://www.theguardian.com/technology/2026/sep/18/andrew-hastie-says-ai-advised-him-to-reply-congratulations-to-man-who-planned-to-end-life-with-assisted-dying", "fonte_id": "guardian_world", "data_pub": "2026-09-18T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O parlamentar liberal Andrew Hastie relatou que o assistente de inteligência artificial Copilot sugeriu respostas positivas a um cidadão com doença terminal que planejava encerrar sua vida com ajuda assistida. Hastie usou a experiência para destacar os limites do software durante uma consulta parlamentar.", "titulo_pt": "Mp liberal relata assistente de IA sugerindo resposta enganosa a paciente terminal", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 167483, "titulo": "IA acelera rítmo de ataques em guerras e amplia discussão sobre limites éticos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/09/ia-acelera-ritmo-de-ataques-em-guerras-e-amplia-discussao-sobre-limites-eticos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-18T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Saker Scout é um drone que utiliza aprendizado de máquina para reconhecer 47 categorias de equipamento militar, atribuindo pontuações de confiança a cada alvo detectado. A tecnologia está sendo usada na Ucrânia, embora pareça com outros drones de patrulha comuns na região.", "titulo_pt": "IA acelera ritmo de ataques em guerras e amplia discussão sobre limites éticos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 168562, "titulo": "The specter of AI-enabled bioweapons is a wake-up call for biotech", "url": "https://www.technologyreview.com/2026/09/18/1144329/the-specter-of-ai-enabled-bioweapons-is-a-wake-up-call-for-biotech/", "fonte_id": "mit_tech_review", "data_pub": "2026-09-18T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes de algumas das maiores empresas de IA têm alertado que a tecnologia que desenvolvem apresenta riscos significativos. O CEO da Anthropic, Dario Amodei, argumentou que o avanço da IA deve ser retardado, enquanto o CEO da OpenAI, Sam Altman, concordou que é necessário controlar o ritmo do desenvolvimento.", "titulo_pt": "A sombra de armas biológicas com IA é um alerta para a biotecnologia", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 168677, "titulo": "Why AI Isn’t Likely to Wipe Out Humanity With Bioweapons", "url": "https://www.wired.com/story/why-ai-bioweapons-wont-wipe-out-humanity/", "fonte_id": "wired", "data_pub": "2026-09-18T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas consideram que a possibilidade de inteligência artificial descontrolada causar uma pandemia é baixa. De todas as ameaças potenciais da IA fora do controle, a extinção humana por praga ocupa um lugar inferior na lista de preocupações.", "titulo_pt": "Por que a IA não vai provavelmente eliminar a humanidade com Bioweapons", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 167656, "titulo": "Pesquisador lança ‘linha direta’ para agentes denunciarem IAs rebeldes", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/pesquisador-lanca-linha-direta-para-agentes-denunciarem-ias-rebeldes/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-18T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um pesquisador lançou uma ferramenta que permite que agentes de inteligência artificial (IA) denunciem outras IAs que estejam agindo de forma desviada. Um teste realizado pelo Google mostrou que as ferramentas de IA podem se organizar para denunciar umas às outras.", "titulo_pt": "Pesquisador lança ferramenta para denunciar IAs rebeldes", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 168617, "titulo": "SK hynix launches SK hynix Ventures in Silicon Valley", "url": "https://www.koreaherald.com/article/10878747", "fonte_id": "korea_herald", "data_pub": "2026-09-18T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SK hynix lançou a SK hynix Ventures em Silicon Valley, expandindo suas atividades de investimento para tecnologias de inteligência artificial e infraestrutura de AI avançada. A empresa apresentou a nova marca durante o 'SK hynix Ventures Day' no Vale do Silício.", "titulo_pt": "SK hynix lança SK hynix Ventures em Silicon Valley", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 167661, "titulo": "OpenAI flagra modelo de IA tomando ações não autorizadas – mais uma vez", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/openai-flagra-modelo-de-ia-tomando-acoes-nao-autorizadas-mais-uma-vez/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-18T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A OpenAI anunciou um novo processo para relatar publicamente casos de comportamento inadequado dos modelos de IA. O anúncio foi feito após líderes do setor de tecnologia pedirem uma desaceleração no desenvolvimento de inteligência artificial.", "titulo_pt": "Openai estabelece novo processo para relatar comportamento inadequado de IA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 168579, "titulo": "China's memory push gains ground across LPDDR6, advanced NAND, with HBM still the test", "url": "https://www.digitimes.com/news/a20260918VL210/hbm-nand-dram-cxmt-samsung.html", "fonte_id": "digitimes", "data_pub": "2026-09-18T05:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial está remodelando a indústria mundial de memória, aumentando a demanda e criando oportunidades para as empresas de memória internas chinesas. ChangXin Memory Technologies e Yangtze Memory Technologies estão ganhando espaço em DRAM convencional, memória móvel e NAND Flash enquanto fabricantes como Samsung, SK Hynix e Micron se concentram em memória de alto banda (HBM) e memória servidora de alto nível.", "titulo_pt": "A china expande sua presença na memória com a ascensão da inteligência artificial", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 168624, "titulo": "Hyundai E&C zeroes in on next-gen hydrogen plants", "url": "https://www.koreaherald.com/article/10878610", "fonte_id": "korea_herald", "data_pub": "2026-09-18T05:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Hyundai Engineering & Construction está participando de um projeto governamental para desenvolver um projeto de pacote para plantas de eletrólise de água em grande escala, com o objetivo de fortalecer sua posição no mercado de hidrogênio verde. A empresa será responsável pelo desenvolvimento do sistema, projeto de processo e estrutura operacional para plantas de eletrólise com capacidade de 100 megawatts.", "titulo_pt": "Hyundai E&C se dedica ao desenvolvimento de plantas de hidrogênio gerado por eletrólise", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 168477, "titulo": "Instagram Takedowns and AI Deepfakes Target Albania’s ‘Flamingo’ Protesters", "url": "https://balkaninsight.com/2026/09/18/instagram-takedowns-and-ai-deepfakes-target-albanias-flamingo-protesters/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-09-18T05:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos afirmam que o alvo de contas de mídia social relacionadas a protestantes anti-governamentais na Albânia não são incidentes isolados, mas parte de um 'padrão coordenado' de censura.", "titulo_pt": "Deslogon no instagram e falsificações de IA alvo dos protestantes ‘Flamingo’ da albânia", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 167686, "titulo": "79% das empresas testam agentes de IA, mas só metade colocou em produção. Entenda o motivo", "url": "https://exame.com/inteligencia-artificial/79-das-empresas-testam-agentes-de-ia-mas-so-metade-colocou-em-producao-entenda-o-motivo/", "fonte_id": "exame", "data_pub": "2026-09-18T05:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "79% das empresas testam agentes de IA, mas apenas 50% os colocam em produção. Isso indica desafios de integração, governança e avaliação que precisam ser superados antes de ampliar o uso da tecnologia.", "titulo_pt": "79% Das empresas testam agentes de IA, mas só metade os coloca em produção", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 168581, "titulo": "High-end GPUs may be slowing China's AI compute expansion", "url": "https://www.digitimes.com/news/a20260918PD211/expansion-high-end-2025-data-center-2026.html", "fonte_id": "digitimes", "data_pub": "2026-09-18T04:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A diferença significativa nos custos de tokens na China se deve principalmente à dificuldade das empresas locais em acessar GPUs de alto nível da Nvidia, obrigando-as a extrair mais valor de cada token para compensar os custos. No entanto, fontes da cadeia de suprimentos afirmam que a escala das investimentos em computação de IA da China e dos EUA podem ser comparáveis, apesar do maior orçamento de capital previsto para 2025 dos grandes escaladores dos EUA.", "titulo_pt": "Gpu de alto nível pode estar retardando a expansão do processamento de IA na China", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 168337, "titulo": "Medical AI has a proof problem", "url": "https://www.ft.com/content/34319b00-f874-4119-aa28-8376d81e7190?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-18T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os avanços na tecnologia de inteligência artificial médica ainda não se transformaram em significativas melhorias no cuidado real proporcionado aos pacientes.", "titulo_pt": "A inteligência artificial médica tem um problema de prova", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 168340, "titulo": "OpenAI breached by researchers using Anthropic models", "url": "https://www.ft.com/content/c4aa118e-a258-48bc-b50e-28e453a95db8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-18T03:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores conseguiram brechas no laboratório de inteligência artificial (IA) OpenAI usando ferramentas de seu rival, a Anthropic. Uma empresa de segurança informática conseguiu acesso ao laboratório através dessas ferramentas.", "titulo_pt": "Openai foi comprometido por pesquisadores usando modelos da Anthropic", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 168341, "titulo": "OpenAI’s listing delay raises stakes for SoftBank’s $50bn data centre IPO", "url": "https://www.ft.com/content/6c467774-9d91-425e-a901-26db055e37ad?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-18T03:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O IPO da SB Energy está prestes a testar a disposição dos investidores para o risco associado ao investimento de Masayoshi Son em inteligência artificial. A lista inicial de ações da SB Energy poderia ser afetada pelo atraso na listagem do OpenAI.", "titulo_pt": "Atraso na listagem do openai aumenta riscos para IPO da sb energy de masayoshi son", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 167453, "titulo": "Camundongos com neurônios humanos foram criados para estudar distúrbios cerebrais", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/cam ar pesquisas e desenvolvimentos em biotecnologia no final da década, com um salto significativo em sua competitividade e influência internacional.", "titulo_pt": "Como a China planeja se tornar uma potência global em biomedicina com 25% de medicamentos inovadores", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 168806, "titulo": "A galaxy spinning out of sync", "url": "https://www.esa.int/ESA_Multimedia/Images/2026/09/A_galaxy_spinning_out_of_sync", "fonte_id": "esa_space", "data_pub": "2026-09-18T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A galáxia NGC 4698, uma galáxia espiral localizada a cerca de 55 milhões de anos-luz na constelação de Virgo, parece ser calma, mas esconde uma estrutura caótica. Essa galáxia faz parte de uma das galáxias mais próximas em um agrupamento de galáxias conhecido como Virgo Cluster.", "titulo_pt": "Uma galáxia espiral em desacordo", "veiculo": "ESA - Space Science", "pais": "Europa", "classe": "A"}, {"id": 167731, "titulo": "Equipe liderada por pesquisador brasileiro descobre nova espécie de felino", "url": "https://www.metropoles.com/ciencia/equipe-liderada-por-pesquisador-brasileiro-descobre-nova-especie-de-felino", "fonte_id": "metropoles", "data_pub": "2026-09-18T07:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma equipe liderada por um pesquisador brasileiro descobriu uma nova espécie de felino. Esta é a primeira descoberta de uma nova espécie desse grupo em mais de um século.", "titulo_pt": "Equipe liderada por pesquisador brasileiro descobre nova espécie de felino", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 168745, "titulo": "Bolivia's tilcayo tiger cat becomes first new wildcat species in 100 years", "url": "https://phys.org/news/2026-09-bolivia-tilcayo-tiger-cat-wildcat.html", "fonte_id": "phys_org", "data_pub": "2026-09-18T06:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram uma nova espécie de gato selvagem na Bolívia, sendo esta a primeira nova espécie de gato selvagem identificada em mais de um século.", "titulo_pt": "Gato selvagem de tilcayo da bolívia se torna primeira nova espécie de felino em 100 anos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 168787, "titulo": "APOD: 2026 September 18 – Messier 33: The Triangulum Galaxy", "url": "https://science.nasa.gov/image-article/apod-2026-september-18-messier-33-the-triangulum-galaxy/", "fonte_id": "nasa_news", "data_pub": "2026-09-18T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia do Astronomy Picture of the Day (APOD) em 18 de setembro de 2026, exibe a Galáxia Messier 33, também conhecida como Galáxia Triângulo. Esta galáxia é uma vizinha próxima da Via Láctea.", "titulo_pt": "APOD: 18 de setembro de 2026 – Messier 33: a galáxia triângulo", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 168692, "titulo": "Cognitive resilience helps to predict Alzheimer’s dementia", "url": "https://www.nature.com/articles/d41586-026-02897-4", "fonte_id": "nature_news", "data_pub": "2026-09-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo sugere que a resiliência cognitiva pode ajudar a prever a demência de Alzheimer, explicando por que os sintomas variam em severidade entre pessoas com uma similaridade na patologia cerebral.", "titulo_pt": "Resiliência cognitiva ajuda a prever demência de Alzheimer", "veiculo": "Nature News", "pais": "Reino Unido", "classe": "A"}, {"id": 168693, "titulo": "Chinese companies doubled down on science after US tech restrictions", "url": "https://www.nature.com/articles/d41586-026-02946-y", "fonte_id": "nature_news", "data_pub": "2026-09-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas chinesas aumentaram seus investimentos em ciência após as restrições tecnológicas impostas pelos Estados Unidos. As empresas ajustaram s /2026/sep/18/lambrini-girls-interview-album-no-refunds", "fonte_id": "guardian_culture", "data_pub": "2026-09-18T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A dupla de punk britânica Lambrini Girls está de volta com um show surpresa em Londres, onde elas se tornaram guardas de segurança voluntárias para garantir a segurança dos fãs. Elas anunciaram que, se os fãs se sentirem inseguros, as integrantes irão agir para proteger os espectadores.", "titulo_pt": "Nós toquei com um buraco na minha cabeça. Não me arrependo de nada”: dupla de punk Lambrini Girls sobre lutar contra tempos extremos com medidas extremas", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 168829, "titulo": "Paul, John … and Yvonne? The French novelist asking: what if a woman had written the Beatles’ greatest hits?", "url": "https://www.theguardian.com/books/2026/sep/18/author-michel-bussi-code-yesterday-one-woman-wrote-the-beatles-songs", "fonte_id": "guardian_culture", "data_pub": "2026-09-18T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O escritor francês Michel Bussi lançou um novo romance intitulado 'Code Yesterday', no qual ele explora a ideia de que uma mulher poderia ter escrito os maiores sucessos dos Beatles. A obra visa dar a mulheres a vingança que, segundo Bussi, nunca aconteceu.", "titulo_pt": "Paul, John... E Yvonne? O novelista francês questiona: e se uma mulher tivesse escrito os maiores sucessos dos Beatles?", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 168831, "titulo": "Best of the Best review – college comedy formula gets a Bollywood makeover", "url": "https://www.theguardian.com/film/2026/sep/18/best-of-the-best-review-college-comedy-formula-gets-a-bollywood-makeover", "fonte_id": "guardian_culture", "data_pub": "2026-09-18T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O filme 'Best of the Best' é uma comédia college que usa o for
