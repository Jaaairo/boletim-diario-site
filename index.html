hinesa, marcando seu primeiro encontro pessoal com o presidente americano Joe Biden desde 2015. Na mesma semana, a Coreia do Sul, Estados Unidos e Japão se reúnem em Nova York para discutir questões econômicas e de segurança. Em um contexto global, a Ucrânia lançou mais de mil drones na Rússia, incluindo centenas direcionadas a Moscou, em um esforço para expor a guerra na Rússia. Além disso, os Estados Unidos anunciaram a criação de uma nova unidade focada em inteligência artificial, chamada 'Força AI', em resposta às crescentes preocupações sobre a segurança. As negociações com a China sobre inteligência artificial também estão sendo retomadas. No Brasil, o tema da soberania foi levantado no debate eleitoral, com relatórios apontando o risco de interferência do governo de Donald Trump nas eleições brasileiras.\n\nTrês oficiais militares sul-coreanos foram feridos em uma explosão na Zona Desmilitarizada (DMZ) entre as Coreias, levando as autoridades a abrir uma investigação. O incidente ocorreu após um suposto assassinato de um cidadão judeu settler por um palestiniano em Biddu, Israel, resultando em pelo menos 53 detenções. Na cena geopolítica mais ampla, a atenção se volta para as tensões comerciais e tecnológicas entre Estados Unidos e China, que continuam a agravar apesar de algumas pausas temporárias. O Irã ameaçou fazer mudanças significativas em suas operações se os Estados Unidos realizarem novos ataques, enquanto o Irã também afirmou ter interceptado e destruído outro dron MQ-1 dos Estados Unidos sobrevoando o Estreito de Ormuz.", "economia": "A economia global enfrenta diversos desafios, com destaque para a situação da Volkswagen, que foi excluída do índice Euro Stoxx 50 devido a problemas financeiros. A Câmara dos Deputados brasileira pode mudar a direção das taxas de juros em dezembro, influenciada pelos resultados das eleições, conforme previsão de economistas. Na Argentina, especialistas analisam os desafios do modelo econômico, incluindo questões de crédito e emprego. A Coreia do Sul viu suas bolsas subirem, impulsionadas por ganhos no setor de semicondutores, apesar das tensões no Oriente Médio. A inteligência artificial (IA) é vista como uma ferramenta para aliviar a pressão inflacionária, enquanto o Federal Reserve considera a estratégia de usar títulos de dívida a curto prazo para controlar a inflação nos Estados Unidos.", "tecnologia": "O evento mais importante dos artigos é a criação da 'Força AI' pelo presidente dos Estados Unidos, Donald Trump, anunciada durante o CNBC Daily Open. Esta iniciativa visa integrar a inteligência artificial em diversos setores, como veículos, robôs, dispositivos wearables e outros dispositivos conectados. O anúncio ocorre no contexto de um 'diálogo de IA' entre os Estados Unidos e a China, buscando aliviar tensões em áreas estratégicas como comércio e tecnologia. Em outro desenvolvimento, a Adlyse, uma empresa de tecnologia, deseja que agentes de inteligência artificial gerenciem campanhas publicitárias 24 horas por dia, refletindo o avanço contínuo da tecnologia em diversos setores, embora a publicidade ainda não tenha evoluído com a mesma velocidade. Além disso, a Samsung está substituindo o OneDrive pelo Google Fotos em seus celulares Galaxy, alterando a maneira como fotos e vídeos são sincronizados, demonstrando a crescente importância da IA em dispositivos móveis.", "ciencia": "Um estudo no Reino Unido mostrou que o uso de medicamentos GLP-1, como Ozempic, pode reduzir em até 40% a frequência de crises respiratórias em pacientes com asma, indicando possíveis novos tratamentos para a doença. Além disso, pesquisadores da Universidade da Geórgia identificaram genes que permitem a regeneração cerebral em um tipo de planária, o que pode trazer insights para o tratamento de lesões cerebrais em humanos. Na área de saúde, um filho nascido em 2025 na Europa viverá aproximadamente três anos a mais em climas extremamente quentes e propensos a incêndios em comparação com uma pessoa nascida em 1950, devido ao aquecimento global, destacando a urgência de ações climáticas. Estes avanços científicos abrangem desde novos tratamentos para doenças crônicas até a compreensão do impacto do clima na saúde humana, refletindo o amplo espectro de investigações em andamento.", "cultura": "Um dos principais eventos dos artigos é a continuação da exposição de Taryn Simon no Guggenheim, intitulada 'Evidence as Spectacle', que explora temas de arte, fama e paixão. A marca de moda Homme Plissé Issey Miyake criou uma coleção inspirada no trabalho de Henri Matisse, The Snail, que foi apresentada durante um espetáculo de dança no Tate Modern, como parte de um evento Open Studio. O Festival Cine Inclusão 60+ em São Paulo, Campinas e Santos, dedicado ao público acima dos 60 anos, apresenta 21 produções nacionais e internacionais que abordam o envelhecimento e a representatividade de pessoas idosas, com o objetivo de promover debates sobre o tema. Além disso, a escritora espanhola Rosa Montero afirma que a menopausa foi uma das melhores coisas que lhe aconteceram, afirmando que envelhecer não significa abrir mão do desejo ou viver com medo do futuro, mas intensifica a experiência de estar viva.", "sociedade": "Um garoto de 11 anos foi levado ao hospital em estado grave após ser atingido por disparos em uma casa em Sydney, na região noroeste da cidade, conforme relato do The Guardian. O incidente envolveu outras cinco pessoas na casa, mas nenhuma delas foi ferida. Em outro caso, a Itália planeja proibir o uso de véus nas escolas e limitar o número de alunos estrangeiros por turma, em meio ao aumento da imigração no país, conforme informado pelo portal Metrópoles. Além disso, a geração Z está enfrentando dificuldades para comprar casas próprias devido a juros altos e pressão salarial, conforme relato da Folha Mercado.", "meio_ambiente": "A Europa enfrentará um aumento significativo no número de anos extremamente propícios para incêndios devido ao aquecimento global, conforme estudo publicado pelo The Guardian. A pesquisa indica que uma criança nascida após 2025 poderá experimentar até três anos a mais de clima propício para incêndios em comparação com alguém nascido em 1950. A intensificação do aquecimento global exporá as crianças nascidas a partir de 2025 a cerca de metade a mais de condições climáticas propícias para incêndios do que suas bisavós. Além disso, hermit crabs enfrentam diversos desafios que ameaçam sua sobrevivência, segundo especialistas do Taipei Times. Em Villa de Leyva, Colômbia, incêndios florestais devido a temperaturas recordistas causadas por El Niño e condições de seca ameaçam a cidade turística.", "direitos_humanos": "A guerra israelense na Gaza está desestruturando famílias, com as mulheres se tornando cabeças de família em aproximadamente um quarto dos lares, conforme relatado no Le Monde. Milhares de mulheres palestinas estão cuidando sozinhas de seus filhos e buscando ajuda e abrigo em um ambiente perigoso. Em outro desenvolvimento, nove oponentes do regime nicaragüense que buscavam asilo nos Estados Unidos foram detidos pelas autoridades de imigração, apesar das críticas de Washington ao regime. Além disso, uma pesquisa publicada pela Metrópole indica que as mulheres consideram o combate ao feminicídio como a área da segurança pública mais importante para ser melhorada, com 18% das mulheres participantes citando este problema. Por fim, o Papa Francisco expressou preocupação sobre a grave crise humanitária em partes da Somália, afetada por violência e fenômenos meteorológicos extremos, e chamou a comunidade internacional a apoiar o país."}, "resumo_do_dia": {"politica_nacional": [{"id": 173225, "titulo": "A notícia positiva para Flávio na nova pesquisa BTG/Nexus em meio ao cenário de empate técnico com Lula", "url": "https://veja.abril.com.br/politica/o-dado-positivo-para-flavio-na-nova-pesquisa-btg-nexus-em-meio-ao-cenario-de-empate-tecnico-com-lula/", "fonte_id": "veja", "data_pub": "2026-09-21T09:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro aparece citado por 19% dos eleitores que admitem trocar de candidato até o primeiro turno, enquanto Augusto Cury e Lula têm 15% cada na pesquisa BTG/Nexus.", "titulo_pt": "Notícia positiva para Flávio em pesquisa BTG/Nexus em meio a empate técnico com Lula", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 173308, "titulo": "Nexus/BTG 2º turno: Lula empata com Caiado e tem empate técnico com Flávio", "url": "https://www.cnnbrasil.com.br/eleicoes/nexus-btg-2o-turno-lula-empata-com-caiado-e-tem-empate-tecnico-com-flavio/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-21T09:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Nexus/BTG apontou que no segundo turno das eleições, Lula teve empate técnico com Caiado e empate com Flávio. Foram entrevistados 2.006 eleitores entre os dias 18 e 20 de setembro, com uma margem de erro de dois pontos percentuais para mais ou para menos.", "titulo_pt": "Nexus/BTG 2º turno: lula empatado com Caiado e tecnicamente empatado com Flávio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 173226, "titulo": "O dado em que Lula abre 18 pontos sobre Flávio na nova pesquisa BTG/Nexus a duas semanas da eleição", "url": "https://veja.abril.com.br/politica/o-dado-em-que-lula-abre-18-pontos-sobre-flavio-na-nova-pesquisa-btg-nexus-a-duas-semanas-da-eleicao/", "fonte_id": "veja", "data_pub": "2026-09-21T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa BTG/Nexus indica que Lula tem 18 pontos de vantagem sobre Flávio no segundo turno das eleições, apesar de ambos estarem tecnicamente empatados. Um dado específico favoreceu Lula no levantamento.", "titulo_pt": "Dado mostra Lula com 18 pontos de vantagem sobre Flávio na nova pesquisa a duas semanas da eleição", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 173258, "titulo": "BTG/Nexus: com 50%, Flávio Bolsonaro lidera em rejeição; 49% rejeitam Lula", "url": "https://www.metropoles.com/brasil/btg-nexus-com-50-flavio-bolsonaro-lidera-em-rejeicao-49-rejeitam-lula", "fonte_id": "metropoles", "data_pub": "2026-09-21T09:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro mantém 50% de rejeição, enquanto Lula teve uma pequena elevação na rejeição, passando para 49%.", "titulo_pt": "Com 50%, Flávio Bolsonaro lidera em rejeição; 49% rejeitam Lula", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 173227, "titulo": "A nova pesquisa BTG/Nexus sobre a disputa Lula x Flávio a duas semanas da eleição", "url": "https://veja.abril.com.br/politica/a-nova-pesquisa-btg-nexus-sobre-a-disputa-lula-x-flavio-a-duas-semanas-da-eleicao/", "fonte_id": "veja", "data_pub": "2026-09-21T09:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa BTG/Nexus foi realizada logo após uma sessão de julgamento no STF sobre um caso envolvendo Alexandre de Moraes. É o primeiro levantamento do instituto sobre a disputa entre Lula e Flávio Gomes a duas semanas da eleição.", "titulo_pt": "Nova pesquisa BTG/Nexus sobre Lula x Flávio a duas semanas da eleição", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 173199, "titulo": "Alvo de especulações para 2030, Dino seria bem-vindo de volta no PSB, dizem dirigentes", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/alvo-de-especulacoes-para-2030-dino-seria-bem-vindo-de-volta-no-psb-dizem-dirigentes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino teria reforçado sua posição para uma possível candidatura presidencial em 2030 após sua atuação no STF. Dirigentes do PSB sugerem que ele seria bem-vindo de volta ao partido se decidisse concorrer.", "titulo_pt": "Dino seria bem-vindo de volta no PSB, dizem dirigentes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 173410, "titulo": "Poder diretivo não autoriza pressão por voto de trabalhadores", "url": "https://www.jota.info/opiniao-e-analise/artigos/poder-diretivo-nao-autoriza-pressao-por-voto-de-trabalhadores", "fonte_id": "jota", "data_pub": "2026-09-21T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A resolução do TSE estabelece que o poder diretivo não pode exercer pressão sobre os trabalhadores para influenciar o voto. O documento requer das empresas prevenção, neutralidade institucional e uma resposta rápida a casos de abuso.", "titulo_pt": "Poder executivo não autoriza pressão sobre trabalhadores para influenciar voto", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 173411, "titulo": "Terras raras: o valor de uma herança bem administrada", "url": "https://www.jota.info/opiniao-e-analise/artigos/terras-raras-o-valor-de-uma-heranca-bem-administrada", "fonte_id": "jota", "data_pub": "2026-09-21T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A política de crédito fiscal para minerais críticos pode falhar se não for adicional e previsível.", "titulo_pt": "Terras raras: o valor de uma herança bem administrada", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 173370, "titulo": "Do voto feminino à habitação popular: quem foi Carmen Portinho, pioneira do feminismo no Brasil", "url": "https://www.bbc.com/portuguese/articles/ckg3ydpz23ro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-21T08:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Carmem Velasco Portinho foi uma das pioneiras na luta pelo direito de voto para mulheres e a primeira brasileira a obter o título de urbanista.", "titulo_pt": "Da votação feminina à habitação popular: quem foi Carmen Portinho, pioneira do feminismo no Brasil", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 173200, "titulo": "Podcast: a reta final da corrida eleitoral e as preocupações de Lula e Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/podcasts/2026/09/podcast-a-reta-final-da-corrida-eleitoral-e-as-preocupacoes-de-lula-e-flavio-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-21T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A menos de 15 dias para o primeiro turno da eleição, Lula e Flávio Bolsonaro estão tecnicamente empatados nos cenários de primeiro e segundo turno, de acordo com a última pesquisa do Datafolha.", "titulo_pt": "Podcast: a reta final da corrida eleitoral e as preocupações de Lula e Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 173269, "titulo": "Vorcaro tinha seis rotas de fuga, diz ex-servidor do BC à PF", "url": "https://www.metropoles.com/colunas/igor-gadelha/vorcaro-tinha-seis-rotas-de-fuga-diz-ex-servidor-do-bc-a-pf", "fonte_id": "metropoles", "data_pub": "2026-09-21T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ex-servidor do Banco Central informou à Polícia Federal que Daniel Vorcaro teria seis rotas de fuga para escapar da prisão.", "titulo_pt": "Ex-servidor do BC informa que vorcaro tinha seis rotas de fuga", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 173412, "titulo": "Do relatório à decisão: os limites da verificação independente", "url": "https://www.jota.info/opiniao-e-analise/colunas/advogadas-publicas-em-debate/do-relatorio-a-decisao-os-limites-da-verificacao-independente", "fonte_id": "jota", "data_pub": "2026-09-21T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um relatório técnico fornece subsídios para a decisão da Administração Pública, mas não substitui essa decisão.", "titulo_pt": "Do relatório à decisão: os limites da verificação independente", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 173324, "titulo": "Delação de Vorcaro fica em “banho-maria” em meio à crise do STF", "url": "https://www.cnnbrasil.com.br/politica/delacao-de-vorcaro-fica-em-banho-maria-em-meio-a-crise-do-stf/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-21T07:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A delação do ex-banqueiro Vorcaro está em suspense, com indefinição sobre a relatoria do caso Master. A incerteza sobre um possível acordo é ampliada pelo momento de tensão no Supremo Tribunal Federal, onde há indefinição sobre quem vai analisar o caso.", "titulo_pt": "Delação de Vorcaro em suspense no STF", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 173271, "titulo": "Veja a agenda dos candidatos ao governo de SP nesta segunda (21/9)", "url": "https://www.metropoles.com/sao-paulo/veja-a-agenda-dos-candidatos-ao-governo-de-sp-nesta-segunda-21-9", "fonte_id": "metropoles", "data_pub": "2026-09-21T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Haddad não realiza agendas públicas nesta segunda-feira, limitando-se a compromissos de campanha e debates. Tarcísio tem um evento no CIEE pela manhã.", "titulo_pt": "Confira a agenda dos candidatos ao governo de SP nesta segunda-feira (21/9)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 173183, "titulo": "INSS paga benefícios de setembro a partir desta quinta (24); veja datas", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/inss-paga-beneficios-de-setembro-a-partir-desta-quinta-24-veja-datas.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os beneficiários do INSS começam a receber os pagamentos referentes a setembro a partir desta quinta-feira (24). O dinheiro será liberado primeiramente para quem recebe até um salário mínimo.", "titulo_pt": "INSS paga benefícios de setembro a partir desta quinta-feira; veja datas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 173184, "titulo": "Correios e trabalhadores não chegam a acordo e TST julga greve da categoria nesta segunda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/correios-e-trabalhadores-nao-chegam-a-acordo-e-tst-julga-greve-da-categoria-nesta-segunda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TST julga nesta segunda-feira a greve dos trabalhadores dos Correios, que entrou em greve nacional no dia 10 e tem como principal ponto de divergência o plano de saúde dos funcionários, aposentados e dependentes.", "titulo_pt": "TST julga greve dos correios nesta segunda-feira", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 173788, "titulo": "(LEAD) (Asiad) Teen swimmer Kim Seung-won wins bronze in women's 50m backstroke", "url": "https://en.yna.co.kr/view/AEN20260921009951315", "fonte_id": "yonhap_news", "data_pub": "2026-09-21T09:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kim Seung-won conquistou a medalha de bronze na prova de 50 metros costas feminina durante as Assembleias Asiáticas em Tóquio.", "titulo_pt": "Nadadora Kim Seung-won conquista bronze nos 50m costas femininos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 173789, "titulo": "(Asiad) S. Korea claims bronze in 4x200m freestyle relay swimming", "url": "https://en.yna.co.kr/view/AEN20260921010500315", "fonte_id": "yonhap_news", "data_pub": "2026-09-21T09:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul conquistou o bronze na prova de revezamento 4x200 metros livre masculino nos Jogos Asiáticos em Tóquio.", "titulo_pt": "Coreia do sul conquista bronze no revezamento 4x200m livre masculino", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 173489, "titulo": "Merz insists he will stay as German chancellor despite heavy losses in state elections – Europe live", "url": "https://www.theguardian.com/world/live/2026/sep/21/merz-german-chancellor-state-elections-russia-ukraine-europe-live-latest-news", "fonte_id": "guardian_world", "data_pub": "2026-09-21T09:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O partido CDU sofreu pesadas derrotas em duas eleições regionais, incluindo em seu estado natal, onde obteve apenas 4,9%. Esses resultados vieram após uma derrota histórica recente em Saxônia-Anhalt, onde o CDU obteve apenas 17% contra quase 44% do AfD. Apesar de sua promessa de permanecer no cargo, muitos veem o líder alemão como temporariamente no poder.", "titulo_pt": "Merz insiste em permanecer como chanceler alemão apesar das pesadas perdas nas eleições regionais", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 173648, "titulo": "Russia’s pro-Putin party set to win election as Ukraine exposes war’s growing reach into Moscow", "url": "https://www.cnbc.com/2026/09/21/russia-election-putin-moscow-attack-ukraine.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-21T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Ucrânia lançou mais de mil drones na Rússia no último dia da eleição para o Duma Estatal, incluindo centenas direcionadas a Moscou. O partido pró-Putin está provável que vença as eleições.", "titulo_pt": "Partido pró-putin deve vencer eleição enquanto Ucrânia ataca moscou com drones", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 173485, "titulo": "Think Australia would be better off with less migration? The numbers tell a different story", "url": "https://www.theguardian.com/australia-news/2026/sep/21/australia-migration-ageing-population-labor-analysis-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-09-21T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Austrália está envelhecendo e tendo menos nascimentos. O relatório intergeracional destaca a contradição entre o atual discurso anti-imigração e a necessidade futura de atrair pessoas de outros países para crescer a economia e financiar a população idosa.", "titulo_pt": "Acredita que a austrália ficaria melhor com menos imigração? Os números contam uma história diferente", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 173790, "titulo": "(2nd LD) 3 military officers injured in suspected landmine explosion during operation at DMZ", "url": "https://en.yna.co.kr/view/AEN20260921006152315", "fonte_id": "yonhap_news", "data_pub": "2026-09-21T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três oficiais militares se feriram em uma suposta explosão de uma mina terrestre durante uma operação na Zona de Desarmamento em 21 de setembro.", "titulo_pt": "3 Oficiais militares se ferem em explosião suspeita de mina na DMZ", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 173481, "titulo": "Police Officer Is Injured in Shooting Near Ontario Synagogue", "url": "https://www.nytimes.com/2026/09/21/world/canada/synagogue-shooting-belleville-ontario-yom-kippur.html", "fonte_id": "nyt_world", "data_pub": "2026-09-21T09:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um policial ficou ferido em um tiroteio perto da Sinagoga dos Filhos de Jacó em Belleville, enquanto os fiéis se reuniam para celebrar o Yom Kippur.", "titulo_pt": "Policial ferido em tiroteio próximo à sinagoga em belleville", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 173514, "titulo": "La política migratoria de Trump asfixia a los empresarios: “No hay gente para trabajar”", "url": "https://elpais.com/us/migracion/2026-09-21/la-politica-migratoria-de-trump-asfixia-a-los-empresarios-no-hay-gente-para-trabajar.html", "fonte_id": "elpais_america", "data_pub": "2026-09-21T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Empresários americanos reclamam da política migratória de Trump, que limita a entrada de imigrantes e resulta em escassez de mão de obra. Ativistas e legisladores denunciam que isso está levando a um aumento nos preços dos produtos e serviços devido à dificuldade em encontrar trabalhadores.", "titulo_pt": "A política migratória de Trump afeta negócios: 'não há pessoas para trabalhar'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 173516, "titulo": "Ciudadanos de EE UU visitaron El Salvador y terminaron en las cárceles de Bukele: “Dicen que es parte de una pandilla”", "url": "https://elpais.com/us/migracion/2026-09-21/ciudadanos-de-ee-uu-visitaron-el-salvador-y-terminaron-en-las-carceles-de-bukele-dicen-que-es-parte-de-una-pandilla.html", "fonte_id": "elpais_america", "data_pub": "2026-09-21T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Tres famílias denunciam que seus parentes estão detidos em El Salvador sem comunicação e sem que nenhum governo as informe sobre a data de liberação. As famílias alegam que os detidos são acusados de pertencer a uma pandilha.", "titulo_pt": "Cidadãos dos EUA detidos em El Salvador dizem ser parte de uma pandilha", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 173517, "titulo": "El feminicidio y las votantes logran espacio en la campaña presidencial más masculina del siglo en Brasil", "url": "https://elpais.com/america/2026-09-21/el-feminicidio-y-las-votantes-logran-espacio-en-la-campana-presidencial-mas-masculina-del-siglo-en-brasil.html", "fonte_id": "elpais_america", "data_pub": "2026-09-21T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A campanha presidencial no Brasil proporciona uma paradoxal situação onde o assunto feminicídio e as mulheres eleitoras estão ganhando espaço, apesar de ser uma campanha predominantemente masculina. As parlamentares representam apenas 18% no país.", "titulo_pt": "Feminicídio e eleitoras conquistam espaço em campanha presidencial mais masculina do século no Brasil", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 173519, "titulo": "Las tensiones entre México y Estados Unidos por la “narcopolítica” entran en campaña", "url": "https://elpais.com/mexico/2026-09-21/las-tensiones-entre-mexico-y-estados-unidos-por-la-narcopolitica-entran-en-campana.html", "fonte_id": "elpais_america", "data_pub": "2026-09-21T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Trump desperta entusiasmo entre seus seguidores com a ideia de que o crime organizado governa o México, enquanto Sheinbaum reage contra as interferências de Washington.", "titulo_pt": "Tensões entre México e Estados Unidos por 'narcopolítica' entram em campanha", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 173520, "titulo": "Milei viaja a la ONU mientras sus aliados se rebelan contra el Presupuesto 2027", "url": "https://elpais.com/argentina/2026-09-21/milei-viaja-a-la-onu-mientras-sus-aliados-se-rebelan-contra-el-presupuesto-2027.html", "fonte_id": "elpais_america", "data_pub": "2026-09-21T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo argentino removeu os cortes no orçamento para pessoas com deficiência, o que gerou críticas de aliados e até de legisladores do próprio governo. Deputado Luis Miguel Milei viajou para a ONU enquanto seus aliados se rebelam contra o orçamento de 2027.", "titulo_pt": "Milei viaja para a ONU enquanto aliados se rebelam contra o orçamento de 2027", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 173416, "titulo": "Heridos tres militares surcoreanos por una explosión en la zona desmilitarizada entre las dos Coreas", "url": "https://www.latercera.com/mundo/noticia/heridos-tres-militares-surcoreanos-por-una-explosion-en-la-zona-desmilitarizada-entre-las-dos-coreas/", "fonte_id": "la_tercera", "data_pub": "2026-09-21T09:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Três militares sul-coreanos foram feridos por uma explosão na zona desmilitarizada entre as duas Coreias. As autoridades abriram uma investigação para determinar as causas do incidente, presumindo-se que tenha sido uma mina antipessoal.", "titulo_pt": "Três militares sul-coreanos feridos por explosão na zona desmilitarizada", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 173730, "titulo": "China confirms Xi’s first trip to U.S. in nearly three years", "url": "https://www.japantimes.co.jp/news/2026/09/21/asia-pacific/politics/china-xi-us-trip-confirm/", "fonte_id": "japan_times", "data_pub": "2026-09-21T09:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Xi Jinping, líder chinês, fará sua primeira viagem aos Estados Unidos em aproximadamente três anos. O encontro ocorrerá enquanto o acordo de comércio temporário entre as duas nações está prestes a expirar.", "titulo_pt": "China confirma viagem de Xi a estados unidos após três anos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 173766, "titulo": "Rising toll of US-China trade, tech curbs in focus ahead of Xi-Trump summit", "url": "https://www.scmp.com/economy/policy/article/3367533/rising-toll-us-china-trade-tech-curbs-focus-ahead-xi-trump-summit?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Presidente Xi Jinping está previsto para se encontrar com o Presidente dos Estados Unidos, Donald Trump, em Washington esta semana. A atenção volta-se para as restrições comerciais e tecnológicas entre as duas nações, que continuam a se agravar apesar de algumas pausas temporárias.", "titulo_pt": "Crescente toll de restrições comerciais e tecnológicas entre EUA e china em foco antes da reunião Xi-Trump", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 173422, "titulo": "Catastro: 15 proyectos de desalación finalizarán su construcción durante el gobierno de Kast, y se iniciarán otros 12", "url": "https://www.latercera.com/pulso/noticia/catastro-15-proyectos-de-desalacion-finalizaran-su-construccion-durante-el-gobierno-de-kast-y-se-iniciaran-otros-12/", "fonte_id": "la_tercera", "data_pub": "2026-09-21T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O catastro do gremio Acades e CBC indica que há 53 projetos de infraestrutura hídrica em etapas de engenharia e construção, com uma investida de US$ 24 bilhões. Entre eles, 33 já têm as RCA aprovadas, 14 estão em avaliação e seis ainda não foram submetidos ao Seia.", "titulo_pt": "Catastro: 15 projetos de desalinação serão concluídos e outros 12 iniciados durante o governo de Kast", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 173646, "titulo": "Volkswagen woes deepen as blue-chip index exit follows latest profit warning", "url": "https://www.cnbc.com/2026/09/21/volkswagens-latest-profit-warning-compounds-exit-from-blue-chip-index.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-21T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Volkswagen enfrenta problemas aprofundados, com a saída de um índice de ações blue-chip e a divulgação de uma nova previsão negativa de lucro operacional. Analistas da Deutsche Bank afirmam que a redução da projeção inicialmente parece severa, mas mantém a geração de caixa intacta.", "titulo_pt": "Problemas da volkswagen aprofundam-se com nova previsão negativa e saída de índice de ações", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 173314, "titulo": "BC pode mudar direção de juros em dezembro, diz economista", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/bc-pode-mudar-direcao-de-juros-em-dezembro-diz-economista/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um economista acredita que a Câmara dos Deputados pode alterar a direção das taxas de juros em dezembro. O resultado das eleições pode influenciar o ritmo dos cortes da taxa básica de juros, conforme análise da Quantitas.", "titulo_pt": "BC pode mudar direção de juros em dezembro, diz economista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 173399, "titulo": "Día del Economista: cómo ven a la Argentina distintos especialistas y qué dicen que se necesita para crecer", "url": "https://www.lanacion.com.ar/economia/dia-del-economista-como-ven-a-la-argentina-distintos-especialistas-y-que-dicen-que-se-necesita-para-nid21092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-21T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Especialistas Leandro Mora Alfonsín, Martín Rapetti, Federico González Rouco, Haroldo Montagu e Santiago Bulat analisaram os desafios do modelo econômico argentino em diferentes aspectos, incluindo crédito, consumo, tipo de cambio, emprego e crescimento.", "titulo_pt": "Dia do Economista: como veem a Argentina especialistas e quais são os desafios para o crescimento", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 173400, "titulo": "Termómetro: ¿qué dice el precio del toro sobre el negocio ganadero?", "url": "https://www.lanacion.com.ar/economia/campo/termometro-que-dice-el-precio-del-toro-sobre-el-negocio-ganadero-nid21092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-21T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O valor do touro está mais relacionado à economia da criação de gado que ao futuro do rodeio.", "titulo_pt": "Termômetro: qual é o preço do touro para o negócio da criação de gado?", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 173649, "titulo": "Chinese biopharma stocks jump as U.S. weighs keeping door open to drug deals", "url": "https://www.cnbc.com/2026/09/21/chinese-biopharma-stocks-jump-as-us-plans-to-continue-drug-licensing-deals-.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-21T08:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da biotecnologia chinesa subiram na segunda-feira após relatos de que os Estados Unidos podem manter a permitir a maioria das licenças de medicamentos com empresas chinesas.", "titulo_pt": "Ações de biotecnologia chinesas subem com possibilidade de manutenção de acordos de licenciamento de medicamentos", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 173300, "titulo": "Dow Jones Futuro sobe com petróleo em queda e otimismo antes de encontro Trump-Xi", "url": "https://www.infomoney.com.br/mercados/dow-jones-futuro-sobe-com-petroleo-em-queda-e-otimismo-antes-de-encontro-trump-xi/", "fonte_id": "infomoney", "data_pub": "2026-09-21T08:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A bolsa futura Dow Jones subiu devido à queda do petróleo e ao otimismo com a aproximação entre Estados Unidos e China, enquanto o mercado monitora tensões no Oriente Médio.", "titulo_pt": "Dow Jones Futuro sobe com petróleo em queda e otimismo antes de encontro Trump-Xi", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 173409, "titulo": "Empresas usam interoperabilidade em relatórios ESG em busca de resposta integral", "url": "https://www.jota.info/opiniao-e-analise/colunas/praticas-esg/empresas-usam-interoperabilidade-em-relatorios-esg-em-busca-de-resposta-integral", "fonte_id": "jota", "data_pub": "2026-09-21T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas estão utilizando a interoperabilidade entre normas como GRI, TCFD e CDP para obter respostas integrais em seus relatórios ESG, aumentando assim sua credibilidade e atração de investidores.", "titulo_pt": "Empresas usam interoperabilidade em relatórios ESG em busca de resposta integral", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 173644, "titulo": "Here's what the Saudi East-West pipeline shutdown means for Asia's biggest crude importers", "url": "https://www.cnbc.com/2026/09/21/saudi-pipeline-closure-asia-oil-import-korea.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-21T08:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A interrupção do principal oleoduto oriental Ocidental da Arábia Saudita pode reduzir a oferta de petróleo para importadores asiáticos, com a Coreia do Sul sendo a mais diretamente afetada.", "titulo_pt": "O que a interrupção do oleoduto oriental ocidental saudita significa para os maiores importadores de petróleo da ásia", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 173650, "titulo": "Treasury yields ease as global borrowing costs tumble", "url": "https://www.cnbc.com/2026/09/21/treasury-yields-government-bonds.html", "fonte_id": "cnbc_international", "data_pub": "2026-09-21T08:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os rendimentos do Tesouro estavam mais baixos na segunda-feira após a recente onda de cortes de taxas de juros em todo o mundo.", "titulo_pt": "Rendimentos do tesouro se moderam após queda geral nas taxas de juros globais", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 173848, "titulo": "Korea Zinc’s $7.4b Project Crucible clears major US environmental review", "url": "https://www.koreaherald.com/article/10881062", "fonte_id": "korea_herald", "data_pub": "2026-09-21T08:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O projeto 'Project Crucible' de bilhões de dólares da Korea Zinc passou por uma revisão ambiental crucial dos Estados Unidos, acelerando os planos da empresa para uma fundição integrada de minerais críticos em Tennessee. O Departamento de Defesa dos EUA concluiu que a construção e operação do projeto não alterarão significativamente o ambiente circundante.", "titulo_pt": "Projeto de bilhões da korea Zinc passa por revisão ambiental dos EUA", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 173321, "titulo": "Feijão pode chegar a R$ 12 o quilo em 2027, mesmo com preço alto no campo", "url": "https://www.cnnbrasil.com.br/agro/feijao-pode-chegar-a-12-o-quilo-em-2027-mesmo-com-o-preco-em-alta-no-campo/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-21T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A previsão é de que o feijão possa chegar a R$ 12 o quilo em 2027, mesmo com preços elevados na produção atual. Esta estimativa está baseada na menor colheita da leguminosa registrada na terceira safra do carioca em fevereiro.", "titulo_pt": "Feijão pode atingir R$ 12 o quilo em 2027, mesmo com alta no campo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 173657, "titulo": "Chinese rare earth shipments to US drop ahead of Trump-Xi summit", "url": "https://www.ft.com/content/eeef7db4-b26d-426f-896b-f7b95bb84223?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-21T07:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações de terrenos raras chineses para os Estados Unidos em agosto diminuíram 20% em comparação com julho, enquanto Washington pressiona Pequim sobre o fornecimento de minérios críticos.", "titulo_pt": "Exportações de terrenos raras do china para os EUA caem antes do encontro Trump-Xi", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 173803, "titulo": "(2nd LD) Seoul stocks rise 1.65 pct on chip gains despite Middle East tensions", "url": "https://en.yna.co.kr/view/AEN20260921006852320", "fonte_id": "yonhap_news", "data_pub": "2026-09-21T07:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações na Séul subiram 1,65% na segunda-feira, impulsionadas por ganhos no setor de semicondutores, apesar das tensões no Oriente Médio.", "titulo_pt": "Seul: ações subem 1,65% com ganhos no setor de semicondutores, em meio a tensões no oriente médio", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 173661, "titulo": "Trafigura to float supertanker arm in first IPO of a business", "url": "https://www.ft.com/content/a1c9d298-8af9-4cf4-9c47-e2eb50cd03d9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-21T06:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Trafigura planeja levar a Volare Shipping a bolsa de Oslo. A crise do Golfo está levando as taxas de navios-tanque a máximos históricos.", "titulo_pt": "Trafigura vailistar a volare shipping em oslo durante crise do golfo", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 173779, "titulo": "Singapore retrenchment rates hit highest level since pandemic", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3368213/singapore-retrenchment-rates-hit-highest-level-pandemic?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-21T06:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ritmo de demissões em Singapura no segundo trimestre de 2026 atingiu o nível mais alto desde o auge da pandemia de Covid-19 no final de 2020, devido a reorganizações e reestruturações de empresas. Houve 4.620 demissões no segundo trimestre deste ano, contra 3.830 no primeiro trimestre.", "titulo_pt": "Taxa de demissões em singapura atinge nível mais alto desde pandemia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 173654, "titulo": "Why the world’s hottest stock market is a national liability", "url": "https://www.ft.com/content/6f0ceb7d-597d-4c83-ac8b-0fe7c8bd74f9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-21T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As volatilidades extremas dos mercados de ações sul-coreanos estão prejudicando a imagem do país.", "titulo_pt": "Por que o mercado de ações mais quente do mundo é uma responsabilidade nacional", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 173881, "titulo": "Adlyse wants AI agents managing ad campaigns 24/7", "url": "https://tech.eu/2026/09/21/adlyse-wants-ai-agents-managing-ad-campaigns-247/", "fonte_id": "tech_eu", "data_pub": "2026-09-21T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Adlyse deseja que agentes de inteligência artificial gerenciem campanhas publicitárias 24 horas por dia. Embora o engenhocamento tenha avançado rapidamente devido à ajuda da IA na construção de produtos, a publicidade não evoluiu com a mesma velocidade.", "titulo_pt": "Adlyse quer que agências de IA gerenciem campanhas publicitárias 24 horas por dia", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 173762, "titulo": "Chinese regulator drafts rules to protect teenagers from ‘intimate’ AI companions", "url": "https://www.scmp.com/tech/policy/article/3368252/chinese-regulator-drafts-rules-protect-teenagers-intimate-ai-companions?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-21T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência reguladora chinesa dos serviços da internet propôs novas regras para proteger os menores de idade em plataformas sociais e desenvolvedores de jogos, incluindo uma proibição de oferecer serviços de 'intimidade virtual' a menores de 18 anos com a ajuda da inteligência artificial. Os regulamentos, intitulados 'Garantindo o uso seguro e saudável da internet por menores', também proibiriam as plataformas online de fornecer 'parentes virtuais ou companheiros' e proibiriam serviços que 'induzam menores a ficarem dependentes'.", "titulo_pt": "Regulador chinês propõe regras para proteger menores de serviços de companheiros virtuais", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 173785, "titulo": "Amazon doesn’t trust Meta’s Muse AI agent", "url": "https://www.theverge.com/tech/998078/amazon-blocks-meta-muse-ai-agent-shopping", "fonte_id": "the_verge", "data_pub": "2026-09-21T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Amazon bloqueou o acesso do agente de inteligência artificial Muse, da Meta, às compras dos usuários na plataforma. Um aviso foi exibido para os usuários do Muse informando que o acesso continuado por um agente de IA não autorizado viola as Condições de Uso da Amazon.", "titulo_pt": "Amazon não confia no agente de IA Muse da Meta", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 173765, "titulo": "Asia investors demand AI revenue proof as focus shifts from exposure to earnings: BofA", "url": "https://www.scmp.com/business/china-business/article/3368216/asia-investors-demand-ai-revenue-proof-focus-shifts-exposure-earnings-bofa?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Investidores asiáticos estão pedindo provas mais claras de que a inteligência artificial pode gerar receita e lucros, em vez de buscar apenas exposição à tecnologia, conforme o setor avança para uma fase mais madura, de acordo com Chris Oberoi, chefe de pesquisa da Ásia-Pacífico do Bank of America. Oberoi afirma que a inteligência artificial está contribuindo para a produtividade e está sendo monetizada.", "titulo_pt": "Investidores asiáticos pedem provas concretas de lucratividade da IA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 173787, "titulo": "After 8 Years in Space, ‘BepiColombo’ Is Finally Approaching Mercury", "url": "https://www.wired.com/story/after-8-years-in-space-bepicolombo-finally-approaching-mercury/", "fonte_id": "wired", "data_pub": "2026-09-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois de 8 anos no espaço, o BepiColombo está prestes a chegar ao Mercúrio para estudar seu campo magnético e estrutura interna.", "titulo_pt": "Depois de 8 anos no espaço, BepiColombo finalmente se aproxima do mercúrio", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 173882, "titulo": "NewSchool VC closes €10M Fund I to back early-stage B2B tech", "url": "https://tech.eu/2026/09/21/newschool-vc-closes-eur10m-fund-i-to-back-early-stage-b2b-tech/", "fonte_id": "tech_eu", "data_pub": "2026-09-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de venture capital belga NewSchool VC encerrou seu primeiro fundo com €10 milhões para investir em empresas de tecnologia B2B em estágios iniciais. O fundo atingiu seu objetivo após arrecadar €6,1 milhões.", "titulo_pt": "Nova empresa de venture capital belga fecha primeiro fundo de €10 milhões para investir em startups tecnológicas B2B", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 173810, "titulo": "Samsung builds fab robot team, targets chip equipment maintenance", "url": "https://www.digitimes.com/news/a20260921VL222/samsung-equipment-robot-fab-automation.html", "fonte_id": "digitimes", "data_pub": "2026-09-21T08:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung formou uma organização dedicada ao desenvolvimento e implementação de robôs em suas fábricas de semicondutores, com a manutenção preventiva de equipamentos sendo o primeiro objetivo. A empresa está promovendo a automação em tarefas que ainda dependem fortemente de engenheiros.", "titulo_pt": "Samsung cria time de robôs para fábricas de semicondutores, com foco em manutenção preventiva", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 173883, "titulo": "Final Frontier and Myriad unite behind €100M defence tech fund", "url": "https://tech.eu/2026/09/21/final-frontier-and-myriad-unite-behind-100m-defence-tech-fund/", "fonte_id": "tech_eu", "data_pub": "2026-09-21T08:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apoiados pela Europa em sua rearmamento, os investidores em defesa tecnológica da Dinamarca, Final Frontier e Myriad, uniram-se para criar um fundo com €100 milhões sob uma única marca. Eles agora trabalharão juntos através de uma plataforma comum.", "titulo_pt": "Final Frontier e Myriad unem-se em fundo de defesa tecnológica de €100 milhões", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 173812, "titulo": "SDC president declares foldable leadership, urges Korea to defend OLED advantage", "url": "https://www.digitimes.com/news/a20260921PD216/sdc-foldable-expansion-lcd-display.html", "fonte_id": "digitimes", "data_pub": "2026-09-21T08:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente da Samsung Display e presidente da Associação da Indústria de Exibição de Coreia, Chung Yi, declarou confiança nas capacidades de painéis dobráveis da empresa, mas alertou que rivais estão investindo recursos adquiridos no período LCD para OLED. Ele encorajou a unificação da indústria, governo, academia e setor de pesquisa na Coreia para evitar a perda de liderança no mercado que ocorreu na indústria LCD.", "titulo_pt": "Presidente da samsung display declara liderança em painéis dobráveis e alerta para ameaça de rivais", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 173813, "titulo": "Lattice Mach-N2 transitions to 16nm FinFET, integrating post-quantum encryption to strengthen control security", "url": "https://www.digitimes.com/news/a20260921PD215/lattice-security-finfet-16nm-fpga.html", "fonte_id": "digitimes", "data_pub": "2026-09-21T08:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Lattice Semiconductor lançou recentemente a sua nova geração de FPGA de controle seguro, a Mach-N2, construída no plataforma Nexus 2 small FPGA. Esta série incorpora memória flash embutida, uma raiz de confiança em hardware e criptografia pós-quantum (PQC) compatível com o Conjunto Nacional de Algoritmos de Segurança Comercial do NSA (CNSA 2.0), direcionada para infraestruturas de longa vida, como data centers, que precisam se defender proativamente contra ameaças emergentes de computação quântica.", "titulo_pt": "Lattice Mach-N2 passa para 16nm FinFET, integrando criptografia pós-quantum para fortalecer a segurança do controle", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 173814, "titulo": "China's smart glasses boom: AI evolution, market shakeout, macro trends", "url": "https://www.digitimes.com/news/a20260921VL207/smart-glasses-market-sales-growth-ar.html", "fonte_id": "digitimes", "data_pub": "2026-09-21T08:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O setor de óculos inteligentes na China está experimentando crescimento explosivo, impulsionado por mudanças nas hábitos de consumo, avanços tecnológicos rápidos e apoio forte de políticas. No entanto, sob a superfície, existe uma divisão fundamental: enquanto os óculos de AI e AR leves estão aumentando, o mercado de óculos de som sofreu uma contração.", "titulo_pt": "O boom dos óculos inteligentes na china: evolução da IA, reestruturação do mercado e tendências macroeconômicas", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 173815, "titulo": "Qisda leverages ICT foundation to build one-stop AI healthcare platform", "url": "https://www.digitimes.com/news/a20260921PD223/qisda-healthcare-communications-technology-medical.html", "fonte_id": "digitimes", "data_pub": "2026-09-21T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Qisda está acelerando a integração da tecnologia de comunicações e informação (ICT) com a saúde, transformando sua rede de hospitais e farmácias em testemunhos reais de serviços médicos guiados por ICT. A empresa está expandindo seus serviços para incluir cuidados residenciais, logística farmacêutica e equipamentos de reabilitação, estendendo sua atuação desde o cuidado clínico hospitalar até a recuperação pós-tratamento e a entrega remota.", "titulo_pt": "Qisda aproveita fundo de ICT para construir plataforma de saúde por inteligência artificial", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 173884, "titulo": "Apply AI Summit brings Europe’s push for real-world AI adoption to Brussels [Sponsored]", "url": "https://tech.eu/2026/09/21/apply-ai-summit-brings-europes-push-for-real-world-ai-adoption-to-brussels/", "fonte_id": "tech_eu", "data_pub": "2026-09-21T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Europa é conhecida por talentos tecnológicos excepcionais, inovação e pesquisa em IA de alto nível. No entanto, a adoção prática de IA em empresas e setor público europeu está em crescimento, mas ainda não foi amplamente implementada.", "titulo_pt": "Fórum de IA reúne esforço europeu pela adoção prática de IA em bruxelas", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 173885, "titulo": "Project Ventures launches £5M fund for Imperial-rooted deeptech and AI startups", "url": "https://tech.eu/2026/09/21/project-ventures-launches-ps5m-fund-for-imperial-rooted-deeptech-and-ai-startups/", "fonte_id": "tech_eu", "data_pub": "2026-09-21T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Project Ventures, um fundo de capital de risco independente e radicado no ecossistema da Imperial College London, lançou seu primeiro fundo de £5 milhões para investir em startups pré-série inicial e de série inicial focadas em tecnologias profundas e inteligência artificial.", "titulo_pt": "Project Ventures lança fundo de £5 milhões para startups de tecnologias profundas e IA ligadas à imperial college", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 173816, "titulo": "Europe's hydrogen trucks chase commercialization", "url": "https://www.digitimes.com/news/a20260921PD220/europe-infrastructure-automakers-market-investment.html", "fonte_id": "digitimes", "data_pub": "2026-09-21T08:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fabricantes e fornecedores de caminhões na Europa estão acelerando alianças para promover veículos a hidrogênio e infraestrutura de recarga, diante de regras ambientais mais rígidas na Europa e de automotivas que correm para não ficar de fora do mercado de hidrogênio. No entanto, os caminhões a hidrogênio ainda precisam provar que podem competir com os caminhões a diesel em custos, enquanto enfrentam pressão de rivais elétricos.", "titulo_pt": "Caminhões a hidrogênio europeus aceleram comercialização", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 173817, "titulo": "Leading Interconnect Semiconductor starts Shenzhen advanced packaging substrate plant", "url": "https://www.digitimes.com/news/a20260921PD227/packaging-shenzhen-substrate-zhen-ding-high-end.html", "fonte_id": "digitimes", "data_pub": "2026-09-21T08:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Zhen Ding Technology, uma subsidiária da Leading Interconnect Semiconductor, iniciou as obras para um projeto de substrato de embalagem avançada de IA em Bao'an, Shenzhen, com uma investida total prevista de pelo menos 12 bilhões de yuanes (aproximadamente 1,79 bilhão de dólares). O novo local será dedicado à construção de quatro fábricas e à expansão da capacidade da empresa para desenvolver, fabricar e entregar produtos de grão de bola de chip virado para frente (FCBGA) de alta gama para clientes de IA, computação de alto desempenho e embalagens avançadas.", "titulo_pt": "Subsidiária da leading Interconnect Semiconductor inicia obra de fábrica de substrato de embalagem avançada em Shenzhen", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 173835, "titulo": "STAT+: With new strategy, Novo outlines plans for obesity, direct-to-consumer work", "url": "https://www.statnews.com/2026/09/21/novo-nordisk-capital-markets-day-obesity-strategy/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-21T09:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novo apresentou sua estratégia para expandir sua linha de produtos contra a obesidade e diversificar sua carteira de desenvolvimento de medicamentos. A empresa respondeu às pressões dos investidores apresentando esses planos.", "titulo_pt": "Novo apresenta estratégia para obesidade e trabalho direto ao consumidor", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 173878, "titulo": "What kills Schrödinger’s cat? Gravity may not be the answer", "url": "https://www.sciencedaily.com/releases/2026/09/260920222350.htm", "fonte_id": "science_daily", "data_pub": "2026-09-21T09:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Físicos realizaram um dos testes mais rigorosos até agora sobre uma teoria que sugere que flutuações gravitacionais sutis podem destruir superposições quânticas, mas não encontraram evidências dessa radição predita. A pesquisa foi realizada em um detector de germanio altamente protegido, debaixo do Monte Gran Sasso na Itália, por 62 dias.", "titulo_pt": "O que mata o gato de Schrödinger? Radiação gravitacional não é a resposta", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 173418, "titulo": "La semaglutida de Ozempic logró reducir hasta un 40% los ataques de asma, según un estudio", "url": "https://www.latercera.com/tendencias/noticia/la-semaglutida-de-ozempic-logro-reducir-hasta-un-40-los-ataques-de-asma-segun-un-estudio/", "fonte_id": "la_tercera", "data_pub": "2026-09-21T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo no Reino Unido descobriu que o uso de medicamentos GLP-1, incluindo Ozempic, foi associado a uma redução de até 40% na frequência de crises respiratórias nos pacientes com asma.", "titulo_pt": "Ozempic reduziu até 40% os ataques de asma, de acordo com estudo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 173419, "titulo": "Por qué el cáncer está aumentando entre los adultos más jóvenes, según una investigación", "url": "https://www.latercera.com/tendencias/noticia/por-que-el-cancer-esta-aumentando-entre-los-adultos-mas-jovenes-segun-una-investigacion/", "fonte_id": "la_tercera", "data_pub": "2026-09-21T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Investigadores analisaram os dados de mais de 150.000 adultos jovens e constataram um aumento do câncer nessa faixa etária. Os resultados podem auxiliar no desenvolvimento de novas estratégias de prevenção e detecção precoce.", "titulo_pt": "Por que o câncer está aumentando entre os adultos mais jovens, de acordo com uma investigação", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 173193, "titulo": "Pena achada em cocô de dinossauro pode ajudar explicar como aves escaparam da extinção", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/09/pena-achada-em-coco-de-dinossauro-pode-ajudar-explicar-como-aves-escaparam-da-extincao.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-09-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pena de ave extremamente bem preservada da era dos dinossauros foi encontrada dentro de um fossilizado de fezes de dinossauro, proporcionando insights sobre como algumas espécies de aves podem ter sobrevivido à extinção.", "titulo_pt": "Pena de ave da era dos dinossauros encontrada em cocô de dinossauro", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 173870, "titulo": "Genes that help flatworms regenerate their brains revealed", "url": "https://phys.org/news/2026-09-genes-flatworms-regenerate-brains-revealed.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade da Geórgia identificaram vários genes que permitem a regeneração cerebral em um tipo de planímora. O cérebro humano tem dificuldade em se curar de lesões ou doenças.", "titulo_pt": "Genes que auxiliam planímeres a regenerarem seus cérebros identificados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 173871, "titulo": "AI-powered barcode unmasks 'zombie cells' in aging tissue", "url": "https://phys.org/news/2026-09-ai-powered-barcode-unmasks-zombie.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores da MIT desenvolveram um método não invasivo para detectar marcadores de senescência celular usando microscopia de Raman. Este método tem potencial para melhorar o diagnóstico e o tratamento de doenças relacionadas à idade, como câncer, degeneração tecidual e doenças inflamatórias.", "titulo_pt": "Inteligência artificial identifica 'células-zombie' no tecido envelhecido", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 173872, "titulo": "Children born today in Europe will live through almost twice as much extreme fire weather as their grandparents", "url": "https://phys.org/news/2026-09-children-born-today-europe-extreme.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um filho nascido em 2025 na Europa viverá aproximadamente três anos a mais de clima extremamente quente e propenso a incêndios em comparação com uma pessoa nascida em 1950, se as políticas climáticas atuais continuarem. Isso representa um aumento de 84% para os filhos em relação aos seus avós, com a maioria (86%) deste aumento atribuível ao aquecimento global.", "titulo_pt": "Crianças nascidas hoje na Europa vivenciaram quase o dobro do tempo de clima extremo de incêndios em comparação com seus avós", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 173836, "titulo": "Opinion: STAT+: The NIH budget should be $100 billion per year", "url": "https://www.statnews.com/2026/09/21/nih-budget-double-100-billion-reed-jobs/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-21T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Reed Jobs escreve que o investimento no NIH deveria ser fortalecido, não desmontado.", "titulo_pt": "Opinião: orçamento do NIH deveria ser de 100 bilhões de dólares por ano", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 173837, "titulo": "STAT+: Can RFK Jr. help GOP win the midterms? Iowa is a test", "url": "https://www.statnews.com/2026/09/21/rfk-jr-maha-movement-gop-midterm-candidates/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-21T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O resultado da corrida pelo governo de Iowa será um indicador de se o movimento político de Robert F. Kennedy Jr., conhecido como MAHA, tem atração duradoura entre os eleitores.", "titulo_pt": "Governador de iowa pode ser teste para o movimento político de RFK Jr.", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 173838, "titulo": "Why is trust in science important?", "url": "https://www.statnews.com/2026/09/21/trust-in-science-reporter-nick-florko-interview-status-report-alex-hogan/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-21T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alex Hogan, da STAT, conversa com o novo repórter de confiança em ciência, Nicholas Florko, em um episódio recente do programa STATus Report.", "titulo_pt": "Por que a confiança na ciência é importante?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 173839, "titulo": "Skeptical about modern medicine? I know the feeling — and want to listen", "url": "https://www.statnews.com/2026/09/21/trust-in-science-nick-florko-on-understanding-growing-scientific-mistrust/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-21T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O repórter de nova área de confiança em ciência da STAT, Nicholas Florko, relata ter experiência em buscar explicações para problemas de saúde e soluções para eles.", "titulo_pt": "Cético em relação à medicina moderna? Eu entendo o sentimento — e quero ouvir", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 173840, "titulo": "Addiction clinics see rising cases of kratom and 7-OH withdrawal", "url": "https://www.statnews.com/2026/09/21/kratom-withdrawal-addiction-centers-report-surge/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-21T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Clínicas de dependência estão registrando um aumento no número de pacientes dependentes de produtos potentes de kratom e 7-OH.", "titulo_pt": "Clínicas de dependência registram aumento de casos de kratom e 7-OH", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 173841, "titulo": "Opinion: ClinicalTrials.gov needs a pregnancy and lactation checkbox", "url": "https://www.statnews.com/2026/09/21/clinical-trials-website-pregnant-lactating-patients-checkbox/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-21T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "É difícil identificar quais ensaios clínicos pacientes grávidas e lactantes podem participar. Os especialistas propõem uma solução.", "titulo_pt": "Opinião: clinicaltrials.Gov precisa de um campo para gravidez e lactação", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 173873, "titulo": "Forest fire threatens tourist town in Colombian Andes", "url": "https://phys.org/news/2026-09-forest-threatens-tourist-town-colombian.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio florestal estav Dançarinos tiram roupas do chão do Tate Modern para show da Homme Plissé Issey Miyake", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 173902, "titulo": "Heart of the action: why organ couriers are cinema’s new heroes", "url": "https://www.theguardian.com/film/2026/sep/21/human-organ-couriers-action-heroes-resident-evil-runner", "fonte_id": "guardian_culture", "data_pub": "2026-09-21T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Existem vários filmes recentes que destacam entregas de órgãos, como 'Runner', e a entrega de órgãos está se tornando um tema comum em Hollywood, especialmente devido ao interesse em heróis de uma natureza diferente. Os filmes retratam entregas sob pressão, como se vê em 'Resident Evil', onde o tempo é um fator crucial.", "titulo_pt": "No centro da ação: por que os couriers de órgãos são os novos heróis do cinema", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 173731, "titulo": "‘Rustout’: Japan’s other workplace problem", "url": "https://www.japantimes.co.jp/commentary/2026/09/21/japan/japans-rustout-workplace-problem/", "fonte_id": "japan_times", "data_pub": "2026-09-21T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Japão precisa lidar tanto com a sobrecarga de trabalho (burnout) quanto com a desutilização de habilidades (rustout) para garantir que os empregos utilizem efetivamente as habilidades dos funcionários, não apenas mantendo-os ocupados.", "titulo_pt": "Rustout: outro problema do ambiente de trabalho no Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 173194, "titulo": "Com boa audiência e faturamento, Globo mantém programa de Daniel para 2027", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/09/com-boa-audiencia-e-faturamento-globo-mantem-programa-de-daniel-para-2027.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-21T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Globo decidiu manter o programa Viver Sertanejo, apresentado por Daniel, na sua grade de programação para 2027, devido ao bom desempenho em termos de audiência e faturamento.", "titulo_pt": "Globo renova viver sertanejo para 2027 com bom desempenho", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 173846, "titulo": "Seungri ties reignite boycott against K-beauty brand JM Solution", "url": "https://www.koreaherald.com/article/10881104", "fonte_id": "korea_herald", "data_pub": "2026-09-21T08:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chamados para boicote à marca de beleza coreana JM Solution se espalharam online após novas informações sobre supostas ligações do ex-membro do BigBang Seungri com a empresa. Daiso, uma cadeia de varejo econômico da Coreia do Sul, é um dos principais canais de venda offline da JM Solution.", "titulo_pt": "Chamados de boicote ressurgem contra marca de beleza coreana por supostas ligações com seungri", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 173195, "titulo": "Como o streaming pode estar esmagando a classe média da música e banalizando discos", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/09/como-o-streaming-pode-estar-esmagando-a-classe-media-da-musica-e-banalizando-discos.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-09-21T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A música está presente em diversos momentos do dia a dia, reproduzida nos fones de ouvido ou alto-falantes, graças à facilidade de acesso ao streaming musical a qualquer hora. Este acesso facilitado tem levado a uma percepção de que a música é trivializada e que a classe média da indústria musical está sendo prejudicada.", "titulo_pt": "Como o streaming pode estar esmagando a classe média da música e banalizando discos", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 173903, "titulo": "‘Our culture is rich and we need our own space’: the fight to build a permanent centre for Deaf people", "url": "https://www.theguardian.com/artanddesign/2026/sep/21/deaf-city-hub-cultural-centre", "fonte_id": "guardian_culture", "data_pub": "2026-09-21T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amanprit Arnold, urbanista e ativista, está lutando para criar um centro permanente para a comunidade surda no Reino Unido, onde 18 milhões de pessoas têm dificuldade de audição, mas não existe um espaço dedicado para essa comunidade.", "titulo_pt": "Nossa cultura é rica e precisamos do nosso próprio espaço: a luta para construir um centro permanente para a comunidade surda", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 173905, "titulo": "Nish Kumar: Angry Humour from a Really Nice Guy review – enraged and extremely funny", "url": "https://www.theguardian.com/stage/2026/sep/21/nish-kumar-review-hackney-empire", "fonte_id": "guardian_culture", "data_pub": "2026-09-21T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nish Kumar apresenta seu espetáculo de stand-up com humor sobre assuntos depressivos, como política e história colonial. O comediante usa seu estilo rápido e linguístico habilidoso para criticar a situação atual.", "titulo_pt": "Nish Kumar: humor irritado de um cara Really Nice", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 173743, "titulo": "Trump gets caught in a dilemma over a Saudi plea for military help", "url": "https://www.japantimes.co.jp/news/2026/09/21/world/politics/trump-saudi-military-help-houthis/", "fonte_id": "japan_times", "data_pub": "2026-09-21T06:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, hesitou mas d -shot-in-face-and-neck-in-sydney-home-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-09-21T08:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um garoto de 11 anos foi levado ao hospital em estado grave após ser atingido por disparos em uma casa em Sydney, na região da noroeste da cidade. Cinco outras pessoas presentes na casa no momento do incidente não foram feridas.", "titulo_pt": "Menino de 11 anos em estado grave após ser baleado no rosto e pescoço em casa de Sydney", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 173330, "titulo": "Maioria da população brasileira se acha saudável, mas um estudo discorda", "url": "https://www.cnnbrasil.com.br/saude/maioria-da-populacao-brasileira-se-acha-saudavel-mas-um-estudo-discorda/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-21T06:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A maioria dos brasileiros se considera saudável, mas estudos indicam que 63% estão acima do peso e 42% nunca praticam atividade física, que são fatores de risco para o câncer.", "titulo_pt": "Maioria dos brasileiros se acha saudável, mas estudo mostra contrariamente", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 173776, "titulo": "Easy access to family guns fuels Philippine school shootings", "url": "https://www.scmp.com/week-asia/health-environment/article/3368218/easy-access-family-guns-fuels-philippine-school-shootings?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-21T06:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Filipinas registrou três tiroteios letais em escolas desde junho. Em todos os casos, pelo menos uma das armas era de um parente que trabalhava no governo ou na força de law enforcement, seja como arma de serviço oficial ou como arma licenciada. No último incidente, um estudante de uma escola no sul da Cotabato usou uma arma licenciada do pai, funcionário do Departamento de Educação, para do suas famílias na gaza: 'tive que continuar para encontrar comida para os filhos'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 173623, "titulo": "The cruel fate of Daniel Ortega's opponents detained by ICE", "url": "https://www.lemonde.fr/en/international/article/2026/09/21/the-cruel-fate-of-daniel-ortega-s-opponents-detained-by-ice-in-the-us_6757746_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-20T22:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nos últimos meses, nove oponentes do regime nicaragüense que buscavam asilo nos Estados Unidos foram detidos pelas autoridades de imigração dos EUA. Embora Washington tenha criticado regularmente as excessões ditatoriais do regime nicaragüense, a detenção dessas pessoas ocorreu enquanto aguardavam decisões sobre seus pedidos de asilo.", "titulo_pt": "A cruel destino dos oponentes de Ortega detidos pela ICE", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 173440, "titulo": "Asia Menor: “Somos los más viejos de los cabros chicos y los más jóvenes de los cabros viejos”", "url": "https://www.ciperchile.cl/2026/09/20/asia-menor-somos-los-mas-viejos-de-los-cabros-chicos-y-los-mas-jovenes-de-los-cabros-viejos/?utm_source=rss&utm_medium=rss&utm_campaign=asia-menor-somos-los-mas-viejos-de-los-cabros-chicos-y-los-mas-jovenes-de-los-cabros-viejos", "fonte_id": "ciper_chile", "data_pub": "2026-09-20T22:04:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A frase 'Somos os mais velhos dos jovens e os mais jovens dos velhos' foi usada em uma entrada publicada no CIPER Chile, provavelmente para ilustrar a complexa posição da Turquia em relação a sua identidade cultural e histórica.", "titulo_pt": "Asia Menor: 'somos os mais velhos dos jovens e os mais jovens dos velhos'", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 173059, "titulo": "Papa León XIV llama a la comunidad internacional a apoyar a Somalia ante grave function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);

           return `<div class="item" data-flag-url="${esc(n.url)}">

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">

      <div class="dmeta">

      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}

  return `<div>

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;
