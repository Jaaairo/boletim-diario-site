<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "25/11/2026 07:31", "stats": {"noticias_novas": 764, "resumos_gerados": 249}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Projeto de Lei das Big Techs, que será votado na próxima semana, é um dos principais eventos políticos no Brasil. O relator Aliel Machado finalizou o texto e espera que ele seja apreciado na terça-feira. Paralelamente, o governo Lula liberou R$ 3,4 bilhões do Orçamento de 2026, após reduzir gastos obrigatórios e excluir R$ 10,5 bilhões da meta fiscal. Outro destaque é a decisão do presidente do Senado, Davi Alcolumbre, que planeja anular votos dos senadores que exibirem a cédula de votação durante a eleição para a Mesa Diretora do Senado. Além disso, a CNI ingressou com uma ação no STF contra o decreto e a portaria que regulamentam a jornada 5x2 no Brasil, pedindo a suspensão imediata dessas normas.", "mundo": "O mundo enfrenta uma série de desafios, principalmente relacionados ao clima e à economia. Na Grã-Bretanha, as contas de energia aumentaram em 26%, afetando diretamente os cidadãos. Na China, o governo está investigando Chen Jining, membro do Politburo, em uma nova onda de purgas antidesonestidade. Na América Latina, Javier Milei, presidente do Partido Libertador, enfrenta críticas e desafios econômicos. O Brasil, por sua vez, decidiu não nomear um embaixador no país vizinho. No cenário político, Donald Trump considera a possibilidade de conceder um perdão a Huang, CEO da Nvidia, em meio a debates sobre cooperação econômica com a Rússia. Essas decisões e reações refletem a complexidade dos desafios globais contemporâneos, incluindo questões de segurança, justiça e economia.\n\nA Rússia continua expandindo suas ambições geopolíticas, conforme declarou o chanceler alemão, Friedrich Merz, que alertou sobre objetivos além da Ucrânia. Em outro desenvolvimento, um ataque israelense em Gaza resultou na morte de quatro pessoas, incluindo um funcionário de segurança do Hamas. A Coreia do Norte expulsou o chefe da embaixada suíça após uma visita do ministro suíço dos Assuntos Exteriores, indicando tensões diplomáticas. O encontro entre líderes dos Estados Unidos, China e Rússia em Shenzhen, embora não significativo, gerou preocupações sobre a remilitarização do Japão para Pequim. Além disso, hackers acessaram registros oficiais da Rússia e sugeriram que o número de mortos na Ucrânia pode ultrapassar 700.000, refletindo a intensidade da guerra. As tensões continuam a se espalhar, com a escalada de ataques e ameaças de grupos rebeldes e ações militares de países como Israel e a Polônia.", "economia": "A economia brasileira enfrenta vários desafios, especialmente a incerteza sobre a compensação dos créditos da CBS, que pode afetar o fluxo de caixa das empresas exportadoras, conforme relatado pela Folha de S. Paulo. O Banco Central anunciou leilões de venda de dólares, totalizando até US$ 2 bilhões, em uma tentativa de manter a estabilidade cambial. O dólar encerrou o dia cotado a R$ 5,91, em queda, após a sanção do pacote fiscal pelo presidente Lula. Diante dessas incertezas, a Argentina entrou em recessão técnica com a contração da economia em setembro, marcando o segundo trimestre consecutivo de decréscimo, segundo a Infomoney. Por outro lado, a Xiamen Airlines, da China, acertou a compra de 50 aviões Boeing 737-8, em um acordo avaliado em aproximadamente US$ 7,4 bilhões, conforme informado pelo CNBC Internacional. No cenário internacional, os Emirados Árabes Unidos estão otimistas sobre um crescimento econômico de 7% a 8% no próximo ano, de acordo com a Fundação Monetária Internacional, enquanto a BYD, fabricante de veículos elétricos chinesa, planeja assinar um memorando de entendimento com o estado de Minas Gerais, no Brasil, para construir uma fábrica de ônibus, caminhões e vans elétricos.", "tecnologia": "As ações da tecnologia tendem a abrir em baixa, de acordo com a Financial Times, devido à diminuição da confiança no comércio de inteligência artificial. A Samsung Electro-Mechanics planeja cancelar 1,73 trilhões de wones de suas próprias ações, informou a Yonhap News. A Naver compartilhou as lições aprendidas com a construção e operação de seus centros de dados durante uma sessão lateral da reunião da ONU em Genebra, conforme relatado pelo Korea Herald. A China lançou seu primeiro padrão de qualidade específico para equipamentos e componentes de semicondutores, enfatizando a importância da confiabilidade dos fornecedores, segundo o Digitimes. Além disso, um sistema não classificado da CIA foi brechado, informou a Associated Press, mas não houve comprometimento de informações classificadas, conforme o CNBC International. O retorno de Jensen Huang à Nvidia, que lidera a corrida global em inteligência artificial, gerou alívio na indústria, mas incertezas permanecem, conforme relatado pelo Taipei Times.", "ciencia": "Um dos eventos mais importantes mencionados é a descoberta do quasar mais antigo conhecido, com 13,1 bilhões de anos, identificado recentemente pelos astrônomos. Este achado, ainda um mistério para os pesquisadores, destaca a importância da pesquisa cosmológica. Paralelamente, a Voyager 1, que atingiu um marco histórico, pode estar enfrentando problemas técnicos, como a transmissão de sinais vazios, levantando preocupações sobre a longevidade de sua missão. Outros temas abordados incluem o desenvolvimento de novas tecnologias para centros de dados, o uso de nanotecnologia em semicondutores, e a descoberta de um novo salp que vive exclusivamente no oceano profundo, além de avanços na edição genética e no entendimento da função dos mitocôndrios em células. Estes avanços científicos e tecnológicos demonstram a diversidade e a profundidade do conhecimento atual em diversas áreas da ciência.", "cultura": "A cultura global continua a evoluir com diversos temas e perspectivas. O Castelo de Shuri, em Okinawa, reabriu oficialmente após sua restauração histórica, oferecendo um novo espaço para os visitantes apreciarem sua rica herança. Em outro desenvolvimento cultural, Nathan Fielder, conhecido pelo programa 'Tudo Pode Ser Visto', está lançando um filme sobre magia que será exibido nos cinemas brasileiros, demonstrando seu interesse por essa arte. Na indústria cinematográfica, a plataforma Tidal anunciou que vai banir completamente a música gerada por inteligência artificial de sua plataforma, justificando que isso 'diverge os streams e royalties dos artistas e confunde os fãs'.", "sociedade": "A Colômbia anunciou o resgate com vida de todos os reféns secuestrados em um supermercado durante a madrugada, após estarem sob custódia por mais de 16 horas. No Brasil, a Polícia Civil do Rio de Janeiro investiga um esquema de tráfico de recém-nascidos para a Tailândia, com estrangeiros presos no estado. Em Santiago, professores realizaram uma marcha contra cortes orçamentários na educação, enquanto a maior força policial do Reino Unido enfrenta acusações de racismo institucional. O presidente Lee Jae Myung, da Coreia do Sul, prometeu revisar a legislação para punir a violência doméstica, mesmo sem a solicitação da vítima. Em Suriname, o país se juntou à Aliança para a Saúde Primária nas Américas, buscando melhorar o acesso e a qualidade dos serviços de saúde primária.", "meio_ambiente": "As negociações climáticas na COP31 em Antalya, na Turquia, foram consideradas um 'fracasso' devido a impasses entre grandes potências e bloqueios em temas centrais, conforme declarou Marina Silva. O evento também destacou a continuidade dos desafios climáticos, como incêndios florestais em Flinders Island, na Austrália, e inundações na região das Ilhas Galápagos, no Equador, devido ao fenômeno El Niño. Além disso, a COP31 não chegou a um acordo claro sobre um 'pacto' que abordava alimentos, florestas, oceanos e natureza. No Brasil, foi aprovada a redução de 31% na emissão de metano em um estabelecimento leiteiro na província de Córdoba, e a LATAM e Siemens firmaram um acordo para reduzir as emissões de gases do efeito estufa dos voos de negócios de seus funcionários através do uso de atributos ambientais associados ao SAF. No exterior, a indústria de mineração enfrenta pressões ambientais, com campanhas pedindo ao governo australiano que rejeite a expansão de uma mina de carvão na região de Hunter Valley, na Nova Gales do Sul.", "direitos_humanos": "A UNICEF associa a epidemia de Ebola na República Democrática do Congo a um aumento da violência contra mulheres e meninas, com o vírus já tendo causado mais de 5.800 mortes desde maio. Em outro caso, a deputada estadual Mônica Seixas, do Psol-SP, retornou ao Brasil após ser deportada por Israel, reafirmando que 'resistir não é crime'. A ONU Mulheres informa que cinco mulheres são assassinadas a cada hora por parceiros ou parentes em todo o mundo, com a casa sendo o local mais perigoso para mulheres e meninas. Além disso, as famílias estão sob pressão devido à Ebola, com as mulheres e garotas suportando grande parte do impacto. Em um caso legal nos Estados Unidos, Kilmar Abrego Garcia, um salvadorenho que se tornou um símbolo da oposição à repressão migratória de Donald Trump, deixou voluntariamente os EUA para a Espanha."}, "resumo_do_dia": {"politica_nacional": [{"id": 285759, "titulo": "PL das Big Techs fica para próxima semana e relator promete surpresa", "url": "https://veja.abril.com.br/politica/pl-das-big-techs-fica-para-proxima-semana-e-relator-promete-surpresa/", "fonte_id": "veja", "data_pub": "2026-11-25T09:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relator Aliel Machado está finalizando o projeto de lei das Big Techs e prevê sua apreciação na próxima terça-feira. Ele já alinhou com o líder da base aliada, Motta, sobre o cronograma.", "titulo_pt": "PL das Big Techs para a próxima terça-feira e relator promete surpresa", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 285718, "titulo": "PL recua de candidatura própria e deve apoiar emedebista para presidir Câmara paulistana", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/pl-recua-de-candidatura-propria-e-deve-apoiar-emedebista-para-presidir-camara-paulistana.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-25T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido Liberal (PL) decidiu apoiar a candidatura do vereador João Jorge (MDB) à presidência da Câmara Municipal de São Paulo em vez de lançar candidato próprio. Como contrapartida, Jorge prometeu entregar a vice-presidência da Casa ao PL.", "titulo_pt": "PL apóia candidatura do emedebista joão jorge à presidência da Câmara de são paulo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 285804, "titulo": "E o STF?", "url": "https://www.metropoles.com/blog-do-noblat/enquetes/e-o-stf", "fonte_id": "metropoles", "data_pub": "2026-11-25T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A enquete perguntava sobre o Supremo Tribunal Federal (STF).", "titulo_pt": "E o STF?", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 285806, "titulo": "Wellington Dias pode virar líder do governo no Senado", "url": "https://www.metropoles.com/colunas/milena-teixeira/wellington-dias-pode-virar-lider-do-governo-no-senado", "fonte_id": "metropoles", "data_pub": "2026-11-25T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Wellington Dias, ex-ministro do Desenvolvimento Social do governo petista, pode voltar ao Senado e assumir a articulação do governo Lula.", "titulo_pt": "Wellington Dias pode virar líder do governo no Senado", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 285967, "titulo": "O devido processo como antídoto ao voluntarismo na decisão constitucional", "url": "https://www.jota.info/opiniao-e-analise/colunas/observatorio-constitucional/o-devido-processo-como-antidoto-ao-voluntarismo-na-decisao-constitucional", "fonte_id": "jota", "data_pub": "2026-11-25T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Casos como a Moratória da Soja e a CPI do Crime Organizado ilustram os riscos de desconsiderar o devido processo no STF. O texto sugere que o devido processo é um antídoto contra o voluntarismo nas decisões constitucionais.", "titulo_pt": "O devido processo como antídoto ao voluntarismo na decisão constitucional", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 285808, "titulo": "Eleições de 2028 \"ajudam\" aliado de Valdemar em disputa interna no PL", "url": "https://www.metropoles.com/colunas/vinicius-passarelli/eleicoes-de-2028-ajudam-aliado-de-valdemar-em-disputa-interna-no-pl", "fonte_id": "metropoles", "data_pub": "2026-11-25T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente nacional do PL, Valdemar Costa Neto, e o presidente da Alesp, André do Prado, defendem o nome de Rogério Franco em uma disputa interna dentro do partido.", "titulo_pt": "Eleições de 2028 apoiam aliado de Valdemar em disputa interna no PL", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 285719, "titulo": "Partidos defendem que TSE julgue caso de Deltan Dallagnol antes da diplomação", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/partidos-defendem-que-tse-julgue-caso-de-deltan-dallagnol-antes-da-diplomacao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-25T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A coligação do PT e do PDT defende que o julgamento do caso de Deltan Dallagnol pelo TSE ocorra antes da diplomação dos eleitos, marcada para 17 de dezembro. A ação questiona a candidatura de Deltan Dallagnol ao Senado.", "titulo_pt": "Partidos defendem julgamento de Deltan Dallagnol pelo TSE antes da diplomação", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 285870, "titulo": "Trump diz que perdão para Huang é uma opção, mas não deve ser necessário", "url": "https://www.cnnbrasil.com.br/internacional/trump-diz-que-perdao-para-huang-e-uma-opcao-mas-nao-deve-ser-necessario/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-25T02:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, afirmou que uma possible clemência para Huang, referindo-se provavelmente a Jen-Hsun Huang, CEO da Nvidia, é uma possibilidade, mas provavelmente não será necessária. Huang foi recentemente reintegrado ao cargo de CEO da Nvidia após um período fora.", "titulo_pt": "Trump afirma que perdão para Huang é uma opção, mas provavelmente não será necessária", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 285686, "titulo": "Fux encerra contrato do BRB com TJ-BA e fala em descumprimento de exigências", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/fux-encerra-contrato-do-brb-com-tj-ba-e-fala-em-descumprimento-de-exigencias.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T02:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF Luiz Fux encerrou o contrato de exclusividade entre o BRB e o TJ-BA, após o banco não apresentar os documentos exigidos pela corte. Fux alegou descumprimento das exigências pelo BRB.", "titulo_pt": "Fux encerra contrato do BRB com TJ-BA e fala em descumprimento de exigências", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285687, "titulo": "Governo Lula libera R$ 3,4 bi do Orçamento após excluir mais R$ 10,5 bi da meta fiscal de 2026", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/governo-lula-libera-r-34-bi-do-orcamento-apos-excluir-mais-despesas-da-meta-de-2026.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T02:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula liberou R$ 3,43 bilhões do Orçamento de 2026 após reduzir gastos obrigatórios e excluir R$ 10,5 bilhões da meta fiscal relacionados à subvenção ao diesel.", "titulo_pt": "Governo Lula libera R$ 3,4 bi do Orçamento após excluir R$ 10,5 bi da meta fiscal de 2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285720, "titulo": "Alcolumbre ameaça anular voto do senador que quebrar sigilo de cédula na eleição do Senado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/alcolumbre-ameaca-anular-voto-do-senador-que-quebrar-sigilo-de-cedula-na-eleicao-do-senado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-25T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Senado, Davi Alcolumbre (União Brasil - AP), planeja anular os votos dos senadores que exibirem a cédula de votação no dia da eleição para a Mesa Diretora do Senado. Essa medida foi revelada por Alcolumbre a quatro aliados da Folha.", "titulo_pt": "Alcolumbre ameaça anular votos de senadores que quebrarem sigilo de cédula na eleição do Senado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 285721, "titulo": "O ministério de Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/eliogaspari/2026/11/o-ministerio-de-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-25T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula afirmou que indicará os ministros a seu critério, sem seguir a tradição de consultas antecipadas. As especulações sobre a formação do seu novo ministério diminuíram após a declaração.", "titulo_pt": "O ministério de Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 285722, "titulo": "Disputa pela Casa Civil pode deixar Haddad fora do governo Lula 4", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/11/disputa-pela-casa-civil-pode-deixar-haddad-fora-do-governo-lula-4.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-25T01:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados afirmam que o ex-ministro da Fazenda Fernando Haddad poderá ficar fora do governo Lula 4 caso não seja escalado para o comando da Casa Civil.", "titulo_pt": "Disputa pela Casa Civil pode deixar Haddad fora do governo Lula 4", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 285723, "titulo": "Lula recebe Tarso e Dino em nova rodada de conversas sobre próximo governo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/11/lula-recebe-tarso-e-dino-em-nova-rodada-de-conversas-sobre-proximo-governo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-25T01:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula (PT) deve receber ex-ministros da Justiça Tarso Genro e Flávio Dino nesta quarta-feira (25) para novas conversas sobre a formação de seu próximo governo. Ambos foram chefes da Justiça em mandatos anteriores do petista.", "titulo_pt": "Lula recebe Tarso e Dino em nova rodada de conversas sobre próximo governo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 285724, "titulo": "Em campanha, Alcolumbre recebe bancada feminina e Marinho convida colegas para aniversário", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/11/em-campanha-alcolumbre-recebe-bancada-feminina-e-marinho-convida-colegas-para-aniversario.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-25T00:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Davi Alcolumbre, do União Brasil do Amapá, e Rogério Marinho, do PL do Rio Grande do Norte, estão realizando campanhas para a Presidência do Senado. Eles pretendem se encontrar com colegas senadores em duas agendas separadas nesta quarta-feira (25).", "titulo_pt": "Alcolumbre e Marinho realizam campanhas para presidência do senado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 285690, "titulo": "CNI vai ao Supremo contra regulamentação do governo para fim da escala 6x1", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/cni-vai-ao-supremo-contra-regulamentacao-do-governo-para-fim-da-escala-6x1.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T00:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Confederação Nacional da Indústria protocolou uma ação no STF contra decreto e portaria do governo Lula que regulamentam a redução da jornada de trabalho e a implementação da escala 5x2.", "titulo_pt": "CNI apresenta ação no stf contra regulamentação do governo para escala 5x2", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 286230, "titulo": "Turkish Ruling Party Key Figure Resigns as Market-Rigging Probe Expands", "url": "https://balkaninsight.com/2026/11/25/turkish-ruling-party-key-figure-resigns-as-market-rigging-probe-expands/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-25T09:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hayati Yazici, um cofundador do partido de governo liderado por Erdogan, renunciou após seu filho ser questionado durante a investigação sobre manipulação de mercados financeiros, que abalou o governo.", "titulo_pt": "Figura chave do partido de governo turco renuncia durante inquérito sobre manipulação de mercados", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 286022, "titulo": "‘Russia wants more than Ukraine,’ Germany’s Merz warns – Europe live", "url": "https://www.theguardian.com/world/live/2026/nov/25/ukraine-russia-energy-strikes-mark-rutte-donald-trump-friedrich-merz-germany-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-11-25T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chanceler alemão, Olaf Scholz, alertou que a Rússia tem objetivos além da Ucrânia. Durante sua visita ao Zakarpattia, o primeiro-ministro húngaro, Péter Magyar, anunciou a normalização das relações com a Ucrânia e enfatizou a proteção dos direitos dos húngaros residentes na região.", "titulo_pt": "Alemanha: scholz avisa que Rússia quer mais do que Ucrânia; húngaro normaliza relações com Ucrânia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 286117, "titulo": "The loss and damage fund exists, but the money doesn't", "url": "https://www.dw.com/en/the-loss-and-damage-fund-exists-but-the-money-doesn-t/a-80035620?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-25T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Países vulneráveis ao clima lutaram por anos para criar um fundo de perdas e danos, mas quatro anos depois, a demanda ultrapassa a financiamento disponível, há poucas promessas de doação e as nações afetadas por desastres ainda aguardam assistência.", "titulo_pt": "O fundo de perdas e danos existe, mas o dinheiro não", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 285733, "titulo": "Trump cogita conceder perdão a Huang: “É sempre uma opção”", "url": "https://www.poder360.com.br/poder-internacional/trump-cogita-conceder-perdao-a-huang-e-sempre-uma-opcao/", "fonte_id": "poder360", "data_pub": "2026-11-25T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, considerou a possibilidade de conceder um perdão a Huang, CEO da Nvidia, mas provavelmente não será necessário.", "titulo_pt": "Trump pensa em conceder perdão a ceo da nvidia", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 286063, "titulo": "China investigates Politburo member and Shanghai party chief Chen Jining", "url": "https://www.npr.org/2026/11/25/nx-s1-6053801/china-investigation-politburo-shanghai-party", "fonte_id": "npr_news", "data_pub": "2026-11-25T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O membro do Politburo Chen Jining, que também é o chefe do Comitê do Partido em Shanghai, está sendo investigado. Esta é a última alta autoridade alvo da longa campanha antidesonestidade de Presidente Xi Jinping, que não mostra sinais de diminuir em escala ou profundidade.", "titulo_pt": "China investiga membro do Politburo e chefe do comitê do partido de Shanghai Chen Jining", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 286220, "titulo": "Via libera a impennata del 26% delle bollette energetiche in Gb, pesa la guerra", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/25/via-libera-a-impennata-del-26-delle-bollette-energetiche-in-gb-pesa-la-guerra_e7b543ec-4071-4dd1-9280-e1957eb9cbae.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-25T09:41:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "As contas de energia aumentaram em 26% na Grã-Bretanha. A Autoridade justifica o aumento com a situação no Oriente Médio. O governo Burnham enfrenta essa situação.", "titulo_pt": "Libertade para aumento de 26% nas faturas de energia na grã-bretanha, pesa a guerra", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 285978, "titulo": "Javier Milei y sus medidas, en vivo: la economía en recesión técnica y las reuniones por la ley de ludopatía", "url": "https://www.lanacion.com.ar/politica/javier-milei-y-sus-medidas-en-vivo-la-economia-crecio-11-en-septiembre-y-avanzan-las-charlas-por-la-nid25112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-25T09:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A notícia aborda as decisões e reações em torno do Presidente Javier Milei, focando em medidas econômicas durante uma recesão técnica e em reuniões relacionadas à lei de ludopatia. As informações são apresentadas em tempo real, com declarações dos envolvidos.", "titulo_pt": "Javier Milei e suas medidas, em tempo real: economia em recessão técnica e reuniões sobre lei de ludopatia", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 286221, "titulo": "Istat, 'una donna su 3 ha subito almeno una violenza nella vita'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/25/istat-una-donna-su-3-ha-subito-almeno-una-violenza-nella-vita_227064ac-6dfc-46ad-a072-b8cb942ba2cc.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-25T09:35:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O relatório indica que 31,5% das mulheres entre 16 e 75 anos na Itália relataram ter sofrido ao menos uma violência durante a vida. O estudo se baseia em dados de aproximadamente 7 milhões de mulheres nessa faixa etária.", "titulo_pt": "1 Em 3 mulheres sofreu violência ao longo da vida, de acordo com estudo", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 286222, "titulo": "Ft, Trump accantona accordi commerciali con Mosca come incentivo per fine guerra", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/25/ft-trump-accantona-accordi-commerciali-con-mosca-come-incentivo-per-fine_14ab2bad-95f9-427b-9d54-57851355838c.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-25T09:33:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O Kremlin demonstrou pouco interesse nas negociações comerciais com Moscou, focando-se nos territórios. O presidente Trump considerou essas negociações como um incentivo para o fim da guerra.", "titulo_pt": "Trump ignora acordos comerciais com moscou como incentivo para o fim da guerra", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 286223, "titulo": "Il Papa, 'guerre visibili e ibride, conflitti sempre più disumani'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/25/il-papa-guerre-visibili-e-ibride-conflitti-sempre-piu-disumani_f2c95643-f617-4b2e-89af-7ac24689722f.html", "fonte_id": "ansa_italy", "data_pub": "2026-11-25T09:31:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O Papa abordou o tema das guerras visíveis e híbridas, destacando que os conflitos estão se tornando cada vez mais inhumanos. Ele também mencionou que a linha entre proteção e agressão está se tornando cada vez mais tênue.", "titulo_pt": "O Papa, guerras visíveis e híbridas, conflitos cada vez mais inhumanos", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 286326, "titulo": "Despite stalling in court, Trump restrictions on foreign students have had a chilling effect on enrollment", "url": "https://www.statnews.com/2026/11/25/foreign-students-us-biomedical-science-enrollment-drop-trump/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-25T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os dados mostram uma clara diminuição no número de estudantes internacionais graduados, um componente importante da força de trabalho biomédica dos Estados Unidos. Embora as restrições impostas por Trump estejam em pausa judicial, elas já tenham causado um efeito desalentador na matrícula.", "titulo_pt": "Embora as restrições de Trump para estudantes internacionais estejam em pausa judicial, elas já tenham reduzido a matrícula de graduados estrangeiros", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 285893, "titulo": "Os riscos que Trump corre com a volta de Jensen Huang ao comando da Nvidia", "url": "https://www.bbc.com/portuguese/articles/cqdj1xz29jkdo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-25T09:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos interveio para reeleger Jensen Huang como CEO da Nvidia. Esta ação uniu os destinos de Trump e Huang de maneira inseparável.", "titulo_pt": "Riscos para Trump com a volta de Jensen Huang como ceo da Nvidia", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 286237, "titulo": "Israeli strike in Gaza kills Hamas security chief, wife and teenage daughters", "url": "https://www.scmp.com/news/world/middle-east/article/3375752/israeli-strike-gaza-kills-hamas-security-chief-wife-and-teenage-daughters", "fonte_id": "scmp", "data_pub": "2026-11-25T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque israelense em uma área residencial do campo de refugiados Al-Shati, perto de Gaza City, resultou na morte de quatro pessoas, incluindo um funcionário de segurança do Hamas, sua esposa e duas filhas, e feriu 12 outras. O civil defence, que opera sob o Hamas, forneceu essas informações.", "titulo_pt": "Ataque israelense em Gaza mata oficial de segurança do Hamas, esposa e duas filhas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 286224, "titulo": "Jarvis (easyJet), 'fiducioso del potenziale di crescita per i prossimi anni'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/11/25/jarvis-easyjet-fiducioso-del-potenziale-di-crescita-per-i-prossimi-anni_6fa469dd-bdb3-474e-9874-b97f44165bf2.html", "fonte_ tatal e capacidade industrial excessiva. Os resultados desta investigação do Representante do Comércio dos EUA podem ser anunciados em breve, segundo relatos do The Wall Street Journal.", "titulo_pt": "Guerra comercial eua-china em limbo com novas tarifas próximas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 285963, "titulo": "Procedimento judicial não tem início com o pagamento das custas, decide Carf", "url": "https://www.jota.info/tributos/procedimento-judicial-nao-tem-inicio-com-o-pagamento-das-custas-decide-carf", "fonte_id": "jota", "data_pub": "2026-11-25T09:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os conselheiros do CARF decidiram que o procedimento judicial não inicia com o pagamento das custas, mas sim com o protocolo da petição inicial. Eles também validaram a cobrança de IRPJ e CSLL contra a Caixa.", "titulo_pt": "Processo judicial não começa com o pagamento das custas, decide Carf", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 285805, "titulo": "Turismo de eventos fortalece economia ao movimentar bilhões por ano no país", "url": "https://www.metropoles.com/vida-e-estilo/turismo/turismo-de-eventos", "fonte_id": "metropoles", "data_pub": "2026-11-25T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os eventos corporativos e os esportivos de participação foram os segmentos que mais se destacaram no último ano, contribuindo para o fortalecimento da economia através do movimento de bilhões de reais por ano no país.", "titulo_pt": "Turismo de eventos fortalece economia ao movimentar bilhões por ano no país", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 285851, "titulo": "Estoques de concentrado de ferro brasileiro triplicam em portos chineses", "url": "https://www.cnnbrasil.com.br/infra/estoques-de-concentrado-de-ferro-brasileiro-triplicam-em-portos-chineses/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-25T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os estoques de concentrado de ferro brasileiro armazenados em dez portos chineses triplicaram em quatro semanas, passando de 550 mil para 1,83 milhões de toneladas. O preço do produto caiu 2,8%.", "titulo_pt": "Estoques de concentrado de ferro brasileiro triplicam em portos chineses", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 285964, "titulo": "Manipulação sem controle pode matar", "url": "https://www.jota.info/opiniao-e-analise/artigos/manipulacao-sem-controle-pode-matar", "fonte_id": "jota", "data_pub": "2026-11-25T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa está elaborando uma minuta que amplia os riscos sanitários associados à manipulação de canetas emagrecedoras.", "titulo_pt": "Manipulação de canetas emagrecedoras pode aumentar riscos sanitários", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 286195, "titulo": "GPIF agenda may signal portfolio review progress, JPMorgan says", "url": "https://www.japantimes.co.jp/business/2026/11/25/gpif-portfolio-review-progress/", "fonte_id": "japan_times", "data_pub": "2026-11-25T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A GPIF pode estar planejando revisar sua carteira, o que pode reviver especulações de que ela aumentará a alocação para títulos nacionais no seu portfólio de ¥314 trilhões.", "titulo_pt": "Desenvolvimento pode indicar progresso na revisão do portfólio da GPIF, diz JPMorgan", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 285966, "titulo": "Qualidade da AIR: indicadores de Antaq, ANTT e Anvisa e panorama das 12 agências", "url": "https://www.jota.info/opiniao-e-analise/artigos/qualidade-da-air-indicadores-de-antaq-antt-e-anvisa-e-panorama-das-12-agencias", "fonte_id": "jota", "data_pub": "2026-11-25T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O título traduzido para português brasileiro é: 'Qualidade da AIR: indicadores de Antaq, ANTT e Anvisa e panorama das 12 agências'. O texto discute como a análise prévia, pontuação e avaliação posterior demonstram como a AIR se institucionalizou nas agências federais.", "titulo_pt": "Qualidade da AIR: indicadores de Antaq, ANTT e Anvisa e panorama das 12 agências", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 286305, "titulo": "S. Korean won weakens slightly against U.S. dollar on foreign outflows", "url": "https://en.yna.co.kr/view/AEN20261125007800320", "fonte_id": "yonhap_news", "data_pub": "2026-11-25T07:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O won sul-coreano enfraqueceu levemente em relação ao dólar americano devido a saídas de capitais externos. A informação foi divulgada em Seul, 25 de novembro, pela Yonhap.", "titulo_pt": "Won sul-coreano enfraquece ligeiramente contra o dólar americano devido a saídas de capitais", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 285681, "titulo": "Incertezas sobre a compensação de créditos da CBS podem impactar o fluxo de caixa das empresas exportadoras", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/11/incertezas-sobre-a-compensacao-de-creditos-da-cbs-podem-impactar-o-fluxo-de-caixa-das-empresas-exportadoras.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A extinção do PIS e da Cofins e o início da cobrança da CBS em 2027 levantam dúvidas sobre a possibilidade de compensação de créditos dessa contribuição com outros tributos federais. Essa incerteza pode afetar o fluxo de caixa das empresas exportadoras.", "titulo_pt": "Incertezas sobre a compensação de créditos da CBS podem impactar o fluxo de caixa das empresas exportadoras", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285683, "titulo": "Mercado vê avanço no plano Moretti, mas espera novas medidas para conter gastos de forma estrutural", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/mercado-ve-avanco-no-plano-moretti-mas-espera-novas-medidas-para-conter-gastos-de-forma-estrutual.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A aprovação do plano Moretti pela Câmara foi vista pelo mercado financeiro como um passo positivo, indicando a intenção do governo de avançar na agenda de ajuste fiscal. As medidas buscam aumentar a arrecadação e controlar os gastos a partir do próximo ano, com um impacto estimado entre R$ 46 bilhões e R$ 56 bilhões em 2027.", "titulo_pt": "Mercado recebe bem plano Moretti, mas espera novas medidas para controlar gastos estruturais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 285684, "titulo": "Justiça condena XP e assessoria por atraso em transferência de CDBs do Master que impediu cobertura do FGC", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/justica-condena-xp-e-assessoria-por-atraso-em-transferencia-de-cdbs-do-master-que-impediu-cobertura-do-fgc.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-25T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A 3ª Vara Cível da Comarca de Paulínia (SP) condenou a XP Investimentos e a assessoria Mônaco Investimentos por falhas na transferência de CDBs do Banco Master, o que resultou em um atraso que impediu a cobertura pelo Fundo Garantidor de Créditos (FGC).", "titulo_pt": "Justiça condena XP e assessoria por atraso na transferência de CDBs do Master que impediu cobertura do FGC", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 286206, "titulo": "Tokio Marine unit plans to boost hedged foreign currency bonds", "url": "https://www.japantimes.co.jp/business/2026/11/25/companies/tokio-marine-boost-currency-overseas-bonds/", "fonte_id": "japan_times", "data_pub": "2026-11-25T05:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A unidade de seguros Tokio Marine & Nichido Anshin Life Insurance planeja aumentar suas apostas em títulos de dívida em moeda estrangeira protegidos, buscando retornos fora do mercado doméstico, enquanto outros concorrentes estão movendo dinheiro de volta para o Japão.", "titulo_pt": "Unidade de seguros tokio Marine planeja aumentar investimentos em títulos hedgados em moeda estrangeira", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 285968, "titulo": "Jurídico bom é o que ninguém nota. Será?", "url": "https://www.jota.info/opiniao-e-analise/artigos/juridico-bom-e-o-que-ninguem-nota-sera", "fonte_id": "jota", "data_pub": "2026-11-25T04:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto sugere que excesso de combate ao jurídico que trava pode levar a outro ideal igualmente problemático: o jurídico que se acomoda. Ele alerta para o perigo de criar um novo paradigma jurídico que possa ser igualmente prejudicial.", "titulo_pt": "Bom jurídico é o que ninguém percebe. Mas será?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 286141, "titulo": "‘Ready for any storm’: UAE minister optimistic on economy as IMF lifts forecast", "url": "https://www.cnbc.com/2026/11/25/uae-iran-war-economy-oil.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-25T04:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O emirado dos Árabes Unidos (UAE) está otimista sobre atingir um crescimento econômico de 7% a 8% no próximo ano, baseando-se em um modelo econômico diferente. A Fundação Monetária Internacional (FMI) elevou suas projeções para a economia do país.", "titulo_pt": "Pronto para qualquer tempestade: ministro dos emirados árabes unidos otimista sobre a economia com previsão do fmi", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 286295, "titulo": "Samsung Electro-Mechanics to cancel 1.73 tln won worth of own shares", "url": "https://en.yna.co.kr/view/AEN20261125010200320", "fonte_id": "yonhap_news", "data_pub": "2026-11-25T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung Electro-Mechanics planeja cancelar 1,73 trilhões de wones de ações próprias. A empresa é fabricante de equipamentos de energia.", "titulo_pt": "Samsung Electro-Mechanics planeja cancelar 1,73 trilhões de wones de ações próprias", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 286379, "titulo": "Payhawk backer Eleven secures €57M first close for Fund IV", "url": "https://tech.eu/2026/11/25/payhawk-backer-eleven-secures-eur57m-first-close-for-fund-iv/", "fonte_id": "tech_eu", "data_pub": "2026-11-25T09:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de investimento Eleven, que já investiu em mais de 160 startups na Europa, conseguiu arrecadar €57 milhões para seu quarto fundo. O European Investment Fund (EIF) participou novamente do investimento.", "titulo_pt": "Investidor Eleven obtém €57M para seu quarto fundo", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 285734, "titulo": "Falha em radar afeta mais de 300 voos nos EUA", "url": "https://www.poder360.com.br/poder-internacional/falha-em-radar-afeta-mais-de-300-voos-nos-eua/", "fonte_id": "poder360", "data_pub": "2026-11-25T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um problema no radar afetou mais de 300 voos nos Estados Unidos, com o problema concentrado no Aeroporto Internacional O'Hare, em Chicago, um dos maiores do país.", "titulo_pt": "Falha no radar afeta mais de 300 voos nos EUA", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 285848, "titulo": "Investigadores descobrem falha em roteador que parou voos nos EUA; entend entist", "pais": "Reino Unido", "classe": "B"}, {"id": 285974, "titulo": "La revelación de Reid Wiseman, comandante de Artemis II, al hablar de las próximas misiones de la NASA", "url": "https://www.lanacion.com.ar/el-mundo/reid-wiseman-comandante-de-artemis-ii-conto-que-espera-de-las-proximas-misiones-estoy-ansioso-por-nid25112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-25T09:51:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Após o retorno à Terra, Donald Trump entregou a cada tripulante uma Medalla de Honor Espacial do Congresso durante uma cerimônia no Centro Espacial Johnson de Houston. O astronauta Reid Wiseman, comandante da missão Artemis II, não fez declarações específicas durante a cerimônia, mas a notícia se refere a sua participação nela.", "titulo_pt": "Revelação de Reid Wiseman, comandante de Artemis II, sobre as próximas missões da NASA", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 286325, "titulo": "Opinion: Washington and Beijing are building walls around biotechnology. That’s the wrong approach", "url": "https://www.statnews.com/2026/11/25/us-china-biotech-race-policy-data/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-25T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dados mostram que o confronto entre Estados Unidos e China na biotecnologia não se trata de uma única corrida, mas de várias competições separadas, escreve Michael S. Kinch.", "titulo_pt": "Opinião: washington e Beijing estão construindo muros na biotecnologia. Isso é o erro certo", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 285934, "titulo": "Un estudio descubre nuevos beneficios para la salud al comer palta todos los días", "url": "https://www.latercera.com/tendencias/noticia/un-estudio-descubre-nuevos-beneficios-para-la-salud-al-comer-palta-todos-los-dias/", "fonte_id": "la_tercera", "data_pub": "2026-11-25T09:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo testou o consumo diário de duas frutas populares durante oito semanas e observou mudanças em indicadores de saúde cardiovascular. O consumo diário de palma foi um dos alimentos testados.", "titulo_pt": "Estudo descobre novos benefícios para a saúde ao comer palma todos os dias", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 285698, "titulo": "Astrônomos detectam o quasar mais antigo conhecido, com 13,1 bilhões de anos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/astronomos-detectam-o-quasar-mais-antigo-conhecido-com-131-bilhoes-de-anos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-25T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Astrônomos identificaram o quasar mais antigo já conhecido, com 13,1 bilhões de anos. A formação desse quasar tão cedo na história cósmica ainda é um mistério para os pesquisadores.", "titulo_pt": "Astrônomos detectam o quasar mais antigo conhecido, com 13,1 bilhões de anos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 286389, "titulo": "AI is forcing researchers to confront the possibility of artificial minds", "url": "https://www.newscientist.com/article/2600589-ai-is-forcing-researchers-to-confront-the-possibility-of-artificial-minds/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-11-25T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Neurocientistas e filósofos se reuniram em uma conferência para discutir 'entidades de mente exóticas' e como assistentes de chatbot podem estar moldando nossas próprias mentes.", "titulo_pt": "A IA está forçando os pesquisadores a confrontar a possibilidade de mentes artificiais", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 286247, "titulo": "China-Pakistan crewed space mission was a decade in the making: minister", "url": "https://www.scmp.com/news/china/science/article/3375722/china-pakistan-crewed-space-mission-was-decade-making-minister", "fonte_id": "scmp", "data_pub": "2026-11-25T07:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Colaboração entre China e Paquistão em missões espaciais tripuladas começou há cerca de uma década, de acordo com um alto funcionário paquistanês. O primeiro astronauta do Paquistão, Muhammad Zeeshan Ali, está a bordo da tripulação tripulada Shenzhou-24 que partiu para a Estação Espacial Tiangong.", "titulo_pt": "Missão espacial tripulada china-paquistão levou cerca de uma década para se concretizar", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 285699, "titulo": "Quer cuidar da memória e melhorar a concentração? Neurocientista tira dúvidas em live da CasaFolha", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/quer-cuidar-da-memoria-e-melhorar-a-concentracao-neurocientista-tira-duvidas-em-live-da-casafolha.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-25T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um neurocientista realizou uma live na CasaFolha para responder perguntas sobre memória, concentração e inteligência artificial. O evento abordou dúvidas relacionadas a melhorar essas habilidades cognitivas e ao impacto da tecnologia na inteligência humana.", "titulo_pt": "Quer melhorar a memória e a concentração? Neurocientista responde dúvidas em live da CasaFolha", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 285864, "titulo": "Logo após atingir um marco histórico, a Voyager 1 pode estar em apuros tenebrosos; retornando apenas um “sinal portador” vazio", "url": "https://www.cnnbrasil.com.br/ciencia/logo-apos-atingir-um-marco-historico-a-voyager-1-pode-estar-em-apuros-tenebrosos-retornando-apenas-um-sinal-portador-vazio/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-25T06:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Engenheiros estão investigando se o subsistema de dados de voo da Voyager 1, que atingiu um marco histórico, apresentou um defeito após três anos de operação sem problemas. A espaçonave pode estar retornando apenas um sinal vazio, o que poderia indicar problemas no sistema de transmissão de dados.", "titulo_pt": "Logo após atingir um marco histórico, Voyager 1 pode estar em apuros tenebrosos; retornando apenas um “sinal portador” vazio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 286386, "titulo": "APOD: 2026 November 25 – SPHEREx Seeing Through Dust", "url": "https://science.nasa.gov/image-article/apod-2026-november-25-spherex-seeing-through-dust/", "fonte_id": "nasa_news", "data_pub": "2026-11-25T05:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia do APOD em 25 de novembro de 2026 apresenta os resultados do SPHEREx, um telescópio que busca observar através da poeira interestelar.", "titulo_pt": "APOD: 25 de novembro de 2026 – SPHEREx visualizando através da poeira", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 286387, "titulo": "Georgia’s Pecan Belt", "url": "https://science.nasa.gov/earth/earth-observatory/georgias-pecan-belt/", "fonte_id": "nasa_news", "data_pub": "2026-11-25T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde um boom de plantio no início do século XX, as plantações de caju na região flinthiana de Georgia, nos Estados Unidos, se tornaram um centro da produção de caju americana.", "titulo_pt": "Belt de cajueiro da geórgia", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 286328, "titulo": "New EU Bureaucracy Index: EU law has more than doubled since 2010", "url": "https://phys.org/news/2026-11-eu-bureaucracy-index-law.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T04:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O novo Índice de Burocracia da UE mede o volume de legislação em vigor na UE e registra um recorde alto: em 2025, as regulamentações e diretrizes em vigor totalizaram aproximadamente 47.600 páginas padrão, 118% a mais do que em 2010. A legislação da UE dobrou em 15 anos e continuou a crescer em 2025, com as principais causas sendo as regulamentações de sanções e novos conjuntos de regras em legislação ambiental, de consumidores e de saúde.", "titulo_pt": "Novo índice de burocracia da ue: legislação da ue dobrou desde 2010", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 286329, "titulo": "Queensland keeps learning disaster lessons. So why do we keep forgetting them?", "url": "https://phys.org/news/2026-11-queensland-disaster-lessons.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com o início precoce da temporada de tempestades na Queensland, com tempestades severas e inundações já afetando comunidades, a atenção se volta novamente para a preparação e resposta a desastres. O estado continua aprendendo lições de desastres, mas por que essas lições parecem ser esquecidas?", "titulo_pt": "Queensland continua aprendendo lições de desastres. Mas por que as esquecemos?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 286330, "titulo": "A star's 'obliquity' likely has little impact on a given planet's habitability", "url": "https://phys.org/news/2026-11-star-obliquity-impact-planet-habitability.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T03:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inclinação axial de uma estrela em relação ao disco circumestelar que a rodeia é conhecida como obliquidade estelar. Atualmente, não se sabe qual é o impacto dessa obliquidade inicial na formação do sistema planetário em torno dela.", "titulo_pt": "A obliquidade de uma estrela provavelmente tem pouco impacto na habitabilidade de um planeta dado", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 286331, "titulo": "What draws data centers to a community?", "url": "https://phys.org/news/2026-11-centers-community.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T02:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa, co-autoria de um professor de arquitetura da Universidade do Oklahoma, oferece insights sobre o que atrai grandes empresas de tecnologia para determinados locais e por que essas escolhas são importantes para as comunidades locais. As comunidades de Oklahoma estão analisando o desenvolvimento de novos centros de dados.", "titulo_pt": "O que atrai centros de dados para uma comunidade?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 286332, "titulo": "Hurricane season wrap-up: El Niño fueled record number of Pacific storms but calmed Atlantic", "url": "https://phys.org/news/2026-11-hurricane-season-el-nio-fueled.html", "fonte_id": "phys_org", "data_pub": "2026-11-25T02:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A temporada de furacões de 2026 encerra-se com contrastes entre o Atlântico e o Pacífico, resultado típico de uma temporada influenciada por um El Niño muito forte. Embora houvesse atividade abaixo da média no Atlântico, o Pacífico registrou uma atividade acima da média, incluindo dois desastres na Havaí.", "titulo_pt": "Resumo da temporada de furacões: el Niño gerou número recorde de furacões no pacífico, mas calou o atlântico", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 285976, "titulo": "Idealistas de lo posible", "url": "https://www.lanacion.com.ar/opinion/idealistas-de-lo-posible-nid25112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-25T09:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto original não fornece um trecho específico para resumir, mas se referiu a um título '
