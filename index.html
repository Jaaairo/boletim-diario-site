<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<main id="main"></main>

<div class="modal-overlay" id="modal-flag">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

<script>
const D = {"gerado_em": "21/09/2026 15:19", "stats": {"noticias_novas": 941, "resumos_gerados": 249}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O governo federal enfatizou a urgência de medidas para proteger crianças e adolescentes, considerando a proposta da plataforma Discord insuficiente. A Câmara dos Deputados reduziu a jornada de trabalho presencial dos servidores durante o período eleitoral, e Eduardo Bolsonaro foi demitido de seu cargo de ex-escrivão na Polícia Federal por abandono de serviço. A produção industrial no Brasil registrou o pior resultado para agosto em 11 anos, com a menor intenção de investimento em seis anos. A crise no STF gerou incertezas sobre as investigações do Banco Master e do INSS, enquanto as eleições para governador no Ceará e no Acre mostraram resultados apertados entre os candidatos. A pesquisa Datafolha indicou um empate técnico entre Lula e Flávio Bolsonaro no segundo turno da eleição presidencial, com 46% e 44% das intenções de voto, respectivamente.", "mundo": "O presidente russo, Vladimir Putin, e seu partido dominante, o Partido da União Russa, conquistaram uma vitória histórica nas eleições legislativas, obtendo uma maioria supermajoritária na Duma. Esta vitória reforça o controle de Putin sobre o poder político russo. Em contraste, o líder do partido conservador CDU na Alemanha, Friedrich Merz, enfrenta crescentes críticas após pesadas derrotas nas eleições estaduais, com o partido alcançando apenas 4,9% em seu estado natal. Merz prometeu permanecer no cargo para garantir o 'futuro democrático' do país, mas sua posição está em dúvida. Na América do Sul, os filhos do ex-presidente brasileiro Jair Bolsonaro, Carlos e Jair Renan, estão concorrendo a cargos legislativos no estado de Santa Catarina, beneficiando-se do apoio do movimento Bolsonaro. No cenário internacional, a Rússia sugeriu cooperação com o partido de extrema direita Alternativa para a Alemanha (AfD), enquanto a China e os Estados Unidos realizaram discussões sobre comércio, inteligência artificial e minérios raros, com representantes de ambas as nações se reunindo em Nova York.\n\nA geopolítica global enfrenta uma série de desafios significativos. A Coreia do Norte continua sendo um foco de preocupação, com diplomatas da Coreia do Sul, Estados Unidos e Japão reafirmando o compromisso de desnuclearização e incentivando Pyongyang a retomar os diálogos. A Coreia do Norte, por sua vez, declarou estar preparada para uma guerra prolongada, e a Força Revolucionária do Exército Irânio (IRGC) afirmou ter abatido outro dron americano sobre o Estreito de Ormuz. A situação no Oriente Médio também é tenso, com Israel realizando operações militares no Vale do Jordão e na Cisjordânia Ocidental, e a coalisão liderada pela Arábia Saudita realizando uma operação aérea em Hayfan, na província de Taiz, no Iêmen. As tensões entre Estados Unidos e Irã continuam, com Washington e Beijing discutindo a ideia de uma linha telefônica para Inteligência Artificial (AI) durante um período de crescente competição e restrições em tecnologias avançadas. Além disso, a ONU reúne líderes mundiais para discutir o risco de inteligência artificial descontrolada e os desafios climáticos e econômicos globais, em meio a conflitos em várias regiões, incluindo Irã, Gaza, Ucrânia, Sudão, Congo e Myanmar.", "economia": "As bolsas da Europa subiram esta semana, impulsionadas por expectativas positivas de um encontro entre EUA e China. Isso reduziu a pressão sobre os rendimentos soberanos e o petróleo. A China continua expandindo sua presença econômica em várias cidades brasileiras, desde o setor agrícola até os portos. A Telecom Italia passa por mudanças de comando, com a Poste Italiane assumindo o controle da TIM Brasil. O Banco Central (BC) iniciou uma consulta pública sobre os critérios de demonstrações financeiras. O mercado financeiro reduziu a projeção para a taxa Selic no final de 2026, refletindo expectativas de novos cortes de juros ainda neste ano. A Novo Nordisk está desenvolvendo uma caneta experimental para tratamento de diabetes que promete perda de peso significativa. A inVista busca investir mais R$ 1 bilhão para expandir um complexo logístico. A Aneel se prepara para avaliar o acordo de flexibilização operativa das usinas térmicas da Eneva, com a possibilidade de economia estimada de R$ 1 bilhão.", "tecnologia": "Os Estados Unidos e a China estão avaliando a criação de um canal de comunicação sobre inteligência artificial (IA), com negociações em andamento para estabelecer um diálogo entre os dois países sobre o tema. A OpenAI apresentou novas propostas de rastreamento de riscos de desalinhamento de IA, enquanto o CEO Sam Altman discursará sobre o assunto na Assembleia Geral de Segurança das Nações Unidas. Paralelamente, a França examinou o impacto ambiental da IA e sugeriu o desenvolvimento de centrais de dados focadas em IA para reduzir a pegada ecológica. A tecnologia de IA está se expandindo em diversos setores, com profissionais com habilidades em IA ganhando 56% a mais em média. A Dyson enfrentou problemas com seu escova-dente inteligente, CameraJet. Por fim, os Emirados Árabes Unidos podem se aproximar mais dos EUA com um novo modelo de IA gratuito da Nvidia, enquanto a Google foi multada em mais de 400 milhões de euros pela Comissão de Proteção de Dados da Irlanda por seu uso de dados de localização dos usuários.", "ciencia": "Um estudo publicado na Communications Earth & Environment, liderado pela NASA, mostrou que a temporada de derretimento do gelo polar ártico, que aumentou significativamente desde o início dos registros por satélite, estabilizou por volta de 2010, após décadas de expansão. Este achado, que indica um possível ponto de estabilização no derretimento do gelo, é um importante avanço na compreensão das mudanças climáticas. Paralelamente, a Anvisa aprovou o medicamento Etcamah para o tratamento de câncer de mama em estágio avançado, um avanço significativo na medicina oncológica. Além disso, a NASA anunciou que o rover Perseverance encontrou estruturas sedimentares de um lago antigo em Marte, revelando complexos sistemas de água na era inicial do planeta vermelho. Esses avanços científicos e tecnológicos refletem a crescente importância da ciência na resolução de desafios ambientais e médicos, bem como no avanço do conhecimento sobre o universo e a Terra.", "cultura": "A cultura global apresenta uma variedade de eventos e manifestações. O Papa Francisco visitará a Argentina em 8 de novembro, após uma parada no Uruguai, participando de missas e atividades com jovens e líderes religiosos e sociais. Em outro contexto, a Globo planeja usar a história da loja de alto padrão Daslu como inspiração para a próxima novela das sete, intitulada 'Elas que Lutem', que estreará em março de 2027. A cineasta paraguaia Paz Encina, que começou a estudar violão clássico aos quatro anos, compartilha sua experiência de criação artística. O Cine Tutu, um cinema de rua em São Paulo, promete uma experiência única com poltronas verdes e florais, desafiando as tradições do cinema convencional. Além disso, a Primavera dos Museus, promovida pelo Instituto Brasileiro de Museus, ocorre de 22 a 27 de setembro, buscando ampliar o acesso à cultura em todo o país, embora apenas 16% da população tenha visitado um museu nos últimos 12 meses, de acordo com pesquisa da Fundação Itaú.", "sociedade": "Um morador de rua foi morto a facadas dentro de um restaurante comunitário no Distrito Federal, em um incidente envolvendo duas pessoas que viviam na situação de rua. O caso gerou preocupação sobre a segurança desses grupos. Em Goiânia, dois homens foram presos por jogar uma bomba em um bar, ferindo três clientes. Outro incidente envolvendo violência ocorreu em um bar em São Paulo, onde um homem de 59 anos foi morto a facadas ao tentar separar uma briga entre um casal. Na área de saúde, uma nova cirurgia combinada para tratar glaucoma e catarata será oferecida pelo SUS, prometendo uma recuperação mais rápida e redução de riscos para os pacientes. Um garoto de 11 anos, atingido por disparos em Sydney, na Austrália, também chamou a atenção, estando em estado grave no hospital. Além disso, o reajuste do Bolsa Família foi anunciado, com um aumento linear de cerca de 15% em todos os benefícios, refletindo a prioridade do programa em combater a pobreza.", "meio_ambiente": "Uma calamidade pública foi declarada na Colômbia devido a incêndios florestais que ameaçam uma área turística popular. Vinte incêndios ativos estão queimando áreas montanhosas ao redor da cidade colonial de Villa de Leyva, no nordeste do país. Além disso, a Colômbia planeja revisar as regulamentações de qualidade do ar interno com o objetivo de melhorar as normas existentes. O 'super El Niño' de 2015-2016 está entrando em território de recordes, com as temperaturas superficiais do oceano no Pacífico tropical agora igualando os maiores valores registrados.", "direitos_humanos": "Um relator especial do Conselho de Direitos Humanos da ONU afirmou que ataques americanos a barcos suspeitos de tráfico de drogas no Pacífico e Caribe desde setembro de 2025 podem constituir crimes contra a humanidade, com mais de 230 mortes já registradas. Em outro desenvolvimento, o Parlamento francês está debatendo uma nova lei contra violência de gênero e sexual, que pode afetar plataformas de conteúdo adulto como OnlyFans e MYM. Além disso, uma pesquisa apontou que as mulheres consideram o combate ao feminicídio como a área da segurança pública mais importante para ser melhorada, com 18% das participantes citando esse problema. Em Gaza, a guerra israelense está desestruturando famílias, com as mulheres se tornando cabeças de família em cerca de um quarto dos lares, buscando ajuda e abrigo em um ambiente perigoso."}, "resumo_do_dia": {"politica_nacional": [{"id": 173994, "titulo": "Governo diz que proposta do Discord é 'insuficiente' e volta a pedir medidas urgentes para proteção de crianças e adolescentes", "url": "https://g1.globo.com/politica/blog/valdo-cruz/post/2026/09/21/governo-diz-que-proposta-do-discord-e-insuficiente-e-volta-a-pedir-medidas-urgentes-para-protecao-de-criancas-e-adolescentes.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-21T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal, por meio da Advocacia-Geral da União, reiterou o pedido para que a Justiça obrigue a plataforma Discord a adotar medidas imedias de proteção. A proposta da Discord foi considerada insuficiente pela AGU, que busca medidas urgentes para proteger crianças, adolescentes e mulheres.", "titulo_pt": "Governo considera proposta do Discord insuficiente e pede medidas urgentes", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 173953, "titulo": "Câmara reduz pela metade jornada de trabalho presencial de servidores durante período eleitoral", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/camara-reduz-pela-metade-jornada-de-trabalho-presencial-de-servidores-durante-periodo-eleitoral.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-21T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A presidência da Câmara dos Deputados reduziu a jornada de trabalho presencial de servidores para quatro horas diárias durante o período eleitoral. Esta medida foi tomada em meio à campanha eleitoral.", "titulo_pt": "Câmara reduz jornada de trabalho presencial de servidores durante período eleitoral para quatro horas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 173954, "titulo": "Entenda como funciona o abandono de cargo, que levou à demissão de Eduardo Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/entenda-como-funciona-o-abandono-de-cargo-que-levou-a-demissao-de-eduardo-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-21T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Eduardo Bolsonaro foi demitido de seu cargo de escrivão na Polícia Federal por abandono de serviço após faltar injustificadamente por mais de 30 dias consecutivos. A demissão foi fundamentada na lei 15.047/2024, que estabelece o regime disciplinar dos servidores da PF.", "titulo_pt": "Entenda como Eduardo Bolsonaro foi demitido de seu cargo na polícia federal por abandono de serviço", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 173995, "titulo": "Produção industrial tem pior resultado para agosto em 11 anos; intenção de investir é a menor em 6 anos", "url": "https://g1.globo.com/economia/noticia/2026/09/21/producao-industrial-tem-pior-resultado-para-agosto-em-11-anos-intencao-de-investir-e-a-menor-em-6-anos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-21T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O índice que mede a produção industrial no Brasil atingiu 46,3 pontos em agosto, o pior resultado para o mês desde 2015. A intenção de investimento das empresas também registrou o menor nível em seis anos.", "titulo_pt": "Produção industrial tem pior resultado para agosto em 11 anos; intenção de investir é a menor em 6 anos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 174060, "titulo": "Emissoras boicotam cobertura da Casa Branca após Trump barrar jornalistas", "url": "https://veja.abril.com.br/mundo/emissoras-boicotam-cobertura-da-casa-branca-apos-trump-barrar-jornalistas/", "fonte_id": "veja", "data_pub": "2026-09-21T16:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Principais redes de televisão dos Estados Unidos decidiram não substituir a equipe da CNN, que foi impedida de acessar a sede do governo para a cobertura da Casa Branca. Isso ocorre após a proibição de jornalistas da CNN pelo presidente Trump.", "titulo_pt": "Emissoras americanas não substituem cnn após Trump barrar jornalistas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 173955, "titulo": "'Homens tóxicos' e 'medinho de Moraes': veja frases marcantes do debate Folha/UOL ao Senado", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/homens-toxicos-e-medinho-de-moraes-veja-frases-marcantes-do-debate-folhauol-ao-senado.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-21T16:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Candidatos que lideram as pesquisas para o Senado de São Paulo participaram de um debate promovido pela Folha e pelo UOL. Estiveram presentes Marina Silva, Simone Tebet, André do Prado, Guilherme Derrite e Ricardo Salles.", "titulo_pt": "‘Homens tóxicos’ e ‘medinho de Moraes’: veja frases marcantes do debate Folha/UOL ao Senado", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 173956, "titulo": "Candidatos ao Senado escolhem suplentes milionários de olho no financiamento de campanha", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/candidatos-ao-senado-escolhem-suplentes-milionarios-de-olho-no-financiamento-de-campanha.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-21T16:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Candidatos ao Senado optaram por escolher suplentes milionários, visando eventual financiamento de campanhas e facilitar contatos com o empresariado local. Os titulares geralmente escolheram suplentes com patrimônio maior e histórico de doações eleitorais generosas.", "titulo_pt": "Candidatos ao Senado escolhem suplentes milionários para financiamento de campanha", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 173996, "titulo": "Discord remove aplicativos usados para contornar suspensão de vídeos ao vivo no Brasil", "url": "https://g1.globo.com/tecnologia/noticia/2026/09/21/discord-remove-aplicativos-usados-para-contornar-suspensao-de-videos-ao-vivo-no-brasil.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-21T16:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência Nacional de Proteção de Dados (ANPD) notificou o Discord sobre a utilização de aplicativos externos que estavam sendo usados para contornar a suspensão dos recursos de vídeo no Brasil. Em resposta, o Discord removeu esses aplicativos de terceiros da plataforma.", "titulo_pt": "Anpd remove aplicativos que contornavam suspensão de vídeos ao vivo no discord no Brasil", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 173957, "titulo": "Crise no STF gera incerteza sobre investigação do Master e INSS e temor de que ações se arrastem", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/crise-no-stf-gera-incerteza-sobre-investigacao-do-master-e-inss-e-temor-de-que-acoes-se-arrastem.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-21T15:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A crise no STF está causando incertezas sobre o andamento das investigações do Banco Master e do INSS, afetando o tempo de resposta a pedidos e a decisão de questões urgentes. O temor é que isso possa levar a atrasos nas investigações e operações.", "titulo_pt": "Crise no STF gera incerteza sobre investigações do banco Master e INSS e temor de atrasos", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 173958, "titulo": "Caso Master vira munição eleitoral na Bahia, com delação, processos e secretário sob pressão", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/09/caso-master-vira-municao-eleitoral-na-bahia-com-delacao-processos-e-secretario-sob-pressao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-21T15:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As investigações sobre o Banco Master e o ex-banqueiro Daniel Vorcaro se tornaram parte da campanha eleitoral na Bahia, envolvendo processos, delações e pressão sobre o secretário envolvido. O governador Jerônimo Rodrigues (PT) e o ex-prefeito de Salvador ACM Neto (União Brasil) estão em disputa pelo governo estadual.", "titulo_pt": "Caso Master vira munição eleitoral na Bahia, com delação, processos e secretário sob pressão", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 173959, "titulo": "Resseguradoras emplacam jabuti em lei orçamentária e obtêm benefício fiscal com apoio do governo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/resseguradoras-emplacam-jabuti-em-lei-orcamentaria-e-obtem-beneficio-fiscal-com-apoio-do-governo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-21T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As resseguradoras conseguiram a aprovação de uma redução na carga tributária através da inclusão de um jabuti na lei orçamentária, com apoio do governo, durante as duas semanas de esforço concentrado no Congresso Nacional em agosto e setembro de 2026.", "titulo_pt": "Resseguradoras incluem jabuti em lei orçamentária e obtêm benefício fiscal com apoio do governo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 173997, "titulo": "Senado tem a chave do STF: quem entra e quem pode sair", "url": "https://g1.globo.com/politica/blog/andreia-sadi/post/2026/09/21/senado-tem-a-chave-do-stf-quem-entra-e-quem-pode-sair.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-09-21T14:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado Federal tem papel crucial na aprovação ou afastamento de ministros do Supremo Tribunal Federal (STF), pois é nele que tramitam os processos para confirmar nomes indicados pelo presidente da República. A eleição para o Senado, por isso, ganha importância na relação entre o Congresso e o STF.", "titulo_pt": "Senado tem a chave do STF: quem entra e quem pode sair", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 174101, "titulo": "Pesquisa AtlasIntel: Elmano cresce e ultrapassa numericamente Ciro no 1º turno no Ceará", "url": "https://exame.com/brasil/pesquisa-atlasintel-elmano-cresce-e-ultrapassa-numericamente-ciro-no-1o-turno-no-ceara/", "fonte_id": "exame", "data_pub": "2026-09-21T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa AtlasIntel indica que Elmano está liderando no primeiro turno das eleições no Ceará, superando numericamente Ciro Gomes. Em seguida, aparecem Delegado Huggo (Missão) com 1,3% e Zé Batista (PSTU) com 0,2%.", "titulo_pt": "Pesquisa AtlasIntel: elmano cresce e ultrapassa Ciro no 1º turno no Ceará", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 173990, "titulo": "Caminhos da Reportagem: importância do voto para jovens e idosos", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/caminhos-da-reportagem-importancia-do-voto-para-jovens-e-idosos", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-21T13:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O próximo episódio do programa Caminhos da Reportagem, intitulad S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 174578, "titulo": "Sally Field, the actress who fought abuse and escaped her demons through acting", "url": "https://english.elpais.com/culture/2026-09-21/sally-field-the-actress-who-fought-abuse-and-escaped-her-demons-through-acting.html", "fonte_id": "elpais_en", "data_pub": "2026-09-21T17:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sally Field, atriz que enfrentou abusos e superou seus demônios através da atuação, teve sucesso em sua ativismo e carreira, ganhando seu quarto Emmy recentemente.", "titulo_pt": "Sally Field, a atriz que lutou contra abusos e escapou de seus demônios através da atuação", "veiculo": "El País (inglês)", "pais": "Espanha", "classe": "A"}, {"id": 173944, "titulo": "As razões de ex-marido para perdoar a ex-mulher acusada de matar seus 3 filhos: 'Teria me consumido por dentro para sempre'", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/09/as-razoes-de-ex-marido-para-perdoar-a-ex-mulher-acusada-de-matar-seus-3-filhos-teria-me-consumido-por-dentro-para-sempre.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-09-21T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ex-marido decidiu perdoar sua ex-mulher, acusada de matar seus três filhos, citando que isso o ajudaria a não se consumir por dentro para sempre. A reportagem contém detalhes sobre doenças mentais e discussões sobre suicídio que podem ser perturbadores para alguns leitores.", "titulo_pt": "Razões de ex-marido para perdoar ex-mulher acusada de matar seus 3 filhos: 'teria me consumido por dentro para sempre'", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 174430, "titulo": "First UK charges brought over 1994 Rwanda genocide", "url": "https://www.bbc.co.uk/news/articles/cr2092216nywo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "da l, "texto_pt": "A China está expandindo sua presença em várias cidades brasileiras, desde o setor agrícola até os portos. Um seminário em Pequim, exclusivamente acompanhado por VEJA, revelou os locais onde a influência chinesa já se estabeleceu no país.", "titulo_pt": "Da árvore de chá aos portos: o que a China constrói nas cidades brasileiras", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 174113, "titulo": "BC abre consulta sobre critérios de demonstrações financeiras", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/bc-abre-consulta-sobre-criterios-de-demonstracoes-financeiras/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-21T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Banco Central (BC) iniciou uma consulta pública sobre os critérios de demonstrações financeiras. A proposta define o conceito de medidas de desempenho definidas pela administração e permite sua divulgação em uma nota explicativa única, estabelecendo o conteúdo mínimo a ser divulgado.", "titulo_pt": "BC abre consulta sobre critérios de demonstrações financeiras", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 174120, "titulo": "Bolsas da Europa sobem com expectativa sobre encontro entre EUA e China", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/bolsas-da-europa-sobem-com-expectativa-sobre-encontro-entre-eua-e-china/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-21T17:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As bolsas da Europa subiram devido às expectativas positivas sobre um encontro entre EUA e China, contribuindo para um melhor apetite dos investidores por riscos. Além disso, a queda do petróleo e dos rendimentos soberanos também favoreceu esse movimento.", "titulo_pt": "Bolsas da Europa sobem com expectativa de encontro eua-china", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 174180, "titulo": "A Telecom Italia tem um novo dono. O que muda para a TIM Brasil?", "url": "https://braziljournal.com/a-telecom-italia-tem-um-novo-dono-o-que-muda-para-a-tim-brasil/", "fonte_id": "brazil_journal", "data_pub": "2026-09-21T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Telecom Italia, que detém 68% do capital da TIM Brasil, agora tem como novo dono a Poste Italiane, estatal italiana responsável pelos serviços postais do país, após aquisição de 66,6% do capital da Telecom Italia.", "titulo_pt": "A Telecom Italia ganhou um novo dono: a poste italiane", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 174176, "titulo": "Petróleo na Venezuela renascerá? Veja ações que podem ganhar – incluindo do Brasil", "url": "https://www.infomoney.com.br/mercados/petroleo-na-venezuela-renascera-veja-as-possiveis-vencedoras-globais-e-brasileiras/", "fonte_id": "infomoney", "data_pub": "2026-09-21T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Goldman Sachs prevê que a produção de petróleo na Venezuela pode aumentar significativamente até 2030, após acordos recentes com grandes empresas do setor. O relatório também menciona a possibilidade de ações brasileiras beneficiarem-se dessa situação.", "titulo_pt": "Petróleo na Venezuela renascerá? Veja ações que podem ganhar – incluindo do Brasil", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 173967, "titulo": "PIB dá sinais claros de desaceleração, e Selic deve cair a 13,25% até o fim do ano, diz Bradesco", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/pib-da-sinais-claros-de-desaceleracao-e-selic-deve-cair-a-1325-ate-o-fim-do-ano-diz-bradesco.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-21T16:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A atividade econômica está mostrando sinais de desaceleração, com indicadores que indicam um enfraquecimento do mercado de trabalho e do consumo, devido ao elevado comprometimento da renda das famílias. O Bradesco prevê que a taxa Selic deve cair para 13,25% ao ano até o fim do ano.", "titulo_pt": "PIB dá sinais claros de desaceleração, e taxa Selic deve cair a 13,25% até o fim do ano, afirma Bradesco", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 174519, "titulo": "Paramount reaches settlement to clear path for $110bn Warner Bros deal", "url": "https://www.ft.com/content/0bfc882f-fe1b-40cb-a356-162e833f2008?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-21T16:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Paramount chegou a um acordo que permitirá a conclusão da aquisição da Warner Bros por $110 bilhões, sem a necessidade de desinvestir ativos e mantendo suas operações na Califórnia.", "titulo_pt": "Paramount atinge acordo para permitir aquisição da Warner Bros por 110 bilhões de dólares", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 173968, "titulo": "China domina corrida por baterias de sódio enquanto Ocidente tenta reagir", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/09/china-domina-corrida-por-baterias-de-sodio-enquanto-ocidente-tenta-reagir.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-21T15:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ocidente ficou para trás na corrida para desenvolver baterias de sais de sódio dissolvidos em água, enquanto a China lidera o avanço científico nessa tecnologia, que visa competir com as baterias de íons de lítio. Especialistas afirmam que o Ocidente está tentando reagir a essa liderança chinesa.", "titulo_pt": "China domina corrida por baterias de sódio enquanto Ocidente tenta reagir", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 174522, "titulo": "Fed will need to be ‘aggressive’ on inflation, says top official", "url": "https://www.ft.com/content/e173bec6-352b-4b51-b3a4-382a9229bc86?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-21T15:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O principal oficial do Federal Reserve expressou preocupação com a inflação, que ele acredita estar sendo alimentada por uma 'demanda superaquecida' além do choque de suprimento do Irã.", "titulo_pt": "Fed precisará ser 'agressivo' na combate à inflação, diz oficial top", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 173969, "titulo": "CVM aceita pedido de oferta pública de aquisição da Braskem por fundo da IG4 Capital", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/cvm-aceita-pedido-de-oferta-publica-de-aquisicao-da-braskem-por-fundo-da-ig4-capital.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-21T15:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A CVM aprovou a oferta pública de aquisição da Braskem pelo FIP Shine I, gerido pela IG4 Capital. A IG4 Capital assumiu o controle da petroquímica em junho deste ano em conjunto com a Petrobras.", "titulo_pt": "CVM aprova oferta pública de aquisição da Braskem por fundo da IG4 Capital", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 174516, "titulo": "Battered government bonds rebound as oil falls below $100", "url": "https://www.ft.com/content/18f9e0ac-b7d9-4648-803f-3e894990c626?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-21T14:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os títulos do governo recuperaram-se após o petróleo cair abaixo dos US$100 o barril, devido a especulações sobre uma possível reunião entre Donald Trump e o presidente iraniano, o que beneficiou a dívida da França e da Itália.", "titulo_pt": "Títulos do governo se recuperam com queda do petróleo abaixo de us$100", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 174093, "titulo": "Novo rival do Mounjaro? Caneta da Novo Nordisk, CagriSema, registra perda de peso de até 21%", "url": "https://exame.com/ciencia/novo-rival-do-mounjaro-caneta-da-novo-nordisk-cagrisema-registra-perda-de-peso-de-ate-21/", "fonte_id": "exame", "data_pub": "2026-09-21T14:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Novo Nordisk desenvolveu uma caneta experimental que combina semaglutida e cagrilintida para aplicação semanal, registrando perda de peso até 21%. O medicamento aguarda a decisão regulatória nos Estados Unidos.", "titulo_pt": "Novo rival do Mounjaro? Caneta da Novo Nordisk, CagriSema, registra perda de peso de até 21%", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 174012, "titulo": "Mercado reduz projeção da Selic para 13,50%", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/mercado-reduz-projecao-da-selic-para-1350", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-21T14:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado financeiro reduziu a projeção para a taxa Selic no final de 2026, de 13,75% para 13,50%. Segundo o Boletim Focus do Banco Central, essa revisão reflete a expectativa de novos cortes de juros ainda neste ano.", "titulo_pt": "Mercado reduz projeção para taxa Selic em 2026", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 173970, "titulo": "Xi Jinping chega à cúpula com Trump enquanto motor comercial da China está a todo vapor", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/xi-jinping-chega-a-cupula-com-trump-enquanto-motor-comercial-da-china-esta-a-todo-vapor.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-21T14:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nos quatro meses desde a última reunião entre Xi Jinping e Donald Trump, o comércio da China com o mundo aumentou sob a supervisão de Xi Jinping, enquanto Donald Trump enfrenta desafios com a diminuição de sua aprovação popular.", "titulo_pt": "Xi Jinping chega à cúpula com Trump enquanto comércio da China impulsiona", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 173971, "titulo": "Estatal italiana assume controle da Telecom Itália e se torna controladora indireta da Tim no Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/09/estatal-italiana-assume-controle-da-telecom-italia-e-se-torna-controladora-indireta-da-tim-no-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-21T14:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Poste Italiane, empresa estatal italiana, está assumindo o controle da Telecom Itália, que é proprietária da Tim no Brasil. Durante uma janela de compra entre 21 e 25 de setembro, os acionistas da Telecom Itália poderão vender suas ações para a nova controladora.", "titulo_pt": "Estatal italiana passa a controlar a Telecom Itália e se torna indiretamente controladora da Tim no Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 174329, "titulo": "Portabilidade salarial: mobilidade financeira e o direito de escolha", "url": "https://www.jota.info/opiniao-e-analise/artigos/portabilidade-salarial-mobilidade-financeira-e-o-direito-de-escolha", "fonte_id": "jota", "data_pub": "2026-09-21T14:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os levantamentos mostram que o principal desafio não está na regulação, mas na implementação efetiva das regras já existentes para a portabilidade salarial.", "titulo_pt": "Portabilidade salarial: mobilidade financeira e o direito de escolha", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 174650, "titulo": "US and China consider making AI channel", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/22/2003864652", "fonte_id": "taipei_times", "data_pub": "2026-09-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Estados Unidos e a China estão considerando a criação de um canal de comunicação sobre inteligência artificial. As negociações estão em andamento para estabelecer um diálogo entre os dois países sobre o tema.", "titulo_pt": "EUA e China consideram criar canal de comunicação sobre IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 174051, "titulo": "Mulheres avançam em mercado de criptomoedas e mudam perfil dos investidores", "url": "https://veja.abril.com.br/economia/mulheres-avancam-em-mercado-de-criptomoedas-e-mudam-perfil-dos-investidores/", "fonte_id": "veja", "data_pub": "2026-09-21T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A participação feminina no mercado de criptomoedas aumentou nos últimos anos no Brasil e no exterior, mas ainda representa uma parcela menor do total de investimentos.", "titulo_pt": "Mulheres avançam no mercado de criptomoedas, mas ainda investem menos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 174520, "titulo": "OpenAI joins call for US-led global AI standards", "url": "https://www.ft.com/content/4e502288-b611-4193-acdb-46ef34b1e3b0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-09-21T17:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O CEO da OpenAI, Sam Altman, irá apresentar à Segurança das Nações Unidas esta semana após protestos sobre preocupações com a segurança em torno das tecnologias de inteligência artificial.", "titulo_pt": "Openai se junta a chamada para padrões globais de IA liderados pelos EUA", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 174712, "titulo": "Dyson Won’t Say What’s Wrong With Its CameraJet Toothbrush", "url": "https://www.wired.com/story/dyson-wont-say-whats-wrong-with-the-camerajet-toothbrush/", "fonte_id": "wired", "data_pub": "2026-09-21T17:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Dyson não especificou qual foi o problema com seu escova-dente inteligente CameraJet, admitindo apenas um 'problema com um componente'. A empresa se recusou a informar o que exatamente deu errado, quantas unidades estão afetadas em quais países e por que não está chamando de volta o produto, que custa US$ 500.", "titulo_pt": "Dyson não especifica problema no sua escova-dente inteligente CameraJet", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 174451, "titulo": "Ahead of Sam Altman's UN address, OpenAI proposes new ways to track AI misalignment risks", "url": "https://www.axios.com/2026/09/21/openai-ai-safety-standards-us-china", "fonte_id": "axios", "data_pub": "2026-09-21T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "OpenAI lançou padrões internacionais de segurança de IA na semana passada, enquanto líderes mundiais, como os Estados Unidos e China, ponderam como mitigar riscos. O CEO de OpenAI, Sam Altman, discursará sobre novas propostas de rastreamento de riscos de desalinhamento de IA em uma futura palestra.", "titulo_pt": "Antes da palestra do OpenAI na ONU, propostas são feitas para rastrear riscos de desalinhamento de IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 174444, "titulo": "AI's climate-fighting potential remains largely untapped, French report says", "url": "https://www.lemonde.fr/en/environment/article/2026/09/21/ai-s-climate-fighting-potential-remains-largely-untapped-french-report-says_6757789_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-21T16:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um comitê no Senado francês examinando o impacto ambiental da IA disse que o desenvolvimento de centrais de dados focadas em IA na França poderia ajudar a reduzir a pegada ecológica dessa tecnologia.", "titulo_pt": "Potencial da IA para combater o clima permanece largely inexplorado, diz relatório francês", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 174694, "titulo": "Trump rejects AI slowdown calls, launches \"AI Force\" instead", "url": "https://arstechnica.com/ai/2026/09/trump-rejects-ai-slowdown-calls-launches-ai-force-instead/", "fonte_id": "ars_technica", "data_pub": "2026-09-21T15:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Trump rejeitou pedidos para retardar o desenvolvimento da inteligência artificial e propôs criar uma 'Força de Inteligência Artificial' em seu lugar. Ele não forneceu muitos detalhes sobre as funções dessa nova força.", "titulo_pt": "Trump rejeita pedidos para frear AI e anuncia 'força de inteligência artificial'", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 174089, "titulo": "Como os bilionários da tecnologia estão se preparando para o fim do mundo", "url": "https://exame.com/tecnologia/como-os-bilionarios-da-tecnologia-estao-se-preparando-para-o-fim-do-mundo/", "fonte_id": "exame", "data_pub": "2026-09-21T14:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bilionários da tecnologia, como Mark Zuckerberg, Sam Altman e Elon Musk, estão investindo grandes quantias em medidas de segurança para enfrentar crises globais e os riscos associados à tecnologia. Essas medidas incluem abrigos subterrâneos luxuosos e planos de fuga planetária.", "titulo_pt": "Como os bilionários da tecnologia estão se preparando para o fim do mundo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 174096, "titulo": "IA já está mudando carreiras fora da tecnologia; veja quais habilidades ganham espaço", "url": "https://exame.com/inteligencia-artificial/ia-ja-esta-mudando-carreiras-fora-da-tecnologia-veja-quais-habilidades-ganham-espaco/", "fonte_id": "exame", "data_pub": "2026-09-21T14:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudos indicam que competências relacionadas à IA estão sendo valorizadas em diversos setores, levando a aumentos nos salários e a novas responsabilidades para profissionais de diferentes áreas.", "titulo_pt": "IA já está alterando carreiras fora da tecnologia; veja quais habilidades estão em alta", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 174713, "titulo": "Here’s the iFixit Repairability Rating for the iPhone 18 Pro", "url": "https://www.wired.com/story/ifixit-rating-for-the-iphone-18-pro-repairability/", "fonte_id": "wired", "data_pub": "2026-09-21T14:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O iPhone 18 Pro recebeu uma nota razoável no sistema de avaliação de facilidade de reparo da iFixit, considerando a longa resistência da Apple em tornar seus produtos fáceis de reparar.", "titulo_pt": "Avaliação de facilidade de reparo do iphone 18 Pro", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 174097, "titulo": "Profissionais com habilidades em IA ganham 56% a mais, segundo estudo da PwC", "url": "https://exame.com/inteligencia-artificial/profissionais-com-habilidades-em-ia-ganham-56-a-mais-segundo-estudo-da-pwc/", "fonte_id": "exame", "data_pub": "2026-09-21T14:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo global da PwC revelou que trabalhadores com habilidades em Inteligência Artificial ganham, em média, 56% a mais. O relatório destaca mudanças rápidas nas competências necessárias no mercado de trabalho.", "titulo_pt": "Profissionais com habilidades em IA ganham 56% a mais, segundo estudo da PwC", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 174102, "titulo": "Médicos sem tempo para redes sociais ganham um \"segundo cérebro\" de inteligência artificial", "url": "https://exame.com/inteligencia-artificial/medicos-sem-tempo-para-redes-sociais-ganham-um-segundo-cerebro-de-inteligencia-artificial/", "fonte_id": "exame", "data_pub": "2026-09-21T13:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fundada pelos empreendedores Rafael Freitas e Lucas Vieira, a Feed Medic desenvolve um sistema de inteligência artificial que aprende o tom de voz de médicos e gera conteúdo baseado em fontes públicas como o PubMed.", "titulo_pt": "Médicos sem tempo para redes sociais ganham um 'segundo cérebro' de inteligência artificial", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 174555, "titulo": "Inside Kazakhstan’s push to become a regional AI centre", "url": "https://www.aljazeera.com/news/2026/9/21/inside-kazakhstans-push-to-become-a-regional-ai-centre?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-21T13:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kazáquia acelerou o desenvolvimento de inteligência artificial, mas especialistas alertam sobre os impactos ambientais e de direitos humanos.", "titulo_pt": "Kazáquia acelera desenvolvimento de IA, mas especialistas alertam sobre impactos ambientais e de direitos humanos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 174689, "titulo": "The long dream of the Googlebook", "url": "https://www.theverge.com/tech/997972/googlebook-laptop-chromeos-android-history", "fonte_id": "the_verge", "data_pub": "2026-09-21T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em outubro de 2010, Sundar Pichai, então executivo emergente da Google, apresentou a ideia de que futuramente os computadores só precisariam de um navegador web para rodar todas as aplicações.", "titulo_pt": "O longo sonho do Googlebook", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 174690, "titulo": "I got to see Google’s wild ideas about the future of laptops", "url": "https://www.theverge.com/tech/997986/google-googlebooks-android-laptops-dell-hp-lenovo-acer-asus-price-specs", "fonte_id": "the_verge", "data_pub": "2026-09-21T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O dispositivo Googlebook apresenta uma integração entre o Android e o PC, tornando-os mais semelhantes a um único dispositivo. A interface é familiar e aprimorada, baseada em laptops atuais e no sistema operacional Chromebook.", "titulo_pt": "Vi as inovadoras ideias da Google sobre o futuro dos laptops", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 174714, "titulo": "Got an Android Phone? Google Thinks You’ll Probably Want a Googlebook Laptop", "url": "https://www.wired.com/story/google-launches-googlebook-laptops/", "fonte_id": "wired", "data_pub": "2026-09-21T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Google está trazendo uma experiência de conectividade semelhante àquela que os usuários de iPhones e Macs desfrutam para os proprietários de telefones Android. Isso indica que a empresa está trabalhando para melhorar a integração entre seus dispositivos móveis e potenciais novos laptops da Google.", "titulo_pt": "Donos de telefones Android terão provavelmente interesse em um Laptop google", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 174771, "titulo": "How employers can make good decisions about remote work before the next crisis strikes", "url": "https://phys.org/news/2026-09-employers-good-decisions-remote-crisis.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 20% dos trabalhadores nos Estados Unidos que podem trabalhar remotamente o fazem integralmente ou pelo menos um dia por semana, seis anos após o início da pandemia de COVID-19.", "titulo_pt": "Como empregadores podem tomar decisões acertadas sobre trabalho remoto antes da próxima crise", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 174772, "titulo": "Lemur uses opera singer's trick to belt out forest songs", "url": "https://phys.org/news/2026-09-lemur-opera-singer-belt-forest.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade de Warwick descobriram que o indri, um lúmen único no mundo que canta, usa uma técnica vocal semelhante à dos cantores de ópera para alcançar notas altas.", "titulo_pt": "Lúmen usa técnica de cantor de ópera para cantar notas altas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 174766, "titulo": "STAT+: What a vote on Grail’s cancer detection test could mean for the company, patients, and regulators", "url": "https://www.statnews.com/2026/09/21/grail-galleri-fda-advisory-committee-meeting-documents/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-21T17:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Grail, empresa que está desenvolvendo um teste de sangue para detecção de câncer, subiram significativamente na bolsa após o FDA publicar documentos antes de uma reunião de um conselho consultivo.", "titulo_pt": "Voto sobre o teste de detecção de câncer da Grail pode significar para a empresa, pacientes e reguladores", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 174773, "titulo": "Satellite record reveals Arctic melt season has plateaued after decades of lengthening", "url": "https://phys.org/news/2026-09-satellite-reveals-arctic-season-plateaued.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo, liderado pela NASA e publicado em Communications Earth & Environment, mostrou que, apesar do aumento significativo na temporada de derretimento do gelo polar arctico desde o início dos registros por satélite, essa tendência inesperadamente estabilizou por volta de 2010. Durante décadas, o gelo polar arctico tem derretido mais cedo no outono e congelado mais tarde no inverno, estendendo a temporada de derretimento e contribuindo para a perda generalizada de gelo.", "titulo_pt": "Estudo revela que a temporada de derretimento do gelo arctico atingiu um plateau após décadas de extensão", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 174774, "titulo": "Why AI resembles a charismatic religious leader", "url": "https://phys.org/news/2026-09-ai-resembles-charismatic-religious-leader.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pessoas estão recorrendo à inteligência artificial por uma variedade aparentemente inesgotável de razões. Elas consultam a IA para coisas como decidir o que cozinhar para jantar, planejar um treino ou até mesmo criar trabalhos escolares ou revisar emails de trabalho.", "titulo_pt": "Por que a IA se assemelha a um líder religioso charmoso", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 174775, "titulo": "Flights scrapped, evacuations urged as Typhoon Dujuan nears Japan", "url": "https://phys.org/news/2026-09-flights-scrapped-evacuations-urged-typhoon.html", "fonte_id": "phys_org", "data_pub": "2026-09-21T17:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Várias viagens aéreas foram canceladas e mais de um milhão de pessoas foram alertadas para se evacuarem em virtude do Typhoon Dujuan, que se aproxima de Tóquio, potencialmente trazendo chuvas recordes.", "titulo_pt": "Voo cancelados e evacuações recomendadas à medida que Typhoon Dujuan se aproxima do Japão", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 174130, "titulo": "Anvisa aprova novo medicamento para câncer de mama em estágio avançado", "url": "https://www.cnnbrasil.com.br/saude/anvisa-aprova-novo-medicamento-para-cancer-de-mama-em-estagio-avancado/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-21T17:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anvisa aprovou um novo medicamento chamado Etcamah para o tratamento de câncer de mama em estágio avançado. O remédio age nas células tumorais, bloqueando sua ação e promovendo sua degradação.", "titulo_pt": "Anvisa aprova novo medicamento para câncer de mama em estágio avançado", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 174802, "titulo": "NASA Discovery Reveals Complex Water Systems on Early Mars", "url": "https://www.nasa.gov/solar-system/planets/mars/nasa-discovery-reveals-complex-water-systems-on-early-mars/", "fonte_id": "nasa_news", "data_pub": "2026-09-21T16:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rover Perseverance da NASA chegou à borda interna do cráter Jezero em setembro de 2023 e encontrou uma área geológica chamada 'Margin Unit', que exibe estruturas sedimentares de um lago antigo de Marte. Os cientistas esperavam encontrar rochas sedimentares formadas por camadas de areia acumuladas.", "titulo_pt": "Descobertas da NASA revelam sistemas de água complexos em marte antigo", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 174061, "titulo": "A pesquisa que ajuda a explicar por que Lula enfrenta uma eleição apertada", "url": "https://veja.abril.com.br/economia/a-pesquisa-que-ajuda-a-explicar-por-que-lula-enfrenta-uma-eleicao-apertada/", "fonte_id": "veja", "data_pub": "2026-09-21T16:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Ipsos-Ipec revela que a avaliação negativa do governo Lula supera a positiva em todas as nove áreas analisadas, incluindo gastos públicos, inflação e segurança.", "titulo_pt": "Pesquisa mostra avaliação negativa do governo Lula em todas as nove áreas analisadas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 174799, "titulo": "First radio waves seen from an exoplanet hint at otherworldly auroras", "url": "https://www.sciencenews.org/article/exoplanet-aurora-radio-waves", "fonte_id": "science_news", "data_pub": "2026-09-21T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O gigante gasoso Beta Pictoris b, a cerca de 63 luzes anos de distância, possui uma massa equivalente a 10 Júpiter e um campo magnético milhares de vezes mais forte que o da Terra.", "titulo_pt": "Primeiras rádios ondas vistas de um exoplaneta indicam auroras extraterrestres", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 174452, "titulo": "Exclusive: How Sen. Schatz is talking about climate in an affordability crisis", "url": "https://www.axios.com/2026/09/21/sen-schatz-climate-change-affordability", "fonte_id": "axios", "data_pub": "2026-09-21T15:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O senador Brian Schatz (D-Hawaii) afirmou que os americanos estão conectando a questão do clima com a pressão nos custos de vida. Ele mencionou que, apesar dos problemas financeiros dominarem as eleições, ainda assim, as conversas sobre clima, como relacionadas a preços de energia e à expansão de centrais de dados, estão se tornando mais frequentes no contexto das eleições.", "titulo_pt": "Como schatz está abordando o clima em meio à crise de custos", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 174767, "titulo": "STAT+: Lilly’s breast cancer combo wins approval", "url": "https://www.statnews.com/2026/09/21/biotech-news-lilly-breast-cancer-combo-wins-approval/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-09-21T15:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA aprovou uma nova combinação de medicamentos para o tratamento de pacientes com uma forma avançada de câncer de mama.", "titulo_pt": "Fda aprova nova combinação de medicamentos para câncer de mama avançado", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 174796, "titulo": "9 ‘boundaries’ keep Earth livable. We’ve breached 7 of them", "url": "https://www.scientificamerican.com/article/9-boundaries-keep-earth-livable-weve-breached-7-of-them/", "fonte_id": "scientific_american", "data_pub": "2026-09-21T15:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O check-up do planeta indica que estamos em maior risco de nos afastar do ambiente ao qual estamos adaptados. Sete dos nove limites ambientais já foram ultrapassados.", "titulo_pt": "9 'Limite' mantêm a terra habitável. Já ultrapassamos 7 deles", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 174797, "titulo": "COVID cases are on the rise—here’s how to stay healthy this winter", "url": "https://www.scientificamerican.com/article/covid-cases-are-on-the-rise-heres-how-to-stay-healthy-this-winter/", "fonte_id": "scientific_american", "data_pub": "2026-09-21T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de casos de COVID-19 está aumentando, com o vírus sendo atualmente mais prevalente em California e nos Estados Unidos do Sul, mas os especialistas esperam que se espalhe por todo o país nas próximas semanas.", "titulo_pt": "COVID-19: casos estão em aumento – veja como manter a saúde neste inverno", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 174801, "titulo": "Commercial Space Federation (CSF) Welcomes Two New Members", "url": "https://spacenews.com/commercial-space-federation-csf-welcomes-two-new-members/", "fonte_id": "spacenews", "data_pub": "2026-09-21T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Federação do Espaço Comercial (CSF) anunciou a adição de dois novos membros: ORBITInsure e Renaissance Strategic Advisors (RSA). Ambas as empresas se juntaram à CSF como parte da supply chain espacial.", "titulo_pt": "CSF bem-vinda duas novas membros", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 174606, "titulo": "China gets closer to Jupiter mission by bringing Nasa’s StarNAV concept to life", "url": "https://www.scmp.com/news/china/science/article/3368292/china-gets-closer-jupiter-mission-bringing-nasas-starnav-concept-life?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-21T14:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chinese researchers ha , {"id": 174271, "titulo": "Prevención del suicidio", "url": "https://www.ciperchile.cl/2026/09/21/prevencion-del-suicidio/?utm_source=rss&utm_medium=rss&utm_campaign=prevencion-del-suicidio", "fonte_id": "ciper_chile", "data_pub": "2026-09-21T16:38:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O tópico sobre prevenção do suicídio foi publicado originalmente no CIPER Chile.", "titulo_pt": "Prevenção do suicídio", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 174287, "titulo": "“Me amenazaron con matar a mis hijas”: el relato del conductor de Uber que fue testigo del secuestro en causa de Fodich", "url": "https://www.latercera.com/nacional/noticia/me-amenazaron-con-matar-a-mis-hijas-el-relato-del-conductor-de-uber-que-fue-testigo-del-secuestro-en-causa-de-fodich/", "fonte_id": "la_tercera", "data_pub": "2026-09-21T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O cidadão venezuelano declarou duas vezes. Primeiramente, afirmou que havia movilizado os acusados e os chineses. Posteriormente, relatou que foi ameaçado de matar suas filhas e sua parceira para dizer isso e que apenas alugou seu carro por 150 mil pesos.", "titulo_pt": "‘Eles me ameaçaram com a morte das minhas filhas’: relato do motorista de Uber que testemunhou o sequestro em causa de Fodich", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 173966, "titulo": "Reajuste do Bolsa Família confirma que crianças deixaram de ser prioridade", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/cecilia-machado/2026/09/reajuste-do-bolsa-familia-confirma-que-criancas-deixaram-de-ser-prioridade.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-21T16:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo anunciou um reajuste de cerca de 15% no Bolsa Família, elevando todos os benefícios do programa de forma linear. O reajuste foi percebido como uma boa notícia, já que o programa tem sido eficaz em reduzir a pobreza, com efeitos positivos nas crianças, mas a notícia não fornece detalhes sobre a prioridade atual do programa.", "titulo_pt": "Reajuste do Bolsa Família confirma que crianças deixaram de ser prioridade", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 174296, "titulo": "Contraloría detecta que 390 funcionarios públicos permanecen suspendidos por más de un año en sumarios pendientes", "url": "https://www.latercera.com/nacional/noticia/contraloria-detecta-13-funcionarios-publicos-suspendidos-por-mas-de-cuatro-anos-por-sumarios-aun-pendientes/", "fonte_id": "la_tercera", "data_pub": "2026-09-21T14:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Contraloria identificou que 390 funcionários públicos permanecem suspensos por mais de um ano em sumários pendentes. Entre eles, 13 permanecem suspensos por mais de quatro anos e outros 17 acumulam entre três e quatro anos em situação similar, recebendo seus salários durante todo esse tempo.", "titulo_pt": "Contraloria detecta que 390 funcionários públicos permanecem suspensos por mais de um ano em sumários pendentes", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 174573, "titulo": "Gaza students return to in-person schooling for first time in three years", "url": "https://www.japantimes.co.jp/news/2026/09/21/world/gaza-students-return-school/", "fonte_id": "japan_times", "data_pub": "2026-09-21T11:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "98% das escolas em Gaza foram destruídas ou danificadas durante a guerra, de acordo com a UNICEF. Os alunos retornaram às aulas presenciais após três anos.", "titulo_pt": "Alunos em gaza retornam às aulas presenciais após três anos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 173311, "titulo": "Como diferenciar a timidez da ansiedade social? Especialistas explicam", "url": "https://www.cnnbrasil.com.br/comporta mp.com/news/asia/east-asia/article/3368271/over-16-million-japan-urged-evacuate-typhoon-dujuan-nears-tokyo?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-21T10:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grande tufão se aproximava da costa pacífica do leste do Japão, trazendo chuva intensa à área de Tóquio e causando deslizamentos de terra nos prefecturas de Chiba e Kanagawa, com dois mortos confirmados. Um homem de 51 anos morreu após um deslizamento de terra engolir a ele e o excavador hidráulico que estava operando em Sodegaura, Chiba.", "titulo_pt": "2 Mortos no Japão, mais de 1,6 milhão evacuados à medida que tufão Dujuan se aproxima de tóquio", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 173490, "titulo": "Babies ‘will face almost twice as much’ extreme fire weather in Europe than great-grandparents", "url": "https://www.theguardian.com/world/2026/sep/21/babies-extreme-fire-weather-europe-great-grandparents", "fonte_id": "guardian_world", "data_pub": "2026-09-21T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma criança nascida após 2025 na Europa poderá experimentar três anos a mais de clima extremamente propício para incêndios em comparação com alguém nascido em 1950, de acordo com um estudo. A intensificação do aquecimento global exporá as crianças nascidas a partir de 2025 a cerca de metade a mais de clima extremamente propício para incêndios do que suas bisavós.", "titulo_pt": "Criancas nascidas após 2025 enfrentarão quase o dobro de clima extremamente propício para incêndios que bisavós", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 172641, "titulo": "Hermit crabs under threat: experts", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/21/2003864625", "fonte_id": "taipei_times", "data_pub": "2026-09-21T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hermit crabs estão sob ame
