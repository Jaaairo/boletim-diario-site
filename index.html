<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

<script>
const D = {"gerado_em": "21/10/2026 15:27", "stats": {"noticias_novas": 1004, "resumos_gerados": 246}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Tribunal Superior Eleitoral (TSE) está estudando desativar canais de WhatsApp com conteúdo político nas 48 horas anteriores ao segundo turno das eleições, marcado para o próximo domingo (25), o que gerou debate sobre liberdade política. O deputado do Progressista, Doorgal, já tem votos suficientes para presidir a Assembleia Legislativa de Minas Gerais (ALMG) e pode contar com o apoio do Partido Liberal, PSD, Republicanos e União Brasil. O PT ainda não descartou o apoio. Na reta final da campanha, Flávio Bolsonaro e Lula estão empatados nas pesquisas, com o senador liderando numericamente, mas com margem de erro. Além disso, o governo federal propôs a tarifa zero no transporte público aos finais de semana, enquanto o presidente Lula sancionou a perda de dívidas para Microempreendedores Individuais (MEIs).", "mundo": "As manifestações em Portugal são motivadas por questões econômicas, políticas e sociais, destacando-se a desigualdade econômica, a crise de imigração e o abuso de poder por parte de políticos. Em outro desenvolvimento, a série 'O Experimento da Prisão de Stanford' foi lançada na Netflix, recriando um dos estudos psicológicos mais controversos da história. O chanceler cubano acusa os Estados Unidos de ameaçar países que votam a favor de Cuba na ONU, em referência ao embargo americano que tem sido aplicado há décadas. Além disso, o presidente francês Emmanuel Macron criticou as declarações de líderes estrangeiros, incluindo o presidente dos Estados Unidos Donald Trump, sobre os protestos na França, acusando-os de fazerem comentários 'estúpidos'. A Rússia libertou um americano preso após quatro anos de prisão, durante uma reunião com um enviado dos Estados Unidos para discutir a guerra na Ucrânia. Na África do Sul, a polícia prendeu pelo menos sete pessoas suspeitas de planejar ações violentas nas eleições parlamentares. Em Taiwan, cinco homens foram acusados de planejar atear um carro contra um comediante por causa de piadas sobre Xi Jinping, refletindo tensões entre a ilha e Pequim. A Rússia também libertou um americano que havia sido preso por combater ao lado das forças ucranianas. O governo sul-coreano se reuniu com o diretor-geral da OMS para discutir cooperação em saúde. Além disso, a Arábia Saudita executou dois cidadãos bangladesesy, levantando questionamentos sobre a diplomacia do Bangladesh. O Partido Comunista da China, com 100 milhões de membros, é considerado o partido político mais bem-sucedido do mundo, com o objetivo de ser o governo mais forte do planeta em 2049. Por fim, a economia chinesa é vista como a mais bem-sucedida do mundo.\n\nO Exército dos Estados Unidos detalhou suas preparações para a primeira cadeia de ilhas, uma estratégia geopolítica que engloba áreas estratégicas no Pacífico Oriental. Em meio a tensões, o presidente russo, Vladimir Putin, concordou em retomar as negociações de paz com a Ucrânia, mediadas pelos Estados Unidos. Essas ações refletem o cenário geopolítico complexo, com múltiplos interesses e estratégias em diferentes regiões do mundo.", "economia": "A aprovação rápida do orçamento suplementar é recomendada para manter os preços dos combustíveis sob controle, de acordo com informações do Taipei Times. A Meta foi multada em 25 bilhões de dólares no estado de New Mexico em relação ao escândalo Cambridge Analytica, conforme relato do CNBC International. O Ministério da Fazenda anunciou medidas para garantir a imunidade tributária nas importações para projetos de universidades públicas e instituições de ciência, tecnologia e inovação, informou a Agência Brasil de Economia. A Getty Images entrou em recuperação judicial nos Estados Unidos devido à pressão da dívida e do avanço das ferramentas de inteligência artificial, conforme noticiado pelo Jornal da Folha de Mercado. A Fitch Ratings prevê uma política fiscal mais rígida no Brasil em 2027, independentemente do resultado das eleições presidenciais, apontou a Agência Brasil de Economia.", "tecnologia": "A inteligência artificial tem se tornado um tema central na tecnologia global, com várias iniciativas e desafios surgindo recentemente. A descoberta de duas vulnerabilidades críticas no PHP, uma linguagem de programação amplamente utilizada, levou a uma medida de precaução global, com vários sites de governos europeus e empresas sendo desconectados temporariamente para correção. O presidente dos Estados Unidos, Joe Biden, propôs que centrais de dados de inteligência artificial devem pagar 'dividendos' antes das eleições de meio ano, refletindo a crescente importância dessas infraestruturas. Além disso, o uso de IA na pesquisa acadêmica está gerando debates sobre autoria e rigor, enquanto a tecnologia está sendo usada para criar chatbots baseados em amados falecidos, levantando questões éticas. A fusão de Tesla e SpaceX, liderada por Elon Musk, continua a ser um grande desafio, com Musk precisando convencer acionistas e reguladores globais.", "ciencia": "O Japão está na frente da China na corrida para obter amostras de Marte, com uma sonda que viajará até Fobos, uma das luas de Marte, potencialmente fornecendo as primeiras amostras do sistema marciano trazidas à Terra. Em outro avanço, a NASA realizou um voo de passagem sobre o estádio da Universidade da Alabama, destacando suas contribuições para aeronáutica. A NASA também registrou um novo recorde em Marte, com o rover Perseverance atingindo 45,22 km de distância total percorrida, o maior percurso realizado por um veículo em outro mundo até o momento. Na Terra, a GSK obteve aprovação da FDA para um medicamento contra a hepatite B que estendeu curas funcionais para um número significativamente maior de pacientes. Além disso, a Roivant relatou resultados positivos em ensaios clínicos de um medicamento imunológico para a doença ocular uveítis não-infectiosa. Em pesquisa, cientistas conseguiram pela primeira vez realizar medições quânticas em uma partícula de positrão por um mês, o tempo mais longo que uma partícula de positrão foi mantida sob controle até agora.", "cultura": "A Globo planeja explicar o destino de personagens de 'Avenida Brasil' que não retornarão na sequência da novela durante a primeira semana de sua estreia, prevista para janeiro de 2027. Além disso, a Globo está produzindo um documentário sobre Tom Jobim para comemorar seu centenário de nascimento, que será lançado no Globoplay no mesmo mês. Na área cultural, Peter Nagy, artista e galerista que influenciou as artes em Nova York e Nova Deli, faleceu aos 66 anos. Dois restaurantes brasileiros, Nelita e Evvai, foram incluídos na lista dos 50 melhores restaurantes do mundo. O Nelita ocupou a 54ª posição, enquanto o Evvai ficou na 68ª. A cantora e compositora Suzy Mac lançou o EP 'Amor e Atitude' e se apresenta no Dolores Club, na Lapa, no Rio de Janeiro, nesta quinta-feira (22), mesclando elementos de samba, bossa nova, soul e jazz. O documentário 'Lula', dirigido por Oliver Stone, está sendo remontado após sua exibição no Festival de Cannes há dois anos, mas ainda não foi lançado comercialmente nem em plataformas de streaming, incluindo no Brasil. Além disso, a exposição 'Marília Mendonça - Sentimento Louco' no Museu da Imagem e do Som de São Paulo explora a música sertaneja, historicamente negligenciada pelos acadêmicos e críticos, e a localização do museu no bairro nobre do Jardim Europa contrasta com o tema popular da exposição.", "sociedade": "Milhares de pessoas se manifestaram em frente à Praça Rossio, em Lisboa, em protesto contra os altos custos imobiliários, após a polícia ter removido um acampamento. Eles planejaram retornar ao local no dia seguinte para acampar novamente. Em outro ponto, a movimentação estudantil na Sérvia, conhecida como Student List, tem protestado por dois anos seguidos. No próximo domingo, a organização tentará desafiar o partido no poder, que já governa há 12 anos. Em Belo Horizonte, uma escola manteve as aulas após a morte de uma professora, o que gerou revolta entre os alunos. O Sindicato criticou a postura da instituição. Em São Paulo, a Justiça manteve a condenação de quatro réus que foram acusados de integrarem o 'Setor das Reivindicações' da ONG Pacto Social e Carcerário, considerada uma estrutura de fachada do PCC. Além disso, a transformação acelerada, impulsionada por tecnologias como a IA, é questionada no cenário educacional, destacando a necessidade de fortalecer a escola e a cidadania para o futuro.", "meio_ambiente": "Um relatório da ONU destaca que as ações globais para combater o clima estão muito aquém das necessidades atuais, com a Terra ainda aquecendo 2,2 graus Fahrenheit acima das temperaturas atuais. Os Estados Unidos são apontados como o principal responsável por esse cenário. No Brasil, as chuvas retornaram ao Sul do país devido a uma área de baixa pressão, enquanto no Centro-Oeste as temperaturas elevadas chegaram a 41°C. Em Busan, na Coreia do Sul, autoridades realizaram o terceiro esforço para guiar um tubarão de fora de um canal, atraindo mais de um milhão de visitantes. Em outubro, Tóquio e Osaka, no Japão, registraram temperaturas acima de 30 graus Celsius, o que é mais tardio do que o normal para essa época do ano. Em Espanha, forças de resgate realizaram mais de 400 salvamentos na região de Valencia após intensas chuvas que deixaram pelo menos quatro mortos. Em Chiba, no Japão, 10 pessoas morreram e 37 ficaram feridas devido ao Tufão Dujuan. Em Palangkaraya, na ilha de Borneo, fogo florestal tem coberto a cidade com fuligem tóxica por semanas, causando sintomas respiratórios persistentes e interrompendo o sistema educacional. A UNEP afirma que a oportunidade de manter o aumento da temperatura global abaixo de 1,5°C sem um 'overshoot' foi perdida devido a décadas de ação climática insuficiente. Além disso, a UNEP destaca que um rompimento temporário da linha de 1,5°C de aquecimento global é agora 'inevitável'.", "direitos_humanos": "A aprovação de medidas para relaxar a proibição quase total de abortos no Parlamento polonês, apesar de ser considerada um passo pequeno pelos ativistas, chama a atenção para debates sobre direitos humanos. Em contraste, um estudo de vacina contra hepatite B em recém-nascidos africanos, apoiado pelos EUA, foi interrompido devido à falta de aprovação governamental. No Brasil, a Justiça brasileira justificou o disparo de uma ação policial que resultou no atiramento de um bebê, enquanto famílias relatam a iminente deportação de detentos gravemente doentes para países desconhecidos na África. Em Paris, policiais são acusados de brutalizar menores, refletindo uma crescente desconfiança entre autoridades e manifestantes. Além disso, a administração Trump e tribunais conservadores estão dificultando a possibilidade de desafiar violações de direitos civis nos Estados Unidos, enquanto um testemunho confirma uma reunião entre uma senadora chilena e um postulante a partido conservador, revelando uma série de eventos que abrangem diferentes aspectos dos direitos humanos em diversos países."}, "resumo_do_dia": {"politica_nacional": [{"id": 215934, "titulo": "Bloquear canais de WhatsApp altera disputa e cria insegurança, afirmam juristas em nota ao TSE", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/bloquear-canais-de-whatsapp-altera-disputa-e-cria-inseguranca-afirmam-juristas-em-nota-ao-tse.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-21T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um grupo de 110 juristas, pesquisadores e líderes da sociedade civil enviou uma nota técnica ao Tribunal Superior Eleitoral (TSE) afirmando que o bloqueio de canais políticos de WhatsApp nas vésperas da eleição restringe a liberdade política de cidadãos e altera significativamente as condições da disputa eleitoral a poucos dias da votação.", "titulo_pt": "Bloquear canais de WhatsApp nas vésperas da eleição altera disputa e cria insegurança, afirmam juristas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 216177, "titulo": "Mendonça propõe vedar canais políticos antes do 2º turno, mas encontra resistência no TSE", "url": "https://www.jota.info/eleicoes/eleicoes-2026/mendonca-propoe-vedar-canais-politicos-antes-do-2o-turno-mas-encontra-resistencia-no-tse", "fonte_id": "jota", "data_pub": "2026-10-21T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do TSE (Tribunal Superior Eleitoral) Nunes Marques expressou resistência a mudanças no sistema de canais políticos antes do segundo turno das eleições. Outros ministros do TSE também indicaram que a discussão sobre o tema não deve avançar.", "titulo_pt": "Mendonça sugere vedação de canais políticos antes do 2º turno, mas encontra resistência no TSE", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 215949, "titulo": "Quaest: 21% apontam crescimento econômico e sair da crise como principal desafio do próximo presidente", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/10/21/quaest-principal-desafio-do-proximo-presidente.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-21T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "De acordo com uma pesquisa Quaest divulgada pela Globo e pelo jornal O Globo, 21% dos brasileiros consideram o crescimento econômico e a saída da crise como o principal desafio para o próximo presidente. O segundo desafio mais mencionado foi o combate à violência e ao crime, com 13%. A pesquisa foi realizada entre os dias 17 e 20 de outubro, com 2.154 entrevistas.", "titulo_pt": "21% Apontam crescimento econômico e saída da crise como principal desafio para o próximo presidente", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 216117, "titulo": "Doorgal já tem votos para presidir a ALMG e pode ter apoio até do PT", "url": "https://www.metropoles.com/minas-gerais/doorgal-ja-tem-votos-para-presidir-a-almg-e-pode-ter-apoio-ate-do-pt", "fonte_id": "metropoles", "data_pub": "2026-10-21T17:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado do Progressista recebeu apoio do Partido Liberal, PSD, Republicanos e União Brasil para a presidência da Assembleia Legislativa de Minas Gerais (ALMG). O PT não descartou o apoio ao candidato.", "titulo_pt": "Doorgal já tem votos para presidir a ALMG e pode ter apoio até do PT", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 215950, "titulo": "Na TV, Lula critica 'tesouraço' de Flávio Bolsonaro e exibe depoimento de ex-ministro de Jair; candidato do PL trata de mulheres e relembra debate", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/21/horario-eleitoral-presidente-21-outubro.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-21T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro exibiu peças eleitorais focadas em mulheres e trechos de debates presidenciais, enquanto Lula criticou o plano de cortes de gastos de Flávio, chamado de 'tesouraço', e apresentou propostas para a infraestrutura.", "titulo_pt": "Lula critica 'tesouraço' de Flávio Bolsonaro em debate eleitoral", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 215935, "titulo": "Entregadores e mototoboys fazem motociata pró-Lula no centro de São Paulo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/entregadores-e-mototoboys-fazem-motociata-pro-lula-no-centro-de-sao-paulo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-21T17:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Entregadores e motociclistas que trabalham para empresas de aplicativo realizaram uma motociata no centro de São Paulo em apoio à reeleição de Lula.", "titulo_pt": "Entregadores e motociclistas fazem motociata pró-lula no centro de São Paulo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 215951, "titulo": "Quaest: 39% dos eleitores dizem ser de direita; e 25%, de esquerda", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/10/21/quaest-eleitores-ideologia-21-out.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-21T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest, encomendada pela Globo e pelo jornal O Globo, revelou que 39% dos eleitores brasileiros se identificam como de direita, enquanto 25% se consideram de esquerda. O levantamento também mostrou que 23% dos eleitores se posicionam no centro e 7% não se identificam com nenhuma ideologia.", "titulo_pt": "39% Dos eleitores brasileiros se dizem de direita; 25%, de esquerda", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 215952, "titulo": "Em resposta a 'desafio' de Lula, Flávio impõe condições ao petista para liberar sigilos", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/10/21/em-resposta-a-desafio-de-lula-flavio-impoe-condicoes-ao-petista-para-liberar-sigilos.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-10-21T17:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro, candidato pelo PL à Presidência, apresentou uma petição no TSE em resposta ao desafio lançado por Lula, aceitando abrir seus sigilos bancário, fiscal e telefônico dos últimos 20 anos, bem como dos familiares e empresas relacionadas, mas impor a mesma condição ao petista.", "titulo_pt": "Em resposta a 'desafio' de Lula, Flávio impõe condições para liberar sigilos", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 216124, "titulo": "Flávio diz que abre sigilos se Marcola, ex-chefe de gabinete de Lula, abrir", "url": "https://www.metropoles.com/sao-paulo/flavio-diz-que-abre-sigilos-se-marcola-ex-chefe-de-gabinete-de-lula-abrir", "fonte_id": "metropoles", "data_pub": "2026-10-21T17:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro esteve em Guarulhos ao lado do governador Tarcísio para fortalecer sua candidatura na Grande São Paulo. O evento envolveu a abertura de sigilos, condicionada à Marcola.", "titulo_pt": "Flávio bolsonaro diz que abrirá sigilos se Marcola abrir também", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 216001, "titulo": "TSE estuda desativar canais políticos no WhatsApp 48h antes da eleição", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/tse-estuda-desativar-canais-politicos-no-whatsapp-48h-antes-da-eleicao", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-21T16:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) estuda desativar canais de WhatsApp com conteúdo político e mais de 200 mil seguidores nas 48 horas anteriores e 24 horas após o segundo turno das eleições, marcado para o próximo domingo (25). A medida, se aprovada, entraria em vigor imediatamente.", "titulo_pt": "TSE estuda desativar canais políticos no WhatsApp 48h antes da eleição", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 216002, "titulo": "Governo envia ao Congresso proposta de tarifa zero no transporte", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/governo-envia-ao-congresso-proposta-de-tarifa-zero-no-transporte", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-21T16:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo federal enviou ao Congresso Nacional uma proposta de emenda à Constituição que destina recursos de emendas parlamentares para custear a gratuidade do transporte público coletivo urbano aos fins de semana e feriados. O texto prevê que no mínimo 26,8% do montante global anual das emendas parlamentares seja usado para este fim.", "titulo_pt": "Governo envia proposta de tarifa zero no transporte público", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 216049, "titulo": "Lula sanciona perdão de dívidas de MEIs e propõe transporte gratuito nos fins de semana", "url": "https://veja.abril.com.br/economia/lula-sanciona-perdao-de-dividas-de-meis-e-propoe-transporte-gratuito-nos-fins-de-semana/", "fonte_id": "veja", "data_pub": "2026-10-21T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula sancionou uma medida que inclui o perdão de dívidas para Microempreendedores Individuais (MEIs) e propôs o transporte gratuito nos fins de semana. A medida também amplia o teto de faturamento permitido para essa categoria.", "titulo_pt": "Lula sanciona perdão de dívidas de MEIs e propõe transporte gratuito nos fins de semana", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 216163, "titulo": "Flávio impõe condições para aceitar desafio de Lula sobre sigilo", "url": "https://www.cnnbrasil.com.br/eleicoes/flavio-impoe-condicoes-para-aceitar-desafio-de-lula-sobre-sigilo/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-21T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula propôs um desafio ao candidato Flávio Bolsonaro durante o primeiro debate do segundo turno, pedindo que ele liberasse seus dados bancários, fiscais e telefônicos, com a condição de que o senador fizesse o mesmo.", "titulo_pt": "Flávio impõe condições para aceitar desafio de Lula sobre sigilo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 216053, "titulo": "Lula envia PEC para garantir transporte gratuito nos fins de semana; veja como será financiado", "url": "https://veja.abril.com.br/economia/lula-envia-pec-para-garantir-transporte-gratuito-nos-fins-de-semana-veja-como-sera-financiado/", "fonte_id": "veja", "data_pub": "2026-10-21T16:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula enviou uma Proposta de Emenda à Constituição (PEC) para garantir transporte gratuito nos fins de semana. A proposta prevê a destinação de aproximadamente 12 bilhões de reais em emendas parlamentares para financiar a gratuidade em ônibus e outros transportes coletivos.", "titulo_pt": "Lula envia PEC para garantir transporte gratuito nos fins de semana; veja como será financiado", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 216058, "titulo": "Pedido da campanha de Lula para debate da Globo pode prejudicar o próprio presidente", "url": "https://veja.abril.com.br/politica/pedido-da-campanha-de-lula-para-debate-da-globo-pode-prejudicar-o-proprio-presidente/", "fonte_id": "veja", "data_pub": "2026-10-21T15:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O pedido da campanha de Lula para um debate na Globo pode resultar em dificuldades para verificar acusações em tempo real e expor declarações do petista ao escrutínio.", "titulo_pt": "Pedido de Lula para debate na Globo pode prejudicar presidente", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 216180, "titulo": "Globo/Quaest registra diferença de um ponto entre Flávio Bolsonaro e Lula", "url": "https://www.jota.info/eleicoes/eleicoes-2026/globo-quaest-registra-diferenca-de-um-ponto-entre-flavio-bolsonaro-e-lula", "fonte_id": "jota", "data_pub": "2026-10-21T15:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O levantamento da Globo/Quaest indica que o senador Flávio Bolsonaro tem 45% das intenções de voto, enquanto o presidente Lula tem 44%. A diferença entre os dois permanece dentro da margem de erro, mas é menor do que na pesquisa anterior.", "titulo_pt": "Globo/Quaest registra diferença de um ponto entre Flávio Bolsonaro e Lula", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 216646, "titulo": "US Army details First Island Chain preparations", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/22/2003866404", "fonte_id": "taipei_times", "data_pub": "2026-10-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Exército dos Estados Unidos detalhou as preparações para a primeira cadeia de ilhas, uma estratégia geopolítica que envolve áreas estratégicas no Pacífico Oriental. As informações não especificam detalhes operacionais, mas indicam que o plano envolve várias forças militares americanas.", "titulo_pt": "Exército dos EUA detalha preparações para a primeira cadeia de ilhas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 216571, "titulo": "What’s behind protests in Portugal?", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/21/whats-behind-protests-in-portugal-2?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-21T17:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As manifestações em Portugal são motivadas por uma combinação de questões econômicas, políticas e sociais. Os principais pontos de contestação incluem a desigualdade econômica, a crise de imigração e a questão do abuso de poder por parte de políticos.", "titulo_pt": "O que está por trás das manifestações em Portugal?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 216213, "titulo": a_de": null, "texto_pt": "Os rendimentos das dívidas a 10 anos da França ultrapassaram o patamar de 5%. Esta elevação aumenta o custo do endividamento para empresas e famílias, o que deve ter um efeito negativo na atividade econômica.", "titulo_pt": "Crescentes custos da dívida dão outro golpe à economia francesa", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 215995, "titulo": "Procon paulistano multa Enel por falhas no fornecimento de energia", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/procon-paulistano-multa-enel-por-falhas-no-fornecimento-de-energia", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-21T16:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Procon Paulistano multou a Enel em R$ 11,4 milhões por falhas no fornecimento de energia elétrica entre setembro e dezembro de 2025, especialmente nos dias 8 a 10 de dezembro, quando cerca de 3 milhões de consumidores ficaram sem energia. A multa foi publicada no Diário Oficial da cidade de São Paulo.", "titulo_pt": "Procon paulistano multa Enel por falhas no fornecimento de energia", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 215996, "titulo": "Sancionada lei que perdoa dívida e aumenta limite de MEI", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/sancionada-lei-que-perdoa-divida-e-aumenta-limite-de-mei", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-21T16:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Foi sancionado um Projeto de Lei Complementar que perdoa dívidas de microempreendedores individuais com a União e aumenta o limite anual de faturamento da categoria. O Senado Federal aprovou o projeto com 78 votos favoráveis, sem contrários ou abstenções, após aprovação da Câmara dos Deputados.", "titulo_pt": "Lei sancionada perdoa dívida e aumenta limite de faturamento para meis", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 216547, "titulo": "Tesla earnings loom after Musk calls SpaceX merger a 'good idea'", "url": "https://www.cnbc.com/2026/10/21/tesla-tsla-q3-2026-earnings-report.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-21T16:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um dia após a SpaceX divulgar seus resultados do terceiro trimestre, a Tesla está programada para atualizar seus investidores. O CEO da Tesla, Elon Musk, sugeriu que uma fusão entre SpaceX e Tesla seria uma boa ideia.", "titulo_pt": "Earnings da tesla vêm após Musk sugerir fusão com SpaceX", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 216552, "titulo": "Musk's SpaceX stock gift is 'tip of the iceberg' for Trump Accounts, Altimeter's Gerstner says", "url": "https://www.cnbc.com/2026/10/21/musk-spacex-stock-trump-account.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-21T15:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Brad Gerstner, CEO da Altimeter Capital, sugere que o possível presente de ações da SpaceX por parte de Elon Musk através da Trump Accounts poderia ser apenas o início de uma iniciativa filantrópica mais ampla.", "titulo_pt": "Doação de ações da SpaceX por musk pode ser apenas o começo, diz ceo", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 215912, "titulo": "Getty Images entra com pedido em tribunal de falência nos EUA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/getty-images-entra-com-pedido-em-tribunal-de-falencia-nos-eua.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T15:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Getty Images, agência de fotografia americana, iniciou um processo judicial em um tribunal de falências nos Estados Unidos como parte de um plano para reestruturar sua dívida e se tornar uma entidade privada.", "titulo_pt": "Getty Images entra com pedido de falência nos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 215916, "titulo": "IRB(Re) tem lucro de R$9,4 mi em agosto com alta em sinistralidade", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/01/6562-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post467517", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T14:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O IRB (Re) registrou um lucro líquido de R$ 9,4 milhões em agosto, uma queda em comparação com os R$ 35,7 milhões do mesmo período do ano anterior, devido a uma deterioração significativa na sinistralidade.", "titulo_pt": "IRB (Re) registra lucro líquido de R$9,4 milhões em agosto com aumento na sinistralidade", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 215917, "titulo": "Fitch prevê aperto da política fiscal no Brasil em 2027 independentemente de resultado eleitoral", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://aovivo.folha.uol.com.br/mercado/2026/10/01/6562-dolar-empresas-e-bolsas-acompanhe-ao-vivo-o-mercado.shtml#post467516", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T14:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A agência Fitch Ratings prevê uma política fiscal mais rígida no Brasil em 2027, independentemente do resultado das eleições presidenciais deste mês. O aperto das contas públicas e os juros elevados serão fatores que afetarão a atividade econômica.", "titulo_pt": "Fitch prevê aperto da política fiscal no Brasil em 2027, independentemente do resultado eleitoral", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 215919, "titulo": "Associação de restaurantes processa Keeta por compra sem autorização", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ ência artificial para tomar decisões sobre pacientes. Isso contribuiu para impulsionar uma startup de tecnologia a uma avaliação de US$ 15 bilhões.", "titulo_pt": "IA atrai médicos nos EUA e impulsiona startup de US$ 15 bilhões", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 216362, "titulo": "You can now create an AI version of a dead loved one. Here’s what could happen.", "url": "https://www.vox.com/podcasts/506698/deadbots-ai-chatbots-ethics-talking-d", "fonte_id": "vox", "data_pub": "2026-10-21T15:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "É agora possível criar chatbots de inteligência artificial com base em amados falecidos para interagir com eles após a morte. Essa tecnologia levanta questões difíceis sobre como a experiência pode afetar o luto.", "titulo_pt": "Você pode agora criar versões de IA de entes queridos falecidos. E isso poderia mudar sua dor?", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 216580, "titulo": "Trump says AI data centres should pay ‘dividends’ in pre-midterm shift", "url": "https://www.aljazeera.com/news/2026/10/21/trump-says-ai-data-centres-should-pay-dividends-in-pre-midterm-shift?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-21T15:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Trump, continua a apoiar centrais de dados, mesmo com o crescimento da oposição republicana. Ele propôs que essas centrais de dados paguem 'dividendos' antes das eleições de meios anos.", "titulo_pt": "Trump defende centrais de dados e propõe 'dividendos' antes das eleições", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 216183, "titulo": "Do PJe à fila do balcão: como a IA vai promover o próximo salto da advocacia", "url": "https://www.jota.info/coberturas-especiais/ai-no-brasil/do-pje-a-fila-do-balcao-como-a-ia-vai-promover-o-proximo-salto-da-advocacia", "fonte_id": "jota", "data_pub": "2026-10-21T15:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A adoção da inteligência artificial no setor jurídico brasileiro deve trazer benefícios significativos. Se seguir o passado, o setor pode experimentar um avanço significativo graças à tecnologia.", "titulo_pt": "Do PJe à fila do balcão: como a IA vai promover o próximo salto da advocacia", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 216705, "titulo": "Jensen Huang’s Vision for Europe Runs on Plug-In Data Centers", "url": "https://www.wired.com/story/jensen-huangs-vision-for-europe-runs-on-plug-in-data-centers/", "fonte_id": "wired", "data_pub": "2026-10-21T15:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na GTC em Berlim, Jensen Huang apresentou a nova data center plug-in da Nvidia, o DSX Pod, como a chave para resolver atrasos na infraestrutura de IA da Europa. O anúncio também abordou robótica autônoma humanoid.", "titulo_pt": "Visão de Huang para Europa baseria-se em Data Centers Plug-In", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 216333, "titulo": "Booking.com under investigation by EU regulators over fake listings and scams", "url": "https://www.theguardian.com/world/2026/oct/21/bookingcom-under-investigation-eu-regulators-fake-listings-scams", "fonte_id": "guardian_world", "data_pub": "2026-10-21T15:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Europeia está investigando o Booking.com devido a acusações de que a plataforma não tem feito o suficiente para proteger os consumidores de listagens falsas e golpes de phishing. De acordo com a Comissão, o Booking.com pode ter violado a Lei do Serviço Digital da União Europeia (DSA) devido ao seu abordagem 'absolutamente substandard' para lidar com esses problemas.", "titulo_pt": "Booking.Com é investigado pela comissão europeia por listagens falsas e golpes de phishing", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 216391, "titulo": "The Data-Center Rebellion Is Just Beginning", "url": "https://www.theatlantic.com/technology/2026/10/year-world-turned-data-centers/689081/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-21T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A infraestrutura de data centers que por muito tempo passou despercebida agora é objeto de indignação nacional e global.", "titulo_pt": "A rebelião dos data centers apenas começou", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 216569, "titulo": "Who’s paying for the AI build-out? Probably you", "url": "https://www.ft.com/content/09f56730-4702-446d-9986-f7c93ffe6bf0?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-21T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cada grande fundo de capital, em cada canto do mundo desenvolvido, está financiando centrais de dados.", "titulo_pt": "Quem está pagando pela expansão da IA? Provavelmente você", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 216767, "titulo": "STAT+: What’s the deal with Isomorphic Labs?", "url": "https://www.statnews.com/2026/10/21/whats-the-deal-with-isomorphic-labs-ai-prognosis/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-21T17:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Esta edição da AI Prognosis da STAT discute o valor de mercado elevado da Isomorphic Labs e sua relação com o papel da inteligência artificial no desenvolvimento de medicamentos, bem como o debate sobre a inteligência artificial e o custo de cuidados.", "titulo_pt": "O que o alto valor da Isomorphic Labs diz sobre o papel da IA no desenvolvimento de medicamentos?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 216134, "titulo": "Japão larga na frente da China na corrida para trazer amostras de Marte", "url": "https://www.infomoney.com.br/mundo/japao-larga-na-frente-da-china-na-corrida-para-trazer-amostras-de-marte/", "fonte_id": "infomoney", "data_pub": "2026-10-21T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A agência espacial japonesa está à frente da chinesa na corrida para trazer amostras de Marte, com uma sonda que viajará até Fobos, uma das luas de Marte. Esta missão tem potencial para fornecer as primeiras amostras do sistema marciano trazidas à Terra.", "titulo_pt": "Japão se antecipa à China na corrida por amostras de Marte", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 216046, "titulo": "4 pesquisas avançadas que podem revolucionar o tratamento da Aids — e até levar à cura da doença", "url": "https://veja.abril.com.br/saude/4-pesquisas-avancadas-que-podem-revolucionar-o-tratamento-da-aids-e-ate-levar-a-cura-da-doenca/", "fonte_id": "veja", "data_pub": "2026-10-21T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudos no Brasil e em outros países buscam desenvolver novas abordagens para tratar a AIDS, enquanto novas terapias visam simplificar a prevenção e o controle da infecção. Pesquisas buscam superar o mecanismo de ação do HIV.", "titulo_pt": "4 Pesquisas avançadas que podem revolucionar o tratamento da Aids — e até levar à cura da doença", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 216778, "titulo": "AI could turn scientific papers into research assistants", "url": "https://www.sciencenews.org/article/ai-scientific-papers-research-assistant", "fonte_id": "science_news", "data_pub": "2026-10-21T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um assistente virtual de inteligência artificial pode auxiliar cientistas ao aplicar os métodos de um artigo em novos dados. No entanto, ele não substituirá a expertise humana em pesquisa.", "titulo_pt": "IA poderia transformar artigos científicos em assistentes de pesquisa", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 216772, "titulo": "Super Typhoon Champi sets the record for strongest storm of 2026", "url": "https://www.scientificamerican.com/article/super-typhoon-champi-sets-the-record-for-strongest-storm-of-2026/", "fonte_id": "scientific_american", "data_pub": "2026-10-21T16:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ciclone Super Typhoon Champi registrou os ventos mais fortes do ano, alcançando 185 milhas por hora.", "titulo_pt": "Super Typhoon Champi estabelece recorde como tempestade mais forte de 2026", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 216797, "titulo": "NASA to Conduct NCAA Flyover, Engage Fans at University of Alabama", "url": "https://www.nasa.gov/news-release/nasa-to-conduct-ncaa-flyover-engage-fans-at-university-of-alabama/", "fonte_id": "nasa_news", "data_pub": "2026-10-21T16:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA realizará um voo de passagem sobre o estádio da Universidade da Alabama durante o jogo contra a Texas A&M, no dia 24 de outubro. O Administrador da NASA, Jared Isaacman, pilotará um dos três caças F-5 durante o voo, destacando as contribuições da agência para aeronáutica e seu compromisso contínuo.", "titulo_pt": "NASA fará voo de passagem e engajará fãs na universidade da Alabama", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 216798, "titulo": "Tracks Along the Longest Drive on Another World", "url": "https://science.nasa.gov/blog/tracks-along-the-longest-drive-on-another-world/", "fonte_id": "nasa_news", "data_pub": "2026-10-21T15:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rover Perseverance da NASA atingiu um novo recorde em Marte, com uma distância total de 45,22 km (28,10 milhas) percorridas desde o seu desembarque. Este é o maior percurso realizado por um veículo em outro mundo até o momento.", "titulo_pt": "Rastreios ao longo do maior percurso no outro mundo", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 216779, "titulo": "A lifesaving medication is not behind the drop in U.S. overdose deaths", "url": "https://www.sciencenews.org/article/opioid-overdose-deaths-naloxone", "fonte_id": "science_news", "data_pub": "2026-10-21T15:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A possível razão para a diminuição nos óbitos por overdose é o aumento no uso de naloxona, que reversifica os sobredosagens de opioides. No entanto, apesar de continuar sendo uma ferramenta crucial, o uso de naloxona diminuiu.", "titulo_pt": "Medicação salva vidas não está por trás da redução nos óbitos por overdose nos EUA", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 216773, "titulo": "Report pinpoints future exploration sites on the moon", "url": "https://www.scientificamerican.com/article/report-pinpoints-future-exploration-sites-on-the-moon/", "fonte_id": "scientific_american", "data_pub": "2026-10-21T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório autoritativo indica locais além do polo sul lunar onde astronautas devem explorar a lua. Além de postos estabelecidos no polo sul, o relatório sugere outros locais para futuras missões lunares.", "titulo_pt": "Relatório indica novos locais para exploração lunar", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 216792, "titulo": "TechnoMile Recognized as a 2026 Inc. Power Partner Award Winner", "url": "https://spacenews.com/technomile-recognized-as-a-2026-inc-power-partner-award-winner/", "fonte_id": "spacenews", "data_pub": "2026-10-21T15:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "TechnoMile, uma solução de IA líder no mercado que une fluxos de trabalho de crescimento, contratos, conformidade e segurança, foi reconhecida como vencedora dos Inc. Power Partner Awards 2026.", "titulo_pt": "Technomile é reconhecida como vencedora do Inc. Power Partner awards 2026", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 215974, "titulo": "Pesquisadores repatriados dizem temer corte de recursos e fuga de cérebros", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/pesquisadores-repatriados-dizem-temer-corte-de-recursos-e-fuga-de-cerebros.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-21T15:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores brasileiros que retornaram do exterior para trabalhar no país expressam preocupações sobre a possibilidade de cortes de recursos e instabilidade orçamentária após as eleições presidenciais, o que poderia comprometer seus projetos e carreiras.", "titulo_pt": "Pesquisadores repatriados temem cortes de recursos e instabilidade orçamentária", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 216799, "titulo": "Science on the Space Station with NASA Astronaut Jessica Watkins", "url": "https://www.nasa.gov/image-article/science-on-the-space-station-with-nasa-astronaut-jessica-watkins/", "fonte_id": "nasa_news", "data_pub": "2026-10-21T15:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astronauta Jessica Watkins da NASA, durante a Expedição 75, realizou experimentos dentro do módulo Kibo da Estação Espacial Internacional em 9 de outubro de 2026, misturando amostras de células vivas com bioquímica e preenchendo uma cartucho com a mistura células-bioquímica. Essas operações de pesquisa avançada fazem parte da investigação InSPA-Auxilium Bioprinter-Cell Printing.", "titulo_pt": "Ciência na estação espacial com a astronauta Jessica Watkins", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 216774, "titulo": "Physicists trap a single antimatter particle for a month", "url": "https://www.scientificamerican.com/article/physicists-trap-a-single-antimatter-particle-for-a-month/", "fonte_id": "scientific_american", "data_pub": "2026-10-21T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas conseguiram pela primeira vez realizar medições quânticas em uma partícula de positrão por um mês. Este é o tempo mais longo que uma partícula de positrão foi mantida sob controle até agora.", "titulo_pt": "Físicos prendem uma única partícula de antimateria por um mês", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 216793, "titulo": "Global Satcom Services Revenues to Reach $145 Billion by 2035", "url": "https://spacenews.com/global-satcom-services-revenues-to-reach-145-billion-by-2035/", "fonte_id": "spacenews", "data_pub": "2026-10-21T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As receitas globais dos serviços de satélite devem crescer 44% e atingir US$ 145 bilhões até 2035, de acordo com a 33ª edição do relatório da Novaspace sobre Conectividade Espacial.", "titulo_pt": "Receitas globais de serviços de satélite devem chegar a 145 bilhões de dólares até 2035", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 216794, "titulo": "Space Nuclear Power Corporation Awarded DARPA Agreement for Ground Test of Autonomous Nuclear Reactor Controller", "url": "https://spacenews.com/space-nuclear-power-corporation-awarded-darpa-agreement-for-ground-test-of-autonomous-nuclear-reactor-controller/", "fonte_id": "spacenews", "data_pub": "2026-10-21T14:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Space Nuclear Power Corporation recebeu um acordo do Defense Advanced Research Projects Agency (DARPA) para realizar um teste terrestre de um controlador autônomo de reator nuclear. A empresa anunciou a notícia em Los Alamos, Novo México, em 21 de outubro de 2026.", "titulo_pt": "Space Nuclear Power Corporation recebe acordo DARPA para teste terrestre de controlador autônomo de reator Nuclear", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 216768, "titulo": "STAT+: GSK picks up hep B drug approval", "url": "https://www.statnews.com/2026/10/21/biotech-news-gsk-picks-up-hep-b-drug-approval/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-21T14:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A GSK obteve aprovação da FDA para seu medicamento contra hepatite B, que estendeu curas funcionais para um número significativamente maior de pacientes em comparação com métodos anteriores.", "titulo_pt": "GSK conquista aprovação para medicamento contra hepatite B", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 216862, "titulo": "Ben Folds Five Announce First Tour Since 2013", "url": "https://pitchfork.com/story/ben-folds-five-announce-first-tour-since-2013/", "fonte_id": "pitchfork", "data_pub": "2026-10-21T17:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ben Folds Five anunciaram uma turnê para o próximo verão, sendo a primeira desde 2013.", "titulo_pt": "Ben Folds Five anunciam primeira turnê desde 2013", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 216832, "titulo": "Peter Nagy, Artist and Gallerist Who Shaped Two Art Scenes, Dies at 66", "url": "https://hyperallergic.com/peter-nagy-artist-and-gallerist-who-shaped-two-art-scenes-dies-at-66/", "fonte_id": "hyperallergic", "data_pub": "2026-10-21T17:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Peter Nagy, artista e galerista que influenciou as artes de Nova York e Nova Deli, faleceu aos 66 anos. Ele era conhecido por sua pintura abstrata que incorporava o mundo e era um apoiador importante da cena artística de Denver.", "titulo_pt": "Peter Nagy, artista e galerista que moldou duas cena artísticas, morre aos 66 anos", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 215977, "titulo": "Globo vai explicar destino de personagens que não estarão em 'Avenida Brasil 2'", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha. es do mundo", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 216827, "titulo": "‘A vehicle to expose prejudice, bias, and stupidity’: Sacha Baron Cohen defends Ali G as satire", "url": "https://www.theguardian.com/film/2026/oct/21/sacha-baron-cohen-defends-ali-g", "fonte_id": "guardian_culture", "data_pub": "2026-10-21T16:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sacha Baron Cohen defendeu seu personagem Ali G e seu novo filme 'Ali G: Who Iz I?' em uma entrevista para a Time magazine, argumentando que a sátira é mais importante do que nunca e que algumas pessoas podem se ofender em vez de rir. Cohen afirmou que seu objetivo é fazer as pessoas enfrentarem o perigo do fanatismo e das teorias da conspiração.", "titulo_pt": "Veículo para expor preconceitos, viés e estupidez: sacha Baron Cohen defende Ali G como sátira", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 215980, "titulo": "'Não existe mais a imagem verdadeira', diz diretor de filme sobre polarização", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/nao-existe-mais-a-imagem-verdadeira-diz-diretor-de-filme-sobre-polarizacao.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-21T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O diretor de filme Álvaro Andrade Alves começou a gravar lives e conteúdos que apareciam em sua timeline do TikTok nos dias que antecederam o segundo turno da eleição presidencial de 2022, entre Lula e Jair Bolsonaro, sem uma intenção prévia.", "titulo_pt": "Não existe mais a imagem verdadeira", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 216392, "titulo": "The Paradox of African Writing and AI", "url": "https://www.theatlantic.com/books/2026/10/caine-prize-winner-tope-folarin-on-african-writing-and-ai/689098/?utm_source=feed", "fonte_id": "the_atlantic", "d
