<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

  </div>
</div>

const D = {"gerado_em": "14/08/2026 07:24", "stats": {"noticias_novas": 807, "resumos_gerados": 248}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Supremo Tribunal Federal (STF) começou a analisar um pedido que busca dispensar a adesão individual ao acordo, que prevê o pagamento de R$ 6,1 bilhões aos poupadores afetados pelos planos econômicos. Paralelamente, o governo Lula elevou a previsão do salário mínimo para R$ 1.741 em 2027, um aumento de R$ 24 em relação à estimativa anterior. O patrimônio do senador Flávio Bolsonaro (PL) cresceu 211% desde sua última eleição como senador em 2018, passando de R$ 2,63 milhões para R$ 8,18 milhões. Além disso, o STF determinou que sete Tribunais de Justiça suspendam pagamentos irregulares e devolvam valores excessivos, reforçando a fiscalização das folhas de pagamento do Judiciário.", "mundo": "Um missionário americano, Kevin Rideout, foi libertado após nove meses de sequestro no Níger. Segundo sua organização, ele está em boas condições de saúde e sob cuidados dos Estados Unidos. Em um evento especial na televisão, rádio e digital, a Rai homenageou Baudino um ano após sua morte, destacando seu papel como símbolo do serviço público italiano. A ONU registrou o maior número de vítimas civis desde maio de 2022 em consequência dos ataques russos na Ucrânia, com pelo menos uma morte e 15 feridos em Kramatorsk. Na Moldávia, Moscou financiou padres ortodoxos, realizou um esquema de compra de votos e estabeleceu centros de treinamento para interferir nas eleições com o objetivo de desestabilizar o governo orientado para o Ocidente.\n\nA ONU pediu moderação à Rússia e ao Japão para evitar um aumento das tensões após uma visita de Putin às Ilhas Kuriles. Além disso, drones estão transformando a dinâmica dos combates tanto no Irã quanto na Ucrânia, com ataques a alvos ferroviários e portuários por parte da Rússia em território ucraniano. Em outro desenvolvimento, o governo americano planeja intensificar a pressão econômica sobre o Irã, passando de um bloqueio marítimo para uma estratégia mais ampla de isolamento financeiro. A Coreia do Norte ameaça desenvolver novos 'deterrentes' antes das manobras militares anuais entre EUA e Coreia do Sul, enquanto a Ucrânia continua a concentrar seus ataques com drones nas instalações produtoras de combustível russas. Estas notícias refletem a complexidade da geopolítica global atual, marcada por tensões regionais e estratégias econômicas e militares em diversos pontos do mundo.", "economia": "O número de casos de estelionato relacionados a investimentos em Hong Kong diminuiu 15% no primeiro semestre deste ano, mas os prejuízos permaneceram altos, atingindo HK$1,65 bilhão (US$210 milhões), conforme relatório da polícia. No Brasil, o Tesouro IPCA+ 2026 está devolvendo R$ 260 bilhões aos investidores, que precisarão reinvestir esses recursos após o vencimento. A economia brasileira enfrenta desafios tributários e regulatórios: a pesquisa Global Tax Policy da Deloitte aponta maior complexidade regulatória como principal obstáculo para líderes financeiros, enquanto as novas regras do Banco Central sobre transações de criptomoedas são recebidas com desagrado pelo setor. A Azul registrou um prejuízo líquido de R$ 1 bilhão no segundo trimestre de 2026, impulsionado pela elevação dos preços dos combustíveis. Além disso, a China está investindo significativamente na biotecnologia agrícola para aumentar a segurança alimentar, enquanto o governo japonês considera um programa de subvenções para revitalizar lojas vazias em áreas urbanas.", "tecnologia": "A Samsung Electronics investiu um recorde de 27,3 trilhões de wones em pesquisa e desenvolvimento no primeiro semestre de 2023, refletindo a importância da inovação tecnológica para o setor. Paralelamente, a Skytech está focada na alta demanda associada ao boom da inteligência artificial (IA), enquanto a Unitree, uma empresa de robótica, busca avaliar seu potencial comercial em um cenário geopolítico cada vez mais complexo. No que diz respeito à IA, o estudo do Reglab indica que a tecnologia pode contribuir com quase R$ 1 trilhão ao PIB brasileiro entre 2027 e 2030. Por outro lado, a AI enfrenta desafios regulatórios: a JPMorgan descredenciou a Polymarket devido a preocupações regulatórias, enquanto a Apple e Epic Games discutem sobre taxas relacionadas às compras feitas fora do App Store. Além disso, um incidente com um agente malicioso na OpenAI levantou questionamentos sobre a segurança da IA e cibersegurança, destacando os riscos associados à evolução rápida dessa tecnologia.", "ciencia": "Uma empresária chinesa de 73 anos se tornou a 22ª passageira do fogueto nacionalmente desenvolvido CYZ1, projeto da start-up espacial InterstellOr. Ela está programada para realizar uma missão suborbital em 2028, atingindo a linha de Kármán e podendo observar a Terra desde essa altitude. Em um evento relacionado à exploração lunar, um foguete da SpaceX bateu na lua no início deste mês, destacando o risco que aumentará à medida que a humanidade estabelece uma presença na vizinha esfera lunar. Um novo telescópio chamado Mothra, ainda em construção nas montanhas do norte do Chile, produziu uma imagem da nebulosa da Hélice, mostrando o fim da vida de uma estrela. Este é um exemplo impressionante dos processos celestes difíceis de serem fotografados. Um relatório de mercado sobre serviços in-orbit prevê que os serviços emergentes gerarão aproximadamente $3 bilhões em receitas cumulativas nos próximos dez anos, destacando o desenvolvimento inicial deste setor.", "cultura": "A Bienal do Livro 2026, que acontecerá entre os dias 4 e 13 de setembro no Distrito Anhembi, na Zona Norte da capital paulista, é um dos principais eventos culturais anunciados. O miniálbum 'Kiss n' Tell' da girl group Aespa marca uma mudança na sonoridade habitual do grupo, incorporando elementos musicais mais suaves e ritmos afro-americanos. O documentário 'Hollywood Crime Story: O Crime Organizado Dominou os Filmes', de Fabio Sparvoli, explora a influência do crime organizado no setor cinematográfico desde seus tempos iniciais. A Galeria Teo transformou uma antiga fábrica em um armazém que exibe móveis modernos brasileiros; algumas peças apresentam sinais de desgaste e deterioração. A Ópera de Buenos Aires estreia a grande produção da ópera Otello, com direção cênica de Fabio Sparvoli e escenografia de Nicolás Boni.", "sociedade": "Um grupo foi alvo de uma investigação da PCERJ por praticar sequestros-relâmpago, com uma vítima mantida refém durante oito horas e um prejuízo estimado em R$ 500 mil. Além disso, a Polícia Militar realizou uma operação no presídio da Grande BH para identificar eventuais irregularidades. Em Goiânia, será construída a maior Casa Ronald McDonald da América Latina e a primeira sustentável, com práticas como energia solar e madeira engenheirada. O projeto está previsto para expansão até 2030.", "meio_ambiente": "A Europa enfrenta uma série de desafios ambientais, com temperaturas acima de 35°C afetando mais de 135 milhões de pessoas. Em Portugal e França, as autoridades emitem alertas para incêndios florestais, enquanto o Reino Unido registra sua temperatura mais alta do ano, com 38,1°C. Na Colômbia, um terremoto de magnitude 7,4 causou 281 mortes e danos significativos em Cali. No Oriente Médio, uma mancha de óleo de mais de 2.000 km² afeta a costa do Omã após o naufrágio de um navio-tanque russo. Em outros países, como na Croácia, incêndios florestais obrigam milhares de pessoas a deixarem suas casas. A Greenpeace pede uma revisão da lei de energia, enquanto o Chile Carbon Forum se prepara para sua terceira edição, focada em estándares globais e financiamento climático.", "direitos_humanos": "Mais de 2,6 milhões de meninas no Afeganistão não tiveram acesso à educação secundária desde 2021, conforme relatório do UNICEF. Em outro desenvolvimento, a Suécia reduziu a maioridade penal para 14 anos e essa medida entrou em vigor três dias antes das eleições gerais suecas. Um homem que colidiu com sua ex-parceira foi preso preventivamente e a vítima, que corre risco vital, foi internada. Além disso, a Comissão Nacional de Direitos Humanos da Coreia decidiu que um banho público discriminava as mulheres ao cobrar apenas pelo uso de toalhas e sabonete, recomendando medidas corretivas para resolver o problema."}, "resumo_do_dia": {"politica_nacional": [{"id": 103478, "titulo": "Motta adia votação do reajuste do Simples Nacional para depois das eleições", "url": "https://www.jota.info/tributos/motta-adia-votacao-do-reajuste-do-simples-nacional-para-depois-das-eleicoes", "fonte_id": "jota", "data_pub": "2026-08-14T09:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Motta adiou a votação do reajuste do Simples Nacional para após as eleições. A decisão foi tomada devido à resistência da equipe econômica, que está contra uma versão mais ampla do projeto.", "titulo_pt": "Motta adia votação do reajuste do Simples Nacional para depois das eleições", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 103346, "titulo": "Aluna de direito que dá curso para evitar golpe é presa por dar golpe", "url": "https://www.metropoles.com/distrito-federal/na-mira/aluna-de-direito-que-da-curso-para-evitar-golpe-e-presa-por-dar-golpe", "fonte_id": "metropoles", "data_pub": "2026-08-14T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma aluna de direito de 22 anos foi presa por operar, junto com seu companheiro, uma 'loja cenográfica' de golpes. Ela ensinava nas redes sociais como evitar fraudes, mas na realidade estava praticando golpes.", "titulo_pt": "Aluna de direito que dava aula para evitar golpe é presa por praticar golpes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 103235, "titulo": "Governo Lula eleva previsão de salário mínimo para R$ 1.741 em 2027", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/governo-lula-eleva-previsao-de-salario-minimo-para-r-1741-em-2027.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-14T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula elevou a projeção do salário mínimo para R$ 1.741 em 2027, um aumento de R$ 24 em relação à estimativa anterior de R$ 1.717.", "titulo_pt": "Governo Lula eleva previsão de salário mínimo para R$ 1.741 em 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 103266, "titulo": "Damares defende medidas contra Discord se não houver garantias de proteção às crianças", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/damares-defende-medidas-contra-discord-se-nao-houver-garantias-de-protecao-as-criancas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-14T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A senadora Damares Alves cobrou garantias mais efetivas de proteção às crianças e adolescentes do Discord. Ela defendeu a aplicação de punições para que a plataforma adote medidas.", "titulo_pt": "Damares defende medidas contra o Discord se não houver garantias de proteção às crianças", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 103475, "titulo": "Ele contou ao ChatGPT que queria matar o filho e foi preso — conversas com IA podem ser prova de crime no Brasil?", "url": "https://www.bbc.com/portuguese/articles/c8dn1l7vr6ro?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-14T08:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Conversas trocadas com o ChatGPT estavam sendo investigadas como possível prova de crime, mas especialistas questionaram os limites dessa evidência e a necessidade de analisar o contexto completo das mensagens.", "titulo_pt": "Ele contou ao ChatGPT que queria matar o filho e foi preso — conversas com IA podem ser prova de crime no Brasil?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 103479, "titulo": "Por que regular o jogo", "url": "https://www.jota.info/opiniao-e-analise/artigos/por-que-regular-o-jogo", "fonte_id": "jota", "data_pub": "2026-08-14T08:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Proibir jogos não os elimina, mas diminui a proteção e a experiência para os usuários. Isso foi comprovado pela situação em outros países.", "titulo_pt": "Por que regular o jogo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 103485, "titulo": "A exceção de contrato não cumprido para atrasos de pagamento nos contratos públicos", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-excecao-de-contrato-nao-cumprido-para-atrasos-de-pagamento-nos-contratos-publicos", "fonte_id": "jota", "data_pub": "2026-08-14T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lei permite que a administração pública adie o acesso à garantia quando há atraso no pagamento. Ao vincular o prazo ao documento fiscal, a administração pode não cumprir o contrato sem penalidades.", "titulo_pt": "Exceção de contrato não cumprido para atrasos de pagamento nos contratos públicos", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 103402, "titulo": "STF começa a julgar hoje regras para pagamento de R$ 6,1 bi a poupadores", "url": "https://www.cnnbrasil.com.br/economia/macroeconomia/stf-comeca-a-julgar-hoje-regras-para-pagamento-de-r-61-bi-a-poupadores/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-14T07:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal Federal (STF) está iniciando o julgamento de um pedido para dispensar a adesão individual ao acordo que prevê o pagamento de R$ 6,1 bilhões aos poupadores afetados pelos planos econômicos.", "titulo_pt": "STF começa a julgar regras para pagamento de R$ 6,1 bi a poupadores", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 103267, "titulo": "Tribunal Federal de Minas empossa novo comando em teatro da Vale", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/frederico-vasconcelos/2026/08/tribunal-federal-de-minas-empossa-novo-comando-em-teatro-da-vale.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-14T07:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Regional Federal da 6ª Região realizará a posse dos novos dirigentes para o biênio 2026-2028 no dia 20. O evento ocorrerá em um teatro pertencente à Vale, localizado em Belo Horizonte.", "titulo_pt": "Tribunal regional Federal de Minas realiza posse de novos dirigentes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 103268, "titulo": "Douglas Ruas, candidato do PL no RJ, participa de sabatina Folha/UOL", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/douglas-ruas-candidato-do-pl-no-rj-participa-de-sabatina-folhauol.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-14T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado estadual Douglas Ruas, candidato do PL ao Governo do Rio de Janeiro, participa de uma sabatina promovida pela Folha e pelo UOL nesta sexta-feira (14) às 12h30. A série já contou com a participação de Anthony Garotinho, também concorrente ao cargo.", "titulo_pt": "Douglas Ruas, candidato do PL no RJ, participa de sabatina Folha/UOL", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 103364, "titulo": "Retorno às origens: candidatos à Presidência definem primeira parada das campanhas", "url": "https://exame.com/brasil/retorno-as-origens-candidatos-a-presidencia-definem-primeira-parada-das-campanhas/", "fonte_id": "exame", "data_pub": "2026-08-14T06:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir deste domingo, 16, os candidatos e partidos podem realizar comícios, atos e propaganda na internet, conforme as regras estabelecidas pela Justiça Eleitoral. Os candidatos definem a primeira parada das campanhas após o início da liberação dessas atividades.", "titulo_pt": "Retorno às origens: candidatos à Presidência definem primeira parada das campanhas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 103269, "titulo": "Entenda como funciona a filiação partidária, que gerou polêmica com Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/entenda-como-funciona-a-filiacao-partidaria-que-gerou-polemica-com-flavio-bolsonaro.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-14T02:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta quinta-feira (13), a equipe de Flávio Bolsonaro descobriu que ele havia sido filiado ao Missão, partido ligado ao MBL, sem seu consentimento. Essa situação ocorre às vésperas do registro da candidatura do senador para as eleições presidenciais.", "titulo_pt": "Entenda como a filiação de Flávio Bolsonaro ao missão gerou polêmica", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 103270, "titulo": "Programa de Flavio aumenta menções a mulheres e idosos com relação ao do pai em 2022", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/programa-de-flavio-aumenta-mencoes-a-mulheres-e-idosos-com-relacao-ao-do-pai-em-2022.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-14T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O programa de governo de Flávio Bolsonaro menciona mais frequentemente mulheres, idosos e o STF do que o programa do pai, Jair Bolsonaro, na campanha das eleições de 2022. O documento foi divulgado nesta quinta-feira (13).", "titulo_pt": "Programa de flávio aumenta menções a mulheres e idosos em comparação ao do pai de 2022", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 103271, "titulo": "PT patrocina posts enaltecendo governo, e PL impulsiona conteúdo para desgastar Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/pt-patrocina-posts-enaltecendo-governo-e-pl-impulsiona-conteudo-para-desgastar-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-14T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No período que antecede a propaganda eleitoral, que começa em 16 de agosto, os partidos pagam para impulsionar suas publicações nas redes sociais. O PT patrocina posts enaltecendo o governo, enquanto o PL impulsiona conteúdo visando desgastar a imagem do candidato Lula.", "titulo_pt": "PT patrocina posts em favor do governo e PL impulsiona conteúdos contra Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 103272, "titulo": "Investigar não autoriza contornar o sigilo da fonte, e STF precisa assumir responsabilidade", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/investigar-nao-autoriza-contornar-o-sigilo-da-fonte-e-stf-precisa-assumir-responsabilidade.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-14T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A decisão que autorizou buscas contra Raimundo Cutrim e Diogo Diniz Lima, apontados pela Polícia Federal como fontes de informações utilizadas por um jornalista em reportagens sobre o ministro Flávio Dino, reavivou um debate crucial para a democracia brasileira. O STF precisa assumir responsabilidade ao lidar com esse caso.", "titulo_pt": "Investigar não autoriza contornar o sigilo da fonte, e STF deve assumir responsabilidade", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 103273, "titulo": "Ato de Renan Santos na Faculdade de Direito da USP gera polêmica, e grupo protesta", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/ato-de-renan-santos-na-faculdade-de-direito-da-usp-gera-polemica-e-grupo-protesta.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-14T01:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudantes de direito da USP realizaram um protesto contra o candidato à Presidência Renan Santos (Missão) durante seu ato na Faculdade de Direito, no centro de São Paulo, na noite desta quinta-feira.", "titulo_pt": "Protesto de estudantes de Direito da USP contra Renan Santos em ato na USP", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 103566, "titulo": "La ONU pide moderación a Rusia y Japón para evitar un aumento de la tensión tras visitar Putin las Kuriles", "url": "https://www.latercera.com/mundo/noticia/la-onu-pide-moderacion-a-rusia-y-japon-para-evitar-un-aumento-de-la-tension-tras-visitar-putin-las-kuriles/", "fonte_id": "la_tercera", "data_pub": "2026-08-14T09:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ONU pediu moderação a Rússia e Japão para evitar um aumento da tensão após a visita de Putin às Ilhas Kuriles. A declaração foi feita por uma porta-voz do secretário geral eera", "data_pub": "2026-08-14T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Rússia atacou alvos ferroviários e portuários na Ucrânia. Kyiv, por sua vez, utilizou drones para atingir um hub petroleiro báltico e uma warehouse perto de Moscou.", "titulo_pt": "Rússia ataca instalações ferroviárias e portuárias ucranianas em novos bombardeios", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 103695, "titulo": "Israeli settlers seize Palestinian water source in occupied West Bank to create recreational pool", "url": "https://www.france24.com/en/middle-east/20260814-israeli-settlers-seize-palestinian-water-source-in-occupied-west-bank-to-create-recreational-pool", "fonte_id": "france24", "data_pub": "2026-08-14T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Settadores israelenses tomaram controle de uma nascente de água fresca que agricultores palestinos no ocupado Território Ocidental vêm utilizando há gerações, direcionando o fluxo d'água para criar uma piscina em um local arqueológico promovido como atrativo turístico, deixando cultivos sem irrigação. Estima-se que os settadores israelenses tenham agora tomado controle de 95% das nascentes do Vale do Jordão Norte, empurrando as comunidades palestinas para fora de suas terras.", "titulo_pt": "Settadores israelenses se apropriam de fonte de água palestina no vale ocidental", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 103809, "titulo": "Ilo, nel mondo 67 milioni di giovani disoccupati, meno lavoro per l'Ia", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/14/ilo-nel-mondo-67-milioni-di-giovani-disoccupati-meno-lavoro-per-lia_42cfacbe-2719-4753-9531-c47b0e35a0b7.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-14T09:22:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "No mundo, 67 milhões de jovens estão desempregados e há uma diminuição dos primeiros empregos tradicionais. O trabalho relacionado à inteligência artificial está se tornando menos comum.", "titulo_pt": "Ilo: 67 milhões de jovens desocupados e menos empregos tradicionais no mundo", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 103810, "titulo": "Ilo, quasi 4 giovani disoccupati per ogni adulto disoccupato in Italia", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/14/ilo-quasi-4-giovani-disoccupati-per-ogni-adulto-disoccupato-in-italia_31a55319-823d-4b44-8281-7641b7dbec0a.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-14T09:21:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A proporção de jovens desempregados em relação a adultos desempregados na Itália está quase em 4 para 1. O índice de desocupação geral e o número de Neet (pessoas não estudantes, nem empregadas) diminuíram significativamente.", "titulo_pt": "Quase 4 jovens desocupados por cada adulto desocupado na Itália", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 103812, "titulo": "Nell'Eurozona il Pil sale dello 0,4% nel secondo trimestre", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/14/nelleurozona-il-pil-sale-dello-04-nel-secondo-trimestre_7970a9ba-0a01-471f-959e-6fca2420facf.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-14T09:17:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O PIB da zona do euro cresceu em 0,4% no segundo trimestre. A Itália registrou um crescimento de 0,2%, acompanhada pela França e Alemanha. A Áustria e a Romênia permaneceram estáveis.", "titulo_pt": "Pib da zona do euro cresce 0,4% no segundo trimestre", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 103811, "titulo": "Oxford Economics, 'più che il caldo l'Europa deve temere l'inverno'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/14/oxford-economics-piu-che-il-caldo-leuropa-deve-temere-linverno_9b3c568d-60a4-4b65-ba4a-904719ea7777.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-14T09:16:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A economia europeia enfrenta preocupações sobre uma possível recessão, com especialistas sugerindo que pode ser necessário suspender o embargo ao gás russo para evitar danos econômicos severos. O relatório destaca a importância de considerar alternativas que possam mitigar os impactos negativos da crise energética.", "titulo_pt": "Mais do que o calor, Europa deve temer o inverno", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 103696, "titulo": "Ukraine: Civilian casualties hit highest level since May 2022", "url": "https://www.france24.com/en/ukraine-civilian-casualties-hit-highest-level-since-may-2022", "fonte_id": "france24", "data_pub": "2026-08-14T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Russian ataques causaram pelo menos uma morte e 15 feridos em Kramatorsk, no leste da Ucrânia, enquanto outra ação na região de Zaporizhzhia, no sudeste, deixou dois feridos. O número de vítimas civis registrou o maior nível desde maio de 2022, conforme informou a ONU.", "titulo_pt": "Ucrânia: nível mais alto de vítimas civis desde maio de 2022", "veiculo": "France 24", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 103850, "titulo": "Investment scam cases in Hong Kong drop 15%, but losses remain high at HK$1.65b", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3364044/investment-scam-cases-hong-kong-drop-15-losses-remain-high-hk165b?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-14T09:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de casos de estelionato por investimento em Hong Kong diminuiu 15% no primeiro semestre deste ano, mas os prejuízos permaneceram altos, alcançando HK$1,65 bilhão (US$210 milhões). A polícia advertiu sobre fraudadores que se passam por representantes de empresas estrangeiras legítimas para enganar investidores.", "titulo_pt": "Investigações de estelionato view.com/2026/08/14/1141431/job-titles-space-travel-agent-roman-chiporukha/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-14T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Roman Chiporukha, co-proprietário da empresa de estilo de vida luxuoso Roman & Erica há mais de duas décadas, tem transformado sonhos de viagens selvagens em realidade, organizando desde a construção de um superyate para clientes até férias privativas nas Bahamas. Essas experiências o tornaram conhecido como 'o'", "titulo_pt": "Título das ocupações do futuro: agente de viagem espacial", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 103888, "titulo": "Cloning could be used to save species—or make human “organ sacks”", "url": "https://www.technologyreview.com/2026/08/14/1141919/cloning-save-species-or-make-human-organ-sacks/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-14T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas desenvolveram uma técnica CRISPR que transformou embriões masculinos de mouse em femininos, removendo o cromossomo Y. Isso permitiu criar clones femininas geneticamente idênticas aos machos originais.", "titulo_pt": "Clonagem poderia ser usada para salvar espécies—ou criar 'bolsas de órgãos' humanas", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 103899, "titulo": "The Real Reason Data Center Gas Power Plants Are So Dirty", "url": "https://www.wired.com/story/real-reason-data-center-gas-power-plants-are-so-dirty/", "fonte_id": "wired", "data_pub": "2026-08-14T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um grande novo gerador de gás na Texas será construído com tecnologia menos eficiente do que os geradores de gás convencionais. Não é o único projeto de fornecimento de energia para centros de dados a depender de turbinas poluentes.", "titulo_pt": "O verdadeiro motivo pelos quais as usinas de dados usam turbinas tão sujas", "vei }, {"id": 103853, "titulo": "Just like with the yen, America cannot save the AI bubble", "url": "https://www.scmp.com/opinion/world-opinion/article/3363818/just-yen-america-cannot-save-ai-bubble?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-14T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo dos Estados Unidos interveio raramente para apoiar o iene japonês, uma ação vista como um esforço para evitar um aumento ainda maior das taxas de juros nos títulos do governo americano. Essa intervenção coordenada entre os EUA e Japão teve um impacto psicológico significativo no mercado, além da intervenção sozinha do Japão.", "titulo_pt": "Como com o iene, estados unidos não pode salvar bolha de IA", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 103728, "titulo": "AI’s infrastructure boom is getting more leveraged — and harder to track", "url": "https://www.cnbc.com/2026/08/14/ai-infrastructure-debt-leverage-risks.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-14T08:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A expansão da infraestrutura de inteligência artificial está cada vez mais sendo financiada por títulos de dívida, alugueis e capital privado, enquanto investidores endividados adicionam outro nível de risco de mercado.", "titulo_pt": "A expansão da infraestrutura de IA está se tornando mais financiada e mais difícil de rastrear", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 103735, "titulo": "China built robots that can do backflips – but can they make money?", "url": "https://www.cnbc.com/2026/08/14/china-humanoid-robots-unitree-ipo-tesla-optimus.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-14T08:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A oferta inicial de ações da Unitree avaliará o interesse dos investidores em uma tecnologia que ainda não provou sua viabilidade comercial, no contexto das tensões geopolíticas crescentes.", "titulo_pt": "China construiu robôs que fazem saltos cardinais – mas eles podem gerar lucro?", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 103931, "titulo": "Super app Toss operator Viva Republica's H1 net income up 120 pct on-year", "url": "https://en.yna.co.kr/view/AEN20260814011100320", "fonte_id": "yonhap_news", "data_pub": "2026-08-14T08:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A operadora sul-coreana Viva Republica, responsável pelo super aplicativo Toss, registrou um aumento de 120% no lucro líquido do primeiro semestre em comparação com o mesmo período do ano anterior.", "titulo_pt": "Lucro da operadora Viva Republica do Toss aumenta 120% no primeiro semestre", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 103847, "titulo": "Ex-factory worker and engineer to make history as one of China’s first space passengers", "url": "https://www.scmp.com/news/people-culture/china-personalities/article/3364058/ex-factory-worker-and-engineer-make-history-one-chinas-first-space-passengers?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-14T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma empresária chinesa de 73 anos se tornou a 22ª passageira do foguete nacionalmente desenvolvido CYZ1, projeto da start-up espacial InterstellOr. Ela está programada para realizar uma missão suborbital em 2028, atingindo a linha de Kármán e podendo observar a Terra desde essa altitude.", "titulo_pt": "Empresária chinesa de 73 anos será uma das primeiras passageiras espaciais do país", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 104006, "titulo": "SpaceX rocket's moon crash highlights 'a tangible operational risk' of lunar settlement", "url": "https://www.space.com/astronomy/moon/spacex-rockets-moon-crash-highlights-a-tangible-operational-risk-of-lunar-settlement", "fonte_id": "space_com", "data_pub": "2026-08-14T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um corpo de foguete da SpaceX bateu na lua no início deste mês, destacando um risco que aumentará à medida que a humanidade estabelece uma presença na vizinha esfera lunar.", "titulo_pt": "Impacto do foguete da spacex na lua ilustra 'um risco operacional tangível' para a colonização lunar", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 103972, "titulo": "An 'influencer' degree? Colleges bet on content creator major as critics question its value", "url": "https://phys.org/news/2026-08-degree-colleges-content-creator-major.html", "fonte_id": "phys_org", "data_pub": "2026-08-14T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitos jovens consideram influenciadores digitais como uma carreira futura. Colégios estão introduzindo cursos focados nessa área, embora alguns críticos questionem o valor educacional desses programas.", "titulo_pt": "Uma graduação de 'influenciador'? Instituições apostam em curso sobre criadores de conteúdo enquanto críticos questionam seu valor", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 103302, "titulo": "Testes de novo telescópio captam vestígios da morte de uma estrela", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/testes-de-novo-telescopio-captam-vestigios-da-morte-de-uma-estrela.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-14T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um novo telescópio chamado Mothra, ainda em construção nas montanhas do norte do Chile, produziu uma imagem da nebulosa da Hélice, mostrando o fim da vida de uma estrela. Este é um exemplo impressionante dos processos celestes difíceis de serem fotografados.", "titulo_pt": "Testes de novo telescópio captam vestígios do fim de uma estrela", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 103973, "titulo": "EU cities plan to compensate for a fifth of their emissions through carbon removal, but few have thought through how", "url": "https://phys.org/news/2026-08-eu-cities-compensate-emissions-carbon.html", "fonte_id": "phys_org", "data_pub": "2026-08-14T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo analisou 103 planos climáticos de cidades europeias para 2030, que incluem 22 capitais. Esses planos prevêem a utilização de remoção de carbono para compensar cerca de um quinto das emissões totais dessas cidades, equivalente a aproximadamente 61 milhões de toneladas de CO2.", "titulo_pt": "Cidades europeias planejam compensar cerca de um quinto de suas emissões através da remoção de carbono, mas poucas têm pensado no processo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 103983, "titulo": "Bulgaria advances project to launch new space, defense innovation hub", "url": "https://spacenews.com/bulgaria-advances-project-to-launch-new-space-defense-innovation-hub/", "fonte_id": "spacenews", "data_pub": "2026-08-14T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo búlgaro aprovou um projeto de memorando com a empresa local Starbase Europe para desenvolver um novo hub de inovação espacial e defesa. O país avança no projeto para lançar este hub.", "titulo_pt": "Bulgária avança no projeto para lançar novo hub de inovação espacial e defesa", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 103984, "titulo": "In-Orbit Services Market to Generate $3 Billion in Revenue Over the Next Decade", "url": "https://spacenews.com/in-orbit-services-market-to-generate-3-billion-in-revenue-over-the-next-decade/", "fonte_id": "spacenews", "data_pub": "2026-08-14T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório de mercado de serviços in-orbit da Novospace projeta que os serviços emergentes gerarão aproximadamente $3 bilhões em receitas cumulativas nos próximos dez anos. Este crescimento destaca o desenvolvimento inicial deste setor.", "titulo_pt": "Mercado de serviços in-orbit gerará r$ 3 bilhões em receita nas próximas décadas", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 104004, "titulo": "Monsoon-driven wildfires may have shaped human evolution", "url": "https://www.newscientist.com/article/2584578-monsoon-driven-wildfires-may-have-shaped-human-evolution/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-14T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma reconstrução do ambiente da África Oriental há 1,75 milhão de anos indica que incêndios florestais aumentaram durante períodos mais chuvosos, o que pode ter influenciado a evolução humana.", "titulo_pt": "Incêndios causados por monções podem ter moldado a evolução humana", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 104007, "titulo": "Our expert thinks this portable Celestron telescope will delight beginners and younger stargazers", "url": "https://www.space.com/stargazing/skywatching-kit/our-expert-thinks-this-portable-celestron-telescope-will-delight-beginners-and-younger-stargazers", "fonte_id": "space_com", "data_pub": "2026-08-14T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O telescópio Celestron portátil é indicado para iniciantes e jovens amadores do astrônomico, permitindo a observação da lua e das estrelas.", "titulo_pt": "Nossa especialista acredita que este telescópio portátil Celestron encantará iniciantes e jovens amadores de astronomia", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 103943, "titulo": "How will legal challenges fare against CMS rule on gender-affirming care?", "url": "https://www.statnews.com/2026/08/14/cms-transgender-care-rule-how-will-legal-challenges-fare/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-14T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A regra finalizada pela CMS desta semana pode ser mais difícil de ser contestada do que as ações anteriores do governo Trump para acabar com o cuidado transgênero para jovens.", "titulo_pt": "Como se sairá o desafio legal contra a regra da CMS sobre cuidados afirmando gênero?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 103944, "titulo": "Opinion: MAHA and insurance companies both want to treat human bodies like cars", "url": "https://www.statnews.com/2026/08/14/health-insurance-companies-maha-surveillance/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-14T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto sugere que tanto MAHA quanto as companhias de seguros têm interesse em tratar os corpos humanos como veículos. A história curta dos telemáticos no seguro automóvel serve como exemplo para serem cautelosos com promessas associadas a dados de vigilância compartilháveis.", "titulo_pt": "Opinião: MAHA e seguradoras querem tratar corpos humanos como veículos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 103945, "titulo": "Two years after rules overhaul, have methadone clinics really changed?", "url": "https://www.statnews.com/2026/08/14/methadone-clinics-opioid-addiction-new-rules-culture-shift/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-14T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As clínicas de substituição do metadona não precisam ser tão rígidas na distribuição da medicina para dependentes de opioides. Algumas, embora não todas, estão mudando suas práticas.", "titulo_pt": "Dois anos após regras renovadas, as clínicas de metadona realmente se transformaram?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 103946, "titulo": "Opinion: U.S., U.K. health care systems share a fatal flaw", "url": "https://www.statnews.com/2026/08/14/us-uk-health-care-systems-loneliness-community-prevention/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-14T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O sistema de saúde dos Estados Unidos e do Reino Unido apresenta um defeito fatal, segundo o autor, pois há uma tendência a responder prioritariamente com soluções biomédicas, o que faz com que clínicas e hospitais absorvam gradualmente os custos associados a problemas sociais.", "titulo_pt": "Opinião: sistemas de saúde dos EUA e reino unido compartilham um defeito fatal", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 103855, "titulo": "Hong Kong teen’s will to fight illness ‘incredibly low’ after near-death scares", "url": "https://www.scmp.com/news/hong-kong/society/article/3364030/hong-kong-teens-will-fight-illness-incredibly-low-after-near-death-scares?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-14T08:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um adolescente de 17 anos que tem medo de morrer jovem sofreu duas experiências próximas à morte este ano após contrair gripe e infecção respiratória. Chen Tsz-kin, diagnosticado com uma doença muscular degenerativa incurável quando tinha 18 meses, relatou um 'colapso emocional mais devastador' durante esses eventos.", "titulo_pt": "A vontade de lutar contra a doença do adolescente de hong Kong é ‘incredivelmente baixa’ após escapatórias perto da morte", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 104005, "titulo": "Why do people ask so few questions in conversation?", "url": "https://www.newscientist.com/article/2584415-why-do-people-ask-so-few-questions-in-conversation/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-08-14T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A coluna argumen  "EUA", "classe": "B"}, {"id": 103323, "titulo": "Acidente da Voepass foi provocado por falhas que põem em xeque trabalho da Anac", "url": "https://veja.abril.com.br/brasil/acidente-da-voepass-foi-provocado-por-falhas-que-poem-em-xeque-trabalho-da-anac/", "fonte_id": "veja", "data_pub": "2026-08-14T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O acidente da Voepass foi causado por falhas que colocam em questão o trabalho da Anac. Espera-se que esta tragédia, a maior do país desde 2007, sirva como exemplo para evitar futuros incidentes semelhantes.", "titulo_pt": "Acidente da Voepass foi provocado por falhas que questionam trabalho da Anac", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 103483, "titulo": "Quem decide como a cidade anda? A saga do mototáxi em São Paulo", "url": "https://www.jota.info/opiniao-e-analise/artigos/quem-decide-como-a-cidade-anda-a-saga-do-mototaxi-em-sao-paulo", "fonte_id": "jota", "data_pub": "2026-08-14T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A disputa entre a prefeitura e o Uber ilustra os desafios na regulação de novas tecnologias de transporte. O caso expõe as limitações da intervenção judicial nesse processo.", "titulo_pt": "Quem decide como a cidade anda? A saga do mototáxi em São Paulo", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 103558, "titulo": "Lending to property investors falls sharply in ‘tiny’ step towards fairer housing market in Australia, expert says", "url": "https://www.theguardian.com/australia-news/2026/aug/14/lending-to-property-investors-falls-sharply-in-tiny-step-towards-fairer-housing-market-in-australia-expert-says", "fonte_id": "guardian_world", "data_pub": "2026-08-14T08:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os dados do ABS mostraram uma queda de quase 9% no crédito imobiliário para investidores nos três meses até junho. Especialistas consideram que este é um pequeno passo rumo a um mercado im ara medir a pobreza, afirmou que não houve críticas ao trabalho da comissão, mas sim sobre a contribuição dos subsídios na redução da pobreza. Ele destacou que os subsídios são medidas temporárias e que seria preferível uma solução por meio do emprego.", "titulo_pt": "Osvaldo Larrañaga e cifra de pobreza 2026: 'não houve críticas à comissão, mas a contribuição dos subsídios foi questionada'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 102727, "titulo": "Ao volante, secretária grava vídeo xingando transeuntes em Rio Preto", "url": "https://www.metropoles.com/sao-paulo/secretaria-grava-video-xingando-transeuntes", "fonte_id": "metropoles", "data_pub": "2026-08-13T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma secretária de Desenvolvimento da cidade de Rio Preto, Cláudia Bassitt, gravou um vídeo xingando transeuntes. No vídeo, ela questiona a aparência dos indivíduos e acusa um deles de ser um traficante.", "titulo_pt": "Secretária grava vídeo xingando transeuntes em Rio Preto", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 102875, "titulo": "Con alta incidencia de tres jurisdicciones, suben los juicios por riesgos del trabajo", "url": "https://www.lanacion.com.ar/economia/con-alta-incidencia-de-tres-jurisdicciones-suben-los-juicios-por-riesgos-del-trabajo-nid13082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-13T21:43:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Houve um aumento interanual de 2% nos juizados por riscos do trabalho nos primeiros sete meses do ano, com uma elevação de 18% em Santa Fe. A litigiosidade também aumentou na cidade e na província de Buenos Aires, totalizando aproximadamente 138.000 casos no ano.", "titulo_pt": "Com alta incidência em três jurisdições, crescem os julgamentos por riscos do trabalho", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 102731, "titulo": "Estudo sugere reforma em cotas de candidatura de mulheres na política", "url": "https://www.metropoles.com/sao-paulo/estudo-sugere-reforma-em-cotas-de-candidatura-de-mulheres-na-politica", "fonte_id": "metropoles", "data_pub": "2026-08-13T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo proposto pelo Esfera Brasil sugere a criação de uma reserva de 20% das cadeiras no legislativo para garantir o eleito de mulheres. O objetivo é reformar as cotas de candidatura de mulheres na política.", "titulo_pt": "Estudo sugere reserva de 20% de cadeiras legislativas para mulheres", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 102883, "titulo": "El gesto solidario de Jorge Messi con un hospital de Rosario que permitió realizar 100 trasplantes", "url": "https://www.lanacion.com.ar/sociedad/el-gesto-solidario-de-jorge-messi-con-un-hospital-de-rosario-que-permitio-realizar-100-trasplantes-nid12082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-13T21:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Jorge Messi financiou a capacitação de médicos, enfermeiros e hemoterapeutas de Rosário em Barcelona. Esse investimento permitiu que um hospital realizasse 100 transplantes.", "titulo_pt": "Ato solidário de Jorge Messi auxilia hospital de rosário a realizar 100 transplantes", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 103737, "titulo": "Colombia earthquake: Dog rescued alive as 72-hour window closes", "url": "http://www.euronews.com/video/2026/08/14/colombia-earthquake-dog-rescued-alive-as-72-hour-window-closes", "fonte_id": "euronews", "data_pub": "2026-08-14T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Na Colômbia, resgatadores trataram um cachorro resgatado vivo dos escombros de um terremoto em Cali. Equipes de emergência realizavam uma última busca por sobreviventes antes que o período crítico de 72 horas se encerrasse.", "titulo_pt": "Colômbia: cachorro resgatado vivo após terremoto em cali, com prazo de 72 horas prestes a expirar", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 103561, "titulo": "‘Extensive’ devastation caused by major fire in England as 150 million in Europe to experience temperatures above 35C – Europe live", "url": "https://www.theguardian.com/world/live/2026/aug/14/fires-wildfires-extreme-heat-west-midlands-stourbridge-uk-greece-france-croatia-climate-crisis-europe-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-08-14T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogueiras se alastram por vários países europeus, incluindo Inglaterra, Croácia, Alemanha e França, enquanto a Europa enfrenta temperaturas acima de 35°C. Em England, um incêndio causou danos significativos e deixou 150 milhões de pessoas na região experimentando altas temperaturas.", "titulo_pt": "Incêndios em vários países europeus e calor extremo afetam 150 milhões", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 103738, "titulo": "Iran claims 'trillion-dollar' pollution damage as Gulf oil spills spread", "url": "http://www.euronews.com/2026/08/14/iran-claims-trillion-dollar-pollution-damage-as-gulf-oil-spills-spread", "fonte_id": "euronews", "data_pub": "2026-08-14T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Resíduos de óleo de um navio-carga afundado chegaram à Ilha Qeshm e aos seus manguezais protegidos na Irã. Um carregador russo sancionado que naufragou nas águas do Oman deixou uma mancha de óleo com mais de 2.000 km², poluindo cerca de 40 km de costa omanita.", "titulo_pt": "Irã reivindica danos por poluição 'trilionários' enquanto descargas de petróleo no golfo se espalham", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 103357, "titulo": "Quatro dias após terremoto, Colômbia registra 281 mortos", "url": "https://www.metropoles.com/mundo/quatro-dias-apos-terremoto-colombia-registra-281-mortos", "fonte_id": "metropoles", "data_pub": "2026-08-14T08:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quatro dias após o terremoto, a Colômbia registrou 281 mortos. O sismo de magnitude 7,4 causou desaparecidos e feridos, com quase 400 pessoas desaparecidas e 3.971 ficaram feridas.", "titulo_pt": "Quatro dias após terremoto, Colômbia registra 281 mortos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 103739, "titulo": "Unprecedented rainfall in Japan leaves at least four dead in Chiba prefecture", "url": "http://www.euronews.com/video/2026/08/14/unprecedented-rainfall-in-japan-leaves-at-least-four-dead-in-chiba-prefecture", "fonte_id": "euronews", "data_pub": "2026-08-14T08:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chuvas inusitadas atingiram o Japão, causando ao menos quatro mortes e inundando partes da prefectura de Chiba, próxima a Tóquio. As autoridades emitiram pela primeira vez o nível mais alto de alerta para chuva na região e também registraram avisos de deslizamentos de terra e cortes de energia elétrica.", "titulo_pt": "Chuvas inusitadas deixam ao menos quatro mortos em Chiba, Japão", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 103710, "titulo": "Wildfire forces evacuation of more than 500 people in southwest France", "url": "https://www.lemonde.fr/en/france/article/2026/08/14/wildfire-forces-evacuation-of-more-than-500-people-in-southwest-france_6756495_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-14T08:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 500 pessoas foram evacuadas no departamento da Landes, na França ocidental, devido a um incêndio. Equipes de 500 bombeiros estão lutando contra as chamas, após períodos de calma em Gironde.", "titulo_pt": "Incêndio força evacuação de mais de 500 pessoas no sudoeste da França", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 103741, "titulo": "France wildfire forces 525 people to flee as Landes forest burns", "url": "http://www.euronews.com/video/2026/08/14/france-wildfire-forces-525-people-to-flee-as-landes-forest-burns", "fonte_id": "euronews", "data_pub": "2026-08-14T07:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A França eviou cerca de 525 pessoas do vilarejo de Luglon na quinta-feira, 13 de agosto, devido a um incêndio florestal rápido que atingiu uma floresta pinheira afetada pela seca em Landes.", "titulo_pt": "França evacua cerca de 525 pessoas no vilarejo de luglon diante de incêndio na floresta de Landes", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 103742, "titulo": "Wildfire forces evacuation of 1,000 as flames sweep Croatia’s coast", "url": "http://www.euronews.com/video/2026/08/14/wildfire-forces-evacuation-of-1000-as-flames-sweep-croatias-coast", "fonte_id": "euronews", "data_pub": "2026-08-14T07:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio florestal atingiu a região de Lokva Rogoznica, na costa da Croácia, forçando cerca de 1.000 moradores e turistas a deixarem suas casas.", "titulo_pt": "Incêndio força evacuação de 1.000 pessoas na costa croata", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 103556, "titulo": "Indonesia wildfires threaten orangutans rescued from animal traffickers", "url": "https://www.theguardian.com/world/2026/aug/14/indonesia-wildfires-threaten-orangutans-rescued-from-animal-traffickers", "fonte_id": "guardian_world", "data_pub": "2026-08-14T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais, alimentados por condições quentes, secas e ventosas, ameaçam um centro de recuperação de orangotangos resgatados da tráfico ilegal na Indonésia. O El Niño poderoso e a crise climática humana estão intensificando essas condições.", "titulo_pt": "Incêndios ameaçam orangotangos resgatados no centro de recuperação da indonésia", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 103845, "titulo": "It’s likely that 2026 will be the hottest year on record, experts say", "url": "https://www.japantimes.co.jp/environment/2026/08/14/2026-hottest-year/", "fonte_id": "japan_times", "data_pub": "2026-08-14T02:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Expertos afirmam que 2026 provavelmente será o ano mais quente da história, e 2027 pode estabelecer um novo recorde de temperatura.", "titulo_pt": "É provável que 2026 seja o ano mais quente na história, dizem especialistas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 102425, "titulo": "Greenpeace calls for review of energy bill", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/14/2003862478", "fonte_id": "taipei_times", "data_pub": "2026-08-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Greenpeace está pedindo uma revisão da lei de energia. O grupo ambientalista quer que as regras atuais sobre a produção e uso de energia sejam examinadas mais profundamente.", "titulo_pt": "Greenpeace solicita revisão da lei de energia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 102429, "titulo": "Agency presents four farmers with owl-friendly label", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/14/2003862482", "fonte_id": "taipei_times", "data_pub": "2026-08-14T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência apresentou quatro agricultores com um rótulo que indica que suas propriedades são amigáveis aos búlbos.", "titulo_pt": "Agência apresenta quatro agricultores com rótulo owl-friendly", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 102692, "titulo": "Como a desinformação climática usa a fé para se espalhar", "url": "https://veja.abril.com.br/comportamento/como-a-desinformacao-climatica-usa-a-fe-para-se-espalhar/", "fonte_id": "veja", "data_pub": "2026-08-13T20:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A cartilha destaca o uso de argumentos religiosos na propagação de notícias falsas sobre o clima. O relatório alerta para esse método de disseminação da desinformação.", "titulo_pt": "Como a desinformação climática usa a fé para se espalhar", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 103003, "titulo": "Chile Carbon Forum lanza su tercera edición con foco en estándares globales, financiamiento y adaptación climática", "url": "https://www.latercera.com/sustentabilidad/noticia/chile-carbon-forum-lanza-su-tercera-edicion-con-foco-en-estandares-globales-financiamiento-y-adaptacion-climatica/", "fonte_id": "la_tercera", "data_pub": "2026-08-13T20:09:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Chile Carbon Forum, o maior encontro de ação climática e mercados de carbono do Chile, terá sua terceira edição nos dias 6 e 7 de outubro na Faculdade de Economia e Negócios da USP, com mais de 30 sessões em duas rotas simultâneas e focos adicionais em estándares globais de reporte, novos esquemas de financiamento e adaptação climática.", "titulo_pt": "Chile Carbon Forum lança sua terceira edição com foco em padrões globais, financiamento e adaptação ao clima", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 103747, "titulo": "Vietnam discovers more than a tonne of concealed ivory illegally shipped from Africa", "url": "http://www.euronews.com/2026/08/13/vietnam-discovers-more-than-a-tonne-of-concealed-ivory-illegally-shipped-from-africa", "fonte_id": "euronews", "data_pub": "2026-08-13T19:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Vietnã descobriu mais de um tonelão de âmbar ilegalmente escondido, proveniente da África. A maior parte do comércio de âmbar de elefantes e outras espécies em risco está proibida por acordo internacional sob o CITES, um tratado assinado por quase todos os países membros das Nações Unidas.", "titulo_pt": "Vietnã descobre mais de uma tonelada de âmbar ilegalmente enviado da áfrica", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 102286, "titulo": "Ebola outbreak in DR Congo spreads to sixth province as death toll passes 2,100", "url": "https://www.lemonde.fr/en/health/article/2026/08/13/ebola-outbreak-in-dr-congo-spreads-to-sixth-province-as-death-toll-passes-2-100_6756475_14.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-13T15:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A epidemia de Ebola, que já é a mais letal na história do país, está se espalhando para a sexta província congolesa, conforme o número de mortes ultrapassa 2.100. A Organização Mundial da Saúde alertou que esta é a propagação mais rápida de uma epidemia de Ebola já registrada.", "titulo_pt": "Epidemia de ebola no Congo atinge sexta província com mais de 2.100 mortes", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 103498, "titulo": "Estuvieron 16 años injustamente “presos” y ahora lograron la libertad: su viaje de la Argentina a un paraíso europeo", "url": "https://www.lanacion.com.ar/videos/de-un-zoologico-clausurado-a-un-santuario-el-extraordinario-viaje-de-dos-animales-hacia-la-vida-que-nid14082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-14T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Dois indivíduos passaram 16 anos injustamente presos e conseguiram a liberdade. Eles viajaram da Argentina para um paraíso europeu.", "titulo_pt": "Foram 16 anos de prisão injusta e agora conquistaram a liberdade: seu viagem da Argentina para um paraíso europeu", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 103777, "titulo": "Fear and attacks grip Taybeh, the last all-Christian town in the West Bank", "url": "https://www.aljazeera.com/features/2026/8/14/fear-and-attacks-grip-taybeh-the-last-all-christian-town-i function ttsBarHtml(audioKey) {

  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}
