sigualdade-drenam-bilhoes-do-brasil-por-ano-aponta-estudo/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-17T21:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo indica que violência e desigualdade econômica estão custando bilhões de reais ao Brasil anualmente, afetando a arrecadação pública, atração de investimentos e o crescimento a longo prazo do país.", "titulo_pt": "Violência e desigualdade drenam bilhões do Brasil por ano, aponta estudo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 108396, "titulo": "Problemas de sobredotación, licencias médicas y baja en matrícula: director (s) de Educación Pública detalla estado financiero de los SLEP", "url": "https://www.latercera.com/nacional/noticia/problemas-de-sobredotacion-licencias-medicas-y-baja-en-matricula-director-s-de-la-dep-da-cuenta-del-estado-financiero-de-los-slep/", "fonte_id": "la_tercera", "data_pub": "2026-08-17T21:04:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A matrícula nos SLEP diminuiu 16% entre 2010 e 2025, enquanto a dotação aumentou 7% em docentes e 11% em assistentes de educação nos últimos oito anos.", "titulo_pt": "Problemas de sobredotação, licenças médicas e baixa matrícula: diretores de educação Pública detalham estado financeiro dos SLEP", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 108408, "titulo": "Municipalidad de Independencia se querella contra responsables de explosión de gas que dejó cuatro personas lesionadas", "url": "https://www.latercera.com/nacional/noticia/municipalidad-de-independencia-se-querella-contra-responsables-de-explosion-de-gas-que-dejo-cuatro-personas-lesionadas/", "fonte_id": "la_tercera", "data_pub": "2026-08-17T20:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A prefeitura de Independência apresentou uma queixa para investigar as circunstâncias da ruptura de uma matriz de gás e da explosão subsequente que deixou quatro pessoas feridas.", "titulo_pt": "Prefeitura de independência inicia processo contra responsáveis por explosão de gás que deixou quatro feridos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 108405, "titulo": "Colegios alertan que Junaeb redujo sus raciones de alimentos y organismo lo atribuye a mecanismo habitual de ajuste", "url": "https://www.latercera.com/nacional/noticia/colegios-alertan-que-junaeb-redujo-sus-raciones-de-alimentos-y-organismo-lo-atribuye-a-mecanismo-habitual-de-ajuste/", "fonte_id": "la_tercera", "data_pub": "2026-08-17T20:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Programa de Alimentação Escolar (PAE) foi informado por diferentes instituições de que a Junta Nacional de Auxílio Escolar e Becas (Junaeb) reduziu a quantidade de refeições fornecidas a partir de agosto. No entanto, o organismo nega que a redução esteja relacionada a um ajuste orçamentário, que foi o motivo de críticas anteriores em abril.", "titulo_pt": "Colégios alertam sobre redução na quantidade de refeições do pae e Junaeb nega ajuste orçamentário", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 107243, "titulo": "Justiça derruba posts de vereador do PL que chamou Erika Hilton de ‘deputada travesti do Lula’", "url": "https://veja.abril.com.br/politica/justica-derruba-posts-de-vereador-do-pl-que-chamou-erika-hilton-de-deputada-travesti-do-lula/", "fonte_id": "veja", "data_pub": "2026-08-17T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um juízo da Justiça de São Paulo concedeu uma liminar que proibiu o vereador Lucas Pavanato (PL-SP) de fazer posts com determinadas expressões sobre a deputada Erika Hilton. A decisão inclui uma multa diária de mil reais caso ele descumpra a determinação.", "titulo_pt": "Justiça proíbe vereador do PL de postar certas expressões sobre Erika Hilton e multa diária é estabelecida", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 107164, "titulo": "Servidores do IBGE iniciam greve em oposição a medidas da gestão Pochmann", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/servidores-do-ibge-iniciam-greve-em-oposicao-a-medidas-da-gestao-pochmann.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Servidores do IBGE iniciaram uma greve em protesto contra as medidas da gestão de Marcio Pochmann, presidente do órgão.", "titulo_pt": "Servidores do IBGE iniciam greve contra medidas de Pochmann", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 107248, "titulo": "O cerco silencioso contra a criminalidade em SP que já capturou 15 mil", "url": "https://veja.abril.com.br/brasil/o-cerco-silencioso-contra-a-criminalidade-em-sp-que-ja-capturou-15-mil/", "fonte_id": "veja", "data_pub": "2026-08-17T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A polícia de São Paulo está utilizando a integração de dados de rodovias, Metrô e vigilância privada para rastrear suspeitos e prever crimes. Até agora, 15 mil pessoas já foram capturadas com essa estratégia.", "titulo_pt": "O cerco silencioso contra a criminalidade em SP que já capturou 15 mil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 107571, "titulo": "¿Cuándo se entrega el Aguinaldo de Fiestas Patrias para pensionados? Estos son los montos de 2026", "url": "https://www.latercera.com/servicios/noticia/cuando-se-entrega-el-aguinaldo-de-fiestas-patrias-para-pensionados-estos-son-los-montos-de-2026/", "fonte_id": "la_tercera", "data_pub": "2026-08-17T17:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O benefício do Aguinaldo de Fiestas Patrias é automaticamente atribuído às pessoas que atendem aos requisitos estabelecidos. Este ano, os montantes para pensionados serão divulgados.", "titulo_pt": "Quando é entregue o Aguinaldo de Fiestas Patrias para pensionados? Estes são os montantes de 2026", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 107572, "titulo": "Desempleo: un tema incómodo pero urgente", "url": "https://www.latercera.com/opinion/noticia/desempleo-un-tema-incomodo-pero-urgente/", "fonte_id": "la_tercera", "data_pub": "2026-08-17T17:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O desemprego é um assunto incômodo mas urgente. O texto destaca a necessidade de tratar o tema com seriedade.", "titulo_pt": "Desemprego: um tema incômodo mas urgente", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 107281, "titulo": "Pai investigado por torturar o próprio filho é preso pela PF", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pai-investigado-por-torturar-o-proprio-filho-e-preso-pela-pf", "fonte_id": "metropoles", "data_pub": "2026-08-17T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um pai foi investigado por supostamente torturar o próprio filho e, após ser localizado, foi preso pela Polícia Federal no município de Paulistana, no estado do Piauí.", "titulo_pt": "Pai investigado por torturar filho é preso pela PF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 107282, "titulo": "Mulher é presa após sacudir e ferir cachorrinho para provocar vizinhos", "url": "https://www.metropoles.com/distrito-federal/na-mira/mulher-e-presa-apos-sacudir-e-ferir-cachorrinho-para-provocar-vizinhos", "fonte_id": "metropoles", "data_pub": "2026-08-17T16:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma mulher foi presa após sacudir e ferir um cachorro em um condomínio fechado. Dois animais foram resgatados pela Polícia Militar e levados para um abrigo.", "titulo_pt": "Mulher é presa após agredir cachorro em condomínio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 107361, "titulo": "Líder indígena e família morrem em acidente seguido de incêndio em MS", "url": "https://www.cnnbrasil.com.br/nacional/centro-oeste/ms/lider-indigena-e-familia-morrem-em-acidente-seguido-de-incendio-em-ms/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-17T16:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um acidente envolvendo um semirreboque que se soltou de um caminhão atingiu um veículo de passeio nesta sexta-feira (14), resultando na morte de sete indígenas da aldeia Kalipety, em São Paulo.", "titulo_pt": "Líder indígena e seis outros morrem em acidente com caminhão em MS", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 107367, "titulo": "Polícia investiga morte de criança de 4 anos com sinais de agressão no RS", "url": "https://www.cnnbrasil.com.br/nacional/sul/rs/policia-investiga-morte-de-crianca-de-4-anos-com-sinais-de-agressao-no-rs/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-17T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma menina de 4 anos chegou sem vida a uma unidade de saúde na zona Leste de Porto Alegre na segunda-feira (17). A polícia está investigando a morte da criança, que apresentava sinais de agressão.", "titulo_pt": "Polícia investiga morte de menina de 4 anos com sinais de agressão no RS", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 108393, "titulo": "A 100 años del primer parque nacional, Chile incia una nueva etapa de la conservación con foco en financiamiento y gestión", "url": "https://www.latercera.com/sustentabilidad/noticia/a-100-anos-del-primer-parque-nacional-chile-incia-una-nueva-etapa-de-la-conservacion-con-foco-en-financiamiento-y-gestion/", "fonte_id": "la_tercera", "data_pub": "2026-08-17T21:24:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A ministra do Meio Ambiente de Chile, Francisca Toledo, anunciou a postulação de recursos no valor de US$10,3 milhões ao GEF para criar um fundo patrimonial para os parques nacionais e fortalecer sua gestão a longo prazo. Este anúncio faz parte das comemorações dos 100 anos de conservação no país.", "titulo_pt": "A 100 anos de conservação, Chile inicia nova etapa com foco em financiamento e gestão", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 108154, "titulo": "Ciclone extratropical atingirá Brasil e alerta é disparado por autoridades", "url": "https://www.cnnbrasil.com.br/nacional/sul/rs/ciclone-extratropical-atingira-brasil-e-alerta-e-disparado-por-autoridades/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-17T21:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ciclone extratropical está se aproximando do Brasil e causará temporais, fortes rajadas de vento e queda de granizo em diversas regiões nos próximos dias. Autoridades já emitiram alertas.", "titulo_pt": "Ciclone extratropical atingirá Brasil e alerta é disparado por autoridades", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 108453, "titulo": "Rhine River remains low amid ongoing drought in Germany", "url": "http://www.euronews.com/video/2026/08/17/rhine-river-remains-low-amid-ongoing-drought-in-germany", "fonte_id": "euronews", "data_pub": "2026-08-17T19:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As condições de seca estão baixando os níveis de água no Reno na Alemanha. A situação está gerando pressão para o transporte fluvial em uma das rotas de transporte mais importantes da Europa ocidental. Isso ocorre em meio a uma onda sem precedentes de clima extremo na região.", "titulo_pt": "Reno continua com nível baixo de água em meio à seca na Alemanha", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 107581, "titulo": "Sistema frontal mantiene en alerta al norte y Tocopilla concentra principales afectaciones", "url": "https://www.latercera.com/videos/noticia/sistema-frontal-mantiene-en-alerta-al-norte-y-tocopilla-concentra-principales-afectaciones/", "fonte_id": "la_tercera", "data_pub": "2026-08-17T17:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O sistema frontal manteve o norte do Chile em alerta, com Tocopilla sendo a localidade que registrou as principais afetações. Duas alertas do Sistema de Alerta de Emergência (SAE) foram ativadas, levando a evacuações em diferentes áreas da comuna devido à ativação de quebradas.", "titulo_pt": "Sistema frontal mantém norte em alerta e Tocopilla concentra principais afetações", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 107959, "titulo": "Analysis: The two largest reservoirs in the US have hit record-low levels", "url": "https://www.carbonbrief.org/analysis-the-two-largest-reservoirs-in-the-us-have-hit-record-low-levels", "fonte_id": "carbon_brief", "data_pub": "2026-08-17T16:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O segundo maior reservatório dos Estados Unidos atingiu seu nível de água mais baixo registrado no sábado, apenas alguns dias após o maior reservatório do país alcançar um nível recorde baixo.", "titulo_pt": "Análise: os dois maiores reservatórios dos EUA atingiram níveis históricos baixos", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 107501, "titulo": "European farmers face ‘unprecedented crisis’ after successive heatwaves", "url": "https://www.theguardian.com/environment/2026/aug/17/european-farmers-unprecedented-crisis-successive-heatwaves", "fonte_id": "guardian_world", "data_pub": "2026-08-17T16:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Agricultores europeus estão enfrentando uma crise sem precedentes devido a sucessivas ondas de calor intensas e uma seca continental severa. Produções de legumes e grãos estão em queda significativa, com previsões de colheitas catastróficas.", "titulo_pt": "Agricultores europeus enfrentam crise sem precedentes após ondas de calor sucessivas", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 107960, "titulo": "Why land-use emissions have fallen by a third this century – in six charts", "url": "https://www.carbonbrief.org/why-land-use-emissions-have-fallen-by-a-third-this-century-in-six-charts", "fonte_id": "carbon_brief", "data_pub": "2026-08-17T12:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As emissões relacionadas ao uso do solo, incluindo desmatamento, perda de pântanos e degradação florestal, têm diminuído ao longo do século. Essa redução é ilustrada em seis gráficos.", "titulo_pt": "Por que as emissões de uso do solo caíram em um terço neste século – em seis gráficos", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 106618, "titulo": "Preservar el agua", "url": "https://www.lanacion.com.ar/opinion/preservar-el-agua-nid17082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-17T09:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O água é um recurso vital que necessita ser cuidado.", "titulo_pt": "Preservar a água", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 107664, "titulo": "How wildfires are changing the U.S. electric grid", "url": "https://www.axios.com/2026/08/17/wildfires-electric-grid-planning-energy-infrastructure", "fonte_id": "axios", "data_pub": "2026-08-17T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Anos de incêndios destrutivos estão forçando as empresas de energia a priorizar a resistência a incêndios em seus planos para a próxima geração da rede elétrica dos Estados Unidos. O projeto atual da rede está ocorrendo em um momento em que o risco de incêndios florestais se torna um desafio definidor para as empresas de energia.", "titulo_pt": "Como os incêndios florestais estão mudando a rede elétrica dos EUA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 106519, "titulo": "Etanol e biometano avançam no transporte de cargas no Brasil", "url": "https://www.cnnbrasil.com.br/agro/etanol-e-biometano-avancam-no-transporte-de-cargas/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-17T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O etanol e o biometano estão ganhando espaço no transporte de cargas no Brasil, oferecendo novas opções para reduzir a emissão de gases de efeito estufa em setores difíceis de eletrificar.", "titulo_pt": "Etanol e biometano avançam no transporte de cargas no Brasil", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 106844, "titulo": "Belgium races to tame huge wildfire 'spreading towards Germany'", "url": "http://www.euronews.com/video/2026/08/17/belgium-races-to-tame-huge-wildfire-spreading-towards-germany", "fonte_id": "euronews", "data_pub": "2026-08-17T07:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Combustionistas lutam contra as chamas avançantes na Bélgica oriental, onde o fumo denso e a topografia difícil dificultam o controle do incêndio. O fogo está se aproximando da Alemanha.", "titulo_pt": "Bélgica corre contra o grande incêndio 'que se aproxima da Alemanha'", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 106846, "titulo": "Thousands in Indonesia await aid after quake kills 53, overshadowing Independence Day", "url": "http://www.euronews.com/2026/08/17/thousands-in-indonesia-await-aid-after-quake-kills-53-overshadowing-independence-day", "fonte_id": "euronews", "data_pub": "2026-08-17T05:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas em Indonesia aguardam auxílio após terremoto que deixou 53 mortos, sobretudo durante o Dia da Independência. O Exército Indonésio informou que está transportando 13 toneladas de ajuda em dois aviões Hercules e um Boeing.", "titulo_pt": "Milhares aguardam ajuda após terremoto que matou 53 no dia da independência em Indonesia", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 105959, "titulo": "Crown-of-thorns to be removed to protect park reefs", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/17  "fonte_id": "euronews", "data_pub": "2026-08-17T11:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mulheres solteiras em Irã podem armazenar ovócitos congelados legalmente, mas não podem utilizá-los sem o consentimento de um marido. O procedimento é caro, representando dois meses de salário, e os custos de armazenamento anual aumentaram quatro vezes desde 2022, em um país que promove políticas natalistas mas registra uma diminuição de 9% nas natalidades.", "titulo_pt": "Por que mulheres solteiras em Irã congelam ovócitos que podem nunca serem permitidas para uso", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 108502, "titulo": "No Subsidies for Hormone Therapy for Trans People in Albania", "url": "https://balkaninsight.com/2026/08/17/no-subsidies-for-hormone-therapy-for-trans-people-in-albania/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-08-17T11:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo guia clínico na Albânia que aprova o tratamento hormonal de gênero não incluirá subsídios para medicamentos para pessoas trans. Isso gerou uma reação negativa online.", "titulo_pt": "Sem subsídios para terapia hormonal para pessoas Trans na albânia", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 106622, "titulo": "“Era un niño esclavo”: siete estrellas infantiles que debieron mantener a sus familias", "url": "https://www.lanacion.com.ar/espectaculos/personajes/era-un-nino-esclavo-siete-estrellas-infantiles-que-debieron-mantener-a-sus-familias-nid17082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-17T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Atores como Zendaya e Corey Feldman relataram sobre as consequências de terem se tornado os principais sustentadores financeiros de suas famílias no início das suas carreiras.", "titulo_pt": "Era um menino escravo: sete estrelas infantis que tiveram que sustentar as suas famílias", "veiculo": "L const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
