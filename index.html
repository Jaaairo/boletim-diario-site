ucas debocha de Andrea Sorvetão por derrota nas eleições", "url": "https://veja.abril.com.br/cultura/genro-de-xuxa-joao-lucas-debocha-de-andrea-sorvetao-por-derrota-nas-eleicoes/", "fonte_id": "veja", "data_pub": "2026-10-05T20:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Andrea Sorvetão, ex-Paquita e candidata a deputada federal pelo Rio de Janeiro, obteve apenas 2.529 votos nas eleições. João Lucas, genro de Xuxa, se divertiu com a derrota da candidata.", "titulo_pt": "Genro de Xuxa se diverte com derrota de Andrea Sorvetão nas eleições", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 197705, "titulo": "Para amainar a crise de abstinência, as próximas eleições em outros países", "url": "https://veja.abril.com.br/coluna/mundialista/para-amainar-a-crise-de-abstinencia-as-proximas-eleicoes-em-outros-paises/", "fonte_id": "veja", "data_pub": "2026-10-06T09:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Israel, Estados Unidos e Espanha terão eleições até o fim do ano, com debates entre direita e esquerda. Estas eleições terão grande influência no cenário político desses países.", "titulo_pt": "Para amenizar a crise de abstinência, eleições em israel, EUA e Espanha até o fim do ano", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 197571, "titulo": "Quênia confirma primeiro caso de ebola vindo do Congo; paciente morreu", "url": "https://www.cnnbrasil.com.br/internacional/quenia-confirma-primeiro-caso-de-ebola-vindo-do-congo-paciente-morreu/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-06T09:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Quênia confirmou o primeiro caso de ebola vindo da República Democrática do Congo, onde o paciente havia residido. Ele chegou a Nairóbi no sábado e 28 pessoas tiveram contato com ele.", "titulo_pt": "Quênia confirma primeiro caso de ebola vindo do Congo; paciente morreu", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 197516, "titulo": "Falta de energia afetará endereços em Santa Maria e Fercal nesta 3ª (6/10)", "url": "https://www.metropoles.com/distrito-federal/falta-de-energia-afetara-enderecos-em-santa-maria-e-fercal-nesta-3a-6-10", "fonte_id": "metropoles", "data_pub": "2026-10-06T09:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta terça-feira (6/10), haverá interrupções temporárias de energia em Santa Maria e Fercal para serviços de melhoria e modernização da rede elétrica e poda de árvores.", "titulo_pt": "Falta de energia afetará endereços em Santa Maria e Fercal nesta terça-feira (6/10)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 197522, "titulo": "Clima: temporais atingem Sul, Sudeste e Centro-Oeste nesta 3ª", "url": "https://www.metropoles.com/brasil/clima-temporais-atingem-sul-sudeste-e-centro-oeste-nesta-3a", "fonte_id": "metropoles", "data_pub": "2026-10-06T08:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Temporais atingem o Sul, Sudeste e Centro-Oeste nesta terça-feira. Conforme o dia avança, as chuvas tendem a abrandar em boa parte do Sul, com precipitações mais persistentes no Paraná.", "titulo_pt": "Temporais atingem Sul, Sudeste e Centro-Oeste nesta terça-feira", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 197441, "titulo": "Natura diz que mudança climática na amazônia põe em risco 2,6% da receita líquida", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/10/natura-diz-que-mudanca-climatica-na-amazonia-poe-em-risco-26-da-receita-liquida.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-06T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Natura estima que a mudança climática na Amazônia possa comprometer R$ 584,2 milhões em vendas, representando 2,6% da receita líquida da empresa em 2025.", "titulo_pt": "Natura avisa que mudança climática na amazônia pode ameaçar 2,6% da receita líquida", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 196901, "titulo": "\"Espantalhos flutuantes\" ajudam a evitar morte de milhares de aves marinhas", "url": "https://www.metropoles.com/ciencia/espantalhos-flutuantes-ajudam-a-evitar-morte-de-milhares-de-aves-marinhas", "fonte_id": "metropoles", "data_pub": "2026-10-05T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cientistas do Reino Unido desenvolveram um dispositivo que reduziu em 95 mil a morte de aves marinhas por ano. Este dispositivo, conhecido como 'espantalhos flutuantes', ajuda a prevenir a morte desses animais.", "titulo_pt": "Espantalhos flutuantes reduzem mortes de aves marinhas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 197216, "titulo": "Romanian president signs law regulating bear population cull", "url": "https://www.euronews.com/2026/10/05/romanian-president-signs-law-regulating-bear-population-cull", "fonte_id": "euronews", "data_pub": "2026-10-05T21:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A presidente da Romênia assinou uma lei que regula a cativeira da população de urus. Nos últimos anos, o número de urus avistados em cidades e vilas romenas aumentou, bem como o número de ataques a esses animais.", "titulo_pt": "Presidente da romênia assina lei regulando cativeiro da população de urus", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 197109, "titulo": "Conaf condena extracción de plantas endémicas en la Reserva Nacional La Chimba durante el desierto florido", "url": "https://www.latercera.com/nacional/noticia/conaf-condena-extraccion-de-plantas-endemicas-en-la-reserva-nacional-la-chimba-durante-el-desierto-florido/", "fonte_id": "la_tercera", "data_pub": "2026-10-05T20:15:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Conaf condenou a extração de plantas endêmicas na Reserva Nacional La Chimba durante o período conhecido como 'deserto florido'. Segundo a Asociación Socioambiental Raíces Endémicas, visitantes extraíram espécies como Cleome chilensis e Cistanthe grandiflora.", "titulo_pt": "Conaf condena extração de plantas endêmicas na Reserva Nacional La Chimba durante o deserto florido", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 196911, "titulo": "Fumaça de incêndios desaparece, mas outro risco invisível pode permanecer no ar", "url": "https://exame.com/ciencia/fumaca-de-incendios-desaparece-mas-outro-risco-invisivel-pode-permanecer-no-ar/", "fonte_id": "exame", "data_pub": "2026-10-05T18:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ozônio proveniente de incêndios pode persistir no ar, afetando áreas distantes além da fumaça visível e aumentando os impactos da poluição do ar sobre a saúde.", "titulo_pt": "Fumaça dos incêndios pode desaparecer, mas ozônio invisível pode continuar a ameaçar a saúde", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 195704, "titulo": "Incêndio atinge depósito de recicláveis e assusta moradores em BH", "url": "https://www.metropoles.com/minas-gerais/incendio-atinge-deposito-de-reciclaveis-e-assusta-moradores-em-bh", "fonte_id": "metropoles", "data_pub": "2026-10-05T17:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incêndio atingiu um depósito de recicláveis no bairro Nova Granada, Belo Horizonte, na madrugada desta segunda-feira (5/10). Os bombeiros conseguiram controlar as chamas sem registrar vítimas.", "titulo_pt": "Incêndio atinge depósito de recicláveis e assusta moradores em BH", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 196164, "titulo": "The Iran war is hitting America's school buses — and kids are paying the price", "url": "https://www.axios.com/2026/10/05/iran-war-diesel-fuel-costs-school-bus", "fonte_id": "axios", "data_pub": "2026-10-05T15:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A guerra do Irã está aumentando os custos do diesel, que são utilizados nas escolas para transportar milhões de crianças. Isso, somado à escassez crônica de motoristas de ônibus escolares, está causando dificuldades financeiras para as distritos escolares.", "titulo_pt": "Guerra do Irã está afetando os ônibus escolares e as crianças estão pagando o preço", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 196509, "titulo": "Mass quarantine issued in Russia after unexplained death of plague researcher", "url": "https://arstechnica.com/health/2026/10/researchers-death-from-undisclosed-illness-sparks-mass-quarantine-in-russia/", "fonte_id": "ars_technica", "data_pub": "2026-10-05T15:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma quarentena em massa foi ordenada na Rússia após a morte inesperada de um pesquisador da peste. Há relatos não confirmados de que houve um acidente no laboratório.", "titulo_pt": "Quarentena em massa emitiu na Rússia após morte inesperada de pesquisador da peste", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 196288, "titulo": "Belgian city’s historic canals turn green after record-hot summer", "url": "https://www.euronews.com/video/2026/10/05/belgian-citys-historic-canals-turn-green-after-record-hot-summer", "fonte_id": "euronews", "data_pub": "2026-10-05T08:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma camada espessa de plâncton verde chamado duckweed cobriu os canais históricos de Gante, interrompendo as embarcações turísticas e levantando novas preocupações sobre o aquecimento global na Bélgica.", "titulo_pt": "Canais históricos de gante ficam verdes após verão extremamente quente", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 196290, "titulo": "Floods leave streets and roads submerged across Catalonia", "url": "https://www.euronews.com/video/2026/10/05/floods-leave-streets-and-roads-submerged-across-catalonia", "fonte_id": "euronews", "data_pub": "2026-10-05T07:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Floods in Catalunha deixaram duas pessoas mortas e outra desaparecida. Ocorreram mais de 1.500 chamadas às equipes de bombeiros devido à forte chuva.", "titulo_pt": "Inundações causam duas mortes e uma pessoa desaparecida em catalunha", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 196201, "titulo": "Persistent drought puts pressure on France's drinking water networks", "url": "https://www.lemonde.fr/en/environment/article/2026/10/05/persistent-drought-puts-pressure-on-france-s-drinking-water-networks_6758251_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-05T03:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As reservas de água que abastecem os sistemas de distribuição na França estão sob pressão devido a uma deficiência significativa de precipitação.", "titulo_pt": "Secas persistentes pressionam redes de água da França", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 197816, "titulo": "Kenya confirms first Ebola case and says patient has died", "url": "https://www.theguardian.com/world/2026/oct/06/kenya-first-ebola-case-death-drc", "fonte_id": "guardian_world", "data_pub": "2026-10-06T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kenya confirmou seu primeiro caso de Ebola, envolvendo um cidadão keniata que havia estado na República Democrática do Congo. O paciente faleceu e 28 contatos foram identificados, incluindo familiares e profissionais de saúde.", "titulo_pt": "Kenya confirma primeiro caso de Ebola e relata óbito", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 197605, "titulo": "Como a guerra aumentou a violência sexual e os casamentos forçados de meninas e mulheres em Gaza", "url": "https://www.bbc.com/portuguese/articles/c8ly4yd5xkkpo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-06T08:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A convivência com desconhecidos e a falta de privacidade nos abrigos em Gaza têm sido acompanhadas por relatos de assédio e abuso sexual. Muitas famílias têm optado pelo casamento forçado de suas filhas como forma de proteção e preservação da reputação familiar.", "titulo_pt": "Como a guerra aumentou a violência sexual e os casamentos forçados de meninas e mulheres em Gaza", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 197927, "titulo": "Discovery of 11 bodies in Johannesburg exposes scale of violence against women", "url": "https://www.lemonde.fr/en/le-monde-africa/article/2026/10/06/discovery-of-11-bodies-in-johannesburg-exposes-scale-of-violence-against-women_6758291_124.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-06T08:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde julho, corpos de mulheres encontrados nus ou semi-nus, e brutalmente espancados, foram descobertos nos arredores da capital sul-africana. A realidade cruel da violência diária contra as mulheres no país se tornou inegável.", "titulo_pt": "Descoberta de 11 corpos em joanesburgo expõe escala da violência contra mulheres", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 198214, "titulo": "More than 1,900 children orphaned or separated from their families by Ebola in eastern DR Congo – UNICEF", "url": "https://www.unicef.org/press-releases/more-1900-children-orphaned-or-separated-their-families-ebola-eastern-dr-congo", "fonte_id": "unicef", "data_pub": "2026-10-06T08:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 1.900 crianças foram deixadas órfãs ou separadas de suas famílias devido à Ebola nas regiões de Ituri e North Kivu. O UNICEF está pedindo fundos urgentes para proteger as crianças que ficaram sem cuidados.", "titulo_pt": "Mais de 1.900 crianças órfãs ou separadas de suas famílias por Ebola em oriental da república democrática do Congo - UNICEF", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 198215, "titulo": "\"Ebola takes the people children depend on and unravels their lives” – UNICEF", "url": "https://www.unicef.org/press-releases/ebola-takes-people-children-depend-and-unravels-their-lives-unicef", "fonte_id": "unicef", "data_pub": "2026-10-06T07:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A comunicação-chefe da UNICEF na República Democrática do Congo, Halimatou Amadou, falou sobre como a Ebola remove as pessoas que as crianças dependem, desestruturando suas vidas. Essa foi a conclusão de uma conferência de imprensa realizada hoje no Palácio das Nações em Genebra.", "titulo_pt": "Ebola remove as pessoas que as crianças dependem e desestrutura suas vidas – UNICEF", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 198122, "titulo": "S. Korea has 52 death row inmates, average age of 58.7", "url": "https://en.yna.co.kr/view/AEN20261006006100315", "fonte_id": "yonhap_news", "data_pub": "2026-10-06T06:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "South Korea possui 52 condenados à morte com umidade média de 58,7 anos. As execuções foram suspensas no país há aproximadamente 30 anos.", "titulo_pt": "Coreia do sul tem 52 condenados à morte, com idade média de 58,7 anos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 197817, "titulo": "Tigray rebel groups ‘forcibly recruiting boys as young as 15’ as fighting spreads", "url": "https://www.theguardian.com/global-development/2026/oct/06/ethiopia-tigray-conflict-tplf-rebels-forcibly-recruit-boys-war-crimes", "fonte_id": "guardian_world", "data_pub": "2026-10-06T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Relatos indicam que grupos rebeldes na região de Tigray estão forçando a recruta de meninos com 15 anos ou menos. O conflito entre o governo federal etíope e o Tigray People's Liberation Front, que governava a região, ressurgiu em 23 de setembro, ameaçando uma nova crise humanitária.", "titulo_pt": "Grupos rebeldes na tigray estariam forçando a recruta de meninos de 15 anos ou menos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 198003, "titulo": "UN rights council condemns attacks on civilians in Sudan, calls for truce", "url": "https://www.aljazeera.com/news/2026/10/6/un-rights-council-condemns-attacks-on-civilians-in-sudan-calls-for-truce?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-06T02:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A assembleia dos direitos humanos condenou os ataques contra civis no Sudão e pediu um cessar-fogo. A resolução também estendeu o mandato da missão que investiga abusos no país.", "titulo_pt": "Assembleia dos direitos humanos condena ataques a civis no sudão e solicita tréguas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 198216, "titulo": "UNICEF Fast Facts: Over 347 million children in nearly 100 countries will be exposed to one of the strongest El Niño events on record", "url": "https://www.unicef.org/press-releases/unicef-fast-facts-over-347-million-children-nearly-100-countries-will-be-exposed-one", "fonte_id": "unicef", "data_pub": "2026-10-06T01:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 347 milhões de crianças em quase 100 países serão expostas a um dos eventos El Niño mais intensos na história registrada.", "titulo_pt": "Fatos rápidos UNICEF: mais de 347 milhões de crianças em quase 100 países serão expostas a um dos El Niño mais intensos na história registrada", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 197679, "titulo": "Gobierno pide al Congreso aprobar endeudamiento por US$25.600 millones en Presupuesto 2027; duelo nacional por nuevo asesinato de carabinero, y suspenden preparación de juicio oral de Monsalve", "url": "https://www.ciperchile.cl/2026/10/05/radar-05-10-26/?utm_source=rss&utm_medium=rss&utm_campaign=radar-05-10-26", "fonte_id": "ciper_chile", "data_pub": "2026-10-05T23:36:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O governo pediu ao Congresso a aprovação de um empréstimo de US$25,6 bilhões no orçamento de 2027. O país está em luto nacional após um novo assassinato de um carabineiro, e as preparações para o julgamento oral de Monsalve foram suspensas.", "titulo_pt": "Governo solicita empréstimo de US$25,6 bilhões no orçamento de 2027; país em luto após novo assassinato de carabineiro e julgamento de Monsalve suspenso", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 197269, "titulo": "Freed Syrians recount torture in Israeli detention centre", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/5/freed-syrians-recount-torture-in-israeli-detention-centre?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-05T19:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Prisioneiros sírios libertados relataram abusos sofridos em centros de detenção israelenses.", "titulo_pt": "Sírios libertados relatam tortura em centros de detenção israelenses", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 196346, "titulo": "Rohingya activist says it’s unfair to send refugees back to Myanmar", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/5/rohingya-activist-says-its-unfair-to-send-refugees-back-to-myanmar?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-05T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ativista rohingya afirma que é injusto enviar refugiados de volta para Myanmar.", "titulo_pt": "Ativista rohingya diz que é injusto enviar refugiados de volta para Myanmar", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 196192, "titulo": "North Korean refugee describes life ardian que descobriu um ataque a drone que matou 12 civis e feriu muitos outros na vila somali de Jamaame, o menino Abdiqadir Salah, de sete anos, passou por uma operação vital em Mogadishu. Durante o trajeto de rickshaw até o hospital, a mãe do menino, Marian Haji Abdi Guled, sentiu uma mistura de alegria e preocupação, pois aquele era o dia esperado para a cirurgia do filho, que havia sido gravemente ferido há quase um ano.", "titulo_pt": "Leitores do guardian financiam cirurgia transformadora para menino Somali ferido em ataque de drone dos EUA", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 195936, "titulo": "Lo que Chile debería aprender del gobierno carcelario del PCC", "url": "https://www.ciperchile.cl/2026/10/05/lo-que-chile-deberia-aprender-del-gobierno-carcelario-del-pcc/?utm_source=rss&utm_medium=rss&utm_campaign=lo-que-chile-deberia-aprender-del-gobierno-carcelario-del-pcc", "fonte_id": "ciper_chile", "data_pub": "2026-10-05T11:53:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto discute o modelo de governança aplicado pelo Partido Comunista da China (PCC) nas prisões e sugere que o Chile poderia aprender com essa abordagem.", "titulo_pt": "O que o Chile poderia aprender com o governo carcelarista do PCC", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 198228, "fonte_id": "hyperallergic", "titulo": "Lee Krasner Gets the Last Word", "url": "https://hyperallergic.com/lee-krasner-gets-the-last-word/", "data_pub": "2026-10-06T10:00:00Z", "topico": "cultura", "idioma": "en", "titulo_pt": "Lee Krasner conclui a exposição", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 197704, "fonte_id": "veja", "titulo": "Nobel de Química 2026 premia mensagens fantasmagóricas do espaço", "url": "https://veja.abril.com.br/ciencia/nobel-de-quimica-2026-premia-mensagens-fantasmagoricas-do-espaco/", "data_pub": "2026-10-06T09:59:00 function renderSecao(topico) {

function toggleDrill(id) {

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {

    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">

      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}

  return `<div>

    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

  return "8h";
}

const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

}

  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));

  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;

  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
