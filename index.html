<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

isenkot tenta se eleger em uma eleição onde a identidade e o trauma estão redefinindo as lealdades políticas, enquanto o Rassemblement National (RN), uma formação de extrema-direita, realiza um congresso em Orléans. Na China, Pequim prometeu apoiar forças pró-unificação na Taiwan para marcar o 81º aniversário do fim do domínio japonês na ilha, estabelecido formalmente como o 'Dia da Restauração de Taiwan'.\n\nOs eventos geopolíticos recentes abrangem diversos países e questões. Em Israel, o governo de Benjamin Netanyahu enfrenta eleições cruciais, com a possibilidade de formação de coalizão em debate. As forças israelenses intensificaram operações em Hebron, deslocando milhares de famílias e transformando casas em postos militares. O país anunciou o fechamento de cruzamentos com a Cisjordânia durante o período eleitoral. Em contraste, o ex-presidente dos Estados Unidos, Barack Obama, acusa Donald Trump de ter iniciado uma guerra desnecessária sem a aprovação do público. Na França, protestos massivos contra o aumento dos custos de vida têm levantado temores de que a onda de descontentamento possa se espalhar globalmente. A Arábia Saudita e seus aliados intensificaram suas operações militares contra os hutíes no Iêmen, interceptando drones e advertindo que uma guerra com os EUA e Israel poderia ter consequências globais. Além disso, o Irã intensificou sua postura, com o porta-voz do Corpo de Guardas Revolucionários declarando que uma guerra contra o Irã seria uma 'guerra apocalíptica' com vitória absoluta e consequências globais.", "economia": "O Conselho Administrativo de Recursos Fiscais (Carf) manteve a multa aplicada à Destro Brasil Distribuição Ltda por cessão irregular de nome em uma operação de importação envolvendo o grupo Lojas Americanas. Em outro destaque, o valor das empresas de luxo europeias caiu cerca de 250 bilhões de euros devido ao enfraquecimento da demanda chinesa e à queda das bolsas globais, agravando a situação do setor europeu de luxo. No terceiro trimestre de 2023, o número de trabalhadores temporários e diários na Coreia do Sul atingiu o nível mais baixo em 31 anos. A Coreia do Sul planeja aumentar o número de voos internacionais durante a temporada invernal para melhorar a conectividade aérea. Além disso, o número de voos 'low cost' no Brasil diminuiu após a saída da Flybondi, concentrando-se em três empresas internacionais que operam rotas entre cidades brasileiras e destinos da América Latina. Por fim, a Coreia do Sul registrou o segundo maior superávit em conta corrente, impulsionada pelas exportações robustas de chips, e o número de trabalhadores atípicos diminuiu, embora detalhes específicos não tenham sido fornecidos.", "tecnologia": "A Nvidia apresentou um protótipo de sua próxima geração de tecnologia de óptica integrada (OOI) no SEMICON West 2026, visando aumentar a densidade de banda e reduzir o consumo de energia para futuros interconexões de sistemas de IA. O evento destaca a importância crescente dos investimentos em IA, com a Meta elevando seus gastos a longo prazo com infraestrutura de IA, prevendo um fluxo de caixa livre negativo e compromissos futuros de aluguel e contratos não canceláveis subindo para cerca de US$825 bilhões. A demanda por data centers de inteligência artificial está aumentando, levando as empresas de equipamentos elétricos de Taiwan a expandir seus negócios para integração de sistemas, engenharia, contratação e construção (EPC) e soluções de data centers modulares. Em setembro, as montadoras chinesas registraram vendas recorde de 194.800 veículos na Europa, alcançando uma fatia de mercado inédita de 14,6%, em vista das possíveis restrições europeias sobre a importação de veículos híbridos chineses, que estão previstas para entrar em vigor em 2027. Além disso, a empresa sul-coreana Namuga está acelerando sua estratégia de IA física após firmar um acordo de suprimento com uma empresa global de robôs humanóides, almejando um faturamento de 1 trilhão de wones (aproximadamente US$754,7 milhões) até 2030.", "ciencia": "A nave espacial Nuri, desenvolvida localmente, realizou com sucesso sua quinta missão, transportando 15 satélites para uma órbita sol-síncrona a uma altitude de aproximadamente 575 km. Este lançamento é significativo, representando o quinto voo da Nuri, um foguete de três etapas conhecido também como KSLV-II. Em outras notícias, cientistas do Brasil alertaram que os sistemas naturais da Terra estão sobrecarregados devido ao aquecimento global, afetando regiões como a Malásia, que enfrenta neblina. Além disso, uma vacina personalizada reduziu em 42% a recorrência de um câncer de pele agressivo, apresentada durante o congresso da Sociedade Europeia de Oncologia Médica em Madri. Este avanço é considerado um 'avanço histórico' e representa um importante passo na luta contra o câncer.", "cultura": "O evento mais importante dos artigos é a devolução de mais de um milhão de antiguidades aos países de origem desde 1950, conforme relatado pela Financial Times. Este retorno representa um esforço significativo para repatriar itens com um valor mínimo de pelo menos 2 bilhões de dólares, refletindo um compromisso global em preservar e proteger o patrimônio cultural. Em outro destaque, a série de Walter Salles sobre Sócrates e a Democracia Corinthiana, publicada na Folha Ilustrada, retrata a vida de jogadores do Corinthians e a campanha das Diretas Já, oferecendo uma perspectiva cultural sobre o futebol e a política brasileira. Além disso, a devolução de antiguidades e a série sobre Sócrates destacam a importância do patrimônio cultural e sua influência na sociedade, enquanto outros artigos abordam temas variados como culinária, leitura, arte e tecnologia, todos interligados por uma forte presença cultural em suas respectivas discussões.", "sociedade": "Em Goianésia, Goiás, um jovem de 19 anos faleceu após ser atropelado durante uma carreata em apoio a Flávio Bolsonaro, levando as autoridades a investigar o incidente. Na França, quase mil pessoas foram presas durante protestos contra o aumento do custo de vida, com até 70 mil policiais mobilizados em Paris. Em Madri, cerca de 25 mil pessoas participaram de um rally exigindo garantias para o sistema de aposentadoria, em meio a uma discussão política sobre a sustentabilidade do sistema e os custos de vida. Em Nova York, um programa municipal oferecerá comida gratuita a cães e gatos em 22 pontos da cidade, com um investimento de 500 mil dólares. No Chile, um ônibus da empresa RED foi queimado por manifestantes em Conchalí, no bairro de El Cortijo. Em Cuba, medidas sociais foram anunciadas para grupos vulneráveis, em meio à crise econômica e desigualdade no país.", "meio_ambiente": "O estado de São Paulo aumentou suas ações para combater enchentes e secas, investindo R$ 1,19 bilhão. Esses recursos foram destinados a medidas para enfrentar temporais, estiagens, ondas de calor e incêndios florestais. O fenômeno El Niño, que está se intensificando e atingirá seu pico em dezembro, está causando precipitações anormais e temperaturas elevadas, resultando em danos em residências e deslizamentos de terra.", "direitos_humanos": "A Arquidiocese de Nova York concordou em pagar 800 milhões de dólares a 1.300 sobreviventes de abuso sexual, o segundo maior acordo de indenizações envolvendo abusos clericais nos Estados Unidos. Este acordo reflete a crescente pressão sobre instituições religiosas em relação às suas responsabilidades com relação aos abusos sexuais. Em Israel, o governo anunciou que fechará todos os pontos de entrada terrestres com a Cisjordânia durante a próxima eleição, aumentando a tensão na região. Além disso, forças israelenses expulsaram cerca de 2.000 moradores de Hebron após um ataque que resultou na morte de dois soldados palestinos, levando a uma crescente fome entre os deslocados. Em Hong Kong, a polícia prendeu 33 pessoas em uma operação contra uma quadrilha que roubava cartões de crédito de hongkongueses em Shenzhen, causando prejuízos superiores a 1,8 milhão de dólares. Estes eventos destacam os desafios dos direitos humanos em diferentes partes do mundo, desde a proteção de crianças até a repressão a grupos vulneráveis."}, "resumo_do_dia": {"politica_nacional": [{"id": 224233, "titulo": "Vereadora do PT fica ferida após ataque a carro de som em MG", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/vereadora-do-pt-fica-ferida-apos-ataque-a-carro-de-som-em-mg.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-25T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A vereadora Iara Pimentel, do PT, foi atingida por uma pedra no rosto durante uma carreata eleitoral em Montes Claros, Minas Gerais, e foi internada em um hospital. O incidente ocorreu no final da carreata no sábado (24).", "titulo_pt": "Vereadora do PT fica ferida após ataque a carro de som em MG", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 224272, "titulo": "Eleitores vão às urnas hoje para escolher o presidente do país", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/eleitores-vao-urnas-neste-domingo-para-escolher-o-presidente-do-pais", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-25T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os eleitores brasileiros votam neste domingo (25) para eleger o presidente da República. Cerca de 158,7 milhões de eleitores estão aptos a votar, conforme informa a Justiça Eleitoral.", "titulo_pt": "Eleitores vão às urnas hoje para escolher o presidente do país", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 224234, "titulo": "Tarcísio deverá indicar 6 dos 7 membros do TCE-SP ao fim do seu segundo mandato", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/tarcisio-devera-indicar-6-dos-7-membros-do-tce-sp-ao-fim-do-seu-segundo-mandato.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-25T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador de São Paulo, Tarcísio de Freitas (Republicanos), está prestes a concluir seu segundo mandato tendo indicado 6 dos 7 conselheiros do TCE-SP (Tribunal de Contas do Estado de São Paulo).", "titulo_pt": "Tarcísio deve indicar 6 dos 7 membros do TCE-SP ao fim do seu segundo mandato", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 224262, "titulo": "Trump deve anunciar plano da Audi para construir fábrica na Geórgia, nos EUA, diz fonte", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/trump-deve-anunciar-plano-da-audi-para-construir-fabrica-na-georgia-nos-eua-diz-fonte.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-25T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, deve anunciar que a Audi, subsidiária da Volkswagen, planeja construir uma fábrica na Geórgia para produzir 200 mil SUVs por ano. O anúncio está programado para este sábado e foi informado por uma autoridade do governo à Reuters.", "titulo_pt": "Trump deve anunciar plano da Audi para construir fábrica na Geórgia, nos EUA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 224347, "titulo": "Se vencer, Flávio será 3º presidente mais jovem; Lula, o mais velho", "url": "https://www.cnnbrasil.com.br/eleicoes/se-vencer-flavio-sera-3o-presidente-mais-jovem-lula-o-mais-velho/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-25T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, de 45 anos, seria o terceiro presidente mais jovem a assumir diretamente, ficando atrás apenas de Fernando Collor e Jânio Quadros. Lula, se eleito, iniciaria seu novo mandato aos 81 anos, estabelecendo um recorde de idade e número de participações consecutivas.", "titulo_pt": "Se vencer, Flávio será o 3º presidente mais jovem; Lula, o mais velho", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 224329, "titulo": "Saiba quais estados têm 2º turno para governador neste domingo (25/10)", "url": "https://www.metropoles.com/brasil/saiba-quais-estados-tem-2o-turno-para-governador-neste-domingo-25-10", "fonte_id": "metropoles", "data_pub": "2026-10-25T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Neste domingo (25/10), os eleitores de cinco estados e do Distrito Federal votam para escolher seus governadores. No restante do país, os brasileiros votam para presidente.", "titulo_pt": "Saiba quais estados têm 2º turno para governador neste domingo (25/10)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 224334, "titulo": "Brasil volta às urnas neste domingo para decidir entre Flávio e Lula", "url": "https://www.metropoles.com/brasil/brasil-volta-as-urnas-neste-domingo-para-decidir-entre-flavio-e-lula", "fonte_id": "metropoles", "data_pub": "2026-10-25T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil realiza neste domingo o segundo turno das eleições presidenciais, com mais de 158,7 milhões de eleitores aptos a votar. Além disso, cinco estados e o Distrito Federal também elegerão seus governadores.", "titulo_pt": "Brasil vota neste domingo entre Flávio e Lula e escolhe governadores", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 224352, "titulo": "Quebras de sigilos, Bolsa Família e Meta pautaram reta final das eleições", "url": "https://www.cnnbrasil.com.br/eleicoes/quebras-de-sigilos-bolsa-familia-e-meta-pautaram-reta-final-das-eleicoes/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-25T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Durante o segundo turno das eleições, Flávio Bolsonaro e Luiz Inácio Lula da Silva discutiram sobre diversos temas, incluindo quebras de sigilos, Bolsa Família e meta, e utilizaram novos processos no Tribunal Superior Eleitoral (TSE).", "titulo_pt": "Confrontos sobre temas e novos processos no tse marcaram a reta final das eleições", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 224353, "titulo": "Brasil dividido vai às urnas hoje para escolher entre Flávio e Lula", "url": "https://www.cnnbrasil.com.br/eleicoes/brasil-dividido-vai-as-urnas-hoje-para-escolher-entre-flavio-e-lula/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-25T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 158,7 milhões de eleitores brasileiros votam neste domingo para escolher entre Flávio Dino e Lula. Quem não compareceu no 1º turno pode votar no 2º turno.", "titulo_pt": "Brasil dividido vai às urnas hoje para escolher entre Flávio e Lula", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 224336, "titulo": "Sérgio Sacani e Rodrigo Silva: devemos temer o apocalipse bíblico?", "url": "https://www.metropoles.com/conteudo-especial/sacani-rodrigo-apocalipse", "fonte_id": "metropoles", "data_pub": "2026-10-25T06:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sérgio Sacani e Rodrigo Silva serão convidados para discutir mistérios da humanidade no Metrópoles Talks em Brasília no dia 29 de outubro.", "titulo_pt": "Sérgio Sacani e Rodrigo Silva: devemos temer o apocalipse bíblico?", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 224356, "titulo": "2º turno: Flávio visita todas as regiões do país; Lula deixa Norte de fora", "url": "https://www.cnnbrasil.com.br/eleicoes/2o-turno-flavio-visita-todas-as-regioes-do-pais-lula-deixa-norte-de-fora/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-25T06:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro visita todas as regiões do país, enquanto Lula evita o Norte. São Paulo é a unidade da federação mais visitada pelos candidatos, abrangendo cerca de 41,8% do eleitorado brasileiro.", "titulo_pt": "2º turno: flávio visita todas as regiões do país; Lula deixa são paulo de fora", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 224357, "titulo": "TSE registra mudança em mais de 400 locais de votação; saiba como conferir", "url": "https://www.cnnbrasil.com.br/eleicoes/tse-registra-mudanca-em-mais-locais-de-votacao-saiba-como-conferir/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-25T06:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) registrou mudanças em mais de 400 locais de votação. Alterações são realizadas pelos tribunais regionais em situações excepcionais, como eventos climáticos extremos, problemas de infraestrutura ou questões de segurança.", "titulo_pt": "TSE registra mudança em mais de 400 locais de votação; saiba como conferir", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 224375, "titulo": "Eleição 2026: o que você precisa saber para votar no 2º turno?", "url": "https://exame.com/brasil/eleicao-2026-o-que-voce-precisa-saber-para-votar-no-2o-turno/", "fonte_id": "exame", "data_pub": "2026-10-25T05:00:00Z", "idioma": "pt", "provavel_duplicata_de": 224321, "texto_pt": "É necessário apresentar um documento oficial com foto para votar no segundo turno das eleições de 2026. Os documentos aceitos incluem carteira de identidade, Carteira Nacional de Habilitação (CNH), passaporte e carteira de trabalho.", "titulo_pt": "Eleição 2026: o que você precisa saber para votar no 2º turno?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 224360, "titulo": "PoderData/AYA: Flávio tem 51% dos votos válidos no 2º turno; Lula, 49%", "url": "https://www.cnnbrasil.com.br/eleicoes/poderdata-aya-flavio-tem-51-dos-votos-validos-no-2o-turno-lula-49-3/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-25T04:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O levantamento PoderData/AYA mostrou que Flávio teve 51% dos votos válidos h-in-france-to-protest-against-government", "fonte_id": "france24", "data_pub": "2026-10-25T09:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas marcharam por todo o país na França em protesto contra o aumento dos custos de vida e a falta de recursos governamentais para serviços essenciais como escolas. As manifestações em Paris começaram pacificamente, mas terminaram com uma resposta de segurança intensa, resultando em cerca de 1.000 pessoas detidas.", "titulo_pt": "Centenas de milhares marcham na França contra aumento dos custos de vida", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 224673, "titulo": "Israeli forces turn Hebron homes into military posts amid lockdown", "url": "https://www.aljazeera.com/news/2026/10/25/israeli-forces-turn-hebron-homes-into-military-posts-amid-lockdown?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-25T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças israelenses transformam casas em postos militares em Hebron durante lockdown. Expulsões, operações policiais e expansão de colônias continuam no Território Ocidental.", "titulo_pt": "Forças israelenses transformam casas em postos militares em Hebron durante lockdown", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 224640, "titulo": "Gadi Eisenkot campaigns on Moroccan roots in challenge to Netanyahu", "url": "https://www.dw.com/en/gadi-eisenkot-campaigns-on-moroccan-roots-in-challenge-to-netanyahu/a-79747193?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-10-25T09:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gadi Eisenkot está usando sua herança marroquina em áreas fortes do Likud, como Sderot, durante as eleições israelenses. A identidade e o trauma estão redefinindo as lealdades políticas da cidade.", "titulo_pt": "Gadi Eisenkot apela para raízes marroquinas em desafio a Netanyahu", "veiculo": "Deutsche ulo_pt": "Quando pagar IBS e CBS pode ser vantajoso para o condomínio?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 224495, "titulo": "Pagamentos agênticos e a regulação de quem decide pelo pagador", "url": "https://www.jota.info/opiniao-e-analise/colunas/fronteiras-concorrencia-regulacao/pagamentos-agenticos-e-a-regulacao-de-quem-decide-pelo-pagador", "fonte_id": "jota", "data_pub": "2026-10-25T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial (IA) tem o potencial de expandir as oportunidades no mercado de pagamentos, mas também apresenta novos desafios para a regulação.", "titulo_pt": "Pagamentos agênticos e a regulação de quem decide pelo pagador", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 224810, "titulo": "Osong beauty expo draws nearly US$100 mln in export deals", "url": "https://en.yna.co.kr/view/AEN20261025004300320", "fonte_id": "yonhap_news", "data_pub": "2026-10-25T06:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um evento de cosméticos e beleza em Seul, Coreia do Sul, gerou quase 100 milhões de dólares em negócios de exportação. O evento ocorreu em 25 de outubro.", "titulo_pt": "Feira de beleza em seul atrai negócios de exportação no valor de quase 100 milhões de dólares", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 224667, "titulo": "Luxury groups’ value drops by €250bn as Chinese consumer demand fades", "url": "https://www.ft.com/content/1c3065cf-538f-433a-9749-0355a3642c7c?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-25T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O valor das empresas de luxo europeias caiu em torno de 250 bilhões de euros devido ao enfraquecimento da demanda chinesa e à queda das bolsas globais. Este quadro negativo está agravando a situação do setor europeu de luxo.", "titulo_pt": "Valor das empresas de luxo cai em 250 bilhões de euros devido ao enfraquecimento da demanda chinesa", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 224817, "titulo": "S. Korea to expand int'l flights in winter season", "url": "https://en.yna.co.kr/view/AEN20261025003300320", "fonte_id": "yonhap_news", "data_pub": "2026-10-25T04:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul planeja aumentar o número de voos internacionais durante a temporada invernal. A decisão visa melhorar a conectividade aérea durante o período.", "titulo_pt": "Coreia do sul vai expandir voos internacionais na temporada invernal", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 224775, "titulo": "Trump hails tariffs for new US$4.2 billion Audi plant in Georgia", "url": "https://www.scmp.com/news/world/united-states-canada/article/3372051/trump-hails-tariffs-new-us42-billion-audi-plant-georgia", "fonte_id": "scmp", "data_pub": "2026-10-25T04:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, defendeu a utilização de tarifas durante um comício em Georgia, afirmando que elas enriqueceram o país. Em seguida, foi anunciado que a Volkswagen concordou em construir uma nova fábrica de US$ 4,2 bilhões para a Audi no estado.", "titulo_pt": "Trump celebra tarifas para nova fábrica de US$ 4,2 bilhões da Audi em Georgia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 224803, "titulo": "Foreign health insurance surplus nears W1tr", "url": "https://www.koreaherald.com/article/10913873", "fonte_id": "korea_herald", "data_pub": "2026-10-25T04:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forasteiros contribuíram mais para o sistema de saúde nacional da Coreia do Sul do que receberam em benefícios médicos no ano passado, deixando um déficit próximo a 1 trilhão de wones. Os prêmios pagos pelos forasteiros totalizaram 2,51 trilhões de wones em 2025, enquanto os benefícios de seguro somaram 1,52 trilhões de wones.", "titulo_pt": "Superávit da saúde internacional se aproxima de 1 trilhão de wones", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 224778, "titulo": "Gulf economies accelerate diversification as recession looms over Iran war", "url": "https://www.scmp.com/week-asia/economics/article/3371922/gulf-economies-accelerate-diversification-recession-looms-over-iran-war", "fonte_id": "scmp", "data_pub": "2026-10-25T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Antes do início da guerra causada pelo ataque dos EUA e Israel a Irã em fevereiro, os monarquias do Golfo estavam vivendo um sonho de prosperidade que invejavam no mundo. Seus economias alimentadas por hidrocarbonetos eram oasis brilhantes de crescimento, isentas dos conflitos que afetavam outras partes do Oriente Médio.", "titulo_pt": "Economias do golfo aceleram diversificação diante de guerra com Irã", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 224742, "titulo": "Budget-friendly restaurant chain Saizeriya succumbs to rising costs", "url": "https://www.japantimes.co.jp/business/2026/10/25/companies/saizeriya-price-hike/", "fonte_id": "japan_times", "data_pub": "2026-10-25T03:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A rede de restaurantes Saizeriya, com presença nacional, aumentará os preços dos menus em média em 6%, com algumas lojas de grande movimento aumentando em 10%.", "titulo_pt": "Cadeia de restaurantes econômicos Saizeriya aumenta preços para combater elevação dos custos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 224745, "titulo": "Cartel-suspected brewers held beer prices steady after 2023 tax cut", "url": "https://www.japantimes.co.jp/business/2026/10/25/japan-cartel-suspected-brewers/", "fonte_id": "japan_times", "data_pub": "2026-10-25T02:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Concorrência da Japan Fair Trade Commission está investigando uma possível cartelização relacionada aos preços do transporte de cerveja entre Asahi, Kirin, Suntory e Sapporo. Os fabricantes mantiveram os preços da cerveja estáveis após a redução de impostos em 2023.", "titulo_pt": "Comissão de concorrência investiga possível cartel de cervejeiros sobre preços", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 224263, "titulo": "Mercado de voos 'low cost' encolhe ainda mais no Brasil após saída da Flybondi", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/mercado-de-voos-low-cost-encolhe-ainda-mais-no-brasil-apos-saida-da-flybondi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-25T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O mercado de companhias aéreas low cost no Brasil diminuiu ainda mais após a saída da Flybondi, concentrando-se em três empresas internacionais que operam rotas entre cidades brasileiras e destinos da América Latina.", "titulo_pt": "Mercado de voos low cost encolhe após saída da Flybondi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 224833, "titulo": "We Linked 150 of Ikea’s $10 Speakers to Make a Wall of Sound", "url": "https://www.wired.com/story/we-linked-150-ikea-speakers-to-make-a-wall-of-sound/", "fonte_id": "wired", "data_pub": "2026-10-25T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A revista WIRED ligou 150 dos alto-falantes de R$10 da IKEA para criar uma parede de som. O experimento questiona se é possível ter demais de uma coisa pequena.", "titulo_pt": "Tentamos o que até a marca sueca não fez: criar uma montanha sonora usando dezenas dos alto-falantes bluetooth mais baratos do mercado.", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 224414, "titulo": "Smartphone, óculos inteligentes… O que pode e o que não pode entrar na cabine de votação?", "url": "https://olhardigital.com.br/2026/10/25/pro/smartphone-oculos-inteligentes-o-que-pode-e-o-que-nao-pode-entrar-na-cabine-de-votacao/", "fonte_id": "olhar_digital", "data_pub": "2026-10-25T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A regra sobre o que pode e não pode entrar na cabine de votação valeu para o primeiro turno das eleições e será aplicada novamente no segundo turno, que ocorrerá neste domingo (25).", "titulo_pt": "Smartphone, óculos inteligentes… O que pode e O que não pode entrar na cabine de votação?", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 224416, "titulo": "Veja como justificar ausência na votação deste domingo (25)", "url": "https://olhardigital.com.br/2026/10/25/pro/veja-como-justificar-ausencia-na-votacao-deste-domingo-25/", "fonte_id": "olhar_digital", "data_pub": "2026-10-25T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "É possível justificar a ausência na votação deste domingo (25) no próprio dia ou posteriormente, dentro dos prazos estabelecidos pela Justiça Eleitoral.", "titulo_pt": "Veja como justificar ausência na votação deste domingo", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 224794, "titulo": "From rebuilding lives to shaping futures, Posco's 1% gives back", "url": "https://www.koreaherald.com/article/10913959", "fonte_id": "korea_herald", "data_pub": "2026-10-25T07:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Posco Group está expandindo seus programas de contribuição social, fornecendo dispositivos prostéticos avançados para veteranos feridos e educação científica prática para alunos. Estes esforços visam apoiar comunidades locais e gerações futuras, com a iniciativa Posco 1% Sharing Foundation baseada em contribuições voluntárias dos funcionários desde 2013.", "titulo_pt": "De reconstrução de vidas a moldagem do futuro, Posco's 1% dá retorno", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 224795, "titulo": "Mercedes-Benz Korea marks 20 years of technician training", "url": "https://www.koreaherald.com/article/10913958", "fonte_id": "korea_herald", "data_pub": "2026-10-25T07:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Mercedes-Benz Korea está fortalecendo suas capacidades de pós-venda através de programas de treinamento, comemorando 20 anos do seu programa de desenvolvimento de técnicos automotivos. O programa, que começou como o Automotive Mechatronic Traineeship (AMT) em 2006, foi reformulado em 2022 como o Automotive Electric Traineeship (AET) para atender à crescente demanda por manutenção de veículos elétricos.", "titulo_pt": "Mercedes-benz Korea comemora 20 anos de treinamento de técnicos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 224367, "titulo": "É possível ganhar dinheiro ajudando a treinar sistemas de IA?", "url": "https://exame.com/inteligencia-artificial/e-possivel-ganhar-dinheiro-ajudando-a-treinar-sistemas-de-ia/", "fonte_id": "exame", "data_pub": "2026-10-25T06:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pessoas podem ganhar dinheiro avaliando respostas, identificando erros e melhorando conteúdos produzidos por inteligência artificial em trabalhos remotos.", "titulo_pt": "É possível ganhar dinheiro ajudando a treinar sistemas de IA?", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 224374, "titulo": "Habilidades em IA passam a pesar na carreira de líderes brasileiros. Veja como se preparar", "url": "https://exame.com/inteligencia-artificial/habilidades-em-ia-passam-a-pesar-na-carreira-de-lideres-brasileiros-veja-como-se-preparar/", "fonte_id": "exame", "data_pub": "2026-10-25T05:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisas indicam um aumento no uso de tecnologia pelos executivos brasileiros, destacando a importância de combinar conhecimento digital, habilidades analíticas e julgamento humano na liderança.", "titulo_pt": "Habilidades em IA passam a pesar na carreira de líderes brasileiros", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 224743, "titulo": "GMO asks government to take active cyberdefense measures", "url": "https://www.japantimes.co.jp/news/2026/10/25/japan/crime-legal/gmo-active-cyberdefense-government-request/", "fonte_id": "japan_times", "data_pub": "2026-10-25T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa GMO Internet revelou que houve acesso não autorizado aos seus servidores, relacionado a operações de negociação automática de câmbio com margem. A empresa pediu ao governo que adote medidas proativas em defesa cibernética.", "titulo_pt": "GMO pede ao governo medidas proativas em defesa cibernética", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 224822, "titulo": "Hyundai Motor, Kia's combined China sales fall below 10,000 units in Sept.", "url": "https://en.yna.co.kr/view/AEN20261025001900320", "fonte_id": "yonhap_news", "data_pub": "2026-10-25T02:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As vendas combinadas de Hyundai Motor e Kia no mercado chinês caíram para menos de 10.000 unidades em setembro. Essa informação foi divulgada em Seul, Coreia do Sul, em 25 de outubro pelo Yonhap News.", "titulo_pt": "Vendas combinadas de hyundai e Kia no China caem para menos de 10.000 unidades em setembro", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 224824, "titulo": "Tving tops new streaming app installations in Sept.", "url": "https://en.yna.co.kr/view/AEN20261025001700320", "fonte_id": "yonhap_news", "data_pub": "2026-10-25T01:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As instalações recentes da aplicativo móvel do Tving aumentaram em setembro. A empresa liderou as novas instalações de aplicativos de streaming no mês.", "titulo_pt": "Tving lidera novas instalações de aplicativos de streaming em setembro", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 224747, "titulo": "‘Tech debt coming due’: AI-found flaw signals chaos ahead", "url": "https://www.japantimes.co.jp/business/2026/10/25/tech/ai-flaw-tech-debt/", "fonte_id": "japan_times", "data_pub": "2026-10-25T01:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um defeito vulnerável a hackers foi descoberto usando um modelo do OpenAI em uma das demonstrações mais proeminentes das capacidades cibernéticas da inteligência artificial. Isso sugere que problemas relacionados à dívida técnica podem surgir no futuro.", "titulo_pt": "Dívida técnica em evidência: falha encontrada pela IA indica caos à frente", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 224836, "titulo": "Nvidia unveils OOI CPO prototype for post-2028 AI needs", "url": "https://www.digitimes.com/news/a20261023PD240/nvidia-cpo-interposer-technology-2026.html", "fonte_id": "digitimes", "data_pub": "2026-10-25T00:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia apresentou um protótipo de sua próxima geração de tecnologia de óptica integrada (OOI) no SEMICON West 2026. A tecnologia move o motor óptico de uma suporte orgânico convencional para um interpositor de silício que carrega os chips de processamento, aumentando a densidade de banda e reduzindo o consumo de energia para futuros interconexões de sistemas de IA.", "titulo_pt": "Nvidia revela protótipo de tecnologia OOI CPO para necessidades de IA após 2028", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 224838, "titulo": "Namuga expands beyond Samsung with humanoid robot camera modules", "url": "https://www.digitimes.com/news/a20261023PD237/robot-camera-samsung-production-revenue.html", "fonte_id": "digitimes", "data_pub": "2026-10-25T00:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa sul-coreana de módulos de detecção de imagem Namuga está acelerando sua estratégia de IA física após firmar um acordo de suprimento com uma empresa global de robôs humanóides. A companhia almeja um faturamento de 1 trilhão de wones (aproximadamente US$754,7 milhões) até 2030.", "titulo_pt": "Namuga expande além da Samsung com módulos de câmera de robôs humanóides", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 224839, "titulo": "Chinese automakers capture record 14.6% Europe market share as looming hybrid import curbs spur shipments", "url": "https://www.digitimes.com/news/a20261023PD236/europe-automakers-shipments-sales-market-share.html", "fonte_id": "digitimes", "data_pub": "2026-10-25T00:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em setembro, as montadoras chinesas registraram vendas recorde de 194.800 veículos na Europa, alcançando uma fatia de mercado inédita de 14,6%. O aumento nas vendas parece estar relacionado à aceleração das entregas em vista das possíveis restrições europeias sobre a importação de veículos híbridos chineses, que estão previstas para entrar em vigor em 2027.", "titulo_pt": "Montadoras chinesas conquistam recorde de 14,6% do mercado europeu em setembro, ante possíveis restrições de importação", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 224840, "titulo": "AI data centers drive Taiwan's electrical firms into modular, EPC markets", "url": "https://www.digitimes.com/news/a20261023PD233/data-equipment-epc-demand-taiwan.html", "fonte_id": "digitimes", "data_pub": "2026-10-25T00:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A demanda por data centers de inteligência artificial está aumentando, levando as empresas de equipamentos elétricos da Taiwan a expandir seus negócios para integração de sistemas, engenharia, contratação e construção (EPC) e soluções de data centers modulares. Isso ocorre devido às necessidades crescentes para fornecimento de energia, eficiência no resfriamento e velocidade de implantação das novas gerações de servidores de inteligência artificial.", "titulo_pt": "Centrais de inteligência artificial impulsionam empresas elétricas da Taiwan para mercados de EPC e soluções modulares", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 224841, "titulo": "Meta’s AI commitments surge to US$825 billion, testing financing power", "url": "https://www.digitimes.com/news/a20261023PD220/meta-financing-infrastructure-investment-capex.html", "fonte_id": "digitimes", "data_pub": "2026-10-25T00:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meta Platforms está aumentando sua gastos a longo prazo com infraestrutura de IA, com o fluxo de caixa livre se tornando negativo no terceiro trimestre de 2026 e compromissos futuros de aluguel e contratos não canceláveis subindo para cerca de US$825 bilhões. A companhia elevou sua previsão de capex para 2026 em US$5 bilhões para US$135 bilhões, indicando expansão contínua de IA diante de novos desafios financeiros e de investimento.", "titulo_pt": "Comitê de AI da meta sobe para US$825 bilhões, testando poder financeiro", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 224784, "titulo": "[팟캐스트] (823) 누리호 5차 발사 성공적 이륙", "url": "https://www.koreaherald.com/article/10914001", "fonte_id": "korea_herald", "data_pub": "2026-10-25T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nave espacial Nuri, desenvolvida localmente, realizou sua quinta missão na quarta-feira, transportando 15 satélites para uma órbita sol-síncrona a uma altitude de aproximadamente 575 km. Este lançamento marca o quinto voo da Nuri, uma rocket em três etapas conhecida também como KSLV-II.", "titulo_pt": "Nuri realiza quinta missão com 15 satélites a bordo", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 224455, "titulo": "Optogenética: cómo es la técnica que ganó el Nobel de Medicina", "url": "https://www.clarin.com/viva/optogenetica-tecnica-gano-nobel-medicina_0_e46ipXLIC8.html", "fonte_id": "clarin", "data_pub": "2026-10-25T09:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Karl Deisseroth, Peter Hegemann e Georg Nagel ganharam o Nobel de Medicina por desenvolverem a técnica de optogenética, que permite controlar a atividade de neurônios cerebrais através da luz. Esta técnica tem implicações significativas para a psiquiatria.", "titulo_pt": "Optogenética: como é a técnica que ganhou o Nobel de Medicina", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 224271, "titulo": "Antiga metrópole asiática, Mohenjo-daro uniu menos desigualdade e prosperidade", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/antiga-metropole-asiatica-mohenjo-daro-uniu-menos-desigualdade-e-prosperidade.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-25T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa sugere que a antiga metrópole asiática Mohenjo-daro, localizada atualmente no Paquistão, pode ter reduzido a desigualdade social ao longo do tempo, atingindo níveis comparáveis aos atuais países escandinavos. A igualdade é atribuída a uma combinação de participação popular e crescimento econômico.", "titulo_pt": "Antiga metrópole asiática Mohenjo-daro pode ter reduzido desigualdade social", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 224734, "titulo": "What can Asia do to avoid crossing crucial climate tipping points?", "url": "https://www.japantimes.co.jp/environment/2026/10/25/climate-change/climate-tipping-points-asia/", "fonte_id": "japan_times", "data_pub": "2026-10-25T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas apresentaram no Brasil como os sistemas naturais da Terra estão sobrecarregados devido ao aquecimento global em uma conferência global realizada em Malaysia, afetada por neblina.", "titulo_pt": "O que a ásia pode fazer para evitar cruzar pontos de virada climáticos cruciais?", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 224848, "titulo": "STAT+: After a cancer vaccine’s first success, the race is on to expand the impact", "url": "https://www.statnews.com/2026/10/25/mrna-cancer-vaccine-merck-moderna-esmo-intismeran-next-applications/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-25T08:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois de 100 anos, finalmente há uma vacina eficaz contra o câncer. Agora, o foco é expandir seu efeito para mais tipos de tumores.", "titulo_pt": "Depois do primeiro sucesso de uma vacina contra o câncer, a corrida para ampliar seu impacto está em andamento", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 224849, "titulo": "APOD: 2026 October 25 – Dark Matter in a Simulated Universe", "url": "https://science.nasa.gov/image-article/apod-2026-october-25-dark-matter-in-a-simulated-universe/", "fonte_id": "nasa_news", "data_pub": "2026-10-25T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do Astronomy Picture of the Day de 25 de outubro de 2026 mostra a matéria escura em um universo simulado. A imagem destaca a distribuição da matéria escura em um cenário de simulação cósmica.", "titulo_pt": "Matéria escura em um universo simulado", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 224376, "titulo": "Astrônomos descobrem novos segredos dos primeiros cinco minutos do Universo", "url": "https://exame.com/ciencia/astronomos-descobrem-novos-segredos-dos-primeiros-cinco-minutos-do-universo/", "fonte_id": "exame", "data_pub": "2026-10-25T04:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Astrônomos realizaram uma medição inédita do hélio primordial com precisão recorde, o que pode ajudar a testar teorias sobre a origem do Universo e as leis fundamentais da física.", "titulo_pt": "Astrônomos descobrem novos segredos dos primeiros cinco minutos do Universo", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 224780, "titulo": "‘Mum, good’: Chinese woman wakes vegetative daughter-in-law after 17 years of care", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3372043/mum-good-chinese-woman-wakes-vegetative-daughter-law-after-17-years-care", "fonte_id": "scmp", "data_pub": "2026-10-25T02:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher no leste da China tem cuidado de sua nuca desde que ela entrou em estado vegetativo em 2009, após ser atingida por um caminhão. A mãe do marido, Xuan Fengying, tem cuidado dela 24 horas por dia há 17 anos.", "titulo_pt": "Mãe, boa! Mulher chinesa acorda nuca vegetativa após 17 anos de cuidados", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 224834, "titulo": "ctDNA clearance and outcomes for resectable lung cancer from NeoCOAST-2", "url": "https://www.nature.com/articles/s41586-026-11328-3", "fonte_id": "nature_news", "data_pub": "2026-10-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo examinou a relação entre a eliminação de ctDNA e os resultados para pacientes com câncer de pulmão resecável provenientes do NeoCOAST-2. Os resultados foram publicados online no Nature em 25 de outubro de 2026.", "titulo_pt": "Eliminação de ctdna e resultados para câncer de pulmão resecável do NeoCOAST-2", "veiculo": "Nature News", "pais": "Reino Unido", "classe": "A"}, {"id": 224835, "titulo": "Who should have a say in which species are saved? The California condor offers lessons for a global biodiversity treaty", "url": "https://phys.org/news/2026-10-species-california-condor-lessons-global.html", "fonte_id": "phys_org", "data_pub": "2026-10-25T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 1987, os biólogos capturaram o último condor livre para colocá-lo em cativeiro, declarando oficialmente a espécie extinta na natureza. Depois de décadas de esforços coordenados e milhões de dólares investidos em programas de reprodução em cativeiro e reintrodução, mais de 300 condores foram restaurados ao seu ambiente natural.", "titulo_pt": "Quem deve decidir sobre as espécies que devem ser preservadas? As lições do condor da califórnia para um tratado global sobre biodiversidade", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223920, "titulo": "Novo estudo indica que corvos tomam decisões mais rápido do que humanos", "url": "https://www.metropoles.com/ciencia/novo-estudo-indica-que-corvos-tomam-decisoes-mais-rapido-do-que-humanos", "fonte_id": "metropoles", "data_pub": "2026-10-24T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo demonstrou que corvos são capazes de tomar decisões mais rapidamente do que humanos em certas tarefas. Durante a experimentação, os corvos indicavam com precisão se um ponto aparecia na esquerda ou na direita da tela.", "titulo_pt": "Novo estudo indica que corvos tomam decisões mais rápido do que humanos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 223924, "titulo": "Estudo mostra avanço em terapias inovadoras para doenças neuroimunológicas", "url": "https://www.metropoles.com/saude/estudo-mostra-avanco-em-terapias-inovadoras-para-doencas-neuroimunologicas", "fonte_id": "metropoles", "data_pub": "2026-10-24T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo demonstrou avanços nas terapias inovadoras para doenças neuroimunológicas. O Ocrevus, um medicamento usado para a esclerose múltipla, resultou em 90% das crianças e adolescentes que o utilizaram ficarem livres de surtos.", "titulo_pt": "Estudo mostra avanço em terapias inovadoras para doenças neuroimunológicas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 224211, "titulo": "Bell pepper colors reveal differences in sweetness, nutrients and ripeness", "url": "https://phys.org/news/2026-10-bell-pepper-reveal-differences-sweetness.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pimentões, também conhecidos como capsicums, pimentões doces ou paprika, originaram-se na América Central e do Sul e pertencem à família das solanáceas, que inclui tomates e berinjelas. As diferentes cores de pimentão revelam diferenças em doçura, nutrientes e grau de madureza.", "titulo_pt": "Cores dos pimentões revelam diferenças em doçura, nutrientes e grau de madureza", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 224212, "titulo": "Tests reveal why titanium additions do not fully prevent pitting corrosion in stainless steel", "url": "https://phys.org/news/2026-10-reveal-titanium-additions-fully-pitting.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A adição de titanio em aço inoxidável não previne completamente a corrosão por pitting em ambientes com íons de cloreto, como a água do mar. As corrosões por pitting geralmente iniciam em pequenas partículas chamadas inclusões, que estão presentes no aço.", "titulo_pt": "Testes revelam por que a adição de titânio não previne completamente a corrosão por pitting no aço inoxidável", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 223978, "titulo": "OVNI? Triângulos pretos misteriosos são avistados sobre área confidencial nos EUA", "url": "https://olhardigital.com.br/2026/10/24/ciencia-e-espaco/ovni-triangulos-pretos-misteriosos-sao-avistados-sobre-area-confidencial-nos-eua/", "fonte_id": "olhar_digital", "data_pub": "2026-10-24T19:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Arquivos do Pentágono relatam um objeto não identificado que cruzou o céu a uma velocidade de quase 3.000 km/h e desapareceu sem deixar rastros. O avistamento ocorreu em uma área confidencial dos Estados Unidos.", "titulo_pt": "OVNI? Triângulos pretos misteriosos são avistados sobre área confidencial nos EUA", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 224213, "titulo": "Single X-ray pulse reveals plasma nanostructures across scales with one camera", "url": "https://phys.org/news/2026-10-ray-pulse-reveals-plasma-nanostructures.html", "fonte_id": "phys_org", "data_pub": "2026-10-24T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A compreensão de instabilidades e turbulência em plasma é um desafio crucial em várias áreas de pesquisa, como fusão nuclear, astrofísica e física de plasma com laser. A turbulência leva a estruturas de diferentes tamanhos que influenciam significativamente o movimento e a fluxo de energia no plasma.", "titulo_pt": "Única câmera captura estruturas nano-plasmáticas em diferentes escalas com uma única onda x", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 224858, "titulo": "Five uncanny venues where guests are treated to frightfully unique interiors", "url": "https://www.dezeen.com/2026/10/25/uncanny-venues-frightful-interiors-lookbooks/", "fonte_id": "dezeen", "data_pub": "2026-10-25T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O lookbook reúne cinco locais com decorações únicas, incluindo partes fictícias do corpo, insetos mortos e equipamentos de matadouro. Entre os projetos selecionados estão um pub de Londres, uma cervejaria em Copenhague e um bar em Xangai.", "titulo_pt": "Cinco locais assombrosos com interiores surpreendentemente únicos", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 224341, "titulo": "Das tumbas do Egito aos quintais brasileiros – A história da bolinha de gude", "url": "https://www.cnnbrasil.com.br/curiosidades/das-tumbas-do-egito-aos-quintais-brasileiros-a-historia-da-bolinha-de-gude/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-25T09:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Arqueólogos descobrem como objetos feitos de pedras e nozes nas civilizações antigas do Egito se transformaram em uma tradição global e em campeonatos internacionais de bolinha de gude.", "titulo_pt": "Das tumbas do Egito aos quintais brasileiros – A história da bolinha de gude", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 224761, "titulo": "Upgrade or eyesore? Why Hong Kong’s Peak light display has hit a snag", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3372069/upgrade-or-eyesore-why-hong-kongs-peak-light-display-has-hit-snag", "fonte_id": "scmp", "data_pub": "2026-10-25T09:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um projeto controverso de iluminação em um caminho de caminhada no Peak está em dúvida devido a reclamações crescentes de que as instalações danificam a beleza natural de Hong Kong. O projeto, planejado para substituir uma antiga apresentação de luzes, foi criticado por moradores e visitantes como ineficaz.", "titulo_pt": "Atualização ou monstro? Por que o projeto de iluminação no Peak de Hong Kong está em dificuldades", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 224465, "titulo": "Zubair Mohajir, el chef que llevó su historia migrante a un restaurante de Chicago: “Planeo envejecer aquí”", "url": "https://www.lanacion.com.ar/estados-unidos/illinois/zubair-mohajir-el-chef-que-llevo-su-historia-migrante-a-un-restaurante-de-chicago-planeo-envejecer-nid25102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-25T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Zubair Mohajir é um chef migrante que abriu o restaurante Muhājir em Chicago. Ele combina recetas históricas com cozinha à lenha no estabe "fonte_id": "guardian_culture", "data_pub": "2026-10-25T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A comediante Katherine Ryan compartilha suas músicas favoritas, incluindo Wannabe dos Spice Girls e canções de Boyz II Men. Ela menciona que 'Material Girl' de Madonna a inspirou a ser como a cantora, e conta que comprou seu primeiro single junto com outros álbuns de Alanis Morissette e TLC.", "titulo_pt": "‘Não sou daquelas que fazem sexo com música. Gosto de silêncio incômodo’: playlist honesta de katherine Ryan", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 224857, "titulo": "Walid Raad’s Way of Working Is Inspired by the Mirrors in Vampire Movies", "url": "https://www.artnews.com/art-in-america/features/walid-raad-icons-venice-biennale-paula-cooper-1234803667/", "fonte_id": "artnews", "data_pub": "2026-10-25T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A obra de Walid Raad no Biênio de Veneza e em outros locais transforma as ausências históricas em obras de arte. Seu modo de trabalhar é inspirado pelos espelhos nos filmes de vampiros.", "titulo_pt": "O modo de trabalho de walid Raad é inspirado pelos espelhos nos filmes de vampiros", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 224763, "titulo": "East Asia’s cultural economies are bridging politics-driven divides", "url": "https://www.scmp.com/opinion/asia-opinion/article/3371868/east-asias-cultural-economies-are-bridging-politics-driven-divides", "fonte_id": "scmp", "data_pub": "2026-10-25T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A presença do cantor K-pop G-Dragon em anúncios eletrônicos de grandes cidades chinesas, apesar do banimento de K-pop por Pequim, ilustra a contradição entre as sombras políticas que afetam as relações internacionais e os vínculos comerciais reais na Ásia Oriental. Embora existam tensões devido à aliança militar de Seul com os Estados Unidos, G-Dragon se tornou uma figura de destaque em produtos McDonald's em mais de 8.000 lojas na China continental.", "titulo_pt": "Economias culturais da ásia oriental estão superando divisões políticas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 224785, "titulo": "Jamsu Bridge hosts a 400-meter fried chicken feast", "url": "https://www.koreaherald.com/article/10913987", "fonte_id": "korea_herald", "data_pub": "2026-10-25T08:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em Seul, Coreia do Sul, o governo local realizou um festival de frango frito em uma mesa de 400 metros na Jamsu Bridge, antes de transformar o local em uma passarela pedestre. O evento, parte da Car-Free Jamsu Bridge Ttubeok-Ttubeok Festival, incluiu duas sessões de degustação de frango frito.", "titulo_pt": "Jamsu Bridge sediará festa de frango frito de 400 metros", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 224787, "titulo": "Sparks of tradition", "url": "https://www.koreaherald.com/article/10913985", "fonte_id": "korea_herald", "data_pub": "2026-10-25T08:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Visitas foram realizadas durante o Festival Yeoju Ogoknaru em Yeogang Wharf, próximo à Silleuksa, onde um espetáculo tradicional chamado 'nakhwa' foi exibido. O festival incluiu produtos agrícolas locais, food trucks, apresentações e atividades inspiradas nas tradições do período Joseon.", "titulo_pt": "Chamas de tradição", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 224493, "titulo": "Ministério da Cultura para quê?", "url": "https://www.jota.info/opiniao-e-analise/artigos/ministerio-da-cultura-para-que", "fonte_id": "jota", "data_pub": "2026-10-25T08:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute o papel e o tamanho do Ministério da Cultura, baseando-se na história recente, no turismo e na ocupação dos hotéis.", "titulo_pt": "Ministério da Cultura para quê?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 224351, "titulo": "Clubes de leitura crescem nas redes e impulsionam a leitura no Brasil", "url": "https://www.cnnbrasil.com.br/pop/clubes-de-leitura-crescem-nas-redes-e-impulsionam-a-leitura-no-brasil/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-25T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As atividades de clubes de leitura nas redes sociais têm se expandido no Brasil, incentivando a leitura. Os participantes dessas iniciativas leem, em média, uma obra por mês, enquanto a leitura nacional média é de 3,96 livros ao ano.", "titulo_pt": "Clubes de leitura nas redes sociais crescem no Brasil e estimulam a leitura", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 224852, "titulo": "‘I can’t believe I get to see that’: One Born Every Minute is back for a 12th series", "url": "https://www.theguardian.com/tv-and-radio/2026/oct/25/i-cant-believe-i-get-to-see-that-one-born-every-minute-is-back-for-a-12th-series", "fonte_id": "guardian_culture", "data_pub": "2026-10-25T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "One Born Every Minute retorna para sua 12ª temporada, focando em partos, diversidade e compartilhamento de histórias em uma era de redes sociais. O programa, que estreou em 2010, agora aborda mais questões como perdas de gestação, infertilidade e saúde mental.", "titulo_pt": "Não posso acreditar que eu consigo ver isso: one Born Every Minute retorna para uma 12ª temporada", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 224475, "titulo": "El exilio no debe silenciar al periodismo", "url": "https://www.lanacion.com.ar/opinion/el-exilio-no-debe-silenciar-al-periodismo-nid25102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-25T07:25:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Sociedade Interamericana de Prensa destac s", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 224080, "titulo": "Autoridad Marítima controla derrame en Papudo y descarta afectación al medio marino", "url": "https://www.latercera.com/nacional/noticia/autoridad-maritima-controla-derrame-en-papudo-y-descarta-afectacion-al-medio-marino/", "fonte_id": "la_tercera", "data_pub": "2026-10-24T19:05:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Autoridade Marítima controlou um derrame em Papudo após uma patrulla verificar as condições do local neste sábado. O incidente ocorreu após a derrama de uma substância de aproximadamente 20 litros no dia anterior.", "titulo_pt": "Autoridade Marítima controla derrame em Papudo e descarta impacto no meio marinho", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 223297, "titulo": "Com alerta para El Niño, SP amplia ações contra enchentes e secas com R$ 1,19 bilhão", "url": "https://exame.com/esg/com-alerta-para-el-nino-sp-amplia-acoes-contra-enchentes-e-secas-com-r-119-bilhao/", "fonte_id": "exame", "data_pub": "2026-10-24T12:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estado de São Paulo ampliou suas ações contra enchentes e secas com investimentos de R$ 1,19 bilhão. A estratégia inclui medidas para enfrentar temporais, estiagens, ondas de calor e incêndios florestais, além de uma carteira de investimentos de R$ 29 bilhões até 2029.", "titulo_pt": "Com alerta para El Niño, SP amplia ações contra enchentes e secas com R$ 1,19 bilhão", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 223483, "titulo": "A truck full of cows crashed in Kansas City. It reveals a bigger everyday horror.", "url": "https://www.vox.com/future-perfect/507513/kansas-city-cattle-truck-crash-livestock-transport", "fonte_id": "vox", "data_pub": "2026-10-24T11:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vídeos de rebanhos de novilhos correndo pelas ruas de Kansas City se tornaram uma hist
