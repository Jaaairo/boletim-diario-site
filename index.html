<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<nav id="nav"></nav>
<main id="main"></main>

</div>

<script>
const D = {"gerado_em": "15/11/2026 07:21", "stats": {"noticias_novas": 552, "resumos_gerados": 215}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O governo Lula apresentou um projeto para controlar supersalários, que pode ajudar no ajuste fiscal. O Senado aprovou o Programa Empresa Rosa, que oferece benefícios para empresas que contratam mulheres sobreviventes do câncer de mama, além de garantir flexibilidade no regime de trabalho para elas. Em 2025, o Brasil registrou um superavit de R$ 18 bilhões com a exportação de 9 minerais críticos prioritários, com a balança comercial para cobre, níquel e silício sendo favorável. Durante uma declaração nas Filipinas, o presidente Lula enfatizou a importância das relações comerciais com países asiáticos, destacando a busca por alternativas frente às tarifas impostas pelos Estados Unidos. Com a posse, alternativas de hospedagem como escolas, campings e moradores locais estão sendo oferecidas no Distrito Federal, devido às diárias elevadas dos hotéis. Além disso, o Supremo Tribunal Federal, o Superior Tribunal de Justiça e o Tribunal Superior do Trabalho têm contratos no valor de R$ 10 milhões para o fornecimento de iPhones, serviços telefônicos e franquia de internet.", "mundo": "Líderes globais se reúnem em várias partes da Ásia esta semana, com destaque para a APEC em Shenzhen, na China, onde o presidente dos Estados Unidos, Donald Trump, participará. O encontro ocorre no contexto do confronto de influência entre China e Estados Unidos. Em outro destaque, o Papa Francisco visitou a cidade remota de Santa Cruz de Sucre, no Equador, refletindo suas preocupações com a comunidade local. No entanto, a maior parte do foco está nas tensões internacionais e nos esforços para avançar em questões cruciais. A COP31, sem a presença dos Estados Unidos, enfrenta pressões para maior ambicionamento climático, enquanto a Austrália e as Filipinas aprimoram suas relações de defesa, focando em melhorias na infraestrutura militar e na troca de informações marítimas. Além disso, a rejeição dos Estados Unidos à guerra na Irã e o estabelecimento de um entendimento com o governo venezuelano formam parte da estratégia americana em direção a Cuba.\n\nOs líderes dos Estados Unidos, China e Rússia planejam se reunir durante a cúpula da APEC em Shenzhen, na China, em uma reunião inédita entre os chefes de estado das três maiores potências nucleares do mundo. No entanto, analistas esperam que as discussões não levem a grandes avanços e sejam mais simbólicas do que substantivas. A reunião, se ocorrer conforme planejado, será realizada fora da cimeira APEC na próxima semana. Além disso, Israel tem devastado o meio ambiente da Palestina mais do que qualquer outro agente, apesar das tentativas de se apresentar como ecologicamente correta, segundo denúncias recentes. Além disso, a Índia tirou um número recorde de cidadãos da pobreza, mas milhões deles ainda vivem na linha da pobreza, conforme informou a World Bank.", "economia": "A semana em Wall Street será marcada pelos resultados da Nvidia e pelo IPO da Anthropic, gerando expectativa no mercado americano. A empresa de computação em nuvem Megaspeed está sendo investigada internamente após relatos envolvendo seu ex-executivo Alice Huang. No cenário mais amplo, a economia enfrenta desafios como a alta do preço do tomate, devido às chuvas e doenças nas lavouras, a possível mudança na jornada de trabalho dos ônibus urbanos sem acordo ou regulamentação, e a crescente importância da governança nos fundos de pensão. As fusões e aquisições cresceram 16% em valor até setembro, totalizando R$ 254 bilhões, mas a perspectiva de juros elevados deve acelerar a venda de ativos. A reforma tributária, que entrará em vigor em 2027, representa uma mudança significativa no sistema fiscal brasileiro, similar aos grandes pacotes econômicos dos anos 1980 e 1990, e o Brasil enfrenta desafios econômicos como a falta de um plano unificado de desenvolvimento econômico.", "tecnologia": "A SpaceX conseguiu recuperar com sucesso sua nave Starship após uma missão em órbita, utilizando os braços mecânicos da torre de lançamento Mechazilla. Este feito marca um importante passo para a reutilização de foguetes e abre novas perspectivas para a indústria espacial. Em outro desenvolvimento, a Coreia do Sul investiga um candidato que confessou ter usado inteligência artificial para fraudar o exame nacional de contabilidade fiscal, o que levanta preocupações sobre a implementação consciente da tecnologia. Além disso, a China atualizou sua série de tanques VT-4 com tecnologias de ponta, com foco no mercado internacional, enquanto a Nvidia enfrenta incertezas, tendo Jensen Huang como seu CEO, que teve um papel fundamental no desenvolvimento da empresa no campo da inteligência artificial.", "ciencia": "A Voyager 1, uma sonda espacial da NASA, está prestes a se tornar o primeiro objeto humano a atingir uma distância de um dia-luz da Terra, marcando um importante avanço na missão interestelar mais longeva da história. Em outro avanço tecnológico, cientistas descobriram como usar impulsos de luz laser para organizar pequenas regiões elétricas dentro de um cristal, resolvendo um mistério de décadas sobre o comportamento do material. Este avanço pode abrir caminhos para novas formas de processamento e armazenamento de informações. Na Terra, estudos sobre a relação entre um jumento e um touro em um planalto etíope revelaram insights sobre a sexualidade, enquanto pesquisas sobre o Lago Baikal na Sibéria mostraram que o maior lago de água doce do mundo está se recuperando após décadas de declínio. Além disso, estudos sobre Alzheimer's e o comportamento dos gatos sugerem novas abordagens para tratamentos e compreensão do comportamento animal.", "cultura": "O evento mais importante dos artigos é a premiação dos ARTnews Awards 2026, que reconheceu several artistas e exposições. Coco Klockner foi escolhida como Artista Emergente do Ano para 2026, com a exposição 'In Practice: Coco Klockner' no SculptureCenter em Nova York. Theresa Hak Kyung Cha recebeu o prêmio de Artista Histórica do Ano, com a exposição 'Theresa Hak Kyung Cha: Multiple Offerings' no Museu de Berkeley e no Arquivo de Cinema Pacific Film Archive. Maren Hassinger foi premiada com o prêmio de Lifetime Achievement, com a exposição 'Maren Hassinger: Living Moving Growing' no Berkeley Art Museum and Pacific Film Archive. A melhor mostra coletiva de galeria foi a exposição 'Horror', curada por Jill Mulleady, e a melhor exposição temática foi 'MONUMENTS', realizada no The Geffen Contemporary at MOCA e no The Brick, em Los Angeles. A artista Vaginal Davis exibiu a instalação 'Magnífico Produto' no MoMA PS1, em Nova York, recebendo o prêmio de Artista Estabelecida do Ano. O júri para o terceiro ano dos ARTnews Awards incluiu Giampaolo Bianconi, Jordan Carter, Lauren Cornell, Miranda Lash e Diana Nawi. Além disso, o Folha Gourmet Festival no parque Villa-Lobos contou com apresentações de Wilson Simoninha, Alex Atala e Arthur Paek, e Paula Lima apresentou hits de Tim Maia e Rita Lee, encantando o público com samba, soul e clássicos da música brasileira. No Peru, o Papa Leão XIV continua sua visita, com encontros com fiéis e missionários em Cusco, e uma oração na praça da Basílica Catedral de Lima. No Brasil, o grupo Los Tres celebrou os 30 anos do álbum MTV Unplugged com um show no Santander Arena, incluindo músicas do álbum original e algumas de seus trabalhos posteriores, com a participação de intérpretes convidados como Inti Illimani e John Denton. A crítica de Zé Felipe aos fãs de BTS, conhecidos como armys, chamou-os de 'venenosos', criticando o comportamento desses fãs em uma declaração que não se refere diretamente ao seu próprio público.", "sociedade": "Milhares de pessoas em Portugal protestam contra os aumentos nos alugueis, em um contexto de crise habitacional que tem levado dezenas de milhares de pessoas a se manifestarem em mais de 30 cidades. Em Santiago do Chile, 55% dos jovens entre 18 e 34 anos considerariam migrar para Santiago em busca de emprego, refletindo preocupações sobre as oportunidades locais. Na França, os jovens enfrentam desafios como a alta do custo de vida e empregos precários. O Brasil pode ver um aumento de 44% no número de adultos com diabetes até 2050, de acordo com dados da International Diabetes Federation. Além disso, a paróquia de Arauco, no Chile, divide a região do Biobío entre a necessidade de aumento da segurança e a preferência por diálogos. Uma fábrica localizada no Entorno do Distrito Federal é alvo de críticas por causar problemas ambientais e sonoros. Em Goiás, o Ministério Público está avaliando a possibilidade de interditar a fábrica.", "meio_ambiente": "Em encontro com o presidente Lula, o ex-banqueiro Mark Carney prometeu US$ 400 milhões para a proteção de florestas durante a cúpula da ASEAN nas Filipinas. A ação visa fortalecer a preservação ambiental, especialmente em regiões críticas como o Amazonas, onde 39 cidades estão sob alerta para a qualidade do ar devido à estiagem. Parintins foi classificada como a pior dessas cidades. No Ceará, 65 cidades decretaram situação de emergência devido ao risco de seca associado ao El Niño, enquanto o Chile se prepara para um verão extremo com alto risco de incêndios. Em 2026, eventos climáticos extremos afetaram todo o mundo, com mais de 100.000 mortes devidas a secas, incêndios e inundações, reforçando a urgência de ações para reduzir as emissões de gases de efeito estufa. Além disso, a COP31 em Antalya, Turquia, destacou a importância da transição energética como elemento central para a economia, enquanto o México construiu uma parede de 18 km em Parque del Jaguar para proteger jaguares e preservar a biodiversidade local.", "direitos_humanos": "Três homens foram condenados à morte por enforcamento na Jordânia após um ataque a uma igreja em Karak que resultou na morte de nove pessoas. Na Malásia, a comunidade de refugiados expressou esperança com o plano do governo de permitir que refugiados trabalhem legalmente, mas alertou para a necessidade de procedimentos claros de registro e proteções no ambiente de trabalho. Em uma residência para idosos na Tailândia, denunciam-se condições deploráveis com residentes mantidos em gaiolas metálicas, acusando-se o lar de manter dezenas de pessoas em tal situação. Um comissário foi preso por matar um sargento durante uma operação policial em Buenos Aires, Argentina, levantando questões sobre a violência policial. Na França, cinco jovens que testemunharam um espancamento de um homem negro por policiais em 2020 se juntaram à ação judicial, denunciando a violência policial e o trauma sofrido. A política de detenção de imigrantes de Donald Trump sobrecarrega os tribunais dos Estados Unidos, com entidades de direitos humanos criticando o desvio de recursos públicos para defender prisões consideradas ilegais. Em Gaza, uma menina de 6 anos, Masa Yassin, precisa de um novo protetor facial para controlar as cicatrizes de queimaduras, mas enfrenta obstáculos devido a disputas israelenses sobre a importação de material necessário para o tratamento."}, "resumo_do_dia": {"politica_nacional": [{"id": 265015, "titulo": "Governo Lula tem projeto para conter supersalários engatilhado para ir ao Congresso", "url": "https://www.jota.info/executivo/governo-lula-tem-projeto-para-conter-supersalarios-engatilhado-para-ir-ao-congresso", "fonte_id": "jota", "data_pub": "2026-11-15T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula apresentou um projeto para conter supersalários, que pode auxiliar no esforço de ajuste fiscal. As definições finais ainda dependem da aprovação do presidente Lula.", "titulo_pt": "Governo Lula apresenta projeto para conter supersalários", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 264869, "titulo": "Senado aprova incentivo à contratação de mulheres com câncer de mama", "url": "https://www.poder360.com.br/?p=2638012", "fonte_id": "poder360", "data_pub": "2026-11-15T09:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou um projeto que cria o Programa Empresa Rosa, oferecendo benefícios para empresas que contratam mulheres sobreviventes do câncer de mama, além de garantir flexibilidade no regime de trabalho para elas.", "titulo_pt": "Senado aprova incentivo à contratação de mulheres sobreviventes de câncer de mama", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 264870, "titulo": "Comissão aprova diretrizes para ampliar cirurgias bariátricas no SUS", "url": "https://www.poder360.com.br/poder-congresso/comissao-aprova-diretrizes-para-ampliar-cirurgias-bariatricas-no-sus/", "fonte_id": "poder360", "data_pub": "2026-11-15T09:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A comissão aprovou diretrizes para ampliar as cirurgias bariátricas no SUS, visando reduzir o tempo de espera e permitir que a rede privada complementar os serviços.", "titulo_pt": "Comissão aprova diretrizes para ampliar cirurgias bariátricas no SUS", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 265016, "titulo": "STJ nega crédito de PIS/Cofins em pagamento a pessoa física com intermediário", "url": "https://www.jota.info/tributos/stj-nega-credito-de-pis-cofins-em-pagamento-a-pessoa-fisica-com-intermediario", "fonte_id": "jota", "data_pub": "2026-11-15T09:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Superior Tribunal de Justiça negou o crédito de PIS/Cofins em um pagamento feito a uma pessoa física por meio de um intermediário. Os ministros decidiram que, mesmo havendo uma interposição, o crédito não é permitido porque o pagamento é direcionado a uma pessoa física.", "titulo_pt": "STJ nega crédito de PIS/Cofins em pagamento a pessoa física por intermédio", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 264871, "titulo": "Infrações no inquérito das fake news não podem ser esquecidas, diz Amin", "url": "https://www.poder360.com.br/poder-congresso/infracoes-no-inquerito-das-fake-news-nao-podem-ser-esquecidas-diz-amin/", "fonte_id": "poder360", "data_pub": "2026-11-15T09:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Amin afirma que as infrações identificadas no inquérito das fake news não devem ser esquecidas, mesmo com o fim da investigação. Ele destaca que o término do procedimento não anula as irregularidades constatadas durante os 7 anos e 8 meses de investigação.", "titulo_pt": "Infrações no inquérito das fake news não podem ser esquecidas, diz Amin", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 264839, "titulo": "Emendas de Cleitinho bancaram show de Claudia Leitte e festa de prefeitura em MG", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/11/emendas-de-cleitinho-bancaram-show-de-claudia-leitte-e-festa-de-prefeitura-em-mg.shtml", "fonte_id": "folha_poder", "data_pub": "2026-11-15T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador eleito de Minas Gerais, Cleitinho Azevedo, criticou o uso de verbas do estado para eventos em cidades do interior, mas destinou R$ 1,34 milhão em emendas para custear festas durante seu mandato no Senado.", "titulo_pt": "Emendas de Cleitinho bancaram show de Claudia Leitte e festa de prefeitura em MG", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 264872, "titulo": "Brasil tem superavit de R$ 18 bi nos 9 minerais críticos prioritários", "url": "https://www.poder360.com.br/poder-economia/brasil-tem-superavit-de-r-18-bi-nos-9-minerais-criticos-prioritarios/", "fonte_id": "poder360", "data_pub": "2026-11-15T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil registrou um superavit de R$ 18 bilhões em 2025 com a exportação de 9 minerais críticos prioritários. A balança comercial para cobre, níquel e silício foi favorável, mas outros seis minerais apresentaram déficit.", "titulo_pt": "Brasil tem superavit de R$ 18 bi nos 9 minerais críticos prioritários", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 264873, "titulo": "Professores de jornalismo estão sobrecarregados com notícias locais", "url": "https://www.poder360.com.br/nieman/professores-de-jornalismo-estao-sobrecarregados-com-noticias-locais/", "fonte_id": "poder360", "data_pub": "2026-11-15T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo destaca que professores de jornalismo enfrentam uma sobrecarga de trabalho, pois estão envolvidos na edição de reportagens de alunos e na coordenação de parcerias com veículos regionais.", "titulo_pt": "Professores de jornalismo lidam com sobrecarga de trabalho", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 264939, "titulo": "Comunidades apontam interferência de empresários para barrar criação de reserva na capital do Maranhão", "url": "https://www.brasildefato.com.br/2026/11/15/comunidades-apontam-interferencia-de-empresarios-para-barrar-criacao-de-reserva-na-capital-do-maranhao/", "fonte_id": "brasil_de_fato", "data_pub": "2026-11-15T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma associação de uma comunidade tradicional da ilha de Tauá-Mirim, em São Luís (MA), moveu uma ação civil pública em maio deste ano para impedir a criação de uma Reserva Extrativista (Resex) na ilha. A Resex prevê a preservação da ilha e o uso sustentável dos recursos naturais, mas a ação visa barrar sua implementação.", "titulo_pt": "Comunidades movem ação para barrar criação de reserva extrativista na ilha de tauá-mirim, em são luís", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 264879, "titulo": "PT e PL encaram mesmo drama com militância irritada", "url": "https://www.metropoles.com/colunas/igor-gadelha/pt-e-pl-encaram-mesmo-drama-com-militancia-irritada", "fonte_id": "metropoles", "data_pub": "2026-11-15T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Oposição política, PT e PL enfrentam situações semelhantes de descontentamento entre seus membros, que reagem negativamente a decisões pragmáticas tomadas pelo Executivo e pela Câmara.", "titulo_pt": "PT e PL enfrentam drama com militância descontente", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 264903, "titulo": "Economistas e entidades da sociedade civil defendem PL das big techs", "url": "https://www.cnnbrasil.com.br/politica/economistas-e-entidades-da-sociedade-civil-defendem-pl-das-big-techs/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Economistas e organizações da sociedade civil estão se manifestando em favor do Projeto de Lei das big techs antes da votação na Câmara dos Deputados, prevista para terça-feira (17). O projeto visa regular mercados digitais e expandir os poderes do Conselho Administrativo de Defesa Econômica (Cade).", "titulo_pt": "Economistas e entidades da sociedade civil defendem PL das big techs", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 264885, "titulo": "Bye, bye, Flávio Bolsonaro. Sua carreira acabou", "url": "https://www.metropoles.com/blog-do-noblat/ricardo-noblat/bye-bye-flavio-bolsonaro-sua-carreira-acabou", "fonte_id": "metropoles", "data_pub": "2026-11-15T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto sugere que Flávio Bolsonaro saiu de uma situação e que apenas ele mesmo sabe os detalhes exatos do que aconteceu e as razões para sua fuga.", "titulo_pt": "Adeus, Flávio Bolsonaro. Sua carreira acabou", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 264906, "titulo": "Após parecer da PGR, Kassio deve levar revisão de Bolsonaro ao plenário", "url": "https://www.cnnbrasil.com.br/politica/apos-parecer-da-pgr-kassio-deve-levar-revisao-de-bolsonaro-ao-plenario/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Procurador-Geral da República está contra a admissão do pedido de revisão do julgamento do ex-presidente Bolsonaro pelo Tribunal Superior Eleitoral (TSE). O principal argumento da defesa de Bolsonaro após a derrota de Flávio Bolsonaro nas eleições foi a revisão desse julgamento.", "titulo_pt": "Após parecer da PGR, Kassio deve levar revisão de Bolsonaro ao plenário", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 264907, "titulo": "Lula sobre tarifaço: “Em vez chorar, a gente procurou outros parceiros”", "url": "https://www.cnnbrasil.com.br/internacional/lula-sobre-tarifaco-em-vez-chorar-a-gente-procurou-outros-parceiros/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T07:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Lula, durante uma declaração nas Filipinas, enfatizou a importância das relações comerciais com países asiáticos como uma alternativa frente às tarifas impostas pelos Estados Unidos.", "titulo_pt": "Lula sobre tarifaço: 'em vez de chorar, a gente procurou outros parceiros'", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 264886, "titulo": "De escolas a campings: posse de Lula altera lógica de hospedagens no DF", "url": "https://www.metropoles.com/distrito-federal/de-escolas-a-campings-posse-de-lula-altera-logica-de-hospedagens-no-df", "fonte_id": "metropoles", "data_pub": "2026-11-15T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Com a posse de Lula, alternativas de hospedagem como escolas, campings e moradores locais no Distrito Federal estão sendo oferecidas, devido às diárias elevadas dos hotéis, que podem chegar a mais de R$ 25 mil.", "titulo_pt": "De escolas a campings: alternativas de hospedagem surgem para a posse de Lula no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 264887, "titulo": "Após quase 7 anos, Neymar é intimado a responder à AGU sobre indenização", "url": "https://www.metropoles.com/colunas/manoela-alcantara/apos-quase-7-anos-neymar-e-intimado-a-responder-a-agu-sobre-indenizacao", "fonte_id": "metropoles", "data_pub": "2026-11-15T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Neymar e empresas da família têm 15 dias para responder à AGU sobre uma indenização relacionada ao vazamento de dados fiscais. A União busca reverter essas indenizações.", "titulo_pt": "Após quase 7 anos, Neymar é intimado a responder à AGU sobre indenização", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 265155, "titulo": "Pope Leo speaks of community 'suffering' on visit to remote Andes town", "url": "https://www.bbc.co.uk/news/articles/cr4gnz0lv2vlo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-15T09:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Papa Leão visitou a cidade remota de Santa Cruz de Succhabamba, que faz parte da Diocese de Chiclayo, onde ele serviu como bispo de 2015 a 2023.", "titulo_pt": "Papa leão fala sobre 'sofrimento' da comunidade durante visita a cidade remota dos Andes", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 265187, "titulo": "Protesters condemn US policies as ASEAN summit begins in Manila", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/15/protesters-condemn-us-policies-as-asean-summit-begins-in-manila?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-15T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Líderes da ASEAN chegaram à Filipinas para a cúpula, encontrando-se com protestos. Os manifestantes condenam as políticas dos EUA.", "titulo_pt": "Protestos denunciam políticas dos EUA durante cúpula da ASEAN em Manila", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 265171, "titulo": "SpaceX makes rocketry history by recapturing massive reusable rocketship", "url": "https://www.france24.com/en/spacex-makes-rocketry-history-by-recapturing-massive-reusable-rocketship", "fonte_id": "france24", "data_pub": "2026-11-15T09:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "SpaceX conseguiu recapturar pela primeira vez seu foguete Starship, após um fracasso no tentar capturá-lo no dia anterior. O modelo Starship é maior e mais avançado do que os modelos anteriores, que, embora tenham conseguido pousar com sucesso, eram menos completos em sua reutilização.", "titulo_pt": "Spacex faz história ao recapturar foguete starship reutilizável", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 265188, "titulo": "Iran says it targets US radar in Bahrain. What do we know?", "url": "https://www.aljazeera.com/news/2026/11/15/iran-says-it-targets-us-radar-in-bahrain-what-do-we-know?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-15T09:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Força Defensiva de Bahrein afirma que seus sistemas de defesa aérea derrotaram várias supostas 'ataques aéreos' atribuídos à Irã. O Irã afirma ter alvo de radares americanos em Bahrein.", "titulo_pt": "Irã diz que alvo de radares americanos e 9:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A última estratégia dos Estados Unidos, após o rejeitarem a guerra na Irã e estabelecerem um entendimento com o governo venezuelano, é Cuba.", "titulo_pt": "Cuba no fim de Trump", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 265067, "titulo": "Guardianes del río Atrato: un referente internacional en la protección de los derechos de la naturaleza", "url": "https://elpais.com/america-colombia/2026-11-15/guardianes-del-rio-atrato-un-referente-internacional-en-la-proteccion-de-los-derechos-de-la-naturaleza.html", "fonte_id": "elpais_america", "data_pub": "2026-11-15T09:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Cuerpo Colegiado de Guardianes do Rio Atrato da Colômbia foi premiado este ano com o Prêmio Rafto de Direitos Humanos na cidade de Bergen, Noruega, por sua luta pela defesa do meio ambiente e dos direitos humanos.", "titulo_pt": "Guardiões do rio Atrato: um referente internacional na proteção dos direitos da natureza", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 265157, "titulo": "Fifth Canadian soldier dies from injuries caused by large fire at military base", "url": "https://www.bbc.co.uk/news/articles/cmrlgn4x2xw8o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-11-15T09:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um soldado canadense, Pte William Douglas Dal Bianco, faleceu devido às suas ferimentos em 28 de fevereiro, um mês após um incêndio em uma base militar em Wainwright.", "titulo_pt": "Quinto soldado canadense morre de ferimentos causados por incêndio em base militar", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 265189, "titulo": "What forced the US to ground all planes? A router switch, we now know", "url": "https://www.aljazeera.com/news/2026/11/15/what-forced-the-us-to-ground-all-planes-a-router-switch-we-now-know?tr f-poverty-since-2011-why-doesnt-it-feel-so?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-15T08:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A World Bank informou que a Índia tirou um número recorde de cidadãos da pobreza, mas milhões deles ainda vivem na margem da linha da pobreza.", "titulo_pt": "Índia tirou 500 milhões de pessoas da pobreza, mas muitos ainda sobrevivem precariamente", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 265184, "titulo": "Megaspeed says Alice Huang left in 2025 as it launches internal probe into reports about its business", "url": "https://www.cnbc.com/2026/11/15/megaspeed-alice-huang-probe-nvidia-scandal.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-15T08:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de computação na nuvem Megaspeed, sediada em Singapura, está sendo investigada internamente após relatos que ligam o executivo anterior Alice Huang ao executivo da Nvidia Jensen Huang. A saída de Alice Huang da empresa ocorreu em 2025.", "titulo_pt": "Megaspeed afirma que Alice Huang deixou em 2025 enquanto a empresa lança uma investigação interna sobre relatos sobre seu negócio", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 264902, "titulo": "Resultados da Nvidia e IPO da Anthropic devem marcar semana em Wall Street", "url": "https://www.cnnbrasil.com.br/economia/money/mercado/resultados-da-nvidia-e-ipo-da-anthropic-devem-marcar-semana-em-wall-street/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nvidia apresentará os resultados do 3º trimestre e o IPO da Anthropic está previsto para a próxima semana, gerando expectativa no mercado americano. Após a saída de Jensen Huang da Nvidia, a atenção está voltada para esses eventos.", "titulo_pt": "Resultados da Nvidia e IPO da Anthropic devem marcar semana em Wall Street", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 264933, "titulo": "O emprego que os millennials evitam por ser “chato” pode pagar até US$ 200 mil", "url": "https://www.infomoney.com.br/business/global/o-emprego-que-os-millennials-evitam-por-ser-chato-pode-pagar-ate-us-200-mil/", "fonte_id": "infomoney", "data_pub": "2026-11-15T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Segundo o Índice de Contratações Sazonais 2026 da Monster, contadores e especialistas tributários estavam entre os 13 cargos com maior atividade sazonal. Este trabalho, que os millennials frequentemente evitam, pode render até US$ 200 mil.", "titulo_pt": "O emprego que os millennials evitam por ser ‘chato’ pode pagar até r$ 650 mil", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 264935, "titulo": "Executivos encaram difícil escolha sobre gastos com IA à medida que os custos crescem", "url": "https://www.infomoney.com.br/business/global/executivos-encaram-dificil-escolha-sobre-gastos-com-ia-a-medida-que-os-custos-crescem/", "fonte_id": "infomoney", "data_pub": "2026-11-15T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Executivos enfrentam uma escolha difícil em relação aos gastos com inteligência artificial (IA) à medida que os custos aumentam. Um professor da Universidade de Boston, Mark Williams, afirma que o ambiente de financiamento mais difícil levará a um escrutínio maior das decisões de investimento.", "titulo_pt": "Executivos enfrentam escolha difícil sobre gastos com IA diante do aumento dos custos", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 264936, "titulo": "Casas de tijolos estão sumindo das novas construções nos EUA", "url": "https://www.infomoney.com.br/business/global/casas-de-tijolos-estao-sumindo-das-novas-construcoes-nos-eua/", "fonte_id": "infomoney", "data_pub": "2026-11-15T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As casas construídas com tijolo representaram apenas 16,8% das novas casas unifamiliares em 2025, contra 24% em 2012. A Associação Nacional de Construtores de Imóveis realizou a análise.", "titulo_pt": "Casas de tijolo estão diminuindo nas novas construções nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 264881, "titulo": "Por que o tomate ficou tão caro? Entenda alta e veja quando preço deve cair", "url": "https://www.metropoles.com/brasil/por-que-o-tomate-ficou-tao-caro-entenda-alta-e-veja-quando-preco-deve-cair", "fonte_id": "metropoles", "data_pub": "2026-11-15T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As chuvas, o fenômeno El Niño e doenças nas lavouras reduziram a oferta de tomates, levando à alta nos preços. O especialista explica as causas da elevação e estima quando o preço pode diminuir.", "titulo_pt": "Por que o tomate ficou tão caro? Entenda a alta e veja quando o preço deve cair", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 264905, "titulo": "M&A sobe 16% em valor, diz estudo; juro alto deve acelerar venda de ativos", "url": "https://www.cnnbrasil.com.br/economia/money/negocios/m-juro-alto-deve-acelerar-venda-de-ativos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-15T07:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As fusões e aquisições cresceram 16% em valor até setembro, totalizando R$ 254 bilhões. A perspectiva de juros elevados por mais tempo deve acelerar a venda de ativos.", "titulo_pt": "Fusões e aquisições sobem 16% em valor, diz estudo; juros altos devem acelerar venda de ativos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 264824, "titulo": "Sem acordo nem regulamentação, mudança na jornada deixa futuro da frota de ônibus indefinido", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/sem-acordo-nem-regulamentacao-mudanca-na-jornada-deixa-futuro-da-frota-de-onibus-indefinido.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-15T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O futuro da frota de ônibus urbanos está incerto, pois não há acordo ou regulamentação sobre as mudanças com o fim da escala 6x1. As empresas precisam contratar, mas não se sabe exatamente quantas pessoas serão necessárias.", "titulo_pt": "Sem acordo nem regulamentação, futuro da frota de ônibus urbanos fica incerto", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 265018, "titulo": "A reclamação no regime de relevância (Parte II): como o RISTJ esvaziou a promessa da lei", "url": "https://www.jota.info/opiniao-e-analise/artigos/a-reclamacao-no-regime-de-relevancia-parte-ii-como-o-ristj-esvaziou-a-promessa-da-lei", "fonte_id": "jota", "data_pub": "2026-11-15T06:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto discute a aplicação da reclamação no regime de relevância, destacando a necessidade de equilíbrio entre sua utilização e a prevenção de litígios injustificados.", "titulo_pt": "A reclamação no regime de relevância (Parte II): como o RISTJ esvaziou a promessa da lei", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 264925, "titulo": "Como negociar um aumento salarial com base em geração de valor real", "url": "https://exame.com/inteligencia-artificial/como-negociar-um-aumento-salarial-com-base-em-geracao-de-valor-real/", "fonte_id": "exame", "data_pub": "2026-11-15T06:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A negociação de um aumento salarial pode ser fortalecida através da apresentação de resultados mensuráveis, do conhecimento do negócio e da preparação adequada para a conversa.", "titulo_pt": "Como negociar um aumento salarial com base em geração de valor real", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 264926, "titulo": "Governança: o ativo de negócio que pode definir o futuro dos fundos de pensão", "url": "https://exame.com/exame-in/governanca-o-ativo-de-negocio-que-pode-definir-o-futuro-dos-fundos-de-pensao/", "fonte_id": "exame", "data_pub": "2026-11-15T06:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governança é mais do que uma exigência regulatória, ela fortalece a confiança e a capacidade dos fundos de pensão de atrair patrocinadores e participantes.", "titulo_pt": "Governança: o ativo de negócio que pode definir o futuro dos fundos de pensão", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 265186, "titulo": "Could Budapest be the next digital nomad hotspot?", "url": "https://www.cnbc.com/2026/11/15/budapest-europes-next-digital-nomad-hotspot.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-15T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Budapeste, com sua mistura de atrações, cafés e cultura, tem se tornado populosa entre os que adotam a tendência de trabalhar de qualquer lugar.", "titulo_pt": "Poderia budapeste ser o próximo destino quente para digital nomades?", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 265019, "titulo": "Episódio final da série Taxas da Suframa", "url": "https://www.jota.info/opiniao-e-analise/artigos/episodio-final-da-serie-taxas-da-suframa", "fonte_id": "jota", "data_pub": "2026-11-15T05:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Supremo Tribunal de Justiça (STJ) confirmou a legalidade da Taxa Compensatória de Integração Fiscal (TCIF) após três temporadas de discussão. Este foi o episódio final da série Taxas da Suframa.", "titulo_pt": "Episódio final da série Taxas da Suframa: stj confirma legalidade da tcif", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 265229, "titulo": "Data centre construction stocks lose $4.2tn as boom in AI trade unravels", "url": "https://www.ft.com/content/d5adde7e-68cc-455b-ba78-b39cc3676b7a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-15T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações das empresas de construção de centros de dados para inteligência artificial sofreram uma perda de 4,2 trilhões de dólares, em meio a uma desaceleração na demanda por tecnologia. As ações das empresas que fornecem equipamentos para a indústria de inteligência artificial foram duramente afetadas pelo desinvestimento na tecnologia.", "titulo_pt": "Ações de empresas de construção de centros de dados para IA caem 4,2 trilhões de dólares", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 265235, "titulo": "‘Low fire, low hire’ job market hurts US and UK productivity", "url": "https://www.ft.com/content/44c1fdc6-bc51-46e5-8a7c-c10096a25496?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-15T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Economistas afirmam que taxas baixas de contratação, renúncia e troca de emprego podem causar danos a longo prazo para a produtividade nos Estados Unidos e no Reino Unido.", "titulo_pt": "Baixa contratação, baixa demissão e baixa troca de emprego prejudicam a produtividade nos EUA e no reino unido", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 265020, "titulo": "50 anos da Lei das Sociedades por Ações: uma obra que revolucionou o Direito Societário", "url": "https://www.jota.info/opiniao-e-analise/artigos/50-anos-da-lei-das-sociedades-por-acoes-uma-obra-que-revolucionou-o-direito-societario", "fonte_id": "jota", "data_pub": "2026-11-15T04:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A lei das Sociedades por Ações completou 50 anos e seu desafio parece ser preservar seus fundamentos em vez de reformulá-la.", "titulo_pt": "50 Anos da Lei das Sociedades por Ações: uma obra que revolucionou o Direito Societário", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 265025, "titulo": "Fazl Barez: “Existe la percepción generalizada de que EE.UU. sigue llevando una ligera ventaja en la carrera por la IA”", "url": "https://www.latercera.com/mundo/noticia/fazl-barez-existe-la-percepcion-generalizada-de-que-eeuu-sigue-llevando-una-ligera-ventaja-en-la-carrera-por-la-ia/", "fonte_id": "la_tercera", "data_pub": "2026-11-15T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Fazl Barez, especialista em segurança da inteligência artificial da Universidade de Oxford, afirma que o renunciado CEO Jensen Huang teve um papel fundamental no desenvolvimento da Nvidia, particularmente ao posicioná-la no centro do atual boom da IA.", "titulo_pt": "Existe a percepção de que EUA ainda mantêm uma leve vantagem na corrida pela IA", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 265026, "titulo": "La inundación de la IA en el Congreso", "url": "https://www.latercera.com/nacional/noticia/la-inundacion-de-la-ia-en-el-congreso/", "fonte_id": "la_tercera", "data_pub": "2026-11-15T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O orçamento de 2027 examinou o uso indistinto da inteligência artificial pelos legisladores. O número recorde de mais de três mil indicações, 2.242 das quais identificadas como usando IA, levantou debates sobre a implementação consciente e responsável da tecnologia. Os sistemas de inteligência artificial estão sendo desenvolvidos nas duas casas do Congresso para revisar as indicações em massa, já que é considerado humanamente impossível lidar com milhares de emendas em um curto período de tempo.", "titulo_pt": "Inundação de IA no congresso é objeto de debate no orçamento de 2027", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 265320, "titulo": "(3rd LD) Top scorer in tax accountant exam turns himself in over AI-assisted cheating", "url": "https://en.yna.co.kr/view/AEN20261115000753315", "fonte_id": "yonhap_news", "data_pub": "2026-11-15T08:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vencedor do exame de contador certificado deste ano se entregou à polícia após ser acusado de fraude assistida por inteligência artificial.", "titulo_pt": "Top scorer no exame de contador certificado se entrega por fraude com ai", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 265297, "titulo": "Mini camera, AI and smartphone: How tax exam top scorer says he cheated under two proctors’ noses", "url": "https://www.koreaherald.com/article/10937594", "fonte_id": "korea_herald", "data_pub": "2026-11-15T08:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vencedor do exame de contabilidade fiscal da Coreia do Sul, Han Won-seok, confessou ter usado uma combinação de câmera miniatura, modelo de inteligência artificial gerativa e smartphone para obter respostas durante a prova, sob a vigilância de dois proverbes. Ele admitiu a conduta e se desculpou em um vídeo postado no canal do YouTube de seu advogado.", "titulo_pt": "Mini câmera, IA e smartphone: como o vencedor do exame de contabilidade fiscal confessou ter roubado duringa a prova, sob a vigilância de dois proverbes", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 265268, "titulo": "China’s upgraded VT-4B export tank gets fourth-gen Type 100 tech ahead of Zhuhai show", "url": "https://www.scmp.com/news/china/military/article/3374478/chinas-upgraded-vt-4b-export-tank-gets-fourth-gen-type-100-tech-ahead-zhuhai-show", "fonte_id": "scmp", "data_pub": "2026-11-15T08:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China atualizou sua série de tanques VT-4 com tecnologias de ponta, com foco no mercado internacional. Fotos recentes sugerem que o novo modelo, chamado VT-4B, apresenta melhorias significativas em proteção de blindagem, sistemas de proteção ativa, estação de armas e equipamentos eletrônicos em comparação com o VT-4A.", "titulo_pt": "Tanque VT-4B com tecnologia de quarta geração Type 100 se destaca antes da exposição de defesa de Zhuhai", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 264934, "titulo": "XP: Restrições a data centers nos EUA podem atrasar, mas não travar boom da IA", "url": "https://www.infomoney.com.br/mercados/xp-restricoes-a-data-centers-nos-eua-podem-atrasar-mas-nao-travar-boom-da-ia/", "fonte_id": "infomoney", "data_pub": "2026-11-15T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As restrições a data centers nos Estados Unidos podem atrasar, mas não impedir o boom da IA. A expectativa é de que interrupções pós-eleições de meio mandato reduzam os investimentos em até 5%.", "titulo_pt": "XP: restrições a data centers nos EUA podem atrasar, mas não travar boom da IA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 265270, "titulo": "South Korea calms fears over 260,000 Nvidia chip order after Jensen Huang’s exit", "url": "https://www.scmp.com/news/asia/east-asia/article/3374477/south-korea-calms-fears-over-260000-nvidia-chip-order-after-jensen-huangs-exit", "fonte_id": "scmp", "data_pub": "2026-11-15T07:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo sul-coreano afirmou que as obrigações existentes da Nvidia com Seul permanecem intactas após a demissão do CEO desqualificado Jensen Huang. No entanto, incertezas persistem devido a comentários de Elon Musk e outros que sugerem que a maior parte da cooperação poderia depender dos compromissos pessoais verbais de Huang.", "titulo_pt": "Coreia do sul alivia preocupações com pedido de 260.000 chips Nvidia após saída de Huang", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 265298, "titulo": "From pills to orbit: Boryung heir's bold space bet", "url": "https://www.koreaherald.com/article/10937558", "fonte_id": "korea_herald", "data_pub": "2026-11-15T07:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Boryung, uma empresa farmacêutica sul-coreana, estabeleceu recentemente parcerias com a agência aeroespacial alemã DLR e com a Sky Labs, uma empresa local de equipamentos médicos, para desenvolver soluções espaciais. Essas parcerias forneceram ao Boryung potenciais usuários para sua infraestrutura de pesquisa no espaço.", "titulo_pt": "De pílulas a órbita: aposta espacial ousada do herdeiro da boryung", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 265245, "titulo": "South Korea probes top exam scorer after AI cheating confession", "url": "https://www.japantimes.co.jp/news/2026/11/15/asia-pacific/south-korea-ai-test-cheating/", "fonte_id": "japan_times", "data_pub": "2026-11-15T06:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um candidato obteve uma pontuação de 397,5 de 400 no primeiro turno do exame, com apenas uma resposta errada entre 160 perguntas, levantando suspeitas de fraude. A Coreia do Sul está investigando o caso após a confissão de uso de inteligência artificial para a cheating.", "titulo_pt": "Coreia do sul investiga candidato com alta pontuação após confissão de fraude com AI", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 265230, "titulo": "What will Nvidia’s post-Huang era look like?", "url": "https://www.ft.com/content/0e2720d7-ba0a-4469-a854-30931f907bd3", "fonte_id": "financial_times", "data_pub": "2026-11-15T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de chips Nvidia enfrenta uma longa lista de adversários, resultado de suas próprias ações.", "titulo_pt": "Qual será o futuro da Nvidia após a era de huang?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 265231, "titulo": "Huang’s downfall shows human judgment is not all it’s cracked up to be", "url": "https://www.ft.com/content/f8dffb89-99e3-4e9d-ac62-4eb59da4f007?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-15T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A qualidade que nos distingue das máquinas parece ter falhado durante a queda do antigo CEO da Nvidia.", "titulo_pt": "A queda de huang mostra que a julgamento humano não é perfeito", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 265307, "titulo": "SK chief outlines ‘AI flywheel’ strategy at 2026 CEO Seminar", "url": "https://www.koreaherald.com/article/10937482", "fonte_id": "korea_herald", "data_pub": "2026-11-15T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do Grupo SK, Chey Tae-won, propôs uma estratégia chamada 'AI flywheel' que conecta as operações de semicondutores, infraestrutura e energia à novas serviços de inteligência artificial. Esta estratégia foi apresentada durante o Seminário CEO 2026 do SK, realizado no Instituto SKMS de Pesquisa em Icheon, Gyeonggi Province.", "titulo_pt": "Chefe do grupo SK apresenta estratégia 'AI flywheel' em seminário", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 265310, "titulo": "[World Class] Sogang’s next global move pairs AI with a search for top scholars", "url": "https://www.koreaherald.com/article/10937470", "fonte_id": "korea_herald", "data_pub": "2026-11-15T04:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Sogang University está buscando formas de fortalecer relações entre estudantes internacionais e profissionais através de atividades como caminhadas. O presidente da universidade, Sim Jong-hyeok, vê essas interações como uma maneira de ajudar os estudantes estrangeiros a se conectarem e formarem vínculos duradouros.", "titulo_pt": "Sogang university: próxima jogada global combina IA com busca por talentos acadêmicos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 265314, "titulo": "Repair of old copper wiring caused US flight disruption: Trump admin", "url": "https://www.koreaherald.com/article/10937466", "fonte_id": "korea_herald", "data_pub": "2026-11-15T04:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Viagens aéreas foram interrompidas devido a problemas na substituição de fios de cobre antigos. O governo Trump atribuiu a confusão a uma falha na instalação de novas linhas de comunicação. A situação deve se normalizar em breve, deixando muitos passageiros em situação incerta por algumas horas.", "titulo_pt": "Reparo de velhos fios de cobre causou interrupção de voos nos EUA: administração trump", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 265283, "titulo": "Top tax accountant exam scorer in South Korea admits to using AI to cheat", "url": "https://www.scmp.com/news/asia/east-asia/article/3374467/top-tax-accountant-exam-scorer-south-korea-admits-using-ai-cheat", "fonte_id": "scmp", "data_pub": "2026-11-15T03:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um candidato que obteve a melhor nota no exame nacional de contabilidade fiscal da Coreia do Sul, realizado em abril e julho, confessou ter usado inteligência artificial para fraudar o teste. Ele obteve 397,5 pontos de 400 no primeiro round, tendo cometido apenas um erro entre 160 perguntas.", "titulo_pt": "Melhor classificado no exame de contabilidade fiscal da Coreia do sul confessa uso de IA para fraudar teste", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 265323, "titulo": "ICT exports log record-high growth in Oct. amid AI boom", "url": "https://en.yna.co.kr/view/AEN20261115000800320", "fonte_id": "yonhap_news", "data_pub": "2026-11-15T03:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações de tecnologia da informação e comunicação da Coreia do Sul registraram crescimento recorde em outubro, coincidindo com o boom da inteligência artificial.", "titulo_pt": "Exportações de tecnologia da informação e comunicação da Coreia do sul registram crescimento perda de memória", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 265334, "titulo": "Scientists discover a bizarre paradox among endangered penguins", "url": "https://www.sciencedaily.com/releases/2026/11/261112230458.htm", "fonte_id": "science_daily", "data_pub": "2026-11-15T03:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa com drones descobriu que entre as pinguins eretocrestados da Nova Zelândia, uma população permaneceu estável por décadas, enquanto outra diminuiu mais de 40%. Surpreendentemente, as ilhas Bounty, muito menores, abrigam quase o mesmo número de pares de pinguins em comparação com as ilhas Antipodes.", "titulo_pt": "Cientistas descobrem paradoxo estranho entre pinguins eretocrestados em perigo de extinção", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 265332, "titulo": "Dinosaurs may have been eating seaweed 100 million years ago", "url": "https://www.sciencedaily.com/releases/2026/11/261112230502.htm", "fonte_id": "science_daily", "data_pub": "2026-11-15T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fósseis de dentes de dinossauros indicam que esses animais podem ter consumido algas marinhas e outros alimentos do oceano há mais de 100 milhões de anos. As evidências sugerem que animais pré-históricos, incluindo dinossauros costeiros, obtinham nutrientes dos oceanos, integrando-os em suas cadeias alimentares.", "titulo_pt": "Dinossauros podem ter comido algas marinhas há 100 milhões de anos", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 265333, "titulo": "Physicists use laser light to unlock a crystal's hidden electrical powers", "url": "https://www.sciencedaily.com/releases/2026/11/261112230500.htm", "fonte_id": "science_daily", "data_pub": "2026-11-15T02:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas descobriram como usar impulsos de luz laser para organizar pequenas regiões elétricas dentro de cando as interações ecológicas.", "titulo_pt": "Expansão urbana causa colapso das redes alimentares em riachos da região metropolitana de São Paulo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 264482, "titulo": "Starship completa pouso inédito após voo de mais de 22 horas", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/11/starship-completa-pouso-inedito-apos-voo-de-225-horas.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-11-14T21:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa SpaceX realizou pela primeira vez a recuperação de um segundo estágio de foguete na plataforma, após um voo de mais de 22 horas. Este é um passo importante para a rápida reutilização do veículo Starship.", "titulo_pt": "Starship realiza pouso inédito após voo de mais de 22 horas", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 264802, "titulo": "A dead star is flashing radio waves every 8 minutes, and its partner looks a lot like the sun", "url": "https://phys.org/news/2026-11-dead-star-radio-minutes-partner.html", "fonte_id": "phys_org", "data_pub": "2026-11-14T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Desde 2022, astrônomos têm estudado objetos cósmicos chamados transientes de rádio de longo período, que emitem flashes de rádio a cada 8 minutos. Esses objetos são encontrados em sistemas binários com uma pequena e fria estrela chamada rédula em órbita com um restos estelar conhecido como branco-dwarf.", "titulo_pt": "Estrela morta está emitindo ondas de rádio a cada 8 minutos e seu parceiro lembra muito o sol", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 264525, "titulo": "Gatos têm \"miado estratégico\" para pedir ajuda a humanos, diz estudo da USP", "url": "https://www.metropoles.com/sao-paulo/gatos-tem-miado-estrategico-para-pedir-ajuda-a-humanos-diz-estudo-da-usp", "fonte_id": "metropoles", " ws/china/politics/article/3374469/what-beijing-cafe-dispute-reveals-about-chinas-struggling-bookshops", "fonte_id": "scmp", "data_pub": "2026-11-15T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As livrarias físicas chinesas estão cada vez mais dependendo de cafés, mercadorias e eventos culturais para sobreviver, em vez de livros. Uma disputa em uma loja Sisyphe Bookstore em Beijing, uma das maiores cadeias do país, ilustrou as tensões desse modelo de negócios.", "titulo_pt": "O que um conflito em um café de livraria em Beijing revela sobre as livrarias em dificuldades na China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 265345, "titulo": "Kohler's gut-health tracker clips onto the toilet bowl", "url": "https://www.dezeen.com/2026/11/15/kohler-gut-health-tracker-dekoda/", "fonte_id": "dezeen", "data_pub": "2026-11-15T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A marca americana de banheiros Kohler desenvolveu o Dekoda, um rastreador de saúde especialmente para o vaso sanitário, através de sua divisão de negócios Kohler Health. O dispositivo se fixa na borda do vaso sanitário para monitorar a saúde intestinal.", "titulo_pt": "Kohler desenvolve rastreador de saúde intestinal para o vaso sanitário", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 265278, "titulo": "No actors, no crew, no ticket sales: ‘So obviously AI’ film flops at China’s box office", "url": "https://www.scmp.com/economy/china-economy/article/3374358/no-actors-no-crew-no-ticket-sales-so-obviously-ai-film-flops-chinas-box-office", "fonte_id": "scmp", "data_pub": "2026-11-15T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira película chinesa totalmente gerada por inteligência artificial, 'Sanxingdui: Future Past', não obteve sucesso nas bilheterias do país, arrecadando cerca de 1,8 milhão de yuan após três semanas em cartaz. O filme, de 100 minutos de duração e com tema sci-fi, teve receita abaixo do seu orçamento estimado de vários milhões de yuan.", "titulo_pt": "Sem atores, sem equipe, sem bilheteria: filme totalmente AI fracassa nas bilheterias chinesas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 265167, "titulo": "The Kyiv Independent confronts journalism in times of war", "url": "https://www.lemonde.fr/en/international/article/2026/11/15/the-kyiv-independent-confronts-journalism-in-times-of-war_6781249_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-15T04:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Kyiv Independent, que opera há cinco anos e conta com cerca de 100 funcionários, sobreviveu graças a uma comunidade de 35.000 membros doadores. Como outras poucas redações independentes do país, este meio de comunicação online enfrentou não apenas ameaças russas, mas também interesses governamentais e tensões internas na Ucrânia.", "titulo_pt": "O Kyiv Independent enfrenta o jornalismo em tempos de guerra", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 265164, "titulo": "The unlikely story of how a young group of Scots created 'GTA' 30 years ago", "url": "https://www.lemonde.fr/en/m-le-mag/article/2026/11/15/the-unlikely-story-of-how-a-young-group-of-scots-created-gta-30-years-ago_6781183_117.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-15T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O sexto episódio de 'Grand Theft Auto', previsto para ser lançado em 19 de novembro, já tem mais de 600 milhões de dólares em pré-vendas. A franquia globalmente bem-sucedida, centrada em roubos de carros e em um mundo onde tudo é permitido, foi concebida no meio dos anos 1990 por um grupo de entusiastas jovens em Dundee, uma cidade escocesa localizada ao norte de Edimburgo.", "titulo_pt": "A história improvável de como um grupo jovem de escoceses criou o 'GTA' há 30 anos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 265280, "titulo": "Fresh coat, lighter load: Hong Kong airport puts runway-painting robots to work", "url": "https://www.scmp.com/news/hong-kong/transport/article/3374454/fresh-coat-lighter-load-hong-kong-airport-puts-runway-painting-robots-work", "fonte_id": "scmp", "data_pub": "2026-11-15T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Aeroporto Internacional de Hong Kong se tornou o primeiro a utilizar robôs para repintar as marcas do pista, reduzindo em cerca de 67% o tempo necessário para renovar as linhas centrais em comparação com a pintura manual. Os robôs, chamados 'Brushman', melhoram a precisão da pintura e a segurança dos trabalhadores, permitindo que eles assumam papéis de supervisão e eliminando a necessidade de trabalho noturno físico intenso.", "titulo_pt": "Novo verniz, carga mais leve: aeroporto de hong Kong emprega robôs para pintar pistas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 265003, "titulo": "Borges y el cine, una relación entre amantes con algunos malentendidos", "url": "https://www.lanacion.com.ar/espectaculos/borges-y-el-cine-una-relacion-entre-amantes-con-algunos-malentendidos-nid15112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-15T03:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A relação entre o escritor Jorge Luis Borges e o cinema é tema de reflexões em relação à película Biografía sobre el autor de Ficciones, dirigida por Mariano Llinás. O texto discute a interação entre Borges e o séptimo arte, mencionando alguns malentendidos na sua relação com o cinema.", "titulo_pt": "Borges e o cinema, uma relação entre amantes com alguns malentendidos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 265032, "titulo": "Los Tres celebran los 30 años del Unplugged: aunque me lleve el tiempo no tengo edad", "url": "https://www.latercera.com/culto/n
