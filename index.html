blazars são apontados para a Terra.", "titulo_pt": "Astrônomos dizem ter identificado o primeiro microblazar apontado para a terra", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 196666, "titulo": "Why the creative brain feeds on movement", "url": "https://www.scientificamerican.com/article/why-the-creative-brain-feeds-on-movement/", "fonte_id": "scientific_american", "data_pub": "2026-10-05T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos científicos estão examinando a relação entre movimento e criatividade, tentando descobrir por que esses dois conceitos estão intimamente ligados.", "titulo_pt": "Por que o cérebro criativo se alimenta do movimento", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 196624, "titulo": "STAT+: Vaxcyte claims success in bid to beat Pfizer and Merck in lucrative vaccine market", "url": "https://www.statnews.com/2026/10/05/vaxcyte-pneumococcal-vaccine-study-pfizer-merck/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-05T12:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vaxcyte anunciou que seu vacina experimental contra a pneumonia atingiu os principais objetivos de um estudo clínico de fase 3, o que o coloca em posição para competir com Pfizer e Merck no mercado lucrativo de vacinas.", "titulo_pt": "Vaxcyte afirma sucesso em tentativa de superar Pfizer e Merck no mercado de vacinas lucrativo", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 195908, "titulo": "“Profesionales del deseo”: crece la atracción por Affair, una experiencia que busca desbordar lo tradicional", "url": "https://www.lanacion.com.ar/cultura/profesionales-del-deseo-crece-la-atraccion-por-affair-una-experiencia-que-busca-desbordar-lo-nid05102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-05T17:50:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A quarta edição da feira Affair propõe permitir que os visitantes sigam seus impulsos ao comprar arte, com performances, música e um programa especial para novos compradores entre os dias 28 de outubro e 1 de novembro.", "titulo_pt": "Profissionais do desejo: cresce a atratividade da feira Affair, que busca ultrapassar o tradicional", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 196742, "titulo": "L7 Reunite With Former Bassist on New Song “Loma Linda”", "url": "https://pitchfork.com/story/l7-reunite-with-former-bassist-on-new-song-loma-linda/", "fonte_id": "pitchfork", "data_pub": "2026-10-05T17:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A banda L7 se reunirá com o ex-baixista Janis Tanaka para tocar uma nova canção chamada 'Loma Linda' durante sua próxima turnê, a Last Hurrah Tour. Jennifer Finch, a antiga baixista da banda, faleceu.", "titulo_pt": "L7 reúne ex-baixista para nova canção 'Loma Linda'", "veiculo": "Pitchfork (música)", "pais": "EUA", "classe": "B"}, {"id": 196719, "titulo": "Strike That Threatened Lichtenstein Blockbuster Averted as Whitney Workers Ratify Contract", "url": "https://www.artforum.com/news/strike-averted-as-whitney-workers-ratify-contract-1234760845/", "fonte_id": "artforum", "data_pub": "2026-10-05T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Trabalhadores sindicalizados do Museu Whitney de Arte Americana em Nova York ratificaram seu segundo contrato coletivo poucas horas antes de planejarem uma greve. A greve estava prevista para ocorrer no dia 5 de outubro, três dias antes da abertura para pré-visualização de uma exposição blockbuster sobre Roy Lichtenstein.", "titulo_pt": "Greve que ameaçava bloquear Blockbuster do Lichtenstein no Whitney é evitada após ratificação do contrato", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 196057, "titulo": "Photos: Human-Tower Season", "url": "https://www.theatlantic.com/photography/2026/10/photos-human-tower-season/688885/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-05T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente no outono na Espanha, equipes em festivais e competições formam impressionantes torres humanas (castells) com até nove níveis. Esta tradição catalã é supostamente originada no final do século XVIII por grupos locais de dança.", "titulo_pt": "Fotos: temporada de torres humanas", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 196670, "titulo": "Jeff Koons Appears to Be the ‘Distinguished Collector’ Offering $100 M. in Old and Modern Masters at Christie’s", "url": "https://www.artnews.com/art-news/market/christies-100-million-auction-jeff-koons-collection-1234801007/", "fonte_id": "artnews", "data_pub": "2026-10-05T17:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A casa de leilões não confirmou a identidade do colecionador, mas dois fontes do setor anônimas informaram ao The New York Times que Jeff Koons é o vendedor dos trabalhos de arte que valeriam US$ 100 milhões em obras antigas e modernas no leilão de Christie’s.", "titulo_pt": "Jeff Koons seria o colecionador ilustre oferecendo us$ 100 mi em obras antigas e modernas em leilão da Christie’s", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 196720, "titulo": "Jeff Koons to Auction $100 Million of Personal Art Collection", "url": "https://www.artforum.com/news/jeff-koons-to-auction-personal-art-collection-1234760843/", "fonte_id": "artforum", "data_pub": "2026-10-05T17:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jeff Koons planeja vender oito pinturas e uma escultura de sua coleção pessoal, avaliadas em US$ 100 milhões, em leilão no dia 17 de novembro, em Nova York. O leilão será realizado pela Christie's e terá como tema 'Heroes and Lovers'.", "titulo_pt": "Jeff Koons leiloará coleção pessoal avaliada em 100 milhões de dólares", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 195610, "titulo": "Branford Marsalis Quartet e Dianne Reeves trazem tributo a Coltrane a São Paulo", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/blogs/musica-em-letras/2026/10/branford-marsalis-quartet-e-dianne-reeves-trazem-tributo-a-coltrane-a-sao-paulo.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-05T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Branford Marsalis Quartet e a cantora Dianne Reeves se apresentarão no Cultura Artística, em São Paulo, em 9 de setembro de 2027, às 20h, em homenagem a John Coltrane, com base no álbum 'John Coltrane and Johnny Hartman' de 1963.", "titulo_pt": "Branford Marsalis Quartet e Dianne Reeves tributam Coltrane em show em São Paulo", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 196688, "titulo": "Aphrodite review – a trashy way to treat the goddess of love", "url": "https://www.theguardian.com/artanddesign/2026/oct/05/aphrodite-review-venus-ashmolean-museum-oxford", "fonte_id": "guardian_culture", "data_pub": "2026-10-05T14:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A exposição na Ashmolean Museum, em Oxford, apresenta a Vênus de Botticelli de uma maneira que alguns consideram inadequada. A obra, que é uma das mais famosas representações da deusa do amor, está exposta de forma a parecer que está visitando a casa do público à noite, o que alguns veem como um tratamento impróprio para a deusa grega.", "titulo_pt": "Aphrodite review – uma maneira descartável de tratar a deusa do amor", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 196694, "titulo": "Artist calls in lawyers after Tories use his Burnham portrait without consent", "url": "https://www.theguardian.com/politics/2026/oct/05/artist-cartoon-conservatives-use-his-burnham-portrait", "fonte_id": "guardian_culture", "data_pub": "2026-10-05T13:56:00Z", "idioma": "en", "provavel_du os em lanchonetes de SP é adiada para 2027", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/proibicao-de-bisnagas-de-molhos-em-lanchonetes-de-sp-e-adiada-para-2027/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-05T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proibição da utilização de bisnagas de molhos em lanchonetes no estado de São Paulo foi adiada para o ano de 2027, dando aos estabelecimentos mais tempo para se adaptarem às novas regras que exigem condimentos em embalagens individuais.", "titulo_pt": "Proibição de bisnagas de molhos em lanchonetes de SP é adiada para 2027", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 195707, "titulo": "Mulher é morta a facadas em casa na Bahia; polícia busca ex-namorado", "url": "https://www.metropoles.com/brasil/mulher-e-morta-a-facadas-em-casa-na-bahia-policia-busca-ex-namorado", "fonte_id": "metropoles", "data_pub": "2026-10-05T17:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Cristina Ribeiro dos Santos, de 47 anos, foi morta a facadas em sua casa na Bahia. Ela foi socorrida, mas não sobreviveu aos ferimentos.", "titulo_pt": "Mulher de 47 anos é morta a facadas em casa na Bahia; ex-namorado é procurado", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 196050, "titulo": "Nearly 200 students injured in French schools protests as clashes with police continue – as it happened", "url": "https://www.theguardian.com/world/live/2026/oct/05/europe-spain-pedro-sanchez-election-housing-france-school-protests-ukraine-russia-latest-news-updates", "fonte_id": "guardian_world", "data_pub": "2026-10-05T15:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Muitas escolas em França permanecem fechadas devido a protestos planejados. O Partido Popular Conservador expressou satisfação com a situação. O primeiro-ministro espanhol Pedro Sánchez convocou eleições antecipadas para 29 de novembro, após partidos de direita bloquearem medidas emergenciais sobre aluguel em meio a protestos generalizados.", "titulo_pt": "Quase 200 estudantes feridos em protestos nas escolas francesas e eleições antecipadas na Espanha - como aconteceu", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 196190, "titulo": "French teenager loses hand picking up police grenade in high school protests", "url": "https://www.lemonde.fr/en/france/article/2026/10/05/french-teenager-loses-hand-picking-up-police-grenade-in-high-school-protests_6758269_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-05T15:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudante de 15 anos ficou ferido ao pegar uma granada de pimenta disparada pela polícia durante protestos em uma escola no norte da França. O incidente ocorre quando o governo enfrenta críticas por sua resposta a uma movimentação de estudantes, às vezes violenta, que questiona as condições de sala de aula e que agora entra em sua terceira semana.", "titulo_pt": "Estudante de 15 anos fica ferido ao pegar granada de pimenta durante protestos em escola na França", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 196051, "titulo": "France braces for national day of school protests as boy loses hand", "url": "https://www.theguardian.com/world/2026/oct/05/schoolboy-loses-hand-police-stun-grenade-french-school-protests", "fonte_id": "guardian_world", "data_pub": "2026-10-05T15:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Franceses se preparam para um dia nacional de protestos e bloqueios de escolas secundárias, em meio a crescentes preocupações sobre a resposta policial. Um adolescente de 15 anos teve a mão decepada durante um protesto em Lens, norte do país.", "titulo_pt": "França se prepara para dia nacional de protestos escolares após jovem perder mão", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 196428, "titulo": "2 killed, including student, in ‘horrific’ school bus crash in Florida", "url": "https://www.scmp.com/news/world/united-states-canada/article/3369833/2-killed-including-student-horrific-school-bus-crash-florida?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-05T15:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ônibus escolar capotou durante um acidente multivéhicular no centro da Flórida, matando duas pessoas, incluindo uma estudante de 10º ano, e ferindo vários outros. O ônibus, com cerca de 39 passageiros a caminho da Escola Secundária Winter Haven, foi atingido por um carro que invadiu a faixa contrária, de acordo com o delegado do condado de Polk, Grady Judd.", "titulo_pt": "Dois mortos, incluindo estudante, em acidente ‘horroroso’ de ônibus escolar na flórida", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 196432, "titulo": "France school protests: teenager’s hand blown off after picking up grenade", "url": "https://www.scmp.com/news/world/europe/article/3369829/france-school-protests-teenagers-hand-blown-after-picking-grenade?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-05T14:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um adolescente de 15 anos perdeu uma mão ao pegar uma granada policial durante protestos em escolas francesas. Os estudantes exigem melhorias nas condições das salas de aula em uma onda de protestos que durou vários dias e afetou centenas de escolas, causando incêndios e barricadas em algumas delas.", "titulo_pt": "Protestos em escolas da França: adolescente perde mão ao pegar granada policial", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 196189, "titulo": "French high school protests: The risk of a united front of discontent", "url": "https://www.lemonde.fr/en/opinion/article/2026/10/05/french-high-school-protests-the-risk-of-a-united-front-of-discontent_6758264_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-05T13:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com o apoio de organizações profissionais unidas com estudantes de ensino médio e universitários em uma demonstração na terça-feira, o movimento de protesto está entrando em uma nova fase. No entanto, o déficit público e a dívida da França limitam as possibilidades de manobra do governo.", "titulo_pt": "Protestos nas escolas francesas: risco de uma frente unificada de insatisfação", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 196365, "titulo": "Teenager loses hand in blast amid French school protest clashes", "url": "https://www.aljazeera.com/news/2026/10/5/students-continue-to-protest-in-france-as-hundreds-of-schools-close?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-05T12:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um adolescente perdeu uma mão em uma explosão em Lens durante confrontos em uma escola francesa. Uma investigação está sendo realizada pela vigilância policial. As manifestações contra a falta de professores e as condições das escolas continuam por terceira semana consecutiva em todo o país.", "titulo_pt": "Adolescente perde mão em explosão durante protestos em escola na França", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 196442, "titulo": "Empty classrooms on remote Greek island signal crisis across Europe", "url": "https://www.scmp.com/news/world/europe/article/3369816/empty-classrooms-remote-greek-island-signal-crisis-across-europe?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-05T11:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A sala de aula de Chryssa Ntalaka na ilha grega de Kalamos está vazia, com apenas dois alunos no início do ano letivo, indicando uma tendência de declínio populacional em escolas remotas na Europa. Quando os alunos forem para a escola do continente grego no próximo ano, o último prédio escolar da ilha será encerrado.", "titulo_pt": "Salas vazias em ilha grega ilustram crise educacional na Europa", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 196056, "titulo": "Gen Z is warming to socialism. But they’re still not sure what it means.", "url": "https://www.vox.com/politics/504983/gen-z-voters-young-voters-socialism-midterms", "fonte_id": "vox", "data_pub": "2026-10-05T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O socialismo está ganhando popularidade entre os democratas e independentes, especialmente entre os jovens. Pesquisas mostram que mais de metade das pessoas jovens estão agora com uma visão positiva sobre o termo.", "titulo_pt": "Gen Z está se aquecendo com o socialismo, mas ainda não tem certeza do que significa", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 196193, "titulo": "Why French high schoolers are protesting, and why their movement is already historic", "url": "https://www.lemonde.fr/en/france/article/2026/10/05/why-french-high-schoolers-are-protesting-and-why-their-movement-is-already-historic_6758257_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-05T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os protestos iniciados de forma espontânea nos subúrbios de Paris expandiram-se para uma escala não vista há décadas, com estudantes denunciando as condições de aprendizado e as incertezas futuras. A resposta repressiva do governo pode agravar ainda mais a irritação dos estudantes.", "titulo_pt": "Por que os estudantes de escolas francesas estão em protesto, e por que esse movimento já é histórico", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 196495, "titulo": "Man in 20s arrested for killing elderly stranger in Seoul", "url": "https://en.yna.co.kr/view/AEN20261005002500315", "fonte_id": "yonhap_news", "data_pub": "2026-10-05T06:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de aprox e": null, "texto_pt": "Uma quarentena em massa foi ordenada na Rússia após a morte inesperada de um pesquisador da peste. Há relatos não confirmados de que houve um acidente no laboratório.", "titulo_pt": "Quarentena em massa emitiu na Rússia após morte inesperada de pesquisador da peste", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 196288, "titulo": "Belgian city’s historic canals turn green after record-hot summer", "url": "https://www.euronews.com/video/2026/10/05/belgian-citys-historic-canals-turn-green-after-record-hot-summer", "fonte_id": "euronews", "data_pub": "2026-10-05T08:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma camada espessa de plâncton verde chamado duckweed cobriu os canais históricos de Gante, interrompendo as embarcações turísticas e levantando novas preocupações sobre o aquecimento global na Bélgica.", "titulo_pt": "Canais históricos de gante ficam verdes após verão extremamente quente", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 196290, "titulo": "Floods leave streets and roads submerged across Catalonia", "url": "https://www.euronews.com/video/2026/10/05/floods-leave-streets-and-roads-submerged-across-catalonia", "fonte_id": "euronews", "data_pub": "2026-10-05T07:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Floods in Catalunha deixaram duas pessoas mortas e outra desaparecida. Ocorreram mais de 1.500 chamadas às equipes de bombeiros devido à forte chuva.", "titulo_pt": "Inundações causam duas mortes e uma pessoa desaparecida em catalunha", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 196201, "titulo": "Persistent drought puts pressure on France's drinking water networks", "url": "https://www.lemonde.fr/en/environment/article/2026/10/05/persistent-drought-puts-pressure-on-france-s-drinking-water-networks_6758251_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-05T03:16:00Z", "idioma": "en", "provavel_duplicata_de": null, " used-of-sexually-torturing-minors_6758268_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-05T15:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudante liderava uma comunidade online de jovens homens obsedados com violência brutal. Ele poderia ser condenado à prisão perpétua por forçar garotas adolescentes a se autolesionarem ou a realizar atos sexuais extremamente violentos.", "titulo_pt": "Processo em paris para Rohan Rane, estudante acusado de torturar sexualmente menores e fascista", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 196037, "titulo": "Guardian readers fund life-changing surgery for Somali boy injured in US airstrike", "url": "https://www.theguardian.com/global-development/2026/oct/05/guardian-readers-fundraising-somalian-boy-injured-in-us-strike-surgery-abdiqadir-salah", "fonte_id": "guardian_world", "data_pub": "2026-10-05T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Após uma investigação do The Guardian que descobriu um ataque a drone que matou 12 civis e feriu muitos outros na vila somali de Jamaame, o menino Abdiqadir Salah, de sete anos, passou por uma operação vital em Mogadishu. Durante o trajeto de rickshaw até o hospital, a mãe do menino, Marian Haji Abdi Guled, sentiu uma mistura de alegria e preocupação, pois aquele era o dia esperado para a cirurgia do filho, que havia sido gravemente ferido há quase um ano.", "titulo_pt": "Leitores do guardian financiam cirurgia transformadora para menino Somali ferido em ataque de drone dos EUA", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 195936, "titulo": "Lo que Chile debería aprender del gobierno carcelario del PCC", "url": "https://www.ciperchile.cl/2026/10/05/lo-que-chile-deberia-aprender-del-gobierno-carcelario-del-pcc/?utm_source=rss&utm_medium=rss&utm_campaign=lo-que-chile-deberia-aprender-del-gobierno-carcelario-del-pcc", "fonte_id": "ciper_chile", "data_pub": "2026-10-05 const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">

    </div>
    ${renderPodcast()}

  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";

      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
