<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

const D = {"gerado_em": "21/11/2026 15:21", "stats": {"noticias_novas": 607, "resumos_gerados": 248}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O ex-presidente Jair Bolsonaro, internado em uma unidade de terapia intensiva (UTI) no Hospital DF Star, em Brasília, com diagnóstico de abdome agudo obstrutivo, permanece clinicamente estável, mas não tem previsão de alta hospitalar, conforme informou o hospital. Por outro lado, o presidente Luiz Inácio Lula da Silva defendeu o projeto de ajuste fiscal durante uma live nas redes sociais, criticando o mercado financeiro por questionar a seriedade do governo na gestão do gasto público. O Senado aprovou a medida que permite a inclusão de pagamentos acima do teto salarial sem reduzir a despesa orçamentária da União, mantendo a blindagem orçamentária. Além disso, a Organização das Nações Unidas (ONU) relata que a violência está dificultando o combate ao surto de Ebola na República Democrática do Congo, com a epidemia já deixando 5.400 mortos e afetando crianças em oito províncias, com ataques a serviços de saúde.", "mundo": "A COP31 foi prorrogada devido à falta de acordo entre os países sobre questões climáticas, enquanto as negociações continuam com divisões profundas sobre combustíveis fósseis, financiamento climático e metas de aquecimento global. Em outros desenvolvimentos, o líder do cartel mexicano, Fausto Isidro Meza Flores, conhecido como 'El Chapo Isidro', foi capturado pelo exército mexicano, representando uma vitória para o governo mexicano. Em um evento local, um gato andou solto na cabine de passageiros de um voo da Delta Airlines, causando atrasos no aeroporto de Boston. A França enfrenta uma sexta semana consecutiva de protestos, com manifestantes nas ruas protestando contra a elevação dos custos de vida. A Costa Rica está investigando o assassinato do jornalista Camilo Rodríguez com a ajuda da DEA, enquanto o Reino Unido e a União Europeia chegaram a acordos sobre imposto sobre carbono, mobilidade juvenil e reestabelecimento de uma área sanitária e fitossanitária comum, embora ainda dependam de negociações continuas sobre a redução de taxas de universidade para estudantes europeus nas universidades britânicas.\n\nA geopolítica global enfrenta diversos desafios e tensões em diferentes cenários. Primeiramente, notícias sobre o Irã e o Estreito de Ormuz destacam a importância do fluxo de petróleo na região. Ataques a navios petroleiros e o aumento do fluxo de petróleo após a recuperação das exportações diminuem o poder de barganha do Irã contra os Estados Unidos. Além disso, a captura do chefe do cartel procurado pelo FBI, 'El Chapo Isidro', no México, resultou em violência e tensões locais. Em outro front, ataques de drones e mísseis russos em países europeus, como a Finlândia e a Polônia, aumentam a incerteza nas negociações de paz e a possibilidade de escalada militar. As negociações internacionais para controlar o uso de armas autônomas falharam devido às objeções da Rússia, enquanto a Ucrânia bombardeou um cargueiro russo em águas internacionais, levando a restrições de espaço aéreo pela Finlândia. Estes eventos refletem a complexidade e a volatilidade da atual situação geopolítica global.", "economia": "A União Europeia propôs uma taxa de 3% sobre o faturamento das grandes empresas de tecnologia, como parte de um plano para arrecadar cerca de 60 bilhões de euros anualmente. Este imposto, que incidirá sobre receitas de publicidade online, serviços de intermediação digital e dados de usuários, entre 2028 e 2034, busca financiar o orçamento europeu. Em outro desenvolvimento, a União Europeia e a Indonésia assinaram dois acordos comerciais após dez anos de negociações, com o objetivo de aumentar as exportações indonésias para a União Europeia em 40% nos próximos 15 anos. No Brasil, o presidente Lula criticou o mercado financeiro e os 'yuppies da Faria Lima', afirmando que não se deixará influenciar por bancos e investidores na condução da política econômica de seu governo. Além disso, o presidente defendeu o ajuste fiscal e afirmou que não permitirá pressões do mercado financeiro. A escalada de protestos contra o aumento do custo de vida continua na França, com manifestações ocorrendo há seis sábados consecutivos. No setor econômico, a escalada de protestos também foi registrada em Espanha, Portugal, Grécia e Alemanha. No cenário econômico, o Bitcoin atingiu o nível mais baixo em mais de dois anos, refletindo a queda geral das apostas especulativas. A reforma tributária prevê a obrigatoriedade de emissão de notas fiscais para condomínios, companhias aéreas, locadores de veículos e imóveis, bem como para outras operações a partir de 2027.", "tecnologia": "A tecnologia continuou a avançar em 2026, com destaque para o avanço da inteligência artificial (IA) e os desafios associados. O USDA e o FBI foram alvos de hackers, levantando preocupações sobre a segurança cibernética. A empresa Anthropic, especializada em IA, realizou uma IPO bilionária, mas as ações caíram rapidamente, refletindo a cautela dos investidores. A Amazon está perto de fechar um acordo de aquisição de uma start-up de IA por 7,5 bilhões de dólares, buscando competir com a Nvidia. A SpaceX planeja aposentar a Starship Ship 42, a primeira Starship capturada por braços mecânicos, mantendo-a para exposição pública. A indústria de IA enfrenta desafios de governança e manutenção, enquanto a Europa propõe um imposto sobre as receitas das grandes tecnológicas. O uso de IA em Hollywood também é debatido, com críticas a práticas de 'race realism'. A SpaceX realizou um voo autônomo de um táxi aéreo elétrico, avançando no desenvolvimento de transportes urbanos futuros.", "ciencia": "Um matemático da Anthropic, Levent Alpöge, em colaboração com o assistente de inteligência artificial Claude, alega ter resolvido a hipótese de Riemann, uma das conjecturas mais famosas da matemática. Esta hipótese, proposta em 1859 pelo matemático Bernhard Riemann, permite caracterizar o comportamento dos números primos. A resolução desta hipótese, se confirmada, poderia marcar um ponto de virada significativo na matemática. Paralelamente, pesquisadores da Monash University propuseram uma reescrita radical da árvore genealógica humana, reclassificando espécies como Australopithecus e Paranthropus no gênero Homo, desafiando a classificação tradicional dos antepassados humanos. Além disso, a inteligência das abelhas do gênero Bombus, conhecidas como mamangavas, está intrigando os cientistas devido à sua capacidade cerebral surpreendente, revolucionando nossa compreensão sobre a inteligência dos animais não humanos.", "cultura": "O poeta taiwanês Xiang Ming faleceu, deixando uma herança literária significativa. Em um evento cultural notável, o artista chileno Kidd Voodoo se tornou o primeiro chileno a ganhar o prêmio de 'Melhor Artista ou Grupo Revelação de la Categoría Global Latina' nos Los40 Music Awards. A TV Brasil exibe o show do trio carioca Pietá no Cena Musical, celebrando a trajetória do grupo em seu álbum homônimo lançado em 2024. O programa Sem Censura, apresentado por Cissa Guimarães, venceu o Prêmio Melhores do Ano NaTelinha pela terceira vez consecutiva em 2026. A atriz Geni Cavalcante prepara o espetáculo 'O Céu de Durvalina' em São Paulo, homenageando imigrantes na cidade, refletindo a naturalidade com que os moradores interagiram com o projeto. A feira Orgulho Nerd SP, que começa neste fim de semana, promete atrair visitantes com sessões de cinema, shows musicais, oficinas, campeonatos de games e concursos de cosplay. A retrospectiva de Maren Hassinger na Berkeley Art Museum and Pacific Film Archive destaca sua paixão por metais e movimento, enquanto a ilustradora espanhola María Hesse chega a Santiago para lançar uma nova edição da obra 'O Príncipe Encantado' de Saint-Exupéry, refletindo sobre os desafios de reinterpretar um clássico no ritmo acelerado do mundo atual.", "sociedade": "O Rio Grande do Sul enfrentou um temporal que deixou 162 feridos e desalojou mais de 19 mil pessoas em Tupanciretã. Autoridades nacionais se mobilizaram para auxiliar o município. O presidente Luiz Inácio Lula da Silva prestou solidariedade e enviou uma equipe para socorrer a população local. Em Chapecó, Santa Catarina, uma mulher de 21 anos foi morta a golpes de facão, com a irmã dela, uma menina de 13 anos, ferida. No estado americano da Virgínia, EUA, uma criança entre 0 e 4 anos morreu de sarampo, elevando o número de mortes relacionadas à doença no país em 2026 para 12. A Olimpíada de Filosofia em Tucumán corre risco de não acontecer porque o governo ainda não transferiu os fundos necessários para cobrir os gastos com passagens, acomodações e logística. Em Mato Grosso do Sul, a Polícia Militar encontrou uma soldado morta no alojamento militar do 6º Batalhão em Corumbá.", "meio_ambiente": "O COP31, evento da ONU sobre clima, se estendeu além do prazo oficial sem chegar a um consenso sobre combustíveis fósseis, refletindo divergências sobre recursos para adaptação climática e a linguagem do texto final. No Brasil, Lula anunciou a adoção de uma gasolina com 30% de etanol a partir de agosto de 2025, mas a demora na atualização da legislação resulta em prejuízos para a sociedade. O fenômeno El Niño afeta o estado de São Paulo, com especialistas prevendo que os efeitos se estenderão por algum tempo. As cidades costeiras da Califórnia do Sul enfrentam danos devido a níveis de mar elevados e praias que estão desaparecendo. Um nadador britânico percorreu o Estreito de Ormuz em três dias para chamar a atenção para o impacto ambiental causado pelo conflito entre Irã e Estados Unidos, enfatizando a beleza natural do local e pedindo para que as hostilidades parassem e a contaminação fosse limpa para preservar o ecossistema.", "direitos_humanos": "O julgamento que estabeleceu a possibilidade de intenção genocida coexistir com um objetivo militar pode fortalecer o caso de Gaza contra Israel, conforme informado pelo The Japan Times. Em outro desenvolvimento, a Suprema Corte do Chile desmontou a 'doctrina Rabat', segundo relatos do CIPER Chile. No Brasil, uma empresa foi condenada a pagar R$ 15 mil de indenização a um auxiliar de limpeza que sofreu racismo, incluindo ofensas comparando negros a macacos, em um ambiente escolar, conforme relatado pela CNN Brasil. No exterior, o Senado francês aprovou uma lei que presume que policiais que usam armas estão agindo legalmente, com votos de 205 a 110, enquanto três policiais franceses foram condenados por um ataque racista contra o produtor musical Michel Zecler em 2020, segundo o Al Jazeera. Nos Estados Unidos, o Condado de Travis, no Texas, firmou um acordo com o ICE, permitindo que um oficial carcelário execute ordens migratórias civis dentro da prisão, conforme informado pela Metropoles. No Vietnã, asiáticas americanas enfrentam consequências do escândalo envolvendo a Nvidia, afetando especialmente as mulheres, informa o Taipei Times. No Chile, a Suprema Corte desmontou a 'doctrina Rabat', enquanto no Brasil, uma enquete discute o tema do racismo, conforme o Variety. O Senado francês aprovou uma lei que concede aos policiais um benefício de dúvida no caso de mortes por disparos, a menos que haja provas contrárias, aprovando a lei com críticas de parlamentares de esquerda, de acordo com o Le Monde."}, "resumo_do_dia": {"politica_nacional": [{"id": 279015, "titulo": "Ex-presidente Jair Bolsonaro está internado em UTI no Distrito Federal", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/ex-presidente-jair-bolsonaro-esta-internado-em-uti-no-distrito-federal", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-21T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro está internado em uma unidade de terapia intensiva no Hospital DF Star, em Brasília, com diagnóstico de abdômen agudo obstrutivo. Ele encontra-se estável clinicamente, mas não há previsão de alta hospitalar.", "titulo_pt": "Ex-presidente Jair Bolsonaro internado em UTI no Distrito Federal", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 279049, "titulo": "Lula diz que mercado financeiro não vai ensiná-lo a governar", "url": "https://www.poder360.com.br/poder-governo/lula-diz-que-mercado-financeiro-nao-vai-ensina-lo-a-governar/", "fonte_id": "poder360", "data_pub": "2026-11-21T17:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula criticou os agentes do mercado financeiro, chamando-os de 'yuppies', e afirmou que pretende aumentar a participação popular no planejamento orçamentário.", "titulo_pt": "Lula critica mercado financeiro e promete maior participação popular no orçamento", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 279050, "titulo": "Jair Bolsonaro trata obstrução intestinal na UTI em Brasília", "url": "https://www.poder360.com.br/poder-justica/jair-bolsonaro-trata-obstrucao-intestinal-na-uti-em-brasilia/", "fonte_id": "poder360", "data_pub": "2026-11-21T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro está em uma Unidade de Terapia Intensiva (UTI) em Brasília, em condição estável e consciente, respirando sem aparelhos. A equipe médica mantém um jejum e uma sonda gástrica.", "titulo_pt": "Jair Bolsonaro trata obstrução intestinal em UTI em Brasília", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 279260, "titulo": "Senado aprova ajuste de fachada nos supersalários e preserva blindagem orçamentária", "url": "https://www.jota.info/opiniao-e-analise/artigos/senado-aprova-ajuste-de-fachada-nos-supersalarios-e-preserva-blindagem-orcamentaria", "fonte_id": "jota", "data_pub": "2026-11-21T17:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou uma medida que permite a inclusão de pagamentos acima do teto salarial sem que isso reduza a despesa orçamentária da União. A lei mantém a blindagem orçamentária, protegendo gastos acima do teto salarial dos cortes orçamentários.", "titulo_pt": "Senado aprova ajuste de fachada nos supersalários e mantém blindagem orçamentária", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 279052, "titulo": "Lula diz ficar triste com críticas da esquerda ao ajuste fiscal", "url": "https://www.poder360.com.br/poder-governo/lula-diz-ficar-triste-com-criticas-da-esquerda-ao-ajuste-fiscal/", "fonte_id": "poder360", "data_pub": "2026-11-21T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula expressou tristeza com as críticas da esquerda ao ajuste fiscal, afirmando que elas se concentraram em cortes que não serão realizados. O presidente defendeu a proposta apresentada.", "titulo_pt": "Lula se sente triste com críticas da esquerda ao ajuste fiscal", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 279018, "titulo": "Morre Joe Wallach, um dos fundadores da Globo e da Globosat, aos 103 anos", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/11/morre-joe-wallach-um-dos-fundadores-da-globo-e-da-globosat-aos-103-anos.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-21T17:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Joe Wallach, um dos fundadores da Globo e da Globosat, faleceu aos 103 anos em Los Angeles, EUA, no fim de semana. Ele foi um importante empresário e executivo de TV radicado no Brasil desde 1965.", "titulo_pt": "Mourre Joe Wallach, um dos fundadores da Globo e da Globosat, aos 103 anos", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 279016, "titulo": "\"O sistema financeiro não vai me ensinar a dirigir o Brasil\", diz Lula", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-11/o-sistema-financeiro-nao-vai-me-ensinar-dirigir-o-brasil-diz-lula", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-11-21T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente Luiz Inácio Lula da Silva defendeu o projeto de ajuste fiscal durante uma live nas redes sociais, criticando o mercado financeiro por questionar a seriedade do governo no trato com o gasto público. O texto do ajuste foi aprovado pelo Senado e segue para análise na Câmara dos Deputados.", "titulo_pt": "O sistema financeiro não vai me ensinar a dirigir o Brasil", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 279029, "titulo": "Moraes autoriza Bolsonaro a receber visitas diárias dos filhos durante internação, mas proíbe celulares", "url": "https://www.cartacapital.com.br/politica/moraes-autoriza-bolsonaro-a-receber-visitas-diarias-dos-filhos-durante-internacao-mas-proibe-celulares/", "fonte_id": "cartacapital", "data_pub": "2026-11-21T17:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Jair Bolsonaro foi autorizado a receber visitas diárias dos filhos durante sua internação, mas não pode usar celulares. Ele foi hospitalizado na sexta-feira com dores abdominais.", "titulo_pt": "Moraes autoriza Bolsonaro a receber visitas diárias dos filhos durante internação, mas proíbe celulares", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 279138, "titulo": "Lula ainda reflete sobre novo time da Esplanada, mas Itamaraty parece já ter ‘dono’", "url": "https://veja.abril.com.br/politica/lula-ainda-reflete-sobre-novo-time-da-esplanada-mas-itamaraty-parece-ja-ter-dono/", "fonte_id": "veja", "data_pub": "2026-11-21T17:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O atual secretário de Clima, Energia e Meio Ambiente do MRE, embaixador Mauricio Lyrio, estaria pronto para assumir o cargo de ministro do Itamaraty, substituindo Mauro Vieira. Lula ainda reflete sobre as indicações para o novo time governamental, mas o Itamaraty parece já ter seu 'dono' definido.", "titulo_pt": "Lula reflete sobre novo time da Esplanada, mas Itamaraty já teria 'dono'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 279053, "titulo": "Votação da PEC da autonomia do BC ficará para 2027", "url": "https://www.poder360.com.br/poder-economia/votacao-da-pec-de-autonomia-do-bc-ficara-para-2027/", "fonte_id": "poder360", "data_pub": "2026-11-21T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A votação da Proposta de Emenda à Constituição (PEC) que garante a autonomia do Banco Central será postergada para 2027. Articuladores no Senado e Galípolo sugerem que o Congresso mais à direita e a menor disputa política podem facilitar a aprovação do projeto.", "titulo_pt": "Votação da PEC da autonomia do BC ficará para 2027", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 279054, "titulo": "Diretor de Regulação deve se aposentar do BC, mas permanecer na cúpula", "url": "https://www.poder360.com.br/poder-economia/diretor-de-regulacao-deve-se-aposentar-do-bc-mas-permanecer-na-cupula/", "fonte_id": "poder360", "data_pub": "2026-11-21T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Gilneu Vivan pode se aposentar do funcionalismo público em 2027, mas permanecer na diretoria do BC, evitando uma nova indicação por parte do presidente Lula.", "titulo_pt": "Diretor de Regulação do BC pode se aposentar em 2027, mas continuar na cúpula", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 279055, "titulo": "Galípolo perde influência para as próximas escolhas da diretoria do BC", "url": "https://www.poder360.com.br/poder-economia/galipolo-perde-influencia-para-as-proximas-escolhas-da-diretoria-do-bc/", "fonte_id": "poder360", "data_pub": "2026-11-21T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do Banco Central (BC) perde influência nas próximas indicações para a diretoria do BC, devido ao desgaste na relação com o governo e à mudança no comando da Fazenda.", "titulo_pt": "Galípolo perde influência para as próximas escolhas da diretoria do BC", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 279056, "titulo": "Violência dificulta combate a surto de ebola na RD Congo, diz ONU", "url": "https://www.poder360.com.br/poder-saude/violencia-dificulta-combate-a-surto-de-ebola-na-rd-congo-diz-onu/", "fonte_id": "poder360", "data_pub": "2026-11-21T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Organização das Nações Unidas (ONU) relata que a violência está dificultando o combate ao surto de Ebola na República Democrática do Congo. Até o momento, a epidemia já deixou 5.400 mortos e afeta crianças em oito províncias, com ataques a serviços de saúde.", "titulo_pt": "Violência dificulta combate ao surto de ebola na RD Congo, diz ONU", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 279057, "titulo": "Crítico dos juros elevados, Lula pode reformular BC; saiba os cotados", "url": "https://www.poder360.com.br/poder-economia/critico-dos-juros-elevados-lula-pode-reformular-bc-saiba-os-cotados/", "fonte_id": "poder360", "data_pub": "2026-11-21T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente pode indicar até quatro nomes para diretores do Banco Central em 2027. Lula, crítico dos juros elevados, pode reformular oBC com essas indicações.", "titulo_pt": "Crítico dos juros elevados, Lula pode reformular BC; saiba os cotados", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 279159, "titulo": "TCU aponta falhas do governo para enfrentar secas e enchentes no Brasil", "url": "https://www.infomoney.com.br/brasil/tcu-aponta-falhas-do-governo-para-enfrentar-secas-e-enchentes-no-brasil/", "fonte_id": "infomoney", "data_pub": "2026-11-21T16:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Auditoria do TCU (Tribunal de Contas da União) identificou falhas no governo para lidar com secas e enchentes no Brasil, incluindo atrasos na revisão de planos, falta de coordenação entre ministérios e risco de desperdício de recursos em obras de segurança hídrica.", "titulo_pt": "TCU aponta falhas do governo para enfrentar secas e enchentes no Brasil", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 279058, "titulo": "Moraes autoriza visitas de familiares a Bolsonaro em hospital", "url": "https://www.poder360.com.br/poder-justica/moraes-autoriza-visitas-de-familiares-a-bolsonaro-em-hospital/", "fonte_id": "poder360", "data_pub": "2026-11-21T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz federal Sergio Morais autorizou visitas de familiares ao ex-presidente Jair Bolsonaro, que está internado em um hospital desde a sexta-feira devido a dores abdominais e um quadro de obstrução.", "titulo_pt": "Moraes autoriza visitas de familiares a Bolsonaro em hospital", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 279504, "titulo": "Houthis launch strikes after coalition operation", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/22/2003868169", "fonte_id": "taipei_times", "data_pub": "2026-11-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças houthis realizaram ataques após uma operação da coalizão.", lia)", "pais": "Itália", "classe": "A"}, {"id": 279305, "titulo": "Alleged Mexican drug cartel boss ‘El Chapo Isidro’ arrested in special forces raid", "url": "https://www.theguardian.com/world/2026/nov/21/alleged-mexican-drug-cartel-boss-el-chapo-isidro-meza-flores-arrested", "fonte_id": "guardian_world", "data_pub": "2026-11-21T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mexicano Fausto Isidro Meza Flores, conhecido como 'El Chapo Isidro', foi capturado durante uma operação especial das forças armadas mexicanas na cidade de Guasave, no estado de Sinaloa. Ele era um dos dez mais procurados pela FBI e havia evitado a captura por mais de uma década.", "titulo_pt": "Suspeito do cartel mexicano 'El Chapo Isidro' é preso em operação especial no sinaloa", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 279288, "titulo": "Estados Unidos celebra la detención del Chapo Isidro y felicita a las autoridades mexicanas", "url": "https://elpais.com/us/2026-11-21/estados-unidos-celebra-la-detencion-del-chapo-isidro-y-felicita-a-las-autoridades-mexicanas.html", "fonte_id": "elpais_america", "data_pub": "2026-11-21T17:41:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A agência antidrogas dos Estados Unidos celebra a detenção do Chapo Isidro e elogia as autoridades mexicanas pelo trabalho conjunto que visa identificar líderes de cartéis.", "titulo_pt": "EUA comemoram detenção do Chapo Isidro e felicitam autoridades mexicanas", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 279009, "titulo": "Sacos para cadáveres e guerra contra o wokismo: os primeiros 100 dias do novo presidente da Colômbia", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/11/sacos-para-cadaveres-e-guerra-contra-o-wokismo-os-primeiros-100-dias-do-novo-presidente-da-colombia.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-11-21T17:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em seus primeiros 100 dias como presidente da Colômbia, Abelardo de la Espriella demonstrou interesse em controvérsias, como já fazia quando era advogado de acusados de tráfico de drogas e lavagem de dinheiro. Ele atuava aceitando casos polêmicos que lhe causavam vertigem.", "titulo_pt": "Sacos para cadáveres e guerra contra o wokismo: os primeiros 100 dias do novo presidente da Colômbia", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 279391, "titulo": "COP31: Deep divisions persist over energy, finance and science", "url": "https://www.france24.com/en/cop31-deep-divisions-persist-over-energy-finance-and-science", "fonte_id": "france24", "data_pub": "2026-11-21T17:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As negociações do COP31 em Turquia sobre mudanças climáticas estão em sessões extras devido a divisões profundas sobre combustíveis fósseis, financiamento climático e metas de aquecimento global. Desacordos persistem sobre um alvo global de eletrificação, captura de carbono e relatórios futuros de ciência climática da ONU. Desenvolvedores de países expressaram frustração com a remoção de um objetivo de financiamento de adaptação climática no valor de 120 bilhões de dólares.", "titulo_pt": "Divisões profundas persistem nas negociações COP31 sobre energia, financiamento e ciência", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 279392, "titulo": "FBI criminal database hacked", "url": "https://www.france24.com/en/fbi-criminal-database-hacked", "fonte_id": "france24", "data_pub": "2026-11-21T17:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O FBI está investigando um suposto ataque cibernético de grande escala que alvejou sua base de dados nacional de polícia, o National Crime Information Center (NCIC), que armazena registros sensíveis do sistema de justiça criminal, incluindo informações sobre fugitivos, pessoas desaparecidas, antecedentes criminais e propriedades roubadas. O presidente Donald Trump foi informado sobre o incidente e descreveu-o como 'ruim'.", "titulo_pt": "Base de dados do FBI alvo de suposto ataque cibernético", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 279393, "titulo": "Man convicted of starting palisades fire", "url": "https://www.france24.com/en/man-convicted-of-starting-palisades-fire", "fonte_id": "france24", "data_pub": "2026-11-21T17:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um júri de Los Angeles County condenou Jonathan Rinderknecht, ex-condutor de aplicativo de transporte, por iniciar o incêndio Palisades de 2025, que causou destruição em larga escala e perdas de vidas. Ele enfrenta uma pena de prisão entre cinco e 40 anos.", "titulo_pt": "Homem condenado pelo incêndio palisades", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 279438, "titulo": "Russian strike kills two, wounds 60, in Zelenskyy’s hometown", "url": "https://www.aljazeera.com/news/2026/11/21/russian-strike-kills-two-wounds-60-in-zelenskyys-hometown?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-21T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque russo em Kryvyi Rih resultou em duas mortes e 60 feridos. Simultaneamente, mísseis russos atingiram a NATO membro Polônia e os esforços de paz liderados pelos Estados Unidos enfrentam incertezas.", "titulo_pt": "Rotação de strike mata dois, ferindo 60, em cidade natal de Zelenskyy", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 279422, "titulo": "Russian helicopter suspected of violating Finnish airspace", "url": "https://www.dw.com/en/russian-helicopter-suspected-of-violating-finnish-airspace/a-80010133?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-11-21T17:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministério da Defesa finlandês suspeita que um helicóptero russo tenha violado o espaço aéreo finlandês, possivelmente em relação a um ataque com drone a um navio de carga russo que está na lista de sanções dos EUA.", "titulo_pt": "Helicóptero russo suspeito de violar espaço aéreo finlandês", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 279416, "titulo": "Latest news bulletin | November 21st, 2026 – Evening", "url": "https://www.euronews.com/video/2026/11/21/latest-news-bulletin-november-21st-2026-evening", "fonte_id": "euronews", "data_pub": "2026-11-21T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório noticiário de 21 de novembro de 2026 abrange as principais notícias da Europa e do mundo nas categorias de Mundo, Negócios, Entretenimento, Política, Cultura e Viagens.", "titulo_pt": "Boletim de notícias mais importantes do dia 21 de novembro de 2026 - tarde", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 279596, "titulo": "Senegal’s farmers are working on climate change’s front line", "url": "https://www.washingtonpost.com/world/interactive/2026/11/21/senegals-farmers-are-working-climate-changes-front-line/", "fonte_id": "washington_post_world", "data_pub": "2026-11-21T16:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma parte da África onde as temperaturas estão aumentando mais rapidamente do que o resto do mundo, as pessoas estão se adaptando. No entanto, o futuro permanece incerto.", "titulo_pt": "Os agricultores do senegal estão na linha de frente do combate ao aquecimento global", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 279289, "titulo": "Muere Paolo Bulgari, el joyero que llevó el lujo italiano al mundo, a los 89 años", "url": "https://elpais.com/gente/2026-11-21/muere-paolo-bulgari-presidente-de-la-firma-de-joyas-italiana-bvlgari-a-los-89-anos.html", "fonte_id": "elpais_america", "data_pub": "2026-11-21T16:47:00Z", "idioma": "es", "provavel_duplicata_de": null,
