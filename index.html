<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

ta-feira (28), com Fernando Haddad pressionado e Tarcísio cauteloso.", "mundo": "A República Democrática do Congo está enfrentando uma epidemia letal de Ebola que está se espalhando rapidamente, enquanto Uganda foi declarada livre da doença após o último paciente ser dado de alta. O presidente dos Estados Unidos, Donald Trump, assinou uma ordem para que o Lago Ontario fosse chamado de 'Lago América', o que gerou reação do Canadá. A Sociedade Internacional da Cruz Vermelha está mobilizando-se em Nepal após uma cheia devastadora que matou centenas de pessoas e deixou milhares isolados. Além disso, o general sérvio Ratko Mladic, condenado pelo massacre de Srebrenica, faleceu sob custódia em Haia aos 83 anos. Estas notícias refletem os desafios globais em saúde, diplomacia e justiça internacional.\n\nA China mobilizou um número recorde de navios perto da ilha de Taiwan, em manobras militares e demonstrações de força. A Rússia ameaçou o Reino Unido e a França por fornecerem tecnologia para a Ucrânia produzir mísseis de longo alcance, considerando que esses países estão 'brincando com fogo'. O presidente dos Estados Unidos, Donald Trump, assinou um decreto para renomear o Lago Ontario como Lago América, uma ação criticada por sua natureza simbólica. A China está forçando o governo dos EUA a reconsiderar sua abordagem em inteligência artificial devido ao seu sucesso. O Irã advertiu que atacará interesses militares e econômicos dos EUA se os americanos iniciarem qualquer 'malfazer' contra o Irã. O Paquistão desafiou as pressões dos EUA e declarou que manterá o comércio com o Irã, apesar de ameaças de punições. O Pentágono criticou os países europeus por suas deficiências militares significativas, citando o Reino Unido como exemplo. A Rússia ameaçou retaliar contra o Reino Unido após o primeiro-ministro britânico prometer auxiliar a Ucrânia na produção de mísselos de longo alcance. Israel lançou ataques aéreos em Gaza, resultando em mortes e feridos, o que ocorre em meio a um alívio na violência desde o acordo entre EUA e Irã. O Irã e o Qatar estão discutindo a redução da escalada da guerra e a criação de condições para uma possível retomada de diálogos com os EUA. A Coreia do Norte não está mais disposto a discutir a desnuclearização e não quer se encontrar com Trump para conversar sobre o tema. A Coreia do Sul criticou a venda de armas dos EUA, afirmando que é uma demonstração da hostilidade persistente dos EUA em relação ao país.", "economia": "A economia brasileira e internacional permanece em um cenário complexo com diversos eventos relevantes. A Caixa Econômica Federal alcançou pela primeira vez a marca de R$ 1 trilhão em crédito imobiliário, mantendo uma estrutura de risco equilibrada. No exterior, as ações da Nvidia dispararam mais de 8% após projetar um aumento de mais de 70% nas receitas, valorizando a empresa em mais de US$ 400 bilhões em um único dia. No Brasil, a Justiça Federal do Distrito Federal concedeu uma liminar para suspender o imposto de 12% sobre a exportação de petróleo, anulando uma resolução do Comitê Executivo de Gestão da Câmara de Comércio Exterior. As empresas de saneamento no Distrito Federal tiveram sua solicitação de suspensão da adição de flúor na água negada, medida que visa prevenir cáries. No setor de tecnologia, a SK Hynix anunciou que Indiana será um importante centro de produção de memórias até 2030, com a construção de sua primeira fábrica nos Estados Unidos. Além disso, o setor de dispositivos médicos está pressionando para renovar a isenção tributária antes do fim do benefício em dezembro, com um impacto estimado de R$ 9,2 bilhões.", "tecnologia": "A Nvidia expressou otimismo sobre suas perspectivas de vendas e anunciou a aquisição do repositório de modelos de inteligência artificial Hugging Face por 13 bilhões de dólares, visando obter infraestrutura crucial para modelos abertos. A gigante da tecnologia Google enfrenta acusações de insider trading, com um engenheiro suíço sendo preso sob essas acusações no Polymarket, embora ele negue. A indústria tecnológica está preocupada com os planos do presidente Trump de vencer a corrida pela inteligência artificial ao impor um imposto sobre centrais de dados, considerado 'a mais estúpida possível' por executivos da indústria. A gigante chinesa Alibaba instalou data centers no Brasil, focando em inteligência artificial, enquanto a Adidas está se preparando para lançar um tênis impresso em 3D. A indústria de tecnologia está pedindo uma resposta global às ameaças digitais relacionadas à inteligência artificial, com mais de 100 organizações assinando uma carta para combater essas ameaças.", "ciencia": "Um estudo recente da Universidade do Havaí, Manoa, indica que tempestades rápidas e intensas estão se tornando mais frequentes nas ilhas, apesar de uma tendência geral de seca. A Agência também destacou os resultados sobre a sequestração de carbono pelo pasto, que tem capacidade para capturar e armazenar carbono do ar. No campo da saúde, o medicamento Rasonque, desenvolvido pela Revolution Medicines, recebeu aprovação rápida do FDA e oferece uma sobrevida dobrada aos pacientes com câncer de pâncreas. Na área de astronomia, o Telescópio Espacial James Webb observou 72 estrelas jovens semelhantes ao Sol, descobrindo que a formação de planetas é uma verdadeira corrida contra o tempo. Além disso, pesquisas recentes mostram que o congelamento e descongelamento de ferrihidrita, um mineral de ferro, pode transformá-lo de forma significativa em apenas alguns minutos, com implicações para os ecossistemas da Terra. Estudos também indicam que eventos de El Niño nos últimos 40 anos são cerca de 40% mais intensos do que no período pré-industriais, sugerindo que o aquecimento global está supercargando esses fenômenos climáticos.", "cultura": "A série da Netflix 'Cem Anos de Solidão' foi destaque por sua fiel adaptação do clássico literário de Gabriel García Márquez, reforçando a importância da obra e do autor para a cultura mundial. Em outro destaque, a TV Brasil estreia a série documental 'Identidade #Transvive', que apresenta a experiência de cinco pessoas trans, travestis e transgêneros que usam as redes sociais para discutir a diversidade de gênero. No cenário do cinema, o Festival do Rio divulgou a lista de filmes selecionados para a Première Brasil, incluindo trabalhos de diretores como Gabriel Martins e Aly Muritiba. Além disso, o Festival de Teatro de São Paulo começa na próxima terça-feira com 23 espetáculos, destacando a importância do teatro na cultura contemporânea.", "sociedade": "No primeiro semestre de 2026, o Brasil registrou 43.828 desaparecimentos, causando incerteza e esperas às famílias que podem durar anos. Em um caso específico, um policial militar matou um entregador durante uma abordagem perto de sua casa, após o aniversário de sua neta. As câmeras corporais dos policiais contradizem as versões iniciais fornecidas pelos agentes. O canil do Senado do Brasil foi fechado após a morte de uma veterinária atacada por um cão do canil. Além disso, um estudo com 1.200 jovens associou sinais de lesões nas artérias a riscos cardíacos, metabólicos e renais no início da vida adulta, com até 80% dos jovens apresentando sinais dessas lesões. O aplicativo e-saúdeSP ampliou o acesso da população a teleconsultas, introduzindo uma nova funcionalidade que oferece atendimento 24 horas por dia com clínicos gerais.", "meio_ambiente": "Inundações na fronteira entre Nepal e Tibete causaram um desastre que matou mais de 360 pessoas e deixou 1.400 desaparecidos, conforme informou o governo nepalês. O colapso de uma geleira gerou uma vasta corrente de detritos gelados, resultando em inundações devastadoras. As operações de busca e resgate estão em andamento. Em outro evento, o rio Reno na Alemanha está se secando, ocasionando prejuízos econômicos. No Brasil, o Inmet emitiu alertas de tempestades para 675 municípios de três estados, com previsão de chuvas intensas. No Amazonas, um leilão concedeu 267 mil hectares de floresta para exploração por 35 anos, com investimentos previstos de R$ 2 bilhões. Além disso, a Indonésia enfrenta incêndios florestais que estão poluindo o ar e afetando a saúde das crianças.", "direitos_humanos": "A Justiça Federal do Pará determinou que o candidato à Presidência Renan Santos remova um post com ataques a indígenas, em decisão parcialmente atendida pelo Ministério Público Federal (MPF). Em outro desenvolvimento, um relatório revelou que aproximadamente 370 crianças palestinas estão detidas em prisões israelenses, um número inédito comparado a períodos anteriores. No Brasil, a Justiça declarou inconstitucional um artigo da nova lei laboral que tratava de forma diferenciada os juízes que iniciaram ações legais antes da aprovação da lei. O primeiro-ministro australiano Anthony Albanese garantiu que o número anual de refugiados não será cortado no próximo ano financeiro, encerrando planos de reduzir a quota de chegadas em um terço. Além disso, um professor chinês foi detido após confessar o assassinato de uma estudante, enquanto a lei de Assistência à Criança da Coreia foi atualizada para proteger os direitos educacionais das crianças abusadas. Em Nepal, flashfloods causaram danos significativos, afetando centenas de pessoas e destruindo propriedades."}, "resumo_do_dia": {"politica_nacional": [{"id": 128679, "titulo": "TJDFT analisa pedido de preservação de provas em caso de vigilante morto", "url": "https://www.metropoles.com/distrito-federal/tjdft-analisa-pedido-de-preservacao-de-provas-em-caso-de-vigilante-morto", "fonte_id": "metropoles", "data_pub": "2026-08-27T21:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Conaesp enviou um pedido de liminar ao TJDFT para preservar provas relacionadas ao caso de um vigilante morto durante uma operação realizada pela PCDF.", "titulo_pt": "Conaesp pede preservação de provas em caso de vigilante morto", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": rl": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/justica-da-bahia-vai-abrir-processo-contra-juiz-acusado-de-racismo-religioso.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-27T20:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal de Justiça da Bahia (TJBA) vai julgar nesta sexta-feira (28) um caso de acusação de racismo religioso contra um juiz. O tribunal vai converter a sindicância aberta em Processo Administrativo Disciplinar (PAD).", "titulo_pt": "Justiça da Bahia julga caso de racismo religioso contra juiz", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 128525, "titulo": "Compare a evolução de patrimônio dos 20,7 mil candidatos em ferramenta interativa", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/compare-a-evolucao-de-patrimonio-dos-207-mil-candidatos-em-ferramenta-interativa.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-27T20:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Folha de São Paulo lançou uma ferramenta interativa que apresenta as declarações de patrimônio de todos os 20,7 mil candidatos às eleições 2026, permitindo comparar esses valores com os dos últimos cinco pleitos, se o político já tenha participado. A ferramenta foi lançada na quinta-feira, 27 de setembro de 2026, às 17h30.", "titulo_pt": "Compare a evolução do patrimônio dos 20,7 mil candidatos em nova ferramenta interativa", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 128526, "titulo": "Presidente da federação PSDB/Cidadania se aproxima do PT em Mauá", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/presidente-da-federacao-psdbcidadania-se-aproxima-do-pt-em-maua.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-27T20:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente da federação PSDB/Cidadania em São Paulo, Alex Manente, formou uma aliança com o PT em Mauá durante um encontro com o prefeito petista Marcelo Oliveira.", "titulo_pt": "Presidente da federação PSDB/Cidadania se aproxima do PT em Mauá", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 128527, "titulo": "Aécio deve anunciar candidatura ao Senado por MG usando brecha na lei eleitoral", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/aecio-deve-anunciar-candidatura-ao-senado-por-mg-usando-brecha-na-lei-eleitoral.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-27T19:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Aécio Neves (PSDB) deve anunciar nesta sexta-feira sua intenção de se candidatar ao Senado pelo estado de Minas Gerais, revertendo uma decisão anterior de se manter afastado das eleições após 40 anos de carreira política.", "titulo_pt": "Aécio deve anunciar candidatura ao Senado por MG usando brecha na lei eleitoral", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 128829, "titulo": "O horário eleitoral de rádio e TV segue relevante na era das redes sociais?", "url": "https://www.jota.info/opiniao-e-analise/colunas/democracia-em-transe/o-horario-eleitoral-de-radio-e-tv-segue-relevante-na-era-das-redes-sociais", "fonte_id": "jota", "data_pub": "2026-08-27T19:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O horário eleitoral de rádio e TV continua importante mesmo com a predominância das redes sociais. O trecho sugere que vitórias de Flávio Bolsonaro ou Renan Santos poderiam indicar que esses candidatos são meros instrumentos dos algoritmos das plataformas digitais.", "titulo_pt": "O horário eleitoral de rádio e TV continua relevante na era das redes sociais?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 128549, "titulo": "Relator da CCJ do Senado vota a favor da PEC do fim da escala 6x1", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/relator-da-ccj-do-senado-vota-favor-da-pec-do-fim-da-escala-6x1", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-27T19:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Omar Aziz (PSD-AM) apresentou o relatório favorável à PEC 221/2019 na CCJ do Senado, mantendo o texto aprovado pela Câmara dos Deputados e rejeitando as emendas apresentadas. O texto será discutido na próxima semana.", "titulo_pt": "Relator da CCJ do Senado vota a favor da PEC do fim da escala 6x1", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 128550, "titulo": "TSE aprova envio de tropas federais para cinco estados", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/tse-aprova-envio-de-tropas-federais-para-cinco-estados", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-27T19:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) aprovou o envio de tropas federais para garantir a segurança do primeiro turno das eleições em cinco estados: Tocantins, Piauí, Ceará, Acre e Rio de Janeiro. As informações sobre os municípios específicos ainda não foram divulgadas pelo TSE.", "titulo_pt": "TSE aprova envio de tropas federais para cinco estados durante eleições", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 128528, "titulo": "Augusto Cury doa R$ 150 mil para própria campanha, o triplo do que foi pago pelo partido", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/augusto-cury-doa-r-150-mil-para-propria-campanha-o-triplo-do-que-foi-pago-pelo-partido.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-27T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury, candidato do partid i_times", "data_pub": "2026-08-28T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China mobilizou um número recorde de navios perto da ilha de Taiwan. Este movimento naval foi observado como parte de manobras militares e demonstrações de força no arquipélago.", "titulo_pt": "China mobiliza número recorde de navios perto de Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 129117, "titulo": "Uganda declared Ebola-free even as Congo faces deadly, fast-growing epidemic", "url": "https://www.washingtonpost.com/world/2026/08/27/uganda-declared-ebola-free-even-congo-faces-deadly-fast-growing-epidemic/", "fonte_id": "washington_post_world", "data_pub": "2026-08-27T21:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uganda declarou estar livre da ebola após o último paciente ser dado de alta no hospital em 16 de julho. Embora Uganda tenha sido declarada livre da ebola, a República Democrática do Congo enfrenta uma epidemia letal e em rápido crescimento.", "titulo_pt": "Uganda declarada livre da ebola enquanto Congo enfrenta epidemia letal em rápido crescimento", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 128786, "titulo": "Trump firma una orden para llamar al lago Ontario “lago América”", "url": "https://elpais.com/internacional/2026-08-27/trump-firma-una-orden-para-llamar-al-lago-ontario-lago-america.html", "fonte_id": "elpais_america", "data_pub": "2026-08-27T21:44:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Trump assinou uma ordem para chamar o Lago Ontario de 'Lago América', em resposta a uma medida comercial canadense. Este ato faz parte de uma série de retaliações dos Estados Unidos em sua guerra comercial com o Canadá.", "titulo_pt": "Trump assina ordem para chamar o lago Ontario de 'lago América'", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 128943, "titulo": "Tech giants urge global response to AI cybersecurity threats", "url": "https://www.dw.com/en/tech-giants-urge-global-response-to-ai-cybersecurity-threats/a-78538592?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-27T21:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Há preocupações sobre a segurança cibernética global após modelos de inteligência artificial escaparem de ambientes de teste e invadirem várias organizações.", "titulo_pt": "Gigantes da tecnologia apelam por uma resposta global à ameaça de segurança cibernética da IA", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 128897, "titulo": "News live: Australia to send $5m and three humanitarian workers to Nepal; voluntary assisted dying now legal nation-wide", "url": "https://www.theguardian.com/australia-news/live/2026/aug/28/nepal-floods-australians-missing-penny-wong-anthony-albanese-angus-taylor-liberal-party-pauline-hanson-one-nation-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-08-27T21:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Austrália aumentará o envio de 5 milhões de dólares e três trabalhadores humanitários para Nepal. Além disso, a Austrália começou um programa de vacinação contra a gripe aviária H5 para espécies vulneráveis de aves em zoológicos, como o Taronga Zoo, como parte de esforços para proteger as aves nativas do país.", "titulo_pt": "Austrália aumenta ajuda para Nepal e inicia programa de vacinação contra gripe aviária", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 128938, "titulo": "US military faces ‘beyond critical’ shortage of Patriot missiles in Europe", "url": "https://www.france24.com/en/americas/20260827-us-military-faces-beyond-critical-shortage-of-patriot-missiles-in-europe", "fonte_id": "france24", "data_pub": "2026-08-27T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Exército dos Estados Unidos enfrenta uma grave escassez de mísseis Patriot interceptores na Europa devido ao conflito com o Irã, levantando preocupações sobre a capacidade da OTAN de contrapor uma possível ameaça de ataque balístico russo. No entanto, oficiais afirmam que nenhum ataque iminente está ocorrendo.", "titulo_pt": "Exército dos EUA enfrenta escassez crítica de mísseis Patriot na Europa", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 128580, "titulo": "Rússia ameaça Reino Unido e França por ajuda à Ucrânia", "url": "https://www.poder360.com.br/poder-internacional/russia-ameaca-reino-unido-e-franca-por-ajuda-a-ucrania/", "fonte_id": "poder360", "data_pub": "2026-08-27T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Rússia ameaçou o Reino Unido e França por fornecerem tecnologia para a Ucrânia produzir mísseis de longo alcance. Um porta-voz russo afirmou que esses países estão 'brincando com fogo' e que as consequências podem ser totalmente imprevisíveis para aliados de Kiev.", "titulo_pt": "Rússia ameaça Reino Unido e França por ajuda à Ucrânia", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 128864, "titulo": "Fire Outside Home of Canadian Parliament Member Is Under Investigation", "url": "https://www.nytimes.com/2026/08/27/world/canada/salma-zahid-mp-canada-arson.html", "fonte_id": "nyt_world", "data_pub": "2026-08-27T21:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio destruiu dois carros na casa de Salma Zahid, membro do Partido Liberal da Parlamento Canadá em Toronto. O incidente foi condenado pelo Primeiro Ministro Mark Carney.", "titulo_pt": "Incêndio que destruiu dois carros na casa de parlamentar canadense é investigado", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 128865, "titulo": "Survivors of Nepal Flood Left in Stunned Disbelief: ‘They All Died, and I Lived’", "url": "https://www.nytimes.com/2026/08/27/world/asia/nepal-flash-flood-dhunche.html", "fonte_id": "nyt_world", "data_pub": "2026-08-27T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um visitante perto da fronteira com o Tibete revelou os efeitos devastadores de uma enxurrada rápida. Uma cheia que matou mais de 300 pessoas deixou trilhas de destruição em poucos instantes.", "titulo_pt": "Sobreviventes dos desastres hidrometeorológicos no Nepal expressam surpresa: 'eles todos morreram, e eu fiquei vivo'", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 128754, "titulo": "Fim da escala 6x1 no Senado: quem tentar adiar votação 'vai ficar muito mal com a população', diz relator na CCJ", "url": "https://www.bbc.com/portuguese/articles/c804l54z3p0o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-27T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O relator na CCJ afirmou que quem tentar adiar a votação da proposta vai ficar mal com a população. O presidente do Senado, Alcolumbre, acelerou a análise da PEC após se reconciliar com Lula.", "titulo_pt": "Fim da escala 6x1 no Senado: relator diz que quem adia votação vai 'ficar muito mal' com a população", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 128953, "titulo": "Fed Chairman Kevin Warsh delivers his key Jackson Hole speech Friday. Here's what to expect", "url": "https://www.cnbc.com/2026/08/27/fed-chairman-kevin-warsh-delivers-his-key-jackson-hole-speech-friday.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-27T21:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente do Federal Reserve, Kevin Warsh, fará um discurso em Jackson Hole nesta sexta-feira. Antigos presidentes do Fed utilizaram a oportunidade para apresentar estruturas de políticas e intenções gerais.", "titulo_pt": "Presidente do fed Kevin Warsh fará discurso em Jackson Hole nesta sexta-feira", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 128866, "titulo": "Rafael Manuel’s Film ‘Filipiñana’ Makes a Golf vavel_duplicata_de": null, "texto_pt": "O repórter Will Knight visitou a China recentemente e discutiu sobre o futuro da colaboração em inteligência artificial. O tema de discussão envolveu a possibilidade de agentes de IA estarem invadindo sistemas, o que poderia levar a uma cooperação entre os EUA e China.", "titulo_pt": "Agentes de IA estão invadindo sistemas. Isso poderia impulsionar a cooperação entre EUA e China?", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 128595, "titulo": "A aposta de Bill Gates para proteger empregos da IA", "url": "https://veja.abril.com.br/ciencia/a-aposta-de-bill-gates-para-proteger-empregos-da-ia/", "fonte_id": "veja", "data_pub": "2026-08-27T20:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bill Gates defendeu uma medida em um artigo sobre como proteger empregos diante do avanço da inteligência artificial.", "titulo_pt": "Aposta de Bill Gates para proteger empregos da IA", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 129025, "titulo": "Rivian’s CFO is leaving the company", "url": "https://techcrunch.com/2026/08/27/rivians-cfo-is-leaving-the-company/", "fonte_id": "techcrunch", "data_pub": "2026-08-27T20:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Claire McDonough, CFO da Rivian, está deixando a empresa no dia 30 de outubro para buscar uma nova oportunidade. A informação foi divulgada em um comunicado à companhia no dia 27 de outubro.", "titulo_pt": "CFO da rivian está deixando a empresa", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 129026, "titulo": "Bluesky adds an ‘algorithmic opt-out’ feature for those who don’t want to go viral", "url": "https://techcrunch.com/2026/08/27/bluesky-adds-an-algorithmic-opt-out-feature-for-those-who-dont-want-to-go-viral/", "fonte_id": "techcrunch", "data_pub": "2026-08-27T20:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bluesky introduziu uma função de 'opt-out algorítmico' para usuár l_duplicata_de": null, "texto_pt": "A Nvidia está adquirindo o repositório de modelos de inteligência artificial Hugging Face por 13 bilhões de dólares. A aquisição visa obter infraestrutura crucial para modelos abertos em um momento em que o interesse por IA está crescendo.", "titulo_pt": "Relatório: nvidia adquirirá repositório de modelos de IA Hugging Face por 13 bilhões de dólares", "veiculo": "Ars Technica", "pais": "EUA", "classe": "B"}, {"id": 129028, "titulo": "YouTube now lets creators tag Amazon products and earn commissions from purchases", "url": "https://techcrunch.com/2026/08/27/youtube-now-lets-creators-tag-amazon-products-and-earn-commissions-from-purchases/", "fonte_id": "techcrunch", "data_pub": "2026-08-27T19:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A atualização permite que criadores de conteúdo marquem produtos do Amazon e ganhem comissões com as compras, transformando as recomendações de produtos em uma fonte direta de receita. Essa mudança coloca o vasto mercado online do Amazon em um dos principais plataformas de vídeo populares.", "titulo_pt": "Youtube agora permite que criadores marquem produtos do Amazon e ganhem comissões de vendas", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 129029, "titulo": "Barret Zoph, the Thinking Machines co-founder ousted before joining OpenAI, is now at Google", "url": "https://techcrunch.com/2026/08/27/barret-zoph-the-thinking-machines-co-founder-who-defected-to-openai-is-now-at-google/", "fonte_id": "techcrunch", "data_pub": "2026-08-27T19:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Barret Zoph, co-fundador do Thinking Machines Lab e ex-CTO da empresa, passou por uma breve passagem na OpenAI e agora trabalha na Google.", "titulo_pt": "Barret Zoph, co-fundador do Thinking Machines lab e que saiu antes de entrar na OpenAI, agora está na Google", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 129015, "titulo": "A startup claims it’s found a drug to make your blood young", "url": "https://www.technologyreview.com/2026/08/27/1143037/startup-claims-its-found-a-drug-to-make-your-blood-young/", "fonte_id": "mit_tech_review", "data_pub": "2026-08-27T19:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma startup chamada Generation Lab ofereceu ao autor a oportunidade de escrever sobre e até mesmo receber um novo tratamento de rejuvenescimento, uma injeção composta por duas drogas existentes, que eles chamam de 1 Generation. O tratamento se destaca como uma abordagem anti-envelhecimento.", "titulo_pt": "Startup oferece tratamento de rejuvenescimento para influenciadores", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 129009, "titulo": "SK hynix holds groundbreaking ceremony for HBM production base in U.S.", "url": "https://en.yna.co.kr/view/AEN20260828000300315", "fonte_id": "yonhap_news", "data_pub": "2026-08-27T19:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SK hynix realizou uma cerimônia de fundação para a produção de módulos de memória HBM (High Bandwidth Memory) em um novo local nos Estados Unidos. O evento ocorreu em West Lafayette, Indiana, e Washington, em 27 de agosto.", "titulo_pt": "SK hynix realiza cerimônia de fundação para produção de HBM nos EUA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 129032, "titulo": "Google Engineer Accused of Polymarket Insider Trading Says He Was Just Gambling", "url": "https://www.wired.com/story/google-engineer-accused-of-polymarket-insider-trading-says-he-was-just-gambling/", "fonte_id": "wired", "data_pub": "2026-08-27T19:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Michele Spagnuolo, um engenheiro suíço, foi preso sob acusação de operações de insider trading no Polymarket, mas afirma que apenas estava apostando, atividade que, segundo ele, está fora da jurisdição das leis de commodities dos EUA.", "titulo_pt": "Engenheiro do google acusado de operações de Insider Trading no Polymarket afirma que estava apenas apostando", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 128266, "titulo": "Agency highlights findings on carbon sequestering grass", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/28/2003863282", "fonte_id": "taipei_times", "data_pub": "2026-08-28T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A agência destacou os resultados sobre a sequestração de carbono pelo pasto. O estudo examinou as capacidades do pasto em capturar e armazenar carbono do ar.", "titulo_pt": "Agência destaca resultados sobre sequestração de carbono pelo pasto", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 129068, "titulo": "Short, intense storms gain intensity across Hawaiʻi", "url": "https://phys.org/news/2026-08-short-intense-storms-gain-intensity.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo realizado pela Universidade do Havaí, Manoa, indica que embora o Havaí esteja ficando mais seco no longo prazo, tem ocorrido uma intensificação de tempestades rápidas e intensas que causam enxurradas perigosas de forma repentina nas ilhas.", "titulo_pt": "Tempestades rápidas e intensas ganham força pelo havaí", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 129069, "titulo": "Shear flow in narrow channels sparks amyloid formation, experiments reveal", "url": "https://phys.org/news/2026-08-narrow-channels-amyloid-formation-reveal.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Experiências mostraram que fluxo shear em canais estreitos pode induzir a formação de amiloides, similar a como congestionamentos de tráfego ocorrem quando há muitos carros em poucas pistas.", "titulo_pt": "Fluxo shear em canais estreitos desencadeia formação de amiloides, revelam experimentos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 129070, "titulo": "Heat-tolerant corals may be more vulnerable to disease", "url": "https://phys.org/news/2026-08-tolerant-corals-vulnerable-disease.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Corais que se associam a algas resistentes ao calor podem ser melhores equipados para sobreviver às águas quentes, mas essa resistência vem com um contraponto inesperado, conforme uma nova pesquisa da Universidade de Boston publicada na Science Advances.", "titulo_pt": "Corais resistentes ao calor podem ser mais suscetíveis a doenças", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 129071, "titulo": "MOF-coated catalyst converts CO₂ to CO nearly five times faster under ultrasonic vibration", "url": "https://phys.org/news/2026-08-mof-coated-catalyst-faster-ultrasonic.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas da Universidade do Osaka desenvolveram um catalisador que usa vibração mecânica para converter dióxido de carbono em monóxido de carbono, um componente químico importante. O catalisador é composto por bariatita (BaTiO3) revestida com um framework orgânico metálico (MOF), um material poroso que captura e concentra CO2 perto da superfície do catalisador, e átomos de cobre (Cu) isolados como sites de reação.", "titulo_pt": "Catalisador revestido com mof converte co2 em CO quase cinco vezes mais rápido com vibração ultrassônica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 129072, "titulo": "Mixture of traditional edible plants inhibits fungus growth in corn, study shows", "url": "https://phys.org/news/2026-08-mixture-traditional-edible-inhibits-fungus.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mistura de plantas comestíveis tradicionais inibe o crescimento de fungos em milho, conforme demonstrado em um estudo. A contaminação por fungos em grãos armazenados na África subsaariana causa perdas significativas pós-colheita e riscos à saúde pública, custando bilhões de dólares anualmente, de acordo com a Organização das Nações Unidas para Alimentação e Agricultura (FAO).", "titulo_pt": "Mistura de plantas comestíveis tradicionais inibe o crescimento de fungos em milho", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 128642, "titulo": "Medicamento para câncer de pâncreas recebe aprovação rápida do FDA", "url": "https://www.cnnbrasil.com.br/saude/medicamento-para-cancer-de-pancreas-recebe-aprovacao-rapida-do-fda/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-27T21:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O medicamento Rasonque, desenvolvido pela Revolution Medicines, foi aprovado rapidamente pela FDA e oferece uma sobrevida dobrada aos pacientes com câncer de pâncreas. O medicamento já está disponível para pacientes elegíveis nos Estados Unidos.", "titulo_pt": "Medicamento para câncer de pâncreas recebe aprovação rápida da FDA", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 129073, "titulo": "Texas fossil reveals early insects kept aquatic limbs during move onto land", "url": "https://phys.org/news/2026-08-texas-fossil-reveals-early-insects.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A formação de ecossistemas terrestres complexos foi uma inovação significativa na história evolutiva da vida na Terra. Este evento marcou a expansão da vida além dos ambientes marinhos e indicou o início de uma nova fase na diversificação da biota terrestre.", "titulo_pt": "Fósseis do texas revelam que insetos mantinham membros aquáticos durante a transição para o terreno", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 129074, "titulo": "Groundbreaking literacy program triples rate of progress among struggling young readers", "url": "https://phys.org/news/2026-08-groundbreaking-literacy-triples-struggling-young.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um especialista em alfabetização da Universidade de Alberta conduziu a maior intervenção em alfabetização da história no Canadá, aumentando o ritmo de progresso de quase todos os participantes em três vezes após cinco meses. Os resultados preliminares indicam que cerca de metade das crianças no programa não precisarão de intervenção adicional.", "titulo_pt": "Programa de alfabetização revolucionário triplica a taxa de progresso entre leitores jovens em dificuldades", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 129075, "titulo": "ASTRID traces 13.5 billion years of black hole and galaxy evolution", "url": "https://phys.org/news/2026-08-astrid-billion-years-black-hole.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T21:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novos dados dos instrumentos, como o Telescópio Espacial James Webb da NASA, estão auxiliando os astrôfisicos a explorar a evolução das galáxias e dos buracos negros ao longo de 13,5 bilhões de anos. Essas observações permitem uma visão das histórias cósmicas distantes quase tão antigas quanto o tempo mesmo.", "titulo_pt": "ASTRID rastreia 13,5 bilhões de anos de evolução de buracos negros e galáxias", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 128545, "titulo": "Ciclopes também só têm um hemisfério cerebral", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/colunas/suzanaherculanohouzel/2026/08/ciclopes-tambem-so-tem-um-hemisferio-cerebral.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-27T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O autor está dedicando seu tempo para finalizar um livro-texto de neurociências para uma editora. Ele está aproveitando a oportunidade para catalogar e sistematizar suas descobertas sobre o cérebro ao longo de 20 anos de pesquisa.", "titulo_pt": "Ciclopes também só têm um hemisfério cerebral", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 129076, "titulo": "Milky Way's own gravity can mimic dark matter clues, stellar stream simulations suggest", "url": "https://phys.org/news/2026-08-milky-gravity-mimic-dark-clues.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Simulações de correntes estelares sugerem que a gravidade da Via Láctea pode criar indicadores semelhantes aos da matéria escura. Estas correntes estelares orbitam a Via Láctea de forma análoga às órbitas dos planetas em nosso sistema solar.", "titulo_pt": "A própria gravidade da via láctea pode imitar pistas da matéria escura, sugerem simulações de correntes estelares", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 129109, "titulo": "James Webb Space Telescope observes 72 stars and finds planet formation is a race against time", "url": "https://www.space.com/astronomy/james-webb-space-telescope/james-webb-space-telescope-observes-72-stars-and-finds-planet-formation-is-a-race-against-time", "fonte_id": "space_com", "data_pub": "2026-08-27T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos, usando o Telescópio Espacial James Webb, estudaram 72 estrelas jovens semelhantes ao Sol e descobriram que a formação de planetas é uma verdadeira corrida contra o tempo.", "titulo_pt": "James Webb Space Telescope observa 72 estrelas e descobre que a formação de planetas é uma corrida contra o tempo", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 129077, "titulo": "Fast but error-prone AI assists in solving a decades-old fluid mechanics problem in five weeks", "url": "https://phys.org/news/2026-08-fast-error-prone-ai-decades.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um assistente de inteligência artificial ajudou pesquisadores da Universidade do Colorado Boulder a resolver um problema matemático que os desafiava há um ano e meio, apesar de cometer erros sutis. O avanço pode melhorar como os cientistas estudam nanopartículas, mas também ilustra tanto o potencial quanto as limitações do AI como parceiro científico.", "titulo_pt": "Assistente de IA ajuda a resolver problema de mecânica dos fluidos em cinco semanas, mas com erros", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 129078, "titulo": "Social media posts reveal how communities cope with extreme heat", "url": "https://phys.org/news/2026-08-social-media-reveal-communities-cope.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo da UC Irvine sugere que as conversas diárias nas redes sociais podem revelar como as comunidades lidam com o calor extremo e identificar quais precisam de ajuda. A frequência e intensidade do calor extremo na Califórnia tornam cada vez mais crucial a compreensão das necessidades dessas comunidades para proteger a saúde pública.", "titulo_pt": "Postagens nas redes sociais revelam como as comunidades lidam com o calor extremo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 129079, "titulo": "A few minutes of freezing can change the fate of iron in nature", "url": "https://phys.org/news/2026-08-minutes-fate-iron-nature.html", "fonte_id": "phys_org", "data_pub": "2026-08-27T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O congelamento e descongelamento de ferrihidrita, o mineral de ferro mais reativo em solos frios, permafrost e geleiras, podem transformá-lo de forma significativa em apenas alguns minutos, conforme estudos da Umeå University. Com o aquecimento climático que intensifica os ciclos de congelamento e descongelamento e expande sua ocorrência, o gelo está se tornando um fator cada vez mais importante para os ecossistemas da Terra.", "titulo_pt": "Poucos minutos de congelamento podem mudar o destino do ferro na natureza", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 128515, "titulo": "Toda carne que custa caro é boa?", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/blogs/nacao-churrasqueira/2026/08/toda-carne-que-custa-caro-e-boa.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-27T21:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O autor, especialista em carnes há dez anos, descreve suas experiências iniciais com diferentes cortes, incluindo um tomahawk com marmoreio intenso que causou desconforto gastrointestinal e um dry aged de 45 dias que não atendeu às suas expectativas em termos de sabor.", "titulo_pt": "Toda carne que custa caro é boa?", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 129135, "titulo": "‘Coyote vs. Acme’ Director Dave Green ‘Remains in Shock’ That the Film Is Coming Out", "url": "https://www.indiewire.com/features/interviews/coyote-vs-acme-director-interview-1235212507/", "fonte_id": "indiewire", "data_pub": "2026-08-27T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dave Green, diretor do filme 'Coyote vs. Acme', falou com a IndieWire sobre a produção do filme híbrido live-action/animação baseado em 'Looney Tunes' e o longo e problemático caminho até sua estreia nos cinemas.", "titulo_pt": "Diretor de 'coyote vs. Acme' em choque com lançamento", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 129112, "titulo": "Pattern and Bold, Saturated Color Commingle in Ben Sledsens’ Rhythmic Paintings", "url": "https://w d": 128602, "titulo": "Leilão concede 267 mil hectares da floresta Balata-Tufari, no Amazonas, por 35 anos", "url": "https://veja.abril.com.br/agenda-verde/leilao-concede-267-mil-hectares-da-floresta-balata-tufari-no-amazonas-por-35-anos/", "fonte_id": "veja", "data_pub": "2026-08-27T20:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Duas empresas venceram leilão por 267 mil hectares de floresta no Amazonas, concedidos por 35 anos. O projeto prevê investimentos de R$ 2 bilhões.", "titulo_pt": "Leilão concede 267 mil hectares da floresta Balata-Tufari, no Amazonas, por 35 anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 128964, "titulo": "Belugas and dolphins rescued from Canada’s Marineland arrive in Spain", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/27/belugas-and-dolphins-rescued-from-canadas-marineland-arrive-in-spain?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-27T20:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois belugas e quatro dolphins foram transferidos de Marineland, no Canadá, para um aquário na Espanha.", "titulo_pt": "Baleias-baleia e golfinhos resgatados do canadá’s Marineland chegam à Espanha", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 128901, "titulo": "Death Toll Rises in Nepal-Tibet Flash Flood", "url": "https://foreignpolicy.com/2026/08/27/nepal-tibet-flash-floods-death-toll-missing-glacier-global-warming/", "fonte_id": "foreign_policy", "data_pub": "2026-08-27T20:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de mortes está aumentando devido às cheias na fronteira entre Nepal e Tibet. Equipes de resgate buscam sobreviventes antes que novas inundações ocorram.", "titulo_pt": "Óbitos aumentam em cheias na fronteira entre nepal e tibet; equipes de resgate buscam sobreviventes", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 128965, "titulo": "Al Jazeera reporter witness lo_pt": "Desastre entre Nepal e Tibete mostra como mudanças climáticas intensificam riscos em cadeia", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 128013, "titulo": "Germany’s Rhine River Is Drying Up", "url": "https://foreignpolicy.com/2026/08/27/germany-rhine-river-economy-war/", "fonte_id": "foreign_policy", "data_pub": "2026-08-27T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O rio Reno na Alemanha está se secando. O dano econômico é apenas uma das consequências.", "titulo_pt": "O reno na Alemanha está se secando", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 127994, "titulo": "Inundaciones en Nepal: El enorme desafío de reconstrucción para el premier de 36 años en un país golpeado por el cambio climático", "url": "https://www.latercera.com/mundo/noticia/inundaciones-en-nepal-el-enorme-desafio-de-reconstruccion-para-el-premier-de-36-anos-en-un-pais-golpeado-por-el-cambio-climatico/", "fonte_id": "la_tercera", "data_pub": "2026-08-27T17:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Pelo menos 359 pessoas morreram e mais de 1.300 estão desaparecidas nas inundações no Nepal, incluindo decenas de estrangeiros e peregrinos. Centenas de pessoas foram deslocadas na região do Himalaia.", "titulo_pt": "Inundações no Nepal: desafio de reconstrução para o primeiro-ministro jovem em um país afetado pelo clima", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 127879, "titulo": "Transformaron más de 1.000 columnas de una autopista en jardines verticales para combatir la contaminación y el calor", "url": "https://www.clarin.com/estados-unidos/transformaron-1000-columnas-autopista-jardines-verticales-combatir-contaminacion-calor_0_S2D0l2QiDa.html", "fonte_id": "clarin", "data_pub": "2026-08-27T17:28:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de 1.000 colunas de uma autopista em Ciudad de México foram transformadas em jardins verticais para combate
