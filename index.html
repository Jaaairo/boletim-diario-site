"pt", "provavel_duplicata_de": null, "texto_pt": "A UnionPay International anunciou um projeto-piloto que permitirá usuários de aplicativos de pagamento chineses pagar por QR Code em estabelecimentos brasileiros conectados ao Pix. A informação foi divulgada pelo consulado-geral da China no Rio de Janeiro, mas não foram detalhadas informações sobre o parceiro brasileiro nem a data de início do projeto.", "titulo_pt": "China avança com pagamentos qr code em estabelecimentos brasileiros antes das regras do Banco Central", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 94361, "titulo": "ANP revoga autorização da Refit após Receita Federal suspender CNPJ da refinaria", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/anp-revoga-autorizacao-da-refit-apos-receita-federal-suspender-cnpj-da-refinaria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-08T01:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diretoria da ANP revogou a autorização da Refit após a Receita Federal ter suspendido o CNPJ da refinaria. A decisão foi tomada durante uma reunião na sexta-feira (7).", "titulo_pt": "ANP revoga autorização da Refit após suspensão do CNPJ pela Receita Federal", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 94815, "titulo": "U.S. to invest $3 billion in minerals projects to boost supply chains", "url": "https://www.japantimes.co.jp/business/2026/08/08/us-mineral-defense-investments/", "fonte_id": "japan_times", "data_pub": "2026-08-08T00:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Estados Unidos investirá 3 bilhões de dólares em projetos minerais para fortalecer suas cadeias de suprimentos. Metais como rares metais, tungstenio, germanio e escandio são cruciais para mísseis guiados com precisão e outros armamentos avançados.", "titulo_pt": "EUA investirão 3 bilhões em projetos minerais para fortalecer cadeias de suprimentos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 93551, "titulo": "Exports surge 32.9% amid AI demand", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/08/2003862118", "fonte_id": "taipei_times", "data_pub": "2026-08-08T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As exportações tiveram um aumento de 32,9% devido à demanda por tecnologia da inteligência artificial (IA).", "titulo_pt": "Exportações avançam 32,9% diante da demanda pela IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 94827, "titulo": "Amazon to finance huge US gas plant for data centres", "url": "https://www.scmp.com/news/world/united-states-canada/article/3363393/amazon-finance-huge-us-gas-plant-data-centres?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-08T09:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Amazon confirmou que está financiando um grande parque de gás privado no Texas, que pode se tornar a maior fonte de emissões de gases de efeito estufa dos Estados Unidos. Este é o último exemplo de gigantes da tecnologia saírem da rede para acelerar as operações de IA.", "titulo_pt": "Amazon vai financiar grande planta de gás no texas para centrais de dados", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 94881, "titulo": "Spokane Shows What the New Era of Wildfires Looks Like", "url": "https://www.wired.com/story/spokane-shows-new-era-of-wildfires/", "fonte_id": "wired", "data_pub": "2026-08-08T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Com as temperaturas mais altas e condições mais secas, os incêndios florestais são mais propensos a se espalhar. Além disso, com mais pessoas residindo próximas aos bosques, os resultados podem ser catastróficos.", "titulo_pt": "Spokane revela o que as novas Era de incêndios florestais pode ser", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 94882, "titulo": "WhatsApp Gets a Handy @all Feature for Group Chats", "url": "https://www.wired.com/story/whatsapp-gets-a-handy-all-feature-for-group-chats/", "fonte_id": "wired", "data_pub": "2026-08-08T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A atualização do software adiciona enquetes anônimas e facilita a criação de um chat privado menor fora do grupo maior. O WhatsApp introduz uma nova funcionalidade '@all', que permite enviar mensagens para todos os membros de um grupo.", "titulo_pt": "Whatsapp adiciona funcionalidade @all para grupos", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 94829, "titulo": "Behind the AI stock market bubble lies a weak yen", "url": "https://www.scmp.com/opinion/asia-opinion/article/3363176/behind-ai-stock-market-bubble-lies-weak-yen?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-08T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A libra japonesa está prevista para permanecer fraca no futuro próximo, influenciando os preços das ações globais. Apesar da intervenção oficial recente no mercado de câmbio pelo Japão, o fluxo internacional de capitais continua instável e pode ameaçar a estabilidade econômica real.", "titulo_pt": "Por trás do burburinho dos mercados de ações alimentado pela IA, está uma libra japonesa fraca", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 94830, "titulo": "‘Addiction is irreversible’: Hong Kong urged to ban under-16s from social media", "url": "https://www.scmp.com/news/hong-kong/education/article/3363390/addiction-irreversible-hong-kong-urged-ban-under-16s-social-media?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-08T08:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Educadores e legisladores de Hong Kong sugeriram que a cidade deva legislar para proibir crianças abaixo de 16 anos de acessar redes sociais, com o objetivo de combater cyberbullying e dependência. Eles enfatizaram a necessidade de um consenso social amplo.", "titulo_pt": "Adicção é irreversível: hong Kong deve proibir acesso de menores de 16 anos às redes sociais", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 94831, "titulo": "Chinese virtual actress in trending AI drama raises deep industry concerns and questions", "url": "https://www.scmp.com/news/people-culture/trending-china/article/3363362/chinese-virtual-actress-trending-ai-drama-raises-deep-industry-concerns-and-questions?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-08T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma atriz virtual gerada por inteligência artificial (IA) chamada Fang Taozi adquiriu 400 mil seguidores em uma plataforma social chinesa e teve um mini-series com mais de 250 milhões de visualizações. Sua popularidade levantou preocupações profundas na indústria sobre o potencial substituição dos atores humanos.", "titulo_pt": "Atriz virtual gerada por IA em série chama a atenção e causa preocupação no setor", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 94455, "titulo": "Aberta ou fechada: O novo debate que pode moldar o futuro da IA no mundo", "url": "https://www.cnnbrasil.com.br/economia/negocios/aberta-ou-fechada-o-novo-debate-que-pode-moldar-o-futuro-da-ia-no-mundo/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-08T07:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo americano criou uma nova estrutura para revisar modelos de IA avançados, que por enquanto exclui os modelos de código aberto. Este novo debate pode influenciar o futuro do desenvolvimento da IA no mundo.", "titulo_pt": "Aberta ou fechada: debate sobre IA pode moldar o futuro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 94466, "titulo": "Cinco agentes de IA que empresas podem criar hoje para automatizar tarefas de ponta a ponta", "url": "https://exame.com/inteligencia-artificial/cinco-agentes-de-ia-que-empresas-podem-criar-hoje-para-automatizar-tarefas-de-ponta-a-ponta/", "fonte_id": "exame", "data_pub": "2026-08-08T06:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Agentes de inteligência artificial podem ser criados para automatizar tarefas em diversos departamentos, como vendas e recursos humanos. Eles executam processos completos, integrando sistemas e tomando decisões com baixa intervenção humana.", "titulo_pt": "Cinco agentes de IA que empresas podem criar hoje para automatizar tarefas de ponta a ponta", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 94469, "titulo": "Como usar IA para analisar planilhas de vendas e descobrir oportunidades sem dominar Excel", "url": "https://exame.com/inteligencia-artificial/como-usar-ia-para-analisar-planilhas-de-vendas-e-descobrir-oportunidades-sem-dominar-excel/", "fonte_id": "exame", "data_pub": "2026-08-08T05:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ferramentas de inteligência artificial podem analisar planilhas, identificar padrões e gerar gráficos automaticamente, facilitando a análise de dados para profissionais de diferentes áreas sem a necessidade de dominarem o Excel.", "titulo_pt": "Como usar IA para analisar planilhas de vendas e descobrir oportunidades", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 94838, "titulo": "India’s Kusha missile test signals step closer to self-reliance for air defence", "url": "https://www.scmp.com/week-asia/politics/article/3363349/indias-kusha-missile-test-signals-step-closer-self-reliance-air-defence?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-08T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "India realizou seu primeiro teste do sistema de misseis surface-to-air Kusha, que pode contribuir para fortalecer sua defesa aérea domesticada e enfrentar os desafios futuros. Desenvolvido pela Defence Research and Development Organisation (DRDO), o sistema faz parte da Missão Sudarshan Chakra, um plano de Modi para uma cobertura de defesa nacional multilayer contra mísseis balísticos.", "titulo_pt": "Teste do míssil Kusha marca passo para auto-suficiência na defesa aérea indian", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 94806, "titulo": "As countries ban social media for children, Japan mulls a different approach", "url": "https://www.japantimes.co.jp/news/2026/08/08/japan/social-media-age-ban/", "fonte_id": "japan_times", "data_pub": "2026-08-08T04:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um professor de sociologia alerta que uma proibição geral pode empurrar crianças para espaços online menos visíveis ou incentivá-las a mentir sobre sua idade, dificultando o detecção do abuso.", "titulo_pt": "Países banem redes sociais para crianças, Japão considera abordagem diferente", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 94787, "titulo": "The exciting boring decade", "url": "https://www.ft.com/content/10f9922c-4667-4fb9-b2a0-6f3264ef0b09?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-08T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo questiona por que a instabilidade do mundo real não tem inspirado mais arte interessante.", "titulo_pt": "A excitante década monótona", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 94736, "titulo": "Milton Keynes, north of London, pioneers grocery delivery by small robots", "url": "https://www.lemonde.fr/en/economy/article/2026/08/08/milton-keynes-north-of-london-pioneers-grocery-delivery-by-small-robots_6756280_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-08T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo britânico está revisando as leis para permitir que esses robôs, já utilizados em cerca de 20 cidades, operem nas calçadas. Milton Keynes, na região norte de Londres, está à frente neste experimento de entrega de alimentos por robôs.", "titulo_pt": "Milton Keynes, no norte de londres, lidera o uso de robôs para entregas de supermercado", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 94845, "titulo": "China faces new AI bottleneck as it runs out of Chinese-language training data", "url": "https://www.scmp.com/tech/tech-trends/article/3363318/china-faces-new-ai-bottleneck-it-runs-out-chinese-language-training-data?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-08T02:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China enfrenta um novo desafio na construção de modelos de inteligência artificial avançada, pois está se esgotando em dados de treinamento de qualidade chineses. Especialistas chineses alertam que a escassez de dados pode se tornar o próximo grande gargalo para os objetivos tecnológicos do país.", "titulo_pt": "China enfrenta novo desafio na IA devido à escassez de dados", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 94790, "titulo": "China’s biggest travel site grapples with watchdog’s reservations", "url": "https://www.ft.com/content/2b3726f6-8149-4a74-a58e-eaaa20c9f2b9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-08T00:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma investigação concluiu que o site de viagens Trip.com abusou do seu poder, uma vez que ele processa mais da metade dos reservas de hotéis no país.", "titulo_pt": "Site chinês de viagens enfrenta reservas de vigilância regulatória", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 94814, "titulo": "Pentagon sets funds and dates for secret Golden Dome space program", "url": "https://www.japantimes.co.jp/news/2026/08/08/world/pentagon-funds-dates-golden-dome-missiles/", "fonte_id": "japan_times", "data_pub": "2026-08-08T00:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Pentágono planeja realizar os primeiros testes do programa de defesa antimísseis espacial futurista Golden Dome até o final deste ano, com demonstrações de voo agendadas para 2027.", "titulo_pt": "Pentagono estabelece fundos e datas para programa secreto de domo dourado espacial", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 94909, "titulo": "Nocturnal 'coffee frog' discovered in Costa Rica", "url": "https://phys.org/news/2026-08-nocturnal-coffee-frog-costa-rica.html", "fonte_id": "phys_org", "data_pub": "2026-08-08T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um pequeno rã verde noturno foi descoberto no centro da região pacífica da Costa Rica, onde ele prospera nas plantações de café. No entanto, o rã enfrenta riscos devido ao uso de agrotóxicos na agricultura local.", "titulo_pt": "Ranço 'café noturno' descoberto na Costa Rica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 94376, "titulo": "Morre porco clonado em projeto da USP para transplante de órgãos em humanos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/morre-porco-clonado-em-projeto-da-usp-para-transplante-de-orgaos-em-humanos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-08T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No final de julho, pesquisadores do Centro de Ciência para Desenvolvimento de Xenotransplante da USP realizaram a eutanásia do primeiro porco clonado pelo projeto. O animal fazia parte de um esforço para gerar clones geneticamente modificados que possam fornecer órgãos para transplantes em humanos.", "titulo_pt": "Porco clonado em projeto da USP para xenotransplante morre", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 94938, "titulo": "Sky-Watcher SolarQuest mount head review", "url": "https://www.space.com/stargazing/skywatching-kit/sky-watcher-solarquest-mount-head-review", "fonte_id": "space_com", "data_pub": "2026-08-08T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Sky-Watcher SolarQuest é um suporte solar simples e prático que automaticamente encontra e segue o sol, ideal para astronomia solar com pequenos telescópios e observações de eclipses solares.", "titulo_pt": "Revisão do cabecote SolarQuest mount da sky-watcher", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 94553, "titulo": "Nathaniel Johnson, meteorólogo de NOAA: el “Súper El Niño” apunta a ser el más intenso del último siglo", "url": "https://www.lanacion.com.ar/estados-unidos/nathaniel-johnson-meteorologo-de-noaa-el-super-el-nino-apunta-a-ser-el-mas-intenso-del-ultimo-siglo-nid08082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-08T08:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O modelo de El Niño da NOAA prevê um evento que pode ser o mais intenso do último século. Nathaniel Johnson, meteorólogo da NOAA, destaca a intensidade potencial deste 'Súper El Niño'.", "titulo_pt": "Meteorologista da NOAA: ‘super El Niño’ pode ser o mais intenso do século", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 94377, "titulo": "Documentos revelam que EUA investigaram suposto OVNI na Bahia em 1963", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/documentos-revelam-que-eua-investigaram-suposto-ovni-na-bahia-em-1963.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-08T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os documentos do Departamento de Defesa dos Estados Unidos foram divulgados na sexta-feira (7) detalhando a investigação de um suposto incidente com objeto voador não identificado ocorrido em Conde, Bahia, em novembro de 1963.", "titulo_pt": "Documentos revelam que EUA investigaram suposto OVNI na Bahia em 1963", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 94378, "titulo": "Fiocruz concede título póstumo a dez pesquisadores alvos da ditadura militar", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/fiocruz-concede-titulo-postumo-a-dez-pesquisadores-alvos-da-ditadura-militar.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-08T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Fiocruz concedeu títulos póstumos de pesquisador emérito a dez cientistas que foram alvos da ditadura militar em 1970, durante o episódio conhecido como Massacre de Manguinhos. A cerimônia ocorreu no Rio de Janeiro na última quarta-feira (5).", "titulo_pt": "Fiocruz concede títulos póstumos a dez pesquisadores alvos da ditadura militar", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 94910, "titulo": "Silver nanocatalysts switch reaction sites between power generation and hydrogen production", "url": "https://phys.org/news/2026-08-silver-nanocatalysts-reaction-sites-power.html", "fonte_id": "phys_org", "data_pub": "2026-08-08T06:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores descobriram pela primeira vez que o mesmo catalisador nanomaterial de prata (Ag) opera em diferentes pontos de reação dependendo se uma célula de óxido sólido está gerando eletricidade ou produzindo hidrogênio. Este achado introduz um novo princípio de design para melhorar a performance das próximas gerações de células de óxido sólido.", "titulo_pt": "Catalisadores nanomateriais de prata alternam sites de reação entre geração de energia e produção de hidrogênio", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 94875, "titulo": "Heat-related illness patients in late summer up threefold over past decade: data", "url": "https://www.koreaherald.com/article/10834779", "fonte_id": "korea_herald", "data_pub": "2026-08-08T05:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de casos de doenças relacionadas ao calor no final do verão aumentou três vezes nos últimos 10 anos, conforme dados do governo. De 2011 a 2015, o Instituto de Pesquisa sob o Ministério do Interior analisou que, em média, eram registrados 215 casos por ano entre 'ipchu' e o final de agosto.", "titulo_pt": "Número de casos de doenças relacionadas ao calor no final do verão triplicou nos últimos 10 anos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 94916, "titulo": "APOD: 2026 August 8 – A Messier Moment for Tempel 2", "url": "https://science.nasa.gov/image-article/apod/apod-2026-august-8-a-messier-moment-for-tempel-2/", "fonte_id": "nasa_news", "data_pub": "2026-08-08T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da APOD em 8 de agosto de 2026 focará no Tempel 2, um objeto do Messier. Este evento será marcado como uma 'Messier Moment' para este corpo celeste.", "titulo_pt": "Momento Messier para Tempel 2", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 94786, "titulo": "Forget Asimov. Philip K Dick saw the future", "url": "https://www.ft.com/content/bdcf7729-3b03-49ec-82fb-b5773fdaa990", "fonte_id": "financial_times", "data_pub": "2026-08-08T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Philip K Dick previu visões de ficção científica nos anos 1960 que podem servir como guia para a nossa era, marcada por bilionários imprevisíveis, fantasia espacial e tecnologia intrusiva e instável.", "titulo_pt": "Esqueça Asimov. Philip K Dick viu o futuro", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 94842, "titulo": "Chinese scientists find some Yangtze flood controls may do more harm than good", "url": "https://www.scmp.com/news/china/science/article/3363133/chinese-scientists-find-some-yangtze-flood-controls-may-do-more-harm-good?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-08T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo chinês revelou que algumas intervenções humanas nas barragens do Rio Yangtze podem estar exacerbando os riscos de inundações, ao invés de mitigá-los. O estudo sugere que a frequência das inundações atingiu seu pico durante o Pequeno Inverno Medieval (1500-1850) antes dos sistemas de controle de cheias serem implementados.", "titulo_pt": "Cientistas chineses descobrem que algumas barragens do rio Yangtze podem causar mais danos do que mitigar inundações", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 94813, "titulo": "America’s cyberforces grapple with cluster of deaths by suicide", "url": "https://www.japantimes.co.jp/news/2026/08/08/world/us-cyberforces-suicides-focus/", "fonte_id": "japan_times", "data_pub": "2026-08-08T00:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O exército dos Estados Unidos está examinando um número atípico de suicídios entre os membros da unidade de guerra cibernética durante o mês de verão atual.", "titulo_pt": "Forças de cybersegurança dos EUA investigam cluster de suicídios", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 94911, "titulo": "One million years without sex fails to erase stick insects' unused biological system", "url": "https://phys.org/news/2026-08-million-years-sex-erase-insects.html", "fonte_id": "phys_org", "data_pub": "2026-08-07T23:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores descobriram que uma espécie de inseto-da-cara-de-pau, que não reproduz sexualmente há um milhão de anos, ainda mantém um sistema biológico não utilizado. O estudo foi liderado por Dr. Darren Parker, da Universidade Bangor.", "titulo_pt": "Um milhão de anos sem sexo não apaga o sistema biológico inútil das insetos-da-cara-de-pau", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 94912, "titulo": "New AI model reveals the volume of the world's glaciers", "url": "https://phys.org/news/2026-08-ai-reveals-volume-world-glaciers.html", "fonte_id": "phys_org", "data_pub": "2026-08-07T22:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo modelo de inteligência artificial criado por uma equipe da Ca' Foscari University of Venice, em colaboração com o Institute of Polar Sciences do CNR-ISP, produziu um mapa global atualizado sobre o volume de geleiras no mundo. O estudo fornece informações sobre a quantidade de gelo armazenada nas geleiras e sua localização exata.", "titulo_pt": "Novo modelo de IA revela o volume das geleiras globais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 94913, "titulo": "Creating cleaner chemical reactions that run on oxygen and produce only water as waste", "url": "https://phys.org/news/2026-08-cleaner-chemical-reactions-oxygen.html", "fonte_id": "phys_org", "data_pub": "2026-08-07T22:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A oxigênio serve como força motriz para muitas reações químicas essenciais. No entanto, sua configuração eletrônica incomum pode dificultar as reações com matérias-primas orgânicas, exigindo auxílio para iniciá-las.", "titulo_pt": "Criando reações químicas mais limpas que utilizam oxigênio e produzem apenas água como resíduo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 94289, "titulo": "Researchers unlock high-res view of 2D materials by doing a microscopic twist", "url": "https://phys.org/news/2026-08-high-res-view-2d-materials.html", "fonte_id": "phys_org", "data_pub": "2026-08-07T22:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os pesquisadores da Universidade do Maryland (UMD) detectaram mudanças sutis na superfície de materiais flexíveis ao aplicar um rápido movimento de torção em uma ponta microscópica.", "titulo_pt": "Pesquisadores desbloqueiam visão de alta resolução de materiais 2D através de um twist microscopicamente pequeno", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 94539, "titulo": "El negocio del juguete se reinventa", "url": "https://www.lanacion.com.ar/economia/negocios/nuevas-reglas-para-conquistar-a-los-chicos-nid08082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-08T09:18:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A indústria de brinquedos está se adaptando através do uso de séries, consoles, redes sociais e espetáculos para redefinir a forma como as pessoas jogam. As empresas estão investindo em licenças e franquias para se manterem relevantes em um mercado cada vez mais competitivo.", "titulo_pt": "O negócio do brinquedo se reinventa", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 94367, "titulo": "O que 'A Odisseia' tem a dizer sobre a era dos trapaceiros como Trump e Musk", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/ezra-klein/2026/08/o-que-a-odisseia-tem-a-dizer-sobre-a-era-dos-trapaceiros-como-trump-e-musk.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-08T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Christopher Nolan realizou um filme que, segundo o autor, entende e critica a era dos trapaceiros como Trump e Musk. A obra aponta uma possível saída para essa situação.", "titulo_pt": "O que 'A Odisseia' diz sobre A era de trapaceiros como Trump e Musk", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 94549, "titulo": "“El cine fue mi hogar, y la pantalla, el lugar donde las mujeres tuvimos que aprender a filmar nuestra historia”", "url": "https://www.lanacion.com.ar/conversaciones-de-domingo/el-cine-fue-mi-hogar-y-la-pantalla-el-lugar-donde-las-mujeres-tuvimos-que-aprender-a-filmar-nuestra-nid08082026/", "fonte_id" isis: 'Muslims here are constantly required to prove they are real Spaniards'", "url": "https://www.lemonde.fr/en/le-monde-africa/article/2026/08/07/ceuta-faces-an-unprecedented-migration-crisis-muslims-here-are-constantly-required-to-prove-they-are-real-spaniards_6756271_124.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-07T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ceuta enfrenta uma crise migratória inédita, com a chegada de 72.000 pessoas do Marrocos entre os dias 30 e 31 de julho, exposto tanto os desafios quanto o senso de solidariedade que une cristãos e muçulmanos na cidade há séculos.", "titulo_pt": "Ceuta enfrenta crise migratória inédita: 'muçulmanos aqui são constantemente obrigados a provar que são verdadeiros espanhóis'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 94398, "titulo": "Ciclone-bomba abre caminho para onda de frio no Sul/Sudeste do Brasil", "url": "https://www.metropoles.com/brasil/ciclone-bomba-abre-caminho-para-onda-de-frio-no-sul-sudeste-do-brasil", "fonte_id": "metropoles", "data_pub": "2026-08-08T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A primeira massa de ar frio está abaixando as temperaturas no Sul e Sudeste do Brasil, com marcas negativas previstas no Rio Grande do Sul. Santa Catarina e o Paraná também serão afetados.", "titulo_pt": "Ciclone-bomba causa queda nas temperaturas no Sul/Sudeste", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 94657, "titulo": "‘I couldn’t breathe’: the deadly health burden of wildfire smoke", "url": "https://www.theguardian.com/news/ng-interactive/2026/aug/08/wildfire-smoke-unknown-health-impacts", "fonte_id": "guardian_world", "data_pub": "2026-08-08T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas trabalham para desvendar as complexas relações entre a exposição à fumaça de incêndios e a mortalidade, enquanto el_duplicata_de": null, "texto_pt": "O desmatamento na Amazônia diminuiu 36,87% no último ano. A área sob alerta é 55,6% menor do que a média dos últimos dez ciclos.", "titulo_pt": "Desmatamento na Amazônia cai 36,87% no último ano", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 94412, "titulo": "Os fatores que podem ampliar frequência de ciclones no Brasil, segundo meteorologista", "url": "https://veja.abril.com.br/brasil/os-fatores-que-podem-ampliar-frequencia-de-ciclones-no-brasil-segundo-meteorologista/", "fonte_id": "veja", "data_pub": "2026-08-08T00:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um meteorologista da MetSul, Estael Sias, prevê que o Sul do Brasil terá uma maior frequência de temporais, tornados e chuvas extremas nos próximos meses.", "titulo_pt": "Fatores que podem aumentar a frequência de ciclones no sul do Brasil, segundo meteorologista", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 94413, "titulo": "Intensidade dos ventos diminui e Rio retorna ao estágio 2 de risco", "url": "https://veja.abril.com.br/brasil/intensidade-dos-ventos-diminui-e-rio-retorna-ao-estagio-2-de-risco/", "fonte_id": "veja", "data_pub": "2026-08-08T00:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A intensidade dos ventos diminuiu e o Rio de Janeiro retorna ao estágio 2 de risco. Não há previsão de ventos fortes ou muito fortes à noite.", "titulo_pt": "Intensidade dos ventos diminui e Rio retorna ao estágio 2 de risco", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 94075, "titulo": "“Nos da realmente miedo”: preocupación por un riesgo para 150.000 hectáreas en la región más importante del país", "url": "https://www.lanacion.com.ar/economia/campo/nos-da-realmente-miedo-preocupacion-por-un-riesgo-para-150000-hectareas-en-la-region-mas-importante-nid07082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-07T21:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Bolsa de Comércio de Rosario alertou que as condições climáticas de julho, com dias nublados e chuvas, impuseram dificuldades na colheita do milho tardio na região mais importante do país. O trigo teve uma redução de 20% a 40% na radiação solar em comparação ao ano anterior, mas os cultivos permanecem em boas condições.", "titulo_pt": "Nos realmente tememos isso para 150 mil hectares da região mais importante do país", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 93910, "titulo": "RS: ciclone-bomba deixou 250 mil pessoas sem luz e 2,3 mil desalojados", "url": "https://www.metropoles.com/brasil/rs-ciclone-bomba-deixou-250-mil-pessoas-sem-luz-e-23-mil-desalojados", "fonte_id": "metropoles", "data_pub": "2026-08-07T21:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ciclone-bomba causou danos em dezenas de municípios no Rio Grande do Sul, deixando 250 mil pessoas sem luz e 2.306 desalojados. As estruturas afetadas incluíram casas, escolas, hospitais e rodovias.", "titulo_pt": "RS: ciclone-bomba causa falta de energia e desaloja 2.306 pessoas", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 93974, "titulo": "Amazônia registra menor nível de desmatamento desde 2016", "url": "https://www.cnnbrasil.com.br/nacional/brasil/amazonia-registra-menor-nivel-de-desmatamento-desde-2016/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-07T21:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desmatamento na Amazônia registrou uma queda de 36,05%, atingindo o menor nível desde 2016. Este valor está abaixo da média dos últimos dez ciclos anuais.", "titulo_pt": "Amazônia registra menor nível de desmatamento desde 2016", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 94059, "titulo": "Morte, suspensão de aulas e casas afetadas: os impactos do ciclone-bomba no Sul e Sudeste do país", "url": "https://www.bbc.com/portuguese/articles/c62e0q7m2jdo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-07T19:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ciclone-bomba causou uma morte no Rio Grande do Sul, gerou dois tornados em menos de duas semanas e levou à suspensão das aulas em cidades do litoral de São Paulo e no Rio de Janeiro.", "titulo_pt": "Morte, suspensão de aulas e casas afetadas: os impactos do ciclone-bomba no Sul e Sudeste do país", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 92965, "titulo": "Un analista internacional explicó en detalle por qué el fenómeno del “Súper Niño” está “causando estragos” y lo que se viene", "url": "https://www.lanacion.com.ar/el-mundo/un-analista-internacional-explico-en-detalle-por-que-el-fenomeno-del-super-nino-esta-causando-nid06082026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-08-07T17:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Andrés Repetto, um analista internacional, detalhou o impacto do fenômeno meteorológico conhecido como 'Súper Niño' e alertou sobre as consequências do mudança climática. O diálogo ocorreu com LN+.", "titulo_pt": "Analista internacional explica impacto do ‘Súper Niño’ e alerta sobre mudança climática", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 92774, "titulo": "Ciclone-bomba causa ventos fortes, suspende aulas e paralisa o Porto de Santos", "url": "https://veja.abril.com.br/agenda-verde/ciclone-bomba-causa-ventos-fortes-suspende-aulas-e-paralisa-o-porto-de-santos/", "fonte_id": "veja", "data_pub": "2026-08-07T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um ciclone-bomba causou ventos fortes no litoral de São Paulo, levando a suspensão das aulas e paralisando o Porto de Santos. A frente fria mobilizou o gabinete de crise do governo estadual.", "titulo_pt": "Ciclone-bomba causa ventos fortes, suspende aulas e paralisa o Porto de Santos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 92779, "titulo": "Meteorologista explica riscos da chegada de ciclone explosivo ao Sudeste e possível ligação com El Niño", "url": "https://veja.abril.com.br/brasil/meteorologista-explica-riscos-da-chegada-de-ciclone-explosivo-ao-sudeste-e-possivel-ligacao-com-el-nino/", "fonte_id": "veja", "data_pub": "2026-08-07T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O meteorologista Hiremar Soares discute a formação do ciclone explosivo previsto para o Sudeste, alertando sobre os possíveis efeitos na região de São Paulo. Ele enfatiza a importância dos cuidados com as condições climáticas adversas.", "titulo_pt": "Meteorologista explica riscos da chegada de ciclone explosivo ao Sudeste e possível ligação com El Niño", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 92898, "titulo": "Ciclone-bomba: Rio entra em estágio 3 e governo decreta ponto facultativo", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/rj/ciclone-bomba-rio-entra-em-estagio-3-e-governo-decreta-ponto-facultativo/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-07T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo do Rio de Janeiro decretou ponto facultativo na região para reduzir a circulação de pessoas diante da previsão de ventos fortes. As aulas presenciais foram suspensas.", "titulo_pt": "Ciclone-bomba: rio entra em estágio 3 e decreta ponto facultativo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 93963, "titulo": "Ciclone bomba: como devem ser os efeitos no Brasil no final de semana", "url": "https://exame.com/brasil/ciclone-bomba-como-devem-ser-os-efeitos-no-brasil-no-final-de-semana/", "fonte_id": "exame", "data_pub": "2026-08-07T15:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No sábado, o tempo entre Paraná e Santa Catarina será instável com possibilidade de tempestades e granizo. Os efeitos do ciclone bomba devem ser sentidos nesses estados durante o final de semana.", "titulo_pt": "Ciclone bomba: como devem ser os efeitos no Brasil no fim de semana", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 94840, "titulo": "Bar Association broadly backs new offence for persistent child sexual abuse", "url": "https://www.scmp.com/news/hong-kong/law-and-crime/article/3363364/bar-association-broadly-backs-new-offence-persistent-child-sexual-abuse?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-08T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Associação da Ordem dos Advogados de Hong Kong expressou apoio geral a uma nova infração específica para abuso sexual persistente contra crianças, após as questões relacionadas à coleta de evidências terem sido resolvidas em outros lugares no último20 anos. Os advogados destacaram que a nova lei precisará incluir garantias para assegurar um tratamento justo para ambas as partes durante o julgamento.", "titulo_pt": "Associação dos advogados de hong kong apoia novo crime para abuso sexual persistente contra crianças", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 94843, "titulo": "‘Hopeless’: Palestinian Christians leave West Bank as hardships mount", "url": "https://www.scmp.com/news/world/middle-east/article/3363378/hopeless-palestinian-christians-leave-west-bank-hardships-mount?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-08T03:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Reverendo Mitri Raheb, fundador e presidente da Universidade Dar al-Kalima em Belém, expressou preocupação sobre o futuro dos cristãos palestinos, afirmando que, se as condições atuais continuarem, não haverá mais cristãos palestinos até 2050. Os cristãos palestinos consideram-se habitantes contínuos da Terra Santa há 2.000 anos.", "titulo_pt": "Sem esperança: cristãos palestinos deixam a cisjordânia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 94774, "titulo": "US courts clear way for deportations of South Sudan, Myanmar nationals", "url": "https://www.aljazeera.com/news/2026/8/8/us-courts-clear-way-for-deportations-of-south-sudan-myanmar-nationals?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-08T02:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os tribunais dos EUA permitiram que o governo de Trump encerrasse o Status Protegido Temporário para cidadãos sudaneses do Sul e birmaneses. Isso abrirá caminho para a deportação desses cidadãos.", "titulo_pt": "Cortes americanos permitem deportações de cidadãos do sudão do sul e da birmânia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 94818, "titulo": "Trump’s new attack on birthright citizenship faces uphill legal battle", "url": "https://www.japantimes.co.jp/news/2026/08/08/world/politics/trump-birthright-citizenship-analysis/", "fonte_id": "japan_times", "data_pub": "2026-08-07T23:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente republicano tem ameaçado por anos aprimorar o direito à cidadania pelo nascimento como parte de sua agenda restritiva de imigração.", "titulo_pt": "Novo ataque de trump sobre cidadania pelo nascimento enfrenta batalha legal difícil", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 93913, "titulo": "Maria da Penha: interior de SP puxa alta dos feminicídios no estado", "url": "https://www.metropoles.com/sao-paulo/interior-sp-alta-feminicidios", "fonte_id": "metropoles", "data_pub": "2026-08-07T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de feminicídios tem aumentado no interior do estado de São Paulo, enquanto a capital e região metropolitana têm registrado uma diminuição nesse tipo de crime. Os dados mostram uma tendência diferente entre as regiões do estado.", "titulo_pt": "Maria da Penha: interior de SP registra alta nos feminicídios", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 94064, "titulo": "Con una fianza de US$ 10.000, liberan a la niñera argentina detenida por agentes migratorios en EE.UU.", "url": "https://www.clarin.com/mundo/fianza-us-10000-liberan-ninera-argentina-detenida-agentes-migratorios-eeuu_0_SnlC8jKlaL.html", "fonte_id": "clarin", "data_pub": "2026-08-07T21:06:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Iliana Lick, uma babá argentina de 30 anos, foi detida no aeroporto de Filadélfia em 11 de julho. Ela estava com o processo de renovação da visa de trabalho em andamento, mas mesmo assim foi liberada sob fiança de US$ 10.000 e transferida para New Mexico.", "titulo_pt": "Com fiança de US$ 10.000, babá argentina é libertada após detenção migratória nos EUA", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 93981, "titulo": "Espanha desmantela uma das maiores redes de tráfico de pessoas da região", "url": "https://www.cnnbrasil.com.br/internacional/espanha-desmantela-uma-das-maiores-redes-de-trafico-de-pessoas-da-regiao/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-07T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Espanha desmantelou uma das maiores redes de tráfico de pessoas da região. O país enfrenta uma crise migratória, com mais de 100 pessoas mortas em uma das últimas ocorrências.", "titulo_pt": "Espanha desmantela rede de tráfico de pessoas", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 94688, "titulo": "Hopes for the North Korean Human Rights Act of 2026", "url": "https://thediplomat.com/2026/08/hopes-for-the-north-korean-human-rights-act-of-2026/", "fonte_id": "the_diplomat", "data_pub": "2026-08-07T18:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O direito humano na Coreia do Norte de 2004 expirou em 2022. Um esforço bipartidário importante visa reautorizá-lo.", "titulo_pt": "Esperanças para a lei dos direitos humanos da Coreia do norte de 2026", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 92948, "titulo": "'Estava conversando com minha professora quando ela foi baleada': aluno de 14 anos mata cinco professores e os avós na Tailândia", "url": "https://www.bbc.com/portuguese/articles/ce97y30y482o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-07T17:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um aluno de 14 anos matou cinco professores e os avós na Tailândia, segundo relatos. O corpo do agressor também foi encontrado sem vida, com suspeita de que ele tenha matado seus avós antes de atacar a escola.", "titulo_pt": "Estava conversando com minha professora quando ela foi baleada': aluno de 14 anos mata cinco professores e os avós na Tailândia", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 93059, "titulo": "Ejército pide al ministro Barros autorizar retiro con pensión de $2,7 millones para condenado por homicidio de Romario Veloz", "url": "https://www.ciperchile.cl/2026/08/07/ejercito-pide-al-ministro-barros-autorizar-retiro-con-pension-de-27-millones-para-condenado-por-homicidio-de-romario-veloz/?utm_source=rss&utm_medium=rss&utm_campaign=ejercito-pide-al-ministro-barros-autorizar-retiro-con-pension-de-27-millones-para-condenado-por-homicidio-de-romario-veloz", "fonte_id": "ciper_chile", "data_pub": "2026-08-07T16:59:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Exército pediu ao ministro Barros que autorize o retiro com pensão de 2,7 milhões de pesos chilenos para um condenado pelo homicídio de Romario Veloz.", "titulo_pt": "Exército solicita ao ministro Barros autorização para retiro com pensão de r$ 2,7 milhões para condenado pelo assassinato de romário Veloz", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 93042, "titulo": "Endividar-se para trabalhar em aplicativo pode ser trabalho escravo, diz diretor da OIT", "url": "https://www.jota.info/coberturas-especiais/endividar-se , "classe": "A"}, {"id": 93598, "titulo": "Lee apologizes to long-overlooked victims of state violence", "url": "https://www.koreaherald.com/article/10834527", "fonte_id": "korea_herald", "data_pub": "2026-08-07T08:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung se reuniu com várias vítimas sobreviventes de violência estatal historicamente negligenciadas e ofereceu uma compensação formal, prometendo restaurar sua dignidade e garantir um processo de cura significativo. Ele enfatizou que o estado deve agora assumir a responsabilidade pela cura das feridas causadas aos próprios cidadãos.", "titulo_pt": "Lee se retrata com vítimas sobreviventes de violência estatal historicamente negligenciada", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 94096, "titulo": "GES 86: la garantía que existe en el papel, pero no siempre en la práctica", "url": "https://www.ciperchile.cl/2026/08/07/ges-86-la-garantia-que-existe-en-el-papel-pero-no-siempre-en-la-practica/?utm_source=rss&utm_medium=rss&utm_campaign=ges-86-la-garantia-que-existe-en-el-papel-pero-no-siempre-en-la-practica", "fonte_id": "ciper_chile", "data_pub": "2026-08-07T08:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto GES 86 descreve uma garantia que existe no papel, mas nem sempre é aplicada na prática. Este tema foi publicado originalmente pelo CIPER Chile.", "titulo_pt": "GES 86: a garantia que existe no papel, mas não sempre na prática", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 93493, "titulo": "Anguish and hope: why a Tibetan set himself on fire in New York", "url": "https://www.japantimes.co.jp/news/2026/08/07/asia-pacific/politics/tibetan-self-immolation-new-york/", "fonte_id": "japan_times", "data_pub": "2026-08-07T05:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ninguém sabia os planos de Lobga Rangzen. Nem seu amigo monge de 30 anos, nem sua sobrinha que mo const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
