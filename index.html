 "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 155798, "titulo": "Caixa entra em greve nacional e Banco do Brasil tem paralisação parcial a partir desta 5ª", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/caixa-entra-em-greve-nacional-e-banco-do-brasil-tem-paralisacao-parcial-a-partir-desta-5a.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-10T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bancários da Caixa Econômica Federal e do Banco do Brasil iniciaram uma greve por tempo indeterminado a partir desta quinta-feira (10). A greve é nacional na Caixa e parcial no Banco do Brasil, onde parte dos trabalhadores aderiu ao movimento enquanto outros aceitaram um acordo.", "titulo_pt": "Caixa e Banco do Brasil entram em greve por tempo indeterminado a partir desta quinta-feira", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 156461, "titulo": "Korea to double daytime services for adults with developmental disabilities", "url": "https://www.koreaherald.com/article/10869420", "fonte_id": "korea_herald", "data_pub": "2026-09-10T06:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Coreia do Sul planeja dobrar o acesso aos serviços diurnos para adultos com deficiências desenvolvimentais até 2030 e expandir a assistência 24 horas para aqueles com maiores necessidades de apoio. Essas medidas fazem parte de um plano amplo para estabelecer um sistema de apoio contínuo desde a infância até a adultez, minimizando os vazios na assistência à medida que o número de pessoas com deficiências desenvolvimentais cresce.", "titulo_pt": "Coreia do sul vai dobrar serviços diurnos para adultos com deficiências desenvolvimentais", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 156401, "titulo": "Cases of attempted suicide and self-harm rise for seventh straight year", "url": "https://www.japantimes.co.jp/news/2026/09/10/japan/society/suicide-attempts/", "fonte_id": "japan_times", "data_pub": "2026-09-10T06:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de casos de tentativas de suicídio e autolesões aumentou pela sétima vez consecutiva em 2025, com aproximadamente 120 pessoas sendo levadas ao hospital diariamente devido a autolesões, de acordo com o Centro de Promoção de Medidas Contra o Suicídio do Japão.", "titulo_pt": "Número de tentativas de suicídio e autolesões aumenta pela sétima vez seguida", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 155932, "titulo": "Falta de experiência trava a carreira de 1 em cada 7 jovens, mostram dados do mercado", "url": "https://exame.com/carreira/falta-de-experiencia-trava-a-carreira-de-1-em-cada-7-jovens-mostram-dados-do-mercado/", "fonte_id": "exame", "data_pub": "2026-09-10T05:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um em cada sete jovens enfrenta dificuldades na carreira devido à falta de experiência, conforme dados do mercado. A desocupação entre 18 e 24 anos no Brasil é mais do que o dobro da média nacional, de acordo com o IBGE.", "titulo_pt": "Falta de experiência trava a carreira de 1 em cada 7 jovens, mostram dados do mercado", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 156056, "titulo": "Balacera deja a cuatro personas heridas en medio de culto religioso evangélico en Colina", "url": "https://www.latercera.com/nacional/noticia/reportan-balacera-que-deja-a-cuatro-personas-heridas-en-medio-de-culto-religioso-evangelico-en-colina/", "fonte_id": "la_tercera", "data_pub": "2026-09-10T04:55:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Quatro pessoas ficaram feridas em uma balacera que ocorreu fora de uma igreja evangélica em Colina, durante um suposto roubo em uma venda informal na rua.", "titulo_pt": "Balacera deixa quatro feridos durante culto religioso evangélico em Colina", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 154815, "titulo": "Taipei to launch more food-safety inspections", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/10/2003864015", "fonte_id": "taipei_times", "data_pub": "2026-09-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A cidade de Taipei planeja aumentar o número de inspeções de segurança alimentar. A iniciativa visa melhorar a monitoração e garantir a qualidade dos alimentos na região.", "titulo_pt": "Taipei lançará mais inspeções de segurança alimentar", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 154817, "titulo": "Intensive sports training may affect schoolwork: survey", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/10/2003864017", "fonte_id": "taipei_times", "data_pub": "2026-09-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indicou que treinamento intenso de esportes pode afetar o desempenho escolar dos alunos. Os resultados sugerem que a intensidade do treinamento pode interferir no tempo disponível para estudos.", "titulo_pt": "Treinamento intenso de esportes pode afetar a escola: pesquisa", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 155333, "titulo": "Fuerte reclamo de justicia en José C. Paz por el homicidio de un joven motociclista de 23 años", "url": "https://www.lanacion.com.ar/seguridad/fuerte-reclamo-de-justicia-en-jose-c-paz-por-el-homicidio-de-un-joven-motociclista-de-23-anos-nid09092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-09T21:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Vecinos e amigos de David Elías Ojeda Vázquez realizam uma marcha para exigir respostas sobre o homicídio do jovem motociclista de 23 anos. Os incidentes de homicídio na região têm sido frequentes.", "titulo_pt": "Fortes demandas de justiça em José C. Paz pelo assassinato de um jovem motociclista de 23 anos", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 155337, "titulo": "“No debemos quedarnos en la queja”: la Academia Nacional de Educación propuso una reunión federal por el retroceso en las pruebas PISA", "url": "https://www.lanacion.com.ar/sociedad/no-debemos-quedarnos-en-la-queja-la-academia-nacional-de-educacion-pidio-una-reunion-federal-por-el-nid09092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-09T21:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Academia Nacional de Educação propôs uma reunião federal para discutir mudanças urgentes na educação argentina devido ao retrocesso nas práticas PISA. Entre as medidas sugeridas, está a maior autonomia para as escolas de gestão estatal e privada.", "titulo_pt": "‘Não devemos ficar apenas na reclamação’: a Academia Nacional de educação sugere reunião federal sobre a crise educacional", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 155869, "titulo": "Clima: sul do país está sob alerta de \"grande perigo\" para chuvas e granizo", "url": "https://www.metropoles.com/brasil/clima-sul-do-pais-esta-sob-alerta-de-grande-perigo-para-chuvas-e-granizo", "fonte_id": "metropoles", "data_pub": "2026-09-10T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Inmet emitiu um alerta de 'grande perigo' para chuvas e granizo no sul do país. São Paulo e Mato Grosso do Sul também estão sob alerta.", "titulo_pt": "Clima: sul do país está sob alerta de 'grande perigo' para chuvas e granizo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 155899, "titulo": "Biólogo mostra “desespero” de gambás durante resgate em residência", "url": "https://www.cnnbrasil.com.br/curiosidades/biologo-mostra-desespero-de-gambas-durante-resgate-em-residencia/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-10T09:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um biólogo registrou em vídeo a agressividade dos gambás durante um resgate em uma residência. O profissional brincou com a situação, mostrando o desespero dos animais.", "titulo_pt": "Biólogo registra agressividade de gambás durante resgate em residência", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 156430, "titulo": "Cop31: Forget climate pledges, countries like Nepal need actual cash", "url": "https://www.scmp.com/opinion/world-opinion/article/3366917/cop31-forget-climate-pledges-countries-nepal-need-actual-cash?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-10T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O título original sugere que as conferências climáticas costumam se basear em promessas de ações climáticas, mas essas promessões não são suficientes. O dinheiro prometido pelo mundo rico para o mundo pobre não está chegando em escala adequada, e a falsa esperança de que isso vai mudar rapidamente se tornou o principal foco da diplomacia climática.", "titulo_pt": "Cop31: ignore as promessas climáticas, países como Nepal precisam de dinheiro real", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 156284, "titulo": "At least five dead and 86 missing in Philippines ferry fire", "url": "http://www.euronews.com/2026/09/10/philippines-five-killed-and-86-missing-after-fire-on-ferry-near-tourist-hotspot", "fonte_id": "euronews", "data_pub": "2026-09-10T08:09:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio em um ferry próximo a um destino turístico popular na província de Palawan, nas Filipinas, deixou pelo menos cinco mortos e 86 pessoas desaparecidas.", "titulo_pt": "Pelo menos cinco mortos e 86 desaparecidos após incêndio em ferry nas filipinas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 154818, "titulo": "Volunteers go to shoal to protect it from erosion", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/10/2003864018", "fonte_id": "taipei_times", "data_pub": "2026-09-10T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Voluntários estão sendo enviados para uma ilha para proteger o local da erosão. A ação visa preservar a ilha e combater a degradação causada pela erosão costeira.", "titulo_pt": "Voluntários vão à ilha para proteger do desgaste", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 155119, "titulo": "Nepal recorre a drones para enviar ajuda humanitária a vítimas de inundações", "url": "https://veja.abril.com.br/mundo/nepal-recorre-a-drones-para-enviar-ajuda-humanitaria-a-vitimas-de-inundacoes/", "fonte_id": "veja", "data_pub": "2026-09-09T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Nepal está utilizando drones para distribuir alimentos, medicamentos e outros itens essenciais a comunidades isoladas afetadas por inundações. O Exército está a frente dessa operação humanitária.", "titulo_pt": "Nepal recorre a drones para enviar ajuda humanitária a vítimas de inundações", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 155193, "titulo": "Eucatex incorpora risco climático à estratégia e investe R$ 410 milhões em expansão florestal", "url": "https://exame.com/esg/eucatex-incorpora-risco-climatico-a-estrategia-e-investe-r-410-milhoes-em-expansao-florestal/", "fonte_id": "exame", "data_pub": "2026-09-09T18:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Eucatex incorporou o risco climático em sua estratégia e investiu R$ 410 milhões em expansão florestal. O relatório de sustentabilidade da empresa destaca a criação de um grupo de trabalho climático, o desenvolvimento de eucaliptos mais resistentes e o avanço em bioenergia e conservação.", "titulo_pt": "Eucatex incorpora risco climático à estratégia e investe R$ 410 milhões em expansão florestal", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 154261, "titulo": "1 em cada 5 carros vendidos no Brasil já é elétrico ou híbrido, diz ABVE", "url": "https://www.cnnbrasil.com.br/auto/1-em-cada-5-carros-vendidos-no-brasil-ja-e-eletrico-ou-hibrido-diz-abve/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-09T17:43:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em agosto, 57,3 mil veículos elétricos e híbridos foram emplacados no Brasil, representando 22% das vendas de carros leves no país.", "titulo_pt": "1 Em cada 5 carros vendidos no Brasil já é elétrico ou híbrido, segundo ABVE", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 154332, "titulo": "California crea un nuevo consejo ambiental: jóvenes desde los 14 años podrán participar en decisiones del estado", "url": "https://www.clarin.com/estados-unidos/california-crea-nuevo-consejo-ambiental-jovenes-14-anos-podran-participar-decisiones-estado_0_c5VbArQfMW.html", "fonte_id": "clarin", "data_pub": "2026-09-09T17:32:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O estado da Califórnia criou um novo conselho ambiental composto por jovens entre 14 e 20 anos que poderão participar das decisões da Agência de Proteção Ambiental. Não é necessário experiência prévia em questões ambientais para se inscrever.", "titulo_pt": "Califórnia cria novo conselho ambiental com jovens a partir de 14 anos", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 154743, "titulo": "Indonesia’s wildfire emissions surge to world’s highest, data shows", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3366962/indonesias-wildfire-emissions-surge-worlds-highest-data-shows?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-09T15:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Indonésia está enfrentando uma elevação nos lançamentos de gases de efeito estufa devido a incêndios florestais que estão queimando florestas e áreas de turfa nas ilhas de Borneu e Sumatra. As leituras de dióxido de carbono estão atualmente as mais altas do mundo, com as emissões de fogo na Indonésia de 1 a 7 de setembro atingindo 19,7 milhões de toneladas métricas, superando a Rússia nesta semana e compreendendo mais de um terço do total global, de acordo com o Fire Emissions Watch, um portal desenvolvido pelo Copernicus da União Europeia.", "titulo_pt": "Emissões devido a incêndios florestais na indonésia atingem nível mundialmente recorde", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 153284, "titulo": "Clima: temporais avançam pelo Sul e Sudeste nesta 4ª; veja a previsão", "url": "https://www.metropoles.com/brasil/clima-temporais-avancam-pelo-sul-e-sudeste-nesta-4a-veja-a-previsao", "fonte_id": "metropoles", "data_pub": "2026-09-09T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Instabilidade meteorológica avança pelo Sul e Sudeste do Brasil nesta quarta-feira, com previsão de chuva intensa, raios, rajadas de vento e possibilidade de granizo em várias regiões.", "titulo_pt": "Clima: temporais avançam pelo Sul e Sudeste nesta quarta-feira; veja a previsão", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 153305, "titulo": "Deserto florido: Atacama pode ter maior floração em duas décadas e as primeiras flores já estão desabrochando", "url": "https://www.cnnbrasil.com.br/curiosidades/deserto-florido-atacama-pode-ter-maior-floracao-em-duas-decadas-e-as-primeiras-flores-ja-estao-desabrochando/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-09T09:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Deserto do Atacama no Chile pode experimentar uma das maiores florações em duas décadas, com as primeiras flores já aparecendo. O artigo oferece informações sobre quando visitar o Chile para observar esse fenômeno, os locais onde ele é mais comum e conselhos para turistas conscientes sobre o meio ambiente.", "titulo_pt": "Deserto florido: atacama pode ter maior floração em duas décadas e as primeiras flores já estão desabrochando", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 153736, "titulo": "‘Totally reliant on Mother Nature’: UK drought raises water security fears", "url": "https://www.aljazeera.com/news/2026/9/9/uk-drought-raises-fears-over-water-security?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-09T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ondas de calor recordes tem afetado os agricultores britânicos, levantando preocupações sobre os níveis nos reservatórios e a suprimento de alimentos.", "titulo_pt": "Totalmente dependente da natureza: estiagem no reino unido aumenta temores sobre a segurança hídrica", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "meio_ambiente__eventos": [{"titulo": "Verão americano é o mais quente em 132 anos de medição", "sumario": "O verão dos Estados Unidos foi o mais quente registrado em 132 anos de medição. O Departamento de Meteorologia dos EUA registrou o verão mais quente do país desde que começaram a coletar dados, em 132 anos. De acordo com a NOAA, o verão nos Estados Unidos foi o mais quente da história, com uma temperatura média de 23,6°C entre junho e agosto, superando os registros de 1936 e 2021.", "artigos": [{"id": 155854, "titulo": "Estados Unidos têm verão mais quente em 132 anos de medição", "url": "https://veja.abril.com.br/mundo/estados-unidos-tem-verao-mais-quente-em-132-anos-de-medicao/", "fonte_id": "veja", "data_pub": "2026-09-09T22:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O verão dos Estados Unidos foi o mais quente registrado em 132 anos de medição. O fenômeno climático El Niño teve influência direta na ocorrência de temperaturas extremas.", "titulo_pt": "Verão americano é o mais quente em 132 anos de medição", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 155559, "titulo": "US records hottest summer in 132 years", "url": "https://www.aljazeera.com/news/2026/9/9/us-records-hottest-summer-in-132-years?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-09T18:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Meteorologia dos EUA registrou o verão mais quente do país desde que começaram a coletar dados, em 132 anos. Além disso, o mês de agosto também bateu um novo recorde de calor.", "titulo_pt": "EUA registram verão mais quente em 132 anos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 154572, "titulo": "United States had warmest summer on record", "url": "https://www.lemonde.fr/en/environment/article/2026/09/09/united-states-had-warmest-summer-on-record_6757354_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-09T16:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com a NOAA, o verão nos Estados Unidos foi o mais quente da história, com uma temperatura média de 23,6°C entre junho e agosto, superando os registros de 1936 e 2021.", "titulo_pt": "Verão dos EUA foi o mais quente da história", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}]}], "direitos_humanos": [{"id": 156013, "titulo": "La argentina que estuvo 13 años en Estados Unidos y ahora será deportada por el ICE: “No se lo van a poner fácil”", "url": "https://www.lanacion.com.ar/estados-unidos/texas/la-argentina-que-estuvo-13-anos-en-estados-unidos-y-ahora-sera-deportada-por-el-ice-no-se-lo-van-a-nid10092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-10T09:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Ernestina Pavlovsky, uma argentina detida pelo ICE, pediu a autodeportação, mas ainda aguarda o retorno ao seu país. Ela passou 13 anos nos Estados Unidos e agora enfrenta o processo de deportação.", "titulo_pt": "A argentina que esteve 13 anos nos EUA e agora será deportada pelo ICE: 'eles não vão me colocar fácil'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 156014, "titulo": "Confirmado por Uscis: cerca de 200.000 migrantes deben abandonar Estados Unidos para no ser deportados a El Salvador", "url": "https://www.lanacion.com.ar/estados-unidos/migraciones/oficial-desde-hoy-cerca-de-200000-migrantes-deben-abandonar-estados-unidos-para-no-ser-deportados-a-nid09092026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-09-10T09:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Serviço de Imigração e Ciudadanía dos Estados Unidos (USCIS) confirmou que aproximadamente 200.000 salvadorenhos devem sair dos Estados Unidos para evitar deportação. Os salvadorenhos devem verificar as opções disponíveis após o fim do TPS e garantir um estatus migratório legal no país.", "titulo_pt": "Uscis confirma: cerca de 200.000 migrantes salvadorenhos devem deixar os EUA para não serem deportados", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 155974, "titulo": "25 anos do 11 de Setembro: a agonia dos parentes das vítimas, que até hoje aguardam julgamento do 'cérebro' dos atentados", "url": "https://www.bbc.com/portuguese/articles/ckgwjpll9l4o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-09-10T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "À medida que se aproxima o 25º aniversário dos atentados de 11 de setembro de 2001, familiares das vítimas reclamam da demora no julgamento dos presos responsáveis pelos ataques, que estão detidos em Guantánamo.", "titulo_pt": "25 Anos dos atentados de 11 de Setembro: agonia das famílias das vítimas pela demora no julgamento dos responsáveis", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 155858, "titulo": "Conselho de Direitos Humanos da ONU exige fim do bloqueio dos EUA contra Cuba", "url": "https://www.brasildefato.com.br/2026/09/09/conselho-de-direitos-humanos-da-onu-exige-fim-do-bloqueio-dos-eua-contra-cuba/", "fonte_id": "brasil_de_fato", "data_pub": "2026-09-10T00:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, _pt": "Ativistas dos direitos das mulheres se reúnem em Paris para discutir lei sobre violência sexual", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 156592, "titulo": "More than 171 million students had their schooling disrupted by climate hazards in 2025 – UNICEF", "url": "https://www.unicef.org/press-releases/more-171-million-students-had-their-schooling-disrupted-climate-hazards-2025-unicef", "fonte_id": "unicef", "data_pub": "2026-09-09T09:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 171 milhões de estudantes tiveram suas aulas interrompidas devido a eventos climáticos em 2025, conforme informa o UNICEF. Os furacões, inundações e ondas de calor foram os principais perigos climáticos que causaram fechamentos de escolas e outras interrupções na educação.", "titulo_pt": "Mais de 171 milhões de estudantes tiveram suas aulas interrompidas por eventos climáticos em 2025 – UNICEF", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 153309, "titulo": "Crianças encontradas nos EUA: megaoperação resgata 79 desaparecidos", "url": "https://www.cnnbrasil.com.br/internacional/criancas-encontradas-estados-unidos-operacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-09T08:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A megaoperação Meridian resgatou 79 crianças desaparecidas em Ohio, encontradas em situações de exploração e negligência.", "titulo_pt": "Crianças encontradas nos EUA: megaoperação resgata 79 desaparecidos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 153664, "titulo": "French billionaire Olivier Bouygues stands trial for killing protected birds", "url": "https://www.lemonde.fr/en/france/article/2026/09/09/french-billionaire-olivier-bouygues-stands-trial-for-killing-protected-birds_6757335_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-09T08:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O empresário francês Olivier const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);

function toggleDrill(id) {

}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">

      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }

    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`

  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
</html>
