      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "17/08/2026 15:20", "stats": {"noticias_novas": 904, "resumos_gerados": 244}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O cenário político brasileiro está em destaque com a campanha eleitoral em andamento, marcada por acusações e estratégias entre os principais candidatos. Flávio Bolsonaro, o filho mais velho do ex-presidente Jair Bolsonaro, é o candidato do PL à Presidência. Jair Bolsonaro, por sua vez, busca a reeleição com foco em pautas sociais, liderado pelo ex-presidente Lula do Partido dos Trabalhadores (PT). O ministro do Supremo Tribunal Federal (STF), Flávio Dino, determinou o afastamento do presidente do Tribunal de Contas do Estado do Maranhão, Daniel Brandão, sobrinho do governador Carlos Brandão, por 180 dias, em razão de suspeitas de envolvimento em um assassinato. Além disso, a campanha presidencial já começou oficialmente, com a apresentação dos logotipos dos candidatos. A pesquisa Quaest revelou que 60% dos eleitores consideram o partido do candidato influente na escolha do voto para presidente, enquanto 80% dos eleitores independentes estão pouco ou nada interessados nas eleições de 2026.", "mundo": "A economia dos Emirados Árabes Unidos está enfrentando dificuldades devido à guerra com a Irã, com residentes e turistas deixando o país. No entanto, as autoridades afirmam que a situação está sob controle e que a recuperação já está em andamento. Em Israel, Benjamin Netanyahu recusou-se a retirar as forças militares até que o Hamas desarme completamente, o que pressiona a administração Trump a mostrar progresso nas negociações com Gaza. A Coreia do Sul se encontra em uma situação incômoda após Trump sugerir uma redução significativa nas manobras militares com o país, o que reaviva especulações sobre um possível encontro entre Trump e Kim Jong-un. O ex-PM Kim foi eleito novo líder do Partido Democrático na Coreia do Sul, enquanto o governo dos Estados Unidos considera novas sanções contra o ministro do Supremo Tribunal Federal, Alexandre de Moraes, conforme relatou o Financial Times.\n\nA geopolítica global enfrenta diversos desafios e tensões. O presidente dos Estados Unidos, Donald Trump, ameaçou bombardear o Iêmen se o país se colocasse no caminho das negociações entre EUA e Irã, levantando preocupações sobre a estabilidade regional. Em outro desenvolvimento, a Irã ofereceu recompensas para capturar ou matar soldados dos Estados Unidos, enquanto Trump negou pressa para encerrar o conflito antes das eleições legislativas americanas. As tensões entre Israel e os palestinos também persistem, com um bilionário emirata questionando a normalização com Israel após declarações de um ministro israelense. Em meio a esses eventos, o Pentágono firmou um contrato multibilionário para acelerar a entrega de mísseis Tomahawk, refletindo preocupações sobre a escassez de mísseis. As tensões regionais e as ameaças de guerra continuam a moldar a cena geopolítica global.", "economia": "A economia dos Estados Unidos enfrenta críticas de que a maioria dos americanos está se sentindo pior financeiramente sob o governo de Donald Trump, com o custo de vida e a inflação sendo os principais problemas. A Casas Bahia, que entrou em recuperação judicial, busca um empréstimo de R$ 1 bilhão para reforçar seu caixa e comprar estoques. O PIB do Japão desacelerou para 1,1% no segundo trimestre, abaixo das expectativas do mercado. O setor de refinamento está tendo um desempenho excepcional, mas a situação pode não durar muito. A economia chinesa está mostrando sinais de desaceleração, com a produção industrial e as vendas varejistas caindo em julho. No Brasil, a economia registrou um leve crescimento no segundo trimestre, mas a inflação para 2026 foi mantida em 5,02% e o PIB em 1,98%, conforme as projeções do mercado financeiro. O dólar está em queda, recuando 0,44% para R$ 5,197, com investidores monitorando indicadores econômicos, incluindo o IBC-Br, do Banco Central, que serve como uma prévia do PIB.", "tecnologia": "Um estudo recente apontou o uso incorreto da inteligência artificial (IA) em artigos acadêmicos, destacando a necessidade de maior cuidado na aplicação dessa tecnologia. A Nvidia concordou em fornecer US$105 bilhões em aluguel para ajudar a OpenAI a financiar um grande centro de dados em Ohio. Este investimento reflete a crescente demanda por capacidade de computação de IA. A empresa também planeja investir US$1,5 bilhão na SB Energy e assegurar até 8 gigawatts de capacidade de computação de IA no local. Outras inovações incluem a parceria da Synchrony com a OpenAI para integrar o ChatGPT às compras, bem como a expansão de entregas de comida por drone pelo Uber, que se associou à empresa de drones Zipline para iniciar esse serviço no final deste ano. Além disso, o CEO da Nvidia, Jensen Huang, enfatizou a importância do pensamento crítico no mercado dominado pela IA, enquanto a empresa planeja investir pesadamente em um data center para a OpenAI em Ohio, potencialmente gerando US$600 bilhões em receita para a Nvidia até 2030.", "ciencia": "Um estudo sobre câncer pancreático divulgou seus resultados, embora os detalhes específicos não tenham sido revelados. Paralelamente, o avanço da inteligência artificial está fazendo com que as empresas busquem alternativas para as centrais de dados, como a localização oceanográfica, devido às crescentes preocupações sobre o consumo de energia e o impacto ambiental. Estudos em árvores centenárias estão alertando para a possibilidade de uma tempestade solar muito maior do que já foi registrada, enquanto um novo estudo destaca a importância de estudar microrganismos em seu ambiente natural, em vez de se basear apenas em pesquisas laboratoriais. Uma nova técnica de imagens por raios-X desenvolvida por pesquisadores da Universidade Monash pode imaginar duas amostras superpostas simultaneamente, potencialmente duplicando a eficiência do escaneamento. Além disso, a NASA divulgou imagens vibrantes da Nébula do Tarântula, combinando dados do Telescópio Espacial X Chandra, do Telescópio Espacial James Webb e do Telescópio Espacial Hubble. O artigo também menciona a expansão da inteligência artificial no setor espacial, com a United Launch Alliance nomeando Mark Peller como novo CEO, e a NASA testando designs de rodas para a Base Lunar.", "cultura": "A China está adotando o hambúrguer de forma cada vez mais ampla, expandindo a produção e a distribuição de hambúrgueres, refletindo a crescente influência do fast-food global no país. Em Taiwan, o fundador da King Slide se tornou a pessoa mais rica da ilha. A cantora Pitty lançou seu sexto álbum de músicas inéditas em outubro. A Casa Natura Musical em São Paulo recebe tributos a Paulinho Boca de Cantor e Belchior, com apresentações especiais de seus convidados e familiares. A cidade búlgara de Burgas será a anfitriã do próximo Eurovision em 2027, substituindo a capital Sofia, gerando surpresa entre os fãs. A exposição no Jeu de Paume em Paris apresenta 300 impressões de uma coleção de 7.000 fotografias pertencentes ao cantor Elton John e seu marido, David Furnish, oferecendo uma visão íntima do artista.", "sociedade": "A Justiça de São Paulo concedeu uma liminar que proíbe o vereador Lucas Pavanato (PL-SP) de fazer posts com determinadas expressões sobre a deputada Erika Hilton, sob pena de multa diária de R$ 1.000. Servidores do IBGE iniciaram uma greve em protesto contra as medidas da gestão de Marcio Pochmann. A polícia de São Paulo está utilizando a integração de dados de rodovias, Metrô e vigilância privada para rastrear suspeitos e prever crimes, resultando na captura de 15 mil pessoas. Em São Paulo, um pai foi preso pela Polícia Federal após ser investigado por supostamente torturar o próprio filho. Na Andaluzia, Espanha, três pessoas, incluindo uma grávida no oitavo mês, foram mortas em um suposto ataque de vingança relacionado ao tráfico de drogas. A PAHO lançou uma ferramenta para prevenir bullying e cyberbullying entre crianças e adolescentes nas Américas. Na Argentina, disparos com ametralladora contra uma casa mataram dois jovens e feriram outro em Florencio Varela, Buenos Aires. Em Goiás, um sargento da PMDF foi morto a tiros por um advogado durante uma discussão no Lago Corumbá. No Rio de Janeiro, uma operação mira o CV por sessões de tortura contra motoboys. Em todo o país, a ANSV intensificou os controles de trânsito no inverno, identificando mais de 10.000 condutores infratores, com 700 testando positivo para alcoolemia. No Japão, 60% das pessoas abandonaram atividades devido ao suor intenso, enquanto no Brasil, cerca de 51% dos pedidos ao INSS foram negados no primeiro semestre de 2026.", "meio_ambiente": "A crise ambiental continua a preocupar em diferentes partes do mundo. Nos Estados Unidos, o segundo maior reservatório atingiu seu nível mais baixo registrado, apenas alguns dias após o maior reservatório do país registrar um recorde baixo. Seguindo essa tendência, os agricultores europeus enfrentam uma crise sem precedentes devido a sucessivas ondas de calor intensas e uma seca severa, resultando em uma queda significativa nas produções de legumes e grãos, com previsões de colheitas catastróficas. No Chile, o sistema frontal manteve o norte do país em alerta, com Tocopilla sendo a localidade que registrou as principais afetações, levando a evacuações em diferentes áreas da comuna. Além disso, os incêndios florestais estão forçando as empresas de energia norte-americanas a priorizar a resistência a incêndios em seus planos para a próxima geração da rede elétrica, devido ao aumento do risco de incêndios florestais. No Brasil, o etanol e o biometano estão ganhando espaço no transporte de cargas, oferecendo novas opções para reduzir as emissões de gases de efeito estufa em setores difíceis de eletrificar. Por fim, medidas serão tomadas para proteger os recifes do parque, já que a elevação da temperatura e a escassez d'água estão aumentando os riscos associados a ativos estratégicos em todo o mundo.", "direitos_humanos": "Um surto de Ebola na República Democrática do Congo atingiu seu nível mais alto na história do país, com pelo menos 2.325 mortes, superando o número de vítimas do surto de 2018-2019, conforme informado pelo Instituto Nacional de Saúde. Em outro desenvolvimento, a Comissão Nacional de Direitos Humanos criticou uma proposta de chicotear, expressando preocupações sobre as possíveis consequências da medida. Além disso, em Israel, o ministro de Segurança Nacional de extrema-direita, Ben-Gvir, fez um pedido gravado para o assassinato de '30 a 40' palestinos em Gaza diariamente. Essa declaração foi feita em um abrigo financiado pela Fundação de Saúde Pública Ucraniana, onde desde 2022 abrigam 150 mulheres e crianças, oferecendo refúgio para mães vulneráveis que enfrentam invasão e abuso."}, "resumo_do_dia": {"politica_nacional": [{"id": 107144, "titulo": "Flávio acusa Caiado de ajudar Lula, depois de Kassab ter dito que ele tem 'chance zero' nas eleições", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/flavio-acusa-caiado-de-ajudar-lula-depois-de-kassab-ter-dito-que-ele-tem-chance-zero-nas-eleicoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-17T17:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha de Flávio Bolsonaro acusa Ronaldo Caiado de se aproximar da esquerda após Kassab afirmar que Caiado tem 'chance zero' de vencer as eleições.", "titulo_pt": "Flávio acusa Caiado de ajudar Lula, após Kassab dizer que ele tem 'chance zero'", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 107145, "titulo": "Marina é hostilizada por homem em ato de campanha de Haddad com mulheres", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/marina-e-hostilizada-por-homem-em-ato-de-campanha-de-haddad-com-mulheres.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-17T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Marina Silva, candidata ao Senado pelo Rede Sustentabilidade, foi hostilizada por um homem durante uma caminhada com mulheres em apoio à campanha de Fernando Haddad ao governo de São Paulo.", "titulo_pt": "Marina é hostilizada por homem em caminhada de campanha de Haddad", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 107146, "titulo": "Malafaia não vai coordenar evento de 7 de Setembro pela primeira vez desde 2021", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/malafaia-nao-vai-coordenar-evento-de-7-de-setembro-pela-primeira-vez-desde-2021.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-17T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O pastor Silas Malafaia não planeja coordenar um ato bolsonarista no feriado de 7 de Setembro, o que não ocorre desde 2021.", "titulo_pt": "Malafaia não coordenará evento de 7 de Setembro pela primeira vez desde 2021", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 107204, "titulo": "Discord diz que suspendeu lives no Brasil após decisão da ANPD", "url": "https://g1.globo.com/politica/noticia/2026/08/17/discord-responde-a-anpd-e-diz-que-suspendeu-lives-no-brasil.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-17T17:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A plataforma Discord suspendeu temporariamente as lives no Brasil em conformidade com uma decisão da Agência Nacional de Proteção de Dados (ANPD), baseada no ECA Digital. A funcionalidade de compartilhamento de vídeo foi desabilitada, mas a empresa continuará dialogando com o governo para tentar restabelecer o serviço.", "titulo_pt": "Discord suspendeu lives no Brasil após decisão da ANPD", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 107147, "titulo": "Segurança é destaque em debates para governos estaduais, diz Quaest", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/seguranca-e-destaque-em-debates-para-governos-estaduais-diz-quaest.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-17T16:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O tema da segurança pública foi o mais debatido pelos candidatos aos governos estaduais nos debates realizados pela TV Bandeirantes. O levantamento foi conduzido pela Quaest.", "titulo_pt": "Segurança é o tema predominante nos debates para governos estaduais, mostra Quaest", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 107187, "titulo": "Pelo PT, Lula busca reeleição com foco em pautas sociais", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/pelo-pt-lula-busca-reeleicao-com-foco-em-pautas-sociais", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-17T16:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Luiz Inácio Lula da Silva, 80 anos, candidato do Partido dos Trabalhadores (PT) à Presidência da República, busca reeleição com foco em pautas sociais. Nascido em Garanhuns (PE), Lula teve sua trajetória política iniciada como metalúrgico e sindicalista no ABC paulista durante a redemocratização do país.", "titulo_pt": "Lula busca reeleição pelo PT com foco em pautas sociais", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 107188, "titulo": "PSTU tem o professor de história Hertz Dias como presidenciável", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/pstu-tem-o-professor-de-historia-hertz-dias-como-presidenciavel", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-17T16:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Hertz da Conceição Dias, de 55 anos, é o candidato presidencial pelo PSTU. Professor de história e rapper, ele tem experiência em pesquisa sobre cultura, juventude, racismo e organização popular.", "titulo_pt": "PSTU tem como candidato Hertz Dias para presidência", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 107440, "titulo": "‘Olho por olho, o máximo que pode acontecer é todo mundo ficar cego’, diz Alckmin sobre tarifaço", "url": "https://www.jota.info/executivo/olho-por-olho-o-maximo-que-pode-acontecer-e-todo-mundo-ficar-cego-diz-alckmin-sobre-tarifaco", "fonte_id": "jota", "data_pub": "2026-08-17T16:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alckmin comentou sobre a tarifa adicional de 12,5% impostas pelos Estados Unidos sobre produtos brasileiros, descrevendo-a como 'injusta e descabida'. O vice-presidente também fez uma declaração sobre a questão do tarifaço, comparando-a a uma briga, sugerindo que o resultado seria um empate negativo para todos.", "titulo_pt": "Alckmin: 'olho por olho, o máximo que pode acontecer é todo mundo ficar cego' sobre tarifaço", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 107189, "titulo": "Filho mais velho de Bolsonaro, Flávio disputa a Presidência pelo PL", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-08/filho-mais-velho-de-bolsonaro-flavio-disputa-presidencia-pelo-pl", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-08-17T16:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Nantes Bolsonaro, de 45 anos, é o candidato do PL à Presidência da República. Advogado, empresário e senador desde 2018, ele é o filho mais velho de Jair Bolsonaro e tem como vice na chapa o deputado federal Alfredo Gaspar.", "titulo_pt": "Filho mais velho de Bolsonaro, Flávio disputa a Presidência pelo PL", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 107205, "titulo": "Quaest: 19% apontam 'ter saúde' como principal sonho; 15% citam 'lugar sem violência para viver'", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/08/17/quaest-qual-o-principal-sonho-eleitores.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-17T15:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa Quaest, encomendada pela Globo em parceria com o jornal O Globo, aponta que 19% dos eleitores consideram ter saúde como seu principal sonho, enquanto 15% esperam por um lugar sem violência. Outros sonhos incluem ter uma casa própria, uma educação boa e ver os filhos na faculdade.", "titulo_pt": "19% Dos eleitores sonham com saúde; 15% buscam lugar sem violência", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 107206, "titulo": "Quaest: 80% dos eleitores independentes estão pouco ou nada interessados nas eleições", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/08/17/quest-eleitores-independentes-17-agosto.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-17T15:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa da Quaest mostrou que 80% dos eleitores independentes, que não se identificam com direita, esquerda, bolsonarismo ou lulismo, estão pouco ou nada interessados nas eleições de 2026. Este grupo, que representa 32% dos entrevistados, pode ser decisivo na eleição presidencial.", "titulo_pt": "80% Dos eleitores independentes estão pouco ou nada interessados nas eleições de 2026", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 107148, "titulo": "Dino afasta sobrinho do governador do Maranhão da presidência do TCE", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/dino-afasta-sobrinho-do-governador-do-maranhao-da-presidencia-do-tce.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-17T15:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Flávio Dino, do STF, determinou o afastamento do presidente do TCE do Maranhão, Daniel Brandão, sobrinho do governador Carlos Brandão, por 180 dias.", "titulo_pt": "Dino afasta sobrinho do governador do Maranhão da presidência do TCE", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 107171, "titulo": "Superávit não depende só do Executivo, diz Alckmin", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/superavit-nao-depende-so-do-executivo-diz-alckmin.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T15:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Geraldo Alckmin, vice-presidente e candidato à reeleição, defendeu o ajuste fiscal e afirmou que ele não depende apenas do Poder Executivo. As declarações foram feitas durante um evento do Santander.", "titulo_pt": "Superávit não depende só do Executivo, diz Alckmin", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 107207, "titulo": "Quaest: para 60% dos eleitores, partido do candidato influencia escolha de voto para presidente", "url": "https://g1.globo.com/politica/eleicoes/2026/pesquisa-eleitoral/noticia/2026/08/17/quaest-pergunta-se-partido-influencia-voto-presidente.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-17T15:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa Quaest, encomendada pela Globo em parceria com o jornal O Globo, indica que 60% dos eleitores consideram o partido do candidato influente na escolha do voto para presidente. Entre os eleitores independentes, 50% afirmam que o partido do candidato não influencia o voto.", "titulo_pt": "Para 60% dos eleitores, partido do candidato influencia escolha de voto para presidente", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 107441, "titulo": "Lula e Flávio Bolsonaro tentam inflamar suas bases antes da disputa pelo eleitor de centro", "url": "https://www.jota.info/eleicoes/eleicoes-2026/lula-e-flavio-bolsonaro-tentam-inflamar-suas-bases-antes-da-disputa-pelo-eleitor-de-centro", "fonte_id": "jota", "data_pub": "2026-08-17T15:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula e Flávio Bolsonaro realizaram seus primeiros atos oficiais em locais simbólicos para suas bases políticas. Ambos buscam mobilizar seus apoios antes da disputa pelo eleitorado de centro.", "titulo_pt": "Lula e Flávio Bolsonaro tentam mobilizar suas bases antes da disputa pelo eleitor de centro", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 107208, "titulo": "Marçal, Garotinho, Arruda: entenda por que candidatos inelegíveis conseguiram registrar candidatura", "url": "https://g1.globo.com/politica/noticia/2026/08/17/marcal-garotinho-arruda-e-arthur-henrique-entenda-por-que-candidatos-inelegiveis-ou-com-pendencias-conseguiram-registrar-candidatura.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-17T15:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Candidatos Pablo Marçal, Anthony Garotinho e José Roberto Arruda, que enfrentam decisões judiciais ou já foram declarados inelegíveis, conseguiram registrar suas candidaturas para as eleições, mas ainda precisam ser analisadas pelo Tribunal Superior Eleitoral (TSE).", "titulo_pt": "Marçal, Garotinho, Arruda: entenda por que candidatos inelegíveis conseguiram registrar candidatura", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 107820, "titulo": "German writer tells of Chinese spy in Taiwan", "url": "https://www.taipeitimes.com/News/front/archives/2026/08/18/2003862671", "fonte_id": "taipei_times", "data_pub": "2026-08-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um escritor alemão relatou sobre um suposto agente chinês em Taiwan. O relato não fornece detalhes adicionais sobre a situação.", "titulo_pt": "Alemão relata suposto agente chinês em Taiwan", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 107794, "titulo": "La Corte Suprema russa conferma l'esclusione di Yabloko dalle elezioni", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/17/la-corte-suprema-russa-conferma-lesclusione-di-yabloko-dalle-elezioni_96d118bd-2865-414d-baef-e828e7fb33fa.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-17T17:54:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A Corte Suprema russa confirmou a exclusão do partido Yabloko das eleições. Decenas de apoiantes do partido foram impedidos de se manifestar na frente do órgão judicial.", "titulo_pt": "Corte Suprema russa confirma exclusão do Yabloko das eleições", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 107842, "titulo": "Mafia link feared in theft of grand master paintings from Sicily museum", "url": "https://www.scmp.com/news/world/europe/article/3364342/mafia-link-feared-theft-grand-master-paintings-sicily-museum?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-17T17:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma quadrilha de criminosos é suspeita de ter roubado quatro pinturas de Antonello da Messina, um mestre renascentista, de um museu na cidade natal do artista em Sicília. O fato levanta dúvidas sobre a segurança do museu e é considerado estranho por um oficial local.", "titulo_pt": "Roubo de pinturas renascentistas pode envolver crime organizado", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 107795, "titulo": "Barcellona ricorda le 16 vittime degli attentati jihadisti di 9 anni fa", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/17/barcellona-ricorda-le-16-vittime-degli-attentati-jihadisti-di-9-anni-fa_265b5181-f19e-44e7-983a-1c455a794d93.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-17T17:52:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Barcelona se lembra das 16 vítimas dos atentados jihadistas há 9 anos. Uma manifestação independentista pediu 'a verdade' sobre a tragédia.", "titulo_pt": "Barcelona homenageia as 16 vítimas dos atentados jihadistas de 9 anos atrás", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 107796, "titulo": "Il partito di Farage vuole escludere tutti gli stranieri dai sussidi Gb", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/17/il-partito-di-farage-vuole-escludere-tutti-gli-stranieri-dai-sussidi-gb_569cb0da-1974-44ba-b427-0fcd9256bf74.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-17T17:49:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O partido de Farage deseja excluir todos os estrangeiros, incluindo cidadãos da União Europeia residentes, dos benefícios sociais. Jenrick está disposto a reavaliar os acordos pós-Brexit.", "titulo_pt": "Partido de Farage quer excluir todos os estrangeiros dos benefícios sociais", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 107712, "titulo": "UAE economy: On the verge of collapse or on way to recovery?", "url": "https://www.dw.com/en/uae-economy-on-the-verge-of-collapse-or-on-way-to-recovery/a-78402980?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-17T17:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A economia dos Emirados Árabes Unidos está sofrendo devido à guerra com a Irã, com residentes deixando o país e turistas cancelando viagens. No entanto, as autoridades insistem que tudo está bem e a recuperação já está em andamento.", "titulo_pt": "Economia dos emirados árabes unidos: em colapso ou em recuperação?", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 107490, "titulo": "Kushner Meets Netanyahu in Israel in Effort to Break Logjam Over Gaza", "url": "https://www.nytimes.com/2026/08/17/world/middleeast/kushner-netanyahu-gaza-peace-deal.html", "fonte_id": "nyt_world", "data_pub": "2026-08-17T17:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro de Israel, Benjamin Netanyahu, recusa-se a retirar as forças militares até que o Hamas desarme completamente. A administração Trump está sob pressão para mostrar progresso nessa questão.", "titulo_pt": "Kushner encontra Netanyahu em Israel para tentar romper o impasse sobre Gaza", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 107495, "titulo": "Trump’s move to gut South Korea alliance is ‘inane, haphazard decision’, lawmakers say", "url": "https://www.theguardian.com/us-news/2026/aug/17/trump-south-korea-alliance", "fonte_id": "guardian_world", "data_pub": "2026-08-17T17:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lawmakers criticaram a decisão do presidente dos Estados Unidos, Donald Trump, de reduzir os exercícios militares conjuntos com a Coreia do Sul, considerando-a uma decisão inútil e precipitada. Eles alertaram que isso poderia fortalecer a posição da Rússia na Ucrânia.", "titulo_pt": "Decisão de trump em relação à aliança com a Coreia do sul é chamada de 'decisão inútil e precipitada'", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 107767, "titulo": "Oman intensifies efforts to contain oil spill from stranded ship", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/oman-intensifies-efforts-contain-oil-spill-stranded-ship", "fonte_id": "middle_east_eye", "data_pub": "2026-08-17T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Oman intensificou suas ações para conter uma fuga de óleo de um navio que ficou preso, cobrindo uma área de mais de 2.000 km². O navio Caroline Bezengi tem liberado óleo desde que sofreu um possível acidente próximo à ilha al-Qibliyyah, em Dhofar, em 8 de junho.", "titulo_pt": "Oman intensifica esforços para conter derramamento de óleo de navio encalhado", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 107884, "titulo": "Pentagon says 'no changes' to announce about ongoing S. Korea-U.S. exercise", "url": "https://en.yna.co.kr/view/AEN20260818000200315", "fonte_id": "yonhap_news", "data_pub": "2026-08-17T17:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Defesa dos Estados Unidos declarou que não há mudanças para anunciar sobre o exercício militar em andamento entre Coreia do Sul e Estados Unidos.", "titulo_pt": "Pentágono anuncia 'nenhuma mudança' em relação ao exercício militar sul-coreano-americano em andamento", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 107768, "titulo": "Israeli forces raid town, bulldoze Palestinian land west of Ramallah", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-forces-raid-town-bulldoze-palestinian-land-west-ramallah", "fonte_id": "middle_east_eye", "data_pub": "2026-08-17T17:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças israelenses realizaram uma operação em Deir Ammar, localizada ao oeste de Ramallah, no Cisjordânia ocupado, derrubando terras palestinas para a construção de uma nova estrada. Os moradores expressaram preocupações de que essa ação possa estar relacionada à expansão de colônias próximas.", "titulo_pt": "Forças israelenses realizam operação e derrubam terras palestinas ao oeste de Ramallah", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 107657, "titulo": "Tributes paid to Hayden Panettiere's 'amazing talent' after actress dies at 36", "url": "https://www.bbc.co.uk/news/articles/cq5665zgg1po?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-08-17T17:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A atriz Hayden Panettiere faleceu aos 36 anos, e a polícia não encontrou sinais de crime ou circunstâncias suspeitas. Ela era conhecida por seus talentos em papéis em séries como Heroes e Nashville e recebeu homenagens por sua 'genialidade'.", "titulo_pt": "Homenagens a talento de Hayden Panettiere após morte aos 36 anos", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 107732, "titulo": "Explosion reported at school in Afghan capital Kabul", "url": "https://www.aljazeera.com/news/2026/8/17/explosion-reported-at-school-in-afghan-capital-kabul?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-17T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma explosão foi relatada em uma escola na capital afegã, Cabul. O motivo da explosão e o número de vítimas não foram confirmados, e o governo talibã ainda não se pronunciou sobre o incidente.", "titulo_pt": "Explosão relatada em escola na capital afegã", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 107424, "titulo": "La muerte del profesor de Cambridge Jason Arday resucita la guerra cultural en la universidad británica", "url": "https://elpais.com/sociedad/2026-08-17/la-muerte-del-profesor-de-cambridge-jason-arday-resucita-la-guerra-cultural-en-la-universidad-britanica.html", "fonte_id": "elpais_america", "data_pub": "2026-08-17T17:20:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A direita reaccionária denunciou supostos plagios e falsidades de Jason Arday para atacar as políticas de diversidade na universidade britânica. Isso ressuscitou a guerra cultural no ambiente acadêmico.", "titulo_pt": "A morte do professor de Cambridge Jason Arday reaviva a guerra cultural na universidade britânica", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 107769, "titulo": "Fire breaks out in town near Jerusalem, following Israeli military raid", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/fire-breaks-out-town-near-jerusalem-following-israeli-military-raid", "fonte_id": "middle_east_eye", "data_pub": "2026-08-17T17:16:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio ocorreu na cidade de Beit Anan, próxima a Jerusalém, após forças militares israelenses lançarem gases lacrimogêneos durante uma operação. O fogo se espalhou em áreas adjacentes, mas ainda não se conhece o dano causado e não há relatos de vítimas.", "titulo_pt": "Incêndio ocorre após operação militar em localidade perto de jerusalém", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 107770, "titulo": "Netanyahu says talks with Trump's 'Board of Peace' are 'deep and constructive'", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/netanyahu-says-talks-trumps-board-peace-deep-and-constructive", "fonte_id": "middle_east_eye", "data_pub": "2026-08-17T17:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O primeiro-ministro de Israel, Benjamin Netanyahu, declarou que as conversas com a 'Boa Oficina de Paz' de Trump foram 'profundas e construtivas'. Ambas as partes concordaram em criar dois grupos de trabalho: um para a desmilitarização do Gaza e outro para saneamento, água potável e outros problemas de saúde pública para a população do Gaza.", "titulo_pt": "Netanyahu afirma que conversas com 'boa oficina de paz' de Trump foram 'profundas e construtivas'", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 107372, "titulo": "Maioria dos americanos diz estar pior financeiramente no governo Trump, aponta FT", "url": "https://www.infomoney.com.br/mundo/maioria-dos-americanos-diz-estar-pior-financeiramente-no-governo-trump-aponta-ft/", "fonte_id": "infomoney", "data_pub": "2026-08-17T17:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que a maioria dos americanos está se sentindo pior financeiramente durante o governo de Donald Trump, com o custo de vida e a inflação sendo os principais pontos de críticas. Este desgaste ocorre menos de três meses antes das eleições legislativas.", "titulo_pt": "Maioria dos americanos diz estar pior financeiramente no governo Trump, aponta pesquisa", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 107162, "titulo": "Recuperação judicial é instrumento, não destino da empresa, diz CEO da Casas Bahia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/recuperacao-judicial-e-instrumento-nao-destino-da-empresa-diz-ceo-da-casas-bahia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da Casas Bahia, Renato Franklin, afirma que a recuperação judicial é um instrumento para reorganizar passivos e proteger o caixa, e não o destino da empresa.", "titulo_pt": "Recuperação judicial é instrumento, não destino da empresa, diz CEO da Casas Bahia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 107163, "titulo": "Casas Bahia tem dificuldades com estoque e busca empréstimo de R$ 1 bi", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/casas-bahia-tem-dificuldades-com-estoque-e-busca-emprestimo-de-r-1-bi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T17:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Casas Bahia, que entrou em recuperação judicial neste domingo, busca um empréstimo de R$ 1 bilhão para reforçar seu caixa e comprar estoques. A empresa está buscando recursos junto a bancos e fundos de investimento.", "titulo_pt": "Casas Bahia busca empréstimo de R$ 1 bi para recuperação judicial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 107707, "titulo": "Refiner stocks are on a nearly unprecedented run. History says it could end soon", "url": "https://www.cnbc.com/2026/08/17/refiner-stocks-are-on-a-nearly-unprecedented-run-history-says-it-could-end-soon.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-17T17:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O setor de refinamento está tendo um desempenho excepcional, mas se você tiver aproveitado essa oportunidade este ano, é provável que seja hora de liquidar as posições. Históricamente, essa situação pode não durar muito mais.", "titulo_pt": "Estoque de refinamento está em uma corrida quase sem precedentes. História diz que isso pode acabar em breve.", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 107765, "titulo": "Chelsea shareholders Walter and Boehly in talks to sell stakes to Clearlake", "url": "https://www.ft.com/content/71a498fa-4ce7-4c0b-ab14-7b7f46b2b9c6?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-17T17:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Negociações estão em andamento para que os acionistas Walter e Boehly vendam suas participações na Chelsea Football Club para a Clearlake. Essas negociações ocorrem durante conflitos sobre a estratégia da empresa e no momento em que o império de negócios de Walter está sendo examinado por reguladores.", "titulo_pt": "Walter e Boehly em negociações para vender participações na chelsea para a Clearlake", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 107165, "titulo": "Moreira Salles entra em aposta global de US$ 3,8 bi na SpaceX", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/moreira-salles-entra-em-aposta-global-de-us-38-bi-na-spacex.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T16:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Moreira Salles participou de uma aposta global de US$ 3,8 bilhões na SpaceX, junto com empresas de investimento de indivíduos super-ricos de diferentes regiões. Isso ilustra a capacidade dessas empresas em se envolver em oportunidades de negócios altamente disputadas.", "titulo_pt": "Moreira Salles faz aposta global de US$ 3,8 bi na SpaceX", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 107166, "titulo": "Ações da Casas Bahia desabam até 36% após pedido de recuperação judicial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/acoes-da-casas-bahia-desabam-ate-36-apos-pedido-de-recuperacao-judicial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T16:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações da Casas Bahia caíram 24% na Bolsa às 13h20 desta segunda-feira, em resposta ao pedido de recuperação judicial apresentado pela empresa na noite de domingo.", "titulo_pt": "Ações da Casas Bahia caem 24% após pedido de recuperação judicial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 107167, "titulo": "Crescimento da economia brasileira desacelera no 2º tri com retração em junho, diz BC", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/crescimento-da-economia-brasileira-desacelera-no-2o-tri-com-retracao-em-junho-diz-bc.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T16:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A economia brasileira registrou um leve crescimento no segundo trimestre, mesmo após uma retração em junho, indicando uma forte desaceleração em relação ao início do ano, conforme previsto pelos dados divulgados pelo Banco Central.", "titulo_pt": "Crescimento da economia brasileira desacelera no 2º tri com retração em junho, diz BC", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 107169, "titulo": "Regra para determinar base de cálculo do Simples Nacional muda em janeiro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/08/regra-para-determinar-base-de-calculo-do-simples-nacional-muda-em-janeiro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir de 1º de janeiro de 2027, será extinto o regime de caixa para fins de determinação da base de cálculo mensal do Simples Nacional. Esta mudança é uma adaptação às reformas tributárias.", "titulo_pt": "Nova regra para determinar base de cálculo do Simples Nacional começa em 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 107170, "titulo": "Sindicato prepara ação para tentar barrar demissão em massa na Casas Bahia", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/sindicato-prepara-acao-para-tentar-barrar-demissao-em-massa-na-casas-bahia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T15:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Sindicato dos Comerciários de São Paulo está preparando uma ação judicial para tentar impedir as demissões em massa no Grupo Casas Bahia.", "titulo_pt": "Sindicato prepara ação para tentar barrar demissões em massa na Casas Bahia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 107226, "titulo": "Tesouro pagou R$ 152,46 milhões em dívidas de estados e municípios", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/tesouro-pagou-r-15246-milhoes-em-dividas-de-estados-e-municipios", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-17T15:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tesouro Nacional pagou R$ 152,46 milhões em julho para estados e municípios que não quitaram suas dívidas. No acumulado de 2026, o valor total desembolsado pelo Tesouro para cobrir essas parcelas não quitadas chegou a R$ 3,05 bilhões.", "titulo_pt": "Tesouro pagou R$ 152,46 milhões em dívidas de estados e municípios", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 107496, "titulo": "China’s economy showing signs that slowdown may be extending", "url": "https://www.theguardian.com/business/2026/aug/17/china-economy-slowdown-signs-extending", "fonte_id": "guardian_world", "data_pub": "2026-08-17T15:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A produção industrial e as vendas varejistas caíram em julho, após um dos menores índices de crescimento trimestrais da história do país. Isso sugere que a economia está continuando a se desacelerar, aumentando a pressão sobre Pequim para adotar medidas para suportar a atividade econômica.", "titulo_pt": "Sinal de que desaceleração da economia chinesa pode se estender", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 107312, "titulo": "Investimentos em ferrovias na China aumentam 1,8% nos primeiros sete meses do ano, somando R$ 370 bilhões", "url": "https://www.brasildefato.com.br/2026/08/17/investimentos-em-ferrovias-na-china-aumentam-18-nos-primeiros-sete-meses-do-ano-somando-r-370-bilhoes/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-17T15:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os investimentos em infraestrutura ferroviária na China somaram R$ 370 bilhões nos primeiros sete meses de 2025, representando um aumento de 1,8% em comparação com o mesmo período do ano anterior, conforme divulgado pelo Grupo Nacional de Ferrovias da China.", "titulo_pt": "Investimentos em ferrovias na China aumentam 1,8% nos primeiros sete meses do ano, somando R$ 370 bilhões", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 107174, "titulo": "Com técnica de ultracongelamento, Mesa Fit aposta em papinhas para bebês e pets", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/08/com-tecnica-de-ultracongelamento-mesa-fit-aposta-em-papinhas-para-bebes-e-pets.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T15:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Mesa Fit, uma empresa que utiliza a técnica de ultracongelamento, está lançando produtos para bebês e pets. A ideia surgiu da ex-publicitária Janaina Cipriano, que teve a ideia antes de fundar a empresa, durante sua carreira nas agências Bio Ritmo, Cacau Show e Unilever.", "titulo_pt": "Mesa Fit aposta em papinhas para bebês e pets com técnica de ultracongelamento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 107227, "titulo": "Aplicativo do Tesouro Direto é desativado a partir desta segunda-feira", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/aplicativo-do-tesouro-direto-e-desativado-partir-desta-segunda-feira", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-17T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O aplicativo do Tesouro Direto foi desativado nesta segunda-feira (17). A desativação não afeta os investimentos já realizados, que permanecem intactos.", "titulo_pt": "Aplicativo do Tesouro Direto é desativado a partir desta segunda-feira", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 107228, "titulo": "IBC-Br recuou 0,6% em junho, diz Banco Central", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/ibc-br-recuou-06-em-junho-diz-banco-central", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-17T14:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Índice de Atividade Econômica do Banco Central (IBC-Br) recuou 0,6% em junho de 2026 em comparação com maio do mesmo ano. No acumulado do ano até junho, a alta foi de 1,5%.", "titulo_pt": "Ibc-br recua 0,6% em junho de 2026, diz Banco Central", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 107829, "titulo": "Study highlights erroneous use of AI in academic articles", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/18/2003862687", "fonte_id": "taipei_times", "data_pub": "2026-08-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo destaca o uso incorreto da inteligência artificial em artigos acadêmicos.", "titulo_pt": "Estudo destaca uso incorreto da inteligência artificial em artigos acadêmicos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 107837, "titulo": "Survey shows 80% of responding companies using AI", "url": "https://www.taipeitimes.com/News/biz/archives/2026/08/18/2003862655", "fonte_id": "taipei_times", "data_pub": "2026-08-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um levantamento mostrou que 80% das empresas respondentes estão utilizando Inteligência Artificial em suas operações.", "titulo_pt": "Pesquisa mostra que 80% das empresas respondentes estão usando IA", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 107263, "titulo": "Discord suspende lives no Brasil após ordem da ANPD", "url": "https://www.metropoles.com/brasil/discord-suspende-lives-no-brasil-apos-ordem-da-anpd", "fonte_id": "metropoles", "data_pub": "2026-08-17T17:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Agência Nacional de Proteção de Dados (ANPD) solicitou que o Discord suspendesse temporariamente a função de lives no Brasil na última semana. O Discord obedeceu à solicitação da ANPD.", "titulo_pt": "Discord suspende lives no Brasil após ordem da ANPD", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 107247, "titulo": "ChatGPT abre espaço para anúncios e pode criar novo mercado de classificados", "url": "https://veja.abril.com.br/coluna/faria-lima-news/chatgpt-abre-espaco-para-anuncios-e-pode-criar-novo-mercado-de-classificados/", "fonte_id": "veja", "data_pub": "2026-08-17T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A plataforma ChatGPT pode permitir a exibição de anúncios e criar um novo mercado de classificados, conectando consumidores a imóveis, carros, empregos e serviços com base nas conversas.", "titulo_pt": "Chatgpt abre espaço para anúncios e pode criar novo mercado de classificados", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 107843, "titulo": "Nvidia to provide up to US$105 billion guarantee for OpenAI’s Ohio data centre", "url": "https://www.scmp.com/tech/big-tech/article/3364341/nvidia-provide-us105-billion-guarantee-openais-ohio-data-centre?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-17T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia concordou em garantir até US$105 bilhões em pagamentos de aluguel para ajudar a OpenAI a financiar um grande centro de dados em Ohio, desenvolvido pela SB Energy, uma empresa apoiada pelo SoftBank. A empresa de chips também investirá US$1,5 bilhão na SB Energy e assegurará até 8 gigawatts de capacidade de computação de inteligência artificial no local.", "titulo_pt": "Nvidia fornecerá garantia de até US$105 bilhões para centro de dados da OpenAI em Ohio", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 107874, "titulo": "YouTube is changing how it counts views to give the numbers a boost", "url": "https://www.theverge.com/streaming/981105/youtube-video-view-counting-update", "fonte_id": "the_verge", "data_pub": "2026-08-17T17:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A partir de 24 de agosto, o YouTube vai contar uma visualização assim que o vídeo começar a ser reproduzido, conforme o sistema usado por Instagram e TikTok. Isso deve resultar em uma maior elevação mais rápida dos contadores de visualizações para os criadores de conteúdo.", "titulo_pt": "Youtube vai contar visualizações assim que o vídeo começar a ser reproduzido", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 107711, "titulo": "Synchrony, credit card issuer to Amazon and Walmart, partners with OpenAI for ChatGPT shopping", "url": "https://www.cnbc.com/2026/08/17/synchrony-openai-chatgpt-shopping.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-17T17:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Synchrony, que emite cartões de crédito para empresas como Amazon e Walmart, anunciou uma parceria com a OpenAI para integrar o ChatGPT às compras. De acordo com Maran Nalluswami, vice-presidente de estratégia da Synchrony, a integração completa dos pagamentos no ChatGPT provavelmente levará entre seis a doze meses.", "titulo_pt": "Synchrony, emissora de cartões de crédito de Amazon e Walmart, parceira com OpenAI para ChatGPT de compras", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 107168, "titulo": "Plano da China busca liderar dados de IA e moldar sistemas no mundo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/plano-da-china-busca-liderar-dados-de-ia-e-moldar-sistemas-no-mundo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T16:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quando o ChatGPT era uma tecnologia nova, pesquisadores em Pequim testaram sua capacidade de lidar com perguntas em chinês. A reação dos pesquisadores aos resultados foi reveladora.", "titulo_pt": "Plano da China busca liderar dados de IA e moldar sistemas no mundo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 107705, "titulo": "Nvidia backing $105 billion in financing for OpenAI data center in Ohio", "url": "https://www.cnbc.com/2026/08/17/nvidia-financing-open-ai-data-center-ohio.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-17T15:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Nvidia está investindo 105 bilhões de dólares em financiamento para um centro de dados da OpenAI em Ohio. Grandes tecnológicas estão gastando bilhões para aumentar a capacidade em resposta à alta demanda por centros de dados.", "titulo_pt": "Nvidia investindo 105 bilhões de dólares em centro de dados da OpenAI em Ohio", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 107172, "titulo": "Os novos super-ricos da IA estão remodelando o mercado de jatos, iates e carros", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/08/os-novos-super-ricos-da-ia-estao-remodelando-o-mercado-de-jatos-iates-e-carros.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-17T15:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas de inteligência artificial como OpenAI e Anthropic estão gerando uma nova classe de milionários e bilionários, que estão começando a gastar em bens de luxo como jatos, iates e carros.", "titulo_pt": "Novos ricos da IA estão remodelando o mercado de luxo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 107499, "titulo": "Alarm raised over ‘privacy dilemma’ of facial recognition technology at Coles and Woolworths", "url": "https://www.theguardian.com/business/2026/aug/18/concerns-security-privacy-facial-recognition-technology-coles-woolworths", "fonte_id": "guardian_world", "data_pub": "2026-08-17T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Coles e Woolworths estão testando tecnologia de reconhecimento facial em suas lojas australianas para monitorar clientes, mas especialistas afirmam que isso está 'normalizando a vigilância'. Advogados de privacidade dos consumidores expressaram alarme com a possibilidade de coleta de dados biometriaicos pessoais.", "titulo_pt": "Alarme levantado sobre 'dilema de privacidade' de tecnologia de reconhecimento facial em Coles e Woolworths", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 107286, "titulo": "CEO da Amazon diz qual é a habilidade nº 1 para ter sucesso na era da IA — e não é tecnologia", "url": "https://exame.com/inteligencia-artificial/ceo-da-amazon-diz-qual-e-a-habilidade-no-1-para-ter-sucesso-na-era-da-ia-e-nao-e-tecnologia-4/", "fonte_id": "exame", "data_pub": "2026-08-17T14:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da Amazon, Matt Garman, afirma que o pensamento crítico será mais importante do que habilidades técnicas no mercado dominado pela inteligência artificial.", "titulo_pt": "CEO da Amazon diz que o pensamento crítico é a habilidade nº 1 para o sucesso na era da IA — e não são habilidades técnicas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 107288, "titulo": "CEO da Nvidia: 'todo mundo deveria usar esse tipo de IA – é grátis e pode te ensinar qualquer coisa'", "url": "https://exame.com/inteligencia-artificial/ceo-da-nvidia-todo-mundo-deveria-usar-esse-tipo-de-ia-e-gratis-e-pode-te-ensinar-qualquer-coisa-3/", "fonte_id": "exame", "data_pub": "2026-08-17T14:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da Nvidia, Jensen Huang, usa uma inteligência artificial diferente do ChatGPT ou Copilot no seu dia a dia. Ele acha que todos deveriam usar este tipo de IA, que é gratuito e pode ensinar qualquer coisa.", "titulo_pt": "CEO da Nvidia: 'todo mundo deveria usar esse tipo de IA – é grátis e pode te ensinar qualquer coisa'", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 107290, "titulo": "Groq levanta US$ 350 milhões; Nvidia entra na rodada e transforma de vez a rival em aliada", "url": "https://exame.com/tecnologia/groq-levanta-us-350-milhoes-nvidia-entra-na-rodada-e-transforma-de-vez-a-rival-em-aliada/", "fonte_id": "exame", "data_pub": "2026-08-17T14:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A startup Groq levantou US$ 350 milhões em uma rodada de financiamento, com a Nvidia participando como investidora. Como resultado, a rival da Nvidia passa a se reinventar como operadora de data centers de inferência.", "titulo_pt": "Groq arrecada US$ 350 milhões e se transforma em operadora de data centers de inferência, com a Nvidia como investidora", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 107880, "titulo": "Uber partners with Zipline on Eats drone deliveries", "url": "https://www.theverge.com/transportation/980912/uber-eats-zipline-drone-delivery-investment", "fonte_id": "the_verge", "data_pub": "2026-08-17T14:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uber está se associando à empresa de drones Zipline para iniciar entregas de comida por drone no final deste ano, com o objetivo de atingir um milhão de entregas diárias de drone até 2029. A empresa também fez uma investimento estratégico na Zipline, uma companhia californiana que tem realizado entregas por drone no Texas desde 2025.", "titulo_pt": "Uber se associa à Zipline para entregas de comida por drone", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 107291, "titulo": "'É a renda extra perfeita': Esse emprego paga em dólar, é 100% remoto, não têm reuniões e nem chefe", "url": "https://exame.com/carreira/e-a-renda-extra-perfeita-esse-emprego-paga-em-dolar-e-100-remoto-nao-tem-reunioes-e-nem-chefe-3/", "fonte_id": "exame", "data_pub": "2026-08-17T14:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O site estrangeiro contrata brasileiros para trabalhos remotos pagos em dólares, com uma taxa máxima de US$ 30 por hora. O emprego é 100% remoto, não tem reuniões regulares e não há chefes.", "titulo_pt": "É a renda extra perfeita: esse emprego paga em dólar, é 100% remoto, não têm reuniões e nem chefe", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 107826, "titulo": "Pancreatic cancer study shares findings", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/08/18/2003862684", "fonte_id": "taipei_times", "data_pub": "2026-08-18T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo sobre câncer pancreático compartilhou seus resultados. Os detalhes específicos do estudo não foram mencionados nessa notícia.", "titulo_pt": "Estudo sobre câncer pancreático divulga resultados", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 107907, "titulo": "AI companies look to the ocean as a place to put more data centers", "url": "https://phys.org/news/2026-08-ai-companies-ocean-centers.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A expansão do artificial intelligence está gerando uma demanda sem precedentes por centrais de dados, levando as empresas a procurarem soluções alternativas além dos tradicionais centros de dados terrestres. Essa busca é motivada por preocupações crescentes sobre o consumo de energia, água e impacto no meio ambiente dessas instalações.", "titulo_pt": "Empresas de IA buscam o oceano como local para mais centrais de dados", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 107908, "titulo": "How ancient trees are warning us about the next enormous solar storm", "url": "https://phys.org/news/2026-08-ancient-trees-enormous-solar-storm.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos em árvores centenárias indicam que o sol pode estar prestes a gerar uma tempestade solar muito maior do que já foi registrada. Esses eventos podem ser muito mais intensos do que os observados no passado.", "titulo_pt": "Como as antigas árvores estão nos alertando sobre a próxima enorme tempestade solar", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 107909, "titulo": "Study finds some microbes drastically change behavior outside the lab", "url": "https://phys.org/news/2026-08-microbes-drastically-behavior-lab.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo destaca a importância de estudar microrganismos em seu ambiente natural, em vez de se basear exclusivamente em pesquisas laboratoriais. Os pesquisadores observaram que uma cepa de bactérias que crescem nos rizos de milho mudaram drasticamente seu comportamento quando cultivadas no planta, com milhares de proteínas sendo alteradas em relação ao ambiente natural.", "titulo_pt": "Estudo mostra que alguns microrganismos mudam drasticamente seu comportamento no ambiente natural", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 107910, "titulo": "Graphene device measures fractional electric charges carried by some of quantum physics' strangest objects", "url": "https://phys.org/news/2026-08-graphene-device-fractional-electric-quantum.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quasipartículas, que surgem sob condições extremas, parecem carregar apenas uma fração da carga elétrica de um elétron. Essas partículas, consideradas um dos fenômenos mais estranhos da física quântica moderna, têm sido medidas por um dispositivo feito de grafeno.", "titulo_pt": "Dispositivo de grafeno mede cargas elétricas fracionárias de alguns dos objetos mais estranhos da física quântica", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 107911, "titulo": "AI exposes devastating impact of bomb fishing on coral reefs", "url": "https://phys.org/news/2026-08-ai-exposes-devastating-impact-fishing.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa piloto revela que a pesca ilegal com bombas está causando danos severos aos recifes de coral mais biodiversos do mundo. O estudo envolveu o pesquisador coraliano Dr. Tim Lamont do Lancaster Environment Centre.", "titulo_pt": "IA expõe impacto devastador da pesca com bombas nos recifes de coral", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 107912, "titulo": "It's not just flowers that help the pollinators. Grass can too.", "url": "https://phys.org/news/2026-08-pollinators-grass.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova pesquisa da Universidade da Geórgia sugere que abelhas podem estar dependendo do gramado para encontrar alimentos. O estudo indica que gramados podem ser importantes para os polinizadores além de plantas ornamentais e flores.", "titulo_pt": "Não são apenas flores que ajudam os polinizadores. O gramado também pode ajudar.", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 107913, "titulo": "New X-ray imaging technique could double scanning efficiency while revealing hidden detail", "url": "https://phys.org/news/2026-08-ray-imaging-technique-scanning-efficiency.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Universidade Monash desenvolveram uma nova técnica de imagens por raios-X que pode imager duas amostras superpostas simultaneamente, potencialmente duplicando a eficiência do escaneamento e abrindo novas possibilidades para a inspeção industrial e pesquisas científicas.", "titulo_pt": "Nova técnica de imagens por raios-x pode dobrar a eficiência do escaneamento enquanto revela detalhes ocultos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 107156, "titulo": "Usar o ChatGPT prejudica o cérebro? Ainda estamos longe de saber", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/usar-o-chatgpt-prejudica-o-cerebro-ainda-estamos-longe-de-saber.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-17T17:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os humanos têm criado ferramentas para resolver problemas há muito tempo. O desenvolvimento de tecnologias, como a calculadora eletrônica e a inteligência artificial generativa, ocorreu rapidamente nos últimos cem anos. Essas ferramentas estão se tornando cada vez mais integradas na vida cotidiana das pessoas.", "titulo_pt": "Usar o ChatGPT prejudica o cérebro? Ainda estamos longe de saber", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 107915, "titulo": "Hostile attitudes toward women are driving extremism in young Australians", "url": "https://phys.org/news/2026-08-hostile-attitudes-women-extremism-young.html", "fonte_id": "phys_org", "data_pub": "2026-08-17T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alunos estão sendo direcionados para câmaras de eco, atraídos para conteúdo extremista através de caminhos inocentes como jogos e vídeos de exercícios, e então expostos a misogínio extremo, racismo, homofobia e transfobia. Isso, conforme relatado por um professor australiano, é o que está ocorrendo nas salas de aula.", "titulo_pt": "Atitudes hostis em relação às mulheres estão impulsionando o extremismo entre jovens australianos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 107942, "titulo": "ULA names Peller as new CEO", "url": "https://spacenews.com/ula-names-peller-as-new-ceo/", "fonte_id": "spacenews", "data_pub": "2026-08-17T16:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mark Peller, um gerente de longa data da United Launch Alliance, foi nomeado como novo CEO da empresa. A notícia foi publicada originalmente pelo SpaceNews.", "titulo_pt": "ULA nomeia Peller como novo CEO", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 107258, "titulo": "Ebola: OMS diz que surto é o maior da história do Congo e tem ‘excepcional velocidade de transmissão’", "url": "https://veja.abril.com.br/saude/ebola-oms-diz-que-surto-e-o-maior-da-historia-do-congo-e-tem-excepcional-velocidade-de-transmissao/", "fonte_id": "veja", "data_pub": "2026-08-17T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Organização Mundial da Saúde (OMS) declarou que o surto de Ebola no Congo é o maior da história do país e apresenta uma 'velocidade de transmissão excepcional'. A fase atual envolve a cepa Bundibugyo, que não possui tratamento ou vacina.", "titulo_pt": "Ebola: OMS afirma que surto é o maior da história do Congo e tem 'velocidade de transmissão excepcional'", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 107932, "titulo": "How climate change created a new \"Ice Silk Road\" in the Arctic", "url": "https://www.scientificamerican.com/article/how-climate-change-created-a-new-ice-silk-road-in-the-arctic/", "fonte_id": "scientific_american", "data_pub": "2026-08-17T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "China planeja enviar navios-container ao longo da costa russa do norte, reavivando preocupações ambientais sobre a região polar frágil.", "titulo_pt": "Como o aquecimento global criou uma nova 'rodovia do gelo de silício' no ártico", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 107954, "titulo": "Colorful Collage of Tarantula Nebula", "url": "https://www.nasa.gov/image-article/colorful-collage-of-tarantula-nebula/", "fonte_id": "nasa_news", "data_pub": "2026-08-17T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imagens da NASA combinam dados do Telescópio Espacial X Chandra, do Telescópio Espacial James Webb e do Telescópio Espacial Hubble para revelar uma visão vibrante da Nébula do Tarânt
