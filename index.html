Lula 4", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/10/setor-de-energia-renovavel-cobra-implementacao-de-politicas-em-lula-4.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Representantes da indústria de energia renovável afirmam que o presidente Luiz Inácio Lula da Silva, reeleito para um quarto mandato, precisará trabalhar pela implementação de políticas voltadas à transição energética.", "titulo_pt": "Setor de energia renovável cobra implementação de políticas em Lula 4", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 230644, "titulo": "Avião que levaria Flávio Bolsonaro e família parte do Equador em direção a Miami", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/flavio-bolsonaro-entra-na-argentina-e-segue-em-voo-privado-ao-equador-diz-migracao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-28T05:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro, sua esposa Fernanda Antunes Figueira Bolsonaro e as duas filhas entraram na Argentina na noite desta terça-feira (27) pela Ponte Internacional Tancredo Neves, na província de Misiones. Eles viajam de avião em direção a Miami.", "titulo_pt": "Avião com Flávio Bolsonaro e família parte do Equador para Miami", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 230645, "titulo": "Trump diz que aprovaria visto de Flávio, mas que não sabe o paradeiro do senador", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/trump-diz-que-aprovaria-visto-de-flavio-mas-que-nao-sabe-o-paradeiro-do-senador.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-28T05:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, declarou que aprovaria o visto para o senador Flávio Bolsonaro, mas não sabe onde está o político.", "titulo_pt": "Trump diz que aprovaria visto de Flávio, mas não sabe o paradeiro do senador", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 229920, "titulo": "Lula critica oponente e aliados falam em 'perseguição'", "url": "https://www.bbc.com/portuguese/articles/cm3vq7q59ne6o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-28T02:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados e oponentes de Flávio Bolsonaro, incluindo o presidente Lula, expressaram suas posições sobre a desaparição do senador. O presidente Lula criticou um oponente não especificado, enquanto outros falaram sobre uma possível perseguição.", "titulo_pt": "Lula critica oponente e aliados falam em 'perseguição'", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 229647, "titulo": "MPF arquiva denúncia de Nikolas Ferreira contra redator da lei das bets", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/mpf-arquiva-denuncia-de-nikolas-ferreira-contra-redator-da-lei-das-bets.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T02:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal Nikolas Ferreira pediu ao Ministério Público Federal que investigasse o advogado José Francisco Manssur, autor da lei das apostas online, por suposto conflito de interesse. No entanto, a denúncia foi arquivada na última segunda-feira (26).", "titulo_pt": "MPF arquiva denúncia de Nikolas Ferreira contra redator da lei das bets", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 230751, "titulo": "Aliados de Flávio Bolsonaro reconhecem derrota para Lula", "url": "https://www.dw.com/pt-br/aliados-de-flávio-bolsonaro-reconhecem-derrota-para-lula/a-79782287?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-28T02:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados de Flávio Bolsonaro, como o governador Tarcísio de Freitas e o candidato a vice Alfredo Gaspar, agradeceram os votos e reconheceram a derrota para Lula. O governador de São Paulo afirmou que 'a eleição passou'.", "titulo_pt": "Aliados de Flávio Bolsonaro reconhecem derrota para Lula", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 229931, "titulo": "A sanção política preservada pelo STF na ADI 5.161", "url": "https://www.jota.info/opiniao-e-analise/colunas/macrolitigancia-fiscal/a-sancao-politica-preservada-pelo-stf-na-adi-5-161", "fonte_id": "jota", "data_pub": "2026-10-28T02:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A interpretação conforme a lei limitou a aplicação da multa, mas manteve a coerção, considerada incompatível com as garantias dos contribuintes. O STF (Supremo Tribunal Federal) preservou a sanção política na ADI 5.161.", "titulo_pt": "A sanção política mantida pelo STF na ADI 5.161", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 229648, "titulo": "Câmara aprova ampliação de adicional de fronteira e eleva gasto do governo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/camara-aprova-ampliacao-de-adicional-de-fronteira-e-eleva-gasto-do-governo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T02:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados aprovou a ampliação do adicional de fronteira para novas carreiras públicas. O valor do adicional será reajustado de R$ 91 para R$ 191 por dia a partir de 2027.", "titulo_pt": "Câmara aprova ampliação do adicional de fronteira e aumenta gasto do governo", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 229654, "titulo": "Bolsonaristas divulgam listas de boicote a empresas e falam em demitir petistas após reeleição de Lula", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/bolsonaristas-divulgam-listas-de-boicote-a-empresas-e-falam-em-demitir-petistas-apos-reeleicao-de-lula.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Após a vitória de Lula nas eleições, bolsonaristas em redes sociais incentivaram a demissão de petistas e boicote a empresas que apoiaram Lula.", "titulo_pt": "Bolsonaristas incentivam demissões e boicote a empresas após vitória de Lula", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 229674, "titulo": "PT obtém melhor resultado no Sudeste desde 2010 e bolsonarismo perde força", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/pt-obtem-melhor-resultado-no-sudeste-desde-2010-e-bolsonarismo-perde-forca.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PT obteve seu melhor desempenho para o segundo turno no Sudeste desde 2010. A vitória de Flávio Bolsonaro foi conquistada com uma margem menor de votos em comparação com eleições anteriores.", "titulo_pt": "PT obtém melhor resultado no segundo turno no Sudeste desde 2010 e bolsonarismo perde força", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 231085, "titulo": "Serbia Raises Terror Alert After Attack on Israeli Embassy", "url": "https://balkaninsight.com/2026/10/28/serbia-raises-terror-alert-after-attack-on-israeli-embassy/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-10-28T09:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois de um ataque a um guarda policial na embaixada israelita em Belgrado, o ministro interino de Interior da Sérvia, Ivica Dacic, elevou o nível de alerta terrorista ao máximo.", "titulo_pt": "Sérvia aumenta nível de alerta terrorista após ataque à embaixada israelita", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 231028, "titulo": "Israel’s genocide in Gaza: Death toll rises to 74,564", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israels-genocide-gaza-death-toll-rises-74564", "fonte_id": "middle_east_eye", "data_pub": "2026-10-28T09:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Saúde de Gaza relatou que, desde outubro de 2023, pelo menos 74.564 palestinos foram mortos e 175.770 feridos em consequência das operações israelenses. Durante as últimas 24 horas, três pessoas morreram e 11 ficaram feridas. A partir de 11 de outubro de 2025, 1.568 palestinos foram mortos e 5.649 feridos por ataques israelenses, e 845 corpos foram recuperados.", "titulo_pt": "Genocídio de israel em Gaza: balanço de mortes atinge 74.564", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 230987, "titulo": "Mapping the siege of Yemen’s Taiz, and the price families are paying", "url": "https://www.aljazeera.com/news/2026/10/28/mapping-the-siege-of-yemens-taiz-and-the-price-families-are-paying?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-28T09:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três semanas após o início do cerco em Taiz, a terceira maior cidade do Yemen, os preços dos produtos básicos dobraram, afetando significativamente as famílias locais.", "titulo_pt": "Mapando o cerco de Taiz, na Yemen, e o preço que as famílias estão pagando", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 231172, "titulo": "(URGENT) Defense chiefs of S. Korea, U.S. to meet for bilateral talks in Washington next month: Seoul", "url": "https://en.yna.co.kr/view/AEN20261028011900315", "fonte_id": "yonhap_news", "data_pub": "2026-10-28T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro da Defesa da Coreia do Sul e seu homólogo dos Estados Unidos irão se encontrar em Washington no próximo mês para discutir assuntos bilaterais.", "titulo_pt": "Ministros de defesa da Coreia do sul e EUA se encontrarão em Washington no próximo mês", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 231173, "titulo": "(URGENT) Defense chiefs of S. Korea, U.S. to hold key bilateral security dialogue early next year: Seoul", "url": "https://en.yna.co.kr/view/AEN20261028011800315", "fonte_id": "yonhap_news", "data_pub": "2026-10-28T09:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os chefes de defesa da Coreia do Sul e dos Estados Unidos planejam realizar uma importante conversa bilateral sobre segurança no início do próximo ano.", "titulo_pt": "Chefes de defesa da Coreia do sul e EUA planejam diálogo sobre segurança bilateral no início de 2023", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 231029, "titulo": "Israeli attack wounds two in southern Gaza as election count continues", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-attack-wounds-two-southern-gaza-election-count-continues", "fonte_id": "middle_east_eye", "data_pub": "2026-10-28T09:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque israelense feriu duas pessoas em Khan Younis, no sul da Gaza. O ataque ocorreu enquanto Israel contava os votos da eleição parlamentar, a primeira desde o início da operação na Gaza em outubro de 2023.", "titulo_pt": "Ataque israelense ferira duas pessoas no sul da Gaza enquanto se conta os votos da eleição", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 230952, "titulo": "Israel faces prospect of parliament without a majority after crucial elections", "url": "https://www.lemonde.fr/en/international/article/2026/10/28/israel-faces-prospect-of-parliament-without-a-majority-after-crucial-elections_6765773_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-28T09:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As provisões dos resultados das eleições mostraram perdas significativas para o bloco de Benjamin Netanyahu, mas a oposição, liderada por Gadi Eisenkot, não foi capaz de derrubar o Likud como o maior partido. Nem bloco está em posição para formar um governo.", "titulo_pt": "Israel enfrenta a perspectiva de um parlamento sem maioria após eleições cruciais", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 231090, "titulo": "China seeks India’s help in defusing border tensions", "url": "https://www.scmp.com/plus/news/china/diplomacy/article/3372433/china-seeks-indias-help-defusing-border-tensions", "fonte_id": "scmp", "data_pub": "2026-10-28T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A China expressou interesse em trabalhar com a Índia para manter a paz e a estabilidade nas áreas fronteiriças, após novos impasses em uma região disputada. A China espera que a Índia coopere para implementar acordos bilaterais.", "titulo_pt": "China pede ajuda à Índia para aliviar tensões fronteiriças", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 230990, "titulo": "China says it takes Mbappe’s apology ‘seriously’ after Mao dictator comment", "url": "https://www.aljazeera.com/sports/2026/10/28/china-says-it-takes-mbappes-apology-seriously-after-mao-dictator-comment?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-28T08:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kylian Mbappé, jogador francês de futebol, expressou uma desculpa após comentários que ofenderam Beijing. A China afirmou que toma a desculpa do atleta 'seriamente'.", "titulo_pt": "China diz que toma a desculpa de mbappé 'seriamente' após comentário sobre ditador Mao", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 230827, "titulo": "Trump espera mantener “muy pronto” una reunión con Putin y Zelenski ante los “grandes progresos” obtenidos", "url": "https://www.latercera.com/mundo/noticia/trump-espera-mantener-muy-pronto-una-reunion-con-putin-y-zelenski-ante-los-grandes-progresos-obtenidos/", "fonte_id": "la_tercera", "data_pub": "2026-10-28T08:52:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Trump espera realizar uma reunião com Putin e Zelenski 'muito em breve' devido aos 'grandes avanços' alcançados na situação envolvendo Rússia e Ucrânia.", "titulo_pt": "Trump espera manter reunião com Putin e Zelenski 'muito em breve'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 231064, "titulo": "With Israel poll results still murky, what happens next?", "url": "https://www.japantimes.co.jp/news/2026/10/28/world/politics/israel-election-explainer/", "fonte_id": "japan_times", "data_pub": "2026-10-28T08:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os votos estão sendo contados, e as negociações para formar uma coalizão governamental podem demorar.", "titulo_pt": "Com os resultados da eleição israelense ainda incertos, o que vem por aí?", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 231023, "titulo": "Bolsonaro lands in US after fleeing Brazil following election defeat", "url": "https://www.ft.com/content/ec7a3e3e-21e3-44de-81ee-db2f2073bee3?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-28T08:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O político direitista e filho do ex-presidente Jair Bolsonaro, atualmente preso, chegou à Flórida na noite de ontem. Bolsonaro fugiu do Brasil após sua derrota nas eleições.", "titulo_pt": "Bolsonaro chega aos EUA após fugir do Brasil após derrota nas eleições", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 230992, "titulo": "Khouri: Strong Israel-Arab bloc result does not mean Israel has changed", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/28/khouri-strong-israel-arab-bloc-result-does-not-mean-israel-has-changed?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-28T08:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Rami Khouri questiona a ideia de que um resultado forte para um bloco israelense-árabe indica qualquer mudança positiva na sociedade israelense.", "titulo_pt": "Khouri: resultado forte para bloco israelense-árabe não significa mudança positiva em Israel", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 230993, "titulo": "Is AIPAC losing its grip on US politics?", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/28/is-aipac-losing-its-grip-on-us-politics?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-28T08:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "AIPAC, a lobby pro-israel, está mudando sua estratégia, encerrando endossos de candidatos e contribuições diretas para campanhas.", "titulo_pt": "AIPAC está perdendo seu domínio na política dos EUA?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 231019, "titulo": "Israel’s election: what happens next?", "url": "https://www.ft.com/content/4f122702-3765-4e9f-a94f-4b786bc2af15", "fonte_id": "financial_times", "data_pub": "2026-10-28T08:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os resultados parciais indicam que nem o atual primeiro-ministro de Israel, Benjamin Netanyahu, nem seus concorrentes têm um caminho direto para formar um governo.", "titulo_pt": "Eleições israelenses: o que vem_next?", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 230997, "titulo": "Why the US midterms matter even if you don’t live in America", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/28/why-the-us-midterms-matter-even-if-you-dont-live-in-america?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-28T08:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As eleições médias dos Estados Unidos podem influenciar decisões sobre assistência militar, sanções, comércio e tarifas que afetam milhões de pessoas.", "titulo_pt": "Por que as eleições médias dos EUA importam mesmo se você não mora nos estados unidos", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 230813, "titulo": "STJ mantém TJLP como limite para dedução de JCP", "url": "https://www.jota.info/tributos/stj-mantem-tjlp-como-limite-para-deducao-de-jcp", "fonte_id": "jota", "data_pub": "2026-10-28T09:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Turma Recursal do Superior Tribunal de Justiça manteve a aplicação do TJLP (Taxa de Juros da Lei de Planejamento) como limite para a dedução de Juros de Capital Próprio. As empresas não conseguiram convencer a turma a usar uma metodologia alternativa que permitiria uma maior dedução.", "titulo_pt": "STJ mantém TJLP como limite para dedução de juros de capital próprio", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 230779, "titulo": "O Itaú quer ser um ChatGPT financeiro. Este M&A é um passo importante", "url": "https://braziljournal.com/o-itau-quer-ser-um-chatgpt-financeiro-este-m-and-a-e-um-passo-importante", "fonte_id": "brazil_journal", "data_pub": "2026-10-28T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em outubro de 2019, o Itaú adquiriu a startup Zup por R$ 500 milhões para acelerar sua transformação digital. Sete anos depois, o banco está novamente investindo em uma startup de tecnologia, mas com um valor maior e maiores desafios.", "titulo_pt": "O Itaú quer ser um ChatGPT financeiro. Este M&A é um passo importante", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 230780, "titulo": "Na Petrobras, preço dos combustíveis vira bode na sala", "url": "https://braziljournal.com/na-petrobras-preco-dos-combustiveis-vira-bode-na-sala", "fonte_id": "brazil_journal", "data_pub": "2026-10-28T09:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Na primeira reunião do conselho da Petrobras após as eleições, os membros discutiram planos para aumentar os preços dos combustíveis. Isso ocorreu poucas horas após o fechamento das urnas, demonstrando a imediata pressão sobre a empresa a respeito desse tema.", "titulo_pt": "Na Petrobras, discussão sobre aumento dos combustíveis na primeira reunião do conselho após as eleições", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 230714, "titulo": "Pandemia, Joesley Day, eleição: relembre os maiores sustos do Tesouro Direto", "url": "https://www.infomoney.com.br/onde-investir/tesouro-direto-maiores-sustos-serie-historica/", "fonte_id": "infomoney", "data_pub": "2026-10-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A disparada das taxas de juros na segunda-feira foi o maior aumento desde o início da série do Tesouro Direto em 2005. O título lista os principais eventos que causaram altas significativas nas taxas de juros, incluindo a pandemia, o caso Joesley Batista e a eleição presidencial.", "titulo_pt": "Pandemia, Joesley batista, eleição: relembre os maiores sustos do Tesouro Direto", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 231024, "titulo": "European banks boost profits but fail to match Wall Street boom", "url": "https://www.ft.com/content/b12e4896-5c72-460c-b1c4-df433e5e8ca9?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-28T08:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bancos europeus aumentaram seus lucros graças a investimentos de clientes ricos e à atividade resiliente no setor de bancos de investimento e corporativo.", "titulo_pt": "Bancos europeus melhoram resultados, mas não alcançam a expansão dos bancos norte-americanos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 230815, "titulo": "Fim das bets: quem paga a conta?", "url": "https://www.jota.info/opiniao-e-analise/artigos/fim-das-bets-quem-paga-a-conta", "fonte_id": "jota", "data_pub": "2026-10-28T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma proposta de lei que proibiu as apostas abriu novamente debates sobre quem deve assumir o passivo financeiro significativo do setor de apostas.", "titulo_pt": "Fim das apostas: quem paga a conta?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 231176, "titulo": "LG Chem to sell 2.5 tln-won stake in battery unit to boost shareholder value", "url": "https://en.yna.co.kr/view/AEN20261028011400320", "fonte_id": "yonhap_news", "data_pub": "2026-10-28T08:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A LG Chem, principal empresa química da Coreia do Sul, planeja vender uma participação de 2,5 trilhões de wons em sua unidade de baterias para aumentar o valor para os acionistas.", "titulo_pt": "LG Chem venderá 2,5 trilhões de wons da unidade de baterias para melhorar o valor para os acionistas", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 230816, "titulo": "Competências para a gestão de pessoas no serviço público", "url": "https://www.jota.info/opiniao-e-analise/artigos/competencias-para-a-gestao-de-pessoas-no-servico-publico", "fonte_id": "jota", "data_pub": "2026-10-28T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto aborda a importância de um referencial comum para o desenvolvimento profissional das competências na gestão de pessoas no serviço público.", "titulo_pt": "Competências para a gestão de pessoas no serviço público", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 230817, "titulo": "O boleto, o split e o crédito alheio", "url": "https://www.jota.info/opiniao-e-analise/artigos/o-boleto-o-split-e-o-credito-alheio", "fonte_id": "jota", "data_pub": "2026-10-28T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 2027, a decisão sobre o crédito concedido a quem paga boletos será baseada na escolha do fornecedor.", "titulo_pt": "Crédito de quem paga boleto depende da escolha do fornecedor em 2027", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 230719, "titulo": "Bancos reduzem exposição ao Brasil após eleição e buscam proteções na Bolsa", "url": "https://www.infomoney.com.br/mercados/bancos-reduzem-exposicao-ao-brasil-apos-eleicao-e-buscam-protecoes-na-bolsa/", "fonte_id": "infomoney", "data_pub": "2026-10-28T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bancos globais reduziram sua exposição ao Brasil após a reeleição de Lula, focando em empresas exportadoras e com receitas mais previsíveis. Os bancos citam maior risco fiscal como motivo para essa mudança.", "titulo_pt": "Bancos reduzem exposição ao Brasil após eleição e buscam proteções na Bolsa", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 230984, "titulo": "Meta- and Google-backed Jio Platforms’ shares soar over 21% on trading debut after record IPO", "url": "https://www.cnbc.com/2026/10/28/jio-ipo-india-listing-.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-28T07:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Jio Platforms, apoiada por Meta e Google, viu suas ações subirem mais de 21% em seu primeiro dia de negociação após um IPO recorde, arrecadando 302 bilhões de rúpias (cerca de 3,2 bilhões de dólares) com a oferta de 270 milhões de ações a 1.119 rúpias cada uma.", "titulo_pt": "Ações da Jio Platforms subem mais de 21% em IPO recorde após apoio de meta e google", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 231139, "titulo": "OCI posts record nine-month operating profit since 2023 spin-off", "url": "https://www.koreaherald.com/article/10917914", "fonte_id": "korea_herald", "data_pub": "2026-10-28T07:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OCI relatou receita de 599,1 bilhões de wones (451 milhões de dólares) e lucro operacional de 30,3 bilhões de wones no terceiro trimestre, impulsionado por vendas mais fortes de materiais de semicondutores e preços mais altos de carbono negro. O lucro operacional acumulado nos primeiros nove meses do ano atingiu seu nível mais alto desde a spin-off da empresa em 2023.", "titulo_pt": "OCI registra lucro operacional recorde nos nove primeiros meses desde a spin-off de 2023", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 230650, "titulo": "Os vencedores e os perdedores da economia dos medicamentos para emagrecer", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/os-vencedores-e-os-perdedores-da-economia-dos-medicamentos-para-emagrecer.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Alan Horowitz, que atua no negócio de ternos sob medida há 25 anos, perdeu clientes devido à disseminação de medicamentos para emagrecimento nos Estados Unidos. Estes medicamentos se tornaram comuns, com um em cada dez americanos já os utilizando.", "titulo_pt": "Vencedores e perdedores da economia dos medicamentos para emagrecer", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 230652, "titulo": "Split payment começa em agosto de 2027 e deve ser obrigatório em até dois anos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/split-payment-comeca-em-agosto-de-2027-e-deve-ser-obrigatorio-em-ate-dois-anos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O split payment da reforma tributária está programado para ser lançado em agosto e outubro de 2027, conforme cronograma obtido pela Folha com exclusividade. A implementação deve ser obrigatória em até dois anos após o lançamento inicial.", "titulo_pt": "Split payment da reforma tributária começa em agosto de 2027 e deve ser obrigatório em até dois anos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 231068, "titulo": "Bank of Japan unlikely to take rates higher this week", "url": "https://www.japantimes.co.jp/business/2026/10/28/economy/boj-meeting-preview/", "fonte_id": "japan_times", "data_pub": "2026-10-28T06:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado não espera uma elevação de taxas novamente nesta semana, mas considera uma possibilidade real para dezembro.", "titulo_pt": "Banco do Japão pouco provável de aumentar as taxas nesta semana", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 231069, "titulo": "U.S.-aligned countries, led by Asia, slash U.S. Treasury purchases by 60%", "url": "https://www.japantimes.co.jp/business/2026/10/28/companies/us-treasury-purchases-asia-60/", "fonte_id": "japan_times", "data_pub": "2026-10-28T06:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Países alinhados aos Estados Unidos, liderados por nações asiáticas, reduziram suas compras de títulos do tesouro dos EUA em 60%. Analistas apontam moedas frágeis, rendimentos em aumento no mercado local, maior demanda por ações e inquietação com a política dos EUA como motivos para essa redução.", "titulo_pt": "Países alinhados aos EUA, liderados por nações asiáticas, reduzem compras de títulos do tesouro norte-americano em 60%", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 231119, "titulo": "The Men Spending $50,000 Just to Reserve a Tesla Roadster", "url": "https://www.wired.com/story/the-men-dropping-50000-and-up-on-teslas-new-roadster/", "fonte_id": "wired", "data_pub": "2026-10-28T09:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os clientes estão reservando um Tesla Roadster por cerca de $50.000, com a versão com sistema de voo sendo mais cara. Um cliente declarou que fará tudo para obter a versão com capacidade de voo.", "titulo_pt": "Homens gastam $50.000 apenas para reservar um Tesla Roadster", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 231120, "titulo": "ICE Is Running One of the Largest Anti-Left Surveillance Operations in US History", "url": "https://www.wired.com/story/ice-is-running-one-of-the-largest-anti-left-surveillance-operations-in-us-history/", "fonte_id": "wired", "data_pub": "2026-10-28T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A ICE está realizando uma das maiores operações de vigilância antilivre-pensador na história dos Estados Unidos, comparável às intervenções do FBI e da CIA nos movimentos de direitos civis e contra a guerra.", "titulo_pt": "ICE está conduzindo uma das maiores operações de vigilância antilivre-pensador na história dos EUA", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 230942, "titulo": "The real election tech vulnerabilities in 2026", "url": "https://www.axios.com/2026/10/28/election-security-paper-ballots-audits", "fonte_id": "axios", "data_pub": "2026-10-28T09:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Algumas das maiores vulnerabilidades na segurança das eleições estão evidentes. Embora não haja evidências credíveis de que sistemas de votação tenham sido explorados para alterar resultados, pesquisadores encontraram falhas isoladas que ameaçam a sigilosidade do voto, a precisão da contagem dos votos e a verificação independente dos resultados. Os especialistas recomendam o uso de votos impressos e auditorias rigorosas para eleições confiáveis.", "titulo_pt": "As verdadeiras vulnerabilidades tecnológicas nas eleições de 2026", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 230943, "titulo": "Inside \"Black October\": AI's cyber scare delivers a Y2K lesson", "url": "https://www.axios.com/2026/10/28/cybersecurity-black-october-ai-hacks", "fonte_id": "axios", "data_pub": "2026-10-28T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A comunidade de segurança cibernética esteve preparada para uma catástrofe após a descoberta de falhas críticas no código fundamental da web por meio da inteligência artificial, mas as tentativas automatizadas de ataques não deram o resultado esperado. A defesa empreendida por muitas empresas parece ter ajudado a mitigar os efeitos dessas vulnerabilidades.", "titulo_pt": "Dentro do 'outubro negro': a lição Y2K da ameaça cibernética de IA", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 230944, "titulo": "Ukraine's Starlink woes spur Europe to look for non-Musk alternatives", "url": "https://www.axios.com/2026/10/28/starlink-musk-ukraine-war-satcom", "fonte_id": "axios", "data_pub": "2026-10-28T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A crise no serviço Starlink na Ucrânia levou a Europa a buscar alternativas de comunicação espacial fora do controle de Elon Musk. SpaceX, empresa de Musk, é líder mundial em conectividade espacial, com mais de 11.000 satélites, o que expõe a dependência militar a um único provedor.", "titulo_pt": "Problemas da Starlink na Ucrânia fazem Europa procurar alternativas não-muskianas", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 231196, "titulo": "Fintech: Europe’s 10 most-funded companies in H1 2026", "url": "https://tech.eu/2026/10/28/fintech-europes-10-most-funded-companies-in-h1-2026/", "fonte_id": "tech_eu", "data_pub": "2026-10-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O financiamento de fintechs na Europa no primeiro semestre de 2026 foi marcado por várias transações de financiamento significativas, além de investimentos em áreas como bancos, pagamentos, tecnologia de seguros, gestão de riqueza e infraestrutura financeira.", "titulo_pt": "Fintech: 10 empresas mais bem financiadas da Europa no primeiro semestre de 2026", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 231174, "titulo": "HD Hyundai says discussing potential order volume with U.S. Navy", "url": "https://en.yna.co.kr/view/AEN20261028011600315", "fonte_id": "yonhap_news", "data_pub": "2026-10-28T08:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A gigante sul-coreana de construção naval HD Hyundai está discutindo possíveis volumes de pedidos com a Marinha dos Estados Unidos.", "titulo_pt": "HD Hyundai discute possíveis pedidos com a marinha dos EUA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 231130, "titulo": "Communications watchdog fines Google, Apple over in-app payment policies", "url": "https://www.koreaherald.com/article/10918092", "fonte_id": "korea_herald", "data_pub": "2026-10-28T08:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão de Comunicações e Telecomunicações da Coreia imputou multas combinadas de 63,7 bilhões de wones (cerca de 45 milhões de dólares) à Google e à Apple por limitar as opções de pagamento dos desenvolvedores de aplicativos através de suas políticas de pagamento dentro da aplicação. A multa para a Google foi de 42,9 bilhões de wones e para a Apple, 20,81 bilhões de wones, por violar a Lei de Serviços de Telecomunicações.", "titulo_pt": "Regulador de comunicações multa Google e Apple por políticas de pagamento dentro de aplicativos", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 231121, "titulo": "AI Emergency Alerts Are Coming. Humans Might Not Be Ready", "url": "https://www.wired.com/story/ai-emergency-alerts-coming-humans-not-ready/", "fonte_id": "wired", "data_pub": "2026-10-28T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Humanos têm dificuldades com comunicação em emergências. Assistentes de chat podem auxiliar, mas as pessoas precisam levá-los a sério.", "titulo_pt": "Alertas de emergência de IA chegam. Humanos podem não estar preparados", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 231132, "titulo": "Seoul shares soar over 6% on revived AI optimism, SK hynix earnings", "url": "https://www.koreaherald.com/article/10918082", "fonte_id": "korea_herald", "data_pub": "2026-10-28T08:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações de Seul subiram mais de 6% após a SK hynix anunciar lucros trimestrais recorde e declarar dividendos adicionais. O índice de referência Kospi atingiu 6.012,44 pontos. O won sul-coreano caiu em relação ao dólar americano.", "titulo_pt": "Ações de seul ganham mais de 6% com otimismo renovado em AI e resultados da SK hynix", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 231065, "titulo": "Website used by hackers to leak info shut down, GMO says", "url": "https://www.japantimes.co.jp/news/2026/10/28/japan/crime-legal/gmo-hacker-website-shutdown/", "fonte_id": "japan_times", "data_pub": "2026-10-28T08:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa de internet GMO anunciou uma recompensa de até 1 milhão de dólares para informações levando à prisão do grupo de hackers. A empresa também criou um site para coletar pistas sobre o grupo.", "titulo_pt": "Site usado por hackers para vazamento de informações é fechado, diz GMO", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 231177, "titulo": "(LEAD) Samsung C&T Q3 net falls 9.5 pct on FX losses", "url": "https://en.yna.co.kr/view/AEN20261028008451320", "fonte_id": "yonhap_news", "data_pub": "2026-10-28T08:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung C&T Corp., empresa de construção e comércio, registrou uma queda de 9,5% no lucro líquido no terceiro trimestre de 2021, atribuída a perdas cambiais.", "titulo_pt": "Lucro líquido da Samsung C&T cai 9,5% no terceiro trimestre devido a perdas cambiais", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 231095, "titulo": "How Lao Gan Ma, China’s iconic chilli brand, got caught in an AI storm", "url": "https://www.scmp.com/tech/tech-trends/article/3372414/how-lao-gan-ma-chinas-iconic-chilli-brand-got-caught-ai-storm", "fonte_id": "scmp", "data_pub": "2026-10-28T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lao Gan Ma, uma famosa marca de molho de chili no chinês, teve seus produtos recentemente envolvidos em rumores sobre a substituição de trabalhadores humanos por inteligência artificial nas fábricas, levando a boicotes e preocupações crescentes sobre o impacto da tecnologia na indústria.", "titulo_pt": "Como a famosa marca de molho de chili Lao Gan Ma se viu no centro de uma tempestade de inteligência artificial", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 230742, "titulo": "Echoenergia mira hidrelétricas para diversificar negócios e defende leilões", "url": "https://www.cnnbrasil.com.br/infra/echoenergia-mira-hidreletricas-para-diversificar-portfolio-e-defende-leiloe/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-28T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A companhia Echoenergia está avaliando oportunidades em hidrelétricas, caso as concessões sejam relicitadas. A empresa argumenta sobre a concentração do mercado como motivo para novas disputas.", "titulo_pt": "Echoenergia mira hidrelétricas para diversificar negócios e defende relicitações", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 231098, "titulo": "China’s hybrid car exports to EU up 200%; response to Tesla’s ‘flying car’: 7 EV reads", "url": "https://www.scmp.com/business/china-evs/article/3372399/chinas-hybrid-car-exports-eu-200-response-teslas-flying-car-7-ev-reads", "fonte_id": "scmp", "data_pub": "2026-10-28T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A BYD, fabricante chinesa de veículos elétricos, planeja construir novas fábricas na Europa para aumentar sua participação no mercado, enquanto enfrenta um recuo no apoio fiscal em casa e crescentes barreiras comerciais no exterior. As exportações de veículos elétricos híbridos da China para a União Europeia aumentaram 200%.", "titulo_pt": "Exportações de veículos elétricos híbridos da china para a ue aumentam 200%; byd planeja novas fábricas na Europa", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 231181, "titulo": "(LEAD) HD Hyundai Q3 net profit up 40 pct to 1.38 tln won", "url": "https://en.yna.co.kr/view/AEN20261028007451320", "fonte_id": "yonhap_news", "data_pub": "2026-10-28T07:12:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A HD Hyundai, holding da Hyundai no sul da Coreia, registrou um lucro líquido no terceiro trimestre de 2021 de 1,38 trilhões de wones, um aumento de 40% em comparação com o mesmo período do ano anterior.", "titulo_pt": "Lucro líquido trimestral da HD Hyundai aumenta 40% para 1,38 trilhões de wones", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 231190, "titulo": "Comets probably didn't seed life on Earth after all, new study suggests", "url": "https://phys.org/news/2026-10-comets-didnt-seed-life-earth.html", "fonte_id": "phys_org", "data_pub": "2026-10-28T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo estudo questiona a teoria de que cometas trouxeram os blocos de construção moleculares para a vida na Terra. Embora os cometas contenham muitas dessas moléculas, esta ideia de que eles foram responsáveis pela origem da vida na Terra está sendo desafiada.", "titulo_pt": "Cometas provavelmente não espalharam os componentes moleculares para a origem da vida na terra, sugere novo estudo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 231191, "titulo": "Engineered albumin helps a therapeutic protein last longer and cross mucosal barriers", "url": "https://phys.org/news/2026-10-albumin-therapeutic-protein-longer-mucosal.html", "fonte_id": "phys_org", "data_pub": "2026-10-28T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Proteínas baseadas em proteínas têm revolucionado o tratamento de muitas doenças, mas elas são frequentemente limitadas porque precisam ser injetadas, às vezes repetidamente, pois são rapidamente eliminadas do sangue. Isso pode ser um grande incômodo para pacientes que dependem de tratamento a longo prazo ou permanente.", "titulo_pt": "Álbumina engenhada ajuda uma proteína terapêutica a durar mais e atravessar barreiras mucosas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 231192, "titulo": "Major Southern Hemisphere ocean layer shifts, raising questions about heat and carbon storage", "url": "https://phys.org/news/2026-10-major-southern-hemisphere-ocean-layer.html", "fonte_id": "phys_org", "data_pub": "2026-10-28T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Camada de Água Intermediária Antártica (AAIW), uma camada de água fresca que se estende por grande parte do Oceano do Hemisfério Sul, apresentou mudanças rápidas em sua salinidade e densidade, de acordo com novas pesquisas. A AAIW desempenha um papel importante no armazenamento de carbono, na fornecimento de oxigênio e no movimento das correntes oceânicas globais.", "titulo_pt": "Camada de água intermediária do hemisfério sul do ántartico muda, levantando questionamentos sobre armazenamento de calor e carbono", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 231198, "titulo": "Comets probably didn’t deliver life’s building blocks to Earth", "url": "https://www.sciencenews.org/article/comet-chemistry-life-earth-speed-sharp", "fonte_id": "science_news", "data_pub": "2026-10-28T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A maioria dos cometas provavelmente não traria moléculas necessárias para a vida à Terra devido à sua alta velocidade e ângulo de impacto, sugere um novo estudo.", "titulo_pt": "Cometas provavelmente não trouxeram blocos de construção da vida para a terra", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 230647, "titulo": "Simulação oferece retrato detalhado dos primórdios do Universo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/simulacao-oferece-retrato-detalhado-dos-primordios-do-universo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-28T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma simulação recentemente divulgada oferece uma representação detalhada dos primeiros momentos do Universo. Essa simulação é considerada a mais detalhada até o momento para esse período inicial do cosmos.", "titulo_pt": "Simulação oferece retrato detalhado dos primórdios do Universo", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 231193, "titulo": "DNA analysis identifies root-dwelling fungi as potential keystone species in forest microbial communities", "url": "https://phys.org/news/2026-10-dna-analysis-root-fungi-potential.html", "fonte_id": "phys_org", "data_pub": "2026-10-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A análise genética identificou fungos que habitam raízes como possíveis espécies keystone em comunidades microbianas florestais. Esses fungos desempenham papéis cruciais nos processos de ciclagem de nutrientes e sequestração de carbono.", "titulo_pt": "Análise genética identifica fungos radiculares como possíveis espécies keystone em comunidades microbianas florestais", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 231221, "titulo": "The most important part of AI chatbots is being ignored", "url": "https://www.newscientist.com/article/2596083-the-most-important-part-of-ai-chatbots-is-being-ignored/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As empresas de inteligência artificial podem aumentar o poder de seus assistentes virtuais sem precisar atualizar para modelos mais recentes. O colunista Jacob Aron explica como um simples software pode dar um impulso à IA e se a IA poderá em breve reescrever esse código por si mesma.", "titulo_pt": "A parte mais importante dos chatbots de IA está sendo ignorada", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 231186, "titulo": "Opinion: How pediatricians like me are helping families stay calm and informed about measles", "url": "https://www.statnews.com/2026/10/28/measles-parents-panic-pennsylvania-vaccines-education/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-28T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um pediatra descreve a dificuldade de lidar com famílias que buscam o vacina MMR em uma sala enquanto, na sala adjacente, há famílias que se opõem firmemente à vacinação.", "titulo_pt": "Como pediatras estão auxiliando famílias a se manterem calmas e informadas sobre a doença do sarampo", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 231187, "titulo": "Have you been impacted by Epic’s actions?", "url": "https://www.statnews.com/2026/10/28/epic-systems-electronic-health-records-reader-callout/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-28T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A STAT está buscando informações de pessoas com conhecimento direto sobre como as ações da Epic afetam as escolhas de tecnologia dos hospitais. Os leitores são convidados a compartilhar suas experiências com a empresa.", "titulo_pt": "Você foi afetado pelas ações da Epic?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 231188, "titulo": "Opinion: Freezing my eggs showed me just how anti-feminist the fertility industry can be", "url": "https://www.statnews.com/2026/10/28/fertility-industry-private-equity-egg-freezing-ethics-costs/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-28T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora, uma médica chamada Pooja Yerramilli, relata que congelar seus óvulos foi uma experiência que não a fez se sentir empoderada. Ela critica o setor de fertilidade por ser anti-feminista.", "titulo_pt": "Opinião: congelar meus óvulos mostrou-me como o setor de fertilidade pode ser anti-feminista", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 231189, "titulo": "STAT+: As Epic’s dominance grows, its iron grip is choking innovation in health technology", "url": "https://www.statnews.com/2026/10/28/epic-systems-ehr-dominance-health-tech-antitrust-scrutiny/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-28T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma investigação da STAT descobriu que a Epic selecionadamente retém o acesso aos dados do paciente, desvantajizando desenvolvedores de software rivais e freando a inovação.", "titulo_pt": "A dominância da Epic está sufocando a inovação em tecnologia de saúde", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 231203, "titulo": "Curiosity Blog, Sols 5043-5049: Preparing to Drill at ‘Nazca’", "url": "https://science.nasa.gov/blog/curiosity-blog-sols-5043-5049-preparing-to-drill-at-nazca/", "fonte_id": "nasa_news", "data_pub": "2026-10-28T05:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Curiosity retornou a um local próximo ao bloco 'Chiu Chiu' para a próxima campanha de perfuração. O 'Chiu Chiu' não foi um bom candidato para a perfuração.", "titulo_pt": "Blog da curiosity, solos 5043-5049: preparando-se para perfurar o 'Nazca'", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 231204, "titulo": "APOD: 2026 October 28 – The Mutual Occultation of Ganymede and Io", "url": "https://science.nasa.gov/image-article/apod-2026-october-28-the-mutual-occultation-of-ganymede-and-io/", "fonte_id": "nasa_news", "data_pub": "2026-10-28T04:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do dia da NASA mostra a ocultação mutual de Ganímede e Io, duas luas de Júpiter, que ocorreu em 28 de outubro de 2026.", "titulo_pt": "APOD: 28 de outubro de 2026 – a ocultação Mutual de ganímede e Io", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 231205, "titulo": "The Land of the Standing-Up Rocks", "url": "https://science.nasa.gov/earth/earth-observatory/the-land-of-the-standing-up-rocks/", "fonte_id": "nasa_news", "data_pub": "2026-10-28T04:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Chiricahua se tornou o mais recente parque nacional dos Estados Unidos em 2019. É um monumento nacional desde os anos 1920.", "titulo_pt": "O país das rochas erguidas", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 231194, "titulo": "MapInsights helps police trainees learn the territory", "url": "https://phys.org/news/2026-10-mapinsights-police-trainees-territory.html", "fonte_id": "phys_org", "data_pub": "2026-10-28T03:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em janeiro de 2026, a Divisão de Segurança Pública da Universidade do Illinois enfrentava um desafio. Tinham 11 guardas de segurança planejados para serem convertidos em agentes de serviço comunitário, o que significava que eles iriam mudar de trabalhar em um prédio fixo para percorrer um distrito inteiro.", "titulo_pt": "Mapinsights auxilia treinantes de policia a conhecerem a área", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 231195, "titulo": "Digital tools and 3D printing emerge as key themes in circular economy research", "url": "https://phys.org/news/2026-10-digital-tools-3d-emerge-key.html", "fonte_id": "phys_org", "data_pub": "2026-10-28T03:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma revisão da literatura científica entre 2020 e 2026 identificou tecnologias digitais, impressão 3D e recuperação de recursos como temas principais na transição para uma economia circular sustentável. O estudo, publicado na International Journal of Services and Operations Management, destaca a necessidade de maior cooperação entre empresas e outros stakeholders, bem como a adoção de políticas governamentais mais eficientes para facilitar a transição.", "titulo_pt": "Ferramentas digitais e impressão 3D emergem como temas-chave na pesquisa da economia circular", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 231220, "titulo": "Remembering Ursula von Rydingsvard", "url": "https://hyperallergic.com/remembering-ursula-von-rydingsvard/", "fonte_id": "hyperallergic", "data_pub": "2026-10-28T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ursula von Rydingsvard, escultora monumental, faleceu aos 84 anos. O artigo também menciona um artista que escondia suas próprias obras no The Met e um conflito sobre acrílicos de vítimas de Roma durante o Holocausto.", "titulo_pt": "Lembrando Ursula von Rydingsvard", "veiculo": "Hyperallergic (arte)", "pais": "EUA", "classe": "B"}, {"id": 231211, "titulo": "Jay-Z is the perfect Super Bowl shill for a league of billionaires", "url": "https://www.theguardian.com/sport/2026/oct/28/jay-z-halftime-show-super-bowl", "fonte_id": "guardian_culture", "data_pub": "2026-10-28T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jay-Z foi nomeado como headliner para a show do meio do jogo da Super Bowl deste ano, uma escolha que confere credibilidade à NFL. A parceria entre a Roc Nation e a NFL foi renovada por mais cinco anos, com um contrato avaliado em US$ 5 milhões por ano, e o comissário Roger Goodell deseja que Jay-Z se apresente pessoalmente no futuro.", "titulo_pt": "Jay-z é a escolha perfeita para a propaganda da Super Bowl para a liga de bilionários", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 230821, "titulo": "El fenómeno El Niño persistirá hasta 2027: qué podría pasar en Chile durante el verano", "url": "https://www.latercera.com/tendencias/noticia/el-fenomeno-el-nino-persistira-hasta-2027-que-podria-pasar-en-chile-durante-el-verano/", "fonte_id": "la_tercera", "data_pub": "2026-10-28T09:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A OMM confirmou que o fenômeno El Niño continuará nos próximos meses e pode alterar o clima no Chile durante o verão. Os especialistas alertam para possíveis cenários extremos e seus efeitos.", "titulo_pt": "O fenômeno El Niño persistirá até 2027: como pode afetar o Chile no verão", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 231091, "titulo": "Hong Kong’s third medical school denies poaching veteran HKU professor", "url": "https://www.scmp.com/news/hong-kong/education/article/3372430/hong-kongs-third-medical-school-denies-poaching-veteran-hku-professor", "fonte_id": "scmp", "data_pub": "2026-10-28T09:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A terceira escola médica de Hong Kong negou acusações de 'roubo de talentos' após contratar um hematologista experiente que serviu por quase 30 anos na Universidade de Hong Kong. Anskar Leung Yu-hung, professor emérito, foi apresentado como novo vice-diretor sênior de medicina na Escola de Medicina da Universidade de Tecnologia de Hong Kong.", "titulo_pt": "Terceira escola médica de hong Kong nega acusações de 'roubo de talentos' após contratação de professor experiente", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 230801, "titulo": "El túnel", "url": "https://www.lanacion.com.ar/cultura/el-tunel-nid28102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-28T09:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O texto se refere a um túnel, mas não fornece detalhes adicionais sobre o que específico é ou as circunstâncias associadas a ele. Sem mais contexto, não é possível elaborar um resumo mais detalhado.", "titulo_pt": "O túnel", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 231210, "titulo": "Is It Too Late to Make a Run for It? by Judi Dench review – whatever you do, don’t call her a ‘national treasure’", "url": "https://www.theguardian.com/books/2026/oct/28/is-it-too-late-to-make-a-run-for-it-by-judi-dench-review-whatever-you-do-dont-call-her-a-national-treasure", "fonte_id": "guardian_culture", "data_pub": "2026-10-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Judi Dench escreve sobre sua carreira e expressa sua aversão a ser chamada de 'tesouro nacional'. Ela relata uma experiência de sua juventude em que um produtor de Hollywood a criticou severamente por sua aparência.", "titulo_pt": "É tardio demais para correr? Por Judi Dench - não chame-a de tesouro nacional", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 231212, "titulo": "In One Brief Moment All Eternity by Elif Shafak review – what Madame Bovary thought of Flaubert", "url": "https://www.theguardian.com/books/2026/oct/28/in-one-brief-moment-all-eternity-by-elif-shafak-review-what-madame-bovary-thought-of-flaubert", "fonte_id": "guardian_culture", "data_pub": "2026-10-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Elif Shafak escreveu um livro que examina o autor francês Gustave Flaubert através dos olhos das suas personagens femininas. O trabalho é uma homenagem à literatura em tempos difíceis, refletindo a ambiguidade de Elena Ferrante em relação a Flaubert, que às vezes o considera misógino, mas em outros momentos admite que suas personagens femininas podem expressar pensamentos e sentimentos que as mulheres frequentemente reprimem.", "titulo_pt": "Em um momento breve, todas as eternidades: uma revisão do portrét de gustave Flaubert por olhos de suas personagens femininas", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 231218, "titulo": "US and China share a love of \"new things and innovation\" says Ma Yansong", "url": "https://www.dezeen.com/2026/10/28/ma-yansong-interview-lucas-museum/", "fonte_id": "dezeen", "data_pub": "2026-10-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O arquiteto chinês Ma Yansong concluiu em 2026 uma das obras mais proeminentes dos Estados Unidos, o Museu Lucas de Arte Narrativa. Ele explica neste entrevista a apelação internacional de sua arquitetura.", "titulo_pt": "EUA e China compartilham uma paixão por 'coisas novas e inovação', diz Ma Yansong", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 231225, "titulo": "Estudio Cru wants it’s responsive design to pose questions rather than offer answers", "url": "https://www.itsnicethat.com/articles/estudio-cru-graphic-design-discover-281026", "fonte_id": "its_nice_that", "data_pub": "2026-10-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estúdio Cru, com sede em Rio de Janeiro, enfoca a pensamento crítico e conceitos criativos em sua prática. O estúdio reconhece o diálogo influente que o design pode criar entre empresa e consumidor.", "titulo_pt": "Estúdio Cru quer que seu design responda com perguntas, não com respostas", "veiculo": "It's Nice That", "pais": "Reino Unido", "classe": "B"}, {"id": 231226, "titulo": "A2 Type adds Louisiana Museum of Modern Art to its repertoire of typefaces for iconic institutions", "url": "https://www.itsnicethat.com/articles/a2-type-louisiana-museum-of-modern-art-graphic-design-project-281026", "fonte_id": "its_nice_that", "data_pub": "2026-10-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A2 Type desenvolveu um sistema tipográfico para o Museu de Arte Moderna de Louisiana, baseado na arquitetura do museu e em sua vasta arquivagem impressa. O sistema tipográfico é rigoroso e fundamentado em pesquisas.", "titulo_pt": "A2 Type adiciona o museu de arte moderna de Louisiana à sua coleção de tipografias para instituições icônicas", "veiculo": "It's Nice That", "pais": "Reino Unido", "classe": "B"}, {"id": 231227, "titulo": "Exactly how Apple Music used sound to build its new brand identity", "url": "https://www.itsnicethat.com/features/apple-music-rebrand-graphic-design-spotlight-281026", "fonte_id": "its_nice_that", "data_pub": "2026-10-28T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "TBWA/media Arts Lab criou a nova identidade de marca do Apple Music ao visualizar o som, após meses de experimentação e o uso de óleo. O processo resultou em uma maior compreensão sobre a exposição dos passos do desenvolvimento.", "titulo_pt": "Como a Apple Music usou o som para construir sua nova identidade de marca", "veiculo": "It's Nice That", "pais": "Reino Unido", "classe": "B"}, {"id": 231093, "titulo": "Hong Kong luxury expo to connect brands with ‘high-spending travellers’", "url": "https://www.scmp.com/news/hong-kong/hong-kong-economy/article/3372425/hong-kong-luxury-expo-connect-brands-high-spending-travellers", "fonte_id": "scmp", "data_pub": "2026-10-28T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo evento de luxo em Hong Kong, chamado Festival de Conoadores, terá início entre os dias 4 e 6 de novembro, apresentando aeronaves privadas, joias finas, relógios, iates de luxo e propriedades imobiliárias de alto padrão. O evento, que contará com financiamento do governo, visa conectar marcas, proprietários de iates e apreciadores de luxo.", "titulo_pt": "Expoição de luxo em hong Kong conectará marcas com 'viagemres de alto gast .koreaherald.com/article/10917796", "fonte_id": "korea_herald", "data_pub": "2026-10-28T06:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung pediu ao governo que agilizasse ações para prevenir mortes evitáveis, no dia anterior ao quarto aniversário da tragédia de Itaewon que resultou em 159 mortes. Esta foi a primeira vez que ele presidiu uma reunião plenária do Comitê Presidencial de Segurança de Vida desde a sua formação em julho.", "titulo_pt": "Lee pede ação mais rápida para prevenir mortes evitáveis no dia anterior ao quarto aniversário da tragédia de Itaewon", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 231105, "titulo": "Singapore court fines behavioural therapist for hurting autistic boy who hit her", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3372397/singapore-court-fines-behavioural-therapist-hurting-autistic-boy-who-hit-her", "fonte_id": "scmp", "data_pub": "2026-10-28T05:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma terapeuta comportamental de 29 anos chamada Tricia Lee Hsien foi multada em 5.000 singaporeanos por ter arrastado um menino com necessidades especiais de quatro anos para o chão após ele a ter dado vários golpes na face. Ela admitiu uma acusação de ferir intencionalmente um menor, mas a acusação pediu apenas uma multa, considerando o caso excepcional devido ao baixo dano causado e à baixa culpa da mulher.", "titulo_pt": "Terapeuta comportamental é multada por arrastar menino autista após ser agredida", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 231011, "titulo": "Mbappe faces backlash in China for meme fiasco", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/28/mbappe-faces-backlash-in-china-for-meme-fiasco?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-28T04:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três grandes marcas ch "classe": "A"}, {"id": 229652, "titulo": "Seca na amazônia força donos de navios a reduzir carga, e demanda aérea aumenta", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/10/seca-na-amazonia-forca-donos-de-navios-a-reduzir-carga-e-demanda-aerea-aumenta.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estiagem na Amazônia, influenciada pelo El Niño, está limitando a navegação e exigindo que os proprietários de navios reduzam a carga de contêineres. A Antaq registra restrições de navegação em trechos da região.", "titulo_pt": "Seca na amazônia força donos de navios a reduzir carga e aumenta demanda aérea", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 229867, "titulo": "Vídeo: sucuri-amarela é flagrada enrolando corpo em jacaré dentro de lago no Pantanal de Mato Grosso do Sul", "url": "https://www.cnnbrasil.com.br/ciencia/video-sucuri-amarela-e-flagrada-enrolando-corpo-em-jacare-dentro-de-lago-no-pantanal-de-mato-grosso-do-sul/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-28T00:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um vídeo registrou uma sucuri-amarela enrolando o corpo em um jacaré dentro de um lago no Pantanal de Mato Grosso do Sul. O registro foi feito durante um safari na segunda-feira (26) e, de acordo com um técnico de agropecuária, a espécie não é frequentemente observada no local.", "titulo_pt": "Vídeo: sucuri-amarela enrola corpo em jacaré dentro de lago no Pantanal de Mato Grosso do Sul", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 230474, "titulo": "Trump is making it easier for fossil fuel companies to leak methane", "url": "https://www.theverge.com/policy/1019691/gas-leak-methane-rule-rollback-trump", "fonte_id": "the_verge", "data_pub": "2026-10-27T18:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "te dfires fill the air with toxic smog", "url": "https://www.japantimes.co.jp/news/2026/10/27/asia-pacific/science-health/borneo-health-issues-pollution/", "fonte_id": "japan_times", "data_pub": "2026-10-27T03:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 300 mil pessoas em sete províncias da Indonésia ficaram doentes por infecções respiratórias de agosto a outubro, de acordo com o ministério da Saúde. As chamas florestais dispersaram uma névoa tóxica pelo ar, dificultando a respiração.", "titulo_pt": "Borneu luta para respirar com fumaça tóxica de incêndios florestais", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 231103, "titulo": "Chinese anti-scam blogger killed by contractors hired online to silence his work", "url": "https://www.scmp.com/news/china/politics/article/3372403/chinese-anti-scam-blogger-killed-contractors-hired-online-silence-his-work", "fonte_id": "scmp", "data_pub": "2026-10-28T06:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um blogueiro investigativo chinês, conhecido por expor fraudes em telecomunicações e outras atividades ilegais, foi morto por criminosos contratados online. O corpo de Wu Kai, que usava o nome 'Huijian' nas redes sociais, foi encontrado em novembro de 2024. A morte dele levou a pedidos por maiores punições para o caso.", "titulo_pt": "Blogueiro chinês contra-fraude morto por contratantes online", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 231076, "titulo": "Bereaved family of Kurdish man who died in custody sues Tokyo government", "url": "https://www.japantimes.co.jp/news/2026/10/28/japan/crime-legal/kurdish-man-custody-lawsuit/", "fonte_id": "japan_times", "data_pub": "2026-10-28T05:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A família do homem kurdo que faleceu em custódia acionou o governo de Tóquio em uma ação judicial. O advogado itting genocide in Gaza after truce, UN inquiry says", "url": "https://www.scmp.com/news/world/middle-east/article/3372344/israel-keeps-committing-genocide-gaza-after-truce-un-inquiry-says", "fonte_id": "scmp", "data_pub": "2026-10-27T14:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório da Comissão Independente Internacional de Inquérito da ONU sobre as Terras Ocupaas Palestinianas, incluindo o Jerusalém Oriental, e Israel afirmou que Israel continuou a cometer genocídio no Gaza após o cessar-fogo de outubro, brokerado pelos Estados Unidos. Israel rejeitou o relatório, considerando-o parte de uma “campanha de desinformação”.", "titulo_pt": "Israel continua cometendo genocídio no Gaza após cessar-fogo, diz relatório da ONU", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 228526, "titulo": "‘Cancelado’ na China, Mbappé se desculpa por se referir a Mao como ditador", "url": "https://www.cartacapital.com.br/mundo/cancelado-na-china-mbappe-se-desculpa-por-se-referir-a-mao-como-ditador/", "fonte_id": "cartacapital", "data_pub": "2026-10-27T13:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Kylian Mbappé se desculpou após uma montagem que o associou ao ditador Mao Zedong, o que resultou em perda de patrocínios e proibição de usar o aplicativo de redes sociais chinês.", "titulo_pt": "Mbappé se desculpa por se referir a Mao como ditador e perde patrocínios na China", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 228994, "titulo": "Racist attack in Paris suburb: Tributes across France reflect shared outrage and political divides", "url": "https://www.lemonde.fr/en/france/article/2026/10/27/racist-attack-in-paris-suburb-tributes-across-france-reflect-shared-outrage-and-political-divides_6765347_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-27T11:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares se reuniram na segunda-feira à noit const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];

    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}

            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">

             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}

    : "";

    ${eventosHtml}

}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>

      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>

    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>

    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}
