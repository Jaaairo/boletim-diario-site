C Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 164293, "titulo": "Pela primeira vez, Japão tem mais de 100.000 pessoas com mais de 100 anos", "url": "https://veja.abril.com.br/mundo/pela-primeira-vez-japao-tem-mais-de-100-000-pessoas-com-mais-de-100-anos/", "fonte_id": "veja", "data_pub": "2026-09-15T20:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Japão tem agora mais de 100.000 pessoas com mais de 100 anos, o que resulta em escassez de trabalhadores, aumentos nos custos da Previdência Social e uma diminuição na base tributária.", "titulo_pt": "Pela primeira vez, Japão tem mais de 100.000 pessoas com mais de 100 anos", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 163293, "titulo": "Alagado há 4 dias, Jd. Pantanal se mobiliza para distribuir água e comida", "url": "https://www.metropoles.com/sao-paulo/alagado-jd-pantanal-agua-e-comida", "fonte_id": "metropoles", "data_pub": "2026-09-15T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A região do Jardim Pantanal, localizada na várzea do Rio Tietê, está alagada há quatro dias, desde que choveu intensamente em São Paulo a partir do sábado, 12 de setembro. A comunidade está se mobilizando para distribuir água e alimentos.", "titulo_pt": "Alagado há 4 dias, Jd. Pantanal se mobiliza para distribuir água e comida", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 164346, "titulo": "Escolhendo faculdade? Esse dado pode pesar mais que o teste vocacional", "url": "https://exame.com/carreira/escolhendo-faculdade-esse-dado-pode-pesar-mais-que-o-teste-vocacional/", "fonte_id": "exame", "data_pub": "2026-09-15T17:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dados do Inep e do mercado de trabalho são importantes para entender os fatores que influenciam a escolha do curso além da vocação. O título traduzido é: Escolhendo faculdade? Dados do Inep e do mercado de trabalho podem pesar mais que o teste vocacional.", "titulo_pt": "Escolhendo faculdade? Dados do inep e do mercado de trabalho podem pesar mais que o teste vocacional", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 165007, "titulo": "Cortes na geração de energia solar e eólica superam 60% em 1 a cada 5 dias", "url": "https://www.cnnbrasil.com.br/infra/cortes-na-geracao-de-energia-solar-e-eolica-superam-60-em-1-a-cada-5-dias/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-16T08:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "De acordo com a consultoria Volt Robotics, os cortes na geração de energia solar e eólica superaram 60% nos últimos cinco meses. A geração renovável não utilizada neste período é 18,3% maior do que no mesmo período de 2025, o que poderia suprir todas as residências de São Paulo, Rio de Janeiro e Fortaleza.", "titulo_pt": "Cortes na geração de energia solar e eólica superam 60% em 1 a cada 5 dias", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 164979, "titulo": "Prédio desaba, deixa 16 mortos e mais de 100 desaparecidos em Gaza", "url": "https://www.metropoles.com/mundo/predio-desaba-deixa-oito-mortos-e-mais-de-60-desaparecidos-em-gaza", "fonte_id": "metropoles", "data_pub": "2026-09-16T07:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um prédio desabou em Gaza, deixando 16 mortos e mais de 100 desaparecidos. O prédio tinha sido danificado anteriormente por um ataque israelense.", "titulo_pt": "Prédio desaba, deixa 16 mortos e mais de 100 desaparecidos em Gaza", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 165590, "titulo": "Green transition requires more than renewable power, Jeju gov. says", "url": "https://www.koreaherald.com/article/10875707", "fonte_id": "korea_herald", "data_pub": "2026-09-16T05:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governador de Jeju, Wi Seong-gon, afirmou que a ilha deve avançar além do aumento da capacidade de energia renovável, construindo infraestrutura e indústrias para aproveitar sua energia limpa. Jeju planeja atingir emissões líquidas zero em 2035, 15 anos antes do prazo nacional.", "titulo_pt": "Transição verde exige mais do que energia renovável, diz governo de Jeju", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 164863, "titulo": "Governo define regra para abolir licença ambiental em pesquisa de minerais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/09/governo-define-regra-para-abolir-licenca-ambiental-em-pesquisa-de-minerais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo Lula está prestes a criar uma regra nacional que permitirá a realização de atividades de pesquisa de mineração sem a necessidade de licença ambiental. A intenção é acelerar a busca por minerais críticos como terras raras, níquel, nióbio, potássio e fosfato, usados na produção de fertilizantes.", "titulo_pt": "Governo define regra para abolir licença ambiental em pesquisa de minerais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 165397, "titulo": "In Venezuela, South America's largest lake is dying from oil pollution", "url": "https://www.lemonde.fr/en/environment/article/2026/09/16/in-venezuela-south-america-s-largest-lake-is-dying-from-oil-pollution_6757570_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-16T00:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A qualidade da água do maior lago da América do Sul, o Lago Maracaibo, tem piorado drasticamente, ameaçando a subsistência de 20.000 pescadores da região.", "titulo_pt": "No veneza, maior lago da américa do sul está em risco devido à poluição de óleo", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 165699, "titulo": "CCC: Heathrow expansion could push flights to ‘80% of UK emissions by 2050’", "url": "https://www.carbonbrief.org/ccc-heathrow-expansion-could-push-flights-to-80-of-uk-emissions-by-2050", "fonte_id": "carbon_brief", "data_pub": "2026-09-15T23:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A expansão do Aeroporto de Heathrow pode levar as emissões de aviação a representar 80% das emissões de dióxido de carbono do Reino Unido até 2050, de acordo com o Comitê de Clima do Reino Unido.", "titulo_pt": "Comitê do clima: expansão do aeroporto de heathrow poderia levar as emissões de aviação a 80% das emissões do reino unido até 2050", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 165282, "titulo": "Three beluga whales just died at one of America’s top-rated aquariums", "url": "https://www.vox.com/future-perfect/502874/beluga-whales-marineland-shedd-aquarium", "fonte_id": "vox", "data_pub": "2026-09-15T21:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Dois anos atrás, Marineland de Canadá, um parque temático em Niagara Falls que treinava baleias-belo, delfins e outros animais para fazer truques acrobáticos, encerrou suas operações. A decisão foi tomada após anos de dificuldades financeiras e relatos de negligência e sofrimento animal.", "titulo_pt": "Três baleias-belo acabam de morrer em um dos aquários mais bem avaliados dos estados unidos", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 164336, "titulo": "De avanços a contradições: o que os países do BRICS ensinam diante da crise climática", "url": "https://exame.com/esg/de-avancos-a-contradicoes-o-que-os-paises-do-brics-ensinam-diante-da-crise-climatica/", "fonte_id": "exame", "data_pub": "2026-09-15T17:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O bloco BRICS enfrenta um El Niño intenso, levando a soluções que podem orientar políticas de adaptação e proteção de ecossistemas no Brasil.", "titulo_pt": "Avanços e contradições: o que os países do BRICS ensinam diante da crise climática", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 163378, "titulo": "Japão bate recorde e tem mais de 100 mil centenários pela primeira vez", "url": "https://www.cnnbrasil.com.br/internacional/japao-bate-recorde-e-tem-mais-de-100-mil-centenarios-pela-primeira-vez/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T16:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Japão estabeleceu um novo recorde ao ter mais de 100 mil centenários pela primeira vez, com a maioria sendo mulheres. O ministro destacou os números positivos dessa tendência.", "titulo_pt": "Japão bate recorde com mais de 100 mil centenários pela primeira vez", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 163613, "titulo": "Indonesian wildfires threaten leading orangutan research site in Borneo", "url": "https://www.theguardian.com/environment/2026/sep/15/indonesia-wildfires-threaten-leading-orangutan-research-site-borneo-cabang-panti", "fonte_id": "guardian_world", "data_pub": "2026-09-15T15:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais na Indonésia ameaçam um importante centro de pesquisa de orangotangos da Borneu, forçando os animais a fugirem das florestas. O fogo está a menos de 200 metros de uma estação de pesquisa, que é parte de um estudo de longo prazo sobre macacos selvagens.", "titulo_pt": "Incêndios ameaçam importante centro de pesquisa de orangotangos da borneu", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 163817, "titulo": "El Nino reaches super status: Where will it bring rain, drought and heat?", "url": "https://www.aljazeera.com/news/2026/9/15/el-nino-reaches-super-status-where-will-it-bring-rain-drought-and-heat?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-15T13:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Meteorologistas afirmam que o padrão de aquecimento do Oceano Pacífico pode ser o mais forte da história. Isso significa que as regiões afetadas podem experimentar intensas mudanças climáticas, incluindo chuvas abundantes e secas severas, além de calor extremo.", "titulo_pt": "El niño atinge status superlativo: onde trará chuva, seca e calor?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 162424, "titulo": "Clima: Brasil tem dia de contrastes, com geada no Sul e calor no Norte", "url": "https://www.metropoles.com/brasil/clima-brasil-tem-dia-de-contrastes-com-geada-no-sul-e-calor-no-norte", "fonte_id": "metropoles", "data_pub": "2026-09-15T08:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil experimentou um dia com contrastes climáticos, com geada no Sul e calor no Norte. Uma área de baixa pressão e um fluxo de umidade favoreceram instabilidades em partes do Sul e do Sudeste.", "titulo_pt": "Clima: Brasil tem dia de contrastes, com geada no Sul e calor no Norte", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 162817, "titulo": "After summer of unprecedented heatwaves and drought, climate activists rally support ahead of French elections", "url": "https://www.lemonde.fr/en/environment/article/2026/09/15/after-summer-of-unprecedented-heatwaves-and-drought-climate-activists-rally-support-ahead-of-french-elections_6757544_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-09-15T08:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Organizações não-governamentais e sindicatos chamaram para uma manifestação na quinta-feira próximo ao Ministério da Economia, pedindo ação urgente climática. Manifestações em 269 cidades francesas estão programadas para 26 de setembro, com temas incluindo clima, vida, paz e justiça social.", "titulo_pt": "Após verão de ondas de calor e secas inéditas, ativistas climáticos buscam apoio nas eleições francesas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 162444, "titulo": "Chuvas atrasam moagem de cana e sustentam preços do etanol em SP", "url": "https://www.cnnbrasil.com.br/agro/chuvas-atrasam-moagem-de/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-15T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As chuvas interferiram no processo de moagem de cana-de-açúcar nas usinas, levando a um aumento de mais de 20% nos preços do etanol. O aumento também foi influenciado pela elevação dos preços do açúcar internacional.", "titulo_pt": "Chuvas atrasam moagem de cana e sustentam preços do etanol em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 162960, "titulo": "Wildfires Burn Thousands of Hectares, Exposing Albania’s Systemic Weaknesses", "url": "https://balkaninsight.com/2026/09/15/wildfires-burn-thousands-of-hectares-exposing-albanias-systemic-weaknesses/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-09-15T05:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Este verão, incêndios florestais destruíram milhares de hectares na Albânia, revelando a incapacidade do estado de lidar com a situação de forma eficaz e coordenada. Os especialistas apontam que os riscos estão aumentando devido ao aquecimento global.", "titulo_pt": "Incêndios florestais destruem milhares de Hectares, expõem fraquezas sistêmicas da albânia", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 162994, "titulo": "Air quality across Singapore reaches unhealthy levels from Indonesian wildfires", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3367527/air-quality-across-singapore-reaches-unhealthy-levels-indonesian-wildfires?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-09-15T03:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A qualidade do ar em Singapura foi afetada por fumaça proveniente de incêndios florestais na Indonésia, levando a níveis de poluição considerados prejudiciais à saúde em todas as cinco regiões da cidade-estado. A situação é a mais grave desde setembro de 2019, conforme informado pelo Agência Nacional do Meio Ambiente.", "titulo_pt": "Qualidade do ar em singapura atinge níveis indesejáveis devido a incêndios na indonésia", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 165435, "titulo": "Human rights lawyer Noura Erakat arrested at hearing against Israel Bonds", "url": "https://www.aljazeera.com/video/newsfeed/2026/9/16/human-rights-lawyer-noura-erakat-arrested-at-hearing-against-israel-bonds?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-16T09:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A advogada dos direitos humanos palestina Noura Erakat foi detida em Flórida após fazer uma intervenção contra o investimento em Israel Bonds.", "titulo_pt": "Advogada dos direitos humanos Noura Erakat presa após se pronunciar contra investimento em Israel Bonds", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 164969, "titulo": "Brasil mantém 72ª posição em ranking global de igualdade de gênero", "url": "https://www.metropoles.com/brasil/brasil-mantem-72a-posicao-em-ranking-global-de-igualdade-de-genero", "fonte_id": "metropoles", "data_pub": "2026-09-16T09:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Órgão Econômico Mundial analisou 172 países e o Brasil manteve a 72ª posição no ranking global de igualdade de gênero. O melhor resultado foi alcançado pela Islândia.", "titulo_pt": "Brasil mantém 72ª posição em ranking global de igualdade de gênero", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 164857, "titulo": "Brasil estagna em 72º no ranking global de igualdade de gênero do Fórum Econômico Mundial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/brasil-estagna-em-72o-no-ranking-global-de-igualdade-de-genero-do-forum-economico-mundial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-16T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil manteve-se na 72ª posição no ranking global de igualdade de gênero do Fórum Econômico Mundial, com uma pontuação de 71,5%. O país registrou uma pequena queda de 0,4 ponto percentual em comparação com o ano anterior.", "titulo_pt": "Brasil permanece em 72º no ranking global de igualdade de gênero", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 165284, "titulo": "‘We are prey’: discovery of seven women’s bodies fuels anger over femicide in South Africa", "url": "https://www.theguardian.com/world/2026/sep/16/discovery-women-bodies-anger-femicide-south-africa", "fonte_id": "guardian_world", "data_pub": "2026-09-16T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram encontrados os corpos de sete mulheres nas proximidades do aeroporto internacional de Joanesburgo, incluindo cinco em apenas uma semana. Essa descoberta gerou medo, tristeza e raiva em relação à falta de progresso no combate ao feminicídio.", "titulo_pt": "‘Somos presas’: descoberta de corpos de sete mulheres alimenta raiva sobre feminicídio na áfrica do sul", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 165461, "titulo": "At least 50 children among 100 trapped in collapsed Gaza City building", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/least-50-children-among-100-trapped-collapsed-gaza-city-building", "fonte_id": "middle_east_eye", "data_pub": "2026-09-16T06:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 100 palestinos, incluindo pelo menos 50 crianças, estão presos sob um edifício colapsado em Gaza City. Até o momento, 11 corpos foram recuperados e 12 pessoas foram resgatadas vivas.", "titulo_pt": "Pelo menos 50 crianças entre mais de 100 presas em edifício colapsado em Gaza City", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 165630, "titulo": "(2nd LD) Gov't announces plans to formally introduce abortion pills", "url": "https://en.yna.co.kr/view/AEN20260916003552315", "fonte_id": "yonhap_news", "data_pub": "2026-09-16T05:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo sul-coreano anunciou planos para formalizar a introdução de medicamentos abortivos. As informações foram divulgadas em 16 de setembro.", "titulo_pt": "Governo sul-coreano anuncia planos para formalizar introdução de medicamentos abortivos", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 165287, "titulo": "People protecting nature and land set up self-defence units amid threat of murder", "url": "https://www.theguardian.com/world/2026/sep/16/nature-land-defenders-self-defence-murder-organised-crime", "fonte_id": "guardian_world", "data_pub": "2026-09-16T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Defensores de florestas e rios foram mortos a uma taxa de um por três dias em 2025, com 85% dos assassinatos ocorrendo na América Latina. Com a implicação de grupos criminosos organizados ou assassinos profissionais em mais de um terço dos 124 assassinatos de defensores, muitas comunidades criaram unidades de autodefesa em resposta a esse perigo.", "titulo_pt": "Pessoas protegendo a natureza e o território se organizam em unidades de autodefesa diante de ameaças de assassinato", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 163275, "titulo": "Terceira Guerra Mundial se torna maior risco global, aponta relatório da ONU", "url": "https://veja.abril.com.br/mundo/terceira-guerra-mundial-se-torna-maior-risco-global-aponta-relatorio-da-onu/", "fonte_id": "veja", "data_pub": "2026-09-15T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A terceira Guerra Mundial foi identificada como o maior risco global para os próximos dois anos, de aco            const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
