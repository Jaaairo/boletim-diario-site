<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

<main id="main"></main>

<script>
const D = {"gerado_em": "31/10/2026 19:14", "stats": {"noticias_novas": 349, "resumos_gerados": 199}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Após a reeleição de Lula, o Brasil assistiu a várias movimentações políticas e sociais. O Partido dos Trabalhadores organizou um ato público em Brasília para comemorar a vitória. O ministro do STJ está sendo investigado por supostas vendas de decisões, enquanto a Procuradoria-Geral da República planeja pedir o arquivamento do inquérito. A esquerda celebrou a reeleição de Lula, com o gesto 'L' se tornando um símbolo internacional, mas o deputado André Janones criticou as vaidades da esquerda. A Defesa Civil de Belo Horizonte alertou para a possibilidade de chuva forte na capital mineira. O Senado agendou a votação da PEC da Segurança Pública para a próxima terça-feira, e Carlos Bolsonaro reforçou seu apoio a Rogério Marinho para a presidência do Senado.", "mundo": "Em todo o mundo, protestos e tensões políticas continuam a marcar o cenário internacional. Na França, mais de 320 mil pessoas se manifestaram em Paris e outras cidades durante três finais de semana consecutivos, em protesto contra o aumento dos custos de vida e a precariedade dos serviços públicos. As manifestações, que começaram pacíficas, se tornaram violentas em algumas cidades, resultando em mais de 290 detenções. Em Oleshky, na Ucrânia, cidadãos que passaram anos em zonas de guerra foram evacuados e agora se reúnem com familiares em segurança. Na Alemanha, jovens participaram de protestos em mais de 30 cidades, exigindo mais investimento na educação e uma redução do custo de vida. Além disso, a Coreia do Norte continua a ser suspeita de um recente hack de $6,3 bilhões na Binance, que pode ser um sinal de sua atividade cibernética. O presidente dos Estados Unidos, Donald Trump, permanece aberto a conversar com o líder da Coreia do Norte, embora sem data marcada para uma reunião.\n\nA geopolítica global continua marcada por tensões e alinhamentos estratégicos. Na Ásia, Taiwan agradeceu aos seus aliados pelo apoio à paz no Estreito de Taiwan, refletindo a complexa relação entre Taiwan e a China. Em um desenvolvimento significativo, a purga militar da China reduziria o risco de guerra, conforme afirmam os especialistas, fortalecendo a estabilidade interna do país. No contexto do conflito na Ucrânia, uma operação humanitária complexa permitiu a evacuação de civis de Oleshky, uma cidade ocupada pela Rússia, durante um cessar-fogo local, marcando o primeiro movimento desse tipo desde o início da guerra. Além disso, Israel e o Irã discutem a possibilidade de rever suas doutrinas nucleares em caso de nova guerra, enquanto o líder supremo do Irã ameaça uma resposta imediata e poderosa a qualquer ataque militar dos Estados Unidos ou Israel. As tensões geopolíticas continuam a desenhar o cenário internacional, com confrontos e alianças que refletem os interesses estratégicos de diversos países.", "economia": "O mercado financeiro enfrenta diversos desafios e oportunidades, conforme indicam os principais eventos recentes. Por exemplo, a Binance anunciou que já repôs 90% dos ativos roubados em um ataque hacker que causou prejuízos estimados em US$ 6,3 bilhões, e planeja retomar os saques neste domingo (1º/11). A companhia defende a tributação dos ricos como alternativa para evitar cortes nos gastos sociais, conforme um manifesto divulgado por economistas. Além disso, a expectativa de inflação para 2027 e 2028 aumentou após a reeleição de Luiz Inácio Lula da Silva, segundo uma pesquisa realizada pela corretora BGC Liquidez. Em outro front, a Merck atingiu 76% de circularidade em seu relatório de 2026, destacando a importância de práticas sustentáveis. O Itaú prevê crescimento de 0,5% na economia brasileira em 2027, inflação de 6,1% e juros de 13,75% no ano seguinte.", "tecnologia": "A TechCrunch Founder Summit, que acontecerá em 4 de novembro no SoWa Power Station em Boston, oferece oportunidades de networking significativas e insights valiosos, destacando a importância de se conectar com líderes de negócios e startups. A preocupação com a inteligência artificial (IA) tem levantado temores de que ela possa questionar a qualidade e a originalidade das pesquisas científicas, refletindo sobre os desafios éticos e científicos associados à IA. Diante dessas preocupações, a OpenAI reduziu sua meta de captação para US$ 10 bilhões, refletindo a volatilidade do mercado e as incertezas associadas à IA. Outras empresas do setor, como a Anthropic, estão se preparando para uma possível abertura de capital. Além disso, a Meta desenvolveu um protótipo de robô humanoide para auxiliar nas tarefas domésticas, integrando a IA a atividades cotidianas, e a Binance recuperou 90% dos US$ 6 bilhões roubados em um ataque hacker, demonstrando a importância de medidas de segurança em exchanges de criptomoedas.", "ciencia": "A República Democrática do Congo registrou mais de 5.000 mortes devido à Ebola, de acordo com o Ministério da Saúde do país, o que eleva a taxa de letalidade para cerca de 50%. O surto também foi confirmado em outros países africanos. De forma independente, pesquisadores descobriram um gene que codifica um canal de potássio em um vírus de algas, o que apoia a teoria de que vírus gigantes podem ter contribuído para a evolução de proteínas complexas. Além disso, cientistas da Johns Hopkins identificaram um vínculo entre uma bactéria comum do trato gastrointestinal e o câncer colorretal, descobrindo uma toxina que danifica a barreira protetora do cólon e promove a formação de tumores.", "cultura": "A cultura global está em destaque com diversos eventos e lançamentos. A primeira foto com seres humanos da história, tirada há quase dois séculos, foi recentemente identificada em Paris. Ela revela o local exato onde Louis Daguerre capturou essa imagem histórica. Em outro desenvolvimento, a primeira produção argentina feita com inteligência artificial, 'Noku', venceu o World AI Film Festival e será exibida no Festival de Cannes, marcando um novo capítulo na indústria cinematográfica. Na área do cinema, a série 'Percy Jackson e os Olympianos' está prestes a lançar sua terceira temporada, prometendo explorar temas mais sombrios e emocionantes. O diretor Peter Berg enfrenta desafios ao filmar 'The Mosquito Bowl'. O produtor Will Packer usa sua plataforma pública para apoiar causas políticas e sociais, destacando a importância do voto e da educação. Além disso, a banda Deep Purple cancelou alguns shows devido a uma emergência médica que levou o vocalista Ian Gillan ao hospital, afetando a agenda da turnê europeia. Na televisão, a novela 'Quem Ama Cuida' apresenta tensões entre os personagens, com Pilar planejando matar sua governanta, Diná, enquanto a Globo prepara um programa especial de fim de ano com artistas gospel.", "sociedade": "O Ministério da Educação (MOE) estabeleceu diretrizes para proteger professores, visando garantir direitos e proteção adequados aos educadores. Em São Paulo, um adolescente de 17 anos faleceu após ser atropelado por um ônibus na zona sul da cidade. Por outro lado, a polícia alemã usou jatos de água para dispersar manifestantes durante protestos liderados por jovens da iniciativa 'GenZ regelt!', que ocorreram em várias cidades alemãs. No Distrito Federal, 32 Unidades Básicas de Saúde (UBSs) foram inauguradas para a vacinação neste sábado, oferecendo serviços para pessoas de todas as idades. No Paraná, alunos de medicina da UniCesumar em Maringá foram expulsos após ofensas contra bolsistas em grupos de mensagens relacionados ao resultado das eleições presidenciais.", "meio_ambiente": "O Amazonas registrou uma redução significativa de 39% nos focos de queimadas em outubro, totalizando 8,5 mil focos, de acordo com um relatório do Inpe. No entanto, nove municípios enfrentaram qualidade do ar moderada a ruim. Em Alter do Chão, no Pará, um incêndio atingiu uma Área de Proteção Ambiental, com mais de 11 mil focos de calor em outubro, conforme dados do Inpe. As autoridades estão investigando uma possível ação criminosa, enquanto brigadistas monitoram novos focos de fogo no Lago Verde. No Brasil, empresas estão expandindo programas de reciclagem de embalagens, buscando aumentar a logística reversa e fidelizar clientes. Além disso, o Ministério aprovou a primeira exploração de sequestramento de carbono, um passo importante para o desenvolvimento de tecnologias de sequestramento de carbono no país. Durante a COP16 da conferência de biodiversidade em Yerevan, países concluíram o primeiro 'exame global' do progresso em direção à reversão da perda da natureza até 2030.", "direitos_humanos": "A Funai notificou a Polícia Federal para investigar incidentes de ataques contra indígenas no Mato Grosso do Sul, ocorridos após a reeleição do presidente Lula. Os casos incluem incêndios e envenenamentos. Em outro evento, muçulmanos de Michigan, Estados Unidos, que ajudaram na eleição de Donald Trump, estão enfrentando ataques à sua fé. Além disso, um novo surto de combates no Iêmen fez com que cerca de 290 mil pessoas fossem deslocadas de suas casas, com mulheres grávidas em risco. Em uma carta aberta, foi discutido o direito das comunidades kawésqar a decidir sobre o retorno de seus ancestrais de Basileia, Suíça. Por fim, relatos sugerem que autoridades russas estão usando métodos de coerção para recrutar homens vulneráveis para a guerra, em vez de oferecer incentivos financeiros."}, "resumo_do_dia": {"politica_nacional": [{"id": 237947, "titulo": "MTE recebe 4.305 denúncias de assédio eleitoral", "url": "https://www.poder360.com.br/poder-justica/mte-recebe-4-305-denuncias-de-assedio-eleitoral/", "fonte_id": "poder360", "data_pub": "2026-10-31T21:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério do Trabalho recebeu 4.305 denúncias de assédio eleitoral. O Sudeste registrou 48,5% dessas denúncias no canal criado recentemente pela pasta.", "titulo_pt": "MTE recebe 4.305 denúncias de assédio eleitoral", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 238113, "titulo": "Reeleição de Lula baixa a bola do PL de Bolsonaro no Congresso", "url": "https://veja.abril.com.br/politica/reeleicao-de-lula-baixa-a-bola-do-pl-de-bolsonaro-no-congresso/", "fonte_id": "veja", "data_pub": "2026-10-31T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Antes do segundo turno da eleição presidencial, os oposicionistas esperavam conquistar as presidências da Câmara e do Senado. A reeleição de Lula, no entanto, reduziu as chances desse cenário ocorrer.", "titulo_pt": "Reeleição de Lula diminui chances de PL de Bolsonaro no Congresso", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 237938, "titulo": "A última dança de Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/celso-rocha-de-barros/2026/10/a-ultima-danca-de-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-31T21:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula venceu a eleição, o fascismo foi derrotado e a cerimônia foi considerada bonita.", "titulo_pt": "Última dança de Lula", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 238014, "titulo": "Ministro argentino defende livre comércio e critica barreiras ambientais no G20", "url": "https://www.infomoney.com.br/mundo/ministro-argentino-defende-livre-comercio-e-critica-barreiras-ambientais-no-g20/", "fonte_id": "infomoney", "data_pub": "2026-10-31T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro argentino das Relações Exteriores, Pablo Quirno, participou da reunião de chanceleres do G20 e defendeu o livre comércio, criticando as barreiras ambientais impostas pelos países membros.", "titulo_pt": "Ministro argentino defende livre comércio e critica barreiras ambientais no G20", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 237958, "titulo": "Janones critica vaidades na esquerda sobre vitória de Lula: \"Uma merda\"", "url": "https://www.metropoles.com/brasil/janones-critica-vaidades-na-esquerda-sobre-vitoria-de-lula-uma-merda", "fonte_id": "metropoles", "data_pub": "2026-10-31T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado federal André Janones (Rede-MG) criticou as vaidades da esquerda em relação à vitória de Lula. Janones foi responsável pela criação do canal de WhatsApp 'Exército do Lula'.", "titulo_pt": "Janones critica vaidades na esquerda sobre vitória de Lula: 'uma merda'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 237948, "titulo": "Defesa Civil alerta para chuva forte em Belo Horizonte", "url": "https://www.poder360.com.br/poder-brasil/defesa-civil-alerta-para-chuva-forte-em-belo-horizonte/", "fonte_id": "poder360", "data_pub": "2026-10-31T21:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Defesa Civil de Belo Horizonte advertiu sobre a possibilidade de chuva forte, pancadas, raios e ventos de até 50 km/h na capital mineira até 1º de novembro.", "titulo_pt": "Defesa Civil alerta para chuva forte em Belo Horizonte", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 237939, "titulo": "CNMP adia decisão sobre promoção para mulheres no Ministério Público de SP", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/cnmp-adia-decisao-sobre-promocao-para-mulheres-no-ministerio-publico-de-sp.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-31T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Promotoras do Ministério Público de São Paulo estão defendendo que o CNMP reconheça a validade de uma resolução que estabelece reserva de vagas para mulheres nas promoções por merecimento. A decisão sobre o assunto foi adiada.", "titulo_pt": "CNMP adia decisão sobre promoção para mulheres no Ministério Público de SP", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 237949, "titulo": "Chilli Beans entra com pedido de recuperação extrajudicial", "url": "https://www.poder360.com.br/poder-economia/chilli-beans-entra-com-pedido-de-recuperacao-extrajudicial/", "fonte_id": "poder360", "data_pub": "2026-10-31T20:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A marca Chilli Beans apresentou um pedido de recuperação extrajudicial para negociar uma dívida de R$ 340 milhões com seus credores.", "titulo_pt": "Chilli Beans entra com pedido de recuperação extrajudicial", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 237950, "titulo": "Ex-ministro Adolfo Sachsida lança site com análises políticas", "url": "https://www.poder360.com.br/poder-gente/ex-ministro-adolfo-sachsida-lanca-site-com-analises-politicas/", "fonte_id": "poder360", "data_pub": "2026-10-31T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-ministro Adolfo Sachsida lançou um site com análises políticas. O economista afirma que a iniciativa visa fortalecer valores conservadores e liberais. Carlos Bolsonaro comentou nas redes sociais sobre o lançamento.", "titulo_pt": "Ex-ministro Adolfo Sachsida lança site com análises políticas", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 237951, "titulo": "Janones critica disputa por vitória de Lula: “A vaidade é uma merda”", "url": "https://www.poder360.com.br/poder-eleicoes-2026/janones-critica-disputa-por-vitoria-de-lula-a-vaidade-e-uma-merda/", "fonte_id": "poder360", "data_pub": "2026-10-31T20:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Janones criticou a discussão sobre quem foi mais importante para a reeleição de Lula, afirmando que a esquerda negligencia a força da direita no Congresso. Ele considera que a vaidade nessa disputa é inútil.", "titulo_pt": "Janones critica disputa por vitória de Lula: 'a vaidade é uma merda'", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 237976, "titulo": "‘Todos os casos estão em investigação’, afirma ministra dos Direitos Humanos sobre ameaças a indígenas em MS", "url": "https://www.brasildefato.com.br/2026/10/31/todos-os-casos-estao-em-investigacao-afirma-ministra-dos-direitos-humanos-sobre-ameacas-a-indigenas-em-ms/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-31T20:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra dos Direitos Humanos e da Cidadania, Janine Mello, declarou que todas as denúncias de violência contra indígenas em Mato Grosso do Sul estão sendo investigadas. Essa afirmação foi feita durante uma visita a aldeias indígenas na região.", "titulo_pt": "Todos os casos de violência contra indígenas em MS estão em investigação, afirma ministra", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 237953, "titulo": "Carlos visita Bolsonaro e reforça apoio a Marinho para presidir Senado", "url": "https://www.poder360.com.br/poder-congresso/carlos-visita-bolsonaro-e-reforca-apoio-a-marinho-para-presidir-senado/", "fonte_id": "poder360", "data_pub": "2026-10-31T20:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador eleito Carlos relatou uma visita ao presidente Jair Bolsonaro, que discutiram o apoio de Carlos para que Rogério Marinho seja eleito presidente do Senado, em disputa com Alcolumbre. Bolsonaro também mencionou as crises de soluço do pai e expressou preocupação com sua saúde.", "titulo_pt": "Carlos visita Bolsonaro e reforça apoio a Marinho para presidir Senado", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 237954, "titulo": "Solano Ribeiro morre aos 87 anos em São Paulo", "url": "https://www.poder360.com.br/poder-gente/solano-ribeiro-morre-aos-87-anos-em-sao-paulo/", "fonte_id": "poder360", "data_pub": "2026-10-31T19:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Solano Ribeiro, produtor e crítico musical que lançou artistas como Elis Regina e Chico Buarque em festivais de MPB, faleceu aos 87 anos em São Paulo. Ele estava internado e lutava contra um câncer.", "titulo_pt": "Solano Ribeiro morre aos 87 anos em São Paulo", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 238121, "titulo": "PGR deve pedir arquivamento de inquérito contra ministro do STJ", "url": "https://veja.abril.com.br/politica/pgr-deve-pedir-arquivamento-de-inquerito-contra-ministro-do-stj/", "fonte_id": "veja", "data_pub": "2026-10-31T19:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-Geral da República (PGR) planeja pedir o arquivamento do inquérito contra o ministro do Superior Tribunal de Justiça (STJ). A decisão final será de Cristiano Zanin, que é o relator das investigações sigilosas sobre o escândalo que afetou a imagem do STJ.", "titulo_pt": "PGR deve pedir arquivamento do inquérito contra ministro do STJ", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 237975, "titulo": "PT convoca ato no DF para comemorar vitória de Lula neste domingo (1º/11)", "url": "https://www.metropoles.com/distrito-federal/pt-convoca-ato-no-df-para-comemorar-vitoria-de-lula-neste-domingo-1o-11", "fonte_id": "metropoles", "data_pub": "2026-10-31T19:50:00Z", "idioma": "pt", "provavel_dup ": "2026-10-31T21:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Civis cansados após passarem anos no zelo de combate e uma perigosa jornada de 24 horas, se reuniram com familiares e amigos em Oleshky, que agora está em segurança.", "titulo_pt": "Saímos do inferno: cidadãos ucranianos contam suas histórias de sobrevivência", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 238092, "titulo": "Más de 300.000 franceses salen a la calle por tercer fin de semana para protestar por el coste de la vida", "url": "https://elpais.com/internacional/2026-10-31/mas-de-300000-franceses-salen-a-la-calle-por-tercer-fin-de-semana-para-protestar-por-el-coste-de-la-vida.html", "fonte_id": "elpais_america", "data_pub": "2026-10-31T21:40:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de 300.000 franceses saíram às ruas por terceiro fim de semana consecutivo para protestar sobre o custo de vida. Durante a manifestação, houve confrontos e cargas policiais em várias cidades, resultando em 565 detenções.", "titulo_pt": "Mais de 300.000 franceses saem às ruas por terceiro fim de semana consecutivo para protestar sobre o custo de vida", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}, {"id": 238159, "titulo": "North Korean Hackers May Have Stolen Billions. It Wouldn’t Be Their First Heist.", "url": "https://www.nytimes.com/2026/10/31/world/asia/north-korea-hacking.html", "fonte_id": "nyt_world", "data_pub": "2026-10-31T21:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Esta semana, um hack de $6,3 bilhões na Binance foi o maior até agora na indústria de criptomoedas. Corre-se o risco de North Korea ser o responsável, dada a sua história de crimes cibernéticos ousados.", "titulo_pt": "Hackers da Coreia do norte poderiam ter roubado bilhões. Não seria sua primeira furtividade.", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 238221, "titulo": "Legal filing questions Trump’s claims of non-citizen voting in California", "url": "https://www.aljazeera.com/news/2026/10/31/legal-filing-questions-trumps-claims-of-non-citizen-voting-in-california?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-31T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores de dados descobriram que muitos supostos 'não-cidadãos prováveis' identificados pelo governo Trump foram marcados de forma equivocada.", "titulo_pt": "Petição legal questiona reivindicações de Trump sobre votação de não-cidadãos em California", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 238215, "titulo": "Some 320,000 demonstrators take part in largely peaceful protests across France", "url": "https://www.france24.com/en/france/20261031-some-320-000-demonstrators-take-part-in-largely-peaceful-protests-across-france", "fonte_id": "france24", "data_pub": "2026-10-31T21:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 320 mil manifestantes participaram de uma terceira grande manifestação sobre custos de vida em todo o país na sexta-feira, de acordo com o ministério do Interior. Embora houvessem tensões em algumas cidades ao final das marchas, a maioria das manifestações foi considerada pacífica.", "titulo_pt": "Aproximadamente 320 mil participam de protestos sobre custos de vida em França", "veiculo": "France 24", "pais": "França", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 237826, "titulo": "Average taxi income rises: survey", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/01/2003866962", "fonte_id": "taipei_times", "data_pub": "2026-11-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa indica que o rendimento médio dos taxistas aumentou. O relatório não fornece detalhes adicionais sobre o período ou as condições específicas deste aumento.", "titulo_pt": "Rendimento médio dos taxistas aumenta: pesqui oticia/2026-10/estudo-mostra-necessidade-de-proteger-soja-para-evitar-perdas", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-31T18:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo da Universidade Federal de Viçosa, em parceria com a Croplife Brasil, mostrou que a produtividade das lavouras de soja no Brasil poderia cair até 55% se não fossem protegidas contra pragas, doenças e ervas daninhas. A pesquisa indica que uma redução na produção teria impactos negativos na economia e nos preços dos produtos ao consumidor.", "titulo_pt": "Estudo mostra necessidade de proteger soja para evitar perdas", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 238021, "titulo": "OPEP+ sinaliza produção estável em dezembro e volta foco para cotas de 2027", "url": "https://www.infomoney.com.br/mercados/opep-producao-petroleo-dezembro-cotas-2027/", "fonte_id": "infomoney", "data_pub": "2026-10-31T18:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os países-chave da OPEP+ indicaram que a produção de petróleo será estável em dezembro. A organização voltará a se concentrar nas cotas para 2027 após os cortes de produção de aproximadamente 2 milhões de barris por dia que vencerão no final de 2026.", "titulo_pt": "OPEP+ sinaliza produção estável em dezembro e volta foco para cotas de 2027", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 238022, "titulo": "Boulos cita R$ 600 bi em desonerações e fala em ‘chantagem’ do mercado", "url": "https://www.infomoney.com.br/politica/boulos-cita-r-600-bi-em-desoneracoes-e-fala-em-chantagem-do-mercado/", "fonte_id": "infomoney", "data_pub": "2026-10-31T18:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro cita R$ 600 bilhões em desonerações e afirma que há uma 'chantagem' do mercado. Ele defende a revisão de benefícios fiscais, supersalários e emendas. A dívida bruta está em 82,9% do PIB.", "titulo_pt": "Boulos cita  em um vírus de algas. O achado apóia a ideia de que vírus gigantes podem ter contribuído significativamente para a evolução de proteínas complexas.", "titulo_pt": "Gigante do vírus revela gene de canal de potássio que ilumina a evolução complexa de proteínas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 238251, "titulo": "Why do people prefer human empathy despite rating AI empathy higher?", "url": "https://phys.org/news/2026-10-people-human-empathy-ai-higher.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais pessoas estão recorrendo a chatbots alimentados por inteligência artificial (IA) para companhia e para combater a solidão. No entanto, a empatia gerada por IA pode ser capaz de substituir as conexões humanas?", "titulo_pt": "Por que as pessoas preferem a empatia humana, embora avaliem a empatia da IA mais positivamente?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 237964, "titulo": "Vírus da herpes infecta células da pele em ritmos diferentes, mostra estudo", "url": "https://www.metropoles.com/saude/virus-da-herpes-infecta-celulas-da-pele-em-ritmos-diferentes-mostra-estudo", "fonte_id": "metropoles", "data_pub": "2026-10-31T20:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo mostrou que o vírus da herpes infecta primeiramente algumas células da pele e posteriormente atinge os folículos capilares e os neurônios. A pesquisa utilizou modelos de pele humana para observar o comportamento do vírus.", "titulo_pt": "Vírus da herpes infecta células da pele em ritmos diferentes, mostra estudo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 238252, "titulo": "Chemists develop AI tool to convert human ingenuity into life-enhancing enzymes", "url": "https://phys.org/news/2026-10-chemists-ai-tool-human-ingenuity.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Químicos desenvolveram uma ferramenta de inteligência artificial para converter a invenção humana em enzimas que melhoram a vida. O objetivo é auxiliar a pesquisa científica, não substituí-la.", "titulo_pt": "Químicos desenvolvem ferramenta de IA para transformar invenções humanas em enzimas de vida melhoradora", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 237860, "titulo": "Calling species 'invasive'—and culling them—isn't done lightly. But it matters to Australia's threatened species", "url": "https://phys.org/news/2026-10-species-invasive-culling-isnt-australia.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A distinção entre espécies nativas, introduzidas ou invasoras pode ter implicações críticas para a sobrevivência de outras espécies, especialmente na Austrália, onde animais considerados invasores, como coelhos europeus e porcos ferozes, são frequentemente controlados, enquanto a maioria das espécies nativas é geralmente deixada em paz.", "titulo_pt": "Chamar uma espécie de 'invasora' e matá-la não é uma decisão leve, mas é importante para as espécies ameaçadas da austrália", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 237539, "titulo": "Paris identifica local onde foi feita a primeira com seres humanos da história", "url": "https://www.dw.com/pt-br/paris-identifica-local-onde-foi-feita-a-primeira-com-seres-humanos-da-história/a-79810864?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-31T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores identificaram o local onde foi tirada a primeira foto com seres humanos da história, praticamente dois séculos após a imagem de Louis Daguerre. A longa exposição do fotograma fez com que outros elementos do cenário não fossem visíveis na foto final.", "titulo_pt": "Paris identifica local onde foi feita a primeira foto com seres humanos da história", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 237861, "titulo": "Ultracold atoms simulate hard-to-observe matter-antimatter pair production", "url": "https://phys.org/news/2026-10-ultracold-atoms-simulate-hard-antimatter.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Segundo a eletrodinâmica quântica, teoria que descreve as interações entre a luz e partículas elétricamente carregadas, um campo elétrico suficientemente forte pode, em princípio, converter parte de sua energia em partículas e seus parceiros antipartículas. Os parceiros antipartículas têm a mesma massa e, para partículas elétricamente carregadas, o carregamento elétrico oposto.", "titulo_pt": "Átomos ultracômodos simulam a produção difícil de observar de pares de matéria-antimatéria", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 237415, "titulo": "Fóssil revela dinossauro que mastigava frutas há 66 milhões de anos", "url": "https://www.metropoles.com/ciencia/fossil-revela-dinossauro-que-mastigava-frutas-ha-66-milhoes-de-anos", "fonte_id": "metropoles", "data_pub": "2026-10-31T16:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um fóssil revelou a existência de um dinossauro do tamanho de um peru, há 66 milhões de anos, que tinha músculos adaptados para mastigar frutas. Essa espécie pode ter ajudado a espalhar sementes durante o período Cretáceo.", "titulo_pt": "Fóssil revela dinossauro que mastigava frutas há 66 milhões de anos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 237333, "titulo": "Van Gogh teria se inspirado em céu de julho, não de junho, para a obra 'A Noite Estrelada'", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/van-gogh-teria-se-inspirado-em-ceu-de-julho-nao-de-junho-para-a-obra-a-noite-estrelada.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-31T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Lua minguante à direita do quadro, Vênus em tons pálidos próximo ao cipreste e a disposição das estrelas podem indicar que Vincent van Gogh observou o céu que inspirou 'A Noite Estrelada' em julho, não em junho.", "titulo_pt": "Van Gogh teria se inspirado em céu de julho para 'A Noite Estrelada'", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 237862, "titulo": "Four superconducting cables link two large quantum processors into one", "url": "https://phys.org/news/2026-10-superconducting-cables-link-large-quantum.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quatro cabos supercondutores conectam dois grandes processadores quânticos em um único sistema. Para que isso funcione, as conexões precisam transmitir informações quânticas frágeis sem as destruir.", "titulo_pt": "Quatro cabos supercondutores unem dois grandes processadores quânticos em uma única unidade", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 237886, "titulo": "Allergic reactions after sex should be listed as an antibiotic risk, experts say", "url": "https://www.newscientist.com/article/2596737-allergic-reactions-after-sex-should-be-listed-as-an-antibiotic-risk-experts-say/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-31T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma mulher teve uma reação alérgica severa a um antibiótico presente no sêmen do parceiro após o sexo, levando médicos a sugerirem que esse risco seja listado nas folhas de informações do medicamento.", "titulo_pt": "Reações alérgicas após sexo devem ser listadas como risco de antibióticos, dizem especialistas", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 237797, "titulo": "DR Congo Ebola deaths top 5,000, cases recorded in other African nations", "url": "https://www.scmp.com/news/world/africa/article/3372849/dr-congo-ebola-deaths-top-5000-cases-recorded-other-african-nations", "fonte_id": "scmp", "data_pub": "2026-10-31T15:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 5.000 mortes foram registradas em decorrência da Ebola na República Democrática do Congo, de acordo com os dados mais recentes do Ministério da Saúde do país. O número de casos confirmados é de 10.351, com uma taxa de letalidade próxima de 50%. O surto também foi registrado em outros países africanos.", "titulo_pt": "Mortes por Ebola na república democrática do Congo superam 5.000", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 237863, "titulo": "Rare Iron Age Celtic helmet discovered in northeastern Poland far from its homeland", "url": "https://phys.org/news/2026-10-rare-iron-age-celtic-helmet.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 2.400 anos atrás, em Łysa Góra, na Polônia, um grupo de pessoas quebrou e jogou um capacete de bronze celta em um poço, junto com adzes de ferro e uma foice. Capacetes semelhantes são ocasionalmente encontrados em enterros luxuosos de elite de guerreiros celtas, desde Champagne, França, até Dürrnberg, Áustria.", "titulo_pt": "Capacete do idade do ferro celta raro descoberto no nordeste da polônia longe de sua terra natal", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 237864, "titulo": "New gel fuel could make rocket and satellite propulsion easier to control", "url": "https://phys.org/news/2026-10-gel-fuel-rocket-satellite-propulsion.html", "fonte_id": "phys_org", "data_pub": "2026-10-31T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um gel baseado no kerosene foi desenvolvido por pesquisadores da Concordia e pode simplificar a armazenagem e o controle de combustíveis para foguetes e satélites.", "titulo_pt": "Novo combustível em gel poderia simplificar a propulsão de foguetes e satélites", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 237902, "titulo": "9 nightmarish sci-fi spaceships to crawl aboard for Halloween if you dare", "url": "https://www.space.com/entertainment/9-nightmarish-sci-fi-spaceships-to-crawl-aboard-for-halloween-if-you-dare", "fonte_id": "space_com", "data_pub": "2026-10-31T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O texto sugere que os leitores se preparem com uma lanterna de alta luminosidade e um grande rifle para explorar espaçonaves sinistras, provavelmente relacionadas a Halloween.", "titulo_pt": "9 Espaçonaves científicas assustadoras para explorar se atrever neste Halloween", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 237825, "titulo": "FEATURE: The unsung heroes of snake antivenom production", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/01/2003866961", "fonte_id": "taipei_times", "data_pub": "2026-11-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo destaca os heróis anônimos envolvidos na produção de antiveneno para serpentes. Ele explora os desafios enfrentados pelos profissionais nessa área, que são essenciais para o tratamento de mordidas de serpentes.", "titulo_pt": "Os heróis anônimos da produção de antiveneno para serpentes", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 237827, "titulo": "‘Reading Boy’ sculpture hoped to inspire youth", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/01/2003866963", "fonte_id": "taipei_times", "data_pub": "2026-11-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma escultura intitulada 'Leitor' está sendo esperada para inspirar a juventude. O título original em inglês é 'Reading Boy'.", "titulo_pt": "Escultura 'leitor' esperad 026-10-31T14:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em cerimônia de memorial realizada em Trappes, uma semana após um ataque racista terrorista que deixou uma pessoa morta e sete feridos, o prefeito de esquerda foi acompanhado por líderes políticos de esquerda, enquanto líderes de outros espectros políticos não compareceram.", "titulo_pt": "Após o ataque terrorista em Trappes, a comunidade espera que a França acorde para o perigo do extremismo de direita", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 237824, "titulo": "Amendments to combat illegal land use pass legislature", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/01/2003866960", "fonte_id": "taipei_times", "data_pub": "2026-11-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A legislatura aprovou emendas para combater o uso ilegal de terrenos.", "titulo_pt": "Emendas para combater uso ilegal de terrenos são aprovadas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 237969, "titulo": "Amazonas registra queda de 39% nos focos de queimadas em outubro", "url": "https://www.metropoles.com/brasil/amazonas-registra-queda-de-39-nos-focos-de-queimadas-em-outubro", "fonte_id": "metropoles", "data_pub": "2026-10-31T20:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Amazonas registrou uma redução de 39% nos focos de queimadas em outubro de 2026, totalizando 8,5 mil focos. No entanto, nove municípios enfrentaram qualidade do ar moderada a ruim.", "titulo_pt": "Amazonas registra queda de 39% nos focos de queimadas em outubro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 238008, "titulo": "Incêndio atinge Área de Proteção Ambiental em Alter do Chão, no Pará", "url": "https://www.cnnbrasil.com.br/nacional/norte/pa/incendio-atinge-area-de-protecao-ambiental-em-alter-do-chao-no-para/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-31T19:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incêndio atingiu uma Área de Proteção Ambiental em Alter do Chão, no Pará, na sexta-feira (30). As chamas foram controladas, mas ainda existem focos de incêndio na região do Lago Verde.", "titulo_pt": "Incêndio atinge Área de Proteção Ambiental em Alter do Chão, no Pará", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 237553, "titulo": "En 2022, la ciudad de Nueva York mezcló 10.395 libras de residuos plásticos en cuatro franjas de carreteras de Staten Island, reduciendo las emisiones de carbono en 16.128,2 libras en un programa piloto", "url": "https://www.clarin.com/estados-unidos/2022-ciudad-nueva-york-mezclo-10395-libras-residuos-plasticos-franjas-carreteras-staten-island-reduciendo-emisiones-carbono-161282-libras-programa-piloto_0_wDFm6pHc7y.html", "fonte_id": "clarin", "data_pub": "2026-10-31T17:15:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Em 2022, a cidade de Nova York misturou 10.395 libras de resíduos plásticos em quatro faixas de estradas em Staten Island, reduzindo as emissões de carbono em 16.128,2 libras. O Departamento de Transportes utilizou mais de 200.000 garrafas de plástico nesse programa piloto.", "titulo_pt": "Em 2022, a cidade de nova York misturou 10.395 libras de resíduos plásticos em estradas de Staten Island, reduzindo emissões de carbono", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 237982, "titulo": "Após controle das chamas em Alter do Chão, autoridades investigam ação criminosa", "url": "https://exame.com/esg/apos-controle-das-chamas-em-alter-do-chao-autoridades-investigam-acao-criminosa/", "fonte_id": "exame", "data_pub": "2026-10-31T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Brigadistas estão monitorando novos focos de fogo no Lago Verde, enquanto autoridades investigam uma possível ação criminosa. Lideranças indígenas denunciam especulação imobiliária na região.", "titulo_pt": "Após controle das chamas em Alter do Chão, autoridades investigam ação criminosa", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 237592, "titulo": "MOP inicia reconstrucción en Atacama tras sistema frontal de julio con una inversión de más de $115 mil millones", "url": "https://www.latercera.com/nacional/noticia/mop-inicia-reconstruccion-en-atacama-tras-sistema-frontal-de-julio-con-una-inversion-de-mas-de-115-mil-millones/", "fonte_id": "la_tercera", "data_pub": "2026-10-31T16:02:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A empresa MOP está iniciando a reconstrução em Atacama após um sistema frontal em julho, com uma investida superior a 115 mil milhões de pesos chilenos. O plano prevê investimentos para os períodos de 2026-2028 voltados para a recuperação de conectividade, serviços essenciais e obras de maior escala de reconstrução.", "titulo_pt": "MOP inicia reconstrução em Atacama após sistema frontal de julho com investimento superior a 115 mil milhões de pesos", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 237986, "titulo": "Incêndio de grandes proporções atinge área protegida em Alter do Chão e fogo é parcialmente contido", "url": "https://exame.com/esg/incendio-de-grandes-proporcoes-atinge-area-protegida-em-alter-do-chao-e-fogo-e-parcialmente-contido/", "fonte_id": "exame", "data_pub": "2026-10-31T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incêndio de grandes proporções atingiu uma área protegida em Alter do Chão, no Pará, durante a seca extrema e intensificação do El Niño. Mais de 11 mil focos de calor foram registrados no estado em outubro, de acordo com o Inpe.", "titulo_pt": "Incêndio de grandes proporções atinge área protegida em Alter do Chão e fogo é parcialmente contido", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 237882, "titulo": "COP17: Key outcomes agreed at the UN biodiversity conference in Yerevan", "url": "https://www.carbonbrief.org/cop17-key-outcomes-agreed-at-the-un-biodiversity-conference-in-yerevan", "fonte_id": "carbon_brief", "data_pub": "2026-10-31T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Países concluíram o primeiro 'exame global' do progresso em direção à reversão da perda da natureza até 2030 durante a COP17 da conferência de biodiversidade em Yerevan. Os principais resultados foram acordados durante a conferência das Nações Unidas sobre biodiversidade em Yerevan.", "titulo_pt": "COP17: principais resultados acordados na conferência de biodiversidade das nações unidas em Yerevan", "veiculo": "Carbon Brief (clima)", "pais": "Reino Unido", "classe": "A"}, {"id": 237691, "titulo": "New Census data reveal a homeowner-renter divide in America's electric-car transition", "url": "https://www.axios.com/2026/10/31/ev-driveway-divide-renters-homeowners", "fonte_id": "axios", "data_pub": "2026-10-31T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os dados do Censo dos Estados Unidos mostram que os proprietários de casa eram quase o dobro de propensos a ter um carro elétrico em 2025 em comparação com os inquilinos, revelando uma divisão significativa na transição para veículos elétricos no país.", "titulo_pt": "Novos dados do censo revelam divisão entre proprietários e inquilinos na transição para veículos elétricos nos estados unidos", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 236924, "titulo": "Un nuevo informe indica cómo estará el clima en la Costa Atlántica durante enero en el marco del Super Niño", "url": "https://www.clarin.com/sociedad/nuevo-informe-indica-clima-costa-atlantica-enero-marco-super-nino_0_1wIVe1huzp.html", "fonte_id": "clarin", "data_pub": "2026-10-31T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A tendência de dias mais frios e chuvosos continuará durante o verão, conforme informa o Serviço Meteorológico Nacional. Para o fim de semana, espera-se novas chuvas, seguidas de um aumento gradual das temperaturas nos dias seguintes.", "titulo_pt": "Novo relatório indica condições climáticas na Costa atlântica em janeiro", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 237233, "titulo": "Hong Kong’s Jumbo Floating Restaurant catches fire before opening, kills 34 – SCMP archive", "url": "https://www.scmp.com/news/hong-kong/article/3372522/hong-kongs-jumbo-floating-restaurant-catches-fire-opening-kills-34-scmp-archive", "fonte_id": "scmp", "data_pub": "2026-10-31T03:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 30 de outubro de 1971, um grande incêndio destruiu o restaurante Jumbo Flutuante em Aberdeen, Hong Kong, causando a morte de 13 pessoas e ferindo pelo menos 42. O fogo consumiu rapidamente o restaurante de quatro andares, deixando apenas um esqueleto carbonizado.", "titulo_pt": "Incêndio destrói Jumbo flutuante em aberdeen, matando 13 pessoas em 1971", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 236678, "titulo": "Empresas ampliam programas de reciclagem de embalagens e buscam fidelizar clientes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/10/empresas-ampliam-programas-de-reciclagem-de-embalagens-e-buscam-fidelizar-clientes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-31T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas brasileiras estão expandindo programas de reciclagem de embalagens visando aumentar a logística reversa, que consiste na destinação ambientalmente correta dos resíduos gerados após o consumo dos produtos.", "titulo_pt": "Empresas brasileiras ampliam programas de reciclagem de embalagens e buscam fidelizar clientes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 237076, "titulo": "In Brazil, Lula faces limited room for maneuver on environmental protection", "url":
