<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}

<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

neste ano, com debates sobre propaganda eleitoral nas redes sociais.", "mundo": "As eleições no Brasil e em Israel, bem como as tensões diplomáticas entre o Brasil e os Estados Unidos, foram alguns dos principais temas na cobertura internacional. Após a derrota histórica do presidente Jair Bolsonaro, seu filho Flávio Bolsonaro fugiu para os Estados Unidos, aprofundando a crise entre os dois países. Em Israel, o primeiro-ministro Benjamin Netanyahu liderou as contagens parciais das eleições, mas nenhum bloco conseguiu a maioria necessária para formar um governo, o que levanta incertezas sobre o futuro político do país. Além disso, as tensões entre o governo e os estudantes na França, bem como a ascensão dos partidos árabes na política israelense, também foram noticiados, destacando a instabilidade política em diferentes regiões do mundo.\n\nA guerra no Irã continua afetando significativamente a geopolítica global. As companhias aéreas europeias e asiáticas estão reduzindo suas operações com derivados de petróleo devido à instabilidade, o que pode levar a possíveis aumentos nos preços das passagens aéreas. O Irã continua em negociações com mediadores para encerrar a guerra e reabrir o Estreito de Ormuz, mas sem avanços. Em contraste, a Coreia do Norte promoveu uma nova visão noturna em Sinuiju após abrir um puente para a China, focando em atrair turistas e investidores. A Coreia do Sul, por outro lado, tem resistido à influência militar e econômica dos Estados Unidos, mantendo uma relação estratégica com a Alemanha para fortalecer a capacidade industrial defensiva europeia. Além disso, a Coreia do Norte enfrenta sanções dos Estados Unidos por fraudes de empresas americanas, enquanto a Coreia do Sul luta contra a violência na região sul do país. Na região do Oriente Médio, a guerra no Gaza continua com altos custos humanos, enquanto Israel enfrenta uma oposição desanimada em suas políticas no território.", "economia": "Os investidores globais estão mais otimistas sobre os títulos do governo japonês, devido a sinais de recuperação na demanda interna e a um cenário político mais favorável. A Hyundai Motor planeja investir US$ 450 milhões para expandir sua fábrica na Alabama, enquanto a Safran está apostando no Reino Unido devido ao apoio governamental mais claro para o setor aeroespacial. O Banco Mundial prevê que os preços das commodities alimentícias aumentem 10% em 2026 e 7% em 2027, totalizando um aumento de 18% nos dois anos. A Petrobras registrou um recorde na produção de diesel no terceiro trimestre, em resposta às importações mais caras devido à guerra no Irã. A Microsoft registrou uma alta de 19% na receita e suas ações subiram cerca de 4% após a divulgação de resultados favoráveis, especialmente em seu negócio de computação em nuvem, devido à crescente demanda por inteligência artificial. No entanto, as ações do Google caíram 9% após a empresa aumentar seus gastos com inteligência artificial para mais de US$ 50 bilhões no terceiro trimestre, resultando em uma queima recorde de caixa. A Cimed planeja uma campanha para comemorar seus 50 anos, focando nos segmentos de cosméticos e higiene pessoal. A Raízen fechou um acordo tributário com a PGFN e a Receita Federal no valor de R$ 22,4 bilhões, enquanto a Motiva registrou um lucro líquido ajustado de R$ 750 milhões no terceiro trimestre de 2026, um aumento de 9,8% em comparação com o mesmo período do ano anterior, impulsionado pelo pedágio. A Receita Federal analisa a possibilidade de devolver o risco aos vendedores de CDBs, exigindo que informem o risco do emissor e não ofereçam a garantia do FGC. O STF analisa as regras para o pagamento das perdas inflacionárias para os poupadores que não aderiram ao acordo e a possibilidade de continuidade das ações individuais. A CNI projeta um déficit de 15 milhões de CBIOs em 2035, alertando para o risco de descompasso entre a demanda por biocombustíveis e a capacidade produtiva.", "tecnologia": "A Samsung Electronics registrou um lucro recorde no terceiro trimestre, devido à superciclo de chips de inteligência artificial. A empresa sul-coreana Gaon Cable venceu um contrato para fornecer cabos elétricos nos Estados Unidos. O Kansai se destaca como um importante hub de centros de dados, ocupando 25% do total de área de centros de dados no Japão. A SK Hynix, gigante sul-coreana de chips de memória, registrou uma margem operacional de quase 80% de suas vendas no último trimestre, um resultado pouco comum na indústria de manufatura. A Apple lançou um novo MacBook Pro com tela touchscreen, um produto que a empresa havia afirmado que nunca seria desenvolvido. O Google sofreu uma queda de 10% nas ações após anunciar um gasto de 51 bilhões de dólares em IA, o que aprofundou a quebra de caixa. A Microsoft atribuiu atrasos nos centros de dados a redução do gasto em capital. A Rússia planeja construir sua própria versão do sistema de comunicação via satélite Starlink, desenvolvido pela SpaceX de Elon Musk, com o objetivo de auxiliar na guerra contra a Ucrânia. Os centros de dados da região totalizam cerca de 1,16 milhão de metros quadrados. O piloto Chris Caputo decola um avião elétrico Alia CX300 do Aeroporto Internacional de Burlington, em Vermont, EUA, sem ruídos característicos de motores a jato ou a pistão, apenas com o som baixo do motor elétrico e uma aceleração imediata.", "ciencia": "A NASA e seus parceiros internacionais continuam avançando em projetos espaciais significativos. A etapa central do SLS para a missão Artemis III foi integrada junto aos propelentes sólidos no Hangar 3 do Kennedy Space Center, na Flórida, em 28 de outubro de 2026. Em outro desenvolvimento, a NASA selecionou 19 novas propostas de ciência cidadã, com um sucesso crescente de voluntários na realização de pesquisas espaciais. No âmbito da saúde, um novo estudo sugere que cometas provavelmente não trouxeram os blocos de construção moleculares para a origem da vida na Terra, desafiando a teoria tradicional. Além disso, a descoberta de uma estrutura pré-hispânica em Teteles de Ávila Castillo, no México, que acredita ser uma antiga observatória solar, oferece insights sobre a astronomia pré-colombiana. No campo da medicina, o vírus Shamonda foi relatado no primeiro caso humano nas Américas, e pesquisas sobre peptídeos e células solares espaciais avançam, com potenciais aplicações em tratamentos e tecnologias de energia.", "cultura": "Adélia Prado, Micheliny Verunschk e Julia Codo foram declaradas finalistas do Prêmio Oceanos 2026, que reconhece o melhor da poesia e da prosa em português. O evento marcou um momento importante na literatura brasileira e latino-americana. Em outro destaque, o show do BTS, marcado para começar às 20h desta quarta-feira (28), já está causando congestionamentos no trânsito a quilômetros do estádio Morumbi, em São Paulo, desde as 8h, com pessoas perdendo exames e horários de trabalho 12 horas antes do início. A expectativa é de que o evento atraia uma grande quantidade de pessoas, gerando transtornos antes mesmo de começar. Além disso, a série 'Dom de Iludir', lançada pela Netflix nesta quarta-feira (28), é classificada como um melodrama, com um ritmo acelerado e atores típicos de telenovelas, marcando a volta de Marieta Severo e José de Abreu à plataforma de streaming.", "sociedade": "A América enfrenta um desafio crescente na prestação de cuidados a longo prazo à medida que a população envelhece, conforme destaca o Pan American Health Organization (PAHO). Em outro desenvolvimento, a Polícia Civil do Rio de Janeiro (PCERJ) investiga uma rede de escravidão sexual envolvendo menores, que produziam vídeos de abusos para ameaçar as vítimas. Na França, a juventude está em rebelião, embora o motivo das manifestações não seja detalhado. Em Mato Grosso do Sul, indígenas denunciam ameaças e insultos discriminatórios após as eleições, com a Articulação dos Povos Indígenas do Brasil apontando ações para impedir a votação.", "meio_ambiente": "De acordo com um estudo do MapBiomas, o Brasil perdeu 45% de sua vegetação e fragmentou florestas nos últimos 38 anos, com a redução do tamanho médio das áreas conservadas e o avanço do desmembramento do território por lavouras e urbanização. Este relatório foi divulgado durante a COP16 da Biodiversidade. Em Los Angeles, Estados Unidos, o conselho municipal votou unânimemente para proibir a extração de petróleo, afetando mais de 1.800 poços ativos e inativos, com o objetivo de proteger a saúde pública e alcançar a neutralidade de carbono para 2035. No Brasil, um vídeo registrou uma sucuri-amarela enrolando o corpo em um jacaré dentro de um lago no Pantanal de Mato Grosso do Sul, um comportamento raro que chama a atenção para a biodiversidade local. Além disso, os níveis d'água nos Lagos Menindee, na Austrália Ocidental, atingiram o nível mais baixo em cinco anos, levando o governo do estado a implementar restrições de uso d'água e alertando para o risco potencial de mortes em massa de peixes durante o verão.", "direitos_humanos": "A Comissão Anticorrupção e de Direitos Civis da Coreia do Sul pediu clemência para ex-funcionários da Coupang acusados no caso da 'lista negra', enquanto a Albânia aplicou multas pesadas a demonstrantes em protestos violentos. As Nações Unidas condenaram a repressão policial excessiva durante as manifestações estudantis na França. A Comissão de Colonização e Resistência ao Muro relatou sete ataques israelenses contra agricultores no Vale do Jordão em 12 horas. No Egito, a editora-chefe Lina Attalah foi condenada e a publicação Mada Masr foi fechada, refletindo a intensificação da repressão ao jornalismo independente. Um blogueiro chinês, Wu Kai, foi morto por criminosos contratados online, levando a pedidos por maiores punições. A família de um homem kurdo falecido em custódia acionou o governo de Tóquio em uma ação judicial. O cineasta iraniano Jafar Panahi foi condenado a cinco anos de prisão pelo Tribunal Revolucionário de Teerã. Por fim, 191 candidatos assinaram um documento em apoio à igualdade de gênero, embora sem detalhes adicionais sobre o contexto ou as consequências das assinaturas."}, "resumo_do_dia": {"politica_nacional": [{"id": 231284, "titulo": "Moraes autoriza presidente do PL a visitar Bolsonaro após derrota e fuga de Flávio", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/10/moraes-autoriza-presidente-do-pl-a-visitar-bolsonaro-apos-derrota-e-fuga-de-flavio.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-29T01:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF Alexandre de Moraes autorizou a visita do presidente do PL, Valdemar Costa Neto, ao ex-presidente Jair Bolsonaro, que está em prisão domiciliar. O encontro está programado para ocorrer na quinta-feira entre 9h e 11h.", "titulo_pt": "Moraes autoriza visita de valdemar costa neto a Bolsonaro após derrota", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 231498, "titulo": "Tarcísio diz que pode disputar a Presidência em 2030", "url": "https://www.cnnbrasil.com.br/politica/tarcisio-diz-que-pode-disputar-a-presidencia-em-2030/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-29T01:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tarcísio disse que pode concorrer à Presidência em 2030, mas enfatizou que sua prioridade atual é administrar o estado de São Paulo.", "titulo_pt": "Tarcísio anuncia possível disputa presidencial em 2030", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 231389, "titulo": "O novo papel de Michelle Bolsonaro após a fuga de Flávio", "url": "https://veja.abril.com.br/politica/o-novo-papel-de-michelle-bolsonaro-apos-a-fuga-de-flavio/", "fonte_id": "veja", "data_pub": "2026-10-29T01:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Michelle Bolsonaro ganhou mais visibilidade após os resultados eleitorais dos candidatos que apoiou. Ela passou a desempenhar um papel mais proeminente após a fuga de Flávio Bolsonaro.", "titulo_pt": "Novo papel de Michelle Bolsonaro após a fuga de Flávio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 231515, "titulo": "Randolfe diz que carta com teor golpista de Flávio é uma “afronta”", "url": "https://www.cnnbrasil.com.br/politica/randolfe-diz-que-carta-com-teor-golpista-de-flavio-e-uma-afronta/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-29T00:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Randolfe Rodrigues, líder do governo no Congresso Nacional, criticou a carta de Flávio Bolsonaro, que ele considera golpista. Flávio se posicionou na carta como líder do Brasil.", "titulo_pt": "Randolfe critica carta de Flávio como 'afronta'", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 231516, "titulo": "Após Flávio alegar fraude, TSE diz que “qualquer pessoa” pode auditar urnas", "url": "https://www.cnnbrasil.com.br/eleicoes/apos-flavio-alegar-fraude-tse-diz-que-qualquer-pessoa-pode-auditar-urnas/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-29T00:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) afirmou que qualquer pessoa pode auditar as urnas eletrônicas, com base em boletins, registros digitais e logs. O senador Flávio Bolsonaro não apresentou provas de irregularidades.", "titulo_pt": "TSE afirma que qualquer pessoa pode auditar urnas após Flávio alegar fraude", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 231537, "titulo": "TSE, partidos e até aliados de Flávio Bolsonaro defendem resultado das urnas após carta golpista", "url": "https://www.jota.info/eleicoes/eleicoes-2026/tse-partidos-e-ate-aliados-de-flavio-bolsonaro-defendem-resultado-das-urnas-apos-carta-golpista", "fonte_id": "jota", "data_pub": "2026-10-29T00:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE), partidos políticos e até mesmo aliados do senador Flávio Bolsonaro defenderam o resultado das urnas após a publicação de uma carta considerada golpista. Flávio Bolsonaro chegou a se declarar 'presidente eleito', mas posteriormente recuou.", "titulo_pt": "TSE, partidos e aliados de Flávio Bolsonaro defendem resultado das urnas após carta golpista", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 231287, "titulo": "Flávio não é perseguido, não há ditadura judicial", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/conrado-hubner-mendes/2026/10/flavio-nao-e-perseguido-nao-ha-ditadura-judicial.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-29T00:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O texto critica a família Bolsonaro, afirmando que ela não se destaca pela coragem, honestidade ou defesa da liberdade. Sugere buscar virtudes em ideias que não estejam relacionadas a armas ou tortura.", "titulo_pt": "Flávio não é perseguido, não há ditadura judicial", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 231288, "titulo": "Nunes não comenta carta golpista de Flávio e diz que oposição deve fiscalizar Lula", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/nunes-nao-comenta-carta-golpista-de-flavio-e-diz-que-oposicao-deve-fiscalizar-lula.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-29T00:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ricardo Nunes, prefeito de São Paulo e do MDB, afirmou que a oposição deve fiscalizar o governo Lula após a divulgação da carta golpista de Flávio Bolsonaro. Nunes não comentou sobre a carta específica de Flávio.", "titulo_pt": "Nunes diz que oposição deve fiscalizar Lula após carta golpista de Flávio", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 231289, "titulo": "Carta de Flávio Bolsonaro mente sobre 'fraude eleitoral' e distorce fatos; veja", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/carta-de-flavio-bolsonaro-mente-sobre-fraude-eleitoral-e-distorce-fatos-veja.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-29T00:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A carta publicada por Flávio Bolsonaro contém várias mentiras e distorções sobre o processo eleitoral em que ele foi derrotado. O documento foi divulgado nesta quarta-feira (28/10/2026).", "titulo_pt": "Carta de Flávio Bolsonaro contém mentiras e distorções sobre 'fraude eleitoral'; veja", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 231290, "titulo": "Carta de Flávio Bolsonaro tem ao menos 4 versões, com troca de brasão e mudanças no texto", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/carta-de-flavio-bolsonaro-tem-ao-menos-4-versoes-com-troca-de-brasao-e-mudancas-no-texto.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-28T23:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A carta de Flávio Bolsonaro, senador pelo PL que contesta a derrota nas eleições, teve pelo menos quatro versões divulgadas, com alterações no brasão e na forma como ele se apresenta, variando entre 'presidente eleito' e 'líder do Brasil'.", "titulo_pt": "Carta de Flávio Bolsonaro tem pelo menos quatro versões, com alterações no brasão e na forma de se apresentar", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 231252, "titulo": "Quem vai aderir ao novo golpe dos Bolsonaros?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/viniciustorres/2026/10/quem-vai-aderir-ao-novo-golpe-dos-bolsonaros.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T23:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro liderou uma campanha contra o que considerou uma 'tirania' e 'regime de exceção', comparando-se a Charles de Gaulle, líder da resistência contra a ocupação nazista da França. Ele fez essas afirmações em 28 de outubro de 2026, às 20h35.", "titulo_pt": "Quem vai aderir ao novo golpe dos Bolsonaros?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 231253, "titulo": "Flávio pode virar o Vorcaro da política", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/adriana-fernandes/2026/10/flavio-pode-virar-o-vorcaro-da-politica.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T23:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato derrotado Flávio Bolsonaro declarou-se 'presidente eleito' do Brasil em uma carta golpista após sua fuga do país e desembarque nos Estados Unidos, com apoio de integrantes do governo Trump. A 'bravura' de Flávio durará pouco, segundo a fonte.", "titulo_pt": "Flávio pode perder a 'bravura' política após declaração golpista", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 231254, "titulo": "TCU aprova acordo para devolução de trecho da Transnordestina à União", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/10/tcu-aprova-acordo-para-devolucao-de-trecho-da-transnordestina-a-uniao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T23:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TCU aprovou um acordo para a devolução de mais de 3.000 quilômetros de ferrovias da Transnordestina à União e para o pagamento de uma indenização de R$ 1,8 bilhão. A concessionária Transnordestina Logística, do grupo CSN, será responsável pelo pagamento.", "titulo_pt": "TCU aprova acordo para devolução de trechos da Transnordestina à União e pagamento de indenização", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 231291, "titulo": "Carta golpista de Flávio é rejeitada por aliados próximos, que veem postura perigosa", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/carta-golpista-de-flavio-e-rejeitada-por-aliados-proximos-que-veem-postura-perigosa.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-28T23:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Aliados próximos do senador Flávio Bolsonaro rejeitaram uma carta considerada golpista, classificando a atitude do ex-candidato a presidente como perigosa. A carta foi divulgada pelo próprio senador.", "titulo_pt": "Carta golpista de Flávio é rejeitada por aliados próximos, que veem postura perigosa", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 231347, "titulo": "Coordenador de campanha do PL admite não ter prova de fraude eleitoral", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/coordenador-de-campanha-do-pl-admite-nao-ter-prova-de-fraude-eleitoral", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-28T23:08:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Rogério Marinho, coordenador da campanha de Flávio Bolsonaro, admitiu que não há provas de fraude eleitoral após a divulgação de uma carta golpista do candidato, que fugiu para os Estados Unidos após a derrota para Lula.", "titulo_pt": "Coordenador de campanha do PL admite não ter prova de fraude eleitoral", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 231256, "titulo": "Senado aprova reajuste em adicional de fronteira sem indicar como governo vai pagar", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/senado-aprova-reajuste-em-adicional-de-fronteira-sem-indicar-como-governo-vai-pagar.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T23:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou o reajuste no adicional de fronteira, elevando o valor do benefício de R$ 91 para R$ 191 por dia a partir de 2027. A medida também ampliou as carreiras públicas que podem receber o adicional.", "titulo_pt": "Senado aprova reajuste no adicional de fronteira sem detalhar como o governo vai financiar", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 232194, "titulo": "(LEAD) Lee set to hold summit with German chancellor on economic cooperation", "url": "https://en.yna.co.kr/view/AEN20261029001451315", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T01:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente sul-coreano Lee Jae Myung está programado para se reunir com o chanceler alemão em uma cúpula focada em cooperação econômica.", "titulo_pt": "Lee planeja reunião com chanceler alemão para discussão de cooperação econômica", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 232114, "titulo": "As Iran war drags on, airlines pull back on fuel hedges and warn on fares", "url": "https://www.japantimes.co.jp/business/2026/10/29/companies/iran-war-airlines-fuel-fares/", "fonte_id": "japan_times", "data_pub": "2026-10-29T01:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As companhias aéreas estão reduzindo suas operações com derivados de petróleo devido à guerra no Irã, e advertindo sobre possíveis aumentos nos preços das passagens. O combustível aéreo representa cerca de 30% a 40% dos custos das companhias aéreas, com as companhias europeias e asiáticas historicamente mais propensas a fazer hedge do que as norte-americanas.", "titulo_pt": "Guerra no Irã faz companhias aéreas recuarem em hedge de combustível e alertarem sobre tarifas", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 232197, "titulo": "KHNP ends talks with consortium o ", "titulo_pt": "Hyundai Motor vai investir US$ 450 milhões para expandir fábrica na Alabama", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 232205, "titulo": "S. Korea to conditionally ease diesel export restrictions amid stable crude supplies", "url": "https://en.yna.co.kr/view/AEN20261029002500320", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T01:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "South Korea planeja relaxar restrições de exportação de diesel de forma condicional devido à estabilidade nas suprimentos de petróleo cru.", "titulo_pt": "Coreia do sul vai condicionar redução de restrições de exportação de diesel diante de suprimentos de petróleo estáveis", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 232212, "titulo": "(URGENT) Seoul stocks open tad higher as Fed freezes rates ahead of Samsung earnings", "url": "https://en.yna.co.kr/view/AEN20261029001700320", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T00:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As bolsas de Seul abriram com pequena alta enquanto a Reserva Federal dos EUA manteve as taxas de juros estáveis antes dos resultados financeiros da Samsung.", "titulo_pt": "Seoul: bolsa abre ligeiramente alta enquanto federal reserve congela taxas de juros antes de divulgação de resultados da Samsung", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 231249, "titulo": "Snapchat vai a julgamento nos EUA por vício de jovens em redes sociais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/10/snapchat-vai-a-julgamento-nos-eua-por-vicio-de-jovens-em-redes-sociais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T23:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Snapchat está se defendendo em um julgamento em Los Angeles, juntamente com o Instagram, da Meta, contra acusações de vício em redes sociais por parte de jovens. O julgamento começou nesta quarta-feira (28).", "titulo_pt": "Snapchat vai a julgamento nos EUA por vício de jovens em redes sociais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 231250, "titulo": "Commodities alimentícias vão subir em 2026 e 2027, diz Banco Mundial", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/vaivem/2026/10/commodities-alimenticias-vao-subir-em-2026-e-2027-diz-banco-mundial.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T23:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os preços das commodities alimentícias devem aumentar 10% em 2026 e 7% em 2027, acumulando um aumento de 18% nos dois anos. Essa elevação é resultado da queda de produção de grãos, dificuldades no escoamento de alimentos devido a conflitos atuais e adversidade climática provocada pelo El Niño.", "titulo_pt": "Commodities alimentícias devem subir 18% nos próximos dois anos, avisa Banco Mundial", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 231251, "titulo": "Petrobras bate recorde de produção de diesel no terceiro trimestre", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/petrobras-bate-recorde-de-producao-de-diesel-no-terceiro-trimestre.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T23:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Petrobras registrou um recorde na produção de diesel no terceiro trimestre, em resposta às importações mais caras devido à guerra no Irã. A empresa também alcançou um novo recorde na exportação de petróleo e derivados.", "titulo_pt": "Petrobras bate recorde de produção de diesel no terceiro trimestre", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 231255, "titulo": "BP faz descoberta de hidrocarbonetos no bloco Tupinambá na bacia de Santos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/bp-faz-descoberta-de-hidrocarbonetos-no-bloco-tupinamba-na-bacia-de-santos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T23:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A BP anunciou uma descoberta de hidrocarbonetos no bloco Tupinambá, na bacia de Santos, Brasil. Esta descoberta foi feita perto da localização onde a empresa fez sua maior descoberta em 25 anos no ano anterior.", "titulo_pt": "BP faz descoberta de hidrocarbonetos no bloco Tupinambá na bacia de Santos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 232121, "titulo": "Fed holds fire as Warsh telegraphs more hikes without saying it", "url": "https://www.japantimes.co.jp/business/2026/10/29/economy/fed-warsh-hikes/", "fonte_id": "japan_times", "data_pub": "2026-10-28T23:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Warsh sinalizou que os aumentos de juros da Fed não terminaram, apesar de avaliar uma economia forte e inflação persistente.", "titulo_pt": "Fed mantém posição enquanto Warsh sugere mais aumentos de juros", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 231934, "titulo": "Safran bets on the UK, where government support for aerospace is 'clearer and more decisive' than in France", "url": "https://www.lemonde.fr/en/economy/article/2026/10/28/safran-bets-on-the-uk-where-government-support-for-aerospace-is-clearer-and-more-decisive-than-in-france_6766366_19.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-28T22:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Safran está apostando no Reino Unido, onde o apoio governamental para o setor aeroespacial é considerado mais claro e decisivo em comparação com a França. O Reino Unido investirá €2,8 bilhões em 10 anos no setor aeroespacial, enquanto a França ainda não garantiu no orçamento de 2027 os €300 milhões anuais prometidos por Emmanuel Macron em 2023.", "titulo_pt": "Safran aposta no reino unido, onde o apoio governamental para o setor aeroespacial é mais claro e decisivo do que na França", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 231540, "titulo": "PF indicia Vorcaro e mais 14 pessoas pelas fraudes no Banco Master e no BRB", "url": "https://www.jota.info/stf/do-supremo/pf-indicia-vorcaro-e-mais-14-pessoas-pelas-fraudes-no-banco-master-e-no-brb", "fonte_id": "jota", "data_pub": "2026-10-28T22:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal indicou Vorcaro e outras 14 pessoas por fraudes no Banco Master e no Banco do Brasil. O Banco Corporação solicitou mais 60 dias para concluir as investigações. O caso está suspenso no Supremo Tribunal Federal (STF).", "titulo_pt": "PF indica Vorcaro e 14 pessoas por fraudes no Banco Master e no BRB", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 231258, "titulo": "Oracle sobe 12% após prever retorno mais rápido de aposta em IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/oracle-sobe-12-apos-prever-retorno-mais-rapido-de-aposta-em-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T22:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As ações da Oracle subiram 12% após a empresa apresentar novas projeções de longo prazo, com fluxo de caixa livre acima do esperado e endividamento moderado, visando reduzir as preocupações do mercado com sua investida em inteligência artificial.", "titulo_pt": "Ações da oracle avançam 12% após previsão de retorno mais rápido em IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 232215, "titulo": "(3rd LD) Fed holds key interest rate steady; Warsh says inflation 'too high'", "url": "https://en.yna.co.kr/view/AEN20261029000353315", "fonte_id": "yonhap_news", "data_pub": "2026-10-28T22:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Federação Reserve dos Estados Unidos manteve a taxa básica de juros estável na sexta-feira. O membro do conselho Warsh afirmou que a inflação ainda é 'demasiadamente alta'.", "titulo_pt": "Fed mantém taxa de juros estável; Warsh diz que inflação está 'demasiadamente alta'", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 231259, "titulo": "Raízen faz acordo de R$ 22,4 bilhões com Receita e Fazenda", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/raizen-faz-acordo-de-r-224-bilhoes-com-receita-e-fazenda.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T21:59:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Raízen fechou um acordo tributário com a PGFN e a Receita Federal no valor de R$ 22,4 bilhões. O anúncio foi feito em um fato relevante divulgado na quarta-feira (28).", "titulo_pt": "Raízen fecha acordo de R$ 22,4 bilhões com Receita e Fazenda", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 231261, "titulo": "Lucro da Motiva cresce quase 10% e chega a R$ 750 mi no 3º tri impulsionado por pedágio", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/infraestrutura/2026/10/lucro-da-motiva-cresce-quase-10-e-chega-a-r-750-mi-no-3o-tri-impulsionado-por-pedagio.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Motiva (ex-CCR) registrou um lucro líquido ajustado de R$ 750 milhões no terceiro trimestre de 2026, um aumento de 9,8% em comparação com o mesmo período do ano anterior. O crescimento foi impulsionado pelo pedágio.", "titulo_pt": "Lucro da Motiva cresce 9,8% e chega a R$ 750 mi no 3º tri, impulsionado por pedágio", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 232195, "titulo": "(2nd LD) Samsung Electronics posts record profit in Q3 on AI chip supercycle", "url": "https://en.yna.co.kr/view/AEN20261029002652320", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T01:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Samsung Electronics anunciou que registrou um lucro recorde no terceiro trimestre devido a uma superciclo de chips de inteligência artificial.", "titulo_pt": "(2º LD) Samsung Electronics registra lucro recorde no terceiro trimestre devido a superciclo de chips de IA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 232196, "titulo": "Gaon Cable wins 120 bln-won cable order in U.S.", "url": "https://en.yna.co.kr/view/AEN20261029004900320", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T01:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa sul-coreana de cabos elétricos Gaon Cable venceu um contrato de cableação no valor de 120 bilhões de wones nos Estados Unidos.", "titulo_pt": "Gaon Cable vence contrato de 120 bilhões de wones nos EUA", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 232116, "titulo": "Kansai emerges as key data center hub as other regions vie for share", "url": "https://www.japantimes.co.jp/news/2026/10/29/japan/japan-data-center-regional-expansion/", "fonte_id": "japan_times", "data_pub": "2026-10-29T01:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Kansai se destaca como um importante hub de centros de dados, ocupando 25% do total de área de centros de dados no Japão. De acordo com o Fuji Chimera Research Institute, os centros de dados da região totalizam cerca de 1,16 milhão de metros quadrados.", "titulo_pt": "Kansai se consolida como hub de centros de dados, ocupando 25% do total no Japão", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 232217, "titulo": "US should spy on Chinese firms to maintain edge in tech race: ex-CIA official", "url": "https://www.scmp.com/economy/china-economy/article/3372475/us-should-spy-chinese-firms-maintain-edge-tech-race-ex-cia-official", "fonte_id": "scmp", "data_pub": "2026-10-29T01:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ex-funcionário da CIA propôs que o governo dos EUA deve espionar empresas estrangeiras para ajudar as empresas americanas a manterem-se à frente na corrida tecnológica. Segundo Cohen, o domínio dos EUA em muitas tecnologias avançadas está sendo contestado ou até mesmo eliminado pela China.", "titulo_pt": "Ex-funcionário da cia sugere que EUA devem espionar empresas estrangeiras para manter vantagem tecnológica", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 232207, "titulo": "(LEAD) Samsung SDI Q3 net profit jumps to 342.2 bln won on ESS deals", "url": "https://en.yna.co.kr/view/AEN20261029001851320", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T00:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Samsung SDI, uma das principais fabricantes de baterias da Coreia do Sul, registrou um lucro líquido de 342,2 bilhões de wones no terceiro trimestre de 2021, principalmente devido a acordos para sistemas de armazenamento de energia.", "titulo_pt": "Lucro trimestral da Samsung SDI aumenta para 342,2 bilhões de wones com acordos de sistemas de armazenamento de energia", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 232220, "titulo": "South Korea’s chipmakers are raking it in. Can China close the gap?", "url": "https://www.scmp.com/week-asia/economics/article/3372439/south-koreas-chipmakers-are-raking-it-can-china-close-gap", "fonte_id": "scmp", "data_pub": "2026-10-29T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SK Hynix, gigante sul-coreano de chips de memória, registrou uma margem operacional de quase 80% de suas vendas no último trimestre, um resultado pouco comum na indústria de manufatura. O lucro operacional da empresa triplicou em comparação com o mesmo período do ano anterior, devido ao boom global da inteligência artificial.", "titulo_pt": "Coreia do sul lucra com fabricantes de chips; China pode fechar a lacuna?", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 232017, "titulo": "As Waymo expands overseas, it remains a niche cash-burning business", "url": "https://www.cnbc.com/2026/10/28/as-waymo-expands-overseas-it-remains-a-niche-cash-burning-business.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-28T23:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Waymo, uma divisão do Alphabet, continua sendo um negócio nicho e gasto em caixa, mesmo ao expandir suas operações para o exterior. O segmento Other Bets, que inclui a Waymo, contribuiu com apenas 0,3% do faturamento total no último trimestre.", "titulo_pt": "Waymo expande internacionalmente, mas permanece como negócio nicho e gasto em caixa", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 232105, "titulo": "Google shares tumble 10% after $51bn AI outlay deepens cash burn", "url": "https://www.ft.com/content/eb386156-5bf9-4edd-80f2-803fdee1e33d?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-28T23:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Google caíram 10% após o anúncio de um gasto de 51 bilhões de dólares em IA, que aprofundou a quebra de caixa. A empresa admitiu que seu 'modo de IA' prejudicou as vendas tradicionais de pesquisa, resultando em receitas e lucros que não atenderam às expectativas.", "titulo_pt": "Ações da google caem 10% após gasto de 51 bilhões em IA aprofundar quebra de caixa", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 232106, "titulo": "Microsoft blames data centre delays for lower capital expenditure", "url": "https://www.ft.com/content/93f53cb4-1fc8-4ca5-aa91-186b77b03d92?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-28T23:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Microsoft atribuiu a atrasos nos centros de dados a redução do gasto em capital. O grupo de software relatou que sua receita total aumentou 19% para US$ 92,3 bilhões no quarto trimestre encerrado em setembro.", "titulo_pt": "Microsoft culpa atrasos nos centros de dados pelo menor gasto em capital", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 232312, "titulo": "The 2,000-Nit OLED in Apple’s New MacBook Is a Big Deal", "url": "https://www.wired.com/story/the-2000-nit-oled-in-apples-new-macbook-pro-is-a-big-deal/", "fonte_id": "wired", "data_pub": "2026-10-28T22:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O novo MacBook Pro de Apple possui um painel OLED com luminosidade de 2000 nits e contrastes muito profundos. Este display é único no mercado atual.", "titulo_pt": "OLED de 2000 nits no novo MacBook pro é uma grande novidade", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 232028, "titulo": "Apple brings touch to the Mac, reversing years-old stance on touchscreen laptop", "url": "https://www.cnbc.com/2026/10/28/apple-mac-touchscreen-launch.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-28T22:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Apple lançou uma nova laptop com tela tátil, sendo a terceira grande lançamento sob a liderança do novo CEO John Ternus. A empresa abandonou sua posição antiga contra a utilização de telas táteis em laptops.", "titulo_pt": "Apple traz toque para o Mac, revertendo posição antiga sobre laptop com tela tátil", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 232313, "titulo": "This Is What the GOP’s Final Midterms Push Looks Like", "url": "https://www.wired.com/story/this-is-what-the-gops-final-midterms-push-looks-like/", "fonte_id": "wired", "data_pub": "2026-10-28T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os republicanos estão investindo seu tempo e recursos nas eleições para o Senado em estados historicamente vermelhos, indicando que estão mais ansiosos do que nunca à medida que se aproxima o dia da eleição.", "titulo_pt": "Este é o que a campanha Final do GOP para as eleições legislativas parece", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 231269, "titulo": "Vivo busca parceiros em IA para atrair e fidelizar clientes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/vivo-busca-parceiros-em-ia-para-atrair-e-fidelizar-clientes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-28T20:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Vivo está explorando a inteligência artificial como uma estratégia para atrair e fidelizar clientes, pretendendo expandir as soluções de IA oferecidas em seus planos.", "titulo_pt": "Vivo procura parcerias em IA para atrair e fidelizar clientes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 232176, "titulo": "Creating AI value with enterprise context", "url": "https://www.technologyreview.com/2026/10/28/1147709/creating-ai-value-with-enterprise-context/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-28T20:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em uma empresa, diversos sistemas de inteligência artificial, como plataformas de clientes, assistentes conversacionais e ferramentas de automação de fluxos de trabalho, podem estar em funcionamento simultaneamente. Cada um desses sistemas é avançado e rápido, mas seus resultados podem ser incorretos ou confusos quando em uso.", "titulo_pt": "Criando valor de AI com contexto empresarial", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 232314, "titulo": "Most Servers on the Planet Are Vulnerable to This Firmware Code-Execution Flaw", "url": "https://www.wired.com/story/most-servers-on-the-planet-are-vulnerable-to-a-code-execution-flaw-in-uefi-firmware/", "fonte_id": "wired", "data_pub": "2026-10-28T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um defeito crítico no firmware UEFI, usado por grandes fabricantes de servidores e data centers, permite que atacantes executem código no início do processo de inicialização do sistema.", "titulo_pt": "A maioria dos servidores na terra está vulnerável a esta falha de execução de código no Firmware", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 232315, "titulo": "Massive Leak Exposes 41,000 Homeland Security Workers—Including Undercover ICE Agents", "url": "https://www.wired.com/story/massive-leak-exposes-41000-homeland-security-workers-including-undercover-ice-agents/", "fonte_id": "wired", "data_pub": "2026-10-28T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A vazão expôs informações de 41.000 funcionários da Agência de Segurança Interna, incluindo agentes ocultos da ICE, além de detalhes sobre a localização de instalações da ICE e CBP, números de telefone celulares e membros de grupos relacionados a programas de interceptação telefônica, software Palantir e chatbot Grok de xAI.", "titulo_pt": "Grande vazamento revela dados de 41.000 funcionários da agência de segurança interna — incluindo agentes ocultos da ICE", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 232213, "titulo": "S. Korea, Turkey unearth Hellenistic-era mosaic remains", "url": "https://en.yna.co.kr/view/AEN20261029001300315", "fonte_id": "yonhap_news", "data_pub": "2026-10-28T23:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um time de escavação sul-coreano-turco descobriu restos de mosaicos da era helênistica. A descoberta foi feita em um local não especificado.", "titulo_pt": "Coreia do sul e Turquia descobrem restos de mosaicos da era helênistica", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 232406, "titulo": "NASA Welcomes Vietnam as Newest Artemis Accords Signatory", "url": "https://www.nasa.gov/organizations/oiir/nasa-welcomes-vietnam-as-newest-artemis-accords-signatory/", "fonte_id": "nasa_news", "data_pub": "2026-10-28T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Vietnã se juntou à 78ª nação a assinar os Acordos Artemis, se associando a um grupo crescente de países comuns interessados na exploração pacífica, transparente e responsável do espaço. Matt Anderson, vice-administrador da NASA, comentou sobre a importância dessa parceria para o desenvolvimento do programa espacial do Vietnã.", "titulo_pt": "NASA bem-vinda o vietnã como novo assinante dos acordos Artemis", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 232364, "titulo": "Virus Shamonda: ¿qué significa el primer caso humano para las Américas?", "url": "https://www.paho.org/es/noticias/28-10-2026-virus-shamonda-que-significa-primer-caso-humano-para-americas", "fonte_id": "paho", "data_pub": "2026-10-28T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Shamonda vírus foi relatado no primeiro caso humano nas Américas em 28 de outubro de 2026. Este evento tem implicações significativas para a região em termos de saúde pública e vigilância epidemiológica.", "titulo_pt": "Vírus Shamonda: qual é o significado do primeiro caso humano para as Américas?", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 232355, "titulo": "STAT+: Lawmaker wants government watchdog to probe TrumpRx over claims about drug savings", "url": "https://www.statnews.com/pharmalot/2026/10/28/lawmaker-wants-gao-probe-trumprx-drug-pricing/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-28T20:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um parlamentar da Câmara solicitou que o Escritório de Controle e Acompanhamento Geral investigasse se a plataforma TrumpRx realmente conseguiu economizar dinheiro para os americanos com medicamentos.", "titulo_pt": "Deputado pede investigação do TrumpRx sobre reivindicações de economia em medicamentos", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 232407, "titulo": "Artemis III SLS Core Stage Joins Boosters at Kennedy", "url": "https://www.nasa.gov/image-article/artemis-iii-sls-core-stage-joins-boosters-at-kennedy/", "fonte_id": "nasa_news", "data_pub": "2026-10-28T18:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A etapa central do SLS para a missão Artemis III foi integrada junto aos dois propelentes sólidos no dia 28 de outubro no Hangar 3 do Building de Montagem de Veículos da NASA em Kennedy Space Center, Flórida. Os técnicos levantaram a etapa de 212 pés usando um guindaste único projetado para o propósito.", "titulo_pt": "Artemis III SLS central Stage junta-se aos propelentes sólidos no Kennedy", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 232411, "titulo": "RFK, Jr., loosens restrictions for six popular peptides, bypassing the FDA", "url": "https://www.scientificamerican.com/article/rfk-jr-loosens-restrictions-for-six-popular-peptides-bypassing-the-fda/", "fonte_id": "scientific_american", "data_pub": "2026-10-28T18:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O novo policy permite que certas farmácias distribuam combinações compósitas de seis peptídeos não comprovados. RFK Jr. relaxou as restrições sobre esses peptídeos, pulando o FDA.", "titulo_pt": "RFK Jr., relaxa restrições para seis peptídeos populares, pulando o FDA", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 231584, "titulo": "Aranhas exibem fase de sono semelhante à dos humanos", "url": "https://www.dw.com/pt-br/aranhas-exibem-fase-de-sono-semelhante-à-dos-humanos/a-79789720?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-10-28T18:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa na Alemanha identificou uma fase de sono semelhante ao REM em aranhas-saltadoras, sugerindo que aracnídeos podem ser um modelo promissor para o estudo da evolução do sono.", "titulo_pt": "Aranhas mostram fase de sono semelhante ao rem", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 232408, "titulo": "NASA University Challenge Ignites Trajectory of Drone Entrepreneur", "url": "https://www.nasa.gov/aeronautics/nasa-challenge-drone-entrepreneur/", "fonte_id": "nasa_news", "data_pub": "2026-10-28T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Gavin Gardner, um estudante de engenharia da Michigan State University, pesquisava tecnologia de drones avançada com um financiamento da NASA há cinco anos. Ele se surpreendeu com as dificuldades financeiras associadas ao projeto, além dos desafios técnicos.", "titulo_pt": "Desafios financeiros em pesquisa de drones de estudante da NASA", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 232356, "titulo": "STAT+: HHS moves to allow compounding of some unapproved peptides", "url": "https://www.statnews.com/2026/10/28/hhs-enforcement-discretion-policy-allows-peptide-compounding/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-28T16:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Saúde e Serviços Humanos (HHS) está considerando permitir a produção em massa de alguns péptidos não aprovados. Kennedy e seu movimento MAHA têm apoiado o uso de péptidos, apesar da falta de evidências significativas para muitos dos compósitos de bem-estar.", "titulo_pt": "HHS considera permitir a produção em massa de alguns péptidos não aprovados", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 232409, "titulo": "NASA Selects 19 New Citizen Science Proposals in 2026", "url": "https://science.nasa.gov/get-involved/citizen-science/nasa-selects-19-new-citizen-science-proposals-in-2026/", "fonte_id": "nasa_news", "data_pub": "2026-10-28T16:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA selecionou 19 novas propostas de ciência cidadã em 2026, com êxito crescente de voluntários na realização de pesquisas espaciais. O projeto Backyard Worlds: Planet 9, por meio de voluntários, descobriu a maioria dos brown dwarfs conhecidos.", "titulo_pt": "NASA seleciona 19 novas propostas de ciência cidadã em 2026", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 232494, "titulo": "2,500-Year-Old Solar Observatory Discovered in Mexico", "url": "https://www.artforum.com/news/2500-year-old-solar-observatory-discovered-mexico-1234762338/", "fonte_id": "artforum", "data_pub": "2026-10-28T16:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores do Instituto Nacional de Antropologia e História (INAH) no México descobriram uma estrutura de 2.500 anos que acredita ser uma antiga observatória solar. A estrutura faz parte do sítio arqueológico pré-hispânico Teteles de Ávila Castillo na Sierra Norte de Puebla, que tem sido escavado por onze anos.", "titulo_pt": "Observatório Solar de 2,5 mil anos descoberto no México", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 232410, "titulo": "Webb Sees Turbulent Star Nursery", "url": "https://www.nasa.gov/image-article/webb-sees-turbulent-star-nursery/", "fonte_id": "nasa_news", "data_pub": "2026-10-28T15:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A imagem do Webb, divulgada em 22 de outubro de 2026, mostra uma região de formação estelar turbulenta com nuvens densas de gás. Este campo de estrelas, chamado N159, está localizado a 161.000 anos-luz na Nuvem Maior de Magalhães, uma das galáxias satélite da Via Láctea e possui uma menor concentração de metais.", "titulo_pt": "Webb registra turbulenta região de formação estelar", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 232357, "titulo": "STAT+: Senate candidate El-Sayed wants to ‘grill’ RFK Jr., calls him the ‘most incompetent HHS secretary ever’", "url": "https://www.statnews.com/2026/10/28/abdul-el-sayed-profile-midterm-policy-issues-health-care/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-28T15:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Abdul El-Sayed, candidato ao Senado, quer questionar RFK Jr. em público e o acusa de ser o secretário de Saúde e Serviços Humanos mais incompetente de todos os tempos. Suas políticas progressistas e posição em relação ao Israel chamaram atenção, mas seu background em saúde pública é visto como crucial por alguns apoiadores.", "titulo_pt": "Candidato ao senado El-Sayed quer questionar RFK Jr. E o acusa de ser o secretário de saúde mais incompetente", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 232358, "titulo": "STAT+: Why every health care AI company must face Epic", "url": "https://www.statnews.com/2026/10/28/health-care-ai-innovation-challenge-epic-ai-prognosis/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-28T14:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma nova investigação examina como o domínio de mercado da Epic afeta a inovação tecnológica e a adoção de IA no setor de saúde.", "titulo_pt": "Por que cada empresa de IA em saúde deve enfrentar a Epic", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 232405, "titulo": "Flexell Space and Satoro Agree to Collaborate on In-Orbit Demonstration of Next-Generation Space Solar Cells", "url": "https://spacenews.com/flexell-space-and-satoro-agree-to-collaborate-on-in-orbit-demonstration-of-next-generation-space-solar-cells/", "fonte_id": "spacenews", "data_pub": "2026-10-28T14:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Flexell Space e Satoro concordaram em colaborar para demonstrar células solares espaciais de próxima geração em órbita. As demonstrações serão realizadas em duas missões previstas para 2027 e 2028 a bordo do Falcon 9 da SpaceX.", "titulo_pt": "Flexell Space e Satoro convencionam colaborar para demonstração de células solares espaciais de próxima geração", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 231282, "titulo": "Ampliação de acordo isenta brasileiros de custo para publicar artigos em revistas da Nature", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/acordo-isenta-pesquisadores-brasileiros-de-custo-para-publicar-artigos-em-revistas-da-nature.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-28T14:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir do dia 1º de setembro de 2026, pesquisadores brasileiros podem publicar artigos científicos em revistas do portfólio da Nature sem custos adicionais. Este acordo ampliado isenta os autores brasileiros dos pagamentos tradicionais associados à publicação em revistas renomadas.", "titulo_pt": "Ampliação de acordo isenta brasileiros de custo para publicar artigos em revistas da Nature", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 232211, "titulo": "Late singer Shin Hae-chul, BLACKPINK among 10 to receive cultural merit", "url": "https://en.yna.co.kr/view/AEN20261029001900315", "fonte_id": "yonhap_news", "data_pub": "2026-10-29T00:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O cantor falecido Shin Hae-chul e a cantora Yoo Jae-suk serão entre outros dez a receber o Mérito Cultural.", "titulo_pt": "Shin Hae-chul, BLACKPINK entre dez a receber mérito cultural", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 231354, "titulo": "Morre Irene Santos, fotógrafa e pesquisadora da memória negra", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-10/morre-irene-santos-fotografa-e-pesquisadora-da-memoria-negra", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-10-28T23:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Irene de Figueiredo Santos, fotógrafa, pesquisadora e historiadora, faleceu aos 78 anos em Porto Alegre, onde desenvolveu sua carreira dedicada à imagem, pesquisa histórica e valorização da cultura afro-brasileira.", "titulo_pt": "Irene Santos, fotógrafa e pesquisadora da memória negra, morre aos 78 anos", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 231309, "titulo": "Adélia Prado, Micheliny Verunschk e Julia Codo são finalistas do Oceanos 2026", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/adelia-prado-micheliny-verunschk-e-julia-codo-sao-finalistas-do-oceanos-2026.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-28T23:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Adélia Prado, Micheliny Verunschk e Julia Codo foram declaradas finalistas do prêmio Oceanos 2026, que reconhece o melhor da poesia e da prosa em língua portuguesa.", "titulo_pt": "Adélia Prado, Micheliny Verunschk e Julia Codo são finalistas do Oceanos 2026", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 231310, "titulo": "Globo convoca artistas para gravar tradicional vinheta de fim de ano", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/globo-convoca-artistas-para-gravar-tradicional-vinheta-de-fim-de-ano.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-28T23:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Globo começou a gravar nesta quarta-feira (28) sua tradicional vinheta de fim de ano. Artistas como Serginho Groisman e Alexandre Borges foram convidados p
