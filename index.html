  </div>
</div>

<div class="modal-overlay" id="modal-relatorio">
  <div class="modal-box" style="max-width:620px">
    <h4>Relatório de Flags</h4>
    <div class="flag-rep-box" id="relatorio-conteudo"></div>
    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "21/10/2026 19:40", "stats": {"noticias_novas": 664, "resumos_gerados": 236}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "No segundo turno das eleições presidenciais, Flávio Bolsonaro obteve 53% dos votos válidos, contra 47% de Lula, segundo um levantamento nacional da CNN Brasil. A campanha de Lula anunciou que aceita abrir o sigilo fiscal de Marcola se Flávio Bolsonaro abrir o seu, em uma tentativa de avançar com as investigações. O presidente Lula também apresentou uma ação no TSE pedindo a cassação da chapa de Flávio por suposto favorecimento da Meta. Em contrapartida, Flávio condicionou a abertura do seu sigilo bancário a informações adicionais sobre Lula, incluindo gastos com cartões corporativos. A maioria do mercado financeiro permanece otimista com uma eventual vitória de Flávio, apesar de algumas promessas de campanha que geraram desconforto. O segundo turno das eleições também foi marcado por uma série de propostas controversas, como a proibição de canais políticos de WhatsApp nas vésperas da eleição, que foi considerada ilegal e inconstitucional pelos especialistas. Além disso, a campanha de Flávio Bolsonaro realizou um ato público em Belo Horizonte, onde o presidente Lula percorreu a região central da cidade, reforçando sua presença na reta final da campanha.", "mundo": "As manifestações em Portugal são motivadas por questões econômicas, políticas e sociais, destacando-se a desigualdade econômica, a crise de imigração e o abuso de poder por parte de políticos. Em outro desenvolvimento, a série 'O Experimento da Prisão de Stanford' foi lançada na Netflix, recriando um dos estudos psicológicos mais controversos da história. O chanceler cubano acusa os Estados Unidos de ameaçar países que votam a favor de Cuba na ONU, em referência ao embargo americano que tem sido aplicado há décadas. Além disso, o presidente francês Emmanuel Macron criticou as declarações de líderes estrangeiros, incluindo o presidente dos Estados Unidos Donald Trump, sobre os protestos na França, acusando-os de fazerem comentários 'estúpidos'. A Rússia libertou um americano preso após quatro anos de prisão, durante uma reunião com um enviado dos Estados Unidos para discutir a guerra na Ucrânia. Na África do Sul, a polícia prendeu pelo menos sete pessoas suspeitas de planejar ações violentas nas eleições parlamentares. Em Taiwan, cinco homens foram acusados de planejar atear um carro contra um comediante por causa de piadas sobre Xi Jinping, refletindo tensões entre a ilha e Pequim. A Rússia também libertou um americano que havia sido preso por combater ao lado das forças ucranianas. O governo sul-coreano se reuniu com o diretor-geral da OMS para discutir cooperação em saúde. Além disso, a Arábia Saudita executou dois cidadãos bangladesesy, levantando questionamentos sobre a diplomacia do Bangladesh. O Partido Comunista da China, com 100 milhões de membros, é considerado o partido político mais bem-sucedido do mundo, com o objetivo de ser o governo mais forte do planeta em 2049. Por fim, a economia chinesa é vista como a mais bem-sucedida do mundo.\n\nO Exército dos Estados Unidos detalhou suas preparações para a primeira cadeia de ilhas, uma estratégia geopolítica que engloba áreas estratégicas no Pacífico Ocidental. Em meio a tensões, o presidente russo, Vladimir Putin, concordou em retomar as negociações de paz com a Ucrânia, mediadas pelos Estados Unidos. Essas ações refletem o cenário geopolítico complexo, com múltiplos interesses e estratégias em diferentes regiões do mundo.", "economia": "A aprovação rápida do orçamento suplementar é recomendada para manter os preços dos combustíveis sob controle, de acordo com informações do Taipei Times. A Meta foi multada em 25 bilhões de dólares no estado de New Mexico em relação ao escândalo Cambridge Analytica, conforme relato do CNBC International. O Ministério da Fazenda anunciou medidas para garantir a imunidade tributária nas importações para projetos de universidades públicas e instituições de ciência, tecnologia e inovação, informou a Agência Brasil de Economia. A Getty Images entrou em recuperação judicial nos Estados Unidos devido à pressão da dívida e do avanço das ferramentas de inteligência artificial, conforme noticiado pelo Jornal da Folha de Mercado. A Fitch Ratings prevê uma política fiscal mais rígida no Brasil em 2027, independentemente do resultado das eleições presidenciais, apontou a Agência Brasil de Economia.", "tecnologia": "A inteligência artificial tem se tornado um tema central na tecnologia global, com várias iniciativas e desafios surgindo recentemente. A descoberta de duas vulnerabilidades críticas no PHP, uma linguagem de programação amplamente utilizada, levou a uma medida de precaução global, com vários sites de governos europeus e empresas sendo desconectados temporariamente para correção. O presidente dos Estados Unidos, Donald Trump, propôs que centrais de dados de inteligência artificial devem pagar 'dividendos' antes das eleições de meio ano, refletindo a crescente importância dessas infraestruturas. Além disso, o uso de IA na pesquisa acadêmica está gerando debates sobre autoria e rigor, enquanto a tecnologia está sendo usada para criar chatbots baseados em amados falecidos, levantando questões éticas. A fusão de Tesla e SpaceX, liderada por Elon Musk, continua a ser um grande desafio, com Musk precisando convencer acionistas e reguladores globais.", "ciencia": "O Japão está na frente da China na corrida para obter amostras de Marte, com uma sonda que viajará até Fobos, uma das luas de Marte, potencialmente fornecendo as primeiras amostras do sistema marciano trazidas à Terra. Em outro avanço, a NASA realizou um voo de passagem sobre o estádio da Universidade da Alabama, destacando suas contribuições para aeronáutica. A NASA também registrou um novo recorde em Marte, com o rover Perseverance atingindo 45,22 km de distância total percorrida, o maior percurso realizado por um veículo em outro mundo até o momento. Na Terra, a GSK obteve aprovação da FDA para um medicamento contra a hepatite B que estendeu curas funcionais para um número significativamente maior de pacientes. Além disso, a Roivant relatou resultados positivos em ensaios clínicos de um medicamento imunológico para a doença ocular uveítis não-infectiosa. Em pesquisa, cientistas conseguiram pela primeira vez realizar medições quânticas em uma partícula de positrão por um mês, o tempo mais longo que uma partícula de positrão foi mantida sob controle até agora.", "cultura": "A Globo planeja explicar o destino de personagens de 'Avenida Brasil' que não retornarão na sequência da novela durante a primeira semana de sua estreia, prevista para janeiro de 2027. Além disso, a Globo está produzindo um documentário sobre Tom Jobim para comemorar seu centenário de nascimento, que será lançado no Globoplay no mesmo mês. Na área cultural, Peter Nagy, artista e galerista que influenciou as artes em Nova York e Nova Deli, faleceu aos 66 anos. Dois restaurantes brasileiros, Nelita e Evvai, foram incluídos na lista dos 50 melhores restaurantes do mundo. O Nelita ocupou a 54ª posição, enquanto o Evvai ficou na 68ª. A cantora e compositora Suzy Mac lançou o EP 'Amor e Atitude' e se apresenta no Dolores Club, na Lapa, no Rio de Janeiro, nesta quinta-feira (22), mesclando elementos de samba, bossa nova, soul e jazz. O documentário 'Lula', dirigido por Oliver Stone, está sendo remontado após sua exibição no Festival de Cannes há dois anos, mas ainda não foi lançado comercialmente nem em plataformas de streaming, incluindo no Brasil. Além disso, a exposição 'Marília Mendonça - Sentimento Louco' no Museu da Imagem e do Som de São Paulo explora a música sertaneja, historicamente negligenciada pelos acadêmicos e críticos, e a localização do museu no bairro nobre do Jardim Europa contrasta com o tema popular da exposição.", "sociedade": "Milhares de pessoas se manifestaram em frente à Praça Rossio, em Lisboa, em protesto contra os altos custos imobiliários, após a polícia ter removido um acampamento. Eles planejaram retornar ao local no dia seguinte para acampar novamente. Em outro ponto, a movimentação estudantil na Sérvia, conhecida como Student List, tem protestado por dois anos seguidos. No próximo domingo, a organização tentará desafiar o partido no poder, que já governa há 12 anos. Em Belo Horizonte, uma escola manteve as aulas após a morte de uma professora, o que gerou revolta entre os alunos. O Sindicato criticou a postura da instituição. Em São Paulo, a Justiça manteve a condenação de quatro réus que foram acusados de integrarem o 'Setor das Reivindicações' da ONG Pacto Social e Carcerário, considerada uma estrutura de fachada do PCC. Além disso, a transformação acelerada, impulsionada por tecnologias como a IA, é questionada no cenário educacional, destacando a necessidade de fortalecer a escola e a cidadania para o futuro.", "meio_ambiente": "Um relatório da ONU destaca que as ações globais para combater o clima estão muito aquém das necessidades atuais, com a Terra ainda aquecendo 2,2 graus Fahrenheit acima das temperaturas atuais. Os Estados Unidos são apontados como o principal responsável por esse cenário. No Brasil, as chuvas retornaram ao Sul do país devido a uma área de baixa pressão, enquanto no Centro-Oeste as temperaturas elevadas chegaram a 41°C. Em Busan, na Coreia do Sul, autoridades realizaram o terceiro esforço para guiar um tubarão de fora de um canal, atraindo mais de um milhão de visitantes. Em outubro, Tóquio e Osaka, no Japão, registraram temperaturas acima de 30 graus Celsius, o que é mais tardio do que o normal para essa época do ano. Em Espanha, forças de resgate realizaram mais de 400 salvamentos na região de Valencia após intensas chuvas que deixaram pelo menos quatro mortos. Em Chiba, no Japão, 10 pessoas morreram e 37 ficaram feridas devido ao Tufão Dujuan. Em Palangkaraya, na ilha de Borneo, fogo florestal tem coberto a cidade com fuligem tóxica por semanas, causando sintomas respiratórios persistentes e interrompendo o sistema educacional. A UNEP afirma que a oportunidade de manter o aumento da temperatura global abaixo de 1,5°C sem um 'overshoot' foi perdida devido a décadas de ação climática insuficiente. Além disso, a UNEP destaca que um rompimento temporário da linha de 1,5°C de aquecimento global é agora 'inevitável'.", "direitos_humanos": "A aprovação de medidas para relaxar a proibição quase total de abortos no Parlamento polonês, apesar de ser considerada um passo pequeno pelos ativistas, chama a atenção para debates sobre direitos humanos. Em contraste, um estudo de vacina contra hepatite B em recém-nascidos africanos, apoiado pelos EUA, foi interrompido devido à falta de aprovação governamental. No Brasil, a Justiça brasileira justificou o disparo de uma ação policial que resultou no atiramento de um bebê, enquanto famílias relatam a iminente deportação de detentos gravemente doentes para países desconhecidos na África. Em Paris, policiais são acusados de brutalizar menores, refletindo uma crescente desconfiança entre autoridades e manifestantes. Além disso, a administração Trump e tribunais conservadores estão dificultando a possibilidade de desafiar violações de direitos civis nos Estados Unidos, enquanto um testemunho confirma uma reunião entre uma senadora chilena e um postulante a partido conservador, revelando uma série de eventos que abrangem diferentes aspectos dos direitos humanos em diversos países."}, "resumo_do_dia": {"politica_nacional": [{"id": 217011, "titulo": "Lula vai ao TSE pedir cassação da chapa de Flávio por ações da Meta", "url": "https://www.metropoles.com/brasil/lula-vai-ao-tse-pedir-cassacao-da-chapa-de-flavio-por-acoes-da-meta", "fonte_id": "metropoles", "data_pub": "2026-10-21T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O coordenador da campanha de Lula afirmou que uma ação será protocolada nas próximas horas no TSE pedindo a cassação da chapa de Flávio por suposto favorecimento recebido pela Meta.", "titulo_pt": "Lula pede cassação da chapa de Flávio por suposto favorecimento da Meta", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 216913, "titulo": "Flávio Bolsonaro promete Pix para devolver parte dos gastos de consumidores, mas não detalha custo", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/flavio-bolsonaro-promete-pix-para-devolver-parte-dos-gastos-de-consumidores-mas-nao-detalha-custo.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T21:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro, candidato à Presidência pelo PL, prometeu criar um Pix para devolver aos consumidores parte dos gastos, mas não detalhou os custos ou as regras da medida.", "titulo_pt": "Flávio Bolsonaro promete Pix para devolver gastos aos consumidores, sem detalhes sobre custos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 216944, "titulo": "MP-SP aponta transfobia de Eduarda Campopiano contra Erika Hilton e pede indenização de R$ 100 mil", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/mp-sp-aponta-transfobia-de-eduarda-campopiano-contra-erika-hilton-e-pede-indenizacao-de-r-100-mil.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-21T21:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério Público de São Paulo ajuizou uma ação civil pública contra a deputada estadual eleita Eduarda Campopiano, devido a uma publicação em que ela acusa Erika Hilton de transfobia. A ação pede uma indenização de R$ 100 mil.", "titulo_pt": "MP-SP ajuiza ação civil pública contra Eduarda Campopiano por suposta transfobia contra Erika Hilton e pede indenização de R$ 100 mil", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 217205, "titulo": "Flávio Bolsonaro condiciona abertura de sigilo a mais dados do presidente Lula", "url": "https://www.jota.info/eleicoes/eleicoes-2026/flavio-bolsonaro-condiciona-abertura-de-sigilo-a-mais-dados-do-presidente-lula", "fonte_id": "jota", "data_pub": "2026-10-21T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Flávio Bolsonaro condiciona a abertura do sigilo bancário do presidente Lula à apresentação de mais dados, incluindo gastos com cartões corporativos e empresas associadas a Lula.", "titulo_pt": "Flávio Bolsonaro condiciona abertura de sigilo a mais dados de Lula", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 217017, "titulo": "Em BH, Lula faz ato na reta final e puxa coro de \"eu acredito\"", "url": "https://www.metropoles.com/minas-gerais/em-bh-lula-faz-ato-na-reta-final-e-puxa-coro-de-eu-acredito", "fonte_id": "metropoles", "data_pub": "2026-10-21T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Lula realizou um ato público em Belo Horizonte, concentrando-se na Praça da Estação e percorrendo até a Praça Raul Soares, em uma caminhada de cerca de uma hora pela região central da cidade.", "titulo_pt": "Em BH, Lula faz ato e puxa coro de 'eu acredito'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 216945, "titulo": "Proibir canais políticos de WhatsApp perto das eleições seria inconstitucional, dizem especialistas", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/proibir-canais-politicos-de-whatsapp-perto-das-eleicoes-seria-inconstitucional-dizem-especialistas.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-21T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Especialistas consultados pela Folha afirmam que uma proposta do presidente do TSE, Kassio Nunes Marques, e do ministro André Mendonça para bloquear canais de WhatsApp com mais de 200 mil usuários nas 48 horas anteriores à eleição seria ilegal e inconstitucional.", "titulo_pt": "Proibir canais políticos de WhatsApp perto das eleições seria inconstitucional, dizem especialistas", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 216915, "titulo": "Mercado segue apostando em Flávio mesmo com incômodo por promessas de campanha", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/mercado-segue-apostando-em-flavio-mesmo-com-incomodo-por-promessas-de-campanha.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A maioria do mercado financeiro mantém a preferência por Flávio Bolsonaro como candidato vencedor, apesar de algumas promessas de campanha que causaram desconforto. Gestores de patrimônio acreditam que uma vitória de Flávio seria melhor do que a reeleição de Lula.", "titulo_pt": "Mercado continua apostando em Flávio mesmo com promessas incômodas", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 216916, "titulo": "Flávio promete a volta de programa que abriu brechas para lavagem de dinheiro pelo PCC", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/adriana-fernandes/2026/10/flavio-promete-a-volta-de-programa-que-abriu-brechas-para-lavagem-de-dinheiro-pelo-pcc.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O programa Perse é considerado o maior de lavagem de dinheiro e sonegação no país, segundo investigadores que vêm apurando irregularidades nas regras do benefício tributário desde pelo menos 2023. Flávio fez uma promessa relacionada ao programa, embora o texto não especifique detalhes sobre o que foi prometido.", "titulo_pt": "Flávio promete reabrir programa ligado a lavagem de dinheiro pelo PCC", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 216975, "titulo": "Perdão de dívidas e novo teto do MEI: entenda o que muda", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/perdao-de-dividas-e-novo-teto-do-mei-entenda-o-que-muda", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-21T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Lei Complementar 238/2026, sancionada pelo presidente Luiz Inácio Lula da Silva, estabelece novas regras para os microempreendedores individuais (MEI), incluindo o perdão de dívidas tributárias, aumento gradual do limite de faturamento anual e ampliação da possibilidade de contratação de funcionários. O pacote, batizado de Prospera MEI, também facilita a participação de pequenos negócios em compras públicas, com mudanças que começam a valer em 2027.", "titulo_pt": "Pergão de dívidas e novo teto do MEI: entenda o que muda", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 216954, "titulo": "TSE: informação de que 4 mil seções mudaram de lugar estava incorreta", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/tse-informacao-de-que-4-mil-secoes-mudaram-de-lugar-estava-incorreta", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-21T21:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A informação de que 4.352 seções eleitorais mudaram de local entre o primeiro e segundo turno da eleição deste ano foi equivocada. O erro foi causado por uma leitura incorreta dos dados, que foram comparados com os da eleição de 2024 em vez do ano eleitoral atual.", "titulo_pt": "Informação de que 4 mil seções mudaram de lugar estava incorreta", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 216946, "titulo": "Campanha de Lula diz que aceita abrir sigilo de Marcola caso Flávio Bolsonaro abra o seu", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/campanha-de-lula-diz-nao-se-opor-a-condicoes-de-flavio-sobre-sigilo-inclusive-abrir-o-de-marcola.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-21T21:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O porta-voz da campanha de Lula, Camilo Santana, afirmou que a campanha não se oporá a nenhuma das condições propostas por Flávio Bolsonaro para abrir os sigilos bancários e telefônicos, incluindo os dados de Marcola. A declaração foi feita nesta quarta-feira (21).", "titulo_pt": "Campanha de Lula aceita abrir sigilo de Marcola se Flávio Bolsonaro der acesso aos seus", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 217206, "titulo": "Proposta de Mendonça não vai adiante no TSE e canais do WhatsApp funcionarão no 2º turno", "url": "https://www.jota.info/eleicoes/eleicoes-2026/proposta-de-mendonca-nao-vai-adiante-no-tse-e-canais-do-whatsapp-funcionarao-no-2o-turno", "fonte_id": "jota", "data_pub": "2026-10-21T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proposta de Mendonça para o TSE não avançou e os canais do WhatsApp continuarão funcionando durante o segundo turno das eleições. A regra proposta afetaria principalmente o canal 'Exército de Lula', comandado pelo deputado André Janones.", "titulo_pt": "Proposta de Mendonça não avançou no TSE e canais do WhatsApp funcionarão no 2º turno", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 216917, "titulo": "Bet de amigo de Flávio faturou R$ 210 mil em 18 meses, em resultado abaixo do esperado, mostra documento", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/bet-de-amigo-de-flavio-faturou-r-210-mil-em-18-meses-em-resultado-abaixo-do-esperado-mostra-documento.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O site de apostas BestBet, amigo de Flávio Bolsonaro, faturou R$ 210 mil em 18 meses. Durante o mesmo período, a Betano, maior empresa do setor, obteve receita de R$ 8 bilhões.", "titulo_pt": "Amigo de Flávio faturou R$ 210 mil em 18 meses, resultado abaixo do esperado, mostra documento", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 217075, "titulo": "Gerp: Flávio tem 53% dos votos válidos no 2º turno; Lula, 47%", "url": "https://www.cnnbrasil.com.br/eleicoes/gerp-flavio-tem-53-dos-votos-validos-no-2o-turno-lula-47-2/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-21T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio recebeu 53% dos votos válidos no segundo turno da eleição, enquanto Lula obteve 47%. O levantamento nacional ouviu 2.400 eleitores entre os dias 19 e 21 de outubro, com uma margem de erro de dois pontos percentuais.", "titulo_pt": "Flávio tem 53% dos votos válidos no 2º turno; Lula, 47%", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 216955, "titulo": "Flávio Bolsonaro impõe condições para liberar sigilos", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/flavio-bolsonaro-impoe-condicoes-para-liberar-sigilos", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-21T20:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Flávio Bolsonaro, candidato à Presidência pelo PL, informou ao TSE que autoriza o levantamento de seus sigilos bancário, fiscal e telefônico dos últimos 20 anos, mas somente se Lula ampliar o alcance do levantamento de seus sigilos. Bolsonaro também solicitou informações sobre registros de entrada de uma empresária no Palácio do Planalto e sobre ex-chefe de gabinete do presidente.", "titulo_pt": "Flávio Bolsonaro impõe condições para liberação de sigilos", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 216947, "titulo": "Quaest: Celina Leão tem 50%, e Leandro Grass, 35% em disputa para Governo do DF", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/quaest-celina-leao-tem-50-e-leandro-grass-35-em-disputa-para-governo-do-df.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-21T20:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A governadora Celina Leão (PP) lidera com 50% das intenções de voto no segundo turno da disputa pelo Governo do Distrito Federal, contra 35% de Leandro Grass (PT), de acordo com uma pesquisa Quaest divulgada em 21 de outubro de 2026.", "titulo_pt": "Celina Leão tem 50%, e Leandro Grass, 35% em disputa pelo Governo do DF", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 216646, "titulo": "US Army details First Island Chain preparations", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/22/2003866404", "fonte_id": "taipei_times", "data_pub": "2026-10-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Exército dos Estados Unidos detalhou as preparações para a primeira cadeia de ilhas, uma estratégia geopolítica que envolve áreas estratégicas no Pacífico Oriental. As informações não especificam detalhes operacionais, mas indicam que o plano envolve várias forças militares americanas.", "titulo_pt": "Exército dos EUA detalha preparações para a primeira cadeia de ilhas", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 217010, "titulo": "Assessor de Putin cita preparativos para cúpula com Trump e Xi na China", "url": "https://www.metropoles.com/mundo/assessor-putin-preparativos-cupula-trump-xi-china", "fonte_id": "metropoles", "data_pub": "2026-10-21T21:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Yuri Ushakov, assessor presidencial de Putin, mencionou os preparativos para uma cúpula entre Putin, Trump e Xi durante a cúpula da Apec. Moscou, Washington e Pequim não rejeitaram a ideia de um encontro durante o evento.", "titulo_pt": "Assessor de Putin cita preparativos para cúpula com Trump e Xi na China", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 217402, "titulo": "Seven killed in Israeli attacks on Gaza in past 24 hours", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/seven-killed-israeli-attacks-gaza-past-24-hours", "fonte_id": "middle_east_eye", "data_pub": "2026-10-21T21:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em ataques israelenses em Gaza nos últimos 24 horas, sete palestinos foram mortos e 24 ficaram feridos, de acordo com o ministério da saúde. Desde outubro de 2025, 1.534 palestinos foram mortos e 5.486 ficaram feridos em ataques israelenses, recuperando-se 841 corpos dos escombros.", "titulo_pt": "Sete mortos em ataques israelenses em Gaza nos últimos 24 horas", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 217403, "titulo": "Qatar, France issue joint statement calling for the implementation of Gaza ceasefire", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/qatar-france-issue-joint-statement-calling-implementation-gaza-ceasefire", "fonte_id": "middle_east_eye", "data_pub": "2026-10-21T21:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Qatar e a França emitiram um comunicado conjunto solicitando a implementação do cessar-fogo em Gaza. Durante a visita do presidente francês Emmanuel Macron ao Catar, os líderes discutiram a situação na região, enfatizando a necessidade de manter acordos, incluindo o cessar-fogo, a retirada das forças israelenses e a facilitação do livre trânsito em Gaza.", "titulo_pt": "Qatar e França emitem comunicado conjunto sobre cessar-fogo em Gaza", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 217299, "titulo": "Vivek Ramaswamy’s Appalling Campaign Ad", "url": "https://www.theatlantic.com/newsletters/2026/10/vivek-ramaswamy-ohio-amy-acton-child-abuse/689108/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-21T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O candidato republicano ao governo da Ohio foi condenado pela direita e pela esquerda após descartar com facilidade a acusação de que seu oponente foi estuprada quando era criança.", "titulo_pt": "Anúncio eleitoral assombroso de vivek Ramaswamy", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 217347, "titulo": "Meta fined $25bn for 'lies' over user data privacy", "url": "https://www.bbc.co.uk/news/articles/cqdr8zxrr3dxo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-21T21:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta foi multada em 25 bilhões de dólares por supostas 'mentiras' relacionadas à privacidade dos dados dos usuários. Esta é a maior multa já aplicada à empresa, superando o valor de 18 bilhões de dólares em um acordo anterior com a Califórnia.", "titulo_pt": "Meta multada em 25 bi por 'mentiras' sobre privacidade de dados", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 217364, "titulo": "Trump denies ordering Starlink slowdown in Ukraine, says he doesn't know who did", "url": "https://www.cnbc.com/2026/10/21/trump-starlink-ukraine-elon-musk.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-21T21:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Donald Trump negou ter ordenado a diminuição da velocidade do Starlink na Ucrânia e afirmou não saber quem foi o responsável.", "titulo_pt": "Trump nega ter ordenado diminuição de velocidade do Starlink na Ucrânia", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 217486, "titulo": "N.K. leader's sister warns of 'new counter means' at border with S. Korea", "url": "https://en.yna.co.kr/view/AEN20261022001100320", "fonte_id": "yonhap_news", "data_pub": "2026-10-21T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kim Yo-jong, irmã poderosa do líder norte-coreano, advertiu sobre novos meios de contrapartida na fronteira com a Coreia do Sul.", "titulo_pt": "Irmã do líder norte-coreano ameaça novos meios de contrapartida na fronteira com a Coreia do sul", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 217350, "titulo": "Pope Leo XIV needs no further lung cancer treatment, Vatican says", "url": "https://www.france24.com/en/europe/20261021-pope-leo-doctors-treatment-lung-cancer", "fonte_id": "france24", "data_pub": "2026-10-21T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Papa Leão XIV, com 71 anos, não precisará de tratamento adicional para o câncer no pulmão, após os exames confirmarem que a doença estava localizada. Ele passou por uma cirurgia recente para remover parte do seu pulmão direito após ter sido diagnosticado com adenocarcinoma.", "titulo_pt": "Papa leão XIV não precisará de tratamento adicional para câncer no pulmão", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 217366, "titulo": "Yemen: Tanks fire as fighting erupts on the outskirts of Taiz", "url": "https://www.euronews.com/video/2026/10/21/yemen-tanks-fire-as-fighting-erupts-on-the-outskirts-of-taiz", "fonte_id": "euronews", "data_pub": "2026-10-21T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Combates recomeçaram nas áreas adjacentes à cidade de Taiz, com tanques e tiros de armas de fogo sendo registrados. Internamente, a cidade enfrenta problemas de infraestrutura, com lixo acumulado e ruas obstruídas, o que preocupa quanto à saúde pública.", "titulo_pt": "Iêmen: tanques disparam em meio a confrontos nas proximidades de Taiz", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 217435, "titulo": "Pakistan and the US factor as China looks to sell its J-35 stealth jets", "url": "https://www.scmp.com/opinion/asia-opinion/article/3371561/pakistan-and-us-factor-china-looks-sell-its-j-35-stealth-jets", "fonte_id": "scmp", "data_pub": "2026-10-21T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Departamento de Defesa dos Estados Unidos divulgou os detalhes de um contrato de US$686 milhões para modernizar os caças F-16 da Pakistan Air Force. Simultaneamente, a China espera vender seus caças J-35, um avanço tecnológico significativo, ao Exército Aéreo do Paquistão.", "titulo_pt": "Paquistão e estados unidos em cena enquanto China procura vender seus caças J-35", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 217351, "titulo": "In run-up to mass protests and riots, pro-Russian accounts amplified French anger, NGO finds", "url": "https://www.france24.com/en/tv-shows/a-propos/20261021-in-run-up-to-mass-protests-and-riots-pro-russian-accounts-amplified-french-anger-ngo-finds", "fonte_id": "france24", "data_pub": "2026-10-21T21:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma análise realizada pela organização não-governamental Alliance4Europe sugere que redes pró-russas manipularam informações online com o objetivo de intensificar a ira na França antes das massivas manifestações do último fim de semana e dos eventos subsequentes de desordem. A análise abrangeu mais de half a million posts em diversas plataformas de mídia social e mostrou que a campanha pode ter começado no início de setembro.", "titulo_pt": "Antes das grandes manifestações e revoltas, redes pró-russas amplificaram a ira francesa, diz ong", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 217352, "titulo": "Meta fined $25 billion in New Mexico over Cambridge Analytica scandal", "url": "https://www.france24.com/en/technology/20261021-meta-fined-25-billion-new-mexico-cambridge-analytica-scandal", "fonte_id": "france24", "data_pub": "2026-10-21T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz do Novo México determinou que a Meta deve pagar 25 bilhões de dólares após um júri concluir que a empresa enganou os usuários, em uma ação relacionada ao escândalo Cambridge Analytica. Este julgamento segue um acordo de 18 bilhões de dólares com 48 estados americanos por acusações semelhantes.", "titulo_pt": "Meta multada em 25 bilhões de dólares no novo México por escândalo Cambridge Analytica", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 216934, "titulo": "Milhares de estudantes da Grécia se unem aos protestos na Europa por investimentos na educação", "url": "https://redir.folha.com.br/redir/online/mundo/rss091/*https://www1.folha.uol.com.br/mundo/2026/10/milhares-de-estudantes-da-grecia-se-unem-aos-protestos-na-europa-por-investimentos-na-educacao.shtml", "fonte_id": "folha_mundo", "data_pub": "2026-10-21T21:19:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milhares de estudantes e professores protestaram na Grécia exigindo investimentos maiores na educação e melhorias nas instalações escolares. O protesto se alinha com manifestações em outros países europeus.", "titulo_pt": "Milhares de estudantes e professores da Grécia se unem aos protestos na Europa por investimentos na educação", "veiculo": "Folha de S.Paulo - Mundo", "pais": "Brasil", "classe": "A"}, {"id": 217487, "titulo": "(URGENT) N.K. leader's sister says loudspeakers against S. Korea \"will be on standby\" in \"matter of days\"", "url": "https://en.yna.co.kr/view/AEN20261022001000320", "fonte_id": "yonhap_news", "data_pub": "2026-10-21T21:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A irmã do líder da Coreia do Norte informou que os alto-falantes contra a Coreia do Sul estarão prontos para uso em questão de dias. Este anúncio foi feito após tensões recentes entre os dois países.", "titulo_pt": "Irmã do líder norte-coreano diz que alto-falantes contra sul-coreanos estarão prontos em dias", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 217253, "titulo": "El Pentágono autoriza a la Seguridad Nacional probar un arma no letal para su posible uso en la frontera", "url": "https://elpais.com/us/2026-10-21/el-pentagono-autoriza-a-la-seguridad-nacional-probar-un-arma-no-letal-para-su-posible-uso-en-la-frontera.html", "fonte_id": "elpais_america", "data_pub": "2026-10-21T21:14:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Pentágono autorizou a Segurança Nacional a testar uma arma não letal chamada 'rayo de calor', projetada originalmente para o controle de multidões, que utiliza ondas electromagnéticas para causar uma sensação intensa de queimadura.", "titulo_pt": "Pentágono autoriza segurança Nacional a testar arma não letal para uso na fronteira", "veiculo": "El País América", "pais": "Espanha", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 216668, "titulo": "Swift passage of supplementary budget urged to keep energy prices in check", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/22/2003866389", "fonte_id": "taipei_times", "data_pub": "2026-10-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A aprovação rápida do orçamento suplementar é recomendada para manter os preços dos energia sob controle.", "titulo_pt": "Aprovação rápida do orçamento suplementar recomendada para controlar preços de energia", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 216914, "titulo": "INSS devolve R$ 3,6 bilhões a segurados que contestaram fraude, e 1,6 milhão esperam valores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/inss-devolve-r-36-bilhoes-a-segurados-que-contestaram-fraude-e-16-milhao-esperam-valores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O INSS devolveu R$ 3,6 bilhões a 5,1 milhões de aposentados e pensionistas que contestaram descontos indevidos. A devolução ocorreu após a Operação Sem Desconto, que foi desencadeada em 2025 pela CGU e Polícia Federal.", "titulo_pt": "INSS devolve R$ 3,6 bilhões a segurados que contestaram descontos indevidos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 217022, "titulo": "Previsão inicial de renegociação no Desenrola 3.0 é de R$ 90 bilhões", "url": "https://www.metropoles.com/brasil/previsao-inicial-de-renegociacao-no-desenrola-3-0-e-de-r-90-bilhoes", "fonte_id": "metropoles", "data_pub": "2026-10-21T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As previsões iniciais indicam que a renegociação do programa Desenrola 3.0 terá um custo máximo de R$ 9 bilhões. Isso representa um deságio de 90% em relação ao valor original.", "titulo_pt": "Previsão inicial de renegociação no Desenrola 3.0 é de R$ 9 bilhões", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 217149, "titulo": "Às vésperas de eleição para o Congresso, como está a economia dos EUA sob comando de Trump?", "url": "https://www.bbc.com/portuguese/articles/cv62y53g12dzo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-21T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Antes das eleições de meio de mandato, Trump se gabou do desempenho econômico dos Estados Unidos. A BBC analisa a inflação, o emprego e o crescimento econômico do país.", "titulo_pt": "Como está a economia dos EUA sob comando de Trump, às vésperas das eleições para o Congresso?", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 216918, "titulo": "IPCA+ é realmente a melhor proteção contra a inflação?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/10/ipca-e-realmente-a-melhor-protecao-contra-a-inflacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "É possível perder dinheiro investindo em títulos que pagam IPCA+6,5% ao ano durante períodos de alta inflação. Investimentos prefixados ou atrelados ao CDI podem oferecer melhor proteção contra a inflação e ainda render mais.", "titulo_pt": "Ipcá+ não é necessariamente a melhor proteção contra a inflação?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 217223, "titulo": "CMPC acuerda la venta de miles de hectáreas de bosque a J.P. Morgan Natural Capital por US$ 365 millones", "url": "https://www.latercera.com/pulso/noticia/cmpc-acuerda-la-venta-de-miles-de-hectareas-de-bosque-a-jp-morgan-natural-capital-por-us-365-millones/", "fonte_id": "la_tercera", "data_pub": "2026-10-21T20:54:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A CMPC acordou vender milhares de hectares de floresta para J.P. Morgan Natural Capital por 365 milhões de dólares. A transação faz parte da estratégia de gestão de ativos da empresa anunciada no fim do ano passado e corresponde a 5% da área total de terras florestais da CMPC.", "titulo_pt": "CMPC concorda com venda de milhares de hectares de floresta a J.P. Morgan Natural Capital por 365 milhões de dólares", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 217429, "titulo": "Tesla’s profits slip on weaker vehicle sales", "url": "https://www.ft.com/content/16bdf332-2a75-4e57-81ea-a37caf50ec0f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-21T20:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As receitas da Tesla permaneceram estáveis, mas os lucros da empresa diminuíram devido a uma redução nas vendas de veículos. A empresa está avaliando a possibilidade de uma fusão com a SpaceX.", "titulo_pt": "Lucros da tesla caem devido a vendas mais fracas de veículos e consideração de fusão com spacex", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 216920, "titulo": "Lucro da Tesla cai com enfraquecimento das vendas de veículos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/lucro-da-tesla-cai-com-enfraquecimento-das-vendas-de-veiculos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T20:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O lucro trimestral da Tesla diminuiu devido ao decréscimo nas vendas de veículos e sistemas de armazenamento de energia. Esta informação foi divulgada um dia após Elon Musk sugerir que a fusão da montadora com a SpaceX poderia ser uma boa ideia.", "titulo_pt": "Lucro da Tesla cai com redução nas vendas de veículos e sistemas de armazenamento de energia", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 217207, "titulo": "Antes de sanção, MDIC avisou que Redata teria efeitos limitados", "url": "https://www.jota.info/executivo/antes-de-sancao-mdic-avisou-que-redata-teria-efeitos-limitados", "fonte_id": "jota", "data_pub": "2026-10-21T20:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério do Desenvolvimento, Indústria e Comércio Exterior (MDIC) alertou que a reforma tributária poderia limitar os benefícios do Redata. A pasta destacou a restrição dos benefícios tributários para o programa.", "titulo_pt": "Antes da sanção, MDIC alertou sobre efeitos limitados do Redata", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 217214, "titulo": "Precio de las bencinas vuelve a registrar fuerte alza y el diésel sube $91,5 por litro", "url": "https://www.latercera.com/pulso/noticia/bencinas-vuelven-a-anotar-fuerte-alza-y-completan-5-aumentos-consecutivos/", "fonte_id": "la_tercera", "data_pub": "2026-10-21T20:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O preço das gasolinas registrou uma forte elevação de $41,3 por litro, enquanto o diésel aumentou em $91,5 por litro. Este é o quinto aumento consecutivo para as gasolinas.", "titulo_pt": "Preço das gasolinas registra forte alta e o diésel sube 91,5 centavos por litro", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 216922, "titulo": "EA corta 400 empregos e fecha estúdio BioWare, de 'Dragon Age' e 'Mass Effect'", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/10/ea-corta-400-empregos-e-fecha-estudio-bioware-de-dragon-age-e-mass-effect.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T20:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Electronic Arts anunciou a demissão de 400 funcionários e a encerramento do estúdio BioWare, responsável por jogos como 'Dragon Age' e 'Mass Effect'.", "titulo_pt": "EA corta 400 postos de trabalho e fecha estúdio BioWare", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 216923, "titulo": "Pirataria digital no agro leva empresas à Justiça", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/10/pirataria-digital-no-agro-leva-empresas-a-justica.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T19:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O aumento de casos de pirataria digital em máquinas agrícolas tem resultado em um aumento de processos judiciais. Uma empresa especializada em propriedade intelectual registrou um crescimento de 50% no número de ações judiciais relacionadas a esse tipo de crime nos últimos nove meses.", "titulo_pt": "Pirataria digital em máquinas agrícolas leva a uma onda de processos judiciais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 217150, "titulo": "Bolsa pode receber R$ 225 bi em cenário-base de queda de juro", "url": "https://braziljournal.com/bolsa-pode-receber-r-225-bi-em-cenario-base-de-queda-de-juro", "fonte_id": "brazil_journal", "data_pub": "2026-10-21T19:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O BTG Pactual identificou quais ações estrangeiros devem comprar se ocorrer uma redução dos juros no Brasil após a eleição de domingo. A análise considerou os meses em que estrangeiros foram compradores líquidos de pelo menos R$ 5 bilhões na Bolsa brasileira.", "titulo_pt": "Bolsa pode receber R$ 225 bi em cenário-base de queda de juros", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 216925, "titulo": "Meta pagará US$ 25 bilhões ao Novo México por enganar usuários sobre privacidade de dados", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/10/meta-pagara-us-25-bilhoes-ao-novo-mexico-por-enganar-usuarios-sobre-privacidade-de-dados.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T19:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um júri determinou que a Meta Platforms deve pagar US$ 25 bilhões ao Novo México após a empresa ter enganado consumidores ao permitir que uma consultoria política acessasse dados de milhões de usuários do Facebook sem consentimento.", "titulo_pt": "Meta pagará US$ 25 bilhões ao Novo México por enganar usuários sobre privacidade de dados", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 216927, "titulo": "China amplia produção de baterias no exterior diante de barreiras comerciais", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/10/china-amplia-producao-de-baterias-no-exterior-diante-de-barreiras-comerciais.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T19:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas chinesas estão expandindo a produção de baterias em outros países, enquanto países ocidentais implementam medidas de proteção contra a entrada de materiais e componentes chineses. Isso ocorre em meio a barreiras comerciais impostas por nações ocidentais.", "titulo_pt": "China amplia produção de baterias no exterior diante de barreiras comerciais", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 216928, "titulo": "Fim da 6x1 eleva produtividade, e regime por hora pode ser complemento, diz CEO de rede de supermercados", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/c-level-entrevista/2026/10/fim-da-6x1-eleva-produtividade-e-regime-por-hora-pode-ser-complemento-diz-ceo-de-rede-de-supermercados.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T18:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O CEO da Savegnago, Chalim Savegnago, afirmou que a adoção do regime 5x2 aumentou a produtividade dos funcionários e não afetou a lucratividade da empresa.", "titulo_pt": "Fim da 6x1 eleva produtividade e não afeta lucratividade, diz CEO de rede de supermercados", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 217478, "titulo": "Airbnb Hosts Are Furious They Can No Longer Make Guests Do Their Chores", "url": "https://www.wired.com/story/airbnb-hosts-are-furious-they-can-no-longer-make-guests-do-their-chores/", "fonte_id": "wired", "data_pub": "2026-10-21T21:57:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Alguns anfitriões de Airbnb ameaçam parar de trabalhar devido às novas restrições, enquanto outros buscam formas de contorná-las. Os hóspedes, por outro lado, estão comemorando essas mudanças.", "titulo_pt": "Anfitriões Do airbnb ficam furiosos com novas regras sobre tarefas dos hóspedes", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 216978, "titulo": "A multa bilionária da Meta após tribunal considerar que empresa ‘enganou’ usuários", "url": "https://veja.abril.com.br/tecnologia/a-multa-bilionaria-da-meta-apos-tribunal-considerar-que-empresa-enganou-usuarios/", "fonte_id": "veja", "data_pub": "2026-10-21T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Meta foi multada em bilhões de dólares após um tribunal considerar que a empresa enganou seus usuários. A multa está relacionada ao caso de 2016 envolvendo a Cambridge Analytica.", "titulo_pt": "Multação bilionária da Meta após tribunal considerar que empresa enganou usuários", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 217427, "titulo": "Meta agrees deal to keep Zuckerberg in California despite wealth tax proposal", "url": "https://www.ft.com/content/b34502b6-38dc-4a46-a8e7-d9131726cd31?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-21T21:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta concordou com um acordo que permitirá que Zuckerberg continue a vender ações sem diluir seu controle na empresa, mesmo em face de uma proposta de imposto sobre riqueza. Isso foi feito criando uma nova classe de ações sem direito a voto.", "titulo_pt": "Meta concorda com acordo para manter Zuckerberg em California apesar da proposta de imposto sobre riqueza", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 217456, "titulo": "Meta to create a new class of shares to fund AI push", "url": "https://www.theverge.com/tech/1015799/meta-shares-class-ai-q3-2026-earnings", "fonte_id": "the_verge", "data_pub": "2026-10-21T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta planeja emitir uma nova classe de ações para financiar seus esforços em inteligência artificial. As ações não-votantes também serão usadas para potenciais aquisições e compensação de funcionários, com a negociação prevista para começar em 2027.", "titulo_pt": "Meta planeja criar uma nova classe de ações para financiar avanços em IA", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 217337, "titulo": "AI uncovers massive flaw in web's foundational code", "url": "https://www.axios.com/2026/10/21/php-openai-ai-bug-hunting-cyberattacks", "fonte_id": "axios", "data_pub": "2026-10-21T21:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Segurança de sistemas está em alerta devido a dois graves problemas em um idioma de programação que executa milhões de sites. Pesquisadores, com auxílio de um modelo do OpenAI, descobriram falhas que humanos haviam ignorado por décadas, aumentando a pressão para corrigir as vulnerabilidades antes que os atacantes as exploitem com alta velocidade.", "titulo_pt": "IA descobre grave falha em código fundamental da web", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 216983, "titulo": "Entenda a falha da linguagem de programação PHP que gerou caos ao redor do mundo", "url": "https://veja.abril.com.br/tecnologia/entenda-a-falha-da-linguagem-de-programacao-php-que-gerou-caos-ao-redor-do-mundo/", "fonte_id": "veja", "data_pub": "2026-10-21T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em agosto, inteligências artificiais identificaram falhas na linguagem de programação PHP, mas a informação vazou um dia antes da atualização planejada para corrigir essas falhas.", "titulo_pt": "Entenda a falha da linguagem de programação PHP que gerou caos ao redor do mundo", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 217479, "titulo": "‘It’s the President’s Fault’: The White House Blame Game Starts Early Ahead of the Midterms", "url": "https://www.wired.com/story/its-the-presidents-fault-the-white-house-blame-game-starts-early-ahead-of-the-midterms/", "fonte_id": "wired", "data_pub": "2026-10-21T21:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Palácio Branco está considerando a possibilidade de perder o Congresso e, de forma incomum, já está buscando um culpado republicano antes mesmo das eleições legislativas.", "titulo_pt": "É culpa do presidente: o jogo de culpar os republicanos começa cedo antes das eleições legislativas", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 217458, "titulo": "Meta says it would’ve made over $22 billion if it didn’t have to pay a child safety settlement", "url": "https://www.theverge.com/tech/1015877/meta-q3-2026-earnings-child-safety-settlement", "fonte_id": "the_verge", "data_pub": "2026-10-21T20:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta teve que pagar $9,89 bilhões para atender a um acordo de segurança infantil com procuradores estadunidenses, o que reduziu sua lucratividade operacional em $9,89 bilhões. Se não tivesse feito esse pagamento, a empresa teria lucro operacional de $22,89 bilhões no terceiro trimestre.", "titulo_pt": "Meta diria ter ganho mais de 22 bilhões se não tivesse que pagar um acordo de segurança infantil", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 217437, "titulo": "Top Democrat says chip restrictions are ‘key lever’ for US AI edge over China", "url": "https://www.scmp.com/news/china/diplomacy/article/3371692/top-democrat-says-chip-restrictions-are-key-lever-us-ai-edge-over-china", "fonte_id": "scmp", "data_pub": "2026-10-21T20:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jim Himes, líder democrata da Comissão de Inteligência da Câmara dos Representantes, afirmou que restrições a chips avançados são o principal meio pelo qual os EUA podem manter sua vantagem em IA avançada em relação à China. Segundo Himes, não acredita que os EUA mantenham permanentemente essa liderança sobre os modelos chineses de IA, mas que devem aproveitar essa vantagem enquanto durar.", "titulo_pt": "Líder democrata dos EUA diz que restrições a chips são chave para manter vantagem em IA sobre China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 217481, "titulo": "Bose Is Buying Skullcandy. It’s Not as Weird as It Sounds", "url": "https://www.wired.com/story/bose-acquires-skullcandy-october-2026/", "fonte_id": "wired", "data_pub": "2026-10-21T20:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Bose está adquirindo a Skullcandy e manterá a empresa em Park City, Utah. A Bose acredita que a credibilidade do skate e os preços mais acessíveis da Skullcandy podem ajudar a alcançar um público que a Bose tem sido incapaz de atingir.", "titulo_pt": "Bose adquire Skullcandy", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 217431, "titulo": "GM aims to leapfrog rivals with new generation of autonomous cars", "url": "https://www.ft.com/content/5eb997eb-6031-40c4-b2f3-e2a09f4d64f1?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-21T20:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe de produto da GM, Sterling Anderson, planeja colocar veículos autônomos totalmente sem motorista em estrada para uso privado em 2028.", "titulo_pt": "GM visa superar concorrentes com nova geração de carros autônomos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 217339, "titulo": "Meta hit with $25 billion penalty for misleading Facebook users", "url": "https://www.axios.com/2026/10/21/meta-25-billion-cambridge-analytica-scandal-ruling", "fonte_id": "axios", "data_pub": "2026-10-21T20:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um juiz do Novo México determinou que a Meta deve pagar uma multa de 25 bilhões de dólares após um júri condenar a empresa por enganar os usuários sobre a privacidade dos dados no Facebook. Esta penalidade, que ocorre quase uma década após o escândalo Cambridge Analytica, indica que as grandes tecnológicas podem enfrentar consequências financeiras significativas por enganar os usuários sobre a privacidade.", "titulo_pt": "Meta é condenada a pagar multa de 25 bilhões de dólares por enganar usuários sobre privacidade", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 217464, "titulo": "Walmart is inviting AI agents to shop for you", "url": "https://www.theverge.com/ai-artificial-intelligence/1015715/walmart-ai-shopping-agents", "fonte_id": "the_verge", "data_pub": "2026-10-21T19:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em breve, o Walmart permitirá que agentes de inteligência artificial comprem itens para os clientes em seu site. O sistema permitirá que os usuários aprovem e revisem as compras, além de estabelecer limites de gastos.", "titulo_pt": "Walmart convida agentes de IA para fazer compras no seu lugar", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 217440, "titulo": "Meta to pay New Mexico a historic US$25 billion in Cambridge Analytica Facebook case", "url": "https://www.scmp.com/news/world/united-states-canada/article/3371689/meta-pay-new-mexico-historic-us25-billion-cambridge-analytica-case", "fonte_id": "scmp", "data_pub": "2026-10-21T19:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Meta foi condenada a pagar uma multa civil de US$25 bilhões ao estado do Novo México em um caso de fraude contra consumidores relacionado à escândalo Cambridge Analytica. A multa, emitida pelo juiz Francis Mathew, é uma das maiores condenações judiciais na história dos Estados Unidos.", "titulo_pt": "Meta deve pagar histórico US$25 bilhões ao novo México no caso Cambridge Analytica", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 217425, "titulo": "Bessent shrugs off ‘systemic’ AI risks at closed-door investor conference", "url": "https://www.ft.com/content/5b7c2fdf-2300-4208-860e-6389ceb18886?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-21T18:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário do Tesouro dos EUA discursou para investidores em um evento privado com ingressos a US$ 7.500, onde não foram abordadas questões de riscos sistêmicos relacionados à inteligência artificial.", "titulo_pt": "Bessent ignora riscos sistêmicos de IA em evento fechado com investidores", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 217426, "titulo": "NSA warns on ‘critical’ cyber vulnerabilities detected using AI", "url": "https://www.ft.com/content/245778d9-597b-492d-b5b6-a2967c77e853?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-21T18:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NSA alertou sobre vulnerabilidades críticas em software de sites que foram detectadas usando inteligência artificial. Pesquisadores utilizaram modelos de inteligência artificial da OpenAI e da Google para identificar falhas graves em software utilizado em maioria dos sites na internet.", "titulo_pt": "NSA avisa sobre vulnerabilidades críticas em software de sites detectadas com AI", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 217493, "titulo": "STAT+: CMS extends fraud crackdown to New York’s adult day care program", "url": "https://www.statnews.com/2026/10/21/cms-medicaid-fraud-nyc-adult-daycare-operators/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-21T21:38:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A CMS está intensificando a fiscalização em creches para adultos em Nova York, como parte de uma ampla investigação sobre supostas fraudes no setor de saúde.", "titulo_pt": "CMS amplia fiscalização contra fraudes em creches para adultos em nova York", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 217259, "titulo": "Introducing the 2026 L’Oréal-UNESCO for Women in Science Awardees", "url": "https://www.vox.com/press-room/507068/introducing-the-2026-loreal-usa-for-women-in-science-awardees", "fonte_id": "vox", "data_pub": "2026-10-21T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O evento será realizado em 22 de outubro, com o objetivo de homenagear as vencedoras do Prêmio L'Oréal-UNESCO para Mulheres na Ciência 2026, reconhecendo cinco cientistas pós-doutorais com pesquisas em áreas que variam de bioengenharia a astronomia. Este é o segundo ano consecutivo que o programa celebra essas cientistas.", "titulo_pt": "Introduzindo as vencedoras do prêmio l'oréal-unesco para mulheres na ciência 2026", "veiculo": "Vox", "pais": "EUA", "classe": "B"}, {"id": 216919, "titulo": "El Niño ainda não causa efeito previsto na cultura do arroz", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/vaivem/2026/10/el-nino-ainda-nao-causa-efeito-previsto-na-cultura-do-arroz.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O volume de chuva no Sul do país é maior do que o esperado, o que dificulta o plantio em algumas áreas, mas ainda não foram observados os fortes efeitos previstos pelo fenômeno El Niño.", "titulo_pt": "El Niño ainda não causa efeito previsto na cultura do arroz", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 217522, "titulo": "NASA Conducts RS-25 Engine Test in Support of Future Artemis Missions", "url": "https://www.nasa.gov/image-article/rs-25-engine-test-in-support-of-future-artemis-missions/", "fonte_id": "nasa_news", "data_pub": "2026-10-21T20:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA realizou um teste com o motor RS-25 número 10001 em 21 de outubro no Fred Haise Test Stand, no Centro Espacial Stennis, na Mississippi. O teste durou quase oito minutos, igual ao tempo que os motores RS-25 funcionam durante a lançamento do foguete SLS.", "titulo_pt": "NASA realiza teste de motor RS-25 em suporte às futuras missões Artemis", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 216933, "titulo": "Chuva de meteoros Orionídeas tem pico visível em todo Brasil nesta quarta (21) e quinta (22)", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/chuva-de-meteoros-orionideas-tem-pico-visivel-em-todo-brasil-nesta-quarta-21-e-quinta-22.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-21T20:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A chuva de meteoros Orionídeas atinge o seu máximo na noite desta quarta-feira (21) para quinta-feira (22). Essa manifestação celeste é visível em todo o Brasil.", "titulo_pt": "Chuva de meteoros Orionídeas tem pico visível em todo Brasil nesta quarta (21) e quinta (22)", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 217494, "titulo": "STAT+: Another diabetes association leader is out while review continues", "url": "https://www.statnews.com/2026/10/21/american-diabetes-association-leadership-change-controversy/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-21T19:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um endocrinologista que ocupou posições de liderança na American Diabetes Association deixou o cargo sem explicação. A associação está realizando uma revisão interna sobre o caso.", "titulo_pt": "Outro líder da associação de diabetes deixou o cargo sem explicação", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 217496, "titulo": "PAHO calls for strengthened surveillance and preparedness amid increases in dengue and chikungunya in the Americas", "url": "https://www.paho.org/en/news/21-10-2026-paho-calls-strengthened-surveillance-and-preparedness-amid-increases-dengue-and", "fonte_id": "paho", "data_pub": "2026-10-21T19:48:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A PAHO está chamando para a intensificação da vigilância e da preparação em face do aumento da dengue e do chikungunya na América. A organização faz esse apelo em 21 de outubro de 2026.", "titulo_pt": "PAHO solicita fortalecimento da vigilância e preparação em face do aumento de dengue e chikungunya na américa", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}, {"id": 217524, "titulo": "National Science Foundation leader Brian Stone to retire with no clear replacement in sight", "url": "https://www.scientificamerican.com/article/national-science-foundation-leader-brian-stone-to-retire-with-no-clear-replacement-in-sight/", "fonte_id": "scientific_american", "data_pub": "2026-10-21T19:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Brian Stone, líder da National Science Foundation (NSF), planeja se aposentar, mas ainda não há um substituto claro identificado. O nome do candidato indicado pelo presidente Donald Trump, James O’Neill, ainda não foi submetido a uma audiência de confirmação no Senado, deixando o futuro da liderança da NSF incerto.", "titulo_pt": "Líder da national Science Foundation planeja se aposentar sem substituto claro", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 217523, "titulo": "NASA JPL Looks to Next 90 Years of Innovation, Exploration", "url": "https://www.nasa.gov/centers-and-facilities/jpl/nasa-jpl-looks-to-next-90-years-of-innovation-exploration/", "fonte_id": "nasa_news", "data_pub": "2026-10-21T18:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Laboratório de Propulsão a Jato (JPL), gerenciado pela Caltech para a NASA, comemora 90 anos desde o início das suas atividades em outubro de 1936, com testes de propulsão a jato em Pasadena. Hoje, o JPL continua inovando, explorando sistemas como sondas interestelares, drones lunares e helicópteros em Marte.", "titulo_pt": "JPL da NASA olha para os próximos 90 anos de inovação e exploração", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 217028, "titulo": "Esculturas, sepultamentos e pilares: sítio de 11 mil anos revela segredos da Idade da Pedra", "url": "https://exame.com/ciencia/esculturas-sepultamentos-e-pilares-sitio-de-11-mil-anos-revela-segredos-da-idade-da-pedra/", "fonte_id": "exame", "data_pub": "2026-10-21T18:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Arqueólogos descobriram esculturas, sepultamentos e pilares em Sayburç, na Turquia, que ajudam a entender como as primeiras comunidades sedentárias viviam, enterravam seus mortos e transmitiam histórias.", "titulo_pt": "Esculturas, sepultamentos e pilares: sítio de 11 mil anos revela segredos da Idade da Pedra", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 216767, "titulo": "STAT+: What’s the deal with Isomorphic Labs?", "url": "https://www.statnews.com/2026/10/21/whats-the-deal-with-isomorphic-labs-ai-prognosis/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-21T17:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Esta edição da AI Prognosis da STAT discute o valor de mercado elevado da Isomorphic Labs e sua relação com o papel da inteligência artificial no desenvolvimento de medicamentos, bem como o debate sobre a inteligência artificial e o custo de cuidados.", "titulo_pt": "O que o alto valor da Isomorphic Labs diz sobre o papel da IA no desenvolvimento de medicamentos?", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 216134, "titulo": "Japão larga na frente da China na corrida para trazer amostras de Marte", "url": "https://www.infomoney.com.br/mundo/japao-larga-na-frente-da-china-na-corrida-para-trazer-amostras-de-marte/", "fonte_id": "infomoney", "data_pub": "2026-10-21T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A agência espacial japonesa está à frente da chinesa na corrida para trazer amostras de Marte, com uma sonda que viajará até Fobos, uma das luas de Marte. Esta missão tem potencial para fornecer as primeiras amostras do sistema marciano trazidas à Terra.", "titulo_pt": "Japão se antecipa à China na corrida por amostras de Marte", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 216046, "titulo": "4 pesquisas avançadas que podem revolucionar o tratamento da Aids — e até levar à cura da doença", "url": "https://veja.abril.com.br/saude/4-pesquisas-avancadas-que-podem-revolucionar-o-tratamento-da-aids-e-ate-levar-a-cura-da-doenca/", "fonte_id": "veja", "data_pub": "2026-10-21T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Estudos no Brasil e em outros países buscam desenvolver novas abordagens para tratar a AIDS, enquanto novas terapias visam simplificar a prevenção e o controle da infecção. Pesquisas buscam superar o mecanismo de ação do HIV.", "titulo_pt": "4 Pesquisas avançadas que podem revolucionar o tratamento da Aids — e até levar à cura da doença", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 216778, "titulo": "AI could turn scientific papers into research assistants", "url": "https://www.sciencenews.org/article/ai-scientific-papers-research-assistant", "fonte_id": "science_news", "data_pub": "2026-10-21T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um assistente virtual de inteligência artificial pode auxiliar cientistas ao aplicar os métodos de um artigo em novos dados. No entanto, ele não substituirá a expertise humana em pesquisa.", "titulo_pt": "IA poderia transformar artigos científicos em assistentes de pesquisa", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 216772, "titulo": "Super Typhoon Champi sets the record for strongest storm of 2026", "url": "https://www.scientificamerican.com/article/super-typhoon-champi-sets-the-record-for-strongest-storm-of-2026/", "fonte_id": "scientific_american", "data_pub": "2026-10-21T16:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ciclone Super Typhoon Champi registrou os ventos mais fortes do ano, alcançando 185 milhas por hora.", "titulo_pt": "Super Typhoon Champi estabelece recorde como tempestade mais forte de 2026", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 216797, "titulo": "NASA to Conduct NCAA Flyover, Engage Fans at University of Alabama", "url": "https://www.nasa.gov/news-release/nasa-to-conduct-ncaa-flyover-engage-fans-at-university-of-alabama/", "fonte_id": "nasa_news", "data_pub": "2026-10-21T16:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA realizará um voo de passagem sobre o estádio da Universidade da Alabama durante o jogo contra a Texas A&M, no dia 24 de outubro. O Administrador da NASA, Jared Isaacman, pilotará um dos três caças F-5 durante o voo, destacando as contribuições da agência para aeronáutica e seu compromisso contínuo.", "titulo_pt": "NASA fará voo de passagem e engajará fãs na universidade da Alabama", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 217567, "titulo": "All Work is Women’s Work recovers the forgotten history of Amsterdam’s seamstresses", "url": "https://www.itsnicethat.com/articles/hanka-van-der-voet-all-work-is-womens-work-publishing-project-221026", "fonte_id": "its_nice_that", "data_pub": "2026-10-22T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Hanka van der Voet utiliza publicações radicais, pesquisa arquivística e roupas impressas para recuperar a história negligenciada do trabalho e da organização política das costureiras de Amsterdã do início do século XX.", "titulo_pt": "Todo o trabalho é trabalho das mulheres recupera a história esquecida das costureiras de amsterdã", "veiculo": "It's Nice That", "pais": "Reino Unido", "classe": "B"}, {"id": 217572, "titulo": "Florida Heat Melts M
