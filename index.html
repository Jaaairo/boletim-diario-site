<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>

      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>

</div>

const D = {"gerado_em": "06/09/2026 19:17", "stats": {"noticias_novas": 373, "resumos_gerados": 179}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O ministro do STF, Alexandre de Moraes, teve seu caso aprovado para julgamento em plenário, junto com o do juiz Daniel Vorcaro, após um relatório da Polícia Federal sugerir uma possível ligação entre eles. O relatório, autorizado pelo ministro André Mendonça, agora será analisado pelo presidente do STF, Luís Roberto Barroso, que decidirá quando avaliar o pedido de investigação. Paralelamente, o Partido Liberal apresenta o maior número de candidatos ao Senado, com 33, incluindo muitos com ideologias ligadas ao bolsonarismo. Por outro lado, a Federação de Lula tem 21 candidatos. Durante a campanha, vários candidatos a presidente participaram de eventos, com destaque para a crítica do candidato Paes à faixa 'Fora Moraes' e a convocação do bispo Dom Adair para manifestações contra a corrupção no Dia da Independência.", "mundo": "Um acidente envolvendo um avião de carga da Amazon no Aeroporto Internacional de Miami resultou em cinco mortes e várias feridas. O avião desviou da pista após o pouso e atingiu vários veículos. Em outras notícias, o AfD, partido de extrema-direita, obteve uma vitória significativa nas eleições do estado de Saxônia-Anhalt na Alemanha, com mais de 40% dos votos. A União Europeia está planejando assinar um acordo de parceria com a Groenlândia, com investimentos previstos no valor de centenas de milhões de euros. Além disso, a Comissária Europeia Ursula von der Leyen visitou a Groenlândia para discutir o acordo.\n\nA situação geopolítica continua agitada, com vários eventos importantes ocorrendo em diferentes partes do mundo. O Irã ameaçou criar uma zona proibida de navegação no Estreito de Ormuz, alertando que embarcações que entrarem na área poderão ser alvo de ataques. Isso ocorre em um contexto de escalada militar com os Estados Unidos. Em outro desenvolvimento, mais de 300 mortos foram registrados no Iêmen devido a uma nova escalada de combates entre o governo e os hutíes, com os confrontos se concentrando no oeste do país, próximo ao Mar Vermelho e ao Estreito de Bab el-Mandeb. Além disso, ataques israelenses no sul do Líbano deixaram pelo menos quatro mortos e várias feridas, ocorrendo em meio a negociações com os Estados Unidos. Em um contexto mais amplo, o presidente ucraniano Zelenskiy manteve conversações com representantes dos Estados Unidos sobre o conflito entre Ucrânia e Rússia, sem avanços significativos. O Irã prometeu uma reação rápida e dolorosa a novos ataques dos Estados Unidos, afirmando ter atingido uma embarcação americana no Estreito de Ormuz, mas Washington negou o ataque.", "economia": "O governador de Goiás, Ronaldo Caiado, prometeu reduzir a taxa de juros para 7% após assumir o cargo. O presidente Lula afirmou que o voto no próximo pleito eleitoral será crucial para determinar se o Brasil continuará sendo uma potência ou se tenderá a se subordinar a outros países. O Banco Nacional lançou novos créditos para financiar a compra de veículos novos e usados, permitindo financiamentos até 100% do valor dos veículos até 10 anos de uso, sem necessidade de garantia, com prazos até 60 meses e a opção de ajustar as parcelas conforme a evolução dos salários. O governador de Goiás também propôs criar uma poupança de R$ 1 mil para recém-nascidos usando recursos destinados ao combate à corrupção, com 1% da quantia economizada sendo suficiente para implementar essa iniciativa. Além disso, a GFS investirá R$ 55 milhões na construção de uma nova fábrica em Apucarana, Paraná, ampliando a capacidade de produção de aditivos para alimentação de aves e suínos, enquanto a Expointer 2026 movimentou R$ 6,1 bilhões em negócios, registrando uma alta de 40% em comparação com a edição anterior, mas permanecendo abaixo do recorde histórico de 2024.", "tecnologia": "A tecnologia continua avançando em diversos setores. Destaque-se a exploração de novas tecnologias em Taiwan, que está considerando o silício fotônico como o próximo grande salto tecnológico para se posicionar como líder nessa área. Em outro desenvolvimento, a OpenAI enfrenta novos processos nos Estados Unidos por supostos usos indevidos de conteúdo sem autorização em seu treinamento de inteligência artificial, o que pode ter implicações significativas para a empresa. Além disso, a Apple pode fazer mudanças na App Store para aumentar suas receitas, enquanto a Atoms, empresa fundada por Travis Kalanick, planeja entrar no mercado de táxis autônomos. Esses avanços tecnológicos refletem a diversidade e a importância do setor na atualidade, impactando desde a mobilidade urbana até a indústria de jogos e desenvolvimento de software.", "ciencia": "Um estudo publicado na revista JGR Solid Earth utilizou aprendizado de máquina para analisar ondas sísmicas e identificar seis estruturas incomuns na interface entre o núcleo e a crosta funda da Terra. Anteriormente, essas estruturas eram visíveis apenas como manchas dispersas, mas agora aparecem como seis faixas contínuas de irregularidades. Em seguida, cientistas da Washington University em St. Louis descobriram que o sorbitol, um açúcar de álcool comumente usado em doces sem açúcar, chiclete e outros alimentos com baixas calorias, pode ser convertido no fígado em uma forma de frutose, potencialmente causando efeitos metabólicos prejudiciais semelhantes à frutose. Além disso, a NASA expandiu sua rede Deep Space Network com uma nova antena gigante no deserto da Califórnia, aumentando a capacidade da rede de comunicações de longo alcance. Este investimento visa apoiar as missões Artemis e outras demandas crescentes de comunicação espacial.", "cultura": "Na edição do Rock in Rio, a diretora da Tic Tac, Laura Teixeira, enfatizou a importância de estar presente nos locais onde os jovens se divertem. Rafa Vitti, por sua vez, conversou sobre o projeto de Tatá Werneck após o espetáculo 'Quem Ama Cuida'. O diretor sul-coreano Lee Chang-dong estreou 'Possible Love' no Festival de Veneza, recebendo uma ovAÇÃO de pé de 6 minutos após um hiato de quatro anos. John Turturro recebeu um prêmio de melhor ator no Festival de Cannes, e a Sony Pictures Classics está decidida a garantir sua indicação ao Oscar. A GloboNews liderou a audiência entre os canais de notícias da TV brasileira em agosto, destacando-se em suas plataformas digitais. 'B’Day', do álbum de Beyoncé, completa 20 anos, enquanto 'Spider-Man: Brand New Day' manteve a liderança no box office doméstico pela sexta semana consecutiva. Daniela Mercury participou do evento na quadra da Mangueira para ajudar na escolha da música do samba-enredo, e Miguel Gandelman ganhou o Emmy de Melhor Direção Musical pelo show de Bad Bunny no intervalo do Super Bowl. Ricky Martin considera estar no Festival de Veneza para apresentar um filme ao lado de Gael García Bernal como uma página importante de sua trajetória. No Brasil, Andrea Kimi Antonelli realizou a segunda maior remontada para a vitória na história da Fórmula 1 no GP de Monza, se tornando o primeiro piloto local a vencer o GP de Itália desde 1966. No exterior, o documentário 'Lo que viene' estreia no Amazon Prime Video, abordando temas como abuso sexual, desigualdade e poder, baseado em casos reais. O diretor japonês Shinya Tsukamoto advertiu para se manter afastado do campo de batalha em sua nova filmografia. Andy Williams, fundador da guitarra rítmica da banda metalcore Buffalo, faleceu aos 48 anos após uma carreira que incluiu música e luta profissional.", "sociedade": "O número de lares com apenas uma pessoa aumentou para 40,5% em todo o país, de acordo com dados do Taipei Times. Um destaque foi a abertura de duas investigações pelo Ministério Público Federal (MPF) para verificar possíveis falhas no serviço de saúde aos Yanomami, após o uso de um produto com prazo de validade vencido durante o tratamento de pacientes. No Paraná, a médica Gassi Mazia, de 37 anos, foi encontrada morta em seu apartamento, levando seu marido, João Vitor Domingues Romeiro, de 25 anos, a ser preso sob suspeita de feminicídio. Em São Paulo, um incêndio atingiu mais de 25 moradias na zona Norte da cidade, com pelo menos 10 viaturas do Corpo de Bombeiros chamadas para combater as chamas. No Distrito Federal, o CVV atendeu a 48.550 ligações de pedidos de socorro em um ano, registrando a terceira maior taxa de pedidos de socorro do país. Além disso, o chefe do Trabalho de Hong Kong indicou que as autoridades locais estão dispostas a classificar o desmaio por calor como uma doença ocupacional, devido à ativação do sistema de alerta de calor reformulado em dois dias excepcionalmente quentes.", "meio_ambiente": "O Ibama recomenda análise de riscos do El Niño para hidrelétricas, portos e linhas de transmissão, com guias próximos a serem publicados. A erosão costeira em Atafona, RJ, e a seca no Rio Silugonggo, Indonésia, ilustram impactos locais.", "direitos_humanos": "Organizações cívicas, em um esforço para preservar a memória histórica, solicitaram à UNESCO que incluísse os documentos relacionados às 'mulheres de conforto' em sua lista de bens da memória humana. Em outro caso, um grupo de seguidores da médium Maira Rocha, conhecido como milícia digital, atacou e ameaçou pessoas que criticaram a líder espiritual. Por fim, em Hong Kong, legisladores e um conselheiro governamental estão pressionando pela criação de uma lei contra assédio, após um homem ser absolvido de acusações de ter seguido uma garota adolescente para sua sala de aula de ensino médio, destacando a necessidade de maior proteção contra o assédio repetido."}, "resumo_do_dia": {"politica_nacional": [{"id": 149516, "titulo": "Juiz manda Arruda apagar vídeo sobre Gustavo Rocha: \"Inverídico\"", "url": "https://www.metropoles.com/distrito-federal/juiz-manda-arruda-apagar-video-sobre-gustavo-rocha-inveridico", "fonte_id": "metropoles", "data_pub": "2026-09-06T21:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz determinou que Arruda remova um vídeo que afirma inverosímilmente que o vice de Celina recebeu R$ 6 milhões de Daniel Vorcaro. A publicação foi feita na conta pessoal de Arruda.", "titulo_pt": "Juiz ordena que Arruda retire vídeo sobre Gustavo Rocha: 'inverídico'", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 149468, "titulo": "Saiba onde serão os atos da esquerda no 7 de Setembro de 2026", "url": "https://www.poder360.com.br/poder-brasil/saiba-onde-serao-os-atos-da-esquerda-no-7-de-setembro-de-2026/", "fonte_id": "poder360", "data_pub": "2026-09-06T21:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 7 de setembro de 2026, haverá atos da esquerda em São Paulo, especificamente na Praça da Sé, entre as 9h e 11h30. O tema central será a defesa da terra, paz e moradia.", "titulo_pt": "Saiba onde serão os atos da esquerda no 7 de Setembro de 2026", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 149523, "titulo": "MPE pede ao TSE indeferimento da candidatura de Pablo Marçal à Presidência", "url": "https://www.metropoles.com/sao-paulo/mpe-tse-indeferimento-marcal", "fonte_id": "metropoles", "data_pub": "2026-09-06T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Procuradoria-geral eleitoral pediu ao Tribunal Superior Eleitoral (TSE) o indeferimento da candidatura de Pablo Marçal à Presidência. O pedido destaca a inelegibilidade de Marçal e a possível irregularidade na sua filiação ao Partido Republicano Trabalhista Brasileiro (PRTB). A análise judicial será realizada.", "titulo_pt": "Pge pede ao TSE indeferimento da candidatura de Pablo Marçal à Presidência", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 149537, "titulo": "Augusto Cury omitiu empresas nos Estados Unidos e no Brasil em declaração ao TSE", "url": "https://www.infomoney.com.br/politica/augusto-cury-omitiu-empresas-nos-estados-unidos-e-no-brasil-em-declaracao-ao-tse/", "fonte_id": "infomoney", "data_pub": "2026-09-06T21:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury declarou ter participações societárias em sete empresas, mas omitiu algumas das empresas localizadas nos Estados Unidos e no Brasil em sua declaração ao TSE. Omissão constatada após análise das informações fornecidas.", "titulo_pt": "Augusto Cury omitiu empresas nos EUA e no Brasil em declaração ao TSE", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 149526, "titulo": "CE: Justiça proíbe vídeo de Elmano e dá direito de resposta a Ciro Gomes", "url": "https://www.metropoles.com/brasil/ce-justica-proibe-video-de-elmano-e-da-direito-de-resposta-a-ciro-gomes", "fonte_id": "metropoles", "data_pub": "2026-09-06T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O juiz eleitoral proibiu o uso de um vídeo do candidato Elmano e concedeu direito de resposta ao candidato Ciro Gomes. O vídeo original associava Ciro Gomes a Jair Bolsonaro e foi exibido em instalações governamentais durante uma campanha.", "titulo_pt": "Justiça proíbe vídeo de Elmano e garante direito de resposta a Ciro Gomes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 149539, "titulo": "Mendonça libera relatório da PF com mensagens de Vorcaro a Moraes para análise", "url": "https://www.infomoney.com.br/politica/mendonca-libera-relatorio-da-pf-com-mensagens-de-vorcaro-a-moraes-para-analise/", "fonte_id": "infomoney", "data_pub": "2026-09-06T21:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do STF Luís Roberto Barroso liberou o relatório da Polícia Federal que contém mensagens entre Vorcaro e Fachin, para análise por Fachin. A decisão final sobre o caso será tomada por Fachin.", "titulo_pt": "Mendonça libera relatório da PF com mensagens de Vorcaro a fachin para análise", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 149469, "titulo": "Saiba quem indicou cada ministro do STF e quando eles deixam a Corte", "url": "https://www.poder360.com.br/poder-justica/saiba-quem-indicou-cada-ministro-do-stf-e-quando-eles-deixam-a-corte/", "fonte_id": "poder360", "data_pub": "2026-09-06T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula é o presidente com mais indicações no atual plenário do STF, com quatro nomes. Fux será o primeiro ministro a deixar a Corte em 2028, enquanto Zanin será o último a se aposentar, em 2050.", "titulo_pt": "Saiba quem indicou cada ministro do STF e quando eles deixarão a Corte", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 149530, "titulo": "Paes critica faixa “Fora Moraes” e diz que crise virou “panfleto eleitoral”", "url": "https://www.metropoles.com/brasil/paes-critica-faixa-fora-moraes-e-diz-que-crise-virou-panfleto-eleitoral", "fonte_id": "metropoles", "data_pub": "2026-09-06T21:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato ao governo do Rio de Janeiro criticou a faixa 'Fora Moraes' e afirmou que a crise política se transformou em um panfleto eleitoral, durante uma carreata em Nova Iguaçu. No entanto, ele defendeu a preservação das instituições.", "titulo_pt": "Paes critica faixa 'Fora Moraes' e diz que crise virou panfleto eleitoral", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 149447, "titulo": "Veja como foi o fim de semana (5 e 6) dos candidatos a presidente", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-09/veja-como-foi-o-fim-de-semana-dos-candidatos-presidente", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-09-06T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os candidatos a presidente participaram de diversas atividades durante o fim de semana, incluindo lançamentos de campanha, eventos políticos e encontros com representantes do setor produtivo. A agenda variou entre cidades diferentes, com visitas e participações em eventos de campanha.", "titulo_pt": "Veja como foi o fim de semana dos candidatos a presidente", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 149532, "titulo": "Com STF e Alcolumbre na mira, PL tem o maior número de candidatos ao Senado", "url": "https://www.metropoles.com/brasil/com-stf-e-alcolumbre-na-mira-pl-tem-o-maior-numero-de-candidatos-ao-senado", "fonte_id": "metropoles", "data_pub": "2026-09-06T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Partido Liberal apresenta 33 candidatos ao Senado, com forte presença de ideologias ligadas ao bolsonarismo. A Federação de Lula tem 21 candidatos ao Senado.", "titulo_pt": "Com STF e Alcolumbre na mira, PL tem o maior número de candidatos ao Senado", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 149458, "titulo": "Infantino confirma candidatura à reeleição como presidente da Fifa, apesar da crise", "url": "https://www.cartacapital.com.br/esporte/infantino-confirma-candidatura-a-reeleicao-como-presidente-da-fifa-apesar-da-crise/", "fonte_id": "cartacapital", "data_pub": "2026-09-06T21:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Infantino, presidente atual da FIFA, confirmou sua candidatura à reeleição, mesmo diante de uma crise. É necessário obter a maioria simples dos votos das 211 associações-membro para prorrogar seu mandato.", "titulo_pt": "Infantino confirma candidatura à reeleição como presidente da Fifa, apesar da crise", "veiculo": "CartaCapital", "pais": "Brasil", "classe": "B"}, {"id": 149448, "titulo": "MPF reforça pedido do governo federal e cobra medidas urgentes do Discord", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/09/mpf-reforca-pedido-do-governo-federal-e-cobra-medidas-urgentes-do-discord.shtml", "fonte_id": "folha_poder", "data_pub": "2026-09-06T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O MPF reforçou o pedido ao governo federal para que o Discord adote medidas urgentes de proteção às crianças e adolescentes. O Ministério Público e o governo defendem que a plataforma se adeque à lei brasileira.", "titulo_pt": "MPF reforça pedido do governo e cobra medidas urgentes do Discord para proteção de crianças e adolescentes", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 149510, "titulo": "Mendonça libera ao plenário caso das mensagens de Moraes e Vorcaro", "url": "https://www.congressoemfoco.com.br/noticia/122018/mendonca-libera-ao-plenario-caso-das-mensagens-de-moraes-e-vorcaro", "fonte_id": "congresso_em_foco", "data_pub": "2026-09-06T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do STF, Luís Roberto Barroso Mendonça, decidiu se levará o relatório da PF sobre as mensagens de Moraes e Vorcaro ao plenário e se a análise será pública ou reservada. A PGR indicou nulidades na apuração ordenada por Mendonça.", "titulo_pt": "Mendonça decide caso das mensagens de Moraes e Vorcaro e pgr aponta nulidades", "veiculo": "Congresso em Foco", "pais": "Brasil", "classe": "B"}, {"id": 149470, "titulo": "Justiça manda “ICL” retirar conteúdo sobre “lindão” de Nikolas para Vorcaro", "url": "https://www.poder360.com.br/poder-congresso/justica-manda-icl-retirar-conteudo-sobre-lindao-de-nikolas-para-vorcaro/", "fonte_id": "poder360", "data_pub": "2026-09-06T20:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça determinou que o ICL retire seis publicações sobre Nikolas Vorcaro, conhecido como 'lindão', em até 24 horas. O TRE-MG considerou que o deputado se referiu ao banqueiro como 'Dani' em um áudio.", "titulo_pt": "Justiça determina retirada de conteúdo sobre 'lindão' Nikolas para Vorcaro", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 149471, "titulo": "Saiba o que Zema, Renan, Caiado e Cury farão no 7 de Setembro", "url": "https://www.poder360.com.br/poder-eleicoes-2026/saiba-o-que-zema-renan-caiado-e-cury-farao-no-7-de-setembro/", "fonte_id": "poder360", "data_pub": "2026-09-06T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Candidatos à Presidência terão agendas em São Paulo, Rio de Janeiro e Goiás; Zema e Renan planejam manifestações direcionadas a Moraes no Dia da Independência.", "titulo_pt": "Entenda as ações dos candidatos à presidência no 7 de Setembro", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 149568, "titulo": "Associações defendem Messias após relatório apócrifo da PF lançar suspeita", "url": "https://www.cnnbrasil.com.br/politica/associacoes-defendem-messias-apos-relatorio-apocrifo-da-pf-lancar-suspeita/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-06T20:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Associações que representam as carreiras da Advocacia Pública Federal afirmam que uma divergência jurídica da Advocacia-Geral da União não pode ser considerada como 'elemento de suspeição'.", "titulo_pt": "Associações defendem Messias após relatório apócrifo da PF lançar suspeita", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}], "politica_nacional__eventos": [], "mundo": [{"id": 149325, "titulo": "Military budgets more arms production", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/ , "classe": "A"}, {"id": 149747, "titulo": "Amazon cargo plane crashes in US while landing at Miami airport", "url": "https://www.aljazeera.com/news/2026/9/6/amazon-cargo-plane-crashes-in-us-while-landing-at-miami-airport?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-06T21:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um avião de carga da Amazon caiu durante o pouso no Aeroporto Internacional de Miami nos Estados Unidos. A causa do acidente está sendo investigada.", "titulo_pt": "Avião de carga da amazon cai em Miami durante pouso", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 149748, "titulo": "At least 10 killed in central Mexico fireworks blast during festival", "url": "https://www.aljazeera.com/news/2026/9/6/at-least-10-killed-in-central-mexico-fireworks-blast-during-festival?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-09-06T21:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um acidente com fogos de artifício durante um festival no centro do México deixou pelo menos 10 mortos e 60 feridos. A explosão foi causada por um touro de pano que estava em chamas.", "titulo_pt": "Pelo menos 10 mortos em explosão de fogos durante festival no centro do México", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 149744, "titulo": "Saxony-Anhalt: Digesting the AfD's landmark election win", "url": "https://www.dw.com/en/saxony-anhalt-digesting-the-afd-s-landmark-election-win/a-79103981?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-09-06T21:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Saxônia-Anhalt assistiu a uma noite eleitoral marcante com mais de 40% dos votos para o Alternative für Deutschland (AfD), partido de extrema-direita. Repórteres da DW estavam presentes para cobrir o evento.", "titulo_pt": "Saxônia-anhalt: noite eleitoral marcante com vitória histórica do AfD", "veiculo": "Deuts  fundo. Eles avaliam que a decisão reflete o esgotamento da categoria diante de omissões inconstitucionais prolongadas.", "titulo_pt": "Juízes de sindicato criticam 'assédio', pedem revisão de salários e criam fundo", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 149536, "titulo": "Zema quer poupança de R$ 1 mil para recém-nascidos com recurso do combate à corrupção", "url": "https://www.infomoney.com.br/politica/zema-quer-poupanca-de-r-1-mil-para-recem-nascidos-com-recurso-do-combate-a-corrupcao/", "fonte_id": "infomoney", "data_pub": "2026-09-06T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador Zema propõe criar uma poupança de R$ 1 mil para recém-nascidos usando recursos destinados ao combate à corrupção. Segundo ele, 1% da quantia economizada com a luta contra a corrupção seria suficiente para implementar essa iniciativa.", "titulo_pt": "Zema quer poupar R$ 1 mil para recém-nascidos com recursos do combate à corrupção", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 149538, "titulo": "Caiado diz que STF vive “momento delicado” e precisa “dar satisfação à população”", "url": "https://www.infomoney.com.br/politica/caiado-diz-que-stf-vive-momento-delicado-e-precisa-dar-satisfacao-a-populacao/", "fonte_id": "infomoney", "data_pub": "2026-09-06T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governador de Goiás, Ronaldo Caiado, afirmou que o STF (Supremo Tribunal Federal) está passando por um momento delicado e precisa dar satisfação à população. Ele comparou a situação atual do STF com a de outros poderes diante de situações similares.", "titulo_pt": "Caiado diz que STF vive 'momento delicado' e precisa 'dar satisfação à população'", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 149540, "titulo": "Sem citar Fachin, Dino critica ideia de encerrar inquérito de fake news", "url": "https://www.infomoney.com.br/politica/sem-citar-fachin-dino-critica-ideia-de-encerrar-inquerito-de-fake-news/", "fonte_id": "infomoney", "data_pub": "2026-09-06T21:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Dino criticou a ideia de encerrar um inquérito sobre fake news, questionando se um juiz pode prometer o fim de um inquérito como forma de obter apoio. Não foi mencionado explicitamente o nome do juiz Fachin.", "titulo_pt": "Dino critica ideia de encerrar inquérito de fake news sem citar Fachin", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 149558, "titulo": "GFS investe R$ 55 milhões em nova fábrica de aditivos para nutrição animal", "url": "https://www.cnnbrasil.com.br/agro/gfs-investe-r-55-milhoes-em-nova-fabrica-de-aditivos-para-nutricao-animal/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-06T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A GFS investirá R$ 55 milhões na construção de uma nova fábrica em Apucarana, Paraná, que será inaugurada em 9 de setembro. A unidade ampliará a capacidade de produção de aditivos para alimentação de aves e suínos.", "titulo_pt": "GFS investe R$ 55 milhões em nova fábrica de aditivos para nutrição animal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 149541, "titulo": "Nas redes, Augusto Cury critica polarização: “Brasil está cansado”", "url": "https://www.infomoney.com.br/politica/nas-redes-augusto-cury-critica-polarizacao-brasil-esta-cansado/", "fonte_id": "infomoney", "data_pub": "2026-09-06T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Augusto Cury criticou a polarização política no Brasil em uma postagem nas redes sociais, afirmando que o país está cansado.", "titulo_pt": "Augusto Cury critica polarização nas redes: 'Brasil está cansado'", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 149542, "titulo": "Mansão de dono da Marabraz vai a leilão por mais de R$ 72 milhões", "url": "https://www.infomoney.com.br/brasil/mansao-de-dono-da-marabraz-vai-a-leilao-por-mais-de-r-72-milhoes/", "fonte_id": "infomoney", "data_pub": "2026-09-06T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A mansão de um dos proprietários da Marabraz está sendo leiloada por mais de R$ 72 milhões. A propriedade de 2.640,04 m² está localizada em um condomínio de luxo em São Paulo.", "titulo_pt": "Mansão do dono da Marabraz vai a leilão por mais de R$ 72 milhões", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 149778, "titulo": "[Jonathan D. Ostry] Whipsaw trade policy is hurting FDI", "url": "https://www.koreaherald.com/article/10864018", "fonte_id": "korea_herald", "data_pub": "2026-09-06T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, incentivou as empresas a produzirem no país para evitar tarifas, mas a política de comércio 'America First' sofreu várias mudanças, incluindo anúncios, pausas, restabelecimentos e a substituição de tarifas por leis diferentes.", "titulo_pt": "Política comercial incerta prejudica investimento estrangeiro direto", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 149572, "titulo": "Secretário de Energia dos EUA diz ser provável que preços da gasolina caiam", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/secretario-de-energia-dos-eua-diz-ser-provavel-que-precos-da-gasolina-caiam/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-06T20:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O secretário de Energia dos Estados Unidos indicou que é provável que os preços da gasolina caiam. Após uma pausa nas ações militares em agosto, os ataques entre EUA e Irã foram retomados.", "titulo_pt": "Secretário de Energia dos EUA diz que preços da gasolina podem cair", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 149467, "titulo": "IBGE disponibiliza a partir de amanhã mapas-múndi recentes", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-09/ibge-disponibiliza-partir-de-amanha-mapas-mundi-recentes", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-09-06T20:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O IBGE disponibilizará, a partir do Dia da Independência do Brasil, mapas-múndi do Brasil lançados entre 2024 e 2026. A versão mais recente foi aprovada na Assembleia Geral das Nações Unidas.", "titulo_pt": "IBGE disponibiliza mapas-múndi recentes a partir de amanhã", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 149575, "titulo": "Expointer 2026 movimenta R$ 6,1 bilhões em negócios", "url": "https://www.cnnbrasil.com.br/agro/expointer-2026-encerra-com-r-61-bilhoes-em-comercializacao/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-06T20:06:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Expointer 2026 movimentou R$ 6,1 bilhões em negócios, registrando uma alta de 40% em comparação com a edição anterior, mas permanecendo abaixo do recorde histórico de 2024.", "titulo_pt": "Expointer 2026 movimenta R$ 6,1 bilhões em negócios", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 149668, "titulo": "Quanto custaria uma Chevrolet Zafira hoje, com a inflação?", "url": "https://canaltech.com.br/carros/quanto-custaria-uma-chevrolet-zafira-hoje-com-a-inflacao/", "fonte_id": "canaltech", "data_pub": "2026-09-06T20:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Chevrolet Zafira foi uma minivan que deixou saudades entre os consumidores brasileiros, embora não tenha sido um carro especialmente potente ou tecnológico. A versão Collection, limitada a 500 unidades, foi lançada em 2012, após o modelo ter sido retirado do mercado brasileiro.", "titulo_pt": "Quanto custaria uma Chevrolet Zafira hoje, com a inflação?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 149742, "titulo": "Amazon cargo plane overshoots Miami runway, crashes into vehicles and catches fire", "url": "http://www.euronews.com/2026/09/06/amazon-cargo-plane-overshoots-miami-runway-crashes-into-vehicles-and-catches-fire", "fonte_id": "euronews", "data_pub": "2026-09-06T20:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um avião da Amazon, do tipo Boeing 767, que operava para o Amazon Prime Air, desviou do runway de Miami e colidiu com veículos, causando um incêndio. Não há informações imediatas sobre vítimas.", "titulo_pt": "Carga da amazon desvia runway de Miami, colide com veículos e explode em chamas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 149544, "titulo": "Justiça rejeita pedido do Coco Bambu em ação contra Gregório Duvivier e João Vicente", "url": "https://www.infomoney.com.br/brasil/justica-rejeita-pedido-do-coco-bambu-em-acao-contra-gregorio-duvivier-e-joao-vicente/", "fonte_id": "infomoney", "data_pub": "2026-09-06T20:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O restaurante Coco Bambu teve seu pedido para remoção de um vídeo rejeitado pela Justiça, marcando uma primeira derrota no processo contra Gregório Duvivier e João Vicente.", "titulo_pt": "Justiça rejeita pedido do Coco Bambu em ação contra Gregório Duvivier e João Vicente", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 149451, "titulo": "BlackRock e JPMorgan apostam em mercados emergentes", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/09/blackrock-e-jpmorgan-apostam-em-mercados-emergentes.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-09-06T18:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Fundos administrados por instituições como JPMorgan Asset Management e BlackRock estão encontrando vantagens nos mercados emergentes, enquanto os títulos públicos das principais economias sofrem fortes quedas.", "titulo_pt": "Blackrock e JPMorgan investem em mercados emergentes", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 149326, "titulo": "Taiwan eyes silicon photonics as next big tech leap", "url": "https://www.taipeitimes.com/News/front/archives/2026/09/07/2003863802", "fonte_id": "taipei_times", "data_pub": "2026-09-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Taiwan está considerando o silício fotônico como o próximo grande salto tecnológico. O país está explorando essa tecnologia com o objetivo de se posicionar como líder nessa área.", "titulo_pt": "Taiwan mira no silício fotônico como próximo grande salto tecnológico", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 149349, "titulo": "OpenAI attempted to hide rogue AI agent behavior", "url": "https://www.taipeitimes.com/News/biz/archives/2026/09/07/2003863791", "fonte_id": "taipei_times", "data_pub": "2026-09-07T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A OpenAI tentou esconder o comportamento indesejado de um agente de inteligência artificial não autorizado. A empresa buscou ocultar essas atividades para evitar problemas ou repercussões negativas.", "titulo_pt": "Openai tentou esconder o comportamento de agente AI não autorizado", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 149666, "titulo": "10 jogos que estão demorando tanto que viraram história para boi dormir", "url": "https://canaltech.com.br/games/jogos-demorando-demais-para-lancar/", "fonte_id": "canaltech", "data_pub": "2026-09-06T22:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "GTA 6 está programado para ser lançado em novembro de 2026, após 13 anos de espera. Muitos projetos de jogos, que os fãs aguardam há muito tempo, nunca foram concluídos e se tornaram lendas urbanas.", "titulo_pt": "10 Jogos que estão demorando tanto que viraram história para boi dormir", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 149785, "titulo": "Phil Schiller’s App Store exit reportedly driven by wariness over future plans", "url": "https://techcrunch.com/2026/09/06/phil-schillers-app-store-exit-reportedly-driven-by-wariness-over-future-plans/", "fonte_id": "techcrunch", "data_pub": "2026-09-06T21:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Phil Schiller deixou a App Store devido a reservas sobre os planos do novo CEO John Ternus de aumentar a receita recorrente através dela.", "titulo_pt": "Saída de phil Schiller da App Store devido a preocupações com novos planos de receita", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 149667, "titulo": "7 séries de super-heróis canceladas que todo mundo quer que volte", "url": "https://canaltech.com.br/entretenimento/series-super-herois-canceladas-que-precisam-voltar/", "fonte_id": "canaltech", "data_pub": "2026-09-06T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Muitas séries de super-heróis, embora populares, foram canceladas devido a cortes orçamentários, problemas com a agenda dos atores e variações no interesse do público. Essas séries, que poderiam complementar o universo de filmes de super-heróis, foram interrompidas por resultados insatisfatórios para as plataformas de streaming.", "titulo_pt": "7 Séries de super-heróis canceladas que todo mundo quer que voltem", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 149786, "titulo": "Authors push back as publishers and agents make claims on Anthropic settlement", "url": "https://techcrunch.com/2026/09/06/authors-push-back-as-publishers-and-agents-seek-share-of-anthropic-settlement/", "fonte_id": "techcrunch", "data_pub": "2026-09-06T20:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autores afirmam que editores parecem estar reivindicando uma fatia maior do que o justo dos pagamentos de indenização. Eles questionam a distribuição dos recursos.", "titulo_pt": "Autores contestam reivindicações de editores e agentes sobre indenização de Anthropic", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 149545, "titulo": "Empresa de fundador da Uber pode ser mais uma a entrar no mercado de táxis autônomos", "url": "https://olhardigital.com.br/2026/09/06/carros-e-tecnologia/empresa-de-fundador-da-uber-pode-ser-mais-uma-a-entrar-no-mercado-de-taxis-autonomos/", "fonte_id": "olhar_digital", "data_pub": "2026-09-06T20:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A empresa Atoms, fundada por Travis Kalanick, levantou US$ 1,7 bilhão e está preparando-se para expandir suas operações no segmento de táxis autônomos.", "titulo_pt": "Empresa fundada por travis kalanick pode entrar no mercado de táxis autônomos", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 149571, "titulo": "Europa lança 1º foguete orbital do continente partindo do solo Ártico", "url": "https://www.cnnbrasil.com.br/ciencia/europa-lanca-1o-foguete-orbital-do-continente-partindo-do-solo-artico/", "fonte_id": "cnn_brasil", "data_pub": "2026-09-06T20:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O primeiro foguete orbital da Europa foi lançado do solo ártico, na região polar da Noruega. O veículo alemão Spectrum transportava apenas satélites, sem tripulação.", "titulo_pt": "Europa lança primeiro foguete orbital do continente partindo do solo Ártico", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 149546, "titulo": "Smartwatch bom e bonito: veja uma seleção de relógios inteligentes em promoção na Amazon", "url": "https://olhardigital.com.br/2026/09/06/reviews/smartwatch-bom-e-bonito-veja-uma-selecao-de-relogios-inteligentes-em-promocao-na-amazon/", "fonte_id": "olhar_digital", "data_pub": "2026-09-06T19:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon está oferecendo smartwatches com bons preços para quem busca monitorar a saúde, acompanhar treinos ou receber notificações no pulso. Foram selecionados três modelos que atendem a diferentes perfis e necessidades.", "titulo_pt": "Smartwatch bom e bonito: veja seleção de relógios inteligentes em promoção na Amazon", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 149669, "titulo": "Como o smartwatch sabe que você está dormindo? A ciência do relógio", "url": "https://canaltech.com.br/smartwatch/como-o-smartwatch-sabe-que-voce-esta-dormindo-a-ciencia-do-relogio/", "fonte_id": "canaltech", "data_pub": "2026-09-06T19:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um smartwatch usa uma combinação de sensores ópticos, acelerômetro, giroscópio e algoritmos de inteligência artificial para monitorar sinais invisíveis do corpo, como frequência cardíaca, oxigenação do sangue e movimentos, permitindo que ele determine se a pessoa está dormindo. As luzes que piscam na parte de trás do relógio são parte de um sistema complexo que transforma esses sinais em informações úteis.", "titulo_pt": "Como o smartwatch sabe que você está dormindo?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 149547, "titulo": "Com novo CEO, Apple pode fazer mudanças na App Store para garantir mais receita", "url": "https://olhardigital.com.br/2026/09/06/pro/com-novo-ceo-apple-pode-fazer-mudancas-na-app-store-para-garantir-mais-receita/", "fonte_id": "olhar_digital", "data_pub": "2026-09-06T19:21:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O novo CEO da Apple, John Ternus, pode introduzir mudanças nas políticas da App Store com o objetivo de aumentar as receitas da empresa. Essas mudanças podem afetar como os desenvolvedores publicam e lucram com suas aplicações.", "titulo_pt": "Com novo CEO, Apple pode fazer mudanças na App Store para garantir mais receita", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 149548, "titulo": "Sua biblioteca Xbox merece uma atualização — confira esta seleção em promoção", "url": "https://olhardigital.com.br/2026/09/06/reviews/sua-biblioteca-xbox-merece-uma-atualizacao-confira-esta-selecao-em-promocao/", "fonte_id": "olhar_digital", "data_pub": "2026-09-06T19:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon oferece uma seleção de jogos Xbox em promoção, incluindo títulos de RPG, aventura e futebol. Há opções para diferentes gostos no ecossistema Xbox.", "titulo_pt": "Sua biblioteca Xbox merece uma atualização — confira esta seleção em promoção", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 149788, "titulo": "Europe has its first commercial orbital rocket", "url": "https://www.theverge.com/science/990906/isar-aerospace-europe-orbital-rocket-launch", "fonte_id": "the_verge", "data_pub": "2026-09-06T19:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A empresa alemã Isar Aerospace realizou com sucesso o lançamento da primeira foguete orbital comercial europeu. O veículo Spectrum, em duas etapas, foi lançado com sucesso para a órbita baixa a partir de um espaçoporto na Noruega.", "titulo_pt": "Europa realiza seu primeiro lançamento comercial de foguete orbital", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 149549, "titulo": "God of War, GTA VI e mais: uma seleção de jogos PS5 em promoção na Amazon", "url": "https://olhardigital.com.br/2026/09/06/reviews/god-of-war-gta-vi-e-mais-uma-selecao-de-jogos-ps5-em-promocao-na-amazon/", "fonte_id": "olhar_digital", "data_pub": "2026-09-06T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon oferece promocações em jogos PS5, incluindo God of War Ragnarök, GTA VI e outros títulos. Três jogos são destacados como opções recomendadas para compra.", "titulo_pt": "God of War, GTA VI e mais: seleção de jogos PS5 em promoção na Amazon", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 149670, "titulo": "O que ainda funciona para bloquear anúncios no Chrome?", "url": "https://canaltech.com.br/software/o-que-ainda-funciona-para-bloquear-anuncios-no-chrome/", "fonte_id": "canaltech", "data_pub": "2026-09-06T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Chrome mudou a estrutura dos extensões, afetando os bloqueadores de anúncios que usavam o padrão Manifest V2. No entanto, ainda existem soluções como o uBlock Origin Lite que podem ser utilizadas para bloquear anúncios.", "titulo_pt": "O que ainda funciona para bloquear anúncios no Chrome?", "veiculo": "Canaltech", "pais": "Brasil", "classe": "C"}, {"id": 149550, "titulo": "Hora de imprimir mais gastando menos: veja estas ofertas de impressoras na Amazon", "url": "https://olhardigital.com.br/2026/09/06/reviews/hora-de-imprimir-mais-gastando-menos-veja-estas-ofertas-de-impressoras-na-amazon/", "fonte_id": "olhar_digital", "data_pub": "2026-09-06T18:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Amazon está oferecendo impressoras multifuncionais com boas especificações e preços competitivos. São três opções destacadas para uso em casa ou no home office.", "titulo_pt": "Hora de imprimir mais gastando menos: confira ofertas de impressoras na Amazon", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}], "tecnologia__eventos": [], "ciencia": [{"id": 149793, "titulo": "Advanced optical imaging reveals hidden activity in blood immune cells", "url": "https://phys.org/news/2026-09-advanced-optical-imaging-reveals-hidden.html", "fonte_id": "phys_org", "data_pub": "2026-09-06T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Imagens ópticas avançadas revelam atividades ocultas em células imunológicas do sangue. A amostra sanguínea padrão contém uma variedade de células imunológicas úteis para diagnosticar doenças e condições de saúde, mas métodos tradicionais de identificação podem alterar as células durante o processo de preparação.", "titulo_pt": "Imagem óptica avançada revela atividades ocultas em células imunológicas do sangue", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 149789, "titulo": "Popular brain supplement linked to shorter lifespan in men", "url": "https://www.sciencedaily.com/releases/2026/09/260904000330.htm", "fonte_id": "science_daily", "data_pub": "2026-09-06T21:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo envolvendo mais de 270.000 pessoas associou níveis mais altos de tirosina no sangue a uma menor expectativa de vida nos homens. A suplementação com tirosina, um aminoácido encontrado em alimentos ricos em proteína, pode potencialmente reduzir a expectativa de vida masculina em cerca de um ano, sem efeitos significativos em mulheres.", "titulo_pt": "Suplemento popular para o cérebro relacionado a menor expectativa de vida em homens", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 149790, "titulo": "Scientists find breast cancer cells hiding behind protective “shields”", "url": "https://www.sciencedaily.com/releases/2026/09/260904000326.htm", "fonte_id": "science_daily", "data_pub": "2026-09-06T20:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores mapearam tumores de mama com detalhes impressionantes e descobriram pequenos grupos de células de câncer em repouso que podem ajudar a explicar por que o câncer pode retornar após o tratamento. Essas células, que não se dividem rapidamente, podem basicamente entrar em hibernação, permitindo que evitem o quimioterapia e se ativen mais tarde.", "titulo_pt": "Cientistas descobrem células do câncer de mama ocultas atrás de 'escudos' protetores", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 149108, "titulo": "Ignacio Morgado, neurocientífico: \"Hasta donde podemos demostrarlo cientificamente, solo los humanos podemos pensar que pensamos\"", "url": "https://www.clarin.com/internacional/ignacio-morgado-neurocientifico-podemos-demostrarlo-cientificamente-solo-humanos-podemos-pensar-pensamos_0_3qc4Sj6TMF.html", "fonte_id": "clarin", "data_pub": "2026-09-06T17:29:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O neurocientista Ignacio Morgado afirma que, com base em evidências científicas, apenas os humanos têm consciência de que pensam. Um gato que se mira no espelho não reconhece a si mesmo, enquanto os humanos possuem essa capacidade, tornando-nos a espécie mais singular do planeta.", "titulo_pt": "Ignacio Morgado, neurocientífico: 'até onde podemos demonstrar cientificamente, apenas os humanos podem pensar que pensam'", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 149792, "titulo": "This lifestyle program improved cognition 55% more than basic health advice", "url": "https://www.sciencedaily.com/releases/2026/09/260903064246.htm", "fonte_id": "science_daily", "data_pub": "2026-09-06T17:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Adultos mais velhos em risco de demência melhoraram sua memória e pensamento após seguir programas de estilo de vida que combinam exercícios, alimentação saudável, treinamento cognitivo e engajamento social. Os participantes que receberam orientação regular e apoio estruturado melhoraram significativamente mais do que aqueles que receberam apenas conselhos gerais sobre saúde.", "titulo_pt": "Este programa de estilo de vida melhorou a cognição em 55% mais que conselhos básicos sobre saúde", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 149388, "titulo": "Six unusual structures identified at Earth's core-mantle boundary with the help of deep learning", "url": "https://phys.org/news/2026-09-unusual-earth-core-mantle-boundary.html", "fonte_id": "phys_org", "data_pub": "2026-09-06T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado na revista JGR Solid Earth utilizou aprendizado de máquina para analisar ondas sísmicas e identificar seis estruturas incomuns na interface entre o núcleo e a crosta funda da Terra. Essas estruturas, que eram anteriormente visíveis apenas como manchas dispersas, agora aparecem como seis faixas contínuas de irregularidades.", "titulo_pt": "Seis estruturas incomuns identificadas na interface núcleo-crusta com a ajuda do aprendizado de máquina", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 148958, "titulo": "Estudo sugere relação do xilitol com aumento de doenças cardiovasculares", "url": "https://www.metropoles.com/colunas/claudia-meireles/estudo-sugere-relacao-do-xilitol-com-aumento-de-doencas-cardiovasculares", "fonte_id": "metropoles", "data_pub": "2026-09-06T16:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo, apresentado na Alemanha, sugere uma relação entre os níveis de xilitol no sangue e o aumento das chances de desenvolver doenças cardiovasculares graves.", "titulo_pt": "Estudo sugere relação do xilitol com aumento de doenças cardiovasculares", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 149404, "titulo": "On this day in space! Sept. 6, 1947: The US Navy launches 1st V-2 rocket at sea in ballistic missile test", "url": "https://www.space.com/space-exploration/on-this-day-in-space-september-6-2026", "fonte_id": "space_com", "data_pub": "2026-09-06T16:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 6 de setembro de 1947, a Marinha dos Estados Unidos lançou, pela primeira vez, um foguete V-2 a partir de uma embarcação de aviação. Este teste marítimo foi importante para a evolução das tecnologias balísticas.", "titulo_pt": "6 De setembro de 1947: marinha dos EUA realiza primeiro lançamento de foguete V-2 a partir de navio", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 149405, "titulo": "SpaceX Falcon 9 rocket launches 27 Starlink satellites, lands on ship at sea (video)", "url": "https://www.space.com/space-exploration/launches-spacecraft/spacex-starlink/group-15-24-launch-ocisly", "fonte_id": "space_com", "data_pub": "2026-09-06T15:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A SpaceX lançou mais uma lote de satélites Starlink do espaço da costa central da Califórnia. O foguete Falcon 9 colocou 27 satélites em órbita e pousou em uma embarcação no mar.", "titulo_pt": "Spacex lança 27 satélites Starlink e pousa foguete no mar", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 149791, "titulo": "Scientists discover a hidden problem with this popular sugar substitute", "url": "https://www.sciencedaily.com/releases/2026/09/260903064251.htm", "fonte_id": "science_daily", "data_pub": "2026-09-06T15:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores da Washington University em St. Louis descobriram que o sorbitol, um açúcar de álcool comumente usado em doces sem açúcar, chiclete e outros alimentos com baixas calorias, pode ser convertido no fígado em uma forma de frutose, potencialmente causando efeitos metabólicos prejudiciais similares à frutose.", "titulo_pt": "Cientistas descobrem problema oculto com este substituto de açúcar popular", "veiculo": "Science Daily", "pais": "EUA", "classe": "C"}, {"id": 149389, "titulo": "The extinct American 'cheetah' was not a cheetah after all", "url": "https://phys.org/news/2026-09-extinct-american-cheetah.html", "fonte_id": "phys_org", "data_pub": "2026-09-06T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Miracinonyx trumani, anteriormente conhecido como 'girafa-veloz' americano, era mais relacionado a pumas do que a cebus. Alguns grupos dessa espécie que viviam próximos ao Ártico se alimentavam quase exclusivamente de peixes, desafiando a suposição antiga de que esses animais caçavam presas rápidas como pronghorns.", "titulo_pt": "O 'girafa-veloz' americano não era realmente um guepardo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 149406, "titulo": "Feel the Force with these 10 out-of-this-world Lego Star Wars starships", "url": "https://www.space.com/entertainment/space-toys-lego/feel-the-force-with-these-ten-out-of-this-world-lego-star-wars-starships", "fonte_id": "space_com", "data_pub": "2026-09-06T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo lista dez naves icônicas do universo Star Wars disponíveis em Lego Star Wars. Independente de ser um Jedi ou um Sith, os fãs da série podem querer adquirir essas naves.", "titulo_pt": "Sinta a força com essas 10 naves estelares Lego Star Wars", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 149390, "titulo": "Extreme pressure turns blue pigment into record-long single-atom copper chains", "url": "https://phys.org/news/2026-09-extreme-pressure-blue-pigment-atom.html", "fonte_id": "phys_org", "data_pub": "2026-09-06T14:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas criaram uma das cadeias de cobre com átomos únicos mais longas até o momento, alcançando recordes que poderiam servir como fios moleculares. Essas cadeias de cobre podem permitir que os fios eletrônicos sejam miniaturizados além das dimensões convencionais, devido à diminuição constante do tamanho dos componentes tecnológicos baseados em silício.", "titulo_pt": "Pressão extrema transforma pigmento azul em cadeias de átomos únicos de cobre recordistas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 149391, "titulo": "How algorithms are making our environments bland", "url": "https://phys.org/news/2026-09-algorithms-environments-bland.html", "fonte_id": "phys_org", "data_pub": "2026-09-06T13:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O cor de ano para 2026 da Pantone é branco, chamado de Dançarina de Nuvem, que é descrito como 'branco elevado'. Esta escolha reflete uma tendência crescente de redução do uso de cores em nosso mundo visual.", "titulo_pt": "Como os algoritmos estão tornando nossos ambientes monossilábicos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 149392, "titulo": "'Quiet' pulsar suddenly reveals three glitches in 15 years of observations", "url": "https://phys.org/news/2026-09-quiet-pulsar-suddenly-reveals-glitches.html", "fonte_id": "phys_org", "data_pub": "2026-09-06T12:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos observaram três glissadas em um pulsar chamado PSR J1637−4642, usando dados de mais de 15 anos coletados pelo telescópio radioelétrico Parkes. Este pulsar, um jovem núcleo de estrela, não apresentava glissadas desde sua descoberta.", "titulo_pt": "Pulsar 'silencioso' revela três glissadas em 15 anos de observações", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 148979, "titulo": "Cerveja 'zero' é mesmo sem álcool? Entenda o que dizem os rótulos", "url": "https://exame.com/ciencia/cerveja-zero-e-mesmo-sem-alcool-entenda-o-que-dizem-os-rotulos/", "fonte_id": "exame", "data_pub": "2026-09-06T12:07:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Processos de produção podem deixar vestígios de álcool em cervejas 'zero'. Marcas e consumidores discutem como essa informação deve ser apresentada nos rótulos.", "titulo_pt": "Cerveja 'zero' é mesmo sem álcool? Entenda o que dizem os rótulos", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 149480, "titulo": "‘Precisamos estar onde o jovem se diverte’, diz diretora da Tic Tac no Rock in Rio", "url": "https://veja.abril.com.br/cultura/precisamos-estar-onde-o-jovem-se-diverte-diz-diretora-da-tic-tac-no-rock-in-rio/", "fonte_id": "veja", "data_pub": "2026-09-06T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Laura Teixeira, diretora da Tic Tac, participou do Rock in Rio e enfatizou a importância de estar presente onde os jovens se divertem. Ela conversou com a coluna GENTE sobre a presença da marca no evento.", "titulo_pt": "‘Precisamos estar onde o jovem se diverte’, diz diretora da Tic Tac no Rock in Rio", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 149801, "titulo": "Netflix Bets ‘Ink’ and It
