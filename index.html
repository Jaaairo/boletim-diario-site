<html lang="pt-BR">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

const D = {"gerado_em": "16/08/2026 07:31", "stats": {"noticias_novas": 1416, "resumos_gerados": 254}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "A campanha eleitoral para as eleições de 2026 começou oficialmente neste domingo (16/8), com a liberação da propaganda nas ruas e na internet. O presidente Luiz Inácio Lula da Silva e o senador Flávio Bolsonaro (PL) lançaram suas campanhas. Lula escolheu um palanque sindical que foi crucial para sua ascensão política. O projeto de lei dos minerais críticos foi aprovado pelo presidente do Senado, João Alberto de Alcolumbre, após uma conversa com Lula. Paralelamente, o Tribunal Superior Eleitoral (TSE) intensificou a fiscalização das grandes plataformas digitais para prevenir a disseminação de desinformação. Além disso, o ministro Flávio Dino, do Supremo Tribunal Federal (STF), se queixou de 'agressões e injustiças' após a decisão de investigar os equipamentos eletrônicos de jornalistas, o que reforçou a tensão entre os poderes.", "mundo": "A Ucrânia lançou 600 drones em uma das maiores operações aéreas contra a Rússia, um evento significativo no contexto da guerra. Em outros desenvolvimentos, a Coreia do Norte reafirmou suas relações com a Rússia durante o Dia da Libertação Coreana. Por outro lado, a China intensificou suas regulamentações sobre trusts estabelecidos fora do país, com o objetivo de combater a evasão fiscal. O Brasil acionou a Lei da Reciprocidade contra os Estados Unidos, causando preocupações no setor produtivo. Além disso, o governo brasileiro está ampliando sua presença em feiras internacionais para abrir mercados para produtos agropecuários. A Coreia do Sul demitiu seu negociador-chefe de comércio diante da pressão tarifária dos Estados Unidos, enquanto a China apoia o Brasil em sua disputa na OMC contra tarifas de importação dos EUA.\n\nUm ataque aéreo com drones atingiu Moscou, conforme informou o governador regional Andrey Vorobyov. Paralelamente, missilistas russos realizaram ataques em Kiev e outras cidades ucranianas, resultando em três mortes e mais de uma dúzia de feridos. Em resposta, a Ucrânia lançou um ataque com drones em massa contra Moscou, levando as autoridades russas a relatar a downing de 20 drones ucranianos na região de Moscou. No sul do Líbano, Israel intensificou seus ataques, resultando em 11 mortos e 19 feridos. Além disso, a Ucrânia retomou os ataques no Gaza, causando várias mortes palestinas e feridos. Na fronteira com o Irã, os Estados Unidos estão preparados para aplicar uma pressão econômica inédita. Israel ameaça novos ataques no sul do Líbano, enquanto a Alemanha apoia Israel em desacordo com a lei internacional, demonstrando seu compromisso com o regime de Benjamin Netanyahu. A Austrália foi pressionada a liderar a proteção das infraestruturas de cabos submarinos no Indo-Pacífico, devido à crescente ameaça de ataques híbridos. Por fim, a Indonésia enfrentou um terremoto poderoso que causou dezenas de mortes e desencadeou deslizamentos de terra.", "economia": "A economia brasileira enfrenta desafios significativos, com a inflação alta e juros elevados pressionando os bolsos das famílias, conforme relata o Infomoney. No entanto, o Brasil pode desempenhar um papel crucial na luta contra a fome mundial, segundo Júnior Friboi, empresário da JBJ Agropecuária, em entrevista ao Exame. No cenário global, a China está se aproximando de se tornar a moeda dominante na África, com o yuan chinês ganhando espaço em instituições financeiras locais. Além disso, a descoberta de petróleo na bacia da Foz do Amazonas pela Petrobras abre novas perspectivas para o setor, mas também levanta questões sobre a gestão do dinheiro público.", "tecnologia": "A China enfrenta crescentes ameaças de empresas corporativas que seguem visões semelhantes às de Elon Musk, como carros elétricos, foguetes, robôs humanóides e implantes cerebrais. Essas empresas chinesas estão aproveitando o grande mercado interno e as cadeias de suprimento integradas do país, além da capacidade de fabricação em larga escala. Os EUA, por outro lado, buscam desenvolver seus próprios robôs humanóides, mas enfrentarão desafios significativos, já que a China já produz milhares de robôs humanóides. A inteligência artificial representa uma ameaça para o ensino online, que tem se expandido até as universidades, enquanto professores lutam contra a crescente fraude tecnológica. Além disso, a categoria de automobilismo elétrico, a Formula E, planeja ter pilotos femininas em sua lista de competidores em dois a três anos, um avanço em relação à história da Formula One, que já contou com três mulheres competindo.", "ciencia": "Cientistas chineses criaram uma inteligência artificial que pode prever o risco de depressão em jovens até quatro anos antes do início da doença, oferecendo uma importante vantagem para a saúde pública. A NASA também planeja realizar três novas missões lunares este ano, incluindo uma órbita que substituirá o Lunar Reconnaissance Orbiter. Além disso, pesquisadores do Minnesota conseguiram usar ferro de baixa pureza para produzir pirita, um material semicondutor conhecido como 'falso ouro', com potenciais aplicações econômicas e sustentáveis em futuros dispositivos eletrônicos e tecnologias.", "cultura": "O Festival Miacena, realizado em São Paulo, ocupou 19 espaços não convencionais com mais de 50 atividades gratuitas, integrando o calendário da Jornada do Patrimônio. Em outro evento cultural, a série 'Lanterna Verde', exibida na HBO, explora aspectos profundos da América e reavalia mitos dos super-heróis, com o herói Hal Jordan recarregando seu anel para obter poderes sobrenaturais. Ainda na temática musical, o flautista Rafael Beck e o pianista Felipe Montanaro apresentam o show inédito 'Fantasia Brasil' com um repertório de clássicos da música brasileira no programa 'Cena Musical', da TV Brasil, neste sábado (15), às 23h59.", "sociedade": "Hong Kong enfrenta um aumento da desigualdade de renda e envelhecimento populacional, ameaçando sua estrutura social, conforme relata o SCMP. Man Chi-ying, de 71 anos, cuida sozinha do marido Fung Yu-hoi, de 71 anos, que sofre de doença de Parkinson e precisa de ajuda para se vestir em alguns dias. Em outro artigo, a Folha de São Paulo destaca que o Sindicato dos Empregados no Comércio de Osasco e Região anunciou uma ação coletiva contra as demissões realizadas pelas Casas Bahia, pedindo a reintegração dos funcionários e indenização por dano moral, considerando que as demissões foram conduzidas sem diálogo. O jornal La Tercera destaca que o Chile está experimentando uma diminuição na taxa de natalidade e uma mudança na composição familiar, refletindo mudanças sociais e econômicas no país. A Economia do Marrocos está em crescimento, no entanto, especialistas afirmam que a persistente atração pela vida em países europeus está ligada a preocupações mais profundas, conforme informa o jornal Japan Times. Em outro artigo, a Metrópole destaca a expansão do programa Saúde Escolar da Prefeitura de São Paulo, que passa a atender jovens e adultos, ampliando o número de beneficiados para mais 37 mil pessoas.", "meio_ambiente": "Um terremoto de magnitude 7,7 na Indonésia causou ao menos 20 mortes e levou a uma evacuação em massa. As buscas por sobreviventes continuam. Paralelamente, novas imagens de satélite mostram que metade da Europa está em estado de seca, afetando rios como o Danúbio e o Rin. A seca no Danúbio tem causado danos significativos, com culturas destruídas e ciclistas percorrendo os leitos dos rios. Em Indiana, Estados Unidos, inundações deixaram pelo menos seis mortos e obrigaram o resgate de várias pessoas. As fortes chuvas em Chiba, Japão, resultaram em nove mortes e a evacuação de quase 500 pessoas. O pesquisador Kévin Jean destaca que ações ambientais são benéficas para a saúde e custam menos do que a inação. A Austrália, conhecida por sua fauna exuberante, tornou-se o epicentro das extinções no planeta, com 67 casos oficiais de extinção registrados.", "direitos_humanos": "Várias palestinas foram feridas em ataques realizados por colonos israelenses no Território Ocidental, conforme relatos do Middle East Eye. Os colonos atacaram três palestinos com agressões físicas e spray de pimenta em al-Masoudiya, causando ferimentos. Além disso, eles entraram na vila de al-Mughayyir e nas áreas adjacentes. Em uma declaração controversa, o senador australiano Tyron Whitten, do partido One Nation, afirmou que os pais que apoiam seus filhos transexuais estão cometendo 'abuso infantil', argumentando que só existem duas gêneros e que a identidade transexual é uma 'doença mental'. Estes eventos destacam as preocupações contínuas sobre direitos humanos, particularmente em relação à segurança e ao apoio às comunidades marginalizadas."}, "resumo_do_dia": {"politica_nacional": [{"id": 104041, "titulo": "VÍDEO: para que servem as pesquisas eleitorais", "url": "https://g1.globo.com/politica/eleicoes/2026/videos/noticia/2026/08/16/video-para-que-servem-as-pesquisas-eleitorais.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-16T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As pesquisas eleitorais servem para medir o cenário da disputa e auxiliar na compreensão do andamento da eleição. Elas não garantem a precisão do resultado final, mas funcionam como um termômetro para a campanha.", "titulo_pt": "Para que servem as pesquisas eleitorais?", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 104146, "titulo": "Candidato do PT no MA menciona Dino 16 vezes em plano de governo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/08/candidato-do-pt-no-ma-menciona-dino-16-vezes-em-plano-de-governo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-16T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato do PT ao governo do Maranhão, Felipe Camarão, menciona 16 vezes o ministro do STF Flávio Dino em seu programa de governo, que abrange 70 páginas. Camarão é atualmente vice-governador e se diz afilhado político de Dino, que governou o estado de 2015 a 2022.", "titulo_pt": "Candidato do PT no MA menciona Dino 16 vezes em plano de governo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 104358, "titulo": "PL dos Minerais Críticos deve ser apensado para acelerar o trâmite", "url": "https://www.metropoles.com/brasil/pl-dos-minerais-criticos-deve-ser-apensado-para-acelerar-o-tramite", "fonte_id": "metropoles", "data_pub": "2026-08-16T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei dos minerais críticos foi destravado pelo presidente do Senado, João Alberto de Alcolumbre, após uma conversa com o presidente Luiz Inácio Lula da Silva. A proposta faz parte da lista de prioridades do governo e de seus aliados para as eleições de 2026.", "titulo_pt": "PL dos Minerais Críticos deve ser apensado para acelerar trâmite", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 104359, "titulo": "Campanha começa neste domingo. Veja o que é permitido até 4 de outubro", "url": "https://www.metropoles.com/brasil/campanha-comeca-neste-domingo-veja-o-que-e-permitido-ate-4-de-outubro", "fonte_id": "metropoles", "data_pub": "2026-08-16T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha eleitoral começa oficialmente neste domingo (16/8). Durante este período, os candidatos poderão pedir votos e promover propaganda na internet.", "titulo_pt": "Campanha eleitoral começa neste domingo. Veja o que é permitido até 4 de outubro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 104363, "titulo": "Lula e Flávio iniciam campanha com corrida eleitoral acirrada", "url": "https://www.metropoles.com/brasil/lula-e-flavio-iniciam-campanha-com-corrida-eleitoral-acirrada", "fonte_id": "metropoles", "data_pub": "2026-08-16T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa recente indica uma distância menor entre Lula e Flávio nas intenções de voto, comparado às eleições de 2022 e 2018. A campanha entre os dois candidatos está sendo acirrada.", "titulo_pt": "Lula e Flávio iniciam campanha com corrida eleitoral acirrada", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 104364, "titulo": "Candidatos dão a largada na corrida presidencial neste domingo (16/8)", "url": "https://www.metropoles.com/brasil/candidatos-dao-a-largada-na-corrida-presidencial-neste-domingo-16-8", "fonte_id": "metropoles", "data_pub": "2026-08-16T07:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A partir deste domingo (16/8), está liberada a veiculação de propaganda eleitoral para as eleições gerais de 2026 tanto nas ruas quanto na internet.", "titulo_pt": "Candidatos dão a largada na corrida presidencial neste domingo (16/8)", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 104301, "titulo": "OPINIÃO. Lula, o escorpião e os sapos", "url": "https://braziljournal.com/opiniao-lula-o-escorpiao-e-os-sapos/", "fonte_id": "brazil_journal", "data_pub": "2026-08-16T03:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O déficit público atingiu 10% do PIB, expandindo-se de nichos técnicos para o cenário eleitoral. Isso ocorreu devido à fragilidade intencional do chamado 'arcabouço fiscal', um termo usado para descrever as políticas fiscais implementadas pelo governo petista.", "titulo_pt": "OPINIÃO: lula, o escorpião e os sapos", "veiculo": "Brazil Journal", "pais": "Brasil", "classe": "B"}, {"id": 104042, "titulo": "Eleições ao Senado: Lula foca em governabilidade e Flávio em enfrentamento ao STF; veja candidatos e estratégias", "url": "https://g1.globo.com/politica/noticia/2026/08/16/eleicoes-ao-senado-lula-foca-em-governabilidade-e-flavio-em-enfrentamento-ao-stf-veja-candidatos-e-estrategias.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-16T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A eleição para o Senado em 2026 está ganhando destaque nas campanhas do presidente Luiz Inácio Lula da Silva (PT) e do senador Flávio Bolsonaro (PL). O Senado renovará dois terços de suas vagas, totalizando 54 dos 81 assentos em disputa nas urnas.", "titulo_pt": "Eleições ao Senado: lula e Flávio bolsonaro focam em suas estratégias; veja candidatos e estratégias", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 104043, "titulo": "Campanha eleitoral começa neste domingo; entenda o que muda e o que os candidatos podem fazer agora", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/16/campanha-eleitoral-comeca-neste-domingo-entenda-o-que-muda.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-16T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha eleitoral começa neste domingo (16), permitindo que os candidatos façam propaganda nas ruas e na internet. A partir desta data, eles podem pedir voto explicitamente, realizar comícios, caminhadas e passeatas, além de distribuir material gráfico e fazer anúncios em jornais, dentro dos limites legais.", "titulo_pt": "Campanha eleitoral começa neste domingo; entenda o que muda e o que os candidatos podem fazer agora", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 104044, "titulo": "Candidatos à Presidência iniciam campanha neste domingo; veja eventos programados", "url": "https://g1.globo.com/politica/eleicoes/2026/noticia/2026/08/16/candidatos-a-presidencia-iniciam-campanha-neste-domingo-veja-eventos-programados.ghtml", "fonte_id": "g1_politica", "data_pub": "2026-08-16T03:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A campanha eleitoral para presidente começou oficialmente neste domingo (16), permitindo que os candidatos solicitem votos e organizem eventos como comícios e carreatas. A propaganda na internet está liberada, enquanto a televisão e rádio só começam a ter propaganda em 28 de agosto.", "titulo_pt": "Candidatos à Presidência iniciam campanha neste domingo; veja eventos programados", "veiculo": "G1 Política", "pais": "Brasil", "classe": "A"}, {"id": 104147, "titulo": "Lula começa campanha no palanque sindical que o projetou para a política", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/lula-comeca-campanha-no-palanquesindical-que-o-projetou-para-a-politica.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-16T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lula inicia sua campanha à reeleição em um palanque sindical que o projetou para a política. A imagem de Lula discursando em um estádio lotado, sobre uma mesa, é uma referência a um movimento que surgiu sem intenções partidárias, mas que se formou em torno da liderança do atual presidente da República.", "titulo_pt": "Lula inicia campanha no palanque sindical que o projetou para a política", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 104148, "titulo": "Tarcísio abre campanha em Osasco ao lado do Podemos, partido em ascensão em São Paulo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/tarcisio-abre-campanha-em-osasco-ao-lado-do-podemos-partido-em-ascensao-em-sao-paulo.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-16T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Tarcísio de Freitas (Republicanos) iniciou sua campanha eleitoral em Osasco ao lado do Podemos, partido em ascensão em São Paulo, que tem se beneficiado de deputados com bom desempenho nas urnas e origem na segurança pública.", "titulo_pt": "Tarcísio inicia campanha em Osasco ao lado do Podemos, partido em ascensão em São Paulo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 104149, "titulo": "TSE aperta fiscalização de big techs, mas tempo e equipe são gargalos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/tse-aperta-fiscalizacao-de-big-techs-mas-tempo-e-equipe-sao-gargalos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-16T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O TSE está utilizando um novo instrumento que obriga as grandes plataformas digitais a fornecerem dados detalhados sobre como elas atuam para cumprir as regras eleitorais e prevenir desinformação. No entanto, o tempo e a equipe disponíveis são considerados gargalos nesse processo.", "titulo_pt": "TSE intensifica fiscalização de grandes plataformas, mas enfrenta limitações de tempo e equipe", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 104150, "titulo": "Dono de banca de jornal de Curitiba vota 'em quem tem mais chance de derrotar PT'", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/dono-de-banca-de-jornal-de-curitiba-vota-em-quem-tem-mais-chance-de-derrotar-pt.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-16T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O proprietário de uma banca de jornal localizada no centro de Curitiba expressa sua desaprovação pelo Partido dos Trabalhadores (PT).", "titulo_pt": "Dono de banca de jornal de Curitiba vota contra o PT", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 104151, "titulo": "Mesmo se Flávio perder, direita Master deve ganhar todo o resto", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/celso-rocha-de-barros/2026/08/mesmo-se-flavio-perder-direita-master-deve-ganhar-todo-o-resto.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-16T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As forças políticas que beneficiaram com o Master, tentaram salvar o Master e receberam dinheiro do Master devem ser as grandes vencedoras da eleição deste ano.", "titulo_pt": "Mesmo se Flávio perder, forças políticas envolvidas com o Master devem ganhar", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 104152, "titulo": "Mudanças no Nordeste e direita competitiva testam solidez do eleitorado lulista", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/08/mudancas-no-nordeste-edireita-competitiva-testamsolidez-do-eleitorado-lulista.shtml", "fonte_id": "folha_poder", "data_pub": "2026-08-16T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Moradores das cidades vizinhas participam de uma Missa do Vaqueiro em Serrita, no sertão central de Pernambuco. O evento é marcado por um ar grave, similar a uma procissão, com homens e mulheres montados em cavalos.", "titulo_pt": "Mudanças no Nordeste e direita competitiva testam solidez do eleitorado lulista", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 105374, "titulo": "'This goes beyond showcasing technological soft power': China's new moon map signals bold space ambitions (video)", "url": "https://www.space.com/astronomy/moon/this-goes-beyond-showcasing-technological-soft-power-chinas-new-moon-map-signals-bold-space-ambitions-video", "fonte_id": "space_com", "data_pub": "2026-08-16T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nova cartografia lunar, que inclui uma cronologia e dados sobre o lado oculto da lua, e um padrão cartográfico nacional, indicam as ambiciosas intenções chinesas em relação ao mapeamento do sistema solar.", "titulo_pt": "Esta vai além de mostrar poder tecnológico: nova cartografia lunar sinaliza ambiciosas intenções espaciais da china", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 104940, "titulo": "Germany has chosen Israel over international law", "url": "https://www.middleeasteye.net/opinion/germany-has-chosen-israel-over-international-law", "fonte_id": "middle_east_eye", "data_pub": "2026-08-16T09:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Alemanha escolheu Israel sobre a lei internacional, de acordo com um artigo publicado em 8 de maio de 2026. Dois eventos recentes na Alemanha demonstraram o país's compromisso com o regime de Benjamin Netanyahu, israelense, em detrimento de sua própria democracia.", "titulo_pt": "Alemanha escolheu Israel sobre a lei internacional", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 104905, "titulo": "Nato, 'il drone abbattuto in Romania sembra essere russo'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/16/nato-il-drone-abbattuto-in-romania-sembra-essere-russo_a0b69533-0d16-464a-8932-b333118b5cde.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-16T09:56:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Investigações continuam sobre o drone abatido na Romênia, cuja origem ainda não foi confirmada. Até o momento, não se sabe se o drone era de origem russa.", "titulo_pt": "Nato, drone abatido na romênia parece ser russo, mas detalhes estão sendo investigados", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 104906, "titulo": "Europei atletica: la felicità di Riva 'dal km 40 stavo bene e ho atteso la volata'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/16/europei-atletica-la-felicita-di-riva-dal-km-40-stavo-bene-e-ho-atteso-la-volata_4988d041-70ab-415d-9fab-ab228ae8f81f.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-16T09:54:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O atleta Riva se sentiu bem a partir do 40º km na maratona e aguardou a finalização da corrida. Ele corria com confiança nos seus meios durante a maratona.", "titulo_pt": "Maratona azul prata: 'estava confiante nos meus meios'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 104777, "titulo": "🔴 Live: Ukraine launches 600 drones at Russia, one of its largest aerial attacks of the war", "url": "https://www.france24.com/en/europe/20260816-live-moscow-targeted-by-600-drones-overnight-explosions-heard-in-kyiv", "fonte_id": "france24", "data_pub": "2026-08-16T09:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Ucrânia lançou 600 drones em uma das maiores operações aéreas do conflito, atacando a Rússia. A ação envolveu um grande número de drones e é considerada uma das operações mais significativas até o momento.", "titulo_pt": "Ucrânia lança 600 drones na Rússia, uma das maiores operações aéreas do conflito", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 104825, "titulo": "Bus crash in Hungary kills at least 12", "url": "https://www.dw.com/en/bus-crash-in-hungary-kills-at-least-12/a-78387230?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-08-16T09:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ônibus que caiu em um acidente na Hungria deixou pelo menos 12 pessoas mortas. O motorista do ônibus, que transportava peregrinos poloneses, foi preso pela polícia.", "titulo_pt": "Acidente de ônibus na hungria mata ao menos 12 pessoas", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 104907, "titulo": "Pizzaballa a Taybeh, farò il possibile per tutelare presenza cristiana", "url": "https://www.ansa.it/sito/notizie/topnews/2026/08/16/pizzaballa-a-taybeh-faro-il-possibile-per-tutelare-presenza-cristiana_f15c0637-7ece-4504-b67d-0c3db11741dd.html", "fonte_id": "ansa_italy", "data_pub": "2026-08-16T09:47:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O vilarejo de Taybeh, na Cisjordânia, foi fechado após ataques de colonos. O prefeito de Pizzaballa declarou que fará o possível para proteger a presença cristã no local.", "titulo_pt": "Pizzaballa em Taybeh: farei o possível para tutelar a presença cristã", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 104761, "titulo": "Divisions within Iran's leadership weigh on talks with the US", "url": "https://www.lemonde.fr/en/international/article/2026/08/16/divisions-within-iran-s-leadership-weigh-on-talks-with-the-us_6756559_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-16T09:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As Forças Revolucionárias controlam não apenas as operações militares, mas também impõem suas demandas ao presidente iraniano e a sua equipe negociadora, de acordo com o historiador Jean-Pierre Filiu.", "titulo_pt": "Divisões na liderança do Irã pesam nas negociações com os EUA", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 104241, "titulo": "Governo aposta na reputação do agro para abrir mercados no mundo", "url": "https://www.cnnbrasil.com.br/agro/governo-aposta-na-reputacao-do-agro-para-abrir-mercados-no-mundo/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-16T08:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Agricultura está ampliando sua presença em feiras internacionais e intensificando o diálogo técnico com parceiros comerciais, visando ultrapassar as 700 aberturas de novos mercados para produtos agropecuários. O governo destaca a reputação do agronegócio como um ativo importante para a expansão comercial.", "titulo_pt": "Governo aposta na reputação do agronegócio para abrir novos mercados", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 104941, "titulo": "Israeli police ease restrictions on Jewish prayer in Al-Aqsa complex", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israeli-police-ease-restrictions-jewish-prayer-al-aqsa-compound", "fonte_id": "middle_east_eye", "data_pub": "2026-08-16T08:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades policiais israelenses relaxaram as restrições sobre a oração judaica no Complexo Al-Aqsa. Agora, os fiéis podem trazer livros de oração para o local, após terem sido permitidos lenços de oração no mês anterior. Essas mudanças violam o Acordo de Status Quo que administra o local.", "titulo_pt": "Polícia israelense alivia restrições para oração judaica no complexo Al-Aqsa", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 104942, "titulo": "Israel threatens further attacks on Lebanon", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/israel-threatens-fresh-attacks-lebanon", "fonte_id": "middle_east_eye", "data_pub": "2026-08-16T08:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro de Defesa de Israel, Israel Katz, ameaçou novos ataques no sul do Líbano, afirmando que 'nenhuma conta em qualquer cenário permanecerá aberta. Vamos atacar com toda a força aqueles que prejudicam nossos soldados e cidadãos.' No sábado, o exército israelense matou pelo menos 11 pessoas e feriu 19 outras no sul do Líbano.", "titulo_pt": "Israel ameaça novos ataques ao líbano", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 104766, "titulo": "Mass drone attack hits Moscow as Russia launches deadly strikes in Ukraine", "url": "https://www.lemonde.fr/en/international/article/2026/08/16/mass-drone-attack-hits-moscow-as-russia-launches-deadly-strikes-in-ukraine_6756558_4.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-16T08:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um ataque a drone massivo atingiu Moscou, segundo o governador regional de Moscou, Andrey Vorobyov. Em paralelo, missilistas russos realizaram ataques em Kiev e outras cidades ucranianas, resultando em três mortes e mais de uma dúzia de feridos.", "titulo_pt": "Ataque a drone massivo atinge moscou enquanto Rússia realiza ataques mortíferos na Ucrânia", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 104995, "titulo": "Unrelenting Russian anti-war protesters in Japan fight through inescapable doubt", "url": "https://www.japantimes.co.jp/community/2026/08/16/voices/russian-diaspora-anti-war-protests/", "fonte_id": "japan_times", "data_pub": "2026-08-16T07:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Depois de 4 anos e meio protestando contra uma guerra que parece não ter fim, cidadãos russos no Japão afirmam que seu trabalho continua essencial para a causa.", "titulo_pt": "Protestantes russos no Japão persistem em sua luta contra uma guerra sem perspectiva de fim", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 104943, "titulo": "Former UAE presidential aide's post mocking Pakistan exposes unease over Mecca pact", "url": "https://www.middleeasteye.net/news/emirati-academics-barbed-tweet-pakistan-exposes-uae-unease-over-mecca-pact", "fonte_id": "middle_east_eye", "data_pub": "2026-08-16T07:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um antigo assessor do presidente dos Emirados Árabes Unidos fez comentários irônicos sobre o Paquistão, levantando preocupações sobre a relação entre os países em relação ao pacto de Mecca. O analista político criticou o país por sua pobreza, analfabetismo e arsenal nuclear, causando reações negativas online.", "titulo_pt": "Comentário irônico sobre o paquistão de ex-assessor do presidente dos emirados árabes unidos expõe incômodo sobre pacto de Mecca", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 104251, "titulo": "Brasil aciona Lei da Reciprocidade contra EUA e setor produtivo vê riscos", "url": "https://www.cnnbrasil.com.br/economia/money/macroeconomia/brasil-aciona-lei-da-reciprocidade-contra-eua-e-setor-produtivo-ve-riscos/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-16T07:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil acionou a Lei da Reciprocidade contra os Estados Unidos, gerando preocupações no setor produtivo. Entidades defendem cautela e diálogo para evitar uma escalada comercial.", "titulo_pt": "Brasil aciona Lei da Reciprocidade contra EUA e setor produtivo vê riscos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 105059, "titulo": "How the US could squeeze Iran with economic isolation – and the risks involved", "url": "https://www.scmp.com/news/world/united-states-canada/article/3364177/how-us-could-squeeze-iran-economic-isolation-and-risks-involved?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-16T06:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O secretário do Tesouro dos EUA, Scott Bessent, afirma que o país está preparado para aplicar pressão econômica inédita contra a Irã. No entanto, há dúvidas sobre a eficácia dessas medidas, já que o Irã já enfrenta um bloqueio naval e milhares de sanções.", "titulo_pt": "Como os EUA poderiam isolar econômicamente a Irã e os riscos envolvidos", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 104367, "titulo": "STJ aponta fraude à execução em doação de imóvel de sócia", "url": "https://www.jota.info/tributos/stj-aponta-fraude-a-execucao-em-doacao-de-imovel-de-socia", "fonte_id": "jota", "data_pub": "2026-08-16T09:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A corte superior de justiça identificou uma fraude na execução de uma doação de um imóvel de uma das sócias. A doação foi realizada após a inscrição do débito em dívida ativa, e o bem continuou a ser usado pelo núcleo familiar.", "titulo_pt": "STJ identifica fraude em doação após inscrição em dívida ativa", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 104176, "titulo": "Pix e Panda Bonds: Brasil aprofunda relação financeira com a China", "url": "https://www.poder360.com.br/poder-china/pix-e-panda-bonds-brasil-aprofunda-relacao-financeira-com-a-china/", "fonte_id": "poder360", "data_pub": "2026-08-16T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O serviço de pagamentos chinês Panda Bonds expressou interesse em integrar-se ao Pix, sistema de pagamentos instantâneos do Brasil. Esta integração pode intensificar as tensões existentes entre o Brasil e os Estados Unidos.", "titulo_pt": "Pix e Panda Bonds: Brasil intensifica relações financeiras com a China", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 104368, "titulo": "Caso Discord: até onde pode ir a ANPD na aplicação do ECA Digital?", "url": "https://www.jota.info/opiniao-e-analise/artigos/caso-discord-ate-onde-pode-ir-a-anpd-na-aplicacao-do-eca-digital", "fonte_id": "jota", "data_pub": "2026-08-16T08:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O caso Discord levanta questionamentos sobre a aplicação do ECA Digital pela ANPD, com foco na suspensão de lives. O debate jurídico abrange plataformas além da Discord e testa o novo marco regulatório.", "titulo_pt": "Caso Discord: até onde a ANPD pode ir na aplicação do ECA Digital?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 104369, "titulo": "Onde o Brasil deveria apostar na indústria de semicondutores?", "url": "https://www.jota.info/opiniao-e-analise/artigos/onde-o-brasil-deveria-apostar-na-industria-de-semicondutores", "fonte_id": "jota", "data_pub": "2026-08-16T08:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil precisa definir em quais segmentos pode construir vantagem tecnológica. O país deve focar em áreas onde possa se destacar na indústria de semicondutores.", "titulo_pt": "Onde o Brasil deveria apostar na indústria de semicondutores?", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 104370, "titulo": "NR-4 e graus de risco: por que as empresas devem se preparar desde já", "url": "https://www.jota.info/opiniao-e-analise/artigos/nr-4-e-graus-de-risco-por-que-as-empresas-devem-se-preparar-desde-ja", "fonte_id": "jota", "data_pub": "2026-08-16T08:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Com a revisão prevista para dezembro, as empresas precisam mapear os impactos no SESMT e na CIPA agora. O NR-4 e os graus de risco devem fazer com que as empresas se preparem prontamente.", "titulo_pt": "NR-4 e graus de risco: por que as empresas devem se preparar desde já", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 104271, "titulo": "Renda recorde é engolida por inflação e juros altos, que espremem bolso das famílias", "url": "https://www.infomoney.com.br/economia/inadimplencia-inflacao-juros-altos-renda-recorde/", "fonte_id": "infomoney", "data_pub": "2026-08-16T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mesmo com renda e massa salarial em alta, a inflação elevada e os juros altos estão aumentando a inadimplência nas famílias. Especialistas apontam que alimentos mais caros e crédito mais caro pressionam o bolso dos brasileiros.", "titulo_pt": "Renda recorde é engolida por inflação e juros altos, que espremem bolso das famílias", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 104371, "titulo": "Crimes de Maio: o STJ e o despertar da magistratura interamericana no Brasil", "url": "https://www.jota.info/opiniao-e-analise/artigos/crimes-de-maio-o-stj-e-o-de acteria.html", "fonte_id": "phys_org", "data_pub": "2026-08-16T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vírus microscópicos que infectam bactérias poderiam, um dia, auxiliar na luta contra infecções resistentes a antibióticos. No entanto, antes disso, os cientistas precisam compreender como esses vírus funcionam, e a inteligência artificial pode fornecer uma poderosa ferramenta para isso.", "titulo_pt": "Natureza gastou bilhões de anos lutando contra bactérias. IA poderia nos ajudar a decifrar seus segredos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 105272, "titulo": "Lunar orbiter among upcoming NASA CLPS task orders", "url": "https://spacenews.com/lunar-orbiter-among-upcoming-nasa-clps-task-orders/", "fonte_id": "spacenews", "data_pub": "2026-08-15T23:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA planeja conceder três novas missões lunares este ano por meio de um programa de serviços comerciais, incluindo uma órbita que substituirá o Lunar Reconnaissance Orbiter.", "titulo_pt": "Órbita lunar entre as próximas missões comerciais da NASA", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 105247, "titulo": "How healthier farm animals can cut greenhouse gas emissions", "url": "https://phys.org/news/2026-08-healthier-farm-animals-greenhouse-gas.html", "fonte_id": "phys_org", "data_pub": "2026-08-15T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A perda de um bezerro em um rebanho leiteiro não é apenas um problema de mortalidade, mas também um desperdício de recursos como alimentos, água e gases de efeito estufa liberados durante a gestação da vaca, que não resultam em produção de leite, animais futuros ou receita.", "titulo_pt": "Como animais de criação mais saudáveis podem reduzir emissões de gases de efeito estufa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 104116, "titulo": "Nariz achatado é a razão por que os macacos nunca poderão falar como os humanos", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/08/nariz-achatado-e-a-razao-por-que-os-macacos-nunca-poderao-falar-como-os-humanos.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-08-15T19:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O nariz achatado dos macacos é a razão pela qual eles não podem falar como os humanos. A rinoplastia é a quinta cirurgia mais realizada no mundo, conforme relatório da Sociedade Espanhola de Cirurgia Plástica, Reparadora e Estética (Secpre), embora não seja motivada por questões de saúde.", "titulo_pt": "Nariz achatado dos macacos é a razão para não poderem falar como os humanos", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 105248, "titulo": "Exploring the moon will require rovers that can think for themselves", "url": "https://phys.org/news/2026-08-exploring-moon-require-rovers.html", "fonte_id": "phys_org", "data_pub": "2026-08-15T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA planeja enviar três pequenos rovers à lua com uma única instrução: trabalhem entre si para explorar uma área de terreno.", "titulo_pt": "Explorando a lua exigirá rovers que possam pensar por si mesmos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 105249, "titulo": "Topical clove oil for canine sarcoptic mange promises faster, plant-based treatment", "url": "https://phys.org/news/2026-08-topical-clove-oil-canine-sarcoptic.html", "fonte_id": "phys_org", "data_pub": "2026-08-15T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A erva-da-camponesa pode promover um tratamento mais rápido e baseado em plantas para a mange de sarcoptes em cães. Esta condição de pele, causada por microscópicas pulgas (Sarcoptes scabiei), é contagiosa e zoonótica e pode ser difícil de diagnosticar.", "titulo_pt": "Óleo de erva-da-camponesa promete tratamento mais rápido e plant-based para mange de sarcoptes em cães", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 105250, "titulo": "Early-universe plasma may have stopped dark photons from heating cosmos", "url": "https://phys.org/news/2026-08-early-universe-plasma-dark-photons.html", "fonte_id": "phys_org", "data_pub": "2026-08-15T16:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo artigo publicado na Physical Review Letters sugere que o fóton escuro, um candidato à matéria escura, não aqueceu o universo primitivo como se pensava anteriormente. Este descobrimento amplia significativamente a área para buscas experimentais e pode revolucionar a busca pela matéria escura.", "titulo_pt": "Plasma do universo primitivo pode ter impedido o aquecimento por fótons escuros", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 105251, "titulo": "Neptune's tiny moons tell the story of Triton's destructive capture", "url": "https://phys.org/news/2026-07-neptune-tiny-moons-story-triton.html", "fonte_id": "phys_org", "data_pub": "2026-08-15T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo publicado na Science Advances forneceu evidências espectroscópicas que apoiam a teoria de que Tritão, a lua mais grande de Netuno, foi capturado do Bando de Kuiper, causando uma grande perturbação no sistema de luas de Netuno no início do seu formação.", "titulo_pt": "As pequenas luas de netuno contam a história da captura destrutiva de tritão", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 105396, "titulo": "‘I thought – if I die, I’ve had a good innings’: producer James Ford on life, death and making an album from his hospital bed", "url": "https://www.theguardian.com/music/2026/aug/16/james-ellis-ford-music-producer-interview-lost-in-another-world-leukaemia-arctic-monkeys-florence-machine", "fonte_id": "guardian_culture", "data_pub": "2026-08-16T09:00:00Z", "idioma": "en",  "pais": "Brasil", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 104402, "titulo": "'O planeta em que nascemos não existe mais': o climatologista que alerta para epidemia de eventos climáticos extremos, mas se mantém otimista", "url": "https://www.bbc.com/portuguese/articles/crk5rx4y3xvo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-16T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um climatologista alerta para a aceleração dos eventos climáticos extremos devido às mudanças climáticas, destacando que o hemisfério norte está aquecendo quase duas vezes mais rápido que o sul. Apesar das preocupações, o cientista mantém uma postura otimista.", "titulo_pt": "O planeta em que nascemos não existe mais: o climatologista que alerta para eventos climáticos extremos, mas se mantém otimista", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 104244, "titulo": "Buscas por sobreviventes continuam após forte terremoto na Indonésia", "url": "https://www.cnnbrasil.com.br/internacional/buscas-por-sobreviventes-continuam-apos-forte-terremoto-na-indonesia/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-16T08:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Buscas por sobreviventes continuam após um forte terremoto de magnitude 7,7 na Indonésia. Equipes de resgate estão vasculhando os escombros de edifícios que desabaram.", "titulo_pt": "Buscas por sobreviventes continuam após forte terremoto na Indonésia", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 104888, "titulo": "New satellite images show Europe’s disappearing rivers due to drought", "url": "https://www.aljazeera.com/news/2026/8/16/new-satellite-images-show-europes-disappearing-rivers-due-to-drought?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-16T07:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Novas imagens de satélite mostram que metade da Europa está em estado de seca, com rios como o Danúbio e o Rin também afetados.", "titulo_pt": "Novas imagens de satélite mostram Europa em seca com rios em baixo nível", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 104628, "titulo": "Destroyed crops, riverbed cyclists and a ‘Rock of Starvation’: how drought has devastated the Danube", "url": "https://www.theguardian.com/news/ng-interactive/2026/aug/16/danube-drought-destroyed-crops-rock-of-starvation-climate-crisis", "fonte_id": "guardian_world", "data_pub": "2026-08-16T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A seca no Danúbio tem causado danos significativos, com culturas destruídas e ciclistas percorrendo leitos de rios. O 'Pedregulho da Fome', um rochedo que emerge durante períodos de baixa água, está de novo visível em Budapeste, um sinal histórico de escassez de água e perigo de fome.", "titulo_pt": "Pedregulho da fome, ciclistas nos leitos e seca devastadora no danúbio", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 104642, "titulo": "EE.UU.: Inundaciones en Indiana dejan al menos seis muertos y obligan a rescatar a decenas de personas", "url": "https://www.latercera.com/mundo/noticia/eeuu-inundaciones-en-indiana-dejan-al-menos-seis-muertos-y-obligan-a-rescatar-a-decenas-de-personas/", "fonte_id": "la_tercera", "data_pub": "2026-08-16T04:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Inundações em Indiana deixaram pelo menos seis mortos e obrigaram a resgate de várias pessoas. Em Indianápolis, as águas cobriram ruas e chegaram a residências, levando alguns moradores a abandonar suas casas usando canoas e pequenos barcos.", "titulo_pt": "Estados unidos: inundações em Indiana deixam ao menos seis mortos e obrigam resgate de decenas de pessoas", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 105007, "titulo": "Chiba downpour death toll rises to 9 with nearly 500 evacuated", "url": "https://www.japantimes.co.jp/news/2026/08/16/japan/chiba-rain-death-toll/", "fonte_id": "japan_times", "data_pub": "2026-08-16T01:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de mortos aumentou para nove devido às fortes chuvas em Chiba, e quase 500 pessoas foram evacuadas. Ao menos duas vítimas foram encontradas em veículos submersos.", "titulo_pt": "Óbitos por encharcamento em chiba sobem para 9 com quase 500 evacuados", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 104774, "titulo": "Climate change: 'It will always cost less to act today than to do nothing and repair the consequences'", "url": "https://www.lemonde.fr/en/summer-reads/article/2026/08/15/climate-change-it-will-always-cost-less-to-act-today-than-to-do-nothing-and-repair-the-consequences_6756547_183.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-15T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O pesquisador em saúde pública Kévin Jean discute os benefícios para a saúde dos políticas ambientais, um tópico frequentemente negligenciado nas discussões sobre o assunto.", "titulo_pt": "Clima: 'sempre custará menos agir hoje do que fazer nada e reparar as consequências'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 104769, "titulo": "Wildfires in Belgium force evacuations", "url": "https://www.lemonde.fr/en/environment/article/2026/08/15/wildfires-in-belgium-force-evacuations_6756544_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-08-15T16:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As chamas consumiram pelo menos 16 quilômetros quadrados no Parque Natural das Highlands no sábado à tarde. De acordo com um porta-voz local, é o incêndio mais significativo na história recente da Bélgica.", "titulo_pt": "Incêndios florestais na bélgica obrigam a evacuação de áreas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 104225, "titulo": "Mortos por terremoto na Colômbia chegam a 288, enquanto número de desaparecidos cai para 202", "url": "https://www.brasildefato.com.br/2026/08/15/mortos-por-terremoto-na-colombia-chegam-a-288-enquanto-numero-de-desaparecidos-cai-para-202/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-15T13:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de mortos por terremoto na Colômbia foi atualizado para 288, enquanto o número de desaparecidos caiu para 202. A Unidade Nacional de Gestão de Riscos de Desastres (UNGRD) da Colômbia divulgou esses dados mais recentes.", "titulo_pt": "Mortos por terremoto na Colômbia chegam a 288, número de desaparecidos cai para 202", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 104412, "titulo": "Como a Austrália, conhecida por sua fauna exuberante, tornou-se o epicentro das extinções no planeta", "url": "https://www.bbc.com/portuguese/articles/c9d8ndz4ezpo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-15T11:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Austrália registra oficialmente 67 casos de extinção, mas pesquisadores acreditam que pelo menos cem espécies de plantas e animais já tenham desaparecido permanentemente. O país, conhecido por sua fauna exuberante, tornou-se o epicentro das extinções no planeta.", "titulo_pt": "Como a Austrália, conhecida por sua fauna exuberante, tornou-se o epicentro das extinções no planeta", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 105099, "titulo": "Powerful earthquake off Indonesia kills 20, sparks mass evacuations", "url": "https://www.koreaherald.com/article/10842281", "fonte_id": "korea_herald", "data_pub": "2026-08-15T01:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um terremoto poderoso próximo à ilha de Flores, no leste da Indonésia, causou ao menos 20 mortes e levou a uma evacuação em massa. Resgatadores estavam buscando sobreviventes ent  "en", "provavel_duplicata_de": null, "texto_pt": "O senador Tyron Whitten, do partido One Nation, afirmou que os pais que apoiam seus filhos transgêneros estão cometendo 'abuso infantil'. Segundo Whitten, existem apenas dois gêneros: masculino e feminino, além de 'doenças mentais'.", "titulo_pt": "Senador diz que pais que apoiam filhos trans estão cometendo 'abuso infantil'", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 104466, "titulo": "Georreferencia sitúa a pareja de Vivanco en la dirección de un abogado al que la jueza concedió un fallo favorable tres días antes", "url": "https://www.ciperchile.cl/2026/08/15/georreferencia-situa-a-pareja-de-vivanco-en-la-direccion-de-un-abogado-al-que-la-jueza-concedio-un-fallo-favorable-tres-dias-antes/?utm_source=rss&utm_medium=rss&utm_campaign=georreferencia-situa-a-pareja-de-vivanco-en-la-direccion-de-un-abogado-al-que-la-jueza-concedio-un-fallo-favorable-tres-dias-antes", "fonte_id": "ciper_chile", "data_pub": "2026-08-15T19:42:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma georreferencia localizou a parceira de Vivanco na residência de um advogado. A juíza havia favorabilizado um processo a favor desse advogado três dias antes.", "titulo_pt": "Georreferencia situa a parceira de Vivanco na casa de um advogado a quem a juíza favoreceu três dias antes", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 104467, "titulo": "92 palabras para el deporte", "url": "https://www.ciperchile.cl/2026/08/15/92-palabras-para-el-deporte/?utm_source=rss&utm_medium=rss&utm_campaign=92-palabras-para-el-deporte", "fonte_id": "ciper_chile", "data_pub": "2026-08-15T18:33:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O post 92 palavras para o esporte foi publicado originalmente no CIPER Chile.", "titulo_pt": "92 Palavras sobre esporte", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 104468, "titulo": "Becas Chile, Fondecyt Postdoctoral   const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";

      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>

  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {

function ativar(id) {
