duplicata_de": null, "texto_pt": "A colheita de milho avançou para 88,4% da área total, segundo o Pátria Agronegócio. As últimas áreas a serem colhidas se concentram nos Estados de Minas Gerais, Paraná e São Paulo.", "titulo_pt": "Colheita de milho avança para 88,4% da área total, diz Pátria Agronegócio", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 130948, "titulo": "Proposta de Orçamento de 2027 vai incluir aporte de R$ 6 bilhões nos Correios", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/proposta-de-orcamento-de-2027-vai-incluir-aporte-de-r-6-bilhoes-nos-correios.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T20:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo de Luiz Inácio Lula da Silva planeja incluir na proposta de Orçamento de 2027 uma alocação de R$ 6 bilhões para os Correios. Este aporte visa fortalecer a empresa estatal brasileira.", "titulo_pt": "Proposta de Orçamento de 2027 incluirá aporte de R$ 6 bilhões nos Correios", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 131054, "titulo": "Dólar fecha perto dos R$5,20 após discurso duro de Warsh sobre inflação nos EUA", "url": "https://www.infomoney.com.br/mercados/dolar-hoje-abertura-fechamento-comercial-turismo-28082026/", "fonte_id": "infomoney", "data_pub": "2026-08-28T20:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar encerrou próximo a R$5,20 após o discurso do economista Warsh, que enfatizou a persistência da inflação e a determinação do Fed em alcançar a meta de 2% de inflação.", "titulo_pt": "Dólar fecha perto de R$5,20 após discurso firme de Warsh sobre inflação nos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 131057, "titulo": "S&P e Nasdaq fecham em baixa após chair do Fed reafirmar combate à inflação", "url": "https://www.infomoney.com.br/mercados/sp-e-nasdaq-fecham-em-baixa-apos-chair-do-fed-reafirmar-combate-a-inflacao/", "fonte_id": "infomoney", "data_pub": "2026-08-28T20:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O S&P 500 e o Nasdaq fecharam em baixa após o presidente do Federal Reserve reafirmar o foco no combate à inflação. Investidores adotaram uma postura cautelosa diante das declarações.", "titulo_pt": "S&P 500 e Nasdaq fecham em baixa após presidente do Fed reafirmar combate à inflação", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 131309, "titulo": "Corn and wheat prices jump to highest prices in more than three years", "url": "https://www.cnbc.com/2026/08/28/corn-and-wheat-prices-jump-to-highest-prices-in-more-than-three-years.html", "fonte_id": "cnbc_international", "data_pub": "2026-08-28T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os preços das futuras cebola e trigo subiram para os níveis mais altos em mais de três anos. No entanto, as razões para essas recentes elevações são notablemente diferentes.", "titulo_pt": "Preços de milho e trigo atingem níveis mais altos em mais de três anos", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 130950, "titulo": "Comércio perde 2.000 vagas formais em julho; no ano já são menos 7.800 vagas, segundo Caged", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/comercio-perde-2000-vagas-formais-em-julho-no-ano-ja-sao-menos-7800-vagas-segundo-caged.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T19:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O comércio brasileiro perdeu 2.056 vagas formais em julho, de acordo com dados do Caged. No ano, já foram registradas menos 7.800 vagas.", "titulo_pt": "Comércio perde 2.056 vagas formais em julho; no ano já são menos 7.800 vagas, segundo Caged", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 131004, "titulo": "Crescimento populacional caiu para 0,37% em 2026, estima IBGE", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-08/crescimento-populacional-caiu-para-037-em-2026-estima-ibge", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-08-28T19:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O crescimento populacional do Brasil foi de 0,37% em 2026, de acordo com o estudo Estimativas da População do IBGE. Este ritmo é menor em comparação com o período 2024/2025, quando a expansão populacional foi de 0,39%.", "titulo_pt": "Crescimento populacional caiu para 0,37% em 2026, estima IBGE", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 131144, "titulo": "A cadeia econômica por trás do botijão: como o GLP sustenta 330 mil empregos", "url": "https://www.jota.info/coberturas-especiais/energia-e-inclusao/a-cadeia-economica-por-tras-do-botijao-como-o-glp-sustenta-330-mil-empregos", "fonte_id": "jota", "data_pub": "2026-08-28T19:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estudo do GEE/UFRJ examina como a distribuição de gás liquefeito de petróleo (GLP) tem integrado novas tecnologias e modelos de negócio. O GLP sustenta 330 mil empregos no país.", "titulo_pt": "A cadeia econômica por trás do botijão: como o GLP mantém 330 mil empregos", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 130951, "titulo": "Vorcaro afirma à PF que não corrompeu servidores do BC e volta a acenar com delação", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/08/vorcaro-afirma-a-pf-que-nao-corrompeu-servidores-do-bc-e-volta-a-acenar-com-delacao.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-08-28T18:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Daniel Vorcaro, dono do Banco Master, prestou depoimento de quase quatro horas à Polícia Federal nesta sexta-feira (28) e negou que tenha cometido atos de corrupção por meio de servidores do Banco Central investigados.", "titulo_pt": "Vorcaro nega corrupção e não delata servidores do BC", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 131028, "titulo": "Robô chinês realiza a 3 mil km de distância cirurgia de remoção total da próstata em Goiás", "url": "https://www.cnnbrasil.com.br/saude/robo-chines-realiza-a-3-mil-km-de-distancia-cirurgia-de-remocao-total-da-prostata-em-goias/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um robô chinês realizou uma cirurgia de remoção total da próstata a 3 mil quilômetros de distância em Goiás, conectado a Santiago, no Chile, usando o sistema cirúrgico robótico Toumai.", "titulo_pt": "Robô chinês realiza cirurgia de remoção da próstata a 3 mil km de distância em Goiás", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 131361, "titulo": "US-China AI rivalry needn’t preclude cooperation", "url": "https://www.scmp.com/opinion/china-opinion/article/3365101/us-china-ai-rivalry-neednt-preclude-cooperation?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-28T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inteligência artificial (IA) apresenta riscos que não respeitam fronteiras nacionais, como ataques cibernéticos, desinformação, falhas no sistema e uso potencialmente perigoso. O Secretário-Geral das Nações Unidas, António Guterres, afirmou que maior alinhamento entre países em como testar sistemas, medir riscos e atribuir responsabilidades pode aumentar a segurança.", "titulo_pt": "Concorrência entre EUA e china em IA não precisa impedir cooperação", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 131007, "titulo": "Império dos robôs: China demonstra domínio no mercado de humanoides e quebra recordes em Pequim", "url": "https://www.brasildefato.com.br/2026/08/28/imperio-dos-robos-china-demonstra-dominio-no-mercado-de-humanoides-e-quebra-recordes-em-pequim/", "fonte_id": "brasil_de_fato", "data_pub": "2026-08-28T21:20:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em Pequim, a Conferência Mundial de Robôs e a segunda edição dos Jogos Mundiais de Robôs Humanoides representaram a consolidação da China no setor da robótica. No primeiro semestre de 2026, as empresas chinesas foram responsáveis por mais de 97% de todos os robôs humanoides fabricados.", "titulo_pt": "Império dos robôs: china demonstra dominância no mercado de humanoides e quebra recordes em Pequim", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 131222, "titulo": "Yes, We’re in an AI Bubble. Just Look to 1980s Japan.", "url": "https://foreignpolicy.com/2026/08/28/nvidia-earnings-quarterly-report-ai-economic-bubble-japan-history/", "fonte_id": "foreign_policy", "data_pub": "2026-08-28T20:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A situação atual da Nvidia pode ser impressionante, mas a história sugere que isso não terá um desfecho positivo.", "titulo_pt": "Sim, estamos em uma bolha de IA. Olhe para o Japão dos anos 1980.", "veiculo": "Foreign Policy", "pais": "EUA", "classe": "A"}, {"id": 131350, "titulo": "Neocloud Lambda secures $1B in debt to buy more chips", "url": "https://techcrunch.com/2026/08/28/neocloud-lambda-secures-1b-in-debt-to-buy-more-chips/", "fonte_id": "techcrunch", "data_pub": "2026-08-28T20:24:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Neocloud Lambda levantou $1 bilhão em dívida privada para adquirir chips de inteligência artificial Nvidia e alugá-los para a Microsoft. Este empréstimo é parte de uma série de financiamentos, refletindo o alto custo da expansão da inteligência artificial.", "titulo_pt": "Neocloud Lambda arrecada $1 bi em dívida para comprar chips nvidia e alugá-los para a microsoft", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 131315, "titulo": "China’s actors written out of dramas as AI doubles ready to take their roles", "url": "https://www.ft.com/content/7117ff02-d495-4936-8f05-fa73a7a5c669?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-28T20:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Atores chineses estão sendo substituídos por personagens gerados por inteligência artificial em produções de drama. Performers online estão perdendo seus empregos devido à adoção de novos programas de geração de vídeo automatizados.", "titulo_pt": "Atores chineses escritos fora das dramatizações enquanto IA duplicatas se preparam para assumir seus papéis", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 131354, "titulo": "Milo Yiannopoulos Detained by ICE in Louisiana", "url": "https://www.wired.com/story/milo-yiannopoulos-detained-by-ice-in-louisiana/", "fonte_id": "wired", "data_pub": "2026-08-28T19:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milo Yiannopoulos, um operador e troll do extremo direito, cidadão do Reino Unido, está detido pela ICE (Imigração e Alfândega dos Estados Unidos) em Louisiana e aguarda sua remoção do país.", "titulo_pt": "Milo Yiannopoulos detido pela ICE em Louisiana", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 131351, "titulo": "An Anthropic researcher just gave us a peek at self-improving AI", "url": "https://techcrunch.com/2026/08/28/an-anthropic-researcher-just-gave-us-a-peek-at-self-improving-ai/", "fonte_id": "techcrunch", "data_pub": "2026-08-28T19:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um pesquisador da Anthropic demonstrou que sistemas automatizados melhoraram o desempenho em 10 benchmarks específicos de comportamentos alinhados sem comprometer o desempenho geral.", "titulo_pt": "Pesquisador da Anthropic mostra avanços em AI auto-aperfeiçoante", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 131365, "titulo": "Trump's financial disclosure reveals 2 Coupang stock trades in June", "url": "https://en.yna.co.kr/view/AEN20260829000200315", "fonte_id": "yonhap_news", "data_pub": "2026-08-28T19:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O relatório financeiro de Donald Trump revelou duas transações de ações da Coupang realizadas em junho.", "titulo_pt": "Relatório financeiro de trump mostra duas transações de ações da Coupang em junho", "veiculo": "Yonhap News Agency", "pais": "Coreia do Sul", "classe": "A"}, {"id": 131363, "titulo": "Trump orders creation of US ‘Space Academy’, amid rivalry with China", "url": "https://www.scmp.com/news/world/united-states-canada/article/3365667/trump-orders-creation-us-space-academy-amid-rivalry-china?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-28T19:07:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, anunciou a criação de uma 'Academia Espacial' para treinar futuros recrutas civis e militares em um campo onde os EUA enfrentam uma rivalidade com a China. Trump assinou um decreto executivo para criar a nova escola, modelada após a famosa Academia Militar de West Point.", "titulo_pt": "Trump ordena criação da 'academia espacial' dos EUA, em meio à rivalidade com a China", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 131077, "titulo": "Brasileiros ganham espaço no desenvolvimento global do bitcoin, diz Vinteum", "url": "https://exame.com/future-of-money/brasileiros-ganham-espaco-no-desenvolvimento-global-do-bitcoin-diz-vinteum/", "fonte_id": "exame", "data_pub": "2026-08-28T18:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Desenvolvedores brasileiros ganharam espaço no desenvolvimento global do bitcoin, obtendo grants internacionais e ocupando posições em empresas de tecnologia cripto.", "titulo_pt": "Brasileiros ganham espaço no desenvolvimento global do bitcoin, diz Vinteum", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 131352, "titulo": "Brave’s browser one-ups Chrome with its new support for email aliases", "url": "https://techcrunch.com/2026/08/28/braves-browser-one-ups-chrome-with-its-new-support-for-email-aliases/", "fonte_id": "techcrunch", "data_pub": "2026-08-28T18:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Brave introduziu uma nova funcionalidade que permite aos usuários se inscreverem em sites e serviços online sem precisar compartilhar seus endereços de email pessoais. Esta característica foi anunciada recentemente.", "titulo_pt": "Browser da brave supera o Chrome com suporte a alias de email", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}, {"id": 131391, "titulo": "'It's going to be beautiful': President Trump signs order to create US Space Academy", "url": "https://www.space.com/space-exploration/its-going-to-be-beautiful-president-trump-signs-order-to-create-us-space-academy", "fonte_id": "space_com", "data_pub": "2026-08-28T18:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, assinou um decreto executivo criando a Academia Espacial dos EUA, que terá como objetivo formar estudantes para carreiras relacionadas à estudo, exploração, exploração comercial ou proteção do espaço exterior.", "titulo_pt": "'Vai ser lindo': Trump assina ordem para criar a academia espacial dos EUA", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 131080, "titulo": "Mais carros, menos km: como a Dasa cortou 15% os deslocamentos mesmo com expansão da frota", "url": "https://exame.com/esg/mais-carros-menos-km-como-a-dasa-cortou-15-os-deslocamentos-mesmo-com-expansao-da-frota/", "fonte_id": "exame", "data_pub": "2026-08-28T18:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Dasa utilizou dados de aplicativos de navegação para agrupar atendimentos e reduzir rotas repetidas, conseguindo diminuir em 15% os deslocamentos mesmo com a expansão da frota. Essa medida contribuiu para a descarbonização da empresa de medicina diagnóstica.", "titulo_pt": "Mais carros, menos km: como a Dasa reduziu 15% dos deslocamentos com expansão da frota", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 131355, "titulo": "Microsoft Teams Has Become a Haven for Scammers in China", "url": "https://www.wired.com/story/microsoft-teams-is-becoming-a-haven-for-chinese-scammers/", "fonte_id": "wired", "data_pub": "2026-08-28T18:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Criminosos estão usando aplicativos de chat empresarial como o Teams e Webex para enganar vítimas chinesas, fazendo com que transfiram grandes quantias de dinheiro, levando a uma onda de reclamações.", "titulo_pt": "Microsoft Teams se tornou refúgio para golpistas na China", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 131353, "titulo": "Open-weight AI companies are the Valley’s hottest acquisition targets", "url": "https://techcrunch.com/2026/08/28/open-weight-ai-companies-are-the-valleys-hottest-acquisition-targets/", "fonte_id": "techcrunch", "data_pub": "2026-08-28T18:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas de inteligência artificial de peso leve estão sendo alvo de interesse elevado para aquisições na região da Baía de Álvares. Há uma grande quantidade de capital sendo investido na oferta de modelos de IA.", "titulo_pt": "Empresas de IA de peso leve são as principais alvo de aquisições na baía de álvares", "veiculo": "TechCrunch", "pais": "EUA", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 131367, "titulo": "Earlier swathing opens a new pathway for subterranean clover seed harvest", "url": "https://phys.org/news/2026-08-earlier-swathing-pathway-subterranean-clover.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A capacidade da trevo subterrâneo de enterrar suas sementes suporta a persistência de pastagens, mas dificulta a colheita comercial de sementes. A indústria depende de arvessores de ventilação de Horwood-Bagshaw (HB) antigos, que coletam sementes de culturas completamente secas após várias passadas de arvessagem e arrancamento.", "titulo_pt": "Colheita antecipada abre um novo caminho para a coleta de sementes de trevo subterrâneo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 131376, "titulo": "NASA Awards First Prize in Phase 2 of Agency’s LunaRecycle Challenge", "url": "https://www.nasa.gov/directorates/stmd/prizes-challenges-crowdsourcing-program/centennial-challenges/nasa-awards-first-prize-in-phase-2-of-agencys-lunarecycle-challenge/", "fonte_id": "nasa_news", "data_pub": "2026-08-28T20:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A equipe do Massachusetts Institute of Technology (MIT) foi declarada vencedora do primeiro prêmio da fase 2 do desafio LunaRecycle da NASA, que buscava soluções para reduzir o lixo em missões à Lua ou espaço profundo através do reciclagem de materiais comuns, como tecidos, plásticos, espuma e metais. Os estudantes do MIT receberam um total de $775,000 em prêmios.", "titulo_pt": "NASA premia equipe do mit como vencedora do LunaRecycle Challenge", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 131368, "titulo": "Diverse portfolio of protected areas key to Mexican conservation efforts", "url": "https://phys.org/news/2026-08-diverse-portfolio-areas-key-mexican.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T20:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2020, México se juntou a 150 nações que comprometeram-se a proteger 30% de seu território até 2030 como parte do iniciativa global 30x30. Até agora, há debates em andamento sobre como expandir efetivamente as áreas protegidas para atingir esse objetivo ambicioso.", "titulo_pt": "Portfólio diversificado de áreas protegidas é crucial para os esforços de conservação mexicanos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 131366, "titulo": "Juul gets OK to sell updated vaping device with age-gating technology", "url": "https://www.statnews.com/2026/08/28/juul-fda-clearance-updated-ecigarette-age-gating-technology/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-28T19:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Juul obteve a aprovação da FDA para vender uma versão atualizada de seu dispositivo eletrônico de nicotina, que inclui um sistema opcional de verificação de idade projetado para prevenir o uso por menores de idade.", "titulo_pt": "Juul recebe aprovação para vender dispositivo atualizado com sistema de verificação de idade", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 131369, "titulo": "Low temperature graphene growth opens a route to sustainable resource recycling", "url": "https://phys.org/news/2026-08-temperature-graphene-growth-route-sustainable.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T19:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O crescimento de grafeno a baixas temperaturas abriu um caminho para a reciclagem sustentável de recursos. Pesquisadores recentemente superaram a barreira de alta temperatura tradicional, permitindo uma produção mais eficiente e controlada do grafeno.", "titulo_pt": "Crescimento de grafeno a baixas temperaturas abre caminho para reciclagem sustentável de recursos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 131370, "titulo": "Dog-friendly dining isn't just a trend, it's good for business, new research shows", "url": "https://phys.org/news/2026-08-dog-friendly-dining-isnt-trend.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estabelecimentos de restaurante que oferecem itens específicos do menu para cães além de permitir que eles estejam nos pátios podem aumentar significativamente o fluxo de clientes, as despesas e a propaganda boca a boca, de acordo com uma nova pesquisa da Universidade Metropolitana de Toronto.", "titulo_pt": "Comer com cães não é apenas uma tendência, é bom para o negócio, mostra nova pesquisa", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 131372, "titulo": "Where are all the aliens? A new book explores possible answers", "url": "https://www.scientificamerican.com/article/where-are-all-the-aliens-a-new-book-explores-possible-answers/", "fonte_id": "scientific_american", "data_pub": "2026-08-28T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Seven Rasmussen, astrobióloga e autora do novo livro 'Nuvens com Possível de Naves Espaciais', dá aos leitores uma visão geral da incrível ciência por trás das modernas buscas por vida extraterrestre.", "titulo_pt": "Onde estão todos os alienígenas? Um novo livro explora possíveis respostas", "veiculo": "Scientific American", "pais": "EUA", "classe": "A"}, {"id": 131390, "titulo": "The night we nearly saw a 'blood moon' (and why I love near-misses in astronomy)", "url": "https://www.space.com/stargazing/the-night-we-nearly-saw-a-blood-moon-and-why-i-love-near-misses-in-astronomy", "fonte_id": "space_com", "data_pub": "2026-08-28T19:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A astronomia frequentemente envolve estar perto de coisas extraordinárias sem experimentá-las completamente. O autor destaca a importância de apreciar eventos parciais, toques de borda, objetos fracos e outros eventos quase realizados.", "titulo_pt": "A noite em que quase vimos um 'lua vermelha' (e por que amo quase-ocorrências na astronomia)", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 131371, "titulo": "Fast fashion's carbon footprint can be reduced across its life cycle, new study suggests", "url": "https://phys.org/news/2026-08-fast-fashion-carbon-footprint-life.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T18:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo sugere que o rastro de carbono da moda rápida pode ser reduzido ao longo de seu ciclo de vida. A moda rápida é baseada em roupas baratas e de curta duração, especialmente camisetas de algodão e poliéster. A indústria depende de uma frequência alta de produção, um curto período de vida do produto e uma cadeia de suprimentos globalizada, contribuindo para torná-la uma grande fonte de poluição global.", "titulo_pt": "Estudo sugere que o rastro de carbono da moda rápida pode ser reduzido ao longo de seu ciclo de vida", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 130785, "titulo": "Scientists capture first molecular-level images of water reorganization during a reaction crucial for life", "url": "https://phys.org/news/2026-08-scientists-capture-molecular-images-reaction.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas capturaram pela primeira vez imagens molecular-level da reorganização da água durante uma reação crucial para a vida. Esses processos, que envolvem a movimentação coordenada de partículas negativamente e positivamente carregadas, são fundamentais para a fotossíntese, a catelise e a conversão biológica de energia, mas são difíceis de observar.", "titulo_pt": "Cientistas capturam primeiras imagens molecular-level de reorganização da água em reação crucial para a vida", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 130786, "titulo": "Does the Nepal glacier collapse signal a new climate risk?", "url": "https://phys.org/news/2026-08-nepal-glacier-collapse-climate.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O colapso de uma seção de geleira nos Himalayas do Nepal, que causou inundações devastadoras, pode indicar um novo tipo de risco em um mundo aquecido pelo aquecimento global, conforme informaram os cientistas à AFP.", "titulo_pt": "Colapso da geleira no Nepal pode sinalizar novo risco climático?", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 130836, "titulo": "Free-falling atoms in space put a new twist on Galileo’s gravity test", "url": "https://www.sciencenews.org/article/atoms-gravity-space-galileo-einstein", "fonte_id": "science_news", "data_pub": "2026-08-28T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Átomos de rubidio na Estação Espacial Tiangong da China caíram com a mesma aceleração, confirmando um princípio fundamental da teoria geral da relatividade de Einstein.", "titulo_pt": "Átomos livres em queda na estação espacial tiangong testam a gravidade de galileu", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 130854, "titulo": "'Silo' season 3: Common and Alexandria Riley talk shocking truths and writers tearing their on-screen marriage apart (interview)", "url": "https://www.space.com/entertainment/space-movies-shows/silo-season-3-common-and-alexandria-riley-talk-shocking-truths-and-writers-tearing-their-on-screen-marriage-apart-interview", "fonte_id": "space_com", "data_pub": "2026-08-28T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As atrizes Common e Alexandria Riley falaram sobre a jornada das personagens em 'Silo' temporada 3 e sobre os escritores estressados com a separação dramática de seus personagens na tela.", "titulo_pt": "Silo temporada 3: common e Alexandria Riley falam sobre a jornada das personagens e sobre os escritores estressados com a separação dramática", "veiculo": "Space.com", "pais": "EUA", "classe": "B"}, {"id": 130810, "titulo": "Opinion: The unintended consequences of the Lindsay Clancy case", "url": "https://www.statnews.com/2026/08/28/lindsay-clancy-postpartum-psychosis-reproductive-psychiatrists-liability/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-08-28T17:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os psiquiatras reprodutivos e forenses expressam preocupação de que o caso Lindsay Clancy possa levar os psiquiatras a se tornarem mais relutantes em tratar mulheres com doenças mentais.", "titulo_pt": "Opinião: as consequências imprevistas do caso Lindsay Clancy", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 130243, "titulo": "Vulnerabilidade pode virar alvo em câncer de mama agressivo, mostra estudo", "url": "https://www.metropoles.com/saude/vulnerabilidade-pode-virar-alvo-em-cancer-de-mama-agressivo-mostra-estudo", "fonte_id": "metropoles", "data_pub": "2026-08-28T17:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um estudo identificou uma dependência energética no tumor do câncer de mama agressivo, o que pode ser explorado como alvo terapêutico para casos específicos. Essa descoberta pode oferecer novas possibilidades de tratamento para esta forma do câncer.", "titulo_pt": "Vulnerabilidade energética pode se tornar alvo no câncer de mama agressivo, indica estudo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 130787, "titulo": "Honey bees can serve as sentinels for environmental health", "url": "https://phys.org/news/2026-08-honey-bees-sentinels-environmental-health.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Estudos usando uma abordagem 'One Health' têm identificado abelhas-douradas (Apis mellifera) como sentinelas do bem-estar ambiental. Elas são expostas a contaminantes através da coleta de néctar, pólen e água, o que pode indicar pressões ambientais sobre a biodiversidade e a funcionalidade dos ecossistemas.", "titulo_pt": "As abelhas-douradas podem servir como sentinelas da saúde ambiental", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 130940, "titulo": "Flup 2026 levará referências do pensamento negro mundial ao Rio em setembro", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/colunas/walter-porto/2026/08/flup-2026-levara-referencias-do-pensamento-negro-mundial-ao-rio-em-setembro.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-08-28T21:50:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Festa Literária das Periferias, que ocorrerá de 23 a 27 de setembro no Rio de Janeiro, incluirá nomes significativos do pensamento negro internacional.", "titulo_pt": "Flup 2026 trará referências do pensamento negro mundial ao Rio em setembro", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 131005, "titulo": "Rock in Rio: segurança terá mais de 7 mil agentes, além de drones", "url": "https://agenciabrasil.ebc.com.br/cultura/noticia/2026-08/rock-rio-seguranca-tera-mais-de-7-mil-agentes-alem-de-drones", "fonte_id": "agencia_brasil_cultura", "data_pub": "2026-08-28T21:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O evento Rock in Rio 2026 contará com mais de 7.600 agentes de segurança, incluindo policiais militares, civis, da Lei Seca e bombeiros, além do uso de drones. A expectativa é de um público de mais de 700 mil pessoas.", "titulo_pt": "Rock in Rio: segurança terá mais de 7 mil agentes, além de drones", "veiculo": "Agência Brasil - Cultura", "pais": "Brasil", "classe": "A"}, {"id": 131411, "titulo": "Thieves Pay Admission to Vienna Museum Before Stealing 200-Carat Necklace", "url": "https://www.artforum.com/news/vienna-museum-thieves-steal-200-carat-necklace-1234758334/", "fonte_id": "artforum", "data_pub": "2026-08-28T21:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 27 de agosto, dois homens pagaram a entrada no Museu de Artes Aplicadas (MAK) em Viena e posteriormente roubaram uma pulseira de platina e diamantes de 200 carates. A pulseira havia sido projetada pela empresa de joalheria francesa Van Cleef & Arpels para "texto_pt": "Neste episódio do podcast 'Screen Talk' da IndieWire, os apresentadores discutem sobre quem deve ser o próximo James Bond, provavelmente não sendo Jacob Elordi ou Harris Dickinson. Além disso, eles revisam o filme 'The Dog Stars' de Ridley Scott e debatem se as recentes declarações de Mark Ruffalo sobre seu contrato com a Warner Bros. afetarão sua carreira.", "titulo_pt": "Quem deveria ser o próximo James Bond? Provavelmente não Jacob Elordi ou Harris Dickinson", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 131418, "titulo": "The Isaac Mizrahi Documentary ‘Unzipped’ Is the Ultimate ’90s Fashion Portrait — Watch the Trailer", "url": "https://www.indiewire.com/news/trailers/isaac-mizrahi-90s-documentary-unzipped-trailer-watch-1235213394/", "fonte_id": "indiewire", "data_pub": "2026-08-28T21:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O documentário de 1995 de Dougle Reeve segue Isaac Mizrahi durante sua coleção outono de 1994. O acesso foi facilitado pelo fato de Mizrahi e Reeve estarem namorando na época.", "titulo_pt": "O documentário de 1995 de Isaac Mizrahi 'desabotoado' é uma porta- retrato das modas dos anos 90 — confira o Trailer", "veiculo": "IndieWire (cinema)", "pais": "EUA", "classe": "B"}, {"id": 130989, "titulo": "Desenvolvimento urbano e impacto regulatório", "url": "https://veja.abril.com.br/coluna/cidade-cidada/desenvolvimento-urbano-e-impacto-regulatorio/", "fonte_id": "veja", "data_pub": "2026-08-28T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A produção de moradia social depende muito do modo como a legislação organiza o território, define parâmetros e distribui oportunidades.", "titulo_pt": "Desenvolvimento urbano e impacto regulatório", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 131133, "titulo": "De Luís 14 ao TikTok: por que 'farmamos aura' há séculos", "url": "https://www.bbc.com/portuguese/articles/cp3056gnw5no?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-28T21:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A obsessão por parecer interessante sem muito esforço não é uma tendência recente. Ao longo do tempo, essa prática tem sido observada em diferentes épocas e contextos, incluindo a era de Luís 14 e a era do TikTok.", "titulo_pt": "De Luís 14 ao TikTok: por que 'farmamos aura' há séculos", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 131383, "titulo": "Robert Mapplethorpe Foundation Denied Use of Roy Cohn Portrait for New Biography Over Political Concerns", "url": "https://www.artnews.com/art-news/news/robert-mapplethorpe-foundation-roy-cohn-portrait-denial-1234796227/", "fonte_id": "artnews", "data_pub": "2026-08-28T21:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fundação Robert Mapplethorpe negou o uso de uma pintura de 1981 de Roy M. Cohn, advogado de Nova York, para a capa de uma biografia futura devido a suas associações negativas com o ex-presidente dos Estados Unidos Donald Trump.", "titulo_pt": "Fundação robert Mapplethorpe recusa uso de portrato de Roy Cohn para nova biografia devido a considerações políticas", "veiculo": "ARTnews", "pais": "EUA", "classe": "B"}, {"id": 131412, "titulo": "Ryoji Ikeda Wins 2026 Nam June Paik Prize", "url": "https://www.artforum.com/news/ryoji-ikeda-awarded-2026-nam-june-paik-prize-1234758313/", "fonte_id": "artforum", "data_pub": "2026-08-28T20:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artista eletrônico e compositor japonês Ryoji Ikeda venceu o Prêmio Nam June Paik 2026. Ele receberá KRW 50 milhões durante uma cerimônia no Centro de Arte Nam June Paik em Yongin, Coreia do Sul, em 8 de setembro. A instituição também exibirá sua obra.", "titulo_pt": "Ryoji Ikeda vence prêmio Nam June Paik 2026", "veiculo": "Artforum", "pais": "EUA", "classe": "B"}, {"id": 130942, "titulo": "Regina e Gabriela Duarte: a lavação de roupa suja 0996, "titulo": "A proposta de Romário para democratizar o teste de Alzheimer no SUS", "url": "https://veja.abril.com.br/brasil/a-proposta-de-romario-para-democratizar-o-teste-de-alzheimer-no-sus/", "fonte_id": "veja", "data_pub": "2026-08-28T20:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um projeto de lei proposto por Romário visa incluir exames de sangue no SUS para o diagnóstico precoce do Alzheimer, visando democratizar o acesso a esse teste.", "titulo_pt": "Proposta de Romário para democratizar o teste de Alzheimer no SUS", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 131002, "titulo": "Servidora do MP manteve material de exploração sexual infantil em e-mail particular", "url": "https://veja.abril.com.br/brasil/servidora-do-mp-manteve-material-de-exploracao-sexual-infantil-em-e-mail-particular/", "fonte_id": "veja", "data_pub": "2026-08-28T20:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma servidora do Ministério Público mantinha material relacionado a exploração sexual infantil em um e-mail particular. Ela afirmou que usava a conta para fins pessoais e profissionais, auxiliando em procedimentos investigativos.", "titulo_pt": "Servidora do MP mantinha material de exploração sexual infantil em e-mail particular", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 130241, "titulo": "Motociclista resiste à prisão, entra em luta com PM e deixa militar ferido", "url": "https://www.metropoles.com/distrito-federal/motociclista-resiste-a-prisao-entra-em-luta-com-pm-e-deixa-militar-ferido", "fonte_id": "metropoles", "data_pub": "2026-08-28T17:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um suspeito foi parado durante uma blitz da PMDF com uma motocicleta com chassi suprimido. Ao ser informado que teria de comparecer à delegacia, ele entrou em luta corporal com os policiais e deixou um militar ferido.", "titulo_pt": "Motociclista resiste à prisão, entra em luta com PM e deixa militar ferido", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 130141, "titulo": "Galãs do MetrôRio viralizam e usuários pedem calendário: “Vocês não são inocentes”", "url": "https://www.cnnbrasil.com.br/curiosidades/galas-do-metrorio-viralizam-e-usuarios-pedem-calendario-voces-nao-sao-inocentes/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Funcionários do metrô do Rio de Janeiro ganharam destaque nas redes sociais após serem elogiados por passageiros. Agora, os seguidores pedem um calendário com imagens da equipe metropolitana.", "titulo_pt": "Galãs do MetrôRio viralizam e usuários pedem calendário", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 130227, "titulo": "Gilmar Mendes defende mais mulheres no STF: ‘Precisamos superar’ desigualdade", "url": "https://veja.abril.com.br/brasil/gilmar-mendes-defende-mais-mulheres-no-stf-precisamos-superar-desigualdade/", "fonte_id": "veja", "data_pub": "2026-08-28T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro Gilmar Mendes afirmou que a presença feminina na magistratura está aumentando, mas que essa representatividade não se reflete nos tribunais superiores. A Corte do Supremo Tribunal Federal (STF) teve apenas três mulheres em sua história.", "titulo_pt": "Gilmar Mendes defende maior representatividade feminina no STF", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 130230, "titulo": "Como menino de 10 anos acionou a patrulha Maria da Penha por meio de emojis para salvar a mãe", "url": "https://veja.abril.com.br/brasil/como-menino-de-10-anos-acionou-a-patrulha-maria-da-penha-por-meio-de-emojis-para-salvar-a-mae/", "fonte_id": "veja", "data_pub": "2026-08-28T17:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um menino de 10 anos usou emojis para acionar a patrulha Maria da Penha após o ex-companheiro da mãe invadir a casa, mesmo com medid eículo da Polícia Militar e explodir uma viatura. As imagens foram registradas por uma câmera e mostram o suspeito fazendo uma dança antes dos atos criminosos.", "titulo_pt": "Suspeito que dançou antes de atear fogo e explodir viatura da PM é preso no ES", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 130834, "titulo": "Nearly one in thirteen children under five suffer from acute malnutrition in Haiti", "url": "https://www.unicef.org/press-releases/nearly-one-thirteen-children-under-five-suffer-acute-malnutrition-haiti", "fonte_id": "unicef", "data_pub": "2026-08-28T16:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo levantamento nacional sobre nutrição mostra que a malnutrição aguda entre crianças aumentou desde 2023. Quase um em cada treze crianças abaixo dos cinco anos sofre de malnutrição aguda em Haiti.", "titulo_pt": "Quase um em cada treze crianças abaixo dos cinco anos sofre de malnutrição aguda em Haiti", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 130417, "titulo": "How Nepali diaspora is responding to flood disaster and how Australians can help in relief effort", "url": "https://www.theguardian.com/world/2026/aug/28/how-to-help-nepal-community-flood-disaster-relief-funding-australia", "fonte_id": "guardian_world", "data_pub": "2026-08-28T15:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Comunidades nepalesas e tibetanas planejam vigílias para arrecadar fundos para a recuperação após o desastre de inundações 'devastador'. A morte de 579 pessoas foi confirmada pelas autoridades nepalesas, enquanto a comunidade nepalesa na Austrália planeja vigílias para lembrar as vítimas.", "titulo_pt": "Como a comunidade nepalesa na austrália está respondendo à tragédia das inundações e como os australianos podem ajudar na recuperação", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 130211, "titulo": "RS ainda tem lacunas em planos contra enchentes e municípios são o elo mais fraco", "url": "https://exame.com/esg/rs-ainda-tem-lacunas-em-planos-contra-enchentes-e-municipios-sao-o-elo-mais-fraco/", "fonte_id": "exame", "data_pub": "2026-08-28T12:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Novo alerta prevê temporais e risco de inundações neste fim de semana. O estado melhorou sua capacidade de resposta, mas ainda precisa avançar na adaptação para enfrentar as enchentes.", "titulo_pt": "RS ainda tem lacunas em planos contra enchentes e municípios são o elo mais fraco", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 131030, "titulo": "Inmet emite alerta de perigo para chuva e ventos intensos na Região Sul", "url": "https://www.cnnbrasil.com.br/nacional/sul/inmet-emite-alerta-de-perigo-para-chuva-e-ventos-intensos-na-regiao-sul/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Inmet emitiu um alerta para perigo de chuva e ventos intensos na Região Sul. A previsão é de ventos de até 100km/h, precipitação de 50 a 100 mm/dia e queda de granizo.", "titulo_pt": "Inmet emite alerta de perigo para chuva e ventos intensos na Região Sul", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 131312, "titulo": "Number of missing in Nepal floods passes 2,400 as UNICEF says 17,000 children need aid", "url": "http://www.euronews.com/2026/08/28/number-of-missing-in-nepal-floods-passes-2400-as-unicef-says-17000-children-need-aid", "fonte_id": "euronews", "data_pub": "2026-08-28T19:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de desaparecidos nos desastres de cheias no Nepal ultrapassou 2.400, enquanto 17.000 crianças necessitam de assistência humanitária. Equipes de resgate continuam trabalhando em meio a lama, recuperando corpos e enfrentando o risco de novas cheias, com alguns mortos sendo levados pelas águas até o Nepal vizinho, Índia.", "titulo_pt": "Número de desaparecidos nos desastres de cheias no Nepal ultrapassa 2.400 e 17.000 crianças precisam de ajuda", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 130336, "titulo": "Os mapas e gráficos que mostram a magnitude e o impacto da avalanche no Nepal e Tibete", "url": "https://www.bbc.com/portuguese/articles/c1dlp6wp9xyo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-08-28T17:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma avalanche ocorreu na região do Himalaia, afetando grandes áreas da fronteira entre Nepal e Tibete, deixando quase 600 mortos e 2 mil desaparecidos.", "titulo_pt": "Mapas e gráficos mostram a magnitude e o impacto da avalanche no Nepal e Tibete", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 130253, "titulo": "Incêndio atinge vegetação ao lado do trilho do metrô em Águas Claras", "url": "https://www.metropoles.com/distrito-federal/trem-passa-ao-lado-de-chamas-que-avancam-perto-da-linha-do-metro-df", "fonte_id": "metropoles", "data_pub": "2026-08-28T17:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um incêndio ocorreu próximo ao trilho do Metrô em Águas Claras, Distrito Federal, sem danificar estruturas nem interromper a circulação dos trens.", "titulo_pt": "Incêndio atinge vegetação ao lado do trilho do metrô em Águas Claras", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 130415, "titulo": "At least 93,000 ‘in great need’ after Nepal-Tibet flash floods, says Red Cross", "url": "https://www.theguardian.com/world/2026/aug/28/nepal-tibet-flash-floods-red-cross-rescuers-death-toll", "fonte_id": "guardian_world", "data_pub": "2026-08-28T15:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Federação da Cruz Vermelha e do Crescente Vermelho Internacional informou que pelo menos 93.000 pessoas podem ter sido afetadas pelas cheias que ocorreram na fronteira entre Nepal e Tibet, resultando em cerca de 600 mortos e 1.900 desaparecidos. Um grande esforço de resgate está sendo realizado, mas está sendo dificultado por temores de novos alagamentos.", "titulo_pt": "Ao menos 93.000 'em grande necessidade' após cheias na fronteira Nepal-Tibet, diz cruz vermelha", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 130803, "titulo": "Why a newly formed lake is sparking fears of more flooding along the Nepal-China border", "url": "https://phys.org/news/2026-08-newly-lake-nepal-china-border.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Autoridades alertaram que um novo lago formado e em sobrefluência poderia causar mais inundações na fronteira entre Nepal e China, enquanto resgatadores trabalhavam em áreas devastadas por uma enxurrada catastrófica.", "titulo_pt": "Por que um novo lago formado está causando medo de mais inundações na fronteira entre nepal e china", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 129220, "titulo": "PF faz operação contra extração ilegal de madeira em área indígena", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/pf-faz-operacao-contra-extracao-ilegal-de-madeira-em-area-indigena", "fonte_id": "metropoles", "data_pub": "2026-08-28T09:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal realizou uma operação em Rondônia contra a extração ilegal de madeira em uma área indígena. Durante a ação, duas pessoas foram presas em flagrante por posse ilegal de armas de fogo e munições.", "titulo_pt": "PF realiza operação contra extração ilegal de madeira em área indígena", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 129494, "titulo": "Overflowing lake halts rescue efforts as Nepal-Tibet flood death toll hits 474", "url": "https://www.theguardian.com/world/2026/aug/28/flash-flood-risk-halt-rescue-tibet-nepal-death-toll-china-lake-burst", "fonte_id": "guardian_world", "data_pub": "2026-08-28T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Equipes de resgate nas enchentes flash na fronteira entre Nepal e Tibet foram obrigadas a recuar devido ao risco de rompimento de um dique de detritos. Os moradores do distrito de Rasuwa, no Nepal, estão fugindo para as colinas para se protegerem de uma possível inundação do rio.", "titulo_pt": "Lago cheio interrompe esforços de resgate enquanto mortes por inundações flash na fronteira Nepal-Tibet chegam a 474", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 129738, "titulo": "China suspends Himalaya flood rescue efforts as lake overflows", "url": "https://www.ft.com/content/65478d4a-7edd-45b6-884e-144b22b50a0f?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-08-28T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As autoridades chinesas suspenderam os esforços de resgate após a transbordada de um lago no Himalaia. Equipes de emergência correm para salvar sobreviventes após um deslizamento de terra catastrófico no Nepal.", "titulo_pt": "China suspende esforços de resgate após transbordamento de lago no himalaia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 129230, "titulo": "Clima: Sul tem temporais, Centro-Sul enfrenta calor seco e Nordeste tem sol", "url": "https://www.metropoles.com/brasil/clima-sul-tem-temporais-centro-sul-enfrenta-calor-seco-e-nordeste-tem-sol", "fonte_id": "metropoles", "data_pub": "2026-08-28T08:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Sul do país enfrenta temporais, o Centro-Sul sofre com calor seco e o Nordeste tem condições de sol. A maioria do território brasileiro está experimentando altas temperaturas e níveis críticos de umidade relativa do ar.", "titulo_pt": "Clima: sul com temporais, Centro-Sul com calor seco e Nordeste com sol", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 129907, "titulo": "Satellite images show bedrock and glacier collapsed on Nepal-China border, then rivers flooded", "url": "https://phys.org/news/2026-08-satellite-images-bedrock-glacier-collapsed.html", "fonte_id": "phys_org", "data_pub": "2026-08-28T08:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Satélites registraram a colapso do terreno rochoso e geleira na fronteira entre Nepal e China, seguido por inundações nos rios. Equipes de resgate estavam buscando pessoas desaparecidas após a catástrofe de alagamentos na região.", "titulo_pt": "Imagens de satélite mostram colapso de rochas e geleiras na fronteira Nepal-China, seguidas por inundações", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 129805, "titulo": "Nepal army races to rescue 100 trapped in hydropower tunnel after flash floods", "url": "https://www.scmp.com/news/asia/south-asia/article/3365555/nepal-army-races-rescue-100-trapped-hydropower-tunnel-after-flash-floods?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-28T06:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Equipes de resgate em helicóptero estão trabalhando para salvar cerca de 100 pessoas presas em um túnel de uma usina hidrelétrica em Nepal, afetada por inundações devastadoras há dois dias. As dificuldades incluem a localização dos pontos de entrada do túnel.", "titulo_pt": "Exército de nepal realiza buscas em túnel de usina hidrelétrica após inundações", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 129681, "titulo": "Record drought grips Europe as rivers and crops dry up", "url": "https://www.aljazeera.com/video/newsfeed/2026/8/28/record-drought-grips-europe-as-rivers-and-crops-dry-up?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-08-28T05:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma estiagem severa afeta a Europa, causando a seca de rios e campos. As condições extrem ternacional/onu-diz-que-160-mil-mulheres-e-meninas-foram-afetadas-por-enchente-no-nepal/", "fonte_id": "cnn_brasil", "data_pub": "2026-08-28T17:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ONU relatou que 160 mil mulheres e meninas foram afetadas por uma enchente no Nepal. As mulheres enfrentam riscos maiores de violência, exploração e empobrecimento, além de assumirem tarefas domésticas e buscar água em proporções desproporcionais.", "titulo_pt": "ONU diz que 160 mil mulheres e meninas foram afetadas por enchente no Nepal", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 130747, "titulo": "Dutch court jails man for life over role in Rwanda genocide", "url": "https://www.scmp.com/news/world/europe/article/3365618/dutch-court-jails-man-life-over-role-rwanda-genocide?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-28T10:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um tribunal holandês condenou um homem de 66 anos a prisão perpétua por seu papel no massacre de 3.000 tutsis durante o genocídio ruandês de 1994. O juiz afirmou que o homem impediu os tutsis de escapar do estádio e atirou uma granada na multidão.", "titulo_pt": "Juiz holandês condena homem a prisão perpétua por genocídio em ruanda", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 129395, "titulo": "Ataques de Trump mostram que direitos humanos não são mais um consenso", "url": "https://www.intercept.com.br/2026/08/28/ataques-trump-direitos-humanos-nao-sao-consenso/", "fonte_id": "intercept_brasil", "data_pub": "2026-08-28T10:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O artigo destaca que os ataques de Trump à ideia de direitos humanos revelam que esses direitos não são mais um consenso. A extrema direita americana está abandonando a aparência humanitária para avançar sobre o Brasil, mostrando que as garantias mínimas não são suficientes para lidar com as desigualdades atuais.", "titulo_pt": "Ataques de Trump mostram que direitos humanos não são mais um consenso", "veiculo": "The Intercept Brasil", "pais": "Brasil", "classe": "B"}, {"id": 129789, "titulo": "Hong Kong lawyer warns against doxxing after AIA staff suspended over mall brawl", "url": "https://www.scmp.com/news/hong-kong/society/article/3365603/hong-kong-lawyer-warns-against-doxxing-after-aia-staff-suspended-over-mall-brawl?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-08-28T09:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um advogado em Hong Kong alertou os usuários da internet contra a divulgação de informações pessoais de outras pessoas nas redes sociais, a fim de evitar o crime de doxxing. Isso ocorreu após uma empresa de seguros suspenso um funcionário que foi associado a uma briga entre três mulheres em um centro comercial.", "titulo_pt": "Advogado em hong Kong alerta contra doxxing após funcionário de seguradora suspenso por briga em shopping", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 129927, "titulo": "Four children killed as separate attacks destroy humanitarian supplies and damage critical water infrastructure in Gaza", "url": "https://www.unicef.org/press-releases/four-children-killed-separate-attacks-destroy-humanitarian-supplies-and-damage", "fonte_id": "unicef", "data_pub": "2026-08-28T08:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quatro crianças morreram em ataques separados que destruíram suprimentos humanitários e danificaram infraestrutura crítica de água no Gaza.", "titulo_pt": "Quatro crianças mortas em ataques que destruíram suprimentos humanitários e danificaram infraestrutura de água no Gaza", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 130700, "fonte_id": "taipei_times", "titulo": "Population to plummet, council warns", "url": "https://www.taipeitimes.com/News/front/ar const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
</body>
