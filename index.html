cata_de": null, "texto_pt": "Luiz Fernando Rodrigues dos Santos, suspeito de participar de um assalto a uma arqueóloga, morreu durante uma perseguição policial. Ele tinha 27 passagens na polícia.", "titulo_pt": "Suspeito de assalto a arqueóloga morre em perseguição policial", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 217457, "titulo": "New York’s first microdrama film festival searches for its audience", "url": "https://www.theverge.com/entertainment/1014494/alza-vertical-film-festival-bill-block-salvador-paskowitz-microdramas-verticals", "fonte_id": "the_verge", "data_pub": "2026-10-21T20:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira festa de microdramas de Nova York, Alza, foi realizada, embora ainda não esteja claro se o público realmente deseja assistir a conteúdo vertical em telas horizontais. O festival foi fundado por Pete Torres, ex-chefe operacional do Tribeca Festival.", "titulo_pt": "Nova York recebe sua primeira festa de microdramas", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 216993, "titulo": "Onda de protestos europeus por educação e custo de vida chega à Grécia", "url": "https://veja.abril.com.br/mundo/onda-de-protestos-europeus-por-educacao-e-custo-de-vida-chega-a-grecia/", "fonte_id": "veja", "data_pub": "2026-10-21T20:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em uma onda de protestos, estudantes, professores e trabalhadores gregos se mobilizaram em atos que reuniram cerca de 10 mil pessoas. Essa mobilização se soma a manifestações em outros países europeus como França, Itália e Albânia.", "titulo_pt": "Onda de protestos europeus por educação e custo de vida atinge Grécia", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 217230, "titulo": "Ministro Rabat defiende proyecto que busca reformar el INDH y rechaza críticas que acusan que daña la democracia", "url": "https://www.latercera.com/politica/noticia/ministro-rabat-defiende-proyecto-que-busca-reformar-el-indh-y-rechaza-criticas-que-acusan-que-dana-la-democracia/", "fonte_id": "la_tercera", "data_pub": "2026-10-21T20:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O ministro de Justiça, Rabat, apresentou junto com o subsecretário Pablo Mira um projeto de reforma ao INDH à comissão de Direitos Humanos da Câmara Baixa. Houve críticas de parlamentares da oposição durante a sessão.", "titulo_pt": "Ministro Rabat defende projeto que busca reformar o INDH e rejeita críticas que acusam de ameaçar a democracia", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 217396, "titulo": "Thousands march for school funding in Greece", "url": "https://www.aljazeera.com/news/2026/10/21/thousands-march-for-school-funding-in-greece?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-21T18:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de pessoas marcharam em todo o país em protesto pela financiamento da educação. Professores se juntaram a protestos estudantis nacionais e a manifestações jovem-lideradas na Europa.", "titulo_pt": "Milhares marcham por financiamento da educação na Grécia", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 217209, "titulo": "Genitor que não assinou contrato com escola pode ser cobrado por dívida escolar, diz STJ", "url": "https://www.jota.info/coberturas-especiais/jurisprudente/genitor-que-nao-assinou-contrato-com-escola-pode-ser-cobrado-por-divida-escolar-diz-stj", "fonte_id": "jota", "data_pub": "2026-10-21T18:01:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Superior Tribunal de Justiça (STJ) determinou que um genitor que não assinou um contrato com a escola pode ser cobrado por dívidas educacionais. O colegiado considerou que a obrigação com a educação dos filhos é uma despesa ordinária de ambos os pais.", "titulo_pt": "Genitor que não assinou contrato com escola pode ser cobrado por dívida escolar, decide STJ", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 216109, "titulo": "Pedro, do Flamengo, é cobrado a deixar casa no Rio", "url": "https://www.metropoles.com/colunas/fabia-oliveira/pedro-do-flamengo-e-cobrado-a-deixar-casa-no-rio", "fonte_id": "metropoles", "data_pub": "2026-10-21T17:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma ação judicial no Rio de Janeiro busca garantir que o casal, com Pedro, do Flamengo, retome a propriedade de uma casa adquirida pelo atacante em leilão devido atrasos no financiamento.", "titulo_pt": "Pedro, do Flamengo, é cobrado a deixar casa no Rio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 216115, "titulo": "Escola em BH mantém aulas após morte de professora e revolta alunos", "url": "https://www.metropoles.com/minas-gerais/escola-em-bh-mantem-aulas-apos-morte-de-professora-e-revolta-alunos", "fonte_id": "metropoles", "data_pub": "2026-10-21T17:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma escola em Belo Horizonte manteve as aulas após a morte de uma professora, o que gerou revolta entre os alunos. O Colégio Santa Dorotéia negou acusações de desrespeito à memória da docente, enquanto o Sindicato criticou a postura da instituição.", "titulo_pt": "Escola em belo horizonte mantém aulas após morte de professora e revolta alunos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 216122, "titulo": "Gari que cursava medicina morre após ser atropelado por caminhão de lixo", "url": "https://www.metropoles.com/brasil/gari-que-cursava-medicina-morre-apos-ser-atropelado-por-caminhao-de-lixo", "fonte_id": "metropoles", "data_pub": "2026-10-21T17:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um homem que cursava medicina foi atropelado e morto após cair de um caminhão de lixo. Os bombeiros foram chamados, mas chegaram tarde demais e encontraram a vítima já sem vida.", "titulo_pt": "Gari que cursava medicina morre após ser atropelado por caminhão de lixo", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 216150, "titulo": "ONG ligada ao PCC: Justiça mantém condenação de quatro réus em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/ong-ligada-ao-pcc-justica-mantem-condenacao-de-quatro-reus-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-21T17:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Justiça manteve a condenação de quatro réus que foram acusados de integrarem o 'Setor das Reivindicações' da ONG Pacto Social e Carcerário, considerada uma estrutura de fachada do PCC.", "titulo_pt": "ONG ligada ao PCC: justiça mantém condenação de quatro réus em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 216158, "titulo": "Tiro em Fred Bruno: polícia inclui lesão corporal em BO contra deputado", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/tiro-em-fred-bruno-policia-inclui-lesao-corporal-em-bo-contra-deputado/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-21T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A polícia requisitou um exame no IML para avaliar os ferimentos de Fred Bruno, deputado estadual, e a investigação aguarda autorização do Tribunal de Justiça de São Paulo.", "titulo_pt": "Tiro em deputado: polícia inclui lesão corporal em BO e aguarda autorização", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 215909, "titulo": "Mulheres temem mais admitir erros quando homens são maioria na empresa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/mulheres-temem-mais-admitir-erros-quando-homens-sao-maioria-na-empresa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-21T16:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mulheres podem ter mais dificuldade em admitir erros quando estão em ambientes de trabalho predominantemente masculinos. Estudos mostram que homens e il", "data_pub": "2026-10-21T12:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Megan, que começou a usar cetamina aos 14 anos, sofre com dores intensas e não consegue manter o corpo ereto. Ela precisou usar fraldas aos 22 anos devido ao uso abusivo da substância.", "titulo_pt": "Comecei a usar cetamina aos 14 anos e aos 22 precisei de fraldas", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 216649, "titulo": "World’s climate action falling far short: UN report", "url": "https://www.taipeitimes.com/News/front/archives/2026/10/22/2003866407", "fonte_id": "taipei_times", "data_pub": "2026-10-22T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório da ONU afirma que as ações globais para combater o clima estão muito aquém das necessidades atuais. As medidas implementadas não estão sendo suficientes para atingir os objetivos climáticos estabelecidos.", "titulo_pt": "Ação global para o clima está muito aquém, diz relatório da ONU", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 217013, "titulo": "PF fecha área de extração ilegal de areia do tamanho de 16 campos em MG", "url": "https://www.metropoles.com/minas-gerais/pf-fecha-area-de-extracao-ilegal-de-areia-do-tamanho-de-16-campos-em-mg", "fonte_id": "metropoles", "data_pub": "2026-10-21T21:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal fechou uma área de extração ilegal de areia em uma fazenda em Ibiraci, Minas Gerais, que estava em operação desde 2022. Foram apreendidas máquinas e caminhões utilizados no crime.", "titulo_pt": "PF fecha área de extração ilegal de areia do tamanho de 16 campos em MG", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 217184, "titulo": "Inti Bonomo, especialista en Ciencias Ambientales, sobre la evolución del Súper Niño: “Va a seguir creciendo y el pico va a ser en diciembre”", "url": "https://www.lanacion.com.ar/sociedad/inti-bonomo-especialista-en-ciencias-ambientales-sobre-la-evolucion-del-super-nino-va-a-seguir-nid21102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-21T21:49:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Inti Bonomo, especialista em Ciências Ambientais, prevê que o Súper Niño continuará crescendo e atingirá seu pico em dezembro. O analista também observou que a nubosidade persistente e as temperaturas frescas de outubro se estenderão durante os primeiros meses de 2027.", "titulo_pt": "Inti Bonomo sobre o Súper Niño: vai continuar crescendo e alcançará pico em dezembro", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 216110, "titulo": "Criatura misteriosa ataca animais e assusta moradores de cidade mexicana", "url": "https://www.metropoles.com/vida-e-estilo/criatura-misteriosa-ataca-animais-e-assusta-moradores-de-cidade-mexicana", "fonte_id": "metropoles", "data_pub": "2026-10-21T17:53:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em Ciudad Juárez, no México, animais e moradores têm sido assustados por uma criatura misteriosa. Um ufólogo está investigando o caso.", "titulo_pt": "Criatura misteriosa assusta moradores e animais em cidade mexicana", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 216139, "titulo": "Nigéria registra primeiro caso de Ebola em mais de uma década", "url": "https://www.cnnbrasil.com.br/internacional/nigeria-registra-primeiro-caso-de-ebola-em-mais-de-uma-decada/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-21T17:35:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Nigéria registrou seu primeiro caso de Ebola em mais de uma década. A paciente, que retornou de uma viagem, foi isolada em Abuja e as autoridades de saúde estão monitorando a propagação do vírus na região.", "titulo_pt": "Nigéria registra primeiro caso de Ebola em mais de uma década", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 216135, "titulo": "ONU diz que mundo perde luta contra mudança climática e cita EUA como principal vilão", "url": "https://www.infomoney.com.br/mundo/onu-diz-que-mundo-perde-luta-contra-mudanca-climatica-e-cita-eua-como-principal-vilao/", "fonte_id": "infomoney", "data_pub": "2026-10-21T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ONU afirma que o mundo está perdendo a luta contra o aquecimento global, mesmo que todos os países cumpram suas promessas de redução de emissões. Segundo a organização, a Terra ainda aquecerá 2,2 graus Fahrenheit acima das temperaturas atuais, e os EUA são citados como principal responsável por esse cenário.", "titulo_pt": "ONU diz que mundo perde luta contra mudança climática e cita EUA como principal vilão", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 216045, "titulo": "Governo fecha cerco aos créditos de reciclagem de embalagens plásticas", "url": "https://veja.abril.com.br/economia/governo-fecha-cerco-aos-creditos-de-reciclagem-de-embalagens-plasticas/", "fonte_id": "veja", "data_pub": "2026-10-21T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo implementou regulamentações que exigem o rastreamento do material de embalagens plásticas utilizadas pelas indústrias, criando desafios para fabricantes e cooperativas.", "titulo_pt": "Governo fecha cerco aos créditos de reciclagem de embalagens plásticas", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 216539, "titulo": "UN warns El Nino could be strongest on record as it urges world to prepare", "url": "https://www.euronews.com/2026/10/21/un-warns-elnino-could-be-strongest-on-record", "fonte_id": "euronews", "data_pub": "2026-10-21T14:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A chefe da assistência da ONU alerta que o sistema humanitário não pode lidar sozinho, e $50 milhões foram liberados para 11 países na linha de frente, incluindo Chade e Somália, em rld/2026/oct/21/us-vaccine-trial-african-newborns-hepatitis-b", "fonte_id": "guardian_world", "data_pub": "2026-10-21T17:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo de vacina contra hepatite B em recém-nascidos africanos, apoiado pelos EUA e que gerou reação global, foi interrompido. O pesquisador responsável, Frederik Schaltz-Buchholzer, informou que não foi fornecida a aprovação governamental necessária.", "titulo_pt": "Estudo de vacina contra hepatite b em recém-nascidos africanos, apoiado pelos EUA, é interrompido", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 216332, "titulo": "Poland’s parliament votes to ease abortion ban but faces likely veto from president", "url": "https://www.theguardian.com/world/2026/oct/21/poland-parliament-votes-ease-abortion-ban-likely-veto-president", "fonte_id": "guardian_world", "data_pub": "2026-10-21T15:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O parlamento polonês aprovou duas propostas que visam relaxar a proibição quase total de abortos, removendo alguns dos crimes relacionados a quem ajuda as mulheres a terem abortos e permitindo interrupções de gravidezes em casos específicos. No entanto, essas medidas são consideradas um passo pequeno pelos ativistas, que esperam protestos para pressionar o governo a reformar as leis do país.", "titulo_pt": "Parlamento polonês aprova medidas para relaxar banimento de abortos, mas presidente pode vetar", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 216326, "titulo": "Severely ill ICE detainees face imminent deportation to unknown African states, advocates say", "url": "https://www.theguardian.com/us-news/2026/oct/21/ice-detention-illness-deportation-florida", "fonte_id": "guardian_world", "data_pub": "2026-10-21T13:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Familiares de detentos gravemente doentes em duas prisões de imigração na Flórida            const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
