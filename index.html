<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=new-title@500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=author@400&display=swap" rel="stylesheet">
<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>
<body>
<header>
  <h1>pan<span class="logo-o">o</span>rama</h1>

</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal-overlay" id="modal-senha">

</div>

<div class="modal-overlay" id="modal-flag">

</div>

<div class="modal-overlay" id="modal-relatorio">

      <button class="btn-peri" onclick="limparFlags()" style="margin-right:auto">Limpar tudo</button>
      <button class="btn-sec2" onclick="exportarFlags()">Exportar JSON</button>
      <button class="btn-sec2" onclick="copiarRelatorio()">Copiar</button>
      <button class="btn-pri" onclick="fecharModal('modal-relatorio')">Fechar</button>
    </div>
  </div>
</div>

<script>
const D = {"gerado_em": "05/10/2026 19:16", "stats": {"noticias_novas": 638, "resumos_gerados": 229}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "Os resultados do primeiro turno das eleições no Brasil mostraram um cenário de polarização política, com vitórias significativas para candidatos do bolsonarismo e do PL. O ex-presidente Michel Temer anunciou seu apoio a Flávio Bolsonaro no segundo turno, enquanto Ciro Nogueira defendeu o apoio do PP ao candidato. O senador Flávio Bolsonaro, que liderou o segundo turno, prometeu reformas no Judiciário caso seja eleito. O Tribunal Superior Eleitoral (TSE) solicitou que a Procuradoria-Geral Eleitoral se manifeste sobre a desistência de Anthony Garotinho antes de decidir sobre um recurso. Além disso, os percentuais de votos inválidos atingiram o menor nível desde 2006, exceto na disputa presidencial. A taxa de reeleição para deputados federais ficou em 72%, mantendo o mesmo nível de 2002 e abaixo dos registros de 2010 e 2014. A Câmara dos Deputados terá pelo menos 42 deputados oriundos de forças de segurança, e o Senado terá 9.", "mundo": "Flávio Bolsonaro obteve uma surpreendente vitória na primeira rodada das eleições presidenciais do Brasil, com 47,03% dos votos, contra 45,16% de Luiz Inácio Lula da Silva. Isso coloca o ex-presidente em uma situação difícil para vencer na segunda rodada, marcada para o dia 25 de outubro. A vitória de Flávio Bolsonaro impulsiona a onda ultraconservadora na América Latina e fortalece o poder do clã Bolsonaro no Congresso. O Brasil está agora preparado para um dia de protestos em apoio aos alunos que têm exigido mais investimento na educação, após várias detenções em massa ocorridas durante manifestações anteriores. Além disso, a França enfrenta preocupações sobre a capacidade de melhorar suas finanças públicas, com o euro atingindo um nível não visto há 17 meses em relação ao dólar americano. A França também enfrenta críticas internacionais após ameaçar expulsar 27 diplomatas israelenses, em resposta a Israel ordenar o fechamento do consulado em Jerusalém Oriental.\n\nA China intensificou suas pressões geopolíticas ao pedir que um instituto em Munique cancelasse um evento de autógrafo. Além disso, a China esteve envolvida em uma operação de repressão transfronteiriça contra pelo menos 126 taiwaneses. Em outro front, a Arábia Saudita, Turquia e Paquistão concordaram em enviar tropas para a Arábia Saudita como resposta a ataques recentes dos hutíes, que ativeram o acordo de Meca. A Ucrânia relatou que um navio foi afundado por um drone russo em águas romenas, aumentando as preocupações de que a guerra na Ucrânia possa se estender para fora do território ucraniano. O Brasil busca manter uma postura neutra na disputa entre Estados Unidos e China por minerais críticos, conforme estabelecido pela Política Nacional de Minerais Críticos e Estratégicos. Por fim, a Turquia condenou o deslocamento de armas para o espaço após os Estados Unidos admitirem ter enviado armas para a órbita terrestre, o que marcou o primeiro líder da NATO a criticar a corrida armamentista no espaço durante a abertura da Conferência Internacional de Astrônomos em Antalya.", "economia": "O mercado financeiro brasileiro experimentou fortes oscilações após o primeiro turno das eleições presidenciais. O Ibovespa encerrou o dia em 206.911,89 pontos, registrando um aumento de 7,70% e estabelecendo novos recordes de máxima intradia e de fechamento. O dólar registrou a maior queda em 8 anos após a eleição. A Hydro enfrenta a possibilidade de perder até 210 milhões de dólares devido a problemas com o fornecimento de gás na refinaria Alunorte. O Tesouro Direto foi temporariamente suspenso devido a altas volatilidades no mercado. O setor de serviços no Brasil registrou contração em setembro, com a retração da demanda levando a novas quedas na atividade e no emprego. O governo federal solicitou ao Tesouro Nacional a liberação de R$ 6,5 bilhões para o programa Brasil Soberano, que oferece empréstimos a empresas afetadas pelas tarifas dos Estados Unidos e pela instabilidade internacional. O mercado financeiro demonstra entusiasmo com a possibilidade de Flávio Bolsonaro vencer as eleições, refletido no comportamento do dólar e da Bolsa, enquanto as taxas de juros estão em queda.", "tecnologia": "A OpenAI anunciou que vai adicionar marcas d'água ao conteúdo gerado pelo ChatGPT e Codex na União Europeia, em conformidade com a AI Act, conforme informado pelo TechCrunch. Esta medida visa dificultar a detecção de conteúdo produzido por inteligência artificial. Em outro desenvolvimento, a empresa Reflection lançou o modelo de IA Beam, projetado para competir com modelos chineses de IA, oferecendo um custo computacional mais baixo, segundo o TechCrunch. Além disso, o estado do Texas exige o pagamento de $2 milhões por registros públicos que rastreiam o uso de Flock por policiais, conforme relatado pelo Ars Technica. Este evento destaca a crescente preocupação com a privacidade e a transparência em relação à utilização de tecnologias de inteligência artificial.", "ciencia": "O Prêmio Nobel de Medicina foi concedido a cientistas dos Estados Unidos e da Alemanha por suas contribuições significativas na compreensão do funcionamento do cérebro, através da técnica de optogenética. Esta pesquisa, que começou com a utilização de microalgas, revolucionou o estudo do cérebro e hoje serve como base para o entendimento do funcionamento de células neurais. A optogenética também resultou em tratamentos experimentais para doenças como cegueira e Alzheimer, mostrando seu potencial terapêutico. Além disso, um novo estudo revela que a perda de florestas costeiras na Península de Albemarle-Pamlico, na Carolina do Norte, começou a acelerar após 2010. Entre 1985 e 2021, a região perdeu mais de 20% de suas florestas costeiras.", "cultura": "A estreia do filme 'Digger', com Tom Cruise no papel principal, foi um dos maiores fracassos da carreira do ator, arrecadando cerca de US$ 8 milhões em bilheterias norte-americanas. O filme ficou em quinto lugar nas bilheterias e não atingiu as expectativas do estúdio Warner Bros. Por outro lado, o British Museum anunciou a extensão de suas horas de funcionamento devido à 'demanda extraordinária' pela Tapestra de Bayeux, com planos de fornecer um guia auditivo como parte do aplicativo da exposição. O Papa Francisco fez um discurso recente apelando para a preservação da arte contra a inteligência artificial, argumentando que os algoritmos carecem de uma chama humana, enquanto a cultura e a arte autênticas mantêm essa chama. Além disso, a família Bluhm doou cinco milhões de dólares para a MCA Chicago para criar um fundo de equidade de gênero, nomeado em homenagem à diretora saída Madeleine. Philip Tinari foi nomeado Diretor de Tai Kwun Arts em Hong Kong, junto com Chin Chin Teoh como Gerente Executivo de Tai Kwun e Timothy Calnin como Diretor de Projetos Especiais de Tai Kwun Arts.", "sociedade": "Um adolescente de 15 anos perdeu uma mão ao pegar uma granada policial durante protestos em escolas francesas, em meio a uma onda de manifestações que já dura três semanas e afetou centenas de escolas, causando incêndios e barricadas. Em outro incidente, dois indivíduos, incluindo uma estudante de 10º ano, morreram em um acidente de ônibus escolar em Florida, EUA, após o veículo capotar durante um acidente multivéhicular. Em São Paulo, a proibição de bisnagas de molhos em lanchonetes foi adiada para 2027, dando mais tempo para os estabelecimentos se adaptarem. No Brasil, negros conquistaram menos de um terço das vagas nas assembleias e na Câmara Legislativa de Washington, D.C., enquanto um homem foi preso em flagrante após atirar na ex-mulher em Brasília. Em Taiwan, os trabalhadores da Kuai Kuai estão prestes a votar sobre encerrar uma greve que pode levar ao fim do conflito atual. No Rio de Janeiro, João Lucas, genro de Xuxa, se divertiu com a derrota de Andrea Sorvetão nas eleições. Além disso, um homem de aproximadamente 20 anos foi detido em Seul suspeito de matar um estranho idoso. Por fim, em Alagoas e Santa Catarina, nenhum candidato negro foi eleito para cargos legislativos.", "meio_ambiente": "O presidente da Romênia assinou uma lei que regulamenta a cativeiro de urus, em resposta ao aumento do número desses animais em cidades e vilas romenas e a ataques a eles. Paralelamente, a Conaf condenou a extração de plantas endêmicas na Reserva Nacional La Chimba durante o período conhecido como 'deserto florido', com a Asociación Socioambiental Raíces Endémicas denunciando a extração de espécies como Cleome chilensis e Cistanthe grandiflora. Em outro desenvolvimento, a guerra do Irã está aumentando os custos do diesel, usado nas escolas para transportar crianças, causando dificuldades financeiras para as distritos escolares. Além disso, uma camada espessa de plâncton verde, conhecido como duckweed, cobriu os canais históricos de Gante, Bélgica, após um verão recordemente quente, levantando novas preocupações sobre o aquecimento global.", "direitos_humanos": "Um relato de prisioneiros sírios libertados sobre abusos sofridos em centros de detenção israelenses destaca a continuação de violações de direitos humanos. Em outro caso, um ativista rohingya argumenta que é injusto enviar refugiados de volta para Myanmar, destacando a necessidade de proteção internacional. Um estudante acusado de tortura sexual de menores no Reino Unido enfrenta julgamento que poderia resultar em prisão perpétua, refletindo preocupações sobre o tratamento de menores e a justiça. Um menino somali de sete anos, ferido em um ataque a drone dos Estados Unidos, foi submetido a uma cirurgia vital em Mogadishu, graças a uma campanha do The Guardian. No Chile, sugere-se que o país possa aprender com o modelo de governança aplicado pelo Partido Comunista da China em prisões, enquanto no Canal da Mancha, dois homens morreram tentando chegar ao Reino Unido, destacando os riscos do percurso migratório. Um ativista norueguês que auxilia refugiados e migrantes é julgado na Grécia, com temores de que o julgamento tenha um efeito 'gelado' sobre os defensores dos direitos dos migrantes. Na Coreia do Sul, menores, incluindo bebês e crianças pequenas, são mantidos em centros de detenção de imigrantes, levantando preocupações sobre a proteção de crianças. Por fim, grupos se opõem a uma operação policial em um bar gay na China, destacando a necessidade de proteção de direitos humanos para comunidades LGBTQ+."}, "resumo_do_dia": {"politica_nacional": [{"id": 196809, "titulo": "Do estado ao Planalto: o peso das disputas estaduais", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/voto-a-voto/2026/10/do-estado-ao-planalto-o-peso-das-disputas-estaduais.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-05T21:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Sete estados, responsáveis por 16% do eleitorado, terão segundo turno para governador. Nesses estados, as campanhas para presidente continuam influenciadas, enquanto em outros estados a disputa já foi encerrada.", "titulo_pt": "Do estado ao Planalto: o peso das disputas estaduais", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 196810, "titulo": "Senado bolsonarista raiz dá pista livre para Flávio ir para cima do STF; veja vídeo", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/senado-bolsonarista-raiz-da-pista-livre-para-flavio-ir-para-cima-do-stf-veja-video.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-05T21:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado bolsonarista tem se destacado como um dos principais focos de atenção na onda de direita que venceu nas eleições de primeiro turno. O caso envolvendo Flávio Bolsonaro e o STF está sendo particularmente notável.", "titulo_pt": "Senado bolsonarista dá pista livre para Flávio ir contra o STF; veja vídeo", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 196811, "titulo": "Ex-governadores Roberto Requião (PDT) e Beto Richa (PSDB) não conseguem se eleger à Câmara dos Deputados", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/ex-governadores-roberto-requiao-pdt-e-beto-richa-psdb-nao-conseguem-se-eleger-a-camara-dos-deputados.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-05T21:41:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os ex-governadores do Paraná, Roberto Requião (PDT) e Beto Richa (PSDB), não foram eleitos deputados federais neste domingo (4). Requião recebeu 79.921 votos e Richa, 58.946 votos.", "titulo_pt": "Ex-governadores do paraná não conseguem se eleger à Câmara dos Deputados", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 196812, "titulo": "Veja quem ganha e quem perde com o resultado do 1º turno das eleições", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/veja-quem-ganha-e-quem-perde-com-o-resultado-do-1o-turno-das-eleicoes.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-05T21:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O primeiro turno das eleições fortaleceu o PL no Congresso e confirmou a reeleição de Tarcísio de Freitas (Republicanos) em São Paulo. O resultado também ampliou a presença da família Bolsonaro na política, com quatro parentes do ex-presidente eleitos para a Câmara e o Senado.", "titulo_pt": "Veja quem ganha e quem perde com o resultado do 1º turno das eleições", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 196813, "titulo": "Câmara terá ao menos 42 deputados oriundos de forças de segurança, e Senado, 9", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/camara-tera-ao-menos-42-deputados-oriundos-de-forcas-de-seguranca-e-senado-9.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-05T21:32:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados terá pelo menos 42 deputados que são ex-integrantes de forças de segurança para a próxima legislatura, que vai de 2027 a 2030. O Senado terá 9 deputados oriundos de forças de segurança durante o mesmo período.", "titulo_pt": "Câmara terá ao menos 42 deputados de forças de segurança e Senado, 9", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 196804, "titulo": "Renovação da Câmara federal chegou a 35%; veja nova composição da Casa", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/renovacao-da-camara-federal-chegou-35-veja-nova-composicao-da-casa", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-05T21:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Câmara dos Deputados confirmou que 183 deputados federais vão exercer seu primeiro mandato, representando 35,67% da renovação. Já 301 deputados federais foram reeleitos, correspondendo a 58,6% do total de parlamentares eleitos.", "titulo_pt": "Renovação na Câmara federal chega a 35,67%; veja nova composição da Casa", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 196940, "titulo": "TSE quer ouvir PGE sobre desistência de Garotinho antes de decidir recurso", "url": "https://www.cnnbrasil.com.br/eleicoes/tse-quer-ouvir-pge-sobre-desistencia-de-garotinho-antes-de-decidir-recurso/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-05T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Superior Eleitoral (TSE) solicitou que a Procuradoria-Geral Eleitoral (PGE) se manifeste sobre a desistência de Anthony Garotinho antes de decidir sobre um recurso. Floriano Marques, membro do TSE, deu prazo de dois dias para a PGE apresentar sua posição.", "titulo_pt": "TSE pede opinião da PGE sobre desistência de Garotinho antes de julgar recurso", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 196965, "titulo": "Opções de Itaú, BB e Petrobras disparam após eleição e sobem até 364%", "url": "https://www.infomoney.com.br/mercados/opcoes-itau-bb-petrobras-disparam-apos-eleicao-vale-cai/", "fonte_id": "infomoney", "data_pub": "2026-10-05T21:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As opções das ações do Itaú (ITUB4) e da Petrobras registraram altas significativas após a primeira volta das eleições, com ganhos de até 364% no primeiro pregão subsequente. A Petrobras também registrou alta de até 164%.", "titulo_pt": "Opções de Itaú, BB e Petrobras dispararam após eleição e sobem até 364%", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 196814, "titulo": "Michel Temer anuncia apoio a Flávio Bolsonaro no 2º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/michel-temer-anuncia-apoio-a-flavio-bolsonaro-no-2o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-05T21:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-presidente Michel Temer anunciou seu apoio à candidatura de Flávio Bolsonaro no segundo turno da eleição presidencial. A declaração foi feita em um pronunciamento em vídeo nas redes sociais do ex-presidente.", "titulo_pt": "Michel Temer apoia Flávio Bolsonaro no segundo turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 196951, "titulo": "Ala do STF prevê reforma do Judiciário caso Flávio seja eleito", "url": "https://www.cnnbrasil.com.br/politica/ala-do-stf-preve-reforma-do-judiciario-caso-flavio-seja-eleito/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-05T21:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Bastidores do Supremo Tribunal Federal sugerem que uma eventual vitória de Flávio Bolsonaro levaria a reformas significativas no Judiciário, como a introdução de mandatos para ministros e a transferência de casos criminais para outras instâncias.", "titulo_pt": "Ala do STF prevê reformas no Judiciário em caso de vitória de Flávio bolsonaro", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 196815, "titulo": "Nunes tem 5 ex-secretários eleitos e 3 derrotados", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/nunes-tem-5-ex-secretarios-eleitos-e-3-derrotados.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-05T21:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Oito ex-secretários da gestão Ricardo Nunes (MDB) concorreram a eleições neste ano, sendo cinco deles eleitos e três derrotados.", "titulo_pt": "Nunes tem 5 ex-secretários eleitos e 3 derrotados", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 197113, "titulo": "Garotinho desiste de recurso no TSE e abre caminho para eleição de Ruas no RJ no 1º turno", "url": "https://www.jota.info/eleicoes/eleicoes-2026/garotinho-desiste-de-recurso-no-tse-e-abre-caminho-para-eleicao-de-ruas-no-rj-no-1o-turno", "fonte_id": "jota", "data_pub": "2026-10-05T21:04:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Garotinho abandonou o processo de recurso no Tribunal Superior Eleitoral (TSE) e permitiu que o candidato Marcelo Ruas fosse eleito no primeiro turno nas eleições no Rio de Janeiro. Os votos de Garotinho foram contabilizados mesmo com a ação judicial em andamento.", "titulo_pt": "Garotinho desiste de recurso no TSE e abre caminho para eleição de Ruas no RJ no 1º turno", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 196816, "titulo": "Ciro Nogueira defende apoio do PP a Flávio Bolsonaro no 2º turno", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/poder/2026/10/ciro-nogueira-defende-apoio-do-pp-a-flavio-bolsonaro-no-2o-turno.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-05T21:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O senador Ciro Nogueira, presidente nacional do PP, afirmou que irá defender o apoio do seu partido ao presidenciável Flávio Bolsonaro no segundo turno da eleição. Uma reunião com as lideranças do partido está programada para ocorrer na terça-feira.", "titulo_pt": "Ciro Nogueira defende apoio do PP a Flávio Bolsonaro no segundo turno", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 196805, "titulo": "Polícia Federal apreende R$ 2,8 milhões no primeiro turno das eleições", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/policia-federal-apreende-r-28-milhoes-no-primeiro-turno-das-eleicoes", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-10-05T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Polícia Federal apreendeu R$ 2,8 milhões durante o primeiro turno das eleições, realizado no dia 4 de novembro. Foram instaurados 49 inquéritos policiais e lavrados 100 termos circunstanciados de ocorrência para apurar crimes eleitorais.", "titulo_pt": "Polícia Federal apreende R$ 2,8 milhões no primeiro turno das eleições", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 196958, "titulo": "Ministro de Lula defende que presidente vá em debates antes do 2º turno", "url": "https://www.cnnbrasil.com.br/eleicoes/ministro-de-lula-defende-que-presidente-va-em-debates-antes-do-2o-turno/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-05T20:57:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro José Guimarães defendeu que Lula participe de debates antes do segundo turno da eleição. A campanha planeja concentrar esforços em converter votos de outros candidatos, além de eleitores que não votaram ou votaram em branco, com o objetivo de garantir a vitória de Lula no segundo turno.", "titulo_pt": "Ministro defende que Lula participe de debates antes do segundo turno", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 196817, "titulo": "Alcolumbre deve seguir fiel a Lula, apesar de posição pró-Flávio do União", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/10/alcolumbre-deve-seguir-fiel-a-lula-apesar-de-posicao-pro-flavio-do-uniao.shtml", "fonte_id": "folha_poder", "data_pub": "2026-10-05T20:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Davi Alcolumbre, presidente do Senado, afirmou que seguirá fiel a Lula mesmo após o petista ficar atrás de Flávio Bolsonaro no primeiro turno. A posição de Alcolumbre é diferente da que será anunciada pelo União Brasil, seu partido.", "titulo_pt": "Alcolumbre deve seguir fiel a Lula, apesar de posição pró-flávio do União", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}], "politica_nacional__eventos": [], "mundo": [{"id": 196457, "titulo": "US defense experts to participate in meetings, war games in Taiwan joint assessment program", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/06/2003865473", "fonte_id": "taipei_times", "data_pub": "2026-10-06T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Especialistas ash the patriarchy’: Activists graffiti Cornell hall over gang rape case", "url": "https://www.aljazeera.com/news/2026/10/5/smash-the-patriarchy-activists-graffiti-cornell-hall-over-gang-rape-case?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-05T21:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Grupos de estudantes estão pedindo pela abolição da vida grega e ação mais severa após acusações de agressão por parte de um fraternidade. As ativistas estão grafiteando o edifício Cornell em protesto contra o caso de estupro.", "titulo_pt": "Quebre o patriarcado”: ativistas grafitam edifício Cornell em protesto contra caso de estupro", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 197194, "titulo": "Trump says 'threat' led US to pull bombers from RAF Fairford", "url": "https://www.bbc.co.uk/news/articles/cwj3413e5m1lo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-05T21:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Pentágono confirmou que os bombardeiros B1 foram retirados da base RAF Fairford, na Inglaterra, e retornaram às estações de origem nos Estados Unidos.", "titulo_pt": "Trump afirma que 'ameaça' levou EUA a remover bombardeiros da RAF Fairford", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 196936, "titulo": "Nenhuma pretensão de poder pode prevalecer a soberania popular, diz Fachin", "url": "https://www.cnnbrasil.com.br/politica/nenhuma-pretensao-de-poder-pode-prevalecer-a-soberania-popular-diz-fachin/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-05T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ministro do Superior Tribunal de Justiça (STJ) Luis Roberto Barroso, conhecido como Fachin, afirmou que nenhuma pretensão de poder pode prevalecer sobre a soberania popular.", "titulo_pt": "Nenhuma pretensão de poder pode prevalecer a soberania popular, diz Fachin", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 197197, "titulo": "US 'watching closely' after plague researcher dies in Russia", "url": "https://www.bbc.co.uk/news/articles/cv5yn3nwp5n5o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-05T21:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente dos Estados Unidos, Donald Trump, afirmou que o país estava 'observando de perto' o caso de um técnico de laboratório que faleceu em uma instalação de pesquisa na Sibéria.", "titulo_pt": "EUA 'observando de perto' após morte de pesquisador na Rússia", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 197297, "titulo": "Houthi, 'abbiamo colpito l'aeroporto di Riad e una raffineria di Aramco'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/10/05/houthi-abbiamo-colpito-laeroporto-di-riad-e-una-raffineria-di-aramco_637eb0fd-e497-4481-9057-99c6bc63522f.html", "fonte_id": "ansa_italy", "data_pub": "2026-10-05T21:33:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "Forças houthi afetaram um aeroporto de Riad e uma refinaria da Aramco. Também estavam alvos sites militares no sul da Arábia Saudita.", "titulo_pt": "Houthi atingiram aeroporto de Riad, refinaria da Aramco e sites militares no sul do país", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 197312, "titulo": "Hong Kong must scrap housing plan and preserve golf course", "url": "https://www.scmp.com/opinion/hong-kong-opinion/article/3369682/hong-kong-must-scrap-housing-plan-and-preserve-golf-course?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-10-05T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo de Hong Kong decidiu não recorrer contra uma decisão judicial que considerou ilegal sua aprovação do relatório de avaliação de impacto ambiental (EIA) para o projeto de construção de 12.000 apartamentos públicos no campo de golfe mais antigo da cidade. Agora, uma revisão mais ampla dos planos pode ser realizada em vista da decisão do Tribunal de Apelações.", "titulo_pt": "Hong Kong deve revogar plano imobiliário e preservar campo de golfe", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 197419, "titulo": "U.S. says Coast Guard came under fire near the border. Mexico wants evidence.", "url": "https://www.washingtonpost.com/world/2026/10/05/us-says-coast-guard-came-under-fire-near-border-mexico-wants-evidence/", "fonte_id": "washington_post_world", "data_pub": "2026-10-05T21:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "U.S. autoridades disseram que tropas foram deslocadas para uma área da fronteira sul onde o Coast Guard dos Estados Unidos teria sido alvejado. México pediu evidências sobre o incidente.", "titulo_pt": "EUA diz que guarda costeira foi alvejada perto da fronteira. México quer provas.", "veiculo": "Washington Post - World", "pais": "EUA", "classe": "A"}, {"id": 197203, "titulo": "New York declares statewide disaster emergency as measles cases rise", "url": "https://www.france24.com/en/americas/20261005-new-york-declares-statewide-disaster-emergency-as-measles-cases-rise", "fonte_id": "france24", "data_pub": "2026-10-05T21:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A governadora de Nova York, Kathy Hochul, decretou uma emergência estatal devido a uma epidemia de sarampo que se espalhou para comunidades rurais com baixa imunização, com 108 casos registrados este ano. O decreto estende a quem pode administrar a vacina MMR e ocorre enquanto o vizinho Pensilvânia luta com uma epidemia que já resultou em cinco mortes.", "titulo_pt": "Nova York declara emergência estatal devido ao aumento de casos de sarampo", "veiculo": "France 24", "pais": "França", "classe": "A"}, {"id": 197124, "titulo": "Nigeria Military Helicopter Crashes With 32 Onboard", "url": "https://www.nytimes.com/2026/10/05/world/africa/nigeria-military-aircraft-crash.html", "fonte_id": "nyt_world", "data_pub": "2026-10-05T21:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um helicóptero militar nigeriano caiu, resultando em 32 mortes. Este foi um dos piores acidentes de aeronaves militares do país em anos.", "titulo_pt": "Helicóptero militar de nigeria cai com 32 pessoas a bordo", "veiculo": "New York Times - World", "pais": "EUA", "classe": "A"}, {"id": 197133, "titulo": "Coalition set to unveil dramatically deeper cuts to overseas migration as it fends off One Nation’s rise", "url": "https://www.theguardian.com/australia-news/2026/oct/06/coalition-immigration-policy-angus-taylor-one-nation-labor-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-10-05T21:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo Coalition está prestes a anunciar cortes significativos nas migrações internacionais, mantendo as vagas de trabalhadores temporários e priorizando habilidades, em resposta ao crescimento do apoio à One Nation. A oposição, liderada por Angus Taylor, também planeja anunciar suas propostas de política migratória na próxima semana.", "titulo_pt": "Governo coalition para anunciar profundas cortes na imigração internacional", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 197195, "titulo": "France braces for national day of school protests after injuries and mass arrests", "url": "https://www.bbc.co.uk/news/articles/cr4g1q1elxnjo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_world", "data_pub": "2026-10-05T21:18:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A França está preparando-se para um dia de protestos em apoio aos alunos que têm exigido mais investimento na educação. Várias lesões e detenções em massa ocorreram durante manifestações anteriores.", "titulo_pt": "França se prepara para dia nacional de protestos escolares após lesões e detenções em massa", "veiculo": "BBC World News", "pais": "Reino Unido", "classe": "A"}, {"id": 196971, "titulo": "Eleição no Brasil expõe disputa geopolítica e ingerência dos Estados Unidos na América Latina", "url": "https://www.brasildefato.com.br/2026/10/05/eleicao-no-brasil-expoe-disputa-geopolitica-e-ingerencia-dos-estados-unidos-na-america-latina/", "fonte_id": "brasil_de_fato", "data_pub": "2026-10-05T21:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Lideranças progressistas no Brasil denunciam intervenção externa, especialmente dos Estados Unidos, enquanto simpatizantes da extrema direita celebram o avanço do pensamento ultraconservador. A eleição revela uma disputa geopolítica entre forças progressistas e conservadoras no país.", "titulo_pt": "Eleição no Brasil expõe disputa geopolítica e intervenção dos Estados Unidos na América Latina", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}], "mundo__eventos": [], "economia": [{"id": 196939, "titulo": "Hydro prevê perda de até US$ 210 milhões por problema com gás na Alunorte", "url": "https://www.cnnbrasil.com.br/infra/hydro-preve-perda-de-ate-us-210-milhoes-por-problema-com-gas-na-alunorte/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-05T21:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Hydro está enfrentando uma possível perda de até 210 milhões de dólares devido a problemas com o fornecimento de gás na refinaria Alunorte. Para manter as operações, a empresa tem comprado combustível a preços superiores aos contratados.", "titulo_pt": "Hydro prevê perda de até r$ 210 milhões por problema com gás na Alunorte", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 196796, "titulo": "Casas de análise projetam alta de até 45% para a Bolsa com vitória de Flávio Bolsonaro", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/casas-de-analise-projetam-alta-de-ate-45-para-a-bolsa-com-vitoria-de-flavio-bolsonaro.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T21:26:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Diferentes casas de análise projetam uma valorização das ações brasileiras de 11% a 45% caso o senador Flávio Bolsonaro vença o presidente Lula no segundo turno das eleições, marcado para o dia 25. A estimativa considera a implementação de um ajuste fiscal.", "titulo_pt": "Casas de análise projetam alta de até 45% para a Bolsa com vitória de Flávio Bolsonaro", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 196859, "titulo": "Dólar cai a R$ 5, e bolsa sobe quase 8% após primeiro turno", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-10/dolar-cai-r-5-e-bolsa-sobe-quase-8-apos-primeiro-turno", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-10-05T21:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dólar caiu para R$ 5 e a bolsa subiu quase 8%, ultrapassando pela primeira vez os 200 mil pontos, após o resultado do primeiro turno das eleições presidenciais no Brasil. Ativos brasileiros no exterior também registraram forte valorização devido à percepção de redução do prêmio de risco do país.", "titulo_pt": "Dólar cai a R$ 5 e bolsa sobe quase 8% após primeiro turno das eleições", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 196879, "titulo": "Tesouro Direto suspende negociações por alta volatilidade no mercado", "url": "https://veja.abril.com.br/coluna/faria-lima-news/tesouro-direto-suspende-negociacoes-por-alta-volatilidade-no-mercado/", "fonte_id": "veja", "data_pub": "2026-10-05T21:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A plataforma de negociação do Tesouro Direto foi temporariamente fechada devido a altas volatilidades no mercado. O Tesouro Reserva, no entanto, continua operando normalmente.", "titulo_pt": "Tesouro Direto suspende negociações por alta volatilidade no mercado", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 196798, "titulo": "Quando uma holding familiar realmente vale a pena?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/de-grao-em-grao/2026/10/quando-uma-holding-familiar-realmente-vale-a-pena.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T21:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma holding familiar não garante automaticamente vantagens como a evitação de inventário, redução de impostos, proteção de bens e facilitação para herdeiros. As promessas associadas a uma holding familiar são frequentemente exageradas.", "titulo_pt": "Quando uma holding familiar realmente vale a pena?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 197247, "titulo": "Wall Street banks launch record $60bn chip deal for Broadcom and Anthropic", "url": "https://www.ft.com/content/5b9c8ce3-d07c-46f9-8cea-cbc4e7f8ccca?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-05T20:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bancos de investimento da Wall Street estão lançando um empréstimo recorde de 60 bilhões de dólares para as empresas Broadcom e Anthropic. Esta operação de sindicatação testa a disposição dos bancos para fornecer financiamento em um momento de crescentes preocupações sobre a dívida crescente associada à inteligência artificial.", "titulo_pt": "Bancos de wall Street lançam empréstimo recorde de 60 bilhões para Broadcom e Anthropic", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 196799, "titulo": "Tesouro Direto sai do ar em meio à forte oscilação dos juros futuros", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/tesouro-direto-sai-do-ar-em-meio-a-forte-oscilacao-dos-juros-futuros.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-05T20:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A plataforma Tesouro Direto, do
