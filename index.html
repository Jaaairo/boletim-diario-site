rain face new Iran attacks after US strike on Qeshm Island", "url": "https://www.aljazeera.com/news/2026/11/18/kuwait-bahrain-face-new-iran-attacks-after-us-strike-on-qeshm-island?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-18T16:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Kuwait e Bahrein enfrentam novos ataques iranianos após o ataque americano em Qeshm. Os países do Golfo condenaram os ataques iranianos.", "titulo_pt": "Kuwait e bahrein enfrentam novos ataques iranianos após ataque americano em Qeshm", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 272351, "titulo": "Conferência de Yalta: o que foi o encontro que redesenhou o mundo há 81 anos — e por que ele é comparado à reunião de Trump, Putin e Xi", "url": "https://www.bbc.com/portuguese/articles/c5vg2mrwyjr2o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-18T16:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Winston Churchill, Franklin Roosevelt e Joseph Stalin se reuniram em Yalta para definir o mapa de influências da Europa após a Segunda Guerra Mundial. Este encontro, ocorrido há 81 anos, é frequentemente comparado a reuniões modernas de líderes mundiais.", "titulo_pt": "Conferência de Yalta: o que foi o encontro que redesenhou o mundo há 81 anos — e por que ele é comparado à reunião de Trump, Putin e Xi", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}], "mundo__eventos": [], "economia": [{"id": 272286, "titulo": "Fazenda deixa metano de petrolíferas de fora de proposta inicial do SBCE", "url": "https://www.jota.info/energia/fazenda-deixa-metano-de-petroliferas-de-fora-de-proposta-inicial-do-sbce", "fonte_id": "jota", "data_pub": "2026-11-18T17:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A proposta inicial do SBCE não incluiu o metano de petrolíferas. A eventual incorporação do gás ao sistema dependerá do avanço da regulamentação específica sobre o tema.", "titulo_pt": "Fazenda deixa metano de petrolíferas de fora de proposta inicial do SBCE", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 272059, "titulo": "Caso Master e pandemia desafiam atuação de procurador-geral mais longevo da história do BC", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/caso-master-e-pandemia-desafiam-atuacao-de-procurador-geral-mais-longevo-da-historia-do-bc.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T17:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O procurador-geral Cristiano Cozer conduziu os depoimentos dos servidores do Banco Central suspeitos de favorecimento ao Master, mas sua atuação ficou restrita aos bastidores. O caso envolvendo os depoimentos foi central nas apurações que levaram à liquidação do conglomerado de Daniel Vorcaro.", "titulo_pt": "Caso Master e pandemia desafiam atuação de procurador-geral mais longevo da história do BC", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 272060, "titulo": "Toyota inaugura fábrica em Sorocaba e confirma produção de picape nacional", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/toyota-inaugura-fabrica-em-sorocaba-e-confirma-producao-de-picape-nacional.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T16:56:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Toyota inaugurou uma nova linha de produção em Sorocaba, no interior de São Paulo, onde será montada a picape Corolla Deck, que terá versão híbrida flex. A picape será posicionada abaixo da futura geração da Hilux argentina.", "titulo_pt": "Toyota inaugura nova linha de produção em Sorocaba e confirma produção de picape corolla deck", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 272287, "titulo": "Imunoterapia será o primeiro medicamento a passar pelo Comitê de Negociação de Preços da Saúde", "url": "https://www.jota.info/saude/imunoterapia-sera-o-primeiro-medicamento-a-passar-pelo-comite-de-negociacao-de-precos-da-saude", "fonte_id": "jota", "data_pub": "2026-11-18T16:49:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O pembrolizumabe, um medicamento imunoterápico usado no tratamento de diversos tipos de câncer, será avaliado pelo Comitê de Negociação de Preços da Saúde para possíveis negociações de preços. O medicamento já foi incluído no SUS, mas o Conitec busca ampliar seu uso.", "titulo_pt": "Imunoterapia será avaliada pelo conitec para Negociação de Preços", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 272718, "titulo": "JPMorgan seeks to revive stalled software debt sale with steep price cuts", "url": "https://www.ft.com/content/16a99ff4-6060-4c81-8c4f-7e43503e4a11?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-18T16:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A JPMorgan está tentando reviver a venda de um pacote de software valorizado em US$ 2 bilhões, que estava em stase, oferecendo descontos significativos. O banco está utilizando o mercado de títulos de renda variável de alta renda para liquidar a dívida, que oferece uma taxa de juros de dois dígitos.", "titulo_pt": "Jpmorgan busca reviver venda de dívida de software em stase com descontos significativos", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 272062, "titulo": "Receita mais otimista com queda da sonegação pode reduzir alíquota da reforma tributária", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/11/receita-mais-otimista-com-queda-da-sonegacao-pode-reduzir-aliquota-da-reforma-tributaria.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T16:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado questiona a visão pessimista da Receita Federal sobre a contribuição da reforma tributária para reduzir a sonegação e a inadimplência. Essa dúvida é crucial para definir a alíquota da CBS em 2027, decisão que dependerá de uma resolução do Senado.", "titulo_pt": "Senado questiona visão pessimista da receita sobre reforma tributária", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 272064, "titulo": "Wall Street prevê que crescimento dos lucros das empresas cairá pela metade em 2027", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/negocios/2026/11/wall-street-preve-que-crescimento-dos-lucros-das-empresas-caira-pela-metade-em-2027.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T15:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os bancos de Wall Street esperam que o crescimento dos lucros das empresas globais decelere significativamente em 2027, devido à redução do ritmo dos investimentos em inteligência artificial, que havia impulsionado os mercados acionários anteriormente.", "titulo_pt": "Wall Street prevê que crescimento dos lucros das empresas cairá pela metade em 2027", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 272174, "titulo": "Número de desempregados há dois anos ou mais é o menor já registrado", "url": "https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/numero-de-desempregados-ha-dois-anos-ou-mais-e-o-menor-ja-registrado", "fonte_id": "agencia_brasil_economia", "data_pub": "2026-11-18T15:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O número de trabalhadores desempregados há pelo menos dois anos ou mais foi o menor em 14 anos no terceiro trimestre de 2026, segundo dados da Pesquisa Nacional por Amostra de Domicílios Contínua do IBGE. Este número atingiu 971 mil pessoas, o menor valor desde 2012.", "titulo_pt": "Número de desempregados há dois anos ou mais é o menor já registrado", "veiculo": "Agência Brasil - Economia", "pais": "Brasil", "classe": "A"}, {"id": 272065, "titulo": "Brasileiros gastaram mais de R$ 40 bilhões com bets até julho de 2026", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/11/brasileiros-gastaram-mais-de-r-40-bilhoes-com-bets-ate-julho-de-2026.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T15:12:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Os brasileiros gastaram mais de R$ 40 bilhões com apostas online nos primeiros sete meses de 2026, de acordo com um estudo do Comsefaz. O valor refere-se a transferências líquidas via Pix entre janeiro e julho.", "titulo_pt": "Brasileiros gastaram mais de R$ 40 bilhões com bets até julho de 2026", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 272067, "titulo": "Diretor do BC defende atualização na lei de liquidação de bancos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/diretor-do-bc-defende-atualizacao-na-lei-de-liquidacao-de-bancos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T14:25:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ailton de Aquino, diretor de fiscalização do Banco Central, defende a atualização da lei que regula a intervenção em bancos, que aguarda aprovação no plenário da Câmara dos Deputados.", "titulo_pt": "Diretor do BC defende atualização na lei de intervenção em bancos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 272068, "titulo": "Anthropic deve anunciar preço de ações para IPO nesta quarta-feira", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/ia/2026/11/anthropic-deve-anunciar-preco-de-acoes-para-ipo-nesta-quarta-feira.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T14:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Anthropic divulgará o preço das ações para seu IPO na Nasdaq nesta quarta-feira, 18. O IPO ocorrerá na quinta-feira, 19.", "titulo_pt": "Anthropic anunciará preço de ações para IPO nesta quarta-feira", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 272070, "titulo": "Transmissoras de energia querem evitar dividir receita de leilão de baterias com consumidores", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/economia-sustentavel/2026/11/transmissoras-de-energia-querem-evitar-dividir-receita-de-leilao-de-baterias-com-consumidores.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas de transmissão de energia estão pressionando a Aneel para garantir que não terão de compartilhar parte do dinheiro recebido de investimentos em baterias, caso sejam vencedoras do leilão do governo. O leilão está programado para ocorrer e envolve investimentos significativos em sistemas de baterias.", "titulo_pt": "Transmissoras de energia querem manter receita de investimentos em baterias para si", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 272071, "titulo": "Previ acumula perda bilionária com queda das ações do Banco do Brasil", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/11/previ-acumula-perda-bilionaria-com-queda-das-acoes-do-banco-do-brasil.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Previ, uma das principais acionistas do Banco do Brasil, registrou uma perda de aproximadamente R$ 2,5 bilhões em seu investimento na empresa devido à queda das ações após o resultado do terceiro trimestre ser divulgado e as eleições.", "titulo_pt": "Previ registra perda bilionária com queda das ações do Banco do Brasil", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 272073, "titulo": "Governo de SP busca fundos de infraestrutura e sustentabilidade para investir até R$ 75 mi", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/painelsa/2026/11/governo-de-sp-busca-fundos-de-infraestrutura-ou-sustentabilidade-para-investir-ate-r-75-mi.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T13:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Desenvolve SP, agência de fomento do governo paulista, lançou uma chamada pública para seleção de Fidcs e Fips com foco em inovação e sustentabilidade, destinados a pequenas e médias empresas ou infraestrutura e cadeias produtivas. O investimento pode chegar a R$ 75 milhões.", "titulo_pt": "Governo de SP busca fundos de infraestrutura e sustentabilidade para investir até R$ 75 mi", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 272256, "titulo": "Dólar a R$ 5,80 é oportunidade? Goldman vê real rendendo mais que a bolsa em 2027", "url": "https://exame.com/invest/mercados/dolar-a-r-580-e-oportunidade-goldman-ve-real-rendendo-mais-que-a-bolsa-em-2027/", "fonte_id": "exame", "data_pub": "2026-11-18T13:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Goldman Sachs considera a taxa do dólar a R$ 5,80 como uma oportunidade, apontando o real com bom rendimento em relação à bolsa em 2027. No entanto, o banco destaca que o risco fiscal é o maior desafio.", "titulo_pt": "Dólar a R$ 5,80 é oportunidade? Goldman vê real rendendo mais que a bolsa em 2027", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 272293, "titulo": "Empresas planejam investir em 2027, mas juros altos e incertezas ameaçam projetos", "url": "https://www.jota.info/tributos-e-empresas/mercado/empresas-planejam-investir-em-2027-mas-juros-altos-e-incertezas-ameacam-projetos", "fonte_id": "jota", "data_pub": "2026-11-18T13:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Empresas privadas planejam investimentos para 2027, mas altos juros e incertezas econômicas podem comprometer esses projetos. O setor privado é responsável por 85% dos investimentos no Brasil e aponta o custo do crédito e a falta de previsibilidade como principais obstáculos.", "titulo_pt": "Empresas planejam investimentos para 2027, mas juros altos e incertezas ameaçam projetos", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}], "economia__eventos": [], "tecnologia": [{"id": 272857, "titulo": "Google is forcing Android app developers to properly support foldables", "url": "https://www.theverge.com/tech/1036796/google-android-app-games-developers-foldables-support", "fonte_id": "the_verge", "data_pub": "2026-11-18T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A partir de abril de 2027, a Google exigirá que desenvolvedores de aplicativos para Android tenham um nível básico de suporte a dispositivos dobráveis. Caso contrário, eles correm o risco de não poderem publicar ou atualizar seus aplicativos.", "titulo_pt": "Google obriga desenvolvedores de aplicativos Android a suportarem dispositivos dobráveis a partir de 2027", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 272867, "titulo": "The US Lost Its Measles Elimination Status. It’ll Take Years to Get It Back", "url": "https://www.wired.com/story/us-lost-measles-elimination-status-years-to-recover/", "fonte_id": "wired", "data_pub": "2026-11-18T17:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A doença highly contagious de sarampo está se espalhando pelo país e pode estar se disseminando mais rapidamente. Os EUA perderam seu status de eliminação do sarampo e recuperar esse status levará anos.", "titulo_pt": "EUA perderam o Status de eliminação do sarampo. Voltar lhe levará anos", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 272858, "titulo": "Disney’s new Star Wars animatronics interact with guests using AI", "url": "https://www.theverge.com/tech/1036729/disney-star-wars-anzellans-animatronic-amazon-aws-cloud-ai", "fonte_id": "the_verge", "data_pub": "2026-11-18T17:50:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Walt Disney Imagineering R&D desenvolveu três novos protótipos de animatrônicos para Star Wars que utilizam inteligência artificial para interagir com os visitantes de forma mais autêntica. Atualmente, os animatrônicos ou seguem movimentos pré-definidos ou são controlados por palhaços ocultos.", "titulo_pt": "Novos animatrônicos da disney para Star Wars usam IA para interagir com os visitantes", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 272198, "titulo": "Senado avança com proposta para usar IA contra desmatamento", "url": "https://www.cnnbrasil.com.br/economia/money/inteligencia-artificial/senado-avanca-com-proposta-para-usar-ia-contra-desmatamento/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-18T17:38:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Senado aprovou uma proposta que usa inteligência artificial contra o desmatamento, exigindo supervisão humana e estabelecendo limites ao uso de dados e punições automáticas.", "titulo_pt": "Senado aprova proposta de IA contra desmatamento", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 272344, "titulo": "A falha crítica descoberta na linguagem de programação usada por 90% das grandes empresas do mundo", "url": "https://www.bbc.com/portuguese/articles/cqy7rgm85vzno?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-18T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma empresa de tecnologia descobriu uma falha crítica em uma das linguagens de programação mais utilizadas do mundo, utilizando inteligência artificial para identificar a vulnerabilidade. Este PHP, que é usado por 90% das grandes empresas do mundo, contém a falha descoberta.", "titulo_pt": "Falha crítica descoberta na linguagem de programação php usado por 90% das grandes empresas do mundo", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 272869, "titulo": "Inside Nvidia’s First Post-Jensen All-Hands: Pay Raises and More Equity", "url": "https://www.wired.com/story/inside-nvidias-first-all-hands-without-jensen-huang-as-ceo/", "fonte_id": "wired", "data_pub": "2026-11-18T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A interina CEO Collette Kress tentou aliviar as preocupações dos funcionários após a demissão de Jensen Huang, prometendo aumentar os salários e oferecer mais ações da empresa.", "titulo_pt": "Dentro da primeira reunião geral da Nvidia sem a presence de jensen: aumentos de salário e mais benefícios", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 272938, "titulo": "Build a Personal Brand to Help Employers Find You", "url": "https://spectrum.ieee.org/personal-branding-for-engineers", "fonte_id": "ieee_spectrum", "data_pub": "2026-11-18T17:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de desenvolvedores trabalhando por conta própria dobrou em um ano, segundo pesquisa da Stack Overflow. Freelancers e donos de empresas individuais passaram de 4% para 10% dos respondentes.", "titulo_pt": "Construa uma marca pessoal para ajudar os empregadores a encontrá-lo", "veiculo": "IEEE Spectrum", "pais": "EUA", "classe": "A"}, {"id": 272870, "titulo": "A Muslim Author Is Suing xAI After People Used Grok to Strip Her Hijab", "url": "https://www.wired.com/story/a-muslim-author-is-suing-xai-after-people-used-grok-to-strip-her-hijab/", "fonte_id": "wired", "data_pub": "2026-11-18T17:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora muçulmana Amani Al-Khatahtbeh está processando a xAI após pessoas usarem o programa Grok para remover sua headscarf. O advogado Hillary Nappi, que representa Al-Khatahtbeh, afirma que a única maneira de obter alguma mudança contra grandes tecnológicas é processá-las.", "titulo_pt": "Autora muçulmana processa xai após uso de Grok para remover sua headscarf", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 272719, "titulo": "US tech stocks lower after Nvidia results", "url": "https://www.ft.com/content/f085b811-fc20-425f-88d8-9f98e178636a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-18T17:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da tecnologia dos Estados Unidos caíram após os resultados da Nvidia. Uma empresa de chips elevou sua projeção e seu novo chefe declarou que 'é negócios como sempre', após a notícia sobre assuntos envolvendo Huang que levaram a uma venda.", "titulo_pt": "Ações de tecnologia dos EUA caem após resultados da Nvidia", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 272681, "titulo": "Vance scraps schedule to address tech outages as Trump admin insists incidents aren't linked", "url": "https://www.cnbc.com/2026/11/18/trump-tech-outages-nsa-faa-microsoft.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-18T17:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vance cancelou sua agenda para tratar de interrupções tecnológicas recentes, enquanto o governo Trump insiste que os incidentes não estão ligados. As interrupções incluíram um paralisação nacional de voos, um problema de Outlook da Microsoft e um suposto blackout no sistema de comunicações da Agência de Segurança Nacional.", "titulo_pt": "Vance cancela agenda para tratar de interrupções tecnológicas enquanto governo Trump afirma que incidentes não estão ligados", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 272871, "titulo": "Artex Is Criminals’ New Favorite ‘Point-and-Shoot’ AI Hacking Tool", "url": "https://www.wired.com/story/artex-ai-hacking-tools/", "fonte_id": "wired", "data_pub": "2026-11-18T16:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Artex e ferramentas semelhantes de teste de penetração permitem que hackers inexperientes escaneiem sistemas alvo em busca de vulnerabilidades e realizem ataques com base em prompts fornecidos a chatbots.", "titulo_pt": "Artex é novo ferramenta favorita de Criminals para Hacking automatizado", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 272861, "titulo": "Remember the frontier AI pause? Chip companies don’t either", "url": "https://www.theverge.com/ai-artificial-intelligence/1036549/nvidia-amd-earnings-fall-2026-chips-pause-frontier-models", "fonte_id": "the_verge", "data_pub": "2026-11-18T15:44:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em verão, OpenAI interrompeu um dos seus maiores testes de inteligência artificial após os agentes acidentalmente hackearem o Hugging Face. Em setembro, o CEO da Anthropic, Dario Amodei, pediu para frear o desenvolvimento das mais poderosas inteligências artificiais, alertando sobre o risco de suas aplicações maliciosas.", "titulo_pt": "Lembram da pausa no AI fronteiriço? As empresas de chip não se lembram", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 272470, "titulo": "The Reluctant Winner of the AI Race", "url": "https://www.theatlantic.com/technology/2026/11/anthropic-winner-ai-race/689479/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-11-18T15:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma empresa que nos leva para uma era de ansiedade está prestes a alcançar uma avaliação de mercado de um trilhão de dólares.", "titulo_pt": "O vencedor relutante da corrida para a inteligência artificial", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 272066, "titulo": "Dicionário Cambridge escolhe 'humano' como palavra do ano de 2026, em reação à IA", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/tec/2026/11/dicionario-cambridge-escolhe-humano-como-palavra-do-ano-de-2026-em-reacao-a-ia.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-11-18T15:05:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O dicionário Cambridge escolheu 'humano' como palavra do ano de 2026, em resposta à crescente presença da inteligência artificial em diversos tipos de conteúdo criado digitalmente.", "titulo_pt": "Cambridge escolhe 'humano' como palavra do ano de 2026, em reação à IA", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 272680, "titulo": "Nvidia’s Kress faces a divided workforce as some employees push for Huang’s return", "url": "https://www.cnbc.com/2026/11/18/nvidia-kress-jensen-huang-return.html", "fonte_id": "cnbc_international", "data_pub": "2026-11-18T15:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Colette Kress, interina CEO da Nvidia, está tentando manter a paz entre os funcionários enquanto alguns pressionam por um retorno de Jensen Huang, fundador e CEO anterior da empresa.", "titulo_pt": "Nvidia: ceo interina enfrenta trabalhadores divididos com retorno de Huang em pauta", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}, {"id": 272872, "titulo": "‘Just Ridiculous’: A Famed Philosopher Takes on AI Consciousness", "url": "https://www.wired.com/story/just-ridiculous-a-famed-philosopher-takes-on-ai-consciousness/", "fonte_id": "wired", "data_pub": "2026-11-18T15:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Thomas Nagel, um filósofo famoso conhecido por seu trabalho sobre consciência em não-humanos, ganhou esta semana o prêmio Berggruen de um milhão de dólares por suas contribuições para o campo. Ele tem muitas observações sobre a consciência da inteligência artificial.", "titulo_pt": "‘Muito ridículo’: um renomado filósofo aborda a consciência da IA", "veiculo": "Wired", "pais": "EUA", "classe": "A"}], "tecnologia__eventos": [], "ciencia": [{"id": 272783, "titulo": "NASA’s Voyager 1 reaches one light-day milestone after 50 years in space", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/19/2003868002", "fonte_id": "taipei_times", "data_pub": "2026-11-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Voyager 1, da NASA, atingiu uma marca de um dia-luz após 50 anos no espaço. Este feito marca uma importante distância percorrida pelo satélite.", "titulo_pt": "Voyager 1 atinge marca de um dia-luz após 50 anos no espaço", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 272884, "titulo": "Making diversity count: New paper highlights overlooked scientists in the chemical sciences curriculum", "url": "https://phys.org/news/2026-11-diversity-paper-highlights-overlooked-scientists.html", "fonte_id": "phys_org", "data_pub": "2026-11-18T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo artigo de James Wilton-Ely, Ravi Singh e colaboradores examina como a diversificação do currículo pode ajudar a combater a sobrerrepresentação de cientistas de origem minoritária na educação em ciências químicas.", "titulo_pt": "Contar com a diversidade: novo artigo destaca cientistas minoritários negligenciados na educação química", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 272885, "titulo": "Record ocean warming hundreds of meters below B.C. coast linked to El Niño", "url": "https://phys.org/news/2026-11-ocean-hundreds-meters-bc-coast.html", "fonte_id": "phys_org", "data_pub": "2026-11-18T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Temperaturas oceanográficas recordes foram registradas na costa da Colúmbia Britânica, com aumento de até 2,5 graus Celsius em comparação com os valores de longo prazo no observatório submarino da Ocean Networks Canada. Esses resultados indicam a influência dos efeitos do El Niño na costa do Pacífico canadense.", "titulo_pt": "Aquecimento oceânico recorde a centenas de metros abaixo da costa da colúmbia britânica associado ao El Niño", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 272886, "titulo": "Bee-lieve it or not, bumblebees have a sweet spot for salt", "url": "https://phys.org/news/2026-11-bee-lieve-bumblebees-sweet-salt.html", "fonte_id": "phys_org", "data_pub": "2026-11-18T17:40:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os bétulas respondem a diferentes níveis de cálcio, potássio, magnésio e sódio em néctar artificial, com minerais sendo essenciais para a saúde dos bétulas, mas em excesso podem ser prejudiciais.", "titulo_pt": "Acredite ou não, as bétulas têm um ponto favorito para o sal", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 272939, "titulo": "What Is the Moon Base?", "url": "https://www.nasa.gov/learning-resources/for-kids-and-students/what-is-the-moon-base/", "fonte_id": "nasa_news", "data_pub": "2026-11-18T17:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A NASA está voltando a enviar astronautas à Lua e planeja estabelecer uma base lunar permanente. Esta base será o primeiro assentamento lunar humano, servindo como um local para vida, trabalho e exploração lunar.", "titulo_pt": "O que é a Base lunar?", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 272887, "titulo": "Writing changes language less than we think", "url": "https://phys.org/news/2026-11-language.html", "fonte_id": "phys_org", "data_pub": "2026-11-18T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A escrita é uma das mais importantes invenções na história humana, transformando a maneira como compartilhamos conhecimento, comunicamos e passamos informações de uma geração para a outra. No entanto, ela pode não ter alterado significativamente a forma como construímos frases e a complexidade das nossas línguas.", "titulo_pt": "A escrita altera menos a língua do que pensamos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 272888, "titulo": "Miniaturization found at the origin of amphibians opens new ecological territory", "url": "https://phys.org/news/2026-11-miniaturization-amphibians-ecological-territory.html", "fonte_id": "phys_org", "data_pub": "2026-11-18T17:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Amphibiários, compreendendo rãs, salamandras e caicós, representam mais de 9.000 espécies e, em média, são os vertebrados de quatro membros mais pequenos, com alguns medindo menos de 7 milímetros. Seus ancestrais mais antigos eram animais muito diferentes, sendo os temnospondílidos, um grupo extinto, de 1 a 5 metros de comprimento, predadores aquáticos ou semiacuáticos.", "titulo_pt": "Miniaturização na origem dos amphibiários abre novos territórios ecológicos", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 272889, "titulo": "From 'paper parks' to real protection: Guide offers steps to support marine protected areas", "url": "https://phys.org/news/2026-11-paper-real-marine-areas.html", "fonte_id": "phys_org", "data_pub": "2026-11-18T17:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O estudo destaca que o sucesso das áreas protegidas marítimas (APMs) não depende apenas da quantidade de oceanos designados para proteção, mas também da forma como essas áreas são planejadas, governadas, monitoradas e fiscalizadas. O mundo trabalha para proteger 30% da terra e do mar até 2030.", "titulo_pt": "De 'papéis de parque' para proteção real: guia oferece passos para apoiar as áreas protegidas marítimas", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 272937, "titulo": "Origami and solar arrays", "url": "https://spacenews.com/origami-and-solar-arrays/", "fonte_id": "spacenews", "data_pub": "2026-11-18T16:56:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mike Gruss, da SpaceNews, conversou com Thomas Sinn, CEO da Dcubed, sobre uma nova rodada de financiamento de US$ 30 milhões da empresa durante o Space Tech Expo Europe.", "titulo_pt": "Origami e painéis solares", "veiculo": "SpaceNews", "pais": "EUA", "classe": "A"}, {"id": 272418, "titulo": "Fin de la espera: ya se sabe cuándo la NASA mostrará las primeras imágenes del telescopio Roman en vivo", "url": "https://www.lanacion.com.ar/ciencia/fin-de-la-espera-ya-se-sabe-cuando-la-nasa-mostrara-las-primeras-imagenes-del-telescopio-roman-en-nid18112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-18T16:47:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A NASA anunciou que transmitirá as primeiras imagens do telescópio Roman a partir de São Francisco. O evento marcará a revelação das imagens do observatório.", "titulo_pt": "Fim da espera: já se sabe quando a NASA mostrará as primeiras imagens do telescópio Roman ao vivo", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 272897, "titulo": "Ancient teeth confirm Homo erectus survived in southern China's dense tropical forests", "url": "https://phys.org/news/2026-11-ancient-teeth-homo-erectus-survived.html", "fonte_id": "phys_org", "data_pub": "2026-11-18T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Homo erectus viveu por quase 2 milhões de anos, mais tempo do que a espécie Homo sapiens. Essa espécie de antigo humano se espalhou de África até a China e Java, Indonésia, por áreas de savana e florestas densas, mas ainda é limitada nossa compreensão sobre sua flexibilidade, condições ambientais preferidas e capacidade de adaptação.", "titulo_pt": "Dentes antigos confirmam que Homo erectus sobreviveu em florestas tropicais densas do sul da China", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 272925, "titulo": "Two stars in the Andromeda galaxy merged before astronomers’ eyes", "url": "https://www.sciencenews.org/article/stars-andromeda-galaxy-merge-little-bao", "fonte_id": "science_news", "data_pub": "2026-11-18T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos observaram duas estrelas na Galáxia de Andrômeda se fundirem, o que fornece pistas sobre por que algumas pares de estrelas se combinam enquanto outros permanecem separados.", "titulo_pt": "Dois astros na galáxia de andrômeda se fundiram em nossos olhos", "veiculo": "Science News", "pais": "EUA", "classe": "A"}, {"id": 272940, "titulo": "NASA Data Clinches First-of-Its-Kind Stellar Merger", "url": "https://science.nasa.gov/missions/webb/nasa-data-clinches-first-of-its-kind-stellar-merger/", "fonte_id": "nasa_news", "data_pub": "2026-11-18T16:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores identificaram uma estrela menor que o Sol que mergulhou e se fundiu com uma supergigante estelar em um galáxia vizinha à Via Láctea, a Andrômeda. O evento foi confirmado por observações rápidas do James Webb da NASA.", "titulo_pt": "Dados da NASA confirmam primeira Merger estelar de suporte", "veiculo": "NASA Breaking News", "pais": "EUA", "classe": "A"}, {"id": 272903, "titulo": "Voyager 1 spacecraft reaches one light-day milestone", "url": "https://phys.org/news/2026-11-voyager-spacecraft-day-milestone.html", "fonte_id": "phys_org", "data_pub": "2026-11-18T15:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O foguete Voyager 1, que está em viagem há quase 50 anos, atingiu uma marca de distância de um dia-luz de distância em relação à Terra em uma ocasião recente.", "titulo_pt": "Voyager 1 atinge marca de um dia-luz", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 272302, "titulo": "Sonda Voyager 1, da Nasa, atinge marco histórico de um dia-luz de distância da Terra", "url": "https://www.dw.com/pt-br/sonda-voyager-1-da-nasa-atinge-marco-histórico-de-um-dia-luz-de-distância-da-terra/a-79972287?maca=bra-rss-br-all-1030-rdf", "fonte_id": "dw_brasil", "data_pub": "2026-11-18T14:55:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A sonda Voyager 1 da NASA completou quase 50 anos de viagem espacial e atingiu uma distância de 26 bilhões de quilômetros da Terra. A espaçonave está destinada a explorar a Via Láctea, possivelmente por um tempo indeterminado.", "titulo_pt": "Sonda Voyager 1 da Nasa atinge marco histórico de um dia-luz de distância da Terra", "veiculo": "DW Brasil", "pais": "Alemanha", "classe": "A"}, {"id": 272910, "titulo": "STAT+: FDA discloses reasons for rejecting Summit drug", "url": "https://www.statnews.com/2026/11/18/biotech-news-fda-discloses-reasons-for-rejecting-summit-drug/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-11-18T14:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A FDA divulgou sua carta de resposta completa a Summit Therapeutics, explicando os motivos do rejeitamento do medicamento contra o câncer de pulmão da empresa. Entre os motivos estão questões técnicas e de eficácia do medicamento.", "titulo_pt": "FDA explica rejeição do medicamento contra câncer de pulmão da Summit", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}], "ciencia__eventos": [], "cultura": [{"id": 272788, "titulo": "Researchers tag two butterflies with microtransmitters", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/19/2003868012", "fonte_id": "taipei_times", "data_pub": "2026-11-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores marcaram duas borboletas com transmissores microscópicos para monitoramento. Este método permitirá estudar o comportamento e o movimento dessas borboletas de perto.", "titulo_pt": "Pesquisadores marcam duas borboletas com transmissores microscópicos", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 272789, "titulo": "Complete works of Taiwanese Hakka writer Wu Zhuo-liu released", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/19/2003868013", "fonte_id": "taipei_times", "data_pub": "2026-11-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foram lançadas as obras completas do escritor taiwanês hakka Wu Zhuo-liu. O livro reú ampaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-18T16:47:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Movimentos têm buscado reconhecer a origem negra de figuras históricas como Machado de Assis, Chiquinha Gonzaga e Nilo Peçanha. Essa iniciativa visa resgatar a herança negra desses ícones.", "titulo_pt": "De Machado de Assis a chiquinha gonzaga, os grandes nomes cuja origem negra está sendo resgatada", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 272044, "titulo": "Repórter André Hernan tem leucemia diagnosticada e fará transplante de medula", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/11/reporter-andre-hernan-tem-leucemia-diagnosticada-e-fara-transplante-de-medula.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-18T16:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O repórter André Hernan, que trabalha para a ESPN e Amazon Prime Video, foi diagnosticado com leucemia e fará um transplante de medula óssea no início de dezembro, com a doadora sendo sua filha Nina, de 16 anos.", "titulo_pt": "Repórter André Hernan diagnosticado com leucemia e fará transplante de medula óssea", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 272808, "titulo": "Islam projected to surpass Christianity as world’s largest religion by 2035", "url": "https://www.scmp.com/news/world/article/3374959/islam-projected-surpass-christianity-worlds-largest-religion-2035", "fonte_id": "scmp", "data_pub": "2026-11-18T16:01:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "De acordo com projeções do Pew Research Centre, o Islã deverá ultrapassar o Cristianismo como a religião mais numerosa do mundo em 2035. O crescimento mais rápido do Islã, de acordo com o Pew, é atribuído principalmente ao maior número de nascimentos entre os muçulmanos em comparação com outros grupos religiosos principais.", "titulo_pt": "Islã deve superar o cristianismo como religião mais numerosa no mundo em 2035", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 272045, "titulo": "Animação 'Jim Queen' parte de vírus anti-gay para fazer uma comédia queer afiada", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/animacao-jim-queen-parte-de-virus-anti-gay-para-fazer-uma-comedia-queer-afiada.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-18T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Jim Perfeito é um influenciador gay e vaidoso que contrai um vírus chamado heterotopzis, que o transforma em hétero, causando angústia à comunidade LGBTQIA+.", "titulo_pt": "Animação 'Jim Queen' parte de um vírus anti-gay para criar uma comédia queer afiada", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 272046, "titulo": "'Eu Sou o Rocky' lembra bastidores de filme clássico e emociona", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/eu-sou-o-rocky-lembra-bastidores-de-filme-classico-e-emociona.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-18T16:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Em 1976, Sylvester Stallone, um ator desconhecido, produziu e atuou em 'Rocky: Um Lutador', que se tornou um grande sucesso e venceu o Oscar em 1977. Pouca gente conhece os bastidores dessa história.", "titulo_pt": "Eu Sou o Rocky lembra bastidores de filme clássico e emociona", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 272996, "titulo": "Theodore Zeldin obituary", "url": "https://www.theguardian.com/books/2026/nov/18/theodore-zeldin-obituary", "fonte_id": "guardian_culture", "data_pub": "2026-11-18T15:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Theodore Zeldin, historiador reverenciado, autor e francófilo, criou um site em 2001 chamado Oxford Muse, com o objetivo de unir estranhos em conversas libertadoras. Ele destacava a importância do dança na história da liberdade, citando exemplos como a abertura de 700 salões de dança durante a Revolução Francesa e a mudança de padrões de dança no final dos anos 1960.", "titulo_pt": "Obituário de theodore Zeldin", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 272047, "titulo": "SBT escala Marcos e Belutti para disputar audiência de Natal com Fábio Jr e Roupa Nova na Globo", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/11/sbt-escala-marcos-e-belutti-para-disputar-audiencia-de-natal-com-fabio-jr-e-roupa-nova-na-globo.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-18T15:13:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O SBT gravou um especial de Natal com Marcos e Belutti, que será exibido no dia 24 de dezembro às 22h45. O programa será apresentado por Hellen Ganzarolli e Luís Ricardo.", "titulo_pt": "SBT escalou Marcos e Belutti para especial de Natal em competição com Fábio Jr e Roupa Nova na Globo", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 272048, "titulo": "Sociedade se sente traída por Suzane von Richthofen porque se vê nela, diz criminóloga Ilana Casoy", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/cotidiano/2026/11/sociedade-se-sente-traida-por-suzane-von-richthofen-porque-se-ve-nela-diz-criminologa-ilana-casoy.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-18T15:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ilana Casoy, uma criminóloga, afirma que a sociedade se sente traída por Suzane von Richthofen porque vê em ela uma reflexão de si mesma. O caso de Suzane, retratado em um novo documentário da Netflix, era inicialmente suspeito de um assalto, com os pais mortos por supostos ladrões.", "titulo_pt": "Sociedade se sente traída por Suzane von Richthofen, diz criminóloga", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 272995, "titulo": "Joanna Page says ‘inappropriate’ male actor whispered ‘awful stuff’ to her", "url": "https://www.theguardian.com/tv-and-radio/2026/nov/18/joanna-page-says-inappropriate-male-actor-whispered-awful-stuff-to-her-im-a-celebrity", "fonte_id": "guardian_culture", "data_pub": "2026-11-18T14:53:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Joanna Page, atriz de Gavin e Stacey, relatou que um ator masculino, com quem trabalhou, foi 'inapropriado' ao sussurrar 'coisas horríveis' em seu ouvido e cantar canções sobre o que ele pretendia fazer com ela. Ela fez esses comentários durante um programa de 'A Famosa está no Celebrite, ... Liberte-me daqui!'", "titulo_pt": "Joanna Page fala sobre ator masculino 'inapropriado' durante gravações", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 272994, "titulo": "‘Cherubino’s in’t’ cupboard’: Mozart via Bradford and Bollywood is a blast", "url": "https://www.theguardian.com/music/2026/nov/18/mozart-marriage-figaro-bradford-bollywood-yorkshire", "fonte_id": "guardian_culture", "data_pub": "2026-11-18T14:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A versão de Ian McMillan do 'Casamento do Figaro' para o Teatro de Artes de Bradford situa a ópera nos anos 1970 de Bradford, Inglaterra. A produção, que incorpora instrumentos indianos clássicos à partitura reformulada, é energeticamente executada e de baixo custo, sendo altamente prazerosa.", "titulo_pt": "‘Cherubino está no armário’: 'casamento do figaro' de ian mcmillan com influências de Bradford e Bollywood", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 272049, "titulo": "Banda Europe, de 'The Final Countdown', anuncia três shows no Brasil", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/11/banda-europe-de-the-final-countdown-anuncia-tres-shows-no-brasil.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-11-18T14:27:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A banda sueca Europe anunciou três shows no Brasil em abril de 2027, passando por São Paulo, Curitiba e Porto Alegre. O evento faz parte da turnê do álbum 'Come This Madness'.", "titulo_pt": "Banda Europe, de 'The Final Countdown', anuncia três shows no Brasil", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 272991, "titulo": "A TikTok superstar bares all: Siorna Ashby’s best shot", "url": "https://www.theguardian.com/artanddesign/2026/nov/18/a-tiktok-superstar-bares-all-siorna-ashby-best-shot", "fonte_id": "guardian_culture", "data_pub": "2026-11-18T14:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A fotógrafa explorou a presença e personalidade de Meg através do seu corpo e gestos, em vez de focar apenas no rosto e olhos. O projeto 'Body Like Mine' compara a percepção externa do corpo com a experiência interna.", "titulo_pt": "Uma superestrela do TikTok descalça: a melhor pose de siorna Ashby", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}], "cultura__eventos": [], "sociedade": [{"id": 272784, "titulo": "More rational antibiotic use needed, hospital says", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/19/2003868008", "fonte_id": "taipei_times", "data_pub": "2026-11-19T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O hospital enfatiza a necessidade de um uso mais racional de antibióticos. A instituição destaca a importância de uma utilização correta para evitar a resistência aos medicamentos.", "titulo_pt": "Mais uso racional de antibióticos necessário, diz hospital", "veiculo": "Taipei Times", "pais": "Taiw ador após perseguição em prédio de SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 272278, "titulo": "GDF troca gestão do Hvep e promete aumento de 25% nos atendimentos", "url": "https://www.metropoles.com/distrito-federal/gdf-troca-gestao-do-hvet-e-promete-aumento-de-25-no-numero-de-atendimentos", "fonte_id": "metropoles", "data_pub": "2026-11-18T17:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O governo do Distrito Federal (GDF) substituiu a gestão do Hospital Evangélico de Pituba (Hvep) e promete aumentar em 25% os atendimentos. A Secretaria de Planejamento e Administração (Sepan) afirma que a nova administração vai ampliar os serviços e melhorar a qualidade, incluindo a redução das filas.", "titulo_pt": "GDF troca gestão do Hvep e promete aumento de 25% nos atendimentos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 272345, "titulo": "'Não podíamos pagar uma casa para nossa família, então decidimos comprar uma junto com desconhecidos'", "url": "https://www.bbc.com/portuguese/articles/c64gnx55rxzlo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-11-18T17:10:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Pessoas e famílias no Canadá que não conseguem comprar casas estão se associando a desconhecidos que enfrentam a mesma situação devido aos altos preços imobiliários.", "titulo_pt": "Não podíamos comprar uma casa para nossa família, então decidimos comprar uma junto com desconhecidos", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 272246, "titulo": "CCJ do Senado aprova aumento de pena para motorista que mata sob efeito de álcool ou drogas", "url": "https://exame.com/brasil/ccj-do-senado-aprova-aumento-de-pena-para-motorista-que-mata-sob-efeito-de-alcool-ou-drogas/", "fonte_id": "exame", "data_pub": "2026-11-18T14:14:00Z", "idioma": "pt", "provavel_duplicata_de": 272105, "texto_pt": "A CCJ do Senado aprovou um projeto que aument trabalhadores expostos a eletricidade", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 272598, "titulo": "Trial over violent arrest of Black man: French police officers offer apologies and questionable justifications", "url": "https://www.lemonde.fr/en/france/article/2026/11/18/trial-over-violent-arrest-of-black-man-french-police-officers-offer-apologies-and-questionable-justifications_6783328_7.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-18T11:05:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três policiais estão sendo julgados no tribunal criminal de Paris por agredir Michel Zecler em seu estúdio de gravação em novembro de 2020. Na audiência de terça-feira, eles foram questionados sobre a violência que são acusados de ter cometido.", "titulo_pt": "Processo sobre agressão violenta a homem negro: policiais oferecem desculpas e justificativas duvidosas", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 271366, "titulo": "Delegada vira ré por emprestar arma usada na morte de gari em MG", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/mg/delegada-vira-re-por-emprestar-arma-usada-na-morte-de-gari-em-mg/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-18T09:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma delegada foi denunciada por emprestar uma pistola usada na morte de um gari em Minas Gerais. A denúncia foi aceita e acusa a delegada Ana Paula Balbino de fornecer repetidamente a arma semiautomática calibre .380 a Renê da Silva Nogueira Júnior.", "titulo_pt": "Delegada é denunciada por emprestar arma usada no assassinato de gari em MG", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 271320, "titulo": "Homem tenta matar companheiro de trisal com facada na cabeça e nas costas", "url": "https://www.metropoles.com/distrito-federal/na-mira/homem-tenta-matar-companheiro-de-trisal-com-facada-na-cabeca-e-nas-costas", "fonte_id": "metropole mporais ameaçam o Brasil e El Niño preocupa produção de alimentos", "url": "https://www.cnnbrasil.com.br/nacional/temporais-ameacam-o-brasil-e-el-nino-preocupa-producao-de-alimentos/", "fonte_id": "cnn_brasil", "data_pub": "2026-11-18T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O fenômeno El Niño está causando temporais no Sul do Brasil e seca no Norte. A Câmara dos Deputados aprovou um crédito extraordinário para mitigar os impactos na agricultura.", "titulo_pt": "El Niño ameaça agricultura com temporais no sul e seca no norte; câmara aprova crédito para mitigar impactos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 272245, "titulo": "Mais de 100 mi de caranguejos tomam ilha na Austrália durante migração; veja imagens", "url": "https://exame.com/ciencia/mais-de-100-mi-de-caranguejos-tomam-ilha-na-australia-durante-migracao-veja-imagens/", "fonte_id": "exame", "data_pub": "2026-11-18T14:16:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Mais de 100 milhões de caranguejos migram anualmente para a Ilha Christmas na Austrália para reprodução, causando o fechamento de estradas e a construção de passagens especiais.", "titulo_pt": "Mais de 100 milhões de caranguejos tomam ilha na Austrália durante migração; veja imagens", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 272253, "titulo": "COP31: 'Se você acha que as mudanças climáticas não são nada, venha ao Nepal', diz ministra", "url": "https://exame.com/esg/cop31-se-voce-acha-que-as-mudancas-climaticas-nao-sao-nada-venha-ao-nepal-diz-ministra/", "fonte_id": "exame", "data_pub": "2026-11-18T14:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A ministra do Meio Ambiente do Nepal, Gita Chaudhary, ressaltou a urgência de justiça climática e responsabilização dos países mais poluentes após a tragédia climática que deixou mais de 1400 mortos e causou perdas equivalentes a 10% do PIB do país.", "titulo_pt": "Se você acha que as mudanças climáticas não são nada, venha ao Nepal", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 272258, "titulo": "Ciclone vai atingir o Brasil? Veja o que diz o Inmet e onde há alertas", "url": "https://exame.com/brasil/ciclone-vai-atingir-o-brasil-veja-o-que-diz-o-inmet-e-onde-ha-alertas/", "fonte_id": "exame", "data_pub": "2026-11-18T13:03:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Instituto Nacional de Meteorologia (Inmet) monitora a formação de um ciclone na costa argentina, enquanto a Defesa Civil prevê ventos acima de 90 km/h no Rio Grande do Sul. Até o momento, não há alertas específicos para o Brasil, mas o Inmet continua monitorando a situação.", "titulo_pt": "Ciclone pode atingir o Brasil? Veja o que diz o Inmet e onde há alertas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 272707, "titulo": "Peru releases seven pelicans rescued from El Niño's effects", "url": "https://www.euronews.com/video/2026/11/18/peru-releases-seven-pelicans-rescued-from-el-ninos-effects", "fonte_id": "euronews", "data_pub": "2026-11-18T11:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Sete pelicanos recuperados foram devolvidos à natureza no Peru, que agora abriu seu primeiro centro estatal para proteger aves marinhas afetadas pelo El Niño.", "titulo_pt": "Peru libera sete pelicanos resgatados dos efeitos do El Niño", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 271310, "titulo": "Clima: país tem temporais, rajadas de vento e até queda de granizo nesta 4ª", "url": "https://www.metropoles.com/brasil/clima-pais-tem-temporais-rajadas-de-vento-e-ate-queda-de-granizo-nesta-4a", "fonte_id": "metropoles", "data_pub": "2026-11-18T09:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Nesta quarta-feira, o Brasil enfrenta temporais, rajadas de vento e até queda de granizo em algumas regiões, enquanto o calor persiste em outras, com temperaturas chegando a 37°C.", "titulo_pt": "Clima: país tem temporais, rajadas de vento e queda de granizo nesta quarta-feira, com calor em algumas localidades", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 272498, "titulo": "‘Phantom forests’ in Australia’s arid outback used to create carbon credits meant to offset emissions, report claims", "url": "https://www.theguardian.com/environment/2026/nov/18/phantom-forests-in-australian-arid-outback-used-to-create-carbon-credits-meant-to-offset-emissions-report-claims", "fonte_id": "guardian_world", "data_pub": "2026-11-18T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pesquisadores afirmam que 'florestas fantasma' em áreas áridas da Austrália estão sendo usadas para criar créditos de carbono que permitem às empresas de combustíveis fósseis continuarem poluindo. As empresas de créditos de carbono rejeitam essas alegações, afirmando que há apenas uma pequena aumento na cobertura de floresta e de copa, mesmo em condições úmidas.", "titulo_pt": "Florestas fantasma na áfrica de duro da austrália seriam usadas para criar créditos de carbono, afirma estudo", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 272712, "titulo": "Huge plume of gas erupts from Los Angeles landfill after drilling accident", "url": "https://www.euronews.com/2026/11/18/huge-plume-of-gas-erupts-from-los-angeles-landfill-after-drilling-accident", "fonte_id": "euronews", "data_pub": "2026-11-18T09:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um acidente de perfuração em um aterro sanitário em Los Angeles County resultou em seis pessoas levemente feridas e em uma explosão de gás e resíduos decompostos que atingiu o ar. As autoridades emitiu alertas para os moradores próximos.", "titulo_pt": "Grande pluma de gás explode em aterro sanitário após acidente de perfuração em Los Angeles", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 271465, "titulo": "Después de 180 años, reintrodujeron tortugas gigantes en una isla y seis meses después ya se había recuperado un ecosistema nunca antes visto", "url": "https://www.lanacion.com.ar/ciencia/despues-de-180-anos-reintrodujeron-tortugas-gigantes-en-una-isla-y-seis-meses-despues-ya-se-habia-nid17112026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-11-18T09:13:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Foram reintroduzidas tartarugas gigantes da espécie Aldabrachelys gigantea na ilha do archipiélago Aride, após 180 anos. Em apenas seis meses, os cientistas observaram a recuperação de um ecosistema que nunca havia sido visto antes.", "titulo_pt": "Depois de 180 anos, tartarugas gigantes são reintroduzidas em uma ilha e ecosistema se recupera rapidamente", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 271331, "titulo": "COP31 entra na reta final e debate justiça climática em meio a impasses financeiros", "url": "https://exame.com/esg/cop31-entra-em-negociacoes-decisivas-e-debate-justica-climatica-em-meio-a-impasses-financeiros/", "fonte_id": "exame", "data_pub": "2026-11-18T06:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Disputas sobre a responsabilidade financeira na crise climática estão dificultando avanços em financiamento durante a COP31. Há expectativa por uma decisão importante nesta quarta-feira.", "titulo_pt": "COP31 entra na reta final e debate justiça climática em meio a impasses financeiros", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 271749, "titulo": "Rare video of Brazilian Amazon tribe", "url": "https://www.aljazeera.com/video/newsfeed/2026/11/18/rare-video-of-brazilian-amazon-tribe?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-18T05:14:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um novo vídeo foi divulgado mostrando membros da tribo isolada Awa, que vive em uma área remota da floresta amazônica no Brasil.", "titulo_pt": "Novo vídeo da tribo isolada awa na amazônia brasileira", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 271702, "titulo": "The good and the bad of climate policy", "url": "https://www.ft.com/content/68e72928-ef85-481e-adbd-46b7b654223e?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-11-18T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As políticas climáticas enfrentam desafios significativos para mitigar as mudanças futuras, mas esses desafios são superados pelos custos de adaptação às mudanças atuais.", "titulo_pt": "Os bons e os maus aspectos da política climática", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 271645, "titulo": "Paris, Lyon and Marseille make progress on reducing air pollution, but still trail Europe's cleanest cities", "url": "https://www.lemonde.fr/en/environment/article/2026/11/18/paris-lyon-and-marseille-make-inroads-into-reducing-air-pollution-but-still-lag-far-behind-europe-s-top-cities_6783097_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-18T03:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Paris, Lyon e Marselha têm progredido na redução da poluição do ar, mas ainda ficam atrás das cidades mais limpas da Europa. Uma coalizão de mais de 150 organizações não-governamentais lançou um novo ranking de qualidade do ar em 40 cidades e capitais europeias.", "titulo_pt": "Paris, Lyon e marselha avançam na redução da poluição do ar, mas ainda não atingem as cidades mais limpas da Europa", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 272710, "titulo": "Bahrain sentences Shia clerics to life over alleged Iran plot amid torture allegations", "url": "https://www.euronews.com/2026/11/18/bahrain-sentences-shia-clerics-to-life-over-alleged-iran-plot-amid-torture-allegations", "fonte_id": "euronews", "data_pub": "2026-11-18T10:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bahrain prendeu dezenas de clérigos xiitas desde o início da guerra com o Irã em fevereiro. Autoridades acusam-os de conspirar com Teerã, enquanto grupos de direitos humanos levantam preocupações sobre tortura e confissões forçadas. Os estados do Golfo apoiaram a jurisdição de Bahrain.", "titulo_pt": "Bahrain condena clérigos xiitas a prisão perpétua em meio a acusações de tortura", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 272946, "titulo": "Remarks by UNICEF Deputy Executive Director, ASG Ted Chaiban, at the Second Global Ministerial Conference on Ending Violence Against Children", "url": "https://www.unicef.org/press-releases/remarks-unicef-deputy-executive-director-asg-ted-chaiban-second-global-ministerial", "fonte_id": "unicef", "data_pub": "2026-11-18T10:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O vice-diretor executivo adjunto da UNICEF, Ted Chaiban, participou da Segunda Conferência Global Ministerial sobre o Fim da Violência Contra Crianças. O evento teve como objetivo discutir estratégias para combater a violência contra crianças em todo o mundo.", "titulo_pt": "Comentários do vice-diretor executivo adjunto da UNICEF, Ted Chaiban, na segunda conferência Global Ministerial sobre o fim da violência contra crianças", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 272778, "titulo": "Serbia’s Criminal Police Chief Detained for Alleged Torture", "url": "https://balkaninsight.com/2026/11/18/serbias-criminal-police-chief-detained-for-alleged-torture/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-11-18T10:26:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O chefe do Diretório de Polícia Criminal da Sérvia, Marko Kricak, foi detido sob acusações de torturar manifestantes em agosto de 2025. Ele já enfrenta outras acusações relacionadas ao abuso de poder e tortura.", "titulo_pt": "Chefe da polícia Criminal da sérvia detido suspeito de torturar protestantes", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 271736, "titulo": "‘We want to go back’: Rohingya refugees pin hopes on ICJ genocide verdict", "url": "https://www.aljazeera.com/features/2026/11/18/we-want-to-go-back-rohingya-refugees-pin-hopes-on-icj-genocide-verdict?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-11-18T08:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Refugiados rohingya, que vivem no exílio há quase uma década, esperam que o TJ Internacional decida a seu favor. No entanto, não está claro se isso ajudará a permitir seu retorno.", "titulo_pt": "Queremos voltar”: refugiados rohingya esperam decisão favorável do tj internacional", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 272546, "titulo": "¿Más poder, menos responsabilidad? La reforma al mercado de capitales y su efecto en las sociedades anónimas", "url": "https://www.ciperchile.cl/2026/11/18/mas-poder-menos-responsabilidad-la-reforma-al-mercado-de-capitales-y-su-efecto-en-las-sociedades-anonimas/?utm_source=rss&utm_medium=rss&utm_campaign=mas-poder-menos-responsabilidad-la-reforma-al-mercado-de-capitales-y-su-efecto-en-las-sociedades-anonimas", "fonte_id": "ciper_chile", "data_pub": "2026-11-18T07:00:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A reforma no mercado de capitais e seu impacto nas sociedades anónimas são temas abordados no texto original. O título traduzido para o português brasileiro é: 'Mais poder, menos responsabilidade? A reforma ao mercado de capitais e seu efeito nas sociedades anónimas'.", "titulo_pt": "Mais poder, menos responsabilidade? A reforma ao mercado de capitais e seu efeito nas sociedades anónimas", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 271979, "titulo": "UNICEF FAST FACTS: World leaders meet in Manila to end violence against children", "url": "https://www.unicef.org/press-releases/unicef-fast-facts-world-leaders-meet-manila-end-violence-against-children", "fonte_id": "unicef", "data_pub": "2026-11-18T06:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Membros de governos mundiais se encontram em Manila para discutir a eliminação da violência contra crianças. O evento visa promover ações para proteger os direitos das crianças.", "titulo_pt": "Fatos rápidos: líderes mundiais se reúnem em Manila para combater violência contra crianças", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 272947, "titulo": "Fast facts: World leaders meet in Manila to end violence against children", "url": "https://www.unicef.org/press-releases/fast-facts-world-leaders-meet-manila-end-violence-against-children", "fonte_id": "unicef", "data_pub": "2026-11-18T06:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Membros de governos globais se reuniram em Manila para discutir e tomar medidas para combater a violência contra crianças. O encontro visa promover ações concretas para proteger os direitos das crianças.", "titulo_pt": "Fatos rápidos: líderes mundiais se reúnem em Manila para acabar com a violência contra crianças", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}, {"id": 271565, "titulo": "‘Devastating consequences’: One Nation plan to slash Australia’s refugee program denounced", "url": "https://www.theguardian.com/australia-news/2026/nov/18/one-nation-refugee-intake-immigration-ntwnfb", "fonte_id": "guardian_world", "data_pub": "2026-11-18T05:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O partido One Nation propôs cortar drasticamente o programa de refugiados da Austrália em 90% e eliminar o programa de vistos permanentes para pais e pais idosos. A proposta foi criticada por oponentes políticos e organizações de advocacy como uma 'ataque barato' aos refugiados.", "titulo_pt": "Consequências devastadoras: plano do one Nation para reduzir programa de refugiados da austrália condenado", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 272528, "titulo": "The Rohingya Are Not a Legal Test Case. We Are a People Waiting for Justice.", "url": "https://thediplomat.com/2026/11/the-rohingya-are-not-a-legal-test-case-we-are-a-people-waiting-for-justice/", "fonte_id": "the_diplomat", "data_pub": "2026-11-18T04:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma decisão judicial não pode devolver a um filho assassinado à sua mãe ou devolver os anos roubados a uma geração. No entanto, a reconhecimento e ser ouvidos importam.", "titulo_pt": "Os rohingyas não são um caso Legal. Somos um povo esperando justiça.", "veiculo": "The Diplomat", "pais": "Japão", "classe": "B"}, {"id": 271641, "titulo": "Fears over impact of tear gas on women's health prompt calls for ban", "url": "https://www.lemonde.fr/en/environment/article/2026/11/18/fears-over-impact-of-tear-gas-on-women-s-health-prompt-calls-for-ban_6783098_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-11-18T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Nove mil mulheres relataram problemas ginecológicos após exposição a gases lacrimogêneos durante protestos recentes em escolas e na sociedade francesa, conforme apresentado em testemunhos à Assembléia Nacional. Esses relatos levantaram preocupações sobre os efeitos desses gases na saúde feminina, resultando em chamados por uma proibição.", "titulo_pt": "Medo dos efeitos dos gases lacrimogêneos na saúde feminina leva a chamados por proibição", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 271980, "titulo": "At least 64 children killed and 64 injured in Yemen as intensified hostilities approach three-month mark", "url": "https://www.unicef.org/press-releases/least-64-children-killed-and-64-injured-yemen-intensified-hostilities-approach-three", "fonte_id": "unicef", "data_pub": "2026-11-18T02:34:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A intensificação dos conflitos no Iêmen está causando a morte e ferimentos em pelo menos 64 crianças, além de interromper o acesso a serviços de saúde, água segura, higiene, alimentos e educação. A cidade de Taiz está cada vez mais isolada.", "titulo_pt": "Pelo menos 64 crianças mortas e 64 feridas no iêmen à medida que os conflitos se intensificam, chegando ao terceiro mês", "veiculo": "UNICEF Global", "pais": "Global", "classe": "A"}], "direitos_humanos__eventos": []}, "noticias": [{"id": 272781, "fonte_id": "taipei_times", "titulo": "Xi welcomes Trump to China ahead of summit", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/19/2003868000", "data_pub": "2026-11-19T00:00:00Z", "topico": "geopolitica", "idioma": "en", "titulo_pt": "Xi recebe Trump na China antes de cúpula", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 272783, "fonte_id": "taipei_times", "titulo": "NASA’s Voyager 1 reaches one light-day milestone after 50 years in space", "url": "https://www.taipeitimes.com/News/front/archives/2026/11/19/2003868002", "data_pub": "2026-11-19T00:00:00Z", "topico": "ciencia", "idioma": "en", "titulo_pt": "Voyager 1 atinge marca de um dia-luz após 50 anos no espaço", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 272784, "fonte_id": "taipei_times", "titulo": "More rational antibiotic use needed, hospital says", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/19/2003868008", "data_pub": "2026-11-19T00:00:00Z", "topico": "sociedade", "idioma": "en", "titulo_pt": "Mais uso racional de antibióticos necessário, diz hospital", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 272785, "fonte_id": "taipei_times", "titulo": "Legalize cancer drug fund: groups", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/11/19/2003868009", "data_pub": "2026-11-19T00:00:00Z", "topico": "sociedade", "idioma": "en", "titulo_pt": "Legalize fundo para medicamentos contra o câncer: grupos", "veiculo": function toggleDrill(id) {
  const el = document.getElementById(id);

  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}
