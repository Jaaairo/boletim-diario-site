e_id": "metropoles", "data_pub": "2026-10-01T17:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um policial civil interveio em uma tentativa de roubo na Estrada de Itapecerica na manhã desta quinta-feira (1°/10) e acabou atingindo ambos os suspeitos com tiros.", "titulo_pt": "Policial civil interviu em tentativa de roubo e atingiu suspeitos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 190222, "titulo": "Educação executiva abre novos caminhos para mulheres na liderança industrial", "url": "https://exame.com/negocios/educacao-executiva-mulheres-lideranca-industrial/", "fonte_id": "exame", "data_pub": "2026-10-01T17:30:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A educação executiva tem se destacado como uma ferramenta importante para acelerar as carreiras e as lideranças femininas, através de formação, mentoria e networking. Estas ferramentas têm ganhado maior destaque no cenário empresarial.", "titulo_pt": "Educação executiva abre novos caminhos para mulheres na liderança industrial", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 189145, "titulo": "Justiça manda soltar bombeiro preso por matar estudante após briga em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/justica-manda-soltar-bombeiro-preso-por-matar-estudante-apos-briga-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-01T17:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um bombeiro de 23 anos foi solto após ser preso por matar um estudante de medicina durante uma briga em São Paulo. A decisão judicial foi tomada em uma audiência de custódia.", "titulo_pt": "Justiça libera bombeiro preso por matar estudante em briga em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 189357, "titulo": "Sigue lo que fue desarrollo de la marcha convocada por la Confech", "url": "https://www.latercera.com/nacional/noticia/en-vivo-marcha-estudiantes-confech-incidentes/", "fonte_id": "la_tercera", "data_pub": "2026-10-01T16:34:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Estudantes, junto com sindicatos de trabalhadores, estão marchando pela Alameda sob a bandeira “Nenhum real a menos para a educação”. A marcha foi convocada pela Confech.", "titulo_pt": "Segue o desenvolvimento da marcha convocada pela Confech", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 189349, "titulo": "Fiscal judicial que llevó el sumario de Yáber: “Nadie está dispuesto a asumir el costo de denunciar esta práctica corrupta”", "url": "https://www.latercera.com/nacional/noticia/fiscal-judicial-que-llevo-el-sumario-de-yaber-nadie-esta-dispuesto-a-asumir-el-costo-de-denunciar-esta-practica-corrupta/", "fonte_id": "la_tercera", "data_pub": "2026-10-01T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A juíza Carla Troncoso, de San Miguel, testificou sobre a prática corrupta de contratar familiares de magistrados em notarías e conservadorias. Segundo ela, essa situação é tolerada por todos envolvidos no sistema.", "titulo_pt": "Juíza revela prática corrupta de contratação de familiares de magistrados em notarías", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 189355, "titulo": "Presupuesto Mineduc 2027: sin nuevos Liceos Bicentenario, recorte a universidades y prioridad en jardines infantiles", "url": "https://www.latercera.com/nacional/noticia/presupuesto-mineduc-2027-sin-nuevos-liceos-bicentenario-recorte-a-universidades-y-prioridad-en-jardines-infantiles/", "fonte_id": "la_tercera", "data_pub": "2026-10-01T16:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O projeto de lei para o orçamento de 2027 da Educação não inclui novos Liceus Bicentenários, cancela um programa que fornecia computadores através da Junaeb e condiciona as avaliações nacionais e internacionais à disponibilidade orçamentária.", "titulo_pt": "Orçamento Mineduc 2027: sem novos liceus bicentenários, cancelamento de programa de computadores e prioridade para jardins infantis", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 189875, "titulo": "Countries in the Americas can accelerate disease elimination through leadership, investment and partnerships", "url": "https://www.paho.org/en/news/1-10-2026-countries-americas-can-accelerate-disease-elimination-through-leadership-investment", "fonte_id": "paho", "data_pub": "2026-10-01T15:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Países da América podem acelerar a eliminação de doenças através de liderança, investimento e parcerias.", "titulo_pt": "Países da américa podem acelerar a eliminação de doenças através de liderança, investimento e parcerias", "veiculo": "PAHO/WHO", "pais": "Americas", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 190024, "titulo": "Custo climático já contratado não pode ser desprezado pelos políticos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/braulio-borges/2026/10/custo-climatico-ja-contratado-nao-pode-ser-desprezado-pelos-politicos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-01T21:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A poucos dias do primeiro turno das eleições presidenciais, um tema que quase não foi discutido nos debates é o custo climático já contratado. Este custo não pode ser ignorado pelos políticos.", "titulo_pt": "Custo climático já contratado não pode ser desprezado pelos políticos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 190470, "titulo": "Worse than coal? Debate intensifies over carbon impact of US gas imported to Europe", "url": "https://www.lemonde.fr/en/environment/article/2026/10/01/worse-than-coal-debate-intensifies-over-carbon-impact-of-us-gas-imported-to-europe_6758153_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-01T20:06:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A importação de gás natural dos Estados Unidos para a Europa representa 60% das importações liquefeitas da região, e o impacto carbono desse recurso energético é amplamente debatido.", "titulo_pt": "Maior que o carvão? Debate se intensifica sobre o impacto carbono do gás dos EUA importado para a Europa", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 190472, "titulo": "Swiss glaciers have lost 20% of their volume and turned black in five years", "url": "https://www.lemonde.fr/en/environment/article/2026/10/01/swiss-glaciers-have-lost-20-of-their-volume-and-turned-black-in-five-years_6758149_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-01T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em menos de cinco anos, os glaciares suíços perderam 20% do seu volume e se tornaram pretos devido a derretimentos recordes. Após uma estação de verão com sucessivas ondas de calor, mais de 5% do volume de gelo em glaciares icônicos da Suíça derreteram em poucas semanas, acelerando a degradação do rochedo ao redor.", "titulo_pt": "Glaciares suíços perderam 20% do volume e se tornaram pretos em cinco anos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 189439, "titulo": "Matt Kean warns climate crisis ‘isn’t someone else’s problem’ as largest coal project in NSW history greenlit", "url": "https://www.theguardian.com/australia-news/2026/oct/02/hunter-valley-operations-coal-mine-extension-nsw", "fonte_id": "guardian_world", "data_pub": "2026-10-01T15:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Matt Kean, chair do Conselho de Mudanças Climáticas, criticou a aprovação do maior projeto de mineração de carvão da história do estado da Nova Gales do Sul, argumentando que o clima não é problema alheio. Ele questionou por que a Comissão Independente de Avaliação de Planejamento não levou em conta os danos econômicos relacionados ao clima no estado.", "titulo_pt": "Matt Kean alerta: crise climática ‘não é problema alheio’ enquanto maior projeto de carvão da história da nova gales do sul é aprovado", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 189690, "titulo": "Heat deaths in Western Europe top 34,600 during hottest summer on record", "url": "https://www.japantimes.co.jp/environment/2026/10/01/climate-change/heat-deaths-western-europe/", "fonte_id": "japan_times", "data_pub": "2026-10-01T11:46:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O número de mortes por calor em países ocidentais da Europa superou 34.600 durante o verão mais quente da história registrada.", "titulo_pt": "Mortes por calor superam 34.600 na Europa ocidental durante verão mais quente", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 188368, "titulo": "Clima: outubro começa com temporais no Sudeste e calor de 40ºC no Nordeste", "url": "https://www.metropoles.com/brasil/clima-outubro-comeca-com-temporais-no-sudeste-e-calor-de-40oc-no-nordeste", "fonte_id": "metropoles", "data_pub": "2026-10-01T08:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "No mês de outubro, o Sudeste enfrenta temporais, enquanto o Nordeste experimenta temperaturas elevadas chegando a 40°C. No Sul, a frente fria continua trazendo chuvas intensas no Paraná e no leste de Santa Catarina.", "titulo_pt": "Clima: outubro começa com temporais no Sudeste e calor de 40°c no Nordeste", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 188706, "titulo": "Swiss glaciers lose 5.5% of ice in second-largest melt on record", "url": "https://www.euronews.com/video/2026/10/01/swiss-glaciers-lose-55-of-ice-in-second-largest-melt-on-record", "fonte_id": "euronews", "data_pub": "2026-10-01T06:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cientistas suíços relatam uma perda rápida de gelo no Glacier Rhône, devido a ondas de calor e um inverno seco, resultando na segunda maior derivação de gelo na história da Suíça.", "titulo_pt": "Suíça registra perda de 5,5% de gelo no glacier rhône, maior derretimento em duas décadas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 188755, "titulo": "‘Catastrophic year’ as Swiss glaciers lose 5% of ice after heatwaves", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/1/catastrophic-year-as-swiss-glaciers-lose-5-of-ice-after-heatwaves?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-01T04:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os cientistas alertam que os gelos suíços perderam uma quantidade 'enorme' de gelo este ano. Isso ocorreu devido a ondas de calor.", "titulo_pt": "Ano catastrófico", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 188580, "titulo": "‘Explosion of melt rates’: 20% of Swiss glaciers lost in five years", "url": "https://www.theguardian.com/environment/2026/oct/01/switzerland-glacier-loss-fossil-fuel-pollution-europe", "fonte_id": "guardian_world", "data_pub": "2026-10-01T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Suíça perdeu aproximadamente 20% de sua geleira em apenas cinco anos devido ao efeito de calor das emissões de poluentes de combustíveis fósseis. Em 2026, as geleiras suíças diminuíram 5,5% nos primeiros oito meses, após um verão de ondas de calor extremas que seguiram um inverno com pouca neve.", "titulo_pt": "Explodo de taxas de derretimento: Suíça perde 20% de suas geleiras em cinco anos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 188107, "titulo": "People over AI", "url": "https://www.taipeitimes.com/News/biz/archives/2026/10/01/2003865165", "fonte_id": "taipei_times", "data_pub": "2026-10-01T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O artigo discute a importância das pessoas em relação à inteligência artificial, enfatizando que os seres humanos devem ter prioridade                   </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

function renderDestaque() {
  const d = D.destaque;
  if (!d) return "";
  const drillId = "drill-" + (++drillCounter);
  const totalArtigos = (d.artigos || []).length;
  const paragrafos = d.texto_pt.split(/\n+/).filter(p => p.trim())
    .map(p => `<p>${esc(p)}</p>`).join("");
  const artsHtml = (d.artigos || []).map(n => {
    const tit = n.titulo_pt || n.titulo;
    const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt')
      ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>
      <div class="dmeta">
        <span class="tag">${esc(n.veiculo)}</span>
        ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>
    ${ttsBarHtml("destaque")}
    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>
    <div class="drill-lista destaque-fontes" id="${drillId}">
      ${artsHtml}
    </div>` : ""}
  </div>`;
}

const abas = {
  resumo: { rotulo: "Resumo do Dia", render() {
    drillCounter = 0;
    const st = D.stats;
    const temPodcast = D.podcast && D.podcast.arquivo;
    return `<div class="cards${temPodcast ? ' com-podcast' : ''}">
      <div class="card"><div class="num">${st.noticias_novas}</div><div class="rot">notícias coletadas</div></div>
      <div class="card"><div class="num">${st.resumos_gerados}</div><div class="rot">resumos gerados</div></div>
    </div>
    ${renderPodcast()}
    ${renderDestaque()}
    ${D.topicos.map(renderSecao).join("")}`;
  }},
  noticias: { rotulo: "Todas as Notícias", render() {
    const opcoes = [["", "Todas"], ...D.topicos.map(t => [t, D.rotulos_topico[t] || t])];
    const botoes = opcoes.map(([v, l]) =>
      `<button onclick="filtrarSecao('${v}')" id="btn-sec-${v || 'todas'}">${esc(l)}</button>`
    ).join("");

    const itens = D.noticias.map(n => {
      const grupo = n.topico ? (D.grupo_de_topico[n.topico] || n.topico) : "";
      const rot = grupo ? (D.rotulos_topico[grupo] || grupo) : "não classificado";
      const pais = n.pais ? ` · ${esc(n.pais)}` : "";
      const tit = n.titulo_pt || n.titulo;
      const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
      return `<div class="noticia" data-topico="${esc(grupo)}" data-flag-url="${esc(n.url)}">
        <a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}
        <div class="fonte"><strong>${esc(n.veiculo || n.fonte_id)}</strong>${pais} · <span class="tag">${esc(rot)}</span></div>
        ${flagBtn(n.url, tit)}
      </div>`;
    }).join("");

    return `<div class="filtros-secao" id="filtros-secao">${botoes}</div>
      <div id="lista-noticias">${itens}</div>`;
  }},
};

function filtrarSecao(topico) {
  document.querySelectorAll("#filtros-secao button").forEach(b => b.classList.remove("ativo"));
  const btn = document.getElementById(topico ? "btn-sec-" + topico : "btn-sec-todas");
  if (btn) btn.classList.add("ativo");
  document.querySelectorAll("#lista-noticias .noticia").forEach(el => {
    el.style.display = (!topico || el.dataset.topico === topico) ? "" : "none";
  });
}

const nav = document.getElementById("nav"), main = document.getElementById("main");
Object.entries(abas).forEach(([id, a]) => {
  const b = document.createElement("button");
  b.textContent = a.rotulo;
  b.onclick = () => ativar(id);
  b.id = "btn-" + id;
  nav.appendChild(b);
});

function ativar(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("ativo"));
  document.getElementById("btn-" + id).classList.add("ativo");
  main.innerHTML = abas[id].render();
  if (id === "noticias") filtrarSecao("");
}
function proximaAtualizacao() {
  const m = new Date().getHours() * 60 + new Date().getMinutes();
  for (const h of [8, 16, 20]) if (h * 60 > m) return h + "h";
  return "8h";
}
const elProx = document.getElementById("prox-hora");
if (elProx) elProx.textContent = proximaAtualizacao();

// ── Sistema de Flags ──────────────────────────────────────────────────────────
const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";
const FLAG_ON = FLAG_HASH.length === 64;

let flagAuth = sessionStorage.getItem('flagAuth') === '1';
let flags = {};
try { flags = JSON.parse(localStorage.getItem('boletim_flags') || '{}'); } catch(e) {}

ativar("resumo");

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {
  if (!flagAuth) { abrirModal('modal-senha'); return; }
  _fUrl = btn.dataset.url;
  _fTit = btn.dataset.titulo;
  const f = flags[_fUrl];
  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');
  document.getElementById('flag-tipo').value = f ? f.tipo : 'erro_factual';
  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

function _saveFlags() { localStorage.setItem('boletim_flags', JSON.stringify(flags)); }

function _updateBtn(url, ativo) {
  document.querySelectorAll('[data-flag-url]').forEach(function(el) {
    if (el.dataset.flagUrl !== url) return;
    const btn = el.querySelector('.flag-btn');
    if (!btn) return;
    btn.classList.toggle('flag-ativo', ativo);
    btn.title = ativo ? 'Flagged — clique para editar' : 'Marcar problema';
    btn.textContent = ativo ? '⚑' : '⚐';
  });
}

function salvarFlagAtual() {
  flags[_fUrl] = {
    titulo: _fTit, url: _fUrl,
    tipo: document.getElementById('flag-tipo').value,
    nota: document.getElementById('flag-nota').value.trim(),
    edicao: D.gerado_em, ts: new Date().toISOString()
  };
  _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, true);
}

function removerFlagAtual() {
  delete flags[_fUrl]; _saveFlags(); fecharModal('modal-flag'); _updateBtn(_fUrl, false);
}

const TIPO_LABEL = {
  erro_factual: 'Erro factual', erro_traducao: 'Erro de tradução',
  classificacao_errada: 'Classificação errada', resumo_impreciso: 'Resumo impreciso', outro: 'Outro'
};

function abrirRelatorio() {
  const list = Object.values(flags);
  const div = document.getElementById('relatorio-conteudo');
  div.innerHTML = list.length ? list.map(f =>
    `<div class="flag-rep-item">
      <span class="flag-tipo-tag">${esc(TIPO_LABEL[f.tipo] || f.tipo)}</span>
      <a href="${esc(f.url)}" target="_blank" style="color:var(--azul);font-size:15px">${esc(f.titulo)}</a>
      ${f.nota ? `<div style="color:var(--texto2);font-size:13px;margin-top:3px">${esc(f.nota)}</div>` : ''}
      <div style="color:var(--texto2);font-size:12px;margin-top:3px">${esc(f.edicao)} · ${esc(new Date(f.ts).toLocaleString('pt-BR'))}</div>
    </div>`).join('') :
    '<p style="color:var(--texto2);font-style:italic;padding:12px 0">Nenhuma flag registrada.</p>';
  abrirModal('modal-relatorio');
}

function exportarFlags() {
  const a = document.createElement('a');
  a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(Object.values(flags), null, 2));
  a.download = 'flags_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
}

function copiarRelatorio() {
  const list = Object.values(flags);
  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
