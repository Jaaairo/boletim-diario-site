is-acumulam-ouro-em-ritmo-quatro-vezes-maior-e-retiram-reservas-dos-eua/", "fonte_id": "infomoney", "data_pub": "2026-10-23T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As compras de ouro por bancos centrais estão quatro vezes maiores do que a média pré-2022. Países estão diversificando a custódia das reservas em resposta a preocupações geopolíticas e à menor confiança no sistema liderado pelo dólar.", "titulo_pt": "Bancos centrais acumulam ouro em ritmo quatro vezes maior e retiram reservas dos EUA", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 220387, "titulo": "Direito, instituições e economia política na arquitetura dos mercados", "url": "https://www.jota.info/opiniao-e-analise/artigos/direito-instituicoes-e-economia-politica-na-arquitetura-dos-mercados", "fonte_id": "jota", "data_pub": "2026-10-23T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa aborda a estruturação de uma agenda para o Direito Econômico, focando em temas relacionados a direito, instituições e economia política nos mercados.", "titulo_pt": "Direito, instituições e economia política na arquitetura dos mercados", "veiculo": "JOTA", "pais": "Brasil", "classe": "A"}, {"id": 220670, "titulo": "Japanese inflation breaks 2% for the first time this year", "url": "https://www.japantimes.co.jp/business/2026/10/23/economy/cpi-september-inflation/", "fonte_id": "japan_times", "data_pub": "2026-10-23T07:21:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A inflação no Japão atingiu 2% em setembro, pressionando o Banco do Japão a aumentar as taxas de juros até o final do ano.", "titulo_pt": "Inflação no Japão supera 2% pela primeira vez neste ano", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 220112, "titulo": "Investigadores afirmam que Vorcaro usou financeira nas Bahamas como hub para esquema no exterior", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://c-level.folha.uol.com.br/financas/2026/10/investigadores-afirmam-que-vorcaro-usou-financeira-nas-bahamas-como-hub-para-esquema-no-exterior.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Investigadores identificaram que Daniel Vorcaro usava a Mosaic, uma instituição financeira nas Bahamas, como um hub para distribuir dinheiro no exterior. A Mosaic é uma empresa de gestão de fundos de investimentos sediada em Nassau.", "titulo_pt": "Investigadores afirmam que Vorcaro usou financeira nas Bahamas como hub para esquema no exterior", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 220114, "titulo": "Ação para excluir IBS/CBS da base dos tributos atuais vale a pena?", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/blogs/que-imposto-e-esse/2026/10/acao-para-excluir-ibscbs-da-base-dos-tributos-atuais-vale-a-pena.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Algumas empresas têm obtido decisões judiciais favoráveis para excluir a CBS e o IBS da base de cálculo do ICMS, mas especialistas alertam que essas determinações não dispensam o pagamento do tributo e nem garantem a recuperação de valores pagos.", "titulo_pt": "Ação para excluir IBS/CBS da base de cálculo dos tributos vale a pena?", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 220191, "titulo": "Ibovespa tem último pregão antes do 2º turno; é hora de comprar ou vender ações?", "url": "https://exame.com/invest/minhas-financas/ibovespa-tem-ultimo-pregao-antes-do-2o-turno-e-hora-de-comprar-ou-vender-acoes/", "fonte_id": "exame", "data_pub": "2026-10-23T06:54:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ibovespa está com o último pregão antes do segundo turno das eleições presidenciais. As pesquisas mais apertadas sobre a disputa presidencial aumentaram a incerteza sobre o desempenho dos ativos no mercado.", "titulo_pt": "Ibovespa tem último pregão antes do 2º turno; incerteza sobre ativos aumenta", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 220635, "titulo": "Winter arrives in markets", "url": "https://www.ft.com/content/ce0e9d68-c63f-4666-9909-512b929e6284?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-23T05:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os mercados de títulos e ações indicam uma tendência fria e negativa. Ambos os setores estão registrando perdas, refletindo condições desfavoráveis no mercado.", "titulo_pt": "Inverno chega aos mercados", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 220574, "titulo": "Wealthy Chinese move offshore money to U.S. banks as Beijing’s tax net widens", "url": "https://www.cnbc.com/2026/10/23/wealthy-chinese-tax-offshore-trusts-capital-control-.html", "fonte_id": "cnbc_international", "data_pub": "2026-10-23T04:55:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bancários e advogados relatam que a demanda de clientes chineses por contas bancárias nos Estados Unidos tem aumentado, em meio ao fortalecimento das medidas de Beijing para monitorar o patrimônio offshore chinês.", "titulo_pt": "Chineses movem dinheiro offshore para bancos dos EUA à medida que Beijing aperta o cerco", "veiculo": "CNBC International", "pais": "EUA", "classe": "B"}], "economia__eventos": [], "tecnologia": [{"id": 220501, "titulo": "Wall Street prepares for AI's \"day after\"", "url": "https://www.axios.com/2026/10/23/ai-catastrophe-wall-street", "fonte_id": "axios", "data_pub": "2026-10-23T09:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As maiores bancos dos Estados Unidos estão trabalhando para evitar cenários piores com a AI, mas também estão preparando-se para o 'dia seguinte' em caso de catástrofe. Essa preparação reflete um sinal preocupante de que as grandes corporações veem um risco significativo no horizonte, relacionado à AI.", "titulo_pt": "Wall Street prepara-se para o 'dia seguinte' da AI", "veiculo": "Axios", "pais": "EUA", "classe": "B"}, {"id": 220737, "titulo": "8 Things to Know About the iPhone Duo", "url": "https://www.wired.com/story/8-things-to-know-about-the-apple-iphone-duo/", "fonte_id": "wired", "data_pub": "2026-10-23T09:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O iPhone Duo é o primeiro telefone dobrável da Apple. Ele foi lançado recentemente e os interessados podem ter comprado ou estão avaliando a compra.", "titulo_pt": "8 Coisas a saber sobre o iphone Duo", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 220713, "titulo": "In the biotech world, you can’t see everything", "url": "https://www.technologyreview.com/2026/10/23/1147610/biotech-you-can-see-everything-theranos-holmes/", "fonte_id": "mit_tech_review", "data_pub": "2026-10-23T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O autor assistiu a uma exibição do documentário 'Você Pode Ver Tudo', sobre a ex-CEO de biotecnologia descredenciada Elizabeth Holmes. Ele foi ao evento sem ter muitas expectativas e sem conhecer detalhes específicos sobre o conteúdo.", "titulo_pt": "Na indústria biotecnológica, você não pode ver tudo", "veiculo": "MIT Technology Review", "pais": "EUA", "classe": "A"}, {"id": 220739, "titulo": "The ‘Exotic Physics’ Behind a Mysterious 1,000-Mile Cloud on Mars", "url": "https://www.wired.com/story/the-exotic-physics-behind-a-mysterious-1000-mile-cloud-on-mars/", "fonte_id": "wired", "data_pub": "2026-10-23T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A nuvem misteriosa de 1.000 quilômetros em Marte tem intrigado astrônomos desde sua descoberta em 2018. Um estudo recente sugere uma possível explicação para sua formação.", "titulo_pt": "A ‘física exótica’ por trás de uma nuvem misteriosa de 1.000 quilômetros em marte", "veiculo": "Wired", "pais": "EUA", "classe": "A"}, {"id": 220742, "titulo": "Doosan Robotics targets automakers, chipmakers as Chinese rivals cut prices", "url": "https://www.digitimes.com/news/a20261023VL222/doosan-sales-robot-2026-automotive.html", "fonte_id": "digitimes", "data_pub": "2026-10-23T08:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Doosan Robotics está concentrando suas vendas em grandes fabricantes de automóveis e semicondutores, enquanto desenvolve sistemas com inteligência artificial capazes de realizar tarefas fabris mais complexas. A empresa está competindo com rivais chineses que estão reduzindo preços.", "titulo_pt": "Doosan Robotics almeja fabricantes de automóveis e semicondutores enquanto rivais chineses reduzem preços", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 220743, "titulo": "Taiwan's inaugural semiconductor strike pauses as nearly 70% of Micron Taoyuan Union rejects new bonus offer", "url": "https://www.digitimes.com/news/a20261023PD239/strike-taiwan-micron-management-2026.html", "fonte_id": "digitimes", "data_pub": "2026-10-23T08:43:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A primeira greve na indústria de semicondutores de Taiwan terminou temporariamente após uma greve de 24 horas liderada pelo sindicato da unidade Taoyuan da Micron Technology. Durante a ação, cerca de 70% dos membros do sindicato votaram contra a proposta de estrutura de compensação da administração. As negociações formais entre empregados e empregadores estão programadas para retomar em 27 de outubro de 2026.", "titulo_pt": "Taiwan: primeira greve na indústria de semicondutores termina após rejeição de nova proposta salarial", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 220744, "titulo": "Semco's 61-week MLCC lead times give suppliers upper hand in AI supply chain", "url": "https://www.digitimes.com/news/a20261023VL202/semco-mlcc-ai-server-2027-demand.html", "fonte_id": "digitimes", "data_pub": "2026-10-23T08:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As lead times de capacitores multilayer ceramicos (MLCC) da Samsung Electro-Mechanics (Semco) estão excedendo um ano devido à alta demanda por servidores de inteligência artificial, levando a uma vantagem de poder de negociação para os fornecedores. Falta de MLCC afeta diversos setores, incluindo consumo, automotivo e industrial, fazendo com que os clientes adquiram estoques para 2027.", "titulo_pt": "Prazos de MLCC da semco ultrapassam 61 semanas, dando vantagem aos fornecedores na cadeia de suprimentos de AI", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 220745, "titulo": "Lenovo mounts AI comeback with Nvidia Vera Rubin NVL72 deliveries and US plant expansion", "url": "https://www.digitimes.com/news/a20261023PD225/lenovo-nvidia-infrastructure-rubin-manufacturing.html", "fonte_id": "digitimes", "data_pub": "2026-10-23T08:03:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lenovo está voltando ao mercado de inteligência artificial (IA) com a entrega do Nvidia Vera Rubin NVL72 e expandindo sua fábrica nos Estados Unidos. O CEO Yuanqing Yang definiu um novo objetivo para a empresa de 42 anos: levar a IA a cada casa e indústria, transformando-a em uma empresa nativa de IA com receita anual superior a 100 bilhões de dólares em dois anos.", "titulo_pt": "Lenovo retoma foco em inteligência artificial com entregas de Nvidia e expansão de fábrica nos EUA", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 220700, "titulo": "China’s humanoid robots hunt for work in South Korea as Seoul bets on physical AI", "url": "https://www.scmp.com/tech/tech-trends/article/3371888/chinas-humanoid-robots-hunt-work-south-korea-seoul-bets-physical-ai", "fonte_id": "scmp", "data_pub": "2026-10-23T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Empresas chinesas de robôs humanoides estão acelerando esforços para se estabelecerem no mercado sul-coreano, passando de demonstrações de dança e exibições em showrooms para testes em fábricas e implementações comerciais. A capitalização sul-coreana está aumentando a investimento em inteligência artificial física.", "titulo_pt": "Robôs humanoides chineses buscam oportunidades no mercado sul-coreano", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 220828, "titulo": "European companies urged to play more active role in open source software development", "url": "https://tech.eu/2026/10/23/european-companies-urged-to-play-more-active-role-in-open-source-software-development/", "fonte_id": "tech_eu", "data_pub": "2026-10-23T08:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Europa foi incentivada a desempenhar um papel mais ativo no desenvolvimento de tecnologias de código aberto para promover a soberania. Este foi um dos principais temas emergentes da Summit de Código Aberto.", "titulo_pt": "Empresas europeias são incentivadas a se envolver mais no desenvolvimento de software de código aberto", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 220746, "titulo": "Chinese luxury carmakers face barriers in Europe's premium market", "url": "https://www.digitimes.com/news/a20261023PD209/europe-market-sales-automakers-financing.html", "fonte_id": "digitimes", "data_pub": "2026-10-23T07:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Camarotes chineses estão expandindo no mercado premium europeu, mas enfrentam barreiras que variam de suas operações na China, como reconhecimento de marca, redes de vendas e reparo, financiamento, aluguel e valor do carro usado. A presença estabelecida dos fabricantes alemães mantém a maioria do mercado premium europeu.", "titulo_pt": "Camarotes chineses enfrentam barreiras no mercado premium europeu", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 220829, "titulo": "Brain fog, missed diagnoses, and lost careers: The menopause gap Cerebella wants to close", "url": "https://tech.eu/2026/10/23/brain-fog-missed-diagnoses-and-lost-careers-the-menopause-gap-cerebella-wants-to-close/", "fonte_id": "tech_eu", "data_pub": "2026-10-23T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mulheres podem experimentar confusão mental, dificuldade de concentração e neblina cerebral durante a menopausa, especialmente quando estão no auge de suas carreiras e renda. Elas frequentemente recebem diagnósticos inadequados ou são negligenciadas nesse período.", "titulo_pt": "Nasvezas mentais, diagnósticos perdidos e carreiras interrompidas: o buraco da menopausa que Cerebella quer preencher", "veiculo": "Tech.eu", "pais": "Bélgica", "classe": "B"}, {"id": 220747, "titulo": "Japan targets 2nm medical AI chip with IBM design, Rapidus eyed for foundry", "url": "https://www.digitimes.com/news/a20261023PD230/medical-2nm-ibm-rapidus-design.html", "fonte_id": "digitimes", "data_pub": "2026-10-23T07:22:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "LSTC, Hokkaido University, Fujifilm, GE HealthCare Japan e imec lançaram uma iniciativa conjunta em Tóquio para desenvolver um sistema de imagem médica avançado, alimentado por um chip de IA de 2nm dedicado. O objetivo é acelerar dramaticamente a eficiência de processamento de imagens e permitir cálculos em tempo real diretamente em equipamentos médicos.", "titulo_pt": "Japão almeja chip de IA médica de 2nm com design da IBM, com Rapidus em vista para a produção", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 220748, "titulo": "Nvidia B300 chips reportedly surface on China Telecom-linked network, raising export-control questions", "url": "https://www.digitimes.com/news/a20261023VL220/nvidia-chips-security-blackwell-china-telecom.html", "fonte_id": "digitimes", "data_pub": "2026-10-23T07:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma empresa de segurança israelense identificou 32 placas de vídeo Nvidia Blackwell Ultra B300 em pontos finais vinculados à China Telecom, uma operadora estatal. Esses chips estão proibidos de serem vendidos para a China de acordo com as restrições de exportação dos EUA.", "titulo_pt": "Placas de vídeo nvidia identificadas em rede ligada à China telecom suscitam dúvidas sobre controle de exportação", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 220749, "titulo": "First chip-level device on the list: US FCC bans two devices with Huawei HiSilicon chips under new rule", "url": "https://www.digitimes.com/news/a20261023PD231/fcc-hisilicon-huawei-surveillance-market.html", "fonte_id": "digitimes", "data_pub": "2026-10-23T07:04:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Comissão Federal de Comunicações dos Estados Unidos (FCC) proibiu dois dispositivos eletrônicos de entrar no mercado americano, pois ambos contêm chips de vigilância fabricados pela HiSilicon, divisão de semicondutores da Huawei. Esta é a primeira vez que a FCC utiliza uma nova regra que visa dispositivos cujos fabricantes de chips são considerados riscos para a segurança nacional.", "titulo_pt": "Primeiro dispositivo com chip Huawei HiSilicon na lista: FCC proíbe dois dispositivos", "veiculo": "DIGITIMES (Taiwan)", "pais": "Taiwan", "classe": "B"}, {"id": 220783, "titulo": "As Kospi gains global prominence, foreign media increase scrutiny", "url": "https://www.koreaherald.com/article/10912998", "fonte_id": "korea_herald", "data_pub": "2026-10-23T06:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O mercado de ações sul-coreano está recebendo atenção internacional inédita, com mídias estrangeiras aumentando o escrutínio sobre diversos aspectos, incluindo ações individuais e a regulação de volatilidade do mercado. O Kospi está ganhando maior exposição a investidores globais e está cada vez mais na capa internacional, não apenas por gigantes como a Samsung e SK hynix.", "titulo_pt": "Com maior destaque global, mídia internacional aumenta a atenção ao Kospi", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}], "tecnologia__eventos": [], "ciencia": [{"id": 220341, "titulo": "La ciencia respondió cada cuánto hay que cambiar las sábanas", "url": "https://www.lanacion.com.ar/lifestyle/la-ciencia-respondio-cada-cuanto-hay-que-cambiar-las-sabanas-nid22102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-23T09:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A higiene doméstica requer cuidados especiais com a roupa de cama, conforme detalhado por especialistas. Esses profissionais indicam as condições exatas de temperatura para garantir a eliminação de alérgenos e ácaros.", "titulo_pt": "A ciência responde: quanto tempo se deve mudar as sábanas", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 220356, "titulo": "Encuentran un procedimiento que puede aliviar de forma prolongada el dolor del síndrome de túnel carpiano", "url": "https://www.latercera.com/tendencias/noticia/encuentran-un-procedimiento-que-puede-aliviar-de-forma-prolongada-el-dolor-del-sindrome-de-tunel-carpiano/", "fonte_id": "la_tercera", "data_pub": "2026-10-23T09:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O síndrome do túnel carpiano pode interferir em atividades diárias como escrever e dirigir. Um estudo investiga uma alternativa promissora para tratar esta condição.", "titulo_pt": "Encontram método que pode aliviar sintomas do túnel carpiano por prazo prolongado", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 220358, "titulo": "Por qué el riesgo de cáncer de mama aumenta con la edad, según un estudio", "url": "https://www.latercera.com/tendencias/noticia/por-que-el-riesgo-de-cancer-de-mama-aumenta-con-la-edad-segun-un-estudio/", "fonte_id": "la_tercera", "data_pub": "2026-10-23T09:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Uma pesquisa liderada por cientistas das universidades de Cambridge e Columbia Britânica criou um mapa que ilustra como o tecido mamário evolui ao longo do tempo. O estudo explica que o risco de câncer de mama aumenta à medida que a idade avança.", "titulo_pt": "Por que o risco de câncer de mama aumenta com a idade, de acordo com um estudo", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 220081, "titulo": "Arraia-manta jovem fica perto de casa, enquanto adultos se aventuram por centenas de quilômetros", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/10/arraia-manta-jovem-fica-perto-de-casa-enquanto-adultos-se-aventuram-por-centenas-de-quilometros.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-10-23T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "As arraias-mantas jovens tendem a se manter perto de suas áreas de nascimento para evitar predadores, enquanto os adultos podem se deslocar por centenas de quilômetros. O comportamento varia com a idade das espécies.", "titulo_pt": "Jovens arraias-mantas preferem ficar perto de casa, enquanto adultos se aventuram por centenas de quilômetros", "veiculo": "Folha de S.Paulo - Ciência", "pais": "Brasil", "classe": "A"}, {"id": 220137, "titulo": "O papa não está só: o crescimento dos casos de câncer de pulmão entre pessoas que nunca fumaram", "url": "https://veja.abril.com.br/saude/o-papa-nao-esta-so-o-crescimento-dos-casos-de-cancer-de-pulmao-entre-pessoas-que-nunca-fumaram/", "fonte_id": "veja", "data_pub": "2026-10-23T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O papa Leão XIV foi diagnosticado com câncer de pulmão, um caso que chama a atenção da medicina. Este diagnóstico ilustra um fenômeno crescente de câncer de pulmão em pessoas que nunca fumaram.", "titulo_pt": "O papa não está só: o crescimento dos casos de câncer de pulmão entre pessoas que nunca fumaram", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 220149, "titulo": "Nova pesquisa ajuda a desvendar as origens e o impacto do ciúme", "url": "https://veja.abril.com.br/comportamento/nova-pesquisa-ajuda-a-desvendar-as-origens-e-o-impacto-do-ciume/", "fonte_id": "veja", "data_pub": "2026-10-23T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A pesquisa explora as origens do ciúme e como ele afeta os relacionamentos. O ciúme pode surgir em diferentes graus dependendo do tipo de relacionamento.", "titulo_pt": "Nova pesquisa desvenda origens e impacto do ciúme", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 220801, "titulo": "Just 3% of the world's glaciers account for over half of glacier ice loss", "url": "https://phys.org/news/2026-10-world-glaciers-account-glacier-ice.html", "fonte_id": "phys_org", "data_pub": "2026-10-23T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Glaciers que desembarcam em lagos, oceanos ou pranchas de gelo representam apenas 3,2% dos gelos da Terra, mas foram responsáveis por mais de metade da perda de gelo entre 2000 e 2019, perdendo cerca de 134 bilhões de toneladas métricas de gelo anualmente.", "titulo_pt": "Apenas 3% dos gelos globais são responsáveis por mais da metade da perda de gelo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 220839, "titulo": "Emily St. John Mandel: ‘I don’t want to write something relentlessly bleak’", "url": "https://www.newscientist.com/article/2594154-emily-st-john-mandel-i-dont-want-to-write-something-relentlessly-bleak/?utm_campaign=RSS|NSNS&utm_content=home&utm_medium=RSS&utm_source=NSNS", "fonte_id": "new_scientist", "data_pub": "2026-10-23T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora Emily St. John Mandel conversa com Alison Flood sobre seu último livro, Exit Party, uma história de mundos paralelos. O livro é o título escolhido para o Book Club do New Scientist para outubro.", "titulo_pt": "Emily St. John Mandel: 'não quero escrever algo profundamente sombrio'", "veiculo": "New Scientist", "pais": "Reino Unido", "classe": "B"}, {"id": 220666, "titulo": "Kushima briefed by industry ministry officials on nuclear waste site survey", "url": "https://www.japantimes.co.jp/news/2026/10/23/japan/society/nuclear-waste-survey-miyazaki/", "fonte_id": "japan_times", "data_pub": "2026-10-23T08:52:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A pesquisa durará aproximadamente dois anos e examinará os riscos potenciais de vulcões e falhas com base em mapas geológicos e outros documentos. Oficiais do Ministério da Indústria foram informados sobre o levantamento de um possível local para armazenamento de resíduos nucleares em Kushima.", "titulo_pt": "Kushima informada sobre pesquisa de site para armazenamento de resíduos nucleares", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 220793, "titulo": "STAT+: State officials scrambling to implement Medicaid work requirements meet up to swap notes", "url": "https://www.statnews.com/2026/10/23/state-medicaid-officials-prepare-for-new-work-requirements/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-23T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Funcionários de estados que estão tentando implementar requisitos de trabalho para o Medicaid se encontraram durante a conferência da National Association of Medicaid Directors para compartilhar experiências.", "titulo_pt": "Funcionários de estados buscam compartilhar experiências sobre implementação de requisitos de trabalho para Medicaid", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 220794, "titulo": "Opinion: New Medicare policies will keep important pain relief from some patients", "url": "https://www.statnews.com/2026/10/23/severe-pain-policy-medicare-coverage-macs-nerve-block/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-23T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Pacientes que experenciam dor intensa ao se vestir podem ser afetados negativamente por novas políticas de medicina assistida. Um médico escreveu que essas novas regras podem tornar a terapia de alívio da dor inacessível para muitos pacientes.", "titulo_pt": "Nova política de Medicare pode deixar alívio da dor fora de alcance para alguns pacientes", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 220795, "titulo": "Opinion: Overdose deaths have plunged. We need to know why", "url": "https://www.statnews.com/2026/10/23/opioid-deaths-fallen-naloxone-treatment-supply-shock-public-health/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-23T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Três especialistas em saúde afirmam que forças externas ao cuidado médico e às políticas de saúde pública estão sendo os principais responsáveis pela significativa redução nos óbitos por overdose de opioides.", "titulo_pt": "Opinião: as mortes por overdose caíram drasticamente. Precisamos saber por quê", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 220796, "titulo": "STAT reporters react to the new Elizabeth Holmes documentary", "url": "https://www.statnews.com/2026/10/23/explain-appeal-elizabeth-holmes-doc-status-report/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-23T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Os repórteres do STAT assistiram à nova documentário sobre Elizabeth Holmes intitulado 'Você Pode Ver Tudo'. Eles forneceram uma análise do filme.", "titulo_pt": "Repórteres do STAT opinam sobre o novo documentário de Elizabeth Holmes", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 220797, "titulo": "How a targeted drug kept one patient alive 15 years — but failed to save her friends", "url": "https://www.statnews.com/2026/10/23/lung-cancer-patient-ros1-mutation-on-crizotinib/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-23T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma paciente com câncer de pulmão compartilhou sua experiência com um tratamento avançado. Ela destaca que, embora a pesquisa foque na sobrevivência, há menos ênfase na qualidade de vida dos sobreviventes.", "titulo_pt": "Como um medicamento personalizado manteve uma paciente viva por 15 anos, mas não salvou suas amigas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 220798, "titulo": "One family’s story of a life-extending medicine for pancreatic cancer", "url": "https://www.statnews.com/2026/10/23/patient-story-pancreatic-cancer-drug-daraxonrasib-rasonque/?utm_campaign=rss", "fonte_id": "stat_news", "data_pub": "2026-10-23T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Bobby Senaha foi um dos primeiros pacientes a usar daraxonrasib, um novo medicamento que estende a vida de pessoas com câncer de pâncreas. Sua esposa relata o significado desses meses adicionais para a família.", "titulo_pt": "História de uma família sobre um medicamento que estende a vida para câncer de pâncreas", "veiculo": "STAT News (saúde)", "pais": "EUA", "classe": "A"}, {"id": 220802, "titulo": "Taiwan shuts down as Typhoon Champi approaches", "url": "https://phys.org/news/2026-10-taiwan-typhoon-champi-approaches.html", "fonte_id": "phys_org", "data_pub": "2026-10-23T08:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As lojas e escolas em Taiwan foram fechadas na sexta-feira à medida que o Furacão Champi se aproximava da ilha, obrigando centenas de pessoas a deixarem suas casas antes da tempestade poderosa.", "titulo_pt": "Taiwan fecha as portas à medida que o furacão Champi se aproxima", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}], "ciencia__eventos": [], "cultura": [{"id": 220876, "titulo": "Foster + Partners designs pair of skyscrapers connected by garden bridges in Armenia", "url": "https://www.dezeen.com/2026/10/23/world-trade-center-yerevan-foster-partners-armenia/", "fonte_id": "dezeen", "data_pub": "2026-10-23T10:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Foster + Partners projetou um par de arranha-céus conectados por pontes jardim para o World Trade Center Yerevan, que será construído em Armenia. O projeto incluirá um prédio com escritórios e outro com apartamentos e um hotel.", "titulo_pt": "Foster + Partners projeta par de arranha-céus conectados por pontes jardim para world trade center yerevan em Armenia", "veiculo": "Dezeen (design e arquitetura)", "pais": "Reino Unido", "classe": "B"}, {"id": 220842, "titulo": "‘Overnight, everything was dead’: the Teeside fisherman turned activist dubbed the Mr Bates of the seas", "url": "https://www.theguardian.com/film/2026/oct/23/overnight-everything-was-dead-the-teeside-fisherman-turned-activist-dubbed-the-mr-bates-of-the-seas", "fonte_id": "guardian_culture", "data_pub": "2026-10-23T09:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Em 2021, milhares de crustáceos mortos ou moribundos foram encontrados nas praias de Yorkshire e do norte da Inglaterra. Stan Rennie, um pescador que se tornou ativista, lidera agora a luta contra a poluição oceanária e as coberturas de empresas.", "titulo_pt": "De repente, tudo ficou morto: o pescador que se tornou ativista contra a poluição marinha", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 220340, "titulo": "Virginia Woolf: “No se puede pensar bien, amar bien, dormir bien, si no se ha comido bien”", "url": "https://www.lanacion.com.ar/lifestyle/virginia-woolf-no-se-puede-pensar-bien-amar-bien-dormir-bien-si-no-se-ha-comido-bien-nid22102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-23T09:11:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Virginia Woolf, uma escritora britânica famosa, deixou uma observação sobre a importância da alimentação para a mente e o bem-estar. Essa ideia continua relevante mais de um século depois.", "titulo_pt": "Virginia Woolf: 'não se pode pensar bem, amar bem, dormir bem, se não se comeu bem'", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 220882, "titulo": "What It Was Like to See Nina Simone at the Village Gate, c. 1961", "url": "https://lithub.com/what-it-was-like-to-see-nina-simone-at-the-village-gate-c-1961/", "fonte_id": "lithub", "data_pub": "2026-10-23T09:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma anúncio interrompeu a conversa do público no Village Gate em torno de 1961, anunciando a apresentação da extraordinária Miss Nina Simone. Ela acabava de concluir um show curto no local.", "titulo_pt": "Como foi ver Nina Simone no Village Gate, c. 1961", "veiculo": "Literary Hub", "pais": "EUA", "classe": "B"}, {"id": 220445, "titulo": "Boom in weight-loss drugs could lead to drop in beer sales, Heineken warns British pubs", "url": "https://www.theguardian.com/business/2026/oct/23/weight-loss-drugs-beer-sales-heineken-british-pubs-wegovy", "fonte_id": "guardian_world", "data_pub": "2026-10-23T09:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Heineken alertou que o aumento no uso de medicamentos para perda de peso, como o Wegovy, pode levar a uma diminuição nas vendas de cerveja e cidra nas casas de bebida britânicas. Segundo a empresa, esses medicamentos podem reduzir o desejo de beber álcool, resultando em 'satisfação e menos porções' de bebidas nos bares e pubs.", "titulo_pt": "Aumento nas vendas de medicamentos para emagrecimento poderia reduzir as vendas de cerveja, avisa Heineken para bares britânicos", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 220146, "titulo": "Criador de ‘Crazy Taxi’ explica nova fase ambientada no Brasil", "url": "https://veja.abril.com.br/tecnologia/criador-de-crazy-taxi-explica-nova-fase-ambientada-no-brasil/", "fonte_id": "veja", "data_pub": "2026-10-23T09:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Kenji Kanno, criador da série Crazy Taxi, concedeu uma entrevista à VEJA sobre como aborda o desafio de manter a jogabilidade clássica enquanto inova no novo jogo ambientado no Brasil.", "titulo_pt": "Criador de ‘Crazy Taxi’ fala sobre nova fase no Brasil", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 220665, "titulo": "‘The Potentials’ unpacks the dilemmas of a manga assistant in middle age", "url": "https://www.japantimes.co.jp/culture/2026/10/23/film/the-potentials/", "fonte_id": "japan_times", "data_pub": "2026-10-23T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "The Potentials é uma narrativa envolvente sobre arte, vida e os desafios que surgem no caminho de um assistente de mangá em meia-idade.", "titulo_pt": "‘Os potenciais’ explora as dilemas de um assistente de mangá na meia-idade", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 220847, "titulo": "Lessons in Chemistry author Bonnie Garmus: ‘I wrote my first novel at 12 – it has not yet found a publisher’", "url": "https://www.theguardian.com/books/2026/oct/23/lessons-in-chemistry-author-bonnie-garmus-i-wrote-my-first-novel-at-12-it-has-not-yet-found-a-publisher", "fonte_id": "guardian_culture", "data_pub": "2026-10-23T09:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A autora Lessons in Chemistry, Bonnie Garmus, tem uma memória vívida de seu primeiro contato com a leitura aos quatro anos, quando leu a série Dick and Jane com seu pai. Sua obra favorita da infância foi Harriet the Spy, de Louise Fitzhugh.", "titulo_pt": "A autora de lessons in Chemistry, Bonnie Garmus, sobre suas memórias de leitura e livros favoritos da infância", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 220668, "titulo": "India warms to French cooking as economic growth fuels fine-dining boom", "url": "https://www.japantimes.co.jp/news/2026/10/23/asia-pacific/society/india-french-cooking-schools/", "fonte_id": "japan_times", "data_pub": "2026-10-23T08:33:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A classe média indiana, que viaja mais e come cada vez mais em estabelecimentos luxuosos, está criando uma demanda por trabalhadores de alta gama. A crescente popularidade da culinária francesa está se beneficiando desse fenômeno.", "titulo_pt": "Índia se abre para a culinária francesa com o crescimento econômico e o boom de restaurantes de luxo", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 220070, "titulo": "Financiamento público não exige fidelidade política, afirma Margareth Menezes", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://www1.folha.uol.com.br/ilustrada/2026/10/financiamento-publico-nao-exige-fidelidade-politica-afirma-margareth-menezes.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-23T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Margareth Menezes, ministra do Ministério da Cultura desde janeiro de 2023, afirma que o financiamento público não exige fidelidade política. Ela faz um balanço de sua gestão no governo de Lula, do PT, na reta final do terceiro mandato do presidente.", "titulo_pt": "Financiamento público não exige fidelidade política, afirma Margareth Menezes", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 220071, "titulo": "Patrocinador de Luciano Huck renova com Globo para 2027 e causa alívio nos bastidores", "url": "https://redir.folha.com.br/redir/online/ilustrada/rss091/*https://f5.folha.uol.com.br/colunistas/outro-canal/2026/10/patrocinador-de-luciano-huck-renova-com-globo-para-2027-e-causa-alivio-nos-bastidores.shtml", "fonte_id": "folha_ilustrada", "data_pub": "2026-10-23T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um patrocinador confirmou à Globo que continuará associado ao programa do Luciano Huck no Domingão em 2027. Huck permanece como um alvo desejado do mercado publicitário, embora tenha passado por alguns desgastes recentemente.", "titulo_pt": "Patrocinador de Luciano Huck renova com Globo para 2027 e causa alívio nos bastidores", "veiculo": "Folha de S.Paulo - Ilustrada", "pais": "Brasil", "classe": "A"}, {"id": 220843, "titulo": "Murder on the dancefloor: are phones, drugs and chatter killing off dancing?", "url": "https://www.theguardian.com/music/2026/oct/23/on-the-dancefloor-are-phones-drugs-and-chatter-killing-off-dancing", "fonte_id": "guardian_culture", "data_pub": "2026-10-23T07:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Uma discussão surgiu nas boates sobre a quantidade de conversa durante as performances de DJs, iniciada por uma postagem de uma DJ chamada Jane Fitz no Instagram. Ela pediu aos frequentadores que diminuíssem a conversa durante os sets musicais.", "titulo_pt": "Morte no piso de dança: conversas, drogas e telefones estão matando a dança?", "veiculo": "The Guardian Culture", "pais": "Reino Unido", "classe": "A"}, {"id": 220780, "titulo": "Santos Bravos to mark first anniversary with new release", "url": "https://www.koreaherald.com/article/10913019", "fonte_id": "korea_herald", "data_pub": "2026-10-23T06:28:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A banda de pop latino Santos Bravos, lançada pela Hybe Latin America, comemorará seu primeiro aniversário com um novo lançamento no dia 20 de novembro. O grupo anunciou a data através das suas redes sociais, publicando uma imagem teaser que sugere um pano de cravos e uma mão.", "titulo_pt": "Santos Bravos marcam primeiro aniversário com novo lançamento", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 220672, "titulo": "Japanese novelist Ryu Murakami dies at 74", "url": "https://www.japantimes.co.jp/culture/2026/10/23/books/novelist-ryu-murakami-obituary/", "fonte_id": "japan_times", "data_pub": "2026-10-23T06:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Ryu Murakami, um novelista japonês conhecido por explorar temas como sexo, violência e cultura jovem em suas obras, faleceu aos 74 anos. Seus livros foram traduzidos para várias línguas.", "titulo_pt": "O novelist japonês Ryu Murakami morre aos 74 anos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 220674, "titulo": "Shigeru Miyamoto named first video game-related recipient of Japan’s Order of Culture", "url": "https://www.japantimes.co.jp/life/2026/10/23/digital/order-of-culture-miyamoto/", "fonte_id": "japan_times", "data_pub": "2026-10-23T06:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Shigeru Miyamoto, lendário figura da Nintendo, receberá oficialmente o prêmio em cerimônia marcada para o dia 3 de novembro. Este será o primeiro reconhecimento cultural relacionado a videojogos concedido a um japonês.", "titulo_pt": "Shigeru Miyamoto recebe primeiro prêmio cultural japonês relacionado a videojogos", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 220784, "titulo": "'Because it's Apple': What drives Korea's first iPhone Duo buyers", "url": "https://www.koreaherald.com/article/10912978", "fonte_id": "korea_herald", "data_pub": "2026-10-23T06:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um funcionário de uma empresa de jogos de Seul, de meia-idade, foi um dos primeiros compradores do iPhone Duo da Apple, pagando 3,29 milhões de wones (cerca de 2.300 dólares). Ele manteve seu Samsung Galaxy Z Fold8, mas não trocou completamente para Android devido à dependência de seus dispositivos Apple existentes.", "titulo_pt": "Porque é a Apple: o que motiva os primeiros compradores do iphone Duo da Coreia", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}], "cultura__eventos": [], "sociedade": [{"id": 220176, "titulo": "Foragido por feminicídio no Rio, \"Mendigato\" é preso em academia de SP", "url": "https://www.metropoles.com/sao-paulo/foragido-por-feminicidio-no-rio-mendigato-e-preso-em-academia-de-sp", "fonte_id": "metropoles", "data_pub": "2026-10-23T09:34:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Valdir Coimbra da Costa, conhecido como 'Mendigato', foi preso em uma academia em São Paulo. Ele é suspeito de cometer um feminicídio no Rio de Janeiro, onde teria matado e ocultado o corpo da sua ex-namorada, Cristiane dos Santos.", "titulo_pt": "Foragido por feminicídio no Rio, 'Mendigato' é preso em academia de SP", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 220177, "titulo": "“Mestrado e PhD”: falsa nutricionista é presa em residencial de luxo no RJ", "url": "https://www.metropoles.com/colunas/mirelle-pinheiro/mestrado-e-phd-falsa-nutricionista-e-presa-em-residencial-de-luxo-no-rj", "fonte_id": "metropoles", "data_pub": "2026-10-23T09:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma falsa nutricionista foi presa em um residencial de luxo no Rio de Janeiro. A mulher foi condenada a 16 anos de prisão por estelionato.", "titulo_pt": "Mestrado e PhD: falsa nutricionista é presa em residencial de luxo no RJ", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 220178, "titulo": "\"Consórcio do tráfico\" que abastecia o DF faturou R$ 1,3 milhão em 60 dias", "url": "https://www.metropoles.com/distrito-federal/na-mira/consorcio-do-trafico-que-abastecia-o-df-faturou-r-13-milhao-em-60-dias", "fonte_id": "metropoles", "data_pub": "2026-10-23T09:29:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma organização criminosa faturou R$ 1,3 milhão em 60 dias abastecendo o Distrito Federal com drogas. As operações envolviam empresas de fachada e propriedades em Samambaia e Sol Nascente para armazenar substâncias ilícitas trazidas de outros estados.", "titulo_pt": "Consórcio do tráfico que abastecia o DF faturou R$ 1,3 milhão em 60 dias", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 220293, "titulo": "O jovem que criou portal para localizar desaparecidos em terremoto na Venezuela", "url": "https://www.bbc.com/portuguese/articles/cr15jpdvgp7zo?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-10-23T09:14:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Diante da falta de informações fornecidas pelo governo venezuelano, Jorge Bastidas desenvolveu um portal com a ajuda de inteligência artificial para auxiliar parentes na busca por desaparecidos após um terremoto.", "titulo_pt": "Jovem cria portal com IA para localizar desaparecidos após terremoto na Venezuela", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 220605, "titulo": "Why is Gen Z revolting?", "url": "https://www.aljazeera.com/opinions/2026/10/23/why-is-gen-z-revolting?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-23T07:51:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Jovens de vários países, como França e Índia, estão nas ruas em protesto contra a desigualdade, serviços públicos falhantes e perspectivas desanimadoras.", "titulo_pt": "Por que a geração Z está em revolta?", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 220773, "titulo": "Special education support expands, but where are the teachers?", "url": "https://www.koreaherald.com/article/10913168", "fonte_id": "korea_herald", "data_pub": "2026-10-23T07:45:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O governo continua expandindo o apoio para crianças com deficiências, mas não houve um aumento correspondente no número de professores necessários para educá-las, conforme relatado por uma parlamentar. De acordo com a deputada Kang Kyung-sook, o Ministério da Educação realizou exames e avaliações de deficiências em 7.097 crianças com idades entre 0 e 5 anos no último ano, em um programa piloto para expandir o apoio educacional especializado em creches.", "titulo_pt": "Apoio especializado para crianças com deficiências expande, mas professores faltam", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 220703, "titulo": "Hong Kong constable paralysed in 2005 knife attack laid to rest with full honours", "url": "https://www.scmp.com/news/hong-kong/society/article/3371899/hong-kong-constable-paralysed-2005-knife-attack-laid-rest-full-honours", "fonte_id": "scmp", "data_pub": "2026-10-23T07:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um constante de Hong Kong faleceu aos 52 anos, 21 anos após ser deixado paralítico em um ataque durante o serviço. Oficiais do governo e da polícia locais prestaram homenagens fúnebres completas em seu funeral.", "titulo_pt": "Constante paralítico em 2005 durante ataque com faca é sepultado com honras policiais completas", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 220113, "titulo": "Entenda como funciona a regra de proteção do Bolsa Família para quem consegue emprego", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/10/entenda-como-funciona-a-regra-de-protecao-do-bolsa-familia-para-quem-consegue-emprego.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-23T07:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Quem recebe o Bolsa Família e passa a ganhar mais ou encontra emprego pode continuar recebendo metade do valor do benefício, desde que atenda aos critérios de renda e prazo. A regra de proteção permite que as famílias mantenham parte do auxílio mesmo com melhoras na situação econômica.", "titulo_pt": "Entenda como funciona a regra de proteção do Bolsa Família para quem consegue emprego", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 220791, "titulo": "President seeks to quell public fears of violent crimes", "url": "https://www.koreaherald.com/article/10912832", "fonte_id": "korea_herald", "data_pub": "2026-10-23T04:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O presidente Lee Jae Myung pediu às agências governamentais que enfrentassem os crimes graves com determinação, comparando a situação a uma guerra. Ele também solicitou medidas mais rigorosas para prevenir ataques aleatórios e proteger vítimas de violência doméstica.", "titulo_pt": "Presidente pede medidas mais rigorosas para combater crimes graves", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 220679, "titulo": "New York bans horse-drawn carriages after decadelong battle", "url": "https://www.japantimes.co.jp/news/2026/10/23/world/society/new-york-horse-carriages-ban/", "fonte_id": "japan_times", "data_pub": "2026-10-23T03:59:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O conselho de cidade de Nova York votou a favor da proibição de carruagens puxadas por cavalos por 40 votos a 7. O prefeito Zohran Mamdani está previsto para sancionar a lei.", "titulo_pt": "Nova York proíbe carruagens puxadas por cavalos após década de batalha", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 220363, "titulo": "Al menos ocho muertos y diez heridos en motines en dos cárceles de Ecuador", "url": "https://www.latercera.com/mundo/noticia/al-menos-ocho-muertos-y-diez-heridos-en-motines-en-dos-carceles-de-ecuador/", "fonte_id": "la_tercera", "data_pub": "2026-10-23T03:48:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Houve revoltas em duas prisões em Ecuador, resultando em ao menos oito mortos e dez feridos. As revoltas ocorreram nos Centros de Privação de Liberdade Cotopaxi N.º 1 e Pichincha N.º 1, e coincidiram com o arresto da ex-candidata presidencial e líder opositora Luisa González.", "titulo_pt": "Ao menos oito mortos e dez feridos em motins em duas prisões do Ecuador", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 219670, "titulo": "Ocas indígenas são incendiadas no Guará; PCDF apura se há indício de crime", "url": "https://www.metropoles.com/distrito-federal/ocas-indigenas-sao-incendiadas-no-guara-pcdf-apura-se-ha-indicio-de-crime", "fonte_id": "metropoles", "data_pub": "2026-10-22T21:46:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Ocas indígenas localizadas no Guará foram incendiadas. A Polícia Civil do Distrito Federal (PCDF) investiga se há indícios de crime. As câmeras de segurança registraram dois homens entrando e saindo do local nos momentos em que ocorreram os incêndios.", "titulo_pt": "Ocas indígenas são incendiadas no Guará; PCDF investiga", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 219671, "titulo": "SSP reúne esquerda e direita para debater manifestações de sábado no DF", "url": "https://www.metropoles.com/distrito-federal/ssp-reune-esquerda-e-direita-para-debater-manifestacoes-de-sabado-no-df", "fonte_id": "metropoles", "data_pub": "2026-10-22T21:45:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Secretaria de Segurança Pública (SSP) realizou uma reunião com representantes de diferentes tendências políticas para discutir os planos de segurança e organização dos atos previstos para o DF na véspera da eleição.", "titulo_pt": "SSP reúne esquerda e direita para discutir manifestações no DF", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 219593, "titulo": "Diretora de prisão feminina é presa por suspeita de desvio de alimentos", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/rj/diretora-de-prisao-feminina-e-presa-por-suspeita-de-desvio-de-alimentos/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-22T21:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A diretora do Presídio de Benfica, no Rio de Janeiro, foi presa sob suspeita de desviar alimentos. O caso ocorreu no presídio localizado na Zona Norte do Rio.", "titulo_pt": "Diretora de presídio feminino é presa por suspeita de desvio de alimentos", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 219894, "titulo": "Moderna shares sink after leaked cancer data missed expectations", "url": "https://www.ft.com/content/9e59746f-9b63-4adb-b868-14088d638b8a?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-10-22T21:37:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "As ações da Moderna caíram após os dados vazados sobre um tratamento de vacina contra melanoma não atingirem as expectativas do mercado. A vacina reduziu em 58% o risco de recorrência ou morte por melanoma, mas não superou as expectativas elevadas da Wall Street.", "titulo_pt": "Ações da moderna caem após dados vazados sobre tratamento anticâncer decepcionarem expectativas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 219675, "titulo": "Jovem é assassinado a facadas em bar após defender funcionária de assédio", "url": "https://www.metropoles.com/distrito-federal/na-mira/jovem-e-assassinado-a-facadas-em-bar-apos-defender-funcionaria-de-assedio", "fonte_id": "metropoles", "data_pub": "2026-10-22T21:36:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um jovem foi assassinado a facadas em um bar após tentar defender uma funcionária de assédio sexual. O suspeito buscou uma faca em sua casa, cometeu o crime e foi cercado pela população antes de ser detido.", "titulo_pt": "Jovem é assassinado a facadas em bar após tentar defender funcionária de assédio sexual", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 220690, "titulo": "Paper straws worse for the environment than plastic, South Korea study finds", "url": "https://www.scmp.com/week-asia/health-environment/article/3371936/paper-straws-worse-environment-plastic-south-korea-study-finds", "fonte_id": "scmp", "data_pub": "2026-10-23T09:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um estudo encomendado pelo Ministério de Clima, Energia e Meio Ambiente da Coreia do Sul descobriu que os palitos de papel, amplamente promovidos como uma alternativa ecológica aos de plástico, podem ter um impacto ambiental maior do que os palitos de plástico convencionais. Este achado reavivou a discussão sobre se a mudança de material realmente reduz o desperdício.", "titulo_pt": "Palitos de papel podem ter maior impacto ambiental do que os de plástico, sugere estudo sul-coreano", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 220586, "titulo": "Flash floods swamp southeast Australia as record October rainfall forces school closures", "url": "https://www.euronews.com/2026/10/23/flash-floods-swamp-southeast-australia-as-record-october-rainfall-forces-school-closures", "fonte_id": "euronews", "data_pub": "2026-10-23T08:29:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Flash floods inundaram áreas do sul-leste da Austrália, causando alagamentos graves que levaram a escolas a serem fechadas devido a chuvas históricas em outubro. Um repórter de televisão teve que se despir de sapatos e óculos para resgatar um motorista cujo carro estava afundando rapidamente em Morayfield, Queensland.", "titulo_pt": "Inundações flash inundam sul-leste da austrália com chuvas de outubro recorde fechando escolas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 220182, "titulo": "Vazamento de petróleo provoca fechamento de praias nos Emirados Árabes", "url": "https://www.metropoles.com/mundo/vazamento-de-petroleo-provoca-fechamento-de-praias-nos-emirados-arabes", "fonte_id": "metropoles", "data_pub": "2026-10-23T08:18:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Praias nos Emirados Árabes foram fechadas devido a um vazamento de petróleo. Elas permanecerão fechadas até que equipes técnicas avaliem a situação e determinem as medidas necessárias.", "titulo_pt": "Vazamento de petróleo leva a fechamento de praias nos Emirados Árabes", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 220588, "titulo": "Taiwan: Deadly Typhoon Champi brings travel chaos and school closures", "url": "https://www.euronews.com/video/2026/10/23/taiwan-deadly-typhoon-champi-brings-travel-chaos-and-school-closures", "fonte_id": "euronews", "data_pub": "2026-10-23T07:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Champi atingiu a costa de Taiwan, causando ondas altas e deixando uma morte, 94 feridos e centenas de voos cancelados.", "titulo_pt": "Taiwan: furacão Champi causa mortes, feridos e cancelamentos de voos", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 220671, "titulo": "Japan weighs how to evacuate thousands of tourists if Mount Fuji erupts", "url": "https://www.japantimes.co.jp/news/2026/10/23/japan/mount-fuji-eruption-foreign-tourists/", "fonte_id": "japan_times", "data_pub": "2026-10-23T07:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Monte Fuji, o ponto mais alto do Japão, é frequentemente considerado um vulcão inativo. No entanto, com o risco de erupção sempre presente, a preparação para desastres é crucial.", "titulo_pt": "Japão pondera como evacuar milhares de turistas se o monte Fuji erupcionar", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 220706, "titulo": "Indonesian wildfires threaten world’s oldest cave paintings in Sulawesi", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3371884/indonesian-wildfires-threaten-worlds-oldest-cave-paintings-sulawesi", "fonte_id": "scmp", "data_pub": "2026-10-23T06:31:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Cavernas na ilha indonésia de Sulawesi contêm pinturas rupestres datadas em mais de 67.000 anos, que estão em perigo devido às chamas e fumaça das piores queimadas da história do país, que ocorrem devido a um El Niño severo. Pesquisadores alertam que o calor e a fumaça podem acelerar o desgaste dessas obras de arte antiga.", "titulo_pt": "Incêndios na indonésia ameaçam pinturas rupestres antigas em Sulawesi", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 219188, "titulo": "Lai outlines climate resilience plans", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/10/23/2003866472", "fonte_id": "taipei_times", "data_pub": "2026-10-23T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Lai apresentou planos para aumentar a resiliência climática. O anúncio incluiu medidas para enfrentar os efeitos das mudanças climáticas.", "titulo_pt": "Lai detalha planos de resiliência climática", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 219594, "titulo": "Elevada umidade retarda plantio de soja no Rio Grande do Sul, diz Emater", "url": "https://www.cnnbrasil.com.br/agro/elevada-umidade-retarda-plantio/", "fonte_id": "cnn_brasil", "data_pub": "2026-10-22T21:39:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A elevada umidade tem retardado o plantio de soja no Rio Grande do Sul, de acordo com a Emater. A instituição relata que as condições meteorológicas têm dificultado a realização das sementes no estado.", "titulo_pt": "Elevada umidade retarda plantio de soja no Rio Grande do Sul, diz Emater", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 219769, "titulo": "“Nunca vimos algo así”: la advertencia de la argentina que dirige el organismo meteorológico de la ONU sobre El Niño", "url": "https://www.lanacion.com.ar/sociedad/nunca-vimos-algo-asi-la-advertencia-de-la-argentina-que-dirige-el-organismo-meteorologico-de-la-onu-nid22102026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-10-22T21:10:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Celeste Saulo, que dirige o organismo meteorológico da ONU, advertiu que o aquecimento do Pacífico ultrapassará os registros dos últimos 40 anos. O fenômeno El Niño deve atingir seu pico no fim do ano e ter seus efeitos se estendendo até 2027.", "titulo_pt": "‘Nunca vimos algo assim’: a advertência argentina sobre El Niño", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 219796, "titulo": "When Rivers Run Low in the American West", "url": "https://www.theatlantic.com/newsletters/2026/10/the-one-resource-the-american-west-will-never-stop-fighting-over/689120/?utm_source=feed", "fonte_id": "the_atlantic", "data_pub": "2026-10-22T19:32:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O recurso de água é o único que a região do Oeste americano nunca parará de disputar.", "titulo_pt": "Quando os rios secam no oeste americano", "veiculo": "The Atlantic", "pais": "EUA", "classe": "A"}, {"id": 219475, "titulo": "O que o Brasil ganha ao desmatar menos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/colunas/braulio-borges/2026/10/o-que-o-brasil-ganha-ao-desmatar-menos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-10-22T18:37:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desmatamento na Amazônia Legal brasileira entre agosto de 2025 e julho de 2026 atingiu 3,3 mil km², o menor valor desde 1988, representando uma queda de 71% em comparação com 2022. No Cerrado, a área desmatada foi de 5,5 mil km², também a menor desde 1988, com uma redução de 48% em quatro anos.", "titulo_pt": "O que o Brasil ganha ao desmatar menos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 218874, "titulo": "Santuario Padre Hurtado busca reutilizar 70 mil litros de agua y aumentar su biodiversidad", "url": "https://www.latercera.com/sustentabilidad/noticia/santuario-padre-hurtado-busca-reutilizar-70-mil-litros-de-agua-y-aumentar-su-biodiversidad/", "fonte_id": "la_tercera", "data_pub": "2026-10-22T14:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Santuario Padre Hurtado, em colaboração com a Fundación Circular, transformou a piscina existente em um estanque verde, incorporando sistemas de reutilização de água e espécies que promovem a biodiversidade.", "titulo_pt": "Santuário Padre Hurtado busca reutilizar 70 mil litros de água e aumentar sua biodiversidade", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 219013, "titulo": "96% of coral reefs 'critically endangered,' at risk of collapse in 50 years", "url": "https://www.lemonde.fr/en/environment/article/2026/10/22/96-of-coral-reefs-critically-endangered-at-risk-of-collapse-in-50-years_6761515_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-10-22T13:30:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A União Internacional para a Conservação da Natureza declarou que 96% dos recifes de corais estão em situação criticamente endêmica e podem colapsar em 50 anos devido ao aquecimento global.", "titulo_pt": "96% Dos recifes de corais 'criticamente ameaçados,' em risco de colapso em 50 anos", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 218597, "titulo": "Brasil reduz emissões em 6%, mas não cumpre meta climática de 2025", "url": "https://exame.com/esg/brasil-reduz-emissoes-em-6-mas-nao-cumpre-meta-climatica-de-2025/", "fonte_id": "exame", "data_pub": "2026-10-22T13:09:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Brasil reduziu suas emissões em 6%, mas não atingiu a meta estabelecida para 2025. O levantamento do Observatório do Clima indica que o país lançou 2,06 bilhões de toneladas de CO₂ equivalente na atmosfera. A redução foi principalmente no uso da terra, enquanto a energia e os resíduos apresentaram aumento.", "titulo_pt": "Brasil reduz emissões, mas não cumpre meta climática de 2025", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 219172, "titulo": "Nearly all coral reefs risk collapse in 50 years: IUCN", "url": "https://www.japantimes.co.jp/environment/2026/10/22/climate-change/coral-reefs-collapse-50-years/", "fonte_id": "japan_times", "data_pub": "2026-10-22T12:58:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O IUCN, a autoridade mundial sobre vida selvagem em perigo, realizou sua primeira avaliação global e classificou 96% dos sistemas de corais como 'criticamente ameaçados'.", "titulo_pt": "Quase todos os recifes de corais correm risco de colapso em 50 anos, segundo IUCN", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 218863, "titulo": "Almost every shallow-water coral reef on the planet faces ecosystem collapse by 2075, UN advisors say", "url": "https://www.theguardian.com/australia-news/2026/oct/22/shallow-water-coral-reef-ecosystem-collapse-by-2075-un-advisors-say", "fonte_id": "guardian_world", "data_pub": "2026-10-22T12:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um relatório das consultoras do United Nations sobre o aquecimento global indica que quase todas as ilhas de corais de águas rasas no planeta correm o risco de colapso ecológico antes de 2075. Cerca de 24% dessas ilhas de corais já estão em situação crítica em mais de 80 países.", "titulo_pt": "Pratically todas as ilhas de corais de águas rasas no planeta enfrentam risco de colapso ecológico até 2075, dizem conselheiros da ONU", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 220659, "titulo": "Alleged Police Violence Against Minors Alarms Albania", "url": "https://balkaninsight.com/2026/10/23/alleged-police-violence-against-minors-alarms-albania/bi/", "fonte_id": "balkan_insight", "data_pub": "2026-10-23T09:54:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 200 menores foram detidos ou acusados durante protestos em Albania, enquanto o Defensor do Povo e organizações de direitos humanos relatam acusações de violência policial e violações das medidas de proteção destinadas a crianças.", "titulo_pt": "Alegadas violências policiais contra menores alarmam Albania", "veiculo": "Balkan Insight (BIRN)", "pais": "Sérvia", "classe": "A"}, {"id": 220376, "titulo": "Rebaja de penas a abusadores de menores obliga a senadores y al gobierno a anunciar reformas para impedir el beneficio en estas condenas", "url": "https://www.latercera.com/politica/noticia/rebaja-de-penas-a-abusadores-de-menores-obliga-a-senadores-y-al-gobierno-a-anunciar-reformas-para-impedir-el-beneficio-en-estas-condenas/", "fonte_id": "la_tercera", "data_pub": "2026-10-23T00:01:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Senadores chilenos estão trabalhando em reformas legais para evitar que a redução de penas para abusadores de menores beneficie esses criminosos. O ministro de Justiça, Fernando Rabat, afirmou que o governo também apresentará um projeto de lei sobre o assunto.", "titulo_pt": "Senadores e governo chilenos buscam reformas para impedir benefícios para abusadores de menores", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 220500, "titulo": "Suprema sí tuvo fallos en contra de rebajas a abusadores sexuales; ministro Rau llama a afiliados a postergar jubilación por caída del Fondo E, y TC declara inadmisible requerimiento contra las RUF", "url": "https://www.ciperchile.cl/2026/10/22/radar-22-10-2026/?utm_source=rss&utm_medium=rss&utm_campaign=radar-22-10-2026", "fonte_id": "ciper_chile", "data_pub": "2026-10-22T23:03:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A Suprema Corte confirmou falhas em decisões que beneficiaram abusadores sexuais. O ministro Rau incentivou os afiliados a postergarem a aposentadoria devido à queda do Fundo E. A Corte Constitucional declarou o requerimento contra as RUF inadmissível.", "titulo_pt": "Suprema corte confirmou falhas em decisões sobre abusadores sexuais; ministro incentiva postergação da aposentadoria; corte constitucional declara requerimento inadmissível", "veiculo": "CIPER Chile", "pais": "Chile", "classe": "A"}, {"id": 219950, "titulo": "Republican politicians have embraced anti-Indian racism — and it’s costing them votes", "url": "https://www.theverge.com/report/1017003/indian-americans-republican-racism-vivek-ramaswamy-texas", "fonte_id": "the_verge", "data_pub": "2026-10-22T19:15:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Vasant Bhatt, um estudante da Universidade do Houston, que havia ajudado a campanha reeleitoral do Senador Ted Cruz e a campanha de Donald Trump, votou em um candidato não republicano, o que é inesperado dadas suas anteriores ações políticas.", "titulo_pt": "Políticos republicanos têm apoiado racismo anti-indígena — e isso está custando votos", "veiculo": "The Verge", "pais": "EUA", "classe": "B"}, {"id": 219079, "titulo": "Foreign national beaten to death by a mob in South Africa", "url": "https://www.aljazeera.com/news/2026/10/22/foreign-national-beaten-to-death-by-a-mob-in-south-africa?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-22T17:35:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem estrangeiro foi morto por uma multidão de 50 pessoas em Durban, na África do Sul, durante uma onda de manifestações anti-imigrantes.", "titulo_pt": "Estrangeiro baleado e morto por multidão em durban, áfrica do sul", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 219081, "titulo": "Jerusalem Daily: Israeli soldier abusing cat goes viral", "url": "https://www.aljazeera.com/video/newsfeed/2026/10/22/jerusalem-daily-israeli-soldier-abusing-cat-goes-viral?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-10-22T17:25:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um vídeo mostrando um soldado israelense lançando um gato sobre uma grade se tornou viral na internet.", "titulo_pt": "Vídeo de soldado israelense jogando gato viraliza", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 219441, "titu function toggleDrill(id) {

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

const FLAG_HASH = "f9c45d8d3a32f9ad4e9e9719901ab6dd8d94e48c0f0ae07a05584955c2a3f7d1";

let _fUrl = '', _fTit = '';

async function sha256hex(t) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}

function abrirModal(id) { document.getElementById(id).classList.add('aberta'); }
function fecharModal(id) {
  document.getElementById(id).classList.remove('aberta');
  if (id === 'modal-senha') {
    document.getElementById('inp-senha').value = '';
    document.getElementById('senha-erro').style.display = 'none';
  }
}

async function verificarSenha() {
  const h = await sha256hex(document.getElementById('inp-senha').value);
  if (h === FLAG_HASH) {
    sessionStorage.setItem('flagAuth', '1'); flagAuth = true;
    fecharModal('modal-senha');
    document.body.classList.add('modo-editorial');
    const b = document.getElementById('btn-ed');
    if (b) { b.classList.add('ativo'); b.title = 'Modo editorial ativo'; }
  } else {
    document.getElementById('senha-erro').style.display = '';
  }
}

document.getElementById('inp-senha').addEventListener('keydown', e => { if (e.key === 'Enter') verificarSenha(); });
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) fecharModal(m.id); });
});

function abrirFlagBtn(btn) {

  _fUrl = btn.dataset.url;

  document.getElementById('flag-modal-titulo').textContent = _fTit.slice(0, 72) + (_fTit.length > 72 ? '…' : '');

  document.getElementById('flag-nota').value = f ? f.nota : '';
  document.getElementById('btn-rm-flag').style.display = f ? '' : 'none';
  abrirModal('modal-flag');
}

    btn.classList.toggle('flag-ativo', ativo);

    btn.textContent = ativo ? '⚑' : '⚐';

  if (!list.length) { alert('Nenhuma flag para copiar.'); return; }
  const txt = list.map((f, i) =>
    `${i + 1}. [${TIPO_LABEL[f.tipo] || f.tipo}] ${f.titulo}\n   ${f.url}${f.nota ? '\n   Nota: ' + f.nota : ''}\n   Edição: ${f.edicao}`
  ).join('\n\n');
  navigator.clipboard.writeText(txt).catch(() => prompt('Copie o relatório:', txt));
}

function limparFlags() {
  if (!confirm('Limpar todas as flags? Essa ação não pode ser desfeita.')) return;
  flags = {}; _saveFlags(); fecharModal('modal-relatorio');
}

function flagBtn(url, titulo) {
  if (!FLAG_ON) return '';
  const ativo = !!flags[url];
  const su = esc(url).replace(/"/g, '&quot;');
  const st = esc(titulo).replace(/"/g, '&quot;');
  return `<button class="flag-btn${ativo ? ' flag-ativo' : ''}" data-url="${su}" data-titulo="${st}" title="${ativo ? 'Flagged — clique para editar' : 'Marcar problema'}" onclick="event.preventDefault();event.stopPropagation();abrirFlagBtn(this)">${ativo ? '⚑' : '⚐'}</button>`;
}

if (FLAG_ON) {
  const bEd = document.createElement('button');
  bEd.id = 'btn-ed'; bEd.className = 'editorial-btn';
  bEd.title = 'Modo editorial (flags)'; bEd.textContent = '⚑';
  if (flagAuth) {
    document.body.classList.add('modo-editorial');
    bEd.classList.add('ativo'); bEd.title = 'Modo editorial ativo';
  }
  bEd.onclick = () => { if (flagAuth) abrirRelatorio(); else abrirModal('modal-senha'); };
  nav.appendChild(bEd);
}

// TTS — audio pre-renderizado por Piper
(function () {
  var player = document.createElement('audio');
  player.preload = 'auto';
  player.setAttribute('playsinline', '');
  document.body.appendChild(player);
  var barAtual = null;

  function _resetBar(bar) {
    if (!bar) return;
    bar.querySelector('.tts-ouvir').hidden     = false;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = true;
  }

  function _setTocando(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = false;
    bar.querySelector('.tts-continuar').hidden = true;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _setPausado(bar) {
    bar.querySelector('.tts-ouvir').hidden     = true;
    bar.querySelector('.tts-pausar').hidden    = true;
    bar.querySelector('.tts-continuar').hidden = false;
    bar.querySelector('.tts-parar').hidden     = false;
  }

  function _tituloAudio(bar) {
    var h = bar.previousElementSibling;
    while (h && !/^H2$/i.test(h.tagName || '')) h = h.previousElementSibling;
    return h ? (h.innerText || h.textContent || 'Boletim Diario').trim() : 'Boletim Diario';
  }

  function _mediaSession(bar) {
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: _tituloAudio(bar),
      artist: 'Boletim Diario',
      album: 'Leitura dos sumarios',
    });
    navigator.mediaSession.setActionHandler('play', function () { player.play().catch(function () {}); });
    navigator.mediaSession.setActionHandler('pause', function () { player.pause(); });
    navigator.mediaSession.setActionHandler('stop', function () { player.pause(); player.currentTime = 0; });
  }

  window.ttsOuvir = function (btn) {
    var bar = btn.closest('.tts-bar');
    var src = bar && bar.dataset.audioSrc;
    if (!src) return;
    if (barAtual && barAtual !== bar) _resetBar(barAtual);
    barAtual = bar;
    if (player.src !== new URL(src, window.location.href).href) {
      player.src = src;
      player.currentTime = 0;
    } else {
      player.currentTime = 0;
    }
    _mediaSession(bar);
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _resetBar(bar);
    });
  };

  window.ttsPausar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    _setPausado(bar);
  };

  window.ttsContinuar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.play().then(function () {
      _setTocando(bar);
    }).catch(function () {
      _setPausado(bar);
    });
  };

  window.ttsPar = function (btn) {
    var bar = btn.closest('.tts-bar');
    player.pause();
    player.currentTime = 0;
    _resetBar(bar);
    if (barAtual === bar) barAtual = null;
  };

  player.addEventListener('ended', function () { _resetBar(barAtual); barAtual = null; });
  player.addEventListener('error', function () { _resetBar(barAtual); barAtual = null; });
  window.addEventListener('beforeunload', function () { player.pause(); });
})();
</script>
