<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boletim Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>

<style>
/* EB Garamond variable font local — GSUB liga/dlig/rlig/calt intactos em todos os pesos */
@font-face {
  font-family: 'EB Garamond'; font-style: normal; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-vf.woff2') format('woff2');
}
@font-face {
  font-family: 'EB Garamond'; font-style: italic; font-weight: 400 800; font-display: swap;
  src: url('fonts/ebgaramond-italic-vf.woff2') format('woff2');
}
</style>
<style>
  :root {
    /* paleta base: Navy · Teal · Sky · Beige · White, expandida para 8 tons */
    --bg:     #F5EFEB;  /* Beige — fundo principal (quente, claro)            */
    --panel:  #EAF1F6;  /* Azul pálido — áreas secundárias, badges            */
    --border: #C8D9E6;  /* Sky Blue — bordas e divisores                      */
    --texto:  #1A2A38;  /* Deep Navy — texto principal                        */
    --texto2: #567C8D;  /* Teal — texto secundário, metadados                 */
    --azul:   #2F4156;  /* Navy — cabeçalhos, header                          */
    --acento: #3D6070;  /* Steel Blue — estados ativos, destaques             */
    --tint:   #7EA8BC;  /* Sky médio — hover, números, acentos leves          */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--texto);
         font: 17px/1.75 'LINE Seed JP', 'Segoe UI', system-ui, sans-serif; }

  header { padding: 28px max(48px, calc((100% - 1100px) / 2 + 48px)) 22px;
           background: var(--azul); border-bottom: 3px solid var(--tint); }
  header h1 { font-family: 'New Title', Georgia, serif;
              font-size: clamp(83px, 17.5vw, 157px); font-weight: 500; line-height: 1;
              color: var(--panel); letter-spacing: clamp(0px, 0.2vw, 2px);
              margin-bottom: 6px; }
  .logo-o { font-family: 'Author', Georgia, serif; font-weight: 400; font-size: 1.365em;
            margin-left: -0.058em; letter-spacing: -0.049em; }
  header .sub { color: var(--border); font-size: 13px; }

  nav { display: flex; padding: 0 max(48px, calc((100% - 1100px) / 2 + 48px));
        background: var(--bg); border-bottom: 1px solid var(--border); }
  nav button { background: none; border: none; color: var(--texto2);
               padding: 14px 20px 13px; cursor: pointer;
               font: 14px 'LINE Seed JP', sans-serif;
               border-bottom: 2px solid transparent; }
  nav button.ativo { color: var(--azul); border-bottom-color: var(--acento); font-weight: 700; }
  nav button:hover { color: var(--azul); }

  main { padding: 52px 48px 100px; max-width: 1100px; margin: 0 auto; }

  /* Stats: números grandes sem caixas */
  .cards { display: flex; flex-wrap: wrap; gap: 48px;
           padding-bottom: 48px; margin-bottom: 8px;
           border-bottom: 1px solid var(--border); }
  .card { background: none; }
  .card .num { font-family: 'EB Garamond', Georgia, serif;
               font-size: 52px; font-weight: 700; color: var(--tint); line-height: 1; }
  .card .rot { color: var(--texto2); font-size: 13px; margin-top: 5px; }

  /* Títulos de seção: editorial, dobro do tamanho anterior */
  h2 { font-family: 'EB Garamond', Georgia, serif;
       font-size: 48px; font-style: normal; font-weight: 700;
       font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
       font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
       text-rendering: optimizeLegibility;
       color: var(--azul); line-height: 1.1;
       margin: 64px 0 28px; }

  /* Sumário narrativo: só texto, sem caixa */
  .sumario { line-height: 1.9; font-size: 17px; margin-bottom: 28px; }
  .sumario p { margin-bottom: 18px; }
  .sumario p:last-child { margin-bottom: 0; }
  .sem-sintese { color: var(--texto2); font-style: italic; }
  .evento { padding: 20px 0 8px; border-top: 1px solid var(--border); }
  .evento > h3 { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 28px; line-height: 1.25; color: var(--azul);
                 margin-bottom: 8px; }

  /* Drill-down: link de texto simples */
  .drill-toggle { background: none; border: none; color: var(--texto2);
                  padding: 10px 0; font: 13px 'LINE Seed JP', sans-serif;
                  cursor: pointer; display: block;
                  border-top: 1px solid var(--border); width: 100%; text-align: left; }
  .drill-toggle:hover { color: var(--acento); }
  .drill-lista { display: none; }
  .drill-lista.aberta { display: block; }

  /* Artigos individuais: separados por linha, sem caixa */
  .item { padding: 24px 0; border-bottom: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item h3 { font-family: 'EB Garamond', Georgia, serif;
             font-size: 30px; font-style: normal; font-weight: 700; line-height: 1.25;
             font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
             font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
             text-rendering: optimizeLegibility;
             margin-bottom: 8px; color: var(--azul); }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { color: var(--acento); }
  .item .meta { font-size: 12px; color: var(--texto2);
                display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  .tag { color: var(--texto2); font-size: 12px; }
  .tag + .tag::before { content: '·'; margin-right: 10px; }
  .idioma-badge { font: 700 10px/1 'LINE Seed JP', sans-serif; letter-spacing: .5px;
                  background: var(--panel); border: 1px solid var(--border);
                  color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                  vertical-align: middle; margin-left: 6px; }
  .corpo p { font-size: 15px; line-height: 1.75; color: var(--texto); }

  a { color: var(--texto2); text-decoration: none; }
  a:hover { color: var(--azul); }
  .vazio { color: var(--texto2); font-style: italic; }

  /* Filtros: pills minimalistas sem fundo */
  .filtros-secao { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 36px; }
  .filtros-secao button { background: none; border: 1px solid var(--border);
                          color: var(--texto2); border-radius: 20px;
                          padding: 5px 18px; font: 13px 'LINE Seed JP', sans-serif;
                          cursor: pointer; }
  .filtros-secao button.ativo { border-color: var(--azul); color: var(--azul); font-weight: 700; }
  .filtros-secao button:hover:not(.ativo) { border-color: var(--texto2); color: var(--azul); }

  .noticia { padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
  .noticia > a { font-family: 'EB Garamond', Georgia, serif;
                 font-size: 20px; font-weight: 700; color: var(--azul); line-height: 1.35;
                 font-variant-ligatures: common-ligatures discretionary-ligatures contextual;
                 font-feature-settings: "liga" 1, "dlig" 1, "calt" 1;
                 text-rendering: optimizeLegibility; }
  .noticia > a:hover { color: var(--acento); }
  .noticia .fonte { color: var(--texto2); font-size: 12px; margin-top: 5px; }

  @media (max-width: 700px) {
    header { padding: 20px 20px 16px; }
    header h1 { font-size: clamp(100px, 21vw, 120px); }
    nav { padding: 0 20px; }
    main { padding: 28px 20px 60px; }
    h2 { font-size: 34px; margin: 40px 0 16px; }
    .cards { gap: 28px; padding-bottom: 28px; margin-bottom: 4px; }
    .card .num { font-size: 38px; }
    .item h3 { font-size: 22px; }
    .modal-overlay { align-items: flex-end; }
    .modal-box { width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px;
                 max-height: 85vh; }
  }

  /* Seção Destaque */
  .destaque-label { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                    letter-spacing: 2px; text-transform: uppercase;
                    background: var(--azul); color: var(--panel);
                    padding: 4px 12px; border-radius: 2px; margin-bottom: 18px; }
  .destaque-analise { line-height: 1.9; font-size: 17px; margin-bottom: 32px; }
  .destaque-analise p { margin-bottom: 18px; }
  .destaque-analise p:last-child { margin-bottom: 0; }
  .destaque-fontes { border-top: 2px solid var(--azul); padding-top: 24px; margin-top: 8px; }
  .destaque-fontes h3 { font-family: 'EB Garamond', Georgia, serif; font-size: 20px;
                        color: var(--texto2); margin-bottom: 16px; font-weight: 400; }
  .destaque-art { padding: 16px 0; border-bottom: 1px solid var(--border); }
  .destaque-art:last-child { border-bottom: none; }
  .destaque-art h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 24px;
                     font-weight: 700; line-height: 1.25; margin-bottom: 6px; color: var(--azul); }
  .destaque-art h4 a { color: inherit; text-decoration: none; }
  .destaque-art h4 a:hover { color: var(--acento); }
  .destaque-art .dmeta { font-size: 12px; color: var(--texto2);
                         display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  .destaque-art .dcorpo { font-size: 15px; line-height: 1.75; color: var(--texto); }

  /* Sistema de flags */
  .flag-btn { background: none; border: none; cursor: pointer; padding: 6px 0 0;
              font-size: 13px; color: var(--border); display: block; line-height: 1;
              margin-top: 4px; text-align: left; }
  .flag-btn:hover { color: #b03a2e; }
  .flag-btn.flag-ativo { color: #b03a2e; }
  .editorial-btn { margin-left: auto; font-size: 17px; color: var(--texto2);
                   background: none; border: none; cursor: pointer; padding: 14px 16px 13px; }
  .editorial-btn:hover { color: var(--azul); }
  .editorial-btn.ativo { color: #b03a2e; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,42,56,.52);
                   z-index: 999; align-items: center; justify-content: center; }
  .modal-overlay.aberta { display: flex; }
  .modal-box { background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
               padding: 28px 32px; max-width: 480px; width: 90%;
               max-height: 90vh; overflow-y: auto;
               box-shadow: 0 8px 32px rgba(0,0,0,.18); }
  .modal-box h4 { font-family: 'EB Garamond', Georgia, serif; font-size: 22px;
                  color: var(--azul); margin-bottom: 18px; line-height: 1.2; }
  .modal-box label { display: block; font-size: 11px; color: var(--texto2); margin-bottom: 4px;
                     text-transform: uppercase; letter-spacing: .5px; }
  .modal-box select, .modal-box textarea, .modal-box input[type=password] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 4px;
    background: #fff; color: var(--texto); font: 14px 'LINE Seed JP', sans-serif;
    margin-bottom: 14px; outline: none; }
  .modal-box select:focus, .modal-box textarea:focus, .modal-box input:focus { border-color: var(--acento); }
  .modal-box textarea { resize: vertical; min-height: 68px; }
  .modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .modal-btns button { padding: 7px 18px; border-radius: 4px;
                       font: 13px 'LINE Seed JP', sans-serif; cursor: pointer; }
  .btn-pri { background: var(--azul); color: var(--panel); border: none; }
  .btn-pri:hover { background: var(--acento); }
  .btn-sec2 { background: none; border: 1px solid var(--border); color: var(--texto2); }
  .btn-sec2:hover { border-color: var(--texto2); color: var(--azul); }
  .btn-peri { background: none; border: 1px solid #b03a2e; color: #b03a2e; }
  .btn-peri:hover { background: #b03a2e; color: #fff; }
  .modal-erro { color: #b03a2e; font-size: 13px; margin: -8px 0 12px; }
  .flag-rep-box { max-height: 65vh; overflow-y: auto; }
  .flag-rep-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .flag-rep-item:last-child { border-bottom: none; }
  .flag-tipo-tag { display: inline-block; font: 700 11px 'LINE Seed JP', sans-serif;
                   background: var(--panel); border: 1px solid var(--border);
                   color: var(--texto2); border-radius: 3px; padding: 1px 5px;
                   margin-right: 6px; vertical-align: middle; }
  /* TTS — leitura em voz alta dos sumários */
  .tts-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .tts-btn { background: var(--azul); border: 1px solid var(--azul); border-radius: 4px;
             color: var(--panel); font: 13px 'LINE Seed JP', sans-serif;
             padding: 4px 12px; cursor: pointer; }
  .tts-btn:hover { background: var(--acento); border-color: var(--acento); color: #fff; }
  .tts-bar[hidden] { display: none; }
  /* Jornal do dia — area "Ouca Agora" (fundo escuro, compacta) */
  .podcast-card { background: var(--azul); border-radius: 8px;
                  padding: 12px 16px 14px; margin-bottom: 24px; }
  .podcast-hd { font-weight: 700; font-size: 14px; letter-spacing: .03em;
                text-transform: uppercase; color: #fff; margin-bottom: 8px; }
  /* Player custom (o <audio> nativo nao aceita cor; este mescla com o fundo escuro) */
  .pod-player { display: flex; align-items: center; gap: 12px; }
  .pod-audio { display: none; }
  .pod-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none;
             background: rgba(255,255,255,.14); color: #fff; font-size: 13px; line-height: 1;
             cursor: pointer; transition: background .15s; }
  .pod-btn:hover { background: rgba(255,255,255,.28); }
  .pod-cur, .pod-dur { font-size: 12px; color: rgba(255,255,255,.65);
                       font-variant-numeric: tabular-nums; min-width: 34px; }
  .pod-dur { text-align: right; }
  .pod-track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18);
               cursor: pointer; overflow: hidden; }
  .pod-fill { height: 100%; width: 0; background: var(--tint); border-radius: 3px; }
  /* Com podcast, o card ja separa visualmente: dispensa a linha abaixo dos numeros */
  .cards.com-podcast { border-bottom: none; padding-bottom: 0; margin-bottom: 20px; }
</style>
</head>

</div>

const D = {"gerado_em": "26/07/2026 16:25", "stats": {"noticias_novas": 164, "resumos_gerados": 109}, "rotulos_topico": {"politica_nacional": "Brasil", "mundo": "Mundo", "economia": "Economia", "tecnologia": "Tecnologia", "ciencia": "Ciência", "cultura": "Cultura", "sociedade": "Sociedade", "meio_ambiente": "Meio Ambiente", "direitos_humanos": "Direitos Humanos"}, "topicos": ["politica_nacional", "mundo", "economia", "tecnologia", "ciencia", "cultura", "sociedade", "meio_ambiente", "direitos_humanos"], "grupo_de_topico": {"politica_nacional": "politica_nacional", "politica_internacional": "mundo", "geopolitica": "mundo", "economia": "economia", "tecnologia": "tecnologia", "ciencia": "ciencia", "cultura": "cultura", "sociedade": "sociedade", "meio_ambiente": "meio_ambiente", "direitos_humanos": "direitos_humanos"}, "sinteses": {"politica_nacional": "O Podemos pode manter-se neutro nas eleições presidenciais devido à falta de alinhamento entre as candidaturas propostas e o partido. Isso ocorre principalmente devido à independência pretendida pela pré-candidata Renata Abreu. Em outro desenvolvimento, Ronaldo Caiado, governador do União Brasil, lançou sua candidatura à Presidência do Brasil com o apoio de João Paulo Kassab, visando desviar a rejeição que Lula e Flávio Bolsonaro enfrentam. As campanhas curtas para as eleições presidenciais de 2026 foram iniciadas neste final de semana, com propaganda no rádio e na televisão permitida apenas após o dia 28 de agosto. Além disso, o estado do Rio Grande do Sul enfrenta 754 desalojados e 488 desabrigados devido às chuvas, sob risco de novas cheias.", "mundo": "Israel permitirá a entrada de uma força internacional de segurança em Gaza, conforme parte do plano de cessar-fogo proposto por Donald Trump. A decisão visa apoiar o processo de normalização e estabilidade na região após intensas negociações. Paralelamente, um ataque terrorista ocorreu durante o desfile anual do Orgulho LGBT em Berlim, resultando em uma morte e 29 feridos. As autoridades alemãs realizaram uma operação de busca que culminou com a morte do suspeito. Além disso, Tadej Pogačar da Eslovênia venceu a 109ª edição do Tour de France, conquistando sua quinta vitória na corrida ciclística mais prestigiada do mundo. A reorganização do gabinete alemão e as tensões entre Lula e Milei também foram notícias relevantes desta semana, com o Itamaraty chamando embaixadores para consultas devido a críticas recíprocas entre os líderes dos países vizinhos.\n\nO conflito na Ucrânia continua com ataques de mísseis e mortes civis, levando Kiev a denunciar os ataques russos. O presidente do Cazaquistão, Kassym-Jomart Tokayev, pediu à Rússia que freasse o conflito e retomasse as negociações. Em outro front geopolítico, Israel estabeleceu três novos postos na Cisjordânia Ocidental, aumentando a tensão com os palestinos. Na Europa, um ataque terrorista em Berlim resultou na morte de 30 pessoas durante o festival da orgulho gay. A Romênia convocou seu embaixador russo após interceptar drones infratores do seu espaço aéreo pela terceira vez, levantando preocupações sobre os possíveis impactos na NATO. O Irã suspendeu seus ataques após os Estados Unidos terem parado de atacar desde o final da sexta-feira, sem explicações, enquanto negocia com Omã novas regras para o Estreito de Ormuz.", "economia": "A Qualcomm planeja aumentar os preços de seus produtos em duas dígitos, seguindo uma tendência de ajustes de preços no setor tecnológico. O mercado brasileiro de ETFs triplicou recentemente, acompanhando o boom de novos fundos na América Latina e a migração de investidores para produtos mais adaptados à demanda local. A Caixa distribui lucros do FGTS, permitindo que os trabalhadores recebam parte dos lucros gerados pelo Fundo de Garantia por Tempo de Serviço. O Banco de Brasília (BRB) herda um empréstimo concedido pelo Banco Master para a empresa 3D Minerals, que explorará minerais críticos no Brasil. A Azimut Yachts, uma empresa italiana especializada em iates de luxo, registrou as primeiras vendas do seu modelo Grande 30 Metri no Brasil, com preços a partir de R$ 90 milhões e entrega prevista para o fim de 2028. O setor industrial da bolsa de valores nos Estados Unidos está beneficiando-se do boom na infraestrutura de IA, com uma razão P/E próxima dos níveis tecnológicos. A indústria brasileira caiu para a 69ª posição entre 90 países no ranking industrial, segundo dados do IEDI, refletindo o impacto do juro alto e da produtividade na economia nacional.", "tecnologia": "O uso de robôs para combater a falta de mão-de-obra está se tornando uma tendência crescente, conforme relatado pela Taipei Times. Paralelamente, o Ministério do Interior dos Estados Unidos está implementando novas diretrizes que devem promover o desenvolvimento da energia solar em telhados de edifícios, segundo informações do Taipei Times. No cenário internacional, Sam Altman, CEO da OpenAI, viajará para Washington nesta semana para apresentar a empresa e seu mais avançado modelo de inteligência artificial ao governo americano, conforme relato do Axios. Na Amazon, diversos produtos tecnológicos estão em promoção, incluindo roteadores Wi-Fi Mesh, tablets iPad com chip A16, caixas de som Bluetooth e fones de ouvido sem fio. Essa variedade oferece opções para diferentes usos e estilos. Além disso, a crise no fornecimento de hardware tem levado à discussão sobre o custo-benefício entre montar um PC peça por peça ou adquirir uma configuração pré-montada, com variações significativas nos preços dos componentes como memória RAM e SSDs, conforme relato do Canaltech.", "ciencia": "A ciência avançou significativamente nos últimos tempos com diversos estudos e descobertas. Um destaque é um estudo do CNRS francês, que mostrou que a glucosa desempenha um papel crucial na fixação de memórias a longo prazo. Já pesquisadores da China confirmaram o impacto positivo do café na saúde humana. Outra pesquisa notável revelou uma atmosfera em um exoplaneta rochoso na zona habitável de uma estrela anã vermelha, avançando a busca por vida fora do Sistema Solar. Além disso, os astronautas Chris Williams e colegas da NASA retornaram à Terra após oito meses na Estação Espacial Internacional, concluindo uma missão científica. Outros trabalhos abordam questões como as moléculas keystone que moldam comunidades biológicas, a relação entre fumaça de incêndios florestais e saúde humana, e o potencial do CRISPR para tratar câncer de próstata com imunoterapia.", "cultura": "O atleta Chou Tien-chen conquistou a medalha de ouro no China Open aos 36 anos, destacando-se na competição. O filme 'Toy Story 5', da Pixar, arrecadou mais de US$ 1 bilhão mundialmente e se tornou o filme com maior bilheteria do ano. A Princesa Anne, irmã do rei Charles III, teve um encontro inusitado com um robô humanoide em Seul, na Coreia do Sul, gerando interesse cultural sobre a interação entre humanos e tecnologia avançada. Além disso, o Monte Olimpo foi incluído na lista do Patrimônio Mundial da Unesco após uma espera de 12 anos, celebrado com grande entusiasmo na Grécia. A Xuxa Meneghel, aos 63 anos, está lançando uma turnê nostálgica para se despedir da TV, um símbolo de sua carreira, inspirada pela energia de Madonna, e o Cença Pizza Bar, projetado pelo IN arq+design, transformou um edifício histórico no centro de Curitiba em um ambiente vibrante e acolhedor.", "sociedade": "Um suspeito atropelou participantes da Parada do Orgulho LGBTQ+ em Berlim, na Alemanha, resultando em uma morte e 29 feridos. A governadora Kathy Hochul de Nova York anunciou que o estado serviu 396 milhões de refeições escolares gratuitas, economizando famílias cerca de 450 milhões de dólares por mês. Um desabamento em obra no Morumbi foi registrado como homicídio culposo e lesão corporal culposa, com a investigação em andamento para esclarecer as circunstâncias do acidente que resultou na morte de um trabalhador. O presidente do Partido Comunista acusa o governo de não ter respondido adequadamente à passagem do sistema frontal e critica o projeto de Reconstrução Nacional, considerando-o uma 'outra catástrofe' política.", "meio_ambiente": "Incêndios florestais na Espanha e França continuam a se alastrar, obrigando 325 mil pessoas a deixarem suas casas. Na França, uma 'tempestade de fogo' perto de Bordeaux já fez mais de 360 mil pessoas serem evacuadas. Em Espanha, as chamas já consumiram quase 77 mil hectares e obrigaram milhares de pessoas a abandonar suas residências. As autoridades locais estão trabalhando para controlar os focos de fogo, que são intensificados por ondas sucessivas de calor e seca no solo.", "direitos_humanos": "Um ataque ocorrido durante a Berlin Pride resultou em uma morte e feridos, levantando preocupações sobre possíveis motivações de terrorismo islâmico. A polícia alemã intensificou as buscas por suspeitos. No Chile, o ministro secretário geral da Presidência, José García Ruminot, anunciou disposição para dialogar sobre o projeto 'Escuta seu coração', mas reconheceu a complexidade desse aspecto para as vítimas de violência sexual. Além disso, uma tragédia em Minab, Irã, onde 120 crianças foram mortas por um ataque, continua sendo investigada e abalou a comunidade local. O tema da responsabilidade penal para adolescentes também foi debatido, destacando o problema que não é suficientemente examinado. Por fim, Donald Trump criticou LeBron James, acusando-o de possivelmente ser racista, em uma intervenção polêmica na esfera pública."}, "resumo_do_dia": {"politica_nacional": [{"id": 74059, "titulo": "Alvo de ofensiva de pré-candidatos, Podemos deve ficar neutro na corrida presidencial", "url": "https://veja.abril.com.br/politica/alvo-de-ofensiva-de-pre-candidatos-podemos-deve-ficar-neutro-na-corrida-presidencial/", "fonte_id": "veja", "data_pub": "2026-07-26T18:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Podemos pode se manter neutro nas eleições presidenciais devido à falta de alinhamento entre as candidaturas propostas e o partido. Isso ocorre principalmente por conta da independência pretendida pela pré-candidata Renata Abreu.", "titulo_pt": "Podemos deve ficar neutro na corrida presidencial", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 74053, "titulo": "Lindbergh, do PT, aciona PGR contra Flavio Bolsonaro por uso de IA e Milei em convenção do PL", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/blogs/brasilia-hoje/2026/07/lindbergh-do-pt-aciona-pgr-contra-flavio-bolsonaro-por-uso-de-ia-e-milei-em-convencao-do-pl.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-26T18:51:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O deputado Lindbergh Farias (PT-RJ) denunciou a PGR contra Flávio Bolsonaro (PL) por uso indevido de deepfake na convenção do PL. Lindbergh acusa o pré-candidato à Presidência de usar uma imagem gerada por inteligência artificial do ex-presidente Jair Bolsonaro sem autorização.", "titulo_pt": "Lindbergh, do PT, denuncia PGR contra flávio Bolsonaro por uso de deepfake em convenção", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 74067, "titulo": "Ex-presidente do STF Octavio Gallotti morre aos 95 anos", "url": "https://www.metropoles.com/colunas/manoela-alcantara/octavio-galloti-stf-presidente", "fonte_id": "metropoles", "data_pub": "2026-07-26T18:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Octavio Gallotti, ex-presidente do Supremo Tribunal Federal (STF), faleceu aos 95 anos. Ministro da Corte entre 1984 e 2000, ele presidiu o STF de 1993 a 1995.", "titulo_pt": "Ex-presidente do STF Octavio Gallotti morre aos 95 anos", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 74068, "titulo": "Presidente do PDT diz que partido tem \"grata satisfação\" por deixar base de Simões", "url": "https://www.metropoles.com/minas-gerais/presidente-do-pdt-diz-que-partido-tem-grata-satisfacao-por-deixar-base-de-simoes", "fonte_id": "metropoles", "data_pub": "2026-07-26T18:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O presidente do PDT mineiro declarou que o partido tem 'grata satisfação' com a saída de Carlos Henrique da base governista. Além disso, foi informado que Thiago Cota não buscará a reeleição.", "titulo_pt": "Presidente do PDT diz que partido está 'satisfeito' com saída de Simões e que cota não se candidatará novamente", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 74061, "titulo": "Chuvas no RS: desabrigados caem para 488 sob risco de novas cheias", "url": "https://www.poder360.com.br/poder-brasil/chuvas-no-rs-desabrigados-caem-para-488-sob-risco-de-novas-cheias/", "fonte_id": "poder360", "data_pub": "2026-07-26T18:42:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O estado do Rio Grande do Sul registra 754 desalojados e 488 desabrigados devido às chuvas. A Defesa Civil estadual relatou danos em saúde, transporte e educação.", "titulo_pt": "Chuvas no RS: 488 desabrigados sob risco de novas cheias", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 74054, "titulo": "Campanhas curtas protegem quem já tem mandato", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/lara-mesquita/2026/07/campanhas-curtas-protegem-quem-ja-tem-mandato.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-26T18:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Neste final de semana ocorreram as primeiras convenções partidárias para o ciclo eleitoral de 2026. A campanha oficial só começará em 16 de agosto, com propaganda no rádio e na televisão a partir de 28 de agosto.", "titulo_pt": "Campanhas curtas protegem quem já tem mandato", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 74062, "titulo": "Caiado promete confiscar patrimônio de agressor e transferir à mulher", "url": "https://www.poder360.com.br/poder-eleicoes-2026/caiado-promete-confiscar-patrimonio-de-agressor-e-transferir-a-mulher/", "fonte_id": "poder360", "data_pub": "2026-07-26T18:31:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O candidato do PSD promete endurecer as medidas contra crimes de violência doméstica, incluindo o confisco do patrimônio do agressor e sua transferência para a vítima.", "titulo_pt": "Caiado promete confiscar patrimônio de agressor e transferir à mulher", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 74060, "titulo": "Milei detalha projeto de reforma do BC, fundamental para a disciplina monetária", "url": "https://veja.abril.com.br/economia/milei-detalha-projeto-de-reforma-do-bc-fundamental-para-a-disciplina-monetaria/", "fonte_id": "veja", "data_pub": "2026-07-26T18:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Milei detalha um projeto de reforma do Banco Central que visa priorizar o controle da inflação. A proposta inclui uma referência à estratégia do presidente argentino de enfocar a estabilização da taxa de inflação como principal objetivo do banco central.", "titulo_pt": "Milei explica plano de reforma do BC com foco no controle da inflação", "veiculo": "Veja", "pais": "Brasil", "classe": "B"}, {"id": 74055, "titulo": "Ministério da Saúde lança campanha alertando para danos causados pelas bets", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/ministerio-da-saude-lanca-campanha-alertando-para-danos-causados-pelas-bets.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-26T18:23:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério da Saúde lançou uma campanha nacional de prevenção aos danos causados pelas bets. A campanha foi lançada no domingo, 26 de julho de 2026.", "titulo_pt": "Ministério da Saúde lança campanha de prevenção aos danos das bets", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 74087, "titulo": "“OnlyMarms”: marmotas estão no OnlyFans para arrecadar fundos para pesquisa", "url": "https://www.infomoney.com.br/business/global/onlymarms-marmotas-estao-no-onlyfans-para-arrecadar-fundos-para-pesquisa/", "fonte_id": "infomoney", "data_pub": "2026-07-26T18:22:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Uma equipe de cientistas da UCLA enviou vídeos de marmotas na natureza para o OnlyFans com o objetivo de arrecadar fundos para pesquisa, devido aos cortes de orçamento do governo Trump.", "titulo_pt": "Sómarmotas: marmotas estão no OnlyFans para arrecadar fundos para pesquisa", "veiculo": "InfoMoney", "pais": "Brasil", "classe": "B"}, {"id": 74056, "titulo": "Unidade Popular formaliza candidatura de Samara Martins a presidente", "url": "https://agenciabrasil.ebc.com.br/politica/noticia/2026-07/unidade-popular-formaliza-candidatura-de-samara-martins-presidente", "fonte_id": "agencia_brasil_politica", "data_pub": "2026-07-26T18:17:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O partido Unidade Popular formalizou a candidatura de Samara Martins à presidência da República, com Raquel Bricio como vice. A convenção foi realizada na Universidade Zumbi dos Palmares em São Paulo.", "titulo_pt": "Unidade Popular formaliza candidatura de Samara Martins a presidente", "veiculo": "Agência Brasil - Política", "pais": "Brasil", "classe": "A"}, {"id": 73578, "titulo": "A nova armadilha institucional", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/marcus-melo/2026/07/a-nova-armadilha-institucional.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-26T18:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A eleição presidencial atual é singular, com o presidente da República, de 80 anos, buscando a reeleição após liderar um partido por quase meio século. Esta dependência em relação a uma única liderança é excepcional nas democracias atuais.", "titulo_pt": "Nova armadilha institucional", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 73579, "titulo": "PDT se diz humilhado após ser preterido em suplências ao Senado de SP e ameaça lançar candidatos", "url": "https://redir.folha.com.br/redir/online/poder/rss091/*https://www1.folha.uol.com.br/colunas/painel/2026/07/pdt-se-diz-humilhado-apos-ser-preterido-em-suplencias-ao-senado-de-sp-e-ameaca-lancar-candidatos.shtml", "fonte_id": "folha_poder", "data_pub": "2026-07-26T17:52:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O PDT se sente humilhado após ser preterido nas suplências ao Senado de São Paulo pela coligação do PT comandada por Fernando Haddad. O partido ameaça lançar seus próprios candidatos em resposta a essa situação.", "titulo_pt": "PDT se diz humilhado e ameaça lançar candidatos após ser preterido em suplências ao Senado de SP", "veiculo": "Folha de S.Paulo - Poder", "pais": "Brasil", "classe": "A"}, {"id": 73593, "titulo": "PSD lança Caiado à Presidência e mira rejeição de Lula e Flávio", "url": "https://www.poder360.com.br/poder-eleicoes-2026/psd-lanca-caiado-a-presidencia-e-mira-rejeicao-de-lula-e-flavio/", "fonte_id": "poder360", "data_pub": "2026-07-26T17:48:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O ex-governador de Goiás, Ronaldo Caiado, lançou sua candidatura à Presidência do Brasil com o apoio de João Paulo Kassab. A campanha almeja desviar a rejeição que o presidente Luiz Inácio Lula da Silva e seu vice Flávio Dino enfrentam.", "titulo_pt": "PSD lança Caiado à Presidência visando rejeição de Lula e Flávio", "veiculo": "Poder360", "pais": "Brasil", "classe": "B"}, {"id": 73594, "titulo": "Assista a íntegra do 1º discurso de Caiado à imprensa como candidato", "url": "https://www.poder360.com.br/poder-eleicoes-2026/assista-a-integra-do-1o-discurso-de-caiado-a-imprensa-como-candidato/", "fonte_id": "poder360", "data_pub": "2026-07-26T17:44:00Z", "idioma": "pt", "provav Ucraina finirà con la nostra vittoria'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/26/putin-loperazione-militare-in-ucraina-finira-con-la-nostra-vittoria_a94776b2-c4a5-4380-b402-b09c6f5bf599.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-26T18:21:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "A operação militar da Rússia na Ucrânia terminará com a vitória russa, segundo Putin. A invasão do governo de Kiev aos civis está ligada à adesão à ideologia neonazista.", "titulo_pt": "Putin: 'operação militar na Ucrânia terminará com nossa vitória'", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 74175, "titulo": "Romania summons Russian envoy as it shoots down third intruding drone", "url": "https://www.aljazeera.com/news/2026/7/26/romania-summons-russian-envoy-as-it-shoots-down-third-intruding-drone?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-26T18:17:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A Romênia convocou o enviado russo após interceptar um drone infrator de seu espaço aéreo pela terceira vez. As violações contínuas do espaço aéreo romeno levantam preocupações sobre os possíveis impactos na NATO devido à guerra entre Rússia e Ucrânia.", "titulo_pt": "Romênia convoca embaixador russo após interceptar terceiro drone invasor", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 74169, "titulo": "Tadej Pogačar of Slovenia wins the 2026 Tour de France, his fifth victory in the race", "url": "https://www.npr.org/2026/07/26/nx-s1-5908503/tadej-pogacar-tour-de-france-2026-winner-wildfires", "fonte_id": "npr_news", "data_pub": "2026-07-26T18:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Tadej Pogačar, da Eslovênia, venceu a 109ª edição do Tour de France. O percurso do último dia foi reduzido devido à reatribuição de segurança e policiais para auxiliar nas incêndios florestais na França ocidental.", "titulo_pt": "Tadej Pogačar da eslovênia vence o Tour de France de 2026, sua quinta vitória no evento", "veiculo": "NPR News", "pais": "EUA", "classe": "A"}, {"id": 74174, "titulo": "Germany's Transport Minister Schnieder to asks Merz to remove him", "url": "https://www.dw.com/en/germany-s-transport-minister-schnieder-to-asks-merz-to-remove-him/a-78121920?maca=en-rss-en-all-1573-rdf", "fonte_id": "dw_english", "data_pub": "2026-07-26T18:13:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O ministro dos Transportes da Alemanha, Schnieder, planeja pedir ao chefe do governo, Christian Lindner (Chancellor Merz), que o remova de seu cargo após considerar as circunstâncias da reorganização do gabinete como 'indignas'.", "titulo_pt": "Ministro dos transportes alemão quer ser demitido", "veiculo": "Deutsche Welle English", "pais": "Alemanha", "classe": "A"}, {"id": 74180, "titulo": "Qatari PM, UAE national security adviser discuss peace efforts", "url": "https://www.middleeasteye.net/live-blog/live-blog-update/qatari-pm-uae-national-security-adviser-discuss-peace-efforts", "fonte_id": "middle_east_eye", "data_pub": "2026-07-26T18:11:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O Prime minister da Qatar e o conselheiro de segurança nacional dos Emirados Árabes Unidos discutiram por telefone sobre esforços de paz e relações bilaterais. Eles revisaram esforços diplomáticos para aliviar tensões regionais, com o Qatar enfatizando a importância do diálogo, da implementação do memorando de entendimento entre Estados Unidos e Irã, da garantia da navegação livre no Estreito de Ormuz e dos esforços para alcançar paz e estabilidade duradoura na região.", "titulo_pt": "PM qatarí e conselheiro de segurança nacional dos eau discutem esforços de paz", "veiculo": "Middle East Eye", "pais": "Reino Unido", "classe": "B"}, {"id": 74057, "titulo": "Após ofensas de Milei a Lula, Itamaraty chama embaixador para consulta", "url": "https://agenciabrasil.ebc.com.br/internacional/noticia/2026-07/apos-ofensas-de-milei-lula-itamaraty-chama-embaixador-para-consulta", "fonte_id": "agencia_brasil_intl", "data_pub": "2026-07-26T18:11:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O Ministério das Relações Exteriores do Brasil chamou o embaixador Julio Bitelli para consultas após críticas feitas pelo presidente argentino Javier Milei ao presidente Luiz Inácio Lula da Silva. Milei participou de um evento político no Brasil.", "titulo_pt": "Itamaraty chama embaixador após ofensas de Milei a Lula", "veiculo": "Agência Brasil - Internacional", "pais": "Brasil", "classe": "A"}, {"id": 74176, "titulo": "Al-Sharaa praises Trump’s decision to remove Syria from terrorism list", "url": "https://www.aljazeera.com/video/newsfeed/2026/7/26/al-sharaa-praises-trumps-decision-to-remove-syria-from-terrorism-list?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-26T18:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O representante sírio Al-Sharaa elogiou a decisão do presidente americano Trump de retirar a Síria da lista de países patrocinadores de terrorismo.", "titulo_pt": "Al-sharaa elogia decisão de Trump sobre síria", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 74195, "titulo": "Axios, 'per capo Centcom i raid a Hormuz hanno raggiunto limiti d'efficacia'", "url": "https://www.ansa.it/sito/notizie/topnews/2026/07/26/axios-per-capo-centcom-i-raid-a-hormuz-hanno-raggiunto-limiti-defficacia_a18e90d4-b76f-46c5-812b-7bd8ea414fe0.html", "fonte_id": "ansa_italy", "data_pub": "2026-07-26T18:08:00Z", "idioma": "it", "provavel_duplicata_de": null, "texto_pt": "O almirante Cooper influenciou a decisão de Trump de parar os ataques. Os raides na Hormuz atingiram limites de eficácia.", "titulo_pt": "Axios: almirante cooper influenciou decisão de trump sobre ataques em Hormuz", "veiculo": "ANSA (Itália)", "pais": "Itália", "classe": "A"}, {"id": 73958, "titulo": "Polizia Berlino, Ballout ha aggredi ir brain is working exactly as designed", "url": "https://phys.org/news/2026-07-teenager-stupid-choice-brain.html", "fonte_id": "phys_org", "data_pub": "2026-07-26T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Quando um adolescente reage a uma ofensa, correndo o risco de ser punido, isso é frequentemente atribuído à incompletude do desenvolvimento cerebral. No entanto, quando um adulto se posiciona contra uma injustiça, chamamos isso de princípios. Acreditamos que os adolescentes não conseguem avaliar as consequências da mesma forma que os adultos.", "titulo_pt": "Quando um adolescente faz a 'opcão estúpida', seu cérebro está funcionando exatamente como foi projetado", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 74017, "titulo": "Gamma-ray pulsations reveal extreme 3.2-millisecond pulsar 3,900 light-years away", "url": "https://phys.org/news/2026-07-gamma-ray-pulsations-reveal-extreme.html", "fonte_id": "phys_org", "data_pub": "2026-07-26T18:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Astrônomos chineses analisaram dados da telescopeira gamma-ray Fermi da NASA e descobriram que o pulsar de milissegundo conhecido como PSR J0435+3233 emite pulsos de gama. A descoberta foi publicada em um artigo no servidor pré-impresso arXiv em 17 de julho.", "titulo_pt": "Pulsos de gama revelam pulsar extremo de 3,2 milissegundos a 3,900 luzes anos de distância", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 74100, "titulo": "Fue confirmado por la ciencia: el azúcar es clave para fijar recuerdos en nuestra memoria", "url": "https://www.clarin.com/estados-unidos/confirmado-ciencia-azucar-clave-fijar-recuerdos-memoria_0_9Gb8xBharO.html", "fonte_id": "clarin", "data_pub": "2026-07-26T17:41:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Um estudo do CNRS francês demonstrou que a glucosa desempenha um papel crucial na fixação de memórias a longo prazo. O cérebro ativa circuitos relacionad rovides work and refrigeration", "url": "https://phys.org/news/2026-07-quantum-simultaneously-refrigeration.html", "fonte_id": "phys_org", "data_pub": "2026-07-26T16:20:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um motor quântico de calor opera simultaneamente como um motor que produz trabalho e como um refrigerador. As leis da termodinâmica estabelecem que o calor naturalmente flui de sistemas mais quentes para sistemas mais frios até atingir um estado de equilíbrio térmico.", "titulo_pt": "Um motor quântico de calor que fornece trabalho e refrigeração ao mesmo tempo", "veiculo": "Phys.org", "pais": "EUA", "classe": "B"}, {"id": 73720, "titulo": "Astronautas dos EUA e Rússia retornam da Estação Espacial Internacional após oito meses no espaço", "url": "https://olhardigital.com.br/2026/07/26/ciencia-e-espaco/astronautas-dos-eua-e-russia-retornam-da-estacao-espacial-internacional-apos-oito-meses-no-espaco/", "fonte_id": "olhar_digital", "data_pub": "2026-07-26T15:44:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Três astronautas, entre eles americanos e russos, retornaram à Terra com segurança após passarem oito meses na Estação Espacial Internacional a bordo da nave Soyuz MS-28.", "titulo_pt": "Astronautas dos EUA e Rússia retornam da Estação Espacial Internacional após oito meses no espaço", "veiculo": "Olhar Digital", "pais": "Brasil", "classe": "C"}, {"id": 73584, "titulo": "Humanos pavimentam caminho para própria extinção, diz paleontólogo", "url": "https://redir.folha.com.br/redir/online/ciencia/rss091/*https://www1.folha.uol.com.br/ciencia/2026/07/humanos-pavimentam-caminho-para-propria-extincao-diz-paleontologo.shtml", "fonte_id": "folha_ciencia", "data_pub": "2026-07-26T15:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O paleontólogo Michael J. Benton afirma que os humanos modernos estão pavimentando o próprio caminho para a extinção, diferentemente de outras espécies que habitaram a Terra ao lo url": "https://www.theguardian.com/world/2026/jul/26/greece-mount-olympus-unesco-world-heritage-site", "fonte_id": "guardian_world", "data_pub": "2026-07-26T15:39:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mount Olympus, considerado o lar mitológico dos deuses gregos antigos, foi incluído na lista do Patrimônio Mundial da Unesco após uma espera de 12 anos. O monte foi adicionado à lista ao lado de outros locais famosos como as praias de Normandia usadas para os desembarques D-Day e as antigas capitais japonesas de Asuka e Fujiwara.", "titulo_pt": "Alegria na Grécia: monte olimpo é incluído na lista do patrimônio mundial da Unesco", "veiculo": "The Guardian World", "pais": "Reino Unido", "classe": "A"}, {"id": 74030, "titulo": "Matt Damon’s 4′ 5″ Stunt Double Says She’s Prepared Her Entire Career for Role in The Odyssey", "url": "https://consequence.net/2026/07/matt-damon-odyssey-stunt-double/", "fonte_id": "consequence_sound", "data_pub": "2026-07-26T15:36:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Devyn Dalton, uma stunt double de 1,35 metro de altura, interpreta a luta contra os Laestrygonian gigantes na produção de 'The Odyssey', substituindo Matt Damon nas cenas perigosas. Dalton afirmou estar preparada para esse papel durante toda a sua carreira.", "titulo_pt": "A Stunt Double de 1,35m de altura que substitui matt Damon em 'The Odyssey'", "veiculo": "Consequence of Sound", "pais": "EUA", "classe": "C"}, {"id": 73973, "titulo": "Thailand monastery added to Unesco heritage list, boosting tourism hopes", "url": "https://www.scmp.com/news/asia/southeast-asia/article/3361913/thailand-monastery-added-unesco-heritage-list-boosting-tourism-hopes?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-26T15:27:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um antigo mosteiro budista no sul da Tailândia foi incluído na lista do Patrimônio Mundial da Unesco, tornando-se o nono local cultural da Tailândia nessa lista e o primeiro na região sudeste do país. A inclusão visa fortalecer a conservação do local e promover cooperação nacional e local.", "titulo_pt": "Mosteiro tailandês no sul é incluído na lista do patrimônio mundial da Unesco", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 74031, "titulo": "Jon Hamm Lost Larry David His Game on Celebrity Who Wants to Be a Millionaire?", "url": "https://consequence.net/2026/07/larry-david-jon-hamm-who-wants-to-be-a-millionaire/", "fonte_id": "consequence_sound", "data_pub": "2026-07-26T15:23:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Larry David competiu com sua filha Cazzie no programa de televisão 'Celebrity Who Wants to Be a Millionaire'. Jon Hamm perdeu o jogo para Larry David nesse episódio.", "titulo_pt": "Jon Hamm perdeu para Larry David em 'Celebrity quem quiere ser um milionário?'", "veiculo": "Consequence of Sound", "pais": "EUA", "classe": "C"}], "cultura__eventos": [], "sociedade": [{"id": 73740, "titulo": "Kathy Hochul lo oficializó: Nueva York sirvió 396 millones de comidas escolares gratuitas y miles de familias ahorraron hasta 3.000 dólares al año", "url": "https://www.clarin.com/estados-unidos/kathy-hochul-oficializo-nueva-york-sirvio-396-millones-comidas-escolares-gratuitas-miles-familias-ahorraron-3000-dolares-ano_0_MCu8fKWg38.html", "fonte_id": "clarin", "data_pub": "2026-07-26T17:39:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "A governadora Kathy Hochul anunciou que Nova York serviu 396 milhões de refeições escolares gratuitas e economizou famílias cerca de 450 milhões de dólares mensais. Cerca de 2,7 milhões de alunos receberam desayuno e almuerzo em 2.500 escolas do estado.", "titulo_pt": "Kathy Hochul oficializou: nova York serviu 396 milhões de refeições escolares gratuitas e economizou famílias até 3.000 dólares ao ano", "veiculo": "Clarín", "pais": "Argentina", "classe": "C"}, {"id": 73611, "titulo": "Desabamento em obra que matou trabalhador é investigado como homicídio", "url": "https://www.metropoles.com/sao-paulo/desabamento-obra-soldador-homicidio", "fonte_id": "metropoles", "data_pub": "2026-07-26T17:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um desabamento em uma obra de condomínio de luxo no Morumbi foi registrado como um caso de homicídio culposo e lesão corporal culposa. A investigação está sendo conduzida para esclarecer as circunstâncias do acidente que resultou na morte de um trabalhador.", "titulo_pt": "Desabamento em obra de condomínio de luxo no morumbi é investigado como homicídio", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 73844, "titulo": "Carmona acusa que el gobierno “no estuvo a la altura” ante el sistema frontal y pide fortalecer el rol de los municipios", "url": "https://www.latercera.com/politica/noticia/carmona-acusa-que-el-gobierno-no-estuvo-a-la-altura-ante-el-sistema-frontal-y-pide-fortalecer-el-rol-de-los-municipios/", "fonte_id": "la_tercera", "data_pub": "2026-07-26T17:15:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O presidente do Partido Comunista acusa o governo de não ter respondido adequadamente à passagem do sistema frontal. Ele também critica o projeto de Reconstrução Nacional, considerando-o uma 'outra catástrofe' política.", "titulo_pt": "Carmona acusa governo e critica projeto de reconstrução nacional", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 73620, "titulo": "Bebê morto: mãe apertou pescoço e cobriu rosto para conter choro", "url": "https://www.metropoles.com/distrito-federal/na-mira/bebe-morto-mae-apertou-pescoco-jogou-pano-no-rosto-para-conter-choro", "fonte_id": "metropoles", "data_pub": "2026-07-26T16:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Um bebê morreu após ser sufocado pelos pais no município de Duque de Caxias, no estado do Rio de Janeiro. De acordo com a polícia, os responsáveis não desejavam ter o filho.", "titulo_pt": "Bebê morto: pais apertaram pescoço e cobriram rosto para conter choro", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 73678, "titulo": "Último suspeito de balear tenente do Exército em assalto é preso em SP", "url": "https://www.cnnbrasil.com.br/nacional/sudeste/sp/ultimo-suspeito-de-balear-tenente-do-exercito-em-assalto-e-preso-em-sp/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-26T16:02:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O último suspeito envolvido no assalto que resultou na tentativa de homicídio de um tenente do Exército em outubro de 2025 foi preso em São Paulo. O homem era procurado pela Justiça por roubos a farmácias e outras infrações relacionadas ao caso.", "titulo_pt": "Último suspeito envolvido no assalto que resultou na tentativa de homicídio de tenente do Exército é preso em SP", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 73857, "titulo": "Fiscalía investiga dos ataques a balazos que dejaron cuatro heridos en sector costero de Arica", "url": "https://www.latercera.com/nacional/noticia/fiscalia-investiga-dos-ataques-a-balazos-que-dejaron-cuatro-heridos-en-sector-costero-de-arica/", "fonte_id": "la_tercera", "data_pub": "2026-07-26T15:26:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Dois ataques a balas ocorreram próximo à praia La Lisera, em Arica, deixando quatro pessoas feridas. Uma das vítimas está em situação crítica e o Equipo ECOH está investigando se os dois incidentes estão ligados.", "titulo_pt": "Fiscalia investiga dois ataques a balas que deixaram quatro feridos no litoral de Arica", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 73750, "titulo": "Como Itália foi de modelo de alimentação saudável a explosão de obesidade", "url": "https://www.bbc.com/portuguese/articles/cj9devgpj94o?at_medium=RSS&at_campaign=rss", "fonte_id": "bbc_brasil", "data_pub": "2026-07-26T14:24:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A dieta mediterrânea era considerada um modelo de vida saudável, mas crianças italianas são algumas das que apresentam maior índice de sobrepeso na Europa, conforme relatório da OMS.", "titulo_pt": "Como a Itália passou de modelo alimentar saudável para ter altos índices de obesidade entre as crianças", "veiculo": "BBC Brasil", "pais": "Reino Unido", "classe": "A"}, {"id": 73152, "titulo": "La evidencia genética fue la clave para identificar a un abusador serial que comenzó a atacar en 2010", "url": "https://www.lanacion.com.ar/seguridad/la-evidencia-genetica-fue-la-clave-para-identificar-a-un-abusador-serial-que-comenzo-a-atacar-en-nid26072026/", "fonte_id": "la_nacion_ar", "data_pub": "2026-07-26T10:41:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "O Tribunal Oral Criminal de Quilmes condenou Sebastián Figueroa, um marplatense de 40 anos, a 30 anos de prisão por ser considerado responsável pelo abuso serial que começou em 2010. A evidência genética foi crucial para identificá-lo como o agressor.", "titulo_pt": "Evidências genéticas levaram à condenação de estuprador serial", "veiculo": "La Nación (Argentina)", "pais": "Argentina", "classe": "B"}, {"id": 73236, "titulo": "Luis Cordero: “La trayectoria del gremialismo permite entender mejor el gobierno de Kast que la importación de patrones extranjeros”", "url": "https://www.latercera.com/politica/noticia/luis-cordero-la-trayectoria-del-gremialismo-permite-entender-mejor-el-gobierno-de-kast-que-la-importacion-de-patrones-extranjeros/", "fonte_id": "la_tercera", "data_pub": "2026-07-26T10:30:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Luis Cordero, exministro de Segurança chileno, discorda da comparação entre o governo de Kast e figuras como Trump ou Milei. Ele sugere que as claves para entender o atual governo são locais e não importam de países estrangeiros.", "titulo_pt": "Luis Cordero: 'a trajetória do gremialismo permite entender melhor o governo de Kast que a importação de padrões extranjeros'", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}, {"id": 73049, "titulo": "Inscrições para cursos gratuitos da Faetec EAD terminam neste domingo (26)", "url": "https://www.cnnbrasil.com.br/educacao/inscricoes-para-cursos-gratuitos-da-faetec-ead-terminam-neste-domingo-26/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-26T09:15:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A Fundação de Apoio à Escola Técnica do Rio oferece 15 mil vagas para cursos gratuitos pela internet. As inscrições terminam neste domingo (26).", "titulo_pt": "Inscrições para cursos gratuitos da Faetec EAD terminam neste domingo", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 73523, "titulo": "Man convicted of abetting suicide in wife's death", "url": "https://www.koreaherald.com/article/10820438", "fonte_id": "korea_herald", "data_pub": "2026-07-26T05:10:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um homem de meia-idade na Coreia do Sul foi condenado a uma pena suspensa de 18 meses por auxiliar no suicídio da esposa, que faleceu. O casal havia feito um pacto de morte após sofrerem perdas financeiras em um golpe de phishing voz em agosto de 2025.", "titulo_pt": "Homem condenado por auxiliar no suicídio da esposa", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 73473, "titulo": "Hong Kong expands after-school care but some families say they still lack access", "url": "https://www.scmp.com/news/hong-kong/education/article/3361859/hong-kong-expands-after-school-care-some-families-say-they-still-lack-access?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-26T04:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O esquema de cuidados após as aulas em Hong Kong expandiu-se rapidamente este ano, com alguns operadores dizendo que têm capacidade suficiente para atender à demanda. No entanto, limitações de mão-de-obra em alguns centros impediram que todas as famílias elegíveis acessassem o programa.", "titulo_pt": "Hong Kong amplia serviços de cuidados após as aulas, mas falta acesso para algumas famílias", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 72932, "titulo": "Longevidade muda dinâmica das famílias, e avós assumem mais cuidados e gastos com netos", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/longevidade-muda-dinamica-das-familias-e-avos-assumem-mais-cuidados-e-gastos-com-netos.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-26T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "A longevidade está mudando a dinâmica familiar, com avós assumindo mais responsabilidades e gastos com os netos. Izede Zago, aos 77 anos, cuida do neto Theo, que leva as refeições para o trabalho.", "titulo_pt": "Longevidade altera dinâmica das famílias, com avós assumindo mais cuidados e gastos com netos", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}, {"id": 72934, "titulo": "Conta de lixo enfrenta resistência em municípios, e vereadores derrubam taxa", "url": "https://redir.folha.com.br/redir/online/mercado/rss091/*https://www1.folha.uol.com.br/mercado/2026/07/conta-de-lixo-enfrenta-resistencia-em-municipios-e-vereadores-derrubam-taxa.shtml", "fonte_id": "folha_mercado", "data_pub": "2026-07-26T02:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Municípios brasileiros têm aprovado leis para derrubar a cobrança da taxa do lixo, também conhecida como conta de lixo. Essas medidas enfrentam resistência e já foram adotadas por vereadores em diversos locais.", "titulo_pt": "Leis contra taxa do lixo são aprovadas em municípios", "veiculo": "Folha de S.Paulo - Mercado", "pais": "Brasil", "classe": "A"}], "sociedade__eventos": [], "meio_ambiente": [{"id": 73991, "titulo": "Typhoon Noul weakens as it lashes southern China", "url": "https://www.taipeitimes.com/News/front/archives/2026/07/27/2003861439", "fonte_id": "taipei_times", "data_pub": "2026-07-27T00:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "O furacão Noul enfraqueceu enquanto atingia o sul da China com fortes ventos e chuvas intensas.", "titulo_pt": "Typhoon Noul enfraquece ao castigar sul da China", "veiculo": "Taipei Times", "pais": "Taiwan", "classe": "B"}, {"id": 73896, "titulo": "France fires: 'What burns is not just forests, but a way of inhabiting the land that is no longer possible'", "url": "https://www.lemonde.fr/en/opinion/article/2026/07/26/france-fires-what-burns-is-not-just-forests-but-a-way-of-inhabiting-the-land-that-is-no-longer-possible_6755855_23.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-26T17:19:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Philósofos e políticos franceses argumentam que a preparação para os incêndios florestais atuais não se limita à adaptação técnica, mas pode se tornar um ato democrático. Essa perspectiva sugere que o enfrentamento dos incêndios é mais do que uma questão de segurança, envolvendo também questões sociais e políticas.", "titulo_pt": "Incêndios florestais na França: 'o que arde não são apenas as florestas, mas um modo de habitar a terra que já não é possível'", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 73669, "titulo": "Frio pode aumentar em até 30% o risco de infarto, alerta cardiologista", "url": "https://www.cnnbrasil.com.br/saude/frio-pode-aumentar-em-ate-30-o-risco-de-infarto-alerta-cardiologista/", "fonte_id": "cnn_brasil", "data_pub": "2026-07-26T16:58:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Baixas temperaturas podem aumentar em até 30% o risco de infarto, conforme alerta dado por um cardiologista. As baixas temperaturas causam vasoconstrição e elevam a pressão arterial, levando a eventos cardiovasculares graves, especialmente em pessoas com fatores de risco.", "titulo_pt": "Frio pode aumentar em até 30% o risco de infarto, alerta cardiologista", "veiculo": "CNN Brasil", "pais": "Brasil", "classe": "B"}, {"id": 74065, "titulo": "Incêndios avançam na Espanha e ameaçam Madri", "url": "https://exame.com/mundo/incendios-avancam-na-espanha-e-ameacam-madri/", "fonte_id": "exame", "data_pub": "2026-07-26T15:33:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Chamas já consumiram quase 77 mil hectares na Espanha e obrigaram milhares de pessoas a deixar suas casas. A França enfrenta uma 'tempestade de fogo' perto de Bordeaux.", "titulo_pt": "Incêndios avançam na Espanha e ameaçam Madri; França enfrenta 'tempestade de fogo'", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 73624, "titulo": "Incêndios na França e Espanha obrigam 325 mil pessoas a deixarem suas casas", "url": "https://www.brasildefato.com.br/2026/07/26/incendios-na-franca-e-espanha-obrigam-325-mil-pessoas-a-deixarem-suas-casas/", "fonte_id": "brasil_de_fato", "data_pub": "2026-07-26T15:28:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "Incêndios florestais no sul da França e na Espanha, próximos a regiões turísticas, obrigaram 325 mil pessoas a deixarem suas casas. O fogo se alastrou rapidamente devido ao solo e vegetação secos, além de uma onda de calor intensa.", "titulo_pt": "Incêndios na França e Espanha forçam 325 mil pessoas a deixarem suas casas", "veiculo": "Brasil de Fato", "pais": "Brasil", "classe": "B"}, {"id": 73934, "titulo": "More than 360,000 evacuated as wildfires rage in France and Spain", "url": "https://www.aljazeera.com/news/2026/7/26/more-than-360000-evacuated-as-wildfires-rage-in-france-and-spain?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-26T14:49:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Mais de 360 mil pessoas foram evacuadas devido às chamas que estão avançando na França e Espanha. As autoridades francesas e espanholas estão lutando para controlar os incêndios, que em parte são causados por ondas sucessivas de calor.", "titulo_pt": "Mais de 360 mil evacuados com incêndios florestais queimando França e Espanha", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 74014, "titulo": "Wildfires in France drive 250,000 people from their homes and creep toward wine city of Bordeaux", "url": "https://www.koreaherald.com/article/10820623", "fonte_id": "korea_herald", "data_pub": "2026-07-26T12:42:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um incêndio florestal no sul da França forçou a evacuação de 55.000 pessoas durante a noite, elevando o número total de deslocados em uma única região para 220.000. As chamas se aproximam da cidade vitivinícola de Bordéus. Em Espanha, também houve evacuações por causa do fogo na costa leste.", "titulo_pt": "Incêndios no sul da França desalojam 250 mil pessoas e ameaçam região vinícola de Bordeaux", "veiculo": "The Korea Herald", "pais": "Coreia do Sul", "classe": "B"}, {"id": 73952, "titulo": "‘Violent’ wildfires rage close to French and Spanish cities", "url": "https://www.ft.com/content/e5bf56e2-9ad1-4778-a25b-9fbe7a3f9eb8?syn-25a6b1a6=1", "fonte_id": "financial_times", "data_pub": "2026-07-26T11:41:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Aproximadamente 335 mil pessoas foram evacuadas devido a piores incêndios florestais. Os focos de fogo estão próximos às cidades francesas e espanholas.", "titulo_pt": "Incêndios violentos atingem áreas próximas a cidades francesas e espanholas", "veiculo": "Financial Times", "pais": "Reino Unido", "classe": "A"}, {"id": 73313, "titulo": "Thousands of firefighters are battling the monster blaze near Bordeaux. Their commanders are dealing with a huge coordination challenge", "url": "https://www.lemonde.fr/en/environment/article/2026/07/26/thousands-of-firefighters-are-battling-the-monster-blaze-near-bordeaux-from-all-sides-their-commanders-deal-with-a-huge-coordination-challenge_6755850_114.html", "fonte_id": "le_monde_en", "data_pub": "2026-07-26T11:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Milhares de bombeiros, principalmente voluntários, estão lutando contra um grande incêndio perto de Bordeaux. Eles trabalham em condições árduas sem muita chance de descanso.", "titulo_pt": "Milhares de bombeiros combatem fogo gigante perto de Bordeaux", "veiculo": "Le Monde (inglês)", "pais": "França", "classe": "A"}, {"id": 72991, "titulo": "Clima: domingo tem ar frio no Sul e Sudeste e seca em partes do país", "url": "https://www.metropoles.com/brasil/clima-domingo-tem-ar-frio-no-sul-e-sudeste-e-seca-em-partes-do-pais", "fonte_id": "metropoles", "data_pub": "2026-07-26T10:40:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O domingo apresenta ar frio no Sul e Sudeste do Brasil, além de seca em algumas regiões. A semana inicia com temperaturas mais baixas e variação de nuvens.", "titulo_pt": "Clima: domingo tem ar frio no Sul e Sudeste e seca em partes do país", "veiculo": "Metrópoles", "pais": "Brasil", "classe": "B"}, {"id": 73384, "titulo": "Photos: Wildfires in France drive 250,000 people from their homes", "url": "https://www.aljazeera.com/gallery/2026/7/26/photos-wildfires-in-france-drive-250000-people-from-their-homes?traffic_source=rss", "fonte_id": "al_jazeera", "data_pub": "2026-07-26T10:08:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Fogos florestais na França obrigaram mais de 250 mil pessoas a deixarem suas casas. Na cidade de Bordeaux, 55 mil pessoas foram evacuadas durante a noite.", "titulo_pt": "Imagens: incêndios em França fazem 250 mil pessoas deixarem as casas", "veiculo": "Al Jazeera English", "pais": "Catar", "classe": "B"}, {"id": 73457, "titulo": "‘Super’ El Nino: Africa facing mass migration, US$20 billion in damages", "url": "https://www.scmp.com/news/world/africa/article/3361891/super-el-nino-africa-facing-mass-migration-us20-billion-damages?utm_source=rss_feed", "fonte_id": "scmp", "data_pub": "2026-07-26T09:02:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Um 'super' El Niño está previsto para causar danos combinados entre US$10 bilhões e US$20 bilhões em países afetados da África, possivelmente levando a uma massiva migração de áreas duramente impactadas. Meteorologistas alertam que o padrão climático El Niño, frequentemente associado a severos secos, inundações e tempestades na África, pode se tornar um dos mais intensos já observados se as tendências de aquecimento do Oceano Pacífico continuarem.", "titulo_pt": "Super El niño: áfrica enfrentará grandes danos e possível onda de migração", "veiculo": "South China Morning Post", "pais": "Hong Kong", "classe": "B"}, {"id": 73065, "titulo": "Desmatamento cai na Amazônia e 588 áreas protegidas ficam intactas no semestre", "url": "https://exame.com/esg/desmatamento-cai-na-amazonia-e-588-areas-protegidas-ficam-intactas-no-semestre/", "fonte_id": "exame", "data_pub": "2026-07-26T08:00:00Z", "idioma": "pt", "provavel_duplicata_de": null, "texto_pt": "O desmatamento na Amazônia diminuiu, com 588 áreas protegidas mantendo sua integridade entre janeiro e junho. Apenas uma terra indígena e sete unidades de conservação perderam mais de 1 km² de floresta no período.", "titulo_pt": "Desmatamento diminui na Amazônia e 588 áreas protegidas permanecem intactas", "veiculo": "Exame", "pais": "Brasil", "classe": "B"}, {"id": 73436, "titulo": "Strong winds and rain lash China after Typhoon Noul makes landfall", "url": "https://www.japantimes.co.jp/news/2026/07/26/asia-pacific/china-typhoon-noul/", "fonte_id": "japan_times", "data_pub": "2026-07-26T06:47:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "Forças meteorológicas severas atingiram China após o Furacão Noul tocar terra. Autoridades evacuaram mais de 340 mil pessoas e suspenderam serviços de trabalho e ferrovia.", "titulo_pt": "Fortes ventos e chuva castigam China após furacão Noul fazer landfall", "veiculo": "The Japan Times", "pais": "Japão", "classe": "A"}, {"id": 73350, "titulo": "Chickenpox sweeps Gaza camps as thousands of cases emerge in two weeks", "url": "http://www.euronews.com/2026/07/26/chickenpox-sweeps-gaza-camps-as-thousands-of-cases-emerge-in-two-weeks", "fonte_id": "euronews", "data_pub": "2026-07-26T05:00:00Z", "idioma": "en", "provavel_duplicata_de": null, "texto_pt": "A varicela tem se propagado nas tendas do Gaza, com milhares de casos surgindo em duas semanas. Os médicos acreditam que o tamanho real da epidemia é maior, devido ao overcrowding e à falta de isolamento adequado, além do fato de muitos crianças nascidas durante o conflito não terem completado suas vacinas.", "titulo_pt": "Varicela atinge campos de Gaza com milhares de casos em duas semanas", "veiculo": "Euronews", "pais": "Europa", "classe": "B"}, {"id": 73246, "titulo": "Más de 340.000 personas evacuadas y decenas de vuelos cancelados tras la llegada del tifón Noul a China", "url": "https://www.latercera.com/mundo/noticia/mas-de-340000-personas-evacuadas-y-decenas-de-vuelos-cancelados-tras-la-llegada-del-tifon-noul-a-china/", "fonte_id": "la_tercera", "data_pub": "2026-07-26T04:58:00Z", "idioma": "es", "provavel_duplicata_de": null, "texto_pt": "Mais de 340.000 pessoas foram evacuadas e vários voos cancelados após o tifão Noul chegar à China. As autoridades locais declararam estado de alerta máximo e suspenderam as aulas, o trabalho, as atividades comerciais e o transporte público na província de Guangdong.", "titulo_pt": "Mais de 340.000 pessoas evacuadas e decenas de voos cancelados após chegada do tifão Noul à China", "veiculo": "La Tercera", "pais": "Chile", "classe": "B"}], "meio_ambiente__eventos": [], "direitos_humanos": [{"id": 73990, "titulo": "Berlin Pride attack believed to be act of Islamic terror", "url": "https://www.taipeitimes.com/News/front/archives/2026/07/27/2003861438", "fonte_id": "taipei_times", "data_pub": "2026-07-27T00:00:00Z", "idioma": "en", " const esc = t => (t ?? "").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let drillCounter = 0;

function renderSecao(topico) {
  const rot = esc(D.rotulos_topico[topico] || topico);
  const sint = D.sinteses[topico];
  const arts = D.resumo_do_dia[topico] || [];
  const eventos = D.resumo_do_dia[topico + "__eventos"] || [];

  const textoSint = sint
    ? sint.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join("")
    : `<span class="sem-sintese">Sumário narrativo não disponível — execute o pipeline para gerar.</span>`;

  const drillId = "drill-" + (++drillCounter);
  const eventosHtml = eventos.length
    ? `<div class="eventos">
        ${eventos.map(ev => {
          const evId = "drill-" + (++drillCounter);
          return `<div class="evento">
            <h3>${esc(ev.titulo)}</h3>
            ${ev.sumario ? `<div class="sumario"><p>${esc(ev.sumario)}</p></div>` : ""}
            <button class="drill-toggle" onclick="toggleDrill('${evId}')">▶ ${ev.artigos.length} fontes sobre este evento</button>
            <div class="drill-lista" id="${evId}">
              ${ev.artigos.map(n => {
                const tit = n.titulo_pt || n.titulo;
                const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
                return `<div class="item" data-flag-url="${esc(n.url)}">
                  <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
                  <div class="meta">
                    <span class="tag">${esc(n.veiculo)}</span>
                    ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
                  </div>
                  <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
                  ${flagBtn(n.url, tit)}
                </div>`;
              }).join("")}
            </div>
          </div>`;
        }).join("")}
      </div>`
    : "";
  const drillHtml = arts.length
    ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${arts.length} artigo${arts.length > 1 ? "s" : ""} desta edição</button>
       <div class="drill-lista" id="${drillId}">
         ${arts.map(n => {
           const tit = n.titulo_pt || n.titulo;
           const lang = (!n.titulo_pt && n.idioma && n.idioma !== 'pt') ? ` <span class="idioma-badge">${esc(n.idioma.toUpperCase())}</span>` : '';
           return `<div class="item" data-flag-url="${esc(n.url)}">
             <h3><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h3>
             <div class="meta">
               <span class="tag">${esc(n.veiculo)}</span>
               ${n.pais ? `<span class="tag">${esc(n.pais)}</span>` : ""}
             </div>
             <div class="corpo"><p>${esc(n.texto_pt)}</p></div>
             ${flagBtn(n.url, tit)}
           </div>`;
         }).join("")}
       </div>`
    : "";

  return `<h2>${rot}</h2>
    <div class="sumario">${textoSint}</div>
    ${sint ? ttsBarHtml(topico) : ""}
    ${eventosHtml}
    ${drillHtml}`;
}

function toggleDrill(id) {
  const el = document.getElementById(id);
  const btn = el.previousElementSibling;
  const aberta = el.classList.toggle("aberta");
  btn.textContent = (aberta ? "▼ " : "▶ ") + btn.textContent.slice(2);
}

function ttsBarHtml(audioKey) {
  const audio = D.audio && D.audio.sumarios && D.audio.sumarios[audioKey];
  if (!audio || !audio.arquivo) return "";
  const src = audio.arquivo + (audio.versao ? "?v=" + encodeURIComponent(audio.versao) : "");
  return `<div class="tts-bar" role="group" aria-label="Leitura em voz alta" data-audio-src="${esc(src)}" data-audio-key="${esc(audioKey)}">
    <button class="tts-btn tts-ouvir" onclick="ttsOuvir(this)">&#9654; Ouvir sum&#225;rio</button>
    <button class="tts-btn tts-pausar" onclick="ttsPausar(this)" hidden>&#9646;&#9646; Pausar</button>
    <button class="tts-btn tts-continuar" onclick="ttsContinuar(this)" hidden>&#9654; Continuar</button>
    <button class="tts-btn tts-parar" onclick="ttsPar(this)" hidden>&#9632; Parar</button>
  </div>`;
}

function renderPodcast() {
  const p = D.podcast;
  if (!p || !p.arquivo) return "";
  const src = p.arquivo + (p.versao ? "?v=" + encodeURIComponent(p.versao) : "");
  return `<div class="podcast-card">
    <div class="podcast-hd">Ou&ccedil;a Agora</div>
    <div class="pod-player">
      <button class="pod-btn" onclick="podToggle(this)" aria-label="Tocar">&#9654;</button>
      <span class="pod-cur">0:00</span>
      <div class="pod-track" onclick="podSeek(event, this)"><div class="pod-fill"></div></div>
      <span class="pod-dur">0:00</span>
      <audio class="pod-audio" preload="metadata" src="${esc(src)}"
        onloadedmetadata="podMeta(this)" ontimeupdate="podTick(this)" onended="podEnd(this)"></audio>
    </div>
  </div>`;
}

function _podFmt(s) {
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function podToggle(btn) {
  const a = btn.parentElement.querySelector(".pod-audio");
  if (a.paused) { a.play(); btn.innerHTML = "&#10073;&#10073;"; btn.setAttribute("aria-label", "Pausar"); }
  else { a.pause(); btn.innerHTML = "&#9654;"; btn.setAttribute("aria-label", "Tocar"); }
}
function podMeta(a) {
  a.closest(".pod-player").querySelector(".pod-dur").textContent = _podFmt(a.duration);
}
function podTick(a) {
  const p = a.closest(".pod-player");
  p.querySelector(".pod-cur").textContent = _podFmt(a.currentTime);
  p.querySelector(".pod-fill").style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + "%";
}
function podEnd(a) {
  const b = a.closest(".pod-player").querySelector(".pod-btn");
  b.innerHTML = "&#9654;"; b.setAttribute("aria-label", "Tocar");
}
function podSeek(e, track) {
  const a = track.parentElement.querySelector(".pod-audio");
  if (!a.duration) return;
  const r = track.getBoundingClientRect();
  a.currentTime = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * a.duration;
}

    return `<div class="destaque-art" data-flag-url="${esc(n.url)}">
      <h4><a href="${esc(n.url)}" target="_blank">${esc(tit)}</a>${lang}</h4>

      </div>
      ${n.texto_pt ? `<div class="dcorpo">${esc(n.texto_pt)}</div>` : ""}
      ${flagBtn(n.url, tit)}
    </div>`;
  }).join("");
  return `<div>
    <span class="destaque-label">Destaque</span>
    <h2 style="margin-top:8px">${esc(d.titulo_evento)}</h2>
    <div class="destaque-analise">${paragrafos}</div>

    ${artsHtml ? `<button class="drill-toggle" onclick="toggleDrill('${drillId}')">▶ ${totalArtigos} artigo${totalArtigos > 1 ? "s" : ""} deste destaque</button>

}
